<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unslop Arcade</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #171920;
    --panel-2: #20232c;
    --line: #2c303b;
    --text: #e9eaee;
    --muted: #9095a3;
    --accent: #ffcc4d;
    --radius: 12px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header {
    padding: 28px 24px 16px; max-width: 1280px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .count { color: var(--muted); font-size: 14px; }
  #search {
    margin-left: auto; min-width: 220px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
  }
  .filters { max-width: 1280px; margin: 0 auto; padding: 0 24px 8px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .filter-row b { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; width: 80px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 5px 10px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
    max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); color: #1a1400; border-color: var(--accent); }
  main {
    max-width: 1280px; margin: 0 auto; padding: 12px 24px 48px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; text-align: left; color: inherit; font: inherit; padding: 0;
    display: flex; flex-direction: column; transition: transform .12s, border-color .12s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .cover {
    height: 120px; position: relative; display: grid; place-items: center;
    font-size: 44px; font-weight: 800; letter-spacing: -0.04em; color: rgba(255,255,255,.92);
    text-shadow: 0 2px 12px rgba(0,0,0,.35);
  }
  .cover::after {
    content: "▶ Play"; position: absolute; right: 10px; bottom: 10px; font-size: 12px; font-weight: 600;
    letter-spacing: 0; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 6px;
  }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .title { font-weight: 650; font-size: 16px; }
  .tags { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); }
  .tags .theme { color: var(--text); }
  .stats { font-size: 11.5px; color: var(--muted); opacity: .8; }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 64px 0; }

  #player {
    position: fixed; inset: 0; background: rgba(5,6,8,.92); display: none;
    flex-direction: column; z-index: 10;
  }
  #player.open { display: flex; }
  .bar {
    display: flex; gap: 12px; align-items: center; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .bar .meta { min-width: 0; flex: 1; }
  .bar .meta div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .meta .sub { font-size: 12.5px; color: var(--muted); }
  .bar button {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 7px 12px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .bar button:hover { border-color: var(--muted); }
  #frame { flex: 1; width: 100%; border: 0; background: #000; }
  @media (max-width: 600px) {
    header, .filters, main { padding-left: 16px; padding-right: 16px; }
    #search { margin-left: 0; width: 100%; }
    .filter-row b { width: 100%; }
    .bar .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Unslop <span>Arcade</span></h1>
  <div class="count" id="count"></div>
  <input id="search" type="search" placeholder="Search games…" aria-label="Search games">
</header>
<div class="filters">
  <div class="filter-row" id="words"><b>Word</b></div>
  <div class="filter-row" id="machines" hidden><b>Machine</b></div>
</div>
<main id="grid"></main>

<div id="player" role="dialog" aria-modal="true" aria-labelledby="p-title">
  <div class="bar">
    <div class="meta"><div id="p-title"></div><div class="sub" id="p-sub"></div></div>
    <button id="p-restart" title="Reload the game">↻ Restart</button>
    <button id="p-full" class="hide-sm">⛶ Fullscreen</button>
    <button id="p-tab" class="hide-sm">Open in tab</button>
    <button id="p-close">✕ Close</button>
  </div>
  <iframe id="frame" title="Game" sandbox="allow-scripts allow-pointer-lock" allow="fullscreen; autoplay"></iframe>
</div>

<script>
const GAMES = /*__GAMES__*/[];

const $ = (id) => document.getElementById(id);
const state = { words: new Set(), machine: null, q: "" };

function hue(text) {
  let h = 0;
  for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h % 360;
}
function initials(text) {
  return text.replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean)
    .slice(0, 2).map((w) => w[0].toUpperCase()).join("");
}
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

// Selecting two words shows the game made from exactly that pair.
function wordChips(values) {
  const row = $("words");
  for (const value of values) {
    const chip = el("button", { className: "chip", textContent: value });
    chip.setAttribute("aria-pressed", "false");
    chip.onclick = () => {
      state.words.has(value) ? state.words.delete(value) : state.words.add(value);
      chip.setAttribute("aria-pressed", state.words.has(value));
      render();
    };
    row.append(chip);
  }
}

function machineChips(values) {
  const row = $("machines");
  row.hidden = values.length < 2;
  for (const value of values) {
    const chip = el("button", { className: "chip", textContent: value });
    chip.setAttribute("aria-pressed", "false");
    chip.onclick = () => {
      state.machine = state.machine === value ? null : value;
      for (const c of row.querySelectorAll(".chip")) c.setAttribute("aria-pressed", c.textContent === state.machine);
      render();
    };
    row.append(chip);
  }
}

function render() {
  const q = state.q.toLowerCase();
  const shown = GAMES.filter((g) =>
    [...state.words].every((w) => g.words.includes(w)) &&
    (!state.machine || g.machine === state.machine) &&
    (!q || [g.title, g.prompt].join(" ").toLowerCase().includes(q)));
  $("count").textContent = `${shown.length} of ${GAMES.length} games`;
  const grid = $("grid");
  grid.replaceChildren();
  if (!shown.length) {
    grid.append(el("div", { className: "empty", textContent:
      GAMES.length ? "No games match these filters." : "No games yet. Run: uv run factory.py generate" }));
    return;
  }
  for (const g of shown) {
    const h = hue(g.words[0]), h2 = hue(g.words.slice(1).join());
    const cover = el("div", { className: "cover", textContent: initials(g.title) });
    cover.style.background = `linear-gradient(135deg, hsl(${h} 65% 38%), hsl(${h2} 70% 22%))`;
    const stats = [g.machine, g.seconds && `${Math.round(g.seconds / 60)} min`,
      g.completion_tokens && `${g.completion_tokens.toLocaleString()} tokens`,
      g.thinking && `thinking: ${g.thinking === true ? "on" : g.thinking}`].filter(Boolean).join(" · ");
    const card = el("button", { className: "card" },
      cover,
      el("div", { className: "body" },
        el("div", { className: "title", textContent: g.title }),
        el("div", { className: "tags" },
          el("div", { className: "theme", textContent: `“${g.prompt}”` })),
        el("div", { className: "stats", textContent: stats })));
    card.onclick = () => play(g);
    grid.append(card);
  }
}

let current = null;
// Pair ids repeat across machines, so a link names both: #<machine>/<id>.
const key = (g) => `${g.machine}/${g.id}`;
// Keeps a link to the open game in the URL; not possible on data: or sandboxed pages.
function setHash(hash) {
  try { history.replaceState(null, "", hash || location.pathname); } catch {}
}
function play(g) {
  current = g;
  $("p-title").textContent = g.title;
  $("p-sub").textContent = `“${g.prompt}”`;
  $("frame").srcdoc = g.html;
  $("player").classList.add("open");
  document.body.style.overflow = "hidden";
  setHash("#" + encodeURI(key(g)));
  $("frame").addEventListener("load", () => $("frame").focus(), { once: true });
}
function close() {
  current = null;
  $("frame").srcdoc = "";
  $("player").classList.remove("open");
  document.body.style.overflow = "";
  setHash("");
}
$("p-close").onclick = close;
$("p-restart").onclick = () => current && play(current);
$("p-full").onclick = () => $("frame").requestFullscreen?.();
$("p-tab").onclick = () => {
  if (!current) return;
  window.open(URL.createObjectURL(new Blob([current.html], { type: "text/html" })), "_blank");
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("player").classList.contains("open")) close();
});
$("search").oninput = (e) => { state.q = e.target.value; render(); };

wordChips([...new Set(GAMES.flatMap((g) => g.words))].sort());
machineChips([...new Set(GAMES.map((g) => g.machine).filter(Boolean))].sort());
render();
const wanted = decodeURI(location.hash.slice(1));
// Older links had only #<id>; those open the first machine's game for that pair.
const linked = wanted && (GAMES.find((g) => key(g) === wanted) || GAMES.find((g) => g.id === wanted));
if (linked) play(linked);
</script>
</body>
</html>
