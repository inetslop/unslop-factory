<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FROGMAN — Pac-Frog Road Crossing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0d26}
body{font-family:"Courier New",ui-monospace,monospace;color:#c9d4ff;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;display:block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
 radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(3,5,16,.6));
 animation:scan 7s linear infinite}
@keyframes scan{to{background-position:0 6px,0 0}}

.chip{position:fixed;top:10px;right:12px;z-index:40;font:700 11px/1 "Courier New",monospace;letter-spacing:1px;
 padding:8px 10px;background:rgba(16,22,54,.9);border:2px solid #39458c;color:#ffd23f;cursor:pointer;transition:.15s}
.chip:hover{border-color:#ffd23f;transform:translateY(-1px)}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,8,24,.72);padding:16px}
.ov[hidden]{display:none}
.panel{width:min(92vw,540px);max-height:94vh;overflow:auto;background:#10163a;border:3px solid #35418c;text-align:center;
 box-shadow:0 0 0 3px #070a1e,0 24px 60px rgba(0,0,0,.55),inset 0 0 44px rgba(30,45,120,.25);
 padding:30px 30px 26px;animation:pop .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:translateY(18px) scale(.96);opacity:0}}

.title{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(46px,10vw,82px);letter-spacing:4px;line-height:1;margin-bottom:8px}
.title span{display:inline-block;text-shadow:3px 3px 0 #05070f}
.title span:nth-child(odd){transform:rotate(-4deg) translateY(-2px)}
.title span:nth-child(even){transform:rotate(3deg) translateY(2px)}
.title span:nth-child(4n+1){color:#ffd23f}
.title span:nth-child(4n+2){color:#ff5d73}
.title span:nth-child(4n+3){color:#3ee6c1}
.title span:nth-child(4n+4){color:#7aa5ff}

.tag{font-size:12px;letter-spacing:3px;color:#8fa0d8}
.dots{height:8px;margin:15px auto 17px;width:78%;opacity:.85;background-position:center;
 background-image:radial-gradient(circle,#ffd23f 2.5px,transparent 3.5px);background-size:16px 8px;animation:dotslide .9s linear infinite}
@keyframes dotslide{to{background-position:16px center}}

.ctrls{display:grid;grid-template-columns:auto auto;gap:7px 16px;justify-content:center;font-size:13px;margin-bottom:20px;text-align:left}
.ctrls b{font-weight:700;color:#c9d4ff;display:flex;gap:5px;justify-content:flex-end}
kbd{background:#1b2350;border:1px solid #3a4796;border-bottom-width:3px;padding:2px 7px;font:700 11px "Courier New",monospace;color:#e8eeff;white-space:nowrap}

.btn{font-family:Impact,"Arial Black",sans-serif;font-size:20px;letter-spacing:2px;border:none;cursor:pointer;padding:13px 30px;margin:4px;transition:transform .08s,box-shadow .08s}
.primary{background:#ffd23f;color:#231a04;box-shadow:0 6px 0 #b9860b,0 12px 20px rgba(0,0,0,.4)}
.primary:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b9860b,0 16px 24px rgba(0,0,0,.45)}
.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #b9860b}
.ghosty{background:transparent;color:#dbe6ff;border:3px solid #7aa5ff;box-shadow:0 5px 0 rgba(70,100,200,.45)}
.ghosty:hover{transform:translateY(-2px);border-color:#a9c4ff}
.ghosty:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(70,100,200,.45)}

.bestline{margin-top:16px;font-size:13px;letter-spacing:2px;color:#8fa0d8}
.bestline b{color:#ffd23f;font-size:15px}
.tip{margin-top:10px;font-size:12px;color:#7f8fc4}
.tip .pw{color:#ffdd57;font-size:16px;display:inline-block;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}

h2.big{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(34px,7vw,54px);letter-spacing:3px;margin-bottom:8px;text-shadow:3px 3px 0 #05070f}
#endTitle.good{color:#3ee6c1}
#endTitle.bad{color:#ff5d73}
.endmsg{font-size:13px;color:#9fb0e8;margin-bottom:14px;letter-spacing:1px}
.stat{display:flex;justify-content:space-between;width:min(280px,80%);margin:6px auto;font-size:14px;letter-spacing:2px}
.stat b{color:#ffd23f;font-size:16px}
#newBest{display:none;color:#3ee6c1;font-weight:700;letter-spacing:2px;margin-top:8px;animation:pulse 1s infinite}
.btnrow{margin-top:18px}

#dpad{position:fixed;right:14px;bottom:14px;z-index:35;display:none;grid-template-columns:repeat(3,54px);grid-auto-rows:54px;gap:6px}
#dpad.show{display:grid}
#dpad b{background:rgba(18,24,58,.85);border:2px solid #3a4796;color:#ffd23f;font-size:18px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
#dpad b:active{background:#ffd23f;color:#10163a}
#dpad [data-d="up"]{grid-column:2;grid-row:1}
#dpad [data-d="left"]{grid-column:1;grid-row:2}
#dpad [data-d="down"]{grid-column:2;grid-row:3}
#dpad [data-d="right"]{grid-column:3;grid-row:2}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="fx"></div>
<button id="mute" class="chip">SND ON</button>

<div id="dpad"><b data-d="up">▲</b><b data-d="left">◀</b><b data-d="down">▼</b><b data-d="right">▶</b></div>

<div class="ov" id="menu">
  <div class="panel">
    <h1 class="title"><span>F</span><span>R</span><span>O</span><span>G</span><span>M</span><span>A</span><span>N</span></h1>
    <p class="tag">PAC × FROG — EAT THE ROAD · BEAT THE CLOCK</p>
    <div class="dots"></div>
    <div class="ctrls">
      <b><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></b><span>or <kbd>WASD</kbd> — hop</span>
      <b><kbd>P</kbd></b><span>pause</span>
      <b><kbd>M</kbd></b><span>sound on / off</span>
      <b><kbd>R</kbd></b><span>restart run</span>
    </div>
    <button id="start" class="btn primary">START RUN</button>
    <p class="bestline">BEST&nbsp;&nbsp;<b id="menuBest">0</b></p>
    <p class="tip">Grab a <span class="pw">●</span> big dot and the whole road becomes edible.</p>
  </div>
</div>

<div class="ov" id="pause" hidden>
  <div class="panel">
    <h2 class="big" style="color:#ffd23f">PAUSED</h2>
    <p class="endmsg">The traffic waits for no frog.</p>
    <div class="btnrow">
      <button id="pResume" class="btn primary">RESUME</button><br>
      <button id="pRestart" class="btn ghosty">RESTART</button>
      <button id="pMenu" class="btn ghosty">MENU</button>
    </div>
  </div>
</div>

<div class="ov" id="end" hidden>
  <div class="panel">
    <h2 class="big" id="endTitle">GAME OVER</h2>
    <p class="endmsg" id="endMsg"></p>
    <div class="stat"><span>SCORE</span><b id="endScore">0</b></div>
    <div class="stat"><span>BEST</span><b id="endBest">0</b></div>
    <p id="newBest">★ NEW BEST ★</p>
    <div class="btnrow">
      <button id="eAgain" class="btn primary">PLAY AGAIN</button><br>
      <button id="eMenu" class="btn ghosty">MENU</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var qs=function(s){return document.querySelector(s);};
var cv=qs('#cv'), ctx=cv.getContext('2d');
var menuOv=qs('#menu'), pauseOv=qs('#pause'), endOv=qs('#end');
var chipEl=qs('#mute'), dpadEl=qs('#dpad');
var endTitle=qs('#endTitle'), endMsg=qs('#endMsg'), endScore=qs('#endScore'), endBest=qs('#endBest'), newBestEl=qs('#newBest'), menuBest=qs('#menuBest');

/* ---------- constants ---------- */
var COLS=13, ROWS=11, WATER=10, MEDIAN=6, PHASES=5;
var PAD_COLS=[1,4,8,11];
var TIME_BY=[45,42,38,34,30];
var LANE_DEFS=[
 {row:1,dir:-1,sp:1.5,len:1,col:'#ff5d73'},
 {row:2,dir: 1,sp:2.1,len:1,col:'#3ee6c1'},
 {row:3,dir:-1,sp:1.15,len:2,col:'#ff9f43'},
 {row:4,dir: 1,sp:2.6,len:1,col:'#7aa5ff'},
 {row:5,dir:-1,sp:3.0,len:1,col:'#c084fc'},
 {row:7,dir: 1,sp:1.8,len:1,col:'#a3e635'},
 {row:8,dir:-1,sp:2.2,len:2,col:'#4cc9f0'},
 {row:9,dir: 1,sp:2.8,len:1,col:'#ff7ab6'}
];
var GHOST_COLS=['#ff4d5e','#ff8ae0','#3ee6c1','#ffb84d'];
var CONF=['#ffd23f','#ff5d73','#3ee6c1','#7aa5ff','#ff9f43'];

/* ---------- state ---------- */
var W=0,H=0,dpr=1,cell=20,ox=0,oy=0,hudH=60;
var state='menu', score=0, best=0, lives=3, phase=1;
var timeLeft=45, lastTickSec=-1, powerT=0, ghostCombo=0;
var shake=0, flashCol='#fff', flashA=0, banner=null;
var held=[], moveCd=0, deathT=0, clearT=0, invuln=0, tGlobal=0, wakaFlip=false, newBestFlag=false;
var player={x:6,y:WATER,fx:6,fy:WATER,fromX:6,fromY:WATER,hopT:1,rot:-Math.PI/2};
var lanes=[], ghosts=[], pellets=[], P=[], POP=[], FF=[];

/* ---------- audio (WebAudio, starts after first input) ---------- */
var AC=null, master=null, muted=false;
try{muted = localStorage.getItem('frogman-mute')==='1';}catch(e){}
function audio(){
  if(!AC){
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C) return;
    AC=new C(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
  }
  if(AC.state==='suspended') AC.resume();
}
function beep(f,dur,type,vol,slideTo,when){
  if(!AC||muted) return;
  type=type||'square'; vol=(vol===undefined)?0.2:vol; when=when||0;
  var t0=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,freq){
  if(!AC||muted) return;
  var t0=AC.currentTime, n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var s=AC.createBufferSource(); s.buffer=buf;
  var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  var g=AC.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
var sfx={
  waka:function(f){beep(f,0.05,'square',0.14);},
  power:function(){[392,523,659,784].forEach(function(f,i){beep(f,0.09,'triangle',0.2,i*0.06);});},
  ghostEat:function(c){beep(300+c*80,0.28,'square',0.22,900+c*200);noiseBurst(0.08,0.15,3000);},
  carEat:function(){noiseBurst(0.12,0.3,2200);beep(140,0.08,'sawtooth',0.2);},
  die:function(){beep(392,0.55,'sawtooth',0.28,60);noiseBurst(0.5,0.25,900);},
  pad:function(){beep(784,0.1,'sine',0.22);beep(1175,0.18,'sine',0.2,0,0.08);},
  clear:function(){[523,659,784,1046].forEach(function(f,i){beep(f,0.12,'triangle',0.2,i*0.07);});},
  win:function(){[392,523,659,784,1046,1318,1568].forEach(function(f,i){beep(f,0.16,'triangle',0.22,i*0.09);});},
  over:function(){[392,330,262,196].forEach(function(f,i){beep(f,0.22,'sawtooth',0.2,i*0.14);});},
  click:function(){beep(560,0.05,'square',0.12);},
  tick:function(){beep(980,0.05,'square',0.1);}
};

/* ---------- layout ---------- */
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  hudH=Math.max(52,Math.min(72,H*0.1));
  cell=Math.floor(Math.min((W-16)/COLS,(H-hudH-14)/ROWS));
  ox=(W-cell*COLS)/2; oy=hudH+((H-hudH)-cell*ROWS)/2;
}
window.addEventListener('resize',resize);

/* ---------- world build ---------- */
function buildLanes(){
  var scale=1+(phase-1)*0.18;
  lanes=LANE_DEFS.map(function(d){
    var n=Math.max(2,Math.floor((COLS+1)/(d.len+2)));
    var span=COLS+d.len+3, off=Math.random()*span, vs=[];
    for(var i=0;i<n;i++) vs.push({x:((off+i*span/n)%span)-(d.len+1.5)});
    return {row:d.row,dir:d.dir,sp:d.sp*scale,len:d.len,col:d.col,span:span,vs:vs};
  });
}
function buildGhosts(){
  var n=[2,2,3,3,4][phase-1];
  ghosts=[];
  for(var i=0;i<n;i++) ghosts.push({x:1+Math.random()*(COLS-2),dir:Math.random()<0.5?-1:1,
    sp:(1.2+phase*0.25)*(0.9+Math.random()*0.3),col:GHOST_COLS[i%4],ph:Math.random()*7});
}
function buildPellets(){
  pellets=[];
  var rows=[1,2,3,4,5,7,8,9];
  for(var r=0;r<rows.length;r++)for(var c=0;c<COLS;c++) if(Math.random()<0.55) pellets.push({c:c,r:rows[r],t:1,alive:true});
  var placed=0,guard=0;
  while(placed<3&&guard++<200){
    var rr2=rows[(Math.random()*rows.length)|0], cc=(Math.random()*COLS)|0, p=null;
    for(var i=0;i<pellets.length;i++) if(pellets[i].c===cc&&pellets[i].r===rr2) p=pellets[i];
    if(!p){p={c:cc,r:rr2,t:2,alive:true};pellets.push(p);} else p.t=2;
    placed++;
  }
}
function initPhase(){
  buildLanes(); buildGhosts(); buildPellets();
  timeLeft=TIME_BY[phase-1]; powerT=0; ghostCombo=0; lastTickSec=-1;
}
function setPlayerStart(){
  player.x=6;player.y=WATER;player.fx=6;player.fy=WATER;
  player.fromX=6;player.fromY=WATER;player.hopT=1;player.rot=-Math.PI/2;
}

/* ---------- flow ---------- */
function hideAll(){menuOv.hidden=true;pauseOv.hidden=true;endOv.hidden=true;}
function startRun(){
  hideAll(); score=0; lives=3; phase=1; initPhase(); setPlayerStart();
  invuln=1.2; state='playing'; held.length=0;
  banner={txt:'STAGE 1',sub:'CROSS!',t:1.5,max:1.5,col:'#ffd23f'};
  sfx.click(); if(document.activeElement) document.activeElement.blur();
}
function toMenu(){
  state='menu'; hideAll(); menuOv.hidden=false; setPlayerStart();
  menuBest.textContent=best; sfx.click();
}
function togglePause(){
  if(state==='playing'){state='paused';pauseOv.hidden=false;}
  else if(state==='paused') resumeGame();
}
function resumeGame(){if(state!=='paused')return; pauseOv.hidden=true; state='playing'; sfx.click();}
function toggleMute(){
  muted=!muted; chipEl.textContent=muted?'SND OFF':'SND ON';
  try{localStorage.setItem('frogman-mute',muted?'1':'0');}catch(e){}
  if(!muted) sfx.click();
}
function primaryAction(){
  if(state==='menu'||state==='gameover'||state==='victory') startRun();
  else if(state==='paused') resumeGame();
}

/* ---------- gameplay ---------- */
function tryMove(d){
  var dx=d==='left'?-1:d==='right'?1:0, dy=d==='up'?-1:d==='down'?1:0;
  if(dy===-1&&player.y===1){
    if(PAD_COLS.indexOf(player.x)>=0){startPad();return true;}
    return false;
  }
  var nx=player.x+dx, ny=player.y+dy;
  if(nx<0||nx>=COLS||ny<1||ny>WATER) return false;
  player.fromX=player.fx; player.fromY=player.fy;
  player.x=nx; player.y=ny; player.hopT=0;
  player.rot = dx===1?0:dx===-1?Math.PI:dy===-1?-Math.PI/2:Math.PI/2;
  return true;
}
function stepHop(dt){
  if(player.hopT<1){
    player.hopT=Math.min(1,player.hopT+dt/0.09);
    var e=1-(1-player.hopT)*(1-player.hopT);
    player.fx=player.fromX+(player.x-player.fromX)*e;
    player.fy=player.fromY+(player.y-player.fromY)*e;
  }
}
function startPad(){
  var px=player.x, bonus=300+Math.ceil(timeLeft)*10;
  score+=bonus;
  player.fromX=player.fx; player.fromY=player.fy;
  player.y=0; player.hopT=0; player.rot=-Math.PI/2;
  state='stageclear'; clearT=1.9;
  var cx=ox+(px+0.5)*cell, cy=oy+cell*0.5;
  POP.push({x:cx,y:cy,txt:'+'+bonus,life:0.9,max:0.9,col:'#3ee6c1'});
  banner={txt:'STAGE '+phase+' CLEAR',sub:'BONUS +'+bonus,t:1.7,max:1.7,col:'#3ee6c1'};
  sfx.pad(); sfx.clear(); confettiAt(cx,cy,28);
}
function nextStage(){
  if(phase>=PHASES){victory();return;}
  phase++; initPhase(); setPlayerStart(); invuln=1.6; state='playing';
  banner={txt:'STAGE '+phase,sub:phase===5?'FINAL ROAD!':'CROSS!',t:1.4,max:1.4,col:'#ffd23f'};
}
function respawn(){setPlayerStart();invuln=2.2;timeLeft=TIME_BY[phase-1];lastTickSec=-1;state='playing';}
function die(reason){
  if(state!=='playing') return;
  state='dying'; deathT=1.35; lives--; shake=1;
  flashCol='#ff3b4e'; flashA=0.5; sfx.die();
  if(reason==='time') POP.push({x:W/2,y:oy+cell*ROWS*0.4,txt:'TIME UP!',life:1.2,max:1.2,col:'#ff5d73'});
}
function updateBest(){
  newBestFlag=false;
  if(score>best){best=score;newBestFlag=true;try{localStorage.setItem('frogman-best',String(best));}catch(e){}}
}
function fillEnd(title,cls,msg){
  endTitle.textContent=title; endTitle.className='big '+cls; endMsg.textContent=msg;
  endScore.textContent=score; endBest.textContent=best;
  newBestEl.style.display=newBestFlag?'block':'none';
}
function gameover(){state='gameover';updateBest();hideAll();fillEnd('GAME OVER','bad','Wiped out on stage '+phase+'. The road keeps rolling.');endOv.hidden=false;sfx.over();}
function victory(){state='victory';updateBest();hideAll();fillEnd('YOU CROSSED!','good','All five roads devoured — the frog-man reigns supreme.');endOv.hidden=false;sfx.win();}

/* ---------- eating & hazards ---------- */
function eatNearbyPellets(){
  var pc=Math.round(player.fx), pr=Math.round(player.fy);
  for(var i=0;i<pellets.length;i++){
    var p=pellets[i];
    if(!p.alive||p.c!==pc||p.r!==pr) continue;
    p.alive=false;
    var px=ox+(p.c+0.5)*cell, py=oy+(p.r+0.5)*cell;
    if(p.t===2){
      score+=50; powerT=6; ghostCombo=0; sfx.power();
      flashCol='#fff3b0'; flashA=0.3;
      POP.push({x:px,y:py,txt:'POWER!',life:0.8,max:0.8,col:'#ffdd57'});
      spawnBurst(px,py,'#ffdd57',14,160);
    }else{
      score+=10; wakaFlip=!wakaFlip; sfx.waka(wakaFlip?640:470);
      spawnBurst(px,py,'#ffd23f',6,90);
    }
  }
}
function checkHazards(){
  if(invuln>0) return;
  var fx=player.fx, fy=player.fy, i, j, v, L, g, a, b;
  for(i=0;i<lanes.length;i++){
    L=lanes[i];
    if(Math.abs(fy-L.row)>=0.48) continue;
    for(j=0;j<L.vs.length;j++){
      v=L.vs[j]; a=v.x+0.06; b=v.x+L.len-0.06;
      if(fx+0.34>a&&fx-0.34<b){
        if(powerT>0) eatCar(L,j); else {die('car');return;}
      }
    }
  }
  for(i=0;i<ghosts.length;i++){
    g=ghosts[i];
    if(Math.abs(fy-MEDIAN)>=0.48) continue;
    if(Math.abs(fx-g.x)<0.62){
      if(powerT>0) eatGhost(i); else {die('ghost');return;}
    }
  }
}
function eatCar(L,i){
  var v=L.vs[i]; L.vs.splice(i,1); score+=50;
  var x=ox+(v.x+L.len/2)*cell, y=oy+L.row*cell+cell/2;
  POP.push({x:x,y:y,txt:'+50',life:0.7,max:0.7,col:'#3ee6c1'});
  spawnBurst(x,y,L.col,14,180); spawnBurst(x,y,'#9aa4c8',8,120);
  sfx.carEat(); shake=Math.max(shake,0.3);
}
function eatGhost(i){
  var g=ghosts[i]; ghosts.splice(i,1); ghostCombo++;
  var pts=[200,400,800,1600][Math.min(3,ghostCombo-1)]; score+=pts;
  var x=ox+(g.x+0.5)*cell, y=oy+(MEDIAN+0.5)*cell;
  POP.push({x:x,y:y,txt:pts,life:0.8,max:0.8,col:'#ff8ae0'});
  spawnBurst(x,y,g.col,16,200); sfx.ghostEat(ghostCombo);
  flashCol='#d8f4ff'; flashA=0.25; shake=Math.max(shake,0.2);
}

/* ---------- particles ---------- */
function spawnBurst(x,y,col,n,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, s=spd*(0.4+Math.random()*0.8);
    P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:0.5+Math.random()*0.4,max:0.9,size:2+Math.random()*3,col:col,grav:260});
  }
}
function confettiAt(x,y,n){
  for(var i=0;i<n;i++) P.push({x:x,y:y,vx:(Math.random()-0.5)*280,vy:-Math.random()*230-40,
    life:1+Math.random()*0.6,max:1.6,size:3+Math.random()*3,col:CONF[(Math.random()*CONF.length)|0],grav:380});
}
function confettiDrop(){
  P.push({x:ox+Math.random()*cell*COLS,y:oy-10,vx:(Math.random()-0.5)*60,vy:60+Math.random()*80,
    life:2.2,max:2.2,size:3+Math.random()*3,col:CONF[(Math.random()*CONF.length)|0],grav:40});
}

/* ---------- update ---------- */
function updateWorld(dt){
  var i,j,v,L,g;
  for(i=0;i<lanes.length;i++){L=lanes[i];
    for(j=0;j<L.vs.length;j++){v=L.vs[j]; v.x+=L.dir*L.sp*dt;
      if(L.dir>0&&v.x>COLS+0.2) v.x-=L.span;
      if(L.dir<0&&v.x<-(L.len+0.2)) v.x+=L.span;}
  }
  for(i=0;i<ghosts.length;i++){g=ghosts[i];
    var sp=(powerT>0)?g.sp*0.45:g.sp;
    g.x+=g.dir*sp*dt;
    if(g.x<0.4){g.x=0.4;g.dir=1;} else if(g.x>COLS-1.4){g.x=COLS-1.4;g.dir=-1;}
    if(Math.random()<dt*0.25) g.dir*=-1;
  }
}
function updateFX(dt){
  var i;
  for(i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.life-=dt;if(p.life<=0)P.splice(i,1);}
  for(i=POP.length-1;i>=0;i--){var q=POP[i];q.y-=28*dt;q.life-=dt;if(q.life<=0)POP.splice(i,1);}
  shake=Math.max(0,shake-dt*1.6);
  flashA=Math.max(0,flashA-dt*1.2);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  for(i=0;i<FF.length;i++){var f=FF[i];f.y-=dt*0.012*f.s;f.x+=Math.sin(tGlobal*0.5+f.ph)*dt*0.01;if(f.y<-0.03){f.y=1.03;f.x=Math.random();}}
}
function updateState(dt){
  if(state==='playing'){
    moveCd-=dt;
    if(held.length&&moveCd<=0){ if(tryMove(held[held.length-1])) moveCd=0.105; }
    stepHop(dt);
    invuln=Math.max(0,invuln-dt);
    if(powerT>0){powerT-=dt;if(powerT<=0){powerT=0;ghostCombo=0;}}
    timeLeft-=dt;
    var sec=Math.ceil(timeLeft);
    if(sec!==lastTickSec&&sec<=10&&sec>=1){lastTickSec=sec;sfx.tick();}
    if(timeLeft<=0){die('time');return;}
    eatNearbyPellets();
    checkHazards();
  }else if(state==='dying'){
    stepHop(dt); deathT-=dt;
    if(deathT<=0){ if(lives<=0) gameover(); else respawn(); }
  }else if(state==='stageclear'){
    stepHop(dt); clearT-=dt;
    if(clearT<=0) nextStage();
  }else if(state==='victory'){
    if(Math.random()<dt*4) confettiDrop();
  }
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawPacBody(x,y,r,rot,mouth,col){
  if(r<=0.5) return;
  ctx.beginPath(); ctx.moveTo(x,y);
  ctx.arc(x,y,r,rot+mouth,rot-mouth);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  if(r>6){
    for(var s=-1;s<=1;s+=2){
      var a=rot+s*0.95, ex=x+Math.cos(a)*r*0.42, ey=y+Math.sin(a)*r*0.42;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,r*0.20,0,7); ctx.fill();
      ctx.fillStyle='#10131f'; ctx.beginPath();
      ctx.arc(ex+Math.cos(rot)*r*0.09,ey+Math.sin(rot)*r*0.09,r*0.10,0,7); ctx.fill();
    }
  }
}
function drawPad(x,y,R){
  ctx.fillStyle='#2ea85c'; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();
  ctx.fillStyle='#3ecf6e'; ctx.beginPath(); ctx.arc(x,y,R-3,0,7); ctx.fill();
  ctx.fillStyle='#1a4d30'; ctx.beginPath(); ctx.moveTo(x,y);
  ctx.arc(x,y,R-2,-Math.PI/2-0.5,-Math.PI/2+0.5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,R-7,Math.PI*0.15,Math.PI*0.6); ctx.stroke();
}
function drawVehicle(L,v){
  var w=L.len*cell*0.92, h=cell*0.60;
  var x=ox+v.x*cell+(cell-w)/2, y=oy+L.row*cell+(cell-h)/2;
  var fright=powerT>0;
  ctx.fillStyle='rgba(0,0,0,.35)'; rr(x+2,y+h-4,w,5,2); ctx.fill();
  ctx.fillStyle=fright?'#3f57ff':L.col; rr(x,y,w,h,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.16)'; rr(x+w*0.12,y+h*0.18,w*0.76,h*0.34,3); ctx.fill();
  if(L.len>1){ctx.fillStyle='rgba(0,0,0,.18)';rr(x+w*0.68,y+2,w*0.3,h-4,4);ctx.fill();}
  var winY=y+h*0.2, winH=h*0.6;
  ctx.fillStyle='rgba(14,20,51,.85)';
  if(L.dir>0){rr(x+w-w*0.14-3,winY,w*0.14,winH,2);ctx.fill();rr(x+3,winY,w*0.14,winH,2);ctx.fill();}
  else{rr(x+3,winY,w*0.14,winH,2);ctx.fill();rr(x+w-w*0.14-3,winY,w*0.14,winH,2);ctx.fill();}
  var fx=L.dir>0?x+w-3:x+3, tx=L.dir>0?x+3:x+w-3;
  ctx.fillStyle='#fff3b0';
  ctx.beginPath();ctx.arc(fx,y+h*0.26,2.4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(fx,y+h*0.74,2.4,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,90,90,.9)';
  ctx.beginPath();ctx.arc(tx,y+h*0.26,2,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(tx,y+h*0.74,2,0,7);ctx.fill();
  if(fright){
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x+w*0.38,y+h*0.4,h*0.1,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*0.62,y+h*0.4,h*0.1,0,7);ctx.fill();
    ctx.fillStyle='#10131f';
    ctx.beginPath();ctx.arc(x+w*0.38,y+h*0.42,h*0.05,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+w*0.62,y+h*0.42,h*0.05,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.beginPath();
    var mx=x+w*0.42,mw=w*0.16;
    ctx.moveTo(mx,y+h*0.72);
    for(var i=0;i<4;i++) ctx.lineTo(mx+mw*(i+0.5)/4,y+h*(i%2?0.62:0.8));
    ctx.stroke();
  }
}
function drawGhost(g){
  var x=ox+(g.x+0.5)*cell, yTop=oy+MEDIAN*cell+cell*0.16, r=cell*0.32;
  var yB=yTop+r+cell*0.34, fright=powerT>0;
  ctx.fillStyle=fright?'#3f57ff':g.col;
  ctx.beginPath();
  ctx.moveTo(x-r,yTop+r);
  ctx.arc(x,yTop+r,r,Math.PI,0,false);
  ctx.lineTo(x+r,yB);
  for(var i=3;i>=0;i--){
    var cx=x-r+(i+0.5)*r*0.5;
    ctx.arc(cx,yB+Math.sin(tGlobal*12+g.ph+i)*r*0.06,r*0.25,0,Math.PI,false);
  }
  ctx.closePath(); ctx.fill();
  var ey=yTop+r*0.78;
  if(fright){
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-r*0.4,ey,r*0.13,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*0.4,ey,r*0.13,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();
    var mx=x-r*0.5,mw=r;
    ctx.moveTo(mx,ey+r*0.6);
    for(var j=0;j<4;j++) ctx.lineTo(mx+mw*(j+0.5)/4,ey+r*(j%2?0.35:0.75));
    ctx.stroke();
  }else{
    for(var s=-1;s<=1;s+=2){
      var ex=x+s*r*0.4;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*0.3,0,7);ctx.fill();
      ctx.fillStyle='#10131f';
      ctx.beginPath();ctx.arc(ex+g.dir*r*0.14,ey+Math.sin(tGlobal*6+g.ph)*r*0.08,r*0.15,0,7);ctx.fill();
    }
  }
}

/* ---------- board ---------- */
function drawBoard(){
  var bw=cell*COLS, r,y,c;
  for(r=0;r<ROWS;r++){
    y=oy+r*cell;
    if(r===0){
      ctx.fillStyle='#1a4d30'; ctx.fillRect(ox,y,bw,cell);
      for(c=0;c<COLS;c++){
        var h=((c*7919)>>>0)%17/17;
        ctx.fillStyle='rgba(0,0,0,.15)';
        ctx.fillRect(ox+c*cell+h*cell*0.6,y+cell*0.2+h*cell*0.3,3,3);
      }
      for(c=0;c<COLS;c++){
        if(PAD_COLS.indexOf(c)<0&&c!==0&&c!==12&&(c*7)%4<2){
          var fxp=ox+(c+0.5)*cell, fyp=y+cell*0.35;
          ctx.fillStyle='#ff8ae0';ctx.beginPath();ctx.arc(fxp,fyp,2.4,0,7);ctx.fill();
          ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(fxp+4,fyp+4,1.8,0,7);ctx.fill();
        }
      }
      for(var pi=0;pi<PAD_COLS.length;pi++) drawPad(ox+(PAD_COLS[pi]+0.5)*cell,y+cell*0.5,cell*0.40);
    }else if(r===WATER){
      ctx.fillStyle='#0d3f60'; ctx.fillRect(ox,y,bw,cell);
      for(c=2;c<=10;c+=2) drawPad(ox+(c+0.5)*cell,y+cell*0.5,cell*0.28);
      ctx.strokeStyle='rgba(170,225,255,.30)'; ctx.lineWidth=2;
      for(c=0;c<COLS;c++){
        var x0=ox+c*cell+cell*0.16, yy=y+cell*(0.42+0.16*Math.sin(tGlobal*2.4+c*1.9));
        ctx.beginPath();ctx.moveTo(x0,yy);ctx.quadraticCurveTo(x0+cell*0.18,yy-4,x0+cell*0.36,yy);ctx.stroke();
      }
    }else if(r===MEDIAN){
      ctx.fillStyle='#150f36'; ctx.fillRect(ox,y,bw,cell);
      for(var k=0;k<2;k++){
        var fx2=ox+((tGlobal*(30+k*22)+k*bw*0.6)%(bw+160))-80;
        var gr=ctx.createRadialGradient(fx2,y+cell/2,4,fx2,y+cell/2,cell*0.95);
        gr.addColorStop(0,'rgba(124,77,255,.16)');gr.addColorStop(1,'rgba(124,77,255,0)');
        ctx.fillStyle=gr;ctx.fillRect(ox,y,bw,cell);
      }
      ctx.save();ctx.strokeStyle='rgba(150,95,255,.5)';ctx.lineWidth=2;ctx.setLineDash([8,7]);
      ctx.beginPath();ctx.moveTo(ox,y+2);ctx.lineTo(ox+bw,y+2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(ox,y+cell-2);ctx.lineTo(ox+bw,y+cell-2);ctx.stroke();
      ctx.restore();
      ctx.fillStyle='rgba(150,100,255,.3)';
      for(c=1;c<COLS;c+=2){var dmp=ox+(c+0.5)*cell,dmy=y+cell*0.5;
        ctx.save();ctx.translate(dmp,dmy);ctx.rotate(Math.PI/4);ctx.fillRect(-3,-3,6,6);ctx.restore();}
    }else{
      for(c=0;c<COLS;c++){
        ctx.fillStyle=(c+r)%2?'#262c4e':'#232948';
        ctx.fillRect(ox+c*cell,y,cell,cell);
      }
    }
  }
  ctx.save();
  ctx.strokeStyle='rgba(238,215,140,.45)';ctx.lineWidth=2;ctx.setLineDash([cell*0.45,cell*0.35]);
  var divs=[2,3,4,5,8,9];
  for(var d=0;d<divs.length;d++){
    ctx.beginPath();ctx.moveTo(ox,oy+divs[d]*cell);ctx.lineTo(ox+bw,oy+divs[d]*cell);ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.strokeStyle='rgba(238,215,140,.6)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(ox,oy+cell);ctx.lineTo(ox+bw,oy+cell);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,oy+WATER*cell);ctx.lineTo(ox+bw,oy+WATER*cell);ctx.stroke();
  ctx.restore();
  if(powerT>0){
    ctx.fillStyle='rgba(63,87,255,.10)';ctx.fillRect(ox,oy,bw,cell*ROWS);
    ctx.strokeStyle='rgba(120,150,255,.5)';ctx.lineWidth=2;ctx.strokeRect(ox+1,oy+1,bw-2,cell*ROWS-2);
  }
}
function drawPellets(){
  for(var i=0;i<pellets.length;i++){
    var p=pellets[i]; if(!p.alive) continue;
    var x=ox+(p.c+0.5)*cell, y=oy+(p.r+0.5)*cell;
    if(p.t===1){
      ctx.fillStyle='rgba(255,210,63,.22)';ctx.beginPath();ctx.arc(x,y,cell*0.17,0,7);ctx.fill();
      ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(x,y,cell*0.085,0,7);ctx.fill();
    }else{
      var pr=cell*(0.16+0.04*Math.sin(tGlobal*6+p.c));
      ctx.fillStyle='rgba(255,221,87,.25)';ctx.beginPath();ctx.arc(x,y,pr*2,0,7);ctx.fill();
      ctx.fillStyle='#ffdd57';ctx.beginPath();ctx.arc(x,y,pr,0,7);ctx.fill();
    }
  }
}
function drawPlayer(){
  var px,py,r=cell*0.40,rot=player.rot,mouth=0.30+0.22*Math.abs(Math.sin(tGlobal*9));
  if(state==='menu'){
    px=ox+(6.5)*cell; py=oy+(WATER+0.5)*cell+Math.sin(tGlobal*3)*3; rot=-Math.PI/2;
  }else{
    px=ox+(player.fx+0.5)*cell;
    var gy=oy+(player.fy+0.5)*cell;
    py=gy-(player.hopT<1?Math.sin(Math.PI*player.hopT)*cell*0.26:0);
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(px,gy+cell*0.34,r*0.7,r*0.2,0,0,7);ctx.fill();
  }
  if(state==='dying'){
    var k=Math.max(0,deathT/1.35); r*=k; rot=tGlobal*18; mouth=1.1;
    ctx.globalAlpha=Math.min(1,k+0.1);
  }else if(invuln>0&&Math.floor(tGlobal*14)%2===0){
    ctx.globalAlpha=0.35;
  }
  drawPacBody(px,py,r,rot,mouth,'#ffd23f');
  ctx.globalAlpha=1;
  if(state==='playing'&&powerT>0){
    var f=powerT/6;
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(px,py,cell*0.58,-Math.PI/2,-Math.PI/2+Math.PI*2*f);ctx.stroke();
  }
}
function drawParticles(){
  for(var i=0;i<P.length;i++){
    var p=P[i];
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/p.max));
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
}
function drawSkyline(){
  if(oy-hudH<30) return;
  var by=oy-6, x, h;
  for(x=ox;x<ox+cell*COLS;x+=26){
    h=10+(((x*7919)>>>0)%17/17)*22;
    ctx.fillStyle='#111840'; ctx.fillRect(x,by-h,20,h);
    if(h>16){
      ctx.fillStyle='rgba(255,214,102,.55)';
      ctx.fillRect(x+5,by-h+5,3,3);
      ctx.fillRect(x+13,by-h*0.5,3,3);
    }
  }
}
function drawHUD(){
  ctx.fillStyle='#0c1130';ctx.fillRect(0,0,W,hudH);
  ctx.fillStyle='#2b356e';ctx.fillRect(0,hudH-3,W,3);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='700 10px "Courier New",monospace';ctx.fillStyle='#8fa0d8';
  ctx.fillText('SCORE',16,20);
  ctx.font='700 '+Math.min(24,hudH*0.34)+'px "Courier New",monospace';ctx.fillStyle='#ffd23f';
  ctx.fillText(String(score),16,44);
  if(W>700){
    ctx.font='700 11px "Courier New",monospace';ctx.fillStyle='#8fa0d8';
    ctx.fillText('BEST '+best,200,32);
  }
  ctx.textAlign='center';
  ctx.font='900 15px Impact,"Arial Black",sans-serif';ctx.fillStyle='#cfe0ff';
  ctx.fillText('STAGE '+phase+' / '+PHASES,W/2,20);
  var tw=Math.min(300,W*0.34), tx=W/2-tw/2, ty=hudH-18;
  var frac=Math.max(0,Math.min(1,timeLeft/TIME_BY[phase-1]));
  ctx.fillStyle='#1a2250'; rr(tx,ty,tw,9,4); ctx.fill();
  if(frac>0){
    var bc=frac>0.5?'#3ee6c1':frac>0.25?'#ffd23f':'#ff5d73';
    if(timeLeft<=10) ctx.globalAlpha=0.5+0.5*Math.sin(tGlobal*8);
    ctx.fillStyle=bc; rr(tx,ty,tw*frac,9,4); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
  ctx.font='700 12px "Courier New",monospace';
  ctx.fillStyle=frac<0.25?'#ff5d73':'#8fa0d8';
  ctx.fillText(Math.max(0,Math.ceil(timeLeft))+'s',tx+tw+10,ty+9);
  for(var i=0;i<lives;i++) drawPacBody(W-26-i*24,hudH/2,9,-Math.PI/2,0.55,'#ffd23f');
}
function drawBanner(){
  if(!banner) return;
  var a=Math.max(0,Math.min(1,banner.t/0.3,(banner.max-banner.t)/0.2));
  var s=1+Math.max(0,banner.max-banner.t-0.15)*2;
  ctx.globalAlpha=a;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+(44*s)+'px Impact,"Arial Black",sans-serif';
  ctx.fillStyle='#05070f';
  ctx.fillText(banner.txt,W/2+3,oy+cell*ROWS*0.42+3);
  ctx.fillStyle=banner.col;
  ctx.fillText(banner.txt,W/2,oy+cell*ROWS*0.42);
  if(banner.sub){
    ctx.font='700 18px "Courier New",monospace';ctx.fillStyle='#fff';
    ctx.fillText(banner.sub,W/2,oy+cell*ROWS*0.42+38*s);
  }
  ctx.globalAlpha=1;
}
function drawFireflies(){
  for(var i=0;i<FF.length;i++){
    var f=FF[i], px=f.x*W, py=f.y*H;
    var a=0.2+0.35*(0.5+0.5*Math.sin(tGlobal*2+f.ph));
    ctx.fillStyle='rgba(255,224,130,'+(a*0.3)+')';
    ctx.beginPath();ctx.arc(px,py,f.r*3,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,224,130,'+a+')';
    ctx.beginPath();ctx.arc(px,py,f.r,0,7);ctx.fill();
  }
}

/* ---------- render ---------- */
function render(){
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#141b45');sky.addColorStop(0.6,'#0c1030');sky.addColorStop(1,'#070a1e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  drawFireflies();
  drawSkyline();
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake*10,(Math.random()-0.5)*shake*10);
  drawBoard();
  drawPellets();
  for(var i=0;i<lanes.length;i++) for(var j=0;j<lanes[i].vs.length;j++) drawVehicle(lanes[i],lanes[i].vs[j]);
  for(var g=0;g<ghosts.length;g++) drawGhost(ghosts[g]);
  if(state!=='gameover'&&state!=='victory') drawPlayer();
  drawParticles();
  ctx.restore();
  for(var p=0;p<POP.length;p++){
    var q=POP[p];
    ctx.globalAlpha=Math.max(0,Math.min(1,q.life/q.max));
    ctx.font='700 15px "Courier New",monospace';ctx.textAlign='center';
    ctx.lineWidth=3;ctx.strokeStyle='#05070f';
    ctx.strokeText(q.txt,q.x,q.y);
    ctx.fillStyle=q.col;ctx.fillText(q.txt,q.x,q.y);
  }
  ctx.globalAlpha=1;
  drawHUD();
  drawBanner();
  if(flashA>0){ctx.globalAlpha=flashA;ctx.fillStyle=flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}

/* ---------- input ---------- */
var KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function heldAdd(d){if(held.indexOf(d)<0)held.push(d);}
function heldRemove(d){var i=held.indexOf(d);if(i>=0)held.splice(i,1);}
window.addEventListener('keydown',function(e){
  audio();
  var d=KEYMAP[e.code];
  if(d){e.preventDefault();if(!e.repeat)heldAdd(d);return;}
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();primaryAction();return;}
  if(e.code==='KeyP') togglePause();
  else if(e.code==='KeyM') toggleMute();
  else if(e.code==='KeyR'&&state!=='menu') startRun();
});
window.addEventListener('keyup',function(e){
  var d=KEYMAP[e.code];
  if(d) heldRemove(d);
});
cv.addEventListener('click',function(){audio();if(state==='menu')startRun();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='playing')togglePause();});

function wire(id,fn){
  var el=document.getElementById(id);
  el.addEventListener('click',function(e){audio();fn();el.blur();});
}
wire('start',startRun);
wire('pResume',resumeGame);
wire('pRestart',startRun);
wire('pMenu',toMenu);
wire('eAgain',startRun);
wire('eMenu',toMenu);
chipEl.addEventListener('click',function(){audio();toggleMute();chipEl.blur();});

var coarse=false;
try{coarse=window.matchMedia('(pointer:coarse)').matches;}catch(e){}
if(coarse) dpadEl.classList.add('show');
dpadEl.querySelectorAll('b[data-d]').forEach(function(b){
  var d=b.getAttribute('data-d');
  b.addEventListener('pointerdown',function(e){e.preventDefault();audio();heldAdd(d);});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    b.addEventListener(ev,function(e){e.preventDefault();heldRemove(d);});
  });
  b.addEventListener('contextmenu',function(e){e.preventDefault();});
});

/* ---------- boot & loop ---------- */
try{best=parseInt(localStorage.getItem('frogman-best')||'0',10)||0;}catch(e){}
chipEl.textContent=muted?'SND OFF':'SND ON';
for(var i=0;i<34;i++) FF.push({x:Math.random(),y:Math.random(),s:0.5+Math.random(),ph:Math.random()*7,r:1+Math.random()*1.4});
resize();
initPhase(); setPlayerStart();
menuBest.textContent=best;

var last=performance.now();
function frame(now){
  var dt=Math.min(0.035,(now-last)/1000); last=now; tGlobal+=dt;
  if(state!=='paused'){updateWorld(dt);updateFX(dt);}
  updateState(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
