<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Duel</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a16;}
  canvas{display:block;width:100vw;height:100vh;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(()=>{'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const DISP='"Arial Black","Segoe UI",system-ui,sans-serif';
const MONO='Consolas,Menlo,"SF Mono",ui-monospace,monospace';
const WIN=7,COST=50,REGEN=26,ORB_LIFE=22,PULSE_DUR=.5,TARGET_ORBS=3;
const PM=[
 {name:'AZURE',main:'#4fe8ff',light:'#d6f9ff',dark:'#0b5e80',glow:'rgba(79,232,255,'},
 {name:'EMBER',main:'#ffa14a',light:'#ffe6c4',dark:'#8a3c0e',glow:'rgba(255,161,74,'}
];
let W=0,H=0,U=1,DPR=1,T=0;
let state='menu',demo=true,countT=0,goFlash=0,winner=-1,matchTime=0,hintT=6,spawnDelay=0,shake=0;
let P=[],orbs=[],pulses=[],parts=[],texts=[],pulsesUsed=[0,0];
const stars=[];for(let i=0;i<150;i++)stars.push({fx:Math.random(),fy:Math.random(),z:.25+Math.random()*.75,r:.6+Math.random()*1.3,ph:Math.random()*6.28,sp:.4+Math.random()});
let tally={a:0,b:0};
try{const s=localStorage.getItem('gravityDuelTally');if(s){const o=JSON.parse(s);tally.a=o.a|0;tally.b=o.b|0;}}catch(e){}
function saveTally(i){if(i===0)tally.a++;else tally.b++;try{localStorage.setItem('gravityDuelTally',JSON.stringify(tally));}catch(e){}}

/* ---------- audio (starts after first input) ---------- */
let AC=null,master=null,noiseBuf=null;
function audio(){if(!AC){try{const A=window.AudioContext||window.webkitAudioContext;AC=new A();master=AC.createGain();master.gain.value=.5;const cp=AC.createDynamicsCompressor();master.connect(cp);cp.connect(AC.destination);
noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
if(AC&&AC.state==='suspended')AC.resume();return !!AC;}
function tone(o){if(!audio())return;const ac=AC,t=ac.currentTime+(o.at||0),d=o.dur||.2;
const os=ac.createOscillator(),g=ac.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,t);
if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(30,o.f2),t+d);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
os.connect(g);g.connect(master);os.start(t);os.stop(t+d+.1);}
function nhit(o){if(!audio())return;const ac=AC,t=ac.currentTime+(o.at||0),d=o.dur||.3;
const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=o.q||1;
f.frequency.setValueAtTime(o.f||800,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f2),t+d);
const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.2,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.1);}
const sUI=()=>tone({f:740,f2:980,dur:.09,type:'triangle',vol:.14});
const sDeny=()=>tone({f:130,dur:.09,type:'square',vol:.08});
function sPulse(i){nhit({dur:.4,f:i?260:340,f2:i?950:1400,vol:.26,q:.8});tone({f:i?70:55,f2:40,dur:.35,type:'sine',vol:.4});}
function sCapture(i,st){const b=(i?620:480)*(1+Math.min(6,st)*.06);tone({f:b,f2:b*1.6,dur:.16,type:'triangle',vol:.3});tone({f:b*2,dur:.1,vol:.12,at:.05});}
const sBounce=()=>nhit({dur:.05,f:1400,vol:.05,q:2});
const sSpawn=()=>tone({f:520,f2:980,dur:.12,vol:.09});
function sTick(n){tone({f:n===3?660:n===2?550:440,dur:.1,type:'triangle',vol:.16});}
function sGo(){tone({f:880,f2:1320,dur:.28,type:'triangle',vol:.3});tone({f:90,f2:50,dur:.3,vol:.35});}
function sWin(){[523,659,784,1047].forEach((fq,i)=>tone({f:fq,dur:.18,type:'triangle',vol:.2,at:i*.09}));tone({f:1568,dur:.5,vol:.15,at:.36});nhit({dur:.5,f:180,f2:60,vol:.22,q:.7});}
function sStartS(){nhit({dur:.5,f:140,f2:60,vol:.28,q:.7});tone({f:220,f2:440,dur:.35,type:'triangle',vol:.18});}

/* ---------- helpers ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function font(px,mono,bold){ctx.font=(bold?(mono?'700':'900'):'400')+' '+px+'px '+(mono?MONO:DISP);}
function setLS(v){ctx.letterSpacing=v+'px';}
function fmtT(t){return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');}

/* ---------- world ---------- */
function resize(){W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);U=Math.max(.6,Math.min(1.5,Math.min(W,H)/800));
for(const p of P){p.r=23*U;p.x=Math.min(Math.max(p.x,p.r+10*U),W-p.r-10*U);p.y=Math.min(Math.max(p.y,118*U),H-52*U);}
for(const o of orbs){o.r=9*U;o.x=Math.min(Math.max(o.x,o.r+8*U),W-o.r-8*U);o.y=Math.min(Math.max(o.y,o.r+8*U),H-o.r-8*U);}}

function spawnOrb(born){let x=W/2,y=H/2;
for(let t=0;t<9;t++){x=W/2+(Math.random()-.5)*Math.min(W*.3,340*U);y=H/2+(Math.random()-.5)*Math.min(H*.3,280*U);
if(Math.hypot(x-P[0].x,y-P[0].y)>170*U&&Math.hypot(x-P[1].x,y-P[1].y)>170*U)break;}
orbs.push({x,y,vx:(Math.random()-.5)*120*U,vy:(Math.random()-.5)*120*U,r:9*U,age:0,born:(born===undefined?-.3:born),trail:[],ph:Math.random()*6.28,wf:.5+Math.random()*.8,pull:0,pullP:0});
if(!demo){sSpawn();burst(x,y,10,'#ffe9a8',false);}}

function resetWorld(){
P=[0,1].map(i=>({x:W*(i?.76:.24),y:H*.52,vx:0,vy:0,r:23*U,score:0,energy:100,streak:0,pop:0,rf:0,aimx:0,aimy:0,cool:Math.random()}));
orbs=[];pulses=[];parts=[];texts=[];pulsesUsed=[0,0];winner=-1;matchTime=0;hintT=6;spawnDelay=0;shake=0;goFlash=0;
for(let i=0;i<TARGET_ORBS;i++)spawnOrb(-(i*.14));}

function startMatch(){demo=false;resetWorld();state='count';countT=2.4;sStartS();}
function toMenu(){demo=true;resetWorld();state='menu';sUI();}

function fire(i){const p=P[i];if(state!=='playing'&&state!=='menu')return;
if(p.energy<COST){sDeny();return;}
p.energy-=COST;pulses.push({p:i,t:0,r:Math.min(340*U,Math.max(190,Math.min(W,H)*.45))});
if(!demo)pulsesUsed[i]++;
sPulse(i);shake=Math.max(shake,2.5*U);
for(let j=0;j<8;j++){const a=Math.random()*6.28;parts.push({x:p.x+Math.cos(a)*p.r,y:p.y+Math.sin(a)*p.r,vx:Math.cos(a)*120*U,vy:Math.sin(a)*120*U,s:1.6*U,c:PM[i].light,life:.35,max:.35});}}

function burst(x,y,n,c,hot){for(let j=0;j<n;j++){const a=Math.random()*6.28,sp=(60+Math.random()*340)*U*(hot?1.25:.8),l=.45+Math.random()*.45;
parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:(1.5+Math.random()*2.5)*U,c,life:l,max:l});}}

function confetti(i){const cols=[PM[i].main,PM[i].light,'#ffffff','#ffd76a'];
for(let j=0;j<80;j++){const l=1.3+Math.random()*.9;
parts.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.3,vx:(Math.random()-.5)*900*U,vy:-Math.random()*650*U-80,g:950*U,s:(4+Math.random()*6)*U,c:cols[j%4],rot:Math.random()*6.28,vr:(Math.random()-.5)*14,life:l,max:l,rect:true});}}

function capture(i,o,idx){orbs.splice(idx,1);spawnDelay=.9;const p=P[i];
if(demo){burst(o.x,o.y,16,PM[i].main,false);return;}
p.score++;p.streak++;P[1-i].streak=0;p.pop=.35;p.energy=Math.min(100,p.energy+8);
burst(o.x,o.y,26,PM[i].main,true);burst(o.x,o.y,12,'#ffe9a8',false);
texts.push({x:o.x,y:o.y-o.r-10*U,t:'+1',life:.9,max:.9,c:PM[i].main,s:20*U});
shake=Math.max(shake,7*U);sCapture(i,p.streak);
if(p.score>=WIN){state='over';winner=i;pulses=[];saveTally(i);sWin();confetti(i);shake=13*U;}}

function aiMove(i,dt){const p=P[i];p.cool-=dt;
let best=null,bd=1e9;for(const o of orbs){const d=Math.hypot(o.x-p.x,o.y-p.y);if(d<bd){bd=d;best=o;}}
let tx,ty;
if(best){const ux=(best.x-p.x)/bd,uy=(best.y-p.y)/bd,s=Math.sin(T*.8+i*3.1)*.55;tx=ux-uy*s;ty=uy+ux*s;}
else{tx=(i?.74:.26)*W-p.x;ty=H/2-p.y;}
const l=Math.hypot(tx,ty)||1;p.aimx=tx/l;p.aimy=ty/l;
if(best&&bd<Math.min(W,H)*.45&&p.energy>=COST&&p.cool<=0){fire(i);p.cool=.7+Math.random()*.9;}}

/* ---------- input ---------- */
const down={};
const PREVENT=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
window.addEventListener('keydown',e=>{if(PREVENT.has(e.code))e.preventDefault();if(down[e.code])return;down[e.code]=true;audio();press(e.code);});
window.addEventListener('keyup',e=>{down[e.code]=false;});
cv.addEventListener('pointerdown',e=>{audio();
if(state==='menu'||state==='over'){sUI();startMatch();}
else if(state==='playing')fire(e.clientX<W/2?0:1);
else if(state==='paused'){state='playing';sUI();}});
window.addEventListener('blur',()=>{if(state==='playing')state='paused';});

function press(c){
if(state==='menu'){if(c==='Enter'||c==='NumpadEnter'||c==='Space'){sUI();startMatch();}return;}
if(state==='over'){if(c==='Enter'||c==='NumpadEnter'||c==='Space'||c==='KeyR'){sUI();startMatch();}else if(c==='KeyM')toMenu();return;}
if(state==='playing'){
 if(c==='KeyP'||c==='Escape'){state='paused';sUI();return;}
 if(c==='KeyR'){startMatch();return;}
 if(c==='KeyM'){toMenu();return;}
 if(c==='KeyE'||c==='Space')fire(0);
 else if(c==='ShiftRight'||c==='Slash')fire(1);
 return;}
if(state==='paused'){
 if(c==='KeyP'||c==='Escape'||c==='Enter'||c==='NumpadEnter'){state='playing';sUI();return;}
 if(c==='KeyR'){startMatch();return;}
 if(c==='KeyM')toMenu();}}

/* ---------- update ---------- */
function update(dt){
shake*=Math.exp(-7*dt);if(shake<.05)shake=0;goFlash=Math.max(0,goFlash-dt);
for(const p of P){p.pop=Math.max(0,p.pop-dt);p.rf=Math.max(0,p.rf-dt);}
if(state==='paused')return;
if(state==='count'){
 const b=Math.ceil(countT/0.8);countT-=dt;const a2=Math.ceil(Math.max(0,countT)/0.8);
 for(const o of orbs)if(o.born<0)o.born+=dt;
 if(a2!==b&&a2>0)sTick(a2);
 if(countT<=0){state='playing';goFlash=.55;sGo();}
}else worldSim(dt);
updFx(dt);}

function worldSim(dt){
const canAct=state==='playing',aiOn=demo,field=canAct||aiOn;
if(canAct){matchTime+=dt;hintT-=dt;}
for(let i=0;i<2;i++){const p=P[i];let ix=0,iy=0;
 if(aiOn){aiMove(i,dt);ix=p.aimx;iy=p.aimy;}
 else if(canAct){if(i===0){ix=(down.KeyD?1:0)-(down.KeyA?1:0);iy=(down.KeyS?1:0)-(down.KeyW?1:0);}
 else{ix=(down.ArrowRight?1:0)-(down.ArrowLeft?1:0);iy=(down.ArrowDown?1:0)-(down.ArrowUp?1:0);}}
 const l=Math.hypot(ix,iy)||1,ACC=1600*U,MAX=340*U;
 p.vx+=ix/l*ACC*dt;p.vy+=iy/l*ACC*dt;
 const dm=Math.exp(-3.4*dt);p.vx*=dm;p.vy*=dm;
 const sp=Math.hypot(p.vx,p.vy);if(sp>MAX){p.vx*=MAX/sp;p.vy*=MAX/sp;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 const m=p.r+10*U,TM=118*U,BM=H-52*U;
 if(p.x<m){p.x=m;p.vx=Math.abs(p.vx)*.3;}if(p.x>W-m){p.x=W-m;p.vx=-Math.abs(p.vx)*.3;}
 if(p.y<TM){p.y=TM;p.vy=Math.abs(p.vy)*.3;}if(p.y>BM){p.y=BM;p.vy=-Math.abs(p.vy)*.3;}
 const was=p.energy;if(field)p.energy=Math.min(100,p.energy+REGEN*dt);
 if(was<COST&&p.energy>=COST)p.rf=.4;}
{const a=P[0],b=P[1];let dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy)||.001;
 const minD=a.r+b.r+46*U;
 if(d<minD){const f=(minD-d)/minD*1500*U,ux=dx/d,uy=dy/d;a.vx-=ux*f*dt;a.vy-=uy*f*dt;b.vx+=ux*f*dt;b.vy+=uy*f*dt;}
 const hard=a.r+b.r+4;if(d<hard){const push=(hard-d)/2;a.x-=dx/d*push;a.y-=dy/d*push;b.x+=dx/d*push;b.y+=dy/d*push;}}
for(const o of orbs)o.pull=0;
if(field)for(let k=pulses.length-1;k>=0;k--){const pu=pulses[k];pu.t+=dt;
 if(pu.t>=PULSE_DUR){pulses.splice(k,1);continue;}
 const p=P[pu.p],o2=P[1-pu.p],fall=1-pu.t/PULSE_DUR;
 for(const o of orbs){let dx=p.x-o.x,dy=p.y-o.y;const d=Math.hypot(dx,dy);
  if(d<pu.r&&d>1){const f=(1-d/pu.r)*fall;o.vx+=dx/d*3400*U*f*dt;o.vy+=dy/d*3400*U*f*dt;if(f>o.pull){o.pull=f;o.pullP=pu.p;}}}
 let dx2=o2.x-p.x,dy2=o2.y-p.y;const d2=Math.hypot(dx2,dy2);
 if(d2<pu.r&&d2>1){const f=(1-d2/pu.r)*fall;o2.vx+=dx2/d2*760*U*f*dt;o2.vy+=dy2/d2*760*U*f*dt;}}
for(let k=orbs.length-1;k>=0;k--){const o=orbs[k];
 if(o.born<0){o.born+=dt;continue;}
 if(field){o.age+=dt;if(o.age>ORB_LIFE){burst(o.x,o.y,12,'#ffd76a',false);orbs.splice(k,1);spawnDelay=Math.max(spawnDelay,.9);continue;}}
 const a=o.ph+T*o.wf;o.vx+=Math.cos(a)*55*U*dt;o.vy+=Math.sin(a)*55*U*dt;
 o.vx+=(W/2-o.x)*.05*dt;o.vy+=(H/2-o.y)*.05*dt;
 const od=Math.exp(-.5*dt);o.vx*=od;o.vy*=od;
 const osp=Math.hypot(o.vx,o.vy),omx=460*U;if(osp>omx){o.vx*=omx/osp;o.vy*=omx/osp;}
 o.x+=o.vx*dt;o.y+=o.vy*dt;
 const mr=o.r+8*U;let hit=false,hs=0;
 if(o.x<mr){o.x=mr;o.vx=Math.abs(o.vx)*.85;hit=true;hs=Math.abs(o.vx);}
 if(o.x>W-mr){o.x=W-mr;o.vx=-Math.abs(o.vx)*.85;if(Math.abs(o.vx)>hs)hs=Math.abs(o.vx);hit=true;}
 if(o.y<mr){o.y=mr;o.vy=Math.abs(o.vy)*.85;if(Math.abs(o.vy)>hs)hs=Math.abs(o.vy);hit=true;}
 if(o.y>H-mr){o.y=H-mr;o.vy=-Math.abs(o.vy)*.85;if(Math.abs(o.vy)>hs)hs=Math.abs(o.vy);hit=true;}
 if(hit&&canAct&&hs>150*U)sBounce();
 o.trail.push({x:o.x,y:o.y});if(o.trail.length>15)o.trail.shift();
 if(field)for(let i=0;i<2;i++){const p=P[i];if(Math.hypot(p.x-o.x,p.y-o.y)<p.r+o.r*.5){capture(i,o,k);break;}}}
if(field&&orbs.length<TARGET_ORBS){if(spawnDelay>0)spawnDelay-=dt;else spawnOrb(0);}}

function updFx(dt){
for(let k=parts.length-1;k>=0;k--){const q=parts[k];q.life-=dt;if(q.life<=0){parts.splice(k,1);continue;}
 q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.g)q.vy+=q.g*dt;const dmp=Math.exp(-2.2*dt);q.vx*=dmp;q.vy*=dmp;if(q.vr)q.rot+=q.vr*dt;}
for(let k=texts.length-1;k>=0;k--){const t=texts[k];t.life-=dt;t.y-=44*U*dt;if(t.life<=0)texts.splice(k,1);}}

/* ---------- draw ---------- */
function nebulae(){const m=Math.min(W,H);return[
 {fx:.18,fy:.28,r:m*.75,c:'rgba(93,64,196,.15)',ph:0},
 {fx:.85,fy:.2,r:m*.65,c:'rgba(255,122,60,.09)',ph:2},
 {fx:.8,fy:.85,r:m*.7,c:'rgba(34,180,175,.09)',ph:4},
 {fx:.12,fy:.85,r:m*.6,c:'rgba(79,232,255,.07)',ph:1.4},
 {fx:.5,fy:.5,r:m*.8,c:'rgba(120,80,220,.06)',ph:3}];}

function glyph(x,y,pi,r){const m=PM[pi];let g=ctx.createRadialGradient(x,y,0,x,y,r*3.2);
g.addColorStop(0,m.glow+'.5)');g.addColorStop(1,m.glow+'0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.2,0,7);ctx.fill();
g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);g.addColorStop(0,m.light);g.addColorStop(.6,m.main);g.addColorStop(1,m.dark);
ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}

function drawCourt(){
ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1.5*U;ctx.setLineDash([8*U,16*U]);
ctx.beginPath();ctx.moveTo(W/2,70*U);ctx.lineTo(W/2,H-30*U);ctx.stroke();ctx.setLineDash([]);
ctx.strokeStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.arc(W/2,H/2,74*U,0,7);ctx.stroke();
const sp=.5+.5*Math.sin(T*2);
ctx.strokeStyle='rgba(255,215,106,'+(.05+.05*sp)+')';ctx.lineWidth=2*U;
ctx.beginPath();ctx.arc(W/2,H/2,(30+sp*8)*U,0,7);ctx.stroke();
ctx.fillStyle='rgba(255,215,106,.25)';ctx.beginPath();ctx.arc(W/2,H/2,3*U,0,7);ctx.fill();}

function drawPulses(){for(const pu of pulses){const p=P[pu.p],f=pu.t/PULSE_DUR,r=pu.r*(1-Math.pow(1-f,3)),a=1-f;
ctx.strokeStyle=PM[pu.p].glow+(a*.55)+')';ctx.lineWidth=(2+7*a)*U;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();
ctx.strokeStyle=PM[pu.p].glow+(a*.25)+')';ctx.lineWidth=1.5*U;ctx.beginPath();ctx.arc(p.x,p.y,r*.68,0,7);ctx.stroke();}}

function drawPull(){for(const o of orbs){if(o.pull<.04)continue;const p=P[o.pullP],m=PM[o.pullP];
const dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
const sx=o.x+ux*o.r,sy=o.y+uy*o.r,ex=p.x-ux*(p.r+8*U),ey=p.y-uy*(p.r+8*U);
ctx.strokeStyle=m.glow+(o.pull*.3)+')';ctx.lineWidth=(1+5*o.pull)*U;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
ctx.strokeStyle=m.glow+(o.pull*.75)+')';ctx.lineWidth=1.2*U;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();}}

function drawOrbs(){for(const o of orbs){
 const n=o.trail.length;
 if(n>1){ctx.lineCap='round';for(let i=1;i<n;i++){const a=i/n;ctx.strokeStyle='rgba(255,210,110,'+(a*.3)+')';ctx.lineWidth=a*3.5*U+.4;
 ctx.beginPath();ctx.moveTo(o.trail[i-1].x,o.trail[i-1].y);ctx.lineTo(o.trail[i].x,o.trail[i].y);ctx.stroke();}}
 const sc=o.born<0?Math.max(.05,1+o.born):1;
 const aF=Math.max(0,(o.age-(ORB_LIFE-4))/4);
 const vis=1-aF*(.35+.3*Math.sin(T*20));
 const R=o.r*sc,pr=R*3.4*(1+.1*Math.sin(T*3+o.ph));
 let g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,pr);g.addColorStop(0,'rgba(255,236,170,'+(.55*vis)+')');g.addColorStop(1,'rgba(255,200,80,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,pr,0,7);ctx.fill();
 ctx.globalAlpha=vis;
 ctx.fillStyle='#fff8e2';ctx.beginPath();ctx.arc(o.x,o.y,R,0,7);ctx.fill();
 ctx.strokeStyle='rgba(255,190,80,.9)';ctx.lineWidth=1.2*U;ctx.beginPath();ctx.arc(o.x,o.y,R*.62,0,7);ctx.stroke();
 const rot=T*.9+o.ph,L=R*1.15;
 ctx.strokeStyle='rgba(255,240,190,.8)';ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(o.x-Math.cos(rot)*L,o.y-Math.sin(rot)*L);ctx.lineTo(o.x+Math.cos(rot)*L,o.y+Math.sin(rot)*L);
 ctx.moveTo(o.x-Math.cos(rot+1.57)*L*.8,o.y-Math.sin(rot+1.57)*L*.8);ctx.lineTo(o.x+Math.cos(rot+1.57)*L*.8,o.y+Math.sin(rot+1.57)*L*.8);ctx.stroke();
 if(aF>0){ctx.strokeStyle='rgba(255,90,80,'+(aF*.8)+')';ctx.lineWidth=1.5*U;ctx.beginPath();ctx.arc(o.x,o.y,R+4*U,0,7);ctx.stroke();}
 ctx.globalAlpha=1;}}

function drawPlanets(){for(let i=0;i<2;i++){const p=P[i],m=PM[i];
 let g=ctx.createRadialGradient(p.x,p.y,p.r*.4,p.x,p.y,p.r*3.1);g.addColorStop(0,m.glow+'.38)');g.addColorStop(1,m.glow+'0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.1,0,7);ctx.fill();
 const sp=Math.hypot(p.vx,p.vy);
 if(sp>340*U*.55){const k=(sp-340*U*.55)/(340*U*.45),ux=p.vx/sp,uy=p.vy/sp;
  for(let j=-1;j<=1;j++){const ox=-uy*j*p.r*.55,oy=ux*j*p.r*.55,sx=p.x-ux*(p.r+2*U)+ox,sy=p.y-uy*(p.r+2*U)+oy,L=(8+30*k)*U;
   ctx.strokeStyle='rgba(255,255,255,'+(.16*k+.04)+')';ctx.lineWidth=1.5*U;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-ux*L,sy-uy*L);ctx.stroke();}}
 g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.42,p.r*.12,p.x,p.y,p.r);g.addColorStop(0,m.light);g.addColorStop(.5,m.main);g.addColorStop(1,m.dark);
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
 ctx.strokeStyle=m.glow+'.85)';ctx.lineWidth=1.5*U;ctx.stroke();
 const rr2=p.r+7*U,frac=p.energy/100,a0=-Math.PI/2;
 ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=3.5*U;ctx.beginPath();ctx.arc(p.x,p.y,rr2,0,7);ctx.stroke();
 let al=p.energy>=COST?.95:.4;if(p.rf>0)al=Math.min(1,al+p.rf*2);
 ctx.strokeStyle=m.glow+al+')';ctx.lineWidth=3.5*U+(p.rf>0?p.rf*4:0);ctx.beginPath();ctx.arc(p.x,p.y,rr2,a0,a0+frac*Math.PI*2);ctx.stroke();
 const na=a0+(COST/100)*Math.PI*2;
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();
 ctx.moveTo(p.x+Math.cos(na)*(rr2-3.5*U),p.y+Math.sin(na)*(rr2-3.5*U));
 ctx.lineTo(p.x+Math.cos(na)*(rr2+3.5*U),p.y+Math.sin(na)*(rr2+3.5*U));ctx.stroke();
 if(state!=='menu'){font(10*U,true,false);ctx.textAlign='center';ctx.fillStyle=m.glow+'.6)';ctx.fillText('P'+(i+1),p.x,p.y+p.r+24*U);}}}

function drawFx(){for(const q of parts){const a=Math.max(0,q.life/q.max);ctx.globalAlpha=a;
 if(q.rect){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot||0);ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s*.3,q.s,q.s*.6);ctx.restore();}
 else{ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s*(.35+.65*a),0,7);ctx.fill();}}
 ctx.globalAlpha=1;
 for(const t of texts){const a=Math.max(0,t.life/t.max);ctx.globalAlpha=a;font(t.s,false,true);ctx.textAlign='center';ctx.fillStyle=t.c;ctx.fillText(t.t,t.x,t.y);}
 ctx.globalAlpha=1;}

function hudBlock(i){const m=PM[i],p=P[i],right=i===1,x=right?W-26*U:26*U;
 ctx.beginPath();ctx.arc(x+(right?-8*U:8*U),30*U,5*U,0,7);ctx.fillStyle=m.main;ctx.fill();
 font(13*U,true,true);setLS(2);ctx.textAlign=right?'right':'left';ctx.textBaseline='alphabetic';ctx.fillStyle=m.light;
 ctx.fillText(m.name,x+(right?-20*U:20*U),35*U);setLS(0);
 const sc=p.pop>0?1+Math.sin((1-p.pop/.35)*Math.PI)*.3:1;
 font(46*U*sc,false,true);ctx.textAlign=right?'right':'left';ctx.fillStyle='#f4f7ff';
 ctx.shadowColor=m.glow+'.7)';ctx.shadowBlur=18*U;ctx.fillText(String(p.score),x,86*U);ctx.shadowBlur=0;
 const bw=132*U,bh=5*U,bx=right?x-bw:x,by=98*U;
 rr(bx,by,bw,bh,2.5*U);ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;ctx.stroke();
 const fw=bw*(p.energy/100);
 if(fw>2){rr(bx,by,fw,bh,2.5*U);ctx.fillStyle=m.glow+'.95)';ctx.fill();}
 if(p.energy>=COST&&p.rf>0){rr(bx-2,by-2,bw+4,bh+4,3*U);ctx.strokeStyle=m.glow+(p.rf*1.6)+')';ctx.lineWidth=1.5;ctx.stroke();}
 const gap=11*U,s=3.5*U;
 for(let k=0;k<WIN;k++){const px=x+(right?-k*gap:k*gap),pyy=122*U;
  ctx.beginPath();ctx.moveTo(px,pyy-s);ctx.lineTo(px+s,pyy);ctx.lineTo(px,pyy+s);ctx.lineTo(px-s,pyy);ctx.closePath();
  if(k<p.score){ctx.fillStyle=m.main;ctx.fill();}else{ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.stroke();}}}

function drawHUD(){
 let g=ctx.createLinearGradient(0,0,0,120*U);g.addColorStop(0,'rgba(5,8,19,.75)');g.addColorStop(1,'rgba(5,8,19,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,120*U);
 g=ctx.createLinearGradient(0,H-64*U,0,H);g.addColorStop(0,'rgba(5,8,19,0)');g.addColorStop(1,'rgba(5,8,19,.7)');
 ctx.fillStyle=g;ctx.fillRect(0,H-64*U,W,64*U);
 for(let i=0;i<2;i++)hudBlock(i);
 if(W>700){font(11*U,true,false);setLS(3);ctx.textAlign='center';ctx.fillStyle='rgba(200,210,240,.5)';ctx.fillText('FIRST TO '+WIN+' CORES',W/2,36*U);setLS(0);}
 if(W>860){font(12*U,true,false);ctx.textAlign='center';ctx.fillStyle='rgba(170,180,215,.55)';ctx.fillText(fmtT(matchTime),W/2,H-22*U);}
 if(hintT>0&&state==='playing'){const a=Math.min(1,hintT/2)*.8;font(11*U,true,false);setLS(2);
  ctx.textAlign='left';ctx.fillStyle=PM[0].glow+a+')';ctx.fillText('WASD MOVE · E PULSE',26*U,H-22*U);
  ctx.textAlign='right';ctx.fillStyle=PM[1].glow+a+')';ctx.fillText('ARROWS MOVE · SHIFT PULSE',W-26*U,H-22*U);setLS(0);}}

function drawParts(cx,y,items,size){font(size,true,false);let total=0;
 for(const it of items)total+=ctx.measureText(it[0]).width;
 let x=cx-total/2;ctx.textAlign='left';ctx.textBaseline='alphabetic';
 for(const it of items){ctx.fillStyle=it[1];ctx.fillText(it[0],x,y);x+=ctx.measureText(it[0]).width;}}

function keycap(x,y,w,h,label,arrow){
 rr(x,y,w,h,6*U);ctx.fillStyle='#141b38';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;ctx.stroke();
 if(arrow){const cx=x+w/2,cy=y+h/2,s=Math.min(w,h)*.34;ctx.fillStyle='#e9eeff';ctx.beginPath();
  if(arrow==='up'){ctx.moveTo(cx,cy-s);ctx.lineTo(cx-s*.85,cy+s*.7);ctx.lineTo(cx+s*.85,cy+s*.7);}
  else if(arrow==='down'){ctx.moveTo(cx,cy+s);ctx.lineTo(cx-s*.85,cy-s*.7);ctx.lineTo(cx+s*.85,cy-s*.7);}
  else if(arrow==='left'){ctx.moveTo(cx-s,cy);ctx.lineTo(cx+s*.7,cy-s*.85);ctx.lineTo(cx+s*.7,cy+s*.85);}
  else{ctx.moveTo(cx+s,cy);ctx.lineTo(cx-s*.7,cy-s*.85);ctx.lineTo(cx-s*.7,cy+s*.85);}
  ctx.closePath();ctx.fill();}
 else{font(Math.min(h*.62,14*U),true,true);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#e9eeff';ctx.fillText(label,x+w/2,y+h/2+1);ctx.textBaseline='alphabetic';}}

function drawCard(i,x,y,cw,ch){const m=PM[i],pad=18*U;
 rr(x,y,cw,ch,12*U);ctx.fillStyle='rgba(9,13,30,.8)';ctx.fill();
 ctx.strokeStyle=m.glow+'.5)';ctx.lineWidth=1.5;ctx.stroke();
 ctx.strokeStyle=m.glow+'.9)';ctx.lineWidth=2.5*U;ctx.beginPath();ctx.moveTo(x+14*U,y);ctx.lineTo(x+cw*.42,y);ctx.stroke();
 font(13*U,true,true);setLS(2);ctx.textAlign='left';ctx.fillStyle=m.light;ctx.fillText('PLAYER '+(i+1),x+pad,y+30*U);setLS(0);
 ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+pad,y+42*U);ctx.lineTo(x+cw-pad,y+42*U);ctx.stroke();
 const cs=26*U,g=5*U,mx=x+pad,my=y+58*U;
 if(i===0){keycap(mx+cs+g,my,cs,cs,'W');keycap(mx,my+cs+g,cs,cs,'A');keycap(mx+cs+g,my+cs+g,cs,cs,'S');keycap(mx+2*(cs+g),my+cs+g,cs,cs,'D');}
 else{keycap(mx+cs+g,my,cs,cs,null,'up');keycap(mx,my+cs+g,cs,cs,null,'left');keycap(mx+cs+g,my+cs+g,cs,cs,null,'down');keycap(mx+2*(cs+g),my+cs+g,cs,cs,null,'right');}
 const labelX=mx+3*cs+2*g+16*U;
 font(10*U,true,false);setLS(2);ctx.fillStyle='rgba(200,210,240,.55)';ctx.fillText('STEER',labelX,my+cs*.9);
 const py=my+2*cs+g+16*U;
 if(i===0){keycap(mx,py,30*U,24*U,'E');keycap(mx+36*U,py,64*U,24*U,'SPACE');}
 else{keycap(mx,py,58*U,24*U,'SHIFT');keycap(mx+64*U,py,20*U,24*U,'/');}
 ctx.fillStyle='rgba(200,210,240,.55)';font(10*U,true,false);setLS(2);ctx.fillText('PULSE',labelX,py+16*U);
 font(9.5*U,true,false);setLS(1);ctx.fillStyle='rgba(160,170,205,.5)';ctx.fillText('PULL CORES · SHOVE THE RIVAL',x+pad,y+ch-14*U);setLS(0);}

function drawMenu(){
 ctx.fillStyle='rgba(5,8,18,.62)';ctx.fillRect(0,0,W,H);
 const cx=W/2,ty=H*.29,cyO=ty+8*U;
 const rx=Math.min(W*.26,320*U),ry=46*U,A1=T*.85,A2=A1+Math.PI;
 ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(cx,cyO,rx,ry,0,0,7);ctx.stroke();
 const p1x=cx+Math.cos(A1)*rx,p1y=cyO+Math.sin(A1)*ry,p2x=cx+Math.cos(A2)*rx,p2y=cyO+Math.sin(A2)*ry;
 if(Math.sin(A1)<=0)glyph(p1x,p1y,0,9*U);
 if(Math.sin(A2)<=0)glyph(p2x,p2y,1,7*U);
 const bob=Math.sin(T*1.4)*5*U;
 let F=Math.min(W*.085,96*U);ctx.font='900 '+F+'px '+DISP;
 const tw=ctx.measureText('GRAVITY DUEL').width;if(tw>W*.86)F*=W*.86/tw;
 const gap=F*.24;ctx.font='900 '+F+'px '+DISP;
 const w1=ctx.measureText('GRAVITY').width,w2=ctx.measureText('DUEL').width;
 const x0=cx-(w1+gap+w2)/2,tyb=ty+bob+F*.34;
 ctx.textAlign='left';ctx.textBaseline='alphabetic';setLS(1);
 ctx.shadowColor='rgba(79,232,255,.8)';ctx.shadowBlur=26*U;ctx.fillStyle='#f6f8ff';ctx.fillText('GRAVITY',x0,tyb);
 ctx.shadowColor='rgba(255,140,60,.7)';ctx.shadowBlur=22*U;
 ctx.strokeStyle='#ffa14a';ctx.lineWidth=Math.max(1.5,F*.05);ctx.lineJoin='round';ctx.strokeText('DUEL',x0+w1+gap,tyb);
 ctx.shadowBlur=0;setLS(0);
 if(Math.sin(A1)>0)glyph(p1x,p1y,0,9*U);
 if(Math.sin(A2)>0)glyph(p2x,p2y,1,7*U);
 font(12*U,true,false);setLS(4);ctx.textAlign='center';ctx.fillStyle='rgba(190,200,235,.75)';
 ctx.fillText('TWO-PLAYER GRAVITY · CAPTURE THE CORES',cx,tyb+F*.62);setLS(0);
 let cw=Math.min(W*.4,300*U),gapC=34*U,ch=178*U;
 if(cw*2+gapC>W-36)cw=(W-36-gapC)/2;
 let cardBottom;
 if(cw<210*U){const sw=Math.min(W*.8,340*U),y0=H*.46,y1=y0+ch+14*U;
  drawCard(0,cx-sw/2,y0,sw,ch);drawCard(1,cx-sw/2,y1,sw,ch);cardBottom=y1+ch;}
 else{const cy=Math.min(H*.6,H-ch/2-150*U);
  drawCard(0,cx-gapC/2-cw,cy,cw,ch);drawCard(1,cx+gapC/2,cy,cw,ch);cardBottom=cy+ch/2;}
 const bl=.45+.55*Math.abs(Math.sin(T*3.2));
 font(15*U,true,true);setLS(3);ctx.textAlign='center';ctx.fillStyle='rgba(240,246,255,'+(.35+.6*bl)+')';
 ctx.fillText('PRESS ENTER TO START',cx,cardBottom+44*U);
 font(10*U,true,false);setLS(1);ctx.fillStyle='rgba(150,160,200,.5)';
 ctx.fillText('CLICK OR TAP ALSO WORKS · FIRST TO 7 CORES WINS',cx,cardBottom+64*U);setLS(0);
 drawParts(cx,H-22*U,[['LIFETIME  ','rgba(150,160,200,.55)'],['AZURE '+tally.a,'rgba(79,232,255,.8)'],['   ·   ','rgba(150,160,200,.4)'],['EMBER '+tally.b,'rgba(255,161,74,.8)']],10.5*U);}

function drawCount(){ctx.fillStyle='rgba(4,6,15,.35)';ctx.fillRect(0,0,W,H);
 const n=Math.ceil(countT/0.8),tIn=1-((countT%0.8)/0.8);
 const sc=1.45-.45*Math.min(1,tIn*4.5);
 const a=Math.min(1,tIn*9)*Math.min(1,(1-tIn)*3+.25);
 ctx.save();ctx.globalAlpha=a;font(150*U*sc,false,true);ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.shadowColor='rgba(140,160,255,.8)';ctx.shadowBlur=40*U;ctx.fillStyle='#f2f5ff';
 ctx.fillText(String(n),W/2,H*.46);ctx.restore();
 const rr2=92*U;ctx.strokeStyle='rgba(150,170,255,.35)';ctx.lineWidth=3*U;
 ctx.beginPath();ctx.arc(W/2,H*.46,rr2,-Math.PI/2,-Math.PI/2+tIn*Math.PI*2);ctx.stroke();
 font(12*U,true,false);setLS(3);ctx.textAlign='center';ctx.fillStyle='rgba(200,210,240,.7)';
 ctx.fillText('GET READY',W/2,H*.46+rr2+30*U);setLS(0);}

function drawGo(){const a=goFlash/.55;ctx.save();ctx.globalAlpha=Math.min(1,a*1.6);
 font(120*U*(1+(1-a)*.4),false,true);ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.shadowColor='rgba(255,180,60,.8)';ctx.shadowBlur=40*U;ctx.fillStyle='#ffd76a';
 ctx.fillText('GO!',W/2,H*.48);ctx.restore();}

function drawPaused(){ctx.fillStyle='rgba(4,6,15,.55)';ctx.fillRect(0,0,W,H);
 font(64*U,false,true);ctx.textAlign='center';ctx.fillStyle='#eef2ff';
 ctx.shadowColor='rgba(140,160,255,.7)';ctx.shadowBlur=30*U;ctx.fillText('PAUSED',W/2,H*.44);ctx.shadowBlur=0;
 font(13*U,true,false);setLS(2);ctx.fillStyle='rgba(180,190,225,.65)';
 ctx.fillText('P — RESUME     R — REMATCH     M — MENU',W/2,H*.44+52*U);setLS(0);}

function drawOver(){ctx.fillStyle='rgba(5,7,16,.62)';ctx.fillRect(0,0,W,H);
 const m=PM[winner];
 font(13*U,true,false);setLS(4);ctx.textAlign='center';ctx.fillStyle='rgba(190,200,235,.7)';
 ctx.fillText('MATCH COMPLETE',W/2,H*.24);setLS(0);
 const F=Math.min(W*.13,86*U);font(F,false,true);
 ctx.shadowColor=m.glow+'.8)';ctx.shadowBlur=34*U;ctx.fillStyle=m.main;
 ctx.fillText(m.name+' WINS',W/2,H*.35);ctx.shadowBlur=0;
 font(46*U,false,true);
 const s0=String(P[0].score),s1=String(P[1].score);
 const wA=ctx.measureText(s0).width,wB=ctx.measureText(s1).width,wC=ctx.measureText(' : ').width;
 let x=W/2-(wA+wB+wC)/2;ctx.textAlign='left';
 ctx.fillStyle=PM[0].main;ctx.fillText(s0,x,H*.46);x+=wA;
 ctx.fillStyle='rgba(230,235,255,.5)';ctx.fillText(' : ',x,H*.46);x+=wC;
 ctx.fillStyle=PM[1].main;ctx.fillText(s1,x,H*.46);
 font(12*U,true,false);setLS(2);ctx.textAlign='center';ctx.fillStyle='rgba(180,190,225,.6)';
 ctx.fillText('TIME '+fmtT(matchTime)+'   ·   PULSES '+pulsesUsed[0]+' / '+pulsesUsed[1],W/2,H*.54);setLS(0);
 const bl=.45+.55*Math.abs(Math.sin(T*3.2));font(15*U,true,true);
 ctx.fillStyle='rgba(240,246,255,'+(.35+.6*bl)+')';
 ctx.fillText('ENTER — REMATCH     R — RESET     M — MENU',W/2,H*.66);}

function draw(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#111a3f');g.addColorStop(.55,'#0b1029');g.addColorStop(1,'#060812');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const n of nebulae()){const x=n.fx*W+Math.sin(T*.07+n.ph)*n.r*.15,y=n.fy*H+Math.cos(T*.06+n.ph)*n.r*.12;
  const rg=ctx.createRadialGradient(x,y,0,x,y,n.r);rg.addColorStop(0,n.c);rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(x-n.r,y-n.r,n.r*2,n.r*2);}
 for(const s of stars){const x=((s.fx+T*.0045*s.z)%1)*W,y=((s.fy+T*.002*s.z)%1)*H;
  const twk=.35+.65*Math.abs(Math.sin(T*s.sp+s.ph));
  ctx.globalAlpha=twk*s.z*.9;ctx.fillStyle='#dfe8ff';ctx.beginPath();ctx.arc(x,y,s.r*s.z,0,7);ctx.fill();}
 ctx.globalAlpha=1;
 ctx.save();
 if(shake>.3)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 drawCourt();drawPulses();drawPull();drawOrbs();drawPlanets();drawFx();
 ctx.restore();
 const vg=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.62);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,4,12,.55)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(state==='menu')drawMenu();
 else{drawHUD();
  if(state==='count')drawCount();
  if(state==='playing'&&goFlash>0)drawGo();
  if(state==='paused')drawPaused();
  if(state==='over')drawOver();}}

/* ---------- loop ---------- */
let last=performance.now(),lastCur='';
function frame(now){requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;T+=dt;
 update(dt);draw();
 const cur=(state==='menu'||state==='over')?'pointer':'crosshair';
 if(cur!==lastCur){cv.style.cursor=cur;lastCur=cur;}}

resize();resetWorld();
window.addEventListener('resize',resize);
requestAnimationFrame(frame);
})();
</script>
</body>
