<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHOSTLINE — Turn-Based Stealth</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#060a0e}
body{font-family:ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'Courier New',monospace;color:#c8dcea;-webkit-user-select:none;user-select:none}
.disp{font-family:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Narrow',sans-serif;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(2,5,8,.6) 100%)}
#scan{position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.024) 0 1px,transparent 1px 3px);animation:scanmv 9s linear infinite}
@keyframes scanmv{to{background-position:0 60px}}
#expose{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 140px 50px rgba(255,50,64,.55)}
#expose.live{animation:exp 1.1s ease-in-out infinite}
@keyframes exp{50%{filter:brightness(1.7)}}
header#top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 20px 12px;background:linear-gradient(180deg,rgba(5,9,13,.94) 55%,rgba(5,9,13,.4));border-bottom:1px solid rgba(80,190,230,.14);pointer-events:none}
#sect .no{font-size:10px;letter-spacing:.3em;color:#6fa7bd}
#sect h1{font-size:clamp(17px,2.3vw,27px);color:#ecf7ff;line-height:1;text-shadow:0 0 18px rgba(70,220,255,.25)}
#mid .lbl{font-size:9px;letter-spacing:.28em;color:#7c93a6;display:block;margin-bottom:5px}
#meter{display:flex;gap:6px}
#meter i{display:inline-block;width:26px;height:10px;border:1px solid rgba(255,90,105,.45);transform:skewX(-16deg);transition:all .2s}
#meter i.on{background:#ff3b4d;box-shadow:0 0 12px rgba(255,59,77,.9);border-color:#ff3b4d}
#right{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em}
.chip{padding:4px 9px;border:1px solid #2c4a5c;color:#7fa0b4;transition:all .25s;background:rgba(10,18,26,.6)}
.chip.gold{border-color:#ffd76a;color:#ffe3a1;box-shadow:0 0 12px rgba(255,215,106,.25);background:rgba(60,45,10,.35)}
.chip.open{border-color:#59e08b;color:#a9f5c6;box-shadow:0 0 12px rgba(89,224,139,.25)}
#turns{color:#dceaf5;font-size:13px}
#snd{border:1px solid #2c4a5c;padding:4px 8px;font-size:9px;letter-spacing:.2em;color:#7fa0b4}
#snd.off{color:#ff6f7e;border-color:rgba(255,90,105,.5)}
footer#foot{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 20px 14px;background:linear-gradient(0deg,rgba(5,9,13,.94) 55%,rgba(5,9,13,0));pointer-events:none}
#phase{font-size:12px;letter-spacing:.26em;padding:7px 14px;border:1px solid #35e8d0;color:#7dfce9;background:rgba(8,26,24,.7);transition:all .2s;white-space:nowrap}
#phase.gd{border-color:#ffb43a;color:#ffd08a;background:rgba(38,26,8,.75);animation:pill 1s ease-in-out infinite}
@keyframes pill{50%{box-shadow:0 0 14px rgba(255,180,58,.5)}}
#phase.dim{border-color:#2c4a5c;color:#5d7a8d;animation:none}
#cov{margin-left:10px;font-size:10px;letter-spacing:.2em;color:#3f6b7d;transition:color .2s}
#cov.on{color:#7dfce9;text-shadow:0 0 10px rgba(53,232,208,.6)}
#log{width:min(560px,52vw);text-align:right;font-size:11.5px;line-height:1.55}
#log p{animation:ln .3s ease-out;color:#9db7c9}
#log p.bad{color:#ff8d97}#log p.good{color:#8ef0b4}#log p.warn{color:#ffd08a}#log p.info{color:#6fa7bd}
@keyframes ln{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:var(--fc,rgba(255,255,255,.2))}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#overlay{position:fixed;inset:0;z-index:5;display:flex;background:rgba(3,6,9,.78);transition:opacity .35s;overflow:auto}
#overlay.hidden{opacity:0;pointer-events:none}
.screen{margin:auto;width:min(740px,94vw);position:relative;padding:clamp(24px,4.5vw,52px)}
.brk::before,.brk::after{content:'';position:absolute;width:16px;height:16px;border:2px solid #35e8d0}
.brk::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.brk::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.panel{border:1px solid rgba(90,200,240,.2);background:rgba(8,14,20,.78)}
.screen.danger::before,.screen.danger::after{border-color:#ff5063}
.screen.gold::before,.screen.gold::after{border-color:#ffd76a}
.feedbar{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;font-size:10px;letter-spacing:.24em;color:#5d7a8d;z-index:6}
.rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d5e;margin-right:8px;box-shadow:0 0 8px #ff4d5e;animation:blink 1.3s steps(2) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.15}}
.kicker{font-size:11px;letter-spacing:.42em;color:#ffb43a;margin-bottom:14px}
.kicker.red{color:#ff5f70}
.title{position:relative;z-index:0;font-family:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Narrow',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(58px,11vw,132px);line-height:.92;color:#eef8ff;letter-spacing:.04em;text-shadow:0 0 34px rgba(53,232,208,.3)}
.title::after{content:attr(data-t);position:absolute;left:5px;top:6px;z-index:-1;color:transparent;-webkit-text-stroke:1px rgba(53,232,208,.35)}
.title.sm{font-size:clamp(40px,7vw,78px)}
.screen.danger .title{text-shadow:0 0 30px rgba(255,60,80,.45)}
.lede{max-width:54ch;font-size:13px;line-height:1.7;color:#9db7c9;margin:18px 0 22px}
.ctlgrid{display:grid;grid-template-columns:auto auto;gap:9px 26px;font-size:11px;letter-spacing:.18em;color:#7fa0b4;margin-bottom:26px}
kbd{font-family:inherit;border:1px solid #35506a;background:#0d1620;padding:3px 8px;color:#cfe9ff;font-size:10.5px;letter-spacing:.12em;box-shadow:inset 0 -2px 0 rgba(255,255,255,.07)}
.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.btn{font-family:inherit;cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:.24em;padding:13px 22px;background:transparent;border:1px solid #35e8d0;color:#a9f7ec;transition:transform .16s,background .16s,color .16s,box-shadow .16s}
.btn:hover{background:#35e8d0;color:#04211c;transform:translateY(-2px);box-shadow:0 8px 22px rgba(53,232,208,.3)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn.red{border-color:#ff5063;color:#ffb3bb}
.btn.red:hover{background:#ff5063;color:#2a0509;box-shadow:0 8px 22px rgba(255,80,99,.3)}
.btn.ghost{border-color:#3d5a70;color:#8fa9bd}
.btn.ghost:hover{background:#3d5a70;color:#eaf6ff;box-shadow:none}
.best{font-size:10px;letter-spacing:.24em;color:#ffd76a}
.await{margin-top:26px;font-size:12px;letter-spacing:.2em;color:#5d8ba3}
.caret{animation:blink 1s steps(2) infinite;color:#35e8d0}
.sweep{position:absolute;inset:-40%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 76%,rgba(255,190,80,.09) 84%,transparent 92%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card div>div{animation:cardin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.stats{display:flex;gap:26px;align-items:center;font-size:11px;letter-spacing:.2em;color:#7fa0b4;margin:20px 0}
.stats b{color:#eaf6ff;font-size:15px;letter-spacing:.08em;display:block;margin-top:4px}
.badge{display:inline-block;border:1px solid #ffd76a;color:#ffe3a1;padding:5px 12px;font-size:10px;letter-spacing:.3em;margin-left:4px}
.hint{margin-top:20px;font-size:9.5px;letter-spacing:.22em;color:#4d6b80}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div><div id="scan"></div><div id="expose"></div>
<header id="top">
  <div id="sect"><div class="no" id="sectNo">SECTOR 01 / 03</div><h1 class="disp" id="sectName">THE LOBBY</h1></div>
  <div id="mid"><span class="lbl">EXPOSURE</span><div id="meter"><i></i><i></i><i></i></div></div>
  <div id="right"><span class="chip" id="objChip">◆ ARTIFACT</span><span class="chip" id="exitChip">EXIT SEALED</span><span id="turns">T+00</span><span id="snd">SND ON</span></div>
</header>
<footer id="foot">
  <div><span id="phase"></span><span id="cov"></span></div>
  <div id="log"></div>
</footer>
<div id="flash"></div>
<div id="overlay" class="hidden"></div>

<script>
(() => { 'use strict';
const $ = s => document.getElementById(s);
const TAU = Math.PI*2, RAD = Math.PI/180;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
function hash(x,y){ let h=x*374761393+y*668265263; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967295; }
function lerpAng(a,b,t){ let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return a+d*t; }

/* ---------------- LEVELS  (# wall · . floor · C cover/hide · P start · K artifact · X exit) ---------------- */
const LEVELS=[
{ name:'THE LOBBY', tip:'Every step costs a turn. Read the cone, slip between passes.',
  map:[
  "################",
  "#P.............#",
  "#..C...........#",
  "#..............#",
  "###.##...###.###",
  "#..............#",
  "#......K.C.....#",
  "#.C............#",
  "#.............C#",
  "#..............#",
  "#.C...........X#",
  "################"],
  guards:[{path:[[3,5],[12,5],[12,9],[3,9]],range:5,fov:70}] },
{ name:'THE GALLERY', tip:'Two patrols cross the hall. Planters hide you — but not your noise.',
  map:[
  "##################",
  "#P.............K.#",
  "#............C...#",
  "#................#",
  "###..####...##.###",
  "#................#",
  "#.......##.......#",
  "#.C.....##.......#",
  "#..............C.#",
  "#................#",
  "##.####...####.###",
  "#X...............#",
  "##################"],
  guards:[{path:[[4,5],[13,5],[13,9],[4,9]],range:5,fov:70},
          {path:[[2,3],[16,3]],range:6,fov:60}] },
{ name:'THE VAULT', tip:'The sentinel sees far and narrow. Strike on its turnaround.',
  map:[
  "##################",
  "#P...............#",
  "#..C........C....#",
  "#...............K#",
  "##.###.###.###.###",
  "#................#",
  "#...........C....#",
  "###.##.....###.#.#",
  "#...C............#",
  "#................#",
  "#.###.#####.###.##",
  "#................#",
  "#...............X#",
  "##################"],
  guards:[{path:[[4,3],[10,3],[10,9],[4,9]],range:5,fov:70},
          {path:[[12,5],[16,5]],range:7,fov:40},
          {path:[[2,11],[15,11]],range:5,fov:70}] }
];

/* ---------------- STATE ---------------- */
const cv=$('cv'), ctx=cv.getContext('2d');
const overlay=$('overlay'), flashEl=$('flash'), exposeEl=$('expose');
const phaseEl=$('phase'), covEl=$('cov'), logEl=$('log');
const sectNoEl=$('sectNo'), sectNameEl=$('sectName'), turnsEl=$('turns');
const objChip=$('objChip'), exitChip=$('exitChip'), sndEl=$('snd');
const pips=[...document.querySelectorAll('#meter i')];

let W=0,H=0,T=32,ox=0,oy=0,DPR=1;
let grid=null,guards=[],p=null,itemPos=null,exitPos=null;
let hasKey=false,detection=0,levelIndex=0;
let state='menu',busy=false,sess=0,shake=0,spotGuard=null;
let run={total:0,totalAtLevelStart:0};
const rings=[]; let dust=[]; let staticCv=null;
let lastDemo=0,lastT=0,tNow=0;

/* ---------------- AUDIO (Web Audio, post-gesture) ---------------- */
let AC=null,master=null,muted=false;
function initAudio(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.16; master.connect(AC.destination);}catch(e){} }
function tone(f0,f1,dur,type,vol,delay){ if(!AC||muted)return; vol=vol||.3; delay=delay||0; const t=AC.currentTime+delay;
 const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f0,t);
 if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
 g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.06); }
function noiseBurst(dur,vol,freq,delay){ if(!AC||muted)return; vol=vol||.2; delay=delay||0; const t=AC.currentTime+delay;
 const n=Math.max(1,(AC.sampleRate*dur)|0), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||500;
 const g=AC.createGain(); g.gain.value=vol; src.connect(f); f.connect(g); g.connect(master); src.start(t); }
const sfx={
 move:()=>tone(300,200,.07,'triangle',.35),
 blocked:()=>{noiseBurst(.09,.25,240); tone(130,80,.1,'square',.15);},
 wait:()=>tone(560,470,.14,'sine',.14),
 step:()=>noiseBurst(.06,.12,420+Math.random()*260),
 heard:()=>{tone(880,880,.08,'sine',.3); tone(1175,1175,.09,'sine',.2,.07);},
 spotted:n=>{tone(620+n*140,940+n*140,.16,'square',.3); noiseBurst(.12,.18,900,.02);},
 caught:()=>{tone(420,90,.7,'sawtooth',.35); noiseBurst(.5,.3,320,.06);},
 pickup:()=>{[660,880,1320].forEach((f,i)=>tone(f,f,.12,'triangle',.3,i*.07));},
 clear:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,.16,'sine',.3,i*.09));},
 win:()=>{[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,f,.2,'triangle',.3,i*.11));},
 ui:()=>tone(700,980,.06,'sine',.2)
};

/* ---------------- STORAGE ---------------- */
function getBest(){ try{ const v=localStorage.getItem('ghostline.best'); return v?+v:null; }catch(e){ return null; } }
function setBest(v){ try{ localStorage.setItem('ghostline.best',String(v)); }catch(e){} }

/* ---------------- LAYOUT / STATIC RENDER ---------------- */
function layout(){
 DPR=Math.min(2,window.devicePixelRatio||1);
 const w=window.innerWidth,h=window.innerHeight;
 cv.width=w*DPR; cv.height=h*DPR; cv.style.width=w+'px'; cv.style.height=h+'px';
 if(!W||!H)return;
 const top=78,bot=126,padx=34;
 T=Math.max(14,Math.floor(Math.min((w-padx*2)/W,(h-top-bot)/H)));
 ox=Math.floor((w-W*T)/2); oy=top+Math.floor((h-top-bot-H*T)/2);
 renderStatic(); initDust();
}
function renderStatic(){
 if(!grid)return;
 staticCv=document.createElement('canvas');
 staticCv.width=W*T*DPR; staticCv.height=H*T*DPR;
 const c=staticCv.getContext('2d'); c.scale(DPR,DPR);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const ch=grid[y][x],px=x*T,py=y*T,hsh=hash(x,y);
  if(ch==='#'){
   c.fillStyle='rgb('+((38+hsh*8)|0)+','+((54+hsh*10)|0)+','+((72+hsh*12)|0)+')';
   c.fillRect(px,py,T,T);
   c.fillStyle='rgba(150,190,230,.10)'; c.fillRect(px,py,T,2);
   if(y+1<H&&grid[y+1][x]!=='#'){ c.fillStyle='rgba(8,14,20,.55)'; c.fillRect(px,py+T-4,T,4); }
  } else {
   c.fillStyle=(x+y)%2?'#151f29':'#17232e'; c.fillRect(px,py,T,T);
   c.strokeStyle='rgba(0,0,0,.28)'; c.lineWidth=1; c.strokeRect(px+.5,py+.5,T-1,T-1);
   if(hsh>.8){ c.fillStyle='rgba(0,0,0,.14)'; c.beginPath();
     c.ellipse(px+T*(.3+hsh*.4),py+T*(.3+((hsh*7)%1)*.4),T*.16,T*.06,hsh*3,0,TAU); c.fill(); }
   if(ch==='C'){
    const cx=px+T/2,cy=py+T/2,r=T*.34;
    c.fillStyle='#101c15'; c.beginPath(); c.arc(cx,cy,r,0,TAU); c.fill();
    c.strokeStyle='rgba(90,160,120,.35)'; c.lineWidth=1.5; c.stroke();
    for(let i=0;i<4;i++){ const a=hsh*6+i*1.7+((x+y)%2);
      c.fillStyle=i%2?'#2f5c3a':'#3a7048';
      c.beginPath(); c.arc(cx+Math.cos(a)*r*.45,cy+Math.sin(a)*r*.45,r*(.3+hsh*.12),0,TAU); c.fill(); }
   }
  }
 }
}
function initDust(){ dust=[]; const n=clamp((W*H/5)|0,28,70);
 for(let i=0;i<n;i++)dust.push({x:Math.random()*W*T,y:Math.random()*H*T,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,r:.6+Math.random()*1.3,a:.04+Math.random()*.08,p:Math.random()*TAU}); }

/* ---------------- LEVEL LOAD / FLOW ---------------- */
function loadLevel(i,silent){
 sess++; levelIndex=i; const L=LEVELS[i];
 grid=L.map.map(r=>r.split('')); W=grid[0].length; H=grid.length;
 p={x:1,y:1,rx:1,ry:1,hidden:false,nudge:0,ndx:0,ndy:0,fx:0,fy:0};
 itemPos=null; exitPos=null;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const ch=grid[y][x];
  if(ch==='P'){p.x=x;p.y=y;p.rx=x;p.ry=y;} else if(ch==='K')itemPos={x,y}; else if(ch==='X')exitPos={x,y}; }
 hasKey=false; detection=0; spotGuard=null; rings.length=0; busy=false; shake=0;
 guards=L.guards.map((gd,gi)=>{ const sx=gd.path[0][0],sy=gd.path[0][1],nx=gd.path[1][0],ny=gd.path[1][1];
  return {x:sx,y:sy,rx:sx,ry:sy,i:gi,range:gd.range,fov:gd.fov*RAD,path:gd.path,pi:1,invest:null,
          face:Math.atan2(ny-sy,nx-sx),rface:Math.atan2(ny-sy,nx-sx),alertT:0}; });
 layout(); logEl.innerHTML=''; updateHUD(); updateMeter(); phaseUI('standby');
 if(silent)return;
 state='card'; overlay.innerHTML=cardHTML(i); overlay.classList.remove('hidden');
 const s=sess; setTimeout(()=>{ if(s===sess)finishCard(); },1700);
}
const cardHTML=i=>{ const L=LEVELS[i]; return '<div class="screen panel brk card"><div><div>'+
 '<div class="kicker">SECTOR 0'+(i+1)+' / 0'+LEVELS.length+'</div>'+
 '<h2 class="title sm" data-t="'+L.name+'">'+L.name+'</h2>'+
 '<p class="lede">'+L.tip+'</p>'+
 '<p class="hint">ENTER — SKIP · WASD/ARROWS — MOVE · SPACE — HOLD POSITION</p></div></div>'; };
function finishCard(){ if(state!=='card')return; overlay.classList.add('hidden'); state='play'; phaseUI('player'); log(LEVELS[levelIndex].tip,'info'); }

function startRun(){ sfx.ui(); run.total=0; run.totalAtLevelStart=0; loadLevel(0,false); }
function retrySector(){ run.total=run.totalAtLevelStart; loadLevel(levelIndex,false); }
function toMenu(){ sess++; busy=false; detection=0; updateMeter(); spotGuard=null; guards.forEach(g=>g.invest=null); showMenu(); }

async function winLevel(){ state='cleared'; phaseUI('standby'); flash('cyan'); sfx.clear();
 log('Sector cleared at T+'+run.total+'.','good'); const s=sess;
 if(levelIndex===LEVELS.length-1){ await sleep(850); if(s!==sess)return; sfx.win(); showWin(); return; }
 await sleep(900); if(s!==sess)return;
 run.totalAtLevelStart=run.total; loadLevel(levelIndex+1,false); }

function doCaught(reason){ state='caught'; busy=true; shake=16; flash('red'); sfx.caught(); phaseUI('standby');
 const s=sess; setTimeout(()=>{ if(s===sess)showCaught(reason); },950); }

/* ---------------- HUD / FEEDBACK ---------------- */
function updateHUD(){
 sectNoEl.textContent='SECTOR 0'+(levelIndex+1)+' / 0'+LEVELS.length;
 sectNameEl.textContent=LEVELS[levelIndex].name;
 turnsEl.textContent='T+'+String(run.total).padStart(2,'0');
 objChip.textContent=hasKey?'◆ SECURED':'◆ ARTIFACT'; objChip.className='chip'+(hasKey?' gold':'');
 exitChip.textContent=hasKey?'EXIT OPEN':'EXIT SEALED'; exitChip.className='chip'+(hasKey?' open':'');
}
function updateMeter(){ pips.forEach((el,i)=>el.classList.toggle('on',i<detection));
 exposeEl.style.opacity=detection?(0.25+detection*0.22):0; exposeEl.classList.toggle('live',detection>0); }
function phaseUI(mode){
 if(mode==='player'){ phaseEl.textContent='YOUR MOVE'; phaseEl.className='';
  covEl.textContent=p&&p.hidden?'● IN COVER':'○ IN THE OPEN'; covEl.classList.toggle('on',!!(p&&p.hidden)); }
 else if(mode==='guards'){ phaseEl.textContent='GUARDS ADVANCING'; phaseEl.className='gd'; }
 else { phaseEl.textContent='STAND BY'; phaseEl.className='dim'; covEl.textContent=''; }
}
function log(txt,cls){ const el=document.createElement('p'); if(cls)el.className=cls; el.textContent=txt;
 logEl.appendChild(el); while(logEl.children.length>4)logEl.removeChild(logEl.firstChild); }
function flash(c){ const m={red:'rgba(255,60,72,.35)',amber:'rgba(255,180,70,.3)',cyan:'rgba(90,240,220,.2)'};
 flashEl.style.setProperty('--fc',m[c]||'rgba(255,255,255,.25)');
 flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }

/* ---------------- PATHFIND / VISION ---------------- */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function inB(x,y){ return x>=0&&y>=0&&x<W&&y<H; }
function stepToward(g,tx,ty){
 if(!inB(tx,ty))return null;
 const start=g.x+','+g.y;
 if(start===tx+','+ty)return null;
 const prev=new Map([[start,null]]); let q=[[g.x,g.y]];
 while(q.length){
  const cur=q.shift(), x=cur[0], y=cur[1];
  if(x===tx&&y===ty){ let k=x+','+y; for(;;){ const pr=prev.get(k); if(pr===null)return null; if(pr===start)return k.split(',').map(Number); k=pr; } }
  for(const d of DIRS){ const nx=x+d[0],ny=y+d[1],nk=nx+','+ny;
   if(prev.has(nk)||!inB(nx,ny))continue; const c=grid[ny][nx];
   if(c==='#'||c==='C')continue; prev.set(nk,x+','+y); q.push([nx,ny]); }
 }
 return null;
}
function losClear(x0,y0,x1,y1){ let x=x0,y=y0; const dx=Math.abs(x1-x),dy=-Math.abs(y1-y);
 const sx=x<x1?1:-1,sy=y<y1?1:-1; let err=dx+dy;
 while(!(x===x1&&y===y1)){ const e2=2*err; if(e2>=dy){err+=dy;x+=sx;} if(e2<=dx){err+=dx;y+=sy;}
  if(x===x0&&y===y0)continue; const c=grid[y][x]; if(c==='#'||c==='C')return false; }
 return true; }
function canSee(g){ if(p.hidden)return false;
 const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy); if(d===0||d>g.range)return false;
 let da=Math.atan2(dy,dx)-g.face; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
 if(Math.abs(da)>g.fov/2)return false; return losClear(g.x,g.y,p.x,p.y); }

/* ---------------- TURN ENGINE ---------------- */
function setFace(g,dx,dy){ g.face=Math.atan2(dy,dx); }
function guardAct(g){
 const ox0=g.x,oy0=g.y;
 if(g.invest){
  const t=g.invest;
  if(t.steps<=0||(g.x===t.x&&g.y===t.y)){ g.invest=null; log('A patrol searched and found nothing.','warn'); return; }
  const n=stepToward(g,t.x,t.y);
  if(n){ if(n[0]===p.x&&n[1]===p.y){ doCaught('bump'); return; }
   g.x=n[0];g.y=n[1]; setFace(g,g.x-ox0,g.y-oy0); t.steps--; } else t.steps--;
 } else {
  let wp=g.path[g.pi];
  if(g.x===wp[0]&&g.y===wp[1])g.pi=(g.pi+1)%g.path.length;
  const tg=g.path[g.pi], n=stepToward(g,tg[0],tg[1]);
  if(n){ g.x=n[0];g.y=n[1]; setFace(g,g.x-ox0,g.y-oy0); }
 }
}
async function guardsPhase(quiet){
 phaseUI('guards'); const s=sess;
 if(!quiet){ for(const g of guards){ const d=Math.max(Math.abs(g.x-p.x),Math.abs(g.y-p.y));
  if(d<=3&&!g.invest){ g.invest={x:p.x,y:p.y,steps:3}; g.alertT=1; sfx.heard(); log('A guard heard something nearby.','warn'); } } }
 for(const g of guards){ await sleep(170); if(s!==sess||state!=='play')return;
  guardAct(g); if(state!=='play')return; sfx.step(); }
 await sleep(210); if(s!==sess||state!=='play')return;
 let seen=null; for(const g of guards){ if(canSee(g)){seen=g;break;} }
 if(seen){ spotGuard=seen; detection=Math.min(3,detection+1); updateMeter();
  sfx.spotted(detection); flash('amber'); shake=Math.max(shake,7);
  const lx=p.x,ly=p.y; for(const g of guards){ g.invest={x:lx,y:ly,steps:6}; g.alertT=1; }
  log('SPOTTED — exposure '+detection+'/3','bad');
  if(detection>=3){ doCaught('seen'); return; }
 } else { spotGuard=null;
  if(detection>0){ detection--; updateMeter(); if(detection===0)log('They lost sight of you.','good'); } }
}
function endTurn(){ if(state!=='play')return; run.total++; updateHUD(); busy=false; phaseUI('player'); }

async function playerMove(dx,dy){
 if(state!=='play'||busy)return;
 const nx=p.x+dx,ny=p.y+dy;
 if(!inB(nx,ny)||grid[ny][nx]==='#'){ sfx.blocked(); p.nudge=1;p.ndx=dx;p.ndy=dy; return; }
 if(grid[ny][nx]==='X'&&!hasKey){ log('The exit is sealed — secure the artifact first.','warn'); sfx.blocked(); return; }
 if(guards.some(g=>g.x===nx&&g.y===ny)){ log('A guard is in the way.','warn'); sfx.blocked(); return; }
 busy=true; spotGuard=null;
 const ox0=p.x,oy0=p.y; p.fx=dx;p.fy=dy; p.x=nx;p.y=ny;
 rings.push({x:ox0,y:oy0,t0:tNow}); sfx.move();
 if(grid[ny][nx]==='K'){ hasKey=true; updateHUD(); sfx.pickup(); log('Artifact secured — head for the exit.','good'); }
 p.hidden=grid[ny][nx]==='C';
 if(grid[ny][nx]==='X'&&hasKey){ winLevel(); return; }
 const s=sess; await guardsPhase(false); if(s!==sess)return; endTurn();
}
async function waitTurn(){
 if(state!=='play'||busy)return; busy=true; spotGuard=null;
 sfx.wait(); log('You hold your breath.','info');
 const s=sess; await guardsPhase(true); if(s!==sess)return; endTurn();
}

/* ---------------- MENU DEMO ---------------- */
function demoStep(){ for(const g of guards){ let wp=g.path[g.pi];
 if(g.x===wp[0]&&g.y===wp[1])g.pi=(g.pi+1)%g.path.length;
 const tg=g.path[g.pi], n=stepToward(g,tg[0],tg[1]);
 if(n){ const a=g.x,b=g.y; g.x=n[0];g.y=n[1]; setFace(g,g.x-a,g.y-b); } } }

/* ---------------- DRAWING ---------------- */
function drawCone(g,t){
 const cx=(g.rx+.5)*T,cy=(g.ry+.5)*T,R=g.range*T*(1+Math.sin(t*6+g.i*2.3)*.025),half=g.fov/2;
 const steps=Math.max(10,Math.round(g.fov/(RAD*4)));
 ctx.beginPath(); ctx.moveTo(cx,cy);
 for(let i=0;i<=steps;i++){ const a=g.rface-half+g.fov*(i/steps); let d=0;
  while(d<R){ d+=T*.12; const tx=Math.floor((cx+Math.cos(a)*d)/T),ty=Math.floor((cy+Math.sin(a)*d)/T);
   if(!inB(tx,ty))break; const c=grid[ty][tx]; if(c==='#'||c==='C')break; }
  d=Math.min(d,R); ctx.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d); }
 ctx.closePath();
 const gr=ctx.createRadialGradient(cx,cy,T*.15,cx,cy,Math.max(1,R));
 gr.addColorStop(0,'rgba(255,196,90,.4)'); gr.addColorStop(.65,'rgba(255,178,66,.16)'); gr.addColorStop(1,'rgba(255,170,60,0)');
 ctx.fillStyle=gr; ctx.fill();
}
function drawExit(t){
 if(!exitPos)return; const x=(exitPos.x+.5)*T,y=(exitPos.y+.5)*T,r=T*.34,open=hasKey,col=open?'89,224,139':'120,140,160';
 ctx.save();
 if(open){ ctx.globalCompositeOperation='lighter'; const a=.2+.08*Math.sin(t*3);
  const gg=ctx.createRadialGradient(x,y,0,x,y,r*2.6); gg.addColorStop(0,'rgba('+col+','+a+')'); gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r*2.6,0,TAU); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
 ctx.strokeStyle='rgba('+col+',.9)'; ctx.lineWidth=2;
 if(open){ ctx.setLineDash([5,4]); ctx.lineDashOffset=-t*14; }
 ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); ctx.setLineDash([]);
 const cr=T*.13;
 for(let i=0;i<2;i++){ const yy=y+T*.12-i*T*.17+(open?Math.sin(t*3)*2:0);
  ctx.beginPath(); ctx.moveTo(x-cr,yy+cr*.7); ctx.lineTo(x,yy-cr*.4); ctx.lineTo(x+cr,yy+cr*.7); ctx.stroke(); }
 if(!open){ ctx.fillStyle='rgba('+col+',.9)'; ctx.fillRect(x-5,y+2,10,7);
  ctx.beginPath(); ctx.arc(x,y+2,3.5,Math.PI,0); ctx.lineWidth=1.5; ctx.stroke(); }
 ctx.restore();
}
function drawArtifact(t){
 if(!itemPos)return; const x=(itemPos.x+.5)*T,y=(itemPos.y+.5)*T+Math.sin(t*2.2)*T*.07,r=T*.26;
 ctx.save(); ctx.globalCompositeOperation='lighter';
 const gg=ctx.createRadialGradient(x,y,0,x,y,r*3); gg.addColorStop(0,'rgba(255,215,106,.3)'); gg.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r*3,0,TAU); ctx.fill(); ctx.globalCompositeOperation='source-over';
 ctx.translate(x,y); ctx.rotate(Math.PI/4);
 const s=r*.72; ctx.fillStyle='#ffd76a'; ctx.fillRect(-s,-s,s*2,s*2);
 ctx.strokeStyle='#fff3c9'; ctx.lineWidth=1.5; ctx.strokeRect(-s*.5,-s*.5,s,s);
 if(Math.sin(t*1.7)>.93){ ctx.rotate(-Math.PI/4); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-r,0);ctx.lineTo(r,0); ctx.moveTo(0,-r);ctx.lineTo(0,r); ctx.stroke(); }
 ctx.restore();
}
function drawGuard(g,t){
 const x=(g.rx+.5)*T,y=(g.ry+.5)*T,r=T*.34,al=g.alertT;
 const R=Math.round(lerp(247,255,al)),G=Math.round(lerp(168,64,al)),B=Math.round(lerp(60,92,al));
 ctx.save(); ctx.globalCompositeOperation='lighter';
 const gg=ctx.createRadialGradient(x,y,0,x,y,r*2.4); gg.addColorStop(0,'rgba('+R+','+G+','+B+',.18)'); gg.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r*2.4,0,TAU); ctx.fill(); ctx.restore();
 ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle='rgb('+R+','+G+','+B+')'; ctx.fill();
 ctx.lineWidth=2; ctx.strokeStyle='rgba(20,12,4,.7)'; ctx.stroke();
 ctx.save(); ctx.translate(x,y); ctx.rotate(g.rface);
 ctx.beginPath(); ctx.arc(0,0,r*.72,-.55,.55); ctx.lineWidth=3; ctx.strokeStyle='rgba(255,240,210,.9)'; ctx.stroke(); ctx.restore();
 if(g.invest){ const bob=Math.sin(t*6+g.i)*2;
  ctx.font='bold '+Math.round(T*.5)+'px ui-monospace,Menlo,monospace'; ctx.textAlign='center';
  ctx.fillStyle=al>.2?'#ff8d97':'#ffd08a'; ctx.fillText('!',x,y-r-6+bob); }
}
function drawPlayer(t){
 if(!p)return; let x=(p.rx+.5)*T,y=(p.ry+.5)*T; const r=T*.3;
 if(p.nudge>0){ x+=p.ndx*4*p.nudge; y+=p.ndy*4*p.nudge; }
 ctx.save();
 if(!p.hidden){ ctx.globalCompositeOperation='lighter';
  const a=.16+.06*Math.sin(t*3), gg=ctx.createRadialGradient(x,y,0,x,y,r*3.2);
  gg.addColorStop(0,'rgba(70,240,215,'+a+')'); gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r*3.2,0,TAU); ctx.fill(); ctx.globalCompositeOperation='source-over'; }
 ctx.globalAlpha=p.hidden?.65:1;
 ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle='#4df0d8'; ctx.fill();
 ctx.lineWidth=2; ctx.strokeStyle='rgba(6,30,26,.8)'; ctx.stroke();
 ctx.beginPath(); ctx.arc(x-r*.25,y-r*.25,r*.3,0,TAU); ctx.fillStyle='#eafffa'; ctx.fill();
 if(!p.hidden&&(p.fx||p.fy)){ ctx.strokeStyle='rgba(234,255,250,.9)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+p.fx*r*.5,y+p.fy*r*.5); ctx.lineTo(x+p.fx*r*1.25,y+p.fy*r*1.25); ctx.stroke(); }
 if(p.hidden){ ctx.setLineDash([4,5]); ctx.lineDashOffset=-t*18;
  ctx.strokeStyle='rgba(70,240,215,.5)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,r*1.6,0,TAU); ctx.stroke(); ctx.setLineDash([]); }
 ctx.restore();
}
function draw(t,dt){
 const w=cv.width/DPR,h=cv.height/DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 ctx.fillStyle='#060a0e'; ctx.fillRect(0,0,w,h);
 if(!grid||!staticCv)return;
 let sx=0,sy=0;
 if(shake>.4){ sx=(Math.random()-.5)*shake; sy=(Math.random()-.5)*shake; shake*=Math.pow(.02,dt); } else shake=0;
 ctx.save(); ctx.translate(ox+sx,oy+sy);
 ctx.font='10px ui-monospace,Menlo,Consolas,monospace'; ctx.fillStyle='rgba(130,175,210,.28)'; ctx.textAlign='center';
 for(let x=0;x<W;x++)ctx.fillText(String(x).padStart(2,'0'),x*T+T/2,-8);
 ctx.textAlign='right';
 for(let y=0;y<H;y++)ctx.fillText(String(y).padStart(2,'0'),-8,y*T+T/2+3);
 ctx.drawImage(staticCv,0,0,W*T,H*T);
 ctx.strokeStyle='rgba(100,170,210,.16)'; ctx.lineWidth=1; ctx.strokeRect(-.5,-.5,W*T+1,H*T+1);
 drawExit(t); if(!hasKey)drawArtifact(t);
 ctx.globalCompositeOperation='lighter';
 for(const g of guards)drawCone(g,t);
 for(let i=rings.length-1;i>=0;i--){ const r=rings[i],age=t-r.t0;
  if(age>.75){rings.splice(i,1);continue;}
  ctx.strokeStyle='rgba(150,235,255,'+(.5*(1-age/.75)).toFixed(3)+')'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc((r.x+.5)*T,(r.y+.5)*T,age*4*T,0,TAU); ctx.stroke(); }
 for(const d of dust){ d.x+=d.vx*dt; d.y+=d.vy*dt;
  if(d.x<0)d.x+=W*T; if(d.x>W*T)d.x-=W*T; if(d.y<0)d.y+=H*T; if(d.y>H*T)d.y-=H*T;
  ctx.fillStyle='rgba(170,220,255,'+(d.a*(.6+.4*Math.sin(t*1.3+d.p))).toFixed(3)+')';
  ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,TAU); ctx.fill(); }
 ctx.globalCompositeOperation='source-over';
 for(const g of guards)drawGuard(g,t);
 if(spotGuard&&state==='play'){ const g=spotGuard;
  ctx.save(); ctx.strokeStyle='rgba(255,70,90,.85)'; ctx.lineWidth=2;
  ctx.setLineDash([7,6]); ctx.lineDashOffset=-t*40;
  ctx.beginPath(); ctx.moveTo((g.rx+.5)*T,(g.ry+.5)*T); ctx.lineTo((p.rx+.5)*T,(p.ry+.5)*T); ctx.stroke(); ctx.restore(); }
 drawPlayer(t);
 ctx.restore();
}
function tick(now){
 requestAnimationFrame(tick);
 const t=now/1000; tNow=t; let dt=t-lastT; lastT=t; if(dt>.1)dt=.1;
 if(p){ const f=1-Math.exp(-dt*13); p.rx=lerp(p.rx,p.x,f); p.ry=lerp(p.ry,p.y,f); p.nudge=Math.max(0,p.nudge-dt*4); }
 for(const g of guards){ const f=1-Math.exp(-dt*13);
  g.rx=lerp(g.rx,g.x,f); g.ry=lerp(g.ry,g.y,f); g.rface=lerpAng(g.rface,g.face,f);
  g.alertT=Math.max(0,g.alertT-dt*.8); }
 if(state==='menu'&&now-lastDemo>650){ lastDemo=now; demoStep(); }
 draw(t,dt);
}

/* ---------------- SCREENS ---------------- */
function tickClock(){ const el=$('clock'); if(!el)return; const d=new Date();
 el.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':'); }
function showMenu(){
 state='menu';
 overlay.innerHTML='<div class="screen menu"><div class="sweep"></div>'+
 '<div class="feedbar"><span><span class="rec"></span>NIGHT OPS FEED — CAM 0'+(levelIndex+1)+'</span><span id="clock">--:--:--</span></div>'+
 '<div class="brief">'+
 '<div class="kicker">TURN-BASED STEALTH HEIST · '+LEVELS.length+' SECTORS</div>'+
 '<h2 class="title" data-t="GHOSTLINE">GHOSTLINE</h2>'+
 '<p class="lede">Every step is a turn. Guards hold their cones; you hold your breath. Slip the patrols, lift the artifact from each sector, and vanish before exposure hits three.</p>'+
 '<div class="ctlgrid">'+
 '<span>MOVE</span><span><kbd>W A S D</kbd> / <kbd>← ↑ ↓ →</kbd></span>'+
 '<span>HOLD POSITION</span><span><kbd>SPACE</kbd></span>'+
 '<span>RETRY SECTOR</span><span><kbd>R</kbd></span>'+
 '<span>SOUND</span><span><kbd>M</kbd></span></div>'+
 '<div class="row"><button class="btn" id="beginBtn">BEGIN INFILTRATION</button><span class="best" id="bestLine"></span></div>'+
 '<p class="await">&gt; AWAITING OPERATIVE<span class="caret">_</span></p></div></div>';
 overlay.classList.remove('hidden');
 $('beginBtn').addEventListener('click',()=>{ initAudio(); startRun(); });
 const b=getBest(); $('bestLine').textContent=b?('BEST RUN — '+b+' TURNS'):'NO RECORDS ON FILE';
 tickClock();
}
function showCaught(reason){
 overlay.innerHTML='<div class="screen panel brk danger">'+
 '<div class="kicker red">SIGNAL LOST</div>'+
 '<h2 class="title sm" data-t="COMPROMISED">COMPROMISED</h2>'+
 '<p class="lede">'+(reason==='bump'?'A guard collided with you in the dark.':'Exposure reached three — the patrol closed in.')+'</p>'+
 '<div class="stats"><span>SECTOR<b>0'+(levelIndex+1)+' / 0'+LEVELS.length+'</b></span><span>TURNS USED<b>'+run.total+'</b></span><span>SECTORS CLEARED<b>'+levelIndex+'</b></span></div>'+
 '<div class="row"><button class="btn red" id="retryBtn">RETRY SECTOR</button><button class="btn ghost" id="menuBtn">ABORT TO MENU</button></div>'+
 '<p class="hint">R / ENTER — RETRY</p></div>';
 overlay.classList.remove('hidden');
 $('retryBtn').addEventListener('click',()=>{ initAudio(); retrySector(); });
 $('menuBtn').addEventListener('click',toMenu);
}
function showWin(){
 state='win'; const b=getBest(); let rec=false;
 if(b===null||run.total<b){ setBest(run.total); rec=true; }
 overlay.innerHTML='<div class="screen panel brk gold">'+
 '<div class="kicker">MISSION COMPLETE</div>'+
 '<h2 class="title sm" data-t="GHOSTLINE">GHOSTLINE</h2>'+
 '<p class="lede">Three sectors, one artifact each — and not a single alarm. You vanished into the night.</p>'+
 '<div class="stats"><span>TOTAL TURNS<b>'+run.total+'</b></span><span>PRIOR BEST<b>'+(b??'—')+'</b></span>'+(rec?'<span class="badge">NEW RECORD</span>':'')+'</div>'+
 '<div class="row"><button class="btn" id="againBtn">RUN IT BACK</button><button class="btn ghost" id="menuBtn2">MENU</button></div>'+
 '<p class="hint">R / ENTER — NEW RUN</p></div>';
 overlay.classList.remove('hidden');
 $('againBtn').addEventListener('click',()=>{ initAudio(); startRun(); });
 $('menuBtn2').addEventListener('click',toMenu);
}

/* ---------------- INPUT ---------------- */
window.addEventListener('keydown',e=>{
 const k=(e.key||'').toLowerCase();
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 initAudio();
 if(k==='m'){ muted=!muted; sndEl.textContent=muted?'SND OFF':'SND ON'; sndEl.classList.toggle('off',muted); return; }
 if(state==='menu'){ if(k==='enter'||k===' ')startRun(); return; }
 if(state==='card'){ if(k==='enter')finishCard(); return; }
 if(state==='caught'){ if(k==='r'||k==='enter')retrySector(); return; }
 if(state==='win'){ if(k==='r'||k==='enter')startRun(); return; }
 if(state!=='play'||busy)return;
 if(k==='r'){ retrySector(); return; }
 const mv={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
 if(mv)playerMove(mv[0],mv[1]); else if(k===' ')waitTurn();
});
cv.addEventListener('pointerdown',e=>{
 initAudio(); if(state!=='play'||busy)return;
 const r=cv.getBoundingClientRect();
 const tx=Math.floor((e.clientX-r.left-ox)/T), ty=Math.floor((e.clientY-r.top-oy)/T);
 const dx=tx-p.x,dy=ty-p.y;
 if(Math.abs(dx)+Math.abs(dy)===1)playerMove(dx,dy);
});
window.addEventListener('resize',layout);

/* ---------------- BOOT ---------------- */
loadLevel(0,true); state='menu'; showMenu();
setInterval(tickClock,1000);
requestAnimationFrame(t=>{ lastT=t/1000; tick(t); });
})();
