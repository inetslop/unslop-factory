<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pong Snake</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060b}
  #g{position:fixed;inset:0;display:block;touch-action:none;cursor:pointer}
  .crt{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0px,rgba(255,255,255,.03) 1px,transparent 1px,transparent 3px)}
  .crt::before{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 48%,transparent 52%,rgba(0,0,0,.5) 100%)}
  .crt::after{content:"";position:absolute;left:0;right:0;height:22vh;top:-22vh;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.025),transparent);
    animation:sweep 7s linear infinite}
  @keyframes sweep{to{transform:translateY(144vh)}}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="crt"></div>
<script>
'use strict';
/* ================= PONG SNAKE — a snake game on a pong court ================= */
const cv=document.getElementById('g'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,minD=0;
let frame=16,bw=5,cx0=0,cy0=0,cw=0,ch=0;      // court inner rect
let cell=24,cols=20,rows=14,ox=0,oy=0;         // grid
let padH=90,padW=10;
let bgc=null;

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* ---------- blocky 5x7 font (pong style) ---------- */
const FONT={
'0':['01110','10001','10011','10101','11001','10001','01110'],
'1':['00100','01100','00100','00100','00100','00100','01110'],
'2':['01110','10001','00001','00010','00100','01000','11111'],
'3':['11110','00001','00001','01110','00001','00001','11110'],
'4':['00010','00110','01010','10010','11111','00010','00010'],
'5':['11111','10000','11110','00001','00001','10001','01110'],
'6':['00110','01000','10000','11110','10001','10001','01110'],
'7':['11111','00001','00010','00100','01000','01000','01000'],
'8':['01110','10001','10001','01110','10001','10001','01110'],
'9':['01110','10001','10001','01111','00001','00010','01100'],
'A':['01110','10001','10001','11111','10001','10001','10001'],
'B':['11110','10001','10001','11110','10001','10001','11110'],
'C':['01110','10001','10000','10000','10000','10001','01110'],
'D':['11100','10010','10001','10001','10001','10010','11100'],
'E':['11111','10000','10000','11110','10000','10000','11111'],
'F':['11111','10000','10000','11110','10000','10000','10000'],
'G':['01110','10001','10000','10111','10001','10001','01111'],
'H':['10001','10001','10001','11111','10001','10001','10001'],
'I':['11111','00100','00100','00100','00100','00100','11111'],
'K':['10001','10010','10100','11000','10100','10010','10001'],
'L':['10000','10000','10000','10000','10000','10000','11111'],
'M':['10001','11011','10101','10101','10001','10001','10001'],
'N':['10001','11001','10101','10011','10001','10001','10001'],
'O':['01110','10001','10001','10001','10001','10001','01110'],
'P':['11110','10001','10001','11110','10000','10000','10000'],
'R':['11110','10001','10001','11110','10100','10010','10001'],
'S':['01111','10000','10000','01110','00001','00001','11110'],
'T':['11111','00100','00100','00100','00100','00100','00100'],
'U':['10001','10001','10001','10001','10001','10001','01110'],
'V':['10001','10001','10001','10001','10001','01010','00100'],
'W':['10001','10001','10001','10101','10101','11011','10001'],
'Y':['10001','10001','01010','00100','00100','00100','00100'],
'!':['00100','00100','00100','00100','00100','00000','00100'],
'-':['00000','00000','00000','11111','00000','00000','00000'],
'+':['00000','00100','00100','11111','00100','00100','00000']};
function gtext(t,cx,y,u,color,alpha,align){
  t=(''+t).toUpperCase();
  if(alpha===undefined)alpha=1; if(align===undefined)align='center';
  const wFull=t.length*6*u-u;
  let x=(align==='center')?cx-wFull/2:(align==='right'?cx-wFull:cx);
  ctx.globalAlpha=alpha;ctx.fillStyle=color;
  const g=Math.max(0.4,u*0.1);
  for(let i=0;i<t.length;i++){
    const gl=FONT[t[i]];
    if(gl)for(let r=0;r<7;r++){const row=gl[r];
      for(let c=0;c<5;c++)if(row[c]==='1')ctx.fillRect(x+c*u+g,y+r*u+g,u-2*g,u-2*g);}
    x+=6*u;
  }
  ctx.globalAlpha=1;
}

/* ---------- audio (Web Audio, gesture-gated) ---------- */
let AC=null,muted=false,unlocked=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC;}
function beep(f,d,type,v,dl,slideTo){
  if(!unlocked||muted)return;const a=ac();if(!a)return;
  d=d||0.07;type=type||'square';v=v||0.14;dl=dl||0;
  const t0=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+d);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.03);
}
const sPaddle=o=>beep(280+520*Math.abs(o),0.05,'square',0.16);
const sWall=()=>beep(150,0.04,'triangle',0.1);
const sEat=()=>{beep(523,0.06,'square',0.16);beep(784,0.07,'square',0.16,0.06);beep(1047,0.09,'square',0.14,0.12);};
const sOver=()=>[392,330,262,196].forEach((f,i)=>beep(f,0.14,'square',0.16,i*0.13));
const sStart=()=>[523,659,784,1047].forEach((f,i)=>beep(f,0.08,'square',0.15,i*0.07));
const sLevel=()=>{beep(880,0.06,'square',0.12);beep(1318,0.09,'square',0.12,0.06);};
const sDeny=()=>beep(90,0.04,'square',0.05);

/* ---------- persistence ---------- */
function loadBest(){try{return +localStorage.getItem('pongSnakeBest')||0;}catch(e){return 0;}}
function saveBest(){try{localStorage.setItem('pongSnakeBest',best);}catch(e){}}

/* ---------- state ---------- */
let state='menu';                       // menu | playing | paused | dying | over
let snake=[],preStep=[],dir={x:1,y:0},dirQueue=[];
let stepT=0,stepTime=112,grow=0;
const ball={x:0,y:0,vx:0,vy:0,speed:300,sz:10,trail:[]};
let pads=[];
let score=0,best=loadBest(),newBest=false;
let parts=[],pops=[];
let shake=0,flashR=0,flashW=0,dieT=0,popT=0;
let tNow=0,last=performance.now();

/* ---------- layout ---------- */
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;minD=Math.min(W,H);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  frame=Math.max(12,Math.round(minD*0.03));
  bw=Math.max(4,Math.round(frame*0.42));
  cx0=frame+bw/2;cy0=frame+bw/2;cw=W-2*(frame+bw/2);ch=H-2*(frame+bw/2);
  cell=Math.max(15,Math.floor(minD/26));
  cols=Math.max(10,Math.floor((W-frame*2-30)/cell));
  rows=Math.max(8,Math.floor((H-frame*2-70)/cell));
  ox=(W-cols*cell)/2;oy=(H-rows*cell)/2+cell*0.6;
  ball.sz=clamp(cell*0.4,7,14);
  padH=clamp(minD*0.16,56,120);padW=Math.max(8,frame*0.5);
  layoutPads();buildBg();
  for(const s of snake){s.x=((s.x%cols)+cols)%cols;s.y=((s.y%rows)+rows)%rows;}
  ball.x=clamp(ball.x,cx0+ball.sz/2,cx0+cw-ball.sz/2);
  ball.y=clamp(ball.y,cy0+ball.sz/2,cy0+ch-ball.sz/2);
}
function layoutPads(){
  pads=[{side:'L',x:cx0+14,w:padW,h:padH,cy:H/2},
        {side:'R',x:cx0+cw-14-padW,w:padW,h:padH,cy:H/2}];
  for(const p of pads)p.cy=clamp(p.cy,cy0+p.h/2+2,cy0+ch-p.h/2-2);
}
function buildBg(){
  bgc=document.createElement('canvas');bgc.width=cv.width;bgc.height=cv.height;
  const b=bgc.getContext('2d');b.setTransform(DPR,0,0,DPR,0,0);
  b.fillStyle='#04060b';b.fillRect(0,0,W,H);
  let gr=b.createRadialGradient(W/2,H/2,0,W/2,H/2,minD*0.85);
  gr.addColorStop(0,'rgba(140,170,255,0.055)');gr.addColorStop(1,'rgba(0,0,0,0)');
  b.fillStyle=gr;b.fillRect(0,0,W,H);
  const sp=Math.max(24,cell*0.9);
  b.fillStyle='rgba(230,238,255,0.05)';
  for(let x=sp/2;x<W;x+=sp)for(let y=sp/2;y<H;y+=sp)b.fillRect(x-1,y-1,2,2);
}

/* ---------- game setup ---------- */
function makeSnake(len){
  const hx=Math.floor(cols*0.3),hy=Math.floor(rows/2),a=[];
  for(let i=0;i<len;i++)a.push({x:hx-i,y:hy});return a;
}
function serveBall(){
  const base=Math.max(190,minD*0.42);
  ball.speed=Math.min(base*1.85,base+score*6);
  ball.x=W/2;ball.y=H/2;
  const hx=ox+(snake[0].x+0.5)*cell;
  const right=hx<W/2?1:-1;
  const a=(0.42+Math.random()*0.55)*(Math.random()<0.5?1:-1);
  ball.vx=Math.cos(a)*ball.speed*right;
  ball.vy=Math.sin(a)*ball.speed;
  ball.trail.length=0;
}
function startGame(){
  score=0;newBest=false;grow=0;dirQueue=[];parts.length=0;pops.length=0;
  snake=makeSnake(4);preStep=snake.map(s=>({x:s.x,y:s.y}));
  dir={x:1,y:0};stepT=0;serveBall();state='playing';sStart();
}
function resetAttract(){
  grow=0;dirQueue=[];snake=makeSnake(5);preStep=snake.map(s=>({x:s.x,y:s.y}));
  dir={x:1,y:0};stepT=0;serveBall();
}

/* ---------- snake logic ---------- */
function queueDir(x,y){
  if(!x&&!y)return;
  const ref=dirQueue.length?dirQueue[dirQueue.length-1]:dir;
  if(x===-ref.x&&y===-ref.y){sDeny();return;}
  if(x===ref.x&&y===ref.y)return;
  if(dirQueue.length<3)dirQueue.push({x,y});
}
function step(){
  while(dirQueue.length){const d=dirQueue.shift();
    if(!(d.x===-dir.x&&d.y===-dir.y)){dir=d;break;}}
  const hx=(snake[0].x+dir.x+cols)%cols,hy=(snake[0].y+dir.y+rows)%rows;
  const body=grow>0?snake:snake.slice(0,-1);
  for(const s of body)if(s.x===hx&&s.y===hy){die();return;}
  preStep=snake.map(s=>({x:s.x,y:s.y}));
  snake.unshift({x:hx,y:hy});
  if(grow>0)grow--;else snake.pop();
}
function aiPick(){
  const head=snake[0];
  const bx=clamp(Math.floor((ball.x-ox)/cell),0,cols-1);
  const by=clamp(Math.floor((ball.y-oy)/cell),0,rows-1);
  let bd=1e9,bestD=null;
  for(const d of [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]){
    if(d.x===-dir.x&&d.y===-dir.y)continue;
    const nx=(head.x+d.x+cols)%cols,ny=(head.y+d.y+rows)%rows;
    let dist=Math.abs(nx-bx)+Math.abs(ny-by);
    if(snake.some((s,i)=>i<snake.length-1&&s.x===nx&&s.y===ny))dist+=1000;
    if(dist<bd){bd=dist;bestD=d;}
  }
  if(bestD)dir=bestD;
}

/* ---------- ball / paddles ---------- */
function updatePads(dt){
  const sp=(state==='menu'?0.75:Math.min(1.9,1+score*0.04))*minD*0.5;
  for(const p of pads){
    const threat=(p.side==='L'&&ball.vx<0)||(p.side==='R'&&ball.vx>0);
    let target=H/2+Math.sin(tNow*0.7+p.x)*30;
    if(threat)target=ball.y;
    p.cy+=clamp(target-p.cy,-sp*dt,sp*dt);
    p.cy=clamp(p.cy,cy0+p.h/2+2,cy0+ch-p.h/2-2);
  }
}
function hitPad(p,away){
  const off=clamp((ball.y-p.cy)/(p.h/2),-1,1);
  ball.speed=Math.min(minD*0.95,ball.speed*1.045+2);
  const a=off*1.0;
  ball.vx=Math.cos(a)*ball.speed*away;
  ball.vy=Math.sin(a)*ball.speed;
  if(away>0)ball.x=p.x+p.w+ball.sz/2+0.5;else ball.x=p.x-ball.sz/2-0.5;
  sPaddle(off);shake=Math.max(shake,1.6);
  const fx=away>0?p.x+p.w:p.x;
  for(let i=0;i<7;i++)parts.push({x:fx,y:ball.y+(Math.random()-0.5)*18,
    vx:away*(60+Math.random()*200),vy:(Math.random()-0.5)*260,life:0.5,size:3,color:'#fff'});
}
function spark(x,y,n){
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-0.5)*240,vy:(Math.random()-0.5)*240,
    life:0.4,size:2+Math.random()*2,color:'#cfd8ea'});
}
function eat(){
  score++;if(score>best){best=score;newBest=true;saveBest();}
  grow+=1;popT=1;shake=Math.max(shake,4);flashW=0.15;
  const hdx=ox+(snake[0].x+0.5)*cell,hdy=oy+(snake[0].y+0.5)*cell;
  for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,sp2=40+Math.random()*220;
    parts.push({x:ball.x,y:ball.y,vx:Math.cos(a)*sp2,vy:Math.sin(a)*sp2,life:1,
      size:2+Math.random()*3,color:Math.random()<0.5?'#ffffff':'#ffd23f'});}
  parts.push({ring:true,x:ball.x,y:ball.y,r:6,life:0.7,size:3,color:'#fff'});
  pops.push({text:'+1',x:hdx,y:hdy-cell*0.6,life:1,color:'#ffd23f',u:Math.max(5,cell*0.28)});
  sEat();
  if(score%5===0){pops.push({text:'FASTER!',x:W/2,y:H*0.32,life:1.4,color:'#ffd23f',u:Math.max(6,cell*0.34)});sLevel();}
  serveBall();
}
function die(){
  if(state==='menu'){resetAttract();return;}
  state='dying';dieT=0;shake=13;flashR=0.55;sOver();
  const hdx=ox+(snake[0].x+0.5)*cell,hdy=oy+(snake[0].y+0.5)*cell;
  for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,sp2=60+Math.random()*260;
    parts.push({x:hdx,y:hdy,vx:Math.cos(a)*sp2,vy:Math.sin(a)*sp2,life:1,
      size:2+Math.random()*4,color:Math.random()<0.5?'#ff5a4e':'#ffffff'});}
}
function updateBall(dt){
  const half=ball.sz/2;
  const dist=ball.speed*dt,n=Math.max(1,Math.ceil(dist/(half*1.1)));
  const hdx=ox+(snake[0].x+0.5)*cell,hdy=oy+(snake[0].y+0.5)*cell;
  const eatR=(cell*0.62)*(cell*0.62);
  for(let i=0;i<n;i++){
    ball.x+=ball.vx*dt/n;ball.y+=ball.vy*dt/n;
    if(ball.y-half<cy0){ball.y=cy0+half;ball.vy=Math.abs(ball.vy);sWall();spark(ball.x,cy0,4);}
    else if(ball.y+half>cy0+ch){ball.y=cy0+ch-half;ball.vy=-Math.abs(ball.vy);sWall();spark(ball.x,cy0+ch,4);}
    for(const p of pads){
      const top=p.cy-p.h/2,bot=p.cy+p.h/2;
      if(p.side==='L'){if(ball.vx<0&&ball.x-half<=p.x+p.w&&ball.x+half>=p.x&&ball.y+half>top&&ball.y-half<bot)hitPad(p,1);}
      else{if(ball.vx>0&&ball.x+half>=p.x&&ball.x-half<=p.x+p.w&&ball.y+half>top&&ball.y-half<bot)hitPad(p,-1);}
    }
    const dx=ball.x-hdx,dy=ball.y-hdy;
    if(dx*dx+dy*dy<eatR&&(state==='playing'||state==='menu')){eat();return;}
  }
  ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>14)ball.trail.shift();
}

/* ---------- update ---------- */
function update(dt){
  if(state==='playing'||state==='menu'){
    stepT+=dt*1000;let guard=0;
    while(stepT>=stepTime&&guard++<4&&(state==='playing'||state==='menu')){
      stepT-=stepTime;
      if(state==='menu')aiPick();
      step();
    }
  }else if(state==='dying'){
    dieT+=dt*1000;if(dieT>850)state='over';
  }
  if(state!=='paused'&&state!=='over'){updatePads(dt);updateBall(dt);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt*1.6;
    if(p.life<=0){parts.splice(i,1);continue;}
    if(p.ring)p.r+=dt*320;
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-2.5*dt);p.vy*=Math.max(0,1-2.5*dt);}}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life-=dt*0.9;p.y-=dt*26;if(p.life<=0)pops.splice(i,1);}
  shake=Math.max(0,shake-dt*26);
  flashR=Math.max(0,flashR-dt*1.3);
  flashW=Math.max(0,flashW-dt*2.2);
  popT=Math.max(0,popT-dt*3);
}

/* ---------- render ---------- */
function drawHUD(){
  const ul=clamp(minD/120,4,7),ud=clamp(minD/72,7,13);
  const ly=frame+8,ny=ly+ul*7+6;
  gtext('YOU',frame+26,ly,ul,'rgba(150,160,182,.9)',1,'left');
  ctx.save();ctx.shadowColor='rgba(255,210,63,.5)';ctx.shadowBlur=6+popT*14;
  gtext(''+score,frame+26,ny,ud,popT>0.5?'#ffffff':'#ffd23f',1,'left');
  ctx.restore();
  gtext('BEST',W-frame-26,ly,ul,'rgba(150,160,182,.9)',1,'right');
  ctx.save();ctx.shadowColor='rgba(255,210,63,.4)';ctx.shadowBlur=6;
  gtext(''+best,W-frame-26,ny,ud,'#ffd23f',1,'right');
  ctx.restore();
  gtext('PONG SNAKE',W/2,H-frame-8,clamp(minD/170,3.5,6),'rgba(120,132,158,.4)',1,'center');
}
function drawSnake(){
  if(!snake.length)return;
  const t=(state==='playing'||state==='menu')?clamp(stepT/stepTime,0,1):1;
  const dim=state==='over';
  const dyingBlink=state==='dying'&&(Math.floor(dieT/90)%2===0);
  for(let i=snake.length-1;i>=0;i--){
    const c=snake[i];
    let p=preStep[Math.min(i,preStep.length-1)]||c;
    let fx=c.x,fy=c.y;
    if(Math.abs(p.x-c.x)<=1&&Math.abs(p.y-c.y)<=1){fx=p.x+(c.x-p.x)*t;fy=p.y+(c.y-p.y)*t;}
    const x=ox+fx*cell,y=oy+fy*cell,ins=cell*0.07;
    let sz=cell-ins*2;
    ctx.globalAlpha=dim?0.35:(i===0?1:0.9-0.45*(i/snake.length));
    if(i===0){
      ctx.fillStyle=dyingBlink?'#ff5a4e':'#ffffff';
      ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=12;sz+=cell*0.06;
    }else ctx.fillStyle='#e9eef8';
    ctx.fillRect(x+ins,y+ins,sz,sz);
    ctx.shadowBlur=0;
    if(i===0){ // eyes
      const e=cell*0.14,off=cell*0.22;
      const px=dir.x!==0?dir.y:1,py=dir.x!==0?dir.x:0;
      const ex=x+cell/2+dir.x*off,ey=y+cell/2+dir.y*off;
      ctx.fillStyle='#04060b';
      ctx.fillRect(ex+px*cell*0.16-e/2,ey+py*cell*0.16-e/2,e,e);
      ctx.fillRect(ex-px*cell*0.16-e/2,ey-py*cell*0.16-e/2,e,e);
    }
  }
  ctx.globalAlpha=1;
}
function drawMenu(){
  ctx.fillStyle='rgba(4,6,11,.62)';ctx.fillRect(0,0,W,H);
  const u=clamp(Math.min(W*0.84/60,H*0.021),6,20);
  const ty=H*0.17+Math.sin(tNow*2)*u*0.35;
  gtext('PONG SNAKE',W/2+u*0.35,ty+u*0.35,u,'rgba(255,210,63,.85)');
  ctx.save();ctx.shadowColor='rgba(255,255,255,.4)';ctx.shadowBlur=10;
  gtext('PONG SNAKE',W/2,ty,u,'#f4f7ff');ctx.restore();
  const u2=clamp(u*0.4,4.5,9);
  let y=ty+7*u+u*2.0;
  gtext('A SNAKE GAME ON A PONG COURT',W/2,y,u2,'rgba(160,172,195,.95)');y+=u2*7+u2*3;
  if(best>0){gtext('YOUR BEST - '+best,W/2,y,u2,'#ffd23f');y+=u2*7+u2*3;}
  const lines=['ARROWS OR WASD - STEER','EAT THE BOUNCING BALL TO GROW',
               'DO NOT BITE YOURSELF','P PAUSE   M SOUND   R RESTART'];
  let cy=H*0.50;
  for(const L of lines){gtext(L,W/2,cy,u2,'rgba(140,152,178,.95)');cy+=u2*7+10;}
  gtext('TAP OR SWIPE ON TOUCH SCREENS',W/2,cy+4,u2*0.85,'rgba(110,122,146,.8)');
  const u3=clamp(u*0.55,7,16);
  const blink=(Math.floor(tNow*2)%2)===0;
  ctx.save();ctx.shadowColor='rgba(255,210,63,.5)';ctx.shadowBlur=8;
  gtext('PRESS ENTER TO SERVE',W/2,H*0.8,u3,'#ffd23f',blink?1:0.25);ctx.restore();
  gtext('OR TAP THE COURT',W/2,H*0.8+u3*9,clamp(u*0.3,4.5,7),'rgba(140,152,178,.8)');
}
function drawOver(){
  ctx.fillStyle='rgba(4,6,11,.68)';ctx.fillRect(0,0,W,H);
  const u=clamp(minD/48,10,26);
  gtext('GAME OVER',W/2+u*0.3,H*0.24+u*0.3,u,'rgba(120,20,16,.9)');
  ctx.save();ctx.shadowColor='rgba(255,90,78,.5)';ctx.shadowBlur=12;
  gtext('GAME OVER',W/2,H*0.24,u,'#ff6b5e');ctx.restore();
  const u2=u*0.7;
  gtext('SCORE '+score,W/2,H*0.38,u2,'#f4f7ff');
  if(newBest){const b=(Math.floor(tNow*3)%2)===0;
    ctx.save();ctx.shadowColor='rgba(255,210,63,.6)';ctx.shadowBlur=10;
    gtext('NEW BEST!',W/2,H*0.47,u2*0.8,'#ffd23f',b?1:0.3);ctx.restore();}
  else gtext('BEST '+best,W/2,H*0.47,u2*0.8,'rgba(160,172,195,.9)');
  const blink=(Math.floor(tNow*2)%2)===0;
  ctx.save();ctx.shadowColor='rgba(255,210,63,.5)';ctx.shadowBlur=8;
  gtext('PRESS ENTER TO SERVE AGAIN',W/2,H*0.62,u2*0.7,'#ffd23f',blink?1:0.25);ctx.restore();
  gtext('OR PRESS R',W/2,H*0.62+u2*6,clamp(u*0.28,4.5,8),'rgba(140,152,178,.8)');
}
function drawPaused(){
  ctx.fillStyle='rgba(4,6,11,.5)';ctx.fillRect(0,0,W,H);
  const u=clamp(minD/50,10,22);
  ctx.save();ctx.shadowColor='rgba(255,255,255,.35)';ctx.shadowBlur=10;
  gtext('PAUSED',W/2,H*0.42,u,'#f4f7ff');ctx.restore();
  gtext('P OR SPACE TO RESUME',W/2,H*0.42+u*9,clamp(u*0.35,5,10),'rgba(160,172,195,.9)');
}
function render(){
  if(bgc)ctx.drawImage(bgc,0,0,W,H);else{ctx.fillStyle='#04060b';ctx.fillRect(0,0,W,H);}
  ctx.save();
  if(shake>0)ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  // court border
  ctx.strokeStyle='#e8edf7';ctx.lineWidth=bw;
  ctx.shadowColor='rgba(200,220,255,.35)';ctx.shadowBlur=10;
  ctx.strokeRect(cx0,cy0,cw,ch);ctx.shadowBlur=0;
  // dotted net
  ctx.fillStyle='rgba(232,237,247,.32)';
  const ds=Math.max(3,bw*0.8),gap=cell*0.55;
  for(let y=cy0+gap/2;y<cy0+ch-gap/2;y+=gap)ctx.fillRect(W/2-ds/2,y,ds,ds);
  if(state!=='menu')drawHUD();
  // paddles
  for(const p of pads){ctx.fillStyle='#f4f7ff';
    ctx.shadowColor='rgba(255,255,255,.5)';ctx.shadowBlur=8;
    ctx.fillRect(p.x,p.cy-p.h/2,p.w,p.h);}
  ctx.shadowBlur=0;
  // ball trail + ball
  const tl=ball.trail;
  for(let i=0;i<tl.length;i++){const a=(i+1)/tl.length*0.3,sz=ball.sz*(0.45+0.5*i/tl.length);
    ctx.globalAlpha=a;ctx.fillStyle='#fff';
    ctx.fillRect(tl[i].x-sz/2,tl[i].y-sz/2,sz,sz);}
  ctx.globalAlpha=1;
  ctx.save();ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=14;
  ctx.fillStyle='#ffffff';
  ctx.fillRect(ball.x-ball.sz/2,ball.y-ball.sz/2,ball.sz,ball.sz);ctx.restore();
  drawSnake();
  // particles
  for(const p of parts){
    if(p.ring){ctx.globalAlpha=Math.max(0,p.life)*0.8;ctx.strokeStyle=p.color;ctx.lineWidth=3;
      ctx.strokeRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);}
    else{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;
      const s=p.size*Math.max(0.3,p.life);ctx.fillRect(p.x-s/2,p.y-s/2,s,s);}}
  ctx.globalAlpha=1;
  // floating texts
  for(const p of pops)gtext(p.text,p.x,p.y,p.u||6,p.color,Math.max(0,Math.min(1,p.life)),'center');
  ctx.restore();
  if(flashW>0){ctx.fillStyle='rgba(255,255,255,'+flashW+')';ctx.fillRect(0,0,W,H);}
  if(flashR>0){ctx.fillStyle='rgba(255,70,60,'+(flashR*0.5)+')';ctx.fillRect(0,0,W,H);}
  if(state==='menu')drawMenu();
  else if(state==='paused')drawPaused();
  else if(state==='over')drawOver();
  if(muted)gtext('MUTED',W-14,H-12,4,'rgba(160,170,190,.8)',1,'right');
}

/* ---------- input ---------- */
const KEYD={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],
            ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
window.addEventListener('keydown',e=>{
  if(!unlocked){unlocked=true;ac();}
  const code=e.code;
  if(KEYD[code]){e.preventDefault();
    if(state==='playing')queueDir(KEYD[code][0],KEYD[code][1]);return;}
  if(code==='Space'||code==='Enter'){e.preventDefault();
    if(state==='menu'||state==='over')startGame();
    else if(state==='paused')state='playing';
    else if(state==='playing'&&code==='Space')state='paused';
    return;}
  if(code==='KeyP'){if(state==='playing')state='paused';else if(state==='paused')state='playing';return;}
  if(code==='KeyR'){if(state!=='menu')startGame();return;}
  if(code==='KeyM'){muted=!muted;return;}
});
let pd=null;
cv.addEventListener('pointerdown',e=>{
  if(!unlocked){unlocked=true;ac();}
  pd={x:e.clientX,y:e.clientY};
});
window.addEventListener('pointerup',e=>{
  if(!pd)return;
  const dx=e.clientX-pd.x,dy=e.clientY-pd.y;pd=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))>26){
    if(state==='playing')queueDir(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,
                                  Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0);
    return;}
  if(state==='menu'||state==='over')startGame();
  else if(state==='paused')state='playing';
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')state='paused';});
window.addEventListener('resize',resize);

/* ---------- main loop ---------- */
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;tNow=now/1000;
  update(dt);render();
  requestAnimationFrame(tick);
}
resize();
resetAttract();
requestAnimationFrame(tick);
</script>
</body>
