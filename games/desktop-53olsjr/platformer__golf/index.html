<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Putt Peaks</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0c1d14;}
  canvas{display:block;user-select:none;-webkit-user-select:none;touch-action:none;}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
'use strict';
/* ================= CORE SETUP ================= */
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const VW=960,VH=540,GRAV=1900,BR=10;
let dpr=1,sc=1,ox=0,oy=0;
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);const w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';sc=Math.min(w/VW,h/VH);ox=(w-VW*sc)/2;oy=(h-VH*sc)/2;}
addEventListener('resize',fit);fit();

const FD=s=>`900 ${s}px 'Arial Black','Franklin Gothic Medium',Impact,sans-serif`;
const FB=(s,w=600)=>`${w} ${s}px 'Trebuchet MS','Segoe UI',Verdana,sans-serif`;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const easeOC=t=>1-Math.pow(1-t,3);
const easeOB=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const hash=n=>{const s=Math.sin(n*127.1)*43758.545;return s-Math.floor(s);};

/* ================= LEVELS ================= */
const LEVELS=[
{name:'MEADOW GAP',par:3,W:1800,sky:{top:'#79c8f2',bot:'#fdf3cf',sun:'#fff6d8'},hills:['#8cc9a0','#57a873'],
 spawn:{x:60,t:440},ball:{x:125,t:440},cup:{x:1600,y:410},
 plats:[{x:-30,y:440,w:350,h:120},{x:395,y:452,w:64,h:60,type:'rock'},{x:560,y:465,w:170,h:95},
        {x:730,y:465,w:90,h:95,type:'sand'},{x:820,y:490,w:160,h:70},{x:980,y:435,w:220,h:125},
        {x:1200,y:410,w:600,h:150,type:'green'}],
 water:[{x:320,sy:470,w:240}],lava:[],spikes:[],wind:[],movers:[]},
{name:'WINDMILL RIDGE',par:3,W:1950,sky:{top:'#8fd3f4',bot:'#eaf6d8',sun:'#fffbe0'},hills:['#9ed2a2','#4f9e6b'],
 spawn:{x:60,t:455},ball:{x:125,t:455},cup:{x:1830,y:268},
 plats:[{x:-30,y:455,w:310,h:115},{x:335,y:462,w:52,h:50,type:'rock'},{x:430,y:470,w:180,h:100},
        {x:860,y:250,w:240,h:44,type:'stone'},{x:1100,y:268,w:850,h:160,type:'green'},
        {x:1740,y:268,w:60,h:160,type:'sand'}],
 water:[{x:280,sy:478,w:150}],lava:[],spikes:[],
 wind:[{x:280,y:140,w:450,h:330,dx:520},{x:1380,y:90,w:570,h:230,dx:-520}],
 movers:[{x:690,y:340,w:100,h:26,type:'mover',mv:{axis:'y',mid:340,amp:110,period:5}}]},
{name:'THE GAUNTLET',par:4,W:2150,sky:{top:'#ffb46b',bot:'#fff0c8',sun:'#ffe9a8'},hills:['#d98a67','#8a5a4a'],
 spawn:{x:60,t:465},ball:{x:125,t:465},cup:{x:1985,y:235},
 plats:[{x:-30,y:465,w:290,h:105},{x:260,y:478,w:470,h:92},{x:730,y:478,w:80,h:92,type:'spring'},
        {x:900,y:315,w:140,h:34,type:'stone'},{x:1420,y:235,w:730,h:165,type:'green'},
        {x:1900,y:235,w:55,h:165,type:'sand'},{x:2045,y:235,w:70,h:165,type:'sand'}],
 water:[],lava:[{x:810,sy:512,w:610}],spikes:[{x:360,y:478,w:120}],
 wind:[{x:1230,y:100,w:240,h:412,dy:-2450}],
 movers:[{x:1075,y:400,w:110,h:24,type:'mover',mv:{axis:'x',mid:1075,amp:235,period:6}}]}
];
const TOTALPAR=LEVELS.reduce((a,l)=>a+l.par,0);

/* ================= STATE ================= */
let state='title',holeIdx=0,strokes=0,results=[];
let world=null,golfer=null,ball=null,SOLIDS=[],preShot=null;
let camX=0,shake=0,time=0,introT=0,sinkT=-1,flagWig=0,flashT=0,sinkFrom={x:0,y:0};
let kbAim=false,kbAngle=-0.7,kbPower=.55,charging=false,chargeT=0;
const mouse={x:480,y:270};let uiRects=[];
let particles=[],floaters=[],lastHitS=0,lavaBubbleT=0;

/* ================= STORAGE ================= */
function loadBest(){try{const v=+localStorage.getItem('puttpeaks_best');return v>0?v:0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem('puttpeaks_best',String(v));}catch(e){}}
let best=loadBest();

/* ================= AUDIO ================= */
let AC=null,master=null,musicG=null,noiseBuf=null,muted=false,mTimer=null,mStep=0,mNext=0,mi=2;
function ensureAudio(){
 if(AC)return;
 try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 musicG=AC.createGain();musicG.gain.value=.2;musicG.connect(master);
 noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
 const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 mNext=AC.currentTime+.3;mTimer=setInterval(musicTick,120);
}
function tone(o){if(!AC||muted)return;const t=(o.at||AC.currentTime)+(o.delay||0);
 const osc=AC.createOscillator(),g=AC.createGain();osc.type=o.type||'sine';
 osc.frequency.setValueAtTime(o.f,t);if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+o.dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.v||.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+o.dur);
 osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+o.dur+.05);}
function noiseS(o){if(!AC||muted)return;const t=(o.at||AC.currentTime)+(o.delay||0);
 const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 const f=AC.createBiquadFilter();f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.f||800,t);
 if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f2),t+o.dur);f.Q.value=o.q||1;
 const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.v||.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+o.dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+o.dur+.05);}
const SFX={
 click:()=>tone({f:760,dur:.06,v:.2,type:'triangle'}),
 whoosh:()=>noiseS({ft:'bandpass',f:420,f2:1500,q:1.4,dur:.18,v:.3}),
 hit:d=>{tone({f:210,f2:65,dur:.09,v:.5,type:'triangle',delay:d||0});noiseS({ft:'highpass',f:1800,dur:.04,v:.25,delay:d||0});},
 bounce:v=>tone({f:95,f2:52,dur:.08,v:Math.min(.45,v/2600)}),
 splash:()=>{noiseS({f:750,f2:180,dur:.35,v:.4});tone({f:300,f2:90,dur:.2,v:.15});},
 lava:()=>{noiseS({f:340,f2:90,dur:.5,v:.45});tone({f:75,f2:38,dur:.4,v:.35,type:'sawtooth'});},
 spike:()=>tone({f:170,f2:42,dur:.2,v:.35,type:'square'}),
 spring:()=>{tone({f:170,f2:760,dur:.24,v:.3});tone({f:340,f2:1500,dur:.2,v:.12,type:'triangle',delay:.02});},
 lip:()=>tone({f:420,f2:940,dur:.13,v:.3,type:'triangle'}),
 penalty:()=>{tone({f:112,dur:.13,v:.3,type:'square'});tone({f:88,dur:.16,v:.3,type:'square',delay:.15});},
 jump:()=>tone({f:300,f2:520,dur:.07,v:.1}),
 cup:(bonus)=>{[523,659,784,1047].forEach((f,i)=>tone({f,dur:.14,v:.3,type:'triangle',delay:i*.09}));
  if(bonus){tone({f:1319,dur:.16,v:.25,type:'triangle',delay:.42});tone({f:1568,dur:.22,v:.25,type:'triangle',delay:.52});noiseS({ft:'highpass',f:3000,dur:.5,v:.15,delay:.4});}}
};
function pluck(f,t,v){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
 o.connect(g);g.connect(musicG);o.start(t);o.stop(t+.55);}
function musicTick(){if(!AC||muted)return;
 while(mNext<AC.currentTime+.35){const s=mStep%16;
  if(s===0)pluck(130.81,mNext,.5);if(s===8)pluck(98,mNext,.5);
  if(Math.random()<.58){const sc=[261.63,293.66,329.63,392,440,523.25];mi=clamp(mi+(Math.random()<.5?-1:1)*(Math.random()<.3?2:1),0,5);pluck(sc[mi],mNext,.3);}
  mStep++;mNext+=.24;}}

/* ================= LEVEL LOAD ================= */
function loadHole(i){
 const L=LEVELS[i];world=L;strokes=0;sinkT=-1;shake=0;flashT=0;charging=false;kbAim=false;chargeT=0;flagWig=0;camX=0;
 particles=[];floaters=[];
 world.plats.forEach(p=>{p.springCd=0;p.springT=0;});
 SOLIDS=world.plats.concat(world.movers);
 const g={x:L.spawn.x,y:L.spawn.t-13,w:18,h:26,vx:0,vy:0,facing:1,onGround:false,onMover:null,groundType:'dirt',groundBox:null,
          coyote:0,jumpBuf:0,walkPhase:0,swingT:0};
 const b={x:L.ball.x,y:L.ball.t-BR,vx:0,vy:0,r:BR,spin:0,onGround:false,onMover:null,groundType:'dirt',atRest:true,restT:0,springCd:0};
 golfer=g;ball=b;preShot={x:b.x,y:b.y};
}
function startGame(){results=[];holeIdx=0;loadHole(0);state='intro';introT=0;}
function toTitle(){loadHole(0);state='title';camX=260;}
function totalStrokes(){return results.reduce((a,r)=>a+r.s,0);}
function termOf(s,p){const d=s-p;return d<=-2?'EAGLE':d===-1?'BIRDIE':d===0?'PAR':d===1?'BOGEY':d===2?'DOUBLE BOGEY':'+'+d;}
function termCol(t){return t==='EAGLE'?'#ffd23e':t==='BIRDIE'?'#3ecf6f':t==='PAR'?'#fff8e6':t==='BOGEY'?'#ff9d4d':'#ff5d52';}
function nextHole(){SFX.click();
 if(holeIdx>=LEVELS.length-1){const t=totalStrokes();if(!best||t<best){best=t;saveBest(best);}state='final';}
 else{holeIdx++;loadHole(holeIdx);state='intro';introT=0;}}

/* ================= FX HELPERS ================= */
function floater(txt,x,y,col,size,life){floaters.push({txt,x,y,col:col||'#fff8e6',size:size||16,t:0,life:life||1.2});}
function dust(x,y,n,col){for(let i=0;i<(n||6);i++)particles.push({type:'dust',x:x+(Math.random()-.5)*14,y:y-2,vx:(Math.random()-.5)*120,vy:-Math.random()*70,t:0,life:.5+Math.random()*.3,size:3+Math.random()*4,col:col||'rgba(214,190,150,'});}
function droplets(x,y,kind){const c=kind==='lava'?['#ffd23e','#ff8c2e','#fff']:['#bff1fb','#7fdcef','#fff'];
 for(let i=0;i<12;i++)particles.push({type:'drop',x:x+(Math.random()-.5)*16,y,vx:(Math.random()-.5)*260,vy:-140-Math.random()*220,t:0,life:.6+Math.random()*.4,size:2+Math.random()*3,col:c[i%3]});}
function poof(x,y){for(let i=0;i<10;i++){const a=Math.random()*6.28;particles.push({type:'dust',x,y,vx:Math.cos(a)*160,vy:Math.sin(a)*160-40,t:0,life:.5,size:4+Math.random()*4,col:'rgba(255,255,255,'});}}
function confetti(x,y){const cols=['#ffd23e','#ef4b45','#3ecf6f','#4fb3ff','#ff9de2','#fff8e6'];
 for(let i=0;i<90;i++){const a=Math.random()*6.28,sp=120+Math.random()*380;
 particles.push({type:'conf',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-260,t:0,life:1.4+Math.random()*.9,size:4+Math.random()*5,col:cols[i%6],rot:Math.random()*6.28,vr:(Math.random()-.5)*14});}}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;
 if(p.type==='conf'){p.vy+=900*dt;p.vx*=Math.exp(-1.1*dt);p.rot+=p.vr*dt;}
 else if(p.type==='drop'){p.vy+=1500*dt;}
 else if(p.type==='bubble'){p.y-=32*dt;p.size+=6*dt;}
 else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-3*dt);p.vy*=Math.exp(-3*dt);}
 if(p.t>=p.life)particles.splice(i,1);}}
function updateFloaters(dt){for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=dt;f.y-=34*dt;if(f.t>=f.life)floaters.splice(i,1);}}

/* ================= PHYSICS ================= */
function windAt(x,y){let ax=0,ay=0;for(const z of world.wind){if(x>z.x&&x<z.x+z.w&&y>z.y&&y<z.y+z.h){ax+=z.dx||0;ay+=z.dy||0;}}return[ax,ay];}
function updateMovers(){for(const m of world.movers){const a=m.mv,v=Math.sin(time*2*Math.PI/a.period+(a.phase||0));
 const nx=a.axis==='x'?a.mid-a.amp*v:m.x, ny=a.axis==='y'?a.mid-a.amp*v:m.y;
 m.dx=nx-m.x;m.dy=ny-m.y;m.x=nx;m.y=ny;}}
function collideBall(b){b.onGround=false;b.onMover=null;b.groundType='dirt';b.springCd-=1/60;
 for(let it=0;it<2;it++)for(const B of SOLIDS){
  const cx=Math.max(B.x,Math.min(b.x,B.x+B.w)),cy=Math.max(B.y,Math.min(b.y,B.y+B.h));
  let dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
  if(d2>b.r*b.r)continue;
  let d=Math.sqrt(d2),nx,ny;
  if(d<1e-6){const l=b.x-B.x,r=B.x+B.w-b.x,t=b.y-B.y,bt=B.y+B.h-b.y,mn=Math.min(l,r,t,bt);
   if(mn===l){nx=-1;ny=0;}else if(mn===r){nx=1;ny=0;}else if(mn===t){nx=0;ny=-1;}else{nx=0;ny=1;}}
  else{nx=dx/d;ny=dy/d;}
  const pen=b.r-d;b.x+=nx*pen;b.y+=ny*pen;
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){const rest=B.type==='sand'?.08:.45;
   b.vx-=(1+rest)*vn*nx;b.vy-=(1+rest)*vn*ny;b.vx*=.985;
   if(-vn>220&&time-lastHitS>.07){lastHitS=time;SFX.bounce(-vn);if(-vn>900)shake=Math.max(shake,3);}}
  if(ny<-.6){b.onGround=true;if(B.type==='mover')b.onMover=B;b.groundType=B.type||'dirt';
   if(B.type==='spring'&&b.springCd<=0&&b.vy>=-50){b.vy=-1080;b.springCd=.4;B.springT=.3;SFX.spring();dust(b.x,B.y+10,8);}}}
}
function moveBox(e,dt){
 e.x+=e.vx*dt;
 for(const B of SOLIDS){if(e.x+e.w/2>B.x&&e.x-e.w/2<B.x+B.w&&e.y+e.h/2>B.y&&e.y-e.h/2<B.y+B.h){
  if(e.vx>0)e.x=B.x-e.w/2;else if(e.vx<0)e.x=B.x+B.w+e.w/2;e.vx=0;}}
 e.y+=e.vy*dt;e.onGround=false;e.onMover=null;e.groundBox=null;
 for(const B of SOLIDS){if(e.x+e.w/2>B.x&&e.x-e.w/2<B.x+B.w&&e.y+e.h/2>B.y&&e.y-e.h/2<B.y+B.h){
  if(e.vy>0){e.y=B.y-e.h/2;e.onGround=true;if(B.type==='mover')e.onMover=B;e.groundBox=B;}
  else if(e.vy<0){e.y=B.y+B.h+e.h/2;}e.vy=0;}}
 e.groundType=e.groundBox?(e.groundBox.type||'dirt'):'dirt';
}

/* ================= GAMEPLAY ================= */
function canAim(){return state==='play'&&sinkT<0&&ball.atRest&&Math.hypot(golfer.x-ball.x,golfer.y-ball.y)<130;}
function aimFromMouse(){return Math.atan2(mouse.y-ball.y,mouse.x+camX-ball.x);}
function mousePower(){const ph=(chargeT/.85)%2;return ph<1?ph:2-ph;}
function fireShot(ang,pow){
 if(state!=='play'||sinkT>=0||!ball.atRest)return;
 preShot={x:ball.x,y:ball.y};
 const sp=240+pow*1260;
 ball.vx=Math.cos(ang)*sp;ball.vy=Math.sin(ang)*sp;ball.atRest=false;ball.restT=0;
 strokes++;golfer.swingT=.28;golfer.facing=Math.cos(ang)>=0?1:-1;
 SFX.whoosh();SFX.hit(.05);dust(ball.x,ball.y+6,6);
 if(pow>.97)floater('FULL SEND!',golfer.x,golfer.y-34,'#ffd23e',18);
 charging=false;kbAim=false;
}
function resetBall(p){ball.x=p.x;ball.y=p.y;ball.vx=0;ball.vy=0;ball.atRest=false;ball.restT=0;}
function penalty(msg,col){strokes++;floater('+1 '+msg,clamp(ball.x,camX+60,camX+VW-60),Math.max(40,ball.y-30),col||'#ff5d52',18);SFX.penalty();shake=5;resetBall(preShot);}
function respawnGolfer(kind){
 poof(golfer.x,golfer.y);
 if(kind==='lava')SFX.lava();else if(kind==='spike')SFX.spike();else SFX.splash();
 golfer.x=world.spawn.x;golfer.y=world.spawn.t-13;golfer.vx=0;golfer.vy=0;flashT=.25;shake=Math.max(shake,4);
 floater('BACK TO THE TEE',golfer.x,golfer.y-36,'#fff8e6',15);
}
function startSink(){sinkT=0;sinkFrom={x:ball.x,y:ball.y};ball.vx=0;ball.vy=0;ball.atRest=true;flagWig=1.4;SFX.cup(strokes<=world.par);confetti(world.cup.x,world.cup.y-8);}
function sinkStep(dt){sinkT+=dt/.9;const e=easeOC(Math.min(1,sinkT));
 ball.x=lerp(sinkFrom.x,world.cup.x,e);ball.y=lerp(sinkFrom.y,world.cup.y+4,e);
 if(sinkT>=1){results.push({s:strokes,p:world.par,term:termOf(strokes,world.par)});state='holeDone';}}

function updateGame(dt){
 flagWig=Math.max(0,flagWig-dt);
 updateMovers();
 if(ball.onMover){ball.x+=ball.onMover.dx;ball.y+=ball.onMover.dy;}
 if(golfer.onMover){golfer.x+=golfer.onMover.dx;golfer.y+=golfer.onMover.dy;}
 for(const B of world.plats){B.springCd=Math.max(0,(B.springCd||0)-dt);B.springT=Math.max(0,(B.springT||0)-dt);}

 if(sinkT>=0&&sinkT<1){sinkStep(dt);return;}

 /* --- golfer --- */
 const g=golfer;
 if(kbAim){
  if(K['arrowleft']||K['a'])kbAngle-=2.4*dt;
  if(K['arrowright']||K['d'])kbAngle+=2.4*dt;
  if(K['arrowup']||K['w'])kbPower=Math.min(1,kbPower+1.3*dt);
  if(K['arrowdown']||K['s'])kbPower=Math.max(0,kbPower-1.3*dt);
  g.vx*=Math.exp(-8*dt);
 }else{
  const dir=((K['d']||K['arrowright'])?1:0)-((K['a']||K['arrowleft'])?1:0);
  if(dir)g.facing=dir;
  const maxS=g.groundType==='sand'?150:260, acc=g.onGround?2400:1400;
  if(dir){g.vx+=dir*acc*dt;g.vx=clamp(g.vx,-maxS,maxS);}
  else{g.vx*=Math.exp(-dt*(g.onGround?14:3));if(Math.abs(g.vx)<5)g.vx=0;}
 }
 const [wax,way]=windAt(g.x,g.y);
 g.vx+=wax*.45*dt;g.vy+=(GRAV+way)*dt;g.vy=Math.min(g.vy,1200);
 g.jumpBuf-=dt;g.coyote-=dt;
 if(g.jumpBuf>0&&(g.onGround||g.coyote>0)){g.vy=-640;g.jumpBuf=0;g.coyote=0;SFX.jump();dust(g.x,g.y+13,4);}
 moveBox(g,dt);
 if(g.onGround){g.coyote=.1;if(g.groundBox&&g.groundBox.type==='spring'&&g.groundBox.springCd<=0){g.vy=-1050;g.groundBox.springCd=.4;g.groundBox.springT=.3;SFX.spring();dust(g.x,g.y+13,8);}}
 g.walkPhase+=Math.abs(g.vx)*dt*.06;g.swingT=Math.max(0,g.swingT-dt);
 // golfer hazards
 for(const z of world.water)if(g.x>z.x&&g.x<z.x+z.w&&g.y+13>z.sy+8){respawnGolfer('water');break;}
 if(state!=='play')return;
 for(const z of world.lava)if(g.x>z.x&&g.x<z.x+z.w&&g.y+13>z.sy+8){respawnGolfer('lava');break;}
 if(state!=='play')return;
 for(const s of world.spikes)if(g.x+8>s.x&&g.x-8<s.x+s.w&&g.y+13>s.y-16&&g.y-13<s.y){respawnGolfer('spike');break;}
 if(state!=='play')return;
 if(g.y>VH+70)respawnGolfer('fall');

 /* --- ball --- */
 const b=ball;
 if(!b.atRest){
  const sd=dt/3;
  for(let s=0;s<3;s++){const [ax,ay]=windAt(b.x,b.y);
   b.vx+=ax*sd;b.vy+=(GRAV+ay)*sd;
   const sp=Math.hypot(b.vx,b.vy);if(sp>1700){b.vx*=1700/sp;b.vy*=1700/sp;}
   b.x+=b.vx*sd;b.y+=b.vy*sd;collideBall(b);}
  if(b.onGround){const fr=b.groundType==='sand'?9:2.4;b.vx*=Math.exp(-fr*dt);if(Math.abs(b.vx)<7)b.vx=0;}
  b.spin+=(b.vx/b.r)*dt*(b.onGround?1:.35);
  if(b.onGround&&Math.abs(b.vx)<8&&Math.abs(b.vy)<40){b.restT+=dt;if(b.restT>.25){b.atRest=true;b.vx=0;b.vy=0;}}
  else b.restT=0;
 }
 // ball hazards
 if(sinkT<0){
  for(const z of world.water)if(b.x>z.x&&b.x<z.x+z.w&&b.y+b.r*.5>z.sy){droplets(b.x,z.sy,'water');penalty('SPLASH','#ff5d52');break;}
  if(sinkT<0)for(const z of world.lava)if(b.x>z.x&&b.x<z.x+z.w&&b.y+b.r*.5>z.sy){droplets(b.x,z.sy,'lava');penalty('LAVA!','#ff8c2e');break;}
  if(sinkT<0)for(const s of world.spikes){const cx=Math.max(s.x,Math.min(b.x,s.x+s.w)),cy=Math.max(s.y-16,Math.min(b.y,s.y));
   if((b.x-cx)**2+(b.y-cy)**2<b.r*b.r){penalty('SPIKES!');break;}}
  if(sinkT<0&&(b.x<-30||b.x>world.W+30||b.y>VH+70))penalty('LOST BALL');
 }
 // cup
 if(sinkT<0&&!b.atRest){const c=world.cup;
  if(Math.abs(b.x-c.x)<15&&b.y>c.y-26&&b.y<c.y+10){
   const sp=Math.hypot(b.vx,b.vy);
   if(sp<780)startSink();
   else{b.vy=-Math.abs(b.vy)*.55-140;b.vx*=.82;floater('LIP OUT!',c.x,c.y-46,'#ffd23e',17);SFX.lip();shake=3;}
  }}
 // camera
 const focus=(kbAim||charging)?(g.x+b.x)/2:g.x;
 camX+=(focus-VW/2-camX)*(1-Math.exp(-5.5*dt));camX=clamp(camX,0,world.W-VW);
 // lava bubbles
 if(world.lava.length){lavaBubbleT-=dt;if(lavaBubbleT<=0){lavaBubbleT=.13;
  for(const z of world.lava)if(z.x<camX+VW&&z.x+z.w>camX)particles.push({type:'bubble',x:z.x+Math.random()*z.w,y:z.sy+10+Math.random()*26,vx:0,vy:0,t:0,life:.9,size:2+Math.random()*4,col:'#ffb14e'});}}
}

 rg.addColorStop(0,s.sun);rg.addColorStop(.25,s.sun+'');rg.addColorStop(1,'rgba(255,255,255,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.arc(sx,sy,110,0,7);ctx.fill();
 // clouds
 for(let i=0;i<6;i++){const cw=90+hash(i)*80,cx=((hash(i+30)*1400-time*(8+hash(i+5)*10)-camX*.12)%(VW+260)+(VW+260))%(VW+260)-130,cy=36+hash(i+7)*130;

 // hills

 ctx.lineTo(VW,VH);ctx.fill();
 // pines on near ridge
 ctx.fillStyle='rgba(28,64,44,.75)';
 const step=118;let wx=Math.floor((camX*.45)/step)*step-20;
 while(wx<camX*.45+VW+60){wx+=step;if(hash(wx)>.35){const px=wx-camX*.45,py=ridgeY(px,.45,400,34)+8;
  ctx.beginPath();ctx.moveTo(px,py-24);ctx.lineTo(px-9,py);ctx.lineTo(px+9,py);ctx.fill();
  ctx.beginPath();ctx.moveTo(px,py-16);ctx.lineTo(px-7,py+6);ctx.lineTo(px+7,py+6);ctx.fill();}}
}

  ctx.globalAlpha=Math.max(0,a);txt(f.txt,f.x,f.y,f.size,{disp:true,color:f.col,align:'center',stroke:'rgba(12,29,20,.85)',sw:4});ctx.globalAlpha=1;}
}
function renderWorld(){
 drawSky();
 ctx.save();
 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
 ctx.translate(-camX+sx,sy);
 for(const z of world.water)drawLiquid(z,'water');
 for(const z of world.lava)drawLiquid(z,'lava');
 for(const B of world.plats)if(B.type!=='mover')drawPlatform(B);
 for(const z of world.wind)drawWindZone(z);
 for(const s of world.spikes)drawSpikes(s);
 drawCup();
 for(const m of world.movers)drawPlatform(m);
 if(state!=='title'){drawBallShadow();drawGolfer();drawBall();}
 else{drawBallShadow();drawGolfer();drawBall();}
 drawAimUI();
 drawParticles();
 ctx.restore();
 // vignette
 const vg=ctx.createRadialGradient(VW/2,VH/2,VH*.55,VW/2,VH/2,VH*1.05);

function rankOf(t){const d=t-TOTALPAR;
 if(d<=-4)return 'CUP GOD \u2014 THE TOUR CALLS YOUR NAME';

/* ================= MASTER RENDER ================= */
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle='#0c1d14';ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
 uiRects=[];
 ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
 ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
 if(state==='title')renderTitle();
 else{renderWorld();renderHUD();
  if(state==='intro')renderIntro();
  if(state==='holeDone')renderDone();
  if(state==='final')renderFinal();
  if(state==='pause')renderPause();}
 if(flashT>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.7,flashT*1.8)+')';ctx.fillRect(0,0,VW,VH);}
 ctx.restore();
 cv.style.cursor=uiRects.some(r=>mouse.x>=r.x&&mouse.x<=r.x+r.w&&mouse.y>=r.y&&mouse.y<=r.y+r.h)?'pointer':'default';
}

/* ================= INPUT ================= */
const K={};
function normK(e){let k=e.key;if(k===' ')k='space';else if(k&&k.length===1)k=k.toLowerCase();return k;}
function act(id){
 switch(id){
  case 'start':startGame();SFX.click();break;
  case 'next':nextHole();break;
  case 'again':startGame();SFX.click();break;
  case 'title':toTitle();SFX.click();break;
  case 'resume':state='play';SFX.click();break;
  case 'restart':loadHole(holeIdx);state='play';SFX.click();floater('HOLE RESTARTED',golfer.x,golfer.y-40,'#fff8e6',15);break;
  case 'quit':toTitle();SFX.click();break;
  case 'mute':muted=!muted;if(musicG)musicG.gain.value=muted?0:.2;break;
 }}
function clickAt(x,y){for(const r of uiRects)if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){act(r.id);return true;}return false;}
function press(k){
 if(k==='m'){ensureAudio();muted=!muted;if(musicG)musicG.gain.value=muted?0:.2;return;}
 switch(state){
  case 'title':if(k==='enter'||k==='space'){startGame();SFX.click();}break;
  case 'intro':if(k==='enter'||k==='space')state='play';break;
  case 'play':
   if(kbAim){if(k==='escape')kbAim=false;else if(k==='enter'||k==='e'){fireShot(kbAngle,kbPower);}return;}
   if(k==='w'||k==='arrowup'||k==='space')golfer.jumpBuf=.13;
   else if(k==='e'||k==='enter'){if(canAim()){kbAim=true;kbAngle=aimFromMouse();kbPower=.55;}}
   else if(k==='r'){loadHole(holeIdx);floater('HOLE RESTARTED',golfer.x,golfer.y-40,'#fff8e6',15);}
   else if(k==='p'||k==='escape'){state='pause';charging=false;}
   break;
  case 'pause':if(k==='p'||k==='escape')state='play';else if(k==='r'){loadHole(holeIdx);state='play';}else if(k==='q')toTitle();break;
  case 'holeDone':if(k==='enter'||k==='space')nextHole();break;
  case 'final':if(k==='r'||k==='enter')startGame();else if(k==='q')toTitle();break;
 }}
addEventListener('keydown',e=>{
 let k=normK(e);
 if(['arrowleft','arrowright','arrowup','arrowdown','space'].includes(k))e.preventDefault();
 if(K[k])return;K[k]=true;ensureAudio();press(k);});
addEventListener('keyup',e=>{const k=normK(e);K[k]=false;
 if((k==='w'||k==='arrowup'||k==='space')&&golfer&&state==='play'&&golfer.vy<0)golfer.vy*=.55;});
function toVirtual(cx,cy){return{x:(cx-ox)/sc,y:(cy-oy)/sc};}
cv.addEventListener('mousemove',e=>{mouse=toVirtual(e.clientX,e.clientY);});
addEventListener('mousemove',e=>{mouse=toVirtual(e.clientX,e.clientY);});
cv.addEventListener('mousedown',e=>{
 ensureAudio();const p=toVirtual(e.clientX,e.clientY);mouse=p;
 if(state==='play'){if(!clickAt(p.x,p.y)&&canAim()){charging=true;chargeT=0;}}
 else if(!clickAt(p.x,p.y)){
  if(state==='title'){startGame();SFX.click();}
  else if(state==='intro')state='play';}
});
addEventListener('mouseup',e=>{
 if(charging&&state==='play'&&canAim())fireShot(aimFromMouse(),mousePower());
 charging=false;});
cv.addEventListener('touchstart',e=>{e.preventDefault();ensureAudio();
 const t=e.touches[0],p=toVirtual(t.clientX,t.clientY);mouse=p;
 if(state==='play'){if(!clickAt(p.x,p.y)&&canAim()){charging=true;chargeT=0;}}
 else if(!clickAt(p.x,p.y)){if(state==='title'){startGame();SFX.click();}else if(state==='intro')state='play';}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];mouse=toVirtual(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();
 if(charging&&state==='play'&&canAim())fireShot(aimFromMouse(),mousePower());charging=false;},{passive:false});

/* ================= MAIN LOOP ================= */
let last=performance.now();
function frame(ts){
 const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;time+=dt;
 flashT=Math.max(0,flashT-dt*2.2);shake*=Math.exp(-5*dt);if(shake<.1)shake=0;
 if(state==='play')updateGame(dt);
 else if(state==='intro'){introT+=dt;if(introT>1.9)state='play';}
 updateParticles(dt);updateFloaters(dt);
 render();requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);
</script>
