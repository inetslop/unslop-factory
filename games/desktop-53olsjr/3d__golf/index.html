<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<link rel="icon" href="data:,"/>
<title>Sunset Cup — 3D Golf</title>
<style>
:root{--serif:Georgia,'Times New Roman',serif;--sans:'Trebuchet MS','Segoe UI',Verdana,sans-serif;--cream:#ffe9c9;--gold:#ffd27a;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1536;font-family:var(--sans)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(8,6,20,.42) 100%)}
/* ---------- HUD ---------- */
#hud{transition:opacity .5s;z-index:5}
#hud.off .panel,#hud.off #hint{opacity:0;pointer-events:none}
.panel{position:fixed;background:rgba(12,24,17,.8);border:1px solid rgba(255,210,122,.38);color:var(--cream);padding:9px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.panel b{font-family:var(--serif);font-style:italic;font-weight:700;font-size:20px;color:var(--gold);letter-spacing:0;margin:0 2px}
.tl{top:14px;left:14px;min-width:250px;line-height:1.9}
.tr{top:14px;right:14px;text-align:right;line-height:1.7}
.lbl{opacity:.6;font-size:9px}
#hName{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:.02em;font-size:15px;color:#f7d9a8;margin-left:10px}
.sep{display:inline-block;width:1px;height:14px;background:rgba(255,210,122,.3);margin:0 10px;vertical-align:-2px}
.best{margin-top:6px;font-size:9px;opacity:.85}
.best b{font-size:15px;color:#ff9d7a}
#hint{position:fixed;left:14px;bottom:12px;color:rgba(255,233,201,.7);font-size:10px;letter-spacing:.1em;text-transform:uppercase;transition:opacity .5s}
#hint kbd{display:inline-block;padding:0 6px;margin:0 2px;border:1px solid rgba(255,233,201,.4);background:rgba(0,0,0,.3);border-radius:4px;font-weight:bold;font-size:9px;color:var(--cream)}
/* power */
#powerWrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;text-align:center;opacity:0;transition:opacity .15s}
#powerWrap.on{opacity:1}
.plabel{display:block;color:var(--cream);font-size:10px;letter-spacing:.34em;margin-bottom:6px;text-shadow:0 1px 2px #000}
#pbar{width:min(320px,64vw);height:14px;border:1px solid rgba(255,233,201,.75);background:rgba(10,20,13,.85);padding:2px;box-shadow:0 3px 12px rgba(0,0,0,.45)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#67d873,#ffd24a 55%,#ff5a3c)}
/* toast */
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.6);z-index:8;text-align:center;pointer-events:none;opacity:0;color:#fff6dd;font-family:var(--serif);font-style:italic}
#toast b{display:block;font-size:clamp(34px,7vw,62px);letter-spacing:.04em;text-shadow:0 3px 0 rgba(40,15,5,.5),0 0 30px rgba(255,170,80,.55)}
#toast i{display:block;font-size:clamp(12px,2.2vw,17px);letter-spacing:.3em;text-transform:uppercase;font-family:var(--sans);font-style:normal;margin-top:6px;color:#ffe9c9;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#toast.show{animation:tst 2.5s cubic-bezier(.18,1.4,.3,1) forwards}
#toast.show.sm{animation-duration:1.5s}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}20%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}
/* ---------- scorecard overlay ---------- */
#ovl{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(10,8,26,.6),rgba(10,8,26,.3) 40%,rgba(10,8,26,.65));padding:16px}
#ovl.hidden{display:none}
.card{position:relative;width:min(540px,94vw);max-height:94vh;overflow:auto;color:#2b4026;border:1px solid #cbb98d;padding:36px 40px 30px;transform:rotate(-1.1deg);
background-color:#f6ecd3;background-image:repeating-linear-gradient(0deg,rgba(122,98,52,.07) 0 1px,transparent 1px 27px);
box-shadow:inset 0 0 0 7px #f6ecd3,inset 0 0 0 8px #b3a077,0 24px 60px rgba(0,0,0,.55)}
.stamp{position:absolute;top:16px;right:18px;width:76px;height:76px;border:2px solid #b3402e;color:#b3402e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;letter-spacing:.16em;transform:rotate(9deg);opacity:.78;text-align:center;box-shadow:inset 0 0 0 3px transparent,inset 0 0 0 4px rgba(179,64,46,.25)}
.eyebrow{font-size:10px;letter-spacing:.32em;color:#7c8a63;text-transform:uppercase}
.card h1{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(38px,7vw,52px);margin:6px 0 2px;color:#8c2f1d;letter-spacing:.01em;line-height:1}
.tag{font-family:var(--serif);font-style:italic;color:#54663f;margin:2px 0 14px;font-size:15px}
.rule{height:1px;background:#b3a077;margin:2px 0 14px}
table.holes{width:100%;border-collapse:collapse;margin:0 0 12px;font-size:13px}
.holes td{padding:7px 2px;border-bottom:1px dashed #bfae83}
.holes .hn{font-family:var(--serif);font-style:italic;color:#3c5136}
.holes .hp{text-align:right;font-weight:bold;letter-spacing:.08em;color:#8c2f1d}
.holes th{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#7c8a63;padding-bottom:4px;border-bottom:1px solid #bfae83;text-align:left}
.holes th.r,.holes td.r{text-align:right}
.controls{margin:4px 0 20px;font-size:11.5px;line-height:2.15;color:#4a5c39}
.card kbd{display:inline-block;padding:1px 7px;margin:0 2px;border:1px solid #9aa87f;border-bottom-width:2px;background:#fffdf4;border-radius:4px;font-family:var(--sans);font-weight:bold;font-size:10px;color:#33452a;letter-spacing:.05em}
#go{display:block;width:100%;padding:14px 0;font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.22em;color:#fdf3d7;background:linear-gradient(180deg,#2f7a49,#1c5231);border:1px solid #12301e;border-radius:6px;cursor:pointer;box-shadow:0 5px 0 #10301f,0 10px 24px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
#go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #10301f,0 16px 30px rgba(0,0,0,.4),0 0 24px rgba(255,200,110,.35)}
#go:active{transform:translateY(2px);box-shadow:0 2px 0 #10301f}
.or{text-align:center;font-size:10px;letter-spacing:.28em;color:#7c8a63;margin:12px 0 0;text-transform:uppercase}
.rec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7c8a63;margin:-4px 0 14px}
.rec b{color:#8c2f1d;font-family:var(--serif);font-style:italic;font-size:15px}
td.good{color:#2e7d3f;font-weight:bold}
td.bad{color:#b3402e;font-weight:bold}
tr.tot td{border-top:2px solid #6b7a55;border-bottom:none;font-weight:bold;padding-top:9px;font-size:14px}
.verdict{font-family:var(--serif);font-style:italic;font-size:16px;color:#54663f;text-align:center;margin:12px 0 4px}
.nrec{text-align:center;color:#b3402e;font-weight:bold;letter-spacing:.22em;font-size:11px;margin:2px 0 16px;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="hud" class="off">
  <div class="panel tl">
    <div><span class="lbl">Hole</span><b id="hNum">1</b><span id="hName">The Sparrow</span></div>
    <div><span class="lbl">Par</span><b id="hPar">2</b><i class="sep"></i><span class="lbl">Strokes</span><b id="strokesEl">0</b><i class="sep"></i><span class="lbl">Total</span><b id="totalEl">E</b></div>
  </div>
  <div class="panel tr">
    <div><span class="lbl">To cup</span>&nbsp;<b id="distEl">—</b></div>
    <div class="best" id="bestWrap" hidden>course record&nbsp;<b id="bestEl"></b></div>
  </div>
  <div id="hint">aim <kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> · shoot: hold <kbd>SPACE</kbd>/<kbd>CLICK</kbd> release to fire · orbit <kbd>Q</kbd><kbd>E</kbd> · zoom scroll · <kbd>R</kbd> restart</div>
  <div id="powerWrap"><span class="plabel">P O W E R</span><div id="pbar"><div id="pfill"></div></div></div>
</div>

<div id="toast"></div>
<div id="ovl" class="hidden"><div class="card" id="card"></div></div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,Hh=0,dpr=1,focal=600,cx=0,cy=0,skyGrad=null;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;Hh=innerHeight;
  cv.width=(W*dpr)|0;cv.height=(Hh*dpr)|0;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=Hh/2;focal=Hh*0.95;skyGrad=null;
}
addEventListener('resize',resize);resize();

const TAU=Math.PI*2,R=0.35,G=30,CS=4;
const FOGS=52,FOGE=138,FOGC=[226,150,104];
const FRIC=[[9,2.6],[3.4,1.15],[1.15,0.5],[30,7],[0,0]]; // rough,fairway,green,sand,water
function wrapA(a){a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;}
const fmtD=d=>d>0?'+'+d:(d<0?'\u2212'+(-d):'E');

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
    const len=(AC.sampleRate*1)|0;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    // soft wind bed
    const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
    const wg=AC.createGain();wg.gain.value=0.028;
    const lfo=AC.createOscillator();lfo.frequency.value=0.07;const lg=AC.createGain();lg.gain.value=0.012;
    lfo.connect(lg);lg.connect(wg.gain);lfo.start();
    src.connect(lp);lp.connect(wg);wg.connect(master);src.start();
  }catch(e){}
  if(AC&&AC.state==='suspended')AC.resume();
}
function blip(type,f0,f1,dur,vol,when){
  if(!AC)return;const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}
function noiseBurst(ft,freq,dur,vol,Q){
  if(!AC)return;const t=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=ft;f.frequency.value=freq;f.Q.value=Q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.05);
}
const sHit=p=>{noiseBurst('bandpass',900+700*p,0.06,0.35+0.4*p,1.2);blip('sine',150-60*p,55,0.13,0.5);};
const sBounce=v=>{if(v>0.05)blip('sine',190,95,0.07,Math.min(0.4,v));};
const sSink=()=>{blip('sine',330,68,0.3,0.55);[740,988,1175,1568].forEach((f,i)=>blip('triangle',f,f,0.14,0.22,0.12+i*0.09));};
const sWater=()=>{noiseBurst('lowpass',520,0.5,0.5,0.8);blip('sine',300,70,0.35,0.3);};
const sOut=()=>blip('sawtooth',130,55,0.3,0.22);
const sChime=()=>{blip('triangle',1319,1319,0.16,0.16);blip('triangle',1760,1760,0.22,0.14,0.1);};
const sTick=p=>blip('square',300+520*p,300+520*p,0.03,0.06);
const sClick=()=>blip('square',700,640,0.05,0.14);
const sEnd=()=>[523,659,784,1047].forEach((f,i)=>blip('triangle',f,f,0.35,0.24,i*0.14));

/* ============================== COURSE DATA ============================== */
const HOLES=[
 {name:'The Sparrow',par:2,L:70,W:56,tee:{x:0,z:6},hole:{x:0,z:58},green:{r:11},fwW:23,
  path:[[0,4],[0,30],[0,52]],
  sands:[{x:7.5,z:49,r:4}],waters:[],
  trees:[[-12,26,1],[12,34,.9],[-10,44,1.1],[11,18,.8]]},
 {name:'The Bend',par:3,L:112,W:88,tee:{x:-14,z:6},hole:{x:16,z:98},green:{r:11.5},fwW:20,
  path:[[-14,4],[-14,40],[6,58],[16,72],[16,92]],
  sands:[{x:-2,z:52,r:4.5},{x:24,z:84,r:4}],waters:[],
  trees:[[-30,50,1.2],[-26,70,1],[28,55,1.1],[30,75,1.2],[-24,90,.9],[2,104,1]]},
 {name:'The Lake',par:4,L:152,W:88,tee:{x:-4,z:6},hole:{x:4,z:138},green:{r:12},fwW:20,
  path:[[-4,4],[-10,40],[-20,78],[-16,105],[4,128]],
  sands:[{x:-10,z:126,r:4.5},{x:16,z:96,r:3.5}],
  waters:[{x0:-26,x1:44,z0:64,z1:86}],
  trees:[[30,50,1.2],[38,70,1.3],[30,95,1.1],[-38,90,1.2],[-34,115,1],[22,120,1.1]]}
];
function dPath(x,z,pts){
  let m=1e9;
  for(let i=0;i<pts.length-1;i++){
    const ax=pts[i][0],az=pts[i][1],bx=pts[i+1][0],bz=pts[i+1][1];
    const dx=bx-ax,dz=bz-az;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz)));
    const px=ax+dx*t-x,pz=az+dz*t-z,d=px*px+pz*pz;
    if(d<m)m=d;
  }
  return Math.sqrt(m);
}
function baseRGB(t,stripe,sh){
  let r,g,b;
  if(t===1){if(stripe){r=74;g=138;b=66}else{r=63;g=124;b=58}}
  else if(t===2){if(stripe){r=104;g=182;b=92}else{r=92;g=168;b=82}}
  else if(t===3){r=226;g=199;b=145}
  else if(t===4){r=56;g=104;b=152}
  else{r=46;g=88;b=49}
  const m=0.9+0.2*sh;
  return [Math.min(255,r*m|0),Math.min(255,g*m|0),Math.min(255,b*m|0)];
}
let cur=null,Hd=null,cup=null,trees=[];
function loadHole(i){
  const hd=HOLES[i];Hd=hd;cup=hd.hole;
  const gw=Math.ceil((hd.W+36)/CS),gl=Math.ceil((hd.L+65)/CS);
  const x0=-hd.W/2-18,z0=-15;
  const type=new Uint8Array(gw*gl),CR=new Int16Array(gw*gl),CG=new Int16Array(gw*gl),CB=new Int16Array(gw*gl);
  const cols=new Array(gw*gl);
  let ci=0;
  for(let iz=0;iz<gl;iz++)for(let ix=0;ix<gw;ix++){
    const wx=x0+(ix+.5)*CS,wz=z0+(iz+.5)*CS;
    let t=0;
    if(dPath(wx,wz,hd.path)<hd.fwW/2)t=1;
    const gdx=wx-hd.hole.x,gdz=wz-hd.hole.z;
    if(gdx*gdx+gdz*gdz<hd.green.r*hd.green.r)t=2;
    for(const s of hd.sands){const sx=wx-s.x,sz=wz-s.z;if(sx*sx+sz*sz<s.r*s.r){t=3;break}}
    for(const w of hd.waters){if(wx>w.x0&&wx<w.x1&&wz>w.z0&&wz<w.z1){t=4;break}}
    const c=baseRGB(t,(t===1||t===2)??true?iz%2:0,Math.random());
    type[ci]=t;CR[ci]=c[0];CG[ci]=c[1];CB[ci]=c[2];
    cols[ci]='rgb('+c[0]+','+c[1]+','+c[2]+')';
    ci++;
  }
  cur={hd,gw,gl,x0,z0,type,CR,CG,CB,cols};
  trees=[];let seed=0;
  for(const t of hd.trees){
    const dx=t[0]-hd.hole.x,dz=t[1]-hd.hole.z;
    if(dx*dx+dz*dz<(hd.green.r+2.5)*(hd.green.r+2.5))continue;
    let inW=false;for(const w of hd.waters){if(t[0]>w.x0-1&&t[0]<w.x1+1&&t[1]>w.z0-1&&t[1]<w.z1+1)inW=true}
    if(inW)continue;
    trees.push({x:t[0],z:t[1],s:t[2],seed:seed++*2.39});
  }
}
function surfAt(x,z){
  const ix=((x-cur.x0)/CS)|0,iz=((z-cur.z0)/CS)|0;
  if(ix<0||iz<0||ix>=cur.gw||iz>=cur.gl)return 0;
  return cur.type[iz*cur.gw+ix];
}

/* ============================== STATE ============================== */
const ball={p:[0,R,0],v:[0,0,0],rolling:true,sunk:false};
let state='menu',holeIdx=0,strokes=0,totals=[0,0,0];
let aim=0,charging=false,chargeT=0,power=0,lastTick=-1;
let lastShot=[0,R,0],freeze=0,sinkT=0,endT=0,flagWob=0,shake=0,flagNear=false,flagCoo=0,time=0;
const parts=[],marks=[],rings=[],prev=[];

/* camera */
const cam={yaw:0,pitch:0.34,dist:26,tDist:26,x:0,y:10,z:-24,fx:0,fy:0,fz:0,rx:0,ry:0,rz:0,ux:0,uy:0,uz:0,snap:true};
const tmp3=[0,0,0];
function project(x,y,z,out){
  const vx=x-cam.x,vy=y-cam.y,vz=z-cam.z;
  const dz=vx*cam.fx+vy*cam.fy+vz*cam.fz;
  if(dz<0.25)return false;
  out[0]=cx+focal*(vx*cam.rx+vy*cam.ry+vz*cam.rz)/dz;
  out[1]=cy-focal*(vx*cam.ux+vy*cam.uy+vz*cam.uz)/dz;
  out[2]=dz;return true;
}
function updateCamera(dt){
  let tx,ty,tz;
  if(state==='menu'){tx=ball.p[0];ty=1.4;tz=ball.p[2];cam.yaw+=dt*0.16;}
  else{tx=ball.p[0];ty=ball.p[1]+0.9;tz=ball.p[2];}
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cA=Math.cos(cam.yaw),sA=Math.sin(cam.yaw);
  cam.fx=sA*cp;cam.fy=-sp;cam.fz=cA*cp;
  cam.rx=cA;cam.ry=0;cam.rz=-sA;
  cam.ux=cam.fy*cam.rz;cam.uy=cam.fz*cam.rx-cam.fx*cam.rz;cam.uz=-cam.fy*cam.rx;
  cam.dist+=(cam.tDist-cam.dist)*Math.min(1,dt*6);
  const nx=tx-cam.fx*cam.dist,ny=ty-cam.fy*cam.dist,nz=tz-cam.fz*cam.dist;
  if(shake>0){shake*=Math.exp(-6*dt);cam.x+= (Math.random()-.5)*shake*1.6;cam.y+=(Math.random()-.5)*shake*1.2;}
  const k=cam.snap?1:Math.min(1,dt*6);
  cam.x+=(nx-cam.x)*k;cam.y+=(ny-cam.y)*k;cam.z+=(nz-cam.z)*k;
  cam.snap=false;
}

/* ============================== FLOW ============================== */
const $=id=>document.getElementById(id);
let toastTO=null;
function toast(main,sub,cls){
  const el=$('toast');el.className='';void el.offsetWidth;
  el.innerHTML='<b>'+main+'</b>'+(sub?'<i>'+sub+'</i>':'');
  el.classList.add('show'+(cls?' '+cls:''));
  clearTimeout(toastTO);toastTO=setTimeout(()=>el.classList.remove('show'),cls==='sm'?1500:2500);
}
function getBest(){try{return localStorage.getItem('sunsetCupBest')}catch(e){return null}}
function setBest(v){try{const b=getBest();if(b===null||v<parseInt(b,10))localStorage.setItem('sunsetCupBest',String(v))}catch(e){}}
function refreshBest(){
  const b=getBest();
  if(b!==null){$('bestWrap').hidden=false;$('bestEl').textContent=fmtD(parseInt(b,10));}
  else $('bestWrap').hidden=true;
}
function setUI(){
  document.getElementById('hud').classList.toggle('off',!(state==='play'||state==='holeend'));
  document.getElementById('ovl').classList.toggle('hidden',state==='play'||state==='holeend');
  refreshBest();
}
function placeBallTee(){
  const t=Hd.tee;
  ball.p=[t.x,R,t.z];ball.v=[0,0,0];ball.rolling=true;ball.sunk=false;
  aim=Math.atan2(cup.x-t.x,cup.z-t.z);
  cam.yaw=aim;cam.snap=true;
  lastShot=[t.x,R,t.z];freeze=0;sinkT=0;flagWob=0;flagNear=false;

/* ============================== SHOTS & PHYSICS ============================== */
function canShoot(){return state==='play'&&!ball.sunk&&freeze<=0&&ball.rolling&&Math.hypot(ball.v[0],ball.v[2])<0.15;}
function beginCharge(){if(!canShoot())return;charging=true;chargeT=0;lastTick=-1;$('powerWrap').classList.add('on');}
function releaseShot(){
  if(!charging)return;charging=false;$('powerWrap').classList.remove('on');
  const spd=7+51*power,dx=Math.sin(aim),dz=Math.cos(aim);
  lastShot=[ball.p[0],Math.max(ball.p[1],R),ball.p[2]];
  ball.v=[dx*spd*0.985,spd*0.13,dz*spd*0.985];
  ball.rolling=false;strokes++;shake=0.15+0.3*power;
  sHit(power);prev.length=0;
  spawn(ball.p[0]-dx*0.6,R-0.1,ball.p[2]-dz*0.6,7,[120,200,110],4,0.5,14,true);
  power=0;updateHUD();
}
function spawn(x,y,z,n,col,spd,life,g,up){
  for(let i=0;i<n;i++){
    if(parts.length>300)parts.shift();
    parts.push({x,y,z,vx:(Math.random()-.5)*spd,vy:Math.random()*spd*(up?0.9:0.45),vz:(Math.random()-.5)*spd,
      life:life*(0.6+Math.random()*0.6),max:life,r:0.12+Math.random()*0.16,col,g:g||18});
  }
}
function respawnAt(pos){freeze=0.9;ball.p=[pos[0],R,pos[2]];ball.v=[0,0,0];ball.rolling=true;ball.sunk=false;}
function waterEvent(){
  spawn(ball.p[0],0.2,ball.p[2],18,[150,200,240],7,0.9,22,true);
  rings.push({x:ball.p[0],z:ball.p[2],life:0.7,max:0.7,col:'rgba(200,230,255,'});
  sWater();strokes++;toast('WATER HAZARD','+1 penalty \u00b7 ball returned','sm');
  respawnAt(lastShot);updateHUD();
}
function oobEvent(){
  sOut();strokes++;toast('OUT OF BOUNDS','+1 penalty \u00b7 ball returned','sm');
  respawnAt(lastShot);updateHUD();
}
function startSink(){
  ball.sunk=true;ball.v=[0,0,0];sinkT=0;flagWob=4;sSink();
  spawn(cup.x,R,cup.z,26,null,5,1.3,12,true);
  parts[parts.length-26]&&null; // confetti handled below
  const cols=[[255,210,74],[255,242,192],[255,122,77],[143,224,138]];
  for(let i=0;i<26&&i<parts.length-0;i++){} // (no-op)
  spawnConfetti();
}
function spawnConfetti(){
  const cols=[[255,210,74],[255,242,192],[255,122,77],[143,224,138]];
  for(let i=0;i<26;i++){
    if(parts.length>300)parts.shift();
    const c=cols[i%4];
    parts.push({x:cup.x,y:R+0.2,z:cup.z,vx:(Math.random()-.5)*6,vy:3+Math.random()*6,vz:(Math.random()-.5)*6,
      life:1+Math.random()*0.7,max:1.6,r:0.14,col:c,g:15});
  }
}
function physStep(dt){
  const p=ball.p,v=ball.v;
  if(ball.sunk){
    p[0]+=(cup.x-p[0])*Math.min(1,dt*9);p[2]+=(cup.z-p[2])*Math.min(1,dt*9);
    p[1]=Math.max(-0.7,p[1]-dt*3.4);return;
  }
  v[1]-=G*dt;
  p[0]+=v[0]*dt;p[1]+=v[1]*dt;p[2]+=v[2]*dt;
  // trees
  for(const t of trees){
    const dx=p[0]-t.x,dz=p[2]-t.z,rr=1.35+t.s*0.4;
    if(p[1]<5.2*t.s&&dx*dx+dz*dz<rr*rr){
      const d=Math.sqrt(dx*dx+dz*dz)||1e-4,nx=dx/d,nz=dz/d;
      p[0]=t.x+nx*rr;p[2]=t.z+nz*rr;
      const dot=v[0]*nx+v[2]*nz;
      if(dot<0){v[0]-=1.6*dot*nx;v[2]-=1.6*dot*nz;v[0]*=0.55;v[2]*=0.55;sBounce(0.3);spawn(p[0],p[1],p[2],5,[47,107,58],4,0.6,12,true);}
    }
  }
  const t=surfAt(p[0],p[2]);
  if(p[1]<=R){
    if(t===4){waterEvent();return;}
    const imp=-v[1];
    v[1]=-v[1]*(t===3?0.12:0.52);
    const keep=t===3?0.42:0.8;v[0]*=keep;v[2]*=keep;p[1]=R;
    if(imp>7){sBounce(Math.min(0.6,imp*0.03));spawn(p[0],R,p[2],t===3?10:5,t===3?[233,212,161]:[110,180,95],4,0.5,12,true);
      if(marks.length>40)marks.shift();marks.push({x:p[0],z:p[2],life:6,max:6});}
    else v[1]=0;
    ball.rolling=true;
    if(t===3){const s=Math.hypot(v[0],v[2]);if(s>3){v[0]*=0.5;v[2]*=0.5;spawn(p[0],R,p[2],12,[233,212,161],5,0.7,10,true);}}
  }
  const grounded=p[1]<=R+0.02&&Math.abs(v[1])<0.05;
  if(grounded){
    const sp=Math.hypot(v[0],v[2]);
    if(sp>0){
      const fc=FRIC[t][0],fl=FRIC[t][1],dec=(fc+fl*sp)*dt;
      if(sp<=dec||sp<0.12){v[0]=0;v[2]=0;}else{const k2=1-dec/sp;v[0]*=k2;v[2]*=k2;}
    }
  }
  const hdx=p[0]-cup.x,hdz=p[2]-cup.z,hd=Math.sqrt(hdx*hdx+hdz*hdz);
  if(!ball.sunk&&p[1]<R+1.5){
    const spd=Math.hypot(v[0],v[1],v[2]);
    if(hd<0.85&&spd<8)startSink();
    else if(hd<1.6&&spd>=8){
      const nx=hdx/(hd||1e-4),nz=hdz/(hd||1e-4);
      v[0]=nx*spd*0.35+(Math.random()-.5)*2;v[2]=nz*spd*0.35+(Math.random()-.5)*2;
      v[1]=Math.max(v[1],1.5);ball.rolling=false;sBounce(0.3);
    }
  }
  if(p[0]<-Hd.W/2-8||p[0]>Hd.W/2+8||p[2]<-14||p[2]>Hd.L+16)oobEvent();
}

/* trajectory preview */
function computePreview(){
  prev.length=0;
  if(!charging)return;
  const spd=7+51*power;
  let px=ball.p[0],py=ball.p[1],pz=ball.p[2];
  let vx=Math.sin(aim)*spd*0.985,vy=spd*0.13,vz=Math.cos(aim)*spd*0.985;
  const dt=0.045;
  for(let i=0;i<260;i++){
    vy-=G*dt;px+=vx*dt;py+=vy*dt;pz+=vz*dt;
    if(i%3===0)prev.push([px,Math.max(py,0),pz]);
    if(py<=R){
      const t=surfAt(px,pz);
      if(t===4){prev.push([px,R,pz,true]);break;}
      vy=-vy*0.52;vx*=0.78;vz*=0.78;py=R;
      if(Math.abs(vy)<1.3){
        let spx=vx,spz=vz;
        for(let j=0;j<60&&Math.hypot(spx,spz)>0.4;j++){
          const s=Math.hypot(spx,spz),dec=(FRIC[t][0]+FRIC[t][1]*s)*dt;
          if(s<=dec)break;const k2=1-dec/s;spx*=k2;spz*=k2;px+=spx*dt;pz+=spz*dt;
        }
        prev.push([px,R,pz]);
      }
    }
  }
}

/* ============================== UPDATE ============================== */
let acc=0;
function update(dt){
  time+=dt;
  // aim & orbit
  const L=(keys['a']||keys['ArrowLeft'])?1:0,Rt=(keys['d']||keys['ArrowRight'])?1:0;
  if(L||Rt)aim+=(L-Rt)*2.0*dt;
  if(keys['q'])cam.yaw-=2.2*dt;
  if(keys['e'])cam.yaw+=2.2*dt;
  // charge
  if(charging){
    chargeT+=dt;
    const x=(chargeT%2.3)/1.15;power=x<1?x:2-x;
    $('pfill').style.width=(power*100).toFixed(1)+'%';
    if(chargeT-lastTick>0.09){lastTick=chargeT;sTick(power);}
    computePreview();
  }else power=0;
  if(freeze>0)freeze-=dt;
  flagWob*=Math.exp(-1.5*dt);flagCoo-=dt;
  // physics
  if(state==='play'){
    acc+=dt;let n=0;
    while(acc>1/120&&n<5){physStep(1/120);acc-=1/120;n++;}
    if(ball.sunk){sinkT+=dt;if(sinkT>1.1)finishHole();}
    // flag chime
    const d=Math.hypot(ball.p[0]-cup.x,ball.p[2]-cup.z);
    if(!ball.sunk&&d<Hd.green.r+2.5&&!flagNear){flagNear=true;if(flagCoo<=0){sChime();flagCoo=2;}}
    if(d>Hd.green.r+4)flagNear=false;
  }
  if(state==='holeend'){endT+=dt;if(endT>2.6)nextHole();}
  // particles / marks / rings
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;
    if(q.life<=0){parts.splice(i,1);continue;}
    q.vy-=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;if(q.y<0.05)q.y=0.05;}
  for(let i=marks.length-1;i>=0;i--){marks[i].life-=dt;if(marks[i].life<=0)marks.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){rings[i].life-=dt;if(rings[i].life<=0)rings.splice(i,1);}
  // clouds drift
  for(const c of clouds)c.a+=dt*0.006;
  // distance HUD
  const dd=Math.hypot(ball.p[0]-cup.x,ball.p[2]-cup.z);
  setTxt('distEl',(dd<10?dd.toFixed(1):Math.round(dd))+'m');
  updateCamera(dt);
}

const sunA=0.55;
const clouds=[];for(let i=0;i<7;i++)clouds.push({a:Math.random()*TAU,y:20+Math.random()*90,s:0.6+Math.random()*1.2,ph:Math.random()*9});
function drawSky(){
  if(!skyGrad){
    skyGrad=ctx.createLinearGradient(0,0,0,cy*1.05);
    skyGrad.addColorStop(0,'#0f1536');skyGrad.addColorStop(0.40,'#33386f');
    skyGrad.addColorStop(0.58,'#7c4a68');skyGrad.addColorStop(0.72,'#c96b4e');
    skyGrad.addColorStop(0.85,'#f5a95c');skyGrad.addColorStop(1,'#ffdf9e');
  }
  ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,Hh);
  // sun
  const dxA=wrapA(sunA-cam.yaw);
  if(Math.abs(dxA)<1.2){
    const sx=cx+dxA*W*0.42,sy=cy-Hh*0.085-Math.sin(time*0.6)*2;
    let g=ctx.createRadialGradient(sx,sy,0,sx,sy,Hh*0.3);
    g.addColorStop(0,'rgba(255,240,190,0.85)');g.addColorStop(0.25,'rgba(255,190,110,0.35)');g.addColorStop(1,'rgba(255,170,90,0)');
    ctx.fillStyle=g;ctx.fillRect(sx-Hh*0.3,sy-Hh*0.3,Hh*0.6,Hh*0.6);
    ctx.fillStyle='#fff3c8';ctx.beginPath();ctx.arc(sx,sy,Hh*0.045,0,TAU);ctx.fill();
  }
  // clouds
  for(const c of clouds){
    const da=wrapA(c.a-cam.yaw);if(Math.abs(da)>1.2)continue;
    const x=cx+da*W*0.5,y=cy-c.y-6;
    ctx.fillStyle='rgba(255,214,170,'+(0.28+c.s*0.1)+')';
    ctx.beginPath();
    ctx.ellipse(x,y,52*c.s,13*c.s,0,0,TAU);
    ctx.ellipse(x+30*c.s,y+6*c.s,40*c.s,11*c.s,0,0,TAU);
    ctx.ellipse(x-34*c.s,y+7*c.s,34*c.s,9*c.s,0,0,TAU);
    ctx.fill();
  }
  // hills (two parallax silhouettes)
  hill(0.55,'#3a2b52',34,17,3,91);hill(1.0,'#241d3e',22,12,7,47);
}
function hill(par,col,a1,a2,f1,f2){
  const off=cam.yaw*W*0.5*par+cam.x*2*par;
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,cy+3);
  for(let x=0;x<=W;x+=24){
    const u=x+off;
    const y=cy-((a1+a2*Math.sin(u*0.004*f1)+a2*0.6*Math.sin(u*0.011*f2))* (0.5+0.5*Math.sin(u*0.0013+par*5)));
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,cy+3);ctx.closePath();ctx.fill();
}

/* ============================== RENDER ============================== */
const POOL=6000,items=new Array(POOL),list=[];
for(let i=0;i<POOL;i++)items[i]={d:0,k:0,o:0,x1:0,y1:0,x2:0,y2:0,x3:0,y3:0,x4:0,y4:0};
let nItems=0;
function pushItem(d,k,o){if(nItems>=POOL)return;const it=items[nItems++];it.d=d;it.k=k;it.o=o;}
const ballSpr=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(25,22,4,32,32,32);
  gr.addColorStop(0,'#ffffff');gr.addColorStop(0.55,'#f1f2ec');gr.addColorStop(0.85,'#c9d1c6');gr.addColorStop(1,'#aab4a6');
  g.fillStyle=gr;g.beginPath();g.arc(32,32,31,0,TAU);g.fill();return c;})();

function render(){
  drawSky();
  nItems=0;
  /* --- ground cells --- */
  const {gw,gl,x0,z0,type}=cur;
  for(let iz=0;iz<gl;iz++){
    const wz=z0+iz*CS;
    for(let ix=0;ix<gw;ix++){
      const wx=x0+ix*CS,t=type[iz*gw+ix];
      if(!project(wx+2,0,wz+2,tmp3))continue;
      if(tmp3[2]>FOGE)continue;
      const m=focal*CS/tmp3[2]*1.7+8;
      if(tmp3[0]<-m||tmp3[0]>W+m||tmp3[1]<-m||tmp3[1]>Hh+m)continue;
      const gy=t===4?-0.14:0;
      if(!project(wx,gy,wz,tmp3))continue;const x1=tmp3[0],y1=tmp3[1];
      if(!project(wx+CS,gy,wz,tmp3))continue;const x2=tmp3[0],y2=tmp3[1];
      if(!project(wx+CS,gy,wz+CS,tmp3))continue;const x3=tmp3[0],y3=tmp3[1];
      if(!project(wx,gy,wz+CS,tmp3))continue;
      const it=items[nItems++];it.d=tmp3[2];it.k=0;it.o=iz*gw+ix;
      it.x1=x1;it.y1=y1;it.x2=x2;it.y2=y2;it.x3=x3;it.y3=y3;it.x4=tmp3[0];it.y4=tmp3[1];
    }
  }
  /* --- objects --- */
  for(const t of trees){if(project(t.x,0,t.z,tmp3)&&tmp3[2]<FOGE)pushItem(tmp3[2],1,t);}
  if(project(cup.x,0,cup.z,tmp3)){
    pushItem(tmp3[2]+0.1,6,cup);
    if(!ball.sunk||sinkT<0.5)pushItem(tmp3[2]-0.1,2,cup);
  }
  for(const m of marks){if(project(m.x,0,m.z,tmp3))pushItem(tmp3[2],5,m);}
  for(const r of rings){if(project(r.x,0,r.z,tmp3))pushItem(tmp3[2],11,r);}
  for(const q of parts){if(project(q.x,q.y,q.z,tmp3)&&tmp3[2]<FOGE)pushItem(tmp3[2],4,q);}
  if(!ball.sunk||sinkT<0.6){
    if(project(ball.p[0],ball.p[1],ball.p[2],tmp3))pushItem(tmp3[2]-0.05,3,ball);
    if(state==='play'&&canShoot())pushItem(tmp3[2]+0.3,8,null);
  }
  list.length=0;for(let i=0;i<nItems;i++)list.push(items[i]);
  list.sort((a,b)=>b.d-a.d);

  for(const it of list){
    const d=it.d,f=Math.max(0,Math.min(1,(d-FOGS)/(FOGE-FOGS)));
    if(it.k===0){
      const ci=it.o;
      if(f>=1)continue;
      let r2=cur.CR[ci],g2=cur.CG[ci],b2=cur.CB[ci];
      const t=cur.type[ci];
      if(t===4){const s8=Math.sin(time*2+(ci%cur.gw)*5.3+((ci/cur.gw)|0)*7.7)*14;r2+=s8;g2+=s8*0.8;b2+=s8;}
      ctx.fillStyle=f<=0&&t!==4?cur.cols[ci]:'rgb('+((r2+(FOGC[0]-r2)*f)|0)+','+((g2+(FOGC[1]-g2)*f)|0)+','+((b2+(FOGC[2]-b2)*f)|0)+')';
      ctx.beginPath();ctx.moveTo(it.x1,it.y1);ctx.lineTo(it.x2,it.y2);ctx.lineTo(it.x3,it.y3);ctx.lineTo(it.x4,it.y4);ctx.closePath();ctx.fill();
    }
    else if(it.k===6){ /* hole */
      if(!project(cup.x,0,cup.z,tmp3))continue;
      const rx=focal*0.95/tmp3[2],ry=rx*0.42;
      ctx.fillStyle='rgba(230,220,190,0.5)';ctx.beginPath();ctx.ellipse(tmp3[0],tmp3[1],rx*1.18,ry*1.18,0,0,TAU);ctx.fill();
      ctx.fillStyle='#0f1d14';ctx.beginPath();ctx.ellipse(tmp3[0],tmp3[1],rx,ry,0,0,TAU);ctx.fill();
    }
    else if(it.k===2){ /* flag */
      if(!project(cup.x,0,cup.z,tmp3))continue;const B=tmp3;
      if(!project(cup.x,6.4,cup.z,tmp3))continue;const T=tmp3;
      ctx.strokeStyle='#efe6cf';ctx.lineWidth=Math.max(1,focal*0.09/T[2]);
      ctx.beginPath();ctx.moveTo(B[0],B[1]);ctx.lineTo(T[0],T[1]);ctx.stroke();
      const len=focal*2.3/T[2],wv=Math.sin(time*6)*len*0.14*(1+flagWob*0.6);
      ctx.fillStyle='#e8402f';ctx.beginPath();
      ctx.moveTo(T[0],T[1]);ctx.lineTo(T[0]+len,T[1]+2+wv);ctx.lineTo(T[0]+len,T[1]+len*0.45+wv);ctx.lineTo(T[0],T[1]+len*0.45);
      ctx.closePath();ctx.fill();
    }
    else if(it.k===1){ /* tree */
      const o=it.o;
      if(!project(o.x,0,o.z,tmp3))continue;const B=tmp3;
      const sway=Math.sin(time*1.3+o.seed)*0.25*o.s;
      if(!project(o.x+sway,4.6*o.s,o.z,tmp3))continue;const T=tmp3;
      const hf=(B[1]-T[1])*0.62,wpx=focal*(2.7*o.s)/T[2];
      ctx.strokeStyle=mixC([80,54,38],f);ctx.lineWidth=Math.max(1,focal*0.32*o.s/B[2]);
      ctx.beginPath();ctx.moveTo(B[0],B[1]);ctx.lineTo(T[0]+(B[0]-T[0])*0.4,T[1]+hf*0.5);ctx.stroke();
      const tiers=[[23,63,36],[30,75,44],[38,89,52]];
      for(let i=0;i<3;i++){
        const y0=T[1]+hf*(0.42+0.3*i),hw=wpx*(0.42+0.15*i);
        ctx.fillStyle=mixC(tiers[i],f);
        ctx.beginPath();ctx.moveTo(T[0],T[1]-hf*0.16+i*hf*0.1);
        ctx.lineTo(T[0]-hw,y0);ctx.lineTo(T[0]+hw,y0);ctx.closePath();ctx.fill();
      }
    }
    else if(it.k===5){ /* ground mark */
      const m=it.o;if(!project(m.x,0,m.z,tmp3))continue;
      const a=m.life/m.max*0.32,r2=focal*0.4/tmp3[2];
      ctx.fillStyle='rgba(16,28,16,'+a.toFixed(3)+')';
      ctx.beginPath();ctx.ellipse(tmp3[0],tmp3[1],r2,r2*0.45,0,0,TAU);ctx.fill();
    }
    else if(it.k===11){ /* splash ring */
      const r=it.o;if(!project(r.x,0,r.z,tmp3))continue;
      const t2=1-r.life/r.max,rad=focal*(0.4+t2*2.6)/tmp3[2];
      ctx.strokeStyle=r.col+(r.life/r.max*0.7).toFixed(3)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(tmp3[0],tmp3[1],rad,rad*0.42,0,0,TAU);ctx.stroke();
    }
    else if(it.k===4){ /* particle */
      const q=it.o;if(!project(q.x,q.y,q.z,tmp3))continue;
      ctx.globalAlpha=Math.max(0,q.life/q.max);
      ctx.fillStyle='rgb('+q.col[0]+','+q.col[1]+','+q.col[2]+')';
      ctx.beginPath();ctx.arc(tmp3[0],tmp3[1],Math.max(1,focal*q.r/tmp3[2]),0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
    else if(it.k===8){ /* rest pulse */
      if(!project(ball.p[0],0,ball.p[2],tmp3))continue;
      const a=0.16+0.14*Math.sin(time*4),r2=focal*(0.9+0.12*Math.sin(time*4))/tmp3[2];
      ctx.strokeStyle='rgba(255,210,122,'+a.toFixed(3)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(tmp3[0],tmp3[1],r2,r2*0.42,0,0,TAU);ctx.stroke();
    }
    else if(it.k===3){ /* ball */
      const p=ball.p;
      if(p[1]>-0.2){
        if(project(p[0],0,p[2],tmp3)){
          const h=Math.max(0,p[1]),sa=Math.max(0.06,0.42-h*0.02),sr=focal*(0.42+h*0.02)/tmp3[2];
          ctx.fillStyle='rgba(8,16,9,'+sa.toFixed(3)+')';
          ctx.beginPath();ctx.ellipse(tmp3[0],tmp3[1],sr,sr*0.42,0,0,TAU);ctx.fill();
        }
        if(project(p[0],p[1],p[2],tmp3)){
          const r2=focal*R/tmp3[2];
          ctx.drawImage(ballSpr,tmp3[0]-r2*1.15,tmp3[1]-r2*1.15,r2*2.3,r2*2.3);
        }
      }
    }
  }
  /* aim arrow + preview */
  if(state==='play'&&canShoot()){
    const len=4+power*14,dx=Math.sin(aim),dz=Math.cos(aim);
    let px=null,py=null;
    ctx.lineCap='round';
    for(let i=0;i<=8;i++){
      const t2=i/8;
      if(!project(ball.p[0]+dx*len*t2,0.25,ball.p[2]+dz*len*t2,tmp3))continue;
      if(px!==null){
        ctx.strokeStyle='rgba(255,'+((230-160*power)|0)+','+((180-140*power)|0)+',0.9)';
        ctx.lineWidth=4-3*t2;
        ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(tmp3[0],tmp3[1]);ctx.stroke();
      }
      px=tmp3[0];py=tmp3[1];
    }
    if(charging){
      for(let i=0;i<prev.length;i++){
        const pt=prev[i];if(!project(pt[0],pt[1],pt[2],tmp3))continue;
        const t2=i/prev.length;
        ctx.globalAlpha=(0.75*(1-t2)).toFixed(3);
        ctx.fillStyle='#fff3d0';
        ctx.beginPath();ctx.arc(tmp3[0],tmp3[1],2.6-1.6*t2,0,TAU);ctx.fill();
        if(pt[3]){ctx.globalAlpha=0.8;ctx.strokeStyle='#ff7a4d';ctx.lineWidth=2;
          ctx.beginPath();ctx.ellipse(tmp3[0],tmp3[1],focal*0.9/tmp3[2],focal*0.4/tmp3[2],0,0,TAU);ctx.stroke();}
      }
      ctx.globalAlpha=1;
    }
  }
}
function mixC(c,f){if(f<=0)return'rgb('+c[0]+','+c[1]+','+c[2]+')';
  return'rgb('+((c[0]+(FOGC[0]-c[0])*f)|0)+','+((c[1]+(FOGC[1]-c[1])*f)|0)+','+((c[2]+(FOGC[2]-c[2])*f)|0)+')';}

/* ============================== LOOP ============================== */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-lastT)/1000);lastT=now;
  update(dt);render();
  requestAnimationFrame(loop);
}
loadHole(0);placeBallTee();showMenu();
requestAnimationFrame(loop);
</script>
