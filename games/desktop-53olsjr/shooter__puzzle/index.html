<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chroma Ray</title>
<style>
:root{
  --bg0:#0a1120; --bg1:#0e1830;
  --ink:#dfe9ff; --dim:#7d8fb4; --line:#26355a;
  --amber:#ffb454; --cyan:#5fd4ff; --panel:#0f1730;
  --disp:Impact, Haettenschweiler, 'Franklin Gothic Medium','Arial Narrow',sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,'SF Mono',Menlo,monospace;
  --body:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg0)}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,12,24,.9),rgba(7,12,24,0));border-bottom:1px solid rgba(70,100,160,.18)}
#brand{display:flex;flex-direction:column;gap:3px}
.logo{font-family:var(--disp);font-size:19px;letter-spacing:.22em;color:var(--ink)}
.logo b{color:var(--amber);font-weight:normal}
#secName{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim)}
#scores{display:flex;gap:26px;text-align:right}
.scol label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}
.scol b{font-family:var(--mono);font-size:19px;color:var(--ink);font-weight:700}
#best b{color:var(--amber);font-size:14px}

/* ---------- bottom bar ---------- */
#bottom{position:fixed;bottom:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;z-index:5;gap:14px;
  background:linear-gradient(0deg,rgba(7,12,24,.92),rgba(7,12,24,0));border-top:1px solid rgba(255,180,84,.14)}
#pipWrap{display:flex;align-items:center;gap:10px}
#pipWrap label{font-family:var(--mono);font-size:9px;letter-spacing:.3em;color:var(--dim)}
.pip{width:10px;height:10px;transform:rotate(45deg);background:linear-gradient(135deg,#ffd9a0,#ff9d3c);
  box-shadow:0 0 9px rgba(255,170,80,.65);transition:all .3s}
.pip.off{background:transparent;border:1px solid #3a4c78;box-shadow:none;transform:rotate(45deg) scale(.8)}
#hint{flex:1;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--dim);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hint.warn{color:#ff7d8c}
#btns{display:flex;gap:7px;pointer-events:auto}
button{font-family:var(--mono);font-size:12px;color:var(--ink);background:#131c30;border:1px solid #3a4c78;
  min-width:36px;height:34px;padding:0 10px;cursor:pointer;letter-spacing:.1em;transition:all .15s}
button:hover{border-color:var(--amber);color:#ffd9a0;transform:translateY(-2px);box-shadow:0 4px 14px rgba(255,170,80,.15)}
button:active{transform:translateY(0)}
button.primary{background:var(--amber);color:#131a2c;border-color:var(--amber);font-weight:700;min-width:150px;height:40px;font-size:13px}
button.primary:hover{background:#ffc678;color:#131a2c}

/* ---------- banner ---------- */
#banner{position:fixed;top:66px;left:50%;transform:translateX(-50%);text-align:center;z-index:6;pointer-events:none;opacity:0;width:max-content;max-width:92vw}
#banner.show{animation:ban 2.1s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,14px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#banner b{display:block;font-family:var(--disp);font-size:27px;letter-spacing:.2em;color:var(--ink);text-shadow:0 0 24px rgba(120,180,255,.35)}
#banner b i{font-style:normal;color:var(--amber)}
#banner::after{content:"";display:block;width:64px;height:2px;margin:7px auto 5px;background:var(--amber);box-shadow:0 0 10px rgba(255,180,84,.8)}
#banner i{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--dim);font-style:normal}

/* ---------- overlay ---------- */
#ovl{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;
  background:radial-gradient(ellipse at center,rgba(8,13,26,.42) 0%,rgba(5,9,18,.88) 78%)}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.55em;color:var(--amber);text-indent:.55em}
.title{font-family:var(--disp);font-size:clamp(48px,10vw,104px);letter-spacing:.06em;line-height:1;color:#f3f8ff;
  text-shadow:-4px 0 rgba(255,70,100,.7),4px 0 rgba(70,160,255,.7),0 0 34px rgba(140,190,255,.35)}
.title span{color:var(--amber);text-shadow:-4px 0 rgba(255,70,100,.55),4px 0 rgba(70,160,255,.55),0 0 34px rgba(255,180,84,.3)}
.lede{max-width:600px;text-align:center;font-size:13.5px;line-height:1.7;color:#aebbdd;padding:0 20px}
.lede b{color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:9px 14px;max-width:760px;padding:0 14px}
.keys span{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;display:flex;align-items:center;gap:7px}
kbd{font-family:var(--mono);font-size:10.5px;color:#cfe0ff;background:#16223f;border:1px solid #3a4c78;border-bottom-width:2px;
  padding:3px 8px;letter-spacing:.08em}
.bestline{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--dim)}
.bestline b{color:var(--amber)}
.cta{font-family:var(--mono);font-size:12.5px;letter-spacing:.4em;text-indent:.4em;color:var(--ink);animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.card{background:rgba(15,23,48,.96);border:1px solid #2c3b5e;border-left:4px solid var(--amber);
  box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 60px rgba(90,140,255,.08);padding:30px 38px;min-width:min(420px,90vw);
  animation:pop .38s cubic-bezier(.2,1.5,.4,1)}
.card.fail{border-left-color:#ff5470}
@keyframes pop{from{transform:translateY(20px) scale(.95);opacity:0}}
.ctag{font-family:var(--mono);font-size:10px;letter-spacing:.4em;color:var(--amber)}
.card.fail .ctag{color:#ff7d8c}
.card h2{font-family:var(--disp);font-size:34px;letter-spacing:.12em;margin:8px 0 18px;color:var(--ink)}
.tally{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--dim);
  letter-spacing:.12em;padding:7px 0;border-bottom:1px dashed #2c3b5e}
.tally b{color:var(--ink)}
.tally.total{border-bottom:none;font-size:14px;padding-top:11px}
.tally.total b{color:var(--amber);font-size:17px}
.row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="top">
  <div id="brand"><span class="logo">CHROMA<b>RAY</b></span><em id="secName">SECTOR 01 · FIRST LIGHT</em></div>
  <div id="scores">
    <div class="scol"><label>SCORE</label><b id="score">0</b></div>
    <div class="scol" id="best"><label>BEST</label><b id="bestV">0</b></div>
  </div>
</div>

<div id="bottom">
  <div id="pipWrap"><label>CHARGES</label><div id="pips" style="display:flex;gap:8px"></div></div>
  <div id="hint">HOLD TO FIRE — CLICK A MIRROR TO FLIP ITS FACE</div>
  <div id="btns">
    <button id="bRestart" title="Restart (R)">⟲</button>
    <button id="bPrev" title="Previous sector">◀</button>
    <button id="bNext" title="Next sector">▶</button>
    <button id="bMute" title="Sound (M)">♪ ON</button>
  </div>
</div>

<div id="banner"></div>
<div id="ovl"></div>

<script>
(()=>{ 'use strict';
/* ============================== helpers ============================== */
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const pad=n=>String(n).padStart(2,'0');
const W=13,H=9, MUZ={x:-0.28,y:4.5};

/* ============================== levels ============================== */
const LEVELS=[
{n:'FIRST LIGHT',c:3,tip:'THE CANNON SWIVELS FREE — POP EVERY CRYSTAL',g:[
'.............','.....w.......','.............','.............','.............','.........w...','.............','.............','.............']},
{n:'BANK SHOT',c:3,tip:'CLICK A MIRROR TO FLIP ITS FACE',g:[
'.............','........w....','.....#.......','......#......','........\\....','.............','..........w..','.............','.............']},
{n:'SPLIT',c:2,tip:'A PRISM SPLITS WHITE LIGHT INTO THREE COLORS',g:[
'.....g.......','.............','.............','.............','.....o....r..','.............','.............','.............','.....b.......']},
{n:'CROSSFIRE',c:3,tip:'ONE BEAM CAN POP MANY CRYSTALS — ROUTE IT WELL',g:[
'.............','......\\..g...','.............','.............','......o....r.','.............','.............','....../....b.','.............']},
{n:'GAUNTLET',c:3,tip:'TWO FLIPS. ONE UNBROKEN BEAM.',g:[
'.............','....\\....w...','......##.....','.............','....\\...x....','.............','.......x.....','.............','.............']},
{n:'SPECTRUM ROUTE',c:3,tip:'EVERY COLOR NEEDS ITS OWN PATH HOME',g:[
'.........r...','.............','.....\\......g','.............','.....o...\\...','.............','...../......b','.............','.............']},
{n:'TWO MOVES',c:2,tip:'EACH CHARGE IS ONE SHOT. PLAN BOTH.',g:[
'.............','......w......','....##.......','.............','......\\......','.............','....##.......','......w......','.............']},
{n:'FULL SPECTRUM',c:3,tip:"BOLTED MIRRORS [ ] CAN'T BE TURNED",g:[
'....r......]..','......\\.....g','.............','....x......x.','......o...\\..','.............','.............','......].....b','.............']},
{n:'THE WALL',c:3,tip:'THREAD THE GAP — THE PRISM DOES THE REST',g:[
'........#....','........#.g..','........#....','........#....','..........o.r','........#....','........#....','..w.....#.b..','........#....']},
{n:'CHROMA CORE',c:4,tip:'ALL SECTORS. ALL LIGHTS. NO MERCY.',g:[
'.........r..x','.g.../.......','.......x.....','...x.........','.....o...\\...','.............','.............','...../......b','.............']}
];

const COL=[
 {g:'255,64,96', m:'255,120,140', core:'#ffe3e8'},
 {g:'38,236,136',m:'120,255,190', core:'#e2fff1'},
 {g:'64,150,255',m:'130,190,255', core:'#e2efff'},
 {g:'220,240,255',m:'245,250,255',core:'#ffffff'}];

/* ============================== audio ============================== */
let AC=null,master=null;
function initAudio(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain(); master.gain.value=0.42; master.connect(AC.destination);}catch(e){} }
function tone(f,dur,type,vol,slide,delay){ if(!AC||G.muted)return; type=type||'sine';vol=vol==null?0.2:vol;delay=delay||0;
 const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t0);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);
 g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);}
function noiseBurst(dur,vol,freq,delay){ if(!AC||G.muted)return; delay=delay||0;
 const t0=AC.currentTime+delay,len=Math.max(1,(dur*AC.sampleRate)|0),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
 const src=AC.createBufferSource();src.buffer=buf;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 src.connect(f);f.connect(g);g.connect(master);src.start(t0);}
const sfx={
 fire(){noiseBurst(0.12,0.32,750);tone(150,0.16,'sawtooth',0.2,60);},
 tick(){tone(950,0.045,'square',0.11);tone(1420,0.035,'square',0.07,0,0.03);},
 prism(){[523,659,784].forEach((f,i)=>tone(f,0.13,'triangle',0.11,0,i*0.05));},
 pop(ci){const f=[440,554,659,880][ci];tone(f,0.18,'triangle',0.24,f*1.6);noiseBurst(0.07,0.13,3200);},
 absorb(){tone(280,0.24,'sine',0.22,60);noiseBurst(0.16,0.1,420);},
 thud(){tone(95,0.08,'sine',0.11);},
 clear(){[523,659,784,1047].forEach((f,i)=>tone(f,0.22,'triangle',0.18,0,i*0.09));noiseBurst(0.3,0.1,2400,0.2);},
 fail(){[233,208,175].forEach((f,i)=>tone(f,0.3,'sawtooth',0.12,0,i*0.16));},
 ui(){tone(660,0.04,'square',0.06);}
};

/* ============================== state ============================== */
const G={screen:'menu',fresh:true,resume:false,level:-1,score:0,best:0,unlocked:1,muted:false,
 charges:0,startScore:0,cryTotal:0,crystalsLeft:0,grid:null,rotMirrors:[],selIdx:-1,
 firing:false,aim:-0.15,beams:[],lastSegs:null,ghost:null,parts:[],pops:[],shake:0,recoil:0,
 hover:null,clearT:null,failT:0,cleared:false,failed:false,time:0,active:{},scd:{},hintT:0};
try{const d=JSON.parse(localStorage.getItem('chromaray_v1')||'{}');G.best=d.best|0;
 G.unlocked=clamp(d.unlocked|0,1,LEVELS.length);G.muted=!!d.muted;}catch(e){}
function save(){try{localStorage.setItem('chromaray_v1',JSON.stringify({best:G.best,unlocked:G.unlocked,muted:G.muted}));}catch(e){}}

/* ============================== layout ============================== */
let cw=0,ch=0,ts=40,ox=0,oy=0;
function resize(){ const dpr=Math.min(window.devicePixelRatio||1,2);
 cw=window.innerWidth;ch=window.innerHeight;
 cv.width=cw*dpr;cv.height=ch*dpr;cv.style.width=cw+'px';cv.style.height=ch+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const topH=56,botH=60,availW=Math.min(cw-24,1560),availH=ch-topH-botH-24;
 ts=clamp(Math.min(availW/14.7,availH/9.6),13,74);
 ox=(cw-14.7*ts)/2+1.5*ts; oy=topH+(availH-9*ts)/2+4;}
window.addEventListener('resize',resize);resize();
const w2x=v=>ox+v*ts, w2y=v=>oy+v*ts;

/* ============================== level parse ============================== */
function makeTile(ch){switch(ch){
 case '/':return{t:'mirror',dir:0};case '\\':return{t:'mirror',dir:1};
 case '[':return{t:'mirror',dir:0,fixed:1};case ']':return{t:'mirror',dir:1,fixed:1};
 case 'o':return{t:'prism',flash:0};case '#':return{t:'rock'};case 'x':return{t:'void'};
 case 'w':return{t:'cry',c:3,popped:false,glint:0};case 'r':return{t:'cry',c:0,popped:false,glint:0};
 case 'g':return{t:'cry',c:1,popped:false,glint:0};case 'b':return{t:'cry',c:2,popped:false,glint:0};
 default:return null;}}
function loadLevel(i){ G.level=i;const L=LEVELS[i];
 G.grid=L.g.map((row,y)=>{ const r=row.length<W?row+'.'.repeat(W-row.length):row.slice(0,W);
   return r.split('').map(c=>makeTile(c));});
 G.cryTotal=0;G.crystalsLeft=0;
 for(const row of G.grid)for(const t of row)if(t&&t.t==='cry'){G.cryTotal++;G.crystalsLeft++;}
 G.rotMirrors=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=G.grid[y][x];
   if(t&&t.t==='mirror'&&!t.fixed){t.flipT=0;t.ph=x*1.7+y*2.3;G.rotMirrors.push({t,x,y});}}
 G.selIdx=-1;G.charges=L.c;G.startScore=G.score;
 G.firing=false;G.beams=[];G.lastSegs=null;G.ghost=null;G.parts.length=0;G.pops.length=0;
 G.clearT=null;G.failT=0;G.cleared=false;G.failed=false;G.hintT=6;G.active={};
 renderPips();updateHUD();showBanner(i);sfx.ui();}

/* ============================== beam casting (DDA) ============================== */
function castBeams(){ const segs=[],events=[];
 if(!G.firing||!G.grid)return{segs,events};
 const dx0=Math.cos(G.aim),dy0=Math.sin(G.aim);
 const queue=[{x:MUZ.x,y:MUZ.y,dx:dx0,dy:dy0,c:3}];
 const seen=new Set();let guard=0;
 while(queue.length&&guard++<64){
  let x=queue[guard-1]&&0, y=0, dx, dy, c; 
  const b=queue.shift(); x=b.x;y=b.y;dx=b.dx;dy=b.dy;c=b.c;
  for(let s=0;s<260;s++){
   const fx=Math.floor(x),fy=Math.floor(y);
   let tx=dx>1e-9?(fx+1-x)/dx:(dx<-1e-9?(x-fx)/-dx:Infinity);
   let ty=dy>1e-9?(fy+1-y)/dy:(dy<-1e-9?(y-fy)/-dy:Infinity);
   const t=Math.min(tx,ty); if(!isFinite(t))break;
   const diag=Math.abs(tx-ty)<1e-6;
   const cx=(diag||tx<ty)?(dx>0?fx+1:fx):fx;
   const cy=(diag||ty<tx)?(dy>0?fy+1:fy):fy;
   const px=x+dx*t, py=y+dy*t;
   if(cx<-2||cy<-2||cx>=W+2||cy>=H+2){segs.push({x1:x,y1:y,x2:px,y2:py,c,end:true});break;}
   const tile=(cy>=0&&cy<H&&cx>=0&&cx<W)?G.grid[cy][cx]:null;
   if(!tile){x=px+dx*1e-5;y=py+dy*1e-5;continue;}
   /* mirror */
   if(tile.t==='mirror'){
     const n=tile.dir===0?[1,1]:[1,-1], dn=dx*n[0]+dy*n[1];
     if(Math.abs(dn)>1e-6){
       let tt; if(tile.dir===0)tt=(cx+cy+1-x-y)/(dx+dy); else tt=(cx-cy-x+y)/(dx-dy);
       const hx=x+dx*tt, hy=y+dy*tt;
       if(tt>1e-6&&hx>cx-0.02&&hx<cx+1.02&&hy>cy-0.02&&hy<cy+1.02){
         segs.push({x1:x,y1:y,x2:hx,y2:hy,c});
         const ndx=dx-dn*n[0], ndy=dy-dn*n[1];
         x=hx+ndx*1e-3;y=hy+ndy*1e-3;dx=ndx;dy=ndy;
         const key=cx+','+cy+','+dx.toFixed(3)+','+dy.toFixed(3)+','+c;
         if(seen.has(key)){events.push({type:'loop',x:hx,y:hy});break;}seen.add(key);
         continue;}}
   }
   /* prism */
   if(tile.t==='prism'){
     const mx=cx+0.5,my=cy+0.5;
     if(c===3){ segs.push({x1:x,y1:y,x2:mx,y2:my,c});
       tile.flash=1;events.push({type:'prism',x:mx,y:my,tile});
       queue.push({x:mx,y:my,dx,dy,c:0});
       queue.push({x:mx,y:my,dx:dy,dy:-dx,c:1});
       queue.push({x:mx,y:my,dx:-dy,dy:dx,c:2});
       break; }
   }
   /* crystal */
   if(tile.t==='cry'){
     if(!tile.popped&&(c===tile.c||tile.c===3)){
       const mx=cx+0.5,my=cy+0.5;
       segs.push({x1:x,y1:y,x2:mx,y2:my,c,end:true});
       tile.popped=true;events.push({type:'pop',x:mx,y:my,tile,c});break;}
     else if(!tile.popped&&c!==3){tile.glint=1;}
   }
   /* solid */
   if(tile.t==='rock'||tile.t==='void'){
     segs.push({x1:x,y1:y,x2:px,y2:py,c,end:true});
     events.push({type:'hit',x:px,y:py,tile});break;}
   x=px+dx*1e-5;y=py+dy*1e-5;
  }}
 return{segs,events};}

function setChanged(k,s){const p=G.active[k];if(!p)return true;if(p.size!==s.size)return true;
 for(const t of s)if(!p.has(t))return true;return false;}
function processEvents(evs){
 for(const e of evs)if(e.type==='pop'){ G.crystalsLeft--;G.score+=100;
   addPop(e.x,e.y,'+100',COL[e.c].core);burst(e.x,e.y,e.c);
   G.shake=Math.min(G.shake+4,9);sfx.pop(e.c);}
 const pr=new Set(),vv=new Set(),rr=new Set();
 for(const e of evs){ if(e.type==='prism'){pr.add(e.tile);e.tile.flash=1;}
  else if(e.type==='hit'){ if(e.tile.t==='void'){vv.add(e.tile);if(Math.random()<0.6)spark(e.x,e.y,'255,140,90',2);}
   else{rr.add(e.tile);if(Math.random()<0.5)spark(e.x,e.y,'200,215,240',1);} }}
 if(pr.size&&setChanged('pr',pr))sfx.prism(); G.active.pr=pr;
 if(vv.size&&setChanged('vv',vv))sfx.absorb(); G.active.vv=vv;
 if(rr.size&&setChanged('rr',rr)&&G.time-(G.scd.rock||0)>0.22){sfx.thud();G.scd.rock=G.time;} G.active.rr=rr;
 if(G.crystalsLeft===0&&!G.cleared&&G.clearT==null)G.clearT=0.0001;}

/* ============================== particles / popups ============================== */

 const bonus=G.charges*50;G.score+=bonus;
 G.best=Math.max(G.best,G.score);
 G.unlocked=Math.max(G.unlocked,Math.min(LEVELS.length,G.level+2));save();

 for(let i=0;i<46;i++){const a=Math.random()*TAU,sp=2+Math.random()*7;

/* ============================== input ============================== */
const keys=new Set();
window.addEventListener('keydown',e=>{ initAudio(); if(AC&&AC.state==='suspended')AC.resume();
 const k=e.key;
 if(k===' '||k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown')e.preventDefault();
 if(G.screen==='menu'){ if(!e.repeat)beginRun(); return;}
 keys.add(k.length===1?k.toLowerCase():k);
 if(e.repeat)return;
 if(k===' '){tryFire();}
 else if(k==='r'||k==='R')retry();
 else if(k==='m'||k==='M')toggleMute();
 else if(k==='Escape')toMenu();
 else if(k==='n'||k==='N'){if(G.level+1<G.unlocked)nextLevel();}
 else if(k==='Enter'){ if(G.cleared){G.level===LEVELS.length-1?(G.score=0,loadLevel(0),G.screen='play',ovl.style.display='none'):nextLevel();}
  else if(G.failed)retry();}
 else if(k==='q'||k==='Q')cycleSel(-1);
 else if(k==='e'||k==='E')cycleSel(1);
 else if(k==='f'||k==='F'){if(G.rotMirrors.length){const m=G.rotMirrors[(G.selIdx+G.rotMirrors.length)%G.rotMirrors.length];if(m)toggleMirror(m.t);}}
 else if(k>='1'&&k<='9')jumpLevel(+k-1);
 else if(k==='0')jumpLevel(9);});
window.addEventListener('keyup',e=>{const k=e.key;keys.delete(k.length===1?k.toLowerCase():k);});
function jumpLevel(i){ if(i<G.unlocked&&i!==G.level)loadLevel(i); }
function cycleSel(d){ if(!G.rotMirrors.length)return;
 G.selIdx=G.selIdx<0?(d>0?0:G.rotMirrors.length-1):(G.selIdx+d+G.rotMirrors.length)%G.rotMirrors.length;sfx.ui();}

function ptrWorld(e){ return{x:(e.clientX-ox)/ts,y:(e.clientY-oy)/ts}; }
function aimAt(e){ const p=ptrWorld(e);
 G.aim=clamp(Math.atan2(p.y-MUZ.y,p.x-MUZ.x),-1.45,1.45);}
function mirrorAt(e){ const p=ptrWorld(e),cx=Math.floor(p.x),cy=Math.floor(p.y);
 if(cx<0||cy<0||cx>=W||cy>=H)return null;const t=G.grid?G.grid[cy][cx]:null;
 return(t&&t.t==='mirror'&&!t.fixed)?t:null;}
function toggleMirror(t){ t.dir^=1;t.flipT=1;sfx.tick();
 for(let i=0;i<G.rotMirrors.length;i++)if(G.rotMirrors[i].t===t)G.selIdx=i;
 spark(pxcx(t),pycy(t),'140,220,255',3);}
function pxcx(t){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(G.grid[y][x]===t)return{x,y};return{x:0,y:0};}
function pycy(t){const r=pxcx(t);return r;}
cv.addEventListener('pointermove',e=>{ if(G.screen!=='play')return; aimAt(e);
 const m=mirrorAt(e);G.hover=m||null;cv.style.cursor=m?'pointer':'crosshair';});
cv.addEventListener('pointerdown',e=>{ initAudio(); if(AC&&AC.state==='suspended')AC.resume();
 if(G.screen!=='play'){G.fresh?beginRun():(G.screen='play',ovl.style.display='none');return;}
 aimAt(e);const m=mirrorAt(e);
 if(m){toggleMirror(m);return;} tryFire();});
window.addEventListener('pointerup',stopFiring);
window.addEventListener('pointercancel',stopFiring);
window.addEventListener('blur',()=>{stopFiring();keys.clear();});
cv.addEventListener('contextmenu',e=>{e.preventDefault();const m=mirrorAt(e);if(m)toggleMirror(m);});
function tryFire(){ if(G.screen!=='play'||G.cleared||G.failed)return;
 if(G.charges<=0){sfx.fail();return;}
 G.firing=true;G.charges--;G.recoil=1;renderPips();sfx.fire();updateHUD();}
function stopFiring(){ if(!G.firing)return;G.firing=false;
 G.ghost={segs:G.lastSegs||[],t:0.45};}

const stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random(),y:Math.random(),r:0.5+Math.random()*1.4,
 ph:Math.random()*TAU,sp:0.3+Math.random()*0.8,l:i%3});

/* ============================== update ============================== */
function update(dt){ G.time+=dt;
 if(G.hintT>0)G.hintT-=dt;
 if(G.screen==='play'){
  if(keys.has('ArrowLeft')||keys.has('a'))G.aim=clamp(G.aim-dt*1.9,-1.45,1.45);
  if(keys.has('ArrowRight')||keys.has('d'))G.aim=clamp(G.aim+dt*1.9,-1.45,1.45);
  if(keys.has(' ')&&!G.firing&&document.activeElement!==cv)tryFire();
 }
 if(G.screen==='play'&&G.firing){ const r=castBeams();G.beams=r.segs;G.lastSegs=r.segs;processEvents(r.events);}
 else G.beams=[];
 if(G.ghost){G.ghost.t-=dt;if(G.ghost.t<=0)G.ghost=null;}
 if(G.clearT!=null&&!G.cleared){G.clearT+=dt;if(G.clearT>0.85)doClear();}
 if(G.screen==='play'&&!G.firing&&G.charges===0&&G.crystalsLeft>0&&!G.cleared&&!G.failed){
  G.failT+=dt;if(G.failT>0.75){G.failed=true;G.ghost={segs:G.lastSegs||[],t:0.45};sfx.fail();updateHUD();showFail();}}
 for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;
  if(p.life<=0){G.parts.splice(i,1);continue;}
  if(p.ring)p.r+=p.vr*dt;else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*2.4);p.vy=p.vy*Math.exp(-dt*2.4)+0.6*dt;}}
 for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.life-=dt*0.9;p.y-=dt*1.1;if(p.life<=0)G.pops.splice(i,1);}
 G.shake*=Math.exp(-dt*5.5); if(G.shake<0.05)G.shake=0;
 G.recoil=Math.max(0,G.recoil-dt*4);
 for(const row of (G.grid||[]))for(const t of row){ if(!t)continue;
  if(t.flash>0)t.flash=Math.max(0,t.flash-dt*2.5);
  if(t.glint>0)t.glint=Math.max(0,t.glint-dt*3);
  if(t.flipT>0)t.flipT=Math.max(0,t.flipT-dt*6);}}

/* ============================== render ============================== */
function bg(){ const g=ctx.createLinearGradient(0,0,0,ch);
 g.addColorStop(0,'#0a1120');g.addColorStop(0.55,'#0d1830');g.addColorStop(1,'#0a1424');
 ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);}
function nebula(){ const t=G.time;
 ctx.save();ctx.globalCompositeOperation='lighter';
 let x=cw*(0.3+0.08*Math.sin(t*0.05)),y=ch*(0.35+0.06*Math.cos(t*0.04));
 let g=ctx.createRadialGradient(x,y,0,x,y,cw*0.5);g.addColorStop(0,'rgba(45,120,165,0.09)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
 x=cw*(0.75+0.07*Math.cos(t*0.045));y=ch*(0.65+0.07*Math.sin(t*0.05));
 g=ctx.createRadialGradient(x,y,0,x,y,cw*0.45);g.addColorStop(0,'rgba(255,150,80,0.05)');g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);ctx.restore();}
function starsDraw(){ const t=G.time;
 for(const s of stars){ const a=0.25+0.5*Math.abs(Math.sin(t*s.sp+s.ph));
  const x=(s.x*cw+t*4*(s.l+1)*0.15)%cw, y=s.y*ch;
  ctx.globalAlpha=a*(0.4+s.l*0.3);ctx.fillStyle=s.l===2?'#ffe9c9':'#bcd6ff';
  ctx.fillRect(x,y,s.r,s.r);} ctx.globalAlpha=1;}
function vignette(){ let g=ctx.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.35,cw/2,ch/2,Math.max(cw,ch)*0.75);
 g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(4,8,16,0.55)');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);}

function drawBeamPx(segs,alpha){ if(!segs.length)return;
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 const pass=(w,a,colFn)=>{for(const s of segs){ctx.strokeStyle=colFn(s.c);ctx.globalAlpha=a*alpha;ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();}};
 pass(Math.max(12,ts*0.42),0.13,c=>'rgb('+COL[c].g+')');
 pass(Math.max(5,ts*0.17),0.55,c=>'rgb('+COL[c].m+')');
 pass(Math.max(2,ts*0.07),0.95,c=>COL[c].core);
 ctx.setLineDash([Math.max(6,ts*0.35),Math.max(8,ts*0.5)]);ctx.lineDashOffset=-G.time*ts*4;
 pass(Math.max(1.5,ts*0.05),0.7,()=>'#ffffff');ctx.setLineDash([]);
 for(const s of segs)if(s.end){const r=Math.max(7,ts*0.32);
  const g=ctx.createRadialGradient(s.x2,s.y2,0,s.x2,s.y2,r);
  g.addColorStop(0,'rgba('+COL[s.c].m+',0.9)');g.addColorStop(1,'rgba('+COL[s.c].m+',0)');
  ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x2,s.y2,r,0,TAU);ctx.fill();}
 ctx.restore();}

function frame(){ ctx.save();
 ctx.fillStyle='rgba(70,110,190,0.045)';ctx.fillRect(ox-6,oy-6,W*ts+12,H*ts+12);
 ctx.strokeStyle='rgba(95,130,190,0.3)';ctx.lineWidth=1;ctx.strokeRect(ox-0.5,oy-0.5,W*ts+1,H*ts+1);
 ctx.strokeStyle='rgba(95,130,190,0.1)';ctx.strokeRect(ox+4.5,oy+4.5,W*ts-9,H*ts-9);
 ctx.strokeStyle='rgba(255,180,84,0.5)';ctx.lineWidth=1.5;const L=10;
 [[ox,oy,1,1],[ox+W*ts,oy,-1,1],[ox,oy+H*ts,1,-1],[ox+W*ts,oy+H*ts,-1,-1]].forEach(c=>{
  ctx.beginPath();ctx.moveTo(c[0]+c[2]*L,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*L);ctx.stroke();});
 ctx.strokeStyle='rgba(95,130,190,0.06)';ctx.lineWidth=1;
 for(let i=1;i<W;i++){ctx.beginPath();ctx.moveTo(ox+i*ts,oy);ctx.lineTo(ox+i*ts,oy+H*ts);ctx.stroke();}
 for(let j=1;j<H;j++){ctx.beginPath();ctx.moveTo(ox,oy+j*ts);ctx.lineTo(ox+W*ts,oy+j*ts);ctx.stroke();}
 ctx.restore();}

function drawTiles(){ const t=G.time;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const tl=G.grid[y][x];if(!tl)continue;
  const X=w2x(x),Y=w2y(y);
  if(tl.t==='rock'){ ctx.fillStyle='#2b3a58';ctx.fillRect(X+2,Y+2,ts-4,ts-4);
   ctx.fillStyle='rgba(160,190,240,0.14)';ctx.fillRect(X+2,Y+2,ts-4,2);
   ctx.fillStyle='rgba(5,8,18,0.5)';ctx.fillRect(X+2,Y+ts-4,ts-4,2);
   ctx.strokeStyle='rgba(120,150,210,0.25)';ctx.strokeRect(X+2.5,Y+2.5,ts-5,ts-5);
   ctx.strokeStyle='rgba(10,16,30,0.6)';ctx.beginPath();
   ctx.moveTo(X+ts*0.3,Y+ts*0.35);ctx.lineTo(X+ts*0.52,Y+ts*0.55);ctx.lineTo(X+ts*0.44,Y+ts*0.78);ctx.stroke();}
  else if(tl.t==='void'){ const cx=X+ts/2,cy=Y+ts/2,r=ts*0.36;
   const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
   g.addColorStop(0,'#04050d');g.addColorStop(0.75,'#140b2e');g.addColorStop(1,'rgba(90,50,180,0.35)');
   ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
   ctx.strokeStyle='rgba(160,100,255,0.45)';ctx.lineWidth=1.2;ctx.stroke();
   ctx.save();ctx.strokeStyle='rgba(180,120,255,0.35)';ctx.setLineDash([4,7]);ctx.lineDashOffset=t*14;
   ctx.beginPath();ctx.arc(cx,cy,r*0.62,0,TAU);ctx.stroke();ctx.restore();}
  else if(tl.t==='prism'){ const cx=X+ts/2,cy=Y+ts/2,r=ts*0.42,f=tl.flash||0;
   ctx.save();if(f>0){ctx.shadowColor='rgba(240,250,255,'+(0.9*f)+')';ctx.shadowBlur=22*f;}
   const g=ctx.createLinearGradient(cx-r,cy+r,cx+r,cy-r);
   g.addColorStop(0,'rgba(255,80,110,0.85)');g.addColorStop(0.5,'rgba(90,240,170,0.85)');g.addColorStop(1,'rgba(90,160,255,0.85)');
   ctx.fillStyle=g;ctx.beginPath();
   ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r*0.85,cy+r*0.6);ctx.lineTo(cx-r*0.85,cy+r*0.6);ctx.closePath();ctx.fill();
   ctx.strokeStyle='rgba(245,252,255,'+(0.75+0.25*f)+')';ctx.lineWidth=1.5;ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.beginPath();
   ctx.moveTo(cx,cy-r);ctx.lineTo(cx,cy+r*0.6);ctx.moveTo(cx,cy-r*0.15);ctx.lineTo(cx-r*0.55,cy+r*0.42);ctx.stroke();
   ctx.restore();}
  else if(tl.t==='mirror'){ const in2=ts*0.18;
   let x1,y1,x2,y2,ghostDir=null;
   if(tl.dir===0){x1=X+in2;y1=Y+ts-in2;x2=X+ts-in2;y2=Y+in2;ghostDir=1;}
   else{x1=X+in2;y1=Y+in2;x2=X+ts-in2;y2=Y+ts-in2;ghostDir=0;}
   const cx=X+ts/2,cy=Y+ts/2, s=tl.flipT>0?Math.abs(Math.cos(Math.PI*tl.flipT)):1;
   const hovered=G.hover===tl||G.rotMirrors.some((m,i)=>G.selIdx===i&&m.t===tl);
   ctx.save();ctx.translate(cx,cy);ctx.scale(s,1);ctx.translate(-cx,-cy);
   if(!tl.fixed){ctx.shadowColor='rgba(95,212,255,'+(0.35+0.2*Math.sin(t*2.4+tl.ph))+(hovered?',0.8):')');}
   ctx.strokeStyle=tl.fixed?'rgba(150,165,195,0.7)':'rgba(190,225,255,0.9)';
   ctx.lineWidth=Math.max(3,ts*0.13);ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.strokeStyle=tl.fixed?'rgba(70,85,115,0.9)':'rgba(60,110,170,0.9)';
   ctx.lineWidth=Math.max(1.5,ts*0.05);
   ctx.beginPath();ctx.moveTo(x1,y1+(tl.dir===0?-2:2));ctx.lineTo(x2,y2+(tl.dir===0?-2:2));ctx.stroke();
   if(tl.fixed){ctx.fillStyle='#8fa3c8';
   [[x1,y1],[x2,y2]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],Math.max(1.5,ts*0.045),0,TAU);ctx.fill();});}
   ctx.restore();
   if(!tl.fixed&&(G.hover===tl||hovered)){
    const gi=ts*0.18;let gx1,gy1,gx2,gy2;
    if(ghostDir===1){gx1=X+gi;gy1=Y+gi;gx2=X+ts-gi;gy2=Y+ts-gi;}else{gx1=X+gi;gy1=Y+ts-gi;gx2=X+ts-gi;gy2=Y+gi;}
    ctx.save();ctx.strokeStyle='rgba(95,212,255,0.4)';ctx.setLineDash([3,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(gx1,gy1);ctx.lineTo(gx2,gy2);ctx.stroke();ctx.restore();
    ctx.strokeStyle='rgba(255,180,84,'+(0.5+0.3*Math.sin(t*6))+')';ctx.lineWidth=1.5;const B=5,o2=3;
    [[X+o2,Y+o2,1,1],[X+ts-o2,Y+o2,-1,1],[X+o2,Y+ts-o2,1,-1],[X+ts-o2,Y+ts-o2,-1,-1]].forEach(c=>{
     ctx.beginPath();ctx.moveTo(c[0]+c[2]*B,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*B);ctx.stroke();});}}
  else if(tl.t==='cry'&&!tl.popped){ const ci=tl.c, col=COL[ci];
   const bob=Math.sin(t*2+x*1.3+y*2.1)*ts*0.045, cx=X+ts/2, cy=Y+ts/2+bob;
   const r=ts*0.3*(1+0.05*Math.sin(t*3+x+y));
   ctx.save();ctx.shadowColor='rgba('+col.g+',0.9)';ctx.shadowBlur=14;
   ctx.fillStyle=ci===3?'#f2f8ff':'rgb('+col.m+')';
   ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r*0.85,cy);ctx.lineTo(cx,cy+r);ctx.lineTo(cx-r*0.85,cy);ctx.closePath();ctx.fill();
   ctx.shadowBlur=0;
   if(ci===3){ctx.strokeStyle='hsla('+((t*70+x*40)%360)+',85%,72%,0.9)';}
   else ctx.strokeStyle=col.core;
   ctx.lineWidth=1.4;ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
   ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx,cy+r);ctx.moveTo(cx-r*0.85,cy);ctx.lineTo(cx+r*0.85,cy);ctx.stroke();
   if(tl.glint>0){ctx.strokeStyle='rgba(255,255,255,'+(tl.glint*0.7)+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,cy,r+4+(1-tl.glint)*6,0,TAU);ctx.stroke();}
   ctx.restore();}} }

function drawAim(){ if(G.firing)return; const mx=w2x(MUZ.x),my=w2y(MUZ.y);
 const L=ts*2.7,dx=Math.cos(G.aim),dy=Math.sin(G.aim);
 ctx.save();ctx.strokeStyle='rgba(255,190,110,0.3)';ctx.setLineDash([5,8]);ctx.lineWidth=1.4;
 ctx.beginPath();ctx.moveTo(mx+dx*ts*0.7,my+dy*ts*0.7);ctx.lineTo(mx+dx*L,my+dy*L);ctx.stroke();
 ctx.setLineDash([]);ctx.fillStyle='rgba(255,190,110,0.45)';
 ctx.beginPath();ctx.arc(mx+dx*L,my+dy*L,2.4,0,TAU);ctx.fill();ctx.restore();}

function drawCannon(){ const bx=w2x(-0.85),by=w2y(4.5),t=G.time;
 ctx.save();
 ctx.fillStyle='#1b2740';ctx.beginPath();ctx.arc(bx,by,ts*0.52,0,TAU);ctx.fill();
 ctx.strokeStyle='#3a4c78';ctx.lineWidth=1.5;ctx.stroke();
 for(let i=0;i<LEVELS[G.level].c;i++){ const a=-Math.PI/2+(i-(LEVELS[G.level].c-1)/2)*0.5;
  const px2=bx+Math.cos(a)*ts*0.42, py2=by+Math.sin(a)*ts*0.42;
  ctx.fillStyle=i<G.charges?'#ffb454':'rgba(70,90,130,0.6)';
  if(i<G.charges){ctx.shadowColor='rgba(255,180,84,0.8)';ctx.shadowBlur=6;}
  ctx.beginPath();ctx.arc(px2,py2,Math.max(1.5,ts*0.045),0,TAU);ctx.fill();ctx.shadowBlur=0;}
 ctx.save();ctx.translate(bx,by);ctx.rotate(G.aim);
 const rec=G.recoil*ts*0.14;
 let g=ctx.createLinearGradient(0,-ts*0.16,0,ts*0.16);
 g.addColorStop(0,'#5a729f');g.addColorStop(0.5,'#3c5080');g.addColorStop(1,'#243356');
 ctx.fillStyle=g;ctx.fillRect(-ts*0.1-rec,-ts*0.16,ts*0.72,ts*0.32);
 ctx.strokeStyle='#141d33';ctx.strokeRect(-ts*0.1-rec,-ts*0.16,ts*0.72,ts*0.32);
 ctx.fillStyle='#ffb454';ctx.fillRect(ts*0.52-rec,-ts*0.14,ts*0.08,ts*0.28);
 ctx.restore();
 if(G.firing){ ctx.shadowColor='rgba(255,220,160,0.9)';ctx.shadowBlur=18;
  const g2=ctx.createRadialGradient(bx+Math.cos(G.aim)*ts*0.62,by+Math.sin(G.aim)*ts*0.62,0,
   bx+Math.cos(G.aim)*ts*0.62,by+Math.sin(G.aim)*ts*0.62,ts*0.5);
  g2.addColorStop(0,'rgba(255,245,220,0.9)');g2.addColorStop(1,'rgba(255,180,84,0)');
  ctx.fillStyle=g2;ctx.beginPath();
  ctx.arc(bx+Math.cos(G.aim)*ts*0.62,by+Math.sin(G.aim)*ts*0.62,ts*0.5,0,TAU);ctx.fill();}
 ctx.shadowBlur=0;
 ctx.fillStyle=G.firing?'#ffd9a0':'#ffb454';
 ctx.beginPath();ctx.arc(bx,by,ts*0.15,0,TAU);ctx.fill();
 ctx.strokeStyle='#8a5c22';ctx.stroke();
 ctx.restore();}

function drawParts(){ for(const p of G.parts){ const a=clamp(p.life/p.max,0,1),X=w2x(p.x),Y=w2y(p.y);
  if(p.ring){ ctx.strokeStyle='rgba('+p.rgb+','+(a*0.8)+')';ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(X,Y,p.r*ts*0.14,0,TAU);ctx.stroke();}
  else{ ctx.fillStyle='rgba('+p.rgb+','+a+')';ctx.fillRect(X-p.sz/2,Y-p.sz/2,p.sz,p.sz);}}}
function drawPops(){ for(const p of G.pops){ const X=w2x(p.x),Y=w2y(p.y);
  ctx.font='700 '+Math.max(13,ts*0.42)+'px Consolas,Menlo,monospace';
  ctx.textAlign='center';ctx.globalAlpha=clamp(p.life,0,1);
  ctx.fillStyle='#0a1120';ctx.fillText(p.txt,X+1,Y+1);
  ctx.fillStyle=p.col;ctx.fillText(p.txt,X,Y);} ctx.globalAlpha=1;}

function attract(){ const mx=cw*0.05,my=ch*0.52,t=G.time;
 const a=Math.sin(t*0.33)*0.4-0.06;
 drawBeamPx([{x1:mx,y1:my,x2:mx+Math.cos(a)*cw*1.2,y2:my+Math.sin(a)*cw*1.2,c:3,end:true}],0.16);
 const a2=Math.sin(t*0.21+2)*0.5+0.5;
 drawBeamPx([{x1:mx,y1:my,x2:mx+Math.cos(a2)*cw*1.2,y2:my+Math.sin(a2)*cw*1.2,c:2,end:true}],0.08);}

function render(){ bg();nebula();starsDraw();
 if(G.screen==='menu'&&G.level<0){attract();vignette();return;}
 const sx=(Math.random()*2-1)*G.shake, sy=(Math.random()*2-1)*G.shake;
 ctx.save();ctx.translate(sx,sy);
 frame();drawTiles();drawAim();
 if(G.ghost&&G.ghost.t>0){const s=G.ghost.segs.map(v=>({x1:w2x(v.x1),y1:w2y(v.y1),x2:w2x(v.x2),y2:w2y(v.y2),c:v.c,end:v.end}));
  drawBeamPx(s,G.ghost.t/0.45*0.45);}
 if(G.firing&&G.beams.length){const s=G.beams.map(v=>({x1:w2x(v.x1),y1:w2y(v.y1),x2:w2x(v.x2),y2:w2y(v.y2),c:v.c,end:v.end}));
  drawBeamPx(s,1);}
 drawCannon();drawParts();drawPops();ctx.restore();vignette();}

/* ============================== boot & loop ============================== */
showStart();
let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000);last=now;
 update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
