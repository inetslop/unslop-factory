<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetra Climb</title>
<style>
  :root{
    --disp: Impact,'Arial Black','Franklin Gothic Medium',sans-serif;
    --mono: Consolas,'Lucida Console',Menlo,monospace;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#070b1e;font-family:var(--mono);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #game{position:fixed;inset:0;display:block;touch-action:none;}

  /* ---------- overlay / panels ---------- */
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;
    pointer-events:none;opacity:0;transition:opacity .18s;padding:14px;}
  #overlay.on{opacity:1;}
  .panel{pointer-events:auto;background:rgba(14,21,56,.96);border:3px solid #3b4c9e;border-radius:14px;
    box-shadow:0 10px 0 rgba(4,7,20,.9),0 0 0 3px rgba(4,7,20,.9),0 26px 60px rgba(0,0,0,.65);
    padding:24px 32px;max-width:min(94vw,580px);max-height:94vh;overflow:auto;text-align:center;}
  @keyframes pop{from{transform:scale(.72) translateY(26px);opacity:0}}
  .panel.anim{animation:pop .34s cubic-bezier(.2,1.5,.4,1);}
  h1.title{font-family:var(--disp);font-size:clamp(38px,9vw,72px);line-height:.95;margin:0 0 8px;letter-spacing:.03em;color:#fff;}
  .tetra{color:#7df3ff;text-shadow:0 0 18px rgba(42,212,255,.5),4px 5px 0 #0b3a55;}
  .climb{color:#ffd23c;text-shadow:0 0 18px rgba(255,179,0,.4),4px 5px 0 #7a4c00;}
  .tag{color:#9fb0e8;font-size:13.5px;line-height:1.5;margin:6px auto 4px;max-width:46ch;}
  .controls{display:grid;grid-template-columns:auto auto;gap:7px 20px;justify-content:center;align-items:center;
    margin:14px auto 2px;font-size:13px;color:#cdd8ff;text-align:left;}
  .controls .desc{color:#8fa2e0;font-size:12px;letter-spacing:.04em;}
  kbd{background:#1b2557;border:2px solid #40539f;border-bottom-width:4px;padding:2px 8px;border-radius:6px;
    font-family:var(--mono);color:#fff;font-size:11.5px;margin:0 1px;display:inline-block;}
  .dim{color:#5a6aa0;}
  .btns{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  button{font-family:var(--disp);letter-spacing:.06em;font-size:18px;padding:12px 22px;border-radius:10px;cursor:pointer;
    transition:transform .08s,box-shadow .08s;}
  .btn-p{background:linear-gradient(#ffd94f,#ffa726);border:3px solid #2c2105;color:#2c1d02;
    box-shadow:0 6px 0 #8a5a00,0 12px 20px rgba(0,0,0,.5);}
  .btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8a5a00,0 16px 24px rgba(0,0,0,.5);}
  .btn-p:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5a00;}
  .btn-s{background:#1d2a66;border:3px solid #46579f;color:#dbe6ff;box-shadow:0 6px 0 #0c1230,0 10px 18px rgba(0,0,0,.4);}
  .btn-s:hover{transform:translateY(-2px);box-shadow:0 8px 0 #0c1230;}
  .btn-s:active{transform:translateY(3px);box-shadow:0 2px 0 #0c1230;}
  .blink{animation:blink 1.2s steps(2) infinite;}
  @keyframes blink{50%{opacity:.25}}
  .bestline{color:#ffd94f;margin-top:14px;font-size:13px;letter-spacing:.08em;}
  .tiny{color:#4d5c96;font-size:10.5px;margin-top:12px;letter-spacing:.06em;}
  .stats{display:flex;gap:12px;justify-content:center;margin:16px 0 2px;flex-wrap:wrap;}
  .sbox{background:#131c48;border:2px solid #35468f;border-radius:10px;padding:9px 16px;min-width:96px;}
  .slab{font-size:11px;letter-spacing:.16em;color:#8fa2e0;font-family:var(--disp);}
  .sval{font-size:24px;color:#fff;margin-top:2px;}
  .trow{display:flex;justify-content:center;margin:2px 0 8px;}
  .mt{display:inline-grid;grid-template-columns:repeat(4,9px);grid-auto-rows:9px;gap:2px;margin:0 10px;}
  .mt i{border-radius:2px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),inset 2px 2px 0 rgba(255,255,255,.3);}

  /* ---------- touch controls ---------- */
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));z-index:6;pointer-events:none;}
  #touch .grp{display:flex;gap:14px;pointer-events:auto;}
  .tbtn{width:72px;height:72px;border-radius:50%;background:rgba(20,29,74,.82);border:3px solid #3b4c9e;color:#dbe6ff;
    font-size:26px;font-family:var(--mono);touch-action:none;}
  .tbtn:active{background:#24337a;}
  #tJ{width:96px;height:96px;border-radius:50%;background:rgba(255,207,77,.85);border:3px solid #8a5a00;color:#2c1d02;
    font-family:var(--disp);font-size:15px;letter-spacing:.08em;touch-action:none;}
  #tJ:active{background:#ffcf4d;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="overlay"></div>

<div id="touch">
  <div class="grp"><button class="tbtn" id="tL">&#9664;</button><button class="tbtn" id="tR">&#9654;</button></div>
  <button id="tJ">JUMP</button>
</div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const cvs=document.getElementById('game'), ctx=cvs.getContext('2d');
const COLS=12, ROWS=20;
const G=36, JUMPV=15.6, MAXFALL=26, RUNMAX=7.2, HW=0.39, HH=0.95, COYOTE=0.09;
let W=0,H=0,dpr=1; const L={fx:0,fy:0,u:32,hudH:64};

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const hudH=Math.max(54,Math.min(86,H*0.1)); L.hudH=hudH;
  const m=Math.max(10,Math.min(W,H)*0.02);
  const u=Math.max(14,Math.floor(Math.min((W-m*2)/COLS,(H-hudH-m*2-12)/ROWS)));
  L.u=u; L.fx=(W-u*COLS)/2; L.fy=hudH+Math.max(6,(H-hudH-u*ROWS)/2);
}
window.addEventListener('resize',resize); resize();

/* ============================== AUDIO ============================== */
let AC=null, master=null, muted=false;
try{ muted = localStorage.getItem('tetraclimb.muted')==='1'; }catch(e){}
function ensureAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.22; master.connect(AC.destination);
  }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume();
}
function tone(type,f0,f1,dur,vol,delay){
  if(!AC||muted)return; vol=vol||0.4; delay=delay||0;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
}
function noiseBurst(dur,vol,delay){
  if(!AC||muted)return; vol=vol||0.3; delay=delay||0;
  const t=AC.currentTime+delay, n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  const g=AC.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const SFX={
  jump(){ tone('square',320,640,.14,.35); },
  land(v){ tone('sine',150,60,.1,Math.min(.5,.1+v*.02)); noiseBurst(.05,.1); },
  lock(){ tone('triangle',240,170,.06,.3); },
  clear(n){ const N=[523,659,784,1046,1318]; for(let i=0;i<Math.min(5,n+2);i++)tone('square',N[i],N[i],.11,.3,i*.07); if(n>=3)noiseBurst(.25,.22); },
  die(){ tone('sawtooth',280,45,.55,.5); noiseBurst(.4,.4); },
  win(){ [659,784,988,1318].forEach((f,i)=>tone('triangle',f,f,.22,.4,i*.13)); tone('square',1568,1568,.4,.25,.55); },
  level(){ tone('square',440,880,.12,.3); tone('square',660,1320,.12,.3,.1); }
};

/* ============================== TETROMINO DATA ============================== */
const TYPES=[
  {id:'I',col:'#3ae7ff',cells:[[0,1],[1,1],[2,1],[3,1]]},
  {id:'O',col:'#ffd94f',cells:[[1,0],[2,0],[1,1],[2,1]]},
  {id:'T',col:'#b45cff',cells:[[1,0],[0,1],[1,1],[2,1]]},
  {id:'S',col:'#3ce06a',cells:[[1,0],[2,0],[0,1],[1,1]]},
  {id:'Z',col:'#ff5d6c',cells:[[0,0],[1,0],[1,1],[2,1]]},
  {id:'J',col:'#5d8bff',cells:[[0,0],[0,1],[1,1],[2,1]]},
  {id:'L',col:'#ffa145',cells:[[2,0],[0,1],[1,1],[2,1]]}
];
const ROTS=TYPES.map(t=>{
  if(t.id==='O') return [t.cells,t.cells,t.cells,t.cells];
  const rs=[t.cells];
  for(let r=1;r<4;r++) rs.push(rs[r-1].map(c=>[3-c[1],c[0]]));
  return rs;
});

/* ============================== STATE ============================== */
let grid, pieces, queue, player, score, lines, level, spawnT, state='menu';
let goalDone=false, clearAnim=null, deathMsg='', panelShown=false, deadT=0, winT=0, newBest=false;
let best=0; try{ best=+localStorage.getItem('tetraclimb.best')||0; }catch(e){}
const shake={p:0}; const parts=[]; const floaters=[];
let tGlobal=0, jbuf=0;
const keys={l:false,r:false};
const bgStars=[]; for(let i=0;i<110;i++) bgStars.push({x:Math.random(),y:Math.random(),z:.3+Math.random()*.7,tw:1+Math.random()*2,ph:Math.random()*6.28});

function rq(){ return {t:(Math.random()*7)|0, r:(Math.random()*4)|0}; }
function newGame(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  pieces=[]; queue=[rq(),rq(),rq()];
  score=0; lines=0; level=1; spawnT=1.1; goalDone=false;
  clearAnim=null; newBest=false; parts.length=0; floaters.length=0; shake.p=0; jbuf=0;
  player={x:COLS/2,y:ROWS,vx:0,vy:0,onG:true,face:1,squash:0,blink:2,cells:new Set()};
}

/* ============================== FLOW ============================== */
function saveBest(){ if(score>best){ best=score; newBest=true; try{localStorage.setItem('tetraclimb.best',String(best));}catch(e){} } else newBest=false; }
function startGame(){ newGame(); state='play'; hideOverlay(); }
function restart(){ if(state==='menu') return startGame(); newGame(); state='play'; hideOverlay(); }
function toMenu(){ newGame(); state='menu'; showPanel(startHTML()); }
function continueEndless(){ goalDone=true; state='play'; hideOverlay(); addFloat('ENDLESS MODE',L.fx+L.u*COLS/2,L.fy+L.u*3,'#7df3ff',20); }
function togglePause(){
  if(state==='play'){ state='pause'; showPanel(pauseHTML()); }
  else if(state==='pause'){ state='play'; hideOverlay(); jbuf=0; }
}
function die(cause){
  if(state!=='play')return;
  state='dead'; panelShown=false; deadT=0.85;
  deathMsg = cause==='crushed' ? 'CRUSHED!' : 'STACKED OUT!';
  SFX.die(); shake.p=16; saveBest();
  const u=L.u, x=L.fx+player.x*u, y=L.fy+(player.y-0.5)*u;
  for(let i=0;i<28;i++){ const a=Math.random()*6.28, v=(2+Math.random()*7)*u;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-u*3,g:u*16,life:.9,max:.9,size:u*(0.12+Math.random()*.18),col:i%3?'#ff5d6c':'#ffd23c'}); }
}
function doWin(){
  if(state!=='play'||goalDone)return;
  state='win'; panelShown=false; winT=1.1; score+=2000; saveBest();
  SFX.win(); shake.p=8; addFloat('+2000 \u2605',L.fx+L.u*COLS/2,L.fy+L.u*3,'#ffd94f',22);
  const u=L.u, sx=L.fx+COLS/2*u, sy=L.fy+1.55*u;
  for(let i=0;i<70;i++){ const a=Math.random()*6.28, v=(1.5+Math.random()*6)*u;
    parts.push({x:sx,y:sy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-u*4,g:u*13,life:1.4,max:1.4,size:u*(0.12+Math.random()*.2),col:TYPES[(Math.random()*7)|0].col}); }
}

/* ============================== PIECES ============================== */
function spawn(){
  const q=queue.shift(); queue.push(rq());
  const cells=ROTS[q.t][q.r]; let mn=9,mx=-1;
  for(const c of cells){ mn=Math.min(mn,c[0]); mx=Math.max(mx,c[0]); }
  pieces.push({t:q.t,r:q.r,cx:(Math.random()*(COLS-(mx-mn+1)))|0,row:-4,frac:0,col:TYPES[q.t].col});
}
function canBeAt(p,row){
  const cells=ROTS[p.t][p.r];
  for(const c of cells){ const col=p.cx+c[0], r=row+c[1];
    if(col<0||col>=COLS) return false; if(r<0) continue; if(r>=ROWS) return false; if(grid[r][col]) return false; }
  return true;
}
function restRow(p){ let r=p.row, guard=0; while(guard++<60&&canBeAt(p,r+1)) r++; return r; }
function cap(){ return state==='menu'?2:(level>=5?3:level>=2?2:1); }
function spawnInterval(){ return Math.max(0.85,2.05-(level-1)*0.14); }
function fallSpeed(){ return state==='menu'?1.7:Math.min(4.4,1.3+(level-1)*0.3); }

function crushCheckFrac(p){
  if(state!=='play')return;
  const s=player.cells; if(!s||!s.size)return;
  const cells=ROTS[p.t][p.r];
  for(const c of cells){ const col=p.cx+c[0]; if(col<0||col>=COLS)continue;
    const rLo=Math.floor(p.row+c[1]), rHi=Math.floor(p.row+c[1]+p.frac+1e-6);
    for(let r=rLo;r<=rHi;r++){ if(r>=0&&r<ROWS&&s.has(col+','+r)){ die('crushed'); return; } } }
}
function updatePieces(dt){
  const spd=fallSpeed();
  for(let i=pieces.length-1;i>=0;i--){
    if(state!=='play'&&state!=='menu')return;
    const p=pieces[i]; let adv=spd*dt, done=false;
    while(adv>1e-6&&!done){
      const st=Math.min(adv,0.3); p.frac+=st; crushCheckFrac(p);
      if(state!=='play'&&state!=='menu')return;
      if(p.frac>=1){ p.frac-=1; p.row++; if(!canBeAt(p,p.row+1)){ lockPiece(i); done=true; } }
      adv-=st;
    }
  }
}
function lockPiece(i){
  const p=pieces[i]; pieces.splice(i,1);
  const cells=ROTS[p.t][p.r]; let topOut=false;
  for(const c of cells){ const r=p.row+c[1], col=p.cx+c[0];
    if(r<0){ topOut=true; continue; } if(r>=ROWS)continue; grid[r][col]=p.col; }
  if(state==='play') SFX.lock();
  // dust on bottom cells
  for(const c of cells){ const r=p.row+c[1], col=p.cx+c[0]; if(r<0||r>=ROWS)continue;
    if(r+1>=ROWS||grid[r+1][col]){ const u=L.u, x=L.fx+(col+.5)*u, y=L.fy+(r+1)*u;
      for(let k=0;k<2;k++) parts.push({x,y,vx:(Math.random()*2-1)*u*2,vy:-Math.random()*u*1.5,g:u*8,life:.35,max:.35,size:u*.1,col:'rgba(200,215,255,.7)'}); } }
  // full rows
  const full=[];
  for(let r=0;r<ROWS;r++){ let f=true; for(let c=0;c<COLS;c++) if(!grid[r][c]){f=false;break;} if(f)full.push(r); }
  if(full.length){
    const u=L.u;
    for(const r of full) for(let c=0;c<COLS;c++){ const col=grid[r][c];
      for(let k=0;k<3;k++) parts.push({x:L.fx+(c+.5)*u,y:L.fy+(r+.5)*u,vx:(Math.random()*2-1)*u*4,vy:(Math.random()*2-1)*u*4,g:u*6,life:.6,max:.6,size:u*(.14+Math.random()*.14),col}); }
    if(state==='play'){
      const pts=[0,100,300,500,800][full.length]*level; score+=pts; lines+=full.length;
      SFX.clear(full.length); shake.p=Math.min(14,4+full.length*2.5);
      addFloat(['','SINGLE +'+pts,'DOUBLE! +'+pts,'TRIPLE!! +'+pts,'TETRIS!!! +'+pts][full.length],
        L.fx+L.u*COLS/2, L.fy+Math.min(full[0],ROWS-1)*L.u-8, full.length>=4?'#ffd94f':'#ffffff', 15+full.length*3);
      const nl=1+Math.floor(lines/8);
      if(nl>level){ level=nl; SFX.level(); addFloat('LEVEL '+level,L.fx+L.u*COLS/2,L.fy+L.u*4.5,'#7df3ff',20); }
      clearAnim={t:0.38,rows:full};
    }else{
      for(const r of full){ grid.splice(r,1); grid.unshift(Array(COLS).fill(0)); }
    }
  }
  if(topOut){
    if(state==='play') die('topout');
    else { grid=Array.from({length:ROWS},()=>Array(COLS).fill(0)); pieces.length=0; }
  }
}
function applyClears(){
  for(const r of clearAnim.rows){ grid.splice(r,1); grid.unshift(Array(COLS).fill(0)); }
  clearAnim=null;
  let guard=0;
  while(guard++<5){ const c=Math.floor(player.x), r=Math.floor(player.y-0.47);
    if(r>=0&&r<ROWS&&grid[r][c]) player.y-=1; else break; }
}

/* ============================== PLAYER ============================== */
function solidCell(c,r){ if(r>=ROWS)return true; if(c<0||c>=COLS)return true; if(r<0)return false; return !!grid[r][c]; }
function computePlayerCells(){
  const P=player, s=new Set();
  const cs=[Math.floor(P.x-0.34),Math.floor(P.x+0.34)], rs=[Math.floor(P.y-0.85),Math.floor(P.y-0.2)];
  for(const c of new Set(cs)) for(const r of new Set(rs)) if(r>=0&&r<ROWS) s.add(c+','+r);
  P.cells=s;
}
function collideX(P){
  const x0=P.x-HW,x1=P.x+HW,y0=P.y-HH,y1=P.y-0.02;
  const c0=Math.floor(x0+1e-6),c1=Math.floor(x1-1e-6),r0=Math.floor(y0+1e-6),r1=Math.floor(y1-1e-6);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){ if(!solidCell(c,r))continue;
    if(P.vx>0)P.x=Math.min(P.x,c-HW-1e-4); else if(P.vx<0)P.x=Math.max(P.x,c+1+HW+1e-4); P.vx=0; }
}
function collideY(P,vBefore){
  const x0=P.x-HW+1e-4,x1=P.x+HW-1e-4,y0=P.y-HH,y1=P.y;
  const c0=Math.floor(x0),c1=Math.floor(x1);
  if(P.vy>=0){
    const ra=Math.floor(y0+1e-6),rb=Math.floor(y1-1e-6);
    outer: for(let r=ra;r<=rb;r++)for(let c=c0;c<=c1;c++){ if(solidCell(c,r)){
      P.y=r; P.vy=0;
      if(vBefore>9){ SFX.land(vBefore); P.squash=-Math.min(.8,vBefore*.045); dust('land'); shake.p=Math.max(shake.p,2.2); }
      break outer; } }
  }else{
    const ra=Math.floor(y0+1e-6),rb=Math.floor(y1-1e-6);
    for(let r=ra;r<=rb;r++)for(let c=c0;c<=c1;c++){ if(solidCell(c,r)){ P.y=r+1+HH; P.vy=0; break; } }
  }
}
function probeGround(P){
  const r=Math.floor(P.y+0.02);
  return solidCell(Math.floor(P.x-0.3),r)||solidCell(Math.floor(P.x+0.3),r);
}
function dust(kind){
  const u=L.u, x=L.fx+player.x*u, y=L.fy+player.y*u;
  for(let i=0;i<6;i++) parts.push({x:x+(Math.random()*2-1)*u*.3,y:y-2,vx:(Math.random()*2-1)*u*1.6,
    vy:-Math.random()*u*(kind==='jump'?1.4:.5),g:u*9,life:.4,max:.4,size:u*.1,col:'rgba(220,230,255,.8)'});
}
function updPlayer(dt){
  const P=player; const dir=(keys.r?1:0)-(keys.l?1:0); if(dir)P.face=dir;
  const acc=P.onG?55:32;
  if(dir) P.vx+=dir*acc*dt;
  else{ const f=(P.onG?60:10)*dt; if(P.vx>0)P.vx=Math.max(0,P.vx-f); else P.vx=Math.min(0,P.vx+f); }
  P.vx=Math.max(-RUNMAX,Math.min(RUNMAX,P.vx));
  P.coyote=P.onG?COYOTE:P.coyote-dt;
  if(jbuf>0&&(P.onG||P.coyote>0)){ P.vy=-JUMPV; jbuf=0; P.onG=false; P.coyote=0; P.squash=1; SFX.jump(); dust('jump'); }
  P.vy=Math.min(MAXFALL,P.vy+G*dt);
  P.x+=P.vx*dt; collideX(P);
  const vBefore=P.vy; P.y+=P.vy*dt; collideY(P,vBefore);
  P.onG=probeGround(P);
  P.squash+=(0-P.squash)*Math.min(1,dt*9);
  P.blink-=dt; if(P.blink<0)P.blink=2+Math.random()*3;
}

/* ============================== FX ============================== */
function addFloat(text,x,y,col,size){ floaters.push({text,x,y,t:0,dur:.95,col:col||'#fff',size:size||16}); }
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0)parts.splice(i,1); }
  if(parts.length>420)parts.splice(0,parts.length-420);
}
function upFloaters(dt){ for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.t+=dt; f.y-=38*dt; if(f.t>f.dur)floaters.splice(i,1); } }

/* ============================== UPDATE ============================== */
function update(dt){
  tGlobal+=dt;
  for(const s of bgStars) s.y=(s.y+dt*0.01*s.z)%1;
  shake.p*=Math.exp(-7*dt); if(shake.p<.05)shake.p=0;
  updParts(dt); upFloaters(dt);

  if(state==='play'){
    jbuf=Math.max(0,jbuf-dt);
    computePlayerCells();
    if(clearAnim){ clearAnim.t-=dt; if(clearAnim.t<=0)applyClears(); }
    else{
      spawnT-=dt;
      if(spawnT<=0&&pieces.length<cap()){ spawn(); spawnT=spawnInterval()*(0.85+Math.random()*0.4); }
      updatePieces(dt);
    }
    if(state==='play'){ updPlayer(dt);
      if(!goalDone){ const dx=player.x-COLS/2, dy=(player.y-0.47)-1.55; if(Math.hypot(dx,dy)<1.05) doWin(); } }
  }
  else if(state==='menu'){
    spawnT-=dt;
    if(spawnT<=0&&pieces.length<2){ spawn(); spawnT=1.3+Math.random()*0.5; }
    updatePieces(dt);
  }
  else if(state==='dead'){ deadT-=dt; if(deadT<=0&&!panelShown){ panelShown=true; showPanel(deadHTML()); } }
  else if(state==='win'){ winT-=dt; if(winT<=0&&!panelShown){ panelShown=true; showPanel(winHTML()); } }
}

/* ============================== DRAW HELPERS ============================== */
function rrect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function starPath(x,y,R,r,rot){ ctx.beginPath();
  for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5-Math.PI/2, rad=i%2?r:R;
    const px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath(); }
function blob(x,y,r,col){ const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2); }
function block(x,y,s,col){
  ctx.fillStyle=col; ctx.fillRect(x+1,y+1,s-2,s-2);
  ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(x+1,y+1,s-2,Math.max(2,(s-2)*0.28));
  ctx.fillStyle='rgba(0,0,0,.22)'; const sh=(s-2)*0.28; ctx.fillRect(x+1,y+s-1-sh,s-2,sh);
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.strokeRect(x+1.5,y+1.5,s-3,s-3);
}

/* ============================== DRAW SCENE ============================== */
function drawWell(){
  const {fx,fy,u}=L, w=u*COLS,h=u*ROWS;
  ctx.fillStyle='#0d1537'; rrect(fx-12,fy-12,w+24,h+24,10); ctx.fill();
  ctx.save(); ctx.strokeStyle='#3b4c9e'; ctx.lineWidth=2;
  ctx.shadowColor='rgba(80,190,255,.5)'; ctx.shadowBlur=16;
  rrect(fx-12,fy-12,w+24,h+24,10); ctx.stroke(); ctx.restore();
  ctx.fillStyle='#04081a'; ctx.fillRect(fx,fy,w,h);
  ctx.strokeStyle='rgba(120,150,255,.07)'; ctx.lineWidth=1; ctx.beginPath();
  for(let c=1;c<COLS;c++){ ctx.moveTo(fx+c*u+.5,fy); ctx.lineTo(fx+c*u+.5,fy+h); }
  for(let r=1;r<ROWS;r++){ ctx.moveTo(fx,fy+r*u+.5); ctx.lineTo(fx+w,fy+r*u+.5); }
  ctx.stroke();
  ctx.fillStyle='rgba(255,200,80,.22)'; ctx.fillRect(fx,fy+h-3,w,3);
  let warn=false; for(let r=0;r<2&&!warn;r++)for(let c=0;c<COLS;c++)if(grid[r][c]){warn=true;break;}
  if(warn){ ctx.fillStyle='rgba(255,60,80,'+(.1+.09*Math.sin(tGlobal*9))+')'; ctx.fillRect(fx,fy,w,u*2.4); }
}
function drawGridCells(){
  const {fx,fy,u}=L;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]) block(fx+c*u,fy+r*u,u,grid[r][c]);
  if(clearAnim){ const a=.35+.6*Math.abs(Math.sin(clearAnim.t*28));
    ctx.fillStyle='rgba(255,255,255,'+a+')';
    for(const r of clearAnim.rows) ctx.fillRect(fx,fy+r*u,u*COLS,u); }
}
function drawStar(){
  if(goalDone)return;
  const u=L.u, sx=L.fx+COLS/2*u, sy=L.fy+1.55*u, pu=.5+.5*Math.sin(tGlobal*3);
  let near=false;
  if(state==='play'&&!goalDone){ const dx=player.x-COLS/2, dy=(player.y-.47)-1.55; near=Math.hypot(dx,dy)<3.5; }
  const hr=u*(1.5+.45*pu)*(near?1.3:1);
  const g=ctx.createRadialGradient(sx,sy,0,sx,sy,hr);
  g.addColorStop(0,'rgba(255,217,60,'+(near?.34:.2)+')'); g.addColorStop(1,'rgba(255,217,60,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,hr,0,7); ctx.fill();
  ctx.save(); ctx.shadowColor='#ffd94f'; ctx.shadowBlur=16;
  starPath(sx,sy,u*.55*(1+.08*pu),u*.24,tGlobal*.9);
  ctx.fillStyle='#ffd94f'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff3c8'; ctx.stroke(); ctx.restore();
  for(let i=0;i<2;i++){ const a=tGlobal*1.6+i*Math.PI;
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillRect(sx+Math.cos(a)*u*1.05-1.5,sy+Math.sin(a)*u*.55-1.5,3,3); }
}
function drawPieces(){
  const {fx,fy,u}=L;
  for(const p of pieces){
    const cells=ROTS[p.t][p.r];
    const rr=restRow(p);
    if(rr-p.row>1.2){ ctx.globalAlpha=.16;
      for(const c of cells){ const r=rr+c[1]; if(r<0)continue;
        ctx.fillStyle=p.col; ctx.fillRect(fx+(p.cx+c[0])*u+2,fy+r*u+2,u-4,u-4); }
      ctx.globalAlpha=1; }
    const py=fy+(p.row+p.frac)*u;
    ctx.save(); ctx.shadowColor=p.col; ctx.shadowBlur=10;
    for(const c of cells) block(fx+(p.cx+c[0])*u,py+c[1]*u,u,p.col);
    ctx.restore();
  }
}
function drawPlayer(){
  const P=player,u=L.u, px=L.fx+P.x*u, py=L.fy+P.y*u;
  let by=0; if(state==='win')by=-Math.abs(Math.sin(tGlobal*8))*u*.25;
  ctx.save(); ctx.translate(px,py+by); ctx.rotate(P.vx*0.03);
  const s=P.squash; ctx.scale(1-s*.22,1+s*.30);
  const hw=u*.42,hh=u*(state==='dead'?.5:HH),rad=u*.2;
  const bg=ctx.createLinearGradient(0,-hh,0,0); bg.addColorStop(0,'#fffbe9'); bg.addColorStop(1,'#ffe0a3');
  ctx.fillStyle=bg; ctx.strokeStyle='#39406e'; ctx.lineWidth=Math.max(1.5,u*.06);
  rrect(-hw,-hh,hw*2,hh,rad); ctx.fill(); ctx.stroke();
  // antenna
  ctx.beginPath(); ctx.moveTo(0,-hh); ctx.lineTo(0,-hh-u*.18); ctx.strokeStyle='#39406e'; ctx.lineWidth=u*.05; ctx.stroke();
  ctx.fillStyle='rgba(255,93,108,'+(.5+.5*Math.sin(tGlobal*5))+')';
  ctx.beginPath(); ctx.arc(0,-hh-u*.22,u*.07,0,7); ctx.fill();
  // visor
  ctx.fillStyle='#252c5e'; rrect(-u*.3,-hh+u*.16,u*.6,u*.34,u*.12); ctx.fill();
  const ex=P.face*u*.07, ey=-hh+u*.33;
  if(state==='dead'){
    ctx.strokeStyle='#39406e'; ctx.lineWidth=u*.05;
    for(const ox of [-u*.14,u*.14]){ const x=ox+ex;
      ctx.beginPath(); ctx.moveTo(x-u*.06,ey-u*.06); ctx.lineTo(x+u*.06,ey+u*.06);
      ctx.moveTo(x+u*.06,ey-u*.06); ctx.lineTo(x-u*.06,ey+u*.06); ctx.stroke(); }
  }else if(P.blink<0.12){
    ctx.strokeStyle='#8ef6ff'; ctx.lineWidth=u*.04;
    for(const ox of [-u*.14,u*.14]){ const x=ox+ex;
      ctx.beginPath(); ctx.moveTo(x-u*.07,ey); ctx.lineTo(x+u*.07,ey); ctx.stroke(); }
  }else{
    ctx.save(); ctx.shadowColor='#7df3ff'; ctx.shadowBlur=u*.2; ctx.fillStyle='#8ef6ff';
    for(const ox of [-u*.14,u*.14]){ ctx.beginPath(); ctx.arc(ox+ex,ey,u*.075,0,7); ctx.fill(); }
    ctx.restore();
  }
  // feet
  ctx.fillStyle='#f2cf96';
  rrect(-hw*.72,-u*.1,u*.24,u*.12,3); ctx.fill();
  rrect(hw*.48,-u*.1,u*.24,u*.12,3); ctx.fill();
  ctx.restore();
}
function drawParts(){
  for(const p of parts){ const a=Math.max(0,p.life/p.max), s=p.size*a;
    ctx.globalAlpha=a; ctx.fillStyle=p.col; ctx.fillRect(p.x-s/2,p.y-s/2,s,s); }
  ctx.globalAlpha=1;
}
function drawFloaters(){
  ctx.textAlign='center';
  for(const f of floaters){ const a=Math.max(0,1-f.t/f.dur), pop=f.t<.15? .6+f.t/.15*.4:1;
    ctx.globalAlpha=a; ctx.font=Math.round(f.size*pop)+'px Impact, sans-serif';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(5,8,26,.85)'; ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.col; ctx.fillText(f.text,f.x,f.y); }
  ctx.globalAlpha=1; ctx.textAlign='left';
}

/* ============================== HUD ============================== */
function fmt(n){ return n.toLocaleString('en-US'); }
function stat(x,label,val,col){
  const h=L.hudH; col=col||'#fff';
  ctx.font=Math.round(h*.28)+'px Impact, sans-serif'; ctx.fillStyle='#ffc94d'; ctx.textAlign='left';
  ctx.fillText(label,x,h*.36);
  ctx.font='700 '+Math.round(h*.5)+'px Consolas, Menlo, monospace'; ctx.fillStyle=col;
  ctx.fillText(val,x,h*.84);
  return Math.max(ctx.measureText(val).width,ctx.measureText(label).width);
}
function drawChip(x,y,w,hh,txt){
  const hue=(205-(level-1)*14+720)%360;
  ctx.fillStyle='hsl('+hue+',88%,58%)'; rrect(x,y,w,hh,hh/2); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2; rrect(x,y,w,hh,hh/2); ctx.stroke();
  ctx.font=Math.round(hh*.62)+'px Impact, sans-serif'; ctx.fillStyle='#0a0f26'; ctx.textAlign='center';
  ctx.fillText(txt,x+w/2,y+hh*.72); ctx.textAlign='left';
}
function miniInSlot(x,y,bs,q){
  const cells=ROTS[q.t][q.r]; let mn=9,mx=-1,mnY=9,mxY=-1;
  for(const c of cells){ mn=Math.min(mn,c[0]);mx=Math.max(mx,c[0]);mnY=Math.min(mnY,c[1]);mxY=Math.max(mxY,c[1]); }
  const cs=Math.min((bs-10)/(mx-mn+1),(bs-10)/(mxY-mnY+1),12);
  const ox=x+(bs-cs*(mx-mn+1))/2, oy=y+(bs-cs*(mxY-mnY+1))/2;
  for(const c of cells) block(ox+c[0]*cs,oy+c[1]*cs,cs,TYPES[q.t].col);
}
function drawHUD(){
  const h=L.hudH;
  ctx.fillStyle='#0b1230'; ctx.fillRect(0,0,W,h);
  const lg=ctx.createLinearGradient(0,0,W,0);
  lg.addColorStop(0,'#ffd23c'); lg.addColorStop(.5,'#45e0ff'); lg.addColorStop(1,'#ff5d9e');
  ctx.fillStyle=lg; ctx.fillRect(0,h-3,W,3);
  let x=18; x+=stat(x,'SCORE',fmt(score))+26;
  if(W>=700) x+=stat(x,'BEST',fmt(best),'#9fb0e8')+26;
  // right: mute
  const muteT=muted?'\u266A OFF':'\u266A ON';
  ctx.font=Math.round(h*.3)+'px Consolas, Menlo, monospace';
  const mw=ctx.measureText(muteT).width;
  ctx.fillStyle=muted?'#5a6aa0':'#9fe8ff'; ctx.fillText(muteT,W-16-mw,h*.62);
  // right: next slots
  const bs=Math.min(46,h*.72), gap=10;
  ctx.font=Math.round(h*.26)+'px Impact, sans-serif';
  const nw=ctx.measureText('NEXT').width;
  const slotX=W-16-mw-14-(bs*2+gap)-nw-8;
  if(W>=430){ ctx.fillStyle='#ffc94d'; ctx.fillText('NEXT',slotX,h*.62);
    for(let i=0;i<2;i++){ const sx=slotX+nw+8+i*(bs+gap), sy=(h-bs)/2;
      ctx.fillStyle='#0a1030'; rrect(sx,sy,bs,bs,6); ctx.fill();
      ctx.strokeStyle='#2c3a78'; ctx.lineWidth=2; rrect(sx,sy,bs,bs,6); ctx.stroke();
      if(queue[i]) miniInSlot(sx,sy,bs,queue[i]); } }
  // center: LV + LINES
  const rightEdge=(W>=430?slotX-8:W-16-mw-14);
  if(rightEdge-x>150){
    let gx=x+((rightEdge-x)/2)-70;
    drawChip(gx,(h-h*.56)/2,h*.9,h*.56,'LV '+level);
    stat(gx+h*.9+14,'LINES',String(lines),'#cfe0ff');
  }
  if(state==='play'&&W>640){
    ctx.globalAlpha=.5; ctx.font='12px Consolas, Menlo, monospace'; ctx.textAlign='center';
    ctx.fillStyle='#8fa2e0';
    ctx.fillText('\u2190 \u2192 MOVE  \u00B7  SPACE JUMP  \u00B7  P PAUSE  \u00B7  M SOUND',W/2,H-8);
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
}

/* ============================== DRAW ============================== */
function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a1029'); g.addColorStop(.55,'#0d1434'); g.addColorStop(1,'#070b1e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const m=Math.min(W,H);
  blob(W*.18+Math.sin(tGlobal*.13)*30,H*.22,m*.5,'rgba(64,210,255,.06)');
  blob(W*.85,H*.75+Math.cos(tGlobal*.11)*24,m*.55,'rgba(255,90,190,.05)');
  blob(W*.5,H*.5,m*.6,'rgba(255,190,70,.04)');
  for(const s of bgStars){ const a=(.25+.5*Math.abs(Math.sin(tGlobal*s.tw+s.ph)))*s.z;
    ctx.fillStyle='rgba(200,225,255,'+a+')'; const sz=s.z*2.2; ctx.fillRect(s.x*W,s.y*H,sz,sz); }

  let ox=0,oy=0; if(shake.p>0.1){ ox=(Math.random()*2-1)*shake.p; oy=(Math.random()*2-1)*shake.p; }
  ctx.save(); ctx.translate(ox,oy);
  drawWell(); drawGridCells(); drawStar();
  // pieces clipped to the well (they spawn above it)
  const {fx,fy,u}=L;
  ctx.save(); ctx.beginPath(); ctx.rect(fx,fy,u*COLS,u*ROWS); ctx.clip(); drawPieces(); ctx.restore();
  if(state!=='menu') drawPlayer();
  drawParts(); drawFloaters();
  ctx.restore();
  drawHUD();
}

function showPanel(html){ overlay.innerHTML=html; overlay.classList.add('on'); }
function hideOverlay(){ overlay.classList.remove('on'); overlay.innerHTML=''; }
const ACT={start:startGame,restart:restart,menu:toMenu,resume:togglePause,endless:continueEndless};
overlay.addEventListener('click',e=>{ const el=e.target.closest('[data-act]');
  if(el){ ensureAudio(); if(ACT[el.dataset.act])ACT[el.dataset.act](); try{el.blur();}catch(err){} } });

/* ============================== INPUT ============================== */
const JUMPK=['Space','ArrowUp','KeyW','KeyZ'];
window.addEventListener('keydown',e=>{
  ensureAudio(); const c=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(c)>=0)e.preventDefault();
  switch(c){
    case 'ArrowLeft': case 'KeyA': keys.l=true; break;
    case 'ArrowRight': case 'KeyD': keys.r=true; break;
    case 'Space': case 'ArrowUp': case 'KeyW': case 'KeyZ':
      if(!e.repeat)jbuf=0.13;
      if(state==='menu')startGame();
      else if(state==='dead'&&panelShown)restart();
      else if(state==='win'&&panelShown)continueEndless();
      break;
    case 'Enter':
      if(state==='menu')startGame();
      else if(state==='dead'&&panelShown)restart();
      else if(state==='win'&&panelShown)continueEndless();
      break;
    case 'KeyP': case 'Escape': togglePause(); break;
    case 'KeyR': restart(); break;
    case 'KeyM': muted=!muted; try{localStorage.setItem('tetraclimb.muted',muted?'1':'0');}catch(err){} break;
    case 'KeyC': if(state==='win'&&panelShown)continueEndless(); break;
  }
});
window.addEventListener('keyup',e=>{
  const c=e.code;
  if(c==='ArrowLeft'||c==='KeyA')keys.l=false;
  if(c==='ArrowRight'||c==='KeyD')keys.r=false;
  if(JUMPK.indexOf(c)>=0&&player&&player.vy<0)player.vy*=0.5; // jump cut: hold for height
});
window.addEventListener('blur',()=>{ keys.l=keys.r=false; if(state==='play')togglePause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play')togglePause(); });

/* touch controls */
const touchUI=document.getElementById('touch');
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches||'ontouchstart' in window){
  touchUI.style.display='flex';
  const bind=(el,k)=>{ const on=e=>{e.preventDefault();ensureAudio();keys[k]=true;};
    const off=e=>{e.preventDefault();keys[k]=false;};
    el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
    el.addEventListener('pointercancel',off); el.addEventListener('pointerleave',off); };
  bind(document.getElementById('tL'),'l'); bind(document.getElementById('tR'),'r');
  const tJ=document.getElementById('tJ');
  tJ.addEventListener('pointerdown',e=>{ e.preventDefault(); ensureAudio();
    if(state==='menu')startGame(); else if(state==='dead'&&panelShown)restart();
    else if(state==='win'&&panelShown)continueEndless(); else jbuf=0.13; });
  touchUI.addEventListener('contextmenu',e=>e.preventDefault());
}

/* ============================== MAIN LOOP ============================== */
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  if(window.innerWidth!==W||window.innerHeight!==H)resize();
  update(dt); draw();
  requestAnimationFrame(frame);
}
newGame(); state='menu'; showPanel(startHTML());
requestAnimationFrame(frame);
</script>
</body>
</html>
