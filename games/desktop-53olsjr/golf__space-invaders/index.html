<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>PAR 4 PARSEC — Space Invaders Golf</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#020308;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.026) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.45) 100%);}
  canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:crosshair;}
</style>

<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* ================================================================
   PAR 4 PARSEC — a space-invaders × mini-golf game
   Pop the invader swarm with your putts. Any invader that crosses
   the bomb line costs you +1 stroke. Sink it under par.
   ================================================================ */
const W=960,H=640;
const F={x:24,y:76,w:912,h:536};            // course rect (bottom 612, right 936)
const BOMB_Y=588;
const BALL_R=9,CUP_R=17,ALIEN_R=15;
const WALL_REST=.82,ROCK_REST=.9,DECAY=.95,MAXS=820,MINS=150;
const PAR_TOTAL=25;
const F_DISP='"Arial Black","Segoe UI Black",Impact,sans-serif';
const F_MONO='ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace';

/* ---------------- canvas / scaling ---------------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let dpr=1,cw=0,ch=0,scale=1,offX=0,offY=0;
function resize(){
  dpr=window.devicePixelRatio||1;cw=window.innerWidth;ch=window.innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  scale=Math.min(cw/W,ch/H);offX=(cw-W*scale)/2;offY=(ch-H*scale)/2;
}
window.addEventListener('resize',resize);resize();
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-offX)/scale,y:(e.clientY-r.top-offY)/scale};}

/* ---------------- audio (WebAudio, starts on first input) ---------------- */
let AC=null,master=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.16;master.connect(AC.destination);
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC)return;delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(20,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);
}
function noiseBurst(dur,vol,delay){
  if(!AC)return;delay=delay||0;
  const t0=AC.currentTime+delay,n=Math.max(8,Math.floor(AC.sampleRate*dur));
  const buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=buf;
  const g=AC.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start(t0);
}
const sfx={
  shoot(){tone(340,90,.16,'sawtooth',.5);noiseBurst(.12,.3);},
  bounce(v){tone(170,110,.05,'square',Math.min(.4,v/900+.08));},
  pop(t){const f=[880,640,500][t]||640;tone(f,f*.22,.13,'square',.45);noiseBurst(.05,.2);},
  breach(){tone(210,48,.4,'sawtooth',.5);tone(140,40,.42,'square',.3);},
  sink(big){[523,659,784,1047].forEach((f,i)=>tone(f,f,.14,'triangle',.5,i*.09));if(big)tone(1319,1319,.28,'triangle',.5,.38);},
  ui(){tone(440,880,.07,'square',.3);}
};

/* ---------------- pixel invader sprites (prerendered) ---------------- */
const TIER_COLORS=['#6dffb2','#54d8ff','#ff6fd8'];
const TIER_PTS=[30,20,10];
const SPRITES=[ // [tier][frame] — 11×8 bitmaps
[ ["00011111000","00111111100","01111111110","01011111010","01111111110","00111111000","00101010100","00010001000"],
  ["00011111000","00111111100","01111111110","01011111010","01111111110","00111111000","01010101010","00101010100"] ],
[ ["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101","10100000101","00011011000"],
  ["00100000100","00010001000","00111111100","01101110110","11111111111","10111111101","10011111001","01100000110"] ],
[ ["00111111100","01111111110","11101110111","11111111111","11111111111","00111111000","01011111010","10001010001"],
  ["00111111100","01111111110","11101110111","11111111111","11111111111","00111111000","10011111001","01001010010"] ]
];
function makeSprite(rows,color){
  const s=document.createElement('canvas');s.width=33;s.height=24;
  const c=s.getContext('2d');c.fillStyle=color;
  for(let y=0;y<8;y++)for(let x=0;x<11;x++)if(rows[y][x]==='1')c.fillRect(x*3,y*3,3,3);
  return s;
}
const SPR=SPRITES.map((frames,t)=>frames.map(f=>makeSprite(f,TIER_COLORS[t])));
function drawAlien(x,y,tier){ctx.drawImage(SPR[tier][(T*2|0)%2],Math.round(x-16.5),Math.round(y-12));}

/* ---------------- course data: [x,y] tee/cup, rocks[x,y,r], bars[x,y,w,h], aliens[x,y,tier] ---------------- */
const HOLES=[
 {name:'FIRST LIGHT',par:3,speed:7,tee:[140,532],cup:[826,158],rocks:[],bars:[],
  aliens:[[336,292,0],[400,292,0],[464,292,0],[528,292,0],[592,292,0],[656,292,0]]},
 {name:'DOGLEG',par:4,speed:8,tee:[140,540],cup:[826,512],rocks:[[480,300,64]],bars:[],
  aliens:[[348,196,0],[412,150,0],[476,196,0],[540,150,0],[604,196,0],[444,258,1],[508,258,1]]},
 {name:'THE WALL',par:4,speed:9,tee:[130,540],cup:[836,152],rocks:[],
  bars:[[F.x,352,372,24],[564,352,372,24]],
  aliens:[[312,168,0],[388,168,0],[464,168,0],[540,168,0],[616,168,0],[350,248,1],[426,248,1],[502,248,1],[578,248,1]]},
 {name:'ASTEROID ALLEY',par:4,speed:9.5,tee:[108,318],cup:[852,318],
  rocks:[[450,150,46],[505,322,52],[455,492,46]],bars:[],
  aliens:[[672,124,0],[616,168,1],[728,168,1],[672,212,1],[330,104,0],[402,104,0],[560,96,2]]},
 {name:'SPLIT DECISION',par:5,speed:10,tee:[480,556],cup:[480,132],rocks:[[818,470,42]],
  bars:[[368,150,24,224],[568,274,24,224]],
  aliens:[[424,186,0],[480,186,0],[536,186,0],[424,258,1],[480,258,1],[536,258,1],[480,330,2]]},
 {name:'FINAL APPROACH',par:5,speed:12,tee:[126,548],cup:[838,148],
  rocks:[[480,342,56],[792,102,34],[886,102,34],[838,200,34]],bars:[],
  aliens:[[312,150,0],[388,150,0],[464,150,0],[540,150,0],[350,228,1],[426,228,1],[502,228,1],[438,296,2]]}
];

/* ---------------- state ---------------- */
function loadBest(){try{const v=localStorage.getItem('p4p_best');return v?parseInt(v,10):null;}catch(e){return null;}}
function saveBest(v){try{localStorage.setItem('p4p_best',String(v));}catch(e){}}

let T=0;
const G={state:'menu',holeIdx:0,hole:null,ball:null,
  aim:{angle:-.8,power:0},aiming:false,aimCur:{x:0,y:0},charging:false,chargeP:0,
  scorecard:[],totalZaps:0,zapPts:0,shake:0,redFlash:0,doneT:0,holeT:0,
  lasers:[],laserT:1,texts:[],parts:[],rings:[],best:loadBest(),newRecord:false,totalStrokes:0};
const keys={left:false,right:false,shift:false};

const STARS=[];for(let i=0;i<120;i++)STARS.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.6,ph:Math.random()*6.28,sp:3+Math.random()*9,tw:.5+Math.random()*2});

/* ---------------- flow ---------------- */
function toMenu(){G.state='menu';G.aiming=false;G.charging=false;keys.left=keys.right=false;}
function startCourse(){G.scorecard=[];G.totalZaps=0;G.zapPts=0;initHole(0);}
function initHole(i){
  const D=HOLES[i];G.holeIdx=i;
  G.hole={name:D.name,par:D.par,speed:D.speed,tee:{x:D.tee[0],y:D.tee[1]},cup:{x:D.cup[0],y:D.cup[1]},
    rocks:D.rocks.map(r=>({x:r[0],y:r[1],r:r[2]})),
    bars:D.bars.map(b=>({x:b[0],y:b[1],w:b[2],h:b[3]})),
    aliens:D.aliens.map(a=>({x:a[0],y:a[1],baseX:a[0],tier:a[2],phase:Math.random()*6.28,dead:false})),
    total:D.aliens.length,putts:0,penalties:0,zaps:0};
  G.ball={x:D.tee[0],y:D.tee[1],vx:0,vy:0,state:'aim',trail:[]};
  G.aim.angle=Math.atan2(D.cup[1]-D.tee[1],D.cup[0]-D.tee[0]);G.aim.power=0;
  G.charging=false;G.chargeP=0;G.aiming=false;
  G.lasers=[];G.laserT=1+Math.random();G.texts=[];G.parts=[];G.rings=[];
  G.holeT=0;G.state='play';
}
function advance(){if(G.holeIdx>=HOLES.length-1)finishCourse();else initHole(G.holeIdx+1);}
function finishCourse(){
  G.totalStrokes=G.scorecard.reduce((s,r)=>s+r.strokes,0);
  const prev=loadBest();G.newRecord=(prev==null||G.totalStrokes<prev);
  if(G.newRecord)saveBest(G.totalStrokes);
  G.best=loadBest();G.state='courseEnd';sfx.sink(true);
}
function resultWord(s,par){
  if(s===1)return'HOLE IN ONE!!';const d=s-par;
  if(d<=-3)return'ALBATROSS!';if(d===-2)return'EAGLE!';if(d===-1)return'BIRDIE!';
  if(d===0)return'PAR';if(d===1)return'BOGEY';if(d===2)return'DOUBLE BOGEY';
  return'+'+d+' ... OUCH';
}

/* ---------------- juice helpers ---------------- */
function addText(txt,x,y,c){x=Math.max(52,Math.min(W-52,x));G.texts.push({txt,x,y,c,life:.95,max:.95});}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=40+Math.random()*170;
  G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.5+Math.random()*.4,max:.9,c,sz:1.5+Math.random()*2});}}
function shoot(){
  const b=G.ball,h=G.hole;if(G.state!=='play'||b.state!=='aim')return;
  const sp=MINS+(MAXS-MINS)*G.aim.power;
  b.vx=Math.cos(G.aim.angle)*sp;b.vy=Math.sin(G.aim.angle)*sp;
  b.state='roll';h.putts++;G.aim.power=0;G.charging=false;
  sfx.shoot();G.shake=Math.max(G.shake,1.5);burst(b.x,b.y,'#e8fff2',6);
}
function popAlien(a){
  a.dead=true;const h=G.hole,b=G.ball;
  h.zaps++;G.totalZaps++;G.zapPts+=TIER_PTS[a.tier];
  addText('+'+TIER_PTS[a.tier],a.x,a.y-16,TIER_COLORS[a.tier]);
  burst(a.x,a.y,TIER_COLORS[a.tier],14);sfx.pop(a.tier);G.shake=Math.max(G.shake,1.2);
  if(b.state==='roll'){
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
    const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.9*vn*nx;b.vy-=1.9*vn*ny;}
    const sp=Math.hypot(b.vx,b.vy);if(sp>MAXS){b.vx*=MAXS/sp;b.vy*=MAXS/sp;}
  }
}
function sinkHole(){
  const h=G.hole,b=G.ball;
  b.state='sunk';b.trail.length=0;
  const strokes=h.putts+h.penalties,d=strokes-h.par;
  G.scorecard.push({strokes,par:h.par});
  G.rings.push({x:h.cup.x,y:h.cup.y,t:0});
  burst(h.cup.x,h.cup.y,'#7dffc4',18);
  sfx.sink(d<0||strokes===1);
  addText(resultWord(strokes,h.par),h.cup.x,h.cup.y-36,strokes===1?'#ffd94a':(d<0?'#5dff9d':(d===0?'#ffffff':'#ffc857')));
  G.state='holeDone';G.doneT=0;G.shake=Math.max(G.shake,3);
}

/* ---------------- physics ---------------- */
function stepBall(dt){
  const b=G.ball,h=G.hole,c=h.cup;
  if(b.state!=='roll')return;
  let sp=Math.hypot(b.vx,b.vy);
  const steps=Math.max(1,Math.ceil(sp*dt/6)),sdt=dt/steps;
  for(let i=0;i<steps;i++){
    b.x+=b.vx*sdt;b.y+=b.vy*sdt;
    let hit=0;
    if(b.x<F.x+BALL_R){b.x=F.x+BALL_R;if(b.vx<0){hit=Math.abs(b.vx);b.vx=-b.vx*WALL_REST;}}
    else if(b.x>F.x+F.w-BALL_R){b.x=F.x+F.w-BALL_R;if(b.vx>0){hit=Math.abs(b.vx);b.vx=-b.vx*WALL_REST;}}
    if(b.y<F.y+BALL_R){b.y=F.y+BALL_R;if(b.vy<0){hit=Math.max(hit,Math.abs(b.vy));b.vy=-b.vy*WALL_REST;}}
    else if(b.y>F.y+F.h-BALL_R){b.y=F.y+F.h-BALL_R;if(b.vy>0){hit=Math.max(hit,Math.abs(b.vy));b.vy=-b.vy*WALL_REST;}}
    if(hit>60){sfx.bounce(hit);if(hit>380)G.shake=Math.max(G.shake,1.5);}
    for(const r of h.rocks){
      let dx=b.x-r.x,dy=b.y-r.y,d=Math.hypot(dx,dy),min=r.r+BALL_R;
      if(d<min){if(d===0){dx=1;dy=0;d=1;}const nx=dx/d,ny=dy/d;b.x=r.x+nx*min;b.y=r.y+ny*min;
        const vn=b.vx*nx+b.vy*ny;
        if(vn<0){b.vx-=(1+ROCK_REST)*vn*nx;b.vy-=(1+ROCK_REST)*vn*ny;if(-vn>60)sfx.bounce(-vn);if(-vn>300)G.shake=Math.max(G.shake,2);}}
    }
    for(const bar of h.bars){
      const cx=Math.max(bar.x,Math.min(b.x,bar.x+bar.w)),cy=Math.max(bar.y,Math.min(b.y,bar.y+bar.h));
      let dx=b.x-cx,dy=b.y-cy;const d2=dx*dx+dy*dy;
      if(d2<BALL_R*BALL_R){
        let nx,ny;const d=Math.sqrt(d2);
        if(d>.001){nx=dx/d;ny=dy/d;}
        else{const l=b.x-bar.x,rg=(bar.x+bar.w)-b.x,t=b.y-bar.y,bt=(bar.y+bar.h)-b.y,m=Math.min(l,rg,t,bt);
          if(m===l){nx=-1;ny=0;b.x=bar.x-BALL_R;}else if(m===rg){nx=1;ny=0;b.x=bar.x+bar.w+BALL_R;}
          else if(m===t){nx=0;ny=-1;b.y=bar.y-BALL_R;}else{nx=0;ny=1;b.y=bar.y+bar.h+BALL_R;}}
        b.x+=nx*(BALL_R-d);b.y+=ny*(BALL_R-d);
        const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+WALL_REST)*vn*nx;b.vy-=(1+WALL_REST)*vn*ny;if(-vn>60)sfx.bounce(-vn);}
      }
    }
    const dx=c.x-b.x,dy=c.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<48){const k=1600*(1-d/48);b.vx+=dx/d*k*sdt;b.vy+=dy/d*k*sdt;}
    sp=Math.hypot(b.vx,b.vy);
    if(d<CUP_R-2&&sp<220){sinkHole();return;}
  }
  const f=Math.exp(-DECAY*dt);b.vx*=f;b.vy*=f;
  sp=Math.hypot(b.vx,b.vy);
  if(sp<9){b.vx=0;b.vy=0;b.state='aim';}
  b.trail.push({x:b.x,y:b.y});if(b.trail.length>16)b.trail.shift();
}

/* ---------------- update ---------------- */
function updatePlay(dt){
  const h=G.hole,b=G.ball;G.holeT+=dt;
  if(b.state==='aim'){
    if(keys.left)G.aim.angle-=2.6*dt*(keys.shift?.35:1);
    if(keys.right)G.aim.angle+=2.6*dt*(keys.shift?.35:1);
    if(G.charging)G.chargeP=Math.min(1,G.chargeP+dt/1.15),G.aim.power=G.chargeP;
    if(G.aiming){const dx=b.x-G.aimCur.x,dy=b.y-G.aimCur.y,len=Math.hypot(dx,dy);
      if(len>4){G.aim.angle=Math.atan2(dy,dx);G.aim.power=Math.min(1,len/230);}else G.aim.power=0;}
    if(Math.hypot(b.x-h.cup.x,b.y-h.cup.y)<16)sinkHole();
  }
  for(const a of h.aliens){
    a.y+=h.speed*dt;a.x=a.baseX+Math.sin(T*.9+a.phase)*14;
    if(a.y+12>=BOMB_Y){a.dead=true;h.penalties++;G.shake=Math.max(G.shake,5);G.redFlash=.6;
      sfx.breach();addText('PENALTY +1',a.x,BOMB_Y-18,'#ff5470');continue;}
    if(!a.dead&&b.state!=='sunk'&&Math.hypot(b.x-a.x,b.y-a.y)<ALIEN_R+BALL_R)popAlien(a);
  }
  h.aliens=h.aliens.filter(a=>!a.dead);
  stepBall(dt);
  G.laserT-=dt;
  if(G.laserT<=0&&h.aliens.length){G.laserT=1.1+Math.random()*1.2;
    const a=h.aliens[(Math.random()*h.aliens.length)|0];
    G.lasers.push({x:a.x,y:a.y,t:0,c:TIER_COLORS[a.tier]});}
  for(const L of G.lasers)L.t+=dt;
  G.lasers=G.lasers.filter(L=>L.t<.16);
}
function update(dt){
  T+=dt;
  for(const s of STARS){s.y+=s.sp*dt;if(s.y>H+2){s.y=-2;s.x=Math.random()*W;}}
  G.shake*=Math.exp(-5*dt);if(G.shake<.05)G.shake=0;
  G.redFlash=Math.max(0,G.redFlash-dt*1.6);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-3*dt);p.vy*=Math.exp(-3*dt);p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.y-=36*dt;t.life-=dt;}
  G.texts=G.texts.filter(t=>t.life>0);
  for(const r of G.rings)r.t+=dt;
  G.rings=G.rings.filter(r=>r.t<.7);

  if(G.state==='menu')return;
  if(G.state==='play'){updatePlay(dt);return;}
  if(G.state==='holeDone'){
    G.doneT+=dt;
    for(const a of G.hole.aliens){a.y+=G.hole.speed*dt;a.x=a.baseX+Math.sin(T*.9+a.phase)*14;
      if(a.y>F.y+F.h-12)a.y=F.y+16;}
    if(G.doneT>2.8)advance();
  }
}

/* ---------------- drawing helpers ---------------- */
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pad2(n){return String(n).padStart(2,'0');}
function tracked(s){return s.split('').join('\u2009');}

function drawNebula(){
  let g=ctx.createRadialGradient(240+Math.sin(T*.1)*30,200,10,240,200,320);
  g.addColorStop(0,'rgba(84,216,255,.07)');g.addColorStop(1,'rgba(84,216,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(740+Math.cos(T*.13)*40,430,10,740,430,340);
  g.addColorStop(0,'rgba(255,111,216,.06)');g.addColorStop(1,'rgba(255,111,216,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function drawStars(){
  for(const s of STARS){
    const a=.25+.75*(.5+.5*Math.sin(T*s.tw+s.ph));
    ctx.fillStyle='rgba(200,235,255,'+a.toFixed(3)+')';
    if(s.r>1.4){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
      ctx.strokeStyle='rgba(200,235,255,'+(a*.4).toFixed(3)+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(s.x-s.r*3,s.y);ctx.lineTo(s.x+s.r*3,s.y);
      ctx.moveTo(s.x,s.y-s.r*3);ctx.lineTo(s.x,s.y+s.r*3);ctx.stroke();}
    else ctx.fillRect(s.x,s.y,s.r+1,s.r+1);
  }
}
function drawCourse(){
  const h=G.hole;
  ctx.fillStyle='#07231a';ctx.fillRect(F.x,F.y,F.w,F.h);
  ctx.fillStyle='rgba(125,255,196,.03)';
  for(let x=F.x;x<F.x+F.w;x+=160)ctx.fillRect(x,F.y,80,F.h);
  ctx.strokeStyle='rgba(125,255,196,.05)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=F.x+80;x<F.x+F.w;x+=80){ctx.moveTo(x,F.y);ctx.lineTo(x,F.y+F.h);}

function drawAimUI(){

/* ---------------- master render ---------------- */
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#020308';ctx.fillRect(0,0,cw,ch);
  ctx.translate(offX,offY);ctx.scale(scale,scale);
  ctx.save();
  rrect(2,2,W-4,H-4,14);ctx.clip();
  if(G.state==='menu')renderMenu();
  else{
    renderScene();renderHUD();
    if(G.redFlash>0){ctx.fillStyle='rgba(255,60,90,'+(G.redFlash*.18).toFixed(3)+')';ctx.fillRect(0,0,W,H);}
    if(G.state==='holeDone')renderHoleDone();

  }
  ctx.restore();
  ctx.save();ctx.shadowColor='#5dff9d';ctx.shadowBlur=18;
  ctx.strokeStyle='rgba(93,255,157,.5)';ctx.lineWidth=3;

}

  initAudio();
  const c=e.code;
  if(c==='Space'||c==='ArrowLeft'||c==='ArrowRight'||c==='ArrowUp'||c==='ArrowDown')e.preventDefault();
  if(c==='ShiftLeft'||c==='ShiftRight')keys.shift=true;
  if(G.state==='menu'){if(c==='Enter'||c==='Space'){sfx.ui();startCourse();}return;}
  if(G.state==='courseEnd'){
    if(c==='Enter'||c==='KeyR'){sfx.ui();startCourse();}else if(c==='KeyM')toMenu();return;}
  if(G.state==='holeDone'){
    if((c==='Enter'||c==='Space')&&G.doneT>.7){sfx.ui();advance();}else if(c==='KeyM')toMenu();return;}
  // play
  if(c==='KeyM'){toMenu();return;}
  if(c==='KeyR'){initHole(G.holeIdx);return;}
  if(c==='ArrowLeft'||c==='KeyA')keys.left=true;
  if(c==='ArrowRight'||c==='KeyD')keys.right=true;
  if(c==='Space'&&!e.repeat&&G.ball.state==='aim'){G.charging=true;G.chargeP=0;G.aim.power=0;}
});
window.addEventListener('keyup',e=>{
  const c=e.code;
  if(c==='ShiftLeft'||c==='ShiftRight')keys.shift=false;
  if(c==='ArrowLeft'||c==='KeyA')keys.left=false;
  if(c==='ArrowRight'||c==='KeyD')keys.right=false;
  if(c==='Space'&&G.charging){
    G.charging=false;
    if(G.state==='play'&&G.ball.state==='aim'){
      if(G.aim.power>.03)shoot();else G.aim.power=0;}
  }
});
cv.addEventListener('pointerdown',e=>{
  initAudio();const p=toL(e);
  if(G.state==='menu'){sfx.ui();startCourse();return;}
  if(G.state==='courseEnd'){sfx.ui();startCourse();return;}
  if(G.state==='holeDone'){if(G.doneT>.7){sfx.ui();advance();}return;}
  if(G.state==='play'&&G.ball.state==='aim'){
    G.aiming=true;G.aimCur=p;try{cv.setPointerCapture(e.pointerId);}catch(_){}}
});
cv.addEventListener('pointermove',e=>{if(G.aiming)G.aimCur=toL(e);});
cv.addEventListener('pointerup',()=>{
  if(!G.aiming)return;G.aiming=false;
  if(G.state==='play'&&G.ball.state==='aim'){
    if(G.aim.power>.05)shoot();else G.aim.power=0;}
});
cv.addEventListener('pointercancel',()=>{G.aiming=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
