<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Maze Invaders</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04090f;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:block;z-index:0}
.sweep{position:fixed;left:0;right:0;height:130px;z-index:24;pointer-events:none;
 background:linear-gradient(180deg,transparent,rgba(120,255,230,.045),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{from{top:-140px}to{top:100%}}
.crt{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:.5;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;z-index:26;pointer-events:none;
 background:radial-gradient(ellipse at center,transparent 52%,rgba(2,8,14,.6) 100%)}
#hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:clamp(10px,2.6vw,28px);
 padding:9px 14px 12px;font-family:'Courier New',ui-monospace,Menlo,monospace;color:#9fd8e8;
 background:linear-gradient(180deg,rgba(4,14,20,.88),rgba(4,14,20,0));transition:opacity .4s}
#hud.hidden{opacity:0;pointer-events:none}
.stat{display:flex;flex-direction:column;line-height:1.05;gap:3px}
.stat label{font-size:9px;letter-spacing:.3em;color:#4f8fa3}
.stat b{font-size:clamp(15px,2.6vw,22px);letter-spacing:.08em;color:#ffd23f;text-shadow:0 0 10px rgba(255,210,63,.45)}
.balt{color:#8fd7e8!important;text-shadow:none}
.bhost{color:#ff7ab8!important;text-shadow:0 0 10px rgba(255,122,184,.4)!important}
.lives{display:flex;gap:4px;font-size:clamp(12px,2vw,16px);line-height:1;color:#ffd23f;text-shadow:0 0 8px rgba(255,210,63,.6)}
.lives i{font-style:normal}
.lives .off{color:#1c3947;text-shadow:none}
.breach{width:clamp(60px,12vw,120px);height:9px;border:1px solid rgba(95,242,216,.35);background:#0a1e28;padding:1px}
#breachFill{height:100%;width:0%;background:linear-gradient(90deg,#ff5ea8,#ff2f4f);box-shadow:0 0 8px rgba(255,60,90,.7);transition:width .18s}
.breach.hot{animation:pulseB .5s steps(2) infinite}
@keyframes pulseB{50%{border-color:#ff2f4f;box-shadow:0 0 12px rgba(255,47,79,.6)}}
#sndChip{margin-left:auto;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.2em;border:1px solid #2a5b6d;padding:4px 9px;color:#57c9e8;background:#0a2230;cursor:pointer}
#powers{position:fixed;top:54px;left:14px;z-index:30;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.14em;padding:4px 8px;background:rgba(10,34,48,.85);border:1px solid}
.pill .bar{width:52px;height:5px;background:#0e3242}
.pill .bar i{display:block;height:100%}
.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;
 background:rgba(3,10,16,.8);opacity:0;pointer-events:none;transition:opacity .35s;cursor:pointer}
.overlay.show{opacity:1;pointer-events:auto}
.panel{width:min(94vw,620px);max-height:94vh;overflow:auto;background:linear-gradient(180deg,rgba(11,34,49,.97),rgba(7,22,34,.97));
 border:1px solid rgba(95,242,216,.4);text-align:center;color:#cfeaf2;font-family:'Courier New',ui-monospace,monospace;
 box-shadow:0 0 0 5px #06131c,0 0 60px rgba(45,212,191,.18),inset 0 0 70px rgba(0,0,0,.55)}
.marquee{height:7px;background:repeating-linear-gradient(90deg,#2dd4bf 0 12px,transparent 12px 24px);opacity:.45}
.panel h1{font-family:Impact,'Arial Black','Franklin Gothic Bold',sans-serif;font-size:clamp(34px,8.5vw,72px);letter-spacing:.05em;line-height:1;
 margin:22px 10px 6px;color:#eafffa;text-shadow:-3px 0 rgba(255,47,146,.5),3px 0 rgba(34,230,255,.5),0 0 26px rgba(45,212,191,.35)}
h1 .t2{color:#ffd23f;text-shadow:-3px 0 rgba(255,47,146,.55),3px 0 rgba(34,230,255,.55),0 0 26px rgba(255,210,63,.4)}
h1.lost{color:#ffb3c0;text-shadow:-3px 0 rgba(255,47,79,.55),3px 0 rgba(34,230,255,.4),0 0 26px rgba(255,60,90,.4)}
.tag{font-size:clamp(10px,1.8vw,13px);letter-spacing:.3em;color:#6fb7cc;margin-bottom:18px;padding:0 12px}
.guide{display:flex;justify-content:center;gap:clamp(8px,4vw,28px);margin:6px 0 18px;flex-wrap:wrap;padding:0 8px}
.g{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 12px;border:1px dashed #1e4a5a;background:#081c27}
.g canvas{width:52px;height:36px}
.g b{font-size:11px;letter-spacing:.2em;color:#d9f4ff}
.g i{font-style:normal;font-size:9px;color:#5f93a6;letter-spacing:.08em}
.ctrl{max-width:410px;margin:0 auto 16px;text-align:left;padding:0 16px}
.ctrl .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 2px;border-bottom:1px dashed #16394a;font-size:clamp(10px,1.7vw,12px);letter-spacing:.1em;color:#8fc3d4}
kbd{font-family:'Courier New',monospace;font-size:10px;background:#0e2c3b;border:1px solid #2a5b6d;border-bottom-width:2px;padding:3px 7px;margin:0 3px;color:#bff3ff;letter-spacing:.08em}
.prompt{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(14px,2.6vw,20px);letter-spacing:.18em;color:#5ff2d8;margin:16px 0 8px;animation:blink 1.1s steps(2) infinite;text-shadow:0 0 14px rgba(95,242,216,.6)}
@keyframes blink{50%{opacity:.1}}
.hiscore{font-size:11px;letter-spacing:.25em;color:#5f93a6;padding-bottom:22px}
.hiscore b{color:#ffd23f}
.stats{margin:8px auto 14px;max-width:340px;text-align:left}
.stats .row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed #16394a;font-size:12px;letter-spacing:.15em;color:#8fc3d4}
.stats b{color:#ffd23f}
.newbest{display:inline-block;margin-top:10px;padding:5px 14px;border:1px solid #ffd23f;color:#ffd23f;font-size:11px;letter-spacing:.3em;animation:blink .8s steps(2) infinite}
@media(max-width:600px){.hide-sm{display:none!important}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="sweep"></div><div class="crt"></div><div class="vig"></div>

<div id="hud" class="hidden">
  <div class="stat"><label>SCORE</label><b id="score">000000</b></div>
  <div class="stat hide-sm"><label>BEST</label><b id="hi" class="balt">000000</b></div>
  <div class="stat"><label>SECTOR</label><b id="wave" style="color:#5ff2d8;text-shadow:0 0 10px rgba(95,242,216,.5)">1</b></div>
  <div class="stat hide-sm"><label>HOSTILES</label><b id="host" class="bhost">0</b></div>
  <div class="stat"><label>BREACH</label><div class="breach" id="breachBox"><div id="breachFill"></div></div></div>
  <div class="stat"><label>LIVES</label><span class="lives" id="lives"><i>&#9650;</i><i>&#9650;</i><i>&#9650;</i></span></div>
  <div id="sndChip">SND ON</div>
</div>
<div id="powers"></div>
<div class="overlay" id="overlay"></div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
let DPR=1,CW=0,CH=0,unit=16,ox=0,oy=0;
const COLS=18,ROWS=12,GW=COLS*2+1,GH=ROWS*2+1;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
let maze=null,topCells=[],exitXs=[];
let bgC=null,mc=null,sprCache=new Map();

/* ----------------------------- state ------------------------------ */
let state='attract',tG=0,last=0;
let score=0,hi=0,lives=3,wave=1,breaches=0;
let interT=0,overT=0,overShown=false,newBest=false;
let shake=0,flashRed=0,flashBottom=0;
let banner={txt:'',sub:'',t:0,dur:0};
let spawnQueue=[],spawnT=0,eid=0;
const enemies=[],bullets=[],powers=[],particles=[],popups=[];
const p={x:GW/2,y:GH/2,r:0.34,vx:0,vy:0,dir:[0,-1],ang:-Math.PI/2,cool:0,invuln:0,rapidT:0,doubleT:0,shieldT:0,mf:0};
const touch={active:false,gx:0,gy:0,fire:false};
try{hi=+localStorage.getItem('mazeInvaders.hi')||0}catch(e){}

/* ============================== AUDIO ============================== */
let actx=null,master=null,muted=false,padOn=false,noiseBuf=null;
function initAudio(){
  if(actx)return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=muted?0:0.55;master.connect(actx.destination);
  }catch(e){}
  if(actx&&!padOn){ // faint ambient pad
    padOn=true;
    const g=actx.createGain();g.gain.value=0.016;g.connect(master);
    [[55,'sine'],[82.5,'triangle']].forEach(function(a){
      const o=actx.createOscillator();o.type=a[1];o.frequency.value=a[0];
      const og=actx.createGain();og.gain.value=0.5;o.connect(og);og.connect(g);o.start();
    });
  }
}
function firstInput(){initAudio();if(actx&&actx.state==='suspended')actx.resume();}
function tone(f0,f1,dur,type,vol,when){
  if(!actx||muted)return;const t=when!=null?when:actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function getNoise(){
  if(noiseBuf)return noiseBuf;
  const b=actx.createBuffer(1,actx.sampleRate,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return noiseBuf=b;
}
function noise(dur,vol,freq,type,when){
  if(!actx||muted)return;const t=when!=null?when:actx.currentTime;
  const s=actx.createBufferSource();s.buffer=getNoise();
  const f=actx.createBiquadFilter();f.type=(type||'highpass');f.frequency.value=freq;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.03);
}
function sfx(n){
  if(!actx||muted)return;
  const S={
    shoot:function(){tone(880,160,0.08,'square',0.10)},
    eshot:function(){noise(0.05,0.25,1400);tone(320,140,0.06,'sawtooth',0.10)},
    edie:function(){tone(440,440,0.05,'square',0.12);tone(660,660,0.05,'square',0.12,actx.currentTime+0.045);tone(990,990,0.08,'square',0.12,actx.currentTime+0.09)},
    hurt:function(){noise(0.3,0.5,400,'lowpass');tone(200,50,0.4,'sawtooth',0.30)},
    power:function(){tone(620,1240,0.12,'triangle',0.18);tone(930,1860,0.14,'triangle',0.14,actx.currentTime+0.06)},
    breach:function(){tone(760,760,0.1,'square',0.18);tone(520,520,0.12,'square',0.18,actx.currentTime+0.11)},
    wstart:function(){tone(392,392,0.09,'triangle',0.2);tone(523,523,0.09,'triangle',0.2,actx.currentTime+0.09);tone(659,659,0.14,'triangle',0.2,actx.currentTime+0.18)},
    wclear:function(){[523,659,784,1046].forEach(function(f,i){tone(f,f,i===3?0.25:0.09,'square',0.14,actx.currentTime+i*0.09)})},
    over:function(){tone(311,311,0.3,'sawtooth',0.2);tone(233,233,0.3,'sawtooth',0.2,actx.currentTime+0.28);tone(155,77,0.7,'sawtooth',0.22,actx.currentTime+0.56)},
    ui:function(){tone(900,900,0.05,'square',0.1)}
  };
  if(S[n])S[n]();
}
const BASS=[55,0,55,55,0,65.41,55,0,49,0,49,49,0,73.42,82.41,65.41],SPB=0.145;
let musNext=0,musStep=0;
function resetMusic(){musNext=actx?actx.currentTime+0.15:0;musStep=0;}
function musicTick(){
  if(!actx||muted)return;
  if(state!=='play'&&state!=='inter'){musNext=Math.max(musNext,actx.currentTime);return;}
  while(musNext<actx.currentTime+0.15){
    const f=BASS[musStep];
    if(f)tone(f,f,SPB*0.9,'triangle',0.06,musNext);
    if(musStep%2===1)noise(0.03,0.018,4000,'highpass',musNext);
    musNext+=SPB;musStep=(musStep+1)%16;
  }
}

/* ============================ MAZE GEN ============================= */
function G(x,y){return (x<0||y<0||x>=GW||y>=GH)?1:maze[y*GW+x];}
function makeMaze(){
  const g=new Uint8Array(GW*GH).fill(1),I=function(x,y){return y*GW+x;};
  g[I(1,1)]=0;const st=[[1,1]];
  while(st.length){
    const c=st[st.length-1],cx=c[0],cy=c[1],opts=[];
    for(let d=0;d<4;d++){const nx=cx+2*DIRS[d][0],ny=cy+2*DIRS[d][1];
      if(nx>0&&ny>0&&nx<GW-1&&ny<GH-1&&g[I(nx,ny)])opts.push([nx,ny,cx+DIRS[d][0],cy+DIRS[d][1]]);}
    if(!opts.length){st.pop();continue;}
    const o=opts[(Math.random()*opts.length)|0];
    g[I(o[2],o[3])]=0;g[I(o[0],o[1])]=0;st.push([o[0],o[1]]);
  }
  for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++){ // braid: open some walls into loops
    if(g[I(x,y)]===1){
      const h=g[I(x-1,y)]===0&&g[I(x+1,y)]===0, v=g[I(x,y-1)]===0&&g[I(x,y+1)]===0;
      if((h||v)&&Math.random()<0.32)g[I(x,y)]=0;
    }
  }
  return g;
}
function newSector(){
  maze=makeMaze();topCells=[];exitXs=[];
  for(let x=1;x<GW-1;x++){if(G(x,1)===0)topCells.push(x);if(G(x,GH-2)===0)exitXs.push(x);}
  const c=findCell(Math.floor(GW/2),state==='attract'?Math.floor(GH/2):2);
  p.x=c[0];p.y=c[1];p.vx=p.vy=0;p.ang=-Math.PI/2;
  bullets.length=0;powers.length=0;
  if(state!=='attract'){spawnQueue=buildWave(wave);spawnT=0.8;p.invuln=Math.max(p.invuln,1);}
  else spawnQueue=[];
  buildMazeLayer();
}
function findCell(cx,cy){
  for(let r=0;r<60;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    if(G(cx+dx,cy+dy)===0)return [cx+dx,cy+dy];
  }
  return [1,1];
}
function buildWave(w){
  const n=Math.min(8+w*3,36),q=[];
  for(let i=0;i<n;i++){
    if(w>=3&&i%6===5)q.push('titan');
    else if(w>=2&&Math.random()<0.3)q.push('runner');
    else q.push('crab');
  }
  for(let i=q.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=q[i];q[i]=q[j];q[j]=t;}
  return q;
}

/* ============================ SPRITES ============================== */
const CRAB1=["..X.....X..","...X...X...","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","...XX.XX..."];
const CRAB2=["..X.....X..","X..X...X..X","X.XXXXXXX.X","XXX.XXX.XXX","XXXXXXXXXXX","..XXXXXXX..","..X.....X..",".X.......X."];
const RUN1=["...XX.XX...","....XXX....","..XXXXXXX..","XXX.XXX.XXX","XXXXXXXXXXX",".X..X.X..X.","X...X.X...X","...X...X..."];
const RUN2=["...XX.XX...","....XXX....","..XXXXXXX..","XXX.XXX.XXX","XXXXXXXXXXX","X..X.X.X..X",".X...X...X.","..X.....X.."];
const TIT1=["...XXXXX...","..XXXXXXX..",".XXXXXXXXX.","XXX.XXX.XXX","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X",".XX..XX..XX"];
const TIT2=["...XXXXX...","..XXXXXXX..",".XXXXXXXXX.","XXXX XXXXXX".replace(' ',''),"XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","XX..XX..XX."];
const SPR={
  crab:  {col:'#ff5ea8',glow:'rgba(255,94,168,.85)',pts:50, hp:1,mult:1.0, sc:0.92,f:[CRAB1,CRAB2]},
  runner:{col:'#ffa042',glow:'rgba(255,160,66,.85)',pts:90, hp:1,mult:1.55,sc:0.84,f:[RUN1,RUN2]},
  titan: {col:'#a06bff',glow:'rgba(160,107,255,.9)', pts:250,hp:3,mult:0.6, sc:1.04,f:[TIT1,TIT2]}
};
function getSprite(type,frame,white){
  const key=type+'_'+frame+'_'+(white?1:0);
  if(sprCache.has(key))return sprCache.get(key);
  const base=(unit/11)*SPR[type].sc,SS=2,w=11*base*SS,h=8*base*SS;
  const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);
  const x=c.getContext('2d'),rows=SPR[type].f[frame];
  x.shadowColor=white?'rgba(255,255,255,.9)':SPR[type].glow;
  x.shadowBlur=base*SS*0.7;x.fillStyle=white?'#fff':SPR[type].col;
  for(let yy=0;yy<8;yy++)for(let xx=0;xx<11;xx++)
    if(rows[yy][xx]==='X')x.fillRect(xx*base*SS,yy*base*SS,base*SS+0.6,base*SS+0.6);
  sprCache.set(key,c);return c;
}
function paintMini(cv,type){
  const s=4,c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);
  c.scale(2,2);c.shadowColor=SPR[type].glow;c.shadowBlur=5;c.fillStyle=SPR[type].col;
  const rows=SPR[type].f[0];
  for(let y=0;y<8;y++)for(let x=0;x<11;x++)if(rows[y][x]==='X')c.fillRect(x*s,y*s,s,s);
}

/* ========================= STATIC LAYERS =========================== */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function buildBG(){
  bgC=document.createElement('canvas');bgC.width=Math.ceil(CW*DPR);bgC.height=Math.ceil(CH*DPR);
  const c=bgC.getContext('2d');c.scale(DPR,DPR);
  const g=c.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#071a26');g.addColorStop(0.55,'#051320');g.addColorStop(1,'#03090f');
  c.fillStyle=g;c.fillRect(0,0,CW,CH);
  const blob=function(x,y,r,col){const rg=c.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=rg;c.fillRect(0,0,CW,CH);};
  blob(CW*0.24,CH*0.3,Math.max(CW,CH)*0.5,'rgba(45,212,191,.10)');
  blob(CW*0.78,CH*0.68,Math.max(CW,CH)*0.45,'rgba(255,94,168,.07)');
  blob(CW*0.55,CH*0.08,Math.max(CW,CH)*0.35,'rgba(255,210,63,.05)');
}
function buildMazeLayer(){
  const w=GW*unit,h=GH*unit;
  mc=document.createElement('canvas');mc.width=Math.ceil(w*DPR);mc.height=Math.ceil(h*DPR);
  const c=mc.getContext('2d');c.scale(DPR,DPR);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){ // floor
    if(G(x,y)===0){
      c.fillStyle=(x*7+y*13)%5<2?'#0a1c26':'#0b1f2b';
      c.fillRect(x*unit,y*unit,unit,unit);
      c.fillStyle='rgba(95,242,216,.06)';c.fillRect(x*unit+unit/2-1,y*unit+unit/2-1,2,2);
    }
  }
  const ins=unit*0.08; // wall glow pass
  c.shadowColor='rgba(64,224,255,.5)';c.shadowBlur=unit*0.38;c.fillStyle='#155a70';
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(G(x,y)===1){rr(c,x*unit+ins,y*unit+ins,unit-2*ins,unit-2*ins,unit*0.16);c.fill();}
  c.shadowBlur=0; // wall core pass
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    if(G(x,y)!==1)continue;
    const i2=ins+unit*0.14;
    c.fillStyle='#1d7a92';rr(c,x*unit+i2,y*unit+i2,unit-2*i2,unit-2*i2,unit*0.1);c.fill();
    c.fillStyle='rgba(190,255,246,.35)';c.fillRect(x*unit+i2+1,y*unit+i2+1,unit-2*i2-2,Math.max(1,unit*0.08));
  }
  for(let i=0;i<exitXs.length;i++){ // exit gates at bottom border
    const x=exitXs[i],gx=x*unit,gy=(GH-1)*unit;
    c.fillStyle='#03090f';c.fillRect(gx+ins,gy,unit-2*ins,unit);

function spawnEnemy(type){
  const x=topCells[(Math.random()*topCells.length)|0];
  const e={type:type,hp:SPR[type].hp,x:x,y:1,bx:x,by:1,sx:x,sy:1,tx:x,ty:1,t:0.0001,cx:x,cy:1,exit:false,flash:0,spawnT:0.35,dead:false,id:eid++};

function pickNext(e){
  if(e.y===GH-2){startExit(e);return;}
  const opts=[];
  for(let d=0;d<4;d++){
    const dx=DIRS[d][0],dy=DIRS[d][1],nx=e.x+dx,ny=e.y+dy;
    if(G(nx,ny)===1)continue;
    if(dx===e.bx-e.x&&dy===e.by-e.y)continue;
    opts.push({nx:nx,ny:ny,w:(dy>0?3:(dy<0?0.8:1))});
  }
  if(!opts.length){e.sx=e.x;e.sy=e.y;e.tx=e.bx;e.ty=e.by;e.t=0;const px=e.x,py=e.y;e.bx=px;e.by=py;return;}
  let tot=0;for(let i=0;i<opts.length;i++)tot+=opts[i].w;
  let r=Math.random()*tot;
  for(let i=0;i<opts.length;i++){r-=opts[i].w;if(r<=0){e.sx=e.x;e.sy=e.y;e.tx=opts[i].nx;e.ty=opts[i].ny;e.t=0;const px=e.x,py=e.y;e.bx=px;e.by=py;return;}}
}

    const e=enemies[i];e.flash-=dt;e.spawnT-=dt;

  }
}

    if(G(Math.round(b.x),Math.round(b.y))===1){

function hitsWall(x,y,r){

  ctx.restore();
  if(p.invuln>0){
    const sh=p.shieldT>0;
    ctx.strokeStyle=sh?'rgba(125,255,158,.9)':'rgba(95,242,216,'+(0.35+0.4*Math.sin(tG*20))+')';
    ctx.lineWidth=2;if(sh){ctx.setLineDash([6,5]);ctx.lineDashOffset=-tG*30;}
    ctx.beginPath();ctx.arc(px,py,unit*0.72,0,6.283);ctx.stroke();ctx.setLineDash([]);
  }
  if(p.mf>0){ctx.fillStyle='rgba(255,255,255,'+(p.mf/0.06)+')';
    ctx.beginPath();ctx.arc(px+Math.cos(p.ang)*unit*0.6,py+Math.sin(p.ang)*unit*0.6,unit*0.18,0,6.283);ctx.fill();}
}

/* =============================== HUD =============================== */
const hudEl={score:document.getElementById('score'),hi:document.getElementById('hi'),wave:document.getElementById('wave'),
  host:document.getElementById('host'),fill:document.getElementById('breachFill'),box:document.getElementById('breachBox'),
  lives:document.getElementById('lives').children,powers:document.getElementById('powers')};
const pad6=function(n){return String(Math.min(999999,n|0)).padStart(6,'0');};
let hc={s:-1,h:-1,w:-1,ho:-1,l:-1,b:-1},powersSig='';
function syncHud(){
  if(hc.s!==score){hudEl.score.textContent=pad6(score);hc.s=score;}
  if(hc.h!==hi){hudEl.hi.textContent=pad6(hi);hc.h=hi;}
  if(hc.w!==wave){hudEl.wave.textContent=wave;hc.w=wave;}
  const ho=enemies.length+spawnQueue.length;
  if(hc.ho!==ho){hudEl.host.textContent=ho;hc.ho=ho;}
  if(hc.l!==lives){for(let i=0;i<3;i++)hudEl.lives[i].className=i<lives?'':'off';hc.l=lives;}
  const b=(breaches/4*100)|0;
  if(hc.b!==b){hudEl.fill.style.width=b+'%';hudEl.box.classList.toggle('hot',breaches>=3);hc.b=b;}
  const parts=[];
  if(p.rapidT>0)parts.push(['rapid','RAPID','#4fd8ff',p.rapidT/7]);
  if(p.doubleT>0)parts.push(['double','DBL','#ffd23f',p.doubleT/7]);
  if(p.shieldT>0)parts.push(['shield','SHLD','#7dff9e',p.shieldT/5]);
  const sig=parts.map(function(q){return q[0];}).join(',');
  if(sig!==powersSig){
    powersSig=sig;let html='';
    for(let i=0;i<parts.length;i++){const q=parts[i];
      html+='<div class="pill" style="border-color:'+q[2]+'66;color:'+q[2]+'" data-k="'+q[0]+'">'+q[1]+'<span class="bar"><i style="background:'+q[2]+'"></i></span></div>';}
    hudEl.powers.innerHTML=html;
  }
  const kids=hudEl.powers.children;
  for(let i=0;i<kids.length;i++){const k=kids[i].dataset.k,v=k==='rapid'?p.rapidT/7:(k==='double'?p.doubleT/7:p.shieldT/5);
    kids[i].querySelector('i').style.width=(Math.max(0,Math.min(1,v))*100)+'%';}
}

/* =============================== LOOP ============================== */
function bannerSet(txt,sub){banner={txt:txt,sub:sub,t:2.0,dur:2.0};}
let attractT=0;
function tick(now){
  requestAnimationFrame(tick);
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;tG+=dt;
  for(let i=0;i<stars.length;i++){const s=stars[i];s.y+=(4+s.z*10)*dt;s.x-=s.z*2*dt;
    if(s.y>CH)s.y=-2;if(s.x<0)s.x=CW;}
  if(banner.t>0)banner.t-=dt;
  shake=Math.max(0,shake-dt*26);flashRed=Math.max(0,flashRed-dt*1.4);flashBottom=Math.max(0,flashBottom-dt*1.3);
  if(state!=='pause'){
    updateEnemies(dt);updateParticles(dt);
    if(state==='play'||state==='inter'){updatePlayer(dt);updateBullets(dt);updatePowers(dt);musicTick();}
    if(state==='play'){
      spawnT-=dt;
      if(spawnQueue.length&&enemies.length<26&&spawnT<=0){
        spawnEnemy(spawnQueue.shift());
        spawnT=Math.max(0.5,1.35-wave*0.07)*(0.7+Math.random()*0.6);
      }
      if(!spawnQueue.length&&!enemies.length){ // sector cleared
        const bonus=100*wave;score+=bonus;sfx('wclear');state='inter';interT=2.4;
        bannerSet('SECTOR '+wave+' CLEARED','BONUS +'+bonus);
      }
    }else if(state==='attract'){
      attractT-=dt;
      if(attractT<=0&&enemies.length<9){const r=Math.random();spawnEnemy(r<0.25?'runner':'crab');attractT=0.7+Math.random()*0.8;}
    }else if(state==='inter'){
      interT-=dt;
      if(interT<=0){wave++;newSector();state='play';bannerSet('SECTOR '+wave,'');sfx('wstart');resetMusic();}
    }else if(state==='over'){
      overT-=dt;if(overT<=0&&!overShown){overShown=true;showOver();}
    }
  }
  render();syncHud();
}

newSector(); // attract-mode maze with patrolling invaders

requestAnimationFrame(function(n){last=n;requestAnimationFrame(tick);});
