<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARDFALL — Card Typing Arcade</title>
<style>
:root{
  --ink:#241f1a; --cream:#f7f0dd; --gold:#d9a441; --goldlt:#f0c96b;
  --red:#b3273a; --redhot:#e05252; --dim:#8a7a55;
  --serif:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --mono:'Courier New',Courier,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#062018;user-select:none;-webkit-tap-highlight-color:transparent;}
#cv{position:fixed;inset:0;display:block;touch-action:none}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
 background:rgba(3,14,10,.62);opacity:0;pointer-events:none;transition:opacity .35s ease;padding:18px}
#overlay.show{opacity:1;pointer-events:auto}
.fan{position:relative;width:min(92vw,470px);animation:floaty 4.5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-9px)}}
.back{position:absolute;inset:0;border-radius:16px;
 background:
  repeating-linear-gradient(45deg,rgba(247,240,221,.14) 0 2px,transparent 2px 10px),
  repeating-linear-gradient(-45deg,rgba(247,240,221,.14) 0 2px,transparent 2px 10px),
  #7d2230;
 border:2px solid rgba(247,240,221,.85);
 box-shadow:inset 0 0 0 5px #7d2230,inset 0 0 0 6.5px rgba(217,164,65,.8),0 22px 44px rgba(0,0,0,.5);}
.b1{transform:rotate(-7deg) translate(-16px,10px)}
.b2{transform:rotate(5.5deg) translate(14px,12px)}
.ace{position:relative;background:var(--cream);border-radius:16px;padding:38px 30px 26px;text-align:center;
 box-shadow:0 26px 60px rgba(0,0,0,.55), inset 0 0 0 2px #e9ddbd, inset 0 0 0 4px rgba(160,130,60,.28);
 border:1px solid #cbb98d;color:var(--ink)}
.corner{position:absolute;font-family:var(--serif);line-height:.9;color:var(--red)}
.corner b{display:block;font-size:21px;font-weight:700}
.corner i{font-style:normal;font-size:19px}
.tl{top:12px;left:16px}.br{bottom:12px;right:16px;transform:rotate(180deg)}
.ace.bust .corner{color:var(--ink)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(38px,8.5vw,60px);letter-spacing:.04em;margin:8px 0 4px;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.08)}
h1 span{color:var(--red)}
.tag{font-family:var(--serif);font-style:italic;font-size:clamp(13px,2.6vw,15.5px);color:#5c5244;margin:2px auto 16px;max-width:36ch}
.ctrl{list-style:none;margin:0 0 18px;padding:12px 8px;border-top:1px solid rgba(36,31,26,.15);border-bottom:1px solid rgba(36,31,26,.15);
 font-family:var(--mono);font-size:12.5px;color:#4c443a;display:flex;flex-direction:column;gap:9px}
.ctrl li{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
kbd{font-family:var(--mono);font-weight:700;font-size:11.5px;background:var(--ink);color:var(--cream);padding:3px 9px;border-radius:5px;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.deal{cursor:pointer;font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--cream);background:linear-gradient(#c23a49,var(--red));border:1px solid #8c1f2d;border-radius:8px;padding:13px 26px;
 box-shadow:0 6px 16px rgba(179,39,58,.35), inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s ease,box-shadow .15s ease}
.deal:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(179,39,58,.45), inset 0 1px 0 rgba(255,255,255,.25)}
.deal:active{transform:translateY(1px)}
.hs{margin:14px 0 0;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.1em}
.foot{margin-top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:#b3a480}
.stats{display:flex;justify-content:center;gap:clamp(14px,4vw,30px);margin:16px 0 6px}
.stat b{display:block;font-family:var(--mono);font-weight:700;font-size:28px;color:var(--ink)}
.stat span{font-family:var(--serif);font-weight:700;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.ribbon{display:inline-block;background:linear-gradient(var(--goldlt),var(--gold));color:#3a2c12;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;padding:5px 13px;border-radius:4px;transform:rotate(-2.5deg);box-shadow:0 4px 10px rgba(0,0,0,.3);animation:pulse 1s ease-in-out infinite;margin-bottom:6px}
@keyframes pulse{50%{transform:rotate(-2.5deg) scale(1.08)}}
.mini{width:auto;padding:30px 46px}
.mini h2{font-family:var(--serif);font-size:30px;letter-spacing:.3em;margin:0 0 8px;color:var(--ink)}
.mini p{font-family:var(--mono);font-size:12px;color:#5c5244;margin:0;line-height:1.7}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="overlay"></div>
<script>
'use strict';
/* ================= canvas & scaling ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,feltGrad=null,noisePat=null;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  feltGrad=ctx.createRadialGradient(W/2,H*.42,Math.min(W,H)*.1,W/2,H*.55,Math.max(W,H)*.8);
  feltGrad.addColorStop(0,'#155540');feltGrad.addColorStop(.55,'#0d3b2b');feltGrad.addColorStop(1,'#061e16');
  noisePat=ctx.createPattern(noiseTile,'repeat');
  seedAmbient();
}
/* felt grain tile */
const noiseTile=document.createElement('canvas');noiseTile.width=noiseTile.height=96;
{const n=noiseTile.getContext('2d');
 for(let i=0;i<430;i++){n.fillStyle=Math.random()<.5?'rgba(255,250,230,'+(Math.random()*.05).toFixed(3)+')':'rgba(0,0,0,'+(Math.random()*.06).toFixed(3)+')';
 n.fillRect(Math.random()*96|0,Math.random()*96|0,1,1);}}

/* ================= helpers ================= */
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const F_MONO='"Courier New",Courier,monospace';
const F_SERIF='"Palatino Linotype",Palatino,Georgia,serif';
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const rrect=(x,y,w,h,r)=>rr(ctx,x,y,w,h,r);
function setLS(px){if('letterSpacing' in ctx)ctx.letterSpacing=px+'px';}

/* ================= words & suits ================= */
const BANK={
3:['ace','ash','bet','big','cob','dew','fog','gem','hop','ink','jam','key','kit','log','map','mud','net','oak','owl','pen','pit','ray','red','run','sap','sun','tin','web','win','yam','zoo'],
4:['card','deck','dice','face','gold','hand','hole','jack','king','knot','lamp','luck','mask','note','pair','rank','roll','suit','tale','turn','wild','word','zero','apex','bolt','cliff','dune','echo','fern','glow','hive','iris','jade','mint','plum','quip','ruff','silk','tide','urge','vial','wisp','yarn'],
5:['black','brass','cedar','cloud','crane','drift','ember','feast','frost','glass','grape','haste','ivory','jewel','lemon','mango','noble','ocean','pearl','quiet','robin','sable','tiger','urban','wheat','yield','amber','blank','charm','coral','daily','eagle','field','green','heart','laugh','maple','north','paint','reach','stone','trust','voice','altar','blurb','crumb','delta','elbow'],
6:['velvet','bronze','canyon','chapel','cherry','circus','cobalt','coffee','coyote','danger','desert','double','dragon','evening','forest','garden','goblin','hammer','harbor','island','jungle','ladder','magic','meadow','minute','mirror','monkey','needle','orange','palace','parrot','pillow','rabbit','salmon','shadow','silver','spider','summer','turtle','violet','walnut','weasel','window','yellow','butter','castle','copper'],
7:['crystal','diamond','emerald','feather','gallery','gravity','heather','harvest','horizon','jasmine','journey','kitchen','lantern','library','lobster','melody','mercury','mystery','orchard','peacock','pioneer','python','rainbow','samurai','silence','sparkle','sparrow','stadium','theater','thunder','tomato','turkey','volcano','weather','wisdom','wildfire','wonder','zephyr'],
8:['adventure','bungalow','calendar','carnival','champion','computer','elephant','hurricane','keyboard','magazine','mountain','notebook','registry','scissors','skeleton','strategy','umbrella','wildcard','zeppelin','carousel'],
9:['chameleon','chocolate','crocodile','butterfly','fireworks','labyrinth','lightning','pineapple','playground','staircase','telescope','vegetable','xylophone','orchestra']};
const SUITS=['♠','♥','♦','♣'],RED=new Set(['♥','♦']);
const C={cream:'#f7f0dd',ink:'#241f1a',red:'#b3273a',gold:'#d9a441',goldlt:'#f0c96b',dim:'#8a8172',hot:'#e05252'};

/* ================= state ================= */
const G={state:'start',score:0,combo:0,bestCombo:0,lives:3,level:1,completed:0,totalKeys:0,goodKeys:0,
 shake:0,redFlash:0,comboPulse:0,dying:false,overT:0,time:0,at:0,banner:null};
let cards=[],particles=[],popups=[],ticker=[],activeWords=new Set(),spawnT=1,menuT=0;
const motes=[],glyphs=[];
function seedAmbient(){motes.length=0;glyphs.length=0;
 for(let i=0;i<46;i++)motes.push({x:rand(0,W),y:rand(0,H),s:rand(5,18),a:rand(.04,.13),r:rand(.6,1.7),p:rand(0,TAU)});
 for(let i=0;i<9;i++)glyphs.push({ch:SUITS[i%4],x:rand(0,W),y:rand(0,H),s:rand(4,9),rot:rand(0,TAU),rs:rand(-.15,.15),size:rand(70,150)});}

/* ================= audio (Web Audio, post-gesture) ================= */
let AC=null,master=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.28;master.connect(AC.destination);}catch(e){}}
function beep(o){if(!AC||muted)return;const t0=AC.currentTime+(o.delay||0);const osc=AC.createOscillator(),g=AC.createGain();
 osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t0);
 if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(30,o.f2),t0+o.dur);
 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(o.vol||.4,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur);
 osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+o.dur+.03);}
function noiseHit(o){if(!AC||muted)return;const t0=AC.currentTime+(o.delay||0),n=Math.max(8,Math.floor(AC.sampleRate*o.dur));
 const buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const src=AC.createBufferSource();src.buffer=buf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=o.freq||1500;f.Q.value=1.2;
 const g=AC.createGain();g.gain.value=o.vol||.3;src.connect(f);f.connect(g);g.connect(master);src.start(t0);}
function sTick(c){beep({type:'triangle',f:340+Math.min(c,25)*14,dur:.05,vol:.4});}
function sComplete(){[523,659,784].forEach((f,i)=>beep({type:'sine',f,dur:.13,vol:.3,delay:i*.05}));noiseHit({dur:.05,vol:.18,freq:2600});}
function sMiss(){beep({type:'square',f:130,f2:70,dur:.16,vol:.35});}
function sExpire(){beep({type:'sawtooth',f:200,f2:58,dur:.42,vol:.4});noiseHit({dur:.16,vol:.28,freq:300});beep({type:'sine',f:90,dur:.22,vol:.35,delay:.05});}
function sLevel(){[392,523,659,784].forEach((f,i)=>beep({type:'triangle',f,dur:.12,vol:.26,delay:i*.06}));}
function sOver(){[392,311,262,196].forEach((f,i)=>beep({type:'sawtooth',f,dur:.3,vol:.22,delay:i*.13}));}
function sDeal(){noiseHit({dur:.045,vol:.12,freq:1900});}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.28;}

/* ================= high score ================= */
function loadHS(){try{return +localStorage.getItem('cardfall_hs')||0}catch(e){return 0}}
function saveHS(v){try{localStorage.setItem('cardfall_hs',String(v))}catch(e){}}
let hs=loadHS();

/* ================= card back cache ================= */
const backCache=new Map();
function backCanvas(w,h){const k=w+'x'+h;if(backCache.has(k))return backCache.get(k);
 const c=document.createElement('canvas');c.width=Math.ceil(w*2);c.height=Math.ceil(h*2);const g=c.getContext('2d');g.scale(2,2);
 g.save();rr(g,0,0,w,h,9);g.fillStyle='#7d2230';g.fill();g.clip();
 g.fillStyle='rgba(247,240,221,.28)';
 for(let yy=6;yy<h;yy+=9)for(let xx=6;xx<w;xx+=9){g.save();g.translate(xx,yy);g.rotate(Math.PI/4);g.fillRect(-2.2,-2.2,4.4,4.4);g.restore();}
 g.restore();
 g.strokeStyle='rgba(247,240,221,.85)';g.lineWidth=1.5;rr(g,3,3,w-6,h-6,7);g.stroke();
 g.strokeStyle='rgba(217,164,65,.7)';g.lineWidth=1;rr(g,6.5,6.5,w-13,h-13,5);g.stroke();
 g.fillStyle=C.gold;g.font='700 '+Math.floor(h*.3)+'px '+F_SERIF;g.textAlign='center';g.textBaseline='middle';g.fillText('♠',w/2,h/2+1);
 backCache.set(k,c);return c;}

/* ================= spawning ================= */
function cardSize(len){const w=Math.round(clamp(len*17+34,96,238));return{w,h:Math.round(clamp(w*.68,66,152))};}
function pickWord(){const maxLen=Math.min(9,3+G.level);
 for(let i=0;i<12;i++){const len=clamp(3+Math.round(Math.pow(Math.random(),1.7)*(maxLen-3)),3,maxLen);
  const w=BANK[len][Math.random()*BANK[len].length|0];if(!activeWords.has(w))return w;}
 return BANK[maxLen][Math.random()*BANK[maxLen].length|0];}
function spawnCard(){
 const word=pickWord();activeWords.add(word);const len=word.length,sz=cardSize(len),w=sz.w,h=sz.h;
 const margin=w/2+46;let x=rand(margin,W-margin),tries=0;
 while(tries++<8){x=rand(margin,W-margin);let ok=true;
  for(const o of cards){if(!o.menu&&Math.abs(o.x-x)<(o.w+w)/2+18&&o.y<h*1.6){ok=false;break;}}if(ok)break;}
 const life=Math.max(3.4,7.4-G.level*.5),vy=(H+h)/life;
 cards.push({word,len,w,h,x,y:-h/2,vy,baseRot:rand(-.06,.06),ws:rand(1.2,2),wp:rand(0,TAU),
  suit:SUITS[Math.random()*4|0],progress:0,state:'deal',dealT:0,elapsed:0,life,flash:0,flipT:0,rot:0,deadSpin:0});
 sDeal();}
function spawnMenu(){cards.push({menu:true,w:64,h:90,x:rand(70,W-70),y:-80,vy:rand(42,75),rot:rand(-.35,.35),vr:rand(-.5,.5)});}

/* ================= gameplay events ================= */
function completeCard(c){
 c.state='flip';c.flipT=0;activeWords.delete(c.word);
 const frac=clamp(1-c.elapsed/c.life,0,1);
 G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);G.comboPulse=1;
 let pts=Math.round((c.len*10+Math.round(c.len*10*frac*.6))*(1+Math.min(G.combo,40)*.1));
 const py=Math.max(c.y,70);
 if(G.combo%10===0){pts+=250;popups.push({x:c.x,y:py-38,txt:'STREAK ×'+G.combo+'  +250',color:C.goldlt,t:0,dur:1.4,size:15});}
 G.score+=pts;G.completed++;
 popups.push({x:c.x,y:py,txt:'+'+pts,color:C.cream,t:0,dur:1.1,size:19});
 sComplete();
 if(G.completed%9===0){G.level++;G.banner={t:0,dur:2.1,txt:'ROUND '+G.level,sub:'the deck deals faster'};sLevel();}}
function expireCard(c){
 c.state='dead';activeWords.delete(c.word);c.vy=Math.max(c.vy,140);
 c.deadSpin=rand(2,5)*(Math.random()<.5?-1:1);
 G.lives--;G.redFlash=.6;G.shake=10;sExpire();
 popups.push({x:c.x,y:clamp(c.y,80,H-90),txt:'−♥',color:'#ff6b5e',t:0,dur:1.2,size:24});
 if(G.lives<=0&&!G.dying){G.dying=true;G.overT=0;}}
function burst(c){const cols=[C.gold,C.cream,C.red,'#1e6b4f'];
 for(let i=0;i<16;i++)particles.push({kind:0,x:c.x,y:c.y,vx:rand(-190,190),vy:rand(-260,-30),g:520,rot:rand(0,TAU),vr:rand(-9,9),w:rand(4,8),h:rand(7,12),color:cols[i%4],t:0,dur:rand(.7,1.1)});
 for(let i=0;i<6;i++){const s=SUITS[Math.random()*4|0];
  particles.push({kind:1,ch:s,x:c.x,y:c.y,vx:rand(-90,90),vy:rand(-150,-20),rot:rand(0,TAU),vr:rand(-3,3),size:rand(15,26),color:RED.has(s)?C.red:C.gold,t:0,dur:rand(.8,1.2)});}}
function handleKey(ch){
 if(G.dying)return;
 G.totalKeys++;let best=null,bestU=-1;
 for(const c of cards){if(c.menu)continue;if(c.state!=='fall'&&c.state!=='deal')continue;
  if(c.word[c.progress]===ch){const u=c.state==='fall'?c.elapsed/c.life:0;if(u>bestU){bestU=u;best=c;}}}
 ticker.push({ch,ok:!!best,t:0});if(ticker.length>16)ticker.shift();
 if(best){G.goodKeys++;best.progress++;best.flash=1;sTick(G.combo);
  for(let i=0;i<3;i++)particles.push({kind:2,x:best.x+rand(-14,14),y:best.y+rand(-8,8),vx:rand(-40,40),vy:rand(-70,-10),t:0,dur:.4,color:C.goldlt});
  if(best.progress>=best.len)completeCard(best);}
 else{G.combo=0;sMiss();G.shake=Math.max(G.shake,3);G.redFlash=Math.max(G.redFlash,.18);}}

/* ================= flow ================= */
function startGame(){
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 hideOverlay();
 cards=[];particles=[];popups=[];ticker=[];activeWords.clear();
 Object.assign(G,{state:'playing',score:0,combo:0,bestCombo:0,lives:3,level:1,completed:0,totalKeys:0,goodKeys:0,
  shake:0,redFlash:0,comboPulse:0,dying:false,overT:0,time:0});
 G.banner={t:0,dur:2.2,txt:'TYPE BEFORE THEY FALL',sub:'letters fly to their card automatically'};
 spawnT=.9;spawnCard();sTick(0);}
function finalizeOver(){G.state='over';const nb=G.score>hs;if(nb){hs=G.score;saveHS(hs);}sOver();showOver(nb);}
function pauseGame(){if(G.state!=='playing')return;G.state='paused';showPause();}
function resumeGame(){if(G.state!=='paused')return;hideOverlay();G.state='playing';}

/* ================= overlays ================= */
const ov=document.getElementById('overlay');
function showStart(){
 const hsTxt=hs>0?'HIGH SCORE · '+hs.toLocaleString('en-US'):'NO SCORES YET — THE TABLE IS YOURS';
 ov.innerHTML='<div class="fan"><div class="back b1"></div><div class="back b2"></div>'+
 '<div class="ace"><div class="corner tl"><b>A</b><i>♥</i></div><div class="corner br"><b>A</b><i>♥</i></div>'+
 '<h1>CARD<span>FALL</span></h1>'+
 '<p class="tag">A card-typing arcade. Words are dealt face-up and drift off the table — type each one before it falls.</p>'+
 '<ul class="ctrl">'+
 '<li><kbd>A</kbd><span>–</span><kbd>Z</kbd><span>&nbsp;type the words · letters fly to their card</span></li>'+
 '<li><kbd>SPACE</kbd><span>pause</span>&nbsp;&nbsp;<kbd>0</kbd><span>sound</span>&nbsp;&nbsp;<kbd>ENTER</kbd><span>deal</span></li></ul>'+
 '<button class="deal" id="btnGo">♠ Deal in ♥</button>'+
 '<p class="hs">'+hsTxt+'</p><p class="foot">♠ ♥ ♦ ♣ · DEAL FAST, TYPE FASTER</p></div></div>';
 ov.classList.add('show');
 document.getElementById('btnGo').addEventListener('click',e=>{e.currentTarget.blur();startGame();});}
function showOver(nb){
 const acc=G.totalKeys?Math.round(G.goodKeys/G.totalKeys*100):100;
 ov.innerHTML='<div class="fan"><div class="back b1"></div><div class="back b2"></div>'+
 '<div class="ace bust"><div class="corner tl"><b>A</b><i>♠</i></div><div class="corner br"><b>A</b><i>♠</i></div>'+
 (nb?'<span class="ribbon">★ NEW HIGH SCORE ★</span>':'')+
 '<h1>HOUSE <span>WINS</span></h1>'+
 '<div class="stats">'+
 '<div class="stat"><b>'+G.score.toLocaleString('en-US')+'</b><span>Score</span></div>'+
 '<div class="stat"><b>'+G.completed+'</b><span>Words</span></div>'+
 '<div class="stat"><b>×'+G.bestCombo+'</b><span>Best combo</span></div>'+
 '<div class="stat"><b>'+acc+'%</b><span>Accuracy</span></div></div>'+
 '<p class="hs">HIGH SCORE · '+hs.toLocaleString('en-US')+'</p>'+
 '<button class="deal" id="btnGo">♠ Redeal ♥</button></div></div>';
 ov.classList.add('show');
 document.getElementById('btnGo').addEventListener('click',e=>{e.currentTarget.blur();startGame();});}
function showPause(){ov.innerHTML='<div class="fan"><div class="ace mini">'+
 '<h2>PAUSED</h2><p>SPACE to resume · 0 for sound<br>the cards wait for no one… except you.</p></div></div>';ov.classList.add('show');}
function hideOverlay(){ov.classList.remove('show');}

/* ================= input ================= */
window.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 initAudio();
 const k=e.key,kl=k.toLowerCase();
 if(k==='Enter'||k===' '){
  if(G.state==='start'||G.state==='over'){e.preventDefault();startGame();return;}
  if(G.state==='playing'&&k===' '){e.preventDefault();pauseGame();return;}
  if(G.state==='paused'&&k===' '){e.preventDefault();resumeGame();return;}}
 if(k==='Escape'){if(G.state==='playing')pauseGame();else if(G.state==='paused')resumeGame();return;}
 if(kl==='0'){toggleMute();return;}
 if(e.repeat)return;
 if(G.state==='playing'&&!G.dying&&k.length===1&&/[a-z]/i.test(k)){e.preventDefault();handleKey(kl);}});
cv.addEventListener('pointerdown',()=>{initAudio();
 if(G.state==='start'||G.state==='over')startGame();else if(G.state==='paused')resumeGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='playing')pauseGame();});
window.addEventListener('blur',()=>{if(G.state==='playing')pauseGame();});

/* ================= update ================= */
function update(dt){
 G.at+=dt;
 for(const m of motes){m.y-=m.s*dt;m.x+=Math.sin(G.at*.5+m.p)*6*dt;if(m.y<-10){m.y=H+10;m.x=rand(0,W);}}
 for(const g of glyphs){g.y-=g.s*dt;g.rot+=g.rs*dt;if(g.y<-140){g.y=H+140;g.x=rand(0,W);}}
 if(G.state!=='paused'){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;if(p.t>=p.dur){particles.splice(i,1);continue;}
   if(p.kind===0){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
   else if(p.kind===1){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
   else{p.x+=p.vx*dt;p.y+=p.vy*dt;}}
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.t+=dt;p.y-=26*dt;if(p.t>=p.dur)popups.splice(i,1);}
  for(let i=ticker.length-1;i>=0;i--){ticker[i].t+=dt;if(ticker[i].t>2.8)ticker.splice(i,1);}
  if(G.banner){G.banner.t+=dt;if(G.banner.t>G.banner.dur)G.banner=null;}}
 G.shake*=Math.exp(-7*dt);if(G.shake<.05)G.shake=0;
 G.redFlash=Math.max(0,G.redFlash-1.6*dt);
 G.comboPulse=Math.max(0,G.comboPulse-3*dt);

 if(G.state==='playing'){
  G.time+=dt;
  if(!G.dying){spawnT-=dt;
   if(spawnT<=0){const maxC=Math.min(2+Math.floor((G.level-1)*.8),7,Math.max(3,W/190|0));
    const act=cards.filter(c=>!c.menu&&c.state!=='dead'&&c.state!=='flip').length;
    if(act<maxC)spawnCard();
    spawnT=Math.max(.85,2.4-(G.level-1)*.24)*rand(.75,1.25);}}
  for(let i=cards.length-1;i>=0;i--){const c=cards[i];
   if(c.menu){c.y+=c.vy*dt;c.rot+=c.vr*dt;if(c.y>H+120)cards.splice(i,1);continue;}
   if(c.state==='deal'){c.dealT+=dt/.38;if(c.dealT>=1){c.dealT=1;c.state='fall';}}
   else if(c.state==='fall'){c.elapsed+=dt;c.y+=c.vy*dt;if(c.elapsed>=c.life)expireCard(c);}
   else if(c.state==='flip'){c.flipT+=dt/.3;if(c.flipT>=1){burst(c);cards.splice(i,1);}}
   else if(c.state==='dead'){c.vy+=1500*dt;c.y+=c.vy*dt;c.rot+=c.deadSpin*dt;if(c.y>H+c.h*2)cards.splice(i,1);}
   c.flash=Math.max(0,c.flash-3.5*dt);}
  if(G.dying){G.overT+=dt;if(G.overT>1)finalizeOver();}}
 else if(G.state==='start'||G.state==='over'){
  menuT-=dt;const mc=cards.filter(c=>c.menu).length;
  if(menuT<=0&&mc<4){spawnMenu();menuT=rand(1.1,1.9);}
  for(let i=cards.length-1;i>=0;i--){const c=cards[i];if(!c.menu)continue;c.y+=c.vy*dt;c.rot+=c.vr*dt;if(c.y>H+120)cards.splice(i,1);}}
}

/* ================= render ================= */
function drawFelt(){
 ctx.fillStyle=feltGrad;ctx.fillRect(0,0,W,H);
 if(noisePat){ctx.fillStyle=noisePat;ctx.fillRect(0,0,W,H);}
 const gx=W/2+Math.sin(G.at*.13)*W*.12,gy=H*.34+Math.cos(G.at*.09)*H*.05;
 const g=ctx.createRadialGradient(gx,gy,10,gx,gy,Math.min(W,H)*.65);
 g.addColorStop(0,'rgba(255,238,190,.06)');g.addColorStop(1,'rgba(255,238,190,0)');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function drawFrame(){
 ctx.lineWidth=2;ctx.strokeStyle='rgba(217,164,65,.7)';rrect(12,12,W-24,H-24,10);ctx.stroke();
 ctx.lineWidth=1;ctx.strokeStyle='rgba(217,164,65,.3)';rrect(20,20,W-40,H-40,8);ctx.stroke();
 ctx.font='700 18px '+F_SERIF;ctx.fillStyle='rgba(217,164,65,.5)';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText('♠',36,40);ctx.fillText('♥',W-36,40);ctx.fillText('♣',W-36,H-40);ctx.fillText('♦',36,H-40);}
function drawAmbient(){
 for(const g of glyphs){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(g.rot);ctx.globalAlpha=.045;
  ctx.fillStyle=C.cream;ctx.font='700 '+g.size+'px '+F_SERIF;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(g.ch,0,0);ctx.restore();}
 for(const m of motes){ctx.globalAlpha=m.a;ctx.fillStyle=C.cream;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;}
function drawDeck(){const bx=46,by=H-62;
 for(let i=2;i>=0;i--){ctx.save();ctx.translate(bx+i*3,by+i*4);ctx.rotate(-.12+i*.1);
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=10;ctx.shadowOffsetY=5;
  ctx.drawImage(backCanvas(64,90),-32,-45,64,90);ctx.restore();}}
function drawCard(c){
 const t=G.at;let x,y,rot=0,sx=1,face=true;
 if(c.menu){x=c.x;y=c.y;rot=c.rot;face=false;}
 else if(c.state==='deal'){const e=easeOutCubic(clamp(c.dealT,0,1));x=c.x;y=-c.h/2+16*e;rot=lerp(-.8,c.baseRot,e);
  sx=Math.abs(Math.cos(c.dealT*Math.PI))||.02;face=c.dealT>=.5;}
 else if(c.state==='fall'){x=c.x+Math.sin(t*c.ws+c.wp)*4;y=c.y;rot=c.baseRot+Math.sin(t*c.ws*.8+c.wp)*.04;
  const frac=c.elapsed/c.life;if(frac>.72)x+=Math.sin(t*46+c.wp)*1.5;}
 else if(c.state==='flip'){x=c.x;y=c.y-Math.sin(clamp(c.flipT,0,1)*Math.PI)*18;rot=c.baseRot;
  sx=Math.abs(Math.cos(c.flipT*Math.PI))||.02;face=c.flipT<.5;}
 else if(c.state==='dead'){x=c.x;y=c.y;rot=c.rot;}
 ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,1);
 if(!face){ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=12;ctx.shadowOffsetY=7;
  ctx.drawImage(backCanvas(c.w,c.h),-c.w/2,-c.h/2,c.w,c.h);ctx.shadowColor='transparent';}
 else{
  ctx.shadowColor='rgba(0,0,0,.42)';ctx.shadowBlur=14;ctx.shadowOffsetY=8;
  rrect(-c.w/2,-c.h/2,c.w,c.h,9);ctx.fillStyle=C.cream;ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle='rgba(36,31,26,.14)';ctx.lineWidth=1;rrect(-c.w/2+4,-c.h/2+4,c.w-8,c.h-8,6);ctx.stroke();
  const sc=RED.has(c.suit)?C.red:C.ink;
  ctx.fillStyle=sc;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='700 '+Math.max(11,c.h*.16)+'px '+F_SERIF;ctx.fillText(c.word[0].toUpperCase(),-c.w/2+8,-c.h/2+7);
  ctx.font=Math.max(10,c.h*.14)+'px '+F_SERIF;ctx.fillText(c.suit,-c.w/2+9,-c.h/2+7+c.h*.16+1);
  ctx.save();ctx.translate(c.w/2,-c.h/2);ctx.rotate(Math.PI);ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='700 '+Math.max(11,c.h*.16)+'px '+F_SERIF;ctx.fillText(c.word[0].toUpperCase(),8,7);
  ctx.font=Math.max(10,c.h*.14)+'px '+F_SERIF;ctx.fillText(c.suit,9,7+c.h*.16+1);ctx.restore();
  const fs=Math.floor(Math.min((c.w-30)/(c.len*.62),c.h*.34,30)),cw=fs*.6,total=c.len*cw,x0=-total/2+cw/2;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<c.len;i++){const lx=x0+i*cw,ly=c.h*.02;
   if(i<c.progress)ctx.fillStyle=C.ink;else if(i===c.progress)ctx.fillStyle=C.red;else ctx.fillStyle=C.dim;
   ctx.font='700 '+fs+'px '+F_MONO;ctx.fillText(c.word[i],lx,ly);
   if(i===c.progress)ctx.fillRect(lx-cw*.34,ly+fs*.52,cw*.68,2);}
  const frac=c.elapsed/c.life;
  if(frac>.72&&c.state==='fall'){const a=(.45+.55*Math.sin(t*15))*clamp((frac-.72)/.28,0,1);
   ctx.strokeStyle='rgba(224,82,82,'+a.toFixed(3)+')';ctx.lineWidth=2.5;rrect(-c.w/2-3,-c.h/2-3,c.w+6,c.h+6,11);ctx.stroke();}
  if(c.flash>0){ctx.strokeStyle='rgba(240,201,107,'+c.flash.toFixed(3)+')';ctx.lineWidth=3;
   rrect(-c.w/2-6,-c.h/2-6,c.w+12,c.h+12,13);ctx.stroke();}
  if(c.state==='dead'){rrect(-c.w/2,-c.h/2,c.w,c.h,9);ctx.fillStyle='rgba(224,82,82,.35)';ctx.fill();}}
 ctx.restore();}
function drawParticles(){
 for(const p of particles){const a=clamp(1-p.t/p.dur,0,1);ctx.save();ctx.globalAlpha=a;
  if(p.kind===0){ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
  else if(p.kind===1){ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;
   ctx.font='700 '+p.size+'px '+F_SERIF;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.ch,0,0);}
  else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2.2*a+.5,0,TAU);ctx.fill();}
  ctx.restore();}}
function drawPopups(){
 for(const p of popups){const a=clamp(1-p.t/p.dur,0,1),s=1+Math.max(0,.18-p.t)/.18*.3;
  ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.scale(s,s);
  ctx.font='700 '+p.size+'px '+F_MONO;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(p.txt,1.5,2);ctx.fillStyle=p.color;ctx.fillText(p.txt,0,0);ctx.restore();}}
function drawHUD(){
 setLS(3);ctx.textAlign='left';ctx.textBaseline='alphabetic';
 ctx.fillStyle='rgba(217,164,65,.9)';ctx.font='700 11px '+F_SERIF;ctx.fillText('SCORE',26,38);setLS(0);
 ctx.fillStyle=C.cream;ctx.font='700 30px '+F_MONO;ctx.fillText(G.score.toLocaleString('en-US'),24,68);
 const acc=G.totalKeys?Math.round(G.goodKeys/G.totalKeys*100):100;
 ctx.fillStyle='rgba(247,240,221,.7)';ctx.font='700 12px '+F_MONO;ctx.fillText('ACC '+acc+'%   WORDS '+G.completed,26,88);
 if(G.combo>=2){const s=1+G.comboPulse*.35;ctx.save();ctx.translate(26,114);ctx.scale(s,s);
  ctx.fillStyle=C.goldlt;ctx.font='700 15px '+F_MONO;ctx.textAlign='left';ctx.fillText('COMBO ×'+G.combo,0,0);ctx.restore();}
 for(let i=0;i<3;i++){const x=W-28-(2-i)*26,y=40;ctx.font='700 21px '+F_SERIF;ctx.textAlign='center';ctx.textBaseline='middle';
  if(i<G.lives){ctx.fillStyle=C.hot;ctx.fillText('♥',x,y);}
  else{ctx.strokeStyle='rgba(224,82,82,.4)';ctx.lineWidth=1.4;ctx.strokeText('♥',x,y);}}
 ctx.textAlign='right';ctx.textBaseline='alphabetic';
 setLS(3);ctx.fillStyle='rgba(217,164,65,.9)';ctx.font='700 11px '+F_SERIF;ctx.fillText('ROUND',W-28,74);setLS(0);
 ctx.fillStyle=C.cream;ctx.font='700 18px '+F_MONO;ctx.fillText(String(G.level),W-28,96);
 if(hs>0){ctx.fillStyle='rgba(247,240,221,.5)';ctx.font='700 11px '+F_MONO;ctx.fillText('BEST '+hs.toLocaleString('en-US'),W-28,114);}
 ctx.font='700 10px '+F_MONO;ctx.fillStyle='rgba(247,240,221,.35)';
 ctx.textAlign='left';ctx.fillText('SPACE PAUSE',26,H-14);
 ctx.textAlign='right';ctx.fillText(muted?'SOUND OFF · 0':'SOUND ON · 0',W-28,H-14);}
function drawTicker(){const n=ticker.length,cw=12,x0=W/2-n*cw/2+cw/2,y=H-32;
 ctx.textAlign='center';ctx.textBaseline='middle';
 ticker.forEach((tk,i)=>{const a=clamp(1-tk.t/2.8,0,1);let dy=0;if(!tk.ok&&tk.t<.25)dy=rand(-2,2);
  ctx.globalAlpha=a;ctx.fillStyle=tk.ok?C.cream:'#ff6b5e';ctx.font='700 19px '+F_MONO;ctx.fillText(tk.ch,x0+i*cw,y+dy);});
 ctx.globalAlpha=1;
 ctx.fillStyle=Math.floor(G.at*2.4)%2===0?'rgba(247,240,221,.85)':'rgba(247,240,221,.3)';
 ctx.fillRect(x0+n*cw-2,y-11,9,22);}
function drawBanner(){const b=G.banner,k=b.t/b.dur;let a=1;if(k<.15)a=k/.15;else if(k>.72)a=(1-k)/.28;
 const s=1+Math.max(0,.15-k)/.15*.25;
 ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(W/2,H*.3);ctx.scale(s,s);
 ctx.textAlign='center';ctx.textBaseline='middle';setLS(6);ctx.font='700 44px '+F_SERIF;
 ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(b.txt,2,3);
 ctx.fillStyle=C.goldlt;ctx.fillText(b.txt,0,0);setLS(0);
 ctx.font='700 13px '+F_MONO;ctx.fillStyle='rgba(247,240,221,.85)';ctx.fillText(b.sub.toUpperCase(),0,38);ctx.restore();}
function render(){
 ctx.clearRect(0,0,W,H);
 drawFelt();
 ctx.save();
 if(G.shake>0.2)ctx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
 drawFrame();drawAmbient();drawDeck();
 for(const c of cards)drawCard(c);
 drawParticles();drawPopups();
 if(G.state==='playing'||G.dying){drawHUD();drawTicker();}
 if(G.banner)drawBanner();
 ctx.restore();
 if(G.redFlash>0.01){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.72);
  g.addColorStop(0,'rgba(224,60,50,0)');g.addColorStop(1,'rgba(224,60,50,'+(G.redFlash*.5).toFixed(3)+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}}

/* ================= main loop & boot ================= */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;update(dt);render();}
window.addEventListener('resize',resize);
resize();
showStart();
requestAnimationFrame(frame);
</script>
