<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prism Barrage — Match-3 Bullet Hell</title>
<style>
  :root{
    --disp: Impact,'Arial Black','Franklin Gothic Medium',sans-serif;
    --mono: Consolas,'SF Mono','Cascadia Mono',ui-monospace,Menlo,monospace;
    --body: 'Segoe UI',system-ui,-apple-system,sans-serif;
    --cyan:#3fe0ff; --rose:#ff4d6d; --gold:#ffc53d; --green:#5dff9b; --violet:#b47bff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;background:#04060d;user-select:none;}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;}
  #scan{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(160,220,255,.025) 0 1px,transparent 1px 3px);}
  #ui{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;pointer-events:none;}
  #ui.hide{display:none;}
  .wrap{filter:drop-shadow(0 0 26px rgba(63,224,255,.16)) drop-shadow(0 14px 40px rgba(0,0,0,.6));}
  .panel{
    pointer-events:auto;position:relative;width:min(92vw,580px);text-align:center;color:#cfe3f7;
    background:linear-gradient(165deg,rgba(10,17,32,.95),rgba(14,22,42,.95));
    border:1px solid rgba(63,224,255,.35);padding:30px 34px 26px;
    clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);
    font-family:var(--body);
  }
  .panel::before{content:"";position:absolute;inset:5px;border:1px solid rgba(63,224,255,.12);pointer-events:none;
    clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);}
  .panel.danger{border-color:rgba(255,77,109,.5);}
  h1{margin:.1em 0 0;font-family:var(--disp);font-size:clamp(38px,8.5vw,68px);letter-spacing:.05em;color:#eaf6ff;line-height:.95;
    text-shadow:-2px 0 rgba(255,77,109,.85),2px 0 rgba(63,224,255,.85),0 0 26px rgba(63,224,255,.35);}
  h1.breach{color:#ffdfe4;text-shadow:-2px 0 rgba(63,224,255,.7),2px 0 rgba(255,77,109,.9),0 0 30px rgba(255,77,109,.5);}
  h2{margin:0;font-family:var(--disp);font-size:34px;letter-spacing:.2em;color:#eaf6ff;}
  .tag{font-family:var(--mono);font-size:12px;letter-spacing:.42em;color:#7fb7d9;margin:8px 0 0;text-transform:uppercase;}
  .blurb{font-size:13.5px;line-height:1.6;color:#a9c4de;margin:16px auto 0;max-width:46ch;}
  .blurb b.c{color:var(--cyan);} .blurb b.g{color:var(--gold);} .blurb b.r{color:var(--rose);}
  .gems-row{display:flex;justify-content:center;gap:12px;margin-bottom:10px;}
  .g{width:20px;height:20px;display:inline-block;animation:bob 2.4s ease-in-out infinite;}
  .g0{background:var(--cyan);border-radius:50%;filter:drop-shadow(0 0 7px var(--cyan));}
  .g1{background:var(--rose);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 7px var(--rose));animation-delay:.2s;}
  .g2{background:var(--gold);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);filter:drop-shadow(0 0 7px var(--gold));animation-delay:.4s;}
  .g3{background:var(--green);clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);filter:drop-shadow(0 0 7px var(--green));animation-delay:.6s;}
  .g4{background:var(--violet);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);filter:drop-shadow(0 0 7px var(--violet));animation-delay:.8s;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .controls{display:flex;flex-direction:column;gap:7px;margin:20px auto 4px;width:fit-content;text-align:left;
    font-size:12.5px;color:#9db8d6;line-height:1.5;}
  kbd{font-family:var(--mono);font-size:11px;color:#bfe3ff;background:#0d1830;border:1px solid #2c4a72;border-bottom-width:2px;
    padding:1px 6px;margin-right:2px;white-space:nowrap;}
  .btn{display:inline-block;margin-top:20px;font-family:var(--disp);font-size:20px;letter-spacing:.14em;color:#eaf6ff;
    background:#0d1a30;border:1px solid rgba(63,224,255,.6);padding:12px 34px;cursor:pointer;
    clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
    transition:background .12s,color .12s,transform .08s,box-shadow .12s;}
  .btn:hover,.btn:focus-visible{background:var(--cyan);color:#04121c;outline:none;box-shadow:0 0 22px rgba(63,224,255,.55);}
  .btn:active{transform:translateY(2px) scale(.98);}
  .bestline{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#7fb7d9;margin:16px 0 0;}
  .tiny{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:#4e6a8c;margin-top:10px;}
  .score-big{font-family:var(--disp);font-size:clamp(44px,10vw,72px);color:#fff;letter-spacing:.04em;margin-top:6px;
    text-shadow:0 0 24px rgba(63,224,255,.5);}
  .newbest{font-family:var(--disp);color:var(--gold);letter-spacing:.25em;font-size:18px;margin:10px 0 0;animation:pulse .9s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .hint{font-family:var(--mono);font-size:12px;letter-spacing:.25em;color:#7fb7d9;margin:14px 0 0;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="scan"></div>
<div id="ui"></div>

<script>
'use strict';
/* ============================== CORE ============================== */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const ui=document.getElementById('ui');
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mixc(c,t,f){return 'rgb('+[0,1,2].map(i=>Math.round(lerp(c[i],t,f))).join(',')+')';}
const PAL=['#3fe0ff','#ff4d6d','#ffc53d','#5dff9b','#b47bff'].map(h=>{
  const c=hexRGB(h);
  return {hex:h, fill:mixc(c,255,.12), light:mixc(c,255,.55), dark:mixc(c,0,.45), glow:'rgba('+c.join(',')+',.18)'};
});

/* ============================== LAYOUT / BG ============================== */
const COLS=7, ROWS=8;
let W=0,H=0,DPR=1,bgCanvas=null,CLOCK=0;
const L={cell:48,bx:0,by:0,bw:0,bh:0};
const STARS=[]; for(let i=0;i<70;i++)STARS.push({x:Math.random(),y:Math.random(),z:rand(.25,1)});

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let cell=Math.floor(Math.min((W-28)/COLS,(H*0.52)/ROWS,76));
  cell=Math.min(cell,Math.floor((H-170-16)/ROWS));
  L.cell=clamp(cell,24,76);
  L.bw=COLS*L.cell; L.bh=ROWS*L.cell;
  L.bx=Math.round((W-L.bw)/2); L.by=H-L.bh-14;
  buildBG();
}
function buildBG(){
  bgCanvas=document.createElement('canvas');
  bgCanvas.width=cv.width; bgCanvas.height=cv.height;
  const g=bgCanvas.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  let lg=g.createLinearGradient(0,0,0,H);
  lg.addColorStop(0,'#050a16'); lg.addColorStop(.55,'#071023'); lg.addColorStop(1,'#0c1631');
  g.fillStyle=lg; g.fillRect(0,0,W,H);
  const blob=(x,y,r,c)=>{const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);};
  blob(W*.18,H*.16,W*.5,'rgba(31,95,145,.20)');
  blob(W*.86,H*.34,W*.45,'rgba(118,58,160,.15)');
  blob(W*.5,H*.78,W*.5,'rgba(18,120,112,.13)');
  const n=Math.floor(W*H/9000);
  for(let i=0;i<n;i++){g.fillStyle='rgba(200,230,255,'+rand(.12,.6).toFixed(2)+')';const s=rand(.5,1.5);g.fillRect(rand(0,W),rand(0,H),s,s);}
  for(let x=0;x<W;x+=48){g.fillStyle='rgba(90,150,220,.03)';g.fillRect(x,0,1,H);}
  const vg=g.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.55,Math.max(W,H)*.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false,noiseBuf=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.45;master.connect(AC.destination);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC)return; delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.03);
}
function noise(dur,vol,fq,delay){
  if(!AC)return; delay=delay||0;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t0=AC.currentTime+delay,src=AC.createBufferSource();src.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t0);src.stop(t0+dur+.05);
}
const sfxT={};
function ok(key,ms){const n=performance.now();if(sfxT[key]&&n-sfxT[key]<ms)return false;sfxT[key]=n;return true;}
const sfx={
  select:()=>tone(600,740,.05,'square',.12),
  swap:()=>tone(340,520,.07,'triangle',.18),
  invalid:()=>tone(150,95,.14,'sawtooth',.16),
  match:c=>{const f=240*Math.pow(1.15,Math.min(c,8)),v=Math.min(.3,.14+c*.02);for(let i=0;i<3;i++)tone(f*(1+i*.26),f*(1+i*.26)*1.04,.07,'square',v,i*.03);noise(.06,.1,4500);},
  shoot:()=>{if(ok('sh',50))tone(880,340,.06,'square',.06);},
  laser:()=>{tone(1200,180,.16,'sawtooth',.13);noise(.12,.1,2600);},
  storm:()=>{noise(.5,.34,800);tone(70,28,.7,'sine',.5);},
  hit:()=>{if(ok('hi',40))tone(300,160,.04,'square',.08);},
  boom:()=>{noise(.3,.28,600);tone(130,45,.25,'triangle',.24);},
  shieldHit:()=>{if(ok('shl',90)){tone(200,80,.12,'sawtooth',.2);noise(.08,.1,1200);}},
  virus:()=>{tone(520,140,.35,'sine',.16);tone(260,70,.35,'triangle',.1,.06);},
  relic:()=>tone(520,1040,.18,'sine',.18),
  horn:()=>{tone(95,62,.5,'sawtooth',.26);tone(190,124,.5,'square',.1);},
  recalc:()=>tone(700,240,.3,'sine',.14),
  start:()=>{tone(392,392,.09,'square',.16);tone(523,523,.09,'square',.16,.09);tone(784,784,.2,'square',.16,.18);},
  over:()=>{tone(392,380,.2,'square',.2);tone(311,300,.2,'square',.2,.24);tone(196,120,.7,'sawtooth',.22,.5);noise(.6,.22,500,.5);}
};

/* ============================== STATE ============================== */
const S={mode:'menu',t:0,score:0,best:0,shield:100,kills:0,maxChain:0,shake:0,flash:0,shieldFlash:0,lastHit:-99,storm:null,threatLvl:0};
try{S.best=+(localStorage.getItem('prismBarrageBest')||0)||0;}catch(e){}

let grid=[],phase='idle',swapAnim=null,chain=0,clearT=0;
let enemies=[],ebullets=[],shots=[],parts=[],texts=[],relics=[],colFlash=[];
let spawnT=1.4,virusT=rand(12,17),sel=null;
const cur={r:3,c:3};

function makeCell(color){return{color,dy:0,s:1,clearing:false,ct:0};}
function initBoard(){
  grid=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){
    let col;do{col=irand(0,4);}while((c>=2&&grid[r][c-1].color===col&&grid[r][c-2].color===col)||(r>=2&&grid[r-1][c].color===col&&grid[r-2][c].color===col));
    grid[r][c]=makeCell(col);
  }}
  colFlash=new Array(COLS).fill(0);
}

/* ============================== MATCH LOGIC ============================== */
function findRuns(){
  const runs=[];
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){
    const cell=grid[r][c];
    if(cell&&cell.color>=0&&!cell.clearing){let e=c+1;
      while(e<COLS&&grid[r][e]&&grid[r][e].color===cell.color&&!grid[r][e].clearing)e++;
      if(e-c>=3){const cells=[];for(let i=c;i<e;i++)cells.push({r,c:i});runs.push({cells,color:cell.color,len:e-c,horiz:true});}
      c=e;}else c++;
  }}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){
    const cell=grid[r][c];
    if(cell&&cell.color>=0&&!cell.clearing){let e=r+1;
      while(e<ROWS&&grid[e][c]&&grid[e][c].color===cell.color&&!grid[e][c].clearing)e++;
      if(e-r>=3){const cells=[];for(let i=r;i<e;i++)cells.push({r:i,c});runs.push({cells,color:cell.color,len:e-r,horiz:false});}
      r=e;}else r++;
  }}
  return runs;
}
function hasMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const d of [[0,1],[1,0]]){
      const r2=r+d[0],c2=c+d[1];if(r2>=ROWS||c2>=COLS)continue;
      const t=grid[r][c];grid[r][c]=grid[r2][c2];grid[r2][c2]=t;
      const found=findRuns().length>0;
      grid[r][c]=grid[r2][c2];grid[r2][c2]=t;
      if(found)return true;
    }
  }
  return false;
}
function reshuffle(){
  for(let tries=0;tries<40;tries++){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cell=grid[r][c];if(cell.color<0)continue;
      let col;do{col=irand(0,4);}while((c>=2&&grid[r][c-1].color===col&&grid[r][c-2].color===col)||(r>=2&&grid[r-1][c].color===col&&grid[r-2][c].color===col));
      cell.color=col;cell.s=.35;
    }
    if(findRuns().length===0&&hasMove())break;
  }
  addText(W/2,H*.42,'RECALIBRATING','#3fe0ff',26);S.shake=Math.max(S.shake,7);sfx.recalc();
}
function checkMoves(){if(!hasMove())reshuffle();}

function attemptSwap(r1,c1,r2,c2){
  if(phase!=='idle')return;
  if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1)return;
  phase='swap';swapAnim={a:[r1,c1],b:[r2,c2],t:0,back:false};sfx.swap();
}

function startClear(runs){
  phase='clear';clearT=0;
  const set=new Set();
  for(const run of runs){
    for(const p of run.cells)set.add(p.r*COLS+p.c);
    if(run.len>=5){S.storm={t:0,dmg:14*(1+S.t/300),done:false};sfx.storm();addText(W/2,H*.34,'PRISM STORM','#bff4ff',30);}
    else if(run.len===4){for(const p of run.cells)fireLaser(p.c,run.color);}
    else{for(const p of run.cells)fireBolt(p.c,run.color);}
  }
  let gems=0;
  for(const k of set){const r=(k/COLS)|0,c=k%COLS;const cell=grid[r][c];if(cell){cell.clearing=true;cell.ct=0;gems++;}}
  S.score+=gems*10*chain;
  healShield(gems);
  if(chain>=2)addText(W/2,L.by-56,'CHAIN ×'+chain,chain>3?'#ffc53d':'#3fe0ff',18+Math.min(14,chain*3));
  S.maxChain=Math.max(S.maxChain,chain);
  sfx.match(chain);
}
function applyGravity(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const cell=grid[r][c];
      if(cell){if(write!==r){grid[write][c]=cell;grid[r][c]=null;cell.dy=(r-write)*L.cell;}write--;}
    }
    for(let r=write;r>=0;r--)grid[r][c]={color:irand(0,4),dy:(r-(write+1))*L.cell-6,s:1,clearing:false,ct:0};
  }
}

/* ============================== FX / COMBAT ============================== */
function burst(x,y,color,n,pow){
  if(parts.length>450)return;
  for(let i=0;i<n;i++){const a=rand(0,TAU),sp=rand(30,90)*pow;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-25,t:0,life:rand(.3,.75),color,size:rand(1.5,3.6)});}
}
function addText(x,y,str,color,size){texts.push({x,y,str,color,size,t:0,life:1.1});}
function fireBolt(col,color){shots.push({x:L.bx+col*L.cell+L.cell/2,y:L.by-4,vx:0,vy:-rand(560,650),dmg:3*(1+S.t/300),color,type:'bolt',w:4,pierce:0});colFlash[col]=1;sfx.shoot();}
function fireLaser(col,color){shots.push({x:L.bx+col*L.cell+L.cell/2,y:L.by-4,vx:0,vy:-740,dmg:7*(1+S.t/300),color,type:'laser',w:7,pierce:3});colFlash[col]=1;sfx.laser();}
function killEnemy(j){
  const e=enemies[j];enemies.splice(j,1);
  S.score+=e.score;S.kills++;
  burst(e.x,e.y,PAL[e.color].hex,16,3.2);
  addText(e.x,e.y,'+'+e.score,'#9fd8ff',13);
  sfx.boom();
  if(e.type==='brute')relics.push({x:e.x,y:e.y,t:0});
}
function healShield(n){S.shield=clamp(S.shield+n,0,100);}
function damageShield(n,big){
  S.shield-=n;S.lastHit=S.t;
  if(big!==false){S.shieldFlash=1;S.shake=Math.max(S.shake,4);sfx.shieldHit();}
  if(S.shield<=0){S.shield=0;gameOver();}
}

/* ============================== ENEMIES ============================== */
function hpMul(){return 1+S.t/75;}
function spawnEnemy(){
  const t=S.t,r=Math.random();
  const pB=clamp(t/240,0,.3),pW=clamp(.18+t/300,0,.35);
  let type='drone';if(r<pB)type='brute';else if(r<pB+pW)type='weaver';
  const color=irand(0,4),x=rand(L.bx-30,L.bx+L.bw+30),sm=1+t/120;
  let e;
  if(type==='drone')e={type,x,y:-30,r:16,hp:8*hpMul(),vy:rand(26,34)*sm,color,t:rand(0,9),fireT:rand(1.4,2.6),score:50};
  else if(type==='weaver')e={type,x,y:-30,ax:x,r:13,hp:6*hpMul(),vy:rand(40,52)*sm,color,t:rand(0,9),amp:rand(30,70),wf:rand(2,3.4),score:80};
  else e={type,x,y:-44,r:24,hp:26*hpMul(),vy:rand(14,18)*sm,color,t:0,fireT:rand(1.6,3),score:250};
  e.maxHp=e.hp;enemies.push(e);
}
function aimAt(e,spd){
  const tx=L.bx+rand(.15,.85)*L.bw,ty=L.by+rand(0,.35)*L.bh;
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
  if(ebullets.length<120)ebullets.push({x:e.x,y:e.y+e.r*.6,vx:dx/d*spd,vy:dy/d*spd,r:3.5,dmg:2});
}
function aimSpread(e,spd){
  const tx=L.bx+rand(.15,.85)*L.bw,ty=L.by+rand(0,.3)*L.bh;
  const ang=Math.atan2(ty-e.y,tx-e.x);
  for(const k of[-1,0,1]){const a=ang+k*.26;
    if(ebullets.length<120)ebullets.push({x:e.x,y:e.y+e.r*.5,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:3.5,dmg:2});}
}

/* ============================== FLOW ============================== */
function fmtTime(t){const m=Math.floor(t/60),s=Math.floor(t%60);return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function startGame(){
  audio();
  S.mode='playing';S.t=0;S.score=0;S.shield=100;S.kills=0;S.maxChain=0;S.shake=0;S.flash=0;S.lastHit=-99;S.storm=null;S.threatLvl=0;
  enemies=[];ebullets=[];shots=[];parts=[];texts=[];relics=[];
  spawnT=1.6;virusT=rand(12,17);chain=0;phase='idle';swapAnim=null;sel=null;cur.r=3;cur.c=3;
  initBoard();checkMoves();
  ui.classList.add('hide');
  addText(W/2,H*.38,'SWARM INBOUND','#ff4d6d',24);
  sfx.start();
}
function togglePause(){
  if(S.mode==='playing'){S.mode='paused';showScreen('pause');}
  else if(S.mode==='paused'){S.mode='playing';ui.classList.add('hide');}
}
function gameOver(){
  S.mode='over';
  burst(W/2,L.by-20,'#ff4d6d',50,5);burst(W/2,L.by-20,'#3fe0ff',40,4);
  enemies=[];ebullets=[];relics=[];S.shake=18;
  const nb=S.score>S.best;
  if(nb){S.best=Math.floor(S.score);try{localStorage.setItem('prismBarrageBest',String(S.best));}catch(e){}}
  showScreen('over',nb);
  sfx.over();
}

/* ============================== SCREENS ============================== */

  let html='';
  if(mode==='menu'){
    html='<div class="wrap"><div class="panel">'+
      '<div class="gems-row"><span class="g g0"></span><span class="g g1"></span><span class="g g2"></span><span class="g g3"></span><span class="g g4"></span></div>'+
      '<h1>PRISM BARRAGE</h1><p class="tag">match-3 × bullet hell</p>'+
      '<p class="blurb">The board is your fortress. Swap gems to fire prisms at the descending swarm — match an enemy\'s <b class="c">core color for CRIT ×2</b>, line up <b class="g">five for a PRISM STORM</b>, and clear matches beside <b class="r">corruption</b> before it eats your shield.</p>'+
      '<div class="controls">'+
        '<div><kbd>CLICK / DRAG</kbd> swap adjacent gems</div>'+
        '<div><kbd>←↑↓→</kbd> move cursor · <kbd>SPACE</kbd> select, then arrows to swap</div>'+
        '<div><kbd>P</kbd> pause · <kbd>M</kbd> mute · <kbd>R</kbd> restart at game over</div>'+
      '</div>'+
      '<button class="btn" type="button" id="startBtn">▶ LAUNCH DEFENSE</button>'+
      '<p class="bestline">BEST &nbsp;'+S.best.toLocaleString()+'</p>'+
      '<p class="tiny">CLICK ANYWHERE OR PRESS ENTER · SOUND STARTS ON FIRST INPUT</p>'+
    '</div></div>';
  }else if(mode==='over'){
    html='<div class="wrap"><div class="panel danger">'+
      '<h1 class="breach">CORE BREACHED</h1>'+
      '<div class="score-big">'+Math.floor(S.score).toLocaleString()+'</div>'+
      '<p class="tag">survived '+fmtTime(S.t)+' · '+S.kills+' kills · max chain ×'+S.maxChain+'</p>'+
      (nb?'<p class="newbest">★ NEW BEST ★</p>':'<p class="bestline">BEST &nbsp;'+S.best.toLocaleString()+'</p>')+
      '<button class="btn" type="button" id="againBtn">↻ RE-DEPLOY</button>'+
      '<p class="tiny">PRESS R OR ENTER</p>'+
    '</div></div>';
  }else{
    html='<div class="wrap"><div class="panel">'+
      '<h2>PAUSED</h2><p class="hint">PRESS P TO RESUME · M MUTES</p>'+
      '<button class="btn" type="button" id="resumeBtn">RESUME</button>'+
    '</div></div>';
  }
  ui.innerHTML=html;ui.classList.remove('hide');
  const b=document.getElementById(mode==='menu'?'startBtn':mode==='over'?'againBtn':'resumeBtn');
  if(b)b.addEventListener('click',()=>{audio();if(mode==='paused')togglePause();else startGame();});
}

/* ============================== INPUT ============================== */
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  audio();
  if(k==='m'||k==='M'){muted=!muted;if(master)master.gain.value=muted?0:.45;return;}
  if(S.mode==='menu'){if(k==='Enter'||k===' ')startGame();return;}
  if(S.mode==='over'){if(k==='r'||k==='R'||k==='Enter')startGame();return;}
  if(S.mode==='paused'){if(k==='p'||k==='P'||k==='Escape'||k===' ')togglePause();return;}
  if(k==='p'||k==='P'||k==='Escape'){togglePause();return;}
  if(phase!=='idle')return;
  const mv=(dr,dc)=>{
    if(sel){const nr=sel.r+dr,nc=sel.c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){attemptSwap(sel.r,sel.c,nr,nc);sel=null;}
    }else{cur.r=clamp(cur.r+dr,0,ROWS-1);cur.c=clamp(cur.c+dc,0,COLS-1);}
  };
  if(k==='ArrowLeft')mv(0,-1);
  else if(k==='ArrowRight')mv(0,1);
  else if(k==='ArrowUp')mv(-1,0);
  else if(k==='ArrowDown')mv(1,0);
  else if(k===' '||k==='Enter'){
    if(!sel){sel={r:cur.r,c:cur.c};sfx.select();}
    else if(sel.r===cur.r&&sel.c===cur.c){sel=null;sfx.select();}
    else if(Math.abs(sel.r-cur.r)+Math.abs(sel.c-cur.c)===1){attemptSwap(sel.r,sel.c,cur.r,cur.c);sel=null;}
    else{sel={r:cur.r,c:cur.c};sfx.select();}
  }
});
function tapCell(r,c){
  if(!sel){sel={r,c};sfx.select();return;}
  if(sel.r===r&&sel.c===c){sel=null;sfx.select();return;}
  if(Math.abs(sel.r-r)+Math.abs(sel.c-c)===1){attemptSwap(sel.r,sel.c,r,c);sel=null;return;}
  sel={r,c};sfx.select();
}
let drag=null;
cv.addEventListener('pointerdown',e=>{
  audio();
  if(S.mode==='menu'){startGame();return;}
  if(S.mode!=='playing')return;
  const x=e.clientX,y=e.clientY;
  const c=Math.floor((x-L.bx)/L.cell),r=Math.floor((y-L.by)/L.cell);
  if(r<0||r>=ROWS||c<0||c>=COLS)return;
  drag={x,y,r,c,moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(!drag||S.mode!=='playing')return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)>L.cell*.35){
    drag.moved=true;
    let dr=0,dc=0;
    if(Math.abs(dx)>Math.abs(dy))dc=dx>0?1:-1;else dr=dy>0?1:-1;
    const nr=drag.r+dr,nc=drag.c+dc;
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){attemptSwap(drag.r,drag.c,nr,nc);cur.r=drag.r;cur.c=drag.c;sel=null;}
    drag=null;
  }
});
window.addEventListener('pointerup',()=>{if(drag&&!drag.moved)tapCell(drag.r,drag.c);drag=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='playing')togglePause();});
window.addEventListener('resize',resize);

/* ============================== UPDATE ============================== */
function update(dt){
  CLOCK+=dt;
  S.shake*=Math.exp(-6*dt);if(S.shake<.1)S.shake=0;
  S.flash=Math.max(0,S.flash-dt*2.2);
  S.shieldFlash=Math.max(0,S.shieldFlash-dt*3);
  for(let c=0;c<COLS;c++)colFlash[c]=Math.max(0,colFlash[c]-dt*3);
  for(const st of STARS){st.y+=st.z*.02*dt*8;if(st.y>1.02){st.y=-.02;st.x=Math.random();}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;if(p.t>p.life)parts.splice(i,1);}
  for(let i=texts.length-1;i>=0;i--){texts[i].t+=dt;texts[i].y-=24*dt;if(texts[i].t>texts[i].life)texts.splice(i,1);}
  // shots always tick (harmless without enemies)
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];s.y+=s.vy*dt;
    if(s.y<-40){shots.splice(i,1);continue;}
    let dead=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j],dx=e.x-s.x,dy=e.y-s.y,rr=e.r+s.w;
      if(dx*dx+dy*dy<=rr*rr){
        const crit=e.color===s.color,dmg=s.dmg*(crit?2:1);
        e.hp-=dmg;e.flash=.12;sfx.hit();
        burst(s.x,s.y,PAL[s.color].hex,4,crit?3:1.8);
        if(crit)addText(e.x,e.y-e.r-8,'CRIT ×2','#ffc53d',13);
        if(e.hp<=0)killEnemy(j);
        if(s.pierce>0)s.pierce--;else{dead=true;break;}
      }
    }
    if(dead)shots.splice(i,1);
  }
  if(S.storm){
    S.storm.t+=dt;
    if(!S.storm.done&&S.storm.t>.22){
      S.storm.done=true;S.flash=1;S.shake=Math.max(S.shake,16);sfx.boom();
      for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];e.hp-=S.storm.dmg;e.flash=.2;if(e.hp<=0)killEnemy(j);}
    }
    if(S.storm.t>.9)S.storm=null;
  }

  if(S.mode!=='playing')return;
  S.t+=dt;

  // threat levels
  const lvl=Math.floor(S.t/30);
  if(lvl>S.threatLvl){S.threatLvl=lvl;addText(W/2,H*.3,'THREAT '+lvl,'#ff4d6d',26);sfx.horn();}

  // spawn
  spawnT-=dt;
  if(spawnT<=0&&enemies.length<14){spawnT=lerp(2.3,.75,clamp(S.t/180,0,1))*rand(.8,1.2);spawnEnemy();}

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.t+=dt;e.flash=Math.max(0,e.flash-dt);
    if(e.type==='weaver')e.x=clamp((e.ax||e.x)+Math.sin(e.t*e.wf)*e.amp,20,W-20);
    e.y+=e.vy*dt;
    if(e.type!=='weaver'&&e.y>10&&e.y<L.by-60){
      e.fireT-=dt;
      if(e.fireT<=0){
        const spd=rand(130,175)+S.t*.6;
        if(e.type==='drone'){aimAt(e,spd);e.fireT=rand(2.8,4.2);}
        else{aimSpread(e,spd);e.fireT=rand(3.5,5);}
      }
    }
    if(e.y+e.r>=L.by){
      burst(e.x,L.by-6,PAL[e.color].hex,20,3.5);
      damageShield(e.type==='brute'?26:e.type==='weaver'?14:18);
      S.shake=Math.max(S.shake,e.type==='brute'?14:9);sfx.boom();
      if(e.type==='brute')relics.push({x:e.x,y:L.by-10,t:0});
      enemies.splice(i,1);
    }
  }

  // enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>L.by-2&&b.x>L.bx-4&&b.x<L.bx+L.bw+4){
      burst(b.x,L.by-4,'#ff8a5c',6,1.6);
      damageShield(b.dmg);ebullets.splice(i,1);continue;
    }
    if(b.y>H+30||b.x<-30||b.x>W+30)ebullets.splice(i,1);
  }

  // relics
  for(let i=relics.length-1;i>=0;i--){
    const r=relics[i];r.t+=dt;r.y+=52*dt;
    if(r.y>=L.by-6){healShield(12);addText(r.x,L.by-14,'+SHIELD','#41e6c8',14);sfx.relic();relics.splice(i,1);}
  }

  // board phases
  if(phase==='swap'){
    swapAnim.t+=dt/.13;
    if(swapAnim.t>=1){
      const[r1,c1]=swapAnim.a,[r2,c2]=swapAnim.b;
      const t=grid[r1][c1];grid[r1][c1]=grid[r2][c2];grid[r2][c2]=t;
      if(swapAnim.back){phase='idle';swapAnim=null;checkMoves();}
      else{
        const runs=findRuns();
        if(runs.length){chain=1;startClear(runs);}
        else{swapAnim={a:[r1,c1],b:[r2,c2],t:0,back:true};sfx.invalid();}
      }
    }
  }else if(phase==='clear'){
    clearT+=dt;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cl=grid[r][c];if(cl&&cl.clearing)cl.ct+=dt;}
    if(clearT>=.18){
      const toKill=new Set();
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cl=grid[r][c];if(cl&&cl.clearing)toKill.add(r*COLS+c);}
      for(const k of[...toKill]){
        const r=(k/COLS)|0,c=k%COLS;
        for(const d of[[1,0],[-1,0],[0,1],[0,-1]]){
          const nr=r+d[0],nc=c+d[1];
          if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){const n=grid[nr][nc];
            if(n&&n.color<0&&!toKill.has(nr*COLS+nc))toKill.add(nr*COLS+nc);}
        }
      }
      for(const k of toKill){
        const r=(k/COLS)|0,c=k%COLS,cell=grid[r][c];if(!cell)continue;
        const x=L.bx+c*L.cell+L.cell/2,y=L.by+r*L.cell+L.cell/2;
        if(cell.color<0){burst(x,y,'#8f9ab5',12,2.4);S.score+=25;addText(x,y,'+25','#ff4d6d',12);}
        else burst(x,y,PAL[cell.color].hex,7,2);
        grid[r][c]=null;
      }
      applyGravity();phase='fall';
    }
  }else if(phase==='fall'){
    let done=true;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cl=grid[r][c];if(!cl)continue;
      if(cl.dy<0){cl.dy*=Math.exp(-dt*14);if(cl.dy>-.6)cl.dy=0;else done=false;}
    }
    if(done){phase='idle';const runs=findRuns();
      if(runs.length){chain++;startClear(runs);}
      else{chain=0;checkMoves();}}
  }

  // cell pop-in (reshuffle / virus)
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const cl=grid[r][c];if(cl&&cl.s<1)cl.s=Math.min(1,cl.s+dt*6);}

  // corruption
  let viruses=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].color<0)viruses++;
  if(viruses>0)damageShield(dt*Math.min(3,viruses)*.8,false);
  virusT-=dt;
  if(virusT<=0&&viruses<4&&phase==='idle'){
    const open=[];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].color>=0)open.push([r,c]);
    if(open.length){
      const[r,c]=open[irand(0,open.length-1)];
      grid[r][c].color=-1;grid[r][c].s=.3;
      addText(L.bx+c*L.cell+L.cell/2,L.by+r*L.cell,'CORRUPTED','#ff4d6d',12);
      sfx.virus();S.shake=Math.max(S.shake,5);
    }
    virusT=rand(10,15)-Math.min(4,S.t/90);
  }

  // regen
  if(S.t-S.lastHit>4)healShield(dt*3);
}

/* ============================== DRAW HELPERS ============================== */
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function poly(x,y,s,n,rot){for(let i=0;i<n;i++){const a=rot+i*TAU/n;const px=x+Math.cos(a)*s,py=y+Math.sin(a)*s;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}ctx.closePath();}
function gemPath(col,x,y,s){
  if(col===0){ctx.arc(x,y,s,0,TAU);}
  else if(col===1)poly(x,y+s*.12,s*1.15,3,-Math.PI/2);
  else if(col===2)poly(x,y,s,4,-Math.PI/2);
  else if(col===3)poly(x,y,s,5,-Math.PI/2);
  else poly(x,y,s,6,Math.PI/6);
}
function drawGem(col,x,y,s){
  const p=PAL[col];
  ctx.beginPath();gemPath(col,x,y,s*1.45);ctx.fillStyle=p.glow;ctx.fill();
  ctx.beginPath();gemPath(col,x,y,s);ctx.fillStyle=p.fill;ctx.fill();
  ctx.lineWidth=Math.max(1.2,s*.16);ctx.strokeStyle=p.light;ctx.stroke();
  ctx.beginPath();ctx.arc(x-s*.3,y-s*.38,s*.17,0,TAU);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();
}
function drawVirus(x,y,s){
  const n=9;ctx.beginPath();
  for(let i=0;i<n*2;i++){const a=i*Math.PI/n+CLOCK*.5,rr=(i%2?s*.5:s);
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);}
  ctx.closePath();
  ctx.fillStyle='#343a4d';ctx.fill();ctx.strokeStyle='#5b6580';ctx.lineWidth=1.5;ctx.stroke();
  const pr=s*.32*(1+.25*Math.sin(CLOCK*7));
  ctx.beginPath();ctx.arc(x,y,pr,0,TAU);
  ctx.fillStyle='rgba(255,77,109,'+(.6+.3*Math.sin(CLOCK*7)).toFixed(2)+')';ctx.fill();
}

/* ============================== RENDER ============================== */
function render(){
  ctx.drawImage(bgCanvas,0,0,W,H);
  for(const st of STARS){
    ctx.fillStyle='rgba(190,225,255,'+(.15+.4*st.z).toFixed(2)+')';
    ctx.fillRect(st.x*W,st.y*H,st.z*1.6,st.z*3+1);
  }
  ctx.save();
  if(S.shake>0)ctx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));

  // column fire beams
  for(let c=0;c<COLS;c++){
    if(colFlash[c]<=0)continue;
    const x=L.bx+c*L.cell+L.cell/2,grad=ctx.createLinearGradient(0,L.by-150,0,L.by);
    grad.addColorStop(0,'rgba(140,235,255,0)');
    grad.addColorStop(1,'rgba(140,235,255,'+(.5*colFlash[c]).toFixed(2)+')');
    ctx.fillStyle=grad;ctx.fillRect(x-L.cell*.35,L.by-150,L.cell*.7,150);
  }

  // board plate
  rrect(L.bx-8,L.by-8,L.bw+16,L.bh+16,10);
  ctx.fillStyle='rgba(8,14,28,.9)';ctx.fill();
  ctx.strokeStyle='#223d63';ctx.lineWidth=1.5;ctx.stroke();
  for(let c=0;c<=COLS;c++){ctx.fillStyle='rgba(90,150,220,.05)';ctx.fillRect(L.bx+c*L.cell-1,L.by,2,L.bh);}
  for(let r=0;r<=ROWS;r++){ctx.fillStyle='rgba(90,150,220,.05)';ctx.fillRect(L.bx,L.by+r*L.cell-1,L.bw,2);}

  // slots
  const pad=L.cell*.08;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    rrect(L.bx+c*L.cell+pad,L.by+r*L.cell+pad,L.cell-2*pad,L.cell-2*pad,L.cell*.16);
    ctx.fillStyle='rgba(140,190,255,.045)';ctx.fill();
  }

  // shield dome
  if(S.mode!=='menu'){
    const pct=clamp(S.shield/100,0,1),cx=L.bx+L.bw/2;
    ctx.beginPath();ctx.ellipse(cx,L.by,L.bw/2+14,84,0,Math.PI,TAU);
    ctx.closePath();
    ctx.fillStyle='rgba(63,224,255,'+(.04+.09*pct).toFixed(3)+')';ctx.fill();
    ctx.strokeStyle='rgba(63,224,255,'+(.15+.4*pct).toFixed(2)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(cx,L.by,L.bw/2+14,84,0,Math.PI,TAU);ctx.stroke();
    if(S.shieldFlash>0){
      ctx.strokeStyle='rgba(255,77,109,'+(S.shieldFlash*.8).toFixed(2)+')';ctx.lineWidth=4;
      ctx.beginPath();ctx.ellipse(cx,L.by,L.bw/2+16,88,0,Math.PI,TAU);ctx.stroke();
    }
  }

  // gems
  let sox=0,soy=0,sa=null,sb=null;
  if(phase==='swap'&&swapAnim){
    const[r1,c1]=swapAnim.a,[r2,c2]=swapAnim.b,p=Math.min(1,swapAnim.t)*(swapAnim.back?-1:1);
    sa=[r1,c1];sb=[r2,c2];sox=(c2-c1)*L.cell*p;soy=(r2-r1)*L.cell*p;
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=grid[r][c];if(!cell)continue;
    let x=L.bx+c*L.cell+L.cell/2,y=L.by+r*L.cell+L.cell/2+(cell.dy||0);
    if(sa&&r===sa[0]&&c===sa[1]){x+=sox;y+=soy;}
    else if(sb&&r===sb[0]&&c===sb[1]){x-=sox;y-=soy;}
    let sc=cell.s*(cell.clearing?Math.max(0,1-cell.ct/.18):1);
    if(sc<=.02)continue;
    const rad=L.cell*.34*sc;
    if(cell.color<0)drawVirus(x,y,rad);
    else{
      drawGem(cell.color,x,y,rad);
      if(cell.clearing){
        ctx.globalAlpha=(1-cell.ct/.18)*.7;
        ctx.beginPath();gemPath(cell.color,x,y,rad);ctx.fillStyle='#ffffff';ctx.fill();
        ctx.globalAlpha=1;
      }
    }
  }

  // cursor / selection
  if(S.mode==='playing'){
    rrect(L.bx+cur.c*L.cell+2,L.by+cur.r*L.cell+2,L.cell-4,L.cell-4,6);
    ctx.strokeStyle='rgba(120,200,255,.3)';ctx.lineWidth=1.5;ctx.stroke();
    if(sel){
      const a=.55+.4*Math.sin(CLOCK*8);
      rrect(L.bx+sel.c*L.cell+1,L.by+sel.r*L.cell+1,L.cell-2,L.cell-2,7);
      ctx.strokeStyle='rgba(63,224,255,'+a.toFixed(2)+')';ctx.lineWidth=2.5;ctx.stroke();
    }
  }

  // shots
  for(const s of shots){
    const p=PAL[s.color];
    ctx.beginPath();ctx.moveTo(s.x,s.y+16);ctx.lineTo(s.x,s.y-4);
    ctx.strokeStyle=p.glow.replace('.18','.5');ctx.lineWidth=s.w*2;ctx.stroke();
    ctx.beginPath();ctx.ellipse(s.x,s.y,s.w*.7,s.w*1.6,0,0,TAU);ctx.fillStyle=p.fill;ctx.fill();
    if(s.type==='laser'){ctx.beginPath();ctx.ellipse(s.x,s.y,s.w*.3,s.w*1.2,0,0,TAU);ctx.fillStyle='#fff';ctx.fill();}
  }

  // enemy bullets
  for(const b of ebullets){
    ctx.strokeStyle='rgba(255,138,92,.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(b.x-b.vx*.03,b.y-b.vy*.03);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*2,0,TAU);ctx.fillStyle='rgba(255,138,92,.25)';ctx.fill();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*.8,0,TAU);ctx.fillStyle='#ffd9c4';ctx.fill();
  }

  // enemies
  for(const e of enemies){
    const p=PAL[e.color];
    ctx.save();ctx.translate(e.x,e.y);
    ctx.beginPath();ctx.arc(0,0,e.r+5,0,TAU);ctx.strokeStyle=p.hex;ctx.globalAlpha=.85;ctx.lineWidth=1.6;ctx.stroke();ctx.globalAlpha=1;
    if(e.type==='weaver')ctx.rotate(Math.sin(e.t*3)*.5);
    ctx.beginPath();
    if(e.type==='drone')poly(0,0,e.r,3,Math.PI/2);
    else if(e.type==='weaver')poly(0,0,e.r,4,-Math.PI/2);
    else poly(0,0,e.r,6,Math.PI/6);
    ctx.fillStyle='#16223c';ctx.fill();
    ctx.strokeStyle='rgba(175,208,255,.55)';ctx.lineWidth=2;ctx.stroke();
    if(e.type==='brute'){ctx.beginPath();ctx.arc(0,0,e.r*.66,0,TAU);ctx.strokeStyle='rgba(175,208,255,.3)';ctx.lineWidth=1.5;ctx.stroke();}
    drawGem(e.color,0,e.type==='drone'?e.r*.18:0,e.r*.4);
    if(e.flash>0){ctx.globalAlpha=e.flash/.12*.7;ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=1;}
    ctx.restore();
    if(e.hp<e.maxHp){
      const w=e.r*1.6,pct=clamp(e.hp/e.maxHp,0,1);
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(e.x-w/2,e.y-e.r-11,w,3.5);
      ctx.fillStyle=pct>.4?'#5dff9b':'#ff4d6d';ctx.fillRect(e.x-w/2,e.y-e.r-11,w*pct,3.5);
    }
  }

  // relics
  for(const r of relics){
    ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.t*3);
    ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fillStyle='rgba(65,230,200,.2)';ctx.fill();
    poly(0,0,8,4,-Math.PI/2);ctx.fillStyle='#41e6c8';ctx.fill();ctx.strokeStyle='#d9fff6';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  }

  // particles
  for(const p of parts){
    ctx.globalAlpha=clamp(1-p.t/p.life,0,1);
    ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;

  // texts
  for(const t of texts){
    const a=clamp(1-t.t/t.life,0,1),pop=1+.3*Math.max(0,1-t.t*6);
    ctx.globalAlpha=a;
    ctx.font='900 '+Math.round(t.size*pop)+'px Impact,"Arial Black",sans-serif';
    ctx.textAlign='center';ctx.fillStyle=t.color;
    ctx.shadowColor=t.color;ctx.shadowBlur=12;
    ctx.fillText(t.str,t.x,t.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // storm
  if(S.storm){
    const p=S.storm.t/.9,cx=W/2,cy=L.by-30;
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-p);
    ctx.strokeStyle='#bff4ff';ctx.lineWidth=10*(1-p)+2;
    ctx.beginPath();ctx.arc(cx,cy,p*900,0,TAU);ctx.stroke();
    ctx.globalAlpha=(1-p)*.5;ctx.strokeStyle='#3fe0ff';ctx.lineWidth=Math.max(1,30*(1-p));
    ctx.beginPath();ctx.arc(cx,cy,p*820,0,TAU);ctx.stroke();
    if(p<.6){ctx.globalAlpha=(1-p)*.9;ctx.fillStyle='#eaffff';ctx.fillRect(0,L.by-3,W,4);}
    ctx.restore();
  }
  ctx.restore(); // shake

  if(S.flash>0){ctx.fillStyle='rgba(215,246,255,'+(S.flash*.7).toFixed(2)+')';ctx.fillRect(0,0,W,H);}

  if(S.mode==='playing'||S.mode==='paused')drawHUD();
}

function drawHUD(){
  const F=(w,s)=>w+' '+s+'px Consolas,"SF Mono",Menlo,monospace';
  // score
  ctx.textAlign='left';
  ctx.font=F('700',10);ctx.fillStyle='#5f86ad';ctx.fillText('S C O R E',16,24);
  ctx.font=F('700',26);ctx.fillStyle='#eaf6ff';ctx.fillText(Math.floor(S.score).toLocaleString(),16,48);
  ctx.font=F('400',11);ctx.fillStyle='#5f86ad';ctx.fillText('BEST '+S.best.toLocaleString(),16,64);
  // threat + time
  ctx.textAlign='right';
  ctx.font=F('700',12);ctx.fillStyle='#ff9db0';ctx.fillText('THREAT '+(S.threatLvl+1),W-16,24);
  ctx.font=F('700',20);ctx.fillStyle='#cfe3f7';ctx.fillText(fmtTime(S.t),W-16,46);
  if(muted){ctx.font=F('400',10);ctx.fillStyle='#5f86ad';ctx.fillText('SOUND OFF [M]',W-16,62);}
  // shield bar
  const w=Math.min(320,W*.4),x=(W-w)/2,y=22,pct=clamp(S.shield/100,0,1);
  let col=pct>.5?'#41e6c8':pct>.25?'#ffc53d':'#ff4d6d';
  ctx.textAlign='center';ctx.font=F('700',10);ctx.fillStyle='#5f86ad';
  ctx.fillText('C O R E   S H I E L D',W/2,y-6);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x,y,w,13);
  let a=1;if(pct<.25)a=.7+.3*Math.sin(CLOCK*10);
  ctx.globalAlpha=a;ctx.fillStyle=col;ctx.fillRect(x,y,w*pct,13);
  if(S.shieldFlash>0){ctx.fillStyle='rgba(255,255,255,'+(S.shieldFlash*.8).toFixed(2)+')';ctx.fillRect(x,y,w*pct,13);}
  ctx.globalAlpha=1;
  ctx.strokeStyle='#2a4a74';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,13);
  // early hint
  if(S.t<9){
    ctx.globalAlpha=clamp(9-S.t,0,1)*.8;
    ctx.font=F('400',11);ctx.fillStyle='#7fb7d9';
    ctx.fillText('CLICK / DRAG TO SWAP · ARROWS + SPACE ON KEYBOARD',W/2,Math.max(66,L.by*.35));
    ctx.globalAlpha=1;
  }
}

/* ============================== LOOP ============================== */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;last=now;
  if(dt>.05)dt=.05;
  if(W!==window.innerWidth||H!==window.innerHeight)resize();
  update(dt);render();
}
resize();
initBoard();
showScreen('menu');
requestAnimationFrame(loop);
</script>
