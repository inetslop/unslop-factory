<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pong Breakout</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#070d15;}
  #stage{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}
  body.playing canvas{cursor:none;}
  .crt{position:absolute;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 100%),
      repeating-linear-gradient(0deg, rgba(3,8,14,.26) 0px, rgba(3,8,14,.26) 1px, transparent 1px, transparent 3px);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="crt"></div>
</div>
<script>
(function(){
'use strict';
/* ============================== CORE SETUP ============================== */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
let dpr=1, scale=1, ox=0, oy=0;
function resize(){
  const w=window.innerWidth, h=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  scale=Math.min(w/1280,h/720); ox=(w-1280*scale)/2; oy=(h-720*scale)/2;
}
window.addEventListener('resize',resize); resize();

/* ============================== CONSTANTS ============================== */
const LW=1280, LH=720, WALL=14, R=9;
const TARGET=15, MAXS=940, MAXA=Math.PI*0.36;
const COLS=6, ROWS=4, BW=54, BH=26, GX=8, GY=8;
const FIELD_W=COLS*BW+(COLS-1)*GX, FIELD_H=ROWS*BH+(ROWS-1)*GX;
const FX0=(LW-FIELD_W)/2, FY0=(LH-FIELD_H)/2;
const ROWCOL=[[255,93,115],[255,159,67],[255,210,63],[89,217,140],[63,198,224],[139,147,255]];
const SIDE_COL=['#ffb057','#3fe8cc'];
const PCOL=[255,159,67], CCOL=[45,225,194];
const PU={W:{c:'#ffd23f',rgb:[255,210,63],n:'WIDE PADDLE'},S:{c:'#3fc6e0',rgb:[63,198,224],n:'BALL SLOWED'},M:{c:'#ff5d73',rgb:[255,93,115],n:'MULTIBALL'}};

/* ============================== PIXEL FONT ============================== */
const F={A:"01110100011000111111100011000110001",B:"11110100011000111110100011000111110",
C:"01110100011000010000100001000101110",D:"11110100011000110001100011000111110",
E:"11111100001000011110100001000011111",F:"11111100001000011110100001000010000",
G:"01110100011000010111100011000101110",H:"10001100011000111111100011000110001",
I:"111110010000100001000010000010011111".replace("001","01"),J:"11111000100001000010100101001001100",
K:"10001100101010011000101001001010001",L:"10000100001000010000100001000011111",
M:"10001110111010110101100011000110001",N:"10001110011010110011100011000110001",
O:"01110100011000110001100011000101110",P:"11110100011000111110100001000010000",
Q:"01110100011000110001101011001001101",R:"11110100011000111110101001001010001",
S:"01111100001000001110000010000111110",T:"111110010000100001000010000010000100",
U:"10001100011000110001100011000101110",V:"10001100011000110001100010101000100",
W:"10001100011000110101101011101110001".replace("10001","10001"),X:"10001100010101000100010101000110001",
Y:"10001100010101000100001000010000100",Z:"11111000010001000100010001000011111",
"0":"01110100011001110101110011000101110","1":"00100011000010000100001000010011111",
"2":"01110100010000100010001000100011111","3":"11110000100010000010000011000101110",
"4":"00010001100101010010111110001000010","5":"11111100001111000001000011000101110",
"6":"01110100001000011110100011000101110","7":"11111000010001000100010000100001000",
"8":"01110100011000101110100011000101110","9":"01110100011000101111000010000101110",
"!":"0010000100001000010000100000000100","+":"00000001000010011111001000010000000",
"-":"00000000000000011111000000000000000",".":"00000000000000000000000000010000100",
" ":"00000000000000000000000000000000000","/":"00001000010001000100001000100010000",
">":"100000100000100000100000100001000010000"};
F.I="111110010000100001000010000010011111"; F.W="10001100011000110101101011101110001";
F.V="1000110001100011000110001100010101000100".slice(0,35);
function pxText(t,x,y,cell,color,align,glow){
  t=String(t).toUpperCase();
  const w=t.length*6-1;
  if(align==='center')x-=w*cell/2; else if(align==='right')x-=w*cell;
  ctx.save();
  if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}
  ctx.fillStyle=color;
  for(let i=0;i<t.length;i++){const g=F[t[i]];if(!g)continue;
    for(let r=0;r<7;r++)for(let c=0;c<5;c++) if(g.charCodeAt(r*5+c)===49) ctx.fillRect(x+(i*6+c)*cell,y+r*cell,cell,cell);
  }
  ctx.restore();
}
function body(t,x,y,size,color,align,weight){
  ctx.font=(weight||700)+' '+size+'px "Trebuchet MS", Verdana, sans-serif';
  ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(t,x,y);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============================== AUDIO ============================== */
let AC=null, master=null, muted=false;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume().catch(()=>{}); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.16; master.connect(AC.destination);
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,when){
  if(!AC||muted)return; type=type||'square'; vol=vol==null?1:vol; when=when||0;
  const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(Math.max(30,f0),t);
  if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol,freq,type,when){
  if(!AC||muted)return; type=type||'bandpass'; when=when||0;
  const t=AC.currentTime+when, n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const sfx={
  paddle(sp){tone(150+sp*0.12,90,0.07,'square',0.8);noise(0.04,0.3,2400,'highpass');},
  wall(){tone(110,70,0.05,'triangle',0.5);},
  brick(row,hp){noise(0.09,0.5,600+row*120);tone(300+(5-row)*45+hp*60,420+(5-row)*45+hp*60,0.1,'square',0.5);},
  thud(){noise(0.05,0.35,900);tone(180,120,0.06,'triangle',0.5);},
  power(){tone(500,900,0.1,'square',0.6);tone(750,1250,0.12,'square',0.5,0.09);},
  serve(){noise(0.12,0.4,900);tone(220,340,0.08,'triangle',0.5);},
  you(){tone(523,523,0.09,'square',0.7);tone(784,784,0.13,'square',0.7,0.09);},
  cpu(){tone(330,330,0.09,'square',0.6);tone(207,207,0.15,'square',0.6,0.09);},
  level(){[523,659,784,1046].forEach((f,i)=>tone(f,f,0.11,'square',0.6,i*0.08));},
  win(){[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,f,0.14,'square',0.7,i*0.11));noise(0.3,0.3,3000,'highpass',0.6);},
  lose(){[330,277,220,165].forEach((f,i)=>tone(f,f,0.18,'triangle',0.7,i*0.14));}
};

/* ============================== STATE ============================== */
let state='menu', prevState=null;
let level=1, score=[0,0], matchBricks=0, best=0, newBest=false, topLevel=1;
let serverSide=0, serveT=-9, pointT=0, clearT=0, overT=0, winner=-1, pendingServer=-1, pendingWinner=-1;
let ballSpeed=450, slowTimer=0, slowF=1, combo=0, lastHit=0;
let shake=0, shx=0, shy=0, goalGlow={side:-1,t:0}, popT=[0,0], wallTotal=24;
let bricks=[], balls=[], powerups=[], parts=[], texts=[];
let animT=0, lastWallSfx=0, newBestAt=0;

const P={x:WALL+42,y:LH/2,w:18,h:92,vy:0,prevY:LH/2,target:LH/2,wide:0,rgb:PCOL,ai:true};
const C={x:LW-WALL-42,y:LH/2,w:18,h:92,vy:0,prevY:LH/2,target:LH/2,wide:0,err:0,rgb:CCOL,ai:true};
function diffNow(){ return state==='menu'?0.5:Math.min(1,0.16+(score[0]+score[1])*0.05+(level-1)*0.07); }

/* ambient motes */
const motes=[]; for(let i=0;i<26;i++)motes.push({x:Math.random()*LW,y:Math.random()*LH,r:1+Math.random()*2,sp:8+Math.random()*18,ph:Math.random()*7});

/* ball glow sprite */
const glowCv=document.createElement('canvas'); glowCv.width=glowCv.height=96;
(function(){const g=glowCv.getContext('2d');const gr=g.createRadialGradient(48,48,0,48,48,48);
gr.addColorStop(0,'rgba(255,246,220,1)');gr.addColorStop(0.25,'rgba(255,214,140,0.55)');gr.addColorStop(1,'rgba(255,180,80,0)');
g.fillStyle=gr;g.fillRect(0,0,96,96);})();

/* ============================== FLOW ============================== */
function buildWall(lv){
  bricks=[]; const pat=(lv-1)%4; let total=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    let skip=false;
    if(pat===1&&(r+c)%2)skip=true;
    if(pat===2&&(r===1||r===2)&&(c===1||c===4))skip=true;
    if(pat===3&&Math.abs(c-2.5)+Math.abs(r-1.5)>2.9)skip=true;
    if(skip)continue;
    let hp=1;
    if(lv>=2&&(r*COLS+c)%5===0)hp=2;
    if(lv>=3&&r===1&&(c===2||c===3))hp=3;
    bricks.push({x:FX0+c*(BW+GX),y:FY0+r*(BH+GY),row:r,col:c,hp:hp,max:hp,alive:true,cd:0,flash:0,seed:(r*7+c*13)%97});
    total++;
  }
  wallTotal=total;
}
function BASE(){return Math.min(MAXS-40,450+(level-1)*26);}
function setupServe(side){
  serverSide=side; lastHit=side; combo=0; powerups.length=0;
  balls.length=0; balls.push({x:0,y:0,vx:0,vy:0,stuck:true,trail:[]});
  ballSpeed=BASE(); slowTimer=0;
  state='serve';
  serveT=(side===1||state==='menu')?0.8:-99;
}
function launchBall(){
  const b=balls[0]; if(!b||!b.stuck)return;
  const ang=(Math.random()*56-28)*Math.PI/180, dir=serverSide?-1:1;
  b.stuck=false;
  b.vx=Math.cos(ang)*ballSpeed*dir; b.vy=Math.sin(ang)*ballSpeed;
  if(Math.abs(b.vy)<70)b.vy=(ang>=0?1:-1)*70;
  sfx.serve();
  if(state!=='menu')state='play';
}
function startMatch(){
  score=[0,0]; level=1; matchBricks=0; newBest=false; topLevel=1; winner=-1; popT=[0,0]; goalGlow.t=0;
  P.wide=0; C.wide=0; P.h=92; C.h=92; slowTimer=0; slowF=1;
  buildWall(1); P.ai=false; C.ai=true;
  setupServe(0);
}
function toMenu(){ P.ai=true; C.ai=true; score=[0,0]; level=1; buildWall(1); balls.length=0; powerups.length=0; setupServe(Math.random()<0.5?0:1); }
function gameOver(w){
  winner=w; state='over'; overT=0;
  if(matchBricks>best){best=matchBricks;newBest=true;newBestAt=animT;saveBest();}
  (w===0?sfx.win:sfx.lose)();
}
function addScore(side,amt,x,y,label,big){
  score[side]+=amt; popT[side]=1;
  if(x!==undefined)ftext(label||('+'+amt),x,y,big?8:3,SIDE_COL[side]);
  if(score[side]>=TARGET&&state==='play'){
    pendingWinner=side; pendingServer=-1; state='point'; pointT=1.4; goalGlow={side:1-side,t:1};
    (side===0?sfx.you:sfx.cpu)(); shake+=6;
  }
}
function scoreGoal(scorer){
  addScore(scorer,2);
  ftext(scorer===0?'ACE +2':'CPU SCORES',LW/2,LH/2-30,8,SIDE_COL[scorer],'center');
  (scorer===0?sfx.you:sfx.cpu)(); shake+=6;
}

/* ============================== FX HELPERS ============================== */
function burst(x,y,col,n,spd,sz){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(0.3+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4+Math.random()*0.5,max:0.9,size:sz*(0.6+Math.random()*0.8),col:col});}
  if(parts.length>320)parts.splice(0,parts.length-320);
}
function ftext(t,x,y,size,color,align){texts.push({t:t,x:x,y:y,size:size,col:color,life:1.15,max:1.15,vy:-26,align:align||'center'});}

/* ============================== INPUT ============================== */
const keys={up:false,down:false};
function tryAction(){
  if(state==='menu')startMatch();
  else if(state==='serve'&&serverSide===0&&!P.ai)launchBall();
  else if(state==='over')startMatch();
}
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)>=0)e.preventDefault();
  initAudio();
  if(k==='KeyW'||k==='ArrowUp')keys.up=true;
  else if(k==='KeyS'||k==='ArrowDown')keys.down=true;
  else if(k==='Space'||k==='Enter'){tryAction();}
  else if(k==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:0.16;ftext(muted?'SOUND OFF':'SOUND ON',LW/2,90,4,'#ffffff');}
  else if(k==='KeyP'||k==='Escape'){
    if(state==='play'||state==='serve'){prevState=state;state='pause';}
    else if(state==='pause')state=prevState;
    else if(state==='over'&&k==='Escape')toMenu();
  }
  else if(k==='KeyR'){if(state!=='menu')startMatch();}
});
window.addEventListener('keyup',e=>{
  const k=e.code;
  if(k==='KeyW'||k==='ArrowUp')keys.up=false;
  if(k==='KeyS'||k==='ArrowDown')keys.down=false;
});
cv.addEventListener('mousedown',()=>{initAudio();tryAction();});
cv.addEventListener('mousemove',e=>{
  const y=(e.clientY-oy)/scale;
  if(!P.ai&&(state==='play'||state==='serve'))P.target=y;
});
cv.addEventListener('touchstart',e=>{
  e.preventDefault(); initAudio(); tryAction();
  const t=e.touches[0]; if(t&&!P.ai)P.target=(t.clientY-oy)/scale;
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault(); const t=e.touches[0];
  if(t&&!P.ai&&(state==='play'||state==='serve'))P.target=(t.clientY-oy)/scale;
},{passive:false});
window.addEventListener('blur',()=>{if(state==='play'||state==='serve'){prevState=state;state='pause';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='serve')){prevState=state;state='pause';}});

function loadBest(){try{best=+localStorage.getItem('pb_best')||0;}catch(e){best=0;}}
function saveBest(){try{localStorage.setItem('pb_best',String(best));}catch(e){}}
loadBest();

/* ============================== AI & PADDLES ============================== */
function predictY(b,pad){
  const m=Math.hypot(b.vx,b.vy); if(m<1)return LH/2;
  let x=b.x,y=b.y,ux=b.vx/m,uy=b.vy/m;
  const limit=pad===C?C.x-14:P.x+14;
  for(let i=0;i<800;i++){
    x+=ux*10; y+=uy*10;
    if(y<R+WALL){y=R+WALL;uy=-uy;} else if(y>LH-R-WALL){y=LH-R-WALL;uy=-uy;}
    if((pad===C&&x>=limit)||(pad!==C&&x<=limit))return y;
  }
  return y;
}
function aiMove(pad,dt,maxS){
  const b=balls[0]; let target;
  if(!b||b.stuck)target=LH/2+Math.sin(animT*0.7+(pad===C?2:0))*34;
  else{
    const toward=(pad===C&&b.vx>0)||(pad!==C&&b.vx<0);
    target=toward?predictY(b,pad)+(pad===C?C.err:(Math.sin(animT*1.3)*50)):LH/2+Math.sin(animT*0.6+(pad===C?4:0))*44;
  }
  const lo=WALL+pad.h/2+4, hi=LH-WALL-pad.h/2-4;
  target=Math.max(lo,Math.min(hi,target));
  const d=target-pad.y, mv=Math.sign(d)*Math.min(Math.abs(d),maxS*dt);
  pad.prevY=pad.y; pad.y+=mv; pad.vy=(pad.y-pad.prevY)/Math.max(dt,0.001);
}
function humanMove(pad,dt){
  const sp=700;
  if(keys.up)pad.target-=sp*dt;
  if(keys.down)pad.target+=sp*dt;
  pad.prevY=pad.y;
  pad.y+=(pad.target-pad.y)*Math.min(1,dt*30);
  pad.vy=(pad.y-pad.prevY)/Math.max(dt,0.001);
}
function updatePads(dt){
  const d=diffNow();
  if(P.ai)aiMove(P,dt,state==='menu'?430:380); else humanMove(P,dt);
  aiMove(C,dt,285+d*395);
  P.wide=Math.max(0,P.wide-dt); C.wide=Math.max(0,C.wide-dt);
  const th=92+(P.wide>0?46:0); P.h+=(th-P.h)*Math.min(1,dt*10);
  const ch=92+(C.wide>0?46:0); C.h+=(ch-C.h)*Math.min(1,dt*10);
  const lo=WALL+P.h/2+4, hi=LH-WALL-P.h/2-4;
  P.y=Math.max(lo,Math.min(hi,P.y)); C.y=Math.max(lo,Math.min(hi,C.y));
}

/* ============================== PHYSICS ============================== */
function padHit(pad,isPlayer){
  const b=balls[0]||balls.find(b=>!b.stuck); if(!b)return;
  const hw=pad.w/2, hh=pad.h/2;
  const cx=Math.max(pad.x-hw,Math.min(b.x,pad.x+hw)), cy=Math.max(pad.y-hh,Math.min(b.y,pad.y+hh));
  let dx=b.x-cx, dy=b.y-cy; const d2=dx*dx+dy*dy;
  if(d2>R*R)return;
  let nx,ny,pen;
  if(d2===0){nx=isPlayer?-1:1;ny=0;pen=R;}
  else{const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=R-d;}
  b.x+=nx*pen; b.y+=ny*pen;
  const dot=b.vx*nx+b.vy*ny; if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;}
  lastHit=isPlayer?0:1; combo=0;
  if(!isPlayer)C.err=(Math.random()*2-1)*(95-diffNow()*65);
  const rel=Math.max(-1,Math.min(1,(b.y-pad.y)/hh));
  const ang=rel*MAXA, dir=isPlayer?1:-1;
  ballSpeed=Math.min(ballSpeed+10,MAXS);
  b.vx=Math.cos(ang)*ballSpeed*dir;
  b.vy=Math.sin(ang)*ballSpeed+pad.vy*0.18;
  const m=Math.hypot(b.vx,b.vy), cap=ballSpeed*1.15;
  if(m>cap){b.vx*=cap/m;b.vy*=cap/m;}
  burst(cx,cy,isPlayer?'#ffb057':'#3fe8cc',6,140,3);
  sfx.paddle(ballSpeed); shake=Math.min(shake+1.2,14);
}
function hitBrick(br){
  if(state!=='menu'){
    br.hp--;
    const col=ROWCOL[br.row];
    if(br.hp<=0){
      br.alive=false;
      burst(br.x+BW/2,br.y+BH/2,'rgb('+col.join(',')+')',14,220,3.5);
      shake=Math.min(shake+3.5,14); sfx.brick(br.row,br.max);
      matchBricks++; topLevel=Math.max(topLevel,level);
      combo++;
      addScore(lastHit,1,br.x+BW/2,br.y+BH/2-6);
      if(combo>0&&combo%5===0){addScore(lastHit,1,LW/2,150,'COMBO +1');shake+=2;}
      if(Math.random()<0.13)spawnPower(br.x+BW/2,br.y+BH/2);
      let alive=0; for(const q of bricks)if(q.alive)alive++;
      if(alive===0){
        if(state==='menu'){buildWall(level);level++;}
        else{state='levelclear';clearT=1.9;level++;sfx.level();confetti();ftext('LEVEL '+level,LW/2,300,10,'#ffd23f','center');}
      }
    }else{
      burst(br.x+BW/2,br.y+BH/2,'rgba(255,255,255,0.9)',6,120,2.5);
      sfx.thud(); shake=Math.min(shake+1.5,14);
    }
  }else{
    br.hp--; if(br.hp<=0){br.alive=false;burst(br.x+BW/2,br.y+BH/2,'rgb('+ROWCOL[br.row].join(',')+')',10,200,3);}
    let alive=0;for(const q of bricks)if(q.alive)alive++;
    if(alive===0){buildWall(level);level++;}
  }
}
function spawnPower(x,y){
  const r=Math.random(), type=r<0.4?'W':r<0.75?'S':'M';
  powerups.push({x:x,y:y,vx:(Math.random()<0.5?-1:1)*(230+Math.random()*80),type:type,t:0});
}
function confetti(){
  for(let i=0;i<90;i++){
    const c=ROWCOL[(Math.random()*6)|0];
    parts.push({x:FX0+Math.random()*FIELD_W,y:FY0+Math.random()*FIELD_H,vx:(Math.random()-0.5)*380,vy:(Math.random()-0.7)*320,life:0.8+Math.random()*0.8,max:1.6,size:3+Math.random()*3,col:'rgb('+c.join(',')+')'});
  }
}
function stepBall(b,dt){
  const sp=Math.hypot(b.vx,b.vy)*slowF;
  const n=Math.max(1,Math.ceil(sp*dt/6));
  for(let s=0;s<n;s++){
    b.x+=b.vx*slowF*dt/n; b.y+=b.vy*slowF*dt/n;
    if(b.y<R+WALL){b.y=R+WALL;b.vy=Math.abs(b.vy);if(animT-lastWallSfx>0.06){sfx.wall();lastWallSfx=animT;}burst(b.x,R+2,'#9fd8e8',3,90,2);}
    else if(b.y>LH-R-WALL){b.y=LH-R-WALL;b.vy=-Math.abs(b.vy);if(animT-lastWallSfx>0.06){sfx.wall();lastWallSfx=animT;}burst(b.x,LH-R-2,'#9fd8e8',3,90,2);}
    padHit(P,true); padHit(C,false);
    for(const br of bricks){
      if(!br.alive)continue;
      const cx=Math.max(br.x,Math.min(b.x,br.x+BW)), cy=Math.max(br.y,Math.min(b.y,br.y+BH));
      let dx=b.x-cx, dy=b.y-cy; const d2=dx*dx+dy*dy;
      if(d2>R*R)continue;
      let nx,ny,pen;
      if(d2===0){
        const l=b.x-br.x,r2=br.x+BW-b.x,t=b.y-br.y,bt=br.y+BH-b.y,m=Math.min(l,r2,t,bt);
        nx=m===l?-1:m===r2?1:0; ny=m===t?-1:m===bt?1:0; pen=R+m;
      }else{const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;pen=R-d;}
      b.x+=nx*pen;b.y+=ny*pen;
      const dot=b.vx*nx+b.vy*ny; if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;}
      if(br.cd<=0){br.cd=0.12;br.flash=1;hitBrick(br);}
    }
    if(b.x<WALL-R*2){if(state==='menu'){setupServe(1);}else{state='point';pendingServer=1;pendingWinner=-1;pointT=1.35;goalGlow={side:0,t:1};scoreGoal(1);}return;}
    if(b.x>LW-WALL+R*2){if(state==='menu'){setupServe(0);}else{state='point';pendingServer=0;pendingWinner=-1;pointT=1.35;goalGlow={side:1,t:1};scoreGoal(0);}return;}
  }
}

/* ============================== UPDATE ============================== */
function update(dt){
  animT+=dt;
  shake=Math.max(0,shake-shake*7*dt-2*dt);
  shx=(Math.random()-0.5)*shake*2; shy=(Math.random()-0.5)*shake*2;
  for(const m of motes){m.y-=m.sp*dt;m.x+=Math.sin(animT+m.ph)*6*dt;if(m.y<-4){m.y=LH+4;m.x=Math.random()*LW;}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(0.9,dt*60);p.vy*=Math.pow(0.9,dt*60);}
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.life-=dt;t.y+=t.vy*dt;if(t.life<=0)texts.splice(i,1);}
  goalGlow.t=Math.max(0,goalGlow.t-dt*0.9);
  popT[0]=Math.max(0,popT[0]-dt*3); popT[1]=Math.max(0,popT[1]-dt*3);

  if(state==='pause')return;

  updatePads(dt);
  for(const br of bricks){br.cd=Math.max(0,br.cd-dt);br.flash=Math.max(0,br.flash-dt*4);}

  if(state==='menu'||state==='serve'){
    const pad=serverSide?C:P, b=balls[0];
    if(b){b.x=serverSide?pad.x-(pad.w/2+R+6):pad.x+(pad.w/2+R+6);b.y=pad.y;}
    if(serveT>-100&&serveT<90){serveT-=dt;if(serveT<=0)launchBall();}
  }
  else if(state==='play'){
    slowTimer=Math.max(0,slowTimer-dt);
    const st=slowTimer>0?0.62:1; slowF+=(st-slowF)*Math.min(1,dt*3);
    for(const b of balls){if(state!=='play')break;stepBall(b,dt);}
    /* powerups */
    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i]; p.t+=dt; p.x+=p.vx*dt;
      if(p.t>5||p.x<WALL+8||p.x>LW-WALL-8){powerups.splice(i,1);continue;}
      let caught=false;
      for(const pad of [P,C]){
        if(Math.abs(p.x-pad.x)<pad.w/2+16&&Math.abs(p.y-pad.y)<pad.h/2+12){
          caught=true;
          const mine=pad===P;
          if(p.type==='W')pad.wide=8;
          else if(p.type==='S')slowTimer=Math.max(slowTimer,6);
          else{
            const src=balls[0]||balls[0];
            if(balls.length<3&&src){
              for(let k=1;k<2;k++){
                const a=Math.atan2(src.vy,src.vx)+(k?0.5:-0.5)*(0.4+Math.random()*0.3);
                balls.push({x:src.x,y:src.y,vx:Math.cos(a)*ballSpeed,vy:Math.sin(a)*ballSpeed,stuck:false,trail:[]});
              }
            }
          }
          ftext(PU[p.type].n,pad.x+(mine?-70:70),pad.y-14,3,PU[p.type].c,'center');
          burst(p.x,p.y,PU[p.type].c,12,180,3); sfx.power(); shake=Math.min(shake+2,14);
          break;
        }
      }
      if(caught)powerups.splice(i,1);
    }
    /* trails */
    for(const b of balls){b.trail.push({x:b.x,y:b.y});if(b.trail.length>13)b.trail.shift();}
  }
  else if(state==='point'){
    pointT-=dt;
    if(pointT<=0){
      if(pendingWinner>=0)gameOver(pendingWinner);
      else setupServe(pendingServer);
    }
  }
  else if(state==='levelclear'){
    clearT-=dt;
    if(clearT<=0){buildWall(level);setupServe(0);}
  }
  else if(state==='over'){overT+=dt;}
}

/* ============================== RENDER ============================== */
function drawBrick(br){
  const col=ROWCOL[br.row];
  const wave=Math.sin(animT*2-br.col*0.7-br.row*0.5)*0.5+0.5;
  ctx.fillStyle='rgb('+col.join(',')+')';
  rr(br.x,br.y,BW,BH,3); ctx.fill();
  if(wave>0.55){ctx.fillStyle='rgba(255,255,255,'+(wave-0.55)*0.28+')';rr(br.x,br.y,BW,BH,3);ctx.fill();}
  const dmg=1-br.hp/br.max;
  if(dmg>0){
    ctx.fillStyle='rgba(10,16,26,'+(dmg*0.45)+')'; rr(br.x,br.y,BW,BH,3); ctx.fill();
    ctx.strokeStyle='rgba(8,12,20,0.7)'; ctx.lineWidth=1.5;
    const s=br.seed;
    ctx.beginPath();
    ctx.moveTo(br.x+8+(s%10),br.y+4); ctx.lineTo(br.x+16+(s%7),br.y+BH/2); ctx.lineTo(br.x+10+(s%9),br.y+BH-4);
    ctx.moveTo(br.x+BW-10-(s%5),br.y+3); ctx.lineTo(br.x+BW-18-(s%4),br.y+BH-6);
    ctx.stroke();
  }
  if(br.max>=2){ctx.strokeStyle='rgba(255,255,255,'+(0.35+wave*0.2)+')';ctx.lineWidth=2;rr(br.x+3,br.y+3,BW-6,BH-6,2);ctx.stroke();}
  if(br.max>=3){ctx.strokeStyle='rgba(255,255,255,'+(0.25+0.25*Math.sin(animT*4+br.seed))+')';ctx.lineWidth=1.5;rr(br.x-2,br.y-2,BW+4,BH+4,4);ctx.stroke();}
  if(br.flash>0){ctx.fillStyle='rgba(255,255,255,'+(br.flash*0.85)+')';rr(br.x,br.y,BW,BH,3);ctx.fill();}
}
function drawPad(pad,colStr){
  const w=pad.w,h=pad.h;
  if(Math.abs(pad.y-pad.prevY)>1.5){ctx.globalAlpha=0.22;ctx.fillStyle=colStr;rr(pad.x-w/2,pad.prevY-h/2,w,h,6);ctx.fill();ctx.globalAlpha=1;}
  const g=ctx.createLinearGradient(0,pad.y-h/2,0,pad.y+h/2);
  g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.25,colStr);g.addColorStop(1,colStr);
  ctx.save();
  if(pad.wide>0){ctx.shadowColor=colStr;ctx.shadowBlur=18;}
  ctx.fillStyle=g; rr(pad.x-w/2,pad.y-h/2,w,h,6); ctx.fill();
  ctx.restore();
}
function drawBall(b){
  const n=b.trail.length;
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const p=b.trail[i],f=i/n;
    ctx.fillStyle='rgba(255,214,140,'+(f*0.22)+')';
    ctx.beginPath();ctx.arc(p.x,p.y,R*(0.3+f*0.8),0,7);ctx.fill();}
  const gs=R*6*(1+0.06*Math.sin(animT*6));
  ctx.drawImage(glowCv,b.x-gs/2,b.y-gs/2,gs,gs);
  ctx.restore();
  ctx.fillStyle='#fff6e4';ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(b.x-R*0.3,b.y-R*0.35,R*0.4,0,7);ctx.fill();
}
function drawKeycap(x,y,label){
  const w=Math.max(30,label.length*8+16), h=26;
  ctx.fillStyle='#182338'; rr(x,y,w,h,6); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1.5; rr(x,y,w,h,6); ctx.stroke();
  body(label,x+w/2,y+17,12,'rgba(255,255,255,0.9)','center',700);
  return w;
}
function drawControlRow(items,y){
  let total=0; const ws=[];
  for(const it of items){const w=it.cap?Math.max(30,it.cap.length*8+16):it.txt.length*(y>520?7.4:8.2);ws.push(w);total+=w;}
  let x=LW/2-total/2;
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.cap)drawKeycap(x,y,it.cap);
    else body(it.txt,x+ws[i]/2,y+17,13,'rgba(255,255,255,0.65)','center',700);
    x+=ws[i];
  }
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.translate(ox,oy); ctx.scale(scale,scale);

  /* backdrop (covers letterbox) */
  ctx.fillStyle='#0a141f'; ctx.fillRect(-600,-400,LW+1200,LH+800);
  const pulse=0.5+0.5*Math.sin(animT*0.7);
  ctx.strokeStyle='rgba(90,180,200,'+(0.035+pulse*0.02)+')'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=-400;x<LW+400;x+=64){ctx.moveTo(x,-400);ctx.lineTo(x,LH+400);}
  for(let y=-300;y<LH+300;y+=64){ctx.moveTo(-400,y);ctx.lineTo(LW+400,y);}
  ctx.stroke();
  let rg=ctx.createRadialGradient(LW/2,LH/2,80,LW/2,LH/2,720);
  rg.addColorStop(0,'rgba(45,110,130,0.20)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(-400,-300,LW+800,LH+600);
  rg=ctx.createLinearGradient(0,0,220,0);
  rg.addColorStop(0,'rgba(255,159,67,0.06)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,-300,220,LH+600);
  rg=ctx.createLinearGradient(LW,0,LW-220,0);
  rg.addColorStop(0,'rgba(45,225,194,0.06)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(LW-220,-300,220,LH+600);

  /* world (shaken) */
  ctx.save(); ctx.translate(shx,shy);
  /* motes */
  for(const m of motes){ctx.fillStyle='rgba(160,220,235,'+(0.04+0.05*Math.sin(animT+m.ph))+')';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill();}
  /* walls */
  ctx.fillStyle='#152839';
  ctx.fillRect(WALL,WALL,LW-2*WALL,4); ctx.fillRect(WALL,LH-WALL-4,LW-2*WALL,4);
  ctx.fillStyle='rgba(255,159,67,0.5)';ctx.fillRect(WALL,WALL,4,LH-2*WALL);
  ctx.fillStyle='rgba(45,225,194,0.5)';ctx.fillRect(LW-WALL-4,WALL,4,LH-2*WALL);
  /* goal glow */
  if(goalGlow.t>0){
    const gr=goalGlow.side===0?PCOL:CCOL;
    const gw=170*goalGlow.t;
    let gg=goalGlow.side===0?ctx.createLinearGradient(0,0,gw,0):ctx.createLinearGradient(LW,0,LW-gw,0);
    gg.addColorStop(0,'rgba('+gr.join(',')+','+(0.4*goalGlow.t)+')');gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;ctx.fillRect(goalGlow.side===0?0:LW-gw,WALL,gw,LH-2*WALL);
  }
  /* net */
  const off=(animT*18)%26;
  ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=3;ctx.setLineDash([14,12]);ctx.lineDashOffset=-off;
  ctx.beginPath();ctx.moveTo(LW/2,WALL+8);ctx.lineTo(LW/2,LH-WALL-8);ctx.stroke();
  ctx.setLineDash([]);
  /* bricks */
  for(const br of bricks)if(br.alive)drawBrick(br);
  /* powerups */
  for(const p of powerups){
    const d=PU[p.type], pulse2=0.7+0.3*Math.sin(animT*8+p.t*9);
    ctx.save();ctx.shadowColor=d.c;ctx.shadowBlur=14*pulse2;
    ctx.fillStyle=d.c;rr(p.x-15,p.y-11,30,22,9);ctx.fill();ctx.restore();
    pxText(p.type,p.x-5,p.y-7,2,'rgba(10,16,24,0.9)','left');
  }
  /* paddles + wide badges */
  drawPad(P,'#ff9f43'); drawPad(C,'#2de1c2');
  if(P.wide>0)pxText('W',P.x-P.w/2-16,P.y-7,3,'#ffd23f','left');
  if(C.wide>0)pxText('W',C.x+C.w/2+4,C.y-7,3,'#ffd23f','left');
  /* balls */
  for(const b of balls)if(!b.stuck||state==='serve')drawBall(b);
  /* particles */
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of parts){const a=Math.max(0,p.life/p.max);
    ctx.globalAlpha=a;ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  ctx.restore();ctx.globalAlpha=1;
  /* floating texts */
  for(const t of texts){const a=Math.max(0,Math.min(1,t.life/t.max*1.6));
    ctx.save();ctx.globalAlpha=a;
    pxText(t.t,t.x,t.y,t.size,t.col,t.align,8);
    ctx.restore();}
  ctx.restore(); /* end shake */

  /* ---------- HUD ---------- */
  if(state!=='menu'){
    const pc=10+popT[0]*4, cc=10+popT[1]*4;
    pxText(String(score[0]),36,22,pc,SIDE_COL[0],'left',6);
    pxText(String(score[1]),LW-36,22,cc,SIDE_COL[1],'right',6);
    body('YOU',50,84,12,'rgba(255,255,255,0.45)','left',700);
    body('CPU',LW-50,84,12,'rgba(255,255,255,0.45)','right',700);
    pxText('LEVEL '+level,LW/2,26,4,'#ffd23f','center');
    let alive=0;for(const br of bricks)if(br.alive)alive++;
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(LW/2-90,50,180,5);
    ctx.fillStyle='#59d98c';ctx.fillRect(LW/2-90,50,180*Math.max(0,alive/wallTotal),5);
    pxText('FIRST TO '+TARGET,LW/2,64,3,'rgba(255,255,255,0.4)','center');
    body('W / S  OR  ARROWS  —  MOVE     SPACE / CLICK  —  SERVE     P  PAUSE     M  SOUND',LW/2,LH-16,11,'rgba(255,255,255,0.3)','center',600);
    if(muted)body('SOUND OFF — [M]',LW-20,LH-16,11,'rgba(255,210,63,0.6)','right',700);
    if(slowF<0.97)pxText('SLOW-MO',LW/2,96,4,'#3fc6e0','center');
  }
  /* serve hints */
  if(state==='serve'&&!P.ai){
    const bl=0.5+0.5*Math.sin(animT*5);
    if(serverSide===0)pxText('SPACE / CLICK — SERVE',LW/2,LH-70,4,'rgba(255,255,255,'+(0.35+bl*0.5)+')','center');
    else pxText('CPU SERVING'+('.  '.slice(0,1+((animT*2)|0)%3)),LW/2,LH-70,4,'rgba(63,232,204,0.8)','center');
  }

  /* ---------- OVERLAYS ---------- */
  if(state==='menu'){
    ctx.fillStyle='rgba(6,10,18,0.78)';ctx.fillRect(-400,-300,LW+800,LH+600);
    pxText('PONG',LW/2-5,150,19,'rgba(63,232,204,0.55)','center');
    pxText('PONG',LW/2+5,150,19,'rgba(255,93,115,0.55)','center');
    pxText('PONG',LW/2,150,19,'#ffffff','center',14);
    pxText('BREAKOUT',LW/2,278,9,'#ffd23f','center',10);
    body('RALLY THE MACHINE · SMASH THE WALL',LW/2,392,16,'rgba(255,255,255,0.8)','center',700);
    body('BRICK +1  ·  GOAL +2  ·  FIRST TO '+TARGET+' WINS  ·  CLEAR THE WALL TO LEVEL UP',LW/2,418,13,'rgba(255,255,255,0.55)','center',600);
    drawControlRow([{cap:'W'},{cap:'S'},{txt:'  OR  '},{cap:'↑'},{cap:'↓'},{txt:'   MOVE      '},{cap:'SPACE'},{txt:'   SERVE'}],452);
    drawControlRow([{cap:'P'},{txt:' PAUSE    '},{cap:'M'},{txt:' SOUND    '},{cap:'R'},{txt:' REMATCH    '},{cap:'ESC'},{txt:' MENU'}],490);
    if(best>0)pxText('BEST SMASH  '+best,LW/2,548,4,'#3fe8cc','center');
    else body('NO RECORD YET — SET ONE',LW/2,560,12,'rgba(255,255,255,0.35)','center',700);
    const bl=0.4+0.6*Math.abs(Math.sin(animT*2.4));
    pxText('PRESS ENTER OR CLICK TO START',LW/2,610,5,'rgba(255,255,255,'+bl+')','center',8);
  }
  else if(state==='pause'){
    ctx.fillStyle='rgba(6,10,18,0.62)';ctx.fillRect(-400,-300,LW+800,LH+600);
    pxText('PAUSED',LW/2,300,11,'#ffffff','center',10);
    body('P / ESC — RESUME      R — REMATCH',LW/2,410,14,'rgba(255,255,255,0.6)','center',700);
  }
  else if(state==='over'){
    ctx.fillStyle='rgba(6,10,18,'+Math.min(0.78,overT*1.4)+')';ctx.fillRect(-400,-300,LW+800,LH+600);
    const s=Math.min(1,overT*2.5), sc=0.6+0.4*s;
    ctx.save();ctx.translate(LW/2,0);ctx.scale(sc,sc);ctx.translate(-LW/2,0);
    const wc=winner===0?'#3fe8cc':'#ff5d73';
    pxText(winner===0?'YOU WIN!':'CPU WINS',LW/2-4,190,13,'rgba(255,255,255,0.25)','center');
    pxText(winner===0?'YOU WIN!':'CPU WINS',LW/2,190,13,wc,'center',16);
    pxText(score[0]+' - '+score[1],LW/2,320,9,'#ffffff','center');
    body('BRICKS SMASHED  '+matchBricks+'      TOP LEVEL  '+topLevel,LW/2,428,15,'rgba(255,255,255,0.6)','center',700);
    if(newBest&&animT-newBestAt<8){
      const bl=0.5+0.5*Math.sin(animT*6);
      pxText('NEW BEST!',LW/2,462,5,'rgba(255,210,63,'+bl+')','center',8);
    }
    ctx.restore();
    const bl=0.4+0.6*Math.abs(Math.sin(animT*2.4));
    pxText('R — REMATCH     ESC — MENU',LW/2,530,4,'rgba(255,255,255,'+bl+')','center');
  }

  /* vignette already in CSS; done */
}

/* ============================== LOOP & BOOT ============================== */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.05)dt=0.05;
  update(dt); render();
  document.body.classList.toggle('playing',state==='play'||state==='serve');
}
toMenu();
requestAnimationFrame(frame);
})();
</script>
