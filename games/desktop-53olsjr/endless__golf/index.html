<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Endless Putt</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(1200px 700px at 50% 38%, #0d1a26, #05090e);
    display:flex;align-items:center;justify-content:center;
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;color:#f2e7c9;
    user-select:none;-webkit-user-select:none;
  }
  :root{--disp:Impact,'Arial Black','Franklin Gothic Medium',sans-serif}
  #stage{position:relative;overflow:hidden}
  canvas{display:block;touch-action:none;background:#0a141d;border-radius:6px}
  .hidden{display:none!important}
  .screen{
    position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%, rgba(12,24,36,.80), rgba(4,9,14,.94));
    animation:scrIn .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes scrIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .flag{animation:wave 2.8s ease-in-out infinite;transform-origin:32px 74px}
  @keyframes wave{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(3deg)}}
  h1{font-family:var(--disp);font-size:clamp(46px,9vw,86px);line-height:.92;letter-spacing:2px;
     color:#f2e7c9;text-shadow:0 3px 0 #d9744a,0 6px 0 #7a2f1a,0 16px 28px rgba(0,0,0,.55)}
  h1 span{color:#58d68d;text-shadow:0 3px 0 #1d7a3e,0 6px 0 #0c3b20,0 16px 28px rgba(0,0,0,.55)}
  h2{font-family:var(--disp);font-size:clamp(40px,7vw,64px);letter-spacing:3px;color:#ff5a4e;
     text-shadow:0 3px 0 #7a1f18,0 8px 0 rgba(0,0,0,.35),0 16px 28px rgba(0,0,0,.5)}
  .tag{max-width:520px;font-size:15px;color:#cfe3f5;line-height:1.5}
  .tag em{color:#ffd166;font-style:normal;font-weight:bold}
  .how{display:flex;flex-direction:column;gap:8px;margin-top:4px;font-size:13px;color:#9fb8cc}
  kbd{font-family:var(--disp);font-size:12px;letter-spacing:1px;color:#cfe3f5;background:#1b2a38;
      border:1px solid #3a4f63;border-bottom-width:3px;border-radius:5px;padding:3px 9px;margin:0 2px}
  button.big{
    font-family:var(--disp);font-size:24px;letter-spacing:3px;color:#06210f;background:#3ec56b;
    border:none;border-radius:9px;padding:15px 48px;margin-top:8px;cursor:pointer;
    box-shadow:0 6px 0 #1d7a3e,0 12px 22px rgba(0,0,0,.5);
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  }
  button.big:hover{transform:translateY(-3px);background:#4bda79;box-shadow:0 9px 0 #1d7a3e,0 18px 26px rgba(0,0,0,.55)}
  button.big:active{transform:translateY(2px);box-shadow:0 2px 0 #1d7a3e,0 6px 12px rgba(0,0,0,.5)}
  button.big:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
  .best{font-family:var(--disp);letter-spacing:2px;font-size:14px;color:#ffd166}
  .iconbtn{
    position:absolute;top:10px;right:10px;z-index:8;font-family:var(--disp);font-size:11px;letter-spacing:1.5px;
    color:#cfe3f5;background:rgba(12,22,32,.7);border:1px solid #3a4f63;border-radius:6px;
    padding:6px 10px;cursor:pointer;transition:all .15s ease;
  }
  .iconbtn:hover{background:#1b2a38;transform:translateY(-1px)}
  .stats{display:flex;gap:0;margin-top:4px}
  .stat{padding:6px 26px;border-left:1px solid rgba(255,255,255,.12)}
  .stat:first-child{border-left:none}
  .stat b{display:block;font-family:var(--disp);font-size:34px;letter-spacing:1px;color:#f2e7c9}
  .stat span{font-size:10px;letter-spacing:2px;color:#9fb8cc}
  .badge{
    font-family:var(--disp);letter-spacing:2px;font-size:15px;color:#3a2604;background:#ffd166;
    padding:7px 20px;border-radius:20px;animation:pulse 1s ease-in-out infinite;
    box-shadow:0 4px 14px rgba(255,209,102,.35);
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .reach{font-size:13px;color:#9fb8cc;letter-spacing:1px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="sndBtn" class="iconbtn" title="Toggle sound (M)">SOUND ON</button>

  <div class="screen" id="startScr">
    <svg class="flag" viewBox="0 0 64 80" width="58" aria-hidden="true">
      <ellipse cx="32" cy="74" rx="16" ry="4" fill="#14263a"/>
      <rect x="30" y="6" width="4" height="66" rx="2" fill="#eadfc0"/>
      <path d="M34 10 C44 7,52 15,60 11 L60 27 C52 31,44 23,34 29 Z" fill="#ff5a4e" stroke="rgba(0,0,0,.25)"/>
    </svg>
    <h1>ENDLESS<br><span>PUTT</span></h1>
    <p class="tag">The course never ends — <em>your putter does.</em> Beat par to build a streak. Run out of strokes and you drop a ball. Three balls, then it's over.</p>
    <div class="how">
      <div><kbd>DRAG</kbd> anywhere to aim &amp; set power · <kbd>RELEASE</kbd> to putt</div>
      <div><kbd>P</kbd> pause &nbsp; <kbd>M</kbd> sound &nbsp; <kbd>R</kbd> restart</div>
    </div>
    <button class="big" id="playBtn">TEE OFF</button>
    <p class="best" id="bestLine"></p>
  </div>

  <div class="screen hidden" id="overScr">
    <h2>GAME OVER</h2>
    <div class="badge hidden" id="newBest">★ NEW BEST ★</div>
    <div class="stats">
      <div class="stat"><b id="oHoles">0</b><span>HOLES CLEARED</span></div>
      <div class="stat"><b id="oScore">0</b><span>SCORE</span></div>
      <div class="stat"><b id="oStrokes">0</b><span>STROKES</span></div>
    </div>
    <p class="reach" id="oReach"></p>
    <button class="big" id="againBtn">PUTT AGAIN</button>
  </div>
</div>

<script>
'use strict';
/* ============================ SETUP ============================ */
const W=960,H=540,COLS=15,ROWS=8,CELL=60,OX=30,OY=30,FW=COLS*CELL,FH=ROWS*CELL,TAU=Math.PI*2;
const REST=0.86, CUP_R=12, BALL_R=9, MAXDRAG=180, MAXSPD=MAXDRAG*4.7;
const F_D='Impact,"Arial Black","Franklin Gothic Medium",sans-serif';
const F_B='"Trebuchet MS",Verdana,sans-serif';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');

function fit(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const s=Math.max(0.3,Math.min((innerWidth-14)/W,(innerHeight-14)/H));
  const cw=Math.floor(W*s), chh=Math.floor(cw*H/W);
  stage.style.width=cw+'px';stage.style.height=chh+'px';
  cv.style.width=cw+'px';cv.style.height=chh+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(chh*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
addEventListener('resize',fit);fit();

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
let best=store.get('endlessPutt.best',{score:0,hole:1});

function rrect(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function easeOutBack(x){const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function mixCol(a,b,t){
  const A=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const B=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  return 'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';
}

/* ============================ AUDIO ============================ */
let actx=null,master=null,muted=false;
function initAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=0.5;master.connect(actx.destination);}catch(e){}}
function ensureAudio(){initAudio();if(actx&&actx.state==='suspended')actx.resume();}
function tone(f,dur,type,vol,slideTo,delay){
  if(!actx||muted)return;const t=actx.currentTime+(delay||0);
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,f0,f1,ftype,delay){
  if(!actx||muted)return;const t=actx.currentTime+(delay||0);
  const n=Math.max(8,Math.floor(actx.sampleRate*dur));
  const b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource();s.buffer=b;
  const f=actx.createBiquadFilter();f.type=ftype||'lowpass';
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  const g=actx.createGain();g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const sfx={
  putt:p=>{noise(.07,.2*p,900,250);tone(150+p*60,.1,'sine',.28,70);},
  wall:v=>{noise(.05,Math.min(.3,v/2600),1400,300);},
  bump:()=>{tone(920,.1,'square',.1,1300);tone(1500,.08,'sine',.07,0,.012);},
  sand:()=>noise(.18,.14,700,180),
  water:()=>{noise(.4,.3,2600,240,'bandpass');tone(320,.25,'sine',.12,80);},
  sink:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.16,'triangle',.2,0,i*.09));noise(.3,.07,4000,2000,'highpass',.1);},
  lose:()=>{tone(220,.22,'sawtooth',.18,110);tone(150,.3,'square',.12,70,.12);},
  banner:()=>{tone(440,.09,'triangle',.14);tone(660,.12,'triangle',.14,0,.08);},
  click:()=>tone(700,.05,'square',.07)
};

/* ============================ STATE ============================ */
let state='menu',paused=false,time=0;
let hole=1,par=3,maxStrokes=5,strokes=0,score=0,shownScore=0,streak=0,hearts=3,totalStrokes=0;
let runSalt=(Math.random()*1e9)>>>0,holeSeed=1;
let grid=[],noiseArr=[],cellFill=[],wallFill=[],sandCells=[],waterCells=[],sandDots=[],bumpers=[],gates=[];
let startCell={x:0,y:3},cupCell={x:COLS-1,y:4},tee={x:0,y:0},cup={x:0,y:0};
let ball={x:0,y:0,vx:0,vy:0,r:BALL_R},restPos={x:0,y:0};
let wind={x:0,y:0};
let trail=[],particles=[],floats=[];
let bannerT=0,bannerSub='',ballPop=0,sinkT=0,scored=false,nextAt=0,flagDrop=0,sinkFrom={x:0,y:0};
let shake=0,flashT=0;
let aim={on:false,px:0,py:0};
const dots=[];for(let i=0;i<14;i++)dots.push({x:Math.random()*W,y:Math.random()*H,ph:Math.random()*TAU,r:1.5+Math.random()*2});

const cellCenter=(cx,cy)=>({x:OX+cx*CELL+CELL/2,y:OY+cy*CELL+CELL/2});
function gateRect(g){
  const a=cellCenter(g.ax,g.ay),b=cellCenter(g.bx,g.by);
  const k=.5+.5*Math.sin(g.t);
  return {x:a.x+(b.x-a.x)*k-21,y:a.y+(b.y-a.y)*k-7,w:42,h:14};
}

/* ============================ GENERATION ============================ */
function bfs(){
  const q=[[startCell.x,startCell.y]],dep=new Map();
  dep.set(startCell.x+','+startCell.y,0);
  while(q.length){
    const p=q.shift(),x=p[0],y=p[1],dd=dep.get(x+','+y);
    if(x===cupCell.x&&y===cupCell.y)return dd;
    for(const a of [[-1,0],[1,0],[0,-1],[0,1]]){
      const nx=x+a[0],ny=y+a[1];
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS)continue;
      const k=nx+','+ny;
      if(grid[ny][nx]!==0||dep.has(k))continue;
      dep.set(k,dd+1);q.push([nx,ny]);
    }
  }
  return COLS;
}

function genHole(fresh){
  if(fresh)holeSeed=(runSalt+hole*971)>>>0;
  const rnd=mulberry32(holeSeed);
  grid=[];noiseArr=[];cellFill=[];wallFill=[];sandCells=[];waterCells=[];sandDots=[];bumpers=[];gates=[];
  for(let y=0;y<ROWS;y++){grid.push(new Array(COLS).fill(1));noiseArr.push(new Array(COLS).fill(0));}
  const sy=1+Math.floor(rnd()*(ROWS-2)),cyv=1+Math.floor(rnd()*(ROWS-2));
  startCell={x:0,y:sy};cupCell={x:COLS-1,y:cyv};
  const carve=(x,y)=>{if(x>=0&&x<COLS&&y>=0&&y<ROWS)grid[y][x]=0;};
  let cx=0,cyy=sy,guard=0;
  carve(0,sy);
  while(!(cx===COLS-1&&cyy===cyv)&&guard++<500){
    let mv;
    if(rnd()<.22&&cx!==COLS-1){const s=rnd()<.5?-1:1;if(cyy+s>=0&&cyy+s<ROWS)mv=[0,s];else mv=[1,0];}
    else if(cx!==COLS-1&&(cyy===cyv||rnd()<.6))mv=[1,0];
    else mv=[0,cyy<cyv?1:-1];
    cx=clamp(cx+mv[0],0,COLS-1);cyy=clamp(cyy+mv[1],0,ROWS-1);
    carve(cx,cyy);
  }
  carve(COLS-1,cyv);
  const wP=Math.max(.3,.85-hole*.04),pP=Math.min(.3,.1+hole*.02);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]===0){
      if(rnd()<wP){const s=rnd()<.5?-1:1;rnd()<.5?carve(x,y+s):carve(x+s,y);}
      else if(rnd()<pP){const a=[[-1,-1],[1,1],[-1,1],[1,-1]][(rnd()*4)|0];carve(x+a[0],y+a[1]);}
    }
  }
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const s=Math.floor(rnd()*3)-1;noiseArr[y][x]=s;
    if(!cellFill[y])cellFill.push(new Array(COLS).fill(''));if(!wallFill[y])wallFill.push(new Array(COLS).fill(''));
    cellFill[y][x]='rgb('+(243+s*6)+','+(232+s*5)+','+(202+s*4)+')';
    wallFill[y][x]='rgb('+(168+s*9)+','+(94+s*7)+','+(46+s*4)+')';
  }
  const len=bfs();
  par=clamp(2+Math.round(len/9)+(hole>=12?1:0),2,6);
  maxStrokes=par+2;
  tee=cellCenter(startCell.x,startCell.y);cup=cellCenter(cupCell.x,cupCell.y);

  const cand=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]!==0)continue;
    const d1=Math.max(Math.abs(x-startCell.x),Math.abs(y-startCell.y));
    const d2=Math.max(Math.abs(x-cupCell.x),Math.abs(y-cupCell.y));
    if(d1>=2&&d2>=2)cand.push({x,y});
  }
  for(let i=cand.length-1;i>0;i--){const j=(rnd()*(i+1))|0;const t=cand[i];cand[i]=cand[j];cand[j]=t;}
  const used=new Set();
  const take=()=>{for(const c of cand)if(!used.has(c.x+','+c.y)){used.add(c.x+','+c.y);return c;}return null;};
  const at=(x,y)=>(x>=0&&x<COLS&&y>=0&&y<ROWS)?grid[y][x]===0:false;

  if(hole>=2){ // bumpers — need an open cross so the path stays passable
    const nb=Math.min(3,Math.floor(hole/3)+(hole>=4?1:0));let n=0;
    for(const c of cand){
      if(n>=nb)continue;if(used.has(c.x+','+c.y))continue;
      const v=(at(c.x,c.y-1)?1:0)+(at(c.x,c.y+1)?1:0);
      const h=(at(c.x-1,c.y)?1:0)+(at(c.x+1,c.y)?1:0);
      if(v>=2&&h>=2){used.add(c.x+','+c.y);const p=cellCenter(c.x,c.y);bumpers.push({x:p.x,y:p.y,r:13,flash:0});n++;}
    }
  }
  if(hole>=3){const ns=Math.min(3,Math.floor(hole/3));let n=0;while(n<ns){const c=take();if(!c)break;sandCells.push(c);
    for(let i=0;i<7;i++)sandDots.push({x:OX+c.x*CELL+6+rnd()*48,y:OY+c.y*CELL+6+rnd()*48});n++;}}
  if(hole>=4){const nw=Math.min(3,Math.floor((hole-2)/3)+(hole>=8?1:0));let n=0;while(n<nw){const c=take();if(!c)break;waterCells.push(c);n++;}}
  if(hole>=6){ // sliding gates — prefer pairs with an escape route
    const ng=Math.min(2,Math.floor((hole-4)/3)+(hole>=9?1:0));let n=0,gd=0;
    outer:for(let y=0;y<ROWS;y++)for(let x=0;x<COLS-1;x++){
      if(n>=ng||gd++>2000)break outer;
      if(grid[y][x]!==0||grid[y][x+1]!==0)continue;
      if(used.has(x+','+y)||used.has((x+1)+','+y))continue;
      const d1=Math.max(Math.abs(x-startCell.x),Math.abs(y-startCell.y));
      const d2=Math.max(Math.abs(x+1-cupCell.x),Math.abs(y-cupCell.y));
      const d3=Math.max(Math.abs(x-cupCell.x),Math.abs(y-cupCell.y));
      const d4=Math.max(Math.abs(x+1-startCell.x),Math.abs(y-cupCell.y));
      if(d1<2||d2<2||d3<2||d4<2)continue;
      const escA=at(x-1,y)+at(x+1,y)+at(x,y-1)+at(x,y+1)>1;
      const escB=at(x,y-1)+at(x,y+1)+at(x+2,y)+at(x,y+1)?(at(x,y-1)||at(x,y+1)):false;
      if(!(escA||(at(x,y-1)&&!at(x-1,y))||(at(x,y+1)&&!at(x-1,y)))){ /* strict-ish: some escape preferred */ }
      used.add(x+','+y);used.add((x+1)+','+y);
      gates.push({ax:x,ay:y,bx:x+1,by:y,axis:'x',t:rnd()*TAU,speed:Math.min(2.4,1.1+hole*.06)});n++;
    }
  }
  wind={x:0,y:0};
  if(hole>=6){const m=Math.min(70,16+rnd()*26+hole*.8),a=rnd()*TAU;wind={x:Math.cos(a)*m,y:Math.sin(a)*m};}

  bannerSub=hole===2?'NEW: BUMPERS':hole===3?'NEW: SAND TRAPS':hole===4?'NEW: WATER HAZARDS':hole===6?'NEW: WIND & SLIDING GATES':'';
  ball.x=tee.x;ball.y=tee.y;ball.vx=0;ball.vy=0;
  restPos={x:ball.x,y:ball.y};
  trail.length=0;particles.length=0;floats.length=0;
  flagDrop=0;sinkT=0;scored=false;strokes=0;ballPop=1;
}

/* ============================ PARTICLES / FLOATS ============================ */
function puffAt(x,y,nx,ny,v){for(let i=0;i<6;i++){const a=Math.atan2(ny,nx)+(Math.random()-.5)*1.6;const s=40+Math.random()*v*.35;
  particles.push({t:0,life:.4,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0,r:2+Math.random()*2,col:'rgba(255,255,255,.8)',type:'dot'});}}
function sparkAt(x,y){for(let i=0;i<9;i++){const a=Math.random()*TAU,s=90+Math.random()*160;
  particles.push({t:0,life:.45,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:120,r:2+Math.random()*2,col:'#ffd166',type:'dot'});}}
function splashFx(x,y){for(let i=0;i<16;i++){const a=-Math.PI/2+(Math.random()-.5)*1.8,s=90+Math.random()*200;
  particles.push({t:0,life:.6,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:700,r:2+Math.random()*2,col:'#7cc0ff',type:'dot'});}
  particles.push({t:0,life:.5,x,y,vx:0,vy:0,g:0,r:6,vr:90,col:'rgba(140,200,255,.8)',type:'ring'});}
function confetti(n){const cols=['#3ec56b','#ffd166','#ff5a4e','#f2e7c9','#7cc0ff'];
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,s=120+Math.random()*230;
    particles.push({t:0,life:.9+Math.random()*.6,x:cup.x,y:cup.y-6,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:480,
      r:3.5+Math.random()*3.5,col:cols[(Math.random()*cols.length)|0],type:'rect',rot:Math.random()*TAU,vr:(Math.random()-.5)*12});}}
function dustAt(x,y){particles.push({t:0,life:.35,x:x+(Math.random()-.5)*8,y:y+(Math.random()-.5)*8,
  vx:(Math.random()-.5)*30,vy:-20-Math.random()*30,g:0,r:1.5+Math.random()*1.5,col:'rgba(214,186,120,.8)',type:'dot'});}
function updParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;
  if(p.t>=p.life){particles.splice(i,1);continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;if(p.rot!==undefined)p.rot+=p.vr*dt;}}
function updFloats(dt){for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;if(f.t>=f.life)floats.splice(i,1);}}
function updDots(dt){for(const d of dots){d.x+=(Math.cos(d.ph)*6+wind.x*.55)*dt;d.y+=(Math.sin(d.ph)*6+wind.y*.55)*dt;
  if(d.x<-12)d.x=W+12;if(d.x>W+12)d.x=-12;if(d.y<-12)d.y=H+12;if(d.y>H+12)d.y=-12;}}

/* ============================ PHYSICS ============================ */
function solidPx(px,py){
  if(px<OX+BALL_R||px>OX+FW-BALL_R||py<OY+BALL_R||py>OY+FH-BALL_R)return true;
  const cx=(px-OX)/CELL|0,cy=(py-OY)/CELL|0;
  if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS&&grid[cy][cx]===1)return true;
  for(const b of bumpers){const dx=px-b.x,dy=py-b.y;if(dx*dx+dy*dy<(b.r+BALL_R)*(b.r+BALL_R))return true;}
  for(const g of gates){const r=gateRect(g);if(px>r.x-BALL_R&&px<r.x+r.w+BALL_R&&py>r.y-BALL_R&&py<r.y+r.h+BALL_R)return true;}
  return false;
}
function circleRect(rx,ry,rw,rh){
  const cxp=clamp(ball.x,rx,rx+rw),cyp=clamp(ball.y,ry,ry+rh);
  let dx=ball.x-cxp,dy=ball.y-cyp;const d2=dx*dx+dy*dy;
  if(d2>=ball.r*ball.r)return;
  let nx,ny;
  if(d2<1e-6){
    const l=ball.x-rx,rg=rx+rw-ball.x,tp=ball.y-ry,bt=ry+rh-ball.y,m=Math.min(l,rg,tp,bt);
    if(m===l){nx=-1;ny=0;}else if(m===rg){nx=1;ny=0;}else if(m===tp){nx=0;ny=-1;}else{nx=0;ny=1;}
  }else{const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;}
  ball.x=cxp+nx*ball.r;ball.y=cyp+ny*ball.r;
  const vn=ball.vx*nx+ball.vy*ny;
  if(vn<0){const j=-(1+REST)*vn;ball.vx+=j*nx;ball.vy+=j*ny;
    if(-vn>90){sfx.wall(-vn);puffAt(cxp,cyp,nx,ny,-vn);shake=Math.min(5,-vn/260);}}
}
function stepBall(h){
  const cx=(ball.x-OX)/CELL|0,cy=(ball.y-OY)/CELL|0;
  let fr=260,inSand=false;
  if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS&&sandCells.some(c=>c.x===cx&&c.y===cy)){fr=950;inSand=true;}
  ball.vx+=wind.x*h;ball.vy+=wind.y*h;
  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp>0){const dec=fr*h;if(dec>=sp){ball.vx=0;ball.vy=0;}else{const k=(sp-dec)/sp;ball.vx*=k;ball.vy*=k;}}
  ball.x+=ball.vx*h;ball.y+=ball.vy*h;
  // frame
  let hit=0;
  if(ball.x<OX+ball.r){ball.x=OX+ball.r;if(ball.vx<0){hit=Math.abs(ball.vx);ball.vx*=-REST;}}
  else if(ball.x>OX+FW-ball.r){ball.x=OX+FW-ball.r;if(ball.vx>0){hit=Math.abs(ball.vx);ball.vx*=-REST;}}
  if(ball.y<OY+ball.r){ball.y=OY+ball.r;if(ball.vy<0){if(hit===0)hit=Math.abs(ball.vy);ball.vy*=-REST;}}
  else if(ball.y>OY+FH-ball.r){ball.y=OY+FH-ball.r;if(ball.vy>0){if(hit===0)hit=Math.abs(ball.vy);ball.vy*=-REST;}}
  if(hit>120){sfx.wall(hit);shake=Math.min(5,hit/260);}
  // wall cells
  const x0=Math.max(0,((ball.x-OX-ball.r)/CELL)|0),x1=Math.min(COLS-1,((ball.x-OX+ball.r)/CELL)|0);
  const y0=Math.max(0,((ball.y-OY-ball.r)/CELL)|0),y1=Math.min(ROWS-1,((ball.y-OY+ball.r)/CELL)|0);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(grid[y][x]===1)circleRect(OX+x*CELL,OY+y*CELL,CELL,CELL);
  // gates
  for(const g of gates){const r=gateRect(g);circleRect(r.x,r.y,r.w,r.h);}
  // bumpers
  for(const b of bumpers){
    const dx=ball.x-b.x,dy=ball.y-b.y,rr=b.r+ball.r,d2=dx*dx+dy*dy;
    if(d2<rr*rr&&d2>1e-6){
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      ball.x=b.x+nx*rr;ball.y=b.y+ny*rr;
      const vn=ball.vx*nx+ball.vy*ny;if(vn<0){ball.vx-=2*vn*nx;ball.vy-=2*vn*ny;}
      const s=Math.hypot(ball.vx,ball.vy);if(s<380){const k=380/(s||1);ball.vx*=k;ball.vy*=k;}
      b.flash=1;sfx.bump();shake=4;sparkAt(b.x,b.y);
    }
  }
  // water
  if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS&&waterCells.some(c=>c.x===cx&&c.y===cy)){
    splashFx(ball.x,ball.y);sfx.water();
    floats.push({x:ball.x,y:ball.y-24,txt:'SPLASH!',t:0,life:1.2,col:'#7cc0ff',size:18});
    ball.x=restPos.x;ball.y=restPos.y;ball.vx=0;ball.vy=0;state='aim';
    if(strokes>=maxStrokes)loseHeart();
    return;
  }
  // sand dust
  if(inSand&&Math.hypot(ball.vx,ball.vy)>50&&Math.random()<.35)dustAt(ball.x,ball.y);
  // cup
  const dx2=ball.x-cup.x,dy2=ball.y-cup.y,d=Math.hypot(dx2,dy2),sp2=Math.hypot(ball.vx,ball.vy);
  if(d<CUP_R+BALL_R&&d>0.1){
    if(sp2<380){const pull=(1-d/(CUP_R+BALL_R))*2400;ball.vx+=dx2/d*pull*h;ball.vy+=dy2/d*pull*h;}
    if(d<CUP_R*.95&&sp2<260){doSink();return;}
  }
}
function doSink(){state='sinking';sinkT=0;scored=false;sinkFrom={x:ball.x,y:ball.y};sfx.sink();}

/* ============================ GAME FLOW ============================ */
function doPutt(power,ux,uy){
  const sp=power*4.7;ball.vx=ux*sp;ball.vy=uy*sp;
  strokes++;totalStrokes++;restPos={x:ball.x,y:ball.y};
  state='rolling';trail.length=0;sfx.putt(Math.min(1,power/MAXDRAG));
}
function applyScore(){
  const diff=strokes-par;let txt,col,pts;
  if(diff<=-2){txt='EAGLE!';col='#ffd166';pts=400;}
  else if(diff===-1){txt='BIRDIE!';col='#3ec56b';pts=250;}
  else if(diff===0){txt='PAR';col='#f2e7c9';pts=100;}
  else if(diff===1){txt='BOGEY';col='#ff9f43';pts=50;}
  else{txt='DOUBLE BOGEY';col='#ff5a4e';pts=25;}
  if(diff<=0){streak++;pts+=(streak-1)*50;}else streak=0;
  score+=pts;
  floats.push({x:cup.x,y:cup.y-36,txt,t:0,life:1.5,col,size:26});
  floats.push({x:cup.x,y:cup.y-10,txt:'+'+pts,t:0,life:1.5,col:'#ffffff',size:15});
  if(diff<0)confetti(diff<=-2?46:30);else if(diff===0)confetti(10);
}
function nextHole(){hole++;genHole(true);state='banner';bannerT=0;sfx.banner();}
function loseHeart(){
  hearts--;flashT=1;shake=8;sfx.lose();
  floats.push({x:ball.x,y:ball.y-24,txt:'OUT OF STROKES',t:0,life:1.6,col:'#ff5a4e',size:19});
  if(hearts<=0)endGame();
  else{genHole(false);bannerSub='RETRY — SAME COURSE';state='banner';bannerT=0;}
}
function startRun(){
  ensureAudio();sfx.click();
  runSalt=(Math.random()*1e9)>>>0;
  hole=1;score=0;shownScore=0;hearts=3;streak=0;totalStrokes=0;paused=false;
  document.getElementById('startScr').classList.add('hidden');
  document.getElementById('overScr').classList.add('hidden');
  genHole(true);state='banner';bannerT=0;sfx.banner();
}
function endGame(){
  state='gameover';
  const cleared=hole-1;let isNew=false;
  if(score>best.score){best={score:score,hole:hole};isNew=true;store.set('endlessPutt.best',best);}
  document.getElementById('oHoles').textContent=cleared;
  document.getElementById('oScore').textContent=score;
  document.getElementById('oStrokes').textContent=totalStrokes;
  document.getElementById('oReach').textContent='You reached hole '+hole+'.';
  document.getElementById('newBest').classList.toggle('hidden',!isNew);
  document.getElementById('overScr').classList.remove('hidden');
}

/* ============================ UPDATE ============================ */
function gameUpdate(dt){
  for(const g of gates)g.t+=g.speed*dt;
  for(const b of bumpers)b.flash=Math.max(0,b.flash-dt*2.5);
  ballPop=Math.max(0,ballPop-dt/.4);
  shownScore+=(score-shownScore)*Math.min(1,dt*8);if(Math.abs(score-shownScore)<1)shownScore=score;
  shake=Math.max(0,shake-dt*14);flashT=Math.max(0,flashT-dt*2);
  updParticles(dt);updFloats(dt);

  if(state==='banner'){bannerT+=dt;if(bannerT>=1.35){state='aim';ballPop=1;}}
  else if(state==='rolling'){
    const n=Math.max(1,Math.ceil(dt*120)),h=dt/n;
    for(let i=0;i<n&&state==='rolling';i++)stepBall(h);
    if(state==='rolling'){
      trail.push({x:ball.x,y:ball.y});if(trail.length>24)trail.shift();
      if(Math.hypot(ball.vx,ball.vy)<10){
        ball.vx=0;ball.vy=0;
        if(strokes>=maxStrokes)loseHeart();else state='aim';
      }
    }
  }
  else if(state==='sinking'){
    sinkT=Math.min(1,sinkT+dt/.5);flagDrop=sinkT;
    const k=sinkT*sinkT;
    ball.x=sinkFrom.x+(cup.x-sinkFrom.x)*k;ball.y=sinkFrom.y+(cup.y-sinkFrom.y)*k;
    if(sinkT>=1&&!scored){scored=true;applyScore();nextAt=time+.85;}
    if(scored&&time>=nextAt)nextHole();
  }
  if(state!=='rolling'&&trail.length)trail.splice(0,2);
}

/* ============================ RENDER ============================ */
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1b26');g.addColorStop(1,'#070d13');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  const sp=ctx.createRadialGradient(W/2+Math.sin(time*.23)*170,H/2-40+Math.cos(time*.19)*110,60,W/2,H/2,520);
  sp.addColorStop(0,'rgba(255,214,140,.10)');sp.addColorStop(1,'rgba(255,214,140,0)');
  ctx.fillStyle=sp;ctx.fillRect(-20,-20,W+40,H+40);
  for(const d of dots){ctx.globalAlpha=.07;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
}
function drawCourse(){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=26;ctx.shadowOffsetY=10;
  ctx.fillStyle='#6b4423';rrect(12,12,W-24,H-24,16);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#c98d4e';rrect(OX-7,OY-7,FW+14,FH+14,8);ctx.fill();
  ctx.fillStyle='#e9dcb8';ctx.fillRect(OX,OY,FW,FH);
  // fairway + sand base
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const px=OX+x*CELL,py=OY+y*CELL;
    if(grid[y][x]===0){ctx.fillStyle=cellFill[y][x];ctx.fillRect(px,py,CELL,CELL);}
  }
  for(const c of sandCells){const px=OX+c.x*CELL,py=OY+c.y*CELL;
    ctx.fillStyle='#e6cd8f';ctx.fillRect(px+1,py+1,CELL-2,CELL-2);
    ctx.fillStyle='rgba(160,130,60,.5)';
    for(const d of sandDots){if(d.x>=px&&d.x<px+CELL&&d.y>=py&&d.y<py+CELL){ctx.beginPath();ctx.arc(d.x,d.y,1.4,0,TAU);ctx.fill();}}
  }
  // water (animated)
  for(const c of waterCells){const x=OX+c.x*CELL,y=OY+c.y*CELL;
    ctx.fillStyle='#2f7fd0';ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
    ctx.save();ctx.beginPath();ctx.rect(x+4,y+4,CELL-8,CELL-8);ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;
    for(let k=0;k<3;k++){const yy=y+16+k*13;ctx.beginPath();
      for(let xx=x;xx<=x+CELL;xx+=4){const wy=yy+Math.sin(time*2.2+xx*.15+k*1.7)*3;xx===x?ctx.moveTo(xx,wy):ctx.lineTo(xx,wy);}
      ctx.stroke();}
    ctx.restore();
    ctx.strokeStyle='rgba(8,40,90,.5)';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
  }
  // walls (bevelled blocks)
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]!==1)continue;
    const px=OX+x*CELL+1,py=OY+y*CELL+1,w=CELL-2,h=CELL-2;
    ctx.fillStyle=wallFill[y][x];rrect(px,py,w,h,5);ctx.fill();
    ctx.fillStyle='rgba(255,235,200,.18)';ctx.fillRect(px+3,py+2,w-6,3);ctx.fillRect(px+2,py+3,3,h-6);
    ctx.fillStyle='rgba(60,25,5,.35)';ctx.fillRect(px+3,py+h-5,w-6,3);ctx.fillRect(px+w-5,py+3,3,h-6);
  }
  // tee ring
  ctx.strokeStyle='rgba(120,90,40,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(tee.x,tee.y,11,0,TAU);ctx.stroke();
  // cup patch + hole
  ctx.fillStyle='rgba(160,130,70,.25)';ctx.beginPath();ctx.arc(cup.x,cup.y,24,0,TAU);ctx.fill();
  ctx.fillStyle='#171008';ctx.beginPath();ctx.arc(cup.x,cup.y,CUP_R,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cup.x,cup.y,CUP_R-1,0,TAU);ctx.stroke();
}
function drawGates(){
  for(const g of gates){const r=gateRect(g);
    ctx.fillStyle='rgba(0,0,0,.25)';rrect(r.x+3,r.y+4,r.w,r.h,5);ctx.fill();
    ctx.fillStyle='#e0a25e';rrect(r.x,r.y,r.w,r.h,5);ctx.fill();
    ctx.strokeStyle='#7a4a1f';ctx.lineWidth=2;rrect(r.x+1,r.y+1,r.w-2,r.h-2,4);ctx.stroke();
    ctx.fillStyle='rgba(122,74,31,.5)';
    if(g.axis==='x')ctx.fillRect(r.x+r.w/2-6,r.y+3,12,r.h-6);else ctx.fillRect(r.x+3,r.y+r.h/2-6,r.w-6,12);
  }
}
function drawBumpers(){
  for(const b of bumpers){
    if(b.flash>0){const g=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,b.r*(1.4+b.flash));
      g.addColorStop(0,'rgba(255,80,90,'+(b.flash*.5)+')');g.addColorStop(1,'rgba(255,80,90,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*(1.4+b.flash),0,TAU);ctx.fill();}
    ctx.fillStyle='#ff4757';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,b.r-4.5,0,TAU);ctx.stroke();
    ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(b.x,b.y,3,0,TAU);ctx.fill();
  }
}
function drawTrail(){
  for(let i=0;i<trail.length;i++){const p=trail[i],a=(i/trail.length)*.3;
    ctx.fillStyle='rgba(223,232,238,'+a+')';
    ctx.beginPath();ctx.arc(p.x,p.y,2+(i/trail.length)*4,0,TAU);ctx.fill();}
}
function drawBall(){
  if(state==='sinking'&&sinkT>=1)return;
  let s=1;
  if(ballPop>0)s*=easeOutBack(1-ballPop);
  if(state==='sinking')s*=(1-sinkT);
  if(s<=.02)return;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(ball.x+2,ball.y+3,BALL_R*s*.9,BALL_R*s*.55,0,0,TAU);ctx.fill();
  const g=ctx.createRadialGradient(ball.x-3*s,ball.y-4*s,1,ball.x,ball.y,BALL_R*s);
  g.addColorStop(0,'#ffffff');g.addColorStop(.7,'#e8edf2');g.addColorStop(1,'#b9c4cd');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R*s,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(ball.x-3*s,ball.y-4*s,1.8*s,0,TAU);ctx.fill();
}
function drawAim(){
  if(state!=='aim'||!aim.on)return;
  const dx=ball.x-aim.px,dy=ball.y-aim.py,len=Math.hypot(dx,dy);
  if(len<8)return;
  const ux=dx/len,uy=dy/len,p=Math.min(MAXDRAG,len);
  const t=p/MAXDRAG,col=t<.5?mixCol('#6fe08f','#ffd166',t*2):mixCol('#ffd166','#ff5a4e',(t-.5)*2);
  // trajectory dots (bounces once)
  let bx=ball.x+ux*(BALL_R+2),by=ball.y+uy*(BALL_R+2),dxn=ux,dyn=uy,used=0,bnc=0,segUsed=0;
  const maxL=50+p*1.6;
  ctx.fillStyle=col;
  while(used<maxL){
    let nx=bx+dxn*5,ny=by+dyn*5;
    if(solidPx(nx,ny)){
      if(bnc>=1)break;bnc++;
      if(!solidPx(nx,by)){dyn=-dyn;ny=by-dyn*2;}else{dxn=-dxn;nx=bx-dxn*2;}
      segUsed=0;
    }
    bx=nx;by=ny;used+=5;segUsed+=5;
    if(bnc===1&&segUsed>60)break;
    ctx.globalAlpha=Math.max(.12,.85-used/maxL*1.3);
    ctx.beginPath();ctx.arc(bx,by,2.6,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  // power ring
  if(len>=6){ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(ball.x,ball.y,17,-Math.PI/2,-Math.PI/2+(p/MAXDRAG)*TAU);ctx.stroke();ctx.lineCap='butt';}
}
function drawFlag(){
  const fy=cup.y-46+flagDrop*38;
  ctx.globalAlpha=1-flagDrop*.85;
  ctx.strokeStyle='#f5efe0';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cup.x,cup.y-2);ctx.lineTo(cup.x,fy);ctx.stroke();
  ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(cup.x,fy,2.5,0,TAU);ctx.fill();
  const w=Math.sin(time*5)*3;
  ctx.beginPath();ctx.moveTo(cup.x+2,fy);
  ctx.quadraticCurveTo(cup.x+14,fy+2+w,cup.x+27,fy+7+w*.6);
  ctx.lineTo(cup.x+25,fy+10+w*.4);
  ctx.quadraticCurveTo(cup.x+14,fy+13-w,cup.x+2,fy+16);
  ctx.closePath();ctx.fillStyle='#ff5a4e';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.stroke();
  ctx.globalAlpha=1;
}
function drawParticles(){
  for(const p of particles){
    const a=1-p.t/p.life;
    if(p.type==='ring'){ctx.globalAlpha=a;ctx.strokeStyle=p.col;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+p.t*p.vr,0,TAU);ctx.stroke();}
    else if(p.type==='rect'){ctx.globalAlpha=a;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();}
    else{ctx.globalAlpha=a;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
  }
  ctx.globalAlpha=1;
}
function drawFloats(){
  for(const f of floats){
    const a=f.t>f.life-.4?Math.max(0,(f.life-f.t)/.4):1;
    ctx.globalAlpha=a;
    ctx.font='bold '+f.size+'px '+F_D;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';
    const y=f.y-f.t*30;
    ctx.strokeText(f.txt,f.x,y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,y);
  }
  ctx.globalAlpha=1;
}
function chip(x,y,w,h){
  ctx.fillStyle='rgba(6,12,18,.55)';rrect(x,y,w,h,9);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.09)';ctx.lineWidth=1;rrect(x+.5,y+.5,w-1,h-1,9);ctx.stroke();
}
function drawHUD(){
  ctx.textBaseline='alphabetic';
  // hole / par
  chip(14,12,158,48);
  ctx.fillStyle='#9fb8cc';ctx.font='10px '+F_B;ctx.textAlign='left';ctx.fillText('H O L E',28,30);
  ctx.fillStyle='#f2e7c9';ctx.font='24px '+F_D;ctx.fillText(hole,28,52);
  ctx.fillStyle='#9fb8cc';ctx.font='10px '+F_B;ctx.fillText('P A R',118,30);
  ctx.fillStyle='#ffd166';ctx.font='20px '+F_D;ctx.fillText(par,120,52);
  // score
  chip(W/2-78,10,156,48);
  ctx.textAlign='center';
  ctx.fillStyle='#9fb8cc';ctx.font='10px '+F_B;ctx.fillText('S C O R E',W/2,27);
  ctx.fillStyle='#f2e7c9';ctx.font='26px '+F_D;ctx.fillText(Math.round(shownScore),W/2,51);
  if(streak>=2){chip(W/2-54,62,108,22);
    ctx.fillStyle='#ffd166';ctx.font='bold 12px '+F_B;ctx.fillText('×'+streak+' STREAK',W/2,77);}
  // balls (hearts) — shifted left of the sound button
  chip(W-290,12,120,48);
  ctx.textAlign='left';ctx.fillStyle='#9fb8cc';ctx.font='10px '+F_B;ctx.fillText('B A L L S',W-276,30);
  ctx.font='19px '+F_B;
  for(let i=0;i<3;i++){ctx.fillStyle=i<hearts?'#ff5a4e':'rgba(255,255,255,.15)';
    ctx.fillText('\u2665\uFE0E',W-278+i*30,52);}
  // strokes pips
  chip(14,H-60,158,46);
  ctx.fillStyle='#9fb8cc';ctx.font='10px '+F_B;ctx.fillText('S T R O K E S',28,H-43);
  const pipCol=strokes>=maxStrokes-1?'#ff9f43':'#f2e7c9';
  for(let i=0;i<maxStrokes;i++){const px=32+i*15,py=H-28;
    if(i<strokes){ctx.fillStyle=pipCol;ctx.beginPath();ctx.arc(px,py,4.5,0,TAU);ctx.fill();}
    else{ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,4.5,0,TAU);ctx.stroke();}}
  ctx.fillStyle='#cfe3f5';ctx.font='bold 12px '+F_B;ctx.textAlign='right';
  ctx.fillText(strokes+'/'+maxStrokes,160,H-24);
  // wind
  if(Math.hypot(wind.x,wind.y)>.5){
    chip(W-184,H-60,120,46);
    ctx.textAlign='left';ctx.fillStyle='#9fb8cc';ctx.font='10px '+F_B;ctx.fillText('W I N D',W-170,H-43);
    const a=Math.atan2(wind.y,wind.x),cxw=W-124,cyw=H-31;
    ctx.save();ctx.translate(cxw,cyw);ctx.rotate(a);
    ctx.strokeStyle='#7cc0ff';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(8,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(2,-5);ctx.lineTo(10,0);ctx.lineTo(2,5);ctx.stroke();
    ctx.restore();ctx.lineCap='butt';
    const mag=Math.hypot(wind.x,wind.y)/70;
    for(let i=0;i<3;i++){ctx.fillStyle=i<Math.ceil(mag*3)?'#7cc0ff':'rgba(255,255,255,.15)';
      ctx.fillRect(W-98+i*9,H-40,6,14);}
  }
  // hint
  if(hole<=2&&state==='aim'&&strokes===0){
    ctx.globalAlpha=.5+.3*Math.sin(time*3);
    ctx.fillStyle='#cfe3f5';ctx.font='13px '+F_B;ctx.textAlign='center';
    ctx.fillText('DRAG ANYWHERE · RELEASE TO PUTT',W/2,H-16);
    ctx.globalAlpha=1;
  }
}
function drawBanner(){
  if(state!=='banner')return;
  const t=bannerT;
  const a=Math.min(1,t/.22)*(t>1?Math.max(0,1-(t-1)/.35):1);
  const sc=1+(1-Math.min(1,t/.3))*.4;
  ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H/2-24);ctx.scale(sc,sc);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='58px '+F_D;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillText('HOLE '+hole,3,3);
  ctx.fillStyle='#f2e7c9';ctx.fillText('HOLE '+hole,0,0);
  ctx.font='20px '+F_D;ctx.fillStyle='#ffd166';ctx.fillText('P A R   '+par,0,34);
  if(bannerSub){ctx.font='bold 13px '+F_B;ctx.fillStyle='#9fb8cc';ctx.fillText(bannerSub,0,58);}
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-160,14);ctx.lineTo(-100,14);ctx.moveTo(100,14);ctx.lineTo(160,14);ctx.stroke();
  ctx.restore();
}
function drawPaused(){
  ctx.fillStyle='rgba(4,9,14,.7)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='52px '+F_D;ctx.fillStyle='#f2e7c9';ctx.fillText('PAUSED',W/2,H/2-6);
  ctx.font='13px '+F_B;ctx.fillStyle='#9fb8cc';ctx.fillText('P — RESUME      R — RESTART',W/2,H/2+26);
}
function render(){
  const sx=(Math.random()*2-1)*shake,sy=(Math.random()*2-1)*shake;
  ctx.save();ctx.translate(sx,sy);
  drawBG();drawCourse();drawGates();drawBumpers();drawTrail();drawBall();drawFlag();
  drawAim();drawParticles();drawFloats();
  ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.85);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(state!=='menu')drawHUD();
  drawBanner();
  if(flashT>0){ctx.fillStyle='rgba(255,60,50,'+(flashT*.18)+')';ctx.fillRect(0,0,W,H);}
  if(paused)drawPaused();
}

/* ============================ INPUT ============================ */
function toGame(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  if(state!=='aim'||paused)return;
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  const p=toGame(e);aim.on=true;aim.px=p.x;aim.py=p.y;
});
window.addEventListener('pointermove',e=>{if(aim.on){const p=toGame(e);aim.px=p.x;aim.py=p.y;}});
window.addEventListener('pointerup',()=>{
  if(!aim.on)return;aim.on=false;
  if(state!=='aim'||paused)return;
  const dx=ball.x-aim.px,dy=ball.y-aim.py,len=Math.hypot(dx,dy);
  if(len>=12)doPutt(Math.min(MAXDRAG,len),dx/len,dy/len);
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',()=>ensureAudio(),{once:false});

window.addEventListener('keydown',e=>{
  ensureAudio();
  const k=e.key.toLowerCase();
  if(k==='m'){toggleMute();}
  else if(k==='r'){startRun();}
  else if(k==='p'||k==='escape'){if(state!=='menu'&&state!=='gameover')paused=!paused;}
  else if(k===' '||k==='enter'){
    if(state==='menu'||state==='gameover')startRun();
    e.preventDefault();
  }
});

const sndBtn=document.getElementById('sndBtn');
function toggleMute(){muted=!muted;sndBtn.textContent=muted?'SOUND OFF':'SOUND ON';if(!muted){ensureAudio();sfx.click();}}
sndBtn.addEventListener('click',toggleMute);
document.getElementById('playBtn').addEventListener('click',startRun);
document.getElementById('againBtn').addEventListener('click',startRun);

/* ============================ BOOT & LOOP ============================ */
function refreshBestLine(){
  const el=document.getElementById('bestLine');
  el.textContent=best.score>0?('BEST SCORE '+best.score+'  ·  REACHED HOLE '+best.hole):'NO ROUNDS YET — THE COURSE AWAITS';
}
refreshBestLine();
genHole(true); // backdrop course behind the start screen

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;
  time+=dt;updDots(dt);
  if(!paused&&state!=='menu'&&state!=='gameover')gameUpdate(dt);
  render();
  const cur=(state==='aim'&&!paused)?'crosshair':'default';
  if(cv.style.cursor!==cur)cv.style.cursor=cur;
}
requestAnimationFrame(frame);
</script>
