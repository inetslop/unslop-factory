<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Invaders</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04060f}
  #c{position:fixed;inset:0;display:block}
  #fx{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0px, rgba(0,0,0,.16) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,10,.55) 100%);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<script>
'use strict';
/* ============================== SETUP ============================== */
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,dangerY=0,bgC=null;
const R=(a,b)=>a+Math.random()*(b-a);
const HIKEY='snakeInvadersHi';

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  dangerY=H-48;
  buildBG(); initStars();
  if(snake){ snake.x=Math.min(Math.max(snake.x,12),W-12); snake.y=Math.min(Math.max(snake.y,12),H-12); }
}
window.addEventListener('resize',resize);

function buildBG(){
  bgC=document.createElement('canvas'); bgC.width=W*DPR; bgC.height=H*DPR;
  const b=bgC.getContext('2d'); b.scale(DPR,DPR);
  let g=b.createRadialGradient(W*0.5,H*0.35,0,W*0.5,H*0.35,Math.max(W,H)*0.85);
  g.addColorStop(0,'#0c1332'); g.addColorStop(0.55,'#070c22'); g.addColorStop(1,'#03040d');
  b.fillStyle=g; b.fillRect(0,0,W,H);
  nebula(b,W*0.22,H*0.24,Math.max(W,H)*0.5,'rgba(28,92,124,0.22)');
  nebula(b,W*0.82,H*0.72,Math.max(W,H)*0.46,'rgba(122,30,112,0.17)');
  nebula(b,W*0.62,H*0.12,Math.max(W,H)*0.34,'rgba(40,164,140,0.11)');
  for(let i=0;i<150;i++){
    const r=R(0.5,1.3);
    b.globalAlpha=R(0.12,0.55);
    b.fillStyle=Math.random()<0.85?'#cfe6ff':'#ffd9f0';
    b.fillRect(R(0,W),R(0,H),r,r);
  }
  b.globalAlpha=1;
}
function nebula(b,x,y,r,c){
  const g=b.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c); g.addColorStop(1,'rgba(0,0,0,0)');
  b.fillStyle=g; b.fillRect(x-r,y-r,r*2,r*2);
}
let stars=[];
function initStars(){
  stars=[]; const n=Math.round(W*H/9000);
  for(let i=0;i<n;i++){ const l=Math.random();
    stars.push({x:R(0,W),y:R(0,H),z:l<0.5?0.35:(l<0.85?0.7:1.2),tw:R(0,6.28)}); }
}

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false;
function initAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.16; master.connect(AC.destination);}catch(e){} }
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(o){
  if(!AC||muted)return;
  const t0=AC.currentTime+(o.delay||0), t=o.t||0.15;
  const osc=AC.createOscillator(), g=AC.createGain();
  osc.type=o.type||'square';
  osc.frequency.setValueAtTime(o.f0,t0);
  if(o.f1&&o.f1!==o.f0)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1),t0+t);
  g.gain.setValueAtTime(o.v||1,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+t);
  osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0+t+0.03);
}
function noiseB(o){
  if(!AC||muted)return;
  const t0=AC.currentTime+(o.delay||0), t=o.t||0.3;
  const len=Math.max(1,(AC.sampleRate*t)|0);
  const buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.f||800;
  const g=AC.createGain(); g.gain.setValueAtTime(o.v||1,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+t);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0);
}
const SFX={
  fire(){ tone({type:'square',f0:920,f1:180,t:0.1,v:0.4}); },
  efire(){ tone({type:'triangle',f0:230,f1:115,t:0.18,v:0.22}); },
  eat(){ tone({type:'square',f0:620,t:0.07,v:0.45}); tone({type:'square',f0:930,t:0.1,v:0.45,delay:0.06}); },
  boom(){ noiseB({t:0.26,v:0.7,f:900}); tone({type:'sawtooth',f0:160,f1:40,t:0.24,v:0.45}); },
  hurt(){ tone({type:'sawtooth',f0:320,f1:40,t:0.5,v:0.7}); noiseB({t:0.35,v:0.6,f:500}); },
  tick(){ tone({type:'sine',f0:95,f1:70,t:0.07,v:0.3}); },
  wave(){ [392,523,659,784].forEach((f,i)=>tone({type:'square',f0:f,t:0.12,v:0.3,delay:i*0.09})); },
  over(){ [440,349,262,196,131].forEach((f,i)=>tone({type:'triangle',f0:f,t:0.24,v:0.45,delay:i*0.16})); },
  ui(){ tone({type:'square',f0:660,f1:880,t:0.08,v:0.25}); }
};

/* ============================== SPRITES ============================== */
const SPR=[
 [ // squid
  ["..X.....X..","...X...X...","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","...XX.XX..."],
  ["..X.....X..","...X...X...","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","XXXXXXXXXXX","XX.XXXXX.XX",".X.......X."]],
 [ // crab
  [".X.......X.","..X.....X..","..XXXXXXX..",".XXXXXXXXX.","XXX.XXX.XXX","XXXXXXXXXXX","X...X.X...X",".X..XXX..X."],
  ["..X.....X..",".XX.XXX.XX.","..XXXXXXX..",".XXXXXXXXX.","XXX.XXX.XXX","XXXXXXXXXXX","XX.......XX",".X.......X."]],
 [ // blob
  [".X.......X.","..XXXXXXX..","XXXXXXXXXXX","XX.XXXXX.XX","XXXXXXXXXXX",".X..XXX..X.","...XX.XX...","..........."],
  ["..X.....X..","..XXXXXXX..","XXXXXXXXXXX","XX.XXXXX.XX","XXXXXXXXXXX",".X..XXX..X.",".XX.XXX.XX.","..........."]]
];
const TYPE_COL=['#ff5fa8','#4fe0ff','#ffb648'], VALS=[30,20,10], PIX=3;
let spriteCache=[];
function bakeSprites(){
  spriteCache=[];
  for(let t=0;t<3;t++){ const fr=[];
    for(let f=0;f<2;f++){
      const m=SPR[t][f], c=document.createElement('canvas');
      c.width=11*PIX; c.height=m.length*PIX;
      const g=c.getContext('2d');
      g.shadowColor=TYPE_COL[t]; g.shadowBlur=9; g.fillStyle=TYPE_COL[t];
      for(let y=0;y<m.length;y++)for(let x=0;x<11;x++)
        if(m[y][x]==='X')g.fillRect(x*PIX,y*PIX,PIX,PIX);
      fr.push(c);
    } spriteCache.push(fr);
  }
}

/* ============================== STATE ============================== */
const BASE_SEGS=6, MAX_SEGS=30, SPACING=13, SEG_R=8.5, HEAD_R=11;
let state='menu', tGlobal=0;
let score=0, hi=0, lives=3, wave=1, stats={eat:0,shot:0}, newBest=false;
let snake=null, pbullets=[], ebullets=[], invaders=[], particles=[], popups=[];
let form=null, dying=0, wavePending=false, waveT=0, fireCd=0;
let combo=1, comboT=0, scorePop=0;
let shakeT=0,shakeDur=1,shakeMag=0, flashA=0, banner=null;
try{ hi=+localStorage.getItem(HIKEY)||0; }catch(e){ hi=0; }

const keys={left:false,right:false,up:false,down:false,fire:false};

/* ============================== HELPERS ============================== */
function segPos(i){
  let d=i*SPACING, px=snake.trail[0].x, py=snake.trail[0].y;
  for(let k=1;k<snake.trail.length&&d>0;k++){
    const a=snake.trail[k-1], b=snake.trail[k];
    const l=Math.hypot(b.x-a.x,b.y-a.y);
    if(l===0)continue;
    if(d<=l){ const t=d/l; return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
    d-=l;
  }
  const last=snake.trail[snake.trail.length-1];
  return {x:last.x,y:last.y};
}
function radiusFor(i){
  if(i===0)return HEAD_R;
  return Math.max(3.5, SEG_R*(1-0.5*i/Math.max(snake.segs,6)));
}
function circleRect(cx,cy,r,rx,ry,hw,hh){
  const px=Math.max(rx-hw,Math.min(cx,rx+hw)), py=Math.max(ry-hh,Math.min(cy,ry+hh));
  const dx=cx-px, dy=cy-py; return dx*dx+dy*dy<r*r;
}
function burst(x,y,col,n){
  for(let i=0;i<n;i++){ const a=R(0,6.283), sp=R(30,190);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:R(0.35,0.8),max:0.8,col,r:R(1.5,3.5)}); }
}
function popup(x,y,txt,col,size){ popups.push({x,y,txt,col,size:size||14,t:0.95,max:0.95}); }
function shakeFx(t,mag){ shakeT=t; shakeDur=t; shakeMag=mag; }
function setBanner(main,sub){ banner={main,sub,t:2.0}; }
const pad=n=>String(Math.max(0,Math.floor(n))).padStart(6,'0');

/* ============================== GAME FLOW ============================== */
function resetSnake(){
  const x=W/2, y=Math.min(H-84,dangerY-34);
  snake={x,y,ang:-Math.PI/2,speed:235,segs:BASE_SEGS,invuln:2.2,trail:[]};
  for(let i=0;i<96;i++)snake.trail.push({x:x-Math.cos(snake.ang)*i*6,y:y-Math.sin(snake.ang)*i*6});
}
function startGame(){
  score=0; lives=3; wave=1; combo=1; comboT=0; newBest=false;
  stats={eat:0,shot:0}; pbullets=[]; ebullets=[]; particles=[]; popups=[];
  dying=0; fireCd=0; wavePending=false; banner=null;
  resetSnake(); spawnWave(1);
  setBanner('WAVE 1','THE FLEET APPROACHES');
  state='playing'; SFX.wave();
}
const SUBS=['THE FLEET APPROACHES','REINFORCEMENTS INBOUND','DEEPER INTO THE SWARM','THE SKY KEEPS FALLING','NO QUARTER GIVEN'];
function spawnWave(w){
  const rows=Math.min(3+((w-1)>>1),5), cols=5;
  invaders=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const type=r===0?0:(r===1?1:2);
    invaders.push({bx:(c-(cols-1)/2)*58, by:r*46, type, val:VALS[type], x:0,y:-300});
  }
  form={ox:0,dir:w%2?1:-1,topY:-96,speed:34+w*7,fall:4+w*1.3,
        interval:Math.max(0.55,1.5-w*0.1),fireT:2.6,frameT:0,total:rows*cols,
        maxOx:(cols-1)/2*58+30};
}
function killInvader(i,how){
  const inv=invaders[i]; invaders.splice(i,1);
  const mult=combo;
  const base=how==='eat'?inv.val*2:inv.val;
  const gained=base*mult;
  score+=gained; stats[how]++;
  combo=Math.min(8,combo+1); comboT=2.5; scorePop=0.25;
  if(how==='eat'){
    if(snake.segs<MAX_SEGS)snake.segs+=2;
    else{ score+=25; popup(inv.x,inv.y-14,'FULL +25','#ffd23f',12); }
    SFX.eat();
  }else{ SFX.boom(); shakeFx(0.18,4); }
  popup(inv.x,inv.y,(how==='eat'?'EAT ':'')+'+'+gained+(mult>1?' ×'+mult:''), how==='eat'?'#8dff57':'#eaffb0', how==='eat'?16:13);
  burst(inv.x,inv.y,TYPE_COL[inv.type],how==='eat'?26:16);
}
function damage(){
  if(snake&&snake.invuln>0)return;
  lives--; combo=1; comboT=0;
  SFX.hurt(); flashA=0.5; shakeFx(0.6,14);
  if(snake)for(let i=0;i<snake.segs;i++){
    const p=i===0?{x:snake.x,y:snake.y}:segPos(i);
    burst(p.x,p.y,'#8dff57',3);
  }
  dying=1.1;
}
function gameOver(){
  state='gameover'; SFX.over();
  try{
    const h=+localStorage.getItem(HIKEY)||0;
    if(score>h){ localStorage.setItem(HIKEY,String(score)); newBest=true; hi=Math.max(hi,score); }
  }catch(e){ if(score>hi){ hi=score; newBest=true; } }
}

/* ============================== UPDATE ============================== */
function snakeMove(dt){
  const s=snake;
  s.invuln=Math.max(0,s.invuln-dt);
  let tv=235; if(keys.up)tv=345; else if(keys.down)tv=135;
  s.speed+=(tv-s.speed)*Math.min(1,dt*6);
  const turn=3.4*(0.7+0.5*s.speed/345);
  if(keys.left)s.ang-=turn*dt;
  if(keys.right)s.ang+=turn*dt;
  let nx=s.x+Math.cos(s.ang)*s.speed*dt, ny=s.y+Math.sin(s.ang)*s.speed*dt;
  if(nx<HEAD_R){nx=HEAD_R;s.ang=Math.PI-s.ang;}
  else if(nx>W-HEAD_R){nx=W-HEAD_R;s.ang=Math.PI-s.ang;}
  if(ny<HEAD_R){ny=HEAD_R;s.ang=-s.ang;}
  else if(ny>H-HEAD_R){ny=H-HEAD_R;s.ang=-s.ang;}
  s.x=nx; s.y=ny;
  s.trail.unshift({x:s.x,y:s.y});
  const maxLen=(s.segs+3)*SPACING+60; let acc=0;
  for(let i=1;i<s.trail.length;i++){
    acc+=Math.hypot(s.trail[i-1].x-s.trail[i].x,s.trail[i-1].y-s.trail[i].y);
    if(acc>maxLen){ s.trail.length=i; break; }
  }
  if(s.invuln<=0){
    for(let i=4;i<s.segs;i++){
      const p=segPos(i), rr=HEAD_R+radiusFor(i)-5;
      if(Math.hypot(p.x-s.x,p.y-s.y)<rr){ damage(); break; }
    }
  }
}
function tryFire(){
  if(state!=='playing'||dying>0||!snake||fireCd>0)return;
  fireCd=0.17;
  const a=snake.ang, mx=snake.x+Math.cos(a)*(HEAD_R+9), my=snake.y+Math.sin(a)*(HEAD_R+9);
  pbullets.push({x:mx,y:my,vx:Math.cos(a)*560,vy:Math.sin(a)*560});
  SFX.fire(); burst(mx,my,'#d8ffb0',2);
}
function formationUpdate(dt){
  const rem=invaders.length, tot=form.total||1;
  const sf=1+0.9*(1-rem/tot);
  form.ox+=form.dir*form.speed*sf*dt;
  form.topY+=form.fall*dt;
  if(Math.abs(form.ox)>form.maxOx){
    form.ox=Math.sign(form.ox)*form.maxOx; form.dir*=-1; form.topY+=26; SFX.tick();
  }
  form.frameT+=dt*(1.6+2.2*(1-rem/tot));
  for(const inv of invaders){ inv.x=W/2+form.ox+inv.bx; inv.y=form.topY+inv.by; }
}
function enemyFire(dt){
  form.fireT-=dt;
  if(form.fireT>0||!snake)return;
  const vis=invaders.filter(v=>v.y>-6);
  if(!vis.length){ form.fireT=0.35; return; }
  const inv=vis[(Math.random()*vis.length)|0];
  const sp=Math.min(460,235+wave*15);
  const d=Math.hypot(snake.x-inv.x,snake.y-inv.y)||1;
  const tt=d/sp;
  let tx=snake.x+Math.cos(snake.ang)*snake.speed*tt*0.85;
  let ty=snake.y+Math.sin(snake.ang)*snake.speed*tt*0.85;
  tx=Math.min(Math.max(tx,20),W-20); ty=Math.min(ty,H-20);
  let ax=tx-inv.x, ay=ty-(inv.y+12); const al=Math.hypot(ax,ay)||1;
  ebullets.push({x:inv.x,y:inv.y+13,vx:ax/al*sp,vy:ay/al*sp});
  form.fireT=form.interval*R(0.75,1.35);
  SFX.efire();
}
function breachCheck(){
  for(let i=invaders.length-1;i>=0;i--){
    const inv=invaders[i];
    if(inv.y+14>=dangerY){
      invaders.splice(i,1);
      burst(inv.x,dangerY,'#ff3b5c',26);
      popup(inv.x,dangerY-16,'BREACH!','#ff3b5c',16);
      shakeFx(0.5,10); SFX.boom(); damage(); return;
    }
  }
}
function eatCheck(){
  if(dying>0||!snake)return;
  for(let i=invaders.length-1;i>=0;i--){
    const inv=invaders[i]; let eaten=false;
    if(circleRect(snake.x,snake.y,HEAD_R+3,inv.x,inv.y,17,13))eaten=true;
    else{
      for(let s=2;s<snake.segs&&!eaten;s+=2){
        const p=segPos(s);
        if(circleRect(p.x,p.y,SEG_R+1,inv.x,inv.y,17,13))eaten=true;
      }
    }
    if(eaten)killInvader(i,'eat');
  }
}
function update(dt){
  tGlobal+=dt;
  const sp=(state==='playing'?26:14)*dt;
  for(const st of stars){ st.y+=st.z*sp; if(st.y>H+2){st.y=-2;st.x=R(0,W);} }
  shakeT=Math.max(0,shakeT-dt);
  flashA=Math.max(0,flashA-dt*1.4);
  scorePop=Math.max(0,scorePop-dt);
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.life-=dt; if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=(1-2.4*dt); p.vy*=(1-2.4*dt); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i];
    p.t-=dt; if(p.t<=0){popups.splice(i,1);continue;} p.y-=30*dt; }

  if(state!=='playing')return;

  if(banner){ banner.t-=dt; if(banner.t<=0)banner=null; }
  comboT-=dt; if(comboT<=0)combo=1;

  if(dying>0){
    dying-=dt;
    if(dying<=0){
      if(lives>0){ resetSnake(); ebullets.length=0; }
      else gameOver();
    }
  }else{
    snakeMove(dt);
    if(fireCd>0)fireCd-=dt;
    if(keys.fire)tryFire();
    if(dying<=0){
      formationUpdate(dt); enemyFire(dt); breachCheck(); eatCheck();
    }
  }

  // player bullets
  for(let i=pbullets.length-1;i>=0;i--){
    const b=pbullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<-24||b.x>W+24||b.y<-24||b.y>H+24){pbullets.splice(i,1);continue;}
    let hit=false;
    for(let j=invaders.length-1;j>=0;j--){
      const inv=invaders[j];
      if(Math.abs(b.x-inv.x)<19&&Math.abs(b.y-inv.y)<15){ killInvader(j,'shot'); hit=true; break; }
    }
    if(hit)pbullets.splice(i,1);
  }
  // enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x<-24||b.x>W+24||b.y>H+34||b.y<-34){ebullets.splice(i,1);continue;}
    if(dying<=0&&snake.invuln<=0){
      let hit=Math.hypot(b.x-snake.x,b.y-snake.y)<HEAD_R+4;
      for(let s=2;s<snake.segs&&!hit;s++){
        const p=segPos(s);
        if(Math.hypot(b.x-p.x,b.y-p.y)<SEG_R+3)hit=true;
      }
      if(hit){ ebullets.splice(i,1); burst(b.x,b.y,'#ff5f7a',10); damage(); }
    }
  }
  // wave clear
  if(invaders.length===0&&dying<=0){
    if(!wavePending){
      wavePending=true; waveT=1.5;
      const bonus=100+(wave-1)*50; score+=bonus;
      popup(W/2,H*0.4,'WAVE CLEAR +'+bonus,'#ffd23f',22); SFX.ui();
    }else{
      waveT-=dt;
      if(waveT<=0){
        wavePending=false; wave++; spawnWave(wave);
        setBanner('WAVE '+wave,SUBS[(wave-1)%SUBS.length]); SFX.wave();
      }
    }
  }
}

/* ============================== DRAW ============================== */
const F=(s,w)=>`${w||400} ${s}px ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace`;
const D=s=>`900 ${s}px Impact,'Arial Black','Franklin Gothic Bold',sans-serif`;
function text(str,x,y,font,col,align,ls){
  ctx.font=font; ctx.fillStyle=col;
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  if('letterSpacing'in ctx)ctx.letterSpacing=(ls||0)+'px';
  ctx.fillText(str,x,y);
  if('letterSpacing'in ctx)ctx.letterSpacing='0px';
}
function drawStars(){
  for(const st of stars){
    const a=0.3+0.6*Math.abs(Math.sin(tGlobal*1.7+st.tw));
    ctx.globalAlpha=a*st.z;
    ctx.fillStyle='#dceeff';
    ctx.fillRect(st.x,st.y,st.z>1?2:1.4,st.z>1?2:1.4);
  }
  ctx.globalAlpha=1;
}
function drawDangerLine(){
  const pulse=0.5+0.5*Math.sin(tGlobal*3);
  ctx.strokeStyle=`rgba(255,59,92,${0.4+0.35*pulse})`;
  ctx.lineWidth=2; ctx.setLineDash([14,10]); ctx.lineDashOffset=-tGlobal*40;
  ctx.beginPath(); ctx.moveTo(0,dangerY); ctx.lineTo(W,dangerY); ctx.stroke();
  ctx.setLineDash([]);
  text('BREACH LINE',W-10,dangerY-6,F(10,700),'rgba(255,90,120,0.8)','right',2);
}
function drawSnakeBody(pts,headAng,n){
  for(let i=pts.length-1;i>=1;i--){
    const p=pts[i], r=Math.max(3,SEG_R*(1-0.5*i/n));
    ctx.fillStyle=i%2?'#58d640':'#7aeb56';
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.283); ctx.fill();
  }
  const h=pts[0];
  ctx.fillStyle='rgba(150,255,120,0.22)';
  ctx.beginPath(); ctx.arc(h.x,h.y,HEAD_R+9,0,6.283); ctx.fill();
  ctx.fillStyle='#b7ff8a';
  ctx.beginPath(); ctx.arc(h.x,h.y,HEAD_R,0,6.283); ctx.fill();
  ctx.strokeStyle='#1e5c14'; ctx.lineWidth=2; ctx.stroke();
  const ex=Math.cos(headAng+Math.PI/2)*4.5, ey=Math.sin(headAng+Math.PI/2)*4.5;
  const fx=Math.cos(headAng)*4, fy=Math.sin(headAng)*4;
  for(const s of[1,-1]){
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(h.x+fx+ex*s,h.y+fy+ey*s,3.2,0,6.283); ctx.fill();
    ctx.fillStyle='#173a10';
    ctx.beginPath(); ctx.arc(h.x+fx*1.5+ex*s,h.y+fy*1.5+ey*s,1.7,0,6.283); ctx.fill();
  }
  if((tGlobal%1.7)<0.18){
    const tx=h.x+Math.cos(headAng)*(HEAD_R+9), ty=h.y+Math.sin(headAng)*(HEAD_R+9);
    const px=Math.cos(headAng+Math.PI/2)*3, py=Math.sin(headAng+Math.PI/2)*3;
    ctx.strokeStyle='#ff4d6a'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(h.x+Math.cos(headAng)*HEAD_R,h.y+Math.sin(headAng)*HEAD_R);
    ctx.lineTo(tx,ty); ctx.lineTo(tx+px,ty+py);
    ctx.moveTo(tx,ty); ctx.lineTo(tx-px,ty-py); ctx.stroke();
  }
}
function drawSnake(){
  if(!snake)return;
  const s=snake;
  if(s.invuln>0&&Math.floor(tGlobal*12)%2===0)ctx.globalAlpha=0.35;
  const pts=[];
  for(let i=s.segs-1;i>=0;i--){
    pts.push(i===0?{x:s.x,y:s.y}:segPos(i));
  }
  let ang=s.ang;
  if(pts.length>2)ang=Math.atan2(pts[0].y-pts[1].y,pts[0].x-pts[1].x);
  drawSnakeBody(pts,ang,s.segs);
  ctx.globalAlpha=1;
}
function drawWorld(){
  drawDangerLine();
  const frame=form?Math.floor(form.frameT)%2:0;
  for(const inv of invaders){
    const im=spriteCache[inv.type][frame];
    ctx.drawImage(im,inv.x-im.width/2,inv.y-im.height/2);
  }
  for(const b of ebullets){
    ctx.fillStyle='rgba(255,90,120,0.3)';
    ctx.beginPath(); ctx.arc(b.x,b.y,8,0,6.283); ctx.fill();
    ctx.fillStyle='#ff5f7a';
    ctx.beginPath(); ctx.arc(b.x,b.y,4,0,6.283); ctx.fill();
    ctx.fillStyle='#ffd7de';
    ctx.beginPath(); ctx.arc(b.x,b.y,1.8,0,6.283); ctx.fill();
  }
  ctx.lineCap='round';
  for(const b of pbullets){
    ctx.strokeStyle='rgba(180,255,120,0.35)'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*0.02,b.y-b.vy*0.02); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.strokeStyle='#eaffc0'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(b.x-b.vx*0.015,b.y-b.vy*0.015); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  if(dying<=0)drawSnake();
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(0.5,p.r*p.life/p.max),0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.t/p.max*1.6);
    text(p.txt,p.x,p.y,(p.size>15?D:F(p.size,700))(p.col==='#8dff57'?'#eaffd2':p.col),'center');
  }
  ctx.globalAlpha=1;
}
function drawMiniSnake(x,y){
  for(let k=3;k>=1;k--){
    ctx.fillStyle=k%2?'#58d640':'#7aeb56';
    ctx.beginPath(); ctx.arc(x-9-k*6,y+Math.sin(k*1.7)*3,7-k*1.6,0,6.283); ctx.fill();
  }
  ctx.fillStyle='#b7ff8a';
  ctx.beginPath(); ctx.arc(x,y,7,0,6.283); ctx.fill();
  ctx.strokeStyle='#1e5c14'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#173a10';
  ctx.beginPath(); ctx.arc(x+2.5,y-2,1.5,0,6.283); ctx.fill();
}
function drawHUD(){
  text('SCORE',18,24,F(10,700),'#7f93b8','left',3);
  const sc=1+scorePop*1.4;
  ctx.save(); ctx.translate(18,52); ctx.scale(sc,sc);
  text(pad(score),2,2,D(30),'#06240c');
  text(pad(score),0,0,D(30),'#eaffd2');
  ctx.restore();
  text('BEST '+pad(hi),18,72,F(11,700),'#ff9ecf','left',1);
  if(combo>1&&comboT>0){
    text('COMBO ×'+combo,18,100,D(20),'#ff5fa8');
    ctx.fillStyle='rgba(255,95,168,0.35)';
    ctx.fillRect(18,106,90,4);
    ctx.fillStyle='#ff5fa8';
    ctx.fillRect(18,106,90*(comboT/2.5),4);
  }
  text('WAVE '+wave,W/2,26,F(13,700),'#9fd8ff','center',4);
  text('LIVES',W-18,24,F(10,700),'#7f93b8','right',3);
  for(let i=0;i<lives;i++)drawMiniSnake(W-26-i*30,44);
  if(muted)text('MUTED [M]',W-14,H-12,F(10,700),'rgba(159,180,216,0.7)','right',2);
}
function drawBanner(){
  const b=banner, age=2-b.t;
  let sc=1; if(age<0.25)sc=1+(0.25-age)*2;
  ctx.save();
  ctx.globalAlpha=Math.min(1,b.t/0.4);
  ctx.translate(W/2,H*0.36); ctx.scale(sc,sc);
  text(b.main,4,4,D(58),'rgba(255,95,168,0.75)','center');
  text(b.main,-4,-4,D(58),'rgba(79,224,255,0.6)','center');
  text(b.main,0,0,D(58),'#f4fff0','center');
  text(b.sub,0,30,F(12,700),'#9fd8ff','center',5);
  ctx.restore();
}
function drawMenu(){
  // marching demo formation
  const cols=5,gapX=54,gapY=40;
  const ox=Math.sin(tGlobal*0.7)*(cols*gapX/2-12);
  const frame=Math.floor(tGlobal*2.4)%2;
  const yb=Math.max(46,H*0.13);
  for(let r=0;r<2;r++)for(let c=0;c<cols;c++){
    const type=(r+c)%3, im=spriteCache[type][frame];
    ctx.drawImage(im,W/2+ox+(c-2)*gapX-im.width/2,yb+r*gapY-im.height/2);
  }
  // title
  const ts=Math.min(W*0.17,96), ty=H*0.38;
  text('SNAKE',W/2+5,ty+5,D(ts),'#ff5fa8','center');
  text('SNAKE',W/2-5,ty-5,D(ts),'rgba(79,224,255,0.5)','center');
  text('SNAKE',W/2,ty,D(ts),'#8dff57','center');
  const ts2=ts*0.6;
  text('INVADERS',W/2+4,ty+ts2*1.02+4,D(ts2),'rgba(79,224,255,0.7)','center');
  text('INVADERS',W/2,ty+ts2*1.02,D(ts2),'#ff5fa8','center');
  text('OUTGROW THE FLEET · OUTGUN THE SKY',W/2,ty+ts2*1.7,F(Math.max(10,Math.min(13,W*0.014)),700),'#9fb4d8','center',4);
  // hi-score chip
  text('HI-SCORE '+pad(hi),W/2,ty+ts2*1.7+22,F(12,700),'#ffd23f','center',2);
  // controls panel
  const pw=Math.min(560,W-32), px=(W-pw)/2;
  let py=H*0.56;
  ctx.fillStyle='rgba(8,14,30,0.6)';
  ctx.strokeStyle='rgba(141,255,87,0.35)'; ctx.lineWidth=2;
  const ph=96;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(px,py,pw,ph,6); else ctx.rect(px,py,pw,ph);
  ctx.fill(); ctx.stroke();
  const kx=px+24, ax=px+pw*0.5;
  const rows=[['← → / A D','STEER'],['↑ ↓ / W S','BOOST · BRACE'],['SPACE','FIRE'],['P PAUSE · M MUTE','RESTART: R']];
  rows.forEach((r,i)=>{
    text(r[0],kx,py+24+i*19,F(12,700),'#8dff57');
    text(r[1],ax,py+24+i*19,F(12,700),'#cfe6ff','left',2);
  });
  text("EAT INVADERS TO GROW · DON'T BITE YOURSELF · HOLD THEM ABOVE THE BREACH LINE",
    W/2,Math.min(H-58,py+ph+20),F(10,700),'#7f93b8','center',1);
  // prompt
  if(Math.floor(tGlobal*2)%2===0)
    text('PRESS ENTER TO START',W/2,H*0.76,F(16,700),'#ffffff','center',4);
  text('(OR CLICK)',W/2,H*0.76+18,F(10,400),'rgba(159,180,216,0.6)','center',2);
  // slithering snake across the bottom
  const n=24, step=13, headX=((tGlobal*60)%(W+260))-130;
  const baseY=Math.min(H*0.9,H-26), amp=Math.max(6,Math.min(13,H*0.02));
  const pts=[];
  for(let i=0;i<=n;i++){
    const x=headX-i*step; if(x<-30)break;
    pts.push({x,y:baseY+Math.sin(x*0.02+tGlobal*1.4)*amp});
  }
  if(pts.length>2){
    const ang=Math.atan2(pts[0].y-pts[1].y,pts[0].x-pts[1].x);
    drawSnakeBody(pts,ang,n);
  }
}
function overlayDim(a){ ctx.fillStyle=`rgba(4,6,15,${a})`; ctx.fillRect(0,0,W,H); }
function drawPause(){
  overlayDim(0.62);
  text('PAUSED',W/2+4,H*0.44+4,D(54),'#ff5fa8','center');
  text('PAUSED',W/2,H*0.44,D(54),'#f4fff0','center');
  if(Math.floor(tGlobal*2)%2===0)
    text('PRESS P TO RESUME',W/2,H*0.44+38,F(13,700),'#9fd8ff','center',4);
}
function drawGameOver(){
  overlayDim(0.78);
  const y=H*0.34;
  text('GAME OVER',W/2+5,y+5,D(Math.min(W*0.1,64)),'#5c0f22','center');
  text('GAME OVER',W/2-5,y-5,D(Math.min(W*0.1,64)),'rgba(79,224,255,0.5)','center');
  text('GAME OVER',W/2,y,D(Math.min(W*0.1,64)),'#ff3b5c','center');
  text('FINAL SCORE',W/2,y+40,F(11,700),'#7f93b8','center',4);
  text(pad(score),W/2,y+78,D(36),'#eaffd2','center');
  if(newBest&&Math.floor(tGlobal*3)%2===0)
    text('★ NEW HI-SCORE ★',W/2,y+104,F(14,700),'#8dff57','center',3);
  else text('BEST '+pad(hi),W/2,y+104,F(12,700),'#ffd23f','center',2);
  text(`EATEN ${stats.eat} · SHOT ${stats.shot} · WAVE ${wave}`,W/2,y+130,F(11,700),'#9fb4d8','center',2);
  if(Math.floor(tGlobal*2)%2===0)
    text('PRESS ENTER OR R TO RESTART',W/2,y+168,F(14,700),'#ffffff','center',3);
}
function render(){
  ctx.drawImage(bgC,0,0,W,H);
  let sx=0,sy=0;
  if(shakeT>0){ const k=shakeMag*(shakeT/shakeDur); sx=R(-k,k); sy=R(-k,k); }
  ctx.save(); ctx.translate(sx,sy);
  drawStars();
  if(state==='menu')drawMenu(); else drawWorld();
  ctx.restore();
  if(state!=='menu')drawHUD();
  if(banner&&state==='playing')drawBanner();
  if(state==='paused')drawPause();
  if(state==='gameover')drawGameOver();
  if(flashA>0){ ctx.fillStyle=`rgba(255,60,80,${flashA})`; ctx.fillRect(0,0,W,H); }
}

/* ============================== INPUT ============================== */
function onPrimary(){
  if(state==='menu')startGame();
  else if(state==='gameover')startGame();
  else if(state==='paused'){ state='playing'; SFX.ui(); }
}
function togglePause(){
  if(state==='playing'){ state='paused'; SFX.ui(); }
  else if(state==='paused'){ state='playing'; SFX.ui(); }
}
window.addEventListener('keydown',e=>{
  const c=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c))e.preventDefault();
  initAudio();
  switch(c){
    case 'ArrowLeft': case 'KeyA': keys.left=true; break;
    case 'ArrowRight': case 'KeyD': keys.right=true; break;
    case 'ArrowUp': case 'KeyW': keys.up=true; break;
    case 'ArrowDown': case 'KeyS': keys.down=true; break;
    case 'Space': keys.fire=true; if(state==='menu')startGame(); else if(state==='gameover')startGame(); break;
    case 'Enter': onPrimary(); break;
    case 'KeyR': if(state==='playing'||state==='gameover')startGame(); break;
    case 'KeyP': case 'Escape': togglePause(); break;
    case 'KeyM': muted=!muted; break;
  }
});
window.addEventListener('keyup',e=>{
  switch(e.code){
    case 'ArrowLeft': case 'KeyA': keys.left=false; break;
    case 'ArrowRight': case 'KeyD': keys.right=false; break;
    case 'ArrowUp': case 'KeyW': keys.up=false; break;
    case 'ArrowDown': case 'KeyS': keys.down=false; break;
    case 'Space': keys.fire=false; break;
  }
});
cvs.addEventListener('pointerdown',()=>{
  initAudio();
  if(state==='playing')tryFire(); else onPrimary();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state==='playing')state='paused';
});

/* ============================== LOOP ============================== */
let last=0;
function frame(ts){
  const dt=Math.min(0.033,(ts-last)/1000||0); last=ts;
  update(dt); render();
  requestAnimationFrame(frame);
}
bakeSprites();
resize();
requestAnimationFrame(frame);
</script>
</body>
