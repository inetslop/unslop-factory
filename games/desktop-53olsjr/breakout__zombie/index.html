<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GraveBreaker — Zombie Breakout</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070d18;}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{'use strict';
/* ============ GRAVEBREAKER — a zombie breakout ============ */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const GW=960,GH=640,PI=Math.PI,TAU=PI*2;
let W=0,H=0,DPR=1,scale=1,ox=0,oy=0,skyG=null,vigG=null;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  scale=Math.min(W/GW,H/GH);ox=(W-GW*scale)/2;oy=(H-GH*scale)/2;
  skyG=ctx.createLinearGradient(0,0,0,H);
  skyG.addColorStop(0,'#070d18');skyG.addColorStop(.45,'#0c1b26');
  skyG.addColorStop(.8,'#123034');skyG.addColorStop(1,'#1a3a31');
  vigG=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.78);
  vigG.addColorStop(0,'rgba(0,0,0,0)');vigG.addColorStop(1,'rgba(0,0,0,.5)');
}
window.addEventListener('resize',resize);resize();

const F_D="Impact,'Arial Black','Haettenschweiler','Arial Narrow',sans-serif";
const F_B="'Courier New',Courier,monospace";
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,font,color,align='center',glow=null,blur=0){ctx.font=size+'px '+font;ctx.textAlign=align;ctx.textBaseline='middle';if(glow){ctx.shadowColor=glow;ctx.shadowBlur=blur;}ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.shadowBlur=0;}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mixc(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+Math.round(A[0]+(B[0]-A[0])*t)+','+Math.round(A[1]+(B[1]-A[1])*t)+','+Math.round(A[2]+(B[2]-A[2])*t)+')';}

/* ---------- audio (created on first input) ---------- */
let AC=null,master=null,muted=false,lastS={};
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);}catch(e){}}
function resumeAC(){if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function tone(type,f0,f1,dur,vol,delay=0){if(!AC||muted)return;const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t0);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(master);o.start(t0);o.stop(t0+dur+.03);}
function noiseS(dur,vol,f=800,q=1,type='bandpass',delay=0){if(!AC||muted)return;const t0=AC.currentTime+delay,len=Math.max(1,(AC.sampleRate*dur)|0),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const n=AC.createBufferSource();n.buffer=buf;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);n.connect(fl).connect(g).connect(master);n.start(t0);}
function sfx(n,fn){if(!AC||muted)return;const t=performance.now();if(lastS[n]&&t-lastS[n]<45)return;lastS[n]=t;fn();}
const sPaddle=()=>sfx('p',()=>{tone('triangle',170,90,.09,.5);noiseS(.05,.12,300,1,'lowpass');});
const sWall  =()=>sfx('w',()=>{tone('square',250,180,.04,.1);});
const sStone =()=>sfx('s',()=>{tone('square',1150,850,.05,.14);noiseS(.04,.1,2600,3);});
const sSquish=()=>sfx('q',()=>{noiseS(.07,.3,600,2);tone('sine',230,80,.09,.25);});
function sKill(ty){const p=(ty===2?105:ty===1?150:200)*rnd(.92,1.08);sfx('k'+ty,()=>{tone('sawtooth',p*1.25,p*.55,.34,.2);tone('sawtooth',p*1.02,p*.6,.3,.13);noiseS(.16,.35,900,1);});}
const sPower=()=>sfx('pw',()=>{tone('sine',660,660,.07,.28);tone('sine',990,990,.1,.28,.07);});
const sBad  =()=>sfx('bd',()=>{tone('square',180,150,.24,.22);tone('square',188,138,.24,.16);});
const sLife =()=>sfx('lf',()=>{[523,659,784].forEach((f,i)=>tone('sine',f,f,.09,.26,i*.08));});
const sLose =()=>sfx('ls',()=>{tone('sawtooth',220,55,.5,.3);noiseS(.3,.16,400,1,'lowpass');});
const sWave =()=>sfx('wv',()=>{[392,494,587].forEach((f,i)=>tone('triangle',f,f,.12,.24,i*.09));tone('sine',196,196,.4,.15);});
const sOver =()=>sfx('ov',()=>{tone('sawtooth',110,55,1.2,.26);tone('sine',165,82,1.2,.16);});
const sClick=()=>sfx('cl',()=>{tone('square',420,300,.05,.16);});
const sLight=()=>noiseS(1.5,.1,110,1,'lowpass');

/* ---------- persistent best (safe) ---------- */
function loadBest(){try{return parseInt(localStorage.getItem('gravebreaker_best')||'0',10)||0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem('gravebreaker_best',String(v));}catch(e){}}

/* ---------- state ---------- */
const S={mode:'menu',score:0,best:loadBest(),wave:1,lives:3,combo:0,mult:1,left:0,total:1,shake:0,redFlash:0,flash:0,banner:null,overT:0,newBest:false};
let bricks=[],balls=[],caps=[],parts=[],pops=[];
const pad={x:GW/2,w:110,tw:110,y:GH-58,h:16,vx:0,tx:null};
const eff={wide:0,slow:0,bite:0};
let slowScale=1,T=0;

/* ---------- ambient world ---------- */
const stars=[];for(let i=0;i<90;i++)stars.push({nx:Math.random(),ny:Math.random()*.78,r:rnd(.6,1.8),ph:rnd(TAU),sp:rnd(.5,2)});
const fogB=[],fogF=[];
for(let i=0;i<5;i++)fogB.push({x:rnd(-300,GW+300),y:rnd(230,430),r:rnd(90,170),sp:rnd(6,18),a:rnd(.04,.08)});
for(let i=0;i<4;i++)fogF.push({x:rnd(-300,GW+300),y:rnd(GH-150,GH-70),r:rnd(80,150),sp:rnd(10,26),a:rnd(.03,.06)});
const flies=[];for(let i=0;i<14;i++)flies.push({bx:rnd(40,GW-40),y:rnd(GH-120,GH-45),ph:rnd(TAU),sp:rnd(.4,1.2),ax:rnd(12,36)});
let bats=[],batT=rnd(3,7),lightT=rnd(8,16);

/* ---------- brick factory ---------- */
const COLS=9,GAP=8,X0=70,TOPY=64,BH=34;
const BW=(GW-X0*2-(COLS-1)*GAP)/COLS;
function makeBrick(x,y,type,hp,seed){return{x,y,w:BW,h:BH,type,hp,maxHp:hp,alive:true,flash:0,phase:rnd(TAU),seed:seed||Math.random()};}
function buildWave(n){
  bricks=[];const rows=Math.min(4+((n-1)/2|0),7);
  const bonus=n>=6?1:0,bruteRows=rows>=5?2:1,biterSpan=Math.ceil(rows/2);
  for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++){
    const x=X0+c*(BW+GAP),y=TOPY+r*(BH+GAP),fb=(rows-1)-r;
    if(n>=3&&Math.random()<.07){bricks.push(makeBrick(x,y,3,99,rnd()));continue;}
    let ty,tp;
    if(fb<bruteRows){ty=2;tp=3+bonus;}else if(fb<bruteRows+biterSpan){ty=1;tp=2;}else{ty=0;tp=1;}
    bricks.push(makeBrick(x,y,ty,tp,rnd()));
  }
  S.left=bricks.filter(b=>b.type<3).length;S.total=Math.max(1,S.left);
}

/* ---------- game flow ---------- */
function resetBall(){balls=[{x:pad.x,y:pad.y-9,dx:0,dy:-1,stuck:true,trail:[],hitT:0}];}
function startGame(){
  S.score=0;S.wave=1;S.lives=3;S.combo=0;S.mult=1;S.newBest=false;S.redFlash=0;S.flash=0;
  eff.wide=eff.slow=eff.bite=0;slowScale=1;caps=[];parts=[];pops=[];pad.tw=pad.w=110;
  buildWave(1);resetBall();
  S.mode='play';
  S.banner={t:0,dur:1.6,main:'WAVE 1',sub:'CLEAR THE GRAVEYARD',cb:null};
}
function launchIfStuck(){
  let did=false;
  for(const b of balls)if(b.stuck){b.stuck=false;const th=clamp((pad.tx!=null?pad.tx-pad.x:0)*.0025,-.38,.38)+rnd(-.06,.06);b.dx=Math.sin(th);b.dy=-Math.cos(th);did=true;}
  if(did)sPaddle();
}
function loseLife(){
  S.lives--;S.redFlash=1;S.shake=14;sLose();
  if(S.lives<=0){gameOver();return;}
  caps.length=0;eff.wide=eff.slow=eff.bite=0;slowScale=1;S.combo=0;S.mult=1;
  pad.tw=110;resetBall();
}
function gameOver(){
  S.mode='over';S.overT=T;if(S.score>S.best){S.best=S.score;S.newBest=true;saveBest(S.best);}sOver();
}
function togglePause(){if(S.mode==='play'){S.mode='pause';sClick();}else if(S.mode==='pause'){S.mode='play';sClick();}}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;}

/* ---------- scoring / drops ---------- */
const BASEPTS=[50,80,120];
function addPop(x,y,s,c,size=16){pops.push({x,y,s,c,t:0,dur:.9,size});}
function burst(x,y,color,n,pow=1){
  for(let i=0;i<n;i++){const a=rnd(TAU),sp=rnd(40,220)*pow;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,g:900,t:0,dur:rnd(.4,.8),size:rnd(2,5.5),c:color,shape:0});}
  for(let i=0;i<3;i++){const a=rnd(-PI*.8,-PI*.2),sp=rnd(120,260)*pow;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:950,t:0,dur:rnd(.5,.9),size:rnd(3,5),c:'#e8eadf',shape:1,rot:rnd(TAU),vr:rnd(-9,9)});}
  parts.push({x,y,vx:0,vy:0,g:0,t:0,dur:.28,size:6,c:color,shape:2});
}
const POWDUR={wide:12,slow:8,bite:9};
function rollPower(){let r=Math.random()*92;if(r<24)return 0;if(r<46)return 1;if(r<66)return 2;if(r<84)return 3;return 4;}
const POWS=[{c:'#4fc3f7',l:'W',name:'WIDE PADDLE'},{c:'#ffd54f',l:'×',name:'MULTI-BALL'},{c:'#9fe8ff',l:'S',name:'SLOW-MO'},{c:'#ff6b8a',l:'+',name:'+1 LIFE'},{c:'#ff5252',l:'B',name:'BITES!'}];
function spawnCap(x,y){caps.push({x,y,vy:140+S.wave*4,ph:rnd(TAU),type:rollPower()});}
function applyPow(p,x,y){
  const P=POWS[p];addPop(x,pad.y-30,P.name,P.c,20);
  if(p===0){eff.wide=POWDUR.wide;pad.tw=156;sPower();}
  else if(p===1){let g=0;while(balls.length<4&&g<8){const b=balls[0];if(!b)break;const rot=((g%2?1:-1)*.35*(1+(g>>1)*.3));const nx=b.dx*Math.cos(rot)-b.dy*Math.sin(rot),ny=b.dx*Math.sin(rot)+b.dy*Math.cos(rot);balls.push({x:b.x,y:b.y,dx:nx,dy:ny,stuck:false,trail:[],hitT:0});g++;}sPower();}
  else if(p===2){eff.slow=POWDUR.slow;sPower();}
  else if(p===3){S.lives=Math.min(5,S.lives+1);sLife();}
  else{eff.bite=POWDUR.bite;eff.wide=0;pad.tw=78;S.shake=Math.max(S.shake,5);sBad();}
}
function damageBrick(b){
  if(b.type===3){b.flash=1;sStone();return;}
  b.hp--;b.flash=1;
  const cx=b.x+b.w/2,cy=b.y+b.h/2;
  if(b.hp<=0){
    b.alive=false;S.left--;S.combo++;
    S.mult=S.combo>=18?5:S.combo>=12?4:S.combo>=7?3:S.combo>=4?2:1;
    const pts=BASEPTS[b.type]*S.mult;S.score+=pts;
    addPop(cx,cy,'+'+pts,b.type===2?'#d9b8ff':'#c6f09a',b.type===2?20:16);
    burst(cx,cy,b.type===0?'#8fd06b':b.type===1?'#9db4d8':'#b58ae0',b.type===2?16:11,b.type===2?1.3:1);
    if(b.type===2)S.shake=Math.max(S.shake,7);
    sKill(b.type);
    const dp=b.type===2?.35:.12;
    if(Math.random()<dp)spawnCap(cx,cy);
  }else{burst(cx,cy,'#e8eadf',3,.5);sSquish();}
}

/* ---------- input ---------- */
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowleft','arrowright','arrowup','arrowdown'].indexOf(k)>=0)e.preventDefault();
  initAudio();resumeAC();keys[k]=true;
  if(k==='m')toggleMute();
  else if(k==='p'||k==='escape')togglePause();
  else if(k==='r'){if(S.mode!=='menu')startGame();}
  else if(k===' '||k==='enter'){
    if(S.mode==='menu')startGame();
    else if(S.mode==='over'){if(T-S.overT>.5)startGame();}
    else if(S.mode==='pause')togglePause();
    else if(S.mode==='play')launchIfStuck();
  }
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

let hotspots=[];
function toWorld(cx,cy){return[(cx-ox)/scale,(cy-oy)/scale];}
function handleClick(wx,wy){
  for(const h of hotspots)if(wx>=h.x&&wx<=h.x+h.w&&wy>=h.y&&wy<=h.y+h.h){
    if(h.id==='mute')toggleMute();else if(h.id==='btn'){S.mode==='over'?startGame():startGame();}
    sClick();return;
  }
  if(S.mode==='menu')startGame();
  else if(S.mode==='pause')togglePause();
  else if(S.mode==='over'){if(T-S.overT>.5)startGame();}
  else if(S.mode==='play')launchIfStuck();
}
cvs.addEventListener('mousemove',e=>{pad.tx=(e.clientX-ox)/scale;});
cvs.addEventListener('mousedown',e=>{initAudio();resumeAC();const w=toWorld(e.clientX,e.clientY);handleClick(w[0],w[1]);});
cvs.addEventListener('touchstart',e=>{e.preventDefault();initAudio();resumeAC();const t=e.changedTouches[0];pad.tx=(t.clientX-ox)/scale;const w=toWorld(t.clientX,t.clientY);handleClick(w[0],w[1]);},{passive:false});
cvs.addEventListener('touchmove',e=>{e.preventDefault();const t=e.changedTouches[0];pad.tx=(t.clientX-ox)/scale;},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play')togglePause();});

/* ---------- update ---------- */
function ballSpeed(){return Math.min(340+(S.wave-1)*16,560)*slowScale;}
function update(dt){
  T+=dt;
  // ambient always
  for(const f of fogB.concat(fogF)){f.x+=f.sp*dt;if(f.x>GW+320)f.x=-320;}
  batT-=dt;if(batT<=0){batT=rnd(4,9);const dir=Math.random()<.5?1:-1;bats.push({x:dir>0?-30:GW+30,y:rnd(60,200),vx:dir*rnd(70,120),ph:rnd(TAU)});}
  for(const b of bats)b.x+=b.vx*dt;bats=bats.filter(b=>b.x>-60&&b.x<GW+60);
  lightT-=dt;if(lightT<=0){lightT=rnd(8,17);S.flash=1;sLight();}
  S.flash=Math.max(0,S.flash-dt*2.2);
  S.shake=Math.max(0,S.shake-dt*46);
  S.redFlash=Math.max(0,S.redFlash-dt*1.6);
  for(const p of parts){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rot!==undefined)p.rot+=p.vr*dt;}
  parts=parts.filter(p=>p.t<p.dur);
  for(const p of pops){p.t+=dt;p.y-=42*dt;}
  pops=pops.filter(p=>p.t<p.dur);
  for(const b of bricks)if(b.flash>0)b.flash=Math.max(0,b.flash-dt*5);

  if(S.mode!=='play')return;
  if(S.banner){S.banner.t+=dt;if(S.banner.t>=S.banner.dur){const cb=S.banner.cb;S.banner=null;cb&&cb();}return;}

  // paddle
  const pw=pad.w/2;let vx=0;
  if(keys['arrowleft']||keys['a'])vx-=1;
  if(keys['arrowright']||keys['d'])vx+=1;
  if(vx!==0){pad.x+=vx*640*dt;pad.tx=null;}
  else if(pad.tx!=null){const nx=pad.x+(clamp(pad.tx,pw,GW-pw)-pad.x)*Math.min(1,dt*18);pad.vx=nx-pad.x;pad.x=nx;}
  pad.x=clamp(pad.x,pw,GW-pw);
  const twt=eff.bite>0?78:eff.wide>0?156:110;pad.tw=twt;pad.w+=(twt-pad.w)*Math.min(1,dt*8);
  eff.wide=Math.max(0,eff.wide-dt);eff.slow=Math.max(0,eff.slow-dt);eff.bite=Math.max(0,eff.bite-dt);
  slowScale+=((eff.slow>0?.62:1)-slowScale)*Math.min(1,dt*5);

  // balls
  const R=7,sp=ballSpeed()*dt;
  for(let bi=balls.length-1;bi>=0;bi--){
    const b=balls[bi];
    if(b.stuck){b.x=pad.x;b.y=pad.y-R-2;b.trail.length=0;continue;}
    const mag=Math.hypot(b.dx,b.dy)||1;b.dx/=mag;b.dy/=mag;
    if(Math.abs(b.dy)<.22){const s=b.dy<0?-1:1;b.dy=s*.24;const nx=Math.sqrt(1-b.dy*b.dy)*(b.dx<0?-1:1);b.dx=nx;}
    const steps=Math.max(1,Math.ceil(sp/9)),step=sp/steps;
    let dead=false;
    for(let s2=0;s2<steps&&!dead;s2++){
      b.x+=b.dx*step;b.y+=b.dy*step;
      if(b.x<R){b.x=R;b.dx=Math.abs(b.dx);sWall();}
      else if(b.x>GW-R){b.x=GW-R;b.dx=-Math.abs(b.dx);sWall();}
      if(b.y<R){b.y=R;b.dy=Math.abs(b.dy);sWall();}
      // bricks
      for(const br of bricks){
        if(!br.alive)continue;
        const nx=clamp(b.x,br.x,br.x+br.w),ny=clamp(b.y,br.y,br.y+br.h);
        let ddx=b.x-nx,ddy=b.y-ny,d2=ddx*ddx+ddy*ddy;
        if(d2>R*R)continue;
        let mx,my;
        if(d2<1e-6){const oL=b.x-br.x,oR=br.x+br.w-b.x,oT=b.y-br.y,oB=br.y+br.h-b.y,m=Math.min(oL,oR,oT,oB);if(m===oT){mx=0;my=-1;}else if(m===oB){mx=0;my=1;}else if(m===oL){mx=-1;my=0;}else{mx=1;my=0;}}
        else{const d=Math.sqrt(d2);mx=ddx/d;my=ddy/d;}
        b.x=nx+mx*R;b.y=ny+my*R;
        const dot=b.dx*mx+b.dy*my;if(dot<0){b.dx-=2*dot*mx;b.dy-=2*dot*my;}
        if(T-b.hitT>.06||br.type===3){b.hitT=T;b.hitBr=br;damageBrick(br);}
      }
      // paddle
      if(b.dy>0&&b.y+R>=pad.y&&b.y-R<=pad.y+pad.h&&Math.abs(b.x-pad.x)<=pad.w/2+R){
        b.y=pad.y-R;const rel=clamp((b.x-pad.x)/(pad.w/2),-1,1),th=rel*.95;
        b.dx=Math.sin(th);b.dy=-Math.cos(th);
        S.combo=0;S.mult=1;sPaddle();
      }
      if(b.y>GH+30)dead=true;
    }
    if(dead){balls.splice(bi,1);if(balls.length===0)loseLife();continue;}
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();
  }

  // capsules
  for(let i=caps.length-1;i>=0;i--){const c=caps[i];c.y+=c.vy*dt;c.x+=Math.sin(T*3+c.ph)*22*dt;
    if(Math.abs(c.x-pad.x)<pad.w/2+20&&c.y>pad.y-14&&c.y<pad.y+pad.h+18){applyPow(c.type,c.x,c.y);caps.splice(i,1);}
    else if(c.y>GH+24)caps.splice(i,1);}

  // wave clear
  if(S.left<=0){
    S.wave++;sWave();
    const nw=S.wave;
    S.banner={t:0,dur:1.7,main:'WAVE '+nw,sub:nw%3===0?'THEY REMEMBER YOU':'THEY ONLY GET FASTER',cb:()=>{buildWave(nw);resetBall();}};
  }
}

/* ---------- drawing helpers ---------- */
function drawZombie(b){
  const bob=Math.sin(T*2+b.phase)*1.4;
  const x=b.x,y=b.y+bob,w=b.w,h=b.h,cx=x+w/2,cy=y+h/2;
  if(b.type===3){ // stone headstone
    ctx.fillStyle='#78828e';ctx.strokeStyle='#3f4750';ctx.lineWidth=2;
    rr(x+2,y,w-4,h,10);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(40,46,52,.8)';ctx.beginPath();
    ctx.moveTo(cx,y+h*.28);ctx.lineTo(cx,y+h*.8);ctx.moveTo(cx-w*.16,y+h*.45);ctx.lineTo(cx+w*.16,y+h*.45);ctx.stroke();
  }else{
    const base=['#8fd06b','#9db4d8','#a06bd6'][b.type],dark=['#4e7a3a','#4d6382','#5d3a85'][b.type];
    ctx.fillStyle=base;ctx.strokeStyle=dark;ctx.lineWidth=2;
    rr(x,y,w,h,7);ctx.fill();ctx.stroke();
    // eyes
    const ew=w*.16,ey=cy-h*.14;
    ctx.fillStyle='#1c2418';
    ctx.beginPath();ctx.ellipse(cx-ew,ey,w*.09,h*.14,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+ew,ey,w*.09,h*.14,0,0,TAU);ctx.fill();
    const px=Math.sin(T*1.3+b.phase)*2;
    ctx.fillStyle=b.type===2?'#ff5a5a':'#f4f8ec';
    ctx.beginPath();ctx.arc(cx-ew+px,ey,2,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(cx+ew+px,ey,2,0,TAU);ctx.fill();
    if(b.type===2){ // angry brows + stitches
      ctx.strokeStyle=dark;ctx.lineWidth=2.5;ctx.beginPath();
      ctx.moveTo(cx-ew-w*.08,ey-h*.2);ctx.lineTo(cx-ew+w*.06,ey-h*.08);
      ctx.moveTo(cx+ew+w*.08,ey-h*.2);ctx.lineTo(cx+ew-w*.06,ey-h*.08);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-w*.1,cy-h*.36);ctx.lineTo(cx+w*.1,cy-h*.36);
      for(let i=-1;i<=1;i++){ctx.moveTo(cx+i*w*.07,cy-h*.42);ctx.lineTo(cx+i*w*.07,cy-h*.3);}ctx.stroke();
    }
    // mouth + teeth
    const mw=w*.3,mh=h*.28,my=cy+h*.16;
    ctx.fillStyle='#241a14';rr(cx-mw/2,my-mh/2,mw,mh,4);ctx.fill();
    ctx.fillStyle='#e9eadf';
    for(let i=0;i<3;i++)ctx.fillRect(cx-mw/2+2+i*(mw-4)/3,my-mh/2+1,(mw-4)/3-2,3.5);
    if(b.type===1){ // fangs
      ctx.beginPath();ctx.moveTo(cx-mw*.28,my+mh/2-1);ctx.lineTo(cx-mw*.28+4,my+mh/2+4);ctx.lineTo(cx-mw*.28+8,my+mh/2-1);ctx.closePath();
      ctx.moveTo(cx+mw*.28,my+mh/2-1);ctx.lineTo(cx+mw*.28-4,my+mh/2+4);ctx.lineTo(cx+mw*.28-8,my+mh/2-1);ctx.closePath();ctx.fill();
    }
    // damage cracks
    if(b.hp<b.maxHp){
      ctx.strokeStyle='rgba(20,26,18,.55)';ctx.lineWidth=1.5;const s=b.seed;
      ctx.beginPath();ctx.moveTo(x+w*(.2+s*.2),y+2);ctx.lineTo(x+w*(.3+s*.2),y+h*.45);ctx.lineTo(x+w*(.15+s*.15),y+h-3);
      if(b.hp<b.maxHp-1||b.maxHp>2){ctx.moveTo(x+w*(.7-s*.2),y+h-2);ctx.lineTo(x+w*(.62-s*.1),y+h*.5);}
      ctx.stroke();
    }
  }
  if(b.flash>0){ctx.globalAlpha=b.flash*.85;ctx.fillStyle='#fff';rr(x,y,w,h,7);ctx.fill();ctx.globalAlpha=1;}
}
function drawBall(b){
  for(let i=0;i<b.trail.length;i++){const t=b.trail[i],a=i/b.trail.length;ctx.globalAlpha=a*.28;ctx.fillStyle='#d8f7c0';ctx.beginPath();ctx.arc(t.x,t.y,7*a+1,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(T*6+b.hitT*10);
  ctx.fillStyle='#f4f6ee';ctx.beginPath();ctx.arc(0,0,7,0,TAU);ctx.fill();
  ctx.strokeStyle='#c8452f';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(-9,0,10,-.7,.7);ctx.stroke();
  ctx.beginPath();ctx.arc(9,0,10,PI-.7,PI+.7);ctx.stroke();
  ctx.restore();
}
function drawPaddle(){
  const x=pad.x-pad.w/2,y=pad.y,w=pad.w,h=pad.h;
  if(eff.wide>0){ctx.shadowColor='#4fc3f7';ctx.shadowBlur=16;}
  else if(eff.bite>0){ctx.shadowColor='#ff5252';ctx.shadowBlur=14;}
  ctx.fillStyle='#8a5a2b';ctx.strokeStyle='#3d2410';ctx.lineWidth=2.5;
  rr(x,y,w,h,6);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(40,22,8,.5)';ctx.lineWidth=1.5;
  for(let i=1;i<5;i++){ctx.beginPath();ctx.moveTo(x+w*i/5,y+2);ctx.lineTo(x+w*i/5,y+h-2);ctx.stroke();}
  ctx.strokeStyle='#d9b078';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pad.x,y+3.5);ctx.lineTo(pad.x,y+h-3.5);ctx.moveTo(pad.x-w*.06,y+6.5);ctx.lineTo(pad.x+w*.06,y+6.5);ctx.stroke();
  ctx.fillStyle='#3d2410';
  ctx.beginPath();ctx.arc(x+5,y+h/2,1.8,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(x+w-5,y+h/2,1.8,0,TAU);ctx.fill();
}
function drawCap(c){
  const P=POWS[c.type];ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(T*3+c.ph)*.18);
  ctx.shadowColor=P.c;ctx.shadowBlur=10;
  ctx.fillStyle='#f2f4ec';rr(-22,-11,44,22,11);ctx.fill();ctx.shadowBlur=0;
  ctx.save();rr(-22,-11,44,22,11);ctx.clip();ctx.fillStyle=P.c;ctx.fillRect(-22,-11,24,22);ctx.restore();
  ctx.strokeStyle='rgba(30,40,35,.6)';ctx.lineWidth=1.5;rr(-22,-11,44,22,11);ctx.stroke();
  txt(P.l,0,1,14,F_D,'#1d2a22','center');
  ctx.restore();
}
function drawCoffin(x,y,s,filled){
  ctx.beginPath();ctx.moveTo(x,y-7*s);ctx.lineTo(x+5*s,y-3*s);ctx.lineTo(x+5*s,y+5*s);ctx.lineTo(x,y+8*s);ctx.lineTo(x-5*s,y+5*s);ctx.lineTo(x-5*s,y-3*s);ctx.closePath();
  if(filled){ctx.fillStyle='#c2453a';ctx.fill();ctx.strokeStyle='#5e1d16';}else{ctx.strokeStyle='rgba(160,70,60,.4)';}
  ctx.lineWidth=1.5;ctx.stroke();
}
function drawSpeaker(x,y){
  hotspots.push({x:x-14,y:y-12,w:32,h:24,id:'mute'});
  const hov=mouseIn(x-14,y-12,32,24);
  ctx.fillStyle=hov?'#cfe8d0':'#8fb8a0';
  ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+2,y-8);ctx.lineTo(x+2,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.closePath();ctx.fill();
  if(!muted){ctx.strokeStyle='#8fb8a0';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x+3,0,5,-.9,.9);ctx.stroke();ctx.beginPath();ctx.arc(x+3,0,8,-.9,.9);ctx.stroke();}
  else{ctx.strokeStyle='#ff5252';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(x+4,y-6);ctx.lineTo(x+12,y+6);ctx.moveTo(x+12,y-6);ctx.lineTo(x+4,y+6);ctx.stroke();}
}
function mouseIn(x,y,w,h){return pad.tx!=null&&mouseWy!=null&&pad.tx>=x&&pad.tx<=x+w&&mouseWy>=y&&mouseWy<=y+h;}
let mouseWy=null;

/* ---------- environment draw ---------- */
function drawSky(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=skyG;ctx.fillRect(0,0,W,H);
  for(const s of stars){const a=.35+.4*Math.sin(T*s.sp+s.ph);ctx.globalAlpha=Math.max(.05,a);ctx.fillStyle='#cfe6d8';ctx.fillRect(s.nx*W,s.ny*H,s.r,s.r);}
  ctx.globalAlpha=1;
  if(S.flash>0){ctx.fillStyle='rgba(220,235,255,'+(S.flash*.1)+')';ctx.fillRect(0,0,W,H);}
}
function drawMoon(){
  const mx=798,my=112;
  let g=ctx.createRadialGradient(mx,my,10,mx,my,150);g.addColorStop(0,'rgba(230,240,210,.28)');g.addColorStop(1,'rgba(230,240,210,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,150,0,TAU);ctx.fill();
  ctx.fillStyle='#edf2d6';ctx.beginPath();ctx.arc(mx,my,44,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(170,182,150,.5)';
  [[-14,-8,9],[12,6,6],[-4,16,5],[16,-16,4]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0],my+c[1],c[2],0,TAU);ctx.fill();});
}
function drawFog(arr){
  for(const f of arr){const g=ctx.createRadialGradient(f.x,f.y,4,f.x,f.y,f.r);g.addColorStop(0,'rgba(175,215,195,'+f.a+')');g.addColorStop(1,'rgba(175,215,195,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();}
}
function drawGraveyard(){
  ctx.fillStyle='#04090b';
  ctx.beginPath();ctx.moveTo(0,GH);
  for(let x=0;x<=GW;x+=60)ctx.lineTo(x,GH-44-Math.sin(x*.013)*8-Math.cos(x*.031)*5);
  ctx.lineTo(GW,GH);ctx.closePath();ctx.fill();
  const slab=(x,w,h)=>{rr(x,GH-40-h,w,h,6);ctx.fill();};
  slab(120,30,42);slab(520,26,34);slab(860,32,46);
  ctx.fillRect(262-4,GH-92,8,52);ctx.fillRect(262-14,GH-82,28,8); // cross
  ctx.fillRect(700-4,GH-84,8,44);ctx.fillRect(700-12,GH-74,24,7);
  // dead tree
  ctx.strokeStyle='#04090b';ctx.lineCap='round';
  ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(56,GH-38);ctx.quadraticCurveTo(50,GH-110,62,GH-150);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(58,GH-110);ctx.quadraticCurveTo(30,GH-140,14,GH-142);ctx.moveTo(60,GH-130);ctx.quadraticCurveTo(92,GH-158,104,GH-156);ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(16,GH-142);ctx.lineTo(8,GH-152);ctx.moveTo(100,GH-156);ctx.lineTo(112,GH-166);ctx.stroke();
}
function drawFlies(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const f of flies){const x=f.bx+Math.sin(T*f.sp+f.ph)*f.ax,y=f.y+Math.cos(T*f.sp*.8+f.ph)*10;
    const a=.4+.4*Math.sin(T*3+f.ph);
    ctx.fillStyle='rgba(216,247,160,'+(a*.35)+')';ctx.beginPath();ctx.arc(x,y,6,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(230,255,190,'+a+')';ctx.beginPath();ctx.arc(x,y,1.8,0,TAU);ctx.fill();}
  ctx.restore();
}
function drawBats(){
  ctx.strokeStyle='rgba(20,30,34,.9)';ctx.lineWidth=2;
  for(const b of bats){const f=Math.sin(T*14+b.ph)*5;ctx.beginPath();
    ctx.moveTo(b.x-10,b.y-f);ctx.quadraticCurveTo(b.x-4,b.y+3,b.x,b.y);
    ctx.quadraticCurveTo(b.x+4,b.y+3,b.x+10,b.y-f);ctx.stroke();}
}
function drawFrame(){
  const c=eff.slow>0?'rgba(120,225,255,.4)':'rgba(120,200,140,.28)';
  ctx.strokeStyle=c;ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,GW-3,GH-3);
  ctx.strokeStyle='rgba(159,232,168,.85)';ctx.lineWidth=4;const L=26;
  [[0,0,1,1],[GW,0,-1,1],[0,GH,1,-1],[GW,GH,-1,-1]].forEach(p=>{
    ctx.beginPath();ctx.moveTo(p[0]+p[2]*L,p[1]);ctx.lineTo(p[0],p[1]);ctx.lineTo(p[0],p[1]+p[3]*L);ctx.stroke();});
}

/* ---------- HUD / overlays ---------- */
function drawHUD(){
  txt('SCORE',24,22,11,F_B,'#6f9a82','left');
  txt(String(S.score).padStart(6,'0'),24,42,25,F_B,'#eaffdc','left');
  txt('BEST '+String(Math.max(S.best,S.score)).padStart(6,'0'),24,62,12,F_B,'#7fae8f','left');
  txt('WAVE',GW/2,18,11,F_B,'#6f9a82');
  txt(String(S.wave),GW/2,40,30,F_D,'#b9f27e','center','#3aff6a',12);
  const frac=clamp(S.left/S.total,0,1);
  ctx.fillStyle='rgba(255,255,255,.12)';rr(GW/2-60,58,120,5,2.5);ctx.fill();
  ctx.fillStyle='#7de08a';if(frac>0){rr(GW/2-60,58,120*frac,5,2.5);ctx.fill();}
  for(let i=0;i<S.lives;i++)drawCoffin(GW-96-i*24,30,1.7,true);
  drawSpeaker(GW-26,30);
  // combo
  if(S.mult>1){
    const pulse=1+.08*Math.sin(T*10);ctx.save();ctx.translate(GW/2,GH-112);ctx.scale(pulse,pulse);
    txt('COMBO ×'+S.mult,0,0,26,F_D,['','#9fe8a8','#ffd54f','#ff9d4f','#ff5252'][S.mult],'center','rgba(0,0,0,.7)',10);
    ctx.restore();
  }
  // effect pills
  let py=GH-118;
  [['wide','WIDE','#4fc3f7'],['slow','SLOW','#9fe8ff'],['bite','BITES','#ff5252']].forEach(e=>{
    if(eff[e[0]]>0){const frac=eff[e[0]]/POWDUR[e[0]];
      ctx.fillStyle='rgba(10,20,16,.7)';rr(20,py,132,20,5);ctx.fill();
      ctx.fillStyle=e[2];rr(24,py+4,124*frac,12,4);ctx.fill();
      txt(e[1],86,py+10.5,11,F_B,'#0c1a14','center');py-=26;}
  });
}
function drawParts(){
  for(const p of parts){const a=1-p.t/p.dur;ctx.globalAlpha=a;
    if(p.shape===0){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.size*a+1,0,TAU);ctx.fill();}
    else if(p.shape===1){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillStyle=p.c;ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);ctx.restore();}
    else{ctx.strokeStyle=p.c;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,p.size+(p.t/p.dur)*30,0,TAU);ctx.stroke();}}
  ctx.globalAlpha=1;
  for(const p of pops){const a=1-p.t/p.dur;ctx.globalAlpha=a;txt(p.s,p.x,p.y,p.size,F_D,p.c,'center','rgba(0,0,0,.8)',6);}
  ctx.globalAlpha=1;
}
function drawBanner(){
  if(!S.banner)return;const b=S.banner,k=Math.min(1,b.t/.25);
  const s=1+(1-k)*.6;ctx.save();ctx.translate(GW/2,GH/2-40);ctx.scale(s,s);ctx.globalAlpha=k;
  txt(b.main,0,0,64,F_D,'#b9f27e','center','#3aff6a',26);
  ctx.restore();
  if(k>=1)txt(b.sub,GW/2,GH/2+18,15,F_B,'#8fb8a0');
}
function drawChip(x,y,type,name,sub){
  const P=POWS[type];
  ctx.fillStyle=P.c;rr(x-46,y-13,92,26,13);ctx.fill();
  txt(P.l,x,y+1,15,F_D,'#101a14');
  txt(name,x,y+28,11,F_B,type===4?'#ff8a8a':'#b8d8c2');
  if(sub)txt(sub,x,y+42,9,F_B,'#6f9a82');
}
function drawMenu(){
  const mini=[{x:GW/2-104,type:0},{x:GW/2-32,type:1},{x:GW/2+40,type:2}];
  mini.forEach((m,i)=>drawZombie({x:m.x,y:118+Math.sin(T*2+i*2)*4,w:72,h:44,bob:0,phase:i*2.1,flash:0,hp:9,maxHp:9,seed:.3,type:m.type}));
  txt('GRAVEBREAKER',GW/2+5,215,78,F_D,'#0a140c');
  txt('GRAVEBREAKER',GW/2,210,78,F_D,'#b9f27e','center','#3aff6a',26);
  txt('— A ZOMBIE BREAKOUT —',GW/2,258,16,F_B,'#8fb8a0');
  const rows=['MOVE .... MOUSE / ← → / A D','LAUNCH . SPACE / CLICK','PAUSE P · SOUND M · RESTART R'];
  rows.forEach((r,i)=>txt(r,GW/2,308+i*24,15,F_B,'#cfe8d0'));
  txt('DROP-PODS — CATCH THE GOOD, DODGE THE RED',GW/2,404,12,F_B,'#6f9a82');
  const items=[[0,'WIDE'],[1,'MULTI'],[2,'SLOW'],[3,'LIFE'],[4,'BITES','AVOID!']];
  items.forEach((it,i)=>drawChip(GW/2-228+i*114,442,it[0],it[1],it[2]));
  txt('BEST GRAVE: '+String(S.best).padStart(6,'0'),GW/2,516,15,F_B,'#ffd54f');
  ctx.globalAlpha=.55+.45*Math.sin(T*3.4);
  txt('CLICK OR PRESS SPACE TO START SHUFFLING',GW/2,558,22,F_D,'#eaffdc','center','#3aff6a',10);
  ctx.globalAlpha=1;
  txt('they only get faster.',GW/2,600,11,F_B,'#4e6b5c');
  hotspots.push({x:GW/2-170,y:536,w:340,h:44,id:'btn'});
}
function drawOver(){
  ctx.fillStyle='rgba(4,8,10,.8)';ctx.fillRect(0,0,GW,GH);
  txt('YOU GOT EATEN',GW/2+4,204,62,F_D,'#1a0505');
  txt('YOU GOT EATEN',GW/2,200,62,F_D,'#ff5252','center','#8a1010',24);
  txt('the horde claims another survivor',GW/2,248,15,F_B,'#8fb8a0');
  txt('SCORE',GW/2,300,13,F_B,'#6f9a82');
  txt(String(S.score).padStart(6,'0'),GW/2,336,40,F_D,'#eaffdc','center','#b9f27e',14);
  txt('REACHED WAVE '+S.wave,GW/2,378,15,F_B,'#cfe8d0');
  if(S.newBest){ctx.globalAlpha=.6+.4*Math.sin(T*5);txt('★ NEW BEST GRAVE ★',GW/2,408,20,F_D,'#ffd54f','center','#ffb300',14);ctx.globalAlpha=1;}
  else txt('BEST '+String(S.best).padStart(6,'0'),GW/2,408,15,F_B,'#7fae8f');
  const hov=mouseIn(GW/2-140,448,280,54);
  ctx.fillStyle=hov?'#1c3a26':'#12241a';ctx.strokeStyle='#7de08a';ctx.lineWidth=2;
  rr(GW/2-140,448,280,54,8);ctx.fill();ctx.stroke();
  txt('RISE AGAIN  [R]',GW/2,476,24,F_D,hov?'#eaffdc':'#b9f27e','center','#3aff6a',hov?14:0);
  hotspots.push({x:GW/2-140,y:448,w:280,h:54,id:'btn'});
  txt('M — sound '+(muted?'off':'on'),GW/2,530,12,F_B,'#6f9a82');
}
function drawPause(){
  ctx.fillStyle='rgba(4,8,10,.6)';ctx.fillRect(0,0,GW,GH);
  txt('PAUSED',GW/2,GH/2-30,54,F_D,'#b9f27e','center','#3aff6a',18);
  txt('P RESUME · R RESTART · M SOUND',GW/2,GH/2+26,15,F_B,'#cfe8d0');
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);
  hotspots=[];mouseWy=(e_lastY-oy)/scale;

  drawSky();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.translate(ox,oy);ctx.scale(scale,scale);
  if(S.shake>0)ctx.translate(rnd(-S.shake,S.shake)*.5,rnd(-S.shake,S.shake)*.5);

  drawFog(fogB);drawMoon();drawBats();drawGraveyard();drawFlies();
  drawFrame();
  if(S.mode!=='menu'){
    for(const b of bricks)if(b.alive)drawZombie(b);
    for(const c of caps)drawCap(c);
    drawPaddle();
    for(const b of balls)drawBall(b);
  }
  drawParts();
  drawFog(fogF);

  if(S.mode==='menu')drawMenu();
  else{drawHUD();drawBanner();if(S.mode==='over')drawOver();if(S.mode==='pause')drawPause();}

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=vigG;ctx.fillRect(0,0,W,H);
  if(S.redFlash>0){ctx.fillStyle='rgba(255,40,30,'+(S.redFlash*.3)+')';ctx.fillRect(0,0,W,H);}

  // cursor feedback
  let hov=false;for(const h of hotspots)if(mouseIn(h.x,h.y,h.w,h.h))hov=true;
  if(S.mode==='menu'||S.mode==='over')hov=true;
  cvs.style.cursor=hov?'pointer':'default';
}
let e_lastY=0;
window.addEventListener('mousemove',e=>{e_lastY=e.clientY;});
window.addEventListener('touchmove',e=>{if(e.changedTouches[0])e_lastY=e.changedTouches[0].clientY;},{passive:true});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
