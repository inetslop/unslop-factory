<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Astro Pinball</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060f}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
  #c{position:fixed;inset:0;display:block;touch-action:none}

  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
      background:radial-gradient(ellipse at 50% 38%, rgba(9,14,32,.74), rgba(3,5,12,.92));
      opacity:0;pointer-events:none;transition:opacity .28s}
  .ov.show{opacity:1;pointer-events:auto}
  .ov.plain{background:rgba(3,5,12,.62)}

  .panel{width:min(470px,92vw);padding:2px;
      clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
      background:linear-gradient(135deg,#37e6ff,#4f6dff 50%,#ff2f9e)}
  .pin{clip-path:polygon(19px 0,100% 0,100% calc(100% - 19px),calc(100% - 19px) 100%,0 100%,0 19px);
      background:rgba(8,13,29,.97);padding:30px 34px 26px;text-align:center}

  .kicker{font-family:Consolas,Menlo,ui-monospace,monospace;color:#ffb14f;letter-spacing:.42em;
      font-size:11px;margin-bottom:12px;text-indent:.42em}
  h1{font-family:Impact,'Arial Black','Franklin Gothic Medium',sans-serif;font-weight:400;
      font-size:clamp(46px,10vw,72px);line-height:.92;color:#fff;letter-spacing:.02em;
      text-shadow:-3px 0 rgba(0,229,255,.85),3px 0 rgba(255,47,158,.85),0 0 32px rgba(0,229,255,.4)}
  h1.over{color:#ff5b7a;text-shadow:-3px 0 rgba(0,229,255,.7),3px 0 rgba(255,47,158,.7),0 0 30px rgba(255,60,110,.5)}
  .tag{color:#9fb6d8;margin:15px 0 20px;font-size:14px;line-height:1.45}

  .ctl{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;text-align:left;font-size:12.5px;
      color:#cfe3ff;background:#0e1730;border:1px solid #24365e;padding:15px 18px;margin-bottom:22px}
  .ctl div{display:flex;justify-content:space-between;align-items:center;gap:8px}
  kbd{font-family:Consolas,Menlo,ui-monospace,monospace;font-size:11px;color:#dff3ff;white-space:nowrap;
      background:#13203f;border:1px solid #3a548c;border-bottom-width:3px;border-radius:4px;padding:2px 7px}

  .btn{font-family:Impact,'Arial Black','Franklin Gothic Medium',sans-serif;font-size:20px;letter-spacing:.16em;
      color:#1d0f00;background:linear-gradient(#ffe0a1,#ffb14f 55%,#ff9a2e);border:0;padding:13px 38px;cursor:pointer;
      clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
      box-shadow:0 5px 0 #8a4d00,0 12px 26px rgba(255,177,79,.35);transition:transform .08s,box-shadow .08s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #8a4d00,0 18px 32px rgba(255,177,79,.55)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4d00}

  .blink{animation:bl 1.1s steps(2,end) infinite;color:#57e8ff;font-family:Consolas,Menlo,ui-monospace,monospace;
      font-size:12px;margin-top:15px;letter-spacing:.22em;text-indent:.22em}
  @keyframes bl{50%{opacity:.15}}
  .hi{color:#6f8ab3;font-family:Consolas,Menlo,ui-monospace,monospace;font-size:12px;margin-top:12px;letter-spacing:.14em}
  .rec{display:none;color:#ffe14f;font-family:Consolas,Menlo,ui-monospace,monospace;font-size:13px;
      letter-spacing:.28em;text-indent:.28em;margin-top:10px;animation:bl 1s steps(2,end) infinite}
  .fscore{font-family:Consolas,Menlo,ui-monospace,monospace;color:#eaffff;font-size:34px;font-weight:bold;
      margin:14px 0 2px;letter-spacing:.06em;text-shadow:0 0 18px rgba(95,230,255,.5)}
  .pauz{font-family:Impact,'Arial Black',sans-serif;font-size:52px;color:#fff;letter-spacing:.1em;
      text-shadow:-3px 0 rgba(0,229,255,.8),3px 0 rgba(255,47,158,.8)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ov show" id="startOv">
  <div class="panel"><div class="pin">
    <div class="kicker">PINBALL &times; ASTEROIDS</div>
    <h1>ASTRO<br>PINBALL</h1>
    <p class="tag">Slingshot the starball up a neon table.<br>Shatter the drifting rocks. Don't drain.</p>
    <div class="ctl">
      <div><span>Left flipper</span><span><kbd>A</kbd> <kbd>&#9664;</kbd></span></div>
      <div><span>Right flipper</span><span><kbd>L</kbd> <kbd>&#9654;</kbd></span></div>
      <div><span>Charge launch</span><kbd>SPACE hold</kbd></div>
      <div><span>Pause</span><kbd>P</kbd></div>
      <div><span>Sound</span><kbd>M</kbd></div>
      <div><span>Restart</span><kbd>R</kbd></div>
    </div>
    <button class="btn" id="startBtn">LAUNCH BALL &#9656;</button>
    <div class="blink">OR PRESS SPACE</div>
    <div class="hi" id="startHi"></div>
  </div></div>
</div>

<div class="ov" id="endOv">
  <div class="panel"><div class="pin">
    <h1 class="over">GAME OVER</h1>
    <div class="fscore" id="finalScore">000000</div>
    <div class="rec" id="newRec">&#9733; NEW HI-SCORE &#9733;</div>
    <div class="hi" id="endHi"></div>
    <br><button class="btn" id="againBtn">RESTART &#9656;</button>
    <div class="blink">OR PRESS R</div>
  </div></div>
</div>

<div class="ov plain" id="pauseOv">
  <div style="text-align:center">
    <div class="pauz">PAUSED</div>
    <div class="blink">PRESS P TO RESUME</div>
  </div>
</div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const TAU=Math.PI*2, H=1/240;
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const F_DISP='Impact,"Arial Black","Franklin Gothic Medium",sans-serif';
const F_MONO='Consolas,Menlo,ui-monospace,monospace';

let dpr=1,vw=0,vh=0,sc=1,ox=0,oy=0;
const SW=560, HUDH=92, TH=840, SH=HUDH+TH+18;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1); vw=innerWidth; vh=innerHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  cv.style.width=vw+'px'; cv.style.height=vh+'px';
  sc=Math.min(vw/(SW+30), vh/(SH+26)); ox=(vw-SW*sc)/2; oy=(vh-SH*sc)/2;
}
addEventListener('resize',resize); resize();

/* glow sprites */
function glowSprite(rgb){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d'), gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba('+rgb+',.95)'); gr.addColorStop(.35,'rgba('+rgb+',.38)'); gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128); return c;
}
const GLOW={cyan:glowSprite('96,240,255'),magenta:glowSprite('255,79,216'),amber:glowSprite('255,177,79'),
            green:glowSprite('80,255,150'),white:glowSprite('255,255,255'),orange:glowSprite('255,140,60')};
function gdraw(img,x,y,s,a){ if(a<=0)return; ctx.globalAlpha=a; ctx.drawImage(img,x-s/2,y-s/2,s,s); ctx.globalAlpha=1; }

/* background stars */
const farS=[], nearS=[];
for(let i=0;i<150;i++) farS.push({x:Math.random(),y:Math.random(),s:R(.5,1.4),tw:R(0,TAU),sp:R(.2,.7)});
for(let i=0;i<60;i++)  nearS.push({x:Math.random(),y:Math.random(),s:R(1.2,2.4),tw:R(0,TAU),sp:R(.8,1.8)});
const tStars=[]; for(let i=0;i<26;i++) tStars.push({x:R(30,530),y:R(HUDH+HUDH*0+40,TH-30),s:R(.6,1.6),tw:R(0,TAU)});
let shoot=null, shootT=R(4,9);

/* ============================== TABLE GEOMETRY ============================== */
const segs=[];
function seg(a,b,c,d,o){ (o=o||{}).a=a;o.b=b;o.c=c;o.d=d; segs.push(o); }
seg(20,150, 20,830);            // left wall
seg(20,830, 140,830);           // floor L
seg(352,830, 472,830);          // floor R
seg(540,150, 540,830);          // right wall
seg(472,210, 472,830);          // lane divider
seg(472,165, 540,165,{gate:true}); // one-way launch gate
for(let i=0;i<28;i++){ const t1=Math.PI-Math.PI*i/28, t2=Math.PI-Math.PI*(i+1)/28;
  seg(280+260*Math.cos(t1),150-115*Math.sin(t1), 280+260*Math.cos(t2),150-115*Math.sin(t2)); } // top arc
seg(20,700, 128,752);           // inlane L
seg(472,700, 356,752);          // inlane R

const slings=[
  {pts:[[70,595],[160,685],[70,685]],  kick:[.707,-.707], cd:0, flash:0},
  {pts:[[422,595],[332,685],[422,685]],kick:[-.707,-.707],cd:0, flash:0}];
slings.forEach((s,i)=>{ for(let j=0;j<3;j++){ const p1=s.pts[j], p2=s.pts[(j+1)%3];
  seg(p1[0],p1[1],p2[0],p2[1],{sling:i,kick:(i===0? j===0 : j===0)}); }});

const bumpers=[
  {x:140,y:270,r:28,col:'255,79,216', css:'#ff4fd8', flash:0},
  {x:350,y:270,r:28,col:'255,177,79', css:'#ffb14f', flash:0},
  {x:245,y:375,r:32,col:'255,225,79', css:'#ffe14f', flash:0}];

const flips=[
  {px:128,py:752,len:104,fr:13,a:.5,   rest:.5,    act:-.62,        on:false,om:0},
  {px:356,py:752,len:104,fr:13,a:Math.PI-.5, rest:Math.PI-.5, act:Math.PI+.62, on:false,om:0}];

const TIERS=[{r:34,pts:200,body:'#5a6980',rim:'#a8c2e2',dark:'#3c4759'},
             {r:21,pts:500,body:'#7d715c',rim:'#d8c49a',dark:'#57503f'},
             {r:12,pts:1000,body:'#83606b',rim:'#e0a8bb',dark:'#5c424c'}];

const ball={x:506,y:791,vx:0,vy:0,r:9,active:false,jit:0,trail:[]};
const plunger={topY:800,charge:0,chRaw:0,charging:false,kickT:9};

/* ============================== STATE ============================== */
let state='menu', paused=false;
let score=0, ballsLeft=3, level=1, time=0, sf=1, targetRocks=3, spawnT=0, nextBonus=8000;
let shake=0, gateOpen=0, gateFlash=0, drainDelay=-1, ambT=1, lastWallS=0, T=0;
let rocks=[], parts=[], floats=[];
let hi=0; try{ hi=+localStorage.getItem('astroPinballHi')||0; }catch(e){}
function saveHi(){ try{ localStorage.setItem('astroPinballHi',String(hi)); }catch(e){} }

/* ============================== AUDIO ============================== */
let AC=null, master=null, muted=false;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:.32; master.connect(AC.destination);
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return; delay=delay||0; const t=AC.currentTime+delay;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(Math.max(1,f0),t);
  if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
}
let noiseBuf=null;
function getNoise(){ if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
function noiseHit(dur,vol,freq,type,delay){
  if(!AC||muted)return; delay=delay||0; const t=AC.currentTime+delay;
  const s=AC.createBufferSource(); s.buffer=getNoise();
  const f=AC.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.03);
}
const sFlip =()=>{ tone(150,85,.07,'square',.22); noiseHit(.04,.12,900); };
const sBump =i=>{ tone(520+i*160,900+i*160,.12,'sine',.38); noiseHit(.05,.18,2600,'highpass'); };
const sSling=()=>{ tone(230,110,.09,'triangle',.34); };
function sWall(v){ const n=performance.now(); if(n-lastWallS<40)return; lastWallS=n; noiseHit(.035,clamp(v/2800,.05,.2),1500); }
const sRock =t=>{ noiseHit([.35,.22,.14][t],[.5,.38,.28][t],[480,900,1600][t]); tone([90,140,200][t],[45,70,100][t],.2,'sine',.38); };
const sLaunch=p=>{ tone(80,240+p*520,.28,'sawtooth',.28); noiseHit(.22,.18,900+p*1600); };
const sDrain =()=>{ tone(190,50,.5,'sine',.38); noiseHit(.3,.24,300); };
const sLevel =()=>{ tone(660,660,.09,'square',.22); tone(880,880,.09,'square',.22,.09); tone(1320,1320,.15,'square',.22,.18); };
const sOver  =()=>{ tone(392,392,.16,'square',.28); tone(311,311,.16,'square',.28,.17); tone(233,105,.55,'square',.28,.34); };
const sExtra =()=>{ tone(784,784,.08,'sine',.3); tone(988,988,.08,'sine',.3,.08); tone(1175,1175,.18,'sine',.3,.16); };

/* ============================== HELPERS ============================== */
function collideSeg(o,sx,sy,ex,ey,e){
  const dx=ex-sx, dy=ey-sy, L2=dx*dx+dy*dy;
  let t=((o.x-sx)*dx+(o.y-sy)*dy)/L2; t=clamp(t,0,1);
  const cx=sx+dx*t, cy=sy+dy*t, ddx=o.x-cx, ddy=o.y-cy, d2=ddx*ddx+ddy*ddy;
  if(d2>o.r*o.r) return -1;
  let d=Math.sqrt(d2), nx, ny;
  if(d<1e-6){ const L=Math.sqrt(L2); nx=-dy/L; ny=dx/L; } else { nx=ddx/d; ny=ddy/d; }
  o.x=cx+nx*(o.r+.05); o.y=cy+ny*(o.r+.05);
  const vn=o.vx*nx+o.vy*ny;
  if(vn<0){ o.vx-=(1+e)*vn*nx; o.vy-=(1+e)*vn*ny; return -vn; }
  return 0;
}
function makeRock(tier,x,y,sv){
  const Tm=TIERS[tier], verts=[], cr=[];
  for(let i=0;i<12;i++){ const a=i/12*TAU+R(-.13,.13), rr=Tm.r*R(.74,1.08);
    verts.push([Math.cos(a)*rr,Math.sin(a)*rr]); }
  const nk=RI(2,3); for(let i=0;i<nk;i++){ const a=R(0,TAU), dd=R(0,Tm.r*.42);
    cr.push([Math.cos(a)*dd,Math.sin(a)*dd,Tm.r*R(.1,.2)]); }
  return {tier,x,y,vx:sv.x,vy:sv.y,r:Tm.r,m:(Tm.r/20)*(Tm.r/20),rot:R(0,TAU),spin:R(-.9,.9),verts,cr,hitFlash:0};
}
function rockSpawnPos(tier){
  const r=TIERS[tier].r;
  for(let i=0;i<14;i++){ const x=R(70,420), y=R(105,300);
    if(ball.active && (x-ball.x)**2+(y-ball.y)**2 < (r+60)**2) continue;
    let ok=true; for(const b of bumpers){ if((x-b.x)**2+(y-b.y)**2<(b.r+r+14)**2){ok=false;break;} }
    if(!ok) continue;
    for(const o of rocks){ if((x-o.x)**2+(y-o.y)**2<(o.r+r+8)**2){ok=false;break;} }
    if(ok) return {x,y};
  }
  return {x:245,y:130};
}
function addFloat(x,y,txt,col,size){ floats.push({x,y,txt,col,size:size||16,life:1.1,max:1.1}); if(floats.length>40)floats.shift(); }
function sparks(x,y,n,col,spd){ for(let i=0;i<n;i++){ const a=R(0,TAU), s=R(spd*.4,spd);
  parts.push({t:'sp',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4,max:.4,col}); } }
function shards(x,y,r,tier){ const Tm=TIERS[tier]; for(let i=0;i<7+tier*2;i++){ const a=R(0,TAU), s=R(60,240);
  parts.push({t:'sh',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,rot:R(0,TAU),vr:R(-9,9),size:R(3,r*.32),life:R(.5,.9),max:.9,col:Tm.rim}); } }
function ring(x,y,r,col){ parts.push({t:'ri',x,y,r,vr:300,life:.4,max:.4,col}); }
function puff(x,y){ for(let i=0;i<6;i++){ const a=R(0,TAU), s=R(20,90);
  parts.push({t:'pu',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.5,max:.5,col:'#cfe4ff'}); } }

function addScore(n,x,y,col){
  score+=n; if(x!==undefined) addFloat(x,y,'+'+n,col||'#eaffff',15);
  while(score>=nextBonus){ ballsLeft=Math.min(5,ballsLeft+1); nextBonus+=8000;
    addFloat(246,430,'EXTRA BALL!','#7dffa8',26); sExtra(); }
}

/* ============================== GAME FLOW ============================== */
function serveBall(){ ball.x=506; ball.y=plunger.topY-9; ball.vx=0; ball.vy=0; ball.jit=0; ball.trail=[]; ball.active=true; drainDelay=-1; }
function startGame(){
  score=0; ballsLeft=3; level=1; time=0; sf=1; targetRocks=3; spawnT=0; nextBonus=8000;
  shake=0; gateOpen=0; paused=false; parts=[]; floats=[];
  rocks=[]; const spots=[[150,150],[246,215],[345,150]];
  for(let i=0;i<3;i++){ const p=rockSpawnPos(0);
    rocks.push(makeRock(0,p.x,p.y,{x:R(-60,60),y:R(-40,40)})); }
  serveBall(); state='play';
  hideOv(startOv); hideOv(endOv); hideOv(pauseOv);
}
function gameOver(){
  state='over'; sOver();
  const rec=score>hi; if(rec){ hi=score; saveHi(); }
  finalScore.textContent=String(score).padStart(6,'0');
  endHi.textContent='HI-SCORE '+String(hi).padStart(6,'0');
  newRec.style.display=rec?'block':'none';
  showOv(endOv);
}
function onDrain(){
  ballsLeft--; shake=Math.max(shake,5); sDrain();
  addFloat(clamp(ball.x,140,352),806,'DRAIN!','#ff5b7a',20); puff(clamp(ball.x,140,352),815);
  ball.active=false;
  if(ballsLeft<=0) gameOver(); else drainDelay=1.0;
}
function launch(){
  if(state!=='play'||paused||!ballOnPlunger()) return;
  ball.vy=-(430+plunger.charge*980); ball.vx=R(-22,22); ball.jit=.25; plunger.kickT=0;
  sLaunch(plunger.charge); sparks(506,plunger.topY,7,'#ffb14f',260);
  plunger.charging=false; plunger.charge=0; plunger.chRaw=0;
}
function ballOnPlunger(){ return ball.active && ball.x>481 && ball.x<530 && ball.y>772 && ball.jit<=0; }

const startOv=document.getElementById('startOv'), endOv=document.getElementById('endOv'), pauseOv=document.getElementById('pauseOv');
const finalScore=document.getElementById('finalScore'), endHi=document.getElementById('endHi'), newRec=document.getElementById('newRec');
function showOv(o){ o.classList.add('show'); } function hideOv(o){ o.classList.remove('show'); }
document.getElementById('startHi').textContent = hi>0 ? 'HI-SCORE '+String(hi).padStart(6,'0') : 'FIRST MISSION — SET A RECORD';
document.getElementById('startBtn').addEventListener('click',()=>{ audioInit(); startGame(); });
document.getElementById('againBtn').addEventListener('click',()=>{ audioInit(); startGame(); });

/* ============================== INPUT ============================== */
function setFlip(i,on){ if(flips[i].on!==on){ flips[i].on=on; if(on) sFlip(); } }
window.addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(k)>=0) e.preventDefault();
  audioInit();
  if(state==='menu'&&(k===' '||k==='Enter')){ startGame(); return; }
  if(state==='over'&&(k==='r'||k==='R'||k===' '||k==='Enter')){ startGame(); return; }
  if(k==='m'||k==='M'){ muted=!muted; if(master) master.gain.value=muted?0:.32; return; }
  if(state==='play'){
    if((k==='p'||k==='P'||k==='Escape')&&!e.repeat){ paused=!paused; paused?showOv(pauseOv):hideOv(pauseOv); return; }
    if(k==='r'||k==='R'){ startGame(); return; }
    if(paused) return;
    if((k==='ArrowLeft'||k==='a'||k==='A')&&!e.repeat) setFlip(0,true);
    if((k==='ArrowRight'||k==='l'||k==='L')&&!e.repeat) setFlip(1,true);
    if((k===' '||k==='ArrowUp')&&!e.repeat&&ballOnPlunger()){ plunger.charging=true; plunger.chRaw=0; }
  }
});
window.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A') setFlip(0,false);
  if(k==='ArrowRight'||k==='l'||k==='L') setFlip(1,false);
  if((k===' '||k==='ArrowUp')&&plunger.charging) launch();
});
const pointers=new Map();
function toTable(e){ const sx=(e.clientX-ox)/sc, sy=(e.clientY-oy)/sc; return {x:sx,y:sy-HUDH}; }
cv.addEventListener('pointerdown',e=>{
  audioInit(); if(state!=='play'||paused) return;
  const p=toTable(e); let act;
  if(p.x>462&&p.y>170) act='c'; else if(p.x<246) act='L'; else act='R';
  pointers.set(e.pointerId,act);
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  if(act==='L') setFlip(0,true); else if(act==='R') setFlip(1,true);
  else if(ballOnPlunger()){ plunger.charging=true; plunger.chRaw=0; }
});
function ptrEnd(e){ const act=pointers.get(e.pointerId); if(!act) return; pointers.delete(e.pointerId);
  if(act==='L') setFlip(0,false); else if(act==='R') setFlip(1,false); else launch(); }
cv.addEventListener('pointerup',ptrEnd); cv.addEventListener('pointercancel',ptrEnd);
addEventListener('blur',()=>{ if(state==='play'&&!paused){ paused=true; showOv(pauseOv); } });

/* ============================== PHYSICS ============================== */
function stepBall(h){
  if(!ball.active) return;
  if(ball.jit>0) ball.jit-=h;
  if(ballOnPlunger()){ ball.y=plunger.topY-9; ball.vx=0; ball.vy=0; return; }
  ball.vy+=820*h; ball.x+=ball.vx*h; ball.y+=ball.vy*h;

  for(const s of segs){ if(s.gate && !(ball.vy>0)) continue;
    const imp=collideSeg(ball,s.a,s.b,s.c,s.d,.72);
    if(imp>120) sWall(imp);
    if(s.gate&&imp>50) gateFlash=1; }

  for(let i=0;i<bumpers.length;i++){ const b=bumpers[i];
    let dx=ball.x-b.x, dy=ball.y-b.y, d=Math.hypot(dx,dy), min=b.r+ball.r;
    if(d<min){ if(d<1e-4){dx=0;dy=-1;d=1;} const nx=dx/d, ny=dy/d;
      ball.x=b.x+nx*(min+.1); ball.y=b.y+ny*(min+.1);
      const vn=ball.vx*nx+ball.vy*ny; if(vn<0){ ball.vx-=1.5*vn*nx; ball.vy-=1.5*vn*ny; }
      ball.vx+=nx*540; ball.vy+=ny*540;
      b.flash=1; addScore(100,ball.x-ball.r*2,b.y-b.r*2,b.css); sparks(ball.x,ball.y,8,b.css,320);
      shake=Math.max(shake,2.6); sBump(i); } }

  for(const sl of slings){ if(sl.cd>0) continue;
    const cx=sl.pts[0][0]+sl.pts[1][0]+sl.pts[2][0], cy=(sl.pts[0][0]+sl.pts[1][0]+sl.pts[2][0])/3,
          cyy=(sl.pts[0][1]+sl.pts[1][1]+sl.pts[2][1])/3;
    let dx=ball.x-cx, dy=ball.y-cyy, d=Math.hypot(dx,dy), min=52+ball.r;
    if(d<min){ if(d<1e-4){dx=0;dy=-1;d=1;} const nx=dx/d, ny=dy/d;
      ball.x=cx+nx*(min+.1); ball.y=cy+ny*(min+.1);
      const vn=ball.vx*nx+ball.vy*ny; if(vn<0){ ball.vx-=1.5*vn*nx; ball.vy-=1.5*vn*ny; }
      ball.vx+=sl.kick[0]*470; ball.vy+=sl.kick[1]*470;
      sl.cd=.55; sl.flash=1; addScore(25,ball.x,ball.y-14,'#ffd27a',13);
      sparks(ball.x,ball.y,6,'#ffb14f',280); shake=Math.max(shake,1.6); sSling(); } }

  for(const f of flips){
    const tx=f.px+Math.cos(f.a)*f.len, ty=f.py+Math.sin(f.a)*f.len;
    const dx=tx-f.px, dy=ty-f.py, L2=dx*dx+dy*dy;
    let t=((ball.x-f.px)*dx+(ball.y-f.py)*dy)/L2; t=clamp(t,0,1);
    const cx=f.px+dx*t, cy=f.py+dy*t, ddx=ball.x-cx, ddy=ball.y-cy, min=ball.r+f.fr;
    let d=Math.hypot(ddx,ddy);
    if(d<min){ if(d<1e-4){ ball.x=cx; ball.y=cy-min; }
      const nx=d<1e-4?0:ddx/d, ny=d<1e-4?-1:ddy/d;
      ball.x=cx+nx*(min+.05); ball.y=cy+ny*(min+.05);
      const rx=cx-f.px, ry=cy-f.py, svx=-f.om*ry, svy=f.om*rx;
      const rvx=ball.vx-svx, rvy=ball.vy-svy, vn=rvx*nx+rvy*ny;
      if(vn<0){ ball.vx-=1.45*vn*nx; ball.vy-=1.45*vn*ny; } } }

  for(let i=rocks.length-1;i>=0;i--){ const r=rocks[i];
    let dx=ball.x-r.x, dy=ball.y-r.y, d=Math.hypot(dx,dy), min=ball.r+r.r;
    if(d<min&&d>1e-4){ const nx=dx/d, ny=dy/d, mr=r.m;
      ball.x+=nx*(min-d)*(mr/(1+mr)); r.x-=nx*(min-d)*(1/(1+mr));
      const rvx=ball.vx-r.vx, rvy=ball.vy-r.vy, vn=rvx*nx+rvy*ny;
      if(vn<0){ const j=-1.75*vn/(1+1/mr); ball.vx+=j*nx; ball.vy+=j*ny; r.vx-=j/mr*nx; r.vy-=j/mr*ny; }
      shatter(i,nx,ny); } }

  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp>1350){ ball.vx*=1350/sp; ball.vy*=1350/sp; }
  if(sp<20){ ball.still=(ball.still||0)+h; if(ball.still>2.2){ ball.vy-=150; ball.vx+=R(-70,70); ball.still=0; } }
  else ball.still=0;

  if(ball.y>865) onDrain();
}
function shatter(i,nx,ny){
  const r=rocks[i]; rocks.splice(i,1);
  addScore(TIERS[r.tier].pts,r.x,r.y,TIERS[r.tier].rim, 14+r.tier*4);
  sRock(r.tier); shake=Math.max(shake,[6,3.5,2][r.tier]);
  ring(r.x,r.y,r.r*.6,TIERS[r.tier].rim); shards(r.x,r.y,r.r,r.tier);
  r.hitFlash=0;
  if(r.tier<2){ const ct=r.tier+1, cr=TIERS[ct].r;
    for(let k=0;k<2;k++){ const ang=Math.atan2(-ny,-nx)+R(-.75,.75), sp=R(90,170)*sf;
      let cxp=r.x+Math.cos(ang)*cr*.9, cyp=r.y+Math.sin(ang)*cr*.9;
      cxp=clamp(cxp,cr+26,472-cr-8); cyp=clamp(cyp,cr+45,TH-cr-10);
      rocks.push(makeRock(ct,cxp,cyp,{x:Math.cos(ang)*sp+r.vx*.35,y:Math.sin(ang)*sp+r.vy*.35})); } }
  if(rocks.length>12) rocks.shift();
}
function stepRocks(h){
  for(const r of rocks){
    r.x+=r.vx*h; r.y+=r.vy*h; r.rot+=r.spin*h; if(r.hitFlash>0) r.hitFlash-=h*3;
    for(const s of segs){ const imp=collideSeg(r,s.a,s.b,s.c,s.d,.82); if(imp>300) noiseHit(.04,.06,700); }
    for(const b of bumpers){ let dx=r.x-b.x, dy=r.y-b.y, d=Math.hypot(dx,dy), min=b.r+r.r;
      if(d<min&&d>1e-4){ const nx=dx/d, ny=dy/d; r.x=b.x+nx*(min+.1); r.y=b.y+ny*(min+.1);
        const vn=r.vx*nx+r.vy*ny; if(vn<0){ r.vx-=1.8*vn*nx; r.vy-=1.8*vn*ny; b.flash=Math.max(b.flash,.7); noiseHit(.06,.1,500);} } }
    for(const f of flips){
      const tx=f.px+Math.cos(f.a)*f.len, ty=f.py+Math.sin(f.a)*f.len;
      const dx=tx-f.px, dy=ty-f.py, L2=dx*dx+dy*dy;
      let t=((r.x-f.px)*dx+(r.y-f.py)*dy)/L2; t=clamp(t,0,1);
      const cx=f.px+dx*t, cy=f.py+dy*t, ddx=r.x-cx, ddy=r.y-cy, min=r.r+f.fr;
      let d=Math.hypot(ddx,ddy);
      if(d<min&&d>1e-4){ const nx=ddx/d, ny=ddy/d; r.x=cx+nx*(min+.05); r.y=cy+ny*(min+.05);
        const rx=cx-f.px, ry=cy-f.py, svx=-f.om*ry, svy=f.om*rx;
        const rvx=r.vx-svx, rvy=r.vy-svy, vn=rvx*nx+rvy*ny;
        if(vn<0){ r.vx-=1.55*vn*nx; r.vy-=1.55*vn*ny; } } }
    const ms=320*sf; if(r.vx*r.vx+r.vy*r.vy>ms*ms){ const s=ms/Math.hypot(r.vx,r.vy); r.vx*=s; r.vy*=s; }
  }
  for(let i=0;i<rocks.length;i++) for(let j=i+1;j<rocks.length;j++){
    const a=rocks[i], b=rocks[j];
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r;
    if(d<min&&d>1e-4){ const nx=dx/d, ny=dy/d, ov=min-d;
      a.x-=nx*ov*(b.m/(a.m+b.m)); a.y-=ny*ov*(b.m/(a.m+b.m));
      b.x+=nx*ov*(a.m/(a.m+b.m)); b.y+=ny*ov*(a.m/(a.m+b.m));
      const rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*nx+rvy*ny;
      if(vn<0){ const j2=-1.6*vn/(1/a.m+1/b.m); a.vx-=j2/a.m*nx; a.vy-=j2/a.m*ny; b.vx+=j2/b.m*nx; b.vy+=j2/b.m*ny; } } }
}
function physStep(h){
  for(const f of flips){ const tgt=f.on?f.act:f.rest, p=f.a;
    f.a+=(tgt-f.a)*(1-Math.exp(-h*38));
    if(Math.abs(tgt-f.a)<.003){ f.a=tgt; f.om=0; } else f.om=(f.a-p)/h; }
  stepBall(h); stepRocks(h);
}

/* ============================== FX UPDATE ============================== */
function updateFx(dt){
  T+=dt; shake=Math.max(0,shake-dt*9);
  gateOpen=Math.max(0,gateOpen-dt*2.4); gateFlash=Math.max(0,gateFlash-dt*3);
  for(const b of bumpers) b.flash=Math.max(0,b.flash-dt*3);
  for(const s of slings){ s.cd-=dt; s.flash=Math.max(0,s.flash-dt*4); }
  if(plunger.kickT<9) plunger.kickT+=dt;
  if(plunger.charging&&state==='play'){ plunger.chRaw+=dt*1.5;
    plunger.charge=1-Math.abs(1-(plunger.chRaw%2)); }
  else if(!plunger.charging) plunger.charge=Math.max(0,plunger.charge-dt*4);
  plunger.topY = plunger.kickT<.3 ? 786 : (800+(plunger.charging?plunger.charge*14:0));

  if(drainDelay>0){ drainDelay-=dt; if(drainDelay<=0&&state==='play'&&ballsLeft>0) serveBall(); }
  if(state==='play'&&!paused){
    time+=dt; const nl=1+Math.floor(time/40);
    if(nl!==level){ const osf=sf; level=nl; sf=Math.min(2.2,1+(level-1)*.16); targetRocks=Math.min(2+level,7);
      for(const r of rocks){ r.vx*=sf/osf; r.vy*=sf/osf; }
      addFloat(246,430,'LEVEL '+level,'#57e8ff',30); sLevel(); shake=Math.max(shake,2); }
    if(rocks.length<targetRocks){ spawnT+=dt; if(spawnT>1.0){ spawnT=0;
      const p=rockSpawnPos(level>2&&Math.random()<.4?1:0), sp=R(45,95)*sf;
      rocks.push(makeRock(level>2&&Math.random()<.4?1:0,p.x,p.y,{x:R(-sp,sp),y:R(-sp,sp)})); } }
  }
  if(state!=='play'){ ambT-=dt; if(ambT<=0){ ambT=R(1.2,2.4); bumpers[RI(0,3)].flash=Math.max(bumpers[RI(0,3)].flash,.5);} }

  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    if(p.t==='sp'){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-3*dt; p.vy*=1-3*dt; }
    else if(p.t==='sh'){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=520*dt; p.rot+=p.vr*dt; }
    else if(p.t==='ri'){ p.r+=p.vr*dt; p.vr*=1-2.4*dt; }
    else { p.x+=p.vx*dt; p.y+=p.vy*dt; } }
  if(parts.length>320) parts.splice(0,parts.length-320);

  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.y-=34*dt;
    if(f.life<=0) floats.splice(i,1); }

  shootT-=dt;
  if(shootT<=0&&!shoot){ shoot={x:R(.1,.7)*vw,y:R(.05,.3)*vh,vx:R(380,620),vy:R(140,260),life:.8}; shootT=R(6,13); }
  if(shoot){ shoot.x+=shoot.vx*dt; shoot.y+=shoot.vy*dt; shoot.life-=dt; if(shoot.life<=0) shoot=null; }

  const prevY=ball.y;
  if(ball.active&&ball.x>472&&prevY>=165&&ball.y<165) gateOpen=1;
  if(state==='play'&&ball.active&&!ballOnPlunger()){
    ball.trail.push({x:ball.x,y:ball.y}); if(ball.trail.length>16) ball.trail.shift(); }
}

/* ============================== RENDER ============================== */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function render(){
  const shx=(Math.random()*2-1)*shake, shy=(Math.random()*2-1)*shake;
  /* --- background (screen space) --- */
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#04060f'; ctx.fillRect(0,0,vw,vh);
  const nebs=[[.2,.16,.55,'70,190,255',.13],[.85,.6,.6,'255,60,180',.11],[.5,1.05,.6,'40,220,190',.1]];
  for(const n of nebs){ const g=ctx.createRadialGradient(n[0]*vw,n[1]*vh,0,n[0]*vw,n[1]*vh,n[2]*Math.max(vw,vh));
    g.addColorStop(0,'rgba('+n[3]+','+n[4]+')'); g.addColorStop(1,'rgba('+n[3]+',0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,vw,vh); }
  for(const s of farS){ const y=(s.y*vh+T*s.sp*6)%vh, a=.35+.3*Math.sin(T*s.sp+s.tw);
    ctx.fillStyle='rgba(190,220,255,'+a.toFixed(2)+')'; ctx.fillRect(s.x*vw,y,s.s,s.s); }
  for(const s of nearS){ const y=(s.y*vh+T*s.sp*14)%vh, a=.5+.35*Math.sin(T*s.sp+s.tw);
    ctx.fillStyle='rgba(220,240,255,'+a.toFixed(2)+')'; ctx.fillRect(s.x*vw,y,s.s,s.s);
    if(s.s>2) gdraw(GLOW.cyan,s.x*vw,y,14,a*.3); }
  if(shoot){ const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*.16,shoot.y-shoot.vy*.16);
    g.addColorStop(0,'rgba(255,255,255,'+(shoot.life).toFixed(2)+')'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(shoot.x,shoot.y);
    ctx.lineTo(shoot.x-shoot.vx*.16,shoot.y-shoot.vy*.16); ctx.stroke(); }
  const vg=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.35,vw/2,vh/2,Math.max(vw,vh)*.75);
  vg.addColorStop(0,'rgba(0,0,10,0)'); vg.addColorStop(1,'rgba(0,0,10,.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,vw,vh);

  /* --- stage --- */
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*(ox+shx),dpr*(oy+shy));
  const cg=ctx.createLinearGradient(0,-14,0,SH+10);
  cg.addColorStop(0,'#151d33'); cg.addColorStop(1,'#0a0f1e');
  rr(-15,-11,SW+30,SH+22,18); ctx.fillStyle=cg; ctx.fill();
  const pulse=.4+.18*Math.sin(T*2.1);
  ctx.lineWidth=7; ctx.strokeStyle='rgba(95,230,255,'+(pulse*.35).toFixed(2)+')'; rr(-15,-11,SW+30,SH+22,18); ctx.stroke();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(150,242,255,'+pulse.toFixed(2)+')'; rr(-15,-11,SW+30,SH+22,18); ctx.stroke();
  for(const [bx,by] of [[-7,-3],[SW+7,-3],[-7,SH+3],[SW+7,SH+3]]){
    ctx.beginPath(); ctx.arc(bx,by,4,0,TAU); ctx.fillStyle='#2c3d63'; ctx.fill();
    ctx.strokeStyle='#5a719f'; ctx.lineWidth=1; ctx.stroke(); }

  /* marquee */
  ctx.fillStyle='#0b1226'; ctx.fillRect(0,0,SW,HUDH);
  ctx.fillStyle='rgba(95,230,255,.25)'; ctx.fillRect(0,HUDH-2,SW,2);

  /* table glass */
  ctx.save(); ctx.translate(0,HUDH);
  const tg=ctx.createLinearGradient(0,0,0,TH);
  tg.addColorStop(0,'#0a1230'); tg.addColorStop(.55,'#0d1738'); tg.addColorStop(1,'#111c44');
  ctx.fillStyle=tg; ctx.fillRect(6,6,SW-12,TH-12);
  const cg2=ctx.createRadialGradient(246,330,0,246,330,340);
  cg2.addColorStop(0,'rgba(80,130,255,.1)'); cg2.addColorStop(1,'rgba(80,130,255,0)');
  ctx.fillStyle=cg2; ctx.fillRect(6,6,SW-12,TH-12);
  for(const s of tStars){ const a=.2+.2*Math.sin(T*1.3+s.tw);
    ctx.fillStyle='rgba(180,215,255,'+a.toFixed(2)+')'; ctx.fillRect(s.x,s.y,s.s,s.s); }

  /* walls */
  ctx.lineCap='round';
  for(const pass of [0,1]){
    ctx.beginPath();
    for(const s of segs){ if(s.gate) continue; ctx.moveTo(s.a,s.b); ctx.lineTo(s.c,s.d); }
    ctx.moveTo(20,150); ctx.ellipse(280,150,260,115,0,Math.PI,TAU);
    if(pass===0){ ctx.strokeStyle='#1d2c4e'; ctx.lineWidth=7; }
    else { ctx.strokeStyle='rgba(111,227,255,'+(.55+.15*Math.sin(T*2)).toFixed(2)+')'; ctx.lineWidth=2.2; }
    ctx.stroke();
  }

  /* gate flap */
  const ga=-gateOpen*.55;
  ctx.save(); ctx.translate(472,165); ctx.rotate(ga);
  ctx.strokeStyle=gateFlash>0?'#fff':'#ffb14f'; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(68,0); ctx.stroke();
  ctx.restore();
  gdraw(GLOW.amber,472,165,26,gateFlash*.8);
  ctx.fillStyle='#ffb14f'; ctx.beginPath(); ctx.arc(472,165,3.5,0,TAU); ctx.fill();

  /* slings */
  for(const s of slings){
    const g=ctx.createLinearGradient(0,s.pts[0][1],0,s.pts[1][1]);
    g.addColorStop(0,'#ffd27a'); g.addColorStop(1,'#ff5b2e');
    ctx.beginPath(); ctx.moveTo(s.pts[0][0],s.pts[0][1]);
    ctx.lineTo(s.pts[1][0],s.pts[1][1]); ctx.lineTo(s.pts[2][0],s.pts[2][1]); ctx.closePath();
    ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#7a2c10'; ctx.lineWidth=2; ctx.stroke();
    const mx=(s.pts[0][0]+s.pts[1][0])/2, my=(s.pts[0][1]+s.pts[1][1])/2, kx=s.kick[0], ky=s.kick[1];
    ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2.5; ctx.beginPath();
    ctx.moveTo(mx-kx*14-ky*7,my-ky*14+kx*7); ctx.lineTo(mx-kx*14,my-ky*14); ctx.lineTo(mx-kx*14+ky*7,my-ky*14-kx*7);
    ctx.stroke();
    if(s.flash>0){ ctx.globalCompositeOperation='lighter'; gdraw(GLOW.amber,mx,my,150,s.flash*.9);
      ctx.globalAlpha=s.flash*.6; ctx.fillStyle='#fff'; ctx.fill(); ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over'; }
  }

  /* bumpers */
  for(const b of bumpers){
    const f=b.flash, sc2=1+.3*f;
    ctx.globalCompositeOperation='lighter'; gdraw(GLOW[b.css==='#ff4fd8'?'magenta':b.css==='#ffb14f'?'amber':'white'],b.x,b.y,b.r*4.4*sc2,.35+.6*f);
    ctx.globalCompositeOperation='source-over';
    const R2=b.r*sc2;
    ctx.beginPath(); ctx.arc(b.x,b.y,R2,0,TAU); ctx.fillStyle='#101a30'; ctx.fill();
    ctx.lineWidth=4.5; ctx.strokeStyle=f>.1?`rgba(255,255,255,${(.4+.6*f).toFixed(2)})`:b.css; ctx.stroke();
    const dg=ctx.createRadialGradient(b.x-R2*.25,b.y-R2*.3,R2*.1,b.x,b.y,R2);
    dg.addColorStop(0,'rgba(255,255,255,'+(.75+.2*f).toFixed(2)+')');
    dg.addColorStop(.55,'rgba('+b.col+','+(.45+.4*f).toFixed(2)+')');
    dg.addColorStop(1,'rgba('+b.col+',.15)');
    ctx.beginPath(); ctx.arc(b.x,b.y,R2*.78,0,TAU); ctx.fillStyle=dg; ctx.fill();
  }

  /* plunger + power meter */
  const pty=plunger.topY;
  ctx.strokeStyle='#4a5b85'; ctx.lineWidth=3; ctx.beginPath();
  for(let i=0;i<=6;i++){ const y=830-(830-pty)*i/6, x=506+(i%2?9:-9)*(i===0||i===6?0:1);
    if(i===0) ctx.moveTo(506,y); else ctx.lineTo(x,y); }
  ctx.stroke();
  rr(483,pty-7,46,10,3); ctx.fillStyle='#ffb14f'; ctx.fill();
  ctx.strokeStyle='#8a4d00'; ctx.lineWidth=1.5; ctx.stroke();
  if(ballOnPlunger()||plunger.charging){
    const mh=112*plunger.charge;
    ctx.fillStyle='#131c36'; ctx.fillRect(529,828-mh,7,mh);
    const mg=ctx.createLinearGradient(0,828,0,716);
    mg.addColorStop(0,'#4dff8a'); mg.addColorStop(.6,'#ffe14f'); mg.addColorStop(1,'#ff5b3e');
    ctx.fillStyle=mg; ctx.fillRect(530.5,828-mh+1.5,4,mh-3);
  }

  /* rocks */
  for(const r of rocks){
    const Tm=TIERS[r.tier];
    ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(r.rot);
    ctx.beginPath(); ctx.moveTo(r.verts[0][0],r.verts[0][1]);
    for(let i=1;i<r.verts.length;i++) ctx.lineTo(r.verts[i][0],r.verts[i][1]);
    ctx.closePath(); ctx.fillStyle=Tm.body; ctx.fill();
    ctx.lineWidth=1.8; ctx.strokeStyle=Tm.rim; ctx.stroke();
    ctx.fillStyle=Tm.dark;
    for(const c of r.cr){ ctx.beginPath(); ctx.arc(c[0],c[1],c[2],0,TAU); ctx.fill(); }
    if(r.hitFlash>0){ ctx.globalCompositeOperation='lighter'; gdraw(GLOW.white,0,0,r.r*3.4,r.hitFlash*.9); }
    ctx.restore();
  }

  /* flippers */
  for(const f of flips){
    const tx=f.px+Math.cos(f.a)*f.len, ty=f.py+Math.sin(f.a)*f.len;
    if(f.on) gdraw(GLOW.green,(f.px+tx)/2,(f.py+ty)/2,170,.35);
    ctx.lineCap='round';
    ctx.strokeStyle='#0f5c38'; ctx.lineWidth=f.fr*2;
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.strokeStyle=f.on?'#7dffb0':'#3dff8a'; ctx.lineWidth=f.fr*1.4;
    ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tx,ty); ctx.stroke();
    ctx.beginPath(); ctx.arc(f.px,f.py,f.fr*.55,0,TAU); ctx.fillStyle='#0e2a1c'; ctx.fill();
    ctx.strokeStyle='#3dff8a'; ctx.lineWidth=2; ctx.stroke();
  }

  /* ball trail + ball */
  if(ball.active){
    for(let i=0;i<ball.trail.length;i++){ const p=ball.trail[i], a=(i+1)/ball.trail.length;
      ctx.globalAlpha=a*.4; ctx.fillStyle='#5feeff';
      ctx.beginPath(); ctx.arc(p.x,p.y,ball.r*a*.85,0,TAU); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='lighter'; gdraw(GLOW.cyan,ball.x,ball.y,52,.9);
    ctx.globalCompositeOperation='source-over';
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#bffcff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(ball.x-3,ball.y-3.5,2.6,0,TAU); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
  }

  /* particles */
  for(const p of parts){ const a=clamp(p.life/p.max,0,1);
    if(p.t==='sp'){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a;
      ctx.strokeStyle=p.col; ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*.025,p.y-p.vy*.025); ctx.stroke(); }
    else if(p.t==='sh'){ ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=a;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; const s=p.size;
      ctx.beginPath(); ctx.moveTo(-s,-s*.6); ctx.lineTo(s,-s*.35); ctx.lineTo(s*.3,s*.8); ctx.closePath(); ctx.fill();
      ctx.restore(); }
    else if(p.t==='ri'){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a;
      ctx.strokeStyle=p.col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke(); }
    else { ctx.globalCompositeOperation='lighter'; gdraw(GLOW.white,p.x,p.y,26,a*.5); }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

  /* floats */
  for(const f of floats){ const a=clamp(f.life/f.max,0,1);
    ctx.font='bold '+f.size+'px '+F_DISP; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=a; ctx.lineWidth=4; ctx.strokeStyle='rgba(5,8,20,.85)';
    ctx.strokeText(f.txt,f.x,f.y); ctx.fillStyle=f.col; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;

  /* launch hint */
  if(state==='play'&&ballOnPlunger()){
    const bl=.5+.45*Math.sin(T*6);
    ctx.font='bold 10px '+F_MONO; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,177,79,'+bl.toFixed(2)+')';
    ctx.fillText('HOLD SPACE',506,742);
    for(let i=0;i<2;i++){ const yy=760+i*13+Math.sin(T*6-i)*3;
      ctx.beginPath(); ctx.moveTo(497,yy+5); ctx.lineTo(506,yy-2); ctx.lineTo(515,yy+5);
      ctx.strokeStyle='rgba(255,177,79,'+(bl).toFixed(2)+')'; ctx.lineWidth=3; ctx.stroke(); }
  }
  ctx.restore();

  /* HUD */
  try{ ctx.letterSpacing='2px'; }catch(e){}
  ctx.textBaseline='alphabetic';
  ctx.font='10px '+F_MONO; ctx.textAlign='left';
  ctx.fillStyle='#57e8ff'; ctx.fillText('SCORE',24,26);
  ctx.fillStyle='#ffb14f'; ctx.textAlign='right'; ctx.fillText('HI-SCORE',536,26);
  try{ ctx.letterSpacing='0px'; }catch(e){}
  ctx.font='bold 27px '+F_MONO;
  ctx.fillStyle='#eaffff'; ctx.textAlign='left'; ctx.fillText(String(score).padStart(6,'0'),24,58);
  ctx.fillStyle='#ffd9a0'; ctx.textAlign='right'; ctx.fillText(String(Math.max(hi,score)).padStart(6,'0'),536,58);

  const logo='ASTRO PINBALL';
  ctx.font='27px '+F_DISP; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(0,229,255,.85)'; ctx.fillText(logo,278.5,41);
  ctx.fillStyle='rgba(255,47,158,.85)'; ctx.fillText(logo,281.5,43);
  ctx.fillStyle='#fff'; ctx.fillText(logo,280,42);

  for(let i=0;i<3;i++){ const x=226+i*17;
    if(i<ballsLeft){ gdraw(GLOW.cyan,x,79,16,.5);
      ctx.beginPath(); ctx.arc(x,79,4.5,0,TAU); ctx.fillStyle='#5feeff'; ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(x,79,4.5,0,TAU); ctx.strokeStyle='rgba(120,150,200,.4)'; ctx.lineWidth=1.5; ctx.stroke(); } }
  ctx.font='bold 12px '+F_MONO; ctx.textAlign='left'; ctx.fillStyle='#9fb6d8';
  ctx.fillText('LVL '+level,272,83);

  ctx.font='9px '+F_MONO; ctx.textAlign='center'; ctx.fillStyle='rgba(150,180,220,.55)';
  ctx.fillText('A / \u25C4 LEFT   \u00B7   L / \u25BA RIGHT   \u00B7   SPACE LAUNCH   \u00B7   P PAUSE   \u00B7   M SOUND '+(muted?'OFF':'ON')+'   \u00B7   R RESTART',SW/2,SH-6);
}

/* ============================== MAIN LOOP ============================== */
let last=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(ts-last)/1000||0); last=ts;
  if(!paused){
    acc+=dt; let n=0;
    while(acc>=H&&n<12){ physStep(H); acc-=H; n++; }
    if(n===12) acc=0;
    updateFx(dt);
  }
  render();
}
/* attract-mode rocks behind the start screen */
for(let i=0;i<4;i++){ const p=rockSpawnPos(i%3);
  rocks.push(makeRock(i%3,p.x,p.y,{x:R(-50,50),y:R(-40,40)})); }
requestAnimationFrame(frame);
</script>
