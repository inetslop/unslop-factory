<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PAC-MAN 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#030614}
body{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;color:#cfe9ff;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#cv{position:fixed;inset:0;display:block}
#scan{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.25;background:repeating-linear-gradient(0deg,rgba(2,6,18,.3) 0px,rgba(2,6,18,.3) 2px,transparent 2px,transparent 4px)}
#hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;pointer-events:none;font-size:clamp(11px,1.5vw,15px);letter-spacing:.12em}
.hb{text-align:center;min-width:70px}
.lbl{color:#5f87b8;font-size:.7em;letter-spacing:.32em;margin-bottom:2px}
.val{color:#ffd934;font-weight:700;font-size:1.3em;text-shadow:0 0 10px rgba(255,217,52,.65)}
#lives{display:flex;gap:5px;justify-content:center;margin-top:7px;height:14px}
.pacIco{width:13px;height:13px;border-radius:50%;background:conic-gradient(from -90deg,transparent 0 52deg,#ffd934 52deg 308deg,transparent 308deg);box-shadow:0 0 8px rgba(255,217,52,.8)}
#muteBtn{pointer-events:auto;cursor:pointer;font:inherit;font-size:.72em;letter-spacing:.22em;color:#7fd4ff;background:rgba(8,18,40,.7);border:1px solid rgba(63,215,255,.5);padding:7px 10px;margin-top:2px}
#muteBtn:hover{background:rgba(63,215,255,.18)}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,rgba(4,9,26,.4) 0%,rgba(2,4,13,.85) 78%);text-align:center}
.hidden{display:none!important}
.panel{background:rgba(4,10,28,.82);border:1px solid rgba(63,215,255,.4);box-shadow:0 0 34px rgba(63,215,255,.16),inset 0 0 60px rgba(63,215,255,.05);padding:clamp(20px,4.5vh,44px) clamp(22px,6vw,64px);max-width:min(94vw,660px)}
.title{font-size:clamp(38px,10vw,86px);font-weight:900;letter-spacing:.06em;color:#ffd934;line-height:1.05;text-shadow:0 0 22px rgba(255,217,52,.5),5px 5px 0 #d02a4c,-4px -4px 0 #1fb8ff}
.title .t3{color:#35e0ff;text-shadow:0 0 22px rgba(53,224,255,.75),5px 5px 0 #6a1fd0;font-size:.62em;vertical-align:.18em;margin-left:.12em}
.title.red{color:#ff4b5c;text-shadow:0 0 22px rgba(255,75,92,.6),5px 5px 0 #401a8f,-4px -4px 0 #ffd934;font-size:clamp(30px,7vw,60px)}
.tag{margin-top:10px;color:#6fd6ff;letter-spacing:.42em;font-size:clamp(10px,1.6vw,13px)}
.ctl{margin:9px 0;color:#9cc4e8;font-size:clamp(11px,1.7vw,14px);letter-spacing:.12em}
.dim{color:#5f87b8}
kbd{display:inline-block;border:1px solid #3b6ea8;border-bottom-width:3px;padding:1px 7px;color:#9fdcff;background:#0a1830;margin:0 2px;font-size:.9em;box-shadow:0 0 8px rgba(53,224,255,.18)}
.btn{pointer-events:auto;cursor:pointer;font:inherit;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:#ffd934;background:rgba(6,14,34,.85);border:2px solid #ffd934;padding:12px 30px;margin-top:18px;font-size:clamp(13px,2vw,16px);box-shadow:0 0 16px rgba(255,217,52,.35),inset 0 0 12px rgba(255,217,52,.1);transition:background .15s,color .15s,box-shadow .15s}
.btn:hover{background:#ffd934;color:#0a1020;box-shadow:0 0 30px rgba(255,217,52,.8)}
.blink{margin-top:16px;color:#ffd934;letter-spacing:.3em;font-size:clamp(11px,1.8vw,14px);animation:bl 1.1s steps(2,start) infinite}
@keyframes bl{50%{opacity:.1}}
#recV{color:#35e0ff;letter-spacing:.3em;margin-top:8px;font-weight:700;text-shadow:0 0 12px rgba(53,224,255,.8)}
.gold{color:#ffd934;font-weight:700}
#dpad{position:fixed;right:14px;bottom:14px;z-index:8;display:none;grid-template-columns:repeat(3,56px);grid-auto-rows:56px;gap:7px}
@media (pointer:coarse){#dpad{display:grid}}
.dbtn{cursor:pointer;font-size:20px;color:#9fdcff;background:rgba(10,22,48,.55);border:1px solid rgba(63,215,255,.55);box-shadow:0 0 10px rgba(63,215,255,.2);touch-action:none}
.dbtn:active{background:rgba(63,215,255,.3)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="scan"></div>

<div id="hud">
  <div class="hb"><div class="lbl">SCORE</div><div class="val" id="scoreV">0</div><div id="lives"></div></div>
  <div class="hb"><div class="lbl">HI-SCORE</div><div class="val" id="hiV">0</div></div>
  <div class="hb"><div class="lbl">STAGE</div><div class="val" id="lvV">1</div></div>
  <button id="muteBtn">SOUND ON</button>
</div>

<div class="ov" id="menuOv"><div class="panel">
  <div class="title">PAC-MAN<span class="t3">3D</span></div>
  <div class="tag">NEON MEGACITY CHASE</div>
  <div style="height:14px"></div>
  <div class="ctl"><kbd>&#8593;</kbd><kbd>&#8595;</kbd><kbd>&#8592;</kbd><kbd>&#8594;</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;MOVE</div>
  <div class="ctl"><kbd>P</kbd> PAUSE &nbsp;&nbsp;<kbd>R</kbd> RESTART &nbsp;&nbsp;<kbd>M</kbd> SOUND</div>
  <div class="ctl dim">GRAZE EVERY CHIP &middot; POWER PELLETS TURN THE GHOSTS BLUE</div>
  <button class="btn" id="startBtn">Insert Coin</button>
  <div class="blink">PRESS ENTER TO START</div>
  <div class="ctl dim" id="menuHi"></div>
</div></div>

<div class="ov hidden" id="overOv"><div class="panel">
  <div class="title red">GAME OVER</div>
  <div class="ctl" style="margin-top:16px">FINAL SCORE &nbsp;<span class="gold" id="finV">0</span></div>
  <div id="recV" class="hidden">&#9733; NEW HI-SCORE &#9733;</div>
  <button class="btn" id="againBtn">Play Again</button>
  <div class="blink">PRESS ENTER</div>
</div></div>

<div class="ov hidden" id="pauseOv"><div class="panel">
  <div class="title" style="font-size:clamp(26px,5vw,44px)">PAUSED</div>
  <div class="ctl" style="margin-top:14px"><kbd>P</kbd> RESUME &nbsp;&nbsp;<kbd>R</kbd> RESTART</div>
</div></div>

<div id="dpad">
  <span></span><button class="dbtn" data-d="0,-1">&#9650;</button><span></span>
  <button class="dbtn" data-d="-1,0">&#9664;</button><span></span><button class="dbtn" data-d="1,0">&#9654;</button>
  <span></span><button class="dbtn" data-d="0,1">&#9660;</button><span></span>
</div>

<script>
'use strict';
/* ================= canvas ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let vw=0,vh=0,dpr=1;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);vw=window.innerWidth;vh=window.innerHeight;cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

/* ================= maze (built from mirrored halves — always symmetric) ================= */
const MW=19,MH=21,WH=.85;
const LH=[
"##########",
"#.........",
"#o####.#..",
"#.........",
"#.####.###",
"#.####....",
"#.........",
"##..#.....",
"##..#.....",
"###...##..",
"T.....H..",
"#......H..",
"#......HHH",
"#.........",
"#..#.##...",
"#.........",
"#.####....",
"#.####.###",
"#.........",
"##..#.....",
"##########"];
const wall=new Uint8Array(MW*MH),houseF=new Uint8Array(MW*MH),pellet=new Uint8Array(MW*MH),pelletInit=new Uint8Array(MW*MH);
for(let z=0;z<MH;z++)for(let x=0;x<MW;x++){
  const ch=x<=9?LH[z][x]:LH[z][MW-1-x],i=z*MW+x;
  if(ch==='#'||ch==='H'){wall[i]=1;if(ch==='H')houseF[i]=1;}
  else pellet[i]=(ch==='.'||ch==='T')?1:(ch==='o'?2:0);
}
pellet[18*MW+1]=2;pellet[18*MW+17]=2;
[[8,10],[9,10],[10,10],[8,11],[9,11],[10,11],[9,16]].forEach(p=>{pellet[p[1]*MW+p[0]]=0;});
pelletInit.set(pellet);
const walls=[];for(let z=0;z<MH;z++)for(let x=0;x<MW;x++)if(wall[z*MW+x])walls.push({x:x,z:z,h:houseF[z*MW+x]});
function isOpen(x,z){if(z<0||z>=MH)return false;x=((x%MW)+MW)%MW;return wall[z*MW+x]===0;}
function m19(x){return ((x%MW)+MW)%MW;}

/* ================= entities / state ================= */
const PAC={x:9,z:16,dir:[-1,0],faceA:Math.PI,chomp:0,blocked:false};
const GDEF=[
 {id:0,sc:[17,1], hx:9,hz:8,out:true, delay:0,  top:'#ff6a5b',bot:'#c1140d'},
 {id:1,sc:[1,1],  hx:9,hz:11,delay:2.5,top:'#ffc7ec',bot:'#d867b4'},
 {id:2,sc:[15,19],hx:8,hz:11,delay:6,  top:'#5ef2ff',bot:'#0a9fd0'},
 {id:3,sc:[1,19], hx:10,hz:11,delay:10,top:'#ffc36b',bot:'#d97a14'}];
let ghosts=[];
function makeGhosts(){ghosts=GDEF.map(d=>({id:d.id,sc:d.sc,top:d.top,bot:d.bot,x:d.hx,z:d.hz,dir:d.out?[0,1]:[0,-1],state:d.out?'free':'house',fright:false,delay:d.delay,bob:Math.random()*7,respawnT:0,blocked:false}));}

let state='menu',paused=false,stateT=0,level=1,score=0,dispScore=0,lives=3,dotsLeft=0,runStartHi=0;
let frightT=0,chain=0,modeT=0,modeIdx=-1,levelPlayT=0,lastSiren=-1;
const cam={x:9,z:10.5};
let popups=[],rings=[],shake=0,gtime=0;
let hi=0;try{hi=parseInt(localStorage.getItem('pac3d.hi')||'0',10)||0;}catch(e){}
function saveHi(){try{localStorage.setItem('pac3d.hi',String(hi));}catch(e){}}

const pacSpd=()=>Math.min(8.4,5.4+level*.3);
function ghostSpd(g){if(g.state==='eyes')return pacSpd()*1.9;if(g.state==='exit'||g.state==='respawn')return pacSpd()*.7;return g.fright?pacSpd()*.55:pacSpd();}

/* ================= audio (WebAudio, post first input) ================= */
let AC=null,master=null,muted=false,lastWaka=0,wakaAlt=false;
function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(o){if(!AC)return;const t0=AC.currentTime+(o.at||0),osc=AC.createOscillator(),g=AC.createGain();osc.type=o.w||'square';osc.frequency.setValueAtTime(o.f,t0);if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(30,o.f2),t0+o.d);g.gain.setValueAtTime(o.v||.15,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+o.d);osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+o.d+.03);}
const sfx={
 waka(){if(AC&&gtime-lastWaka<.07)return;lastWaka=gtime;wakaAlt=!wakaAlt;tone({f:wakaAlt?540:340,f2:wakaAlt?290:190,d:.08,v:.11});},
 power(){tone({w:'sawtooth',f:170,f2:950,d:.35,v:.16});tone({f:430,f2:1250,d:.3,v:.07,at:.06});},
 eat(){tone({f:1500,f2:170,d:.28,v:.18});tone({w:'sine',f:900,f2:1700,d:.14,v:.1,at:.03});},
 death(){for(let i=0;i<7;i++)tone({w:'sawtooth',f:620-i*68,f2:540-i*68,d:.15,v:.15,at:i*.13});tone({f:130,f2:42,d:.5,v:.2,at:1.0});},
 clear(){[523,659,784,1047].forEach((f,i)=>tone({f:f,d:.13,v:.13,at:i*.11}));tone({f:1319,d:.3,v:.11,at:.46});},
 ready(){tone({f:440,d:.12,v:.11});tone({f:660,d:.18,v:.11,at:.15});}};

/* ================= input ================= */
const KM={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
const held=[];
function setDir(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1);held.push(d);}
function removeDir(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1);}
const wantDir=()=>held.length?held[held.length-1]:null;
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(KM[k]){e.preventDefault();ensureAudio();setDir(KM[k]);return;}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();ensureAudio();primaryAction();return;}
  if(k==='p'){togglePause();return;}
  if(k==='m'){ensureAudio();toggleMute();return;}
  if(k==='r'){ensureAudio();startGame();}
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KM[k])removeDir(KM[k]);});

/* ================= game flow ================= */
function refillDots(){pellet.set(pelletInit);dotsLeft=0;for(let i=0;i<pellet.length;i++)if(pellet[i])dotsLeft++;}
function resetPac(){PAC.x=9;PAC.z=16;PAC.dir=[-1,0];PAC.chomp=0;held.length=0;}
function startGame(){score=0;dispScore=0;lives=3;level=1;runStartHi=hi;popups=[];rings=[];startLevel();}
function startLevel(){refillDots();makeGhosts();resetPac();state='ready';stateT=0;modeT=0;modeIdx=-1;frightT=0;chain=0;levelPlayT=0;lastSiren=-1;sfx.ready();showOv(null);syncHUD(true);}
function primaryAction(){if(state==='menu'||state==='gameover')startGame();else if(paused)togglePause();}
function togglePause(){if(!['play','ready','dying','clear'].indexOf(state)>=0)return;paused=!paused;if(paused)showOv(document.getElementById('pauseOv'));else showOv(null);}

/* ================= AI ================= */
const SEQ=[[7,0],[20,1],[7,0],[20,1],[5,0],[9e9,1]];
function curMode(){return modeIdx>=0?SEQ[modeIdx][1]:0;}
function updateMode(){let acc=0,idx=SEQ.length-1;for(let i=0;i<SEQ.length;i++){if(modeT<acc+SEQ[i][0]){idx=i;break;}acc+=SEQ[i][0];}
 if(idx!==modeIdx){if(modeIdx>=0)for(const g of ghosts)if(g.state==='free'&&!g.fright)g.dir=[-g.dir[0],-g.dir[1]];modeIdx=idx;}}
function wdx(a,b){let d=a-b;if(d>MW/2)d-=MW;else if(d<-MW/2)d+=MW;return d;}
const DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
function pickDir(g,tx,tz){let best=null,bd=1e9;for(const d of DIRS){if(d[0]===-g.dir[0]&&d[1]===-g.dir[1])continue;const nx=m19(g.x+d[0]),nz=g.z+d[1];if(!isOpen(nx,nz))continue;const dxw=wdx(nx,tx),dz=nz-tz,dd=dxw*dxw+dz*dz;if(dd<bd){bd=dd;best=[d[0],d[1]];}}return best||[-g.dir[0],-g.dir[1]];}
function randDir(g){const o=[];for(const d of DIRS)if(isOpen(m19(g.x+d[0]),g.z+d[1]))o.push(d);return o.length?o[(Math.random()*o.length)|0]:[-g.dir[0],-g.dir[1]];}
function gTarget(g){if(curMode()===0)return g.sc;const px=m19(Math.round(PAC.x)),pz=Math.round(PAC.z);
 switch(g.id){
  case 0:return [px,pz];
  case 1:return [m19(px+PAC.dir[0]*4),pz+PAC.dir[1]*4];
  case 2:{const ax=m19(px+PAC.dir[0]*2),az=pz+PAC.dir[1]*2;return [m19(ax*2-m19(ghosts[0].x)),az*2-Math.round(ghosts[0].z)];}
  case 3:{const dx=wdx(PAC.x,g.x),dz=PAC.z-g.z;return (dx*dx+dz*dz>64)?[px,pz]:g.sc;}}}
function ghOnCenter(e){if(e.state==='house'||e.state==='respawn')return;
 if(e.state==='exit'){if(e.x===9&&e.z<=9){e.state='free';e.dir=[0,1];}else e.dir=pickDir(e,9,9);return;}
 if(e.state==='eyes'){if(e.x===9&&e.z===10){e.state='respawn';e.respawnT=1.2;e.fright=false;e.bob=Math.random()*7;}else e.dir=pickDir(e,9,10);return;}
 if(e.fright)e.dir=randDir(e);else{const t=gTarget(e);e.dir=pickDir(e,t[0],t[1]);}}

/* ================= movement (grid-snap with tunnel wrap) ================= */
function step(e,dist,onCenter){let rem=dist;e.blocked=false;
 while(rem>1e-4){const D=e.dir;
  if(D[0]!==0){
   const nx=D[0]>0?Math.floor(e.x)+1:Math.ceil(e.x)-1,dc=D[0]>0?nx-e.x:e.x-nx;
   if(isOpen(nx,e.z)){if(dc<=rem){rem-=dc;e.x=nx;if(e.x<0)e.x+=MW;else if(e.x>=MW)e.x-=MW;onCenter(e);}else{e.x+=D[0]*rem;rem=0;}}
   else{const face=D[0]>0?nx-.5:nx+.5,df=D[0]>0?face-e.x:e.x-face;if(df<=rem){e.x=face;e.blocked=true;rem=0;}else{e.x+=D[0]*rem;rem=0;}break;}
  }else{
   const nz=D[1]>0?Math.floor(e.z)+1:Math.ceil(e.z)-1,dc=D[1]>0?nz-e.z:e.z-nz;
   if(isOpen(e.x,nz)){if(dc<=rem){rem-=dc;e.z=nz;onCenter(e);}else{e.z+=D[1]*rem;rem=0;}}
   else{const face=D[1]>0?nz-.5:nz+.5,df=D[1]>0?face-e.z:e.z-face;if(df<=rem){e.z=face;e.blocked=true;rem=0;}else{e.z+=D[1]*rem;rem=0;}break;}
  }}}
function pacOnCenter(e){const w=wantDir();if(!w)return;if(w[0]===-e.dir[0]&&w[1]===-e.dir[1])return;if(isOpen(e.x+w[0],e.z+w[1]))e.dir=w;}

function updateGhost(g,dt){g.bob+=dt*6;
 if(g.state==='house'){if(levelPlayT>g.delay)g.state='exit';return;}
 if(g.state==='respawn'){g.respawnT-=dt;if(g.respawnT<=0){g.x=9;g.z=11;g.dir=[0,-1];g.state='free';g.fright=frightT>0;}return;}
 step(g,ghostSpd(g)*dt,ghOnCenter);}

function powerUp(){frightT=Math.max(1.6,6-level*.45);chain=0;for(const g of ghosts)if(g.state==='free'){g.fright=true;g.dir=[-g.dir[0],-g.dir[1]];}sfx.power();}
function die(){state='dying';stateT=0;shake=1.2;sfx.death();rings.push({x:PAC.x,z:PAC.z,t:0,c:'255,90,90'});}

function updatePlay(dt){
 modeT+=dt;levelPlayT+=dt;updateMode();
 if(frightT>0){frightT-=dt;
  if(frightT<=0){for(const g of ghosts)g.fright=false;}
  else{const ph=Math.floor(gtime/.14);if(ph!==lastSiren){lastSiren=ph;tone({w:'triangle',f:ph%2?310:540,d:.1,v:.06});}}}
 const w=wantDir();
 if(w&&w[0]===-PAC.dir[0]&&w[1]===-PAC.dir[1])PAC.dir=w;
 step(PAC,pacSpd()*dt,pacOnCenter);
 PAC.chomp+=dt*9;
 if(PAC.blocked&&w){const bx=PAC.dir[0]>0?Math.floor(PAC.x):PAC.dir[0]<0?Math.ceil(PAC.x):Math.round(PAC.x),bz=PAC.dir[1]>0?Math.floor(PAC.z):PAC.dir[1]<0?Math.ceil(PAC.z):Math.round(PAC.z);
  if(!(w[0]===-PAC.dir[0]&&w[1]===-PAC.dir[1])&&(w[0]!==PAC.dir[0]||w[1]!==PAC.dir[1])&&isOpen(bx+w[0],bz+w[1])){PAC.x=bx;PAC.z=bz;PAC.dir=w;}}
 const cx=m19(Math.round(PAC.x)),cz=Math.round(PAC.z);
 if(Math.abs(PAC.x-cx)<=.5&&Math.abs(PAC.z-cz)<=.5){const i=cz*MW+cx;
  if(pellet[i]){const p=pellet[i];pellet[i]=0;dotsLeft--;score+=p===2?50:10;if(score>hi)hi=score;sfx.waka();
   if(p===2){powerUp();rings.push({x:PAC.x,z:PAC.z,t:0,c:'63,215,255'});}}}
 for(const g of ghosts)updateGhost(g,dt);
 for(const g of ghosts){if(g.state!=='free')continue;const dx=wdx(PAC.x,g.x),dz=PAC.z-g.z;
  if(dx*dx+dz*dz<.36){
   if(g.fright){const val=200<<Math.min(3,chain);chain++;score+=val;popups.push({x:g.x,z:g.z,t:0,txt:'+'+val});rings.push({x:g.x,z:g.z,t:0,c:'255,217,52'});shake=Math.max(shake,.5);sfx.eat();g.state='eyes';g.fright=false;}
   else{die();return;}}}
 if(dotsLeft<=0){state='clear';stateT=0;sfx.clear();}}

/* ================= update loop ================= */
function update(dt){
 gtime+=dt;stateT+=dt;shake=Math.max(0,shake-dt*1.6);
 dispScore+=(score-dispScore)*Math.min(1,dt*8);if(Math.abs(score-dispScore)<1)dispScore=score;
 for(let i=popups.length-1;i>=0;i--){popups[i].t+=dt*1.1;if(popups[i].t>1)popups.splice(i,1);}
 for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt*2.4;if(rings[i].t>1)rings.splice(i,1);}
 if(state==='ready'){if(stateT>1.7)state='play';}
 else if(state==='play')updatePlay(dt);
 else if(state==='dying'){if(stateT>2){lives--;
  if(lives<=0){state='gameover';saveHi();document.getElementById('finV').textContent=score;
   document.getElementById('recV').classList.toggle('hidden',!(score>runStartHi&&score>0));showOv(document.getElementById('overOv'));}
  else{resetPac();makeGhosts();frightT=0;chain=0;modeT=0;modeIdx=-1;levelPlayT=0;state='ready';stateT=0;sfx.ready();}}}
 else if(state==='clear'){if(stateT>2.6){level++;startLevel();}}
 let tx,tz;
 if(state==='menu'){tx=9+Math.sin(gtime*.4)*2.3;tz=10.5+Math.cos(gtime*.31)*1.7;}
 else{tx=PAC.x+PAC.dir[0]*.7;tz=PAC.z+PAC.dir[1]*.7;if(state==='dying'){tx=PAC.x;tz=PAC.z;}}
 cam.x+=wdx(tx,cam.x)*Math.min(1,dt*5);cam.z+=(tz-cam.z)*Math.min(1,dt*5);
 syncHUD(false);}

/* ================= HUD / overlays ================= */
const elScore=document.getElementById('scoreV'),elHi=document.getElementById('hiV'),elLv=document.getElementById('lvV'),elLives=document.getElementById('lives'),elMenuHi=document.getElementById('menuHi');
let cS=-1,cH=-1,cL=-1,cLi=-1;
function syncHUD(force){
 const s=Math.round(dispScore);if(force||s!==cS){cS=s;elScore.textContent=s;}
 const h=Math.max(hi,s);if(force||h!==cH){cH=h;elHi.textContent=h;elMenuHi.textContent='HI-SCORE '+String(h).padStart(6,'0');}
 if(force||level!==cL){cL=level;elLv.textContent=level;}
 if(force||lives!==cLi){cLi=lives;elLives.innerHTML='<span class="pacIco"></span>'.repeat(Math.max(0,lives));}}
const ovs=[document.getElementById('menuOv'),document.getElementById('overOv'),document.getElementById('pauseOv')];
function showOv(el){for(const o of ovs)o.classList.toggle('hidden',o!==el);}
document.getElementById('startBtn').addEventListener('click',()=>{ensureAudio();startGame();});
document.getElementById('againBtn').addEventListener('click',()=>{ensureAudio();startGame();});
const muteBtn=document.getElementById('muteBtn');
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;muteBtn.textContent=muted?'SOUND OFF':'SOUND ON';}
muteBtn.addEventListener('click',()=>{ensureAudio();toggleMute();});
document.querySelectorAll('.dbtn').forEach(b=>{const p=b.dataset.d.split(','),dv=[+p[0],+p[1]];
 b.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();setDir(dv);if(state==='menu'||state==='gameover')startGame();});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>removeDir(dv)));});
cv.addEventListener('pointerdown',()=>{ensureAudio();primaryAction();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&['play','ready','dying','clear'].indexOf(state)>=0)togglePause();});

/* ================= 3D projection (fixed-orientation chase cam) ================= */
const CAMH=8.6,CAMD=7.4,CL=Math.hypot(CAMH,CAMD),Cs=CAMH/CL,Cc=CAMD/CL;
let FL=0,cx0=0,cy0=0,shX=0,shY=0;
function Pr(x,y,z){const vx=x-cam.x,vy=y-CAMH,vz=z-(cam.z+CAMD);const dz=-Cs*vy-Cc*vz;if(dz<.35)return null;const k=FL/dz;return [cx0+shX+vx*k,cy0+shY-(Cc*vy-Cs*vz)*k,dz];}
function Pc(x,y,z){return Pr(x+Math.round((cam.x-x)/MW)*MW,y,z);}

/* ================= render helpers ================= */
const MAXD=27;
const stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.3,p:Math.random()*6,s:.4+Math.random()*.9});
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(3)+')';}
function quad(a,b,c,d,fill){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}}
function edge(pts,close,lw,col){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke();}
const CB=[36,64,150],CN=[16,32,86],CSd=[9,20,56];
const PB=[96,30,92],PN=[62,18,58],PSd=[42,12,40];

function drawWall(it){const x=it.x,z=it.z,a=it.a,h=WH;
 const pal=it.h?[PB,PN,PSd]:[CB,CN,CSd];
 let nA=Pc(x-.5,0,z-.5),nB=Pc(x+.5,0,z-.5),nC=Pc(x+.5,h,z-.5),nD=Pc(x-.5,h,z-.5);
 if(nA&&nB&&nC&&nD)quad(nA,nB,nC,nD,rgba(pal[1],a));
 const sxw=cam.x<x?x-.5:x+.5;
 let sA=Pc(sxw,0,z-.5),sB=Pc(sxw,0,z+.5),sC=Pc(sxw,h,z+.5),sD=Pc(sxw,h,z-.5);
 if(sA&&sB&&sC&&sD)quad(sA,sB,sC,sD,rgba(pal[2],a));
 let tA=Pc(x-.5,h,z-.5),tB=Pc(x+.5,h,z-.5),tC=Pc(x+.5,h,z+.5),tD=Pc(x-.5,h,z+.5);
 if(tA&&tB&&tC&&tD){quad(tA,tB,tC,tD,rgba(pal[0],a));
  const flash=(state==='clear')&&(Math.floor(stateT*6)%2===0);
  let s1=it.h?'rgba(255,95,168,':'rgba(63,215,255,',s2=it.h?'rgba(255,208,234,':'rgba(207,238,255,';
  if(flash){s1='rgba(255,217,52,';s2='rgba(255,243,176,';}
  const tp=[tA,tB,tC,tD];
  if(it.d<19){edge(tp,true,4,s1+(a*.16).toFixed(3)+')');edge(tp,true,1.5,s2+(a*.85).toFixed(3)+')');}
  else edge(tp,true,1.2,s2+(a*.5).toFixed(3)+'));}}

function drawDot(it){const q=Pc(it.x,.16,it.z);if(!q)return;const s=FL/q[2],a=it.a;
 if(it.p===2){const r=(0.3+0.07*Math.sin(gtime*5+it.x*1.7+it.z))*s;
  ctx.globalAlpha=a*.35;ctx.fillStyle='#ffd934';ctx.beginPath();ctx.arc(q[0],q[1],r*2,0,7);ctx.fill();
  ctx.globalAlpha=a;ctx.fillStyle='#ffe86b';ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill();
  const ang=gtime*3+it.x;ctx.strokeStyle='rgba(255,240,150,'+(a*.9).toFixed(3)+')';ctx.lineWidth=Math.max(1,s*.05);
  ctx.beginPath();ctx.arc(q[0],q[1],r*1.55,ang,ang+1.2);ctx.stroke();
  ctx.beginPath();ctx.arc(q[0],q[1],r*1.55,ang+Math.PI,ang+Math.PI+1.2);ctx.stroke();}
 else{const r=.16*s;
  ctx.globalAlpha=a*.3;ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(q[0],q[1],r*2.1,0,7);ctx.fill();
  ctx.globalAlpha=a;ctx.fillStyle='#ffe9c4';ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill();}
 ctx.globalAlpha=1;}

function drawPac(){const dying=state==='dying';
 const bob=(state==='play')?0.05+0.04*Math.sin(gtime*11):0;
 const q=Pc(PAC.x,bob,PAC.z);if(!q)return;const s=FL/q[2];
 const sh=Pc(PAC.x,0,PAC.z);if(sh){ctx.globalAlpha=.35;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(sh[0],sh[1],s*.4,s*.16,0,0,7);ctx.fill();ctx.globalAlpha=1;}
 let R=s*.46,mo;
 if(dying){R*=(1-Math.min(1,stateT/1.9));if(R<1)return;mo=1.35;}
 else if(state==='menu')mo=.15+.12*Math.sin(gtime*2.2);
 else mo=.2+.34*Math.abs(Math.sin(PAC.chomp));
 const f=Pc(PAC.x+PAC.dir[0],0,PAC.z+PAC.dir[1]);let ta=f?Math.atan2(f[1]-q[1],f[0]-q[0]):PAC.faceA;
 let dd=ta-PAC.faceA;while(dd>Math.PI)dd-=6.283;while(dd<-Math.PI)dd+=6.283;PAC.faceA+=dd*.35;
 const a=PAC.faceA+(dying?stateT*10:0);
 const g=ctx.createRadialGradient(q[0]-R*.3,q[1]-R*.35,R*.1,q[0],q[1],R);g.addColorStop(0,'#fff8c4');g.addColorStop(.55,'#ffd934');g.addColorStop(1,'#f0a808');
 ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.arc(q[0],q[1],R,a+mo,a-mo);ctx.closePath();ctx.fillStyle=g;ctx.fill();
 if(!dying&&R>6){const ex=q[0]+Math.cos(a-1.15)*R*.42,ey=q[1]+Math.sin(a-1.15)*R*.42;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,R*.15,0,7);ctx.fill();
  ctx.fillStyle='#182a63';ctx.beginPath();ctx.arc(ex+Math.cos(a)*R*.06,ey+Math.sin(a)*R*.06,R*.075,0,7);ctx.fill();}}

function eyePair(q,R,ta,pxl,pyl,full){
 for(let sgn=-1;sgn<=1;sgn+=2){const ex=q[0]+sgn*R*.3,ey=q[1]-R*.24;
  if(full){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,ey,R*.2,R*.26,0,0,7);ctx.fill();
   ctx.fillStyle='#2a3aa0';ctx.beginPath();ctx.arc(ex+pxl,ey+pyl,R*.1,0,7);ctx.fill();}
  else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,R*.14,0,7);ctx.fill();
   ctx.fillStyle='#2a3aa0';ctx.beginPath();ctx.arc(ex+pxl,ey+pyl,R*.08,0,7);ctx.fill();}}}

function drawGhost(g){const bob=.3+.07*Math.sin(gtime*5+g.bob);const q=Pc(g.x,bob,g.z);if(!q)return;
 const s=FL/q[2],R=s*.5*(1+.04*Math.sin(gtime*6+g.bob));if(R<2)return;
 const sh=Pc(g.x,0,g.z);if(sh){ctx.globalAlpha=.3;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(sh[0],sh[1],s*.42,s*.15,0,0,7);ctx.fill();ctx.globalAlpha=1;}
 const f=Pc(g.x+g.dir[0]*1.2,0,g.z+g.dir[1]*1.2);const ta=f?Math.atan2(f[1]-q[1],f[0]-q[0]):0;
 const pxl=Math.cos(ta)*R*.07,pyl=Math.sin(ta)*R*.07;
 if(g.state==='eyes'){ctx.globalAlpha=.9;ctx.fillStyle='rgba(140,200,255,.18)';ctx.beginPath();ctx.arc(q[0],q[1]-R*.2,R*.6,0,7);ctx.fill();ctx.globalAlpha=1;eyePair(q,R,ta,pxl,pyl,false);return;}
 let top=g.top,bot=g.bot,wht=false;
 if(g.fright){top='#5a5aff';bot='#2323c8';if(frightT<1.6&&Math.floor(gtime*4)%2===0){top='#ffffff';bot='#d8d8ff';wht=true;}}
 const gr=ctx.createLinearGradient(q[0],q[1]-R,q[0],q[1]+R);gr.addColorStop(0,top);gr.addColorStop(1,bot);
 const y2=q[1]+R*.72,w=R*2/3;
 ctx.beginPath();ctx.moveTo(q[0]-R,q[1]-R*.05);ctx.arc(q[0],q[1]-R*.05,R,Math.PI,0,false);ctx.lineTo(q[0]+R,y2);
 for(let i=0;i<3;i++){const xm=q[0]+R-(i+.5)*w,x0=q[0]+R-(i+1)*w;
  ctx.quadraticCurveTo(xm,y2+R*.3*(1+.3*Math.sin(gtime*9+i+g.bob)),x0,y2);}
 ctx.closePath();ctx.fillStyle=gr;ctx.fill();
 if(!g.fright)eyePair(q,R,ta,pxl,pyl,true);
 else{const wc=wht?'#8a8aff':'#ffffff';
  ctx.fillStyle=wc;ctx.beginPath();ctx.arc(q[0]-R*.3,q[1]-R*.22,R*.13,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(q[0]+R*.3,q[1]-R*.22,R*.13,0,7);ctx.fill();
  ctx.strokeStyle=wc;ctx.lineWidth=Math.max(1,R*.09);
  const ms=R*.9/4;let mx=q[0]-R*.45;ctx.beginPath();ctx.moveTo(mx,q[1]+R*.2);
  for(let i=0;i<4;i++){const nx=mx+ms;ctx.lineTo((mx+nx)/2,q[1]+(i%2?R*.3:R*.1));ctx.lineTo(nx,q[1]+R*.2);mx=nx;}
  ctx.stroke();}}

/* ================= render ================= */
const DL=[];
function bigText(txt,col,y){ctx.font='900 '+Math.round(vh*.055)+'px ui-monospace,Menlo,Consolas,monospace';ctx.textAlign='center';ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=22;ctx.fillText(txt,vw/2,y);ctx.shadowBlur=0;}
function render(){
 FL=vh*1.32;cx0=vw/2;cy0=vh*.46;
 shX=(Math.random()*2-1)*shake*9;shY=(Math.random()*2-1)*shake*7;
 const bg=ctx.createLinearGradient(0,0,0,vh);bg.addColorStop(0,'#071030');bg.addColorStop(.55,'#04081c');bg.addColorStop(1,'#02040c');
 ctx.fillStyle=bg;ctx.fillRect(0,0,vw,vh);
 for(const st of stars){const sx=((st.x*vw-cam.x*7-gtime*3)%vw+vw)%vw,sy=st.y*vh*.8,a=(.18+.4*Math.abs(Math.sin(gtime*st.s+st.p)))*(1-st.y*.8);
  ctx.fillStyle='rgba(165,215,255,'+a.toFixed(3)+')';ctx.beginPath();ctx.arc(sx,sy,st.r,0,7);ctx.fill();}
 /* floor */
 const fA=Pr(cam.x-16,0,cam.z+15),fB=Pr(cam.x+16,0,cam.z+15),fC=Pr(cam.x+16,0,cam.z-24),fD=Pr(cam.x-16,0,cam.z-24);
 if(fA&&fB&&fC&&fD){const fm=Pr(cam.x,0,cam.z-24),fn=Pr(cam.x,0,cam.z+15);
  const fg=ctx.createLinearGradient(fm[0],fm[1],fn[0],fn[1]);fg.addColorStop(0,'rgba(13,26,62,.95)');fg.addColorStop(1,'rgba(4,8,22,.96)');
  ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(fA[0],fA[1]);ctx.lineTo(fB[0],fB[1]);ctx.lineTo(fC[0],fC[1]);ctx.lineTo(fD[0],fD[1]);ctx.closePath();ctx.fill();
  const pl=Pc(PAC.x,0,PAC.z);
  if(pl){const s=FL/pl[2];const lg=ctx.createRadialGradient(pl[0],pl[1],0,pl[0],pl[1],s*4.6);lg.addColorStop(0,'rgba(255,214,90,.13)');lg.addColorStop(1,'rgba(255,214,90,0)');
   ctx.fillStyle=lg;ctx.beginPath();ctx.arc(pl[0],pl[1],s*4.6,0,7);ctx.fill();}}
 /* grid */
 ctx.strokeStyle='rgba(63,215,255,.07)';ctx.lineWidth=1;ctx.beginPath();
 const gx0=Math.max(0,Math.floor(cam.x)-9),gx1=Math.min(MW-1,Math.floor(cam.x)+9);
 for(let gx=gx0;gx<=gx1;gx++){const ox=gx+.5+Math.round((cam.x-(gx+.5))/MW)*MW;if(Math.abs(ox-cam.x)>10)continue;
  const a=Pr(ox,0,cam.z-13),b=Pr(ox,0,cam.z+9);if(a&&b){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}}
 const gz0=Math.max(0,Math.floor(cam.z)-11),gz1=Math.min(MH-1,Math.ceil(cam.z)+8);
 for(let gz=gz0;gz<=gz1;gz++){const oz=gz+.5;if(Math.abs(oz-cam.z)>12)continue;
  const a=Pr(cam.x-10,0,oz),b=Pr(cam.x+10,0,oz);if(a&&b){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}}
 ctx.stroke();
 /* draw list (sorted far→near by world z — camera never rotates) */
 DL.length=0;
 for(const w of walls){const ox=w.x+Math.round((cam.x-w.x)/MW)*MW;if(Math.abs(ox-cam.x)>12)continue;
  const dzc=w.z-cam.z;if(dzc>16||dzc<-13)continue;
  const p0=Pr(ox,0,w.z);if(!p0)continue;
  const a=Math.min(1,(MAXD-p0[2])/8);if(a<.03)continue;
  DL.push({z:w.z,k:0,x:w.x,h:w.h,a:a,d:p0[2]});}
 const zx0=Math.max(0,Math.floor(cam.z)-13),zx1=Math.min(MH-1,Math.ceil(cam.z)+12);
 for(let z=zx0;z<=zx1;z++){const dzc=z-cam.z;if(dzc>14||dzc<-12)continue;
  const row=z*MW;
  for(let x=0;x<MW;x++){const p=pellet[row+x];if(!p)continue;
   const ox=x+Math.round((cam.x-x)/MW)*MW;if(Math.abs(ox-cam.x)>11.5)continue;
   const q=Pr(ox,.16,z);if(!q)continue;
   const a=Math.min(1,(MAXD-q[2])/8);if(a<.03)continue;
   DL.push({z:z,k:1,x:x,p:p,a:a});}}
 if(state!=='clear'){DL.push({z:PAC.z,k:2});
  for(const g of ghosts){if(g.state==='respawn'&&Math.floor(gtime*6)%2===0)continue;DL.push({z:g.z,k:3,g:g});}}
 DL.sort((a,b)=>a.z-b.z);
 for(let i=0;i<DL.length;i++){const it=DL[i];
  if(it.k===0)drawWall(it);else if(it.k===1)drawDot(it);else if(it.k===2)drawPac();else drawGhost(it.g);}
 /* fx */
 for(const r of rings){const q=Pc(r.x,0,r.z);if(!q)continue;const s=FL/q[2];
  ctx.globalAlpha=(1-r.t)*.8;ctx.strokeStyle='rgba('+r.c+',1)';ctx.lineWidth=Math.max(1.5,s*.09*(1-r.t*.5));
  ctx.beginPath();ctx.arc(q[0],q[1]-s*.3,(0.4+r.t*3.2)*s,0,7);ctx.stroke();}
 ctx.globalAlpha=1;
 for(const p of popups){const q=Pc(p.x,.8+p.t*1.6,p.z);if(!q)continue;
  ctx.globalAlpha=1-p.t;ctx.font='700 '+Math.max(12,Math.round(vh*.022))+'px ui-monospace,Menlo,Consolas,monospace';
  ctx.textAlign='center';ctx.fillStyle='#ffe066';ctx.shadowColor='#ffb300';ctx.shadowBlur=8;ctx.fillText(p.txt,q[0],q[1]);ctx.shadowBlur=0;}
 ctx.globalAlpha=1;
 if(state==='ready')bigText('READY!','#ffe066',vh*.3);
 if(state==='clear'){ctx.globalAlpha=.5+.5*Math.sin(gtime*10);bigText('STAGE '+level+' CLEAR','#9fe8ff',vh*.3);ctx.globalAlpha=1;}
 const vg=ctx.createRadialGradient(vw/2,vh*.45,Math.min(vw,vh)*.35,vw/2,vh*.5,Math.max(vw,vh)*.75);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(1,3,10,.55)');
 ctx.fillStyle=vg;ctx.fillRect(0,0,vw,vh);}

/* ================= boot ================= */
refillDots();makeGhosts();resetPac();cam.x=9;cam.z=10.5;state='menu';showOv(document.getElementById('menuOv'));syncHUD(true);
let last=performance.now();
function frame(now){requestAnimationFrame(frame);
 if(vw!==window.innerWidth||vh!==window.innerHeight)resize();
 let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
 if(!paused)update(dt);render();}
requestAnimationFrame(frame);
</script>
</body>
