<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Starfall Invaders</title>
<style>
:root{
  --ink:#dceeff; --dim:#7fa3c4; --amber:#ffd166; --cyan:#57e6ff;
  --green:#3ef2c0; --pink:#ff5da2; --red:#ff5470;
  --disp:Impact,'Arial Black','Franklin Gothic Medium','Helvetica Neue',sans-serif;
  --mono:Consolas,'Lucida Console',Menlo,Monaco,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#03060f}
body{font-family:var(--mono);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#050b18}

.crt{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(2,8,16,.28) 0px,rgba(2,8,16,.28) 1px,transparent 1px,transparent 3px);
  animation:flicker 4.5s ease-in-out infinite}
.crt::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 45%,transparent 56%,rgba(2,6,14,.55) 100%)}
@keyframes flicker{0%,100%{opacity:.5}50%{opacity:.43}}

.overlay{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:20px;gap:0;
  background:radial-gradient(130% 95% at 50% 30%,rgba(8,18,38,.78) 0%,rgba(3,6,14,.93) 72%)}
.hidden{display:none!important}

.tag{font-size:11px;letter-spacing:.34em;color:var(--dim);margin-bottom:12px}
.title{font-family:var(--disp);line-height:.92;margin:0 0 8px;text-transform:uppercase}
.t1{display:block;font-size:clamp(52px,11vw,104px);letter-spacing:.06em;color:#f2fff8;
  text-shadow:-4px 0 0 rgba(255,93,162,.75),4px 0 0 rgba(87,230,255,.75),0 0 34px rgba(90,255,210,.35);
  animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.t2{display:block;font-size:clamp(14px,2.6vw,25px);letter-spacing:.78em;padding-left:.78em;color:var(--cyan);
  text-shadow:0 0 14px rgba(87,230,255,.5)}
.title.dead .t1{color:#ffb9c8;animation:none;
  text-shadow:-4px 0 0 rgba(87,230,255,.45),4px 0 0 rgba(255,60,90,.85),0 0 32px rgba(255,84,112,.45)}

.legend{display:flex;gap:24px;margin:20px 0 4px;flex-wrap:wrap;justify-content:center}
.lg{display:flex;flex-direction:column;align-items:center;gap:7px}
.lg canvas{image-rendering:pixelated;background:rgba(10,22,40,.5);border:1px solid #1c3a58;padding:6px}
.lg span{font-size:10px;letter-spacing:.2em;color:var(--dim)}

.deck{margin:20px 0 24px;border:1px solid #24476b;background:rgba(7,15,29,.72);padding:12px 22px;min-width:min(430px,88vw)}
.drow{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px dashed #1c3a58;font-size:11px}
.drow:last-child{border-bottom:none}
.drow .lbl{letter-spacing:.2em;color:var(--dim);text-align:right}
kbd{font-family:var(--mono);font-size:11px;color:#bfe6ff;background:#0c1e33;border:1px solid #35648f;
  border-bottom-width:3px;padding:2px 7px;margin:0 2px;border-radius:4px;box-shadow:0 0 8px rgba(87,230,255,.12)}
.drow i{font-style:normal;color:#5b7fa3;font-size:9px;margin:0 2px}

.btn{font-family:var(--disp);font-size:clamp(16px,2.4vw,22px);letter-spacing:.18em;padding:14px 38px;color:#03231a;
  background:linear-gradient(180deg,#5cffc9 0%,#17c98e 100%);border:none;border-radius:6px;cursor:pointer;
  box-shadow:0 7px 0 #0b6d4f,0 12px 30px rgba(62,242,192,.25);transition:transform .08s ease,box-shadow .08s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 9px 0 #0b6d4f,0 16px 36px rgba(62,242,192,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0b6d4f}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

.coin{margin-top:18px;font-size:11px;letter-spacing:.3em;color:var(--dim)}
.coin b{color:var(--amber)}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.hiscore{margin-top:16px;font-size:13px;letter-spacing:.26em;color:var(--amber);text-shadow:0 0 12px rgba(255,209,102,.35)}

.stats{margin:18px 0 8px;border:1px solid #24476b;background:rgba(7,15,29,.72);padding:10px 26px;
  min-width:min(360px,86vw);text-align:left}
.srow{display:flex;justify-content:space-between;gap:30px;padding:8px 0;border-bottom:1px dashed #1c3a58;font-size:12px}
.srow:last-child{border:none}
.srow .l{letter-spacing:.2em;color:var(--dim)}
.srow .v{color:#eafff6;font-weight:700;letter-spacing:.12em}
.badge{margin-top:14px;background:var(--amber);color:#241500;font-size:12px;letter-spacing:.3em;padding:8px 18px;
  border-radius:4px;box-shadow:0 0 22px rgba(255,209,102,.5);animation:blink .9s steps(2,start) infinite}

#pauseScreen{background:rgba(3,6,14,.6)}
.paused{font-family:var(--disp);font-size:clamp(34px,7vw,60px);letter-spacing:.3em;padding-left:.3em;color:#eafff6;
  text-shadow:-3px 0 0 rgba(255,93,162,.6),3px 0 0 rgba(87,230,255,.6)}
@media (max-width:480px){ .deck{padding:10px 14px} .drow .lbl{letter-spacing:.08em;font-size:10px} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="crt"></div>

  <section id="startScreen" class="overlay">
    <p class="tag">ORBITAL DEFENSE &nbsp;//&nbsp; SECTOR-7 COMMAND</p>
    <h1 class="title"><span class="t1">Starfall</span><span class="t2">INVADERS</span></h1>
    <div class="legend" id="legend"></div>
    <div class="deck">
      <div class="drow"><span><kbd>&#9664;</kbd><kbd>&#9654;</kbd><i>or</i><kbd>A</kbd><kbd>D</kbd></span><span class="lbl">THRUST SHIP</span></div>
      <div class="drow"><span><kbd>SPACE</kbd></span><span class="lbl">FIRE PHOTON CANNONS</span></div>
      <div class="drow"><span><kbd>P</kbd><kbd>R</kbd><kbd>M</kbd></span><span class="lbl">PAUSE &middot; RESTART &middot; MUTE</span></div>
      <div class="drow"><span><kbd>TOUCH</kbd></span><span class="lbl">DRAG TO MOVE &mdash; AUTO-FIRE</span></div>
    </div>
    <button id="launchBtn" class="btn">&#9654;&nbsp; LAUNCH DEFENSE</button>
    <p class="coin blink">PRESS <b>ENTER</b> TO LAUNCH</p>
    <p class="hiscore">HI-SCORE&nbsp;&nbsp;<span id="hiStart">000000</span></p>
  </section>

  <section id="overScreen" class="overlay hidden">
    <h1 class="title dead" id="overTitle"><span class="t1">Game Over</span></h1>
    <p class="tag" id="overSub">ALL SHIPS LOST</p>
    <div class="stats" id="stats"></div>
    <div id="recordBadge" class="badge hidden">&#9733; NEW RECORD &#9733;</div>
    <button id="againBtn" class="btn" style="margin-top:20px">&#8635;&nbsp; RELAUNCH &mdash; ENTER</button>
  </section>

  <section id="pauseScreen" class="overlay hidden">
    <h2 class="paused">PAUSED</h2>
    <p class="coin" style="margin-top:14px">PRESS <b>P</b> TO RESUME</p>
  </section>
</div>

<script>
(()=>{'use strict';
/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pad=n=>String(n).padStart(6,'0');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};

/* ============ canvas ============ */
const cvs=$('game'),ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,fx0=0,fx1=0,cx=0,playerY=0;
function layout(){W=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  const m=Math.max(14,W*0.05);fx0=m;fx1=W-m;cx=W/2;playerY=H-64;}

/* ============ audio (WebAudio, starts on first input) ============ */
let AC=null,master=null,muted=false,ufoVoice=null;
muted=store.get('sf.muted')==='1';
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();
  master.gain.value=muted?0:0.42;master.connect(AC.destination);}catch(e){}}
function tone(o){if(!AC||muted)return;const{f=440,f2=null,type='square',t=.12,v=.2,delay=0}=o;
  try{const t0=AC.currentTime+delay,osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t0);
  if(f2)osc.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+t);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+t);
  osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+t+.03);}catch(e){}}
function noise(o){if(!AC||muted)return;const{t=.2,v=.3,fq=900,type='lowpass',delay=0}=o;
  try{const t0=AC.currentTime+delay,len=Math.max(1,Math.floor(AC.sampleRate*t)),
  buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource();src.buffer=buf;
  const flt=AC.createBiquadFilter();flt.type=type;flt.frequency.value=fq;
  const g=AC.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+t);
  src.connect(flt);flt.connect(g);g.connect(master);src.start(t0);}catch(e){}}
const sfx={
 shoot(){tone({f:940,f2:170,type:'triangle',t:.11,v:.15});},
 alienHit(){noise({t:.13,v:.3,fq:1500});tone({f:150,f2:55,t:.08,v:.16});},
 ufoKill(){noise({t:.35,v:.4,fq:700});[660,880,1320].forEach((f,i)=>tone({f,type:'square',t:.09,v:.15,delay:i*.05}));},
 power(){[523,784,1046].forEach((f,i)=>tone({f,type:'sine',t:.1,v:.2,delay:i*.06}));},
 shieldHit(){tone({f:240,f2:90,t:.16,v:.3});noise({t:.15,v:.22,fq:2400,type:'highpass'});},
 playerDie(){noise({t:.7,v:.5,fq:520});tone({f:220,f2:28,type:'sawtooth',t:.65,v:.32});noise({t:.5,v:.35,fq:200,delay:.15});},
 fanfare(){[392,494,587,784].forEach((f,i)=>tone({f,type:'square',t:.12,v:.16,delay:i*.09}));},
 gameOver(){[330,262,196,131].forEach((f,i)=>tone({f,type:'sawtooth',t:.24,v:.2,delay:i*.17}));},
 launch(){[262,392,587].forEach((f,i)=>tone({f,type:'triangle',t:.1,v:.2,delay:i*.07}));},
 alert(){tone({f:200,t:.09,v:.18});tone({f:200,t:.09,v:.18,delay:.16});},
 tick(){tone({f:1250,t:.045,v:.06});}};
function ufoStart(){if(!AC||ufoVoice)return;try{
  const osc=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  osc.type='sawtooth';osc.frequency.value=470;lfo.type='sine';lfo.frequency.value=6.5;lg.gain.value=110;
  lfo.connect(lg);lg.connect(osc.frequency);
  g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(.085,AC.currentTime+.15);
  osc.connect(g);g.connect(master);osc.start();lfo.start();ufoVoice={osc,g,lfo};}catch(e){}}
function ufoStop(){if(!ufoVoice)return;try{const{o}=ufoVoice,t=AC.currentTime;
  o.g.gain.cancelScheduledValues(t);o.g.gain.setValueAtTime(o.g.gain.value,t);
  o.g.gain.linearRampToValueAtTime(.0001,t+.12);o.osc.stop(t+.15);o.lfo.stop(t+.15);}catch(e){}ufoVoice=null;}

/* ============ pixel sprites ============ */
const MAPS={
 squid:[["...XX...","..XXXX..",".XXXXXX.","XX.XX.XX","XXXXXXXX",".X.XX.X.","X......X",".X....X."],
        ["...XX...","..XXXX..",".XXXXXX.","XX.XX.XX","XXXXXXXX","..X..X..",".X.XX.X.","X.X..X.X"]],
 crab:[["..X.....X..","...X...X...","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","...XX.XX..."],
       ["..X.....X..","X..X...X..X","X.XXXXXXX.X","XXX.XXX.XXX","XXXXXXXXXXX",".XXXXXXXXX.","..X.....X..",".X.......X."]],
 walk:[["....XXXX....","....XXXX....",".XXXXXXXXXX.","XXX.XXXX.XXX","XXXXXXXXXXXX","X.XXXXXXXX.X","XX..XXXX..XX","..XX....XX.."],
       ["....XXXX....","XX..XXXX..XX","XXXXXXXXXXXX","XXX.XXXX.XXX","XXXXXXXXXXXX",".XXXXXXXXXX.","..XX....XX..",".XXX....XXX."]],
 ufo:[[".....XXXXXX.....","...XXXXXXXXXX...","..XXXXXXXXXXXX..","XXOXOXOXOXOXOX","XXXXXXXXXXXXXX","..XX.XX.XX.XX.","....X......X...."]],
 ship:[["......X......",".....XXX.....",".....XXX.....",".XXXXXXXXXXX.","XXXXXXXXXXXXX","XXXXXXXXXXXXX","X.XXX.XXX.XXX"]]};
const COL={squid:'#ff5da2',crab:'#ffd166',walk:'#ff8a4d',ufo:'#ff5470',ship:'#3ef2c0',accent:'#eafff6'};
const PTS={squid:30,crab:20,walk:10};
let PX=3,SPR={};
function buildSprite(rows,color,accent){const w=rows[0].length,h=rows.length,c=document.createElement('canvas');
  c.width=w*PX;c.height=h*PX;const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];
    if(ch==='X')g.fillStyle=color;else if(ch==='O')g.fillStyle=accent;else continue;
    g.fillRect(x*PX,y*PX,PX,PX);}return c;}
function buildSprites(){PX=(W<460||H<520)?2:3;
  SPR.squid=[buildSprite(MAPS.squid[0],COL.squid),buildSprite(MAPS.squid[1],COL.squid)];
  SPR.crab =[buildSprite(MAPS.crab[0],COL.crab), buildSprite(MAPS.crab[1],COL.crab)];
  SPR.walk =[buildSprite(MAPS.walk[0],COL.walk), buildSprite(MAPS.walk[1],COL.walk)];
  SPR.ufo  =[buildSprite(MAPS.ufo[0],COL.ufo,COL.accent)];
  SPR.ship =[buildSprite(MAPS.ship[0],COL.ship,COL.accent)];}
const aw=a=>SPR[a.type][0].width, ah=a=>SPR[a.type][0].height;

/* ============ state ============ */
const G={state:'start',score:0,hi:+(store.get('sf.hi')||0)||0,wave:1,lives:3,t:0,
  shake:0,flash:0,hitStop:0,dangerT:0,invuln:0,shield:false,
  power:{triple:0,rapid:0},stats:{shots:0,hits:0,aliens:0,ufos:0},
  banner:null,dying:0,invaded:false,newHi:false};
let paused=false;
const COLS=11,ROWS=5,ROWTYPES=['squid','crab','crab','walk','walk'];
let aliens=[],bullets=[],abullets=[],parts=[],floats=[],pows=[],bunkers=[];
let ox=0,oy=0,colSp=40,rowSp=32,dir=1,stepTimer=.5,fireTimer=2,ufoTimer=20,frameFlip=false;
let ufo=null,totalAliens=0,diverCd=6,lastStart=0;
const player={x:0,y:0,w:0,h:0,cool:0,target:null};

/* ============ stars & nebulae ============ */
let stars=[];
function initStars(){stars=[];const n=Math.round(W*H/9000);
  for(let i=0;i<n;i++){const l=irand(0,2);
    stars.push({x:rand(0,W),y:rand(0,H),l,ph:rand(0,6.28),
      c:l===2?(i%5?'#cfe8ff':'#ffd9b0'):(i%7?'#9fc8ea':'#7fa3c4')});}}
function updateStars(dt){const sp=[6,14,26];
  for(const s of stars){s.y+=sp[s.l]*dt;if(s.y>H+2){s.y=-2;s.x=rand(0,W);}}}
const NEB=[{x:.25,y:.3,r:.5,c:'rgba(46,190,170,'},{x:.78,y:.16,r:.45,c:'rgba(255,90,150,'},{x:.62,y:.78,r:.55,c:'rgba(80,130,255,'}];

/* ============ wave / bunkers ============ */
function makeBunkers(){const cs=Math.max(4,PX*2),
  mask=["...XXXXXXX...","..XXXXXXXXX..",".XXXXXXXXXXX.","XXXXXXXXXXXXX","XXXXXXXXXXXXX","XX.XXXXXXX.XX","XX..XXXXX..XX","XX...XXX...XX"],
  bw=13*cs,bh=8*cs,y0=playerY-(PX===3?104:92),span=fx1-fx0,
  centers=[cx-span*.375,cx-span*.125,cx+span*.125,cx+span*.375];
  return centers.map(bx=>{const cells=[];
    for(let r=0;r<8;r++)for(let c=0;c<13;c++)if(mask[r][c]==='X')cells.push({c,r,alive:true});
    const cv=document.createElement('canvas');cv.width=bw;cv.height=bh;
    return{x:bx-bw/2,y:y0,w:bw,h:bh,cs,cells,cv,dirty:true};});}
function drawBunkerCache(bk){const g=bk.cv.getContext('2d');g.clearRect(0,0,bk.w,bk.h);
  for(const c of bk.cells)if(c.alive){g.fillStyle=c.r<2?'#4fe8a5':'#2fbf87';
    g.fillRect(c.c*bk.cs,c.r*bk.cs,bk.cs-1,bk.cs-1);}bk.dirty=false;}
function bunkerHit(bk,x,y,w,h){let hit=false;
  for(const c of bk.cells){if(!c.alive)continue;
    const cx0=bk.x+c.c*bk.cs,cy0=bk.y+c.r*bk.cs;
    if(x<cx0+bk.cs&&x+w>cx0&&y<cy0+bk.cs&&y+h>cy0){c.alive=false;bk.dirty=true;hit=true;
      parts.push({x:cx0+2,y:cy0+2,vx:rand(-40,40),vy:rand(-60,-10),life:.3,max:.3,size:2,c:'#4fe8a5'});}}
  return hit;}

function buildWave(n){G.wave=n;aliens=[];bullets=[];abullets=[];pows=[];ufo=null;ufoStop();
  colSp=Math.min(46,(fx1-fx0)/(COLS-1));rowSp=8*PX+8;
  ox=cx-(COLS-1)*colSp/2;oy=Math.min(96,Math.max(56,H*0.13));dir=1;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    aliens.push({type:ROWTYPES[r],c,r,x:ox+c*colSp,y:oy+r*rowSp,alive:true,mode:'g',t:rand(0,6),vx:0,vy:0});
  totalAliens=aliens.length;
  bunkers=makeBunkers();bunkers.forEach(drawBunkerCache);
  frameFlip=false;stepTimer=.5;fireTimer=1.8;diverCd=6;
  ufoTimer=Math.max(12,rand(14,24)-Math.min(8,n));
  G.power={triple:0,rapid:0};G.shield=false;G.invuln=0;
  player.x=cx;player.cool=0;
  player.w=SPR.ship[0].width;player.h=SPR.ship[0].height;}

/* ============ particles / floaters ============ */
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(30,sp);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.6),max:.6,size:irand(2,4),
    c:Math.random()<.3?'#eafff6':col});}}
function ring(x,y,col){parts.push({ring:true,x,y,r:6,vr:280,life:.5,max:.5,c:col});}
function addFloat(x,y,txt,c,big){if(floats.length>40)floats.shift();
  floats.push({x,y,txt,c,t:0,life:big?1.3:.9,big});}

/* ============ combat ============ */
function fire(){const rapid=G.power.rapid>0;player.cool=rapid?.14:.34;
  G.stats.shots+=G.power.triple>0?3:1;
  const add=(dx,vx)=>bullets.push({x:player.x+dx,y:playerY-4,vy:-620,vx:vx||0});
  if(G.power.triple>0){add(0);add(-9,-75);add(9,75);}else add(0);
  for(let i=0;i<3;i++)parts.push({x:player.x+rand(-4,4),y:playerY-2,vx:rand(-30,30),vy:rand(-160,-80),life:.12,max:.12,size:2,c:'#eafff6'});
  sfx.shoot();}

function killAlien(a){a.alive=false;G.stats.aliens++;G.stats.hits++;
  const pts=PTS[a.type];G.score+=pts;addFloat(a.x+aw(a)/2,a.y,'+'+pts,'#eafff6');
  burst(a.x+aw(a)/2,a.y+ah(a)/2,COL[a.type],10+PX*2,170);sfx.alienHit();G.shake=Math.max(G.shake,1.5);
  if(Math.random()<.13){const r=Math.random(),
    t=r<.28?'T':r<.56?'R':r<.84?'S':'L';
    pows.push({x:a.x+aw(a)/2,y:a.y,vy:95,type:t,t:rand(0,6)});}}

function killUFO(){const pts=irand([100,150,200,300,500]);G.score+=pts;G.stats.ufos++;G.stats.hits++;
  addFloat(ufo.x,54,'+'+pts,'#ffd166',true);burst(ufo.x,58,COL.ufo,22,220);ring(ufo.x,58,'#ff5470');
  sfx.ufoKill();ufoStop();ufo=null;G.hitStop=Math.max(G.hitStop,.1);G.shake=Math.max(G.shake,6);}

function playerDie(){G.lives--;abullets.length=0;
  burst(player.x,playerY+player.h/2,COL.ship,26,240);ring(player.x,playerY+10,'#3ef2c0');
  G.shake=16;G.flash=1;G.hitStop=.5;G.shield=false;G.power={triple:0,rapid:0};sfx.playerDie();
  if(G.lives<=0){G.state='dying';G.dying=1.3;}else{G.invuln=2;player.x=cx;}}

function alienShoot(){if(abullets.length>=5)return;const cols={};
  for(const a of aliens){if(!a.alive||a.mode!=='g')continue;const cur=cols[a.c];if(!cur||a.r>cur.r)cols[a.c]=a;}
  const arr=Object.values(cols);if(!arr.length)return;
  const a=arr[irand(0,arr.length-1)];
  abullets.push({x:a.x+aw(a)/2,y:a.y+ah(a)+2,vy:Math.min(340,165+G.wave*9)+rand(-15,25)});}

function spawnUFO(){const d=Math.random()<.5?1:-1;ufo={x:d>0?-60:W+60,vx:d*(85+G.wave*4)};}

/* ============ formation march ============ */
function syncGrid(){for(const a of aliens)if(a.alive&&a.mode==='g'){a.x=ox+a.c*colSp;a.y=oy+a.r*rowSp;}}
function gridBounds(){let mn=1e9,mx=-1e9;
  for(const a of aliens){if(!a.alive||a.mode!=='g')continue;const r=ox+a.c*colSp+aw(a);
    if(r<mn)mn=r;if(r>mx)mx=r;}return[mn-mx? mn:0,mx];}
function doStep(){const[gn,gx]=gridBounds(),nx=ox+dir*Math.max(7,PX*3);
  if((dir>0&&nx+(gx-ox)>fx1)||(dir<0&&nx+(gn-ox)<fx0)){dir=-dir;oy+=Math.max(10,PX*4);}
  else ox=nx;frameFlip=!frameFlip;syncGrid();}
function countAlive(){let n=0;for(const a of aliens)if(a.alive)n++;return n;}

/* ============ state transitions ============ */
function startGame(){const now=performance.now();if(now-lastStart<250)return;lastStart=now;
  G.state='intro';G.score=0;G.lives=3;G.invaded=false;G.newHi=false;
  G.stats={shots:0,hits:0,aliens:0,ufos:0};parts=[];floats=[];G.shake=0;G.flash=0;G.hitStop=0;
  buildWave(1);G.banner={t:0,title:'WAVE 1',sub:'HOSTILES INBOUND — DEFEND THE GRID'};
  paused=false;$('startScreen').classList.add('hidden');$('overScreen').classList.add('hidden');
  $('pauseScreen').classList.add('hidden');sfx.launch();}

function goOver(){G.state='over';ufoStop();
  const rec=G.score>G.hi;if(rec){G.hi=G.score;store.set('sf.hi',G.hi);G.newHi=true;}
  $('overTitle').firstElementChild.textContent=G.invaded?'Invasion Complete':'Game Over';
  $('overSub').textContent=G.invaded?'THE FLEET HAS REACHED EARTH':'ALL SHIPS LOST';
  const acc=G.stats.shots?Math.round(G.stats.hits/G.stats.shots*100):0;
  const row=(l,v)=>'<div class="srow"><span class="l">'+l+'</span><span class="v">'+v+'</span></div>';
  $('stats').innerHTML=row('FINAL SCORE',pad(G.score))+row('WAVE REACHED',String(G.wave).padStart(2,'0'))
    +row('ALIENS DOWNED',G.stats.aliens)+row('ACCURACY',acc+'%')+row('UFO KILLS',G.stats.ufos);
  $('recordBadge').classList.toggle('hidden',!rec);
  $('hiStart').textContent=pad(G.hi);
  $('overScreen').classList.remove('hidden');sfx.gameOver();}

function invade(){G.invaded=true;ufoStop();abullets.length=0;
  G.shake=20;G.flash=.9;sfx.gameOver();G.state='dying';G.dying=.9;}

function togglePause(){if(!['play','intro','clear'].includes(G.state))return;
  paused=!paused;$('pauseScreen').classList.toggle('hidden',!paused);}

/* ============ update ============ */
function spawnFlame(dt){if(Math.random()<dt*60)
  parts.push({x:player.x+rand(-3,3),y:playerY+player.h,vx:rand(-8,8),vy:rand(40,95),life:.25,max:.25,size:irand(2,3),
    c:['#3ef2c0','#ffd166','#eafff6'][irand(0,2)]});}

function updatePlayer(dt){const spd=W<500?300:340;let mv=0;
  if(keys.has('ArrowLeft')||keys.has('a'))mv-=1;
  if(keys.has('ArrowRight')||keys.has('d'))mv+=1;
  if(mv)player.target=null;
  else if(player.target!=null){const d=player.target-player.x;if(Math.abs(d)>4)mv=Math.sign(d);}
  player.x=clamp(player.x+mv*spd*dt,player.w/2+8,W-player.w/2-8);
  spawnFlame(dt);
  player.cool-=dt;
  if((keys.has(' ')||touchFiring)&&player.cool<=0)fire();}

function updateBullets(dt){for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];
  b.y+=b.vy*dt;b.x+=(b.vx||0)*dt;
  if(b.y<44){parts.push({x:b.x,y:46,vx:rand(-20,20),vy:rand(10,50),life:.2,max:.2,size:2,c:'#9fd8ff'});
    bullets.splice(i,1);continue;}
  let hit=false;
  if(ufo){const uw=SPR.ufo[0].width,uh=SPR.ufo[0].height;
    if(b.x>ufo.x-uw/2&&b.x<ufo.x+uw/2&&b.y>54-uh&&b.y<54+uh){killUFO();hit=true;}}
  if(!hit)for(const a of aliens){if(!a.alive)continue;
    if(b.x>a.x+1&&b.x<a.x+aw(a)-1&&b.y>a.y+1&&b.y<a.y+ah(a)-1){killAlien(a);hit=true;break;}}
  if(!hit)for(const bk of bunkers)if(bunkerHit(bk,b.x-2,b.y-8,4,9)){hit=true;break;}
  if(hit)bullets.splice(i,1);}}

function updateABullets(dt){const px=player.x-player.w/2+2,py=playerY+3,pw2=player.w-4,ph2=player.h-3;
  for(let i=abullets.length-1;i>=0;i--){const b=abullets[i];b.y+=b.vy*dt;
    if(b.y>H+10){abullets.splice(i,1);continue;}
    let hit=false;
    for(const bk of bunkers)if(bunkerHit(bk,b.x-2,b.y,4,9)){hit=true;break;}
    if(!hit&&b.x>px&&b.x<px+pw2&&b.y>py&&b.y<py+ph2){hit=true;
      if(G.invuln>0){}
      else if(G.shield){G.shield=false;sfx.shieldHit();ring(player.x,playerY+10,'#57e6ff');G.shake=Math.max(G.shake,4);}
      else playerDie();}
    if(hit)abullets.splice(i,1);}}

function updatePows(dt){for(let i=pows.length-1;i>=0;i--){const p=pows[i];p.t+=dt;
  p.y+=p.vy*dt;p.x+=Math.sin(p.t*3)*12*dt;
  if(p.y>H+20){pows.splice(i,1);continue;}
  if(Math.abs(p.x-player.x)<player.w/2+8&&p.y>playerY-8&&p.y<playerY+player.h+12){
    const col={T:'#57e6ff',R:'#ffd166',S:'#3ef2c0',L:'#ff5da2'}[p.type];
    burst(p.x,p.y,col,12,140);sfx.power();
    if(p.type==='T'){G.power.triple=8;addFloat(player.x,playerY-16,'TRIPLE SHOT',col);}
    else if(p.type==='R'){G.power.rapid=8;addFloat(player.x,playerY-16,'RAPID FIRE',col);}
    else if(p.type==='S'){G.shield=true;addFloat(player.x,playerY-16,'SHIELD UP',col);}
    else{G.lives=Math.min(5,G.lives+1);addFloat(player.x,playerY-16,'+1 LIFE',col,true);}
    pows.splice(i,1);}}}

function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
  if(p.life<=0){parts.splice(i,1);continue;}
  if(p.ring){p.r+=p.vr*dt;continue;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*2;p.vy*=1-dt*1.2;}}
function updateFloats(dt){for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.y-=30*dt;
  if(f.t>f.life)floats.splice(i,1);}}

function updateWorld(dt){G.shake=Math.max(0,G.shake-dt*26-G.shake*dt*4);
  G.flash=Math.max(0,G.flash-dt*2.2);
  if(G.invuln>0)G.invuln-=dt;
  if(G.power.triple>0)G.power.triple-=dt;
  if(G.power.rapid>0)G.power.rapid-=dt;

  if(G.state==='dying'){G.dying-=dt;updateParts(dt);updateFloats(dt);
    if(G.dying<=0)goOver();return;}

  if(G.state==='intro'||G.state==='clear'){G.banner.t+=dt;
    const dur=G.state==='intro'?1.9:1.7;
    updatePlayer(dt);updateBullets(dt);updatePows(dt);updateParts(dt);updateFloats(dt);
    if(G.banner.t>=dur){
      if(G.state==='intro'){G.state='play';sfx.alert();}
      else{buildWave(G.wave+1);G.state='intro';
        G.banner={t:0,title:'WAVE '+G.wave,sub:'HOSTILES INBOUND — DEFEND THE GRID'};}}
    return;}
  if(G.state!=='play')return;

  const alive=countAlive();
  stepTimer-=dt;
  if(stepTimer<=0&&alive>0){doStep();
    const base=Math.max(95,560-G.wave*38);
    stepTimer=Math.max(.045,base/1000*(.22+.78*alive/totalAliens));}

  if(G.wave>=2){let dv=0;for(const a of aliens)if(a.alive&&a.mode==='d')dv++;
    diverCd-=dt;
    if(diverCd<=0&&dv<3){diverCd=Math.max(3,rand(6,11)-Math.min(4,G.wave*.3));
      const cands=aliens.filter(a=>a.alive&&a.mode==='g'&&a.r>=2);
      if(cands.length){const a=cands[irand(0,cands.length-1)];a.mode='d';
        a.vx=(player.x>a.x?1:-1)*(70+G.wave*6);a.vy=95+G.wave*8;}}}
  for(const a of aliens){if(!a.alive||a.mode!=='d')continue;a.t+=dt;
    a.x+=a.vx*dt+Math.sin(a.t*5)*30*dt;a.y+=a.vy*dt;
    if(a.y>H+40){a.alive=false;continue;}
    const px=player.x-player.w/2,py=playerY;
    if(G.invuln<=0&&a.x<px+player.w&&a.x+aw(a)>px&&a.y<py+player.h&&a.y+ah(a)>py){killAlien(a);playerDie();}}

  if(alive>0){fireTimer-=dt;
    if(fireTimer<=0){alienShoot();const base=clamp(1.35-G.wave*.06,.42,1.35);
      fireTimer=rand(base*.55,base*1.4);}}

  if(ufo){ufo.x+=ufo.vx*dt;if(!ufoVoice)ufoStart();
    if(ufo.x<-70||ufo.x>W+70){ufo=null;ufoStop();}}
  else{ufoTimer-=dt;if(ufoTimer<=0){spawnUFO();ufoTimer=rand(16,28);}}

  updatePlayer(dt);updateBullets(dt);updateABullets(dt);
  updatePows(dt);updateParts(dt);updateFloats(dt);

  let db=-1e9;for(const a of aliens)if(a.alive)db=Math.max(db,a.y+ah(a));
  if(db>playerY-2){invade();return;}
  if(db>playerY-120){G.dangerT-=dt;if(G.dangerT<=0){sfx.tick();G.dangerT=.5;}}else G.dangerT=0;

  if(countAlive()===0){const bonus=100+G.wave*50;G.score+=bonus;
    addFloat(cx,H*.42,'+'+bonus,'#ffd166',true);sfx.fanfare();
    G.state='clear';G.banner={t:0,title:'SECTOR CLEARED',sub:'BONUS +'+bonus};}}

function attract(dt){updatePlayerFlameOnly(dt);
  stepTimer-=dt;if(stepTimer<=0){doStep();stepTimer=.5;}
  let low=false;for(const a of aliens)if(a.alive&&a.y+ah(a)>playerY-60)low=true;
  if(low)buildWave(1);
  updateParts(dt);}
function updatePlayerFlameOnly(){spawnFlame(1/60);
  player.x=cx+Math.sin(G.t*.7)*24;}

/* ============ render ============ */
const MONOF="Consolas,'Lucida Console',Menlo,monospace";
const DISPF="Impact,'Arial Black','Franklin Gothic Medium',sans-serif";

function render(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#081527');g.addColorStop(.55,'#04091c');g.addColorStop(1,'#030610');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<NEB.length;i++){const n=NEB[i],
    nx=n.x*W+Math.sin(G.t*.05+i*2)*W*.03,ny=n.y*H,r=n.r*Math.max(W,H)*.6;
    const rg=ctx.createRadialGradient(nx,ny,0,nx,ny,r);
    rg.addColorStop(0,n.c+(i===1?'0.05)':'0.06)'));rg.addColorStop(1,n.c+'0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);}
  const ssz=[1,1,2];
  for(const s of stars){const a=.3+.4*(.5+.5*Math.sin(G.t*(1+s.l)+s.ph));
    ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.fillRect(s.x|0,s.y|0,ssz[s.l],ssz[s.l]);}
  ctx.globalAlpha=1;

  ctx.save();
  if(G.shake>0)ctx.translate(rand(-1,1)*G.shake,rand(-1,1)*G.shake);

  // field rails + defensive baseline
  ctx.strokeStyle='rgba(30,80,120,.35)';ctx.setLineDash([4,10]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(fx0-8,46);ctx.lineTo(fx0-8,H-40);
  ctx.moveTo(fx1+8,46);ctx.lineTo(fx1+8,H-40);ctx.stroke();ctx.setLineDash([]);
  const baseY=playerY+player.h+16;
  ctx.strokeStyle='#1d5a49';ctx.beginPath();ctx.moveTo(8,baseY);ctx.lineTo(W-8,baseY);ctx.stroke();
  ctx.fillStyle='#17423c';
  for(let x=16;x<W;x+=32)ctx.fillRect(x,baseY+2,2,4);

  for(const bk of bunkers){if(bk.dirty)drawBunkerCache(bk);ctx.drawImage(bk.cv,bk.x,bk.y);}

  for(const a of aliens){if(!a.alive)continue;
    const f=a.mode==='d'?(Math.floor(a.t*9)%2):(frameFlip?1:0);
    ctx.drawImage(SPR[a.type][f],Math.round(a.x),Math.round(a.y));}

  if(ufo){const bob=Math.sin(G.t*3)*3;ctx.drawImage(SPR.ufo[0],Math.round(ufo.x-SPR.ufo[0].width/2),Math.round(54-bob));}

  for(const p of pows){const col={T:'#57e6ff',R:'#ffd166',S:'#3ef2c0',L:'#ff5da2'}[p.type];
    const yy=p.y+Math.sin(p.t*5)*2;
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.strokeRect(p.x-9,yy-8,18,16);
    ctx.fillStyle='rgba(6,14,26,.8)';ctx.fillRect(p.x-9,yy-8,18,16);
    ctx.strokeStyle=col;ctx.strokeRect(p.x-9,yy-8,18,16);
    ctx.fillStyle=col;ctx.font='700 10px '+MONOF;ctx.textAlign='center';ctx.fillText(p.type,p.x,yy+4);}

  for(const b of bullets){ctx.fillStyle='rgba(120,255,230,.35)';ctx.fillRect(b.x-3.5,b.y-8,7,13);
    ctx.fillStyle='#eaffff';ctx.fillRect(b.x-1.5,b.y-7,3,10);}
  for(const b of abullets){ctx.fillStyle='#ff7b9c';
    for(let k=0;k<5;k++)ctx.fillRect(b.x+((k%2)?-2:2),b.y+k*3,3,3);
    ctx.fillStyle='#ffd0dd';ctx.fillRect(b.x-1,b.y-2,4,3);}

  const blinkOff=G.invuln>0&&Math.floor(G.t*12)%2===0;
  if(G.state!=='dying'&&G.state!=='over'&&!blinkOff)
    ctx.drawImage(SPR.ship[0],Math.round(player.x-player.w/2),playerY);
  if(G.shield){const pr=4+Math.sin(G.t*6)*2;
    ctx.strokeStyle='rgba(87,230,255,'+(0.5+0.3*Math.sin(G.t*6))+')';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(player.x,playerY+player.h/2,player.w*.72+pr,0,6.29);ctx.stroke();
    ctx.fillStyle='rgba(87,230,255,.06)';ctx.fill();}

  for(const p of parts){const a=clamp(p.life/p.max,0,1);
    if(p.ring){ctx.globalAlpha=a*.8;ctx.strokeStyle=p.c;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.29);ctx.stroke();}
    else{ctx.globalAlpha=a;ctx.fillStyle=p.c;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}}
  ctx.globalAlpha=1;

  for(const f of floats){const a=1-f.t/f.life;ctx.globalAlpha=a;
    ctx.font=(f.big?'700 15px ':'700 11px ')+MONOF;ctx.textAlign='center';
    ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  ctx.restore();

  /* HUD */
  ctx.fillStyle='rgba(3,8,18,.6)';ctx.fillRect(0,0,W,44);
  ctx.strokeStyle='#14324e';ctx.beginPath();ctx.moveTo(0,44.5);ctx.lineTo(W,44.5);ctx.stroke();
  ctx.textAlign='left';ctx.font='9px '+MONOF;ctx.fillStyle='#5b7fa3';
  ctx.fillText('SCORE',18,14);ctx.fillText('WAVE',cx-20,14);ctx.fillText('HI-SCORE',W-100,14);
  ctx.font='700 16px '+MONOF;
  ctx.fillStyle='#eafff6';ctx.fillText(pad(G.score),18,33);
  ctx.fillStyle='#57e6ff';ctx.textAlign='center';ctx.fillText(String(G.wave).padStart(2,'0'),cx+4,33);
  ctx.fillStyle='#ffd166';ctx.textAlign='right';ctx.fillText(pad(Math.max(G.hi,G.score)),W-18,33);

  for(let i=0;i<G.lives-1;i++)
    ctx.drawImage(SPR.ship[0],18+i*22,H-34,Math.round(player.w*.5),Math.round(player.h*.5));

  let cy2=52;
  const chip=(label,frac,col)=>{ctx.fillStyle='rgba(8,16,30,.7)';ctx.fillRect(18,cy2,96,14);
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(18.5,cy2+.5,95,13);
    ctx.fillStyle=col;ctx.font='700 8px '+MONOF;ctx.textAlign='left';
    ctx.fillText(label,24,cy2+10);
    ctx.fillStyle='#123';ctx.fillRect(66,cy2+4,42,6);
    ctx.fillStyle=col;ctx.fillRect(66,cy2+4,42*clamp(frac,0,1),6);cy2+=18;};
  if(G.power.triple>0)chip('TRIPLE',G.power.triple/8,'#57e6ff');
  if(G.power.rapid>0)chip('RAPID',G.power.rapid/8,'#ffd166');
  if(G.shield){ctx.globalAlpha=.7+.3*Math.sin(G.t*6);chip('SHIELD',1,'#3ef2c0');ctx.globalAlpha=1;}

  ctx.font='9px '+MONOF;ctx.textAlign='right';ctx.fillStyle='#3f5d7a';
  ctx.fillText((muted?'SOUND OFF':'SOUND ON')+' [M]',W-14,H-12);

  if(G.banner){const t=G.banner.t,dur=G.state==='intro'?1.9:1.7,p=t/dur,
    a=Math.min(1,t/.25)*(p>.75?(1-p)/.25:1),e=1-Math.pow(1-Math.min(1,t/.4),3),
    size=(clamp(W*.06,30,54))*(1.25-.25*e);
    ctx.globalAlpha=clamp(a,0,1);ctx.textAlign='center';
    ctx.font=Math.round(size)+'px '+DISPF;
    ctx.shadowColor='rgba(87,230,255,.6)';ctx.shadowBlur=24;
    ctx.fillStyle='#eafff6';ctx.fillText(G.banner.title,cx,H*.38);
    ctx.shadowBlur=0;ctx.font='12px '+MONOF;ctx.fillStyle='#8fb8d8';
    ctx.fillText(G.banner.sub.split('').join(' '),cx,H*.38+28);ctx.globalAlpha=1;}

  if(G.state==='play'){let db=-1e9;for(const a of aliens)if(a.alive)db=Math.max(db,a.y+ah(a));
    if(db>playerY-120&&G.t%0.6<0.35){ctx.textAlign='center';ctx.font='700 14px '+MONOF;
      ctx.fillStyle='#ff5470';ctx.shadowColor='#ff5470';ctx.shadowBlur=12;
      ctx.fillText('\u26A0  INVASION IMMINENT',cx,68);ctx.shadowBlur=0;}}

  if(G.flash>0){ctx.fillStyle='rgba(255,60,80,'+(G.flash*.22)+')';ctx.fillRect(0,0,W,H);}
}

/* ============ main loop ============ */
let lastT=performance.now();
function frame(now){const dt=Math.min(.04,(now-lastT)/1000);lastT=now;G.t+=dt;
  updateStars(dt);
  if(G.state==='start'){attract(dt);}
  else if(!paused){let wdt=dt;if(G.hitStop>0){wdt=dt*.25;G.hitStop-=dt;}updateWorld(wdt);}
  render();requestAnimationFrame(frame);}

/* ============ input ============ */
const keys=new Set();let touchFiring=false,pointerActive=false;
window.addEventListener('keydown',e=>{initAudio();
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  const k=e.key;
  if(!e.repeat){
    if(k==='Enter'&&(G.state==='start'||G.state==='over'))startGame();
    if((k==='r'||k==='R'))startGame();
    if(k==='p'||k==='P')togglePause();
    if(k==='m'||k==='M'){muted=!muted;store.set('sf.muted',muted?'1':'0');
      if(master)master.gain.value=muted?0:.42;if(muted)ufoStop();}}
  keys.add(k.length===1?k.toLowerCase():k);});
window.addEventListener('keyup',e=>{const k=e.key;keys.delete(k.length===1?k.toLowerCase():k);});
window.addEventListener('pointerdown',e=>{initAudio();
  if(G.state==='start'){startGame();return;}
  if(G.state==='over')return;
  touchFiring=true;pointerActive=true;player.target=e.clientX;});
window.addEventListener('pointermove',e=>{if(pointerActive)player.target=e.clientX;});
window.addEventListener('pointerup',()=>{touchFiring=false;pointerActive=false;player.target=null;});
window.addEventListener('pointercancel',()=>{touchFiring=false;pointerActive=false;player.target=null;});
window.addEventListener('blur',()=>{if(!paused&&['play','intro','clear'].includes(G.state))togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&['play','intro','clear'].includes(G.state))togglePause();});
$('stage').addEventListener('contextmenu',e=>e.preventDefault());

$('launchBtn').addEventListener('click',function(){initAudio();startGame();this.blur();});
$('againBtn').addEventListener('click',function(){initAudio();startGame();this.blur();});

/* ============ legend (start screen) ============ */
function buildLegend(){const el=$('legend');el.innerHTML='';
  [['squid','30 PTS'],['crab','20 PTS'],['walk','10 PTS'],['ufo','??? PTS']].forEach(([k,pts])=>{
    const wrap=document.createElement('div');wrap.className='lg';
    const c=document.createElement('canvas'),spr=SPR[k][0];
    c.width=spr.width*2;c.height=spr.height*2;
    const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(spr,0,0,c.width,c.height);
    const s=document.createElement('span');s.textContent=pts;
    wrap.appendChild(c);wrap.appendChild(s);el.appendChild(wrap);});}

/* ============ resize & boot ============ */
function onResize(){layout();buildSprites();initStars();
  if(G.state==='start'){buildWave(1);}
  else{colSp=Math.min(46,(fx1-fx0)/(COLS-1));rowSp=8*PX+8;
    ox=cx-(COLS-1)*colSp/2;syncGrid();
    bunkers=makeBunkers();bunkers.forEach(drawBunkerCache);
    player.w=SPR.ship[0].width;player.h=SPR.ship[0].height;
    player.x=clamp(player.x,player.w/2+8,W-player.w/2-8);}}
window.addEventListener('resize',onResize);

layout();buildSprites();initStars();
$('hiStart').textContent=pad(G.hi);
buildLegend();
buildWave(1);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
