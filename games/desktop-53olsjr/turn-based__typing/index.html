<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyfall — A Typing Duel</title>
<style>
:root{
  --ink:#0c1a20; --panel:#12262e; --line:#2b4a53;
  --gold:#f2b94b; --ember:#ff6b4a; --green:#7ee081; --cyan:#63d8d2;
  --text:#e9e2cf; --dim:#7d97a0;
  --disp:Impact,Haettenschweiler,"Franklin Gothic Bold","Arial Black",sans-serif;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--mono);color:var(--text);
  background:
    radial-gradient(1100px 760px at 50% 14%, #16333d 0%, transparent 62%),
    radial-gradient(900px 680px at 88% 92%, #1a2b22 0%, transparent 55%),
    linear-gradient(#0e1f26,#091419);
  user-select:none;-webkit-user-select:none;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 180px rgba(0,0,0,.75)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.5;
  background:repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.10) 2px 3px)}
#glyphs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#glyphs span{position:absolute;font-family:var(--disp);color:var(--gold);
  animation:drift ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-70px) rotate(14deg)}}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:10px 16px;background:linear-gradient(#122730,#0e1f26);border-bottom:1px solid var(--line)}
.lbl{font-size:.62rem;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.hp-block{display:flex;align-items:center;gap:10px}
.bar{position:relative;height:15px;background:#0a161c;border:1px solid var(--line);overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 24px, rgba(0,0,0,.35) 24px 26px)}
.bar i{position:absolute;top:0;left:0;bottom:0;width:100%;transition:width .3s ease}
#php{background:linear-gradient(90deg,#5fd47e,#b8e986)}
.hp-block b{font-family:var(--disp);font-size:1.25rem;letter-spacing:.05em;min-width:2.2ch;text-align:right}
.hp-block.dmg b{animation:hudhit .3s}
@keyframes hudhit{40%{color:var(--ember);transform:translateX(-3px)}}
.hp-block.low #php{background:linear-gradient(90deg,#ff6b4a,#ff3d2e);animation:lowpulse 1s infinite}
@keyframes lowpulse{50%{filter:brightness(1.6)}}
.wave{text-align:center}
.wave b{font-family:var(--disp);font-size:1.7rem;letter-spacing:.08em;color:var(--gold);display:block;line-height:1}
.wave em{font-style:normal;font-size:.62rem;letter-spacing:.3em;color:var(--dim)}
.combo{text-align:right}
.combo b{font-family:var(--disp);font-size:1.7rem;letter-spacing:.05em;color:var(--text);display:block;line-height:1}
.combo.hot b{color:var(--ember);text-shadow:0 0 14px rgba(255,107,74,.6)}
.combo.pulse b{animation:cpulse .25s}
@keyframes cpulse{40%{transform:scale(1.3)}}

/* ---------- STAGE ---------- */
#stagewrap{position:relative;flex:1;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#plate{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(340px,82%);
  text-align:center;opacity:0;transition:opacity .5s}
#stagewrap.ingame #plate{opacity:1}
#pname{font-family:var(--disp);font-size:1.15rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text)}
#plate.boss #pname{color:var(--ember);text-shadow:0 0 12px rgba(255,107,74,.5)}
#plate .bar{margin-top:6px;height:11px}
#ehp{background:linear-gradient(90deg,#f2b94b,#ff8a4a)}
#plate.boss #ehp{background:linear-gradient(90deg,#ff8a4a,#ff3d2e)}
#ehpn{font-size:.68rem;color:var(--dim);letter-spacing:.15em}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:4;
  font-family:var(--disp);font-size:clamp(1.6rem,5vw,3.2rem);letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 30px rgba(242,185,75,.35)}
#banner.show{animation:ban 1.5s ease both}
@keyframes ban{0%{opacity:0;transform:scale(1.45)}14%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}
#hitflash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(255,60,40,.6) 100%)}

/* ---------- CONSOLE ---------- */
#console{border-top:1px solid var(--line);background:linear-gradient(#132a33,#0e2027);
  padding:12px 18px 14px;text-align:center;position:relative;z-index:2}
#console::before{content:"";position:absolute;top:-1px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--ember) 70%,transparent);opacity:.7}
#mode{font-size:.62rem;letter-spacing:.34em;color:var(--cyan);text-transform:uppercase;margin-bottom:8px;transition:color .2s}
#mode.foe{color:var(--ember)} #mode.win{color:var(--green)}
#word{min-height:1.35em;display:flex;justify-content:center;flex-wrap:nowrap;line-height:1.25}
#word span{display:inline-block;color:#54707a;font-weight:700}
#word span.ok{color:var(--green);text-shadow:0 0 10px rgba(126,224,129,.35)}
#word span.cur{color:var(--gold);border-bottom:.14em solid var(--gold);animation:caret .9s steps(2) infinite}
@keyframes caret{50%{border-color:transparent;color:#d8c9a4}}
#word span.err{color:var(--ember);animation:shakeit .18s}
@keyframes shakeit{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#timer{height:7px;background:#0a161c;border:1px solid var(--line);margin:10px auto 8px;max-width:560px}
#tfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),#ffd97a);transition:background .2s}
#tfill.warn{background:linear-gradient(90deg,#ff8a4a,var(--ember))}
#tfill.crit{background:linear-gradient(90deg,#ff3d2e,#ff6b4a);animation:critp .3s infinite}
@keyframes critp{50%{opacity:.55}}
#hint{font-size:.66rem;letter-spacing:.18em;color:var(--dim)}
#console.hurt{animation:chit .3s}
@keyframes chit{30%{box-shadow:inset 0 0 40px rgba(255,60,40,.5)}}

/* ---------- OVERLAY ---------- */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(7,14,18,.8);padding:16px}
#overlay[hidden]{display:none}
.panel{width:min(720px,96vw);max-height:94vh;overflow:auto;background:linear-gradient(#132a33,#0e1f26);
  border:1px solid var(--line);padding:clamp(20px,4vw,40px);position:relative;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--gold),var(--ember))}
.panel.lose::before{background:linear-gradient(90deg,#ff3d2e,#7a1f16)}
.p-tag{font-size:.62rem;letter-spacing:.4em;color:var(--cyan);text-transform:uppercase;margin-bottom:8px}
h1.title{font-family:var(--disp);font-size:clamp(2.8rem,9vw,5.2rem);line-height:.95;letter-spacing:.06em;
  color:var(--gold);text-shadow:0 4px 0 #7a4a12,0 8px 0 rgba(0,0,0,.4),0 0 34px rgba(242,185,75,.3)}
h1.title .alt{color:var(--ember);text-shadow:0 4px 0 #5e1c10,0 8px 0 rgba(0,0,0,.4)}
.subtitle{margin:10px 0 18px;color:var(--dim);font-size:.8rem;letter-spacing:.12em;line-height:1.7}
.controls{display:flex;flex-wrap:wrap;gap:14px 26px;margin-bottom:20px}
.controls div{font-size:.7rem;color:var(--dim);letter-spacing:.08em;display:flex;align-items:center;gap:8px}
kbd{font-family:var(--mono);font-size:.72rem;color:#cfe6e4;background:#142c34;border:1px solid #3a5b64;
  border-bottom-width:3px;border-radius:4px;padding:3px 8px}
.foes{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 20px}
.foe{text-align:center;background:#0d1d24;border:1px solid var(--line);padding:8px 6px 6px;width:104px}
.foe canvas{display:block;margin:0 auto;animation:bob 3s ease-in-out infinite alternate}
.foe span{display:block;font-size:.56rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-top:4px}
@keyframes bob{to{transform:translateY(-5px)}}
.best{font-size:.7rem;letter-spacing:.2em;color:var(--gold);margin-bottom:18px;min-height:1em}
.btnrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
button.btn{font-family:var(--disp);font-size:1.05rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold);background:transparent;border:2px solid var(--gold);padding:12px 30px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  transition:background .15s,color .15s,transform .1s}
button.btn:hover{background:var(--gold);color:#14232a;transform:translateY(-2px)}
button.btn:active{transform:translateY(0)}
button.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.hintline{font-size:.66rem;color:var(--dim);letter-spacing:.14em}
.statrows{margin:8px 0 22px;border-top:1px solid var(--line)}
.statrows .row{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid #1c3640;font-size:.78rem;letter-spacing:.1em}
.statrows .row b{font-family:var(--disp);font-size:1.05rem;letter-spacing:.08em;color:var(--gold)}
.panel.lose h1.title{color:var(--ember);text-shadow:0 4px 0 #571a10,0 8px 0 rgba(0,0,0,.4)}

#mute{position:fixed;top:10px;right:10px;z-index:20;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;
  color:var(--dim);background:#0d1d24;border:1px solid var(--line);padding:5px 9px;cursor:pointer}
#mute.off{color:#4a5c63;text-decoration:line-through}
@media (max-width:560px){ .wave b,.combo b{font-size:1.25rem} .hp-block b{font-size:1rem} .foe{width:88px} }
</style>
</head>
<body>
<div id="glyphs"></div>

<div id="app">
  <header id="hud">
    <div class="hp-block" id="phpbox">
      <span class="lbl">You</span>
      <div class="bar"><i id="php"></i></div><b id="phpn">100</b>
    </div>
    <div class="wave"><span class="lbl">Wave</span><b id="wnum">—/5</b><em id="ename">standby</em></div>
    <div class="combo" id="comboBox"><span class="lbl">Combo</span><b id="cmult">×1.0</b></div>
  </header>

  <main id="stagewrap">
    <canvas id="stage"></canvas>
    <div id="hitflash"></div>
    <div id="plate"><b id="pname"></b><div class="bar"><i id="ehp"></i></div><span id="ehpn"></span></div>
    <div id="banner"></div>
  </main>

  <footer id="console">
    <div id="mode">Awaiting first blood</div>
    <div id="word"></div>
    <div id="timer"><i id="tfill"></i></div>
    <div id="hint">Type the incantation before the ember dies · Backspace corrects · a miss breaks your combo</div>
  </footer>
</div>

<div id="overlay"></div>
<button id="mute" title="toggle sound (M)">SND ON</button>

<script>
'use strict';
/* ============================== SETUP ============================== */
const $=s=>document.querySelector(s);
const stage=$('#stage'), ctx=stage.getContext('2d');
const wrapEl=$('#stagewrap'), hitFlashEl=$('#hitflash'), wordEl=$('#word'),
      tfill=$('#tfill'), modeEl=$('#mode'), hintEl=$('#hint'), overlayEl=$('#overlay'),
      plateEl=$('#plate');
let W=0,H=0,DPR=1,lastTs=0;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=wrapEl.getBoundingClientRect();
  W=r.width;H=r.height;
  stage.width=Math.max(1,W*DPR);stage.height=Math.max(1,H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

/* ambient glyph field */
(function(){
  const box=$('#glyphs'), chars='†‡∆◊§¤KFAV';
  for(let i=0;i<16;i++){
    const s=document.createElement('span');
    s.textContent=chars[i%chars.length];
    s.style.left=Math.random()*96+'%';
    s.style.top=Math.random()*94+'%';
    s.style.fontSize=(2+Math.random()*4.5)+'rem';
    s.style.opacity=(0.04+Math.random()*0.06).toFixed(3);
    s.style.animationDuration=(9+Math.random()*14)+'s';
    s.style.animationDelay=(-Math.random()*20)+'s';
    if(Math.random()<.3)s.style.color='var(--cyan)';
    box.appendChild(s);
  }
})();

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false;
function audio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=muted?0:0.18;master.connect(AC.destination);
    }catch(e){AC=null;}
  }
  if(AC&&AC.state==='suspended')AC.resume();
}
function beep(o){
  if(!AC||muted)return;
  const t=AC.currentTime+(o.at||0),osc=AC.createOscillator(),g=AC.createGain();
  osc.type=o.type||'square';
  osc.frequency.setValueAtTime(o.f,t);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(o.f2,1),t+o.dur);
  g.gain.setValueAtTime(o.vol||0.5,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+o.dur);
  osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+o.dur+.03);
}
function noiseHit(dur,vol,fq){
  if(!AC||muted)return;
  const t=AC.currentTime,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource();src.buffer=buf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t);
}
const sfx={
  tick(c){beep({type:'square',f:330+Math.min(c,20)*24,dur:.05,vol:.35});},
  err(){beep({type:'sawtooth',f:140,f2:68,dur:.13,vol:.5});noiseHit(.06,.15,900);},
  back(){beep({type:'triangle',f:220,f2:160,dur:.05,vol:.25});},
  hit(){noiseHit(.14,.5,3200);beep({type:'triangle',f:190,f2:55,dur:.2,vol:.8});beep({type:'square',f:720,f2:260,dur:.09,vol:.3});},
  windup(){beep({type:'sawtooth',f:85,f2:160,dur:.4,vol:.22});},
  roar(){noiseHit(.5,.5,300);beep({type:'sawtooth',f:70,f2:38,dur:.55,vol:.6});},
  thud(){beep({type:'square',f:95,f2:45,dur:.22,vol:.8});noiseHit(.18,.5,500);},
  heal(){beep({type:'sine',f:520,dur:.1,vol:.35});beep({type:'sine',f:790,dur:.14,vol:.35,at:.1});},
  wave(){beep({type:'square',f:392,dur:.08,vol:.3});beep({type:'square',f:587,dur:.1,vol:.3,at:.09});},
  death(){noiseHit(.3,.6,1400);beep({type:'sawtooth',f:220,f2:40,dur:.4,vol:.5});},
  win(){[392,494,587,784,988].forEach((f,i)=>beep({type:'square',f,dur:.16,vol:.4,at:i*.13}));noiseHit(.5,.2,4000);},
  lose(){[300,238,178,110].forEach((f,i)=>beep({type:'sawtooth',f,f2:f*.7,dur:.26,vol:.4,at:i*.2}));}
};
function toggleMute(){
  muted=!muted;
  if(master)master.gain.value=muted?0:0.18;
  const b=$('#mute');b.textContent=muted?'SND OFF':'SND ON';b.classList.toggle('off',muted);
}

/* ============================== DATA ============================== */
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

const ENEMIES=[
{ name:'Ink Slime', hp:45, dmg:[4,7], tier:1, size:.92, phase:0, ground:.32, paint(g,t,a){
  const s=a.s,C=x=>a.flash?'#fff':x,sq=Math.sin(t*2.8)*.06,w=175*s,h=115*s;
  g.save();g.scale(1+sq,1-sq);
  g.fillStyle=C('#5fd47e');g.beginPath();g.moveTo(-w/2,0);
  g.bezierCurveTo(-w*.58,-h*.95,-w*.22,-h*1.3,0,-h*1.26);
  g.bezierCurveTo(w*.24,-h*1.32,w*.58,-h*.9,w/2,0);g.closePath();g.fill();
  g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.ellipse(-w*.17,-h*.8,w*.15,h*.2,-.5,0,7);g.fill();
  g.strokeStyle=C('rgba(170,240,190,.6)');g.lineWidth=2*s;
  for(let i=0;i<2;i++){const p=((t*26+i*34)%46)/46;g.globalAlpha=Math.max(0,1-p);
    g.beginPath();g.arc(w*.3+i*w*.14,-h*1.3-p*46*s,(3+2*i)*s,0,7);g.stroke();}
  g.globalAlpha=1;
  const ex=w*.18,ey=-h*.58,r=9*s;
  for(const dx of[-ex,ex]){
    if(a.blink){g.strokeStyle=C('#0e2a1c');g.lineWidth=3*s;g.beginPath();g.moveTo(dx-r,ey);g.lineTo(dx+r,ey);g.stroke();}
    else{g.fillStyle=C('#10351f');g.beginPath();g.arc(dx,ey,r,0,7);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(dx+3*s,ey-3*s,2.6*s,0,7);g.fill();}}
  g.strokeStyle=C('#10351f');g.lineWidth=3*s;g.beginPath();g.arc(0,-h*.4,w*.08,.15*Math.PI,.85*Math.PI);g.stroke();
  g.restore();
}},
{ name:'Ember Ghoul', hp:65, dmg:[5,9], tier:2, size:1, phase:1.7, ground:.3, paint(g,t,a){
  const s=a.s,C=x=>a.flash?'#fff':x,lg=a.lunge||0,w=190*s,h=150*s;
  g.save();g.translate(0,lg*28*s);g.scale(1+lg*.06,1+lg*.1);
  g.fillStyle=C('#7e3a24');g.beginPath();rr(g,-w*.32,-14*s,w*.15,14*s,4*s);rr(g,w*.16,-14*s,w*.15,14*s,4*s);g.fill();
  g.fillStyle=C('#b6502f');g.beginPath();g.moveTo(-w*.34,0);
  g.quadraticCurveTo(-w*.6,-h*.75,-w*.16,-h*.98);g.lineTo(w*.18,-h*.86);
  g.quadraticCurveTo(w*.46,-h*.55,w*.32,0);g.closePath();g.fill();
  g.strokeStyle=C('#8f3d22');g.lineWidth=10*s;g.lineCap='round';
  g.beginPath();g.moveTo(w*.26,-h*.55);g.quadraticCurveTo(w*.5,-h*.3,w*.42,-4*s);g.stroke();
  for(let i=0;i<3;i++){g.beginPath();g.moveTo(w*.42+i*3*s,-4*s);g.lineTo(w*.42+i*9*s,7*s);g.stroke();}
  g.fillStyle=C('#c95f38');g.beginPath();g.arc(-w*.06,-h*.92,30*s,0,7);g.fill();
  g.fillStyle=C('#5e2a18');
  for(let i=-1;i<2;i++){const hx=-w*.06+i*14*s;g.beginPath();g.moveTo(hx-7*s,-h*1.0);
    g.lineTo(hx+2*s,-h*1.0-15*s);g.lineTo(hx+9*s,-h*1.0);g.closePath();g.fill();}
  g.shadowColor='#ffb35c';g.shadowBlur=14*s;g.fillStyle=a.flash?'#fff':'#ffcf7a';
  for(const dx of[-12*s,12*s]){g.beginPath();g.ellipse(-w*.06+dx,-h*.93,5*s,a.blink?1.4*s:7*s,0,0,7);g.fill();}
  g.shadowBlur=0;
  g.strokeStyle=C('#4a1c0e');g.lineWidth=3*s;g.beginPath();
  for(let i=0;i<6;i++)g.lineTo(-w*.06-14*s+i*5.6*s,-h*.8+(i%2?5:0)*s);
  g.stroke();g.restore();
}},
{ name:'Clock Golem', hp:85, dmg:[7,11], tier:2, size:1.05, phase:3.1, ground:.34, paint(g,t,a){
  const s=a.s,C=x=>a.flash?'#fff':x,lg=a.lunge||0,w=210*s,h=170*s;
  g.save();g.translate(0,lg*14*s);g.rotate(-lg*.06);
  g.fillStyle=C('#8a6a33');g.beginPath();rr(g,-w*.26,-26*s,w*.15,26*s,4*s);rr(g,w*.11,-26*s,w*.15,26*s,4*s);g.fill();
  g.fillStyle=C('#c99a4e');g.beginPath();rr(g,-w*.34,-h*.78,w*.68,h*.56,10*s);g.fill();
  g.strokeStyle=C('#8a6a33');g.lineWidth=3*s;g.beginPath();g.moveTo(-w*.34,-h*.55);g.lineTo(w*.34,-h*.55);g.stroke();
  for(const m of[-1,1]){

const WORDS=[
 ['slime','ember','fang','thorn','quill','dusk','frost','rune','mire','grail'],
 ['shadow','crystal','warlock','nightfall','serpent','cinder','warden','brazier','gloom','raven'],
 ['labyrinth','thunderbolt','parchment','enchantment','darkness','guardian','catacomb','moonlight','spellbound']
];
const BOSS_WORDS=['seal the wyrm','unmake the void','bind the storm','sunder the crown'];

/* ============================== STATE ============================== */
const G={
  state:'menu', wave:0, playerHp:100, maxHp:100, combo:0, topCombo:0,
  enemy:null, word:'', typed:[], deadline:0, turnTotal:1, until:0, deathT:0,
  stats:{keys:0,correct:0,mistakes:0,dmg:0,start:0},
  parts:[], texts:[], embers:[], shake:0, flashE:0, knock:0, hitFlash:0,
  foePreviews:[], confT:0, hintT:null
};
function esc(){return Math.max(.6,Math.min(1.5,Math.min(W,H)/430))*(G.enemy?G.enemy.def.size:1);}
function epos(){return {x:W/2-G.knock*20,y:H*.74,s:esc()};}

/* ============================== FLOW ============================== */
function pickWord(def){
  const pool=def.boss?BOSS_WORDS:WORDS[def.tier-1];
  let w;do{w=pool[Math.floor(Math.random()*pool.length)];}while(w===G.word);
  return w;
}
function timeFor(word,tier,wave){
  let ms=1400+word.length*330;
  ms*=[1,.96,.9][tier-1]*(1-wave*.02);
  return Math.max(1200,ms);
}
function startGame(){
  audio();
  G.wave=0;G.playerHp=G.maxHp;G.combo=0;G.topCombo=0;
  G.stats={keys:0,correct:0,mistakes:0,dmg:0,start:performance.now()};
  G.parts=[];G.texts=[];G.enemy=null;G.shake=0;G.knock=0;G.flashE=0;
  overlayEl.hidden=true;wrapEl.classList.add('ingame');
  updatePlayerBar();updateCombo();
  nextWave(false);
}
function restart(){ if(G.state!=='menu') startGame(); }

function nextWave(healed){
  if(healed&&G.wave>0&&G.playerHp<G.maxHp){
    G.playerHp=Math.min(G.maxHp,G.playerHp+15);updatePlayerBar();
    sfx.heal();banner('+15 HP','var(--green)');
  }
  const def=ENEMIES[G.wave];
  G.enemy={def,hp:def.hp,max:def.hp};
  G.state='intro';G.until=performance.now()+1600;
  banner('Wave '+(G.wave+1)+' — '+def.name, def.boss?'var(--ember)':'var(--gold)');
  if(def.boss){sfx.roar();}else sfx.wave();
  $('#wnum').textContent=(G.wave+1)+'/5';
  $('#ename').textContent=def.name.toUpperCase();
  plateEl.classList.toggle('boss',!!def.boss);
  $('#pname').textContent=def.name;
  updateEnemyBar();setMode('A foe approaches…','');
}
function startPlayerTurn(){
  G.word=pickWord(G.enemy.def);G.typed=[];
  G.turnTotal=timeFor(G.word,G.enemy.def.tier,G.wave)/1000;
  G.deadline=performance.now()+G.turnTotal*1000;
  G.state='playerTurn';
  renderWord();setMode('Your turn — cast by type','');
}
function onWordComplete(){
  const rem=Math.max(0,(G.deadline-performance.now())/(G.turnTotal*1000));
  G.combo++;G.topCombo=Math.max(G.topCombo,G.combo);
  const mult=Math.min(3,1+(G.combo-1)*.1);
  const dmg=Math.round((9+rem*11)*mult);
  G.stats.dmg+=dmg;G.enemy.hp=Math.max(0,G.enemy.hp-dmg);
  updateEnemyBar();updateCombo();sfx.hit();
  G.flashE=1;G.knock=1;G.shake=Math.max(G.shake,6);
  const p=epos(),cols=[G.enemy.def.boss?'#ff8a4a':'#f2b94b','#ffffff','#ffd97a'];
  burst(p.x,p.p?0:0,p.x,p.y-150*p.s,cols,26,320);
  addText((rem>.5?'CRIT ':'')+dmg, p.x+(Math.random()*80-40), p.y-210*p.s, rem>.5?'var(--ember)':'var(--gold)', rem>.5?46:36);
  G.state='resolving';G.until=performance.now()+700;
  setMode('Strike!','win');
}
function killEnemy(){
  G.state='dying';G.deathT=performance.now();G.until=performance.now()+950;
  sfx.death();const p=epos();
  burst(p.x,p.y-120*p.s,['#fff','#f2b94b','#7ee081','#63d8d2'],46,420);
  G.parts.push({type:'ring',x:p.x,y:p.y-110*p.s,r:20,vr:520,life:.5,max:.5,col:'#f2b94b'});
  setMode('Foe down','win');
}
function afterDeath(){
  if(G.wave>=ENEMIES.length-1){victory();return;}
  G.wave++;G.enemy=null;nextWave(true);
}
function startWindup(){
  G.state='windup';G.until=performance.now()+750;
  if(G.enemy.def.boss)sfx.roar();else sfx.windup();
  setMode('It rears to strike…','foe');
}
function enemyStrike(){
  const d=G.enemy.def,[a,b]=d.dmg,dmg=a+Math.floor(Math.random()*(b-a+1));
  G.playerHp=Math.max(0,G.playerHp-dmg);
  updatePlayerBar();G.hitFlash=1;G.shake=16;G.combo=0;updateCombo();sfx.thud();
  const c=$('#console');c.classList.remove('hurt');void c.offsetWidth;c.classList.add('hurt');
  const pb=$('#phpbox');pb.classList.remove('dmg');void pb.offsetWidth;pb.classList.add('dmg');
  addText('-'+dmg,W*.16,H*.82,'var(--ember)',34);
  burst(W/2,H*.9,['#ff6b4a','#ff3d2e'],14,200,true);
  if(G.playerHp<=0){defeat();}else startPlayerTurn();
}
function victory(){
  G.enemy=null;G.state='victory';G.until=performance.now()+900;
  sfx.win();saveBest(G.topCombo);G.confT=0;setMode('The Wyrm is bound','win');
}
function defeat(){
  G.state='defeat';G.until=performance.now()+800;sfx.lose();setMode('Your keys grow cold…','foe');
}

/* ============================== HUD / DOM ============================== */
function updatePlayerBar(){
  $('#php').style.width=(G.playerHp/G.maxHp*100)+'%';
  $('#phpn').textContent=G.playerHp;
  $('#phpbox').classList.toggle('low',G.playerHp<=30);
}
function updateEnemyBar(){
  if(!G.enemy)return;
  $('#ehp').style.width=(G.enemy.hp/G.enemy.max*100)+'%';
  $('#ehpn').textContent=G.enemy.hp+' / '+G.enemy.max;
}
function updateCombo(){
  const b=$('#cmult');
  b.textContent='×'+(Math.min(3,1+Math.max(0,G.combo-1)*.1)).toFixed(1);
  const box=$('#comboBox');
  box.classList.toggle('hot',G.combo>=3);
  if(G.combo>0){box.classList.remove('pulse');void box.offsetWidth;box.classList.add('pulse');}
}
function setMode(txt,cls){modeEl.textContent=txt;modeEl.className='';if(cls)modeEl.classList.add(cls);}
function banner(txt,col){
  const b=$('#banner');b.textContent=txt;b.style.color=col||'var(--gold)';
  b.classList.remove('show');void b.offsetWidth;b.classList.add('show');
}
function setHint(txt,ms){
  if(G.hintT)clearTimeout(G.hintT);
  hintEl.textContent=txt;
  G.hintT=setTimeout(()=>{hintEl.textContent='Type the incantation before the ember dies · Backspace corrects · a miss breaks your combo';},ms||1400);
}
function renderWord(){
  wordEl.innerHTML='';
  const avail=Math.max(200,$('#console').clientWidth-36);
  const fs=Math.min(58,avail/(G.word.length*.7),H*.15);
  wordEl.style.fontSize=fs+'px';wordEl.style.letterSpacing='.02em';
  for(let i=0;i<G.word.length;i++){
    const s=document.createElement('span');
    s.textContent=G.word[i]===' '?'\u00a0':G.word[i];
    if(i<G.typed.length)s.className='ok';
    else if(i===G.typed.length&&G.state==='playerTurn')s.className='cur';
    wordEl.appendChild(s);
  }
}
function flashErrChar(i){
  const sp=wordEl.children[i];
  if(sp){sp.classList.add('err');setTimeout(()=>sp.classList.remove('err'),200);}
}

/* ============================== OVERLAYS ============================== */
function loadBest(){try{return +localStorage.getItem('keyfall-best')||0;}catch(e){return 0;}}
function saveBest(v){try{const b=+localStorage.getItem('keyfall-best')||0;if(v>b)localStorage.setItem('keyfall-best',String(v));}catch(e){}}

function statRowsHTML(){
  const acc=G.stats.correct+G.stats.mistakes>0?Math.round(G.stats.correct/(G.stats.correct+G.stats.mistakes)*100):100;
  const time=((performance.now()-G.stats.start)/1000).toFixed(1)+'s';
  return `<div class="statrows">
    <div class="row"><span>TIME</span><b>${time}</b></div>
    <div class="row"><span>ACCURACY</span><b>${acc}%</b></div>
    <div class="row"><span>TOP COMBO</span><b>×${Math.min(3,1+Math.max(0,G.topCombo-1)*.1).toFixed(1)} · ${G.topCombo} streak</b></div>
    <div class="row"><span>DAMAGE DEALT</span><b>${G.stats.dmg}</b></div>
  </div>`;
}
function showMenu(){
  const best=loadBest();
  overlayEl.innerHTML=`<div class="panel">
    <div class="p-tag">A turn-based typing duel · five foes wait</div>
    <h1 class="title">KEY<span class="alt">FALL</span></h1>
    <p class="subtitle">Each turn, a foe hurls a word at you. Type it before the ember dies —<br>
      speed and unbroken streaks amplify your strike. Miss, and it strikes back.</p>
    <div class="controls">
      <div><kbd>A–Z</kbd> type the word</div>
      <div><kbd>⌫</kbd> correct a slip</div>
      <div><kbd>R</kbd> restart run</div>
      <div><kbd>M</kbd> sound</div>
    </div>
    <div class="p-tag">Your foes</div>
    <div class="foes" id="foerow"></div>
    <div class="best">${best? 'BEST STREAK · '+best : ''}</div>
    <div class="btnrow">
      <button class="btn" id="startbtn">Begin the duel</button>
      <span class="hintline">or press <kbd>Enter</kbd></span>
    </div>
  </div>`;
  const row=$('#foerow');G.foePreviews=[];
  ENEMIES.forEach((d,i)=>{
    const cell=document.createElement('div');cell.className='foe';
    const cv=document.createElement('canvas');cv.width=96;cv.height=78;
    cv.style.animationDelay=(-i*0.6)+'s';
    cell.appendChild(cv);
    const nm=document.createElement('span');nm.textContent=d.name;cell.appendChild(nm);
    row.appendChild(cell);
    G.foePreviews.push({cv,def:d});
  });
  const b=$('#startbtn');
  b.addEventListener('click',()=>{b.blur();startGame();});
  overlayEl.hidden=false;
}
function showEnd(win){
  overlayEl.innerHTML=`<div class="panel ${win?'':'lose'}">
    <div class="p-tag">${win?'All five foes fall':'Slain on wave '+(G.wave+1)+' of 5'}</div>
    <h1 class="title">${win?'VICTORY':'OVERRUN'}</h1>
    <p class="subtitle">${win?'The Word Wyrm is bound. The keys fall silent, satisfied.'
      :'Your ink runs dry. The foes read your name aloud.'}</p>
    ${statRowsHTML()}
    <div class="btnrow">
      <button class="btn" id="againbtn">${win?'Run it again':'Try again'}</button>
      <span class="hintline">or press <kbd>R</kbd></span>
    </div>
  </div>`;
  const b=$('#againbtn');b.addEventListener('click',()=>{b.blur();startGame();});
  overlayEl.hidden=false;
}

/* ============================== INPUT ============================== */
window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  const k=e.key;
  if(k===' '){e.preventDefault();}
  if(e.repeat){return;}
  if(G.state==='playerTurn'){
    if(k==='Backspace'){
      if(G.typed.length){G.typed.pop();sfx.back();renderWord();}
      e.preventDefault();return;
    }
    if(k.length===1&&/[a-zA-Z0-9 ]/.test(k))handleChar(k.toLowerCase());
    return;
  }
  if(k==='m'||k==='M'){toggleMute();return;}
  if(k==='r'||k==='R'){restart();return;}
  if(G.state==='menu'&&(k==='Enter'||k===' ')){startGame();return;}
  if((G.state==='victory'||G.state==='defeat')&&(k==='Enter'||k===' ')){restart();}
});
window.addEventListener('pointerdown',()=>{audio();},{once:false});

function handleChar(ch){
  G.stats.keys++;
  const i=G.typed.length,tgt=G.word;
  if(i<tgt.length&&ch===tgt[i]){
    G.typed.push(ch);G.stats.correct++;sfx.tick(G.combo);renderWord();
    if(G.typed.length===tgt.length)onWordComplete();
  }else{
    G.stats.mistakes++;G.combo=0;updateCombo();sfx.err();
    flashErrChar(Math.min(i,tgt.length-1));
    setHint('Steady hands — the streak is broken');
  }
}

/* ============================== FX ============================== */
function burst(x,y,cols,n,pow,up){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(.3+Math.random()*.7)*pow;
    G.parts.push({type:'dot',x,y,vx:Math.cos(a)*sp,vy:(up? -Math.abs(Math.sin(a)*sp)-80 : Math.sin(a)*sp-60),
      g:340,life:.5+Math.random()*.45,max:.9,size:2+Math.random()*3.5,col:cols[i%cols.length]});
  }
}
function addText(txt,x,y,col,size){
  G.texts.push({txt:String(txt),x,y,vy:-52,life:1.1,max:1.1,col,size});
}

/* ============================== UPDATE ============================== */
function update(dt,t){
  const now=performance.now();
  G.shake=Math.max(0,G.shake-dt*34);
  G.flashE=Math.max(0,G.flashE-dt*4);
  G.knock=Math.max(0,G.knock-dt*3.2);
  G.hitFlash=Math.max(0,G.hitFlash-dt*1.5);
  hitFlashEl.style.opacity=G.hitFlash.toFixed(3);
  const sx=(Math.random()-.5)*G.shake,sy=(Math.random()-.5)*G.shake;
  wrapEl.style.transform=G.shake>.2?`translate(${sx}px,${sy}px)`:'';

  if(G.state==='intro'&&now>=G.until)startPlayerTurn();
  else if(G.state==='resolving'&&now>=G.until){
    if(!G.enemy||G.enemy.hp<=0)killEnemy();else startWindup();
  }
  else if(G.state==='dying'&&now>=G.until)afterDeath();
  else if(G.state==='windup'&&now>=G.until)enemyStrike();
  else if(G.state==='victory'){
    G.confT-=dt;
    if(G.confT<=0){G.confT=.12;
      burst(W/2+(Math.random()*W*.5-W*.25),H*.86,['#f2b94b','#7ee081','#63d8d2','#ff8a4a'],6,300,true);
    }
    if(now>=G.until&&!overlayEl.hidden===false)showEnd(true);
  }
  else if(G.state==='defeat'&&now>=G.until)showEnd(false);

  /* timer bar */
  if(G.state==='playerTurn'){
    const pct=Math.max(0,(G.deadline-now)/(G.turnTotal*1000)*100);
    tfill.style.width=pct+'%';
    tfill.className=pct<22?'crit':pct<50?'warn':'';
  }else{tfill.style.width='0%';}

  /* particles */
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];
    p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue;}
    if(p.type==='ring'){p.r+=p.vr*dt;continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;
  }
  for(let i=G.texts.length-1;i>=0;i--){const p=G.texts[i];
    p.life-=dt;p.y+=p.vy*dt;if(p.life<=0)G.texts.splice(i,1);}

  /* ambient embers */
  if(G.embers.length<38&&Math.random()<.5){
    G.embers.push({x:Math.random()*W,y:H+8,vy:-(10+Math.random()*26),ph:Math.random()*7,
      sz:1+Math.random()*2,a:.14+Math.random()*.2,
      col:['#f2b94b','#ff8a4a','#63d8d2'][Math.floor(Math.random()*3)]});
  }
  for(let i=G.embers.length-1;i>=0;i--){const e=G.embers[i];
    e.y+=e.vy*dt;e.x+=Math.sin(t*1.2+e.ph)*.4;
    if(e.y<-10)G.embers.splice(i,1);
  }

  /* menu previews */
  if(G.state==='menu'){
    for(const f of G.foePreviews){
      const g=f.cv.getContext('2d');g.clearRect(0,0,96,78);
      g.save();g.translate(48,66);
      f.def.paint(g,t,{s:.3,flash:false,lunge:0,blink:Math.sin(t*1.4+f.def.phase)>.97,death:0});
      g.restore();
    }
  }
}

/* ============================== DRAW ============================== */
function draw(t){
  ctx.clearRect(0,0,W,H);
  /* embers */
  for(const e of G.embers){
    ctx.globalAlpha=e.a;ctx.fillStyle=e.col;
    ctx.beginPath();ctx.arc(e.x,e.y,e.sz,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(G.state==='menu')return;
  if(!G.enemy)return;

  const p=epos(),def=G.enemy.def,s=p.s;
  let alpha=1,scale=1,lunge=0,death=0;
  if(G.state==='intro'){
    const a=Math.min(1,(performance.now()-(G.until-1600))/700);
    alpha=a;scale=.8+.2*(a*a*(3-2*a));
  }
  if(G.state==='windup')lunge=1-Math.max(0,G.until-performance.now())/750;
  if(G.state==='dying')death=Math.min(1,(performance.now()-G.deathT)/900);

  /* arcane ring + glow */
  ctx.save();ctx.translate(p.x,p.y);
  const gl=ctx.createRadialGradient(0,-90*s,10,0,-90*s,240*s);
  gl.addColorStop(0,'rgba(242,185,75,.12)');gl.addColorStop(1,'rgba(242,185,75,0)');
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,-90*s,240*s,0,7);ctx.fill();
  ctx.strokeStyle='rgba(242,185,75,.2)';ctx.lineWidth=1.5;ctx.setLineDash([3,11]);
  ctx.lineDashOffset=-t*30;ctx.beginPath();ctx.arc(0,-90*s,165*s,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(99,216,210,.14)';ctx.lineDashOffset=t*22;
  ctx.beginPath();ctx.arc(0,-90*s,120*s,0,7);ctx.stroke();
  ctx.setLineDash([]);
  /* ground shadow */
  ctx.fillStyle=`rgba(0,0,0,${def.ground*alpha})`;
  ctx.beginPath();ctx.ellipse(0,4,95*s*scale,16*s,0,0,7);ctx.fill();
  /* enemy */
  ctx.save();
  ctx.globalAlpha=alpha*(death?1-death:1);
  if(death)ctx.translate(0,-def.boss? -death*30 : -death*30);
  const ds=death?(1-death*.5):1;
  ctx.scale(scale*ds,scale*ds*(1-death*.2));
  if(death&&G.state==='dying')ctx.translate(0,-death*70);
  def.paint(ctx,t,{s,flash:G.flashE>0.4,lunge,blink:Math.sin(t*1.4+def.phase)>.97,death});
  ctx.restore();ctx.restore();

  /* particles */
  for(const q of G.parts){
    const a=Math.max(0,q.life/q.max);
    if(q.type==='ring'){
      ctx.globalAlpha=a*.8;ctx.strokeStyle=q.col;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.stroke();
    }else{
      ctx.globalAlpha=a;ctx.fillStyle=q.col;
      ctx.beginPath();ctx.arc(q.x,q.y,q.size*a+1,0,7);ctx.fill();
    }
  }
  /* damage texts */
  ctx.textAlign='center';
  for(const q of G.texts){
    const a=Math.max(0,q.life/q.max);
    ctx.globalAlpha=a;
    ctx.font=`900 ${q.size}px Impact,"Arial Black",sans-serif`;
    ctx.lineWidth=5;ctx.strokeStyle='rgba(8,16,20,.85)';
    ctx.strokeText(q.txt,q.x,q.y);
    ctx.fillStyle=q.col;ctx.fillText(q.txt,q.x,q.y);
  }
  ctx.globalAlpha=1;
}

/* ============================== LOOP ============================== */
function frame(ts){
  const t=ts/1000,dt=Math.min(.05,lastTs?(ts-lastTs)/1000:.016);lastTs=ts;
  update(dt,t);draw(t);
  requestAnimationFrame(frame);
}

$('#mute').addEventListener('click',function(){this.blur();toggleMute();});
resize();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
