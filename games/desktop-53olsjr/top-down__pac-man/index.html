<script>
"use strict";
/* ================= MAZE MUNCHER ================= */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

/* ---------- maze data (left 10 cols + center col, mirrored) ---------- */
const COLS=21, ROWS=23;
const WALL=0,DOT=1,PELLET=2,EMPTY=3,DOOR=4;
const ROWDEFS=[
["##########","#"],
["#.........","#"],
["#o##.#...#","#"],
["#.........","#"],
["#..##....#","#"],
["#.........","#"],
["#.#...#..#","#"],
["#.#...#..#","."],
["#.#...#..#","."],
["#.........","."],
["#.......##","-"],
["#.......#_","_"],
["#.......##","#"],
["#.........","."],
["#.#...#..#","#"],
["#.#...#..#","#"],
["_.......##","."],
["#.#...#..#","."],
["#o##.#...#","."],
["#.........","#"],
["#..##....#","."],
["#.........","#"],
["##########","#"]
];
function mazeFromDefs(){
  const g=[];
  for(let r=0;r<ROWS;r++){
    const [L,C]=ROWDEFS[r]; const row=[];
    for(let c=0;c<COLS;c++){
      const ch=(c===10)?C:L[c<=9?c:20-c];
      row.push(ch==='#'?WALL:ch==='.'?DOT:ch==='o'?PELLET:ch==='-'?DOOR:EMPTY);
    }
    g.push(row);
  }
  return g;
}
let grid=mazeFromDefs(), dotsLeft=0;
function buildDots(){
  grid=mazeFromDefs(); dotsLeft=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]===DOT||grid[r][c]===PELLET) dotsLeft++;
}

/* ---------- pixel font (4x5) ---------- */

D:["###.","#..#","#..#","#..#","###."],E:["####","#...","###.","#...","####"],F:["####","#...","###.","#...","#..."],
G:[".###","#...","#.##","#..#",".##."],H:["#..#","#..#","####","#..#","#..#"],I:["###.",".#..",".#..",".#..","###."],

};
const FONT={}; for(const k in FONT_SRC) FONT[k]=FONT_SRC[k];
function pxText(str,x,y,s,col,align){
  str=String(str).toUpperCase(); s=Math.max(1,Math.round(s));
  let w=(str.length*5-1)*s;
  if(align==='center')x-=w/2; else if(align==='right')x-=w;
  x=Math.floor(x); y=Math.floor(y);
  ctx.fillStyle=col;
  for(let i=0;i<str.length;i++){
    const g=FONT[str[i]]||FONT[' '], gx=x+i*5*s;
    for(let r=0;r<5;r++)for(let c=0;c<4;c++) if(g[r][c]==='#') ctx.fillRect(gx+c*s,y+r*s,s,s);
  }
  return w;
}
function pxTextShadow(str,x,y,s,col,shadow,dx){
  dx=dx||Math.max(1,Math.round(s*0.35));
  pxText(str,x+dx,y+dx,s,shadow,'center');
  pxText(str,x,y,s,col,'center');
}

/* ---------- layout ---------- */
let dpr=1,cw=0,ch=0,t=20,ox=0,oy=0,wallPath=null,wallGrad=null,scanPat=null;
const stars=[]; for(let i=0;i<80;i++)stars.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.4,ph:Math.random()*6.28,sp:.3+Math.random()*.9});
function buildWallPath(){
  wallPath=new Path2D();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(grid[r][c]===WALL) wallPath.rect(c*t,r*t,t,t);
}
function layout(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  cw=window.innerWidth; ch=window.innerHeight;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  const hudTop=Math.max(58,ch*0.1), hudBot=Math.max(36,ch*0.075);
  t=Math.min((cw-20)/COLS,(ch-hudTop-hudBot-24)/ROWS);
  ox=(cw-COLS*t)/2; oy=hudTop+(ch-hudTop-hudBot-ROWS*t)/2;
  buildWallPath();
  wallGrad=ctx.createLinearGradient(ox,oy,ox+COLS*t,oy+ROWS*t);
  wallGrad.addColorStop(0,'#4d7dff'); wallGrad.addColorStop(1,'#1f3fb8');
}
window.addEventListener('resize',layout);

/* ---------- audio (WebAudio, starts after first input) ---------- */
let AC=null,master=null,sirenNodes=null,curSiren='off';
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.5; master.connect(AC.destination);
  }catch(e){}
}
function beep(f0,f1,dur,type,vol,delay){
  if(!AC)return; delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(Math.max(1,f0),t0);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
}
function noiseBurst(dur,vol,freq){
  if(!AC)return;
  const n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=0.8;
  const g=AC.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX={
  dot(a){ beep(a?520:340,a?340:520,0.07,'square',0.11); },
  pellet(){ beep(220,90,0.28,'sawtooth',0.28); beep(90,220,0.28,'sawtooth',0.2,0.05); },
  ghostEat(){ [520,700,980,1320].forEach((f,i)=>beep(f,f*0.96,0.09,'square',0.22,i*0.055)); },
  fruit(){ beep(880,1320,0.1,'square',0.22); beep(1320,1760,0.1,'square',0.18,0.09); },
  death(){ beep(600,55,0.9,'sawtooth',0.35); noiseBurst(0.4,0.25,300); },
  extra(){ [523,659,784,1046].forEach((f,i)=>beep(f,f,0.1,'square',0.22,i*0.09)); },
  clear(){ [392,523,659,784,1046,1318].forEach((f,i)=>beep(f,f,0.09,'triangle',0.25,i*0.08)); },
  jingle(){ beep(130,130,0.12,'triangle',0.3); [659,784,988,1319].forEach((f,i)=>beep(f,f,0.08,'square',0.2,i*0.09+0.1)); },
  ready(){ beep(392,392,0.08,'square',0.2); beep(523,523,0.08,'square',0.2,0.09); },
  over(){ beep(300,45,1.3,'triangle',0.35); noiseBurst(0.6,0.15,150); }
};
function stopSiren(){ if(sirenNodes){ try{sirenNodes.o.stop();sirenNodes.lfo.stop();}catch(e){} sirenNodes=null; } }
function setSiren(m){
  if(m===curSiren)return; curSiren=m; stopSiren();
  if(!AC||m==='off')return;
  let base,lrate,depth,vol,type='sawtooth';
  if(m==='chase'){base=420;lrate=6.5;depth=170;vol=0.03;}
  else if(m==='fright'){type='square';base=680;lrate=11;depth=320;vol=0.04;}
  else {base=980;lrate=17;depth=420;vol=0.05;}
  const o=AC.createOscillator(),g=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
  o.type=type;o.frequency.value=base; lfo.type='sine';lfo.frequency.value=lrate; lg.gain.value=depth;
  lfo.connect(lg); lg.connect(o.frequency); g.gain.value=vol;
  o.connect(g); g.connect(master); o.start(); lfo.start();
  sirenNodes={o,lfo};
}
function syncSiren(){
  let m='off';
  if(state==='play'){
    if(ghosts.some(g=>g.state==='eyes'))m='eyes';
    else if(frightT>0)m='fright';
    else m='chase';
  }
  setSiren(m);
}

/* ---------- persistence ---------- */
let hs=0,muted=false;
try{ hs=+localStorage.getItem('mazeMuncherHS')||0; muted=localStorage.getItem('mazeMuncherMute')==='1'; }catch(e){}
function saveHS(){ try{ localStorage.setItem('mazeMuncherHS',String(hs)); }catch(e){} }
function saveMute(){ try{ localStorage.setItem('mazeMuncherMute',muted?'1':'0'); }catch(e){} }

/* ---------- game state ---------- */
const UP=0,LEFT=1,DOWN=2,RIGHT=3;
const OPP=[2,3,0,1];
const DV=[[0,-1],[-1,0],[0,1],[1,0]];
const FACE_A=[-Math.PI/2,Math.PI,Math.PI/2,0];
const GCOL=['#ff3b3b','#ffb8ff','#00f0ff','#ffb847'];
const SCAT=[[19,1],[1,1],[19,21],[1,21]];
const FRUIT_VAL=[100,300,500,700,1000];

let state='start', t=0;
let score=0,lives=3,level=1,newHigh=false;
let pac=null,ghosts=[],relT=[];
let frightT=0,frightChain=0,mode='scatter',modeT=0,sched=[];
let fruitActive=false,fruitT=0,dotsEaten=0,nextFruitAt=70;
let readyT=0,deathT=0,clearT=0,wakaFlip=false;
let lifeMarks=[10000,50000],li=0;
let popups=[],parts=[],shakeT=0;

function makeGhosts(){
  return [
    {id:0,x:10.5,y:9.5 ,dir:LEFT,state:'normal',fright:false,speed:6,path:null},
    {id:1,x:10.5,y:11.5,dir:DOWN,state:'house' ,fright:false,speed:6,path:null,bt:Math.random()*3},
    {id:2,x:9.5 ,y:11.5,dir:DOWN,state:'house' ,fright:false,speed:6,path:null,bt:Math.random()*3},
    {id:3,x:11.5,y:11.5,dir:DOWN,state:'house' ,fright:false,speed:6,path:null,bt:Math.random()*3}
  ];
}
function modeSchedule(lv){
  const s=Math.max(3,7-lv), c1=Math.max(10,20-2*lv), c2=Math.max(6,12-lv);
  return [{m:'scatter',t:s},{m:'chase',t:c1},{m:'scatter',t:s},{m:'chase',t:c2},{m:'scatter',t:Math.max(3,5-lv/2)},{m:'chase',t:1e9}];
}
function resetPositions(){
  pac={x:7.5,y:13.5,dir:LEFT,wantDir:LEFT,face:LEFT,speed:7,phase:0};
  ghosts=makeGhosts();
  const k=Math.max(0,level-1);
  relT=[0,Math.max(0.6,1.2-k*0.2),Math.max(1,4-k*0.3),Math.max(1.5,8-k*0.4)];
  frightT=0;frightChain=0;
  sched=modeSchedule(level); mode=sched[0].m; modeT=sched[0].t;
  fruitActive=false;fruitT=0;dotsEaten=0;nextFruitAt=70;
  setSiren('off');
}
function newGame(){
  score=0;lives=3;level=1;li=0;newHigh=false;
  popups=[];parts=[];shakeT=0;
  buildDots(); resetPositions();
  state='ready'; readyT=2;
}
function nextLevel(){ level++; buildDots(); resetPositions(); state='ready'; readyT=2; SFX.ready(); }

/* ---------- movement core ---------- */
function aheadCell(e,d){
  const dx=DV[d][0],dy=DV[d][1];
  const cx=Math.floor(e.x),cy=Math.floor(e.y);
  let nx=cx,ny=cy;
  if(dx===1)nx=(e.x-cx)>=0.5?cx+1:cx; else if(dx===-1)nx=(e.x-cx)<=0.5?cx-1:cx;
  if(dy===1)ny=(e.y-cy)>=0.5?cy+1:cy; else if(dy===-1)ny=(e.y-cy)<=0.5?cy-1:cy;
  return [nx,ny];
}
function canMove(e,d){
  const nx=aheadCell(e,d)[0], ny=aheadCell(e,d)[1];
  if(nx<0||nx>=COLS)return true;           // tunnel mouths wrap
  if(ny<0||ny>=ROWS)return false;
  const cell=grid[ny][nx];
  if(cell===WALL)return false;
  if(cell===DOOR && !(e&&e.isEyes))return false;
  return true;
}
function stepMover(e,dt,decide){
  let rem=dt,guard=6;
  while(rem>1e-5&&guard--){
    if(e.dir<0){ e.dir=decide(); if(e.dir<0)return; }
    const dx=DV[e.dir][0],dy=DV[e.dir][1];
    const cx=Math.floor(e.x),cy=Math.floor(e.y);
    let tx=cx+0.5,ty=cy+0.5;
    if(dx===1&&e.x>=tx)tx++; else if(dx===-1&&e.x<=tx)tx--;
    else if(dy===1&&e.y>=ty)ty++; else if(dy===-1&&e.y<=ty)ty--;
    const dist=Math.abs(dx?tx-e.x:ty-e.y);
    const step=e.speed*rem;
    if(step>=dist){
      e.x+=dx*dist; e.y+=dy*dist; rem-=dist/e.speed;
      const nd=decide();
      if(nd!==e.dir&&canMove(e,nd))e.dir=nd;
    } else { e.x+=dx*step; e.y+=dy*step; rem=0; }
  }
  if(e.x<-0.5)e.x+=COLS; else if(e.x>COLS+0.5)e.x-=COLS;
}
function pacDecide(){
  if(pac.dir<0)return canMove(pac,pac.wantDir)?pac.wantDir:-1;
  if(pac.wantDir>=0&&canMove(pac,pac.wantDir))return pac.wantDir;
  return canMove(pac,pac.dir)?pac.dir:-1;
}

/* ---------- ghost AI ---------- */
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return[];
  const n=COLS*ROWS,prev=new Int16Array(n).fill(-1);
  const q=[sy*COLS+sx]; let qi=0; prev[q[0]]=-2;
  const pass=(c,r)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]!==WALL;
  while(qi<q.length){
    const cur=q[qi++],cr=Math.floor(cur/COLS),cc=cur%COLS;
    if(cc===tx&&cr===ty){
      const p=[]; let i=cur;
      while(prev[i]!==-2){ i=prev[i]; p.push([i%COLS,Math.floor(i/COLS)]); }
      return p.reverse();
    }
    const nb=[[cc+1,cr],[cc-1,cr],[cc,cr+1],[cc,cr-1]];
    if(cc===0)nb.push([COLS-1,cr]); if(cc===COLS-1)nb.push([0,cr]);
    for(const p of nb){
      if(!pass(p[0],p[1]))continue;
      const ni=p[1]*COLS+p[0];
      if(prev[ni]!==-1)continue;
      prev[ni]=cur; q.push(ni);
    }
  }
  return [];
}
function ghostTarget(g){
  const pcx=Math.floor(pac.x),pcy=Math.floor(pac.y);
  switch(g.id){
    case 0: return [pcx,pcy];
    case 1:{ let x=pcx+4*DVP(pac.dir)[0], y=pcy+4*DVP(pac.dir)[1]; if(pac.dir===UP)x-=4; return [x,y]; }
    case 2:{ const b=[Math.floor(ghosts[0].x),Math.floor(ghosts[0].y)]; return [2*pcx-b[0],2*pcy-b[1]]; }
    case 3: default:
      if(Math.hypot(g.x-pac.x,g.y-pac.y)>8)return[pcx,pcy];
      return SCAT[3];
  }
}
function DVP(d){return DV[d];}
function ghostDecide(g){
  const cx=Math.floor(g.x),cy=Math.floor(g.y);
  const cands=[];
  for(let d=0;d<4;d++){ if(d===OPP[g.dir])continue; if(canMove(g,d))cands.push(d); }
  if(!cands.length)return OPP[g.dir];
  if(g.state==='eyes'){
    if(g.path&&g.path.length){
      while(g.path.length&&g.path[0][0]===cx&&g.path[0][1]===cy)g.path.shift();
      if(g.path.length){
        const tg=g.path[0];
        for(const d of cands){
          const nx=((cx+DV[d][0])%COLS+COLS)%COLS, ny=cy+DV[d][1];
          if(ny>=0&&ny<ROWS&&nx===tg[0]&&ny===tg[1])return d;
        }
      }
    }
    return cands[(Math.random()*cands.length)|0];
  }
  if(g.fright)return cands[(Math.random()*cands.length)|0];
  const Tg=(mode==='scatter')?SCAT[g.id]:ghostTarget(g);
  let best=cands[0],bd=1e9;
  for(const d of cands){
    const nx=((cx+DV[d][0])%COLS+COLS)%COLS, ny=cy+DV[d][1];
    if(ny<0||ny>=ROWS)continue;
    const dist=(nx-Tg[0])*(nx-Tg[0])+(ny-Tg[1])*(ny-Tg[1]);
    if(dist<bd){bd=dist;best=d;}
  }
  return best;
}
function updateHouse(g,dt){
  g.bt+=dt; g.y=11.5+Math.sin(g.bt*2.2)*0.32;
  if(relT[g.id]<=0&&frightT<=0)g.state='exiting';
}
function updateExiting(g,dt){
  const sp=4*dt;
  if(Math.abs(g.x-10.5)>0.05){ g.x+=Math.sign(10.5-g.x)*Math.min(sp,Math.abs(10.5-g.x)); return; }
  g.x=10.5;
  if(g.y>9.5){
    let ny=g.y-Math.min(sp,g.y-9.5);
    if(frightT>0&&ny<10.4)ny=10.4;
    g.y=ny;
    if(g.y<=9.52){ g.y=9.5; g.state='normal'; g.fright=false; g.dir=Math.random()<0.5?LEFT:RIGHT; }
  }
}

/* ---------- fx ---------- */
function addPopup(x,y,txt,col){ popups.push({x,y,txt,col,t:0}); if(popups.length>12)popups.shift(); }
function burst(x,y,n,col,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=(0.4+Math.random())*(sp||5);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,max:.5+Math.random()*.4,col,r:(1+Math.random()*2)});
  }
  if(parts.length>160)parts.splice(0,parts.length-160);
}
function ring(x,y,col){ parts.push({x,y,vx:0,vy:0,t:0,max:.5,col,r:4,kind:'ring'}); }
function updateFx(dt){
  for(const p of popups)p.t+=dt;
  popups=popups.filter(p=>p.t<1);
  for(const p of parts){ p.t+=dt; if(!p.kind){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;} }
  parts=parts.filter(p=>p.t<p.max);
  if(shakeT>0)shakeT-=dt;
}

/* ---------- scoring ---------- */
function addScore(n){
  score+=n;
  if(score>hs){ hs=score; newHigh=true; }
  if(li<lifeMarks.length&&score>=lifeMarks[li]){
    li++; lives++; SFX.extra();
    addPopup(pac.x*t,pac.y*t-14,'+1 LIFE','#ffe600');
  }
}

/* ---------- play update ---------- */
function frightDur(){ return Math.max(1.5,6-(level-1)*0.7); }
function eatGhost(g){
  const val=200*Math.pow(2,frightChain); frightChain=Math.min(frightChain+1,4);
  addScore(val);
  addPopup(g.x*t,g.y*t,String(val),'#8df6ff');
  burst(g.x*t,g.y*t,16,'#8df6ff',6);
  shakeT=0.25; SFX.ghostEat();
  g.state='eyes'; g.fright=false;
  g.path=bfs(Math.floor(g.x),Math.floor(g.y),10,11);
  if(!g.path.length)g.state='exiting';
}
function die(){ state='dying'; deathT=0; setSiren('off'); SFX.death(); }
function updatePlay(h){
  // mode schedule
  modeT-=h;
  if(modeT<=0&&sched[0].m!=='chase'||(modeT<=0&&sched[(sched.length-1)].t<1e9)){
    const idx=sched.indexOf(sched.find(s=>s.m===mode&&s.t===Math.max(modeT,0)));
  }
  if(modeT<=0){
    let i=sched.findIndex(s=>s.m===mode);
    // find current index robustly: track by pointer instead
  }
  // (handled via modeIdx below)
  modeT2();
  function modeT2(){}
  frightT>0&&(frightT-=h);
  if(frightT<=0&&frightT>-99){ for(const g of ghosts)if(g.state!=='eyes')g.fright=false; }
  for(let i=1;i<4;i++)if(relT[i]>0)relT[i]-=h;

  // pac
  if(pac.dir>=0&&pac.wantDir===OPP[pac.dir])pac.dir=pac.wantDir;
  const pcol=Math.floor(((pac.x%COLS)+COLS)%COLS);
  pac.speed=(7.2+Math.min(1.1,(level-1)*0.14))*(pcol===0||pcol===COLS-1?0.7:1);
  stepMover(pac,h,pacDecide);
  if(pac.dir>=0)pac.face=pac.dir;
  pac.phase+=h*(pac.dir<0?6:13);

  const pcx=((Math.floor(pac.x))%COLS+COLS)%COLS, pcy=Math.floor(pac.y);

  for(const g of ghosts){
    const gc=Math.floor(((g.x%COLS)+COLS)%COLS);
    if(g.state==='house'){ updateHouse(g,h); continue; }
    if(g.state==='exiting'){ updateExiting(g,h); continue; }

    g.speed=sp;

    stepMover(g,h,()=>ghostDecide(g));
    if(g.state==='eyes'&&(g.path.length===0||Math.hypot(g.x-10.5,g.y-11.5)<0.45))g.state='exiting';
  }

  // collisions
  for(const g of ghosts){
    if(g.state==='house'||g.state==='eyes')continue;
    if(Math.hypot(pac.x-g.x,pac.y-g.y)<0.55){

  if(dotsLeft===0){ state='clear'; clearT=0; setSiren('off'); SFX.clear(); }

/* proper mode scheduling (replaces the placeholder logic above) */
let modeIdx=0;
const _updPlay=updatePlay;
updatePlay=function(h){
  modeT-=h;
  if(modeT<=0&&modeIdx<sched.length-1){
    modeIdx++; mode=sched[modeIdx].m; modeT=sched[modeIdx].t;
    for(const g of ghosts)if(g.state==='normal')g.dir=OPP[g.dir];
  }
  _updPlay(h);
};

/* ---------- main update ---------- */
function update(dt){
  t+=dt;
  if(state==='start')return;
  if(state==='ready'){
    readyT-=dt;
    for(const g of ghosts)if(g.state==='house')updateHouse(g,dt);
    if(readyT<=0){ state='play'; }
    return;
  }
  if(state==='dying'){
    deathT+=dt;
    if(deathT>1.7){
      lives--;
      if(lives<=0){
        for(const g of ghosts)g.fright=false;
        state='gameover'; saveHS(); SFX.over(); setSiren('off');
      } else { resetPositions(); state='ready'; readyT=2; SFX.ready(); }
    }
    return;
  }
  if(state==='clear'){ clearT+=dt; if(clearT>2.3)nextLevel(); return; }
  if(state==='pause')return;
  if(state==='gameover'){
    for(const g of ghosts){
      if(g.state==='house'){updateHouse(g,dt);continue;}
      if(g.state==='exiting'){updateExiting(g,dt);continue;}
      g.speed=6.5; stepMover(g,dt,()=>ghostDecide(g));
      if(g.state==='eyes'&&(g.path.length===0||Math.hypot(g.x-10.5,g.y-11.5)<0.45))g.state='exiting';
    }
    updateFx(dt); return;
  }
  // play (substepped for reliable collisions)
  const n=Math.max(1,Math.ceil(dt/0.016)),h=dt/n;
  for(let i=0;i<n&&state==='play';i++)updatePlay(h);
  syncSiren();
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawPacAt(px,py,r,angle,open){
  ctx.save(); ctx.translate(px,py); ctx.rotate(angle);
  ctx.fillStyle='#ffe600';
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.arc(0,0,r,open,Math.PI*2-open);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function ghostBodyPath(x,y,r,frame){
  const p=new Path2D(), skirtY=y+0.72*r;
  p.arc(x,y-0.1*r,r,Math.PI,0);
  p.lineTo(x+r,skirtY);
  if(frame===0){ const rb=r/3; for(let i=0;i<3;i++){ const cxp=x+r-rb*(2*i+1); p.arc(cxp,skirtY,rb,0,Math.PI); } }
  else { const rb=r/4; for(let i=0;i<4;i++){ const cxp=x+r-rb*(2*i+1); p.arc(cxp,skirtY,rb,0,Math.PI); } }
  p.closePath(); return p;
}
function drawGhostSprite(g){
  const x=g.x*t,y=g.y*t,r=0.42*t;
  const eyesOnly=g.state==='eyes';
  const fright=g.fright&&!eyesOnly;
  const flash=fright&&frightT<1.6&&Math.floor(frightT*5)%2===0;
  const frame=Math.floor(t*8+g.id*0.7)%2;
  if(!eyesOnly){
    ctx.save();
    ctx.shadowColor=fright?'rgba(90,90,255,.8)':'rgba(255,255,255,.35)';
    ctx.shadowBlur=t*0.3;
    ctx.fillStyle=fright?(flash?'#ffffff':'#2b2bd8'):GCOL[g.id];
    ctx.fill(ghostBodyPath(x,y,r,frame));
    ctx.restore();
  }
  if(fright){
    const c=flash?'#d81e1e':'#ffd9b3';
    ctx.fillStyle=c;
    const es=r*0.24;
    ctx.fillRect(x-r*0.5,y-r*0.45,es,es);
    ctx.fillRect(x+r*0.5-es,y-r*0.45,es,es);
    ctx.strokeStyle=c; ctx.lineWidth=Math.max(1,r*0.12); ctx.lineJoin='round';
    ctx.beginPath();
    const my=y+0.1*r,mw=r*0.9,n=4;
    ctx.moveTo(x-mw/2,my);
    for(let i=0;i<n;i++){
      ctx.lineTo(x-mw/2+(i+0.5)*mw/n,my-(i%2?r*0.18:-r*0.18));
    }
    ctx.lineTo(x+mw/2,my); ctx.stroke();
  } else {
    const dx=DV[g.dir][0]*r*0.16, dy=DV[g.dir][1]*r*0.16;
    for(const s of [-1,1]){
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.ellipse(x+s*r*0.38+dx,y-r*0.25+dy,r*0.3,r*0.38,0,0,6.283); ctx.fill();
      ctx.fillStyle='#1b2bd6';
      ctx.beginPath(); ctx.arc(x+s*r*0.38+dx*2,y-r*0.25+dy*2,r*0.15,0,6.283); ctx.fill();
    }
  }
}
function drawFruit(cx,cy,r,type){
  type=((type%5)+5)%5;
  ctx.save(); ctx.translate(cx,cy);
  if(type===0){ // cherry
    ctx.strokeStyle='#7ec850'; ctx.lineWidth=Math.max(1,r*0.16);
    ctx.beginPath(); ctx.moveTo(-r*0.3,0); ctx.quadraticCurveTo(0,-r*1.1,r*0.15,-r*0.9);
    ctx.moveTo(r*0.35,r*0.2); ctx.quadraticCurveTo(r*0.3,-r*0.6,r*0.15,-r*0.9); ctx.stroke();
    ctx.fillStyle='#ff2d55';
    ctx.beginPath(); ctx.arc(-r*0.35,r*0.15,r*0.42,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.4,r*0.35,r*0.42,0,6.283); ctx.fill();
  } else if(type===1){ // strawberry
    ctx.fillStyle='#ff4757';
    ctx.beginPath(); ctx.moveTo(0,-r*0.9); ctx.quadraticCurveTo(r*0.95,-r*0.4,0,r*0.95); ctx.quadraticCurveTo(-r*0.95,-r*0.4,0,-r*0.9); ctx.fill();
    ctx.fillStyle='#ffe600';
    for(let i=0;i<5;i++){ const a=i/5*6.283; ctx.fillRect(Math.cos(a)*r*0.4-r*0.06,Math.sin(a)*r*0.35+r*0.1-r*0.06,r*0.12,r*0.12); }
    ctx.fillStyle='#7ec850'; ctx.beginPath(); ctx.arc(0,-r*0.85,r*0.3,Math.PI,0); ctx.fill();
  } else if(type===2){ // orange
    ctx.fillStyle='#ff9f1a'; ctx.beginPath(); ctx.arc(0,0,r*0.85,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(-r*0.3,-r*0.3,r*0.25,0,6.283); ctx.fill();
    ctx.fillStyle='#7ec850'; ctx.beginPath(); ctx.ellipse(r*0.15,-r*0.85,r*0.3,r*0.14,-0.6,0,6.283); ctx.fill();
  } else if(type===3){ // apple
    ctx.fillStyle='#ff3b30'; ctx.beginPath(); ctx.arc(0,r*0.1,r*0.8,0,6.283); ctx.fill();
    ctx.strokeStyle='#8d5a2b'; ctx.lineWidth=Math.max(1,r*0.14);
    ctx.beginPath(); ctx.moveTo(0,-r*0.5); ctx.quadraticCurveTo(r*0.1,-r*0.9,0,-r*1.05); ctx.stroke();
    ctx.fillStyle='#7ec850'; ctx.beginPath(); ctx.ellipse(r*0.35,-r*0.8,r*0.28,r*0.13,-0.5,0,6.283); ctx.fill();
  } else { // galaxian plum
    ctx.fillStyle='#b06cff'; ctx.beginPath(); ctx.ellipse(0,0,r*0.7,r*0.9,0,0,6.283); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-r*0.2,-r*0.25,r*0.14,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.25,r*0.1,r*0.1,0,6.283); ctx.fill();
  }
  ctx.restore();
}

  const hs2=Math.max(3,Math.round(s1*0.42));
  pxText('HIGH SCORE',cw/2,ch*0.65,hs2,'#7f95e8','center');
  pxText(String(hs).padStart(6,'0'),cw/2,ch*0.65+hs2*6,Math.round(hs2*1.3),newHigh?'#8df6ff':'#ffe600','center');

  const cs=Math.max(3,Math.round(s1*0.36));
  let cy=ch*0.77;
  pxText('ARROWS - WASD - SWIPE TO MOVE',cw/2,cy,cs,'#c9d6ff','center');
  cy+=cs*7;
  pxText('P PAUSE - M SOUND - R RESTART',cw/2,cy,cs,'#c9d6ff','center');
  cy+=cs*7;
  pxText('POWER PELLETS TURN THE TIDE',cw/2,cy,Math.max(2,Math.round(cs*0.85)),'#5a6b9e','center');

  if(Math.floor(t*2)%2===0)
    pxTextShadow('PRESS ENTER OR TAP TO START',cw/2,ch*0.9,s1*0.55,'#ffe600','#8a3c00');
}

/* ---------- input ---------- */
function keyDir(k){
  switch(k){
    case 'ArrowUp':case 'w':case 'W':return UP;
    case 'ArrowLeft':case 'a':case 'A':return LEFT;
    case 'ArrowDown':case 's':case 'S':return DOWN;
    case 'ArrowRight':case 'd':case 'D':return RIGHT;
  }
  return null;
}
function togglePause(){
  if(state==='play'){ state='pause'; setSiren('off'); }
  else if(state==='pause'){ state='play'; }
}
window.addEventListener('keydown',e=>{
  initAudio();
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>=0)e.preventDefault();
  const d=keyDir(k);
  if(state==='start'){
    if(d!=null&&pac)pac.wantDir=d;
    if(k==='Enter'||k===' '||d!=null){ newGame(); SFX.jingle(); }
  } else if(state==='gameover'){
    if(k==='Enter'||k===' '||k==='r'||k==='R'){ newGame(); SFX.jingle(); }
  } else {
    if(d!=null&&state==='play')pac.wantDir=d;
    if(k==='p'||k==='P')togglePause();
    if(k==='m'||k==='M'){ muted=!muted; if(master)master.gain.value=muted?0:0.5; saveMute(); }
    if(k==='r'||k==='R'){ newGame(); SFX.jingle(); }
  }
});
let pDown=null;
cv.addEventListener('pointerdown',e=>{
  initAudio();
  pDown={x:e.clientX,y:e.clientY};
  if(state==='start'||state==='gameover'){ newGame(); SFX.jingle(); pDown=null; }
});
cv.addEventListener('pointermove',e=>{
  if(!pDown||state!=='play')return;
  const dx=e.clientX-pDown.x, dy=e.clientY-pDown.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>26){
    pac.wantDir=Math.abs(dx)>Math.abs(dy)?(dx>0?RIGHT:LEFT):(dy>0?DOWN:UP);
    pDown={x:e.clientX,y:e.clientY};
  }
});
cv.addEventListener('pointerup',e=>{
  if(pDown&&Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y)<12){
    if(state==='start'||state==='gameover'){ newGame(); SFX.jingle(); }
    else if(state==='pause')togglePause();
  }
  pDown=null;
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play')togglePause(); });
window.addEventListener('blur',()=>{ if(state==='play')togglePause(); });

/* ---------- boot & loop ---------- */
buildDots(); resetPositions(); layout();
if(master)master.gain.value=muted?0:0.5;
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(ts-last)/1000||0);
  last=ts;
  update(dt);
  render();
}
requestAnimationFrame(frame);
</script>
