<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#191233">
<title>MOMENTUM — dusk canyon platformer</title>
<style>
  :root{
    --panel:rgba(24,14,38,.93); --amber:#ffb347; --gold:#ffd27a;
    --teal:#7ef0d4; --coral:#ff5d73; --ink:#ffe9c9; --dim:rgba(255,233,201,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#191233;touch-action:none}
  body{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink);
       -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;display:block}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;
       align-items:flex-start;pointer-events:none;z-index:3;font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;transition:opacity .35s}
  body[data-state="menu"] #hud,body[data-state="menu"] #foot{opacity:0}
  .pill{background:var(--panel);border:2px solid rgba(255,179,71,.5);box-shadow:0 4px 0 rgba(8,3,16,.5);
        padding:6px 13px;font-size:15px;letter-spacing:.5px;border-radius:8px;display:flex;gap:9px;align-items:center}
  #ePill{min-width:96px;justify-content:center}
  #dPill{justify-content:center}
  #emberIco{width:14px;height:14px;border-radius:50%;flex:none;
            background:radial-gradient(circle at 35% 35%,#fff3c9,#ffb347 60%,#d96a1f);box-shadow:0 0 9px rgba(255,179,71,.95)}
  .lbl{font-size:10px;letter-spacing:2px;color:var(--dim);display:block;font-family:"Trebuchet MS",sans-serif}
  #foot{position:fixed;bottom:10px;right:14px;font-size:11px;color:rgba(255,233,201,.42);
        font-family:ui-monospace,Menlo,monospace;pointer-events:none;letter-spacing:1px;z-index:3;transition:opacity .35s}

  /* ---------- OVERLAY ---------- */
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;cursor:pointer;
      background:radial-gradient(ellipse at 50% 42%,rgba(22,10,36,.5),rgba(10,5,22,.86))}
  #ov.hidden{display:none}
  .card{width:min(620px,92vw);max-height:92vh;overflow:auto;background:var(--panel);
        border:3px solid rgba(255,179,71,.65);border-radius:16px;padding:28px 34px 30px;
        box-shadow:0 14px 0 rgba(8,3,16,.55),0 0 70px rgba(255,120,40,.12);
        transform:rotate(-1.2deg);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{transform:rotate(-1.2deg) scale(.82) translateY(26px);opacity:0}}
  .eyebrow{text-align:center;letter-spacing:5px;font-size:11px;color:var(--amber);opacity:.85;margin-bottom:10px}
  .logo{font-family:Impact,"Arial Black","Franklin Gothic Bold",sans-serif;font-style:italic;text-align:center;
        font-size:clamp(54px,9.5vw,86px);line-height:.88;letter-spacing:2px;color:var(--gold);
        text-shadow:0 0 28px rgba(255,138,61,.5),4px 4px 0 #8a2f3a,9px 9px 0 rgba(8,3,16,.6)}
  .logo span{color:var(--teal);text-shadow:0 0 26px rgba(126,240,212,.5),4px 4px 0 #174a58,9px 9px 0 rgba(8,3,16,.6)}
  .logo.small{font-size:clamp(38px,6vw,56px)}
  .tag{text-align:center;margin-top:12px;letter-spacing:4px;font-size:12px;color:var(--dim);text-transform:uppercase}
  .ctrls{margin:22px auto 4px;display:grid;gap:9px;width:fit-content;justify-items:center}
  .crow{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink)}
  .crow i{font-style:normal;color:var(--dim);font-size:12px}
  .lab2{width:96px;text-align:right;font-size:10.5px;letter-spacing:2.5px;color:var(--amber)}
  kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#2a1b44;color:var(--ink);
      border:1px solid rgba(255,233,201,.35);border-bottom:3px solid rgba(8,3,16,.8);
      padding:3px 9px;border-radius:6px;min-width:14px;display:inline-block;text-align:center}
  .best{text-align:center;margin-top:18px;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--dim);letter-spacing:1px}
  .best b{color:var(--gold)}
  .big{display:block;margin:20px auto 0;font-family:inherit;font-weight:bold;font-size:16px;letter-spacing:2px;
       padding:13px 30px;background:var(--amber);color:#2a1204;border:none;border-radius:10px;cursor:pointer;
       box-shadow:0 6px 0 #8a4a1f,0 12px 20px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
  .big:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8a4a1f,0 16px 24px rgba(0,0,0,.4)}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4a1f}
  .prompt{text-align:center;margin-top:16px;font-size:12.5px;letter-spacing:3px;color:var(--dim);animation:pulse 1.7s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .stats{margin:18px auto 0;width:fit-content;min-width:280px}
  .srow{display:flex;justify-content:space-between;gap:34px;font-family:ui-monospace,Menlo,monospace;font-size:15px;
        padding:8px 2px;border-bottom:1px dashed rgba(255,233,201,.18)}
  .srow span{color:var(--dim);letter-spacing:2px;font-size:11px;padding-top:3px}
  .srow b{color:var(--gold)}
  .badge{display:inline-block;background:var(--teal);color:#0c2a26;padding:3px 12px;border-radius:6px;
         font-weight:bold;letter-spacing:2px;font-size:11px;transform:rotate(3deg);margin-left:8px;vertical-align:middle}

  /* ---------- TOUCH ---------- */
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:16px;z-index:4;pointer-events:none}
  #touch.show{display:flex}
  .tgrp{display:flex;gap:12px;pointer-events:auto}
  .tbtn{width:62px;height:62px;border-radius:50%;background:rgba(30,17,48,.62);border:2px solid rgba(255,179,71,.55);
        color:var(--ink);font-size:22px;display:flex;align-items:center;justify-content:center;touch-action:none}
  .tbtn:active{background:rgba(255,179,71,.4)}
</style>
</head>
<body data-state="menu">
<canvas id="c"></canvas>

<div id="hud">
  <div class="pill" id="ePill"><span id="emberIco"></span><span id="eCount">0/22</span></div>
  <div class="pill" style="flex-direction:column;padding:4px 16px 6px"><span class="lbl">TIME</span><span id="tTime">00:00.0</span></div>
  <div class="pill" id="dPill"><span class="lbl">SLIPS</span><span id="dDeaths">0</span></div>
</div>
<div id="foot">P PAUSE · M SOUND ON · R RESTART</div>

<div id="ov"></div>

<div id="touch">
  <div class="tgrp"><div class="tbtn" id="tL">◀</div><div class="tbtn" id="tR">▶</div></div>
  <div class="tgrp"><div class="tbtn" id="tD">»</div><div class="tbtn" id="tJ">▲</div></div>
</div>

<script>
(()=>{'use strict';
/* ============================== UTILS ============================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmtTime=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),t=Math.floor(ms%1000/100);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+t};
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ============================== CANVAS ============================== */
const cvs=$('c'),ctx=cvs.getContext('2d');
let VW=0,VH=0,DPR=1,ZOOM=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=window.innerWidth;VH=window.innerHeight;
  cvs.width=Math.round(VW*DPR);cvs.height=Math.round(VH*DPR);
  ZOOM=clamp(Math.max(VW/1450,VH/860),.5,2.4);}
window.addEventListener('resize',resize);resize();

/* ============================== AUDIO ============================== */
let AC=null,master=null,noiseBuf=null,muted=false;
function ensureAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{const A=window.AudioContext||window.webkitAudioContext;AC=new A();
    master=AC.createGain();master.gain.value=muted?0:.42;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.5),AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}}
function tone(type,f0,f1,dur,vol,delay=0){if(!AC||muted)return;const t0=AC.currentTime+delay,
  o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(Math.max(1,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);}
function noiseS(dur,vol,f,type='lowpass',delay=0){if(!AC||muted)return;const t0=AC.currentTime+delay,
  s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+.05);}
const SFX={
  jump(){tone('square',300,580,.13,.2)},
  dbl(){tone('triangle',460,940,.16,.22)},
  land(v){noiseS(.09,Math.min(.3,v/3000),420);tone('sine',120,50,.09,.18)},
  bonk(){tone('square',150,85,.07,.13)},
  spring(){tone('sine',170,980,.3,.26);tone('square',340,1200,.18,.1,.05)},
  ember(){tone('sine',880,880,.07,.18);tone('sine',1318,1318,.1,.16,.05)},
  dash(){noiseS(.16,.22,1400,'highpass');tone('sine',700,180,.12,.1)},
  crumble(){noiseS(.12,.16,240);noiseS(.14,.1,900,'highpass')},
  check(){[659,880,1318].forEach((f,i)=>tone('triangle',f,f,.14,.18,i*.07))},
  death(){tone('sawtooth',360,65,.4,.26);noiseS(.3,.2,500)},
  win(){[523,659,784,1046,1318].forEach((f,i)=>tone('triangle',f,f,.22,.2,i*.09))},
  start(){tone('sine',392,784,.25,.2)}
};

/* ============================== LEVEL ============================== */
const LW=4940,LH=780,KILL_Y=724,BASEY=704,CAMY=390;
function S(x,y,w,h,o){return Object.assign({x,y,w,h,ox:x,oy:y},o||{});}
let solids=[],springs=[],spikes=[],embers=[],checks=[],signs=[],goal={};
const SIGNS=[
  {x:150,y:470,tx:'MOVE   A · D   or   ← →'},
  {x:405,y:468,tx:'JUMP   SPACE — hold = higher'},
  {x:625,y:392,tx:'jump again in the air!'},
  {x:1665,y:468,tx:'CRUMBLING — keep moving!'},
  {x:2130,y:470,tx:'DASH   SHIFT / X'},
  {x:3080,y:452,tx:'SPRING!'}
];
function buildLevel(){
  solids=[
    S(-60,600,760,200),
    S(560,478,130,22),
    S(820,600,280,200),
    S(1220,600,280,200),
    S(1520,574,64,22,{t:'crumble',state:0,timer:.45,vy:0,alpha:1}),
    S(1610,574,64,22,{t:'crumble',state:0,timer:.45,vy:0,alpha:1}),
    S(1700,574,64,22,{t:'crumble',state:0,timer:.45,vy:0,alpha:1}),
    S(1790,574,64,22,{t:'crumble',state:0,timer:.45,vy:0,alpha:1}),
    S(1920,600,260,200),
    S(2230,560,110,20,{t:'moveH',axis:'x',from:2230,to:2410,sp:95,dir:1,dx:0,dy:0}),
    S(2470,470,110,20,{t:'moveH',axis:'x',from:2470,to:2650,sp:115,dir:-1,dx:0,dy:0}),
    S(2720,520,190,260),
    S(2910,600,330,200),
    S(2980,300,150,22),
    S(3260,340,120,22),
    S(3380,600,540,200),
    S(3960,580,74,20),
    S(4110,510,74,20),
    S(4260,560,74,20,{t:'crumble',state:0,timer:.45,vy:0,alpha:1}),
    S(4410,490,74,20),
    S(4560,540,380,240),
    S(-140,140,80,640,{t:'wall'}),
    S(LW-40,140,80,640,{t:'wall'})
  ];
  springs=[{x:3080,y:600,w:46,h:26,anim:0}];
  spikes=[{x:3560,y:600,w:90},{x:3730,y:600,w:90}];
  embers=[[260,545],[340,545],[625,412],[1160,528],[1552,512],[1642,512],[1732,512],[1822,512],
          [2060,540],[2360,492],[2585,402],[2795,452],[3020,242],[3085,242],[3320,282],[3605,528],
          [3775,528],[3997,514],[4147,444],[4297,494],[4447,424],[4660,478]]
          .map(([x,y])=>({x,y,t:Math.random()*6,got:false}));
  checks=[{x:2010,y:600,on:false},{x:3450,y:600,on:false}];
  goal={x:4720,y:540};
  ctx.font='bold 15px "Trebuchet MS",sans-serif';
  signs=SIGNS.map(s=>Object.assign({tw:ctx.measureText(s.tx).width},s));
}

/* ---------- background precompute ---------- */
const stars=(()=>{const r=mulberry32(7);const a=[];for(let i=0;i<150;i++)a.push({x:r()*6400-400,y:r()*420+8,s:r()*1.7+.7,p:r()*7});return a;})();
function makeRidge(seed,col,hMin,hMax,wMin,wMax){const r=mulberry32(seed);const it=[];let x=-600;
  while(x<LW*1.7+800){const w=wMin+r()*(wMax-wMin),h=hMin+r()*(hMax-hMin);
    it.push({x,w,h,notch:r()<.45?{dx:.2+r()*.3,dw:.22+r()*.2,dh:.14+r()*.28}:null});
    x+=w*(.55+r()*.5);}return {col,it};}
const ridges=[
  makeRidge(11,'#3a2050',170,360,260,520),
  makeRidge(23,'#572447',110,250,200,420),
  makeRidge(37,'#7c2b36',60,160,160,340)
];
const clouds=(()=>{const r=mulberry32(91);const a=[];for(let i=0;i<8;i++)a.push({x:r()*8400-400,y:80+r()*190,w:120+r()*160,v:4+r()*7});return a;})();
const motes=(()=>{const a=[];for(let i=0;i<34;i++)a.push({x:Math.random()*LW,y:300+Math.random()*400,vy:-(8+Math.random()*16),ph:Math.random()*7,gold:Math.random()<.6,sz:1+Math.random()*1.8});return a;})();

/* ============================== STATE ============================== */
let state='menu',AT=0,timeMs=0,emberCount=0,deaths=0,totalE=22;
const cam={x:200,y:CAMY};let shake=0;
let best=null,newBestFlag=false,winAt=0,winShown=false;
try{const b=JSON.parse(localStorage.getItem('momentum_best'));if(b&&typeof b.t==='number')best=b;}catch(e){}
function saveBest(){try{localStorage.setItem('momentum_best',JSON.stringify(best));}catch(e){}}
let respPt={x:90,y:570};

const P={x:90,y:570,w:32,h:30,vx:0,vy:0,face:1,grounded:true,coyote:0,buf:0,usedDouble:false,
  dashT:0,dashCd:0,dashDir:1,landSquash:0,runPh:0,alpha:1,spawnFade:0,dead:0,ghosts:[],groundRef:null};
const K={l:false,r:false,jump:false};

function setState(s){state=s;document.body.dataset.state=s;}

/* ============================== FX ============================== */
const parts=[];
function addP(o){if(parts.length<450)parts.push(o);}
function dustBurst(x,y,n,up){for(let i=0;i<n;i++)addP({tp:'dust',x:x+(Math.random()-.5)*22,y,vx:(Math.random()-.5)*130,vy:up?-(20+Math.random()*60):-(10+Math.random()*40),g:-60,life:.35+Math.random()*.35,max:.7,size:3+Math.random()*3.5,col:'232,201,160'});}
function ringFx(x,y,col,R){addP({tp:'ring',x,y,r:8,r1:R,life:.32,max:.32,col});}
function sparks(x,y,n,col,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(.4+Math.random()*.8);
  addP({tp:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,g:520,life:.3+Math.random()*.3,max:.6,size:1.5+Math.random()*2,col});}}
function shards(x,y,n,col){for(let i=0;i<n;i++)addP({tp:'shard',x,y,vx:(Math.random()-.5)*420,vy:-120-Math.random()*380,g:1500,life:.6+Math.random()*.5,max:1.1,size:4+Math.random()*5,col,rot:Math.random()*7,vr:(Math.random()-.5)*14});}
function confetti(x,y,n){const cols=['#ffd27a','#7ef0d4','#ff5d73','#ffe9c9'];for(let i=0;i<n;i++)addP({tp:'conf',x,y,vx:(Math.random()-.5)*380,vy:-160-Math.random()*320,g:900,life:.9+Math.random()*.7,max:1.6,size:4+Math.random()*4,col:cols[i%4],rot:Math.random()*7,vr:(Math.random()-.5)*18});}
function txtFx(x,y,str,col){addP({tp:'txt',x,y,vx:0,vy:-42,g:0,life:.9,max:.9,size:16,col,txt:str});}
function updateParticles(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;
  if(p.life<=0){parts.splice(i,1);continue;}
  p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.rot!==undefined)p.rot+=p.vr*dt;}}
function updateGhosts(dt){for(let i=P.ghosts.length-1;i>=0;i--){P.ghosts[i].life-=dt;if(P.ghosts[i].life<=0)P.ghosts.splice(i,1);}}

/* ============================== WORLD UPDATE ============================== */
function updateWorld(dt){
  for(const s of solids){
    if(s.t==='moveH'){const p=(s.axis==='x'?s.x:s.y)+s.dir*s.sp*dt;let np;
      if(p>s.to){np=s.to;s.dir=-1;}else if(p<s.from){np=s.from;s.dir=1;}else np=p;
      if(s.axis==='x'){s.dx=np-s.x;s.x=np;}else{s.dy=np-s.y;s.y=np;}}
    else if(s.t==='crumble'){
      if(s.state===1){s.timer-=dt;if(s.timer<=0){s.state=2;s.vy=30;shards(s.x+s.w/2,s.y+8,6,'#a8603a');noiseS(.15,.14,900,'highpass');}}
      else if(s.state===2){s.vy+=1800*dt;s.y+=s.vy*dt;s.alpha-=dt*1.5;if(s.alpha<=0)s.dead=true;}}
  }
  for(const sp of springs)sp.anim=Math.max(0,sp.anim-dt*3.2);
  for(const e of embers)e.t+=dt;
  for(const c of checks)if(c.on&&Math.random()<dt*1.6)sparks(c.x+18,c.y-62,1,'255,210,122',60);
  if(Math.random()<dt*3){const gx=goal.x,gy=goal.y;addP({tp:'spark',x:gx+(Math.random()-.5)*60,y:gy-20-Math.random()*90,vx:(Math.random()-.5)*24,vy:-30,g:0,life:.7,max:.7,size:1.6+Math.random()*1.6,col:'180,240,255'});}
}

/* ============================== PLAYER PHYSICS ============================== */
function tryDash(){if(state!=='play'||P.dead>0||P.dashCd>0||P.dashT>0)return;
  P.dashT=.13;P.dashCd=.9;P.dashDir=(K.l&&!K.r)?-1:(K.r&&!K.l)?1:P.face;
  SFX.dash();shake=Math.max(shake,3);ringFx(P.x+16,P.y+15,'rgba(126,240,212,.7)',34);}
function doJump(){P.vy=-760;P.grounded=false;P.coyote=0;P.buf=0;SFX.jump();dustBurst(P.x+16,P.y+30,5,false);ringFx(P.x+16,P.y+28,'rgba(255,233,201,.4)',22);}
function doDouble(){P.vy=-700;P.buf=0;P.usedDouble=true;SFX.dbl();sparks(P.x+16,P.y+24,8,'126,240,212',140);ringFx(P.x+16,P.y+15,'rgba(126,240,212,.7)',30);}
function die(){if(state!=='play'||P.dead>0)return;deaths++;P.dead=.75;SFX.death();shake=13;
  const cx=P.x+16,cy=P.y+15;shards(cx,cy,18,'#8df5dd');shards(cx,cy,8,'#3fbfa0');ringFx(cx,cy,'rgba(255,93,115,.8)',70);}
function respawn(){P.x=respPt.x;P.y=respPt.y;P.vx=P.vy=0;P.usedDouble=false;P.dashT=0;P.dashCd=0;P.spawnFade=.35;
  for(const s of solids)if(s.t==='crumble'){s.state=0;s.timer=.45;s.y=s.oy;s.vy=0;s.alpha=1;s.dead=false;}
  ringFx(P.x+16,P.y+15,'rgba(255,210,122,.7)',36);}

let gAcc=0,runDust=0;
function physStep(h){
  const active=(state==='play');
  P.coyote-=h;P.buf-=h;P.dashCd-=h;if(P.landSquash>0)P.landSquash-=h;
  if(P.spawnFade>0)P.spawnFade-=h;
  P.alpha=clamp((.35-P.spawnFade)/.2,0,1);
  const ax=active?((K.r?1:0)-(K.l?1:0)):0;
  if(ax!==0)P.face=ax;

  if(P.dashT>0){
    P.dashT-=h;P.vx=P.dashDir*640;P.vy=0;
    gAcc+=h;if(gAcc>.02){gAcc=0;if(P.ghosts.length<12)P.ghosts.push({x:P.x,y:P.y,life:.25});}
    addP({tp:'streak',x:P.x+16-P.dashDir*14,y:P.y+8+Math.random()*14,vx:-P.dashDir*300,vy:0,g:0,life:.22,max:.22,size:1.5,col:'126,240,212'});
  }else{
    const acc=P.grounded?2400:1500,max=340;
    if(ax!==0){P.vx+=ax*acc*h;
      if(Math.abs(P.vx)>max)P.vx-=Math.sign(P.vx)*Math.min(Math.abs(P.vx)-max,(P.grounded?900:140)*h);}
    else{const dec=P.grounded?1900:260;P.vx-=Math.sign(P.vx)*Math.min(Math.abs(P.vx),dec*h);}
    const gmul=(P.vy<0&&!K.jump)?1.5:1;
    P.vy=Math.min(980,P.vy+2200*gmul*h);
    if(active&&P.buf>0){
      if(P.grounded||P.coyote>0)doJump();
      else if(!P.usedDouble)doDouble();
    }
  }
  // carry by moving platform
  const gr=P.groundRef;
  if(gr&&gr.t==='moveH'){P.x+=gr.dx;P.y+=gr.dy;}

  // X
  P.x+=P.vx*h;
  for(const s of solids){if(s.dead||s.t==='wall'&&false)continue;if(hit(P,s)){
    if(P.vx>0||(P.x+P.w/2)<(s.x+s.w/2))P.x=s.x-P.w;else P.x=s.x+s.w;
    if(P.dashT>0){P.dashT=0;P.vx=-P.dashDir*240;SFX.bonk();dustBurst(P.x+(P.vx<0?0:P.w),P.y+15,6,false);}
    else if(Math.abs(P.vx)>560){shake=Math.max(shake,3);dustBurst(P.x+(P.vx<0?0:P.w),P.y+15,5,false);}
    P.vx=0;}}
  // Y
  const prevG=P.grounded;const fallV=P.vy;
  P.y+=P.vy*h;P.grounded=false;let ref=null;
  for(const s of solids){if(s.dead)continue;if(hit(P,s)){
    if(P.vy>=0&&(P.y+P.h-P.vy*h)<=s.y+10){P.y=s.y-P.h;const v=P.vy;P.vy=0;P.grounded=true;ref=s;}
    else if(P.vy<0){P.y=s.y+s.h;if(-P.vy>320)SFX.bonk();P.vy=0;}}
  }
  if(P.grounded){P.coyote=.1;P.usedDouble=false;P.groundRef=ref;
    if(!prevG&&fallV>520){P.landSquash=.16;SFX.land(fallV);dustBurst(P.x+16,P.y+30,Math.min(12,4+fallV/180),false);shake=Math.max(shake,Math.min(6,fallV/260));}
    if(ref&&ref.t==='crumble'&&ref.state===0){ref.state=1;SFX.crumble();}
    if(Math.abs(P.vx)>240){runDust-=h;if(runDust<=0){runDust=.09;dustBurst(P.x+16-Math.sign(P.vx)*10,P.y+30,1,false);}}
    P.runPh+=Math.abs(P.vx)*h*.09;
  }else P.groundRef=null;

  // springs
  for(const sp of springs){const box={x:sp.x,y:sp.y-sp.h,w:sp.w,h:sp.h};
    if(hit(P,box)&&P.vy>=-50){P.y=sp.y-sp.h-P.h;P.vy=-1250;P.grounded=false;P.usedDouble=false;
      sp.anim=1;SFX.spring();shake=Math.max(shake,4);sparks(sp.x+sp.w/2,sp.y-8,10,'255,93,115',220);ringFx(sp.x+sp.w/2,sp.y-6,'rgba(255,210,122,.7)',44);}}
  if(!active)return;
  // hazards & pickups
  for(const sp of spikes)if(hit(P,{x:sp.x+8,y:sp.y-22,w:sp.w-16,h:22})){die();return;}
  if(P.y>KILL_Y){die();return;}
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  for(const e of embers){if(e.got)continue;const dx=pcx-e.x,dy=pcy-e.y;
    if(dx*dx+dy*dy<900){e.got=true;emberCount++;SFX.ember();sparks(e.x,e.y,8,'255,210,122',160);txtFx(e.x,e.y-14,'+1','#ffd27a');}}
  for(const c of checks){if(c.on)continue;
    if(hit(P,{x:c.x-30,y:c.y-110,w:60,h:110})){c.on=true;respPt={x:c.x-16,y:c.y-30};SFX.check();
      confetti(c.x,c.y-70,18);txtFx(c.x,c.y-96,'CHECKPOINT!','#ffd27a');shake=Math.max(shake,3);}}
  if(hit(P,{x:goal.x-36,y:goal.y-118,w:72,h:118}))winGame();
}

      ctx.beginPath();ctx.moveTo(cx+dx*20,yy);ctx.lineTo(cx+dx*(40+i*8),yy+(i-1)*2.5);ctx.stroke();}}
  ctx.save();ctx.translate(cx,fy-15*sy);ctx.rotate(tilt);ctx.scale(sx,sy);ctx.globalAlpha=P.alpha;
  if(P.grounded){const ph=Math.sin(P.runPh);ctx.fillStyle='#3fbfa0';
    for(const sgn of[-1,1]){const fxo=sgn*8+(Math.abs(P.vx)>40?ph*sgn*4:0);ell(fxo,12.5,5.5,3.5);ctx.fill();}}
  ctx.fillStyle='#8df5dd';ell(0,0,16,14.5);ctx.fill();
  ctx.strokeStyle='#12333a';ctx.lineWidth=3;ell(0,0,16,14.5);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';ell(-P.face*3,5,8,5);ctx.fill();
  const lx=clamp(P.vx/400,-1,1)*2+P.face*1.5,ly=clamp(P.vy/700,-1,1)*2,blink=(AT%3.6)<.1;
  for(const sgn of[-1,1]){const ex=sgn*6+lx*.4;
    if(blink){ctx.strokeStyle='#12333a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex-3,-5);ctx.lineTo(ex+3,-5);ctx.stroke();}
    else{ctx.fillStyle='#fff';ell(ex,-4.5+ly,4.6,5);ctx.fill();
      ctx.fillStyle='#14262e';ell(ex+lx*.8,-4+ly,2.2,2.6);ctx.fill();}}
  ctx.strokeStyle='#12333a';ctx.lineWidth=2;
  if(P.dashT>0||Math.abs(P.vy)>520){ctx.fillStyle='#0e2830';ell(P.face*2,4,3,4);ctx.fill();}
  else{ctx.beginPath();ctx.arc(P.face*2,1.5,3.5,Math.PI*.15,Math.PI*.85);ctx.stroke();}
  ctx.restore();
}
function drawParts(){
  for(const p of parts){const f=clamp(p.life/p.max,0,1);
    if(p.tp==='dust'){ctx.fillStyle='rgba('+p.col+','+(f*.5).toFixed(3)+')';ell(p.x,p.y,p.size*(1.6-f*.6),p.size*(1.6-f*.6));ctx.fill();}
    else if(p.tp==='spark'){ctx.globalAlpha=f;ctx.fillStyle=p.col.startsWith('#')?p.col:'rgb('+p.col+')';
      ell(p.x,p.y,p.size,p.size);ctx.fill();ctx.globalAlpha=1;}
    else if(p.tp==='shard'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=f;
      ctx.fillStyle=p.col;ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);ctx.restore();ctx.globalAlpha=1;}
    else if(p.tp==='ring'){const r=lerp(p.r1,p.r,1-f);ctx.strokeStyle=p.col;ctx.globalAlpha=f;
      ctx.lineWidth=3*f+1;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
    else if(p.tp==='conf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,f*2);
      ctx.fillStyle=p.col;ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);ctx.restore();ctx.globalAlpha=1;}
    else if(p.tp==='streak'){ctx.strokeStyle='rgba('+p.col+','+(f*.6).toFixed(3)+')';ctx.lineWidth=p.size*2;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.05,p.y);ctx.stroke();}
    else if(p.tp==='txt'){ctx.globalAlpha=f;ctx.fillStyle=p.col;
      ctx.font='bold '+p.size+'px ui-monospace,Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(20,8,26,.8)';ctx.lineWidth=3.5;ctx.strokeText(p.txt,p.x,p.y);ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#171033');g.addColorStop(.45,'#3d1e46');g.addColorStop(.75,'#8a2f3a');g.addColorStop(1,'#ff9640');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  const shx=(Math.random()*2-1)*shake,shy=(Math.random()*2-1)*shake;
  drawBG();
  ctx.save();ctx.translate(VW/2+shx,VH/2+shy);ctx.scale(ZOOM,ZOOM);ctx.translate(-cam.x,-cam.y);
  drawLava();drawAmbient();drawSolids();drawGhosts();drawPlayer();drawParts();
  ctx.restore();
  g=ctx.createRadialGradient(VW/2,VH*.45,Math.min(VW,VH)*.36,VW/2,VH/2,Math.max(VW,VH)*.78);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,4,20,.5)');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
}

/* ============================== HUD / OVERLAYS ============================== */
const ov=$('ov');let lastTC='';
function showOv(html){ov.innerHTML=html;ov.classList.remove('hidden');}
function hideOv(){ov.classList.add('hidden');}
function menuHTML(){const b=best?('BEST <b>'+fmtTime(best.t)+'</b> · <b>'+best.e+'/'+totalE+'</b> EMBERS'):'NO RECORD YET — SET ONE';
  return '<div class="card">'+
  '<div class="eyebrow">✦ DUSK CANYON · A PHYSICS PLATFORMER ✦</div>'+
  '<h1 class="logo">MOME<span>N</span>TUM</h1>'+
  '<p class="tag">ride the momentum — don’t kiss the lava</p>'+
  '<div class="ctrls">'+
  '<div class="crow"><span class="lab2">MOVE</span><kbd>←</kbd><kbd>→</kbd><i>/</i><kbd>A</kbd><kbd>D</kbd></div>'+
  '<div class="crow"><span class="lab2">JUMP</span><kbd>SPACE</kbd><i>hold = higher · tap again in air = double</i></div>'+
  '<div class="crow"><span class="lab2">DASH</span><kbd>SHIFT</kbd><i>/</i><kbd>X</kbd><i>a burst of pure momentum</i></div>'+
  '<div class="crow"><span class="lab2">SYSTEMS</span><kbd>P</kbd><i>pause</i><kbd>R</kbd><i>restart</i><kbd>M</kbd><i>sound</i></div>'+
  '</div>'+
  '<div class="best">'+b+'</div>'+
  '<button class="big" id="bGo">START THE RUN ▸</button>'+
  '<div class="prompt">PRESS ENTER — OR TAP ANYWHERE</div></div>';}
function winHTML(){return '<div class="card">'+
  '<div class="eyebrow">✦ CRYSTAL REACHED ✦</div>'+
  '<h1 class="logo small">CANYON<br>CLEARED!'+(newBestFlag?'<span class="badge">NEW BEST</span>':'')+'</h1>'+
  '<div class="stats">'+
  '<div class="srow"><span>TIME</span><b>'+fmtTime(timeMs)+'</b></div>'+
  '<div class="srow"><span>BEST TIME</span><b>'+fmtTime(best.t)+'</b></div>'+
  '<div class="srow"><span>EMBERS</span><b>'+emberCount+' / '+totalE+'</b></div>'+
  '<div class="srow"><span>SLIPS</span><b>'+deaths+'</b></div>'+
  '</div>'+
  '<button class="big" id="bAgain">RUN IT BACK ▸</button>'+
  '<div class="prompt">PRESS ENTER OR R</div></div>';}
function pauseHTML(){return '<div class="card">'+
  '<div class="eyebrow">✦ CATCHING BREATH ✦</div>'+
  '<h1 class="logo small">PAUSED</h1>'+
  '<div class="best" style="margin-top:20px">TIME <b>'+fmtTime(timeMs)+'</b> · EMBERS <b>'+emberCount+'/'+totalE+'</b></div>'+
  '<button class="big" id="bGo">RESUME ▸</button>'+
  '<div class="prompt">P RESUME · R RESTART</div></div>';}
function hudSync(){const t=fmtTime(timeMs);
  if(lastTC!==t){lastTC=t;$('tTime').textContent=t;}
  const e=emberCount+'/'+totalE;if($('eCount').textContent!==e)$('eCount').textContent=e;
  if($('dDeaths').textContent!==''+deaths)$('dDeaths').textContent=deaths;}

/* ============================== INPUT ============================== */
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '||k.indexOf('arrow')===0)e.preventDefault();
  ensureAudio();
  if(k==='m'){toggleMute();return;}
  if(state==='menu'){if(k==='enter'||k===' '||k==='r')startGame();return;}
  if(state==='win'){if((k==='enter'||k==='r')&&AT>winAt+.6)startGame();return;}
  if(state==='pause'){if(k==='p'||k==='escape'||k==='enter')togglePause();else if(k==='r')startGame();return;}
  if(k==='arrowleft'||k==='a')K.l=true;
  if(k==='arrowright'||k==='d')K.r=true;
  if(k===' '||k==='arrowup'||k==='w'){K.jump=true;if(!e.repeat)P.buf=.12;}
  if((k==='shift'||k==='x')&&!e.repeat)tryDash();
  if(k==='p'||k==='escape')togglePause();
  if(k==='r')startGame();
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')K.l=false;
  if(k==='arrowright'||k==='d')K.r=false;
  if(k===' '||k==='arrowup'||k==='w'){K.jump=false;if(state==='play'&&P.vy<0)P.vy*=.45;}});
window.addEventListener('blur',()=>{K.l=K.r=K.jump=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')togglePause();});
ov.addEventListener('click',e=>{ensureAudio();
  if(state==='menu')startGame();
  else if(state==='pause')togglePause();
  else if(state==='win'&&AT>winAt+.6)startGame();});
window.addEventListener('pointerdown',()=>ensureAudio(),{passive:true});
// touch controls
function bindTouch(id,down,up){const el=$(id);if(!el)return;
  el.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();down();});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();up&&up();}));
  el.addEventListener('contextmenu',e=>e.preventDefault());}
bindTouch('tL',()=>K.l=true,()=>K.l=false);
bindTouch('tR',()=>K.r=true,()=>K.r=false);
bindTouch('tJ',()=>{K.jump=true;if(state==='play')P.buf=.12;},()=>K.jump=false);
bindTouch('tD',()=>tryDash(),null);
if(('ontouchstart' in window)||navigator.maxTouchPoints>0)$('touch').classList.add('show');

/* ============================== LOOP ============================== */
buildLevel();totalE=embers.length;
showOv(menuHTML());setState('menu');
let last=performance.now();
function frame(now){requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;AT+=dt;
  if(state!=='pause')updateWorld(dt);
  if(state==='play'){timeMs+=dt*1000;updatePlayer(dt);}
  else if(state==='win'&&P.dead<=0)updatePlayer(dt);
  updateParticles(dt);updateGhosts(dt);camUpdate(dt);
  shake=Math.max(0,shake-dt*26-shake*dt*4);
  if(state==='win'&&!winShown&&AT>winAt+1){winShown=true;showOv(winHTML());}
  hudSync();render();}
requestAnimationFrame(frame);
})();
</script>
