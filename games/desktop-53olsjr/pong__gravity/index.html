<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Pong</title>
<style>
  :root{
    --teal:#4de3c8; --coral:#ff7a59; --gold:#ffd166;
    --ink:#0a1322; --panel:#0c1828; --txt:#eaf4f6; --dim:#8fa9ba;
    --display: Impact, Haettenschweiler, "Franklin Gothic Bold", "Arial Black", sans-serif;
    --mono: "Cascadia Mono","SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:var(--mono);color:var(--txt);-webkit-user-select:none;user-select:none}
  #game{position:fixed;inset:0;display:block;touch-action:none}

  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,9,16,.48);z-index:10;padding:16px}
  .hidden{display:none !important}

  .panel{
    position:relative;width:min(94vw,640px);background:var(--panel);
    padding:30px 36px 26px;box-shadow:0 34px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(130,170,200,.14);
    animation:drop .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes drop{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--gold) 50%,var(--coral))}

  header{display:flex;align-items:center;gap:18px;margin-bottom:12px}
  .gicon{flex:0 0 auto;width:46px;height:46px;border:2px solid rgba(255,209,102,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--gold)}
  .gicon span{display:block;animation:spin 7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,6.5vw,4rem);letter-spacing:.04em;line-height:.95;color:#ecf6f8;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--gold)}
  .ball-o{display:inline-block;width:.74em;height:.74em;border-radius:50%;margin:0 .03em;transform:translateY(-.02em);
    background:radial-gradient(circle at 34% 30%, #fff, var(--gold) 46%, #ff9438 100%);
    animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 10px 2px rgba(255,209,102,.45);transform:translateY(-.02em) scale(1)}50%{box-shadow:0 0 26px 8px rgba(255,209,102,.7);transform:translateY(-.02em) scale(1.12)}}

  .tag{font-size:13px;line-height:1.55;color:var(--dim);max-width:46ch;margin-bottom:20px}
  .best{position:absolute;top:18px;right:22px;font-size:11px;letter-spacing:.14em;color:var(--gold);opacity:.85}

  .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.2em;color:var(--dim);margin-right:4px}

  .btn{
    font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    color:#cfe6ee;background:#0f2138;border:1px solid rgba(150,190,215,.35);padding:12px 18px;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease, border-color .12s ease;
  }
  .btn:hover{transform:translateY(-2px);border-color:var(--gold);color:#fff;box-shadow:0 8px 20px rgba(255,209,102,.16)}
  .btn:active{transform:translateY(0)}
  .btn.sel{background:var(--gold);border-color:var(--gold);color:#1c1305;font-weight:700}
  .chip{padding:8px 14px;font-size:12px}
  .diff.off{opacity:.3;pointer-events:none}
  .big{width:100%;margin-top:6px;padding:16px;font-size:15px;background:var(--gold);border-color:var(--gold);color:#1c1305;font-weight:700;animation:beckon 2.4s ease-in-out infinite}
  @keyframes beckon{0%,100%{box-shadow:0 0 0 rgba(255,209,102,0)}50%{box-shadow:0 0 30px rgba(255,209,102,.45)}}

  .controls{display:flex;flex-wrap:wrap;gap:14px 26px;font-size:12px;color:var(--dim);margin:4px 0 18px}
  .cgroup{display:flex;align-items:center;gap:6px}
  .cgroup b{font-weight:700;margin-right:2px}
  .cgroup.p1 b{color:var(--teal)} .cgroup.p2 b{color:var(--coral)} .cgroup.sys b{color:var(--gold)}
  kbd{display:inline-block;font-family:var(--mono);font-size:11px;color:#eaf4f6;background:#10233d;border:1px solid rgba(165,205,228,.4);border-bottom-width:3px;border-radius:4px;padding:2px 7px}
  .cgroup.dim kbd{opacity:.35}

  h2{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,5vw,3rem);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
  .final{font-family:var(--display);font-size:clamp(2.6rem,7vw,4.2rem);line-height:1;margin:8px 0 14px;letter-spacing:.04em}
  .final .dash{color:var(--dim);margin:0 10px;font-size:.6em;vertical-align:.12em}
  .stats{font-size:12px;color:var(--dim);letter-spacing:.1em;line-height:2;margin-bottom:20px}
  .stats b{color:var(--gold)}
  .newbest{color:var(--gold);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.3}}
  .hint{font-size:11px;color:var(--dim);letter-spacing:.12em;margin-top:14px;line-height:1.9}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay">
  <div class="panel">
    <p class="best" id="bestLine">BEST RALLY ×0</p>
    <header>
      <div class="gicon"><span>↓</span></div>
      <h1>Gravity <em>P<span class="ball-o"></span>NG</em></h1>
    </header>
    <p class="tag">Classic rally physics with a gravity field that never stops rotating. Read the compass, respect the arc — first to 7 takes the arena.</p>
    <div class="row">
      <span class="lbl">MODE</span>
      <button id="btnSolo" class="btn sel">Solo vs CPU</button>
      <button id="btnPvp" class="btn">Two Players</button>
    </div>
    <div class="row diff" id="diffRow">
      <span class="lbl">CPU</span>
      <button class="chip" data-d="0">Rookie</button>
      <button class="chip sel" data-d="1">Pro</button>
      <button class="chip" data-d="2">Master</button>
    </div>
    <div class="controls">
      <div class="cgroup p1"><b>P1</b><kbd>W</kbd><kbd>S</kbd></div>
      <div class="cgroup p2" id="p2grp"><b id="p2name">P2</b><kbd>↑</kbd><kbd>↓</kbd></div>
      <div class="cgroup sys"><b>SYS</b><kbd>P</kbd>pause&nbsp;<kbd>R</kbd>restart&nbsp;<kbd>M</kbd>sound</div>
    </div>
    <button id="btnStart" class="btn big">Launch Match — Enter</button>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="panel" style="width:min(92vw,420px)">
    <h2 style="color:var(--gold)">Paused</h2>
    <p class="stats">The gravity field is holding its breath.</p>
    <div class="btnrow">
      <button id="btnResume" class="btn sel">Resume — P</button>
      <button id="btnRestart" class="btn">Restart — R</button>
      <button id="btnQuit" class="btn">Menu — Esc</button>
    </div>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="panel" style="width:min(92vw,520px)">
    <h2 id="overTitle">You Win</h2>
    <div class="final"><span id="overS0" style="color:var(--teal)">7</span><span class="dash">—</span><span id="overS1" style="color:var(--coral)">4</span></div>
    <p class="stats" id="overStats"></p>
    <div class="btnrow">
      <button id="btnRematch" class="btn sel">Rematch — R</button>
      <button id="btnMenu" class="btn">Menu — Esc</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-t,3);
function lerpAngle(a,b,t){let d=((b-a)%(2*Math.PI)); if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI; return a+d*t;}
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
}

/* ============ canvas / world ============ */
const cv=$('#game'), ctx=cv.getContext('2d');
const W=1280,H=720,WALL_T=30,WALL_B=H-30,GMAG=250;
const TEAL='#4de3c8',CORAL='#ff7a59',GOLD='#ffd166';
let scale=1,ox=0,oy=0,dpr=1;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  scale=Math.min(innerWidth/W, innerHeight/H);
  ox=(innerWidth-W*scale)/2; oy=(innerHeight-H*scale)/2;
}
addEventListener('resize',resize); resize();

/* ============ storage ============ */
let store={muted:false,best:0};
try{const s=localStorage.getItem('gravitypong'); if(s)Object.assign(store,JSON.parse(s));}catch(e){}
function saveStore(){try{localStorage.setItem('gravitypong',JSON.stringify(store));}catch(e){}}

/* ============ audio (web audio, post-gesture) ============ */
let AC=null,master=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=store.muted?0:0.55; master.connect(AC.destination);
  }catch(e){}
}
function tone(f,f2,type,dur,vol,delay){
  if(!AC||store.muted)return; delay=delay||0;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(Math.max(30,f),t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseSfx(dur,vol,f0,f1){
  if(!AC||store.muted)return;
  const t0=AC.currentTime,n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource();src.buffer=buf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.4;
  f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);
  const g=AC.createGain();g.gain.value=vol;
  src.connect(f);f.connect(g);g.connect(master);src.start(t0);
}
const SFX={
  paddle(sp,rally){tone(230+sp*0.28+Math.min(rally,18)*6,0,'square',0.07,0.2);},
  wall(){tone(150,90,'triangle',0.06,0.16);},
  scoreGood(){tone(523,0,'square',0.09,0.2);tone(784,0,'square',0.14,0.2,0.09);},
  scoreBad(){tone(330,0,'square',0.1,0.18);tone(196,0,'square',0.18,0.18,0.1);},
  warn(){tone(880,0,'sawtooth',0.07,0.1);tone(880,0,'sawtooth',0.07,0.1,0.15);},
  shift(){noiseSfx(0.5,0.28,900,120);tone(60,130,'sine',0.4,0.22);},
  ui(){tone(700,950,'square',0.04,0.1);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,0,'square',0.14,0.18,i*0.12));},
  lose(){[392,330,262].forEach((f,i)=>tone(f,0,'triangle',0.2,0.18,i*0.15));}
};

/* ============ game state ============ */
const G={state:'menu',mode:'solo',diff:1,scores:[0,0],target:7,rally:0,topSpeed:0,matchBest:0,
         serveT:0.9,serveDir:1,phase:'serve',time:0,shake:0,pop:[0,0],rallyPop:0,
         winner:-1,flashEdge:null,flashT:0,flashCol:GOLD,toast:null};
const ball={x:W/2,y:H/2,vx:0,vy:0,r:9,pulse:0};
function mkPad(side){return{side,x:side<0?46:W-46-16,w:16,h:120,cy:H/2,vel:0,speed:540,ctrl:'ai',diff:1,targetY:H/2,nextThink:0,flash:0};}
const pads=[mkPad(-1),mkPad(1)];
const grav={a:Math.PI/2,from:Math.PI/2,to:Math.PI/2,dir:4,ease:1,fired:true,timer:rand(6,8),warned:false,gx:0,gy:GMAG};
let trail=[],particles=[],ripples=[],popups=[];
const dust=[]; for(let i=0;i<110;i++)dust.push({x:rand(-80,W+80),y:rand(-80,H+80),s:rand(0.8,2.4),d:rand(0.3,1)});

const DIFFS=[
  {name:'ROOKIE',speed:320,think:0.28,err:46,predict:false},
  {name:'PRO',   speed:450,think:0.14,err:16,predict:true },
  {name:'MASTER',speed:560,think:0.07,err:7, predict:true }
];
const names=()=>G.mode==='solo'?['YOU','CPU']:['P1','P2'];

/* ============ input ============ */
const keys={};
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('keydown',e=>{
  initAudio();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.repeat)return;
  if(e.code==='KeyM'){store.muted=!store.muted; saveStore(); if(master)master.gain.value=store.muted?0:0.55; toast(store.muted?'SOUND OFF':'SOUND ON'); return;}
  if(G.state==='menu'){
    if(e.code==='Enter'||e.code==='Space')startMatch();
    else if(e.code==='Digit1')setMode('solo');
    else if(e.code==='Digit2')setMode('pvp');
    else if(e.code==='ArrowLeft'||e.code==='ArrowRight')setDiff(clamp(G.diff+(e.code==='ArrowRight'?1:-1),0,2));
  }else if(G.state==='play'){
    if(e.code==='KeyP')pauseGame();
    else if(e.code==='Escape')toMenu();
    else if(e.code==='KeyR')startMatch();
  }else if(G.state==='pause'){
    if(e.code==='KeyP'||e.code==='Enter')resumeGame();
    else if(e.code==='KeyR')startMatch();
    else if(e.code==='Escape')toMenu();
  }else if(G.state==='over'){
    if(e.code==='Enter'||e.code==='KeyR')startMatch();
    else if(e.code==='Escape')toMenu();
  }
});
addEventListener('keyup',e=>{keys[e.code]=false;});

/* touch: left half steers P1, right half steers P2 */
const touches={};
cv.addEventListener('pointerdown',e=>{initAudio(); track(e);});
cv.addEventListener('pointermove',e=>{track(e,true);});
addEventListener('pointerup',e=>{delete touches[e.pointerId];});
addEventListener('pointercancel',e=>{delete touches[e.pointerId];});
function track(e,mv){ if(mv&&!touches[e.pointerId])return;
  touches[e.pointerId]={pad:e.clientX<innerWidth/2?0:1, y:(e.clientY-oy)/scale}; }

/* ============ flow ============ */
const show=el=>el.classList.remove('hidden'), hide=el=>el.classList.add('hidden');
function toast(t){G.toast={text:t,t:1.6};}
function setMode(m){ G.mode=m; SFX.ui(); updateMenuUI(); }
function setDiff(d){ G.diff=d; SFX.ui(); updateMenuUI(); }
function updateMenuUI(){
  $('#btnSolo').classList.toggle('sel',G.mode==='solo');
  $('#btnPvp').classList.toggle('sel',G.mode==='pvp');
  $('#diffRow').classList.toggle('off',G.mode!=='solo');
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',+c.dataset.d===G.diff));
  $('#p2name').textContent=G.mode==='solo'?'CPU':'P2';
  $('#p2grp').classList.toggle('dim',G.mode==='solo');
  $('#bestLine').textContent='BEST RALLY ×'+store.best;
}
function resetMatch(){
  G.scores=[0,0]; G.rally=0; G.topSpeed=0; G.matchBest=0; G.pop=[0,0];
  pads.forEach(p=>{p.cy=H/2;p.vel=0;p.flash=0;p.targetY=H/2;});
  trail=[]; popups=[]; G.phase='serve'; G.serveT=1.0; G.serveDir=Math.random()<0.5?-1:1;
}
function startMatch(){
  SFX.ui();
  pads[0].ctrl='p1';
  if(G.mode==='solo'){pads[1].ctrl='ai'; pads[1].diff=G.diff;} else pads[1].ctrl='p2';
  resetMatch(); G.state='play';
  hide($('#menu')); hide($('#pause')); hide($('#over'));
}
function pauseGame(){G.state='pause'; show($('#pause')); SFX.ui();}
function resumeGame(){G.state='play'; hide($('#pause')); SFX.ui();}
function toMenu(){
  G.state='menu'; pads[0].ctrl='ai';pads[1].ctrl='ai';pads[0].diff=1;pads[1].diff=1;
  resetMatch(); updateMenuUI();
  show($('#menu')); hide($('#pause')); hide($('#over')); SFX.ui();
}
function endGame(i){
  G.state='over'; G.winner=i;
  if(G.mode==='solo') (i===0?SFX.win():SFX.lose()); else SFX.win();
  const beat=G.matchBest>store.best;
  if(beat){store.best=G.matchBest; saveStore();}
  setTimeout(()=>{
    if(G.state!=='over')return;
    const n=names(), youWin=G.mode==='solo'?(i===0):(true);
    $('#overTitle').textContent=(G.mode==='solo'?(youWin?'You Win':'CPU Wins'):n[i]+' Wins');
    $('#overTitle').style.color=(i===0?TEAL:CORAL);
    $('#overS0').textContent=G.scores[0]; $('#overS1').textContent=G.scores[1];
    $('#overStats').innerHTML='LONGEST RALLY <b>×'+G.matchBest+'</b> &nbsp;·&nbsp; TOP BALL SPEED <b>'+Math.round(G.topSpeed)+'</b>'
      +(beat?'<br><span class="newbest">◆ NEW BEST RALLY ◆</span>':'');
    show($('#over'));
  },700);
}

/* ============ physics ============ */
function predictY(side){
  const p=pads[side>0?1:0], plane=side>0?p.x:p.x+p.w;
  let x=ball.x,y=ball.y,vx=ball.vx,vy=ball.vy,t=0; const sdt=1/120;
  const gx=Math.cos(grav.a)*GMAG, gy=Math.sin(grav.a)*GMAG;
  while(t<3){
    x+=vx*sdt; y+=vy*sdt; vx+=gx*sdt; vy+=gy*sdt; t+=sdt;
    if(y-ball.r<WALL_T&&vy<0){y=WALL_T+ball.r;vy=-vy;}
    if(y+ball.r>WALL_B&&vy>0){y=WALL_B-ball.r;vy=-vy;}
    if(side>0){if(vx>0&&x>=plane)return y;} else {if(vx<0&&x<=plane)return y;}
  }
  return H/2;
}
function stepPad(p,dt){
  let v=0;
  if(p.ctrl==='ai'){
    const d=DIFFS[p.diff];
    const toward=p.side>0?ball.vx>0:ball.vx<0;
    if(G.phase==='rally'&&(toward||Math.abs(ball.x-W/2)<W*0.4)){
      if(G.time>=p.nextThink){
        p.targetY=(d.predict?predictY(p.side):ball.y)+rand(-d.err,d.err);
        p.nextThink=G.time+d.think;
      }
    } else p.targetY=H/2+Math.sin(G.time*1.4+p.side)*70;
    const maxV=d.speed*dt, dy=p.targetY-p.cy;
    v=clamp(dy,-maxV,maxV)/dt;
  } else {
    const idx=p.ctrl==='p1'?0:1;
    const tch=Object.values(touches).find(t=>t.pad===idx&&G.state==='play');
    if(tch){ const maxV=p.speed*dt, dy=tch.y-p.h/2-p.cy; v=clamp(dy,-maxV,maxV)/dt; }
    else{
      let nv=0;
      if(p.ctrl==='p1'){if(keys.KeyW)nv-=1;if(keys.KeyS)nv+=1;}
      else{if(keys.ArrowUp)nv-=1;if(keys.ArrowDown)nv+=1;}
      v=nv*p.speed;
    }
  }
  p.vel=v;
  p.cy=clamp(p.cy+v*dt, WALL_T+4, WALL_B-p.h-4);
}
function collidePaddle(p){
  const face=p.side<0?p.x+p.w:p.x;
  if(p.side<0&&ball.vx<0&&ball.x-ball.r<=face&&ball.x-ball.r>p.x-26&&Math.abs(ball.y-p.cy)<p.h/2+ball.r){
    hit(p,1); ball.x=face+ball.r;
  } else if(p.side>0&&ball.vx>0&&ball.x+ball.r>=face&&ball.x+ball.r<p.x+p.w+26&&Math.abs(ball.y-p.cy)<p.h/2+ball.r){
    hit(p,-1); ball.x=face-ball.r;
  }
}
function hit(p,dir){
  const off=clamp((ball.y-p.cy)/(p.h/2),-1,1);
  const ang=off*(Math.PI/3);
  let sp=Math.min(980, Math.hypot(ball.vx,ball.vy)*1.045+Math.abs(p.vel)*0.15);
  sp=Math.max(sp,370);
  ball.vx=Math.cos(ang)*sp*dir; ball.vy=Math.sin(ang)*sp;
  G.rally++; G.rallyPop=1; p.flash=1; ball.pulse=1; G.shake=Math.min(10,G.shake+2.5);
  burst(ball.x,ball.y,12,p.side<0?TEAL:CORAL,260,0.5);
  SFX.paddle(sp,G.rally);
}
function scorePoint(scorer){
  const exitRight=ball.x>W/2;
  G.flashEdge=exitRight?'right':'left'; G.flashT=1; G.flashCol=scorer===0?TEAL:CORAL;
  burst(exitRight?W-10:10,clamp(ball.y,WALL_T+20,WALL_B-20),44,G.flashCol,420,0.9);
  ripples.push({x:exitRight?W-10:10,y:clamp(ball.y,WALL_T,WALL_B),t:0,col:G.flashCol});
  G.shake=13;
  if(G.state==='menu'){ resetMatch(); return; }
  G.scores[scorer]++; G.pop[scorer]=1;
  popups.push({x:exitRight?W-140:140,y:clamp(ball.y,120,H-120),text:names()[scorer]+' SCORES',col:G.flashCol,t:0});
  G.matchBest=Math.max(G.matchBest,G.rally);
  if(scorer===0)SFX.scoreGood(); else SFX.scoreBad();
  if(G.scores[scorer]>=G.target){ endGame(scorer); return; }
  G.phase='serve'; G.serveT=1.1; G.serveDir=scorer===0?1:-1; trail=[];
}
function launch(){
  const a=rand(-0.5,0.5),sp=390;
  ball.vx=Math.cos(a)*sp*G.serveDir; ball.vy=Math.sin(a)*sp;
}
function gravUpdate(dt){
  grav.timer-=dt;
  if(grav.timer<1.5&&!grav.warned){grav.warned=true; SFX.warn();}
  if(grav.timer<=0){
    let n; do{n=(Math.random()*8)|0;}while(n===grav.dir);
    grav.from=grav.a; grav.to=n*Math.PI/4; grav.dir=n; grav.ease=0; grav.fired=false;
    grav.timer=rand(8,12); grav.warned=false;
  }
  if(grav.ease<1){
    grav.ease=Math.min(1,grav.ease+dt/0.9);
    grav.a=lerpAngle(grav.from,grav.to,easeOut(grav.ease));
    if(grav.ease===1&&!grav.fired){
      grav.fired=true;
      ripples.push({x:W/2,y:84,t:0,col:GOLD});
      SFX.shift();
    }
  }
  grav.gx=Math.cos(grav.a)*GMAG; grav.gy=Math.sin(grav.a)*GMAG;
}
function physics(dt){
  G.time+=dt;
  gravUpdate(dt);
  stepPad(pads[0],dt); stepPad(pads[1],dt);
  if(G.phase==='serve'){
    ball.x=W/2; ball.y=H/2; ball.vx=0; ball.vy=0;
    G.serveT-=dt;
    if(G.serveT<=0){launch(); G.phase='rally';}
    return;
  }
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  ball.vx+=grav.gx*dt; ball.vy+=grav.gy*dt;
  let sp=Math.hypot(ball.vx,ball.vy);
  if(sp>980){ball.vx*=980/sp; ball.vy*=980/sp; sp=980;}
  if(G.state==='play'&&sp>G.topSpeed)G.topSpeed=sp;
  if(ball.y-ball.r<WALL_T&&ball.vy<0){ball.y=WALL_T+ball.r;ball.vy=-ball.vy;SFX.wall();burst(ball.x,WALL_T,5,'#bcd6ff',140,0.3);}
  if(ball.y+ball.r>WALL_B&&ball.vy>0){ball.y=WALL_B-ball.r;ball.vy=-ball.vy;SFX.wall();burst(ball.x,WALL_B,5,'#bcd6ff',140,0.3);}
  collidePaddle(pads[0]); collidePaddle(pads[1]);
  if(ball.x<-40)scorePoint(1);
  else if(ball.x>W+40)scorePoint(0);
}

/* ============ fx ============ */
function burst(x,y,n,col,spd,life){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=rand(spd*0.3,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rand(life*0.6,life),size:rand(1.5,4),col});
  }
  if(particles.length>320)particles.splice(0,particles.length-320);
}
function updateFX(dt){
  G.shake*=Math.pow(0.0008,dt); if(G.shake<0.1)G.shake=0;
  ball.pulse=Math.max(0,ball.pulse-dt*4);
  pads.forEach(p=>{p.flash=Math.max(0,p.flash-dt*3);});
  G.pop[0]=Math.max(0,G.pop[0]-dt*2.4); G.pop[1]=Math.max(0,G.pop[1]-dt*2.4);
  G.rallyPop=Math.max(0,G.rallyPop-dt*3);
  G.flashT=Math.max(0,G.flashT-dt*1.6);
  if(G.toast){G.toast.t-=dt; if(G.toast.t<=0)G.toast=null;}
  for(const d of dust){
    const v=8+d.d*26;
    d.x+=grav.gx/GMAG*v*dt + Math.sin(d.y*0.013+G.time)*4*dt;
    d.y+=grav.gy/GMAG*v*dt + Math.cos(d.x*0.011+G.time)*4*dt;
    if(d.x<-90)d.x=W+85; if(d.x>W+90)d.x=-85; if(d.y<-90)d.y=H+85; if(d.y>H+90)d.y=-85;
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;
    if(p.t>p.life){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(0.15,dt);p.vy*=Math.pow(0.15,dt);}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=dt;if(r.t>0.8)ripples.splice(i,1);}
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.t+=dt;p.y-=42*dt;if(p.t>1.1)popups.splice(i,1);}
}

/* ============ render ============ */
function render(now){
  const rt=now/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0a1322'; ctx.fillRect(0,0,innerWidth,innerHeight);
  let g1=ctx.createRadialGradient(innerWidth*0.12,innerHeight*0.95,0,innerWidth*0.12,innerHeight*0.95,innerWidth*0.7);
  g1.addColorStop(0,'rgba(45,212,191,0.08)');g1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g1;ctx.fillRect(0,0,innerWidth,innerHeight);
  let g2=ctx.createRadialGradient(innerWidth*0.9,innerHeight*0.08,0,innerWidth*0.9,innerHeight*0.08,innerWidth*0.6);
  g2.addColorStop(0,'rgba(255,122,89,0.07)');g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g2;ctx.fillRect(0,0,innerWidth,innerHeight);

  const shx=(Math.random()*2-1)*G.shake, shy=(Math.random()*2-1)*G.shake;
  ctx.save();
  ctx.translate(ox+shx*scale,oy+shy*scale); ctx.scale(scale,scale);

  // dust (drifts with gravity)
  for(const d of dust){ctx.globalAlpha=0.05+d.d*0.2;ctx.fillStyle='#bcd6ff';ctx.fillRect(d.x,d.y,d.s,d.s);}
  ctx.globalAlpha=1;

  // court grid
  ctx.strokeStyle='rgba(180,215,240,0.03)';ctx.lineWidth=1;
  for(let x=96;x<W;x+=96){ctx.beginPath();ctx.moveTo(x,WALL_T);ctx.lineTo(x,WALL_B);ctx.stroke();}
  for(let y=WALL_T+72;y<WALL_B;y+=72){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // walls
  ctx.lineWidth=3;
  const wg=ctx.createLinearGradient(0,0,W,0);
  wg.addColorStop(0,'rgba(77,227,200,0.55)');wg.addColorStop(0.5,'rgba(160,200,230,0.25)');wg.addColorStop(1,'rgba(255,122,89,0.55)');
  ctx.strokeStyle=wg;
  ctx.beginPath();ctx.moveTo(0,WALL_T);ctx.lineTo(W,WALL_T);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,WALL_B);ctx.lineTo(W,WALL_B);ctx.stroke();

  // goal brackets + flash bands
  for(const s of [-1,1]){
    const x=s<0?6:W-6;
    ctx.strokeStyle=s<0?'rgba(77,227,200,0.5)':'rgba(255,122,89,0.5)';
    ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,H/2-70);ctx.lineTo(x,H/2+70);ctx.stroke();
  }
  if(G.flashT>0){
    const fx=G.flashEdge==='right'?W:0;
    const fg=ctx.createLinearGradient(fx,0,fx+(G.flashEdge==='right'?-140:140),0);
    fg.addColorStop(0,G.flashCol);fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=G.flashT*0.5;ctx.fillStyle=fg;
    ctx.fillRect(G.flashEdge==='right'?W-140:0,WALL_T,140,WALL_B-WALL_T);ctx.globalAlpha=1;
  }

  // net
  ctx.setLineDash([12,16]);ctx.lineDashOffset=-rt*40;
  ctx.strokeStyle='rgba(220,235,255,0.22)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W/2,WALL_T+8);ctx.lineTo(W/2,WALL_B-8);ctx.stroke();
  ctx.setLineDash([]);

  // ripples
  for(const r of ripples){
    const p=r.t/0.8;
    ctx.globalAlpha=(1-p)*0.4;ctx.strokeStyle=r.col;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(r.x,r.y,20+p*260,0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;

  // gravity compass
  drawCompass(rt);

  // ball trail + ball
  if(G.phase==='rally'||G.state==='menu'){trail.push({x:ball.x,y:ball.y});if(trail.length>15)trail.shift();}
  const sp=Math.hypot(ball.vx,ball.vy), heat=clamp((sp-350)/650,0,1);
  for(let i=0;i<trail.length;i++){
    const t=i/trail.length, tr=trail[i];
    ctx.globalAlpha=t*0.32;
    ctx.fillStyle='rgb(255,'+Math.round(lerp(214,120,heat))+','+Math.round(lerp(120,70,heat))+')';
    ctx.beginPath();ctx.arc(tr.x,tr.y,ball.r*(0.3+0.7*t),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(ball.x,ball.y);const bs=1+ball.pulse*0.6;ctx.scale(bs,bs);
  ctx.shadowColor='rgba(255,190,90,0.9)';ctx.shadowBlur=18;
  ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath();ctx.arc(-2.4,-2.6,ball.r*0.42,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // paddles
  for(const p of pads){
    const col=p.side<0?TEAL:CORAL;
    ctx.save();
    ctx.shadowColor=col;ctx.shadowBlur=14+p.flash*22;
    ctx.fillStyle=col;
    ctx.beginPath();ctx.roundRect(p.x,p.cy-p.h/2,p.w,p.h,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,'+(0.3+p.flash*0.6)+')';
    ctx.beginPath();ctx.roundRect(p.x+5,p.cy-p.h/2+10,4,p.h-20,2);ctx.fill();
    ctx.restore();
  }

  // particles
  for(const p of particles){
    const a=1-p.t/p.life;
    ctx.globalAlpha=a;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*a+0.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // popups
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,(1.1-p.t)*2);
    ctx.font='34px Impact,"Arial Black",sans-serif';ctx.textAlign='center';
    ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;

  // HUD
  if(G.state!=='menu'){
    const n=names();
    for(let i=0;i<2;i++){
      const x=i===0?W*0.29:W*0.71, col=i===0?TEAL:CORAL;
      ctx.save();ctx.translate(x,104);const s=1+G.pop[i]*0.35;ctx.scale(s,s);
      ctx.font='96px Impact,"Arial Black",sans-serif';ctx.textAlign='center';
      ctx.shadowColor=col;ctx.shadowBlur=20;ctx.fillStyle=col;
      ctx.fillText(G.scores[i],0,0);ctx.restore();
      ctx.font='13px "Cascadia Mono",Consolas,monospace';ctx.textAlign='center';
      ctx.fillStyle='rgba(200,225,240,0.6)';ctx.fillText(n[i],x,44);
    }
    if(G.phase==='rally'&&G.rally>=3){
      const s=1+G.rallyPop*0.3;
      ctx.save();ctx.translate(W/2,H-52);ctx.scale(s,s);
      ctx.font='18px "Cascadia Mono",Consolas,monospace';ctx.textAlign='center';
      ctx.fillStyle=GOLD;ctx.fillText('RALLY ×'+G.rally,0,0);ctx.restore();
    }
  }
  // serve UI
  if(G.phase==='serve'&&G.state==='play'){
    const pr=1-G.serveT/1.1;
    ctx.strokeStyle=GOLD;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(ball.x,ball.y,26,-Math.PI/2,-Math.PI/2+pr*Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.5+0.5*Math.sin(rt*8);
    ctx.font='14px "Cascadia Mono",Consolas,monospace';ctx.textAlign='center';
    ctx.fillStyle=GOLD;ctx.fillText('GET READY',ball.x,ball.y+64);
    ctx.globalAlpha=1;
  }
  // gravity shift warning banner
  if(grav.warned&&G.state!=='pause'){
    ctx.globalAlpha=0.35+0.55*Math.abs(Math.sin(rt*9));
    ctx.font='42px Impact,"Arial Black",sans-serif';ctx.textAlign='center';
    ctx.fillStyle=GOLD;ctx.fillText('GRAVITY SHIFT',W/2,H*0.30);
    ctx.font='12px "Cascadia Mono",Consolas,monospace';
    ctx.fillText('— FIELD ROTATING —',W/2,H*0.30+24);
    ctx.globalAlpha=1;
  }
  // toast
  if(G.toast){
    ctx.globalAlpha=Math.min(1,G.toast.t);
    ctx.font='15px "Cascadia Mono",Consolas,monospace';ctx.textAlign='center';
    ctx.fillStyle=GOLD;ctx.fillText(G.toast.text,W/2,H-34);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // vignette
  const vg=ctx.createRadialGradient(innerWidth/2,innerHeight/2,Math.min(innerWidth,innerHeight)*0.35,innerWidth/2,innerHeight/2,Math.max(innerWidth,innerHeight)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(4,8,14,0.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,innerWidth,innerHeight);
}
function drawCompass(rt){
  const cx=W/2,cy=84;
  ctx.save();
  ctx.fillStyle='rgba(7,12,22,0.75)';
  ctx.beginPath();ctx.arc(cx,cy,34,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,209,102,'+(grav.warned?0.4+0.5*Math.abs(Math.sin(rt*10)):0.35)+')';
  ctx.lineWidth=2;ctx.stroke();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, on=i===grav.dir;
    ctx.strokeStyle=on?GOLD:'rgba(200,225,240,0.3)';ctx.lineWidth=on?3:1.5;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*26,cy+Math.sin(a)*26);
    ctx.lineTo(cx+Math.cos(a)*(on?31:30),cy+Math.sin(a)*(on?31:30));
    ctx.stroke();
  }
  let ang=grav.a;
  if(grav.warned)ang+=Math.sin(rt*16)*0.15;
  const ax=Math.cos(ang),ay=Math.sin(ang);
  ctx.strokeStyle=GOLD;ctx.fillStyle=GOLD;
  ctx.shadowColor='rgba(255,209,102,0.8)';ctx.shadowBlur=8;
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx-ax*14,cy-ay*14);ctx.lineTo(cx+ax*16,cy+ay*16);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx+ax*24,cy+ay*24);
  ctx.lineTo(cx+ax*12-ay*7,cy+ay*12+ax*7);
  ctx.lineTo(cx+ax*12+ay*7,cy+ay*12-ax*7);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  if(grav.warned){
    ctx.setLineDash([5,7]);ctx.lineDashOffset=-rt*40;
    ctx.strokeStyle='rgba(255,209,102,'+(0.3+0.4*Math.abs(Math.sin(rt*10)))+')';
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,42,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.font='9px "Cascadia Mono",Consolas,monospace';ctx.textAlign='center';
  ctx.fillStyle='rgba(255,209,102,0.5)';ctx.fillText('GRAVITY',cx,cy+52);
  ctx.restore();
}

/* ============ main loop ============ */
let last=performance.now(),acc=0;const STEP=1/240;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.1);
  if(G.state==='play'||G.state==='menu'){
    acc+=dt;
    while(acc>=STEP){physics(STEP);acc-=STEP;}
  } else acc=0;
  if(G.state!=='pause')updateFX(dt);
  render(now);
}
resetMatch(); updateMenuUI();
requestAnimationFrame(frame);

/* ============ UI wiring ============ */
$('#btnSolo').onclick=()=>setMode('solo');
$('#btnPvp').onclick=()=>setMode('pvp');
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>setDiff(+c.dataset.d));
$('#btnStart').onclick=()=>startMatch();
$('#btnResume').onclick=()=>resumeGame();
$('#btnRestart').onclick=()=>startMatch();
$('#btnQuit').onclick=()=>toMenu();
$('#btnRematch').onclick=()=>startMatch();
$('#btnMenu').onclick=()=>toMenu();
</script>
