<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Ghost — Stealth Gravity Game</title>
<style>
  :root{
    --ink:#0a141c; --panel:#0e2030; --line:#2b4f66; --line2:#1d3a4d;
    --ice:#dff3ff; --teal:#5fe8d8; --amber:#ffb347; --red:#ff5a3c;
    --gold:#ffd23f; --magenta:#ff3d81; --pod:#4be3a0; --slate:#9fc3d4;
    --display:"Bahnschrift","Archivo Narrow","Arial Narrow","Franklin Gothic Medium",Impact,sans-serif;
    --body:"Segoe UI","Avenir Next","Trebuchet MS",Verdana,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:var(--body)}
  body{background:
    radial-gradient(1200px 700px at 50% 40%, #0d1e2a 0%, #081019 70%),
    radial-gradient(circle at 20% 80%, rgba(95,232,216,.04), transparent 40%);}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative;line-height:0}
  canvas{display:block;background:#0a1620;box-shadow:0 30px 90px rgba(0,0,0,.65)}
  .corner{position:absolute;width:22px;height:22px;border:2px solid rgba(255,179,71,.55);pointer-events:none;z-index:3}
  .c-tl{top:-6px;left:-6px;border-right:0;border-bottom:0}
  .c-tr{top:-6px;right:-6px;border-left:0;border-bottom:0}
  .c-bl{bottom:-6px;left:-6px;border-right:0;border-top:0}
  .c-br{bottom:-6px;right:-6px;border-left:0;border-top:0}
  #scan{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(210,240,255,.018) 0 1px,transparent 1px 3px)}
  #stage.playing canvas{cursor:none}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:4;font-family:var(--display);color:var(--slate)}
  #hud.hidden,#overlay.hidden{display:none!important}
  .hud-l{position:absolute;top:12px;left:18px}
  .sec{font-size:11px;letter-spacing:.35em;color:var(--amber)}
  .pname{font-size:16px;letter-spacing:.18em;color:var(--ice);margin-top:2px;font-weight:700}
  .pips{margin-top:9px;display:flex;gap:7px}
  .pip{width:9px;height:9px;transform:rotate(45deg);background:#28455a;border:1px solid #4d7690;transition:all .2s}
  .pip.got{background:var(--gold);border-color:#ffe28a;box-shadow:0 0 10px rgba(255,210,63,.9)}
  .hud-r{position:absolute;top:12px;right:18px;text-align:right;font-size:11px;letter-spacing:.2em}
  .hud-r b{display:block;font-size:20px;color:var(--ice);letter-spacing:.12em;margin-top:2px}
  #btn-mute{pointer-events:auto;margin-top:8px;font-family:var(--display);font-size:10px;letter-spacing:.25em;
    color:var(--teal);background:rgba(14,39,51,.8);border:1px solid var(--line);padding:5px 12px;cursor:pointer;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  #btn-mute:hover{background:#14384a}
  .hud-b{position:absolute;right:18px;bottom:14px;font-size:10px;letter-spacing:.22em;color:#5f8aa0}
  #charge-wrap{position:absolute;left:18px;bottom:16px;width:220px}
  #charge-wrap label{font-size:10px;letter-spacing:.3em;color:#7fa9bd}
  .bar{margin-top:5px;height:8px;background:#0c2431;border:1px solid var(--line)}
  #charge-fill{height:100%;width:100%;background:linear-gradient(90deg,#3fd9c6,#a5f2ff);transition:width .07s linear}
  #charge-fill.low{background:linear-gradient(90deg,#ff5a3c,#ffb347)}
  #det-banner{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;
    font-family:var(--display);font-size:12px;letter-spacing:.32em;color:#ff8d70;
    background:rgba(46,9,4,.78);border:1px solid #ff5a3c;padding:7px 20px 7px 24px;opacity:0;transition:opacity .12s}
  #det-banner.on{opacity:1;animation:blink .45s steps(2) infinite}
  @keyframes blink{50%{background:rgba(96,18,7,.9);color:#ffd9cd}}

  /* ---------- Overlays ---------- */
  #overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;padding:4vmin}
  #scr-title{justify-content:flex-start}
  #scr-caught,#scr-clear{justify-content:flex-end}
  #scr-win{justify-content:center}
  .panel{width:100%;max-width:560px;background:linear-gradient(158deg,rgba(17,34,46,.96),rgba(9,19,27,.97));
    border:1px solid var(--line);padding:28px 32px 26px;box-shadow:0 28px 80px rgba(0,0,0,.6);
    clip-path:polygon(24px 0,100% 0,100% calc(100% - 24px),calc(100% - 24px) 100%,0 100%,0 24px)}
  .tick{width:38px;height:4px;background:var(--amber);margin-bottom:14px}
  .kicker{font-family:var(--display);font-size:11px;letter-spacing:.4em;color:var(--amber);margin-bottom:8px}
  h1{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.92;
    font-size:clamp(46px,7vw,82px);color:var(--ice);letter-spacing:.02em;margin-bottom:12px}
  h1 .ghost{color:var(--teal)}
  @supports(-webkit-text-stroke:2px red){h1 .ghost{color:transparent;-webkit-text-stroke:2px var(--teal)}}
  h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,5vw,54px);
    letter-spacing:.04em;line-height:1;margin-bottom:10px}
  #scr-caught h2{color:var(--red)} #scr-clear h2{color:var(--teal)} #scr-win h2{color:var(--gold)}
  .sub{font-size:13.5px;color:var(--slate);line-height:1.55;margin-bottom:18px;max-width:46ch}
  .btnrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:20px}
  .btn{font-family:var(--display);text-transform:uppercase;font-size:15px;letter-spacing:.16em;font-weight:700;
    padding:13px 24px;border:0;cursor:pointer;background:var(--amber);color:#221302;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    transition:transform .12s,box-shadow .12s,background .12s}
  .btn:hover{transform:translateY(-2px);background:#ffc670;box-shadow:0 10px 28px rgba(255,179,71,.35)}
  .btn:active{transform:translateY(0)}
  .btn.ghostb{background:transparent;color:#9fd8e8;box-shadow:inset 0 0 0 1px #3a6b82}
  .btn.ghostb:hover{background:rgba(95,232,216,.08);box-shadow:inset 0 0 0 1px var(--teal)}
  .hint{font-family:var(--display);font-size:10px;letter-spacing:.25em;color:#5f8aa0;margin-left:4px}

  .ctrls{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:center;margin:18px 0 20px}
  kbd{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:#d7f4ff;background:#12303f;
    border:1px solid #2c5570;border-bottom-width:3px;padding:4px 9px;white-space:nowrap}
  .cdesc{font-size:12.5px;color:var(--slate);line-height:1.4}
  .cdesc b{color:var(--ice);font-weight:600}

  .legend{display:flex;flex-wrap:wrap;gap:9px 20px;border-top:1px dashed #2a4b62;padding-top:16px;margin-bottom:6px}
  .li{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--slate)}
  .glyph{width:13px;height:13px;flex:none}
  .g-shard{background:var(--gold);transform:rotate(45deg) scale(.82);box-shadow:0 0 7px rgba(255,210,63,.7)}
  .g-exit{border:2px solid var(--teal);border-radius:50%}
  .g-sent{background:var(--amber);clip-path:polygon(50% 0,100% 100%,0 100%)}
  .g-scan{background:var(--gold);clip-path:polygon(0 50%,100% 0,100% 100%)}
  .g-pod{border:2px dashed var(--pod);border-radius:50%}
  .g-anchor{background:radial-gradient(circle,var(--magenta) 32%,transparent 36%),radial-gradient(circle,transparent 48%,rgba(255,61,129,.5) 50% 62%,transparent 64%)}

  .stats{margin-top:8px}
  .srow{display:flex;gap:14px;align-items:baseline;padding:9px 2px;border-bottom:1px dashed #24455c;font-size:13px;color:var(--slate)}
  .srow:last-child{border-bottom:0}
  .srow span:first-child{flex:1}
  .srow b{font-family:var(--display);font-size:16px;letter-spacing:.08em;color:var(--ice)}
  .srow .ok{color:var(--pod);font-family:var(--display);font-size:11px;letter-spacing:.2em}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
  .total .lbl{font-family:var(--display);font-size:12px;letter-spacing:.35em;color:var(--slate)}
  .total b{font-family:var(--display);font-size:40px;color:var(--gold);letter-spacing:.06em}
  .badge{display:inline-block;font-family:var(--display);font-size:10px;letter-spacing:.3em;color:#221302;
    background:var(--gold);padding:4px 10px;margin-left:10px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
  .bestline{margin-top:14px;font-family:var(--display);font-size:11px;letter-spacing:.25em;color:#7fa9bd}
  @media (max-width:720px){
    #scr-title,#scr-caught,#scr-clear{justify-content:center}
    .panel{padding:22px 20px}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <span class="corner c-tl"></span><span class="corner c-tr"></span>
    <span class="corner c-bl"></span><span class="corner c-br"></span>
    <canvas id="cv" width="960" height="600"></canvas>
    <div id="scan"></div>

    <div id="hud" class="hidden">
      <div class="hud-l">
        <div class="sec" id="hud-sec">SECTOR 01</div>
        <div class="pname" id="hud-name">INTAKE HALL</div>
        <div class="pips" id="hud-pips"></div>
      </div>
      <div class="hud-r">
        RUN SCORE<b id="hud-score">0000</b>
        <button id="btn-mute">SOUND ON</button>
      </div>
      <div id="charge-wrap"><label>DRIFT CHARGE</label><div class="bar"><div id="charge-fill"></div></div></div>
      <div class="hud-b">LMB / SPACE — FIELD &nbsp;·&nbsp; WASD — DRIFT &nbsp;·&nbsp; R — RESET &nbsp;·&nbsp; M — SOUND</div>
    </div>
    <div id="det-banner">DETECTED — BREAK LINE OF SIGHT</div>

    <div id="overlay" class="hidden"></div>
  </div>
</div>

<script>
'use strict';
/* ============================== CORE SETUP ============================== */
const W=960,H=600,PR=10,CATCH_TIME=1.15,RIPPLE_EVERY=0.3,HEAR=270,RIP_SPEED=340;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage'),hud=document.getElementById('hud'),
      overlay=document.getElementById('overlay'),detBanner=document.getElementById('det-banner'),
      chargeFill=document.getElementById('charge-fill'),btnMute=document.getElementById('btn-mute');
let S=1; // css scale
function fit(){
  const dpr=window.devicePixelRatio||1;
  S=Math.min((innerWidth-56)/W,(innerHeight-56)/H); if(S<0.4)S=0.4;
  cv.style.width=(W*S)+'px'; cv.style.height=(H*S)+'px';
  cv.width=Math.round(W*S*dpr); cv.height=Math.round(H*S*dpr);
  ctx.setTransform(S*dpr,0,0,S*dpr,0,0);
}
addEventListener('resize',fit); fit();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
function lerpAngle(a,b,t){let d=(b-a+Math.PI*3)%(Math.PI*2)-Math.PI;return a+d*t;}

/* ============================== AUDIO ============================== */
let AC=null,master,humGain,sirenGain,muted=false;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.5; master.connect(AC.destination);
    const ho=AC.createOscillator(); ho.type='sawtooth'; ho.frequency.value=46;
    const hf=AC.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=230;
    humGain=AC.createGain(); humGain.gain.value=0;
    ho.connect(hf); hf.connect(humGain); humGain.connect(master); ho.start();
    const so=AC.createOscillator(); so.type='square'; so.frequency.value=560;
    const lf=AC.createOscillator(); lf.type='sine'; lf.frequency.value=7;
    const sd=AC.createGain(); sd.gain.value=170;
    lf.connect(sd); sd.connect(so.frequency);
    sirenGain=AC.createGain(); sirenGain.gain.value=0;
    so.connect(sirenGain); sirenGain.connect(master); so.start(); lf.start();
  }catch(e){ AC=null; }
}
function blip(f,dur,type,vol,slideTo){
  if(!AC||muted)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
    g.gain.setValueAtTime(vol||0.12,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function chord(freqs,step,vol){ freqs.forEach((f,i)=>setTimeout(()=>blip(f,0.28,'triangle',vol||0.14),i*(step||90))); }
function toggleMute(){ muted=!muted; if(master)master.gain.value=muted?0:0.5; btnMute.textContent=muted?'SOUND OFF':'SOUND ON'; }
btnMute.addEventListener('click',()=>{initAudio();toggleMute();});

/* ============================== LEVEL DATA ============================== */
function B(t){return [{x:0,y:0,w:W,h:t},{x:0,y:H-t,w:W,h:t},{x:0,y:0,w:t,h:H},{x:W-t,y:0,w:t,h:H}];}
const DEFS=[
 { name:'INTAKE HALL', start:[104,300], exit:[876,300],
   walls:[[226,236,16,138],[724,110,16,120]],
   shards:[[400,150],[560,470],[810,170]],
   guards:[{pts:[[340,300],[600,300]],speed:70,range:250,fov:1.0}],
   turrets:[], pods:[[470,480,64]], anchors:[] },
 { name:'SCANNER BAY', start:[100,500], exit:[880,100],
   walls:[[280,0,16,340],[280,340,300,16],[640,160,16,300]],
   shards:[[150,120],[470,210],[760,330]],
   guards:[{pts:[[340,150],[600,150]],speed:75,range:245,fov:1.0},
           {pts:[[880,300],[880,520]],speed:70,range:240,fov:1.0}],
   turrets:[{x:480,y:80,base:Math.PI/2,amp:0.9,speed:0.8,range:300,fov:0.9},
            {x:760,y:520,base:-Math.PI/4,amp:0.7,speed:1.0,range:280,fov:0.8}],
   pods:[[70,300,58],[800,90,48]], anchors:[[480,470,120]] },
 { name:'CORE VESTIBULE', start:[90,90], exit:[870,520],
   walls:[[210,140,70,70],[680,140,70,70],[210,390,70,70],[680,390,70,70],[430,250,100,100]],
   shards:[[330,300],[630,300],[480,170],[480,430]],
   guards:[{pts:[[300,90],[660,90]],speed:80,range:250,fov:1.0},
           {pts:[[110,240],[110,470]],speed:75,range:240,fov:1.0},
           {pts:[[330,520],[630,520]],speed:85,range:250,fov:1.0}],
   turrets:[{x:480,y:40,base:Math.PI/2,amp:0.8,speed:0.9,range:260,fov:0.85},
            {x:480,y:560,base:-Math.PI/2,amp:0.7,speed:1.1,range:250,fov:0.75}],
   pods:[[60,520,52],[885,400,50]], anchors:[[150,300,90],[810,300,90]] }
];
function pointInWalls(x,y,w){for(const r of w)if(x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h)return true;return false;}
function buildLevel(i){
  const d=DEFS[i], walls=B(18).concat(d.walls.map(r=>({x:r[0],y:r[1],w:r[2],h:r[3]})));
  const L={idx:i,name:d.name,walls,
    guards:d.guards.map((g,gi)=>({id:gi,x:g.pts[0][0],y:g.pts[0][1],pts:g.pts,speed:g.speed,range:g.range,fov:g.fov,
      i:0,dir:1,face:Math.atan2(g.pts[1][1]-g.pts[0][1],g.pts[1][0]-g.pts[0][0]),
      state:'PATROL',seen:0,hotT:0,target:null,lastSeen:null,r:12,seed:rand(0,9)})),
    turrets:d.turrets.map((t,ti)=>({x:t.x,y:t.y,base:t.base,amp:t.amp,speed:t.speed,range:t.range,fov:t.fov,ang:t.base,seen:0,seed:ti*1.7})),
    pods:d.pods.map(p=>({x:p[0],y:p[1],r:p[2]})),
    anchors:d.anchors.map(a=>({x:a[0],y:a[1],r:a[2]})),
    shards:d.shards.map((s,si)=>({x:s[0],y:s[1],got:false,seed:si*1.3})),
    exit:{x:d.exit[0],y:d.exit[1],r:24,pulse:0},
    player:{x:d.start[0],y:d.start[1],vx:0,vy:0,charge:100,rippleT:0,trail:[]},
    ripples:[],sparks:[],time:0,silent:true,totalShards:d.shards.length};
  L.debris=[]; for(let n=0;n<34;n++){let x,y,tries=0;
    do{ x=rand(30,W-30); y=rand(30,H-30); tries++; }while(pointInWalls(x,y,walls)&&tries<20);
    L.debris.push({x,y,vx:0,vy:0,seed:rand(0,9)}); }
  L.dust=[]; for(let n=0;n<26;n++)L.dust.push({x:rand(0,W),y:rand(0,H),z:rand(.3,1),seed:rand(0,9)});
  return L;
}

/* ============================== STATE / INPUT ============================== */
const G={state:'title',levelIdx:0,t:0,L:null,run:{score:0,times:[]},msg:'',msgT:0,flash:0,det:0};
let keys=new Set(), mouse={x:W/2,y:H/2,down:false};

window.addEventListener('keydown',e=>{
  initAudio();
  const c=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(c)>=0)e.preventDefault();
  keys.add(c);
  if(c==='KeyM')toggleMute();
  if(c==='Escape'&&G.state!=='title')toTitle();
  if(c==='KeyR'){
    if(G.state==='play'||G.state==='caught'||G.state==='clear')beginLevel(G.levelIdx);
    else if(G.state==='win')startRun();
  }
  if(c==='Enter'||c==='Space'){
    if(G.state==='title')startRun();
    else if(G.state==='caught')beginLevel(G.levelIdx);
    else if(G.state==='clear')nextFromClear();
    else if(G.state==='win')startRun();
  }
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>{keys.clear();mouse.down=false;});
window.addEventListener('pointerdown',e=>{initAudio(); if(G.state==='play')mouse.down=true;});
window.addEventListener('pointerup',()=>mouse.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect();
  mouse.x=clamp((e.clientX-r.left)/S,0,W); mouse.y=clamp((e.clientY-r.top)/S,0,H);
});

/* ============================== FLOW ============================== */
function loadBest(){try{return parseInt(localStorage.getItem('gg.best')||'0',10)||0;}catch(e){return 0;}}
function saveBest(v){try{localStorage.setItem('gg.best',String(v));}catch(e){}}

function startRun(){ G.run={score:0,times:[]}; beginLevel(0); }
function beginLevel(i){
  G.levelIdx=i; G.L=buildLevel(i); G.state='play'; G.flash=0; G.det=0;
  keys.clear(); mouse.down=false; setScreen(null); buildPips();
  const L=G.L;
  document.getElementById('hud-sec').textContent='SECTOR 0'+(i+1);
  document.getElementById('hud-name').textContent=L.name;
  G.msg='SECTOR 0'+(i+1)+' — '+L.name+' · COLLECT '+L.totalShards+' SHARDS'; G.msgT=3.2;
  blip(520,0.12,'triangle',0.1,780);
}
function nextFromClear(){ G.levelIdx<2?beginLevel(G.levelIdx+1):showWin(); }
function toTitle(){ G.state='title'; G.L=buildLevel(0); setScreen('title'); }

function onCaught(){
  const L=G.L; G.state='caught'; G.flash=1;
  for(const g of L.guards){g.state='PATROL';}
  blip(220,0.5,'square',0.16,55);
  burst(L.player.x,L.player.y,26,'#ff5a3c');
  setTimeout(()=>{if(G.state==='caught')setScreen('caught');},550);
}
function onClear(){
  const L=G.L; G.state='clear';
  for(const g of L.guards){g.state='PATROL';}
  const timePen=Math.floor(L.time)*6;
  let sc=1200+L.idx*300-timePen; if(sc<200)sc=200;
  if(L.silent)sc+=400;
  G.run.score+=sc;
  G.run.times.push({name:L.name,time:L.time,silent:L.silent,sc});
  L.exit.pulse=1; chord([523,659,784,1046],95,0.13);
  burst(L.exit.x,L.exit.y,30,'#5fe8d8');
  setTimeout(()=>{if(G.state==='clear')setScreen('clear');},450);
}
function showWin(){
  G.state='win'; const total=G.run.score;
  let best=loadBest(),isNew=false; if(total>best){best=total;isNew=true;saveBest(best);}
  setScreen('win',total,best,isNew);
}

/* ============================== OVERLAY SCREENS ============================== */
function setScreen(kind,payload){
  stage.classList.toggle('playing',G.state==='play');
  hud.classList.toggle('hidden',G.state!=='play');
  if(!kind){overlay.classList.add('hidden');overlay.innerHTML='';return;}
  overlay.classList.remove('hidden');
  const L=G.L;
  let inner='';
  if(kind==='title'){

/* ============================== PHYSICS HELPERS ============================== */
function collideRect(c,r,rest){
  const nx=clamp(c.x,r.x,r.x+r.w), ny=clamp(c.y,r.y,r.y+r.h);
  let dx=c.x-nx, dy=c.y-ny; const d2=dx*dx+dy*dy;
  if(d2>c.r*c.r)return false;
  if(d2>1e-9){
    const d=Math.sqrt(d2),ux=dx/d,uy=dy/d;
    c.x=nx+ux*c.r; c.y=ny+uy*c.r;
    const vn=c.vx*ux+c.vy*uy;
    if(vn<0){c.vx-=(1+rest)*vn*ux; c.vy-=(1+rest)*vn*uy;}
    return true;
  }
  const l=c.x-r.x,rr=r.x+r.w-c.x,t=c.y-r.y,b=r.y+r.h-c.y,m=Math.min(l,rr,t,b);
  if(m===l)c.x=r.x-c.r; else if(m===rr)c.x=r.x+r.w+c.r; else if(m===t)c.y=r.y-c.r; else c.y=r.y+r.h+c.r;
  return true;
}
function losBlocked(x1,y1,x2,y2,walls){
  const dx=x2-x1,dy=y2-y1;
  for(const w of walls){
    let t0=0,t1=1; const p=[-dx,dx,-dy,dy];
    const q=[x1-w.x,(w.x+w.w)-x1,y1-w.y,(w.y+w.h)-y1];
    let ok=true;
    for(let i=0;i<4;i++){
      if(p[i]===0){ if(q[i]<0){ok=false;break;} }
      else{ const t=q[i]/p[i];
        if(p[i]<0){ if(t>t1){ok=false;break;} if(t>t0)t0=t; }
        else{ if(t<t0){ok=false;break;} if(t<t1)t1=t; } }
    }
    if(ok)return true;
  }
  return false;
}

/* ============================== GAME TICK ============================== */
function burst(x,y,n,col){
  for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(40,260);
    G.L.sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.8),max:.8,col});}
}
function respawnDebris(d){let x,y,t=0;do{x=rand(30,W-30);y=rand(30,H-30);t++;}while(pointInWalls(x,y,G.L.walls)&&t<20);d.x=x;d.y=y;d.vx=d.vy=0;}

function tick(dt){
  G.t+=dt; const L=G.L; if(!L)return;
  if(G.msgT>0)G.msgT-=dt;
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*1.6);

  // ambient: dust, debris, turret sweep
  for(const d of L.dust){d.x+=Math.sin(G.t*.25+d.seed)*7*d.z*dt; d.y+=Math.cos(G.t*.2+d.seed)*5*d.z*dt;
    if(d.x<0)d.x+=W; if(d.x>W)d.x-=W; if(d.y<0)d.y+=H; if(d.y>H)d.y-=H;}
  for(const t of L.turrets)t.ang=t.base+Math.sin((G.t+t.seed)*t.speed)*t.amp;

  const p=L.player, inPod=L.pods.some(pd=>{const dx=p.x-pd.x,dy=p.y-pd.y;return dx*dx+dy*dy<pd.r*pd.r;});
  const wellActive=G.state==='play'&&!(inPod)&&(keys.has('Space')||mouse.down);

  for(const d of L.debris){
    d.vx+=Math.sin(G.t*.5+d.seed)*10*dt; d.vy+=Math.cos(G.t*.42+d.seed*1.3)*8*dt;
    if(wellActive){const dx=p.x-d.x,dy=p.y-d.y,dd=Math.hypot(dx,dy);
      if(dd<210&&dd>6){d.vx+=dx/dd*950*dt;d.vy+=dy/dd*950*dt;if(dd<13)respawnDebris(d);}}
    for(const a of L.anchors){const dx=a.x-d.x,dy=a.y-d.y,dd=Math.hypot(dx,dy);
      if(dd<a.r&&dd>4){d.vx+=dx/dd*320*dt;d.vy+=dy/dd*320*dt;}}
    d.vx*=Math.exp(-2.4*dt); d.vy*=Math.exp(-2.4*dt);
    const sp=Math.hypot(d.vx,d.vy); if(sp>280){d.vx*=280/sp;d.vy*=280/sp;}
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    if(d.x<20||d.x>W-20){d.vx*=-1;d.x=clamp(d.x,20,W-20);}
    if(d.y<20||d.y>H-20){d.vy*=-1;d.y=clamp(d.y,20,H-20);}
  }
  for(let i=L.sparks.length-1;i>=0;i--){const s=L.sparks[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=Math.exp(-3*dt);s.vy*=Math.exp(-3*dt);s.life-=dt;
    if(s.life<=0)L.sparks.splice(i,1);}

  // guards: full AI in play, patrol-only otherwise
  for(const g of L.guards){
    let mvx=0,mvy=0;
    if(G.state==='play'&&g.state==='HOT'){
      const t=g.target,dx=t.x-g.x,dy=t.y-g.y,dd=Math.hypot(dx,dy);
      const sp=g.seen>0?150:110;
      if(dd>8){mvx=dx/dd*sp;mvy=dy/dd*sp;} else g.face+=Math.sin(G.t*2+g.seed)*dt*1.3;
    } else {
      const wp=g.pts[g.i],dx=wp[0]-g.x,dy=wp[1]-g.y,dd=Math.hypot(dx,dy);
      if(dd<6){ g.i+=g.dir;
        if(g.i>=g.pts.length){g.i=g.pts.length-2;g.dir=-1;} else if(g.i<0){g.i=1;g.dir=1;} }
      else {mvx=dx/dd*g.speed;mvy=dy/dd*g.speed;}
    }
    if(mvx||mvy)g.face=lerpAngle(g.face,Math.atan2(mvy,mvx),1-Math.exp(-8*dt));
    g.x+=mvx*dt; g.y+=mvy*dt;
    for(const w of L.walls)collideRect(g,w,0.1);
    if(G.state==='play'){
      // sight test
      const dx=p.x-g.x,dy=p.y-g.y,dist=Math.hypot(dx,dy);
      let sees=false;
      if(!inPod&&dist<g.range){
        let da=Math.atan2(dy,dx)-g.face; da=(da+Math.PI*3)%(Math.PI*2)-Math.PI;
        if(Math.abs(da)<g.fov/2 && !losBlocked(g.x,g.y,p.x,p.y,L.walls))sees=true;
      }
      if(sees){ g.seen+=dt; g.lastSeen={x:p.x,y:p.y};
        if(g.state!=='HOT'){g.state='HOT';L.silent=false;}
        g.target=g.lastSeen; g.hotT=3.0;
      } else { g.seen=0; if(g.state==='HOT'){ g.hotT-=dt;
          if(g.hotT<=0){g.state='PATROL';let bi=0,bd=1e18;
            for(let k=0;k<g.pts.length;k++){const q=(g.x-g.pts[k][0])**2+(g.y-g.pts[k][1])**2;if(q<bd){bd=q;bi=k;}}
            g.i=bi;} } }
    } else g.seen=0;
  }

  if(G.state!=='play')return;

  /* ---- player physics ---- */
  let ax=0,ay=0;
  if(wellActive){
    const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy)||1;
    const s=760*Math.min(1,d/240)+140;
    ax+=dx/d*s; ay+=dy/d*s;
    p.rippleT-=dt;
    if(p.rippleT<=0){ p.rippleT=RIPPLE_EVERY;
      L.ripples.push({x:p.x,y:p.y,ox:p.x,oy:p.y,r:6,hit:new Set()});
      blip(740,0.09,'triangle',0.045,470); }
  } else p.rippleT=Math.min(p.rippleT,RIPPLE_EVERY-0.12);

  let dirx=0,diry=0;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))dirx-=1;
  if(keys.has('KeyD')||keys.has('ArrowRight'))dirx+=1;
  if(keys.has('KeyW')||keys.has('ArrowUp'))diry-=1;
  if(keys.has('KeyS')||keys.has('ArrowDown'))diry+=1;
  const drifting=(dirx||diry)&&p.charge>0.5;
  if(drifting){ const m=Math.hypot(dirx,diry);
    ax+=dirx/m*260*(inPod?0.55:1); ay+=diry/m*260*(inPod?0.55:1);
    p.charge=Math.max(0,p.charge-55*dt); }
  else p.charge=Math.min(100,p.charge+22*dt);

  for(const a of L.anchors){const dx=a.x-p.x,dy=a.y-p.y,d=Math.hypot(dx,dy);
    if(d<a.r&&d>2){ax+=dx/d*520;ay+=dy/d*520;}}

  p.vx+=ax*dt; p.vy+=ay*dt;
  const drag=Math.exp(-2.1*dt); p.vx*=drag; p.vy*=drag;
  const sp=Math.hypot(p.vx,p.vy); if(sp>330){p.vx*=330/sp;p.vy*=330/sp;}
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  for(let it=0;it<2;it++)for(const w of L.walls)collideRect(p,w,0.25);
  if(p.x<PR+19){p.x=PR+19;p.vx*=-0.3;} if(p.x>W-PR-19){p.x=W-PR-19;p.vx*=-0.3;}
  if(p.y<PR+19){p.y=PR+19;p.vy*=-0.3;} if(p.y>H-PR-19){p.y=H-PR-19;p.vy*=-0.3;}

  p.trail.push({x:p.x,y:p.y}); if(p.trail.length>12)p.trail.shift();

  // ripples
  for(let i=L.ripples.length-1;i>=0;i--){ const r=L.ripples[i]; r.r+=RIP_SPEED*dt;
    if(r.r>HEAR){L.ripples.splice(i,1);continue;}
    for(const g of L.guards){ if(r.hit.has(g.id))continue;
      const d=Math.hypot(g.x-r.x,g.y-r.y);
      if(d<=r.r){ r.hit.add(g.id);
        if(g.state!=='HOT'){g.state='HOT';g.hotT=2.2;g.target={x:r.ox,y:r.oy};L.silent=false;}
        blip(300,0.1,'square',0.05);} } }

  // detection / catch (turrets)
  let det=0;
  for(const g of L.guards){ det=Math.max(det,g.seen/CATCH_TIME); if(g.seen>=CATCH_TIME){onCaught();return;} }
  for(const t of L.turrets){
    const dx=p.x-t.x,dy=p.y-t.y,dist=Math.hypot(dx,dy); let sees=false;
    if(!inPod&&dist<t.range){
      let da=Math.atan2(dy,dx)-t.ang; da=(da+Math.PI*3)%(Math.PI*2)-Math.PI;
      if(Math.abs(da)<t.fov/2 && !losBlocked(t.x,t.y,p.x,p.y,L.walls))sees=true; }
    t.seen=sees?t.seen+dt:0;
    det=Math.max(det,t.seen/CATCH_TIME);
    if(t.seen>=CATCH_TIME){onCaught();return;}
  }
  G.det=det;

  // shards
  const done=L.shards.every(s=>s.got);
  for(const s of L.shards){ if(s.got)continue;
    const d=Math.hypot(p.x-s.x,p.y-s.y);
    if(d<PR+13){ s.got=true; burst(s.x,s.y,14,'#ffd23f'); blip(880,0.1,'sine',0.12); setTimeout(()=>blip(1318,0.14,'sine',0.1),70);
      if(L.shards.every(q=>q.got)){ L.exit.pulse=1; G.msg='EXIT GATE ENERGIZED'; G.msgT=2.2; chord([660,990],80,0.1);} } }
  buildPips();

  // exit
  if(done&&Math.hypot(p.x-L.exit.x,p.y-L.exit.y)<L.exit.r+PR-4){onClear();return;}

  // audio envelopes
  if(AC){ humGain.gain.setTargetAtTime(wellActive?0.13:0,AC.currentTime,0.06);
          sirenGain.gain.setTargetAtTime(det>0.25?0.08:0,AC.currentTime,0.09); }

  L.time+=dt;
}

/* ============================== RENDER ============================== */
function drawCone(x,y,ang,fov,range,r,g,b,base){
  const grd=ctx.createRadialGradient(x,y,8,x,y,range);
  grd.addColorStop(0,`rgba(${r},${g},${b},${base})`);
  grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  ctx.fillStyle=grd; ctx.beginPath();
  ctx.moveTo(x,y); ctx.arc(x,y,range,ang-fov/2,ang+fov/2); ctx.closePath(); ctx.fill();
}
function render(){
  const L=G.L; if(!L)return; const t=G.t;
  // background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0b1a25'); bg.addColorStop(.55,'#0d2230'); bg.addColorStop(1,'#081420');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,200,255,0.045)'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=48;x<W;x+=48){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(let y=48;y<H;y+=48){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
  for(const d of L.dust){ ctx.fillStyle=`rgba(160,220,255,${0.05+0.09*d.z})`;
    ctx.beginPath(); ctx.arc(d.x,d.y,1+d.z*1.4,0,7); ctx.fill(); }

  // null pods
  for(const pd of L.pods){
    ctx.fillStyle='rgba(75,227,160,0.07)'; ctx.beginPath(); ctx.arc(pd.x,pd.y,pd.r,0,7); ctx.fill();
    ctx.strokeStyle='rgba(75,227,160,0.55)'; ctx.lineWidth=1.5;
    ctx.setLineDash([6,9]); ctx.lineDashOffset=t*18;
    ctx.beginPath(); ctx.arc(pd.x,pd.y,pd.r-3,0,7); ctx.stroke();
    ctx.lineDashOffset=-t*26; ctx.strokeStyle='rgba(75,227,160,0.28)';
    ctx.beginPath(); ctx.arc(pd.x,pd.y,pd.r*0.62,0,7); ctx.stroke();
    ctx.setLineDash([]);
  }
  // grav anchors
  for(const a of L.anchors){
    const grd=ctx.createRadialGradient(a.x,a.y,4,a.x,a.y,a.r);
    grd.addColorStop(0,'rgba(255,61,129,0.2)'); grd.addColorStop(1,'rgba(255,61,129,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,61,129,0.75)'; ctx.lineWidth=2;
    for(let i=0;i<3;i++){ const rr=a.r*(0.85-i*0.24);
      ctx.beginPath(); ctx.arc(a.x,a.y,rr,t*(2+i*0.7)+i*2.1,t*(2+i*0.7)+i*2.1+3.6); ctx.stroke(); }
    for(let i=0;i<8;i++){ const ang=i/8*Math.PI*2;
      const rr=a.r-((t*55+i*17)%a.r);
      ctx.strokeStyle=`rgba(255,61,129,${0.5*(rr/a.r)})`; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(a.x+Math.cos(ang)*(rr+9),a.y+Math.sin(ang)*(rr+9));
      ctx.lineTo(a.x+Math.cos(ang)*rr,a.y+Math.sin(ang)*rr); ctx.stroke(); }
    ctx.fillStyle='#ff3d81'; ctx.beginPath(); ctx.arc(a.x,a.y,3.5+Math.sin(t*6)*1,0,7); ctx.fill();
  }
  // shards
  for(const s of L.shards){ if(s.got)continue;
    const bob=Math.sin(t*2+s.seed)*4;
    ctx.save(); ctx.translate(s.x,s.y+bob); ctx.rotate(Math.PI/4+Math.sin(t*1.4+s.seed)*0.35);
    ctx.shadowColor='rgba(255,210,63,.9)'; ctx.shadowBlur=14;
    ctx.fillStyle='#ffd23f'; ctx.fillRect(-6,-6,12,12);
    ctx.shadowBlur=0; ctx.strokeStyle='#fff3c4'; ctx.lineWidth=1.5; ctx.strokeRect(-6,-6,12,12);
    ctx.restore(); }
  // exit gate
  { const e=L.exit, active=L.shards.every(s=>s.got), pul=e.pulse>0?e.pulse:0;
    if(pul>0)e.pulse=Math.max(0,pul-0.016);
    ctx.save(); ctx.translate(e.x,e.y);
    if(active){ ctx.shadowColor='rgba(95,232,216,.9)'; ctx.shadowBlur=18+Math.sin(t*4)*6;
      ctx.strokeStyle='#5fe8d8'; ctx.lineWidth=3;
      ctx.setLineDash([10,7]); ctx.lineDashOffset=-t*30;
      ctx.beginPath(); ctx.arc(0,0,e.r,0,7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=`rgba(95,232,216,${.35+.2*Math.sin(t*4)})`;
      ctx.beginPath(); ctx.arc(0,0,8+Math.sin(t*4)*2+pul*22,0,7); ctx.fill(); }
    else { ctx.strokeStyle='rgba(150,185,205,.4)'; ctx.lineWidth=2.5;
      ctx.setLineDash([4,8]); ctx.lineDashOffset=t*10;
      ctx.beginPath(); ctx.arc(0,0,e.r,0,7); ctx.stroke(); ctx.setLineDash([]); }
    ctx.restore(); }

  // vision cones (under walls so cover reads visually)
  for(const tr of L.turrets){
    const hot=tr.seen>0;
    drawCone(tr.x,tr.y,tr.ang,tr.fov,tr.range, hot?255:255, hot?80:210, hot?60:63, hot?0.4:0.22);
  }
  for(const g of L.guards){
    const col=g.seen>0?[255,75,46]:(g.state==='HOT'?[255,138,60]:[255,179,71]);
    drawCone(g.x,g.y,g.face,g.fov,g.range,col[0],col[1],col[2], g.seen>0?0.42+0.1*Math.sin(t*20):0.2);
  }
  // walls
  for(const w of L.walls){
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=10; ctx.shadowOffsetY=4;
    ctx.fillStyle='#1a3a4c'; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.restore();
    ctx.strokeStyle='rgba(160,230,255,.22)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(w.x,w.y+w.h-1); ctx.lineTo(w.x,w.y+1); ctx.lineTo(w.x+w.w-1,w.y+1); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.beginPath(); ctx.moveTo(w.x+w.w-1,w.y+1); ctx.lineTo(w.x+w.w-1,w.y+w.h-1); ctx.stroke();
  }
  // debris
  for(const d of L.debris){ const sp=Math.hypot(d.vx,d.vy);
    if(sp>80){ ctx.strokeStyle='rgba(160,230,255,.4)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(d.x-d.vx*0.04,d.y-d.vy*0.04); ctx.lineTo(d.x,d.y); ctx.stroke(); }
    else { ctx.fillStyle='rgba(160,230,255,.3)'; ctx.fillRect(d.x-1,d.y-1,2,2); } }

  // turrets base
  for(const tr of L.turrets){
    ctx.fillStyle='#14303f'; ctx.strokeStyle=tr.seen>0?'#ff4b2e':'#3a6b82'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(tr.x,tr.y,13,0,7); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(tr.x,tr.y); ctx.rotate(tr.ang);
    ctx.strokeStyle='#ffd23f'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(16,0); ctx.stroke(); ctx.restore();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(tr.x,tr.y,3,0,7); ctx.fill();
  }
  // guards
  for(const g of L.guards){
    const col=g.seen>0?'#ff4b2e':(g.state==='HOT'?'#ff8a3c':'#ffb347');
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(g.x+3,g.y+6,13,6,0,0,7); ctx.fill();
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(g.face);
    ctx.fillStyle=col; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-9,10); ctx.lineTo(-5,0); ctx.lineTo(-9,-10); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff7e0'; ctx.fillRect(4,-2,7,4);
    ctx.restore();
    if(g.state==='HOT'){ ctx.fillStyle=col; ctx.font='700 17px '+getComputedStyle(document.body).getPropertyValue('--display');
      ctx.textAlign='center'; ctx.fillText(g.seen>0?'!!':'!',g.x,g.y-20); }
  }

  // player
  { const p=L.player, demo=G.state==='title';
    const px=demo?L.player.x:p.x, py=demo?L.player.y+Math.sin(t*2)*4:p.y;
    if(!demo){ for(let i=0;i<p.trail.length-1;i++){ const tr=p.trail[i];
      ctx.fillStyle=`rgba(159,232,255,${i/p.trail.length*0.22})`;
      ctx.beginPath(); ctx.arc(tr.x,tr.y,3+i/p.trail.length*4,0,7); ctx.fill(); } }
    const inPod=!demo&&L.pods.some(pd=>{const dx=px-pd.x,dy=py-pd.y;return dx*dx+dy*dy<pd.r*pd.r;});
    if(inPod){ ctx.strokeStyle='rgba(75,227,160,.8)'; ctx.lineWidth=1.5;
      ctx.setLineDash([4,5]); ctx.lineDashOffset=-t*24;
      ctx.beginPath(); ctx.arc(px,py,16,0,7); ctx.stroke(); ctx.setLineDash([]); }
    const grd=ctx.createRadialGradient(px,py,1,px,py,13);
    grd.addColorStop(0,'#ffffff'); grd.addColorStop(.5,'#9fe8ff'); grd.addColorStop(1,'rgba(95,232,216,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(px,py,13,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px,py,4.5,0,7); ctx.fill();
    if(!demo&&G.det>0){ ctx.strokeStyle=`rgba(255,75,46,${.5+.4*Math.sin(t*18)})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(px,py,18,-Math.PI/2,-Math.PI/2+G.det*Math.PI*2); ctx.stroke(); }

    // field FX + reticle (play only)
    if(G.state==='play'){
      const wellActive=inPod?false:(keys.has('Space')||mouse.down);
      if(wellActive){
        const dx=mouse.x-px,dy=mouse.y-py,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
        ctx.strokeStyle='rgba(159,232,255,.5)'; ctx.lineWidth=1.5;
        ctx.setLineDash([10,8]); ctx.lineDashOffset=-t*60;
        ctx.beginPath(); ctx.moveTo(px+ux*14,py+uy*14); ctx.lineTo(mouse.x-ux*12,mouse.y-uy*12); ctx.stroke(); ctx.setLineDash([]);
        for(let i=0;i<3;i++){ const f=0.3+i*0.26, cx=px+ux*d*f, cy=py+uy*d*f;
          ctx.fillStyle='rgba(159,232,255,.6)';
          ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.atan2(uy,ux));
          ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-4,5); ctx.lineTo(-4,-5); ctx.closePath(); ctx.fill(); ctx.restore(); }
        const baseA=Math.atan2(uy,ux);
        for(let i=0;i<3;i++){ ctx.strokeStyle=`rgba(159,232,255,${.34-i*.08})`; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.arc(px,py,15+i*7,baseA-1.6+t*3,baseA+1.6+t*3); ctx.stroke(); }
      }
      // reticle
      const rr=wellActive?9+2*Math.sin(t*12):9;
      const rc=wellActive?'rgba(255,179,71,.9)':'rgba(159,232,255,.8)';
      ctx.strokeStyle=rc; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(mouse.x,mouse.y,rr,0,7); ctx.stroke();
      for(let i=0;i<4;i++){ const a=i*Math.PI/2+t*(wellActive?2:0.4);
        ctx.beginPath(); ctx.moveTo(mouse.x+Math.cos(a)*(rr+3),mouse.y+Math.sin(a)*(rr+3));
        ctx.lineTo(mouse.x+Math.cos(a)*(rr+8),mouse.y+Math.sin(a)*(rr+8)); ctx.stroke(); }
      ctx.fillStyle=rc; ctx.fillRect(mouse.x-1,mouse.y-1,2,2);
    }
  }

  // ripples
  for(const r of L.ripples){ const a=Math.max(0,1-r.r/HEAR);
    ctx.strokeStyle=`rgba(255,120,73,${a*0.55})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke();
    ctx.strokeStyle=`rgba(255,120,73,${a*0.25})`;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r*0.75,0,7); ctx.stroke(); }
  // sparks
  for(const s of L.sparks){ ctx.globalAlpha=Math.max(0,s.life/s.max);
    ctx.fillStyle=s.col; ctx.fillRect(s.x-2,s.y-2,4,4); ctx.globalAlpha=1; }

  // message toast
  if(G.msgT>0&&G.state!=='title'){ const a=Math.min(1,G.msgT);
    ctx.font='700 15px '+getComputedStyle(document.body).getPropertyValue('--display');
    ctx.textAlign='center'; ctx.fillStyle=`rgba(95,232,216,${a})`;
    ctx.fillText(G.msg.split('').join('\u200a'),W/2,74); }

  // vignette + detection flash
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.42,W/2,H/2,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(G.state==='play'&&G.det>0){ ctx.fillStyle=`rgba(255,60,30,${G.det*0.22*(0.7+0.3*Math.sin(t*14))})`;
    ctx.fillRect(0,0,W,8); ctx.fillRect(0,H-8,W,8); ctx.fillRect(0,0,8,H); ctx.fillRect(W-8,0,8,H); }
  if(G.flash>0){ ctx.fillStyle=`rgba(255,240,235,${G.flash*0.75})`; ctx.fillRect(0,0,W,H); }

  // HUD DOM sync
  if(G.state==='play'){
    const p=L.player;
    chargeFill.style.width=p.charge+'%';
    chargeFill.classList.toggle('low',p.charge<28);
    document.getElementById('hud-score').textContent=String(G.run.score).padStart(4,'0');
    detBanner.classList.toggle('on',G.det>0.14);
  } else detBanner.classList.remove('on');
}
function buildPips(){
  const el=document.getElementById('hud-pips'); if(!el||!G.L)return;
  el.innerHTML=G.L.shards.map(s=>`<span class="pip${s.got?' got':''}"></span>`).join('');
}

/* ============================== MAIN LOOP ============================== */
let last=0,acc=0; const STEP=1/60;
function frame(ts){
  requestAnimationFrame(frame);
  const now=ts/1000; let dt=Math.min(0.1,now-last); last=now;
  if(G.state==='play'||G.state==='title'){ acc+=dt;
    while(acc>=STEP){ tick(STEP); acc-=STEP; } }
  render();
}
toTitle();
requestAnimationFrame(frame);
</script>
</body>
