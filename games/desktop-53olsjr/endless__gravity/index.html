<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1524">
<title>GRAVITON — Gravity Endless Runner</title>
<style>
  :root{
    --amber:#ffb454; --cyan:#59e3ff; --danger:#ff5a4e; --text:#eaf3ff; --dim:#8fa9c9;
    --mono:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
    --disp:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a1524}
  body{font-family:var(--mono);color:var(--text);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #grain{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
  #ui{position:fixed;inset:0;z-index:2;pointer-events:none}

  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,11,20,.52)}
  #startScreen{background:rgba(6,11,20,.34)}
  .panel{pointer-events:auto;position:relative;width:min(94vw,560px);max-height:94vh;overflow-y:auto;text-align:center;
    padding:clamp(22px,4.5vmin,40px) clamp(18px,5vmin,48px);
    background:linear-gradient(160deg,rgba(21,33,56,.95),rgba(10,17,32,.95));
    clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);
    box-shadow:inset 0 0 0 1px rgba(89,227,255,.35),inset 0 0 46px rgba(89,227,255,.06),0 30px 80px rgba(0,0,0,.55);
    animation:panelIn .42s cubic-bezier(.22,1.18,.36,1)}
  .panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--cyan));opacity:.85}
  .panel.danger::before{background:linear-gradient(90deg,var(--danger),#ff9a5c)}
  @keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}

  .flavor{font-size:9px;letter-spacing:.42em;color:#5f7ea3;margin-bottom:14px}
  .flip-badge{width:34px;height:34px;border:3px solid var(--amber);display:inline-block;position:relative;margin-bottom:18px;box-shadow:0 0 18px rgba(255,180,84,.45);animation:badgeFlip 2.6s cubic-bezier(.65,0,.35,1) infinite}
  .flip-badge::after{content:'';position:absolute;inset:7px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  @keyframes badgeFlip{0%,38%{transform:rotate(0)}50%,88%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}

  .title{font-family:var(--disp);font-weight:400;font-size:clamp(52px,13vmin,108px);line-height:.92;letter-spacing:.03em;color:#f4f8ff;
    text-shadow:.045em .045em 0 rgba(255,180,84,.95),-.045em -.03em 0 rgba(89,227,255,.8),0 0 34px rgba(120,200,255,.25);
    animation:titleBob 3.2s ease-in-out infinite}
  @keyframes titleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .tag{margin-top:10px;font-size:clamp(9px,1.8vmin,12px);letter-spacing:.38em;color:#9fb8d8}

  .controls{margin:24px auto 26px;max-width:390px;text-align:left}
  .crow{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px dashed rgba(150,185,225,.16);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .crow:last-child{border:none}
  .keys{display:flex;gap:6px}
  kbd{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#d7e6f8;background:rgba(255,255,255,.06);border:1px solid rgba(160,195,235,.4);padding:3px 8px;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.35)}

  .btn{font-family:var(--disp);font-size:clamp(16px,2.6vmin,20px);letter-spacing:.14em;cursor:pointer;border:none;padding:13px 36px 11px;transition:transform .12s ease,box-shadow .12s ease}
  .btn.primary{background:linear-gradient(180deg,#ffcf8a,#ffa53f);color:#251302;animation:breathe 1.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 5px 0 #7c4a10,0 0 16px rgba(255,180,84,.3)}50%{box-shadow:0 5px 0 #7c4a10,0 0 36px rgba(255,180,84,.6)}}
  .btn.primary:hover{transform:translateY(-2px)}
  .btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #7c4a10,0 0 18px rgba(255,180,84,.35)}
  .btn.ghost{background:transparent;color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(89,227,255,.55)}
  .btn.ghost:hover{background:rgba(89,227,255,.12);transform:translateY(-2px)}
  .bestline{margin-top:16px;font-size:10px;letter-spacing:.32em;color:var(--dim)}
  .bestline b{color:var(--amber);font-size:13px}

  .over-title{font-family:var(--disp);font-weight:400;font-size:clamp(38px,9vmin,70px);letter-spacing:.06em;color:#ff7a6d;
    text-shadow:0 0 26px rgba(255,90,78,.5),3px 3px 0 rgba(110,18,10,.85);animation:flick 3s infinite}
  @keyframes flick{0%,6%{opacity:1}7%{opacity:.55}8%,37%{opacity:1}38%{opacity:.7}39%,100%{opacity:1}}
  .score-big{font-weight:700;font-size:clamp(46px,11vmin,74px);color:#fff;line-height:1;margin-top:8px}
  .score-big em{font-style:normal;color:var(--amber);font-size:.38em;letter-spacing:.2em;vertical-align:.5em}
  .tag-new{display:inline-block;margin-top:12px;background:var(--danger);color:#2a0703;font-size:11px;font-weight:700;letter-spacing:.3em;padding:6px 14px 5px;animation:pulseTag .9s ease-in-out infinite}
  @keyframes pulseTag{50%{transform:scale(1.08);box-shadow:0 0 24px rgba(255,90,78,.7)}}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0;padding:14px 10px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(150,185,225,.18)}
  .stats label{display:block;font-size:9px;letter-spacing:.24em;color:var(--dim);margin-bottom:6px}
  .stats b{font-size:clamp(14px,3vmin,20px);color:#eaf3ff;font-weight:700}
  .hintline{margin-top:15px;font-size:10px;letter-spacing:.2em;color:#6f89a8}

  .pause-title{font-family:var(--disp);font-weight:400;font-size:clamp(34px,7vmin,54px);letter-spacing:.32em;color:var(--cyan);text-shadow:0 0 22px rgba(89,227,255,.5);margin-bottom:20px}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="grain"></div>

<div id="ui">
  <section id="startScreen" class="screen">
    <div class="panel">
      <p class="flavor">SECTOR 7 · ZERO-G DIVISION</p>
      <span class="flip-badge"></span>
      <h1 class="title">GRAVITON</h1>
      <p class="tag">FLIP THE FIELD · OUTRUN THE VOID</p>
      <div class="controls">
        <div class="crow"><span class="keys"><kbd>SPACE</kbd><kbd>TAP</kbd></span><span>Flip gravity</span></div>
        <div class="crow"><span class="keys"><kbd>P</kbd></span><span>Pause</span></div>
        <div class="crow"><span class="keys"><kbd>M</kbd></span><span>Mute</span></div>
        <div class="crow"><span class="keys"><kbd>R</kbd></span><span>Relaunch</span></div>
      </div>
      <button id="btnStart" class="btn primary">LAUNCH RUN</button>
      <p class="bestline">BEST DISTANCE&nbsp;&nbsp;<b id="startBest">0</b>&nbsp;m</p>
    </div>
  </section>

  <section id="overScreen" class="screen hidden">
    <div class="panel danger">
      <h2 class="over-title">SIGNAL LOST</h2>
      <div class="score-big"><span id="finalScore">0</span><em>m</em></div>
      <span id="newBest" class="tag-new hidden">NEW BEST</span>
      <div class="stats">
        <div><label>BEST</label><b id="statBest">0m</b></div>
        <div><label>NEAR MISSES</label><b id="statNear">0</b></div>
        <div><label>TOP SPEED</label><b id="statSpeed">1.00×</b></div>
      </div>
      <button id="btnRestart" class="btn primary">RELAUNCH</button>
      <p class="hintline">or press <kbd>R</kbd> / <kbd>SPACE</kbd></p>
    </div>
  </section>

  <section id="pauseScreen" class="screen hidden">
    <div class="panel slim">
      <h2 class="pause-title">STANDBY</h2>
      <button id="btnResume" class="btn ghost">RESUME</button>
      <p class="hintline"><kbd>P</kbd> to resume</p>
    </div>
  </section>
</div>

<script>
(()=>{ 'use strict';
const TAU=Math.PI*2;
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const startScreen=$('startScreen'),overScreen=$('overScreen'),pauseScreen=$('pauseScreen');

/* ---------- storage ---------- */
function loadLS(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- audio (WebAudio, post-gesture) ---------- */
const Snd={ctx:null,master:null,droneG:null,nbuf:null,muted:loadLS('graviton.muted',0)===1,
  ensure(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); return; }
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      this.ctx=new AC(); this.master=this.ctx.createGain();
      this.master.gain.value=this.muted?0:0.5; this.master.connect(this.ctx.destination);
      const len=this.ctx.sampleRate|0; this.nbuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=this.nbuf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      this.drone();
    }catch(e){this.ctx=null;} },
  drone(){ try{ const c=this.ctx,g=c.createGain(); g.gain.value=.045; g.connect(this.master); this.droneG=g;
      [[55,'sine',1],[82.41,'sine',.55],[110,'triangle',.22]].forEach(([f,t,v])=>{const o=c.createOscillator(),og=c.createGain();o.type=t;o.frequency.value=f;og.gain.value=v;o.connect(og);og.connect(g);o.start();});
      const l=c.createOscillator(),lg=c.createGain();l.frequency.value=.11;lg.gain.value=.02;l.connect(lg);lg.connect(g.gain);l.start();
    }catch(e){} },
  duck(v){ if(this.ctx&&this.droneG) this.droneG.gain.setTargetAtTime(v,this.ctx.currentTime,.2); },
  ok(){return !!this.ctx;},
  noise(t,dur,f0,f1,q,g0){ const c=this.ctx,s=c.createBufferSource();s.buffer=this.nbuf;
    const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
    const g=c.createGain();g.gain.setValueAtTime(g0,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+.02); },
  tone(t,dur,type,f0,f1,g0){ const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,t); if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    g.gain.setValueAtTime(g0,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.02); },
  flip(){ if(!this.ok())return; const t=this.ctx.currentTime; this.noise(t,.18,340,1500,1.1,.2); this.tone(t,.12,'square',190,560,.07); },
  land(i){ if(!this.ok())return; i=Math.max(.15,Math.min(1,i)); const t=this.ctx.currentTime; this.tone(t,.13,'triangle',140,52,.3*i); this.noise(t,.07,500,180,1,.16*i); },
  near(){ if(!this.ok())return; const t=this.ctx.currentTime; this.tone(t,.07,'sine',1568,1568,.09); this.tone(t+.06,.09,'sine',2093,2093,.08); },
  tick(s){ if(!this.ok())return; const f=[523.25,659.25,783.99,987.77,1174.66][s%5]; this.tone(this.ctx.currentTime,.16,'triangle',f,f,.1); },
  boom(){ if(!this.ok())return; const t=this.ctx.currentTime; this.tone(t,.7,'sawtooth',290,36,.4); this.noise(t,.55,900,120,.8,.5); this.duck(.01); },
  toggle(){ this.muted=!this.muted; saveLS('graviton.muted',this.muted?1:0); if(this.master)this.master.gain.value=this.muted?0:0.5; return this.muted; }
};

/* ---------- state ---------- */
let W=0,H=0,S=1,dpr=1,floorY=0,ceilY=0;
let skyGrad,vigGrad,spikeFG,spikeCG,orbGrad,plateFG,plateCG;
const MONO="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace";
const DISP="Impact,'Arial Black','Franklin Gothic Medium',sans-serif";
const AMB='#ffb454',CYN='#59e3ff',DNG='#ff5a4e';

let state='menu', tGlobal=0, lastDt=1/60;
let scroll=0, speed=0, baseSpeed=0, maxSpeed=0, speedMaxSeen=0;
let score=0, best=loadLS('graviton.best',0)|0, nearMisses=0, newBest=false;
let gravDir=1, shake=0, flash=0, deathT=0, overAt=0, badgeAng=0, menuFlipT=1.4;
let milestoneNext=100, spawnIn=0;
const edgeFlash=[0,0];

const player={x:0,y:0,vy:0,r:15,grounded:true,angle:0,squash:0};
let obstacles=[], particles=[], popups=[], ghosts=[];
let stars=[], debrisF=[];

/* ---------- resize / cache ---------- */
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr|0; canvas.height=H*dpr|0;
  S=Math.max(.55,Math.min(1.7,H/720));
  floorY=H-64*S; ceilY=64*S;
  player.r=15.5*S;
  player.x=Math.max(90*S,Math.min(W*.3,W-200));
  baseSpeed=340*S; maxSpeed=860*S;

  skyGrad=ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,'#0a1524'); skyGrad.addColorStop(.55,'#0f2036'); skyGrad.addColorStop(1,'#152b44');
  vigGrad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.38,W/2,H/2,Math.max(W,H)*.75);
  vigGrad.addColorStop(0,'rgba(4,8,16,0)'); vigGrad.addColorStop(1,'rgba(4,8,16,.55)');
  spikeFG=ctx.createLinearGradient(0,floorY,0,floorY-46*S);
  spikeFG.addColorStop(0,'#ff9a76'); spikeFG.addColorStop(1,'#e13d55');
  spikeCG=ctx.createLinearGradient(0,ceilY,0,ceilY+46*S);
  spikeCG.addColorStop(0,'#ff9a76'); spikeCG.addColorStop(1,'#e13d55');
  orbGrad=ctx.createRadialGradient(W*.72,H*.46,0,W*.72,H*.46,Math.min(W,H)*.4);
  orbGrad.addColorStop(0,'rgba(90,190,235,.13)'); orbGrad.addColorStop(1,'rgba(90,190,235,0)');
  plateFG=ctx.createLinearGradient(0,floorY,0,H);
  plateFG.addColorStop(0,'#1e3049'); plateFG.addColorStop(1,'#0f1b2c');
  plateCG=ctx.createLinearGradient(0,ceilY,0,0);
  plateCG.addColorStop(0,'#1e3049'); plateCG.addColorStop(1,'#0f1b2c');

  buildStars(); buildDebris();
  const lo=ceilY+player.r, hi=floorY-player.r;
  player.y=Math.max(lo,Math.min(hi,player.y||floorY-player.r));
}
function buildStars(){ stars=[];
  [[60,.10,1.1],[42,.22,1.7],[24,.45,2.5]].forEach(([n,sp,sz],li)=>{ for(let i=0;i<n;i++)
    stars.push({u:Math.random(),v:Math.random(),tw:1+Math.random()*3,ph:Math.random()*TAU,s:sz*S*(.7+Math.random()*.6),sp}); });
}
function buildDebris(){ debrisF=[]; for(let i=0;i<9;i++)
  debrisF.push({u:Math.random(),v:Math.random(),rot:Math.random()*TAU,vr:(Math.random()-.5)*.8,sz:(7+Math.random()*13)*S,sh:i%3}); }

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }
function segClosest(px,py,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0; t=clamp(t,0,1); return Math.hypot(px-(x1+t*dx),py-(y1+t*dy)); }
function triDist(px,py,ax,ay,bx,by,cx,cy){
  const s1=(bx-ax)*(py-ay)-(by-ay)*(px-ax), s2=(cx-bx)*(py-by)-(cy-by)*(px-bx), s3=(ax-cx)*(py-cy)-(ay-cy)*(px-cx);
  if(!((s1<0||s2<0)&&(s1>0||s2>0)) && !((s2<0||s3<0)&&(s2>0||s3>0)) && !((s3<0||s1<0)&&(s3>0||s1>0))) return 0;
  return Math.min(segClosest(px,py,ax,ay,bx,by),segClosest(px,py,bx,by,cx,cy),segClosest(px,py,cx,cy,ax,ay)); }
function rectDist(px,py,x,y,w,h){ const cx=clamp(px,x,x+w),cy=clamp(py,y,y+h); return Math.hypot(px-cx,py-cy); }

/* ---------- obstacles ---------- */
const difficulty=()=>clamp(score/2000,0,1);
function spawnPattern(){
  const d=difficulty(), x=W+70*S, r=Math.random();
  let type='spikes';
  if(score>700 && r<.18) type='hole';
  else if(score>350 && r<.42) type='gate';
  else if(score>120 && r<.68) type='pillar';

  if(type==='spikes'){ const n=1+Math.floor(Math.random()*(2+d*2)); addSpikes(x,n,Math.random()<.5); }
  else if(type==='pillar') addPillar(x,Math.random()<.5);
  else if(type==='gate') addGate(x,d);
  else addHole(x,Math.random()<.5);

  spawnIn=speed*(1.35-.5*d)*(.85+Math.random()*.4)+240*S;
}
function addSpikes(x,n,onFloor){ obstacles.push({type:'spikes',x,w:n*30*S,n,sw:30*S,sh:46*S,onFloor,minD:null,passed:false}); }
function addPillar(x,fromFloor){ const playH=floorY-ceilY,h=playH*.62,w=46*S;
  obstacles.push({type:'pillar',x,y:fromFloor?floorY-h:ceilY,w,h,fromFloor,minD:null,passed:false}); }
function addGate(x,d){ const gap=(170-74*d)*S*(.9+Math.random()*.2), playH=floorY-ceilY;
  const yc=ceilY+playH*(.35+Math.random()*.3);
  let topH=yc-gap/2-ceilY, botH=floorY-(yc+gap/2);
  if(topH<18*S){topH=18*S;} if(botH<18*S){botH=18*S;}
  obstacles.push({type:'pillar',x,y:ceilY,w:46*S,h:topH,fromFloor:false,minD:null,passed:false});
  obstacles.push({type:'pillar',x,y:floorY-botH,w:46*S,h:botH,fromFloor:true,minD:null,passed:false}); }
function addHole(x,onFloor){ const w=(90+Math.random()*60)*S*(1-difficulty()*.3);
  obstacles.push({type:'hole',x,w,onFloor,minD:null,passed:false,y:0,h:0}); }

function overHoleAt(x,onFloor){ for(const o of obstacles) if(o.type==='hole'&&o.onFloor===onFloor&&x>o.x+4*S&&x<o.x+o.w-4*S) return true; return false; }
function distToObstacle(o,px,py){
  if(o.type==='spikes'){ let m=1e9; const base=o.onFloor?floorY:ceilY, dir=o.onFloor?-1:1;
    for(let i=0;i<o.n;i++){ const bx=o.x+i*o.sw; m=Math.min(m,triDist(px,py,bx,base,bx+o.sw/2,base+dir*o.sh,bx+o.sw,base)); } return m; }
  if(o.type==='pillar') return rectDist(px,py,o.x,o.y,o.w,o.h);
  const band=o.onFloor?[o.x,floorY,o.w,H-floorY]:[o.x,0,o.w,ceilY];
  return rectDist(px,py,band[0],band[1],band[2],band[3]);
}
function hitObstacle(o,px,py,r){
  if(o.type==='spikes'){ const base=o.onFloor?floorY:ceilY, dir=o.onFloor?-1:1;
    for(let i=0;i<o.n;i++){ const bx=o.x+i*o.sw; if(triDist(px,py,bx,base,bx+o.sw/2,base+dir*o.sh,bx+o.sw,base)<r*.8) return true; } return false; }
  if(o.type==='pillar') return rectDist(px,py,o.x,o.y,o.w,o.h)<r*.88;
  if(o.onFloor){ if(gravDir>0&&px>o.x+4*S&&px<o.x+o.w-4*S&&py+r>.5*r+floorY-r*.5) { } return gravDir>0&&px>o.x+6*S&&px<o.x+o.w-6*S&&(py+r*0.5)>floorY; }
  return gravDir<0&&px>o.x+6*S&&px<o.x+o.w-6*S&&(py-r*.5)<ceilY;
}

/* ---------- particles / fx ---------- */
function ringAt(x,y,r0,r1,col,life){ particles.push({type:'ring',x,y,r0,r1,t:0,life:life||.5,col}); }
function landDust(surfY,dir,impact){ const n=3+Math.min(9,impact/(160*S));
  for(let i=0;i<n;i++) particles.push({type:'dust',x:player.x+(Math.random()-.5)*player.r*2,y:surfY,
    vx:(Math.random()-.5)*280*S-speed*.12,vy:-dir*(30+Math.random()*90)*S,t:0,life:.35+Math.random()*.35,size:(2+Math.random()*3.2)*S}); }
function flipBurst(){ const col=gravDir>0?AMB:CYN;
  for(let i=0;i<7;i++){ const a=Math.random()*TAU,v=(140+Math.random()*380)*S;
    particles.push({type:'spark',x:player.x,y:player.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.25+Math.random()*.25,col}); }
  ringAt(player.x,player.y,player.r*1.2,player.r*3,col,.4); }
function explode(x,y){ const cols=['#eef4fb','#16233c',AMB,CYN,DNG];
  for(let i=0;i<16;i++){ const a=Math.random()*TAU,v=(120+Math.random()*520)*S;
    particles.push({type:'debris',x,y,vx:Math.cos(a)*v-speed*.25,vy:Math.sin(a)*v,t:0,life:.8+Math.random()*.7,size:(3+Math.random()*6.5)*S,rot:Math.random()*TAU,vr:Math.random()*14-7,col:cols[i%cols.length]}); }
  for(let i=0;i<26;i++){ const a=Math.random()*TAU,v=(200+Math.random()*680)*S;
    particles.push({type:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:.25+Math.random()*.35,col:i%3?'#ffd9a0':'#ffffff'}); }
  ringAt(x,y,6*S,130*S,'#ffffff',.6); ringAt(x,y,4*S,90*S,DNG,.5); }

function updateFx(dt){
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.t+=dt;
    if(p.t>=p.life){ particles.splice(i,1); continue; }
    if(p.type==='dust'){ p.x+=p.vx*dt; p.y+=p.vy*dt; const dr=Math.exp(-3*dt); p.vx*=dr; p.vy*=dr; }
    else if(p.type==='spark'){ p.x+=p.vx*dt; p.y+=p.vy*dt; }
    else if(p.type==='debris'){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=1500*S*dt; p.rot+=p.vr*dt; } }
  if(particles.length>420) particles.splice(0,particles.length-420);
  for(let i=popups.length-1;i>=0;i--){ const q=popups[i]; q.t+=dt; q.y-=34*S*dt; if(q.t>q.life) popups.splice(i,1); }
  for(let i=ghosts.length-1;i>=0;i--){ const g=ghosts[i]; g.x-=(80*S+speed*.15)*dt; if(g.x<-260*S) ghosts.splice(i,1); }
}

/* ---------- core actions ---------- */
function doFlip(){ gravDir*=-1; player.vy+=gravDir*430*S; player.grounded=false;
  Snd.flip(); flipBurst(); shake=Math.max(shake,2.5*S); edgeFlash[gravDir>0?1:0]=1; }

function stepPlayer(dt){
  const p=player,g=2800*S,vmax=1350*S;
  if(p.grounded&&((gravDir>0&&p.y+p.r<floorY-2)||(gravDir<0&&p.y-p.r>ceilY+2))) p.grounded=false;
  p.vy=clamp(p.vy+g*gravDir*dt,-vmax,vmax);
  p.y+=p.vy*dt;
  if(gravDir>0){ const oh=overHoleAt(p.x,true);
    if(!oh&&p.y+p.r>=floorY) land(floorY-p.r,1);
    else if(oh&&state==='play'&&p.y-p.r>floorY) die(); }
  else { const oh=overHoleAt(p.x,false);
    if(!oh&&p.y-p.r<=ceilY) land(ceilY+p.r,-1);
    else if(oh&&state==='play'&&p.y+p.r<ceilY) die(); }
  p.squash*=Math.exp(-7*dt);
  const target=p.grounded?0:clamp(p.vy/(2800*S),-.55,.55);
  p.angle+=(target-p.angle)*Math.min(1,dt*14);
}
function land(y,dir){ const impact=Math.abs(player.vy);
  if(!player.grounded&&impact>90*S){ landDust(dir>0?floorY:ceilY,dir,impact); Snd.land(impact/(1300*S));
    if(impact>760*S) shake=Math.max(shake,Math.min(5*S,impact/(260*S))); }
  player.y=y; player.vy=0; player.grounded=true;
  player.squash=Math.min(.4,impact/(1500*S)); }

function die(){ if(state!=='play')return; state='dying'; deathT=0;
  Snd.boom(); shake=15*S; flash=.8; explode(player.x,player.y);
  const sc=Math.floor(score); if(sc>best){ best=sc; saveLS('graviton.best',best); newBest=true; } }

function stepWorld(dt){ scroll+=speed*dt;
  for(let i=obstacles.length-1;i>=0;i--){ obstacles[i].x-=speed*dt;
    const o=obstacles[i]; if(o.x+(o.w||o.sw*o.n)<-90*S) obstacles.splice(i,1); } }

/* ---------- state machine ---------- */
function reset(){ score=0; nearMisses=0; milestoneNext=100; speedMaxSeen=baseSpeed;
  obstacles.length=0; particles.length=0; popups.length=0; ghosts.length=0;
  gravDir=1; player.y=floorY-player.r; player.vy=0; player.grounded=true; player.angle=0; player.squash=0;
  spawnIn=baseSpeed*1.9+320*S; flash=.25; shake=0; edgeFlash[0]=edgeFlash[1]=0; menuFlipT=1.6; }

function startGame(){ Snd.ensure(); Snd.duck(.045); reset(); state='play';
  startScreen.classList.add('hidden'); overScreen.classList.add('hidden'); pauseScreen.classList.add('hidden'); }
function resumeGame(){ if(state!=='pause')return; state='play'; pauseScreen.classList.add('hidden'); }
function togglePause(){ if(state==='play'){ state='pause'; pauseScreen.classList.remove('hidden'); }
  else if(state==='pause') resumeGame(); }
function showOver(){ $('finalScore').textContent=Math.floor(score);
  $('statBest').textContent=best+'m'; $('statNear').textContent=nearMisses;
  $('statSpeed').textContent=(speedMaxSeen/baseSpeed).toFixed(2)+'×';
  $('newBest').classList.toggle('hidden',!newBest);
  $('startBest').textContent=best; overScreen.classList.remove('hidden'); }

function primaryAction(){
  if(state==='menu') startGame();
  else if(state==='play') doFlip();
  else if(state==='pause') resumeGame();
  else if(state==='over'&&tGlobal-overAt>.45) startGame();
}

/* ---------- updates ---------- */
function updatePlay(dt){
  speed=baseSpeed+(maxSpeed-baseSpeed)*Math.pow(Math.min(1,score/1800),.65)+Math.sin(tGlobal*1.7)*8*S;
  speedMaxSeen=Math.max(speedMaxSeen,speed);
  score+=speed*dt/(38*S);
  while(score>=milestoneNext){ ghosts.push({txt:milestoneNext,x:W+140*S,y:H*.42}); Snd.tick(milestoneNext/100); milestoneNext+=100; }
  spawnIn-=speed*dt; if(spawnIn<=0) spawnPattern();
  stepWorld(dt); stepPlayer(dt);
  if(state!=='play') return;
  const px=player.x,py=player.y,r=player.r;
  for(const o of obstacles){
    if(!o.passed&&o.x+(o.w||o.sw*o.n)<px-r*.5){ o.passed=true;
      if(o.type!=='hole'&&o.minD!==null&&o.minD>0&&o.minD<r*2.3){
        nearMisses++; score+=2; Snd.near();
        popups.push({x:px+r+14*S,y:py-36*S,txt:'CLOSE +2',col:CYN,t:0,life:.9});
        ringAt(px,py,r*1.5,r*3.2,CYN,.45); } }
    const ow=o.w||o.sw*o.n;
    if(o.x<px+r+ow&&o.x+ow>px-r){
      const d=distToObstacle(o,px,py);
      if(o.type!=='hole'&&(o.minD===null||d<o.minD)) o.minD=d;
      if(hitObstacle(o,px,py,r)){ die(); return; } } }
  updateFx(dt);
  shake*=Math.exp(-5.5*dt); flash=Math.max(0,flash-dt*1.6);
  edgeFlash[0]*=Math.exp(-4*dt); edgeFlash[1]*=Math.exp(-4*dt);
}
function updateMenu(dt){ speed=baseSpeed*.42; stepWorld(dt); stepPlayer(dt);
  menuFlipT-=dt; if(menuFlipT<=0){ doFlip(); menuFlipT=1.9+Math.random()*.8; }
  updateFx(dt); shake*=Math.exp(-5.5*dt); flash=Math.max(0,flash-dt*1.6);
  edgeFlash[0]*=Math.exp(-4*dt); edgeFlash[1]*=Math.exp(-4*dt); }
function updateDying(dt){ deathT+=dt; const sdt=dt*.25;
  speed*=Math.exp(-4*dt); stepWorld(sdt); updateFx(sdt);
  shake*=Math.exp(-4.5*dt); flash=Math.max(0,flash-dt*1.4);
  if(deathT>1.15){ state='over'; overAt=tGlobal; showOver(); } }

/* ---------- rendering ---------- */
function drawOrb(){ const ox=W*.72,oy=H*.46,R=Math.min(W,H)*.36*(1+Math.sin(tGlobal*.5)*.02);
  ctx.fillStyle=orbGrad; ctx.beginPath(); ctx.arc(ox,oy,R*1.15,0,TAU); ctx.fill();
  for(let k=0;k<3;k++){ ctx.strokeStyle='rgba(130,205,245,'+(.10-.028*k)+')'; ctx.lineWidth=1.4;
    ctx.setLineDash([5*S,16*S]); ctx.lineDashOffset=tGlobal*(14+9*k)*(k%2?-1:1);
    ctx.beginPath(); ctx.arc(ox,oy,R*(.5+.28*k),0,TAU); ctx.stroke(); }
  ctx.setLineDash([]); ctx.lineDashOffset=0;
  const a0=tGlobal*.35; ctx.strokeStyle='rgba(150,220,255,.14)'; ctx.lineWidth=3*S;
  ctx.beginPath(); ctx.arc(ox,oy,R*.68,a0,a0+1.1); ctx.stroke(); }

function drawParallax(){
  for(const s of stars){ const x=((s.u*W-scroll*s.sp)%W+W)%W, y=s.v*H;
    const a=.25+.45*(.5+.5*Math.sin(tGlobal*s.tw+s.ph));
    ctx.fillStyle='rgba(190,220,255,'+a.toFixed(3)+')';
    const rr=(speed-baseSpeed)/(maxSpeed-baseSpeed);
    if(rr>.7&&s.sp>=.4){ const l=(rr-.7)*90*S; ctx.fillRect(x,y,l,s.s*.8); }
    else { ctx.beginPath(); ctx.arc(x,y,s.s,0,TAU); ctx.fill(); } }
  ctx.strokeStyle='rgba(120,165,205,.16)'; ctx.lineWidth=1.2;
  for(const d of debrisF){ const x=((d.u*W-scroll*.45)%W+W)%W, y=d.v*H, r=d.rot+tGlobal*d.vr;
    ctx.save(); ctx.translate(x,y); ctx.rotate(r); const s=d.sz;
    if(d.sh===0) ctx.strokeRect(-s/2,-s/2,s,s);
    else if(d.sh===1){ ctx.beginPath(); ctx.moveTo(0,-s*.6); ctx.lineTo(s*.55,s*.45); ctx.lineTo(-s*.55,s*.45); ctx.closePath(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(0,0,s*.5,0,TAU); ctx.stroke(); }
    ctx.restore(); } }

function drawGhosts(){ if(!ghosts.length)return;
  ctx.font='700 '+(150*S)+'px '+DISP; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#9fd0ff';
  for(const g of ghosts){ ctx.globalAlpha=.06; ctx.fillText(g.txt+'m',g.x,g.y); }
  ctx.globalAlpha=1; }

function drawPlates(){
  ctx.fillStyle=plateFG; ctx.fillRect(0,floorY,W,H-floorY);
  ctx.fillStyle=plateCG; ctx.fillRect(0,0,W,ceilY);
  // chevrons
  const per=26*S, off=-(scroll%per);
  ctx.save(); ctx.beginPath(); ctx.rect(0,floorY+6*S,W,12*S); ctx.clip();
  ctx.strokeStyle='rgba(255,170,80,.20)'; ctx.lineWidth=7*S;
  for(let x=off-per;x<W+per;x+=per){ ctx.beginPath(); ctx.moveTo(x,floorY+20*S); ctx.lineTo(x+14*S,floorY+4*S); ctx.stroke(); }
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0,ceilY,W,12*S); ctx.clip();
  ctx.strokeStyle='rgba(90,225,255,.18)'; ctx.lineWidth=7*S;
  for(let x=off-per;x<W+per;x+=per){ ctx.beginPath(); ctx.moveTo(x,ceilY-4*S+6*S); ctx.lineTo(x-14*S,ceilY+20*S); ctx.stroke(); }
  ctx.restore();
  // edge glow (floor = amber, ceiling = cyan)
  ctx.fillStyle='rgba(255,180,84,'+(.12+.4*edgeFlash[1]).toFixed(3)+')'; ctx.fillRect(0,floorY-7*S,W,7*S);
  ctx.fillStyle='#ffd9a0'; ctx.fillRect(0,floorY-2.6*S,W,2.6*S);
  ctx.fillStyle='rgba(89,227,255,'+(.12+.4*edgeFlash[0]).toFixed(3)+')'; ctx.fillRect(0,ceilY,W,7*S);
  ctx.fillStyle='#bdf3ff'; ctx.fillRect(0,ceilY,W,2.6*S); }

function drawHoles(){ for(const o of obstacles){ if(o.type!=='hole')continue;
  if(o.onFloor){ ctx.fillStyle='#04070e'; ctx.fillRect(o.x,floorY,o.w,H-floorY);
    ctx.fillStyle='#0d1a2c';
    for(let i=0;i<4;i++){ const tx=o.x+o.w*(i+.5)/4; ctx.beginPath(); ctx.moveTo(tx-6*S,floorY); ctx.lineTo(tx+6*S,floorY); ctx.lineTo(tx,floorY+14*S); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle='rgba(255,90,78,.25)'; ctx.fillRect(o.x-1.5*S,floorY,3*S,H-floorY); ctx.fillRect(o.x+o.w-1.5*S,floorY,3*S,H-floorY);
  } else { ctx.fillStyle='#04070e'; ctx.fillRect(o.x,0,o.w,ceilY);
    ctx.fillStyle='#0d1a2c';
    for(let i=0;i<4;i++){ const tx=o.x+o.w*(i+.5)/4; ctx.beginPath(); ctx.moveTo(tx-6*S,ceilY); ctx.lineTo(tx+6*S,ceilY); ctx.lineTo(tx,ceilY-14*S); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle='rgba(255,90,78,.25)'; ctx.fillRect(o.x-1.5*S,0,3*S,ceilY); ctx.fillRect(o.x+o.w-1.5*S,0,3*S,ceilY); } } }

function drawPillar(o){
  ctx.fillStyle='#324a63'; ctx.fillRect(o.x,o.y,o.w,o.h);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(o.x+o.w-6*S,o.y,6*S,o.h);
  ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fillRect(o.x,o.y,3*S,o.h);
  const by=o.fromFloor?o.y:o.y+o.h-12*S;
  ctx.save(); ctx.beginPath(); ctx.rect(o.x,by,o.w,12*S); ctx.clip();
  ctx.fillStyle='#141d2b'; ctx.fillRect(o.x,by,o.w,12*S);
  ctx.strokeStyle='rgba(255,180,84,.8)'; ctx.lineWidth=6*S; const per=13*S;
  for(let x=o.x-12*S;x<o.x+o.w+12*S;x+=per){ ctx.beginPath(); ctx.moveTo(x,by+14*S); ctx.lineTo(x+10*S,by-2*S); ctx.stroke(); }
  ctx.restore();
  const oy=o.fromFloor?o.y:o.y+o.h;
  ctx.fillStyle='rgba(255,255,255,.5)';
  if(o.fromFloor) ctx.fillRect(o.x,oy,o.w,2*S); else ctx.fillRect(o.x,oy-2*S,o.w,2*S); }

function drawSpikes(o){ const base=o.onFloor?floorY:ceilY, dir=o.onFloor?-1:1;
  for(let i=0;i<o.n;i++){ const bx=o.x+i*o.sw;
    ctx.beginPath(); ctx.moveTo(bx+1*S,base); ctx.lineTo(bx+o.sw/2,base+dir*o.sh); ctx.lineTo(bx+o.sw-1*S,base); ctx.closePath();
    ctx.fillStyle=o.onFloor?spikeFG:spikeCG; ctx.fill();
    ctx.strokeStyle='rgba(10,5,8,.5)'; ctx.lineWidth=1.5; ctx.stroke(); }
  const by=o.onFloor?floorY-3*S:ceilY;
  ctx.fillStyle='#3a2733'; ctx.fillRect(o.x-4*S,by,(o.n*o.sw)+8*S,3*S); }

function drawObstacles(){ for(const o of obstacles){ if(o.type==='pillar')drawPillar(o); else if(o.type==='spikes')drawSpikes(o); } }

function drawPlayer(){ const p=player;
  ctx.save();
  const freq=speed/(90*S);
  const hop=p.grounded?Math.sin(tGlobal*freq)*1.6*S*p.gravDir:0;
  ctx.translate(p.x,p.y+hop); ctx.rotate(p.angle);
  const sq=p.squash; ctx.scale(1+sq*.6,1-sq*.7);
  const s=p.r;
  if(!p.grounded){ const fdir=p.vy>0?-1:1, len=(10+Math.min(34,Math.abs(p.vy)/(50*S)))*S*(.8+Math.random()*.4), fy=fdir*s*.9;
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<3;i++){ const fl=len*(1-i*.28)*(.75+Math.random()*.5), wdt=(7-i*1.6)*S;
      ctx.fillStyle=i===0?'rgba(255,240,200,.9)':i===1?'rgba(255,180,84,.6)':'rgba(255,120,60,.35)';
      ctx.beginPath(); ctx.moveTo(-wdt,fy); ctx.lineTo(wdt,fy); ctx.lineTo(0,fy+fdir*fl); ctx.closePath(); ctx.fill(); }
    ctx.globalCompositeOperation='source-over'; }
  ctx.fillStyle='#9fb4cc'; rrect(-s*1.08,-s*.35,s*.4,s*.7,2*S); ctx.fill();
  ctx.fillStyle='#f2f7fd'; rrect(-s,-s,s*2,s*2,5*S); ctx.fill();
  ctx.strokeStyle='#0c1524'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#0e1a2c'; rrect(-s*.55,-s*.55,s*1.1,s*.6,3*S); ctx.fill();
  ctx.fillStyle=gravDir>0?AMB:CYN; ctx.fillRect(s*.08,-s*.42,s*.4,s*.22);
  ctx.restore(); }

function drawParticles(){
  for(const p of particles){ const k=p.t/p.life;
    if(p.type==='dust'){ ctx.fillStyle='rgba(165,195,230,'+((1-k)*.55).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1-k*.4),0,TAU); ctx.fill(); }
    else if(p.type==='debris'){ ctx.save(); ctx.globalAlpha=1-k; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; ctx.fillRect(-p.size/2,-p.size*.35,p.size,p.size*.7);
      ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=1; ctx.strokeRect(-p.size/2,-p.size*.35,p.size,p.size*.7);
      ctx.restore(); } }
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){ const k=p.t/p.life;
    if(p.type==='spark'){ ctx.globalAlpha=(1-k)*.9; ctx.strokeStyle=p.col; ctx.lineWidth=2*S*(1-k)+.6;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035); ctx.stroke(); }
    else if(p.type==='ring'){ const e=1-Math.pow(1-k,2), r=p.r0+(p.r1-p.r0)*e;
      ctx.globalAlpha=(1-k)*.9; ctx.strokeStyle=p.col; ctx.lineWidth=(3-2*k)*S+1;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.stroke(); } }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }

function drawPopups(){ for(const q of popups){ const a=1-q.t/q.life;
    ctx.font='700 '+(14*S)+'px '+MONO; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=a; ctx.strokeStyle='rgba(6,12,22,.8)'; ctx.lineWidth=3; ctx.strokeText(q.txt,q.x,q.y);
    ctx.fillStyle=q.col; ctx.fillText(q.txt,q.x,q.y); }
  ctx.globalAlpha=1; }

function drawHUD(){
  const sc=Math.floor(score);
  try{ctx.letterSpacing='3px';}catch(e){}
  ctx.font='600 '+(10*S)+'px '+MONO; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(150,190,230,.7)'; ctx.fillText('SCORE',W/2,30*S);
  try{ctx.letterSpacing='0px';}catch(e){}
  ctx.font='700 '+(38*S)+'px '+MONO; ctx.fillStyle='#f4f9ff';
  ctx.shadowColor='rgba(120,220,255,.5)'; ctx.shadowBlur=14;
  ctx.fillText(sc,W/2,64*S); ctx.shadowBlur=0;
  ctx.font='700 '+(12*S)+'px '+MONO; ctx.fillStyle=AMB;
  ctx.fillText('BEST '+Math.max(best,sc),W/2,84*S);

  // gravity badge
  const target=gravDir>0?0:Math.PI;
  badgeAng+=(target-badgeAng)*Math.min(1,lastDt*12);
  const bx=W-44*S,by=46*S,bs=17*S,dirCol=gravDir>0?AMB:CYN;
  ctx.save(); ctx.translate(bx,by); ctx.rotate(badgeAng);
  ctx.strokeStyle=dirCol; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(0,-bs); ctx.lineTo(bs*.8,0); ctx.lineTo(0,bs); ctx.lineTo(-bs*.8,0); ctx.closePath(); ctx.stroke();
  ctx.fillStyle=dirCol; ctx.beginPath(); ctx.moveTo(-6*S,-4*S); ctx.lineTo(6*S,-4*S); ctx.lineTo(0,9*S); ctx.closePath(); ctx.fill();
  ctx.restore();

  // velocity bar
  const ratio=clamp((speed-baseSpeed)/(maxSpeed-baseSpeed),0,1);
  ctx.font='600 '+(9*S)+'px '+MONO; ctx.textAlign='left'; ctx.fillStyle='rgba(150,190,230,.6)';
  ctx.fillText('VEL',24*S,H-20*S);
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(58*S,H-24*S,90*S,5*S);
  const r=Math.round(255), gch=Math.round(180-ratio*90), bch=Math.round(84-ratio*30);
  ctx.fillStyle='rgb('+r+','+gch+','+bch+')'; ctx.fillRect(58*S,H-24*S,90*S*ratio,5*S);

  // mute icon
  const mx=W-30*S,my=H-26*S;
  ctx.fillStyle='rgba(210,230,250,.7)';
  ctx.fillRect(mx-8*S,my-4*S,5*S,8*S);
  ctx.beginPath(); ctx.moveTo(mx-3*S,my-4*S); ctx.lineTo(mx+3*S,my-9*S); ctx.lineTo(mx+3*S,my+9*S); ctx.lineTo(mx-3*S,my+4*S); ctx.closePath(); ctx.fill();
  if(Snd.muted){ ctx.strokeStyle=DNG; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(mx-8*S,my-10*S); ctx.lineTo(mx+10*S,my+10*S); ctx.stroke(); }
  else { ctx.strokeStyle='rgba(89,227,255,.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(mx+4*S,my,7*S,-.8,.8); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx+4*S,my,11*S,-.8,.8); ctx.stroke(); }
  ctx.font='600 '+(9*S)+'px '+MONO; ctx.fillStyle='rgba(150,190,230,.5)'; ctx.textAlign='right';
  ctx.fillText('M',mx-14*S,my+3*S);

  if(state==='play'){ ctx.font='600 '+(10*S)+'px '+MONO; ctx.textAlign='center';
    try{ctx.letterSpacing='2.5px';}catch(e){}
    ctx.fillStyle='rgba(190,215,245,.3)'; ctx.fillText('SPACE / TAP — FLIP GRAVITY',W/2,H-12*S);
    try{ctx.letterSpacing='0px';}catch(e){} } }

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=skyGrad; ctx.fillRect(0,0,W,H);
  drawOrb(); drawParallax(); drawGhosts();

  const shx=(Math.random()-.5)*2*shake, shy=(Math.random()-.5)*2*shake;
  ctx.save(); ctx.translate(shx,shy);
  drawPlates(); drawHoles(); drawObstacles(); drawParticles();
  if(state!=='dying'&&state!=='over') drawPlayer();
  drawPopups();
  ctx.restore();

  // speed lines
  const rr=(speed-baseSpeed)/(maxSpeed-baseSpeed);
  if(rr>.5&&state==='play'){ const n=Math.floor((rr-.5)*24);
    for(let i=0;i<n;i++){ const l=(30+Math.random()*140)*S*rr;
      ctx.fillStyle='rgba(190,225,255,'+(.04+Math.random()*.08).toFixed(3)+')';
      ctx.fillRect(Math.random()*W,Math.random()*H,l,1.5); } }

  ctx.fillStyle=vigGrad; ctx.fillRect(0,0,W,H);
  if(flash>0){ ctx.fillStyle='rgba(255,255,255,'+flash.toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  if(state!=='menu') drawHUD();
}

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){ let dt=(now-last)/1000; last=now; dt=Math.min(dt,1/30); lastDt=dt; tGlobal+=dt;
  if(state==='play') updatePlay(dt);
  else if(state==='menu') updateMenu(dt);
  else if(state==='dying') updateDying(dt);
  else if(state==='over') updateFx(dt*.4);
  render(); requestAnimationFrame(frame); }

/* ---------- input ---------- */
window.addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='Space'||c==='ArrowUp'||c==='KeyW'){ e.preventDefault(); Snd.ensure(); primaryAction(); return; }
  if(e.repeat) return;
  if(c==='KeyR'){ Snd.ensure(); if(state!=='dying') startGame(); }
  else if(c==='KeyP'||c==='Escape'){ togglePause(); }
  else if(c==='KeyM'){ Snd.toggle(); }
});
window.addEventListener('pointerdown',e=>{ Snd.ensure();
  if(e.target&&e.target.closest&&e.target.closest('button')) return; primaryAction(); });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{ if(state==='play') togglePause(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') togglePause(); });
window.addEventListener('resize',resize);

function bindBtn(id,fn){ $(id).addEventListener('click',e=>{ e.stopPropagation(); e.currentTarget.blur(); Snd.ensure(); fn(); }); }
bindBtn('btnStart',startGame);
bindBtn('btnRestart',startGame);
bindBtn('btnResume',resumeGame);

/* ---------- go ---------- */
resize();
player.y=floorY-player.r;
$('startBest').textContent=best;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
