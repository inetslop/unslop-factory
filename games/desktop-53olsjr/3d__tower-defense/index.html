<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prism Bastion — 3D Tower Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b1220}
body{font-family:ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,monospace;color:#dfe9f5;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}
.disp{font-family:'Arial Black',Impact,'Franklin Gothic Bold','Trebuchet MS',sans-serif}

/* ---------- HUD ---------- */
#hud{position:fixed;top:10px;left:12px;display:flex;gap:8px;z-index:5;flex-wrap:wrap;max-width:70vw}
.chip{background:rgba(9,14,26,.8);border:1px solid rgba(140,170,220,.22);padding:6px 11px;font-size:11px;letter-spacing:.08em;display:flex;gap:8px;align-items:center;color:#9fb3d1;
clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chip b{font-size:14px;letter-spacing:.04em;color:#eaf2ff}
.dot{width:8px;height:8px;transform:rotate(45deg);flex:none}
#chipMoney b{color:#ffb347}.dot.m{background:#ffb347;box-shadow:0 0 8px #ffb347}
#chipCore b{color:#ff6b7a}.dot.c{background:#ff5d6c;box-shadow:0 0 8px #ff5d6c}
#chipWave b{color:#7fd4ff}.dot.w{background:#7fd4ff;box-shadow:0 0 8px #7fd4ff}
.dot.s{background:#eaf2ff}
#sndBtn{cursor:pointer;background:none;border:none;color:#8fa5c4;font:inherit;letter-spacing:.1em;padding:0 2px}
#sndBtn:hover{color:#ffd9a0}

/* ---------- SHOP ---------- */
#shop{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;z-index:5;align-items:stretch;max-width:96vw}
.card{width:94px;background:rgba(13,20,36,.85);border:1px solid rgba(140,170,220,.25);padding:9px 6px 8px;text-align:center;cursor:pointer;position:relative;
transition:transform .12s,border-color .12s,box-shadow .12s,opacity .2s;
clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.card:hover{transform:translateY(-3px);border-color:#7fd4ff}
.card.sel{border-color:#ffb347;box-shadow:0 0 0 1px #ffb347,0 8px 22px rgba(255,179,71,.28);transform:translateY(-4px)}
.card.off{opacity:.42}
.card .ic{width:26px;height:26px;margin:2px auto 6px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.75),transparent 42%),var(--c);box-shadow:0 0 14px var(--c)}
.card .nm{font-size:9.5px;letter-spacing:.1em;color:#c6d6ea}
.card .cost{font-size:12px;color:#ffb347;margin-top:3px;font-weight:bold}
.card .key{position:absolute;top:4px;left:6px;font-size:9px;color:#8fa5c4;border:1px solid #3a4a66;padding:0 4px;line-height:1.5}
#shopBtns{display:flex;flex-direction:column;gap:8px;width:172px}
button.ui{font-family:'Arial Black',Impact,sans-serif;font-size:12px;letter-spacing:.08em;color:#ffd9a0;background:linear-gradient(180deg,#2a3b5e,#1c2942);
border:1px solid rgba(255,179,71,.6);padding:9px 8px;cursor:pointer;transition:transform .1s,box-shadow .15s,border-color .15s;
clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
button.ui:hover:not(:disabled){transform:translateY(-2px);border-color:#ffb347;box-shadow:0 6px 18px rgba(255,179,71,.25)}
button.ui:active:not(:disabled){transform:translateY(1px)}
button.ui:disabled{opacity:.45;cursor:default}
#waveBtn.ready{animation:pulse 1.2s infinite;border-color:#ffb347;color:#ffe9c9}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,179,71,.55)}55%{box-shadow:0 0 0 9px rgba(255,179,71,0)}}
#pauseBtn{font-size:14px;padding:5px}

/* ---------- TOWER PANEL ---------- */
#tpanel{position:fixed;right:12px;top:60px;width:216px;z-index:5;background:rgba(10,16,30,.9);border:1px solid rgba(255,179,71,.4);padding:12px 12px 12px;display:none;
clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#tpanel.show{display:block}
#tpanel h4{font-family:'Arial Black',Impact,sans-serif;font-size:13px;letter-spacing:.12em;color:#ffd9a0;margin-bottom:8px}
.pips{display:flex;gap:6px;margin-bottom:10px}
.pip{width:10px;height:10px;transform:rotate(45deg);background:#22304c;border:1px solid #3d5478}
.pip.on{background:#ffb347;border-color:#ffd9a0;box-shadow:0 0 8px #ffb347}
.srow{display:flex;justify-content:space-between;font-size:11px;color:#9fb3d1;padding:3px 0;border-bottom:1px dashed rgba(140,170,220,.15)}
.srow b{color:#eaf2ff}
#tpanel .btns{display:flex;gap:8px;margin-top:10px}
#tpanel .btns button{flex:1;font-size:10.5px;padding:7px 4px}
#sellBtn{border-color:rgba(255,93,108,.6);color:#ff9aa5;background:linear-gradient(180deg,#4a2230,#2b1420)}

/* ---------- BANNER / TOAST ---------- */
#banner{position:fixed;top:16%;left:0;right:0;text-align:center;z-index:4;pointer-events:none;font-family:'Arial Black',Impact,sans-serif;
font-size:clamp(26px,5vw,46px);letter-spacing:.2em;color:#ffe9c9;opacity:0;
text-shadow:0 3px 0 rgba(120,40,10,.6),0 0 28px rgba(255,179,71,.55)}
#banner.show{animation:ban 2.2s ease forwards}
@keyframes ban{0%{opacity:0;transform:translateY(-16px) scale(.94)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(8px);z-index:6;background:rgba(13,20,36,.92);border:1px solid rgba(255,179,71,.4);
color:#ffe9c9;font-size:12px;letter-spacing:.06em;padding:8px 16px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- OVERLAY ---------- */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;overflow:auto;
background:radial-gradient(ellipse at 50% 40%,rgba(13,20,38,.6),rgba(5,8,16,.93) 78%)}
#overlay.hidden{display:none}
#overlay::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);pointer-events:none}
.ov-inner{max-width:780px;width:min(94vw,780px);text-align:center;padding:26px 14px;position:relative;margin:auto}
.kicker{font-size:11px;letter-spacing:.45em;color:#7fd4ff;margin-bottom:12px}
.title{font-family:'Arial Black',Impact,sans-serif;font-size:clamp(40px,8.5vw,78px);line-height:.92;transform:skewX(-6deg);color:#fff;
text-shadow:0 4px 0 #7a3b12,0 9px 0 rgba(0,0,0,.35),0 0 36px rgba(255,179,71,.4)}
.title span{display:block;color:#ffb347}
.tag{margin:16px auto 22px;max-width:54ch;font-size:12.5px;line-height:1.7;color:#a8bcd8}
.cols{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:26px;text-align:left}
.col{background:rgba(10,17,32,.72);border:1px solid rgba(140,170,220,.18);padding:14px 16px;flex:1 1 270px;max-width:352px;
clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.col h3{font-size:10.5px;letter-spacing:.32em;color:#7fd4ff;margin-bottom:10px}
.col ul{list-style:none;font-size:11.5px;line-height:2.05;color:#c6d6ea}
.k{display:inline-block;border:1px solid #46587a;background:#182338;padding:0 6px;font-size:9.5px;color:#ffe9c9;margin-right:6px;letter-spacing:.05em}
.trow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#c6d6ea;line-height:2}
.dmd{width:12px;height:12px;transform:rotate(45deg);flex:none;background:var(--c);box-shadow:0 0 9px var(--c)}
.trow em{font-style:normal;color:#ffb347;margin-left:auto;font-weight:bold}
.threats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:#9fb3d1}
.bigbtn{font-family:'Arial Black',Impact,sans-serif;font-size:17px;letter-spacing:.14em;color:#241505;background:linear-gradient(180deg,#ffd27a,#ff9c2e);
border:none;padding:15px 46px;cursor:pointer;transition:transform .1s,box-shadow .15s;
clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);box-shadow:0 6px 24px rgba(255,156,46,.35)}
.bigbtn:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(255,156,46,.55)}
.bigbtn:active{transform:translateY(1px)}
.ghost{background:none;border:1px solid #46587a;color:#9fb3d1;font-family:'Arial Black',Impact,sans-serif;letter-spacing:.12em;padding:15px 26px;cursor:pointer;font-size:13px;transition:border-color .15s,color .15s}
.ghost:hover{border-color:#7fd4ff;color:#dfe9f5}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.best{margin-top:18px;font-size:10.5px;letter-spacing:.3em;color:#8fa5c4}
.best b{color:#ffb347;font-size:13px}
.stats{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
.stat{min-width:112px;padding:12px 10px;background:rgba(10,17,32,.72);border:1px solid rgba(140,170,220,.18)}
.stat b{display:block;font-size:22px;color:#ffd9a0;font-family:'Arial Black',Impact,sans-serif}
.stat span{font-size:9.5px;letter-spacing:.22em;color:#8fa5c4}
.newbest{color:#7fd4ff!important;animation:pulse2 1s infinite}
@keyframes pulse2{50%{opacity:.4}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div class="chip" id="chipMoney"><span class="dot m"></span>CREDITS <b id="hMoney">140</b></div>
  <div class="chip" id="chipCore"><span class="dot c"></span>CORE <b id="hLives">20</b></div>
  <div class="chip"><span class="dot w"></span>WAVE <b id="hWave">–/20</b></div>
  <div class="chip"><span class="dot s"></span>SCORE <b id="hScore">000000</b></div>
  <div class="chip"><button id="sndBtn" title="toggle sound (M)">SND ON</button></div>
</div>

<div id="shop">
  <div class="card" data-t="blaster" style="--c:#5fe8ff"><span class="key">1</span><div class="ic"></div><div class="nm">PULSE GUN</div><div class="cost">$50</div></div>
  <div class="card" data-t="cannon"  style="--c:#ffb347"><span class="key">2</span><div class="ic"></div><div class="nm">MORTAR</div><div class="cost">$90</div></div>
  <div class="card" data-t="frost"   style="--c:#a8e0ff"><span class="key">3</span><div class="ic"></div><div class="nm">CRYO FIELD</div><div class="cost">$70</div></div>
  <div class="card" data-t="tesla"   style="--c:#f6e75a"><span class="key">4</span><div class="ic"></div><div class="nm">ARC COIL</div><div class="cost">$140</div></div>
  <div id="shopBtns">
    <button class="ui" id="waveBtn">STANDBY</button>
    <button class="ui" id="pauseBtn">❚❚ PAUSE</button>
  </div>
</div>

<div id="tpanel"></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="overlay"></div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,FOCAL=600,CX=0,CY=0,vigG=null;
const FOV=0.93;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);FOCAL=(H*0.5)/Math.tan(FOV/2);CX=W/2;CY=H*0.44;
 vigG=ctx.createRadialGradient(CX,CY,Math.min(W,H)*0.42,CX,CY,Math.max(W,H)*0.78);
 vigG.addColorStop(0,'rgba(5,9,18,0)');vigG.addColorStop(1,'rgba(3,6,14,.55)');}
window.addEventListener('resize',resize);resize();

const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){return[a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];}

/* ============================== MAP ============================== */
const GRID=12;
const WPS=[[-1,2.5],[9.5,2.5],[9.5,6.5],[3.5,6.5],[3.5,9.5],[13,9.5]];
const PATHSET=new Set();
(function(){function seg(c1,r1,c2,r2){if(c1===c2){for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)PATHSET.add(c1+','+r);}else{for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)PATHSET.add(c+','+r1);}}
 seg(0,2,9,2);seg(9,2,9,6);seg(3,6,9,6);seg(3,6,3,9);seg(3,9,11,9);})();
const SEGS=[];let PLEN=0;
for(let i=0;i<WPS.length-1;i++){const a=WPS[i],b=WPS[i+1],len=Math.hypot(b[0]-a[0],b[1]-a[1]);SEGS.push({x:a[0],z:a[1],dx:(b[0]-a[0])/len,dz:(b[1]-a[1])/len,len,cum:PLEN});PLEN+=len;}
function pathPos(d){d=clamp(d,0,PLEN);let s=SEGS[0];for(const g of SEGS){if(d>=g.cum)s=g;else break;}const t=d-s.cum;return{x:s.x+s.dx*t,z:s.z+s.dz*t,ang:Math.atan2(s.dz,s.dx)};}

/* ============================== DATA ============================== */
const TT={
 blaster:{name:'PULSE GUN',cost:50,range:3.2,rate:2.6,dmg:7,col:[95,232,255],kind:'bullet'},
 cannon:{name:'MORTAR',cost:90,range:4.6,rate:0.8,dmg:26,splash:1.35,col:[255,179,71],kind:'shell'},
 frost:{name:'CRYO FIELD',cost:70,range:2.7,pulse:1.25,dmg:4,col:[168,224,255],kind:'frost'},
 tesla:{name:'ARC COIL',cost:140,range:3.4,rate:1.3,dmg:15,col:[246,231,90],kind:'tesla'}};
const DMGM=[1,1.65,2.6],RANGEM=[1,1.12,1.24],RATEM=[1,1.25,1.5];
const ED={
 grunt:{hp:18,spd:1.55,r:0.30,h:0.44,col:[255,93,108],reward:8,dmg:1,name:'SHARD'},
 runner:{hp:13,spd:2.95,r:0.24,h:0.36,col:[255,217,74],reward:9,dmg:1,name:'SPARK'},
 tank:{hp:95,spd:0.95,r:0.42,h:0.62,col:[143,183,255],reward:24,dmg:3,name:'GOLEM'},
 boss:{hp:760,spd:0.78,r:0.62,h:0.95,col:[255,77,240],reward:320,dmg:10,name:'PRIMORDIAL'}};
const TOTAL_WAVES=20;

/* ============================== STATE ============================== */
let state='menu',money=140,lives=20,waveN=0,score=0,kills=0;
let betweenWaves=false,countdown=6,queue=[],spawnT=0,spawnInt=1,hpScale=1,spdScale=1;
let enemies=[],towers=[],bullets=[],shells=[],ringsFx=[],beams=[],parts=[],floats=[];
const occ=new Map();
let buildSel=null,selTower=null,time=0,shake=0,exitFlash=0,hover=null;
let best=getBest(),muted=false,newBestFlag=false,lastHitSfx=0;

function getBest(){try{return +localStorage.getItem('pb_best')||0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem('pb_best',String(v));}catch(e){}}
function getMute(){try{return localStorage.getItem('pb_mute')==='1';}catch(e){return false;}}
function setMuteF(v){try{localStorage.setItem('pb_mute',v?'1':'0');}catch(e){}}

/* ============================== AUDIO ============================== */
let AC=null,master=null,noiseBuf=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
 const len=AC.sampleRate*1;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 // ambient wind
 const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=240;
 const g=AC.createGain();g.gain.value=0.05;src.connect(f);f.connect(g);g.connect(master);src.start();}catch(e){AC=null;}}
function tone(f0,f1,dur,type,vol,when){if(!AC||muted)return;try{const t=AC.currentTime+(when||0);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t);
 o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.06);}catch(e){}}
function nz(dur,vol,freq,q,when){if(!AC||muted)return;try{const t=AC.currentTime+(when||0);
 const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
 const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.06);}catch(e){}}
const SFX={
 click:()=>tone(620,940,0.06,'square',0.1),
 place:()=>{tone(230,140,0.12,'triangle',0.3);nz(0.09,0.14,900,1);},
 invalid:()=>tone(170,110,0.16,'sawtooth',0.18),
 blaster:()=>tone(880,320,0.07,'square',0.085),
 cannonFire:()=>{nz(0.16,0.3,320,0.8);tone(120,55,0.24,'sine',0.45);},
 impact:()=>{nz(0.3,0.45,170,0.7);tone(90,38,0.3,'sine',0.5);shake=Math.max(shake,5);},
 tesla:()=>{nz(0.12,0.22,2500,2);tone(1500,210,0.1,'sawtooth',0.1);},
 frost:()=>{tone(520,790,0.24,'sine',0.09);tone(780,1060,0.3,'sine',0.05,0.06);},
 hit:()=>{if(time-lastHitSfx<0.05)return;lastHitSfx=time;tone(300,180,0.05,'square',0.05);},
 kill:()=>{nz(0.14,0.26,720,1);tone(520,90,0.2,'triangle',0.22);},
 leak:()=>{tone(440,220,0.32,'sawtooth',0.3);tone(330,160,0.32,'sawtooth',0.26,0.12);shake=Math.max(shake,7);},
 wave:()=>{[392,523,659].forEach((f,i)=>tone(f,f*1.01,0.12,'square',0.14,i*0.09));nz(0.2,0.18,220,1,0.28);},
 upgrade:()=>{tone(400,800,0.11,'square',0.18);tone(600,1250,0.13,'square',0.14,0.08);},
 sell:()=>tone(700,300,0.16,'triangle',0.2),
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,0.16,'triangle',0.2,i*0.13));tone(1046,1046,0.6,'sine',0.12,0.7);},
 lose:()=>{[392,311,262,196].forEach((f,i)=>tone(f,f*0.98,0.3,'sawtooth',0.16,i*0.24));}};

/* ============================== CAMERA / PROJECTION ============================== */
const cam={yaw:-0.85,pitch:0.62,dist:15,tx:6,tz:6};
let vEye,vFwd,vRt,vUp;
function updateCam(){const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
 vEye={x:cam.tx+cam.dist*cp*Math.cos(cam.yaw),y:cam.dist*sp,z:cam.tz+cam.dist*cp*Math.sin(cam.yaw)};
 let fx=cam.tx-vEye.x,fy=-vEye.y,fz=cam.tz-vEye.z,fl=Math.hypot(fx,fy,fz);
 vFwd={x:fx/fl,y:fy/fl,z:fz/fl};
 let rx=-vFwd.z,rz=vFwd.x,rl=Math.hypot(rx,rz)||1;vRt={x:rx/rl,y:0,z:rz/rl};
 vUp={x:vRt.y*vFwd.z-vRt.z*vFwd.y,y:vRt.z*vFwd.x-vRt.x*vFwd.z,z:vRt.x*vFwd.y-vRt.y*vFwd.x};}
function proj(x,y,z){const vx=x-vEye.x,vy=y-vEye.y,vz=z-vEye.z;
 const dz=vx*vFwd.x+vy*vFwd.y+vz*vFwd.z;if(dz<0.18)return null;
 const s=FOCAL/dz;return{x:CX+(vx*vRt.x+vy*vRt.y+vz*vRt.z)*s,y:CY-(vx*vUp.x+vy*vUp.y+vz*vUp.z)*s,s};}
function pickCell(mx,my){const dx=(mx-CX)/FOCAL,dy=(CY-my)/FOCAL;

function updateTowers(dt){for(const t of towers){t.flash=Math.max(0,t.flash-dt*6);

  let any=false;for(const e of enemies){const dx=e.x-t.x,dz=e.z-t.z;if(dx*dx+dz*dz<=st.range*st.range){any=true;break;}}
  if(any&&t.cd<=0){t.cd=b.pulse/RATEM[t.lvl-1];ringsFx.push({x:t.x,z:t.z,r:st.range,t:0});
   for(const e of enemies){const dx=e.x-t.x,dz=e.z-t.z;if(dx*dx+dz*dz<=st.range*st.range){e.slowT=1.6+0.25*t.lvl;damage(e,st.dmg,t);}}
   SFX.frost();}continue;}
 // find target: furthest along path in range

 for(const e of enemies){const dx=e.x-t.x,dz=e.z-t.z;if(dx*dx+dz*dz<=r2&&e.dist>bestD){bestD=e.dist;tgt=e;}}
 if(tgt){const want=Math.atan2(tgt.z-t.z,tgt.x-t.x);let dA=want-t.yaw;dA=((dA+Math.PI)%6.283)-Math.PI;if(dA<-Math.PI)dA+=6.283;
  t.yaw+=clamp(dA,-9*dt,9*dt);}
 t.cd-=dt;if(tgt&&t.cd<=0){t.flash=1;t.cd=1/st.rate;
  const mx=t.x+Math.cos(t.yaw)*0.5,mz=t.z+Math.sin(t.yaw)*0.5;
  if(b.kind==='bullet'){bullets.push({x:mx,y:0.47,z:mz,px:mx,py:0.47,pz:mz,tgt,end:{x:tgt.x,z:tgt.z},spd:16,dmg:st.dmg,col:b.col});SFX.blaster();
   puff(mx,0.47,mz,2,b.col,1.2,0.035,0.18,0,true);}
  else if(b.kind==='shell'){const T=0.85,ep=pathPos(tgt.dist+tgt.d.spd*spdScale*(tgt.slowT>0?0.5:1)*T);
   shells.push({x0:mx,z0:mz,y0:0.5,x1:ep.x,z1:ep.z,T,t:0,dmg:st.dmg,splash:st.splash,col:b.col});SFX.cannonFire();}

function update(dt){time+=dt;shake=Math.max(0,shake-22*dt);exitFlash=Math.max(0,exitFlash-dt*1.6);
 if(state==='menu'){cam.yaw+=dt*0.1;}
 if(state!=='playing')return;
 // spawn
 if(queue.length){spawnT-=dt;if(spawnT<=0){spawnEnemy(queue.shift());spawnT=spawnInt*R(0.8,1.25);}}
 // enemies
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.flash=Math.max(0,e.flash-dt*4);
  if(e.slowT>0)e.slowT-=dt;
  const spd=e.d.spd*spdScale*(e.slowT>0?0.5:1);e.dist+=spd*dt;
  if(e.dist>=PLEN){enemies.splice(i,1);leak(e);continue;}
  const p=pathPos(e.dist);const dx=p.x-e.x,dz=p.z-e.z,dd=Math.hypot(dx,dz);
  if(dd>0.35){e.seg=p.ang;e.x+=dx/dd*Math.min(spd*dt,dd);e.z+=dz/dd*Math.min(spd*dt,dd);}else{e.x=p.x;e.z=p.z;}
 }
 // bullets
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.px=b.x;b.py=b.y;b.pz=b.z;
  let ex=b.end.x,ez=b.end.z;if(b.tgt&&enemies.includes(b.tgt)){ex=b.tgt.x;ez=b.tgt.z;b.end={x:ex,z:ez};}
  const dx=ex-b.x,dz=ez-b.z,dd=Math.hypot(dx,dz),step=b.spd*dt;
  if(dd<=step+0.12){if(b.tgt&&enemies.includes(b.tgt))damage(b.tgt,b.dmg);puff(ex,0.4,ez,4,b.col,1.6,0.04,0.25,0,true);bullets.splice(i,1);}
  else{b.x+=dx/dd*step;b.z+=dz/dd*step;}}
 // shells
 for(let i=shells.length-1;i>=0;i--){const s=shells[i];s.t+=dt;
  if(parts.length<420)parts.push({x:s.x0+(s.x1-s.x0)*(s.t/s.T),y:0.5+Math.sin(Math.PI*s.t/s.T)*1.9,z:s.z0+(s.z1-s.z0)*(s.t/s.T),
   vx:R(-0.2,0.2),vy:0.5,vz:R(-0.2,0.2),g:0.6,life:0.5,maxLife:0.5,col:[120,110,100],size:0.05,add:false});
  if(s.t>=s.T){puff(s.x1,0.15,s.z1,22,[255,180,90],3.6,0.08,0.6,-2,true);puff(s.x1,0.1,s.z1,10,[90,80,70],1.4,0.09,0.9,1,false);
   for(let k=enemies.length-1;k>=0;k--){const e=enemies[k],dx=e.x-s.x1,dz=e.z-s.z1,dd2=dx*dx+dz*dz;
    if(dd2<=s.splash*s.splash)damage(e,s.dmg*(1-0.5*Math.sqrt(dd2)/s.splash));}
   SFX.impact();shells.splice(i,1);}}
 updateTowers(dt);
 // fx timers
 for(let i=ringsFx.length-1;i>=0;i--){ringsFx[i].t+=dt;if(ringsFx[i].t>0.45)ringsFx.splice(i,1);}
 for(let i=beams.length-1;i>=0;i--){beams[i].ttl-=dt;if(beams[i].ttl<=0)beams.splice(i,1);}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<0.02){p.y=0.02;p.vy*=-0.3;}}
 for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt;if(floats[i].t>floats[i].dur)floats.splice(i,1);}
 // wave flow
 if(betweenWaves){countdown-=dt;if(countdown<=0)startWave();}
 else if(queue.length===0&&enemies.length===0){
  if(waveN>=TOTAL_WAVES){gameOver(true);return;}
  const bonus=28+waveN*7;money+=bonus;score+=25+waveN*5;

   <li><span class="k">DRAG</span>orbit camera · <span class="k">WHEEL</span>zoom</li>
   <li><span class="k">M-DRAG</span>pan · <span class="k">R-CLICK</span>cancel</li>
   <li><span class="k">1–4</span>pick turret · <span class="k">U</span>upgrade · <span class="k">X</span>sell</li>
   <li><span class="k">N / SPACE</span>call wave early (+bonus)</li>
   <li><span class="k">P</span>pause · <span class="k">M</span>sound</li></ul></div>
  <div class="col"><h3>TURRETS</h3>
   ${TURRETS.map(t=>`<div class="trow"><span class="dmd" style="--c:${hex2css(TT[t[0]].col)}"></span>${t[1]} · ${t[3]}<em>${t[2]}</em></div>`).join('')}
   <h3 style="margin-top:14px">THREATS</h3>
   <div class="threats">${THREATS.map(t=>`<span><span class="dmd" style="--c:${t[0]};display:inline-block;margin-right:6px"></span>${t[1]}</span>`).join('')}</div></div>
 </div>
 <button class="bigbtn" data-act="start">DEPLOY ▸</button>
 <div class="best">BEST SCORE&nbsp;<b id="bestVal">${best}</b></div></div>`;}
function hex2css(c){return `rgb(${c[0]},${c[1]},${c[2]})`;}
function showEnd(win){overlay.classList.remove('hidden');
 const nb=newBestFlag;
 overlay.innerHTML=`<div class="ov-inner">
 <div class="kicker">${win?'TRANSMISSION CLEAR':'SIGNAL LOST'}</div>
 <h1 class="title" style="font-size:clamp(34px,7vw,64px)">${win?'SECTOR<span>SECURED</span>':'CORE<span>BREACHED</span>'}</h1>
 <p class="tag">${win?'All 20 waves shattered against your bastion. The gate holds.':'The swarm overran the breach gate at wave '+waveN+'. Rebuild and try again.'}</p>
 <div class="stats">
  <div class="stat"><b>${waveN}</b><span>${win?'WAVES CLEARED':'WAVE REACHED'}</span></div>
  <div class="stat"><b>${kills}</b><span>KILLS</span></div>
  <div class="stat"><b>${score}</b><span>SCORE</span></div>
  <div class="stat"><b class="${nb?'newbest':''}">${best}${nb?' ★':''}</b><span>BEST${nb?' — NEW!':''}</span></div></div>
 <div class="btnrow"><button class="bigbtn" data-act="retry">${win?'PLAY AGAIN':'RETRY'} ▸</button>
 <button class="ghost" data-act="menu">MENU</button></div></div>`;}
function showPause(){overlay.classList.remove('hidden');
 overlay.innerHTML=`<div class="ov-inner"><div class="kicker">SYSTEMS IDLE</div>
 <h1 class="title" style="font-size:clamp(34px,7vw,60px)">PAUSED</h1>
 <p class="tag">The swarm waits. Your turrets hold their breath.</p>
 <div class="btnrow"><button class="bigbtn" data-act="resume">RESUME ▸</button><button class="ghost" data-act="menu">MENU</button></div></div>`;}
overlay.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;initAudio();SFX.click();
 const a=b.dataset.act;
 if(a==='start'||a==='retry')newGame();
 else if(a==='resume'){state='playing';overlay.classList.add('hidden');}
 else if(a==='menu')showStart();});

/* ============================== FLOW ============================== */
function newGame(){enemies=[];towers=[];bullets=[];shells=[];ringsFx=[];beams=[];parts=[];floats=[];occ.clear();
 money=140;lives=20;waveN=0;score=0;kills=0;betweenWaves=true;countdown=6;queue=[];buildSel=null;deselect();
 newBestFlag=false;state='playing';overlay.classList.add('hidden');refreshPanel();
 toast('Deploy turrets — Wave 1 inbound (N to call early)');}
function gameOver(win){state=win?'victory':'over';
 if(score>best){best=score;setBest(best);newBestFlag=true;}
 win?SFX.win():SFX.lose();showEnd(win);}
function pauseGame(){if(state!=='playing')return;state='paused';showPause();}
function resumeGame(){if(state!=='paused')return;state='playing';overlay.classList.add('hidden');}

/* ============================== INPUT ============================== */
window.addEventListener('keydown',e=>{initAudio();const k=e.key.toLowerCase();
 if(k===' '||k.startsWith('arrow'))e.preventDefault();
 if(k==='enter'){if(state==='menu'||state==='over'||state==='victory')newGame();else if(state==='paused')resumeGame();return;}
 if(k==='m'){toggleMute();return;}
 if(state!=='playing')return;
 if(k>='1'&&k<='4'){const t=Object.keys(TT)[+k-1];buildSel=(buildSel===t?null:t);deselect();SFX.click();}
 else if(k==='escape'){buildSel=null;deselect();}
 else if(k==='u')upgradeTower();
 else if(k==='x')sellTower();
 else if(k==='n'||k===' ')if(betweenWaves)earlyWave();
 else if(k==='p'){pauseGame();}});
function earlyWave(){if(!betweenWaves||state!=='playing')return;const b=Math.floor(countdown)*3;money+=b;
 if(b>0)toast('Early call  +$'+b);startWave();}
waveBtn.addEventListener('click',()=>{initAudio();if(state==='playing'&&betweenWaves)earlyWave();});
pauseBtn.addEventListener('click',()=>{initAudio();SFX.click();state==='playing'?pauseGame():resumeGame();});
document.querySelectorAll('.card').forEach(cd=>cd.addEventListener('click',()=>{initAudio();
 if(state!=='playing')return;const t=cd.dataset.t;buildSel=(buildSel===t?null:t);deselect();SFX.click();}));
function toggleMute(){muted=!muted;setMuteF(muted);if(master)master.gain.value=muted?0:0.5;
 $('sndBtn').textContent=muted?'SND OFF':'SND ON';}
$('sndBtn').addEventListener('click',()=>{initAudio();toggleMute();});

/* pointer handling */
const ptrs=new Map();let drag=null,pinchD=0,panning=false;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{initAudio();cv.setPointerCapture(e.pointerId);
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const a=[...ptrs.values()];pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=null;return;}
 drag={x:e.clientX,y:e.clientY,bx:e.clientX,by:e.clientY,moved:false};panning=(e.button===1);});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);
 if(p){p.x=e.clientX;p.y=e.clientY;}
 if(ptrs.size===2&&pinchD>0){const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(d>0){cam.dist=clamp(cam.dist*pinchD/d,7,26);pinchD=d;}return;}
 if(drag&&ptrs.has(e.pointerId)){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(Math.hypot(e.clientX-drag.bx,e.clientY-drag.by)>7)drag.moved=true;
  if(panning){const k=cam.dist*0.0016,fhx=vFwd.x,fhz=vFwd.z,fl=Math.hypot(fhx,fhz)||1;
   cam.tx=clamp(cam.tx+(-vRt.x*dx+vFwd.x/fl*dy)*k,0.5,GRID-0.5);
   cam.tz=clamp(cam.tz+(-vRt.z*dx+vFwd.z/fl*dy)*k,0.5,GRID-0.5);}
  else{cam.yaw+=dx*0.005;cam.pitch=clamp(cam.pitch-dy*0.005,0.18,1.35);}}
 hover=(state==='playing')?pickCell(e.clientX,e.clientY):null;});
cv.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);pinchD=0;
 if(drag&&!drag.moved&&e.button===0)doClick(e.clientX,e.clientY);
 drag=null;panning=false;});
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinchD=0;drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=clamp(cam.dist*Math.exp(e.deltaY*0.001),7,26);},{passive:false});
function doClick(mx,my){if(state!=='playing')return;const hit=pickCell(mx,my);if(!hit)return;
 const key=hit.c+','+hit.r,existing=occ.get(key);
 if(buildSel){if(existing){selectTower(existing);}
  else if(PATHSET.has(key)){toast('Can\'t build on the road');SFX.invalid();}
  else placeTower(hit.c,hit.r);}
 else{if(existing)selectTower(existing);else deselect();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pauseGame();});

/* ============================== MAIN LOOP ============================== */
muted=getMute();$('sndBtn').textContent=muted?'SND OFF':'SND ON';
showStart();
let last=performance.now();
function frame(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 updateCam();update(dt);render();hud();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
