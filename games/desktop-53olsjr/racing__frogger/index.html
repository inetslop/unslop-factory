<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Frog Racer</title>
<style>
  :root{
    --lime:#6fd63a; --lime2:#c8ff5e; --gold:#ffd83d; --ink:#0b2410; --panel:#10281a;
    --disp: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
    --body: "Trebuchet MS", Verdana, Tahoma, sans-serif;
    --mono: Consolas, Menlo, "Courier New", monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:#123a1c;}
  body{font-family:var(--body); user-select:none; -webkit-user-select:none; color:#eaffd0;}
  canvas#cv{position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none;}
  .disp{font-family:var(--disp); font-style:italic; letter-spacing:.02em;}

  /* ---------- HUD ---------- */
  #hud{position:absolute; top:10px; left:12px; right:12px; z-index:5; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; transition:opacity .3s;}
  #hud.hide{opacity:0;}
  .hcol{display:flex; flex-direction:column; gap:4px;}
  .racedisp{font-family:var(--disp); font-style:italic; font-size:19px; color:var(--lime2); text-shadow:2px 2px 0 rgba(0,0,0,.5);}
  .prog{position:relative; width:min(36vw,320px); height:13px; background:#081a0e; border:2px solid #3f9b2e;}
  #hFill{height:100%; width:0%; background:linear-gradient(90deg,var(--lime),var(--lime2));}
  .flag{position:absolute; right:-3px; top:-8px; width:15px; height:15px; border:1px solid #000;
        background:repeating-conic-gradient(#eee 0 25%, #141414 0 50%) 0 0/7.5px 7.5px;}
  .mono{font-family:var(--mono);}
  .dist{font-size:13px; color:#cfe9c4;}
  .mid{text-align:center;}
  #hRank{font-family:var(--disp); font-style:italic; font-size:42px; line-height:1; color:#fff; text-shadow:3px 3px 0 rgba(0,0,0,.5);}
  #hGap{font-family:var(--mono); font-size:11px; letter-spacing:1px; margin-top:2px;}
  .lbl{font-size:9px; letter-spacing:3px; color:#9fd68f;}
  .right{align-items:flex-end;}
  .chip{display:flex; align-items:center; gap:7px; background:rgba(6,22,12,.75); border:2px solid #3f9b2e; padding:4px 10px;}
  .chip b{font-family:var(--mono); font-size:15px; color:var(--gold);}
  .flydot{width:11px; height:11px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold);}
  .chips{display:flex; gap:5px; padding-top:2px;}
  .life{position:relative; width:19px; height:13px; background:#7ee04a; border-radius:45% 45% 40% 40%; box-shadow:0 2px 0 rgba(0,0,0,.4);}
  .life::before,.life::after{content:""; position:absolute; top:2px; width:4px; height:4px; border-radius:50%; background:#fff;}
  .life::before{left:3px;} .life::after{right:3px;}
  .life.off{background:#274a2b; opacity:.55;}
  .life.off::before,.life.off::after{visibility:hidden;}
  .spd{font-size:12px; color:#cfe9c4;} .spd b{font-size:18px; color:#fff;}
  #hintbar{position:absolute; bottom:8px; left:12px; z-index:5; font-family:var(--mono); font-size:11px; color:rgba(220,255,190,.5); pointer-events:none; transition:opacity .3s;}
  #hintbar.hide{opacity:0;}

  /* ---------- OVERLAY SCREENS ---------- */
  #overlay{position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
           background:radial-gradient(ellipse at center, rgba(6,20,10,.35), rgba(4,14,7,.8));}
  #overlay.hide{display:none;}
  .panel{position:relative; width:min(92vw,540px); max-height:92vh; overflow:auto; background:var(--panel);
         border:3px solid var(--lime); box-shadow:0 0 0 4px #081a0e, 0 16px 0 rgba(0,0,0,.35);
         padding:26px 30px 30px; text-align:center; transform:rotate(-1.2deg); animation:pop .28s ease-out;}
  @keyframes pop{from{transform:scale(.88) rotate(2deg); opacity:0;} to{transform:scale(1) rotate(-1.2deg); opacity:1;}}
  .strip{height:15px; margin:-26px -30px 20px; border-bottom:3px solid #081a0e;
         background:repeating-conic-gradient(#e9e4d4 0 25%, #17251b 0 50%) 0 0/15px 15px;}
  h1.disp{line-height:.92; font-size:clamp(46px,9vw,82px);}
  h1 .t1{display:block; color:#d3ff7a; text-shadow:3px 3px 0 #1c5a26, 6px 6px 0 rgba(0,0,0,.4);}
  h1 .t2{display:block; color:var(--gold); text-shadow:3px 3px 0 #7a5b10, 6px 6px 0 rgba(0,0,0,.4);}
  h2.disp{font-size:clamp(34px,6vw,52px); color:#d3ff7a; text-shadow:3px 3px 0 #1c5a26, 5px 5px 0 rgba(0,0,0,.4);}
  h2.red{color:#ff6b52; text-shadow:3px 3px 0 #6e1d10, 5px 5px 0 rgba(0,0,0,.4);}
  .tag{margin:10px 0 16px; color:#a9d69a; font-size:14px;}
  .ctl{display:flex; flex-direction:column; gap:8px; margin:0 auto 18px; max-width:340px; text-align:left; font-size:13px; color:#cfe9c4;}
  .ctl div{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  kbd{font-family:var(--mono); font-size:12px; background:#081a0e; color:#d8ffb0; border:1px solid #3f9b2e;
      border-bottom-width:3px; border-radius:4px; padding:2px 7px; margin:0 1px;}
  .best{font-size:13px; letter-spacing:2px; color:#a9d69a; margin-bottom:16px;}
  .best b{font-family:var(--mono); font-size:16px; color:var(--gold);}
  .btn{font-family:var(--disp); font-style:italic; font-size:20px; letter-spacing:.04em; background:var(--lime); color:var(--ink);
       border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); padding:12px 24px; cursor:pointer; transition:transform .06s, box-shadow .06s, background .15s;}
  .btn:hover{background:#8bf05a;}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ink);}
  .btn.big{font-size:23px; margin-top:4px;}
  .btn.alt{background:var(--gold);}
  .btn.alt:hover{background:#ffe571;}
  .btnrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px;}
  .hint{margin-top:14px; font-size:11.5px; color:#8fbf80; line-height:1.7;}
  .hint b{color:var(--lime2);}
  .stat{display:flex; justify-content:space-between; padding:7px 4px; border-bottom:1px dashed rgba(140,220,120,.3); font-size:13.5px; color:#cfe9c4;}
  .stat b{font-family:var(--mono); font-size:15px; color:#eaffd0;}
  .scorebox{margin:16px 0 4px;}
  .scorelbl{font-size:10px; letter-spacing:4px; color:#9fd68f;}
  .score{font-family:var(--disp); font-style:italic; font-size:46px; color:var(--gold); text-shadow:3px 3px 0 rgba(0,0,0,.45);}
  .newbest{display:inline-block; margin:8px auto 2px; background:#ff5340; color:#fff; font-family:var(--disp); font-style:italic;
           padding:4px 14px; transform:rotate(-3deg); box-shadow:0 3px 0 #7c1a0e; animation:pulse 1s infinite alternate;}
  @keyframes pulse{from{transform:rotate(-3deg) scale(1);} to{transform:rotate(-3deg) scale(1.08);}}
  .rankbadge{width:96px; height:96px; margin:4px auto 10px; border-radius:50%; border:4px solid currentColor;
             display:grid; place-items:center; font-family:var(--disp); font-style:italic; font-size:52px; background:rgba(0,0,0,.28);}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div class="hcol">
    <div class="racedisp">RACE <span id="hRace">1</span></div>
    <div class="prog"><div id="hFill"></div><span class="flag"></span></div>
    <div class="mono dist" id="hDist">0 / 1200 m</div>
  </div>
  <div class="mid">
    <div id="hRank">#4</div>
    <div id="hGap">GAP −10 M</div>
    <div class="lbl">POSITION</div>
  </div>
  <div class="hcol right">
    <div class="chip"><span class="flydot"></span><b id="hFly">0</b></div>
    <div class="chips" id="hLives"><span class="life"></span><span class="life"></span><span class="life"></span></div>
    <div class="mono spd"><b id="hSpd">0</b> km/h</div>
  </div>
</div>
<div id="hintbar" class="hide">P PAUSE · R RESTART · M SOUND</div>
<div id="overlay"></div>

<script>
(()=>{ 'use strict';
/* ============================== SETUP / DOM ============================== */
const cvs=document.getElementById('cv'), ctx=cvs.getContext('2d');
const hud=document.getElementById('hud'), hintbar=document.getElementById('hintbar'), overlay=document.getElementById('overlay');
const hRace=document.getElementById('hRace'), hDist=document.getElementById('hDist'), hFill=document.getElementById('hFill'),
      hRank=document.getElementById('hRank'), hGap=document.getElementById('hGap'), hFly=document.getElementById('hFly'),
      hSpd=document.getElementById('hSpd'), lifeEls=[...document.querySelectorAll('#hLives .life')];

const LANES=5, PXPM=26, RACE_M=1200, JUMP_DUR=0.62, HJ=92;
let W=0,H=0,dpr=1, roadX=0, roadW=0, LANEW=0, playerY=0, vig=null;

function resize(){
  dpr=Math.min(2, window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=W*dpr; cvs.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  roadW=Math.max(300, Math.min(W*0.66, 560)); roadX=(W-roadW)/2; LANEW=roadW/LANES; playerY=H*0.78;
  vig=ctx.createRadialGradient(W/2,H*0.55,Math.min(W,H)*0.35, W/2,H*0.55, Math.max(W,H)*0.78);
  vig.addColorStop(0,'rgba(6,18,9,0)'); vig.addColorStop(1,'rgba(4,14,7,0.55)');
}
window.addEventListener('resize', resize);

/* ============================== STATE ============================== */
let mode='menu';           // menu | count | play | pause | over
let pausedFrom='play';
let race=1, t=0, cd=0, lastCdInt=9, goFlash=0, dist=0, v=0;
let shake=0, flash=0, lives=3, flyCount=0, inPud=false;
let obstacles=[], parts=[], floaters=[], ai=[];
let lastWave=26, finishInfo=null, overTimer=0, overShown=false, result=null;
const P={lane:2,x:0,z:0,jump:0,hop:0,invuln:0,slow:0,boost:0,landPop:0};

let best=0; try{ best=parseInt(localStorage.getItem('frogRacerBest')||'0',10)||0; }catch(e){}
function saveBest(s){ if(s>best){ best=s; try{ localStorage.setItem('frogRacerBest',String(best)); }catch(e){} return true;} return false; }

const AIPAL=[
  {name:'BLAZE', c1:'#ff8a3d', c2:'#b34f16', lane:0},
  {name:'MOSS',  c1:'#2fd4c5', c2:'#128a81', lane:1},
  {name:'SILT',  c1:'#b9a7ff', c2:'#6f55c9', lane:4}
];
const RANKCOL=['#ffd83d','#e6ecf5','#e0a468','#aab5ac'];

/* ============================== HELPERS ============================== */
const lerp=(a,b,x)=>a+(b-a)*x;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const smooth=x=>x*x*(3-2*x);
const laneX=l=>roadX+(l+0.5)*LANEW;
function hsh(n){ n=(n^61)^(n>>>16); n=(n+(n<<3))|0; n^=n>>>4; n=Math.imul(n,0x27d4eb2d); n^=n>>>15; return (n>>>0)/4294967295; }
function E(x,y,rx,ry,rot){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2); ctx.fill(); }
function rr(x,y,w,h,r){ ctx.beginPath();
  if(ctx.roundRect){ ctx.roundRect(x,y,w,h,r); } else {
    r=Math.min(r,w/2,h/2);
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  ctx.fill(); }

/* ============================== AUDIO (Web Audio, post-gesture) ============================== */
let AC=null, master=null, windG=null, muted=false;
function audio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=muted?0:0.55; master.connect(AC.destination);
  const len=AC.sampleRate, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=520; f.Q.value=0.6;
  windG=AC.createGain(); windG.gain.value=0;
  src.connect(f); f.connect(windG); windG.connect(master); src.start();
}
function tone(f0,f1,dur,type,vol,when){
  if(!AC) return; const o=AC.createOscillator(), g=AC.createGain(), tt=AC.currentTime+(when||0);
  o.type=type; o.frequency.setValueAtTime(Math.max(1,f0),tt);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),tt+dur);
  g.gain.setValueAtTime(vol,tt); g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);
  o.connect(g); g.connect(master); o.start(tt); o.stop(tt+dur+0.03);
}
function noiseBurst(dur,vol,freq,when){
  if(!AC) return; const n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.value=vol; const tt=AC.currentTime+(when||0);
  s.connect(f); f.connect(g); g.connect(master); s.start(tt);
}
const sfx={
  hop(){ tone(340,560,0.09,'square',0.16); },
  jump(){ tone(250,720,0.18,'square',0.18); },
  land(){ tone(180,88,0.07,'triangle',0.12); },
  fly(){ tone(880,880,0.06,'sine',0.2); tone(1318,1318,0.1,'sine',0.2,0.06); },
  hit(){ noiseBurst(0.18,0.4,700); tone(150,52,0.26,'sawtooth',0.32); },
  count(){ tone(740,740,0.09,'square',0.2); },
  go(){ tone(740,1480,0.3,'square',0.22); },
  finish(){ [523,659,784,1046].forEach((f,i)=>tone(f,f,0.17,'square',0.18,i*0.09)); noiseBurst(0.4,0.12,2800,0.32); },
  click(){ tone(500,720,0.05,'triangle',0.14); }
};

/* ============================== OVERLAY PANELS ============================== */
function showOverlay(html){ overlay.innerHTML=html; overlay.classList.remove('hide'); }
function hideOverlay(){ overlay.classList.add('hide'); }
function setHUD(on){ hud.classList.toggle('hide',!on); hintbar.classList.toggle('hide',!on); }

function panelMenu(){
  return `<div class="panel"><div class="strip"></div>
    <h1 class="disp"><span class="t1">FROG</span><span class="t2">RACER</span></h1>
    <p class="tag">Hop the highway · dodge the traffic · beat the pack</p>
    <div class="ctl">
      <div><span><kbd>←</kbd> <kbd>→</kbd></span><span>change lane</span></div>
      <div><span><kbd>SPACE</kbd> / <kbd>↑</kbd></span><span>bunny-hop over traffic &amp; flies</span></div>
      <div><span><kbd>P</kbd></span><span>pause</span></div>
      <div><span><kbd>M</kbd></span><span>sound on / off</span></div>
    </div>
    ${best>0?`<p class="best">BEST SCORE&nbsp; <b>${best}</b></p>`:''}
    <button class="btn big" data-act="start">START RACE ${race} — ENTER</button>
    <p class="hint">touch: tap left / right edge to hop · tap the middle to jump<br>sound: <b id="sndOn">${muted?'OFF':'ON'}</b></p>
  </div>`;
}
function panelPause(){
  return `<div class="panel"><div class="strip"></div>
    <h2 class="disp">PAUSED</h2>
    <p class="tag">Race ${race} · ${Math.floor(dist)} m of ${RACE_M} m</p>
    <div class="btnrow">
      <button class="btn" data-act="resume">RESUME — P</button>
      <button class="btn alt" data-act="retry">RESTART — R</button>
      <button class="btn" data-act="menu">QUIT TO MENU</button>
    </div></div>`;
}
function panelOver(){
  const fin=finishInfo && !finishInfo.dnf;
  let h=`<div class="panel"><div class="strip"></div>`;
  if(fin){
    const rt=['WINNER!','2ND PLACE','3RD PLACE','LAST — BUT YOU FINISHED'][result.rank-1];
    h+=`<h2 class="disp">FINISH!</h2>
        <div class="rankbadge" style="color:${RANKCOL[result.rank-1]}">#${result.rank}</div>
        <p class="tag">${rt}</p>
        <div class="stat"><span>RACE TIME</span><b>${result.time.toFixed(1)} s</b></div>
        <div class="stat"><span>FLIES CAUGHT × ${flyCount}</span><b>+${flyCount*25}</b></div>
        <div class="stat"><span>RANK BONUS</span><b>+${result.rb}</b></div>
        <div class="stat"><span>TIME BONUS</span><b>+${result.tb}</b></div>`;
  } else {
    h+=`<h2 class="disp red">WRECKED!</h2>
        <p class="tag">Out of lives — the pack is gone.</p>
        <div class="stat"><span>DISTANCE</span><b>${Math.floor(dist)} m</b></div>
        <div class="stat"><span>FLIES CAUGHT × ${flyCount}</span><b>+${flyCount*25}</b></div>`;
  }
  h+=`<div class="scorebox"><div class="scorelbl">SCORE</div><div class="score">${result.score}</div></div>
      ${result.nb?'<p class="newbest">NEW BEST!</p>':''}`;
  if(fin) h+=`<div class="btnrow" style="margin-top:14px">
      <button class="btn big" data-act="next">NEXT RACE — ENTER</button>
      <button class="btn" data-act="menu">MENU</button></div>`;
  else h+=`<div class="btnrow" style="margin-top:14px">
      <button class="btn big alt" data-act="retry">RETRY — R / ENTER</button>
      <button class="btn" data-act="menu">MENU</button></div>`;
  h+=`<p class="hint">best score: <b>${best}</b></p></div>`;
  return h;
}

/* ============================== GAME FLOW ============================== */
function setup(n){
  race=n; t=0; cd=3.4; lastCdInt=9; goFlash=0; dist=0; v=0;
  obstacles=[]; parts=[]; floaters=[]; lives=3; flyCount=0; shake=0; flash=0; inPud=false;
  finishInfo=null; overTimer=0; overShown=false; result=null; lastWave=26;
  P.lane=2; P.x=laneX(2); P.z=0; P.jump=0; P.hop=0; P.invuln=0; P.slow=0; P.boost=0; P.landPop=0;
  const base=[78,88,99], mult=Math.pow(0.965,n-1), offs=[70,36,10];
  ai=AIPAL.map((a,i)=>({name:a.name,c1:a.c1,c2:a.c2,lane:a.lane,x:laneX(a.lane),T:base[i]*mult+(Math.random()*3-1.5),p0:offs[i],p:offs[i],hopT:2+Math.random()*3,i}));
  mode='count'; hideOverlay(); setHUD(true); hRace.textContent=race;
}
function toMenu(){
  mode='menu'; obstacles=[]; parts=[]; floaters=[]; ai=[]; dist=0; v=0;
  P.lane=2; P.x=laneX(2); P.z=0; P.jump=0; P.landPop=0; P.invuln=0;
  setHUD(false); showOverlay(panelMenu());
}
function pauseGame(){ if(mode!=='play'&&mode!=='count')return; pausedFrom=mode; mode='pause'; showOverlay(panelPause()); }
function resumeGame(){ if(mode!=='pause')return; mode=pausedFrom; hideOverlay(); }
function retryOrNext(){ if(finishInfo && !finishInfo.dnf) setup(race+1); else setup(race); }

overlay.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  audio(); sfx.click();
  if(b){ b.blur(); const a=b.dataset.act;
    if(a==='start') setup(race);
    else if(a==='retry') setup(race);
    else if(a==='next') setup(race+1);
    else if(a==='menu') toMenu();
    else if(a==='resume') resumeGame();
  } else {
    if(mode==='menu') setup(race);
    else if(mode==='over'&&overShown) retryOrNext();
  }
});

/* ============================== INPUT ============================== */
function hopLane(dir){
  if(mode!=='play') return;
  const nl=clamp(P.lane+dir,0,LANES-1);
  if(nl!==P.lane){ P.lane=nl; P.hop=1; sfx.hop(); }
}
function jump(){
  if(mode!=='play'||P.jump>0) return;
  P.jump=0.0001; sfx.jump();
}
window.addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k)) e.preventDefault();
  audio();
  if(e.repeat) return;
  if(k==='m'||k==='M'){ muted=!muted; if(master) master.gain.value=muted?0:0.55; const s=document.getElementById('sndOn'); if(s) s.textContent=muted?'OFF':'ON'; return; }
  if(mode==='menu' && (k==='Enter'||k===' ')){ setup(race); return; }
  if(mode==='over' && overShown){ if(k==='Enter'||k==='r'||k==='R') retryOrNext(); else if(k==='Escape'||k==='p'||k==='P') toMenu(); return; }
  if(mode==='pause'){ if(k==='p'||k==='P'||k==='Escape'||k==='Enter') resumeGame(); else if(k==='r'||k==='R') setup(race); else if(k==='q'||k==='Q') toMenu(); return; }
  if(mode==='play'||mode==='count'){
    if(k==='p'||k==='P'||k==='Escape'){ pauseGame(); return; }
    if((k==='r'||k==='R')&&mode==='play'){ setup(race); return; }
    if(mode!=='play') return;
    if(k==='ArrowLeft'||k==='a'||k==='A') hopLane(-1);
    else if(k==='ArrowRight'||k==='d'||k==='D') hopLane(1);
    else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ') jump();
  }
});
window.addEventListener('pointerdown',e=>{
  audio();
  if(e.target.closest && e.target.closest('#overlay')) return; // buttons handle it
  if(mode==='menu'){ setup(race); return; }
  if(mode==='over'&&overShown){ retryOrNext(); return; }
  if(mode!=='play') return;
  const x=e.clientX/W;
  if(x<0.34) hopLane(-1); else if(x>0.66) hopLane(1); else jump();
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&(mode==='play'||mode==='count')) pauseGame(); });

/* ============================== SPAWNING ============================== */
const dNow=()=>Math.min(1, 0.32*(race-1) + (dist/RACE_M)*0.75);
function waveGapM(){ return lerp(9,4.6,dNow())+Math.random()*2.2; }
function mkObs(type,l,y,dd){
  const o={type,lane:l,laneF:l,y};
  if(type==='beetle'){ o.w=LANEW*0.46; o.ph=Math.random()*6.28; o.amp=0.22+dd*0.18; }
  else if(type==='tire'){ o.w=LANEW*0.74; o.rot=Math.random()*6.28; }
  else if(type==='log'){ const lf=l<4?l+1:l-1; o.laneF=lf; o.w=LANEW*2-14; }
  else if(type==='pud'){ o.w=LANEW*1.5; o.ph=Math.random()*6.28; }
  else { o.w=30; o.ph=Math.random()*6.28; } // fly / flyAir
  return o;
}
function spawnWave(y){
  const dd=dNow();
  const order=[0,1,2,3,4].sort(()=>Math.random()-0.5);
  const occ=new Set(); let added=0;
  const want=1 + (Math.random()>0.78-dd*0.25?1:0) + (dd>0.5&&Math.random()>0.88?1:0);
  for(const l of order){
    if(added>=want) break; if(occ.has(l)) continue;
    const r=Math.random(); let type = r<0.20+0.2*dd ? 'log' : (r<0.62?'tire':'beetle');
    if(type==='log'){ const l2=l<4?l+1:l-1; if(occ.has(l2)) type='tire'; else occ.add(l2); }
    occ.add(l); obstacles.push(mkObs(type,l,y,dd)); added++;
  }
  if(Math.random()<0.65){
    const free=[0,1,2,3,4].filter(l=>!occ.has(l));
    if(free.length){ const l=free[Math.floor(Math.random()*free.length)];
      obstacles.push(mkObs(Math.random()<0.42?'flyAir':'fly', l, y+(Math.random()*50-25), dd)); }
  }
  if(Math.random()<0.38){
    const free=[0,1,2,3,4].filter(l=>!occ.has(l));
    if(free.length){ const l=free[Math.floor(Math.random()*free.length)];
      obstacles.push(mkObs('pud',l,y+70,dd)); }
  }
}

/* ============================== PARTICLES / FLOATERS ============================== */
function addPart(p){ if(parts.length<320) parts.push(p); }
function burst(x,y,n,kind,col){
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=40+Math.random()*160;
    addPart({t:kind,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(kind==='drop'?-40:0),life:0.5+Math.random()*0.4,max:0.9,col,r:2+Math.random()*3,rot:Math.random()*6.28,vr:(Math.random()-0.5)*10}); }
}
function confetti(){
  const cols=['#ffd83d','#7ee04a','#ff8a3d','#2fd4c5','#ffffff'];
  for(let i=0;i<70;i++) addPart({t:'conf',x:roadX+Math.random()*roadW,y:-20-Math.random()*120,vx:(Math.random()-0.5)*60,vy:60+Math.random()*120,life:2.4,max:2.4,col:cols[i%5],r:3,rot:Math.random()*6.28,vr:(Math.random()-0.5)*12});
}
function floater(x,y,txt){ floaters.push({x,y,txt,life:0.9}); }

/* ============================== HIT / CATCH ============================== */
function hit(o){
  lives--; P.invuln=2; P.slow=1.5; shake=13; flash=0.5; sfx.hit();
  burst(P.x,playerY,10,'leaf','#4fae3a'); burst(P.x,playerY,6,'dot','#cfc79b');
  if(o.type==='beetle'){ o.dead=true; burst(o.x||laneX(o.laneF),o.y,8,'dot','#3b2a1e'); }
  floater(P.x,playerY-40,'OUCH!');
  if(lives<=0){ finishInfo={dnf:true}; result={score:flyCount*25+Math.floor(dist/10),dnf:true,nb:false}; mode='over'; overTimer=1.0; }
}
function catchFly(o){
  o.dead=true; flyCount++; P.boost=2.1; sfx.fly();
  burst(o.x||laneX(o.laneF),o.y,8,'spark','#ffd83d'); floater(P.x,playerY-46,'+25');
}

/* ============================== UPDATE ============================== */
function update(dt){
  goFlash=Math.max(0,goFlash-dt);
  shake*=Math.pow(0.001,dt); if(shake<0.3) shake=0;
  flash=Math.max(0,flash-dt*1.6);
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=(p.vr||0)*dt;
    if(p.t==='drop') p.vy+=500*dt; if(p.t==='conf'){ p.vy+=80*dt; p.vx*=0.995; }
    if(p.t==='leaf'||p.t==='dot') p.vy+=240*dt;
  }
  for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.life-=dt; f.y-=34*dt; if(f.life<=0) floaters.splice(i,1); }

  if(mode==='menu'){ t+=dt; dist+=3.5*dt; return; }

  if(mode==='count'){
    cd-=dt;
    const n=Math.ceil(cd);
    if(n<lastCdInt){ lastCdInt=n; if(n>=1&&n<=3) sfx.count(); }
    if(cd<=0){ mode='play'; goFlash=0.85; sfx.go(); }
    return;
  }

  if(mode==='pause') return;

  t+=dt;
  if(mode==='over'){ v*=Math.pow(0.04,dt); dist+=v*PXPM*dt/PXPM; }
  else {
    const V0=Math.min(14,10+(race-1)*0.7), V1=Math.min(23,15.5+(race-1)*0.9);
    let base=V0+(V1-V0)*smooth(Math.min(1,t/42));
    if(P.slow>0){ P.slow-=dt; base*=0.5; }
    if(P.boost>0){ P.boost-=dt; base*=1.3; }
    if(inPud) base*=0.85;
    v=base; dist+=v*dt;
  }

  // player movement
  const tx=laneX(P.lane);
  P.x+=(tx-P.x)*(1-Math.exp(-dt*22));
  if(P.hop>0) P.hop=Math.max(0,P.hop-dt/0.15);
  if(P.landPop>0) P.landPop=Math.max(0,P.landPop-dt/0.18);
  if(P.jump>0){ P.jump+=dt/JUMP_DUR;
    if(P.jump>=1){ P.jump=0; P.landPop=1; sfx.land();
      burst(P.x,playerY,4,'dot','#b9c7a6'); } }
  P.z=P.jump>0?4*P.jump*(1-P.jump):0;
  if(P.invuln>0) P.invuln-=dt;

  // obstacles: drift + scroll + cull
  for(const o of obstacles){
    o.y+=v*PXPM*dt;
    if(o.type==='beetle') o.laneF=o.lane+Math.sin(t*1.5+o.ph)*o.amp, o.x=laneX(o.laneF);
    else if(o.type==='fly'||o.type==='flyAir') o.laneF=o.lane+Math.sin(t*2.2+o.ph)*0.18, o.x=laneX(o.laneF);
    else o.x=laneX(o.laneF);
    if(o.type==='tire') o.rot+=(v*PXPM*dt)/(o.w/2);
  }
  obstacles=obstacles.filter(o=>!o.dead && o.y<H+160);

  // spawn ahead (world-space density)
  if(mode==='play'){ const aheadM=(playerY+90)/PXPM;
    while(lastWave<dist+aheadM){ spawnWave(playerY-(lastWave-dist)*PXPM); lastWave+=waveGapM(); } }

  // collisions
  inPud=false;
  for(const o of obstacles){
    const dy=o.y-playerY; if(dy<-60||dy>60) continue;
    const overlap=Math.abs(o.x-P.x)<(o.w/2+12-4);
    if(!overlap) continue;
    if(o.type==='fly'||o.type==='flyAir'){
      const need=(o.type==='flyAir')?P.z>0.48:P.z<0.35;
      if(need){ catchFly(o); }
    } else if(o.type==='pud'){ if(P.z<0.18){ inPud=true; if(Math.random()<dt*9) burst(P.x,playerY+8,1,'drop','#7cc4ee'); } }
    else {
      const th=o.type==='log'?0.62:0.42;
      if(P.z<th && P.invuln<=0) hit(o);
    }
  }

  // AI racers
  for(const a of ai){
    a.p=a.p0+(RACE_M-a.p0)*Math.min(1,t/a.T);
    a.hopT-=dt; if(a.hopT<0){ a.hopT=2+Math.random()*3; a.lane=clamp(a.lane+(Math.random()<0.5?-1:1),0,LANES-1); }
    a.x+=(laneX(a.lane)-a.x)*(1-Math.exp(-dt*6));
  }

  // finish line
  if(mode==='play' && dist>=RACE_M){
    const ft=t, rank=1+ai.filter(a=>a.p>=RACE_M).length;
    const rb=[500,300,150,50][rank-1]||0, par=(ai[0].T+ai[2].T)/2;
    const tb=Math.max(0,Math.round((par-ft)*8));
    finishInfo={time:ft,rank};
    result={score:1000+rb+flyCount*25+tb, time:ft, rank, rb, tb, nb:false};
    mode='over'; overTimer=1.4; sfx.finish(); confetti(); shake=6;
  }

  if(mode==='over'){
    overTimer-=dt;
    if(overTimer<=0 && !overShown){ overShown=true; result.nb=saveBest(result.score); showOverlay(panelOver()); }
  }

  // wind volume
  if(windG&&AC) windG.gain.setTargetAtTime(mode==='play'?(0.015+(v/24)*0.06):0, AC.currentTime, 0.15);
}

/* ============================== DRAWING ============================== */
function drawFrog(x,y,s,tilt,c1,c2,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt||0); ctx.scale(s,s);
  if(alpha!==undefined) ctx.globalAlpha*=alpha;
  ctx.fillStyle=c2;
  E(-13,10,7.5,5,-0.6); E(13,10,7.5,5,0.6);            // back legs
  E(-11,-11,4.6,4.6); E(11,-11,4.6,4.6);               // front legs
  const g=ctx.createRadialGradient(-4,-7,3,0,0,19);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  ctx.fillStyle=g; E(0,0,13,16.5);                      // body
  ctx.fillStyle='rgba(0,0,0,0.14)';
  E(-5,3,1.8,1.8); E(4,7,1.6,1.6); E(2,-3,1.5,1.5);     // spots
  ctx.fillStyle='rgba(255,255,255,0.16)'; E(-2,-2,7,9); // back sheen
  ctx.fillStyle='#fff'; E(-6,-13,4.6,4.6); E(6,-13,4.6,4.6);   // eyes
  ctx.fillStyle='#1c2417'; E(-7,-14.5,2.2,2.2); E(5,-14.5,2.2,2.2);
  ctx.fillStyle='#fff'; E(-7.6,-15,0.9,0.9); E(4.4,-15,0.9,0.9);
  ctx.restore();
}
function drawObs(o){
  const x=o.x, y=o.y;
  if(o.type==='tire'){
    const r=o.w/2;
    ctx.fillStyle='rgba(0,0,0,0.2)'; E(x+3,y+4,r,r*0.9);
    ctx.fillStyle='#20242a'; E(x,y,r,r);
    ctx.fillStyle='#3a4048'; E(x,y,r*0.58,r*0.58);
    ctx.fillStyle='#9aa2ad'; E(x,y,r*0.17,r*0.17);
    ctx.fillStyle='#14171b';
    for(let i=0;i<8;i++){ const a=o.rot+i*Math.PI/4; E(x+Math.cos(a)*r*0.8, y+Math.sin(a)*r*0.8, 5.5,2.6, a); }
    ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(x,y,r*0.8,-2.4,-1.2); ctx.stroke();
  }
  else if(o.type==='beetle'){
    ctx.save(); ctx.translate(x,y);
    ctx.strokeStyle='#241811'; ctx.lineWidth=2;
    for(let i=0;i<3;i++){ const wig=Math.sin(t*18+o.ph+i)*0.25;
      ctx.beginPath(); ctx.moveTo(-9,-6+i*6); ctx.lineTo(-17,-9+i*7+wig*6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(9,-6+i*6); ctx.lineTo(17,-9+i*7-wig*6); ctx.stroke(); }
    ctx.fillStyle='#3b2a1e'; E(0,0,o.w*0.4,o.w*0.58);
    ctx.strokeStyle='#241811'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,-o.w*0.5); ctx.lineTo(0,o.w*0.55); ctx.stroke();
    ctx.fillStyle='#241811'; E(0,o.w*0.6,5,4.5);
    ctx.fillStyle='rgba(255,255,255,0.15)'; E(-3,-4,3,5);
    ctx.restore();
  }
  else if(o.type==='log'){
    const w=o.w;
    ctx.fillStyle='rgba(0,0,0,0.28)'; rr(x-w/2,y-6,w,38,17);
    const g=ctx.createLinearGradient(x,y-17,x,y+17);
    g.addColorStop(0,'#9a6a3a'); g.addColorStop(1,'#6d4423');
    ctx.fillStyle=g; rr(x-w/2,y-17,w,34,17);
    ctx.strokeStyle='rgba(60,35,15,0.5)'; ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(x-w*0.3,y+i*8); ctx.lineTo(x+w*0.3,y+i*8+2); ctx.stroke(); }
    for(const ex of [x-w/2+14,x+w/2-14]){
      ctx.fillStyle='#caa06a'; E(ex,y,15,15);
      ctx.strokeStyle='#7c5330'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ex,y,9,0,6.28); ctx.stroke();
    }
  }
  else if(o.type==='pud'){
    const w=o.w;
    ctx.fillStyle='rgba(64,145,205,0.5)'; E(x,y,w*0.5,19);
    ctx.fillStyle='rgba(150,210,240,0.35)'; E(x-6,y-3,w*0.3,10);
    const rr2=((t*1.4+o.ph)%1);
    ctx.strokeStyle=`rgba(255,255,255,${0.3*(1-rr2)})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(x,y,w*0.15+rr2*w*0.32,6+rr2*9,0,0,6.28); ctx.stroke();
  }
  else { // flies
    const lift=o.type==='flyAir'?46+Math.sin(t*3+o.ph)*6:10;
    ctx.fillStyle='rgba(0,0,0,0.18)'; E(x,y,7,3);
    const fy=y-lift, flap=Math.abs(Math.sin(t*42+o.ph));
    ctx.fillStyle='rgba(255,216,61,0.28)'; E(x,fy,11,11);
    ctx.fillStyle='rgba(255,255,255,0.75)';
    E(x-5,fy-2,6*flap+1.5,3,-0.5); E(x+5,fy-2,6*flap+1.5,3,0.5);
    ctx.fillStyle='#ffcf3f'; E(x,fy,4.5,6);
    ctx.fillStyle='#7a5b10'; E(x,fy-6,3,3);
  }
}
function drawChecker(y){
  const sq=12;
  for(let i=0;i<Math.ceil(roadW/sq);i++) for(let j=0;j<2;j++){
    ctx.fillStyle=(i+j)%2?'#efe9d6':'#15181c';
    ctx.fillRect(roadX+i*sq, y-j*sq, Math.min(sq,roadW-i*sq), sq);
  }
}
function drawTracker(){
  const x=W-26, top=H*0.18, bot=H*0.82;
  ctx.save();
  ctx.strokeStyle='rgba(230,255,210,0.35)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(x,top); ctx.lineTo(x,bot); ctx.stroke();
  for(let i=0;i<4;i++) for(let j=0;j<2;j++){ ctx.fillStyle=(i+j)%2?'#efe9d6':'#15181c'; ctx.fillRect(x-7+i*4, top-16+j*4, 4,4); }
  const py=p=>bot-Math.min(1,p/RACE_M)*(bot-top);
  for(const a of ai){ const y=py(a.p);
    ctx.fillStyle=a.c1; ctx.strokeStyle='#081a0e'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,5,0,6.28); ctx.fill(); ctx.stroke(); }
  const my=py(dist);
  ctx.fillStyle='#7ee04a'; ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(x,my,6.5,0,6.28); ctx.fill(); ctx.stroke();
  ctx.restore();
}
function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // grass
  ctx.fillStyle='#2f8040'; ctx.fillRect(-10,-10,W+20,H+20);
  const DPIX=dist*PXPM, PR=84;
  const r0=Math.floor((DPIX+playerY-H-PR)/PR)-1, r1=r0+Math.ceil(H/PR)+3;
  for(let r=r0;r<=r1;r++){
    const y=playerY-(r*PR-DPIX);
    const h1=hsh(r*7919+3), h2=hsh(r*104729+7), h3=hsh(r*1299709+11);
    ctx.fillStyle='#256b33';
    if(roadX>40) E(18+h1*(roadX-46), y, 9,3.5);
    if(roadX>40) E(W-18-h2*(roadX-46), y+PR*0.5, 8,3);
    ctx.fillStyle='#3c9150'; E(10+h2*(roadX-30), y+PR*0.7, 6,2.5);
    if(h3>0.86){ ctx.fillStyle=h3>0.94?'#ffd83d':'#f2ead8'; E(24+h1*(Math.max(0,roadX-70)), y+PR*0.3, 3,3); }
    if(roadX>85 && r%7===0){ // trees on wide shoulders
      const left=h2<0.5, tx=left? 16+h1*(roadX-70) : W-16-h1*(roadX-70);
      ctx.fillStyle='rgba(0,0,0,0.22)'; E(tx+8,y+10,24,9);
      ctx.fillStyle='#1e5a2c'; E(tx,y,23,23);
      ctx.fillStyle='#2c7a3c'; E(tx-6,y-5,15,15);
      ctx.fillStyle='rgba(255,255,255,0.1)'; E(tx-9,y-8,6,6);
    }
  }

  // road
  ctx.fillStyle='#495257'; ctx.fillRect(roadX,-10,roadW,H+20);
  ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.fillRect(roadX,-10,5,H+20); ctx.fillRect(roadX+roadW-5,-10,5,H+20);
  ctx.fillStyle='#f2e9cf'; ctx.fillRect(roadX+7,-10,4,H+20); ctx.fillRect(roadX+roadW-11,-10,4,H+20);
  const off=DPIX%60;
  ctx.fillStyle='rgba(233,223,192,0.8)';
  for(let i=1;i<LANES;i++){ const x=roadX+i*LANEW-2.5;
    for(let y=-60+off;y<H+60;y+=60) ctx.fillRect(x,y,5,26); }
  ctx.fillStyle='rgba(0,0,0,0.1)';
  for(let r=r0;r<=r1;r+=2){ if(hsh(r*31)>0.4){ const y=playerY-(r*PR-DPIX);
    E(roadX+12+hsh(r*57)*(roadW-24), y, 1.6,1.6); } }

  // start / finish lines
  const yStart=playerY+DPIX; if(yStart<H+30&&yStart>-30) drawChecker(yStart);
  const yFin=playerY-(RACE_M*PXPM-DPIX);
  if(yFin>-40&&yFin<H+30){ drawChecker(yFin);
    ctx.font='italic 900 24px Impact, "Arial Black", sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillText('FINISH', W/2+3, yFin-16);
    ctx.fillStyle='#ffe9a8'; ctx.fillText('FINISH', W/2, yFin-19); }

  // puddles first (flat)
  for(const o of obstacles) if(o.type==='pud') drawObs(o);
  const rest=obstacles.filter(o=>o.type!=='pud').sort((a,b)=>a.y-b.y);
  for(const o of rest) drawObs(o);

  // AI frogs
  if(mode!=='menu'){
    for(const a of ai){
      const pDraw=a.p+7*Math.sin(t*0.6+a.i*2.1);
      const y=playerY-(pDraw-dist)*PXPM;
      if(y<-60||y>H+60) continue;
      const bob=Math.abs(Math.sin(t*7+a.i))*4;
      ctx.fillStyle='rgba(0,0,0,0.25)'; E(a.x,y+13,13,5);
      drawFrog(a.x,y-bob,0.9,0,a.c1,a.c2);
      if(Math.abs(y-playerY)<200){ ctx.font='10px Consolas, monospace'; ctx.textAlign='center';
        ctx.fillStyle=a.c1; ctx.globalAlpha=0.85; ctx.fillText(a.name,a.x,y-34); ctx.globalAlpha=1; }
    }
  }

  // player frog
  const hopArc=P.hop>0?Math.sin(P.hop*Math.PI)*22:0;
  const lift=P.z*HJ+hopArc+(mode==='menu'||mode==='count'?Math.abs(Math.sin(t*4))*3:0);
  const sx=(1+P.z*0.22)*(1+P.landPop*0.3), sy=(1-P.z*0.3)*(1-P.landPop*0.3);
  ctx.fillStyle=`rgba(0,0,0,${0.28*(1-P.z*0.5)})`; E(P.x,playerY+12,15*(1-P.z*0.3),6*(1-P.z*0.3));
  const tx=laneX(P.lane);
  let alpha=1; if(P.invuln>0 && Math.floor(t*12)%2===0) alpha=0.35;
  drawFrog(P.x,playerY-lift,sx*sy,clamp((tx-P.x)*0.0035,-0.35,0.35),'#7ee04a','#3f9b2e',alpha);
  if(P.boost>0&&mode==='play'&&Math.random()<0.7) addPart({t:'dot',x:P.x+(Math.random()-0.5)*16,y:playerY+10,vx:(Math.random()-0.5)*30,vy:80,life:0.3,max:0.3,col:'#ffd83d',r:2.5});

  // particles
  for(const p of parts){ const a=clamp(p.life/p.max,0,1);
    if(p.t==='leaf'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=a;
      ctx.fillStyle=p.col; ctx.fillRect(-4,-2.5,8,5); ctx.restore(); }
    else if(p.t==='conf'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha=a;
      ctx.fillStyle=p.col; ctx.fillRect(-3,-4.5,6,9); ctx.restore(); }
    else if(p.t==='spark'){ ctx.save(); ctx.translate(p.x,p.y); ctx.globalAlpha=a; ctx.strokeStyle=p.col; ctx.lineWidth=2;
      const s=3+4*a; ctx.beginPath(); ctx.moveTo(-s,0); ctx.lineTo(s,0); ctx.moveTo(0,-s); ctx.lineTo(0,s); ctx.stroke(); ctx.restore(); }
    else { ctx.globalAlpha=a; ctx.fillStyle=p.col; E(p.x,p.y,p.r,p.r); ctx.globalAlpha=1; }
  }
  // floaters
  ctx.font='bold 15px Consolas, monospace'; ctx.textAlign='center';
  for(const f of floaters){ ctx.globalAlpha=clamp(f.life/0.9,0,1);
    ctx.fillStyle='#081a0e'; ctx.fillText(f.txt,f.x+1,f.y+1);
    ctx.fillStyle='#ffd83d'; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;

  // speed streaks
  if(v>12.5 && mode==='play'){ const n=Math.min(6,Math.floor((v-12)*0.9));
    for(let i=0;i<n;i++){ const x=Math.random()*W, y=Math.random()*H, l=26+v;
      ctx.strokeStyle=`rgba(255,255,255,${0.03+Math.random()*0.07})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+l); ctx.stroke(); } }

  if(mode!=='menu') drawTracker();
  ctx.restore();

  // vignette + top shade + hit flash
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  const tg=ctx.createLinearGradient(0,0,0,90);
  tg.addColorStop(0,'rgba(0,0,0,0.35)'); tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg; ctx.fillRect(0,0,W,90);
  if(flash>0){ ctx.fillStyle=`rgba(255,70,45,${flash*0.32})`; ctx.fillRect(0,0,W,H); }

  // countdown / GO
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(mode==='count'){
    const n=Math.ceil(cd);
    if(n>=1&&n<=3){ const age=1-(cd-Math.floor(cd)), s=(1.25-age*0.25)*Math.min(1,W/420);
      ctx.font=`italic 900 ${Math.round(120*s)}px Impact, "Arial Black", sans-serif`;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillText(n,W/2+5,H*0.38+5);
      ctx.fillStyle='#ffd83d'; ctx.fillText(n,W/2,H*0.38); }
  }
  if(mode==='play'&&goFlash>0){ const a=goFlash/0.85, s=(1+(0.85-goFlash)*0.7)*Math.min(1,W/420);
    ctx.globalAlpha=a; ctx.font=`italic 900 ${Math.round(96*s)}px Impact, "Arial Black", sans-serif`;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillText('HOP!',W/2+5,H*0.38+5);
    ctx.fillStyle='#c8ff5e'; ctx.fillText('HOP!',W/2,H*0.38); ctx.globalAlpha=1; }
  if(mode==='over'&&!overShown){ const s=1+(1.4-overTimer)*0.1;
    ctx.font=`italic 900 ${Math.round(72*Math.min(1,W/380))}px Impact, "Arial Black", sans-serif`;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillText(finishInfo.dnf?'WRECKED!':'FINISH!',W/2+4,H*0.4+4);
    ctx.fillStyle=finishInfo.dnf?'#ff6b52':'#ffd83d'; ctx.fillText(finishInfo.dnf?'WRECKED!':'FINISH!',W/2,H*0.4); }
  ctx.textBaseline='alphabetic';

  if('ontouchstart' in window && mode==='play'){
    ctx.font='12px Consolas, monospace'; ctx.fillStyle='rgba(220,255,190,0.3)';
    ctx.fillText('◀ HOP', W*0.16, H-24); ctx.fillText('JUMP ▶', W*0.5, H-24); ctx.textAlign='center';
  }
}

/* ============================== HUD ============================== */
function hudTick(){
  if(hud.classList.contains('hide')) return;
  hDist.textContent=Math.min(RACE_M,Math.floor(dist))+' / '+RACE_M+' m';
  hFill.style.width=(Math.min(1,dist/RACE_M)*100).toFixed(1)+'%';
  const rank=1+ai.filter(a=>a.p>dist).length;
  hRank.textContent='#'+rank; hRank.style.color=RANKCOL[rank-1]||'#fff';
  const gaps=ai.map(a=>a.p-dist).filter(g=>g>0);
  if(gaps.length){ hGap.textContent='GAP −'+Math.ceil(Math.min(...gaps))+' M'; hGap.style.color='#ff9c52'; }
  else { hGap.textContent='LEADER!'; hGap.style.color='#c8ff5e'; }
  hFly.textContent=flyCount;
  lifeEls.forEach((el,i)=>el.classList.toggle('off', i>=lives));
  hSpd.textContent=Math.round(v*3.6);
}

/* ============================== MAIN LOOP ============================== */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); render(); hudTick();
  requestAnimationFrame(loop);
}
resize();
P.x=laneX(2);
toMenu();
requestAnimationFrame(loop);
})();
</script>
