<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STARFROG — Invader Crossing</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04050e;user-select:none;-webkit-user-select:none}
  #cv{position:fixed;inset:0;display:block;touch-action:none}
  #touch{position:fixed;inset:0;z-index:9;display:none;pointer-events:none}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;width:62px;height:62px;border-radius:50%;
      border:2px solid rgba(140,255,190,.55);background:rgba(15,35,28,.42);color:#baffd9;
      font:700 24px/1 monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
  #bU{left:82px;bottom:176px}
  #bD{left:82px;bottom:46px}
  #bL{left:10px;bottom:111px}
  #bR{left:152px;bottom:111px}
  #bF{right:18px;bottom:64px;width:88px;height:88px;border-color:rgba(255,210,90,.6);
      background:rgba(52,36,8,.42);color:#ffe08a;font-size:13px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="touch">
  <div class="tb" id="bU" data-k="ArrowUp">&#9650;</div>
  <div class="tb" id="bD" data-k="ArrowDown">&#9660;</div>
  <div class="tb" id="bL" data-k="ArrowLeft">&#9664;</div>
  <div class="tb" id="bR" data-k="ArrowRight">&#9654;</div>
  <div class="tb" id="bF" data-k="Space">FIRE</div>
</div>
<script>
(()=>{ 'use strict';
/* ============================== CORE / LAYOUT ============================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,S=1,OX=0,OY=0,T=0;
const FW=480,FH=720,HUD_H=46,PAD_H=64,START_H=44,LN=5;
const LANE_H=(FH-HUD_H-PAD_H-START_H)/LN;
const TOP_Y=FH-START_H;
function yRow(r){ if(r===0)return FH-START_H/2; if(r>=LN+1)return HUD_H+PAD_H/2; return TOP_Y-(r-0.5)*LANE_H; }
const PADX=[FW*0.2,FW*0.4,FW*0.6,FW*0.8];
const LB=[0,10,20,30,40,60], MAXW=5;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, R=Math.random;
const pad6=n=>String(Math.min(999999,n|0)).padStart(6,'0');

/* ============================== PIXEL FONT (3x5) ============================== */
const FONT={
 'A':['011','101','111','101','101'],'B':['110','101','110','101','110'],
 'C':['011','100','100','100','011'],'D':['110','101','101','101','110'],
 'E':['111','100','110','100','111'],'F':['111','100','110','100','100'],
 'G':['011','100','101','101','011'],'H':['101','101','111','101','101'],
 'I':['111','010','010','010','111'],'J':['001','001','001','101','010'],
 'K':['101','101','110','101','101'],'L':['100','100','100','100','111'],
 'M':['101','111','111','101','101'],'N':['101','111','111','111','101'],
 'O':['011','101','101','101','011'],'P':['110','101','110','100','100'],
 'Q':['111','101','101','110','001'],'R':['110','101','110','101','101'],
 'S':['011','100','011','001','110'],'T':['111','010','010','010','010'],
 'U':['101','101','101','101','111'],'V':['101','101','101','101','010'],
 'W':['101','101','111','111','101'],'X':['101','101','010','101','101'],
 'Y':['101','101','010','010','010'],'Z':['111','001','010','100','111'],
 '0':['111','101','101','101','111'],'1':['010','110','010','010','111'],
 '2':['110','001','010','100','111'],'3':['110','001','010','001','110'],
 '4':['101','101','111','001','001'],'5':['111','100','110','001','110'],
 '6':['011','100','111','101','111'],'7':['111','001','010','010','010'],
 '8':['011','101','011','101','011'],'9':['111','101','111','001','110'],
 '.':['000','000','000','000','010'],',':['000','000','000','010','100'],
 '!':['010','010','010','000','010'],'?':['110','001','010','000','010'],
 ':':['000','010','000','010','000'],'-':['000','000','111','000','000'],
 "'":['010','010','000','000','000'],'+':['000','010','111','010','000'],
 '/':['001','010','010','100','001'],' ':['000','000','000','000','000']};
function text(str,x,y,sc,col,align,glow){
  str=(''+str).toUpperCase();
  const w=str.length*4*sc-sc;
  if(align==='center')x-=w/2; else if(align==='right')x-=w;
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}
  ctx.fillStyle=col;
  for(let i=0;i<str.length;i++){const g=FONT[str[i]]||FONT[' '];
    for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(g[r][c]==='1')ctx.fillRect(x+i*4*sc+c*sc,y+r*sc,sc,sc);}
  if(glow)ctx.shadowBlur=0;
  return w;
}
function titleText(str,x,y,sc,cols){
  const w=str.length*4*sc-sc; let cx=x-w/2;
  for(let i=0;i<str.length;i++){text(str[i],cx+i*4*sc,y,sc,cols[i%cols.length],'left',16);}
}

/* ============================== SPRITES ============================== */
function mkSprite(rows){let w=0;for(const r of rows)w=Math.max(w,r.length);
  const px=[];rows.forEach((r,y)=>{for(let x=0;x<r.length;x++)if(r[x]!=='.')px.push([x,y,r[x]]);});
  return {w,h:rows.length,px};}
function drawPix(sp,cx,cy,sc,colmap,sxs=1,sys=1){
  const w=sp.w*sc*sxs,h=sp.h*sc*sys,x0=cx-w/2,y0=cy-h/2;let last=null;
  for(const p of sp.px){const c=colmap[p[2]]||colmap.X;
    if(c!==last){ctx.fillStyle=c;last=c;}
    ctx.fillRect(x0+p[0]*sc*sxs,y0+p[1]*sc*sys,sc*sxs,sc*sys);}
}
const SPR={
 crab:[mkSprite(["..X.....X..","...X...X...","..XXXXXXX..",".XXX.X.XXX.","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","...XX.XX..."]),
        mkSprite(["..X.....X..","X..X...X..X","X.XXXXXXX.X","XXX.XXX.XXX","XXXXXXXXXXX",".XXXXXXXXX.","..X.....X..",".X.......X."])],
 octo:[mkSprite(["....XXXX....",".XXXXXXXXXX.","XXXXXXXXXXXX","XXX..XX..XXX","X.XXXXXXXXXX","...XX..XX...","..XX.XX.XX..","XX........XX"]),
        mkSprite(["....XXXX....",".XXXXXXXXXX.","XXXXXXXXXXXX","XXX..XX..XXX","X.XXXXXXXXXX",".XX..XX..XX.","XX.X....X.XX",".XX......XX."])],
 squid:[mkSprite([".....XX.....","...XXXXXX...",".XXXXXXXXXX.","XXXX.XX.XXXX","XXXXXXXXXXXX","..XXX..XXX..",".XX.XXXX.XX.",".XX......XX."]),
         mkSprite([".....XX.....","...XXXXXX...",".XXXXXXXXXX.","XXXX.XX.XXXX","XXXXXXXXXXXX","..XXX..XXX..","XX.X....X.XX",".X........X."])],
 rock:[mkSprite(["...XXX....","..XXXXXX..",".XXXXXXXX.","XXXXXXXXX.",".XXXXXXX..","..XXXX....","...XX....."]),
        mkSprite(["....XXX...","..XXXXXX..",".XXXXXXXX.",".XXXXXXXXX","..XXXXXXX.","...XXXX...","....XX...."])],
 ufo:mkSprite(["......XXXX......","....XXXXXXXX....","...XXXXXXXXXX...",".XXXoXXXXoXXXXX.","..XXXXXXXXXXXX..","......X...X....."]),
 frog:mkSprite([".XX.......XX.","XXXX.....XXXX","XXXXXXXXXXXXX","XXXoXXXXXoXXX",".XXXXXXXXXXX.","X..XXXXXXX..X","X.X.......X.X"])
};

/* ============================== AUDIO ============================== */
let actx=null,master=null,noiseBuf=null,muted=false,musStep=0,musNext=0;
const MUSPAT=[110,0,110,0,110,0,146.83,0,98,0,98,0,155.56,0,196,0];
function ensureAudio(){
  if(!actx){try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=muted?0:0.6;master.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5|0,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
  }catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function tone(f,dur,type,vol,slideTo,delay){
  if(!actx||muted)return;delay=delay||0;const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f),t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function noiseS(dur,vol,delay,fq){
  if(!actx||muted)return;delay=delay||0;const t=actx.currentTime+delay;
  const s=actx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||1200;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.03);
}
const sfx={
 shoot(){tone(880,0.09,'square',0.12,240);},
 hop(){tone(340,0.06,'triangle',0.16,540);},
 lane(r){tone(480+r*90,0.07,'square',0.1);},
 kill(){noiseS(0.14,0.25,0,900);tone(300,0.16,'sawtooth',0.12,60);},
 ufoKill(){tone(1200,0.08,'square',0.15,1900);noiseS(0.2,0.3,0.02,2400);tone(700,0.2,'sawtooth',0.12,90);},
 die(){noiseS(0.45,0.35,0,600);tone(420,0.55,'sawtooth',0.22,38);},
 dock(){[523,659,784,1046].forEach((f,i)=>tone(f,0.1,'square',0.14,null,i*0.08));},
 wave(){[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,0.14,'square',0.15,null,i*0.09));},
 over(){[392,311,247,165].forEach((f,i)=>tone(f,0.28,'sawtooth',0.18,null,i*0.22));},
 win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,0.16,'square',0.15,null,i*0.11));},
 ufoTick(hi){tone(hi?920:640,0.07,'square',0.05);}
};
function updateMusic(){
  if(!actx||muted)return;
  if(musNext<actx.currentTime)musNext=actx.currentTime+0.08;
  const dur=Math.max(0.11,0.15-G.wave*0.006);
  while(musNext<actx.currentTime+0.12){
    const f=MUSPAT[musStep%16];
    if(f)tone(f,dur*0.9,'square',0.045,null,musNext-actx.currentTime);
    if(musStep%4===2)noiseS(0.03,0.012,musNext-actx.currentTime,5000);
    musNext+=dur;musStep++;
  }
}

/* ============================== BACKGROUND / POST ============================== */
const bgCv=document.createElement('canvas'),postCv=document.createElement('canvas');
function glow(b,x,y,r,c){const g=b.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(0,0,W,H);}
function buildBG(){
  bgCv.width=cv.width;bgCv.height=cv.height;const b=bgCv.getContext('2d');b.scale(dpr,dpr);
  const g=b.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050614');g.addColorStop(0.5,'#0b1130');g.addColorStop(1,'#06081a');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  glow(b,W*0.18,H*0.22,Math.max(W,H)*0.5,'rgba(45,225,195,0.10)');
  glow(b,W*0.85,H*0.75,Math.max(W,H)*0.55,'rgba(255,80,220,0.09)');
  glow(b,W*0.6,H*0.35,Math.max(W,H)*0.4,'rgba(80,130,255,0.09)');
}
function buildPost(){
  postCv.width=cv.width;postCv.height=cv.height;const p=postCv.getContext('2d');p.scale(dpr,dpr);
  p.fillStyle='rgba(0,0,0,0.15)';for(let y=0;y<H;y+=3)p.fillRect(0,y,W,1);
  const g=p.createRadialGradient(W/2,H*0.48,Math.min(W,H)*0.42,W/2,H*0.48,Math.hypot(W,H)/2);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.45)');
  p.fillStyle=g;p.fillRect(0,0,W,H);
}
const stars=[];for(let i=0;i<130;i++)stars.push({x:R(),y:R(),z:[0.35,0.65,1][i%3],ph:R()*6.28,
  c:['#cfe6ff','#cfe6ff','#9fd8ff','#ffd7f2'][ (R()*4)|0 ]});

/* ============================== GAME STATE ============================== */
let hi=0;try{hi=+localStorage.getItem('starfrog_hi')||0;}catch(e){}
const LANE_DEF=[
 {type:'rock', col:'#a8c3d4',spd:52,n:7,sc:3,pts:5},
 {type:'squid',col:'#4de3ff',spd:66,n:6,sc:3,pts:30},
 {type:'octo', col:'#ff5ce1',spd:54,n:5,sc:3,pts:20},
 {type:'crab', col:'#ffd23e',spd:46,n:5,sc:3,pts:10},
 {type:'crab', col:'#ff7a5c',spd:92,n:4,sc:3,pts:15}];
LANE_DEF.forEach(d=>{d.w=(d.type==='crab')?11:(d.type==='rock')?10:12;d.h=(d.type==='rock')?7:8;});

const G={state:'menu',score:0,lives:3,wave:1,kills:0,newBest:false,
  lanes:[],pads:[{occ:false,bt:0},{occ:false,bt:0},{occ:false,bt:0},{occ:false,bt:0}],
  player:{x:FW/2,row:0,vx:0,hop:{a:false,from:0,to:0,t:0},docked:false,padIdx:-1,dead:false},
  bolts:[],parts:[],rings:[],pops:[],
  ufo:{a:false,x:0,dir:1,tmr:9,pts:50,hi:false,tk:0},
  shake:0,cd:0,invuln:0,deadT:0,crossMax:0,landT:0,hintT:0,bannerT:0,wcT:0};

function initLanes(){
  for(let i=0;i<LN;i++){const d=LANE_DEF[i];const lane={def:d,i,dir:i%2?-1:1,ents:[]};
    for(let j=0;j<d.n;j++){
      const e={x:(j+0.5)*FW/d.n+(R()*36-18),sp:d.spd*(1+0.16*(G.wave-1))*(0.92+R()*0.16),alive:true,rT:0,idx:j};
      e.wb=d.w*d.sc*0.72;e.eh=d.h*d.sc*0.75;lane.ents.push(e);}
    G.lanes[i]=lane;}
}
function resetPlayer(){const p=G.player;p.x=FW/2;p.row=0;p.vx=0;p.hop={a:false,from:0,to:0,t:0};
  p.docked=false;p.padIdx=-1;p.dead=false;G.crossMax=0;}
function startGame(){
  G.score=0;G.lives=3;G.wave=1;G.kills=0;G.newBest=false;
  G.parts.length=0;G.rings.length=0;G.pops.length=0;G.bolts.length=0;
  initLanes();G.pads.forEach(p=>{p.occ=false;p.bt=0;});
  resetPlayer();
  G.ufo={a:false,x:0,dir:1,tmr:8+R()*6,pts:50,hi:false,tk:0};
  G.shake=0;G.cd=0;G.invuln=0;G.deadT=0;G.landT=T-1;G.hintT=5;G.bannerT=1.6;
  musStep=0;if(actx)musNext=actx.currentTime+0.3;
  G.state='playing';
}
function saveHi(){if(G.score>hi){hi=G.score;G.newBest=true;try{localStorage.setItem('starfrog_hi',hi);}catch(e){}}}

/* ============================== FX HELPERS ============================== */
function addScore(n,x,y,col,txt){G.score+=n;G.pops.push({x,y,txt:txt||('+'+n),col,t:0,life:0.9});}
function explosion(x,y,col,n,pow){
  for(let i=0;i<n;i++){const a=R()*6.283,s=30+R()*pow;
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:0.4+R()*0.45,
      col:R()<0.25?'#ffffff':col,sz:2+R()*2.5});}
  G.rings.push({x,y,r:3,vr:pow*1.6,t:0,life:0.45,col});
}
function py(){const p=G.player;let y;
  if(p.hop.a){const t=Math.min(1,p.hop.t);y=lerp(yRow(p.hop.from),yRow(p.hop.to),t);y-=Math.sin(Math.PI*t)*14;}
  else{y=yRow(p.row);if(!p.docked&&!p.dead)y+=Math.sin(T*5)*1.5;}
  return y;}

/* ============================== ACTIONS ============================== */
function hop(dir){const p=G.player;if(G.state!=='playing'||p.dead||p.docked||p.hop.a)return;
  const t=p.row+dir;if(t<0||t>LN+1)return;
  p.hop={a:true,from:p.row,to:t,t:0};G.landT=T-1;sfx.hop();}
function tryFire(){const p=G.player;if(G.state!=='playing'||p.dead||p.docked||T<G.cd)return;
  G.cd=T+0.2;G.bolts.push({x:p.x,y:py()-16,dead:false});sfx.shoot();
  for(let i=0;i<3;i++)G.parts.push({x:p.x+(R()*8-4),y:py()-20,vx:R()*40-20,vy:-60-R()*50,t:0,life:0.2,col:'#ffe08a',sz:2});}
function die(){const p=G.player;if(p.dead||G.invuln>0)return;
  G.lives--;p.dead=true;G.deadT=1.15;explosion(p.x,py(),'#8dff4f',26,230);
  G.rings.push({x:p.x,y:py(),r:6,vr:340,t:0,life:0.6,col:'#ffffff'});
  G.shake=10;sfx.die();}
function killEnt(i,e){const d=G.lanes[i].def;e.alive=false;e.rT=2.2+R()*1.2;G.kills++;
  const ly=yRow(i+1);addScore(d.pts,e.x,ly-20,d.col,'+'+d.pts);
  explosion(e.x,ly,d.col,14,170);sfx.kill();}
function killUfo(){const u=G.ufo;addScore(u.pts,u.x,u.y,'#ff8fae','+'+u.pts);
  explosion(u.x,u.y,'#ff8fae',22,230);G.shake=4;sfx.ufoKill();u.a=false;u.tmr=9+R()*8;}
function setPause(on){if(on&&G.state==='playing')G.state='paused';else if(!on&&G.state==='paused')G.state='playing';}

/* ============================== INPUT ============================== */
const keys=new Set();
window.addEventListener('keydown',e=>{
  ensureAudio();const c=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();
  if(!e.repeat){
    if(c==='Enter'||c==='Space'){if(G.state==='menu'||G.state==='gameover'||G.state==='win')startGame();}
    if((c==='ArrowUp'||c==='KeyW')&&G.state==='playing')hop(1);
    if((c==='ArrowDown'||c==='KeyS')&&G.state==='playing')hop(-1);
    if(c==='Space'&&G.state==='playing')tryFire();
    if(c==='KeyP'||c==='Escape'){if(G.state==='playing')setPause(true);else if(G.state==='paused')setPause(false);}
    if(c==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:0.6;}
    if(c==='KeyR'&&(G.state==='playing'||G.state==='paused'||G.state==='waveclear'))startGame();
  }
  keys.add(c);
});
window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>keys.clear());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='playing')setPause(true);});
cv.addEventListener('pointerdown',()=>{ensureAudio();
  if(G.state==='menu'||G.state==='gameover'||G.state==='win')startGame();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const touchDiv=document.getElementById('touch');
function showTouch(){touchDiv.classList.add('on');}
window.addEventListener('touchstart',showTouch,{once:true,passive:true});
document.querySelectorAll('.tb').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();ensureAudio();keys.add(k);
    if(G.state==='playing'){if(k==='ArrowUp')hop(1);else if(k==='ArrowDown')hop(-1);else if(k==='Space')tryFire();}};
  const off=e=>{e.preventDefault();keys.delete(k);};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
});

/* ============================== UPDATE ============================== */
function randX(li){let x=20+R()*(FW-40),p=G.player;
  if(G.state==='playing'&&p.row===li+1&&!p.dead){for(let k=0;k<3;k++){if(Math.abs(x-p.x)>80)break;x=20+R()*(FW-40);}}
  return x;}
function updateLanes(dt){
  for(const lane of G.lanes){const m=lane.ents[0].wb;
    for(const e of lane.ents){
      if(!e.alive){e.rT-=dt;if(e.rT<=0){e.alive=true;e.x=randX(lane.i);}}
      else{e.x+=e.sp*lane.dir*dt;
        if(lane.dir>0&&e.x>FW+m)e.x=-m;else if(lane.dir<0&&e.x<-m)e.x=FW+m;}
    }}
}
function update(dt){
  T+=dt;
  for(const s of stars){s.y+=dt*0.006*s.z;if(s.y>1)s.y-=1;}
  if(G.state==='paused')return;
  G.shake=Math.max(0,G.shake-26*dt);
  // particles / rings / popups always tick
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.t+=dt;
    if(p.t>p.life){G.parts.splice(i,1);continue;}
    const dr=Math.exp(-2.5*dt);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=G.rings.length-1;i>=0;i--){const r=G.rings[i];r.t+=dt;r.r+=r.vr*dt;if(r.t>r.life)G.rings.splice(i,1);}
  for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.t+=dt;p.y-=30*dt;if(p.t>p.life)G.pops.splice(i,1);}
  G.pads.forEach(p=>{if(p.occ)p.bt+=dt;});

  if(G.state==='menu'){updateLanes(dt*0.5);return;}
  if(G.state!=='playing'&&G.state!=='waveclear')return;

  updateLanes(dt);
  if(G.state!=='playing')return;
  updateMusic();
  G.hintT-=dt;G.bannerT-=dt;G.invuln-=dt;

  const p=G.player;
  if(p.dead){G.deadT-=dt;
    if(G.deadT<=0){if(G.lives<=0){saveHi();G.state='gameover';sfx.over();}else{resetPlayer();G.invuln=1.6;}}
    return;}
  // horizontal
  const dir=(keys.has('ArrowRight')||keys.has('KeyD'))-(keys.has('ArrowLeft')||keys.has('KeyA'));
  p.vx+=(dir*270-p.vx)*Math.min(1,dt*18);
  p.x=clamp(p.x+p.vx*dt,14,FW-14);
  // hop tween + hold-to-cross
  if(p.hop.a){p.hop.t+=dt/0.13;
    if(p.hop.t>=1){p.row=p.hop.to;p.hop.a=false;G.landT=T;
      for(let k=0;k<4;k++)G.parts.push({x:p.x+(R()*16-8),y:yRow(p.row)+9,vx:R()*30-15,vy:-25,t:0,life:0.3,col:'rgba(140,255,170,0.8)',sz:2});}
  }else if(!p.docked&&T-G.landT>0.12){
    const up=keys.has('ArrowUp')||keys.has('KeyW'),dn=keys.has('ArrowDown')||keys.has('KeyS');
    if(up&&p.row<LN+1)hop(1);else if(dn&&p.row>0)hop(-1);}
  // lane bonus
  if(!p.hop.a&&p.row>G.crossMax&&p.row<=LN){G.crossMax=p.row;
    addScore(LB[p.row],p.x,py()-20,'#9fd8ff','+'+LB[p.row]);sfx.lane(p.row);}
  // dock
  if(!p.docked&&p.row===LN+1&&!p.hop.a){
    for(let i=0;i<4;i++){if(!G.pads[i].occ&&Math.abs(p.x-PADX[i])<30){
      p.x=PADX[i];G.pads[i].occ=true;G.pads[i].bt=0;p.docked=true;p.padIdx=i;
      const b=100+G.wave*20;addScore(b,p.x,py()-26,'#7dff9a','+'+b);
      G.rings.push({x:PADX[i],y:yRow(LN+1),r:6,vr:180,t:0,life:0.5,col:'#7dff9a'});
      sfx.dock();
      if(G.pads.every(q=>q.occ)){G.state='waveclear';G.wcT=0;
        addScore(200,FW/2,FH*0.4,'#ffe08a','+200 BONUS');sfx.wave();}
      break;}}}
  // collisions
  if(G.invuln<=0){const pyy=py();outer:
    for(let i=0;i<LN;i++){const ly=yRow(i+1);
      for(const e of G.lanes[i].ents){if(!e.alive)continue;
        if(Math.abs(pyy-ly)<7.5+e.eh/2&&Math.abs(p.x-e.x)<13+e.wb/2){die();break outer;}}}}

  // bolts
  const u=G.ufo;
  for(const b of G.bolts){b.y-=950*dt;
    if(u.a&&Math.abs(b.x-u.x)<36&&b.y<48+10&&b.y>48-18){killUfo();b.dead=true;break;}
    for(let i=0;i<LN;i++){const ly=yRow(i+1);
      if(b.y+7<ly-24||b.y-7>ly+24)continue;
      for(const e of G.lanes[i].ents){if(!e.alive)continue;
        if(Math.abs(b.x-e.x)<e.wb/2&&b.y+7>ly-e.eh/2&&b.y-7<ly+e.eh/2){killEnt(i,e);b.dead=true;break;}}
      if(b.dead)break;}
    if(b.y<-30)b.dead=true;}
  G.bolts=G.bolts.filter(b=>!b.dead);

  // ufo
  if(u.a){u.x+=u.dir*140*dt;u.tk-=dt;
    if(u.tk<=0){sfx.ufoTick(u.hi=!u.hi);u.tk=0.13;}
    if(u.x<-60||u.x>FW+60){u.a=false;u.tmr=9+R()*8;}}
  else{u.tmr-=dt;if(u.tmr<=0){u.a=true;u.dir=R()<0.5?1:-1;u.x=u.dir>0?-40:FW+40;u.pts=R()<0.3?100:50;u.tk=0;}}
}
function updateWaveClear(dt){G.wcT+=dt;
  if(G.wcT>2){
    if(G.wave>=MAXW){saveHi();G.state='win';sfx.win();}
    else{G.wave++;initLanes();G.pads.forEach(p=>{p.occ=false;p.bt=0;});
      resetPlayer();G.invuln=1.2;G.bannerT=1.6;G.state='playing';}}}

/* ============================== RENDER ============================== */
function entSP(i,e){const d=G.lanes[i].def,f=((T/0.45)|0)%2;
  if(d.type==='crab')return SPR.crab[f];if(d.type==='octo')return SPR.octo[f];
  if(d.type==='squid')return SPR.squid[f];return e.idx%2?SPR.rock1:SPR.rock0;}
function drawPad(i){const px=PADX[i],pyy=yRow(LN+1),occ=G.pads[i].occ;
  const pulse=0.5+0.35*Math.sin(T*3+i*1.7);
  ctx.beginPath();ctx.ellipse(px,pyy,34,15,0,0,6.283);
  if(occ){ctx.fillStyle='rgba(90,255,150,0.16)';ctx.fill();
    ctx.strokeStyle='#7dff9a';}
  else ctx.strokeStyle='rgba(90,230,255,'+pulse.toFixed(2)+')';
  ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle=occ?'rgba(180,255,210,0.7)':'rgba(160,245,255,0.45)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(px-9,pyy-4);ctx.lineTo(px,pyy+3);ctx.lineTo(px+9,pyy-4);ctx.stroke();}
function drawField(){
  const p=G.player;
  // start strip
  const sg=ctx.createLinearGradient(0,TOP_Y,0,FH);
  sg.addColorStop(0,'rgba(90,255,150,0.14)');sg.addColorStop(1,'rgba(90,255,150,0.02)');
  ctx.fillStyle=sg;ctx.fillRect(0,TOP_Y,FW,START_H);
  ctx.fillStyle='rgba(120,255,160,0.5)';ctx.fillRect(0,TOP_Y,FW,2);
  for(let i=-1;i<=1;i++){const cx=FW/2+i*22,cy=FH-13;
    ctx.fillStyle='rgba(140,255,180,'+(i===0?0.7:0.3)+')';
    ctx.beginPath();ctx.moveTo(cx,cy-6);ctx.lineTo(cx-6,cy+3);ctx.lineTo(cx+6,cy+3);ctx.closePath();ctx.fill();}
  text('HOME',FW/2,FH-14,2,'rgba(180,255,210,0.5)','center');
  // lives
  for(let i=0;i<G.lives;i++){if(G.lives===1)ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(T*6));
    drawPix(SPR.frog,22+i*26,FH-22,1.5,{X:'#8dff4f',o:'#eaffff'});ctx.globalAlpha=1;}
  if(muted)text('MUTED',FW-10,FH-27,2,'#ffb84d','right');
  // lane dividers
  for(let i=0;i<=LN;i++){const y=TOP_Y-i*LANE_H;
    if(i===LN){ctx.fillStyle='rgba(90,230,255,0.4)';ctx.fillRect(0,y,FW,2);}
    else{ctx.strokeStyle='rgba(110,180,255,0.16)';ctx.lineWidth=1;ctx.setLineDash([8,10]);
      ctx.lineDashOffset=T*30*(i%2?-1:1);
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(FW,y);ctx.stroke();ctx.setLineDash([]);}}
  // direction chevrons per lane
  for(let i=0;i<LN;i++){const ly=yRow(i+1),d=G.lanes[i].dir;
    ctx.fillStyle=G.lanes[i].def.col;ctx.globalAlpha=0.3;
    for(let k=0;k<3;k++){const cx=12+k*16;
      ctx.beginPath();
      if(d>0){ctx.moveTo(cx-4,ly-5);ctx.lineTo(cx+4,ly);ctx.lineTo(cx-4,ly+5);}
      else{ctx.moveTo(cx+4,ly-5);ctx.lineTo(cx-4,ly);ctx.lineTo(cx+4,ly+5);}
      ctx.closePath();ctx.fill();}
    ctx.globalAlpha=1;}
  // pads + entities + ufo + bolts + player
  for(let i=0;i<4;i++)drawPad(i);
  for(let i=0;i<LN;i++){const ly=yRow(i+1),col=G.lanes[i].def.col;
    for(const e of G.lanes[i].ents)if(e.alive)drawPix(entSP(i,e),e.x,ly,G.lanes[i].def.sc,{X:col});}
  const u=G.ufo;
  if(u.a)drawPix(SPR.ufo,u.x,48+Math.sin(T*6)*2,2.4,{X:'#ff6b8f',o:u.hi?'#ffe08a':'#ffb3c9'});
  for(const b of G.bolts){ctx.fillStyle='rgba(110,240,255,0.25)';ctx.fillRect(b.x-3.5,b.y-10,7,20);
    ctx.fillStyle='#dffbff';ctx.fillRect(b.x-1.5,b.y-7,3,14);}
  if(!p.dead){
    const blink=G.invuln>0&&((T*14|0)%2===0);
    if(!blink){let sx=1,sy=1;
      if(p.hop.a){const s=Math.sin(Math.PI*Math.min(1,p.hop.t));sy=1-0.22*s;sx=1+0.16*s;}
      if(p.docked){const bt=G.pads[p.padIdx].bt;sy=1+0.3*Math.sin(bt*16)*Math.exp(-bt*5);}
      drawPix(SPR.frog,p.x,py(),2.6,{X:'#8dff4f',o:'#eaffff'},sx,sy);}}
  // fx
  for(const q of G.parts){ctx.globalAlpha=1-q.t/q.life;ctx.fillStyle=q.col;
    const s=q.sz*(1-q.t/q.life*0.5);ctx.fillRect(q.x-s/2,q.y-s/2,s,s);}
  ctx.globalAlpha=1;
  for(const r of G.rings){ctx.globalAlpha=1-r.t/r.life;ctx.strokeStyle=r.col;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const q of G.pops){ctx.globalAlpha=1-q.t/q.life;text(q.txt,q.x,q.y,2,q.col,'center');}
  ctx.globalAlpha=1;
  // HUD
  ctx.fillStyle='rgba(4,8,18,0.78)';ctx.fillRect(0,0,FW,HUD_H);
  ctx.fillStyle='rgba(120,200,255,0.28)';ctx.fillRect(0,HUD_H-1,FW,1);
  text('SCORE',12,8,2,'#ffb84d');text(pad6(G.score),12,20,4,'#ffffff');
  text('HI',FW-12,8,2,'#ffb84d','right');text(pad6(Math.max(hi,G.score)),FW-12,20,4,'#7de3ff','right');
  text('WAVE '+G.wave,FW/2,9,2,'#cfe8ff','center');
  for(let i=0;i<MAXW;i++){ctx.fillStyle=i<G.wave?'#7dff9a':'rgba(255,255,255,0.15)';
    ctx.fillRect(FW/2-32+i*14,32,9,8);}
  if(G.hintT>0&&G.state==='playing'){ctx.globalAlpha=Math.min(1,G.hintT)*0.85;
    text('ARROWS MOVE - SPACE SHOOT',FW/2,TOP_Y+8,2,'#baffd9','center');ctx.globalAlpha=1;}
  if(G.bannerT>0&&G.state==='playing'){
    const a=clamp(Math.min(G.bannerT/0.25,(1.6-G.bannerT)/0.35),0,1);ctx.globalAlpha=a;
    text('WAVE '+G.wave,FW/2,FH*0.40,8,'#7dff9a','center',16);
    if(G.wave>1)text('SPEED UP!',FW/2,FH*0.40+58,3,'#ffe08a','center');ctx.globalAlpha=1;}
}
function panel(h,stroke){const x=FW/2-190,y=FH*0.45-h/2;
  ctx.fillStyle='rgba(8,10,22,0.92)';ctx.fillRect(x,y,380,h);
  ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,378,h-2);return y;}
function drawMenu(){
  ctx.fillStyle='rgba(3,6,14,0.62)';ctx.fillRect(0,0,FW,FH);
  titleText('STARFROG',FW/2,118,12,['#8dff4f','#4de3ff','#ff5ce1','#ffd23e','#ff7a5c']);
  text('INVADER CROSSING',FW/2,168,3,'#ffb84d','center');
  drawPix(SPR.frog,FW/2-80,262+Math.sin(T*3)*6,6,{X:'#8dff4f',o:'#eaffff'});
  text('VS',FW/2,254,2,'#cfe8ff','center');
  drawPix(SPR.crab[((T/0.45)|0)%2],FW/2+80,262,5,{X:'#ffd23e'});
  const lines=['ARROWS / WASD : MOVE','SPACE : SHOOT ALIENS','P PAUSE   M MUTE   R RESTART'];
  for(let i=0;i<3;i++)text(lines[i],FW/2,352+i*26,2,'#cfe8ff','center');
  ctx.globalAlpha=0.55+0.45*Math.sin(T*4);
  text('PRESS ENTER TO START',FW/2,520,3,'#7dff9a','center',12);ctx.globalAlpha=1;
  text('HI SCORE '+pad6(hi),FW/2,566,2,'#ffb84d','center');
  text('HOP THE LANE OR BLAST A GAP',FW/2,600,2,'rgba(160,200,255,0.6)','center');
  text('FROGGER X SPACE INVADERS MASHUP',FW/2,634,2,'rgba(160,200,255,0.4)','center');
}
function drawPause(){ctx.fillStyle='rgba(0,0,10,0.55)';ctx.fillRect(0,0,FW,FH);
  text('PAUSED',FW/2,FH*0.42,8,'#ffffff','center',14);
  text('PRESS P TO RESUME',FW/2,FH*0.42+62,3,'#ffb84d','center');}
function drawWaveClear(){ctx.fillStyle='rgba(0,12,24,0.35)';ctx.fillRect(0,0,FW,FH);
  const y=FH*0.42+Math.sin(G.wcT*9)*4;
  text('WAVE CLEAR!',FW/2,y,8,'#4de3ff','center',16);
  text('+200 BONUS',FW/2,y+64,3,'#ffe08a','center');}
function drawEnd(win){ctx.fillStyle='rgba(2,4,12,0.7)';ctx.fillRect(0,0,FW,FH);
  const y=panel(260,win?'rgba(90,255,190,0.6)':'rgba(255,93,93,0.6)');
  if(win){text('EARTH SAVED!',FW/2,y+34,7,'#7dff9a','center',18);
    text('SCORE '+pad6(G.score),FW/2,y+104,3,'#ffffff','center');
    text('ALIENS ZAPPED: '+G.kills,FW/2,y+134,3,'#4de3ff','center');
    text('ALL 5 WAVES CLEARED',FW/2,y+164,2,'#ffd7f2','center');}
  else{text('GAME OVER',FW/2,y+38,8,'#ff5d5d','center',18);
    text('SCORE '+pad6(G.score),FW/2,y+96,3,'#ffffff','center');
    text('BEST '+pad6(hi),FW/2,y+126,3,'#7de3ff','center');
    if(G.newBest){ctx.globalAlpha=0.55+0.45*Math.sin(T*6);
      text('NEW BEST!',FW/2,y+158,3,'#7dff9a','center',10);ctx.globalAlpha=1;}}
  ctx.globalAlpha=0.55+0.45*Math.sin(T*4);
  text('PRESS ENTER TO RETRY',FW/2,y+206,2,'#ffd23e','center');ctx.globalAlpha=1;}
function drawStars(){for(const s of stars){
  const a=(0.25+0.75*Math.abs(Math.sin(T*1.5+s.ph)))*s.z;
  ctx.globalAlpha=a;ctx.fillStyle=s.c;
  const sz=s.z*1.8;ctx.fillRect(s.x*W,s.y*H,sz,sz);
  if(s.z===1&&Math.sin(T*2+s.ph)>0.92){ctx.fillRect(s.x*W-3,s.y*H+sz/2-0.5,7,1);ctx.fillRect(s.x*W+sz/2-0.5,s.y*H-3,1,7);}}
  ctx.globalAlpha=1;}
function sideArt(){const m=OX;if(m>240){
  const sc=Math.min(46,(m-40)/12);
  drawPix(SPR.squid[0],m*0.5,H*0.3+Math.sin(T*0.8)*12,sc,{X:'rgba(90,230,255,0.06)'});
  drawPix(SPR.crab[((T/0.45)|0)%2],W-m*0.5,H*0.7+Math.sin(T*0.7+2)*12,sc*0.9,{X:'rgba(255,210,62,0.06)'});}}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(bgCv,0,0,W,H);
  drawStars();sideArt();
  let shx=0,shy=0;
  if(G.shake>0.1){shx=(R()*2-1)*G.shake;shy=(R()*2-1)*G.shake;}
  ctx.save();ctx.translate(OX+shx,OY+shy);ctx.scale(S,S);
  drawField();
  if(G.state==='menu')drawMenu();
  else if(G.state==='paused')drawPause();
  else if(G.state==='waveclear')drawWaveClear();
  else if(G.state==='gameover')drawEnd(false);
  else if(G.state==='win')drawEnd(true);
  ctx.restore();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(postCv,0,0,W,H);
}

/* ============================== RESIZE / LOOP ============================== */
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=(W*dpr)|0;cv.height=(H*dpr)|0;
  S=Math.min((W-8)/FW,(H-8)/FH);OX=(W-FW*S)/2;OY=(H-FH*S)/2;
  buildBG();buildPost();}
resize();initLanes();
window.addEventListener('resize',resize);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(innerWidth!==W||innerHeight!==H)resize();
  update(dt);
  if(G.state==='waveclear')updateWaveClear(dt);
  render();
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
