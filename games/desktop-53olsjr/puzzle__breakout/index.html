<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shardlight — Stained-Glass Breakout</title>
<style>
:root{
  --gold:#d9a441; --gold-l:#f4d98b; --ivory:#f3e6cf; --dim:#b98d4e;
  --disp:Georgia,'Palatino Linotype','Book Antiqua',serif;
  --body:'Gill Sans','Gill Sans MT','Segoe UI','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0507;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ivory);-webkit-user-select:none;user-select:none}
canvas#cvs{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;
  padding:12px 18px 6px;pointer-events:none;font-family:var(--body);
  background:linear-gradient(rgba(10,4,7,.55),rgba(10,4,7,0));transition:opacity .3s}
#hud.hide{opacity:0}
.hgroup{display:flex;flex-direction:column;gap:3px;min-width:90px}
.hgroup.mid{align-items:center;text-align:center;flex:1}
.hgroup.right{align-items:flex-end}
.label{font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.big{font-family:var(--disp);font-size:clamp(1.15rem,2.6vw,1.6rem);line-height:1;color:#f3e2b8;font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(255,170,80,.25)}
.lvl{font-family:var(--disp);font-size:clamp(.85rem,1.9vw,1.1rem);letter-spacing:.16em;color:#d9b877;font-variant:small-caps}
#comboChip{margin-top:4px;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:#ffd98b;
  border:1px solid rgba(255,217,139,.45);padding:3px 10px;border-radius:20px;background:rgba(40,20,8,.6);
  opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
#comboChip.on{opacity:1;transform:scale(1)}
#comboChip.pop{animation:cpop .3s ease}
@keyframes cpop{40%{transform:scale(1.25)}}
.lives{display:flex;margin-top:4px;height:14px}
.lgem{width:11px;height:11px;display:inline-block;margin-left:7px;transform:rotate(45deg);
  background:linear-gradient(135deg,#ff9db0,#c93a52 65%);box-shadow:0 0 8px rgba(255,90,120,.55)}

#muteChip{position:fixed;right:14px;bottom:12px;z-index:7;font-family:var(--body);font-size:.68rem;letter-spacing:.14em;
  color:#cbb691;background:rgba(20,9,13,.7);border:1px solid rgba(217,164,65,.35);border-radius:20px;padding:6px 13px;cursor:pointer}
#muteChip:hover{color:#ffd98b;border-color:rgba(255,217,139,.7)}

/* ---------- banner / flash ---------- */
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;pointer-events:none;z-index:6;opacity:0}
#banner .b1{font-family:var(--disp);font-size:clamp(1.9rem,5.5vw,3.2rem);letter-spacing:.2em;color:#f3e2b8;text-transform:uppercase;
  text-shadow:0 0 30px rgba(255,170,80,.4),0 3px 6px rgba(0,0,0,.7)}
#banner .b2{font-size:.78rem;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;margin-top:8px}
#banner.go{animation:bann 2.5s ease forwards}
@keyframes bann{0%{opacity:0;transform:translateY(16px) scale(.96)}14%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(200,30,40,.5),rgba(120,10,20,.7))}

/* ---------- overlay / panel ---------- */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,3,6,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .35s}
#overlay.show{opacity:1;pointer-events:auto}
.panel{position:relative;width:min(94vw,560px);max-height:92vh;overflow-y:auto;text-align:center;padding:38px 34px 30px;
  background:linear-gradient(165deg,rgba(46,23,36,.97),rgba(23,10,16,.97));
  border:1px solid rgba(217,164,65,.5);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 0 70px rgba(255,150,50,.06),0 30px 90px rgba(0,0,0,.7)}
.panel::before,.panel::after{content:'';position:absolute;width:16px;height:16px;border:2px solid var(--gold);transform:rotate(45deg)}
.panel::before{top:-9px;left:-9px;border-right:none;border-bottom:none}
.panel::after{bottom:-9px;right:-9px;border-left:none;border-top:none}
.kicker{font-size:.62rem;letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.title{font-family:var(--disp);font-weight:700;font-size:clamp(2.3rem,7vw,3.6rem);letter-spacing:.08em;line-height:1.05;
  color:#f3e2b8;text-shadow:0 0 28px rgba(255,170,80,.35),0 2px 4px rgba(0,0,0,.65)}
.tag{margin:14px auto 4px;max-width:44ch;font-size:.9rem;line-height:1.55;color:#d8c4a0}
.tag em{color:#ffd98b;font-style:normal}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin:20px auto 4px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:#cbb691}
.lg i{width:21px;height:13px;border-radius:2px;display:grid;place-items:center;font-style:normal;font-size:9px;line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 4px rgba(0,0,0,.4)}
.lg.glass i{background:linear-gradient(#e86a7c,#c93a52)}
.lg.tough i{background:linear-gradient(#b98c4a,#6e4d22);border:1px solid rgba(255,230,180,.35)}
.lg.stone i{background:linear-gradient(#4a5262,#272c38)}
.lg.gem i{background:radial-gradient(circle at 35% 30%,#fff6d8,#f0c96a 55%,#a87a1e);box-shadow:0 0 10px rgba(255,214,120,.75)}
.lg.rune i{background:linear-gradient(#3f8f7a,#1d4a3e);color:#ffd98b}
.keys{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin:18px 0 6px;font-size:.78rem;color:#cbb691}
kbd{font-family:var(--body);font-size:.72rem;color:#f3e2b8;border:1px solid rgba(217,164,65,.45);border-bottom-width:2px;
  border-radius:5px;padding:2px 8px;background:rgba(0,0,0,.35)}
.btnrow{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{font-family:var(--body);font-weight:700;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  padding:13px 28px;border-radius:8px;transition:transform .12s,box-shadow .2s,filter .2s}
.btn.primary{color:#2a1508;background:linear-gradient(#f4d98b,#c98f2e);border:1px solid #8a5a1a;
  box-shadow:0 4px 0 #6e4413,0 8px 22px rgba(255,170,60,.2)}
.btn.primary:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 6px 0 #6e4413,0 14px 30px rgba(255,190,80,.35)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #6e4413}
.btn.ghost{color:#d9b877;background:transparent;border:1px solid rgba(217,164,65,.5)}
.btn.ghost:hover{color:#ffd98b;border-color:#ffd98b;box-shadow:0 0 18px rgba(255,200,110,.2)}
.hintline{margin-top:16px;font-size:.74rem;color:#9a8263;letter-spacing:.08em}
.bestline{margin-top:14px;font-size:.8rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.bestline b{color:#ffd98b;font-family:var(--disp);font-size:1.05rem;letter-spacing:.05em}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:22px auto 0;max-width:380px}
.stats div{background:rgba(0,0,0,.32);border:1px solid rgba(217,164,65,.28);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.stats span{font-size:.56rem;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.stats b{font-family:var(--disp);font-size:1.35rem;color:#f3e2b8;font-variant-numeric:tabular-nums}
.nb{margin-top:16px;font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:#ffd98b;animation:nbp 1.2s ease infinite alternate}
@keyframes nbp{to{text-shadow:0 0 18px rgba(255,217,139,.9)}}
</style>
</head>
<body>
<canvas id="cvs"></canvas>

<div id="hud" class="hide">
  <div class="hgroup"><span class="label">Score</span><span id="score" class="big">0</span></div>
  <div class="hgroup mid"><span id="lvlName" class="lvl">I · First Light</span><span id="comboChip"></span></div>
  <div class="hgroup right"><span class="label">Best</span><span id="best" class="big">0</span><span id="lives" class="lives"></span></div>
</div>

<div id="banner"></div>
<div id="flash"></div>
<button id="muteChip">♪ sound on</button>

<div id="overlay"><div class="panel" id="panel"></div></div>

<script>
'use strict';
/* ============================== utils ============================== */
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function shade(hex,f){ // f>0 lighten, f<0 darken
  const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,t=f>0?255:0,p=Math.abs(f);
  return `rgb(${Math.round(lerp(r,t,p))},${Math.round(lerp(g,t,p))},${Math.round(lerp(b,t,p))})`;
}
function fmt(n){return n.toLocaleString('en-US');}

/* ============================== audio ============================== */
let muted=false;
try{muted=localStorage.getItem('shardlight_muted')==='1';}catch(e){}
const AU={ac:null,gain:null,
  init(){ if(this.ac){ if(this.ac.state==='suspended')this.ac.resume(); return; }
    const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
    this.ac=new A(); this.gain=this.ac.createGain(); this.gain.gain.value=muted?0:0.5; this.gain.connect(this.ac.destination); },
  tone(f,d,type,v,slideTo,delay){ if(!this.ac||muted)return; type=type||'sine'; v=v||0.2; delay=delay||0;
    const t=this.ac.currentTime+delay,o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+d+0.03); },
  noise(d,v,fc,delay){ if(!this.ac||muted)return; v=v||0.2; fc=fc||2000; delay=delay||0;
    const t=this.ac.currentTime+delay,n=Math.max(16,this.ac.sampleRate*d|0),buf=this.ac.createBuffer(1,n,this.ac.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
    const s=this.ac.createBufferSource();s.buffer=buf;const f=this.ac.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=0.8;
    const g=this.ac.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(this.gain);s.start(t); }
};
const SFX={
  paddle(){AU.tone(140,.08,'triangle',.3,90);AU.noise(.05,.1,900);},
  wall(){AU.tone(230,.05,'sine',.1,190);},
  brick(row,combo){const f=440+(5-row)*36+Math.min(combo,12)*14;AU.tone(f,.1,'sine',.2,f*1.4);AU.tone(f*2.34,.06,'sine',.09);AU.noise(.04,.1,5200);},
  crack(){AU.tone(300,.06,'square',.12,200);AU.noise(.05,.12,2600);},
  stone(){AU.tone(85,.1,'sine',.32,58);AU.noise(.04,.16,700);},
  clink(){AU.tone(950,.05,'triangle',.14,700);AU.tone(1420,.04,'sine',.07);},
  gem(){[880,1318,1760].forEach((f,i)=>AU.tone(f,.09,'sine',.12,null,i*.05));},
  power(){[440,587,880].forEach((f,i)=>AU.tone(f,.1,'triangle',.16,null,i*.06));},
  multi(){[330,494,659,988].forEach((f,i)=>AU.tone(f,.08,'square',.09,null,i*.05));},
  launch(){AU.tone(320,.07,'sine',.16,540);},
  lose(){AU.tone(280,.5,'sawtooth',.18,55);AU.noise(.3,.09,400);},
  clear(){[523,659,784,1046].forEach((f,i)=>AU.tone(f,.18,'triangle',.17,null,i*.09));},
  over(){[392,311,233,196].forEach((f,i)=>AU.tone(f,.35,'sine',.18,null,i*.22));},
  win(){[523,659,784,1046,1318,1568].forEach((f,i)=>AU.tone(f,.22,'triangle',.15,null,i*.11));AU.noise(.45,.07,6000,.5);}
};

/* ============================== data ============================== */
const PAL={'1':'#c93a52','2':'#e07b39','3':'#d9a13c','4':'#3fa06a','5':'#3f7fd0','6':'#3aa8a0'};
const ROMAN=['I','II','III','IV','V','VI'];
const LEVELS=[
 {name:'First Light',rows:[
  '.............','1111111111111','222G22222G222','.33333333333.','..444444444..','....55555....']},
 {name:'The Cloister',rows:[
  '.............','.4.4.4.4.4.4.','.#.#.#.#.#.#.','.5.5.5.G.5.5.','.#.#.#.#.#.#.','.6.6.6.6.6.6.']},
 {name:'The Vault',rows:[
  'TTTTTTTTTTTTT','..44G44G44...','.##.......##.','...555555....','..#.55555.#..','.....6G6.....']},
 {name:'Rose Window',rows:[
  '.....111.....','...1222221...','..123333321..','.1234GGG4321.','.12345554321.','..123333321..','.....111.....']},
 {name:'Warded Sanctum',rows:[
  '.............','..###...###..','..^6^.G.^6^..','.5.^5.G.5^.5.','..###...###..','....6G6G6....']},
 {name:'The Great Rose',rows:[
  '.##..####..##','.....^G^.....','TTTT.TTT.TTTT','.5.^5.G.5^.5.','###..GGG..###','.6.^6...6^.6.','..4.4G4G4.4..']}
];
function brickType(ch){return ch>='1'&&ch<='6'?'glass':ch==='T'?'tough':ch==='#'?'stone':ch==='G'?'gem':'rune';}
function colorOf(b){const t=b.type;
  if(t==='glass')return PAL[b.ch]; if(t==='tough')return '#c98f3e'; if(t==='gem')return '#ffe08a';
  if(t==='rune')return '#5fd6b0'; return '#9aa4b8';}

/* ============================== state ============================== */
const cvs=$('cvs'),ctx=cvs.getContext('2d');
let W=0,H=0,dpr=1,bg=null,playTop=64,ballR=8;
let state='menu',T=0,animT=0,last=0;
let level=0,score=0,dispScore=0,lives=3,combo=0,maxCombo=0,bricksBroken=0,hits=0;
let best=0; try{best=parseInt(localStorage.getItem('shardlight_best')||'0',10)||0;}catch(e){}
let bricks=[],balls=[],powerups=[],lasers=[],particles=[],floaters=[],embers=[];
let paddle={x:0,y:0,w:120,h:14,squash:0};
let wideUntil=0,slowUntil=0,laserUntil=0,laserCd=0;
let shakeV=0,flashA=0,clearEnd=0,pausedFrom='play';
const menuBall={x:200,y:200,dx:.14,dy:.1,trail:[],color:'#ffd98b'};

/* ============================== sizing ============================== */
function basePaddleW(){return clamp(W*0.15,84,168);}
function targetSpeed(){const b=clamp(H*0.5,320,680)*(1+level*0.035)*(1+Math.min(hits,40)*0.008);return b*(slowUntil>T?0.62:1);}

function buildBG(){
  bg=document.createElement('canvas');bg.width=Math.max(1,W*dpr);bg.height=Math.max(1,H*dpr);
  const c=bg.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  let g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1420');g.addColorStop(.35,'#1d0e15');g.addColorStop(.75,'#120809');g.addColorStop(1,'#0b0507');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  let rg=c.createRadialGradient(W/2,H*0.26,10,W/2,H*0.26,Math.max(W,H)*0.55);
  rg.addColorStop(0,'rgba(255,166,74,0.13)');rg.addColorStop(.5,'rgba(200,90,50,0.05)');rg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=rg;c.fillRect(0,0,W,H);
  for(let i=0;i<3;i++){ // cathedral arches
    const aw=W*(0.34+i*0.17),r=aw/2,x0=W/2-aw/2,x1=W/2+aw/2,topY=H*(0.28-i*0.02);
    c.strokeStyle=`rgba(217,164,65,${0.075-i*0.018})`;c.lineWidth=2+i;
    c.beginPath();c.moveTo(x0,H*1.03);c.lineTo(x0,topY+r);c.arc(W/2,topY+r,r,Math.PI,0,false);c.lineTo(x1,H*1.03);c.stroke();
  }
  let vg=c.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.35,W/2,H*0.5,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  c.fillStyle=vg;c.fillRect(0,0,W,H);
}

function resize(){
  const ow=W,oh=H;W=innerWidth;H=innerHeight;if(!W||!H)return;
  dpr=Math.min(window.devicePixelRatio||1,2);cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  playTop=Math.max(54,Math.min(86,H*0.09));ballR=clamp(W*0.009,6,11);
  buildBG();
  if(bricks.length)layoutBricks();
  paddle.y=H-clamp(H*0.07,42,70);paddle.h=Math.max(12,W*0.013);
  paddle.w=basePaddleW()*(wideUntil>T?1.45:1);
  if(ow&&oh&&(state!=='menu')){const sx=W/ow,sy=H/oh;
    paddle.x*=sx;for(const b of balls){b.x*=sx;b.y*=sy;b.r=ballR;}
    for(const p of powerups){p.x*=sx;p.y*=sy;}for(const l of lasers){l.x*=sx;l.y*=sy;}
  } else { if(!paddle.x)paddle.x=W/2; paddle.x=clamp(paddle.x,paddle.w/2,W-paddle.w/2); }
}

/* ============================== levels ============================== */
function layoutBricks(){
  const rows=LEVELS[level].rows,cols=Math.max(...rows.map(s=>s.length));
  const mW=W*0.05,gap=Math.max(3,W*0.004);
  const bw=(W-2*mW-(cols-1)*gap)/cols;
  const bh=clamp(bw*0.58,16,Math.min(40,H*0.05));
  const topY=Math.max(playTop+16,H*0.09);
  for(const b of bricks){b.w=bw;b.h=bh;b.x=mW+b.c*(bw+gap);b.y=topY+b.r*(bh+gap);}
}
function buildLevel(i){
  level=i;const rows=LEVELS[i].rows;bricks=[];
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){const ch=rows[r][c];if(ch==='.')continue;
    bricks.push({c,r,ch,type:brickType(ch),hp:ch==='T'?2:1,max:ch==='T'?2:1,alive:true,x:0,y:0,w:10,h:10,flash:0,sparkT:0});}
  layoutBricks();hits=0;lasers=[];powerups=[];
  $('lvlName').textContent=ROMAN[i]+' · '+LEVELS[i].name;
}

/* ============================== HUD / panels ============================== */
function updateBest(){ if(score>best){best=score;$('best').textContent=fmt(best);} }
function saveBest(){try{localStorage.setItem('shardlight_best',String(best));}catch(e){}}
function renderLives(){const el=$('lives');el.innerHTML='';for(let i=0;i<lives;i++){const s=document.createElement('i');s.className='lgem';el.appendChild(s);}}
function comboChip(){const el=$('comboChip');
  if(combo>=3){el.textContent='combo ×'+(1+Math.floor(combo/4))+' · '+combo;el.classList.add('on');}
  else el.classList.remove('on');}
function popCombo(){const el=$('comboChip');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function showBanner(a,b){const el=$('banner');el.innerHTML='<div class="b1">'+a+'</div>'+(b?'<div class="b2">'+b+'</div>':'');
  el.classList.remove('go');void el.offsetWidth;el.classList.add('go');}
function flashRed(){flashA=0.55;}

const panel=$('panel'),overlay=$('overlay');
panel.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)doAct(a.dataset.act);});
function showPanel(html){panel.innerHTML=html;overlay.classList.add('show');}
function hideOverlay(){overlay.classList.remove('show');}

function menuHTML(){
  return '<div class="kicker">◆ a stained-glass breakout ◆</div><h1 class="title">Shardlight</h1>'+
  '<p class="tag">The cathedral window has shattered into six puzzles. Keep the light alive — chain combos, catch falling gifts, and mind the warded runes: <em>they yield only to an upward strike.</em></p>'+
  '<div class="legend">'+
   '<span class="lg glass"><i></i>glass pane</span>'+
   '<span class="lg tough"><i></i>iron glass · 2 hits</span>'+
   '<span class="lg stone"><i></i>stone · unbreakable</span>'+
   '<span class="lg gem"><i>✦</i>gift brick</span>'+
   '<span class="lg rune"><i>▴</i>warded · hit from below</span></div>'+
  '<div class="keys"><span><kbd>Mouse</kbd> / <kbd>← →</kbd> move</span><span><kbd>Space</kbd> / <kbd>Click</kbd> launch</span><span><kbd>P</kbd> pause</span><span><kbd>R</kbd> restart</span><span><kbd>M</kbd> sound</span></div>'+
  '<div class="btnrow"><button class="btn primary" data-act="start">Begin the Work</button></div>'+
  '<p class="hintline">or press <kbd>Space</kbd></p>'+
  (best?'<p class="bestline">best score — <b>'+fmt(best)+'</b></p>':'');
}
function statsHTML(){
  const nb=score>=best&&score>0;
  return '<div class="stats">'+
   '<div><span>Score</span><b>'+fmt(score)+'</b></div><div><span>Best</span><b>'+fmt(best)+'</b></div>'+
   '<div><span>Panes Shattered</span><b>'+fmt(bricksBroken)+'</b></div><div><span>Longest Chain</span><b>×'+maxCombo+'</b></div></div>'+
  (nb?'<div class="nb">✦ new best ✦</div>':'');
}
function pauseHTML(){return '<h1 class="title" style="font-size:clamp(1.8rem,5vw,2.6rem)">Paused</h1>'+
 '<p class="tag">The light waits in the glass.</p>'+
 '<div class="btnrow"><button class="btn primary" data-act="resume">Resume</button><button class="btn ghost" data-act="restart">Restart Run</button><button class="btn ghost" data-act="menu">Main Menu</button></div>'+
 '<p class="hintline"><kbd>Space</kbd> resume · <kbd>R</kbd> restart</p>';}
function overHTML(){return '<div class="kicker">the last pane falls</div><h1 class="title" style="font-size:clamp(1.9rem,5.5vw,2.9rem)">The Light Fades</h1>'+
 statsHTML()+'<div class="btnrow"><button class="btn primary" data-act="restart">Try Again</button><button class="btn ghost" data-act="menu">Main Menu</button></div>'+
 '<p class="hintline"><kbd>Space</kbd> or <kbd>R</kbd> to try again</p>';}
function winHTML(){return '<div class="kicker">all six windows restored</div><h1 class="title" style="font-size:clamp(1.9rem,5.5vw,2.9rem)">Cathedral Complete</h1>'+
 '<p class="tag">Every pane sings again. The rose window blazes whole.</p>'+
 statsHTML()+'<div class="btnrow"><button class="btn primary" data-act="restart">Play Again</button><button class="btn ghost" data-act="menu">Main Menu</button></div>';}

/* ============================== actions ============================== */
function doAct(a){AU.init();
  if(a==='start'||a==='restart'||a==='again')startRun();
  else if(a==='resume')resumeGame();
  else if(a==='menu')toMenu();}
function startRun(){score=0;dispScore=0;lives=3;combo=0;maxCombo=0;bricksBroken=0;
  wideUntil=slowUntil=laserUntil=0;particles=[];floaters=[];shakeV=0;flashA=0;
  buildLevel(0);serve();renderLives();updateBest();$('best').textContent=fmt(Math.max(best,score));
  $('score').textContent='0';comboChip();hideOverlay();$('hud').classList.remove('hide');
  showBanner('Level I',LEVELS[0].name);}
function toMenu(){saveBest();state='menu';balls=[];powerups=[];lasers=[];
  buildLevel(0);showPanel(menuHTML());$('hud').classList.add('hide');}
function pauseGame(){if(state!=='play'&&state!=='serve')return;pausedFrom=state;state='pause';showPanel(pauseHTML());}
function resumeGame(){if(state!=='pause')return;state=pausedFrom;hideOverlay();last=performance.now();}
function gameOver(){saveBest();state='over';showPanel(overHTML());SFX.over();}
function winGame(){saveBest();state='win';showPanel(winHTML());SFX.win();}

/* ============================== balls / serve ============================== */
function serve(){combo=0;comboChip();
  balls=[{x:paddle.x,y:paddle.y-paddle.h/2-ballR-3,dirx:0,diry:-1,spd:targetSpeed(),r:ballR,color:'#ffd98b',trail:[],stuck:true}];
  state='serve';}
function launch(){if(state!=='serve')return;let did=false;
  for(const b of balls){if(b.stuck){const a=-Math.PI/2+rand(-0.3,0.3);b.dirx=Math.cos(a);b.diry=Math.sin(a);b.stuck=false;did=true;}}
  if(did){state='play';SFX.launch();}}

/* ============================== particles / fx ============================== */
function shard(x,y,color,n,pow){n=n||10;pow=pow||1;
  for(let i=0;i<n&&particles.length<320;i++){const a=rand(0,Math.PI*2),sp=rand(70,300)*pow*(W/900);
    particles.push({t:'shard',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(.4,.95),max:.95,size:rand(3,7)*(W>800?1:.8),rot:rand(0,6.3),vr:rand(-9,9),color});}}
function spark(x,y,color,n){n=n||6;
  for(let i=0;i<n&&particles.length<320;i++){const a=rand(0,Math.PI*2),sp=rand(40,180)*(W/900);
    particles.push({t:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.2,.45),max:.45,size:rand(1.5,3.5),color});}}
function floatText(txt,x,y,color,size){floaters.push({txt,x,y,color:color||'#ffd98b',size:size||16,life:1});}

/* ============================== powerups ============================== */
const PKINDS=[['wide','W','#6fc3ff','Wider Paddle'],['multi','M','#ff9d5c','Multiball'],['slow','S','#8fe0a8','Slow Light'],
              ['laser','L','#ff6b7a','Laser Array'],['life','+','#ffd98b','Extra Life']];
function maybeDrop(br){
  let chance=br.type==='gem'?1:br.type==='tough'?0.45:0.07;if(Math.random()>chance)return;
  const w=[3,3,2,2,1],tot=10;let r=Math.random()*tot,k=0;for(let i=1;i<5;i++){r-=w[i-1];if(r<=0)break;k=i;}
  powerups.push({x:br.x+br.w/2,y:br.y+br.h/2,vy:H*0.24,kind:PKINDS[k][0],ph:rand(0,6)});
}
function applyPower(k){const info=PKINDS.find(p=>p[0]===k);
  if(k==='wide')wideUntil=T+12;else if(k==='slow')slowUntil=T+8;else if(k==='laser'){laserUntil=T+9;laserCd=0;}
  else if(k==='life'){if(lives<5){lives++;renderLives();}else score+=300,updateBest();}
  else if(k==='multi')spawnMulti();
  floatText('✦ '+info[3]+' ✦',paddle.x,paddle.y-28,info[2],17);SFX.power();spark(paddle.x,paddle.y,info[2],10);}
function spawnMulti(){let srcs;
  if(state==='serve'){launch();srcs=balls.slice(0,1);}else srcs=balls.slice(0,2);
  for(const s of srcs){const a=Math.atan2(s.diry,s.dirx);
    for(const d of[-0.55,0.55]){if(balls.length>=6)break;
      balls.push({x:s.x,y:s.y,dirx:Math.cos(a+d),diry:Math.sin(a+d),spd:s.spd,r:s.r,color:s.color,trail:[]});}}
  SFX.multi();}

/* ============================== collision / damage ============================== */
function circleHit(cx,cy,r,x,y,w,h){const nx=clamp(cx,x,x+w),ny=clamp(cy,y,y+h),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<=r*r;}
function nudge(b,a){const c=Math.cos(a),s=Math.sin(a),nx=b.dirx*c-b.diry*s;b.diry=b.dirx*s+b.diry*c;b.dirx=nx;}

function hitBrick(b,br,laser){
  if(br.type==='stone'){SFX.stone();spark(br.x+br.w/2,br.y+br.h/2,'#9aa4b8',5);br.flash=1;return;}
  if(br.type==='rune'&&!laser&&b.diry>0){SFX.clink();br.flash=1;floatText('▴ strike from below',br.x+br.w/2,br.y-6,'#ffd98b',13);return;}
  br.hp--;
  if(br.hp>0){SFX.crack();spark(br.x+br.w/2,br.y+br.h/2,'#e8c07a',6);br.flash=1;return;}
  // destroyed
  br.alive=false;bricksBroken++;combo++;maxCombo=Math.max(maxCombo,combo);popCombo();comboChip();
  const basePts=br.type==='gem'?60:br.type==='rune'?70:br.type==='tough'?40:25;
  const pts=basePts*(1+Math.floor(combo/4));score+=pts;updateBest();
  const cx=br.x+br.w/2,cy=br.y+br.h/2,col=colorOf(br);
  floatText('+'+pts,cx,cy,'#f3e2b8',15);shard(cx,cy,col,10);spark(cx,cy,'#ffffff',4);
  if(!laser)b.color=col;
  if(br.type==='gem')SFX.gem();else SFX.brick(br.r,combo);
  maybeDrop(br);checkClear();}

function checkClear(){
  for(const br of bricks)if(br.alive&&br.type!=='stone')return;
  const bonus=250+level*150;score+=bonus;updateBest();
  state='clear';clearEnd=T+2.4;SFX.clear();
  for(const b of balls)spark(b.x,b.y,b.color,12);balls=[];
  for(let i=0;i<46;i++)shard(rand(W*0.1,W*0.9),rand(playTop+30,playTop+H*0.3),PAL[String(1+(Math.random()*6|0))],1,0.7);
  showBanner('Level Clear','+'+fmt(bonus)+' bonus');}

function stepBall(b,dt){
  const dist=b.spd*dt,steps=Math.max(1,Math.ceil(dist/b.r)),sdt=dt/steps;
  for(let i=0;i<steps;i++){
    b.x+=b.dirx*b.spd*sdt;b.y+=b.diry*b.spd*sdt;
    if(b.x<b.r+2){b.x=b.r+2;b.dirx=Math.abs(b.dirx);SFX.wall();spark(b.x,b.y,'#cbb691',3);}
    else if(b.x>W-b.r-2){b.x=W-b.r-2;b.dirx=-Math.abs(b.dirx);SFX.wall();spark(b.x,b.y,'#cbb691',3);}
    if(b.y<playTop+b.r){b.y=playTop+b.r;b.diry=Math.abs(b.diry);SFX.wall();}
    if(b.diry>0){const px=paddle.x-paddle.w/2,py=paddle.y;
      if(circleHit(b.x,b.y,b.r,px,py,paddle.w,paddle.h)){
        const rel=clamp((b.x-paddle.x)/(paddle.w/2),-1,1);
        const a=-Math.PI/2+rel*1.05;b.dirx=Math.cos(a);b.diry=Math.sin(a);
        b.y=py-b.r-0.5;paddle.squash=1;hits++;combo=0;comboChip();SFX.paddle();spark(b.x,py,'#f4d98b',4);}}
    for(const br of bricks){if(!br.alive)continue;
      if(Math.abs(b.x-(br.x+br.w/2))>b.r+br.w/2)continue;
      if(Math.abs(b.y-(br.y+br.h/2))>b.r+br.h/2)continue;
      const nx=clamp(b.x,br.x,br.x+br.w),ny=clamp(b.y,br.y,br.y+br.h),dx=b.x-nx,dy=b.y-ny;
      if(dx*dx+dy*dy>b.r*b.r)continue;
      const bcx=br.x+br.w/2,bcy=br.y+br.h/2;
      const ox=(b.r+br.w/2)-Math.abs(b.x-bcx),oy=(b.r+br.h/2)-Math.abs(b.y-bcy);
      if(ox<oy)b.dirx=b.x<bcx?-Math.abs(b.dirx):Math.abs(b.dirx);
      else b.diry=b.y<bcy?-Math.abs(b.diry):Math.abs(b.diry);
      if(Math.abs(b.diry)<0.12){b.diry=(b.diry<=0?-1:1)*0.16;const m=Math.hypot(b.dirx,b.diry);b.dirx/=m;b.diry/=m;}
      nudge(b,rand(-0.03,0.03));hitBrick(b,br,false);break;}
  }
}

/* ============================== input ============================== */
let pointerX=null,keyL=false,keyR=false;
window.addEventListener('mousemove',e=>{pointerX=e.clientX;});
window.addEventListener('touchstart',e=>{AU.init();if(e.touches[0]){pointerX=e.touches[0].clientX;if(state==='serve')launch();}},{passive:true});
window.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches[0])pointerX=e.touches[0].clientX;},{passive:false});
cvs.addEventListener('mousedown',()=>{AU.init();if(state==='serve')launch();});
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown')e.preventDefault();
  AU.init();
  if(k==='ArrowLeft'||k==='a'||k==='A')keyL=true;
  if(k==='ArrowRight'||k==='d'||k==='D')keyR=true;
  if((k===' '||k==='Enter')&&!e.repeat){
    if(state==='menu'||state==='over'||state==='win')startRun();
    else if(state==='serve')launch();
    else if(state==='pause')resumeGame();}
  if((k==='p'||k==='P'||k==='Escape')&&!e.repeat){if(state==='pause')resumeGame();else pauseGame();}
  if((k==='r'||k==='R')&&!e.repeat){if(state==='pause'||state==='over'||state==='win')startRun();}
  if((k==='m'||k==='M')&&!e.repeat)toggleMute();});
window.addEventListener('keyup',e=>{const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keyL=false;if(k==='ArrowRight'||k==='d'||k==='D')keyR=false;});
function toggleMute(){muted=!muted;if(AU.gain)AU.gain.gain.value=muted?0:0.5;
  $('muteChip').textContent=muted?'✕ sound off':'♪ sound on';
  try{localStorage.setItem('shardlight_muted',muted?'1':'0');}catch(e){}}
$('muteChip').addEventListener('click',()=>{AU.init();toggleMute();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
window.addEventListener('blur',()=>{if(state==='play'||state==='serve')pauseGame();});

/* ============================== update ============================== */
function update(dt){
  animT+=dt;
  if(state==='pause'){return;}
  // ambient embers
  if(embers.length<36&&Math.random()<dt*10)
    embers.push({x:rand(0,W),y:H+8,vy:-rand(14,42),ph:rand(0,6.3),size:rand(1,2.6),life:rand(4,9)});
  for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.y+=e.vy*dt;e.x+=Math.sin(animT*0.8+e.ph)*12*dt;e.life-=dt;
    if(e.life<0||e.y<-10)embers.splice(i,1);}

  if(state==='menu'){ // idle demo ball
    const mb=menuBall;mb.dx*=W;mb.dy*=H;mb.x+=mb.dx*0.5*dt*2;mb.y+=mb.dy*0.5*dt*2;
    if(mb.x<40||mb.x>W-40)mb.dx*=-1;if(mb.y<70||mb.y>H-80)mb.dy*=-1;
    mb.trail.push({x:mb.x,y:mb.y});if(mb.trail.length>15)mb.trail.shift();return;}

  if(state==='serve'||state==='play'){T+=dt;
    // paddle
    const pw=basePaddleW()*(wideUntil>T?1.45:1);paddle.w=lerp(paddle.w,pw,Math.min(1,dt*8));
    const pspd=W*1.1;
    if(keyL)paddle.x-=pspd*dt;if(keyR)paddle.x+=pspd*dt;
    else if(pointerX!=null)paddle.x=lerp(paddle.x,pointerX,Math.min(1,dt*18));
    paddle.x=clamp(paddle.x,paddle.w/2+4,W-paddle.w/2-4);
    paddle.squash=Math.max(0,paddle.squash-dt*5);

    // balls
    for(const b of balls){
      if(b.stuck){b.x=paddle.x;b.y=paddle.y-paddle.h/2-b.r-3;continue;}
      b.spd=lerp(b.spd,targetSpeed(),Math.min(1,dt*3));
      stepBall(b,dt);
      b.trail.push({x:b.x,y:b.y});if(b.trail.length>13)b.trail.shift();}
    // fell below
    for(let i=balls.length-1;i>=0;i--)if(balls[i].y>H+ballR*3)balls.splice(i,1);
    if(state==='play'&&balls.length===0){
      lives--;renderLives();shakeV=16;flashRed();SFX.lose();
      if(lives<=0)gameOver();else serve();}

    // lasers
    if(laserUntil>T&&state==='play'){laserCd-=dt;
      if(laserCd<=0){lasers.push({x:paddle.x-paddle.w*0.38,y:paddle.y-4},{x:paddle.x+paddle.w*0.38,y:paddle.y-4});laserCd=0.38;}}
    for(let i=lasers.length-1;i>=0;i--){const l=lasers[i];l.y-=H*1.5*dt;let dead=l.y<playTop-24;
      if(!dead)for(const br of bricks){if(!br.alive)continue;
        if(l.x>br.x&&l.x<br.x+br.w&&l.y>br.y&&l.y<br.y+br.h){hitBrick({diry:-1},br,true);spark(l.x,l.y,'#ff8b96',3);dead=true;break;}}
      if(dead)lasers.splice(i,1);}

    // powerups
    for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.y+=p.vy*dt;p.ph+=dt;
      const px=paddle.x-paddle.w/2;
      if(p.y>paddle.y-14&&p.y<paddle.y+paddle.h+14&&Math.abs(p.x-paddle.x)<paddle.w/2+16){applyPower(p.kind);powerups.splice(i,1);continue;}
      if(p.y>H+20)powerups.splice(i,1);}

    // bricks fx timers + shimmer
    for(const br of bricks){if(!br.alive)continue;br.flash=Math.max(0,br.flash-dt*4);
      if(br.type!=='stone'&&br.sparkT<=0&&Math.random()<dt*0.25)br.sparkT=1;}
    for(const br of bricks)if(br.sparkT>0)br.sparkT-=dt*2.2;
  }

  if(state==='clear'){T+=dt;if(T>=clearEnd){
    if(level+1<LEVELS.length){buildLevel(level+1);serve();showBanner('Level '+ROMAN[level],LEVELS[level].name);}
    else winGame();}}

  // particles / floaters
  const g=900*(H/700);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='shard'){p.vy+=g*dt;p.rot+=p.vr*dt;}else{p.vx*=0.96;p.vy*=0.96;}}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.life-=dt*0.9;f.y-=28*dt;if(f.life<=0)floaters.splice(i,1);}

  shakeV=Math.max(0,shakeV-46*dt);
  flashA=Math.max(0,flashA-dt*1.3);$('flash').style.opacity=flashA.toFixed(3);
  dispScore+=(score-dispScore)*Math.min(1,dt*8);
  const ds=Math.round(dispScore);if($('score').textContent!==fmt(ds))$('score').textContent=fmt(ds);
}

/* ============================== render ============================== */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawBrick(b){
  const{x,y,w,h}=b;let base='#888';
  if(b.type==='glass'){base=PAL[b.ch];
    const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,shade(base,0.35));g.addColorStop(.45,base);g.addColorStop(1,shade(base,-0.38));
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x+1,y+h-1);ctx.lineTo(x+1,y+1);ctx.lineTo(x+w-1,y+1);ctx.stroke();
  }else if(b.type==='tough'){
    const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#b98c4a');g.addColorStop(.5,'#8a6231');g.addColorStop(1,'#5c401d');
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    ctx.fillStyle='rgba(255,230,180,.5)';
    const rv=Math.min(2.2,w*0.09);[[x+rv+2,y+rv+2],[x+w-rv-2,y+rv+2],[x+rv+2,y+h-rv-2],[x+w-rv-2,y+h-rv-2]]
      .forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],rv,0,7);ctx.fill();});
    if(b.hp===1){let s=b.c*9301+b.r*49297+7;const rnd=()=>((s=(s*9301+49297)%233280)/233280);
      ctx.strokeStyle='rgba(20,10,5,.75)';ctx.lineWidth=1.4;ctx.beginPath();
      let cx=x+rnd()*w*0.3,cy=y;ctx.moveTo(cx,cy);
      for(let i=0;i<4;i++){cx+=rnd()*w*0.25+w*0.08;cy+=h/4*(0.6+rnd()*0.8);ctx.lineTo(clamp(cx,x+2,x+w-2),clamp(cy,y+2,y+h-2));}
      ctx.stroke();}
  }else if(b.type==='stone'){
    const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#4a5262');g.addColorStop(.5,'#343b49');g.addColorStop(1,'#232833');
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x+1,y+1.5);ctx.lineTo(x+w-1,y+1.5);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.4)';
    ctx.beginPath();ctx.moveTo(x+3,y+h*0.62);ctx.lineTo(x+w-3,y+h*0.62);ctx.stroke();
  }else if(b.type==='gem'){
    const pulse=0.5+0.5*Math.sin(animT*3+b.c);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const gl=ctx.createRadialGradient(x+w/2,y+h/2,1,x+w/2,y+h/2,w*0.7);
    gl.addColorStop(0,'rgba(255,230,150,'+(0.25+pulse*0.3)+')');gl.addColorStop(1,'rgba(255,230,150,0)');
    ctx.fillStyle=gl;ctx.fillRect(x-w*0.4,y-h*0.6,w*1.8,h*2.2);ctx.restore();
    const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#fff3c8');g.addColorStop(.5,'#f0c96a');g.addColorStop(1,'#a87a1e');
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    const cx=x+w/2,cy=y+h/2,s=h*0.34*(1+0.14*pulse);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();
    ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s*0.36,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s*0.36,cy);ctx.closePath();ctx.fill();
  }else if(b.type==='rune'){
    const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#3f8f7a');g.addColorStop(1,'#1d4a3e');
    ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgba(255,217,139,.9)';ctx.lineWidth=Math.max(1.6,h*0.12);ctx.lineJoin='round';
    for(let k=0;k<2;k++){const yy=y+h*0.68-k*h*0.3;
      ctx.beginPath();ctx.moveTo(x+w*0.3,yy);ctx.lineTo(x+w/2,yy-h*0.2);ctx.lineTo(x+w*0.7,yy);ctx.stroke();}
  }
  if(b.type!=='gem'&&b.sparkT>0){ // specular sweep
    const t=1-b.sparkT,off=t*(w+h)-h;
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.globalCompositeOperation='lighter';
    const sg=ctx.createLinearGradient(x+off-h,y,x+off+h,y+h);
    sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.35)');sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg;ctx.fillRect(x,y,w,h);ctx.restore();}
  if(b.flash>0){ctx.fillStyle='rgba(255,255,255,'+(b.flash*0.65)+')';ctx.fillRect(x,y,w,h);}
  ctx.strokeStyle='rgba(18,9,7,.6)';ctx.lineWidth=1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}

function render(){
  if(!bg)return;
  ctx.drawImage(bg,0,0,W,H);
  const sx=(Math.random()-0.5)*shakeV,sy=(Math.random()-0.5)*shakeV;
  ctx.save();ctx.translate(sx,sy);

  // embers (behind world)
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const e of embers){const a=Math.min(1,e.life/3)*0.28*(0.6+0.4*Math.sin(animT*2+e.ph));
    ctx.fillStyle='rgba(255,179,92,'+a.toFixed(3)+')';ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,7);ctx.fill();}
  ctx.restore();

  // pulsing glow behind brick zone
  if(bricks.length){const a=0.05+0.02*Math.sin(animT*0.9);
    const gg=ctx.createRadialGradient(W/2,H*0.24,10,W/2,H*0.24,Math.max(W,H)*0.4);
    gg.addColorStop(0,'rgba(255,170,80,'+a.toFixed(3)+')');gg.addColorStop(1,'rgba(255,170,80,0)');
    ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);}

  // top wall line
  const tg=ctx.createLinearGradient(0,0,W,0);
  tg.addColorStop(0,'rgba(217,164,65,0)');tg.addColorStop(.5,'rgba(217,164,65,.35)');tg.addColorStop(1,'rgba(217,164,65,0)');
  ctx.fillStyle=tg;ctx.fillRect(0,playTop-1,W,1.5);

  // bricks
  for(const b of bricks)if(b.alive)drawBrick(b);

  // powerups
  for(const p of powerups){const info=PKINDS.find(k=>k[0]===p.kind),w2=26*(W>700?1:.85),h2=18*(W>700?1:.85);
    ctx.save();ctx.translate(p.x,p.y+Math.sin(p.ph*4)*2);ctx.rotate(Math.sin(p.ph*3.2)*0.16);
    ctx.globalCompositeOperation='lighter';
    const gl=ctx.createRadialGradient(0,0,2,0,0,w2);gl.addColorStop(0,info[2]+'');gl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=0.35;ctx.fillStyle=gl;ctx.fillRect(-w2,-w2,w2*2,w2*2);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    rr(-w2/2,-h2/2,w2,h2,6);ctx.fillStyle='#1c0d14';ctx.fill();ctx.strokeStyle=info[2];ctx.lineWidth=1.6;ctx.stroke();
    ctx.fillStyle=info[2];ctx.font='700 '+Math.round(h2*0.7)+'px '+getComputedStyle(document.body).fontFamily;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(info[1],0,1);ctx.restore();}

  // lasers
  if(lasers.length){ctx.save();ctx.globalCompositeOperation='lighter';
    for(const l of lasers){const lg=ctx.createLinearGradient(l.x,l.y-16,l.x,l.y+4);
      lg.addColorStop(0,'rgba(255,139,150,0)');lg.addColorStop(1,'#ff8b96');
      ctx.strokeStyle=lg;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(l.x,l.y-16);ctx.lineTo(l.x,l.y+4);ctx.stroke();}
    ctx.restore();}

  // particles
  for(const p of particles){const a=p.life/p.max;
    if(p.t==='shard'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=a;
      ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.62);ctx.restore();}
    else{ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;
      ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();ctx.restore();}}

  // balls
  if(state==='menu'){const mb=menuBall;drawOrb(mb.trail,mb.x,mb.y,9,mb.color);}
  for(const b of balls)drawOrb(b.trail,b.x,b.y,b.r,b.color);

  // paddle
  if(state!=='menu'&&state!=='over'&&state!=='win'){
    const pw=paddle.w,ph=paddle.h,cx=paddle.x,cy=paddle.y+ph/2;
    ctx.save();ctx.translate(cx,cy);ctx.scale(1+0.2*paddle.squash,1-0.35*paddle.squash);
    const ug=ctx.createLinearGradient(0,-ph/2,0,ph/2);
    ug.addColorStop(0,'#f4d98b');ug.addColorStop(.55,'#c98f2e');ug.addColorStop(1,'#7a4c12');
    rr(-pw/2,-ph/2,pw,ph,ph/2);ctx.fillStyle=ug;ctx.fill();
    ctx.strokeStyle='rgba(50,25,4,.8)';ctx.lineWidth=1.4;ctx.stroke();
    const gs=ph*0.62;const bc=balls.length?balls[0].color:'#ffd98b';
    ctx.globalCompositeOperation='lighter';
    const bgl=ctx.createRadialGradient(0,0,1,0,0,gs*2);bgl.addColorStop(0,bc);bgl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=.5;ctx.fillStyle=bgl;ctx.fillRect(-gs*2,-gs*2,gs*4,gs*4);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=bc;ctx.beginPath();ctx.moveTo(0,-gs);ctx.lineTo(gs*0.66,0);ctx.lineTo(0,gs);ctx.lineTo(-gs*0.66,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(-gs*0.15,-gs*0.2,gs*0.2,0,7);ctx.fill();
    ctx.restore();}

  // floaters
  for(const f of floaters){ctx.save();ctx.globalAlpha=Math.min(1,f.life*1.4);
    ctx.font='700 '+Math.round(f.size)+'px Georgia,serif';ctx.textAlign='center';
    ctx.fillStyle='rgba(20,8,4,.75)';ctx.fillText(f.txt,f.x+1,f.y+1);
    ctx.fillStyle=f.color;ctx.fillText(f.txt,f.x,f.y);ctx.restore();}

  // launch hint
  if(state==='serve'){const a=0.45+0.3*Math.sin(animT*4);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#d9b877';
    ctx.font='italic '+Math.round(clamp(W*0.016,12,17))+'px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('space / click — release the light',W/2,H-clamp(H*0.07,42,70)+paddle.h+26);ctx.restore();}

  ctx.restore(); // shake
}
function drawOrb(trail,x,y,r,color){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<trail.length;i++){const t=i/trail.length;
    ctx.globalAlpha=t*0.22;ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,r*t*0.85,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,1,x,y,r*2.6);
  g.addColorStop(0,'#ffffff');g.addColorStop(.35,color);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.6,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-r*0.25,y-r*0.3,r*0.4,0,7);ctx.fill();
  ctx.restore();}

/* ============================== loop / boot ============================== */
function frame(ts){requestAnimationFrame(frame);
  const dt=Math.min(0.033,(ts-last)/1000||0);last=ts;
  update(dt);render();}

window.addEventListener('resize',resize);
resize();
paddle={x:W/2,y:H-clamp(H*0.07,42,70),w:basePaddleW(),h:Math.max(12,W*0.013),squash:0};
menuBall.x=W*0.3;menuBall.y=H*0.45;
buildLevel(0);renderLives();$('best').textContent=fmt(best);
$('muteChip').textContent=muted?'✕ sound off':'♪ sound on';
state='menu';showPanel(menuHTML());
requestAnimationFrame(t=>{last=t;frame(t);});
</script>
</body>
</html>
