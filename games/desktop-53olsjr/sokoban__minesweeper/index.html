<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Minesweeper Sokoban</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#0b120e;
  background-image:radial-gradient(ellipse at 50% 38%, rgba(52,84,60,.35), transparent 60%),
                   radial-gradient(ellipse at 85% 90%, rgba(120,70,20,.10), transparent 50%),
                   repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px);
  font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#e9e4d5;
  -webkit-user-select:none;user-select:none;touch-action:none;
}
.d{font-family:Impact,'Arial Black','Franklin Gothic Bold',sans-serif;letter-spacing:.06em}
#cv{position:fixed;inset:0;display:block}
/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;pointer-events:none;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:#16211bee;border:1px solid #33463a;padding:7px 13px;font-size:12px;letter-spacing:.14em;color:#9fb3a4}
.chip b{font-family:Impact,'Arial Black',sans-serif;font-size:20px;letter-spacing:.05em;color:#ffd24a;font-weight:400}
#lvName{color:#cfd8cc;font-size:12px;letter-spacing:.18em}
.chip.level span:first-child{font-family:Impact,'Arial Black',sans-serif;font-size:16px;color:#ff9f43;letter-spacing:.05em}
#lives{gap:5px;padding:7px 10px}
#lives .dmg{display:inline-block;line-height:0}
#lives .spent{filter:grayscale(1);opacity:.28}
#lives.low .dmg:not(.spent){animation:lowp 1s infinite}
@keyframes lowp{0%,100%{filter:drop-shadow(0 0 0 rgba(255,60,40,0))}50%{filter:drop-shadow(0 0 6px rgba(255,80,50,.9))}}
#sndBtn{pointer-events:auto;cursor:pointer;background:#16211bee;border:1px solid #33463a;color:#9fb3a4;padding:7px 13px;font-size:11px;letter-spacing:.14em;font-family:inherit}
#sndBtn:hover{color:#ffd24a;border-color:#5b7a63}
#sndBtn.off{color:#5c6f63;text-decoration:line-through}
.spacer{flex:1}
/* ---------- banner ---------- */
#banner{position:fixed;top:15%;left:0;width:100%;text-align:center;z-index:6;pointer-events:none;opacity:0}
#banner.show{animation:bn 1.7s ease forwards}
@keyframes bn{0%{opacity:0;transform:translateY(16px) scale(.9)}18%{opacity:1;transform:none}72%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#bnMain{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(36px,7vw,66px);letter-spacing:.08em;color:#ffd24a;text-shadow:0 5px 0 rgba(0,0,0,.55)}
#bnSub{margin-top:6px;font-size:13px;letter-spacing:.42em;color:#9fb3a4;text-transform:uppercase}
/* ---------- flash ---------- */
#flashfx{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%, rgba(255,160,80,.55), rgba(255,50,25,.3) 55%, transparent 80%)}
#flashfx.on{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(4,9,6,.8);padding:14px}
#overlay.on{display:flex}
.pwrap{filter:drop-shadow(10px 10px 0 rgba(0,0,0,.5))}
.panel{width:min(600px,94vw);background:#131d16;border:2px solid #3b4f40;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.hazard{height:9px;background:repeating-linear-gradient(-45deg,#ffb648 0 12px,#101a13 12px 24px)}
.pbody{padding:24px 28px 28px;max-height:calc(92vh - 9px);overflow:auto}
.titlewrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1.title{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(38px,8vw,64px);line-height:.92;letter-spacing:.05em;text-shadow:3px 3px 0 rgba(0,0,0,.6)}
h1.title span{display:block}
h1.title .t2{color:#ffd24a}
h1.title.red{color:#ff5238}
h1.title.gold{color:#ffd24a}
.dynamo{width:74px;height:74px;flex:none;transform:rotate(-8deg)}
.spark{transform-box:fill-box;transform-origin:center;animation:sp .45s infinite alternate}
@keyframes sp{from{opacity:.4;transform:scale(.7)}to{opacity:1;transform:scale(1.35)}}
.tag{color:#9fb3a4;font-size:15px;margin:12px 0 18px;line-height:1.5}
.rules{margin-bottom:16px}
.rules li{list-style:none;display:flex;gap:12px;align-items:flex-start;margin:11px 0;font-size:14px;line-height:1.45;color:#cfd8cc}
.ric{width:30px;height:30px;flex:none;margin-top:1px}
.numchip{display:inline-flex;width:30px;height:30px;flex:none;align-items:center;justify-content:center;background:#1d2c22;border:1px solid rgba(255,196,110,.2);font-family:Impact,sans-serif;font-size:19px;color:#ff8a5f}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 22px;background:#0d1510;border:1px solid #2f4034;padding:12px 16px;margin-bottom:20px;font-size:12px;letter-spacing:.1em;color:#9fb3a4}
.ctrls div{display:flex;align-items:center;gap:7px}
.key{display:inline-block;min-width:26px;text-align:center;padding:3px 8px;background:#0b110d;border:1px solid #3b4f40;border-bottom-width:3px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#ffd24a}
.btn{font-family:Impact,'Arial Black',sans-serif;font-size:19px;letter-spacing:.09em;background:#ffb648;color:#1a1206;border:none;padding:13px 28px;cursor:pointer;box-shadow:0 5px 0 #9a6d1f,0 9px 16px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #9a6d1f,0 12px 18px rgba(0,0,0,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6d1f}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.ghost{background:transparent;color:#cfd8cc;border:2px solid #3b4f40;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.btn.ghost:hover{border-color:#5b7a63;color:#ffd24a}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.bestline{margin-top:16px;font-size:12px;letter-spacing:.24em;color:#7d9184}
.bestline b{font-family:Impact,sans-serif;font-size:18px;color:#ffd24a;letter-spacing:.05em;margin-left:6px}
.stats{display:flex;gap:10px;margin:20px 0}
.stats>div{flex:1;background:#0d1510;border:1px solid #2f4034;padding:12px 8px;text-align:center}
.stats span{display:block;font-size:10px;letter-spacing:.26em;color:#7d9184;margin-bottom:4px}
.stats b{font-family:Impact,sans-serif;font-size:27px;color:#ffd24a;font-weight:400}
.newbest{display:inline-block;background:#ffb648;color:#1a1206;font-family:Impact,sans-serif;font-size:13px;letter-spacing:.1em;padding:5px 12px;margin-bottom:8px;transform:rotate(-2deg)}
/* ---------- dpad ---------- */
#dpad{position:fixed;right:16px;bottom:16px;z-index:7;display:none;grid-template-columns:repeat(3,54px);grid-auto-rows:54px;gap:6px}
@media (pointer:coarse){#dpad{display:grid}}
#dpad button{background:#16211bd9;border:1px solid #3b4f40;color:#ffd24a;font-size:20px;cursor:pointer;touch-action:none}
#dpad button:active{background:#25352b}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header id="hud">
  <div class="chip level"><span id="lvNum">LV 1</span><span id="lvName">—</span></div>
  <div class="spacer"></div>
  <div class="chip"><span>SCORE</span><b id="scoreV">0</b></div>
  <div class="chip" id="lives"></div>
  <div class="chip"><span>BEST</span><b id="bestV">0</b></div>
  <button id="sndBtn">SOUND ON</button>
</header>

<div id="banner"><div id="bnMain"></div><div id="bnSub"></div></div>
<div id="flashfx"></div>
<div id="overlay"></div>

<div id="dpad">
  <span></span><button data-dx="0" data-dy="-1">▲</button><span></span>
  <button data-dx="-1" data-dy="0">◀</button><button data-dx="0" data-dy="1">▼</button><button data-dx="1" data-dy="0">▶</button>
</div>

<script>
'use strict';
/* ================= LEVELS  (# wall · . floor · M mine · O pad · B crate · P player) ================= */
const LEVELS=[
 {name:'FIRST STEPS',map:[
  '#########',
  '#.P.....#',
  '#..M....#',
  '#..B.O..#',
  '#.......#',
  '#...M...#',
  '#########']},
 {name:'DOUBLE SHIFT',map:[
  '#########',
  '#.......#',
  '#.B...O.#',
  '#..#....#',
  '#.M..B.O#',
  '#...P..M#',
  '#########']},
 {name:'CROSSFIRE',map:[
  '#########',
  '#.O..O..#',
  '#.B..B.M#',
  '#.......#',
  '#.###..M#',
  '#...P.M.#',
  '#########']},
 {name:'ORDER MATTERS',map:[
  '##########',
  '#........#',
  '#.O..O.O.#',
  '#..B.B.B.#',
  '#.M.....M#',
  '#..###..M#',
  '#...P....#',
  '##########']},
 {name:'THE GAUNTLET',map:[
  '##########',
  '#.......M#',
  '#.B.B.B..#',
  '#.#.....M#',
  '#M...##..#',
  '#.O.O.O..#',
  '#...P..M.#',
  '##########']}
];

/* ================= STATE ================= */
const K=(x,y)=>x*64+y, TAU=Math.PI*2;
let state='menu', levelIdx=0, lives=3, score=0, prevBest=0, muted=false;
let W=0,H=0,walls,mines,pads,crates,player,revealed,minePop={};
let busyT=0,walkPhase=0,moving=false,boardT=1;
let particles=[],floats=[],flashes=[],shakeAmp=0,deathCell=null,dyingT=0,clearT=0,minesRevealed=false;

/* ================= BEST SCORE ================= */
let best=0; try{best=parseInt(localStorage.getItem('ms-sokoban-best')||'0',10)||0;}catch(e){}
function persistBest(){try{localStorage.setItem('ms-sokoban-best',String(best));}catch(e){}}
function addScore(n){score+=n; if(score>best){best=score;persistBest();} updateHUD();}

/* ================= AUDIO (WebAudio, unlocked on first gesture) ================= */
let AC=null,master=null,noiseBuf=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:.5; master.connect(AC.destination);
  }catch(e){}
}
function getNoise(){
  if(noiseBuf)return noiseBuf;
  const n=AC.sampleRate, b=AC.createBuffer(1,n,n), d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1; noiseBuf=b; return b;
}
function tone(o){
  if(!AC||muted)return;
  const t0=AC.currentTime+(o.delay||0), dur=o.dur||.15, v=o.v||.25;
  const os=AC.createOscillator(), gn=AC.createGain();
  os.type=o.type||'sine';
  os.frequency.setValueAtTime(o.f,t0);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+dur);
  gn.gain.setValueAtTime(0,t0);
  gn.gain.linearRampToValueAtTime(v,t0+.012);
  gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  os.connect(gn).connect(master); os.start(t0); os.stop(t0+dur+.05);
}
function nz(o){
  if(!AC||muted)return;
  const t0=AC.currentTime+(o.delay||0), dur=o.dur||.3, v=o.v||.4;
  const s=AC.createBufferSource(); s.buffer=getNoise(); s.loop=true;
  const fl=AC.createBiquadFilter(); fl.type=o.type||'lowpass';
  fl.frequency.setValueAtTime(o.f||600,t0);
  if(o.sweep)fl.frequency.exponentialRampToValueAtTime(Math.max(30,o.sweep),t0+dur);
  const gn=AC.createGain();
  gn.gain.setValueAtTime(v,t0); gn.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(fl).connect(gn).connect(master); s.start(t0); s.stop(t0+dur+.05);
}
const sfx={
  tick(){tone({f:240,f2:180,type:'square',dur:.05,v:.10});},
  push(){tone({f:110,f2:65,type:'triangle',dur:.13,v:.35});nz({f:320,dur:.09,v:.14});},
  bump(){tone({f:80,dur:.07,v:.25});},
  pad(){tone({f:660,dur:.09,v:.24});tone({f:990,dur:.16,v:.24,type:'triangle',delay:.08});},
  boom(){nz({f:320,sweep:55,dur:.7,v:.9});tone({f:150,f2:32,dur:.6,v:.55});tone({f:60,f2:28,type:'triangle',dur:.5,v:.5});},
  clear(){[523,659,784,1046].forEach((f,i)=>tone({f,type:'triangle',dur:.16,v:.24,delay:i*.09}));},
  over(){[330,262,196].forEach((f,i)=>tone({f,type:'sawtooth',dur:.32,v:.15,delay:i*.24}));},
  ui(){tone({f:480,type:'square',dur:.05,v:.13});}
};

/* ================= CANVAS / LAYOUT ================= */
const cv=document.getElementById('cv'), g=cv.getContext('2d');
let vw=0,vh=0,dpr=1,cs=48,bx=0,by=0; const HUDH=62;
function layout(){
  if(!W)return;
  cs=Math.floor(Math.min((vw-28)/W,(vh-HUDH-34)/H));
  cs=Math.max(24,Math.min(78,cs));
  bx=Math.round((vw-W*cs)/2);
  by=Math.round(HUDH+( (vh-HUDH)-H*cs )/2);
}
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  vw=innerWidth; vh=innerHeight;
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  cv.style.width=vw+'px'; cv.style.height=vh+'px';
  g.setTransform(dpr,0,0,dpr,0,0); layout();
}
addEventListener('resize',resize);

/* ================= LEVEL LOAD / REVEAL ================= */
function loadLevel(i){
  const L=LEVELS[i]; H=L.map.length; W=L.map[0].length;
  walls=new Set(); mines=new Set(); pads=new Set(); crates=[]; revealed=new Map(); minePop={};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const ch=L.map[y][x];
    if(ch==='#')walls.add(K(x,y));
    else if(ch==='M')mines.add(K(x,y));
    else if(ch==='O')pads.add(K(x,y));
    else if(ch==='B')crates.push({x,y,fx:x,fy:y,at:1,dead:false});
    else if(ch==='P')player={x,y,fx:x,fy:y,at:1,dir:[0,1],alive:true};
  }
  revealed.set(K(player.x,player.y),performance.now());
  busyT=0;walkPhase=0;moving=false;boardT=0;
  particles=[];floats=[];flashes=[];shakeAmp=0;
  deathCell=null;dyingT=0;clearT=0;minesRevealed=false;
  layout(); updateHUD();
}
function revealCell(x,y){ if(!revealed.has(K(x,y))) revealed.set(K(x,y),performance.now()); }
function numAt(x,y){
  let n=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    if(mines.has(K(x+dx,y+dy)))n++;
  }
  return n;
}

/* ================= GAME LOGIC ================= */
function tryMove(dx,dy){
  if(state!=='playing'||busyT>0||!player.alive)return;
  player.dir=[dx,dy];
  const tx=player.x+dx, ty=player.y+dy;
  if(walls.has(K(tx,ty))){sfx.bump();return;}
  const ci=crates.findIndex(c=>!c.dead&&c.x===tx&&c.y===ty);
  let c=null,bx2=0,by2=0,blocked=false,fromMine=false,hitMine=false;
  if(ci>=0){
    c=crates[ci]; bx2=tx+dx; by2=ty+dy;
    blocked = walls.has(K(bx2,by2)) || crates.some(o=>!o.dead&&o!==c&&o.x===bx2&&o.y===by2);
    fromMine = mines.has(K(tx,ty));
  } else hitMine = mines.has(K(tx,ty));
  if(blocked){sfx.bump();return;}
  player.fx=player.x; player.fy=player.y; player.at=0;
  if(c){c.fx=c.x;c.fy=c.y;c.at=0;c.x=bx2;c.y=by2;}
  player.x=tx; player.y=ty; busyT=.13;
  c?sfx.push():sfx.tick();
  if(fromMine){c.dead=true;dieAt(tx,ty);return;}
  if(hitMine){dieAt(tx,ty);return;}
  revealCell(tx,ty);
  if(c&&pads.has(K(bx2,by2))){
    addScore(50); sfx.pad(); addFloat(bx2,by2,'+50','#ffd24a'); goldBurst(bx2,by2);
  }
  checkWin();
}
function dieAt(x,y){
  state='dying'; player.alive=false; deathCell={x,y}; dyingT=0;
  shakeAmp=1; bigBurst(x,y); sfx.boom(); flashFX();
}
function checkWin(){
  if(state!=='playing')return;
  for(const k of pads){
    const x=k%64, y=(k/64)|0;
    if(!crates.some(c=>!c.dead&&K(c.x,c.y)===k))return;
  }
  state='levelclear'; clearT=0; addScore(200); sfx.clear();
  for(const k of pads){goldBurst(k%64,(k/64)|0);}
  addFloat(W/2-0.5,H/2-0.5,'+200','#ffe9a8');
  banner('LEVEL CLEAR','BONUS +200');
}

/* ================= FX ================= */
function cellPx(x,y){return [bx+(x+.5)*cs, by+(y+.5)*cs];}
function addFloat(x,y,txt,col){floats.push({x,y,txt,col,t:0});}
function goldBurst(x,y){
  const [px,py]=cellPx(x,y);
  for(let i=0;i<14;i++){
    const a=Math.random()*TAU, sp=(.5+Math.random())*cs;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:.45+Math.random()*.4,size:1.6+Math.random()*2.4,col:['#ffd24a','#ffe9a8','#ff9f43'][i%3],type:'spark'});
  }
}
function bigBurst(x,y){
  const [px,py]=cellPx(x,y);
  flashes.push({x:px,y:py,t:0});
  for(let i=0;i<36;i++){
    const a=Math.random()*TAU, sp=(.7+Math.random()*1.9)*cs;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:.5+Math.random()*.6,size:2+Math.random()*3,col:['#ffd24a','#ff8a3c','#ff5238','#fff3c0'][i%4],type:'spark'});
  }
  for(let i=0;i<12;i++){
    const a=Math.random()*TAU, sp=(.15+Math.random()*.4)*cs;
    particles.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:1+Math.random()*.8,size:3+Math.random()*4,col:null,type:'smoke'});
  }
}
function flashFX(){const el=document.getElementById('flashfx');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');}

/* ================= HUD / BANNER / SCREENS ================= */
const lvNum=document.getElementById('lvNum'), lvName=document.getElementById('lbName' in document?'lbName':'lvName'),
      scoreV=document.getElementById('scoreV'), bestV=document.getElementById('bestV'),
      livesEl=document.getElementById('lives'), sndBtn=document.getElementById('sndBtn'),
      overlay=document.getElementById('overlay');
const DYN='<svg viewBox="0 0 20 20" width="18" height="18"><rect x="7" y="5" width="6.5" height="13" rx="2" fill="#c0392b"/><rect x="6" y="10" width="8.5" height="3" fill="#ffd24a"/><path d="M10 5 C10 2 14 3.5 15.5 1.5" stroke="#c9b26a" stroke-width="1.5" fill="none"/><circle cx="16" cy="1.5" r="1.7" fill="#ffd24a"/></svg>';
function renderLives(){
  livesEl.innerHTML='';
  for(let i=0;i<3;i++){const s=document.createElement('span');s.className='dmg'+(i<lives?'':' spent');s.innerHTML=DYN;livesEl.appendChild(s);}
  livesEl.classList.toggle('low',lives===1);
}
function updateHUD(){
  lvNum.textContent='LV '+(levelIdx+1);
  lvName.textContent=LEVELS[levelIdx].name;
  scoreV.textContent=score; bestV.textContent=best;
  renderLives();
  sndBtn.textContent=muted?'SOUND OFF':'SOUND ON';
  sndBtn.classList.toggle('off',muted);
}
function banner(main,sub){
  const b=document.getElementById('banner');
  document.getElementById('bnMain').textContent=main;
  document.getElementById('bnSub').textContent=sub||'';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
const ICON_CRATE='<svg viewBox="0 0 32 32" class="ric"><rect x="4" y="4" width="24" height="24" fill="#b97a3f" stroke="#6d421d" stroke-width="2.5"/><path d="M8 8 L24 24 M24 8 L8 24" stroke="#7a4b1e" stroke-width="3.5"/></svg>';
const ICON_MINE='<svg viewBox="0 0 32 32" class="ric"><g stroke="#5e1710" stroke-width="2.5"><path d="M16 3v26M3 16h26M7 7l18 18M25 7L7 25"/></g><circle cx="16" cy="16" r="9.5" fill="#c0392b"/><circle cx="12.5" cy="12.5" r="2.6" fill="#ff9d8a"/></svg>';
function showScreen(type){
  let html='';
  if(type==='menu'){
    html=`<div class="titlewrap">
      <svg class="dynamo" viewBox="0 0 64 64"><rect x="21" y="22" width="19" height="36" rx="4" fill="#c0392b" stroke="#7e1f14" stroke-width="2"/><rect x="18.5" y="35" width="24" height="9" fill="#ffd24a"/><path d="M30 22 C30 11 42 15 45 6" stroke="#c9b26a" stroke-width="3.5" fill="none"/><circle class="spark" cx="46" cy="5" r="4.5" fill="#ffd24a"/></svg>
      <h1 class="title"><span>MINESWEEPER</span><span class="t2">SOKOBAN</span></h1></div>
    <p class="tag">Push every crate onto the glowing pads — but the floor is rigged with hidden mines, and only your scan trail tells you where they hide.</p>
    <ul class="rules">
      <li>${ICON_CRATE}<span><b>Crates cover cells</b> — even mines. A mine detonates only when exposed: under a boot, or the moment a crate leaves it.</span></li>
      <li>${ICON_MINE}<span><b>Step on a hidden mine</b> and the whole field goes up. You have 3 lives per run.</span></li>
      <li><span class="numchip">3</span><span><b>Every scanned cell counts its neighboring mines.</b> Deduce before you walk.</span></li>
    </ul>
    <div class="ctrls">
      <div><span class="key">↑↓←→</span><span class="key">WASD</span> MOVE / PUSH (or swipe)</div>
      <div><span class="key">R</span> RESET LEVEL</div>
      <div><span class="key">P</span> PAUSE</div>
      <div><span class="key">M</span> SOUND</div>
    </div>
    <button class="btn" data-act="start">START &nbsp;▸&nbsp; ENTER</button>
    ${best>0?`<p class="bestline">FIELD RECORD<b>${best}</b></p>`:''}`;
  } else if(type==='paused'){
    html=`<h1 class="title">PAUSED</h1>
    <div class="ctrls" style="margin-top:18px">
      <div><span class="key">↑↓←→</span><span class="key">WASD</span> MOVE / PUSH</div>
      <div><span class="key">R</span> RESET LEVEL</div>
      <div><span class="key">P</span> RESUME</div>
    </div>
    <div class="btnrow"><button class="btn" data-act="resume">RESUME &nbsp;▸&nbsp; P</button><button class="btn ghost" data-act="restart">RESET LEVEL</button></div>`;
  } else if(type==='gameover'){
    html=`${score>prevBest?`<span class="newbest">NEW FIELD RECORD</span>`:''}
    <h1 class="title red">DETONATED</h1>
    <p class="tag">The minefield claimed your last life.</p>
    <div class="stats">
      <div><span>SCORE</span><b>${score}</b></div>
      <div><span>BEST</span><b>${best}</b></div>
      <div><span>REACHED</span><b>LV ${levelIdx+1}</b></div>
    </div>
    <button class="btn" data-act="retry">TRY AGAIN &nbsp;▸&nbsp; ENTER</button>`;
  } else if(type==='victory'){
    html=`${score>prevBest?`<span class="newbest">NEW FIELD RECORD</span>`:''}
    <h1 class="title gold">FIELD CLEARED</h1>
    <p class="tag">All ${LEVELS.length} levels swept. Every crate is home and the floor is safe.</p>
    <div class="stats">
      <div><span>SCORE</span><b>${score}</b></div>
      <div><span>BEST</span><b>${best}</b></div>
      <div><span>LEVELS</span><b>${LEVELS.length}</b></div>
    </div>
    <button class="btn" data-act="retry">PLAY AGAIN &nbsp;▸&nbsp; ENTER</button>`;
  }
  overlay.innerHTML=`<div class="pwrap"><div class="panel"><div class="hazard"></div><div class="pbody">${html}</div></div></div>`;
  overlay.classList.add('on');
  overlay.querySelectorAll('button[data-act]').forEach(b=>{
    b.addEventListener('click',()=>{initAudio();doAction(b.dataset.act);});
  });
}
function hideOverlay(){overlay.classList.remove('on');}
function doStart(){prevBest=best;sfx.ui();hideOverlay();state='playing';banner('LEVEL 1',LEVELS[0].name);}
function doResume(){sfx.ui();hideOverlay();state='playing';}
function doRestartLevel(){sfx.ui();loadLevel(levelIdx);hideOverlay();state='playing';banner('LEVEL '+(levelIdx+1),LEVELS[levelIdx].name);}
function doRetry(){lives=3;score=0;prevBest=best;levelIdx=0;sfx.ui();loadLevel(0);hideOverlay();state='playing';banner('LEVEL 1',LEVELS[0].name);}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;updateHUD();}
function doAction(a){
  if(a==='start')doStart(); else if(a==='resume')doResume();
  else if(a==='restart')doRestartLevel(); else if(a==='retry')doRetry();
}

/* ================= INPUT ================= */
const DIRS={'ArrowUp':[0,-1],w:[0,-1],W:[0,-1],'ArrowDown':[0,1],s:[0,1],S:[0,1],
            'ArrowLeft':[-1,0],a:[-1,0],A:[-1,0],'ArrowRight':[1,0],d:[1,0],D:[1,0]};
addEventListener('keydown',e=>{
  initAudio();
  const k=e.key;
  if(DIRS[k]){e.preventDefault();tryMove(DIRS[k][0],DIRS[k][1]);return;}
  if(k==='Enter'||k===' '){
    e.preventDefault();
    if(state==='menu')doStart();
    else if(state==='gameover'||state==='victory')doRetry();
    else if(state==='paused')doResume();
    return;
  }
  if(k==='r'||k==='R'){
    if(state==='playing'||state==='paused')doRestartLevel();
    else if(state==='gameover'||state==='victory')doRetry();
    return;
  }
  if(k==='p'||k==='P'||k==='Escape'){
    if(state==='playing'){state='paused';showScreen('paused');}
    else if(state==='paused')doResume();
    return;
  }
  if(k==='m'||k==='M')toggleMute();
});
sndBtn.addEventListener('click',()=>{initAudio();toggleMute();});

let tS=null;
cv.addEventListener('touchstart',e=>{initAudio();if(e.touches.length===1)tS={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!tS)return;
  const dx=e.changedTouches[0].clientX-tS.x, dy=e.changedTouches[0].clientY-tS.y; tS=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0); else tryMove(0,dy>0?1:-1);
});
cv.addEventListener('pointerdown',()=>initAudio());
document.querySelectorAll('#dpad button').forEach(b=>{
  let iv=null; const dx=+b.dataset.dx, dy=+b.dataset.dy;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();tryMove(dx,dy);iv=setInterval(()=>tryMove(dx,dy),170);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{clearInterval(iv);iv=null;}));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){state='paused';showScreen('paused');}});

/* ================= DRAWING ================= */
const NUMCOL=['','#79c4ff','#8fe07a','#ff8a5f','#c9a2ff','#ffd75e','#5eead4','#ff6f9c','#eeeeee'];
const easeOut=t=>t*(2-t);
function dot(x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}

function drawWall(px,py){
  g.fillStyle='#2a352d'; g.fillRect(px,py,cs,cs);
  g.fillStyle='#3e4c41'; g.fillRect(px+2,py+2,cs-4,Math.max(4,cs*.34));
  g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(px+2,py+cs-cs*.2,cs-4,cs*.2);
  g.fillStyle='#1b241e';
  const r=Math.max(1.5,cs*.035), m=5;
  [[m,m],[cs-m,m],[m,cs-m],[cs-m,cs-m]].forEach(p=>{g.beginPath();g.arc(px+p[0],py+p[1],r,0,TAU);g.fill();});
  g.strokeStyle='rgba(0,0,0,.45)'; g.lineWidth=1; g.strokeRect(px+.5,py+.5,cs-1,cs-1);
}
function drawBoard(now){
  const a=Math.min(1,boardT*2.5); g.globalAlpha=a;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=K(x,y), px=bx+x*cs, py=by+y*cs;
    if(walls.has(k)){drawWall(px,py);continue;}
    g.fillStyle=((x+y)%2===0)?'#152318':'#121e15'; g.fillRect(px,py,cs,cs);
    const rt=revealed.get(k);
    if(rt!==undefined){
      g.fillStyle='rgba(255,196,110,.07)'; g.fillRect(px,py,cs,cs);
      g.strokeStyle='rgba(255,196,110,.12)'; g.lineWidth=1; g.strokeRect(px+1.5,py+1.5,cs-3,cs-3);
      const n=numAt(x,y);
      if(n>0){
        const age=now-rt; let s=1; if(age<220)s=1+(1-age/220)*.6;
        g.font='900 '+Math.round(cs*.48*s)+'px system-ui, sans-serif';
        g.textAlign='center'; g.textBaseline='middle';
        g.fillStyle=NUMCOL[n]||'#eee';
        g.fillText(n, px+cs/2, py+cs/2+1);
      }
    }
  }
  g.globalAlpha=1;
}
function drawPads(now){
  for(const k of pads){
    const x=k%64, y=(k/64)|0;
    const filled=crates.some(c=>!c.dead&&K(c.x,c.y)===k);
    const cx=bx+(x+.5)*cs, cy=by+(y+.5)*cs;
    const pulse=.5+.35*Math.sin(now*.004+(x+y)*1.7);
    if(filled){
      const gr=g.createRadialGradient(cx,cy,2,cx,cy,cs*.75);
      gr.addColorStop(0,'rgba(255,210,74,.35)');gr.addColorStop(1,'rgba(255,210,74,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,cs*.75,0,TAU); g.fill();
    }
    const al=filled?.95:.3+.3*pulse;
    g.strokeStyle=`rgba(255,210,74,${al})`; g.lineWidth=2.5;
    g.beginPath(); g.arc(cx,cy,cs*.36,0,TAU); g.stroke();
    g.save(); g.translate(cx,cy); g.rotate(Math.PI/4+now*.0006*(filled?1:0));
    const d=cs*.13;
    g.fillStyle=`rgba(255,210,74,${al})`; g.fillRect(-d,-d,d*2,d*2);
    g.restore();
  }
}
function drawCrateBox(cx,cy){
  const s=cs*.8, h=s/2, x=cx-h, y=cy-h;
  g.fillStyle='#b97a3f'; g.fillRect(x,y,s,s);
  g.strokeStyle='rgba(96,55,20,.6)'; g.lineWidth=Math.max(2,s*.13);
  g.beginPath(); g.moveTo(x+s*.2,y+s*.2); g.lineTo(x+s*.8,y+s*.8);
  g.moveTo(x+s*.8,y+s*.2); g.lineTo(x+s*.2,y+s*.8); g.stroke();
  g.strokeStyle='#6d421d'; g.lineWidth=3; g.strokeRect(x+1.5,y+1.5,s-3,s-3);
  g.fillStyle='rgba(255,255,255,.1)'; g.fillRect(x+3,y+3,s-6,s*.16);
  g.fillStyle='#5c6b72';
  const r=Math.max(1.5,s*.045), m=s*.16;
  [[m,m],[s-m,m],[m,s-m],[s-m,s-m]].forEach(p=>dot(x+p[0],y+p[1],r));
}
function drawCrates(now){
  for(const c of crates){
    if(c.dead)continue;
    const e=easeOut(Math.min(1,c.at));
    const cx=bx+(c.fx+(c.x-c.fx)*e+.5)*cs, cy=by+(c.fy+(c.y-c.fy)*e+.5)*cs;
    if(pads.has(K(c.x,c.y))){
      const gr=g.createRadialGradient(cx,cy,2,cx,cy,cs*.7);
      gr.addColorStop(0,'rgba(255,210,74,.3)');gr.addColorStop(1,'rgba(255,210,74,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,cs*.7,0,TAU); g.fill();
    }
    drawCrateBox(cx,cy);
  }
}
function drawPlayer(now){
  const e=easeOut(player.at);
  const cx=bx+(player.fx+(player.x-player.fx)*e+.5)*cs;
  const cy=by+(player.fy+(player.y-player.fy)*e+.5)*cs;
  const [dx,dy]=player.dir;
  const bob=moving?Math.sin(walkPhase*TAU)*cs*.03:Math.sin(now*.004)*cs*.02;
  g.fillStyle='rgba(0,0,0,.35)';
  g.beginPath(); g.ellipse(cx,cy+cs*.28,cs*.26,cs*.1,0,0,TAU); g.fill();
  const py=cy+bob, pxn=-dy, pyn=dx;
  g.fillStyle='#e8c49a';
  dot(cx+dx*cs*.3+pxn*cs*.17, py+dy*cs*.3+pyn*cs*.17, cs*.075);
  dot(cx+dx*cs*.3-pxn*cs*.17, py+dy*cs*.3-pyn*cs*.17, cs*.075);
  g.fillStyle='#e3a92f'; dot(cx,py,cs*.3);
  g.strokeStyle='#8a6414'; g.lineWidth=2;
  g.beginPath(); g.arc(cx,py,cs*.3,0,TAU); g.stroke();
  const ox=cx+dx*cs*.05, oy=py+dy*cs*.05;
  g.fillStyle='#ffd75e'; dot(ox,oy,cs*.21);
  g.fillStyle='rgba(255,255,255,.55)'; dot(ox-cs*.07,oy-cs*.08,cs*.05);
}
function drawScorch(now){
  const cx=bx+(deathCell.x+.5)*cs, cy=by+(deathCell.y+.5)*cs;
  const gr=g.createRadialGradient(cx,cy,2,cx,cy,cs*.6);
  gr.addColorStop(0,'rgba(8,6,4,.95)');gr.addColorStop(.6,'rgba(15,10,7,.8)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,cs*.6,0,TAU); g.fill();
  for(let i=0;i<4;i++){
    const a=i*1.9+.7, r2=cs*(.15+((i*37)%20)/100);
    const fl=.4+.6*Math.abs(Math.sin(now*.008+i*2));
    g.fillStyle=`rgba(255,${120+(i*30)%90},40,${fl})`;
    dot(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2, Math.max(1,cs*.03));
  }
}
function drawMine(cx,cy,sc){
  const r=cs*.3*sc;
  g.strokeStyle='#5e1710'; g.lineWidth=Math.max(2,cs*.06);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+Math.PI/8;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*r*.75, cy+Math.sin(a)*r*.75);
    g.lineTo(cx+Math.cos(a)*r*1.28, cy+Math.sin(a)*r*1.28);
    g.stroke();
  }
  const gr=g.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);
  gr.addColorStop(0,'#ff8d7a');gr.addColorStop(.55,'#c0392b');gr.addColorStop(1,'#7e1f14');
  g.fillStyle=gr; dot(cx,cy,r);
  g.fillStyle='rgba(255,255,255,.8)'; dot(cx-r*.35,cy-r*.35,r*.16);
}
function drawMines(now){
  for(const k of mines){
    const isRev=revealed.has(k), popT=minePop[k];
    if(!isRev&&(popT===undefined||now<popT))continue;
    const t0=isRev?revealed.get(k):popT;
    const age=now-t0; let sc=1;
    if(age<260)sc=1+Math.sin(Math.min(1,age/260)*Math.PI)*.45;
    const x=k%64, y=(k/64)|0;
    drawMine(bx+(x+.5)*cs, by+(y+.5)*cs, sc);
  }
}
function drawParticles(){
  for(const p of particles){
    const a=1-p.t/p.life; if(a<=0)continue;
    if(p.type==='smoke'){
      g.fillStyle=`rgba(125,113,96,${a*.3})`;
      dot(p.x,p.y, p.size + p.t*cs*.5);
    } else {
      g.globalAlpha=a; g.fillStyle=p.col;
      dot(p.x,p.y, Math.max(.8,p.size*(1-p.t/p.life*.5)));
      g.globalAlpha=1;
    }
  }
}
function drawFlashes(){
  for(const f of flashes){
    if(f.t>=1)continue;
    const t=easeOut(f.t), r=t*cs*3.2;
    g.globalAlpha=(1-f.t);
    g.fillStyle='#fff7e0'; dot(f.x,f.y,r*.5);
    g.strokeStyle='#ff9f43'; g.lineWidth=6*(1-f.t)+2;
    g.beginPath(); g.arc(f.x,f.y,r,0,TAU); g.stroke();
    g.globalAlpha=1;
  }
}
function drawFloats(){
  for(const f of floats){
    if(f.t>=1)continue;
    const px=bx+(f.x+.5)*cs, py=by+(f.y+.5)*cs - f.t*26;
    g.globalAlpha=1-f.t;
    g.font='900 '+Math.round(cs*.5)+'px Impact, "Arial Black", sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth=4; g.strokeStyle='rgba(0,0,0,.7)'; g.strokeText(f.txt,px,py);
    g.fillStyle=f.col; g.fillText(f.txt,px,py);
    g.globalAlpha=1;
  }
}
function draw(now){
  g.clearRect(0,0,vw,vh);
  g.fillStyle='#0c1410'; g.fillRect(0,0,vw,vh);
  const vg=g.createRadialGradient(vw/2,vh*.45,cs*2,vw/2,vh/2,Math.max(vw,vh)*.8);
  vg.addColorStop(0,'rgba(46,72,54,.3)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=vg; g.fillRect(0,0,vw,vh);
  let sx=0,sy=0;
  if(shakeAmp>0){sx=(Math.random()*2-1)*shakeAmp*9; sy=(Math.random()*2-1)*shakeAmp*9;}
  g.save(); g.translate(sx,sy);
  drawBoard(now); drawPads(now); drawCrates(now);
  if(player.alive)drawPlayer(now); else if(deathCell)drawScorch(now);
  drawMines(now); drawParticles(); drawFlashes(); drawFloats();
  g.restore();
}

/* ================= MAIN LOOP ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000); last=now;
  if(state==='playing'||state==='dying'||state==='levelclear')busyT=Math.max(0,busyT-dt);
  [player,...crates].forEach(e=>{if(e&&e.at<1)e.at=Math.min(1,e.at+dt/.13);});
  moving=!!(player&&player.at<1);
  if(moving)walkPhase=(walkPhase+dt*6)%1; else walkPhase=0;
  boardT=Math.min(1,boardT+dt*3);
  shakeAmp=Math.max(0,shakeAmp-dt*2.1);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.t+=dt;
    if(p.t>=p.life){particles.splice(i,1);continue;}
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    const dr=p.type==='smoke'?1.6:3;
    p.vx*=(1-dt*dr); p.vy*=(1-dt*dr);
  }
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt/.95; if(floats[i].t>=1)floats.splice(i,1);}
  for(let i=flashes.length-1;i>=0;i--){flashes[i].t+=dt/.45; if(flashes[i].t>=1)flashes.splice(i,1);}
  if(state==='dying'){
    dyingT+=dt;
    if(dyingT>.85&&!minesRevealed){
      minesRevealed=true;
      let i=0; for(const k of mines)minePop[k]=performance.now()+(i++)*45;
    }
    if(dyingT>1.75){
      lives--; updateHUD();
      if(lives>0){loadLevel(levelIdx);state='playing';banner('LEVEL '+(levelIdx+1),LEVELS[levelIdx].name);}
      else{state='gameover';sfx.over();showScreen('gameover');}
    }
  }
  if(state==='levelclear'){
    clearT+=dt;
    if(clearT>1.5){
      if(levelIdx+1>=LEVELS.length){state='victory';showScreen('victory');}
      else{levelIdx++;loadLevel(levelIdx);state='playing';banner('LEVEL '+(levelIdx+1),LEVELS[levelIdx].name);}
    }
  }
  draw(now);
}

/* ================= BOOT ================= */
loadLevel(0);
resize();
showScreen('menu');
requestAnimationFrame(frame);
</script>
