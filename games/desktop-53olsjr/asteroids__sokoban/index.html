<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Asteroids Sokoban</title>
<style>
  :root{
    --cy:#7de8ff; --em:#57ffa8; --am:#ffb454; --mg:#ff5ea8;
    --ink:#dff0ff; --dim:#8fa9d2;
    --disp: Impact, Haettenschweiler, "Franklin Gothic Bold", "Arial Black", sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#04060f;touch-action:none}
  body{font-family:var(--mono);color:var(--ink)}
  canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:999;
        background:repeating-linear-gradient(0deg, rgba(255,255,255,.026) 0 1px, transparent 1px 3px)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
       gap:10px;padding:10px 14px;z-index:40;pointer-events:none;font-size:12px;letter-spacing:.08em}
  .panel{background:rgba(8,14,34,.74);border:1px solid rgba(125,232,255,.22);border-radius:8px;
         padding:7px 12px;display:flex;align-items:center;gap:14px;white-space:nowrap}
  .panel .lab{color:var(--dim)}
  .panel b{color:#fff;font-weight:600}
  #lvName{color:var(--cy);text-transform:uppercase;letter-spacing:.22em}
  #enWrap{width:88px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
  #enBar{height:100%;width:100%;background:linear-gradient(90deg,#3fd9ff,var(--cy));transition:width .1s linear}
  #enWrap.low #enBar{background:linear-gradient(90deg,#ff5d5d,#ff9d5c)}
  button#muteBtn{pointer-events:auto;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink);
      background:rgba(125,232,255,.08);border:1px solid rgba(125,232,255,.4);border-radius:6px;padding:5px 10px;cursor:pointer}
  button#muteBtn:hover{background:var(--cy);color:#04122a}

  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;z-index:40;pointer-events:none;
        font-size:11px;letter-spacing:.14em;color:rgba(160,190,235,.42)}

  /* ---------- banner & toast ---------- */
  #banner{position:fixed;top:22%;left:0;right:0;text-align:center;z-index:45;pointer-events:none;opacity:0}
  #banner .bn{font-family:var(--disp);font-size:clamp(30px,6vw,58px);letter-spacing:.1em;color:#fff;
        text-shadow:0 0 26px rgba(125,232,255,.6), 2px 0 rgba(255,94,168,.7), -2px 0 rgba(125,232,255,.7)}
  #banner .bs{margin-top:6px;font-size:13px;letter-spacing:.28em;color:var(--cy);text-transform:uppercase}
  #banner.go{animation:bnIn 2.2s ease forwards}
  @keyframes bnIn{0%{opacity:0;transform:translateY(14px) scale(.96)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
  #toast{position:fixed;bottom:14%;left:0;right:0;text-align:center;z-index:46;pointer-events:none;opacity:0;
         font-size:15px;letter-spacing:.2em;color:var(--am);text-shadow:0 0 14px rgba(255,180,84,.7)}
  #toast.go{animation:tsIn 1.6s ease forwards}
  @keyframes tsIn{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}

  /* ---------- overlay screens ---------- */
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
           background:radial-gradient(ellipse at center, rgba(6,10,26,.42), rgba(3,6,16,.82))}
  #overlay.on{display:flex;animation:ovIn .35s ease}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}
  .ovInner{text-align:center;padding:26px;max-width:min(94vw,820px);max-height:96vh;overflow:auto}
  .tag{font-size:11px;letter-spacing:.5em;color:var(--mg);text-transform:uppercase;margin-bottom:10px}
  h1.title{font-family:var(--disp);margin:4px 0 12px;font-weight:400;line-height:.92;letter-spacing:.03em;
           font-size:clamp(46px,10vw,98px);color:#f2f7ff}
  h1.title .a{text-shadow:0 0 24px rgba(125,232,255,.5), 3px 0 rgba(255,94,168,.75), -3px 0 rgba(125,232,255,.75)}
  h1.title .b{display:block;color:transparent;-webkit-text-stroke:2.5px var(--cy);text-shadow:0 0 20px rgba(125,232,255,.45)}
  @supports not (-webkit-text-stroke:1px){h1.title .b{color:#9fe8ff}}
  .sub{font-size:13px;line-height:1.7;color:var(--dim);max-width:560px;margin:0 auto 20px;letter-spacing:.04em}

  .legend{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-bottom:20px}
  .leg{width:96px}
  .legShape{height:64px;display:flex;align-items:center;justify-content:center}
  .rbox{border-radius:44% 58% 51% 47%;box-shadow:inset -3px -4px 0 rgba(0,0,0,.3), inset 2px 3px 0 rgba(255,255,255,.25)}
  .r-s{width:26px;height:26px;background:#8fa9cf;outline:1.5px solid #dcecff}
  .r-m{width:40px;height:40px;background:#b18a5e;outline:1.5px solid #ffd9a3}
  .r-b{width:56px;height:56px;background:#8a5f43;outline:1.5px solid #ff9d5c}
  .padBox{width:40px;height:40px;border-radius:50%;border:3px dashed var(--em);box-shadow:0 0 14px rgba(87,255,168,.5);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .leg p{margin:6px 0 0;font-size:10.5px;letter-spacing:.1em;color:var(--dim);line-height:1.5}
  .leg b{color:#fff;font-weight:600}

  .keys{display:inline-grid;grid-template-columns:auto auto;gap:7px 18px;margin-bottom:22px;text-align:left;
        font-size:12px;letter-spacing:.1em;color:var(--dim)}
  kbd{font-family:var(--mono);font-size:11px;background:#0d1631;border:1px solid rgba(125,232,255,.4);
      border-bottom-width:3px;border-radius:5px;padding:3px 8px;color:#fff;min-width:26px;text-align:center;display:inline-block}

  .btn{font-family:var(--mono);letter-spacing:.16em;font-size:14px;padding:13px 30px;margin:6px 7px;color:#dff3ff;
       background:rgba(125,232,255,.08);border:1px solid rgba(125,232,255,.55);border-radius:6px;cursor:pointer;
       transition:background .15s,color .15s,box-shadow .15s,transform .1s}
  .btn:hover{background:var(--cy);color:#04122a;box-shadow:0 0 26px rgba(125,232,255,.55)}
  .btn:active{transform:scale(.96)}
  .btn.primary{font-size:17px;padding:15px 42px;background:var(--cy);color:#04122a;border-color:var(--cy);
       box-shadow:0 0 30px rgba(125,232,255,.4)}
  .btn.primary:hover{background:#fff;box-shadow:0 0 40px rgba(125,232,255,.9)}
  .tiny{margin-top:16px;font-size:10.5px;letter-spacing:.3em;color:rgba(143,169,210,.55);text-transform:uppercase}

  h2.ovTitle{font-family:var(--disp);font-weight:400;font-size:clamp(38px,7vw,64px);letter-spacing:.08em;margin:0 0 6px;color:#fff;
       text-shadow:0 0 22px rgba(125,255,190,.55), 2px 0 rgba(255,94,168,.7), -2px 0 rgba(125,232,255,.7)}
  .ovSub{font-size:12px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-bottom:18px}
  .stars{font-size:44px;letter-spacing:.3em;margin:4px 0 16px}
  .stars span{color:rgba(255,255,255,.14)}
  .stars span.on{color:#ffd76a;text-shadow:0 0 20px rgba(255,215,106,.9);animation:spop .55s cubic-bezier(.2,1.6,.4,1) backwards}
  .stars span:nth-child(2){animation-delay:.18s}.stars span:nth-child(3){animation-delay:.36s}
  @keyframes spop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
  .stats{display:flex;justify-content:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .stat{background:rgba(8,14,34,.74);border:1px solid rgba(125,232,255,.2);border-radius:8px;padding:10px 18px;min-width:118px}
  .stat .k{font-size:10px;letter-spacing:.26em;color:var(--dim)}
  .stat .v{font-size:24px;margin-top:4px;color:#fff}
  .bestLine{font-size:12px;letter-spacing:.18em;color:var(--am);margin-bottom:10px;min-height:16px}

  /* ---------- touch controls ---------- */
  #touch{position:fixed;left:0;right:0;bottom:14px;display:none;justify-content:space-between;padding:0 18px;z-index:50;pointer-events:none}
  #touch.show{display:flex}
  .tgrp{display:flex;gap:12px;pointer-events:auto}
  .tbtn{width:66px;height:66px;border-radius:50%;border:1px solid rgba(125,232,255,.5);background:rgba(10,18,42,.55);
        color:#dff3ff;font-size:24px;user-select:none}
  .tbtn:active{background:rgba(125,232,255,.4)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="scan"></div>

<div id="hud">
  <div class="panel"><b id="lvNum">LV 1/7</b><span id="lvName">DRIFT</span></div>
  <div class="panel"><span><span class="lab">PADS</span> <b id="padsEl">0/0</b></span>
       <span><span class="lab">MOVES</span> <b id="pushesEl">00</b> <span class="lab" id="parEl">· PAR 14</span></span></div>
  <div class="panel"><div id="enWrap"><div id="enBar"></div></div><b id="timeEl">00:00</b><button id="muteBtn">SND ON</button></div>
</div>

<div id="hint">◄ ► TURN&nbsp;&nbsp;·&nbsp;&nbsp;▲ THRUST&nbsp;&nbsp;·&nbsp;&nbsp;SPACE FIRE&nbsp;&nbsp;·&nbsp;&nbsp;R RESTART&nbsp;&nbsp;·&nbsp;&nbsp;P PAUSE</div>
<div id="banner"></div>
<div id="toast"></div>

<div id="touch">
  <div class="tgrp"><button class="tbtn" data-k="left">◄</button><button class="tbtn" data-k="right">►</button></div>
  <div class="tgrp"><button class="tbtn" data-k="fire">✦</button><button class="tbtn" data-k="up">▲</button></div>
</div>

<div id="overlay"></div>

<script>
'use strict';
/* ============================== helpers ============================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function rng(seed){let t=seed>>>0;return function(){t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296};}
const key=(x,y)=>x+','+y;
const fmtT=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

/* ============================== levels ============================== */
const LEVELS=[
 {name:'DRIFT',sub:'nudge the shards to their pads',par:14,map:[
  "############",
  "#..........#",
  "#.b......P.#",
  "#..........#",
  "#....b.....#",
  "#S........P#",
  "############"]},
 {name:'FRACTURE',sub:"heavy rocks can't be pushed — fire to split",par:13,map:[
  "############",
  "#..........#",
  "#..m.......#",
  "#...P.....P#",
  "#..........#",
  "#S.........#",
  "############"]},
 {name:'THE GAP',sub:'line up every push',par:24,map:[
  "##############",
  "#.............#",
  "#.b....#..P..#",
  "#......#.....#",
  "#............#",
  "#......#.....#",
  "#.b....#..P..#",
  "#.S..........#",
  "##############"]},
 {name:'HEAVY LIFT',sub:'boulders need two cracks',par:24,map:[
  "##############",
  "#.............#",
  "#..B..........#",
  "#....P...P...#",
  "#.............#",
  "#......##....#",
  "#....P...P...#",
  "#.S..........#",
  "##############"]},
 {name:'SHARDED',sub:'extra shards are fine — light all four pads',par:34,map:[
  "###############",
  "#..............#",
  "#.B.....#...P.#",
  "#.......#.....#",
  "#.......#.....#",
  "#S............#",
  "#.......#....P#",
  "#.......#.....#",
  "#.P...P.......#",
  "###############"]},
 {name:'GAUNTLET',sub:'work the narrow passages',par:36,map:[
  "################",
  "#.........#....#",
  "#B.#.P.P..#....#",
  "#..#.......P...#",
  "#.S#......#....#",
  "#.........#....#",
  "#m.#......#.P..#",
  "#..#......#....#",
  "#..#.P.P.......#",
  "################"]},
 {name:'THE CORE',sub:'dock the ring around the core',par:40,map:[
  "################",
  "#..............#",
  "#..............#",
  "#......PP.......#",
  "#.....P##......#",
  "#......##.P....#",
  "#......PP.......#",
  "#.B.........m..#",
  "#......S.......#",
  "################"]}
];

/* ============================== audio ============================== */
let AC=null,masterG=null,noiseBuf=null,thrustGain=null,muted=false;
function initAudio(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  masterG=AC.createGain(); masterG.gain.value=muted?0:0.55; masterG.connect(AC.destination);
  const len=AC.sampleRate, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1; noiseBuf=buf;
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380;
  thrustGain=AC.createGain(); thrustGain.gain.value=0;
  src.connect(f); f.connect(thrustGain); thrustGain.connect(masterG); src.start();
}
function setThrust(on){ if(!AC)return; const t=AC.currentTime;
  thrustGain.gain.cancelScheduledValues(t);
  thrustGain.gain.setTargetAtTime(on?0.15:0,t,on?0.03:0.08); }
function tone(f0,f1,dur,type,vol,delay){ if(!AC)return; delay=delay||0; const t=AC.currentTime+delay;
  const o=AC.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(Math.max(1,f0),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol||.3,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(masterG); o.start(t); o.stop(t+dur+.03); }
function noise(dur,vol,freq,type,delay){ if(!AC)return; delay=delay||0; const t=AC.currentTime+delay;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.value=freq||800;
  const g=AC.createGain(); g.gain.setValueAtTime(vol||.3,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(masterG); s.start(t); s.stop(t+dur+.03); }
const S={
  laser(){tone(920,150,.11,'sawtooth',.22); noise(.05,.1,3200,'highpass');},
  push(){tone(200,120,.09,'triangle',.34); noise(.07,.16,520);},
  knock(){tone(150,85,.11,'sine',.36); noise(.05,.18,320);},
  heavy(){tone(95,52,.2,'sine',.5); noise(.12,.3,210);},
  tink(){tone(1250,880,.05,'square',.12);},
  thump(v){noise(.09,v,240); tone(110,60,.1,'sine',v);},
  split(sz){ if(sz===2){noise(.35,.5,620);tone(75,38,.32,'sine',.5);} else {noise(.22,.4,800);tone(110,55,.22,'sine',.45);} },
  dock(){tone(660,660,.09,'sine',.3); tone(990,990,.15,'sine',.3,.08);},
  clear(){[523,659,784,1046].forEach((f,i)=>tone(f,f,.17,'triangle',.3,i*.09)); noise(.4,.12,4000,'highpass',.1);},
  win(){[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.22,'triangle',.3,i*.11)); noise(.7,.15,5000,'highpass',.3);},
  deny(){tone(170,120,.08,'square',.14);},
  ui(){tone(440,660,.07,'triangle',.2);}
};
function toggleMute(){ muted=!muted; if(masterG)masterG.gain.setTargetAtTime(muted?0:.55,AC.currentTime,.02);
  $('#muteBtn').textContent=muted?'SND OFF':'SND ON'; }

/* ============================== state ============================== */
const cv=$('#cv'), ctx=cv.getContext('2d');
let vw=0,vh=0,dpr=1, bg=null, starsA=[],starsB=[];
let W=0,H=0, cell=40, ox=0, oy=0;
let state='menu', idx=0;
let ship={x:2,y:2,vx:0,vy:0,a:-Math.PI/2};
let rocks=[],obstacles=new Set(),pads=new Map(),occ=new Map(),bolts=[],parts=[];
let pushes=0,shots=0,levelTime=0,energy=100,cd=0,flashT=0,shake=0,heavyToastT=0;
let runStars=0,runTime=0,T=0,lastTs=0,drifters=[],thrustOn=false;
const SIZES=['small','mid','big'], RAD={small:.40,mid:.52,big:.66};
const RSTYLE={small:{fill:'#8fa9cf',stroke:'#dcecff'},mid:{fill:'#b18a5e',stroke:'#ffd9a3'},big:{fill:'#8a5f43',stroke:'#ff9d5c'}};
const TURN=5.2,THRUST=3.4,DAMP=1.35,MAXV=4.6,BOLT_V=9,SHOOT_COST=18,WALL=.32,SHIP_R=.34;
const K={left:0,right:0,up:0,fire:0};

function makeShape(seed){ const r=rng(seed),n=9+Math.floor(r()*3),a=[]; for(let i=0;i<n;i++)a.push(.78+r()*.27); return a; }
function spawnRock(x,y,size,fx,fy,vr){
  const rk={x:x,y:y,px:fx!==undefined?fx:x+.5,py:fy!==undefined?fy:y+.5,
    size:size,r:RAD[size],seed:(Math.random()*1e9)|0,shape:makeShape((Math.random()*1e9)|0),
    rot:Math.random()*TAU,vr:vr||0,slide:null,wobble:0,heavyT:0,docked:false,born:(Math.random()*.15)};
  if(fx!==undefined)rk.slide={fx:fx,fy:fy,t:0,dur:.4};
  rocks.push(rk); occ.set(key(x,y),rk); return rk;
}
function loadLevel(i){
  const L=LEVELS[i]; H=L.map.length; W=Math.max(...L.map.map(r=>r.length));
  obstacles=new Set(); pads=new Map(); rocks=[]; occ=new Map(); bolts=[]; parts=[];
  let s0={x:2.5,y:2.5};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const c=L.map[y][x]||'.';
    if(c==='#')obstacles.add(key(x,y));
    else if(c==='P')pads.set(key(x,y),{x:x,y:y,pulse:0,covered:false});
    else if(c==='S')s0={x:x+.5,y:y+.5};
    else if(c==='b'||c==='m'||c==='B'){ const rk=spawnRock(x,y,c==='b'?'small':(c==='m'?'mid':'big')); rk.born=.15+rocks.length*.07; }
  }
  ship={x:s0.x,y:s0.y,vx:0,vy:0,a:-Math.PI/2};
  pushes=0;shots=0;levelTime=0;energy=100;cd=0;setThrust(false);thrustOn=false;
  updateHUD();
}

/* ============================== rules ============================== */
function cellFree(x,y){ return x>=0&&y>=0&&x<W&&y<H&&!obstacles.has(key(x,y))&&!occ.has(key(x,y)); }
function refreshCovered(){ let n=0; pads.forEach(p=>{ p.covered=occ.has(key(p.x,p.y)); if(p.covered)n++; }); return n; }
function doPush(rock,tx,ty,nx,ny){
  occ.delete(key(rock.x,rock.y)); rock.x=tx; rock.y=ty; occ.set(key(tx,ty),rock);
  rock.slide={fx:rock.px,fy:rock.py,t:0,dur:.13};
  rock.vr+=(Math.random()*4-2);
  const vn=ship.vx*nx+ship.vy*ny;
  if(vn<0){ ship.vx-=nx*vn*1.7; ship.vy-=ny*vn*1.7; }
  ship.vx-=nx*.9; ship.vy-=ny*.9;
  pushes++; S.push();
  for(let i=0;i<4;i++)addPart(rock.px,rock.py,-nx*(.5+Math.random()),-ny*(.5+Math.random()),.3,.12,'rgba(200,220,255,.8)');
  updateHUD();
}
function onSettle(rock){
  const k=key(rock.x,rock.y), p=pads.get(k);
  if(p){ if(!rock.docked){ rock.docked=true; p.pulse=1; S.dock();
      for(let i=0;i<12;i++){const a=Math.random()*TAU,s=.8+Math.random()*1.6;
        addPart(rock.px,rock.py,Math.cos(a)*s,Math.sin(a)*s,.5,.14,'#57ffa8');}
      addRing(rock.px,rock.py,'#57ffa8'); } }
  else rock.docked=false;
  if(refreshCovered()===pads.size){ clearLevel(); }
  updateHUD();
}
function pickFree(x,y,dir,excl){
  const offs=[]; for(let r=1;r<=2;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue; offs.push([dx,dy,r]); }
  offs.sort((a,b)=>{ const da=a[0]*dir.x+a[1]*dir.y, db=b[0]*dir.x+b[1]*dir.y;
    return (db-b[2]*.45+Math.random()*.3)-(da-a[2]*.45+Math.random()*.3); });
  for(const o of offs){ const tx=x+o[0],ty=y+o[1];
    if(tx<0||ty<0||tx>=W||ty>=H)continue;
    if(obstacles.has(key(tx,ty))||occ.has(key(tx,ty))||excl.has(key(tx,ty)))continue;
    return {x:tx,y:ty}; }
  return null;
}
function splitRock(rock,bolt){
  const i=rocks.indexOf(rock); if(i<0)return; rocks.splice(i,1); occ.delete(key(rock.x,rock.y));
  const cx=rock.x+.5,cy=rock.y+.5; let dx=cx-bolt.x,dy=cy-bolt.y; const L=Math.hypot(dx,dy)||1; dx/=L;dy/=L;
  const si=SIZES.indexOf(rock.size), kids=[]; const excl=new Set();
  for(let j=0;j<2;j++){ const dir=j===0?{x:dx,y:dy}:{x:-dx,y:-dy};
    const c=pickFree(rock.x,rock.y,dir,excl); if(!c)break; excl.add(key(c.x,c.y));
    kids.push(spawnRock(c.x,c.y,SIZES[si-1],cx,cy,j===0?3.5:-3.5)); }
  const col=RSTYLE[rock.size].stroke;
  for(let i=0;i<14+si*8;i++){const a=Math.random()*TAU,s=1+Math.random()*(1.5+si);
    addPart(cx,cy,Math.cos(a)*s,Math.sin(a)*s,.5+.3*Math.random(),.16+i%2*.06,i%3?col:'#ffffff');}
  addRing(cx,cy,col); shake=Math.min(1,shake+(.3+si*.18)); flashT=Math.max(flashT,.22); S.split(si); updateHUD();
}

function addPart(x,y,vx,vy,life,size,color){ parts.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,size:size,color:color});
  if(parts.length>420)parts.splice(0,parts.length-420); }
function addRing(x,y,color){ parts.push({ring:true,x:x,y:y,r:.1,life:.5,max:.5,color:color}); }

function showBanner(){ const L=LEVELS[idx];
  bannerEl.innerHTML='<div class="bn">LV '+(idx+1)+' — '+L.name+'</div><div class="bs">'+L.sub+'</div>';
  bannerEl.classList.remove('go'); void bannerEl.offsetWidth; bannerEl.classList.add('go'); }

let best={}; try{ best=JSON.parse(localStorage.getItem('asteroidsSokobanBest')||'{}'); }catch(e){best={};}
function saveBest(){ try{ localStorage.setItem('asteroidsSokobanBest',JSON.stringify(best)); }catch(e){} }

function startGame(){ initAudio(); idx=0; runStars=0; runTime=0; loadLevel(0); state='play';
  overlay.classList.remove('on'); flashT=.45; showBanner(); S.ui(); }
function restartLevel(){ loadLevel(idx); state='play'; overlay.classList.remove('on'); flashT=.3; toast('RESTARTED'); S.ui(); }
function doPause(on){ if(state!=='play'&&state!=='pause')return;
  if(on&&state==='play'){ state='pause'; setThrust(false); showPause(); }
  else if(!on&&state==='pause'){ state='play'; overlay.classList.remove('on'); S.ui(); } }
function starsFor(){ const par=LEVELS[idx].par; return pushes<=par?3:(pushes<=par+8?2:1); }
function clearLevel(){
  state='clear'; setThrust(false); flashT=.9; S.clear();
  pads.forEach(p=>{ for(let i=0;i<26;i++){const a=Math.random()*TAU,s=.8+Math.random()*2.4;
    addPart(p.x+.5,p.y+.5,Math.cos(a)*s,Math.sin(a)*s,.7,.16,['#57ffa8','#7de8ff','#ffffff'][i%3]);} });
  const st=starsFor(); runStars+=st; runTime+=levelTime;
  const b=best[idx], nb=b?(!b.s||st>b.s||(st===b.s&&pushes<b.p)):true;
  if(nb){ best[idx]={s:Math.max(st,b&&b.s||0),p:nb?(b&&b.p< pushes? b.p:pushes):pushes}; saveBest(); }
  setTimeout(()=>{ if(state==='clear')showClear(st,nb); },750);
}
function nextLevel(){ S.ui(); idx++;
  if(idx>=LEVELS.length){ state='win'; buildDrifters(); showWin(); S.win(); }
  else { loadLevel(idx); state='play'; flashT=.4; showBanner(); } }
function playAgain(){ initAudio(); idx=0; runStars=0; runTime=0; loadLevel(0); state='play'; overlay.classList.remove('on'); flashT=.5; showBanner(); S.ui(); }

/* ============================== background ============================== */
function buildBG(){
  bg=document.createElement('canvas'); bg.width=Math.max(2,vw*dpr); bg.height=Math.max(2,vh*dpr);
  const g=bg.getContext('2d'); g.scale(dpr,dpr);
  const base=g.createLinearGradient(0,0,0,vh); base.addColorStop(0,'#0a1026'); base.addColorStop(.55,'#070b1c'); base.addColorStop(1,'#04060f');
  g.fillStyle=base; g.fillRect(0,0,vw,vh);
  function blob(x,y,r,c){ const rg=g.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,c); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,vw,vh); }
  blob(vw*.22,vh*.3,vh*.75,'rgba(64,42,128,.30)');
  blob(vw*.8,vh*.72,vh*.85,'rgba(18,88,112,.26)');
  blob(vw*.62,vh*.12,vh*.5,'rgba(128,40,96,.20)');
  blob(vw*.08,vh*.9,vh*.5,'rgba(30,70,140,.22)');
  const r=rng(1234); starsA=[];starsB=[];
  for(let i=0;i<95;i++)starsA.push({x:r()*vw,y:r()*vh,s:.6+r()*1.1,tw:1+r()*3,ph:r()*TAU});
  for(let i=0;i<45;i++)starsB.push({x:r()*vw,y:r()*vh,s:1.2+r()*1.6,tw:.8+r()*2.5,ph:r()*TAU});
  const vg=g.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.35,vw/2,vh/2,Math.max(vw,vh)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=vg; g.fillRect(0,0,vw,vh);
}
function resize(){ vw=window.innerWidth; vh=window.innerHeight; dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=vw*dpr; cv.height=vh*dpr; buildBG(); }
window.addEventListener('resize',resize);

function metrics(){ const top=56,bottom=40,pad=20;
  cell=Math.max(12,Math.min((vw-pad*2)/W,(vh-top-bottom)/H));
  ox=(vw-W*cell)/2; oy=top+(vh-top-bottom-H*cell)/2; }

/* ============================== update ============================== */
function buildDrifters(){ drifters=[]; for(let i=0;i<5;i++)drifters.push({
  x:Math.random()*vw,y:Math.random()*vh,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,
  r:22+Math.random()*38,rot:Math.random()*TAU,vr:(Math.random()-.5)*.6,shape:makeShape((Math.random()*1e9)|0)}); }

function collideWalls(){
  const m=WALL; let hit=0;
  if(ship.x-SHIP_R<m){ship.x=m+SHIP_R; if(ship.vx<0){hit=Math.max(hit,-ship.vx); ship.vx=-ship.vx*.72;}}
  if(ship.x+SHIP_R>W-m){ship.x=W-m-SHIP_R; if(ship.vx>0){hit=Math.max(hit,ship.vx); ship.vx=-ship.vx*.72;}}
  if(ship.y-SHIP_R<m){ship.y=m+SHIP_R; if(ship.vy<0){hit=Math.max(hit,-ship.vy); ship.vy=-ship.vy*.72;}}
  if(ship.y+SHIP_R>H-m){ship.y=H-m-SHIP_R; if(ship.vy>0){hit=Math.max(hit,ship.vy); ship.vy=-ship.vy*.72;}}
  if(hit>1.4){ S.thump(Math.min(.5,hit*.1)); shake=Math.min(1,shake+hit*.06); }
}
function collideObstacles(){
  const gx=Math.floor(ship.x),gy=Math.floor(ship.y);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const cx=gx+dx,cy=gy+dy; if(!obstacles.has(key(cx,cy)))continue;
    const nxp=clamp(ship.x,cx,cx+1),nyp=clamp(ship.y,cy,cy+1);
    let dxp=ship.x-nxp,dyp=ship.y-nyp; const d2=dxp*dxp+dyp*dyp;
    if(d2>=SHIP_R*SHIP_R)continue;
    let d=Math.sqrt(d2),ux,uy;
    if(d<1e-6){ ux=0; uy=ship.y-cy-.5<0?-1:1; d=1e-6; } else { ux=dxp/d; uy=dyp/d; }
    ship.x=nxp+ux*SHIP_R; ship.y=nyp+uy*SHIP_R;
    const vn=ship.vx*ux+ship.vy*uy;
    if(vn<0){ ship.vx-=ux*vn*1.72; ship.vy-=uy*vn*1.72;
      if(-vn>1.6){ S.thump(Math.min(.4,-vn*.09)); shake=Math.min(1,shake+.15); } }
  }
}
function updateRock(rk,dt){
  rk.born=Math.min(1,rk.born+dt*3);
  if(rk.slide){ const s=rk.slide; s.t+=dt/s.dur;
    if(s.t>=1){ rk.px=rk.x+.5; rk.py=rk.y+.5; rk.slide=null; onSettle(rk); }
    else { const e=1-(1-s.t)*(1-s.t); rk.px=lerp(s.fx,rk.x+.5,e); rk.py=lerp(s.fy,rk.y+.5,e); } }
  rk.rot+=rk.vr*dt; rk.vr*=Math.exp(-2.6*dt);
  rk.wobble=Math.max(0,rk.wobble-dt*3.4); rk.heavyT=Math.max(0,rk.heavyT-dt);
}
function tryFire(){
  if(cd>0)return;
  if(energy<SHOOT_COST){ S.deny(); toast('LOW ENERGY'); return; }
  cd=.16; energy-=SHOOT_COST; shots++;
  const a=ship.a,cx=Math.cos(a),cy=Math.sin(a);
  bolts.push({x:ship.x+cx*.5,y:ship.y+cy*.5,vx:cx*BOLT_V+ship.vx*.3,vy:cy*BOLT_V+ship.vy*.3,life:.7});
  for(let i=0;i<3;i++)addPart(ship.x+cx*.55,ship.y+cy*.55,cx*(2+Math.random())+(Math.random()-.5),cy*(2+Math.random())+(Math.random()-.5),.15,.1,'#ffd76a');
  shake=Math.min(1,shake+.08); S.laser(); updateHUD();
}
function update(dt){
  T+=dt;
  if(shake>0){ shake*=Math.exp(-5*dt); if(shake<.002)shake=0; }
  flashT=Math.max(0,flashT-dt*1.7); heavyToastT-=dt;
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    if(p.ring){ p.r+=dt*3.2; continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.exp(-.8*dt); p.vy*=Math.exp(-.8*dt); }
  pads.forEach(p=>{ p.pulse=Math.max(0,p.pulse-dt*1.5); });
  if(state==='menu'||state==='win'){ for(const d of drifters){ d.x+=d.vx*dt; d.y+=d.vy*dt; d.rot+=d.vr*dt;
      if(d.x<-60)d.x=vw+60; if(d.x>vw+60)d.x=-60; if(d.y<-60)d.y=vh+60; if(d.y>vh+60)d.y=-60; } return; }
  if(state!=='play')return;

  levelTime+=dt; cd-=dt; energy=Math.min(100,energy+45*dt);
  if(K.left)ship.a-=TURN*dt; if(K.right)ship.a+=TURN*dt;
  let thr=false;
  if(K.up){ ship.vx+=Math.cos(ship.a)*THRUST*dt; ship.vy+=Math.sin(ship.a)*THRUST*dt; thr=true; }
  if(thr!==thrustOn){ thrustOn=thr; setThrust(thr); }
  const dmp=Math.exp(-DAMP*dt); ship.vx*=dmp; ship.vy*=dmp;
  const sp=Math.hypot(ship.vx,ship.vy);
  if(sp>MAXV){ ship.vx*=MAXV/sp; ship.vy*=MAXV/sp; }
  ship.x+=ship.vx*dt; ship.y+=ship.vy*dt;
  collideWalls(); collideObstacles();
  for(const rk of rocks)updateRock(rk,dt);
  if(state!=='play')return;

  /* ship ↔ rocks */
  for(const rk of rocks){
    if(rk.slide)continue;
    const dx=rk.px-ship.x, dy=rk.py-ship.y, d=Math.hypot(dx,dy), minD=SHIP_R+rk.r;
    if(d>=minD||d<1e-6)continue;
    const nx=dx/d, ny=dy/d, pen=minD-d;
    ship.x-=nx*pen; ship.y-=ny*pen;
    if(rk.size==='small'){
      const dom=Math.abs(nx)>Math.abs(ny)?[nx>0?1:-1,0]:[0,ny>0?1:-1];
      const tx=rk.x+dom[0], ty=rk.y+dom[1];
      if(cellFree(tx,ty))doPush(rk,tx,ty,nx,ny);
      else{ const vn=ship.vx*nx+ship.vy*ny; if(vn<0){ ship.vx-=nx*vn*1.72; ship.vy-=ny*vn*1.72; }
        rk.wobble=1; S.knock(); shake=Math.min(1,shake+.1); }
    } else {
      const vn=ship.vx*nx+ship.vy*ny; if(vn<0){ ship.vx-=nx*vn*1.72; ship.vy-=ny*vn*1.72; }
      rk.wobble=1; rk.heavyT=.5; S.heavy(); shake=Math.min(1,shake+.2);
      if(heavyToastT<=0){ heavyToastT=1.4; toast('TOO HEAVY — FIRE TO SPLIT'); }
    }
  }

  /* bolts */
  for(let i=bolts.length-1;i>=0;i--){ const b=bolts[i]; let dead=false;
    for(let s2=0;s2<2&&!dead;s2++){
      b.x+=b.vx*dt/2; b.y+=b.vy*dt/2; b.life-=dt/2;
      if(b.life<=0||b.x<-.3||b.y<-.3||b.x>W+.3||b.y>H+.3){ dead=true; break; }
      if(obstacles.has(key(Math.floor(b.x),Math.floor(b.y)))){ dead=true;
        for(let q=0;q<5;q++)addPart(b.x,b.y,(Math.random()-.5)*3,(Math.random()-.5)*3,.25,.1,'#ffd76a'); break; }
      for(const rk of rocks){ const dd=Math.hypot(rk.px-b.x,rk.py-b.y);
        if(dd<rk.r+.06){ dead=true;
          if(rk.size==='small'){ S.tink(); for(let q=0;q<5;q++)addPart(b.x,b.y,(Math.random()-.5)*3,(Math.random()-.5)*3,.25,.1,'#dcecff'); }
          else splitRock(rk,b);
          break; } }
    }
    if(dead)bolts.splice(i,1);
  }
  if(K.fire)tryFire();
}

/* ============================== render ============================== */
function drawPoly(c,x,y,r,rot,shape){ c.beginPath(); const n=shape.length;
  for(let i=0;i<n;i++){ const a=rot+i/n*TAU, rr=r*shape[i];
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; i?c.lineTo(px,py):c.moveTo(px,py); }
  c.closePath(); }
function drawStars(offX,offY){
  ctx.fillStyle='#ffffff';
  for(const s of starsA){ const x=((s.x+offX)%vw+vw)%vw, y=((s.y+offY*1.4)%vh+vh)%vh;
    ctx.globalAlpha=.25+.4*(.5+.5*Math.sin(T*s.tw+s.ph));
    ctx.beginPath(); ctx.arc(x,y,s.s,0,TAU); ctx.fill(); }
  for(const s of starsB){ const x=((s.x+offX*1.9)%vw+vw)%vw, y=((s.y+offY*2.6)%vh+vh)%vh;
    ctx.globalAlpha=.35+.45*(.5+.5*Math.sin(T*s.tw+s.ph));
    ctx.beginPath(); ctx.arc(x,y,s.s,0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;
}
function drawRockC(c,x,y,r,rot,shape,fill,stroke,lw){
  drawPoly(c,x,y,r,rot,shape); c.fillStyle=fill; c.fill();
  c.lineWidth=lw; c.strokeStyle=stroke; c.stroke(); }
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(bg,0,0,vw,vh);
  const inPlay=state==='play'||state==='pause'||state==='clear';
  drawStars(inPlay?ship.x*cell*.03:T*5, inPlay?ship.y*cell*.03:T*2);

  if(state==='menu'||state==='win'){
    for(const d of drifters){ drawRockC(ctx,d.x,d.y,d.r,d.rot,d.shape,'#8fa9cf','#dcecff',2);
      ctx.globalAlpha=.5; drawPoly(ctx,d.x,d.y,d.r*.55,d.rot*1.3,d.shape); ctx.fillStyle='#5c74a0'; ctx.fill(); ctx.globalAlpha=1; }
  } else {
    metrics();
    const sx=(Math.random()*2-1)*shake*9, sy=(Math.random()*2-1)*shake*9;
    ctx.save(); ctx.translate(ox+sx,oy+sy);
    /* floor */
    const fg=ctx.createLinearGradient(0,0,0,H*cell); fg.addColorStop(0,'#0d1531'); fg.addColorStop(1,'#0a0f24');
    ctx.fillStyle=fg; ctx.fillRect(WALL*cell,WALL*cell,(W-2*WALL)*cell,(H-2*WALL)*cell);
    ctx.strokeStyle='rgba(125,232,255,.06)'; ctx.lineWidth=1;
    for(let x=1;x<W;x++){ ctx.beginPath(); ctx.moveTo(x*cell,WALL*cell); ctx.lineTo(x*cell,(H-WALL)*cell); ctx.stroke(); }
    for(let y=1;y<H;y++){ ctx.beginPath(); ctx.moveTo(WALL*cell,y*cell); ctx.lineTo((W-WALL)*cell,y*cell); ctx.stroke(); }
    /* walls */
    ctx.strokeStyle='#233459'; ctx.lineWidth=WALL*cell*2; ctx.strokeRect(0,0,W*cell,H*cell);
    ctx.strokeStyle='rgba(125,232,255,.35)'; ctx.lineWidth=2;
    ctx.strokeRect(WALL*cell,WALL*cell,(W-2*WALL)*cell,(H-2*WALL)*cell);
    ctx.fillStyle='#7de8ff';
    [[0,0],[1,0],[0,1],[1,1]].forEach(c2=>{ const px=c2[0]? (W-WALL)*cell: WALL*cell, py=c2[1]? (H-WALL)*cell: WALL*cell;
      ctx.fillRect(px-2.5,py-2.5,5,5); });

    /* pads */
    pads.forEach(p=>{ const px=(p.x+.5)*cell, py=(p.y+.5)*cell, R=cell*.30;
      const pulse=p.covered?1:.45+.2*Math.sin(T*3+p.x*2+p.y);
      ctx.save();
      if(p.covered){ ctx.shadowColor='#57ffa8'; ctx.shadowBlur=16; }
      ctx.strokeStyle=p.covered?'#7dffc4':'rgba(87,255,168,'+pulse+')';
      ctx.lineWidth=Math.max(2,cell*.045);
      ctx.setLineDash([cell*.12,cell*.1]); ctx.lineDashOffset=-T*cell*.3;
      ctx.beginPath(); ctx.arc(px,py,R,0,TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=p.covered?'#b6ffdd':'rgba(87,255,168,'+(.3+.3*Math.sin(T*3+p.x))+')';
      ctx.beginPath(); ctx.arc(px,py,cell*.07*(1+.25*Math.sin(T*4)),0,TAU); ctx.fill();
      if(p.pulse>0){ ctx.strokeStyle='rgba(87,255,168,'+p.pulse+')'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(px,py,R*(1+(1-p.pulse)*.9),0,TAU); ctx.stroke(); }
      ctx.restore(); });

    /* obstacles */
    const osh=rng(77);
    obstacles.forEach(k=>{ const [gx,gy]=k.split(',').map(Number);
      const px=(gx+.5)*cell, py=(gy+.5)*cell;
      if(!osh._m)osh._m=new Map();
      let sh=osh._m.get(k); if(!sh){ sh=makeShape(gx*731+gy*1549); osh._m.set(k,sh); }
      drawRockC(ctx,px,py+cell*.06,cell*.52,(gx*3.7+gy*1.9),sh,'#1c2846','#314270',Math.max(1.5,cell*.03));
      drawRockC(ctx,px,py,cell*.5,(gx*2.1+gy*4.3),sh,'#2b3a60','#4d6398',Math.max(1.5,cell*.03)); });

    /* rocks */
    for(const rk of rocks){
      const px=rk.px*cell, py=rk.py*cell;
      const born=rk.born<1? (t=>1+2.7*(t-1)*(t-1)*(t-1)+1.70158*(t-1)*(t-1))(rk.born) : 1;
      const wob=1+.06*rk.wobble*Math.sin(T*34+rk.seed);
      const r=rk.r*cell*wob*Math.max(.05,born);
      const st=RSTYLE[rk.size];
      if(rk.docked){ const gg=ctx.createRadialGradient(px,py,0,px,py,r*1.9);
        gg.addColorStop(0,'rgba(87,255,168,.4)'); gg.addColorStop(1,'rgba(87,255,168,0)');
        ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(px,py,r*1.9,0,TAU); ctx.fill(); }
      drawRockC(ctx,px,py+cell*.03,r*1.02,rk.rot,rk.shape,'#0e1526','rgba(0,0,0,.4)',cell*.05);
      drawRockC(ctx,px,py,r,rk.rot,rk.shape,st.fill,st.stroke,Math.max(1.5,cell*.035));
      if(rk.size!=='small'){ ctx.strokeStyle='rgba(20,10,5,.4)'; ctx.lineWidth=Math.max(1,cell*.02);
        for(let i=0;i<2;i++){ const a=rk.rot+rk.shape[i*3||0]*TAU;
          ctx.beginPath(); ctx.moveTo(px+Math.cos(a)*r*.7,py+Math.sin(a)*r*.7);
          ctx.lineTo(px-Math.cos(a+1.4)*r*.55,py-Math.sin(a+1.4)*r*.55); ctx.stroke(); } }
      if(rk.heavyT>0){ drawPoly(ctx,px,py,r,rk.rot,rk.shape);
        ctx.fillStyle='rgba(255,80,60,'+(rk.heavyT*.7)+')'; ctx.fill(); }
      if(rk.docked){ ctx.fillStyle='#57ffa8'; ctx.beginPath(); ctx.arc(px,py,cell*.09*(1+.2*Math.sin(T*5)),0,TAU); ctx.fill(); }
    }

    /* bolts */
    for(const b of bolts){ const l=Math.hypot(b.vx,b.vy)||1, ux=b.vx/l, uy=b.vy/l, L2=cell*.3;
      ctx.lineCap='round';
      ctx.strokeStyle='rgba(255,215,106,.4)'; ctx.lineWidth=6;
      ctx.beginPath(); ctx.moveTo(b.x*cell,b.y*cell); ctx.lineTo((b.x-ux*L2)*cell,(b.y-uy*L2)*cell); ctx.stroke();
      ctx.strokeStyle='#fff7d9'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(b.x*cell,b.y*cell); ctx.lineTo((b.x-ux*L2)*cell,(b.y-uy*L2)*cell); ctx.stroke(); }

    /* ship */
    { const px=ship.x*cell, py=ship.y*cell, L=cell*.55;
      if(thrustOn){ for(let i=0;i<2;i++)addPart(ship.x-Math.cos(ship.a)*.34,ship.y-Math.sin(ship.a)*.34,
          -Math.cos(ship.a)*(1.4+Math.random())+(Math.random()-.5),-Math.sin(ship.a)*(1.4+Math.random())+(Math.random()-.5),
          .25+Math.random()*.2,.1,['#ffd76a','#ff9d5c','#ff5d3a'][i%3]); }
      ctx.save(); ctx.translate(px,py); ctx.rotate(ship.a);
      if(thrustOn){ const fl=L*(.5+Math.random()*.4);
        ctx.fillStyle='rgba(255,150,60,.8)';
        ctx.beginPath(); ctx.moveTo(-L*.42,L*.17); ctx.lineTo(-L*.42-fl,0); ctx.lineTo(-L*.42,-L*.17); ctx.closePath(); ctx.fill();
        ctx.fillStyle='rgba(255,235,150,.9)';
        ctx.beginPath(); ctx.moveTo(-L*.42,L*.08); ctx.lineTo(-L*.42-fl*.55,0); ctx.lineTo(-L*.42,-L*.08); ctx.closePath(); ctx.fill(); }
      drawPoly(ctx,0,0,1,0,[1,1,1,1]); /* noop guard */
      ctx.beginPath(); ctx.moveTo(L,0); ctx.lineTo(-L*.55,L*.6); ctx.lineTo(-L*.3,L*.24); ctx.lineTo(-L*.55,-L*.6); ctx.closePath();
      ctx.fillStyle='#f2f7ff'; ctx.fill();
      ctx.lineWidth=Math.max(1.5,cell*.035); ctx.strokeStyle='rgba(125,232,255,.95)'; ctx.stroke();
      ctx.fillStyle='#7de8ff'; ctx.beginPath(); ctx.arc(L*.28,0,cell*.05,0,TAU); ctx.fill();
      ctx.restore(); }

    /* particles (world space) */
    for(const p of parts){ const a=p.life/p.max;
      if(p.ring){ ctx.strokeStyle=p.color; ctx.globalAlpha=a; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(p.x*cell,p.y*cell,p.r*cell,0,TAU); ctx.stroke(); continue; }
      ctx.globalAlpha=a; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x*cell,p.y*cell,Math.max(.6,p.size*cell*a),0,TAU); ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.restore();
  }
  if(flashT>0){ ctx.fillStyle='rgba(235,250,255,'+flashT*.7+')'; ctx.fillRect(0,0,vw,vh); }
}

/* ============================== HUD ============================== */
function updateHUD(){ const L=LEVELS[idx]; if(!L)return;
  $('#lvNum').textContent='LV '+(idx+1)+'/'+LEVELS.length;
  $('#lvName').textContent=L.name;
  const cov=refreshCovered();
  $('#padsEl').textContent=cov+'/'+pads.size;
  $('#pushesEl').textContent=String(pushes).padStart(2,'0');
  $('#parEl').textContent='· PAR '+L.par;
}
function hudTick(){ if(state!=='play'&&state!=='pause')return;
  $('#timeEl').textContent=fmtT(levelTime);
  $('#enBar').style.width=energy+'%';
  $('#enWrap').classList.toggle('low',energy<SHOOT_COST); }

/* ============================== main loop ============================== */
function frame(ts){ requestAnimationFrame(frame);
  const dt=clamp((ts-lastTs)/1000,0,.05); lastTs=ts;
  update(dt); render(); hudTick(); }

resize(); metrics(); buildDrifters(); showMenu();
requestAnimationFrame(t=>{ lastTs=t; requestAnimationFrame(frame); });
</script>
</body>
