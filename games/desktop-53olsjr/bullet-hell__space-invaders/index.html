<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID SWARM — Bullet-Hell Invaders</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04050e;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair;}
  *{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
"use strict";
/* ============================== SETUP ============================== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=960,H=640,S=1,DPR=1,cs=4;
let neb=null,stars=[],AL_SPR=[],shipSpr=null,bossAura=null,decor=[];
const MONO='ui-monospace,Menlo,Consolas,monospace';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOut=t=>1-Math.pow(1-t,3);
const rnd=(a,b)=>a+Math.random()*(b-a);
function dY(){return H-58*S;}

/* ============================== PIXEL FONT ============================== */
const FONT={
A:['01110','10001','10001','11111','10001','10001','10001'],B:['11110','10001','10001','11110','10001','10001','11110'],
C:['01110','10001','10000','10000','10000','10001','01110'],D:['11110','10001','10001','10001','10001','10001','11110'],
E:['11111','10000','10000','11110','10000','10000','11111'],F:['11111','10000','10000','11110','10000','10000','10000'],
G:['01110','10001','10000','10111','10001','10001','01111'],H:['10001','10001','10001','11111','10001','10001','10001'],
I:['11111','00100','00100','00100','00100','00100','11111'],J:['00111','00010','00010','00010','00010','10010','01100'],
K:['10001','10010','10100','11000','10100','10010','10001'],L:['10000','10000','10000','10000','10000','10000','11111'],
M:['10001','11011','10101','10101','10001','10001','10001'],N:['10001','11001','10101','10011','10001','10001','10001'],
O:['01110','10001','10001','10001','10001','10001','01110'],P:['11110','10001','10001','11110','10000','10000','10000'],
Q:['01110','10001','10001','10001','10101','10010','01101'],R:['11110','10001','10001','11110','10100','10010','10001'],
S:['01111','10000','10000','01110','00001','00001','11110'],T:['11111','00100','00100','00100','00100','00100','00100'],
U:['10001','10001','10001','10001','10001','10001','01110'],V:['10001','10001','10001','10001','01010','01010','00100'],
W:['10001','10001','10001','10101','10101','10101','01010'],X:['10001','10001','01010','00100','01010','10001','10001'],
Y:['10001','10001','01010','00100','00100','00100','00100'],Z:['11111','00001','00010','00100','01000','10000','11111'],
'0':['01110','10001','10011','10101','11001','10001','01110'],'1':['00100','01100','00100','00100','00100','00100','01110'],
'2':['01110','10001','00001','00010','01000','10000','11111'],'3':['11110','00001','00001','01110','00001','00001','11110'],
'4':['00010','00110','01010','10010','11111','00010','00010'],'5':['11111','10000','11110','00001','00001','10001','01110'],
'6':['01110','10000','10000','11110','10001','10001','01110'],'7':['11111','00001','00010','00100','01000','01000','01000'],
'8':['01110','10001','10001','01110','10001','10001','01110'],'9':['01110','10001','10001','01111','00001','00001','01110'],
' ':['00000','00000','00000','00000','00000','00000','00000'],'-':['00000','00000','00000','11111','00000','00000','00000'],
'.':['00000','00000','00000','00000','00000','00000','00100'],'!':['00100','00100','00100','00100','00100','00000','00100']
};
function pixCenter(str,cx,cy,s,color,alpha){
  const u=(str.length*7-2)*s; let x=cx-u/2;
  ctx.globalAlpha=alpha; ctx.fillStyle=color;
  for(let i=0;i<str.length;i++){
    const g=FONT[str[i]];
    if(g)for(let r=0;r<7;r++){const row=g[r];
      for(let c=0;c<5;c++)if(row[c]==='1')ctx.fillRect(x+c*s,cy-3.5*s+r*s,s,s);}
    x+=7*s;
  }
  ctx.globalAlpha=1; return u;
}

/* ============================== SPRITES ============================== */
const C_WISP=[125,243,255],C_CHIT=[255,210,63],C_MAW=[255,79,163],C_BOSS=[255,61,110],C_WALL=[255,92,138],C_RING=[188,120,255];
const SPRITES=[
 {name:'WISP',pts:60,rgb:C_WISP,f:[
  ['00100000100','00010001000','00111111100','01101110110','11111111111','10111111101','10100000101','00011011000'],
  ['00100000100','10010001001','10111111101','11101110111','11111111111','01111111110','00100000100','00010001000']]},
 {name:'CHITTER',pts:50,rgb:C_CHIT,f:[
  ['00011111000','01111111110','11111111111','11011011011','11111111111','00111111100','01100000011','10000000001'],
  ['00011111000','01111111110','11111111111','11111111111','11011011011','00111111100','10100000101','00000000000']]},
 {name:'MAW',pts:40,rgb:C_MAW,f:[
  ['10000000001','11000000011','11111111111','11101110111','11111111111','01111111110','01101110110','01000000010'],
  ['10000000001','11000000011','11111111111','11111111111','11101110111','01111111110','00101110100','00110001100']]}
];
const SHIPROWS=[
 '000000020000000','0000012100000','0000111210000','0001111211000',
 '0011111211100','0111111111110','0011010101100','0000000000000'];

function pixCanvas(rows,cell,map,glow){
  const w=rows[0].length*cell,h=rows.length*cell;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  if(glow){g.shadowColor=`rgb(${map[1]})`;g.shadowBlur=cell*.9;}
  const sz=cell>=6?cell*.9:cell;
  for(let r=0;r<rows.length;r++)for(let i=0;i<rows[r].length;i++){
    const ch=rows[r][i]; if(ch==='0')continue;
    g.fillStyle=`rgb(${map[ch]||map[1]})`; g.fillRect(i*cell,r*cell,sz,sz);
  }
  return c;
}
const glowCache=new Map();
function makeGlow(r,col){
  const key=r+'|'+col.join(','); let c=glowCache.get(key); if(c)return c;
  r=Math.max(2,Math.round(r));
  const d=Math.ceil(r*6); c=document.createElement('canvas'); c.width=c.height=d;
  const g=c.getContext('2d');
  const rg=g.createRadialGradient(d/2,d/2,0,d/2,d/2,d/2);
  rg.addColorStop(0,'rgba(255,255,255,.95)');
  rg.addColorStop(.3,`rgba(${col},.85)`);
  rg.addColorStop(1,`rgba(${col},0)`);
  g.fillStyle=rg; g.fillRect(0,0,d,d);
  glowCache.set(key,c); return c;
}
function buildSprites(){
  cs=4*S;
  AL_SPR=SPRITES.map(t=>t.f.map(fr=>pixCanvas(fr,cs,{1:t.rgb},{glow:true})));
  shipSpr=pixCanvas(SHIPROWS,cs,{1:[166,255,77],2:[234,255,242]},true);
  bossAura=makeGlow(95*S,C_BOSS);
}

/* ============================== BACKGROUND ============================== */
function buildNebula(){
  neb=document.createElement('canvas');neb.width=Math.max(2,W);neb.height=Math.max(2,H);
  const g=neb.getContext('2d');
  g.fillStyle='#04050e';g.fillRect(0,0,W,H);
  const blob=(x,y,r,c,a)=>{const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(${c},${a})`);rg.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);};
  blob(W*.2,H*.28,W*.5,'96,44,132',.17);
  blob(W*.82,H*.72,W*.45,'24,96,142',.15);
  blob(W*.58,H*.1,W*.34,'150,36,96',.11);
  blob(W*.12,H*.9,W*.3,'24,112,92',.09);
  const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(1,2,8,.62)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}
function buildStars(){
  stars=[]; const cols=['#cfe6ff','#9fd8ff','#ffd9ec','#baffd9'];
  for(let L=0;L<3;L++){
    const n=Math.round(W*H/(L===0?9000:L===1?15000:24000));
    for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,
      r:[.8,1.3,1.9][L]*(0.7+Math.random()*.6),sp:.35+L*.55+Math.random()*.4,
      tw:Math.random()*6.28,c:cols[(Math.random()*cols.length)|0],v:5+L*10});
  }
}
function updStars(dt){for(const s of stars){s.y+=s.v*S*dt;if(s.y>H+3){s.y=-3;s.x=Math.random()*W;}}}
function drawStars(){
  for(const s of stars){
    const a=.22+.4*(.5+.5*Math.sin(G.t*s.sp+s.tw));
    ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;
}

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);}catch(e){}}
  else if(AC.state==='suspended')AC.resume().catch(()=>{});
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;}
function tone(o){if(!AC||muted)return;const t0=AC.currentTime+(o.at||0);
  const osc=AC.createOscillator(),g=AC.createGain();
  osc.type=o.w||'square';osc.frequency.setValueAtTime(Math.max(1,o.f),t0);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t0+o.d);
  g.gain.setValueAtTime(o.v||.15,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+o.d);
  osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+o.d+.03);}
function noise(o){if(!AC||muted)return;const t0=AC.currentTime+(o.at||0);
  const n=Math.max(1,Math.floor(AC.sampleRate*o.d)),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource();src.buffer=buf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.f||800,t0);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(40,o.f2),t0+o.d);
  const g=AC.createGain();g.gain.value=o.v||.3;
  src.connect(f);f.connect(g);g.connect(master);src.start(t0);}
const sfxShoot=()=>{tone({w:'square',f:760+Math.random()*90,f2:180,d:.09,v:.06});tone({w:'sawtooth',f:1500,f2:320,d:.05,v:.035});};
const sfxDash=()=>{noise({d:.16,v:.18,f:900,f2:3400});tone({w:'square',f:220,f2:880,d:.12,v:.05});};
const sfxHit=()=>{noise({d:.3,v:.4,f:900,f2:120});tone({w:'square',f:160,f2:55,d:.3,v:.24});};
const sfxBoom=b=>{noise({d:b?.55:.28,v:b?.5:.28,f:b?700:1400,f2:80});tone({w:'sine',f:120,f2:38,d:b?.5:.3,v:b?.4:.18});};
const sfxPick=()=>{tone({w:'triangle',f:660,d:.07,v:.12});tone({w:'triangle',f:990,d:.1,v:.12,at:.07});};
const sfxPower=()=>{tone({w:'triangle',f:523,d:.06,v:.12});tone({w:'triangle',f:784,d:.06,v:.12,at:.06});tone({w:'triangle',f:1175,d:.11,v:.12,at:.12});};
const sfxWave=()=>{tone({w:'square',f:392,d:.09,v:.09});tone({w:'square',f:587,d:.1,v:.09,at:.1});tone({w:'square',f:784,d:.16,v:.09,at:.2});};
const sfxAlarm=()=>{for(let i=0;i<4;i++)tone({w:'square',f:i%2?370:494,d:.16,v:.12,at:i*.18});noise({d:.8,v:.1,f:300,f2:90});};
const sfxOver=()=>{[392,294,196].forEach((f,i)=>tone({w:'triangle',f,d:.32,v:.16,at:i*.22}));noise({d:.7,v:.25,f:600,f2:60,at:.1});};

/* ============================== STATE ============================== */
function loadHi(){try{return parseInt(localStorage.getItem('voidswarm.hi')||'0',10)||0;}catch(e){return 0;}}
function saveHi(v){try{localStorage.setItem('voidswarm.hi',String(v));}catch(e){}}
const G={mode:'menu',t:0,score:0,hi:loadHi(),wave:1,combo:0,comboT:0,shake:0,slow:0,intro:0,clearT:0,warn:0,tWave:0,overT:0,newHi:false,curt:null,bossDying:null};
let aliens=[],shots=[],bullets=[],parts=[],shocks=[],floats=[],picks=[];
let GR=null,B=null,P=mkP();
function mkP(){return{x:W/2,y:H*.8,vx:0,vy:0,lx:0,ly:-1,dx:0,dy:-1,dashT:0,dashCd:0,inv:0,fireCd:0,shields:3,power:1,trail:[]};}

/* ============================== INPUT ============================== */
const keys={};
window.addEventListener('keydown',e=>{
  initAudio(); const k=(e.key||'').toLowerCase();
  if(k===' '||k.indexOf('arrow')===0)e.preventDefault();
  if(!e.repeat){
    if(k==='enter'){if(G.mode==='menu'||(G.mode==='over'&&G.overT>.6))startGame();}
    else if(k==='r'){startGame();}
    else if(k==='p'||k==='escape'){if(G.mode==='playing')G.mode='pause';else if(G.mode==='pause')G.mode='playing';}
    else if(k==='m'){toggleMute();}
    else if(k==='shift'||k==='x'){tryDash();}
  }
  keys[k]=true;
});
window.addEventListener('keyup',e=>{keys[(e.key||'').toLowerCase()]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(G.mode==='playing')G.mode='pause';});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='playing')G.mode='pause';});
cv.addEventListener('mousedown',e=>{initAudio();
  if(G.mode==='menu'||(G.mode==='over'&&G.overT>.6))startGame();
  else if(G.mode==='pause')G.mode='playing';});
const touch={active:false,x:0,y:0,fire:false};
function setTouch(t){touch.x=t.clientX;touch.y=t.clientY-70;}
cv.addEventListener('touchstart',e=>{e.preventDefault();initAudio();
  if(G.mode==='menu'||(G.mode==='over'&&G.overT>.6)){startGame();return;}
  const t=e.changedTouches[0];touch.active=true;setTouch(t);touch.fire=true;
  if(e.touches.length>=2)tryDash();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(touch.active)setTouch(e.changedTouches[0]);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length===0){touch.active=false;touch.fire=false;}else setTouch(e.touches[0]);},{passive:false});

/* ============================== GAME FLOW ============================== */
function startGame(){resetState();G.mode='playing';sfxWave();}
function resetState(){
  G.score=0;G.wave=1;G.combo=0;G.comboT=0;G.shake=0;G.slow=0;G.clearT=0;G.warn=0;G.curt=null;G.overT=0;G.newHi=false;G.bossDying=null;
  aliens=[];shots=[];bullets=[];parts=[];shocks=[];floats=[];picks=[];GR=null;B=null;P=mkP();
  spawnWave(1);
}
function spawnWave(n){
  G.wave=n;aliens.length=0;bullets.length=0;picks.length=0;GR=null;B=null;G.curt=null;G.tWave=0;
  if(n%5===0){
    const hp=150+(n-1)*22;
    B={x:W/2,y:-160*S,ty:Math.min(130*S,H*.2),hp,max:hp,ph:1,jaw:0,flash:0,fireFlash:0,pat:null,pi:0,patT:1.2};
    G.warn=2.8;sfxAlarm();return;
  }
  const rows=Math.min(6,4+((n-1)>>1)),cols=9,px=13*cs,py=10*cs;
  GR={dx:0,dir:1,y:-90*S,ty:64*S,cols,total:rows*cols,px,fA:.8,pA:2.5,maxY:dY()-(8+(rows-1)*10)*cs};
  for(let r=0;r<rows;r++)for(let i=0;i<cols;i++){
    const t=r<rows*.4?0:r<rows*.75?1:2;
    aliens.push({i,r,ox:(i-(cols-1)/2)*px,oy:r*py,t,x:W/2,y:-90*S,dead:false,pp:Math.random()*6,elite:false,drop:0,al:0,delay:r*.12+Math.abs(i-(cols-1)/2)*.03});
  }
  if(n>=3){for(let k=0;k<2;k++)aliens[(Math.random()*aliens.length)|0].elite=true;}
  G.intro=1.6;sfxWave();
}
function addBullet(x,y,vx,vy,col,r,wob){
  if(bullets.length>720)return;
  bullets.push({x,y,x0:x,t:0,vx,vy,col,r,wob:wob||0,f:6,a:wob?14*S:0,dead:false});
}
function boom(x,y,col,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=rnd(.3,1)*spd;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:rnd(.35,.85),size:rnd(1.5,4)*S,col});}
  if(parts.length>520)parts.splice(0,parts.length-520);
}
function spark(x,y,col,n){boom(x,y,col,n||4,160*S);}
function killAlien(a){
  a.dead=true;
  const pts=SPRITES[a.t].pts*(a.elite?2:1),m=1+Math.min(20,G.combo)*.05,v=Math.round(pts*m);
  G.score+=v;G.combo++;G.comboT=3;
  floats.push({x:a.x,y:a.y,txt:'+'+v,t:0,life:.9,col:'#eafff2'});
  boom(a.x,a.y,SPRITES[a.t].rgb,18,300*S);sfxBoom(false);
  if(Math.random()<.07)picks.push({x:a.x,y:a.y,vy:85*S,type:Math.random()<.68?'P':'S',t:0,dead:false});
  let n=0;for(const q of aliens)if(!q.dead)n++;
  if(n===0&&!B){const bns=100*G.wave;G.score+=bns;
    floats.push({x:W/2,y:H*.45,txt:'WAVE BONUS +'+bns,t:0,life:1.4,col:'#ffd23f'});
    G.clearT=1.6;sfxWave();}
}
function hurt(){
  if(P.inv>0||P.dashT>0)return;
  P.shields--;P.power=Math.max(1,P.power-1);G.combo=0;G.comboT=0;
  P.inv=1.8;G.shake=16;G.slow=.35;sfxHit();
  boom(P.x,P.y,[255,90,120],26,340*S);
  shocks.push({x:P.x,y:P.y,r:4,vr:420*S,maxR:80*S,col:'255,90,120',t:0});
  if(P.shields<=0)doGameOver();
}
function doGameOver(){
  G.mode='over';G.overT=0;
  if(G.score>G.hi){G.hi=G.score;G.newHi=true;saveHi(G.hi);}
  boom(P.x,P.y,[166,255,77],40,420*S);boom(P.x,P.y,[255,90,120],30,380*S);
  shocks.push({x:P.x,y:P.y,r:6,vr:520*S,maxR:140*S,col:'255,255,255',t:0});
  G.shake=22;sfxOver();
}
function tryDash(){
  if(G.mode!=='playing'||P.dashCd>0||P.dashT>0)return;
  let dx=P.lx,dy=P.ly;if(dx===0&&dy===0){dx=0;dy=-1;}
  const l=Math.hypot(dx,dy);P.dx=dx/l;P.dy=dy/l;
  P.dashT=.16;P.dashCd=1.15;P.inv=Math.max(P.inv,.3);sfxDash();
}

/* ============================== UPDATE ============================== */
function updFx(d){
  for(const p of parts){p.t+=d;p.x+=p.vx*d;p.y+=p.vy*d;p.vx*=(1-2*d);p.vy*=(1-2*d);}
  parts=parts.filter(p=>p.t<p.life);
  for(const s of shocks)s.r+=s.vr*d;
  shocks=shocks.filter(s=>s.r<s.maxR);
  for(const f of floats){f.t+=d;f.y-=34*S*d;}
  floats=floats.filter(f=>f.t<f.life);
}
function updBullets(d){
  for(const b of bullets){b.t+=d;
    if(b.wob){b.x=b.x0+b.vx*b.t+Math.sin(b.t*b.f)*b.a;b.y+=b.vy*d;}
    else{b.x+=b.vx*d;b.y+=b.vy*d;}
    if(b.x<-50||b.x>W+50||b.y>H+50||b.y<-70)b.dead=true;
  }
  bullets=bullets.filter(b=>!b.dead);
}
function aimedShot(a){
  const ang=Math.atan2(P.y-a.y,P.x-a.x)+(Math.random()-.5)*.44;
  const sp=(165+G.wave*7)*S*(.9+Math.random()*.2);
  addBullet(a.x,a.y+5*cs,Math.cos(ang)*sp,Math.sin(ang)*sp,SPRITES[a.t].rgb,4*S,(a.elite||(G.wave>=4&&Math.random()<.3))?1:0);
}
function patternEvent(AL){
  const opts=['fan'];if(G.wave>=3)opts.push('ring');if(G.wave>=4)opts.push('curtain','fan');
  const pick=opts[(Math.random()*opts.length)|0];
  if(pick==='fan'){
    const e=AL[(Math.random()*AL.length)|0],nB=5+Math.min(6,G.wave);
    const base=Math.atan2(P.y-e.y,P.x-e.x),sp=(150+G.wave*4)*S;
    for(let i=0;i<nB;i++){const ang=base+(i-(nB-1)/2)*.16;
      addBullet(e.x,e.y+5*cs,Math.cos(ang)*sp,Math.sin(ang)*sp,SPRITES[e.t].rgb,3.8*S);}
  }else if(pick==='ring'){
    const e=AL[(Math.random()*AL.length)|0],nB=12;

function updGrid(d){
  const AL=[];for(const a of aliens)if(!a.dead)AL.push(a);

    const spd=(26+(G.wave-1)*7+(1-frac)*85)*S;
    GR.dx+=GR.dir*spd*d;GR.y+=3.5*S*d;
    const lim=W/2-((GR.cols-1)/2)*GR.px-6*cs;

  }
  for(const a of AL){
    const drop=clamp((G.tWave-a.delay)/.5,0,1);a.drop=drop;a.al=clamp(drop*1.6,0,1);

function bossStartPattern(ph){
  const cyc=ph===1?['spiral','volley','wall']:ph===2?['spiral','ring','volley','wall']:['spiral','wall','ring','volley'];
  B.pi=(B.pi==null?0:(B.pi+1)%cyc.length);
  const name=cyc[B.pi];
  const dur={spiral:6-ph*.6,volley:4,wall:3.2,ring:2.6}[name];
  const p=B.pat={name,t:dur,acc:0,a:Math.random()*6.283,ph_:0};
  if(name==='wall'){p.gx=W*(.2+Math.random()*.6);p.gw=Math.max(120*S,150*S);}
}
function runPattern(p,d,ph){
  if(p.name==='spiral'){
    const sp=(105+18*ph)*S;p.a+=d*(2.2+ph*.5);p.acc-=d*(14+ph*3);
    while(p.acc<=0){p.acc+=1;const arms=ph===1?2:3;
      for(let k=0;k<arms;k++){const ang=p.a+k*6.283/arms;
        addBullet(B.x,B.y+26*S,Math.cos(ang)*sp,Math.sin(ang)*sp,C_BOSS,3.6*S);}}
  }else if(p.name==='volley'){
    p.acc-=d;
    while(p.acc<=0){p.acc+=.8;const nB=3+ph;base:
      const base=Math.atan2(P.y-B.y,P.x-B.x);B.fireFlash=.15;
      for(let i=0;i<nB;i++){const ang=base+(i-(nB-1)/2)*.22,sp=(185+15*ph)*S*(.92+Math.random()*.16);
        addBullet(B.x,B.y+30*S,Math.cos(ang)*sp,Math.sin(ang)*sp,C_BOSS,4*S,(ph>=2&&i%2)?1:0);}}
  }else if(p.name==='wall'){
    if(!p.ph_){p.ph_=1;p.t=Math.min(p.t,.95);}
    else if(p.ph_===1&&p.t<=0){
      p.ph_=2;p.t=1.6;
      for(let bx=-8*S;bx<W+8*S;bx+=17*S){if(Math.abs(bx-p.gx)<p.gw/2)continue;
        addBullet(bx,-10*S,0,(95+G.wave*3)*S,C_WALL,3.4*S);}
      noise({d:.2,v:.2,f:500,f2:120});
    }
  }else if(p.name==='ring'){
    p.acc-=d;
    while(p.acc<=0){p.acc+=.55;const nB=22+ph*4,sp=(92+16*ph)*S;B.fireFlash=.15;
      for(let i=0;i<nB;i++){const ang=i/nB*6.283+p.a;
        addBullet(B.x,B.y,Math.cos(ang)*sp,Math.sin(ang)*sp,C_RING,4*S);}
      p.a+=.4;}
  }
}
function updBoss(d){
  B.y+=(B.ty-B.y)*Math.min(1,d*1.5);
  B.x=W/2+Math.sin(G.t*.5)*W*.14;
  if(B.flash>0)B.flash-=d;if(B.fireFlash>0)B.fireFlash-=d;
  const jt=B.fireFlash>0?2.2:0;B.jaw+=(jt-B.jaw)*Math.min(1,d*10);
  if(!(B.y>B.ty-6*S&&G.warn<=0))return;
  B.ph=B.hp>B.max*.66?1:B.hp>B.max*.33?2:3;const ph=B.ph;
  if(B.pat){const p=B.pat;p.t-=d;runPattern(p,d,ph);
    if(p.t<=0){B.pat=null;B.patT=Math.max(.45,.95-ph*.2);}}
  else{B.patT-=d;if(B.patT<=0)bossStartPattern(ph);}
}
function bossDeath(){

function spawnShots(){

  else if(P.power===2){shots.push({x:P.x-5*S,y,vx:0,vy:-sp,dead:false},{x:P.x+5*S,y,vx:0,vy:-sp,dead:false});}

  parts.push({x:P.x,y:y-6*S,vx:0,vy:-220*S,t:0,life:.12,size:2.5*S,col:[234,255,242]});

function updPlayer(d){
  const spd=340*S;
  let tx=0,ty=0;
  if(keys['arrowleft']||keys['a'])tx--;
  if(keys['arrowright']||keys['d'])tx++;
  if(keys['arrowup']||keys['w'])ty--;
  if(keys['arrowdown']||keys['s'])ty++;
  if(tx||ty){const l=Math.hypot(tx,ty);P.lx=tx/l;P.ly=ty/l;}
  let tvx=tx*spd,tvy=ty*spd;
  if(P.dashT>0){tvx=P.dx*950*S;tvy=P.dy*950*S;P.dashT-=d;
    P.trail.push({x:P.x,y:P.y,t:.28});if(P.trail.length>14)P.trail.shift();}
  const k=Math.min(1,d*(P.dashT>0?20:13));
  P.vx+=(tvx-P.vx)*k;P.vy+=(tvy-P.vy)*k;
  P.x+=P.vx*d;P.y+=P.vy*d;
  if(touch.active&&!tx&&!ty){
    const ty2=clamp(touch.y,H*.35,H-26);
    P.x+=(touch.x-P.x)*Math.min(1,d*10);P.y+=(ty2-P.y)*Math.min(1,d*10);
  }
  P.x=clamp(P.x,14,W-14);P.y=clamp(P.y,H*.30,H-26);
  for(const tr of P.trail)tr.t-=d;
  P.trail=P.trail.filter(tr=>tr.t>0);
  P.dashCd=Math.max(0,P.dashCd-d);P.inv-=d;P.fireCd-=d;
  if((keys[' ']||touch.fire)&&P.fireCd<=0){P.fireCd=[0,.13,.12,.11][P.power];spawnShots();sfxShoot();}
}
function updPlay(dt){
  G.t+=dt;
  const ts=G.slow>0?.35:1;G.slow=Math.max(0,G.slow-dt);
  const d=dt*ts;
  if(G.intro>0)G.intro-=dt;
  G.tWave+=d;
  G.shake*=Math.pow(.002,dt);if(G.shake<.15)G.shake=0;
  if(G.comboT>0){G.comboT-=d;if(G.comboT<=0)G.combo=0;}
  updPlayer(d);
  if(GR&&aliens.length)updGrid(d);
  if(B)updBoss(d);else if(G.bossDying)updBossDeath(d);
  if(G.curt){const c=G.curt;c.t-=d;c.acc-=d;
    while(c.acc<=0&&c.t>0){c.acc+=.075;addBullet(c.x,-12*S,0,(215+G.wave*4)*S,C_CHIT,3.4*S);}
    if(c.t<=0)G.curt=null;}
  // shots
  for(const s of shots){if(s.dead)continue;s.y+=s.vy*d;s.x+=s.vx*d;
    if(s.y<-30||s.x<-40||s.x>W+40){s.dead=true;continue;}
    if(B){const dx=s.x-B.x,dy=s.y-B.y;
      if(dx*dx+dy*dy<(58*S)*(58*S)){B.hp--;B.flash=.09;s.dead=true;spark(s.x,s.y,C_BOSS,4);
        if(B.hp<=0)bossDeath();continue;}}
    for(const a of aliens){if(a.dead||a.drop<1)continue;
      const dx=s.x-a.x,dy=s.y-a.y;
      if(dx*dx+dy*dy<(5.2*cs)*(5.2*cs)){killAlien(a);s.dead=true;break;}}
  }
  shots=shots.filter(s=>!s.dead);
  // bullets vs player
  if(P.inv<=0&&P.dashT<=0){
    for(const b of bullets){if(b.dead)continue;
      const dx=b.x-P.x,dy=b.y-P.y,rr=b.r+4*S;
      if(dx*dx+dy*dy<rr*rr){b.dead=true;hurt();break;}}
  }
  updBullets(d);
  // aliens vs player
  for(const a of aliens){if(a.dead)continue;
    const dx=a.x-P.x,dy=a.y-P.y;
    if(dx*dx+dy*dy<(7.5*cs)*(7.5*cs)){killAlien(a);hurt();}}
  // pickups
  for(const p of picks){p.t+=d;p.y+=p.vy*d;
    const dx=p.x-P.x,dy=p.y-P.y;
    if(dx*dx+dy*dy<(26*S)*(26*S)){p.dead=true;
      if(p.type==='P'){P.power=Math.min(3,P.power+1);floats.push({x:p.x,y:p.y,txt:'+POWER',t:0,life:1,col:'#7df3ff'});sfxPower();}
      else{P.shields=Math.min(5,P.shields+1);floats.push({x:p.x,y:p.y,txt:'+SHIELD',t:0,life:1,col:'#a6ff4d'});sfxPick();}}
    if(p.y>H+20)p.dead=true;}
  picks=picks.filter(p=>!p.dead);
  aliens=aliens.filter(a=>!a.dead);
  updFx(d);
  if(G.clearT>0){G.clearT-=dt;if(G.clearT<=0)spawnWave(G.wave+1);}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBoss(){
  const u=5*S,cx=B.x,cy=B.y+Math.sin(G.t*2)*4*S;

  const hull='#e8407f',dark='#7c1d4b',lite='#ff8fc2';
  R(-11,-3,2,7,dark);R(9,-3,2,7,dark);
  R(-12,1,2,2,hull);R(10,1,2,2,hull);
  R(-8,-9,2,3,hull);R(-3,-10,6,4,lite);R(6,-9,2,3,hull);
  R(-9,-7,18,10,hull);R(-9,-7,18,1,lite);
  R(-9,1,3,4,dark);R(6,1,3,4,dark);
  const pox=clamp((P.x-B.x)/(W*.7),-1,1)*1.1;
  R(-6.5,-5,5,3.5,'#20040f');R(1.5,-5,5,3.5,'#20040f');
  R(-4.9+pox,-4.3,1.6,2,'#ffd23f');R(3.1+pox,-4.3,1.6,2,'#ffd23f');
  R(-7,-6.1,5,.7,dark);R(2,-6.1,5,.7,dark);
  const mt=2.4,mh=2.6+B.jaw;
  R(-7,mt,14,mh,'#26060f');
  if(B.fireFlash>0){ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,61,110,.55)';ctx.fillRect(cx-6*u,cy+(mt+.5)*u,12*u,(mh-1)*u);
    ctx.globalCompositeOperation='source-over';}
  for(let i=0;i<7;i++){R(-6.3+i*1.9,mt+.1,1.1,.8,'#ffe3ef');
    R(-6.3+i*1.9+(i%2?.5:0),mt+mh-.9,1.1,.8,'#ffb9d2');}
  R(-8,mt+mh,16,1.4,hull);R(-8,mt+mh+1.4,16,.5,lite);
  if(B.flash>0){ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=`rgba(255,255,255,${clamp(B.flash*7,0,.5)})`;

  // hp bar
  const bw=Math.min(420,W*.6),bx=W/2-bw/2,by=16;

  ctx.fillStyle=g;ctx.fillRect(bx,by,bw*clamp(B.hp/B.max,0,1),7);
  ctx.strokeStyle='rgba(255,85,102,.5)';ctx.lineWidth=1;ctx.strokeRect(bx-.5,by-.5,bw+1,8);
  ctx.fillStyle='#ff9dbd';ctx.font=`9px ${MONO}`;ctx.textAlign='center';
  ctx.fillText('T H E   M A W',W/2,by-4);

function renderWorld(){

    if(i<P.shields){ctx.fillStyle='#a6ff4d';ctx.shadowColor='rgba(166,255,77,.8)';ctx.shadowBlur=6;
      ctx.fillRect(-ps/2,-ps/2,ps,ps);}
    else{ctx.strokeStyle='#33405f';ctx.lineWidth=1.5;ctx.strokeRect(-ps/2,-ps/2,ps,ps);}
    ctx.restore();}
  const pwX=W-16-(4*(ps*2.6)+ps)-10;
  ctx.fillStyle='#6f80a6';ctx.font=`10px ${MONO}`;ctx.textAlign='right';
  ctx.fillText('POWER',pwX,52);
  for(let i=0;i<3;i++){const x=pwX+14+(2-i)*14;
    if(i<P.power){ctx.fillStyle='#7df3ff';ctx.fillRect(x,43,9,9);}
    else{ctx.strokeStyle='#33405f';ctx.lineWidth=1.2;ctx.strokeRect(x,43,9,9);}}
  if(G.combo>1){
    ctx.textAlign='right';ctx.fillStyle='#ffd23f';ctx.font=`bold 14px ${MONO}`;
    ctx.fillText('COMBO \u00d7'+G.combo,W-16,88);
    ctx.fillStyle='rgba(255,210,63,.5)';
    const bw=46*Math.max(.8,S);ctx.fillRect(W-16-bw,94,bw*(G.comboT/3),2.5);}
  ctx.textAlign='left';ctx.fillStyle='rgba(127,141,176,.5)';ctx.font=`10px ${MONO}`;
  ctx.fillText('[P] PAUSE    [M] '+(muted?'MUTED':'SOUND ON'),16,H-12);
}
function keycap(x,y,w,txt){
  ctx.fillStyle='#0d1526';rr(x,y,w,18,4);ctx.fill();
  ctx.strokeStyle='#2b3a5e';ctx.lineWidth=1;rr(x,y,w,18,4);ctx.stroke();
  ctx.fillStyle='#cfe0ff';ctx.font=`bold 10px ${MONO}`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt,x+w/2,y+9.5);ctx.textBaseline='alphabetic';
}
function renderMenu(){
  // drifting decor aliens
  for(const d of decor){
    const bob=Math.sin(G.t*d.bs+d.ph)*8;
    const spr=AL_SPR[d.t][Math.floor(G.t*3+d.ph)%2];
    ctx.globalAlpha=.26;ctx.drawImage(spr,d.x-spr.width/2,d.y+bob-spr.height/2);
  }
  ctx.globalAlpha=1;
  const ty=H*.27+Math.sin(G.t*1.4)*6;
  const rg=ctx.createRadialGradient(W/2,ty,0,W/2,ty,W*.32);
  rg.addColorStop(0,`rgba(80,220,255,${.1+.05*Math.sin(G.t*2)})`);rg.addColorStop(1,'rgba(80,220,255,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  const s=Math.min(12,(W*.88)/68);
  pixCenter('VOID SWARM',W/2,ty,s*1.4,'rgba(70,200,255,.16)',1);
  pixCenter('VOID SWARM',W/2-3,ty,s,'rgba(255,79,163,.45)',1);
  pixCenter('VOID SWARM',W/2+3,ty,s,'rgba(80,220,255,.45)',1);
  pixCenter('VOID SWARM',W/2,ty,s,'#eaf9ff',1);
  ctx.textAlign='center';ctx.fillStyle='#8fa3c8';ctx.font=`13px ${MONO}`;
  try{ctx.letterSpacing='4px';}catch(e){}
  ctx.fillText('BULLET-HELL X SPACE INVADERS',W/2,ty+s*4.6);
  try{ctx.letterSpacing='0px';}catch(e){}
  // enemy intel
  const iy=H*.52,sc=Math.min(1,W/(3*170));
  for(let i=0;i<3;i++){
    const x=W/2+(i-1)*Math.min(160,W/3.4);
    const spr=AL_SPR[i][Math.floor(G.t*4)%2];
    ctx.drawImage(spr,x-spr.width*sc/2,iy-spr.height*sc/2,spr.width*sc,spr.height*sc);
    ctx.fillStyle=`rgb(${SPRITES[i].rgb})`;ctx.font=`10px ${MONO}`;
    ctx.fillText(`${SPRITES[i].name}  ${SPRITES[i].pts}`,x,iy+34*S+8);
  }
  // controls
  const lines=[['MOVE',64,'ARROWS / WASD'],['FIRE',52,'HOLD SPACE'],['DASH',58,'SHIFT / X'],['PAUSE',62,'P   MUTE  M']];
  const cy=H*.635;
  for(let i=0;i<lines.length;i++){const L=lines[i],y=cy+i*26;
    keycap(W/2-170,y,L[1],L[0]);
    ctx.fillStyle='#cfe0ff';ctx.font=`12px ${MONO}`;ctx.textAlign='left';
    ctx.fillText(L[2],W/2-170+L[1]+14,y+13);}
  if('ontouchstart' in window){
    ctx.fillStyle='#ffd23f';ctx.font=`11px ${MONO}`;ctx.textAlign='center';
    ctx.fillText('TOUCH - DRAG TO FLY  /  TWO FINGERS = DASH',W/2,cy+lines.length*26+8);}
  // prompt + hi-score
  const bl=.5+.5*Math.sin(G.t*5);
  ctx.fillStyle=`rgba(255,210,63,${.45+.55*bl})`;ctx.font=`bold 15px ${MONO}`;ctx.textAlign='center';
  ctx.fillText('PRESS ENTER TO START',W/2,H*.84);
  ctx.fillStyle='#7f8db0';ctx.font=`11px ${MONO}`;
  ctx.fillText(G.hi>0?('HI-SCORE  '+G.hi+'   ·   OR CLICK / TAP'):'OR CLICK / TAP',W/2,H*.84+20);
  ctx.fillStyle='#5d6c8f';ctx.font=`10px ${MONO}`;
  ctx.fillText('TIP - YOUR HITBOX IS THE BRIGHT DOT · DASH THROUGH THE FIRE',W/2,H-16);
}
function renderOver(){
  ctx.fillStyle='rgba(8,3,10,.74)';ctx.fillRect(0,0,W,H);
  const s=Math.min(11,(W*.9)/61);
  pixCenter('GAME OVER',W/2,H*.27,s*1.35,'rgba(255,61,110,.18)',1);
  pixCenter('GAME OVER',W/2-2,H*.27,s,'rgba(120,10,40,.8)',1);
  pixCenter('GAME OVER',W/2,H*.27,s,'#ff5566',1);
  if(G.newHi&&Math.floor(G.t*3)%2===0)pixCenter('NEW RECORD!',W/2,H*.27+s*4.9,Math.max(3,5*S),'#ffd23f',1);
  ctx.textAlign='center';ctx.fillStyle='#6f80a6';ctx.font=`11px ${MONO}`;
  ctx.fillText('F I N A L   S C O R E',W/2,H*.47);
  ctx.fillStyle='#eaf6ff';ctx.font=`bold 30px ${MONO}`;
  ctx.shadowColor='rgba(80,220,255,.6)';ctx.shadowBlur=10;
  ctx.fillText(String(G.score),W/2,H*.47+34);ctx.shadowBlur=0;
  ctx.fillStyle='#8fa3c8';ctx.font=`13px ${MONO}`;
  ctx.fillText('WAVE REACHED  '+G.wave+'      BEST  '+G.hi,W/2,H*.47+62);
  const bl=.5+.5*Math.sin(G.t*5);
  ctx.fillStyle=`rgba(207,224,255,${.35+.65*bl})`;ctx.font=`bold 14px ${MONO}`;
  ctx.fillText('PRESS R OR ENTER TO RETRY',W/2,H*.8);
}
function renderWarn(){
  const a=.2+.3*(.5+.5*Math.sin(G.t*14));
  ctx.fillStyle=`rgba(255,40,70,${a*.5})`;
  ctx.fillRect(0,0,W,H*.16);ctx.fillRect(0,H*.84,W,H*.16);
  pixCenter('WARNING',W/2,H*.34,Math.min(11,(W-40)/47),'#ff5566',.55+.45*Math.sin(G.t*16));
  ctx.fillStyle='#ffb9c8';ctx.font=`12px ${MONO}`;ctx.textAlign='center';
  ctx.fillText('M A S S I V E   S I G N A T U R E   D E T E C T E D',W/2,H*.34+Math.min(11,(W-40)/47)*4.4);
}
function render(){
  ctx.drawImage(neb,0,0,W,H);
  drawStars();
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  if(G.mode==='menu')renderMenu();else renderWorld();
  ctx.restore();
  if(G.mode!=='menu')renderHUD();
  if(G.mode==='playing'){
    if(G.intro>0){
      const a=Math.min(clamp((1.6-G.intro)/.3,0,1),clamp(G.intro/.5,0,1));
      const pop=1+.08*clamp((1.6-G.intro)/.3,0,1);
      pixCenter('WAVE '+G.wave,W/2,H*.4,9*S*pop,'#bfffe9',a);
      ctx.globalAlpha=a*.7;ctx.fillStyle='#8fa3c8';ctx.font=`12px ${MONO}`;
      ctx.textAlign='center';ctx.fillText('C L E A R   T H E   S W A R M',W/2,H*.4+9*S*4.6);ctx.globalAlpha=1;
    }
    if(G.clearT>0&&G.wave%5!==0)
      pixCenter('WAVE CLEAR',W/2,H*.42,Math.max(3,6*S),'#ffd23f',.5+.4*Math.sin(G.t*8));
  }
  if(G.warn>0)renderWarn();
  if(G.mode==='pause'){
    ctx.fillStyle='rgba(4,6,15,.72)';ctx.fillRect(0,0,W,H);
    pixCenter('PAUSED',W/2,H*.42,Math.min(10,(W-40)/48),'#7df3ff',.9);
    ctx.fillStyle='#8fa3c8';ctx.font=`12px ${MONO}`;ctx.textAlign='center';
    ctx.fillText('[P] RESUME     [R] RESTART     [M] SOUND',W/2,H*.42+60*S);
  }
  if(G.mode==='over')renderOver();
}

/* ============================== MAIN LOOP ============================== */
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(320,window.innerWidth);H=Math.max(400,window.innerHeight);
  cv.width=(W*DPR)|0;cv.height=(H*DPR)|0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S=clamp(Math.min(W/860,H/640),.55,1.35);
  buildNebula();buildStars();buildSprites();
}
window.addEventListener('resize',resize);
resize();
P=mkP();
decor=[];for(let i=0;i<7;i++)decor.push({x:Math.random()*W,y:H*(.12+Math.random()*.6),
  v:(8+Math.random()*14)*(Math.random()<.5?-1:1),t:i%3,bs:.6+Math.random(),ph:Math.random()*6});
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  if(G.mode==='menu'){G.t+=dt;updStars(dt);
    for(const d of decor){d.x+=d.v*dt;if(d.x>W+60)d.x=-60;if(d.x<-60)d.x=W+60;}}
  else if(G.mode==='playing')updPlay(dt);
  else if(G.mode==='over'){G.t+=dt;G.overT+=dt;updStars(dt);updBullets(dt);updFx(dt);
    G.shake*=Math.pow(.002,dt);}
  render();
}
requestAnimationFrame(frame);
</script>
