<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hop Logic — Puzzle Frogger</title>
<style>
  :root{
    --bg0:#04141d; --ink:#eafff2; --gold:#ffd45e; --cyan:#7de8ff;
    --green:#aef25e; --red:#ff6b5e; --panel:rgba(8,26,36,.92);
    --disp:Impact,'Arial Black','Franklin Gothic Medium',sans-serif;
    --body:'Trebuchet MS',Verdana,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg0);touch-action:manipulation}
  body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;cursor:default}
  #cv{position:fixed;inset:0;display:block;z-index:0}
  /* CRT flavor */
  body::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
  body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(2,8,12,.55) 100%)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;height:64px;z-index:2;display:flex;align-items:center;
    justify-content:space-between;padding:0 18px;pointer-events:none;
    background:linear-gradient(180deg,rgba(4,17,24,.9),rgba(4,17,24,.35) 80%,transparent)}
  .hb{display:flex;flex-direction:column;gap:2px}
  .hl{font-size:10px;letter-spacing:.28em;color:#6fa8bd;font-weight:bold}
  .hv{font-family:var(--body);font-weight:bold;font-size:24px;letter-spacing:.06em;color:#fff;
    text-shadow:0 0 12px rgba(125,232,255,.35)}
  .hmid{align-items:center}
  #lvl{font-family:var(--disp);font-size:20px;letter-spacing:.14em;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.6)}
  #pips{display:flex;gap:6px;margin-top:3px}
  .pip{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:12px;color:#9fd8e8;border:2px solid #2f5a70;background:rgba(10,34,46,.8);transition:all .2s}
  .pip.next{color:#1a1206;background:var(--gold);border-color:#fff3c9;animation:pulse 1s infinite}
  .pip.done{color:#3d0f2b;background:#ff7ab8;border-color:#ffd0e8;box-shadow:0 0 10px rgba(255,122,184,.6)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  #lives{display:flex;gap:3px;align-items:center;height:24px}
  .hright{align-items:flex-end}
  body.state-menu #hud,body.state-over #hud{opacity:.28}

  #tbar{position:fixed;top:64px;left:0;right:0;height:5px;z-index:2;background:rgba(6,20,28,.9);pointer-events:none}
  #tfill{height:100%;width:100%;background:linear-gradient(90deg,#3fd47f,#aef25e);transition:width .1s linear}
  #tfill.warn{background:linear-gradient(90deg,#ffb84d,#ffd45e)}
  #tfill.low{background:linear-gradient(90deg,#ff4d3d,#ff8c42);animation:tpulse .5s infinite}
  @keyframes tpulse{50%{filter:brightness(1.7)}}

  /* ---------- Banner ---------- */
  #banner{position:fixed;top:26%;left:0;right:0;z-index:3;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px) scale(.96);transition:all .28s}
  #banner.on{opacity:1;transform:none}
  .bt{font-family:var(--disp);font-size:clamp(34px,7vw,58px);letter-spacing:.1em;color:#fff;
    text-shadow:0 3px 0 #1c4d14,0 6px 0 rgba(0,0,0,.5),0 0 30px rgba(125,232,255,.4)}
  .bs{margin-top:8px;font-size:13px;letter-spacing:.34em;color:var(--cyan);font-weight:bold}

  /* ---------- Overlays ---------- */
  #ov{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%,rgba(6,20,30,.55),rgba(3,10,15,.85));transition:opacity .35s}
  #ov.hide{opacity:0;pointer-events:none}
  .card{max-width:560px;width:92%;padding:34px 30px 28px;text-align:center;background:var(--panel);
    border:2px solid rgba(125,232,255,.22);border-radius:14px;position:relative;
    box-shadow:0 0 0 6px rgba(4,16,22,.5),0 24px 60px rgba(0,0,0,.6)}
  .card::before{content:"";position:absolute;top:-2px;left:8%;right:8%;height:3px;border-radius:3px;
    background:linear-gradient(90deg,transparent,var(--gold),var(--cyan),transparent)}
  .tag{display:inline-block;font-size:11px;font-weight:bold;letter-spacing:.4em;color:#08222e;background:var(--cyan);
    padding:5px 12px 4px;border-radius:3px;transform:rotate(-2deg);box-shadow:0 3px 0 rgba(0,0,0,.4)}
  h1{font-family:var(--disp);font-size:clamp(46px,9vw,78px);line-height:1;margin:14px 0 4px;letter-spacing:.05em}
  h1 .a{color:var(--green);text-shadow:0 3px 0 #2c7a1f,0 6px 0 #123a10,0 0 28px rgba(140,255,90,.3)}
  h1 .b{color:var(--gold);text-shadow:0 3px 0 #8a5c07,0 6px 0 #4d3004,0 0 28px rgba(255,212,94,.3)}
  h1.red{color:#ff6b5e;text-shadow:0 3px 0 #7a1c12,0 6px 0 #3d0c06,0 0 28px rgba(255,90,70,.3)}
  .frogbob{display:inline-block;animation:bob 1.5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-12px) scale(.96,1.05)}}
  .how{margin:14px auto 6px;font-size:14.5px;line-height:1.55;color:#bfe3d4;max-width:420px}
  .how b{color:var(--gold)}
  .keys{list-style:none;margin:14px 0 4px;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:#8fc4cf}
  kbd{font-family:'Courier New',monospace;font-weight:bold;background:#0d2c3a;border:1px solid #2f6a80;
    border-bottom-width:3px;border-radius:4px;padding:2px 7px;color:#d8f6ff;font-size:12px;margin:0 1px}
  .go{margin-top:18px;font-family:var(--disp);font-size:22px;letter-spacing:.12em;color:#241503;cursor:pointer;
    background:linear-gradient(180deg,#ffe08a,var(--gold) 55%,#e6a92c);border:none;border-radius:8px;padding:13px 34px;
    box-shadow:0 5px 0 #8a5c07,0 10px 22px rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}
  .go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #8a5c07,0 14px 26px rgba(0,0,0,.5)}
  .go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5c07}
  .go:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .blink{margin-top:14px;font-size:11px;letter-spacing:.3em;color:#6fa8bd;animation:bl 1.2s steps(2) infinite}
  @keyframes bl{50%{opacity:.25}}
  .bestline{margin-top:12px;font-size:12px;letter-spacing:.24em;color:#9fd8e8;font-weight:bold}
  .stat{display:flex;justify-content:center;gap:34px;margin:16px 0 4px}
  .stat div{display:flex;flex-direction:column;gap:4px}
  .stat .n{font-family:var(--body);font-weight:bold;font-size:34px;color:#fff;text-shadow:0 0 14px rgba(125,232,255,.4)}
  .nb{display:inline-block;margin-top:10px;background:var(--green);color:#0e2a08;font-weight:bold;font-size:11px;
    letter-spacing:.3em;padding:5px 12px;border-radius:3px;transform:rotate(2deg);animation:pulse 1s infinite}

  #pause{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:rgba(3,10,15,.6)}
  #pause.hide{display:none}
  #pause div{font-family:var(--disp);font-size:44px;letter-spacing:.2em;color:#fff;text-shadow:0 0 24px rgba(125,232,255,.5)}
  #pause small{position:absolute;margin-top:96px;font-size:11px;letter-spacing:.3em;color:#8fc4cf}

  #snd{position:fixed;left:14px;bottom:12px;z-index:6;background:rgba(8,26,36,.75);border:1px solid #2f6a80;
    color:#9fd8e8;font-family:var(--body);font-weight:bold;font-size:11px;letter-spacing:.18em;padding:7px 12px;border-radius:6px;cursor:pointer}
  #snd:hover{color:#fff;border-color:#4d9ab5}

  /* ---------- Touch D-pad ---------- */
  #dpad{position:fixed;right:16px;bottom:16px;z-index:6;display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:58px;gap:8px}
  body.touch #dpad{display:grid}
  #dpad button{border-radius:50%;border:2px solid rgba(125,232,255,.4);background:rgba(9,36,48,.6);
    color:#bfefff;font-size:22px;cursor:pointer}
  #dpad button:active{transform:scale(.9);background:rgba(30,80,100,.7)}
  #dpad [data-d="up"]{grid-column:2;grid-row:1}
  #dpad [data-d="left"]{grid-column:1;grid-row:2}
  #dpad [data-d="down"]{grid-column:2;grid-row:2}
  #dpad [data-d="right"]{grid-column:3;grid-row:2}
</style>
</head>
<body class="state-menu">

<canvas id="cv"></canvas>

<div id="hud">
  <div class="hb">
    <span class="hl">SCORE</span><span class="hv" id="score">000000</span>
    <span class="hl" style="margin-top:2px">BEST&nbsp;<span id="best">000000</span></span>
  </div>
  <div class="hb hmid">
    <span id="lvl">LEVEL 1</span>
    <div id="pips"><span class="pip" id="p1">1</span><span class="pip" id="p2">2</span><span class="pip" id="p3">3</span></div>
  </div>
  <div class="hb hright">
    <span class="hl">LIVES</span>
    <span id="lives"></span>
  </div>
</div>
<div id="tbar"><i id="tfill"></i></div>

<div id="banner"></div>

<div id="pause" class="hide"><div>PAUSED<small>P — RESUME</small></div></div>

<div id="ov">
  <div class="card" id="card"></div>
</div>

<button id="snd">♪ SOUND ON</button>

<div id="dpad">
  <button data-d="up">▲</button><button data-d="left">◀</button>
  <button data-d="down">▼</button><button data-d="right">▶</button>
</div>

<script>
(()=>{'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const mod=(a,p)=>((a%p)+p)%p;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ================= canvas / sizing ================= */
const cv=$('#cv'), ctx=cv.getContext('2d');
const COLS=9,ROWS=9,P=13,MG=2;               // wrap period & margin
let W=0,H=0,DPR=1,cell=40,ox=0,oy=0,bgGrad=null;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const hud=86,pad=16;
  cell=Math.floor(Math.min((W-pad*2)/COLS,(H-hud-pad*2)/ROWS));if(cell<14)cell=14;
  ox=Math.round((W-cell*COLS)/2);oy=hud+Math.round((H-hud-cell*ROWS)/2);
  bgGrad=ctx.createRadialGradient(W/2,H*.42,60,W/2,H*.5,Math.max(W,H)*.75);
  bgGrad.addColorStop(0,'#0b3145');bgGrad.addColorStop(.55,'#072233');bgGrad.addColorStop(1,'#03101a');
}
addEventListener('resize',resize);

/* ================= audio (WebAudio, post-gesture) ================= */
let AC=null,master=null,muted=false;
function audio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.42;master.connect(AC.destination)}if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v,slide,delay){if(!AC||muted)return;try{const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(28,f+slide),t0+d);
  g.gain.setValueAtTime(v||.2,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.03)}catch(e){}}
function noise(d,v,fc,delay){if(!AC||muted)return;try{const t0=AC.currentTime+(delay||0),n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=fc||700;
  g.gain.setValueAtTime(v||.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(f);f.connect(g);g.connect(master);s.start(t0)}catch(e){}}
const sfx={
  hop:()=>tone(330,.07,'square',.1,140),
  chime:()=>[660,880,1320].forEach((f,i)=>tone(f,.14,'triangle',.24,0,i*.075)),
  splash:()=>{noise(.32,.5,650);tone(190,.24,'sine',.3,-130)},
  hit:()=>{tone(85,.16,'square',.42,-45);noise(.2,.4,300)},
  wrong:()=>{tone(210,.09,'sawtooth',.24);tone(150,.13,'sawtooth',.24,0,.09)},
  jingle:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,.16,'triangle',.24,0,i*.09)),
  over:()=>[392,311,262,196].forEach((f,i)=>tone(f,.24,'square',.22,0,i*.19)),
  oneup:()=>{tone(784,.09,'triangle',.25);tone(1175,.14,'triangle',.25,0,.09)},
  tick:()=>tone(1050,.035,'square',.06)
};

/* ================= state ================= */
const S={state:'menu',paused:false,score:0,best:0,level:1,lives:3,timeLeft:0,maxT:80,
  phase:'alive',nextNum:1,laneT:0,dieT:0,clearT:0,shake:0,flash:0,tickSec:-1};
let lanes=[],pads=[],tufts=[],specks=[],decoLilies=[];
const frog={col:4,row:8,x:4,y:8,fx:4,fy:8,toC:4,toR:8,t:0,moving:false,face:1,grace:0,wait:0};
let pending=null,tAmb=0,ambT=0;

const FROG_SVG='<svg width="26" height="23" viewBox="0 0 26 24"><ellipse cx="13" cy="15.5" rx="10" ry="7.4" fill="#5fc93f"/><circle cx="7" cy="8" r="4.1" fill="#5fc93f"/><circle cx="19" cy="8" r="4.1" fill="#5fc93f"/><circle cx="7" cy="7.4" r="2" fill="#fff"/><circle cx="19" cy="7.4" r="2" fill="#fff"/><circle cx="7.7" cy="7.6" r="1" fill="#143a0c"/><circle cx="19.7" cy="7.6" r="1" fill="#143a0c"/><ellipse cx="13" cy="18.5" rx="5.4" ry="2.8" fill="#a8e08d"/><circle cx="10" cy="14.5" r="1.1" fill="#2f7a1f"/><circle cx="16" cy="14.5" r="1.1" fill="#2f7a1f"/></svg>';
const FROG_BIG='<svg width="86" height="78" viewBox="0 0 26 24"><ellipse cx="13" cy="15.5" rx="10" ry="7.4" fill="#5fc93f"/><circle cx="7" cy="8" r="4.1" fill="#6fd44e"/><circle cx="19" cy="8" r="4.1" fill="#6fd44e"/><circle cx="7" cy="7.4" r="2.1" fill="#fff"/><circle cx="19" cy="7.4" r="2.1" fill="#fff"/><circle cx="7.7" cy="7.6" r="1.05" fill="#143a0c"/><circle cx="19.7" cy="7.6" r="1.05" fill="#143a0c"/><ellipse cx="13" cy="18.5" rx="5.4" ry="2.8" fill="#b8eaa4"/><circle cx="10" cy="14.5" r="1.1" fill="#2f7a1f"/><circle cx="16" cy="14.5" r="1.1" fill="#2f7a1f"/><circle cx="13" cy="13" r=".9" fill="#2f7a1f"/></svg>';

/* ================= level generation ================= */
function levelTime(l){return Math.max(45,82-(l-1)*5)}
const lanePos=(l,b,t)=>mod(b+l.phase+l.dir*l.speed*t,P);

function genLevel(){
  const r=mulberry32(S.level*7919+101);
  lanes=[];
  const M=1+Math.min(S.level-1,8)*.07, js=(a,b)=>a+r()*(b-a);
  const d=r()<.5?1:-1;
  // water rows 1..4 (top→bottom)
  addLane(r,1,{kind:'log',w:3,n:2,speed:1.5*M*js(.9,1.1),dir:d});
  const t2=r()<.5?'duck':'log';
  addLane(r,2,{kind:t2,w:t2==='duck'?1:2,n:t2==='duck'?4:3,speed:(t2==='duck'?2.2:1.8)*M*js(.9,1.1),dir:-d});
  const t3=r()<.5?'log':'duck';
  addLane(r,3,{kind:t3,w:t3==='duck'?1:2,n:t3==='duck'?4:3,speed:(t3==='duck'?2.1:1.7)*M*js(.9,1.1),dir:d});
  if(S.level<2)addLane(r,4,{kind:'log',w:2,n:3,speed:1.3*M*js(.9,1.1),dir:-d});
  else addLane(r,4,{kind:'pike',w:1,n:3,speed:Math.min(4,2.5+S.level*.18)*js(.95,1.05),dir:r()<.5?1:-1});
  // road rows 5..7
  const r5=r()<.5?'car':'taxi', r7=r5==='car'?'taxi':'car';
  addLane(r,5,{kind:r5,w:1,n:3,speed:(r5==='taxi'?2.6:1.8)*M*js(.9,1.1),dir:r()<.5?1:-1});
  addLane(r,6,{kind:'truck',w:2,n:S.level>=4?3:2,speed:Math.min(2.4,1.5*M)*js(.9,1.1),dir:r()<.5?1:-1});
  addLane(r,7,{kind:r7,w:1,n:3,speed:(r7==='taxi'?2.6:1.8)*M*js(.9,1.1),dir:r()<.5?1:-1});
  safeStart();
  // lotus pads: 3 columns, numbers in random order — the puzzle
  const pool=[1,2,3,4,5,6,7];
  for(let i=pool.length-1;i>0;i--){const j=(r()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
  const chosen=[];for(const c of pool){if(chosen.every(x=>Math.abs(x-c)>=2)){chosen.push(c);if(chosen.length===3)break}}
  for(let i=0;i<pool.length&&chosen.length<3;i++)if(!chosen.includes(pool[i]))chosen.push(pool[i]);
  chosen.sort((a,b)=>a-b);
  const perm=[1,2,3];for(let i=2;i>0;i--){const j=(r()*(i+1))|0;[perm[i],perm[j]]=[perm[j],perm[i]]}
  pads=chosen.map((col,i)=>({col,num:perm[i],state:'wait',shake:0}));
  // decoration
  tufts=[];for(let i=0;i<34;i++)tufts.push({row:r()<.5?0:8,x:r()*COLS,o:r()*.6+.2,s:r()});
  specks=[];for(let i=0;i<70;i++)specks.push({row:5+((r()*3)|0),x:r()*COLS,y:r(),w:r()<.5});
  decoLilies=[];const free=[0,1,2,3,4,5,6,7,8].filter(c=>!chosen.includes(c));
  for(let i=0;i<2&&free.length;i++){const k=(r()*free.length)|0;decoLilies.push({c:free.splice(k,1)[0],r:r()})}
  S.laneT=0;S.maxT=levelTime(S.level);S.timeLeft=S.maxT;
}
function addLane(r,row,c){const s=P/c.n,l={row,kind:c.kind,w:c.w,n:c.n,speed:c.speed,dir:c.dir,phase:r()*s,color:r(),items:[]};
  for(let i=0;i<c.n;i++)l.items.push(i*s);lanes.push(l)}
function safeStart(){ // keep column 4 clear in the near road lane for ~1.3s at level start
  const l=lanes.find(L=>L.row===7);if(!l)return;const s=P/l.n;
  outer:for(let k=0;k<64;k++){l.phase=mod(k*s/8,P);
    for(let tt=0;tt<=1.35;tt+=.1)for(const b of l.items){
      const ix=mod(b+l.phase+l.dir*l.speed*tt,P)-MG;
      if(4.4>ix&&3.6<ix+l.w)continue outer}
    break}
}

/* ================= flow ================= */
function placeStart(){frog.col=4;frog.row=8;frog.x=4;frog.y=8;frog.fx=4;frog.fy=8;frog.t=0;frog.moving=false;frog.face=1;pending=null}
function startRun(){S.state='play';S.paused=false;S.score=0;S.lives=3;S.level=1;genLevel();placeStart();
  S.phase='alive';S.nextNum=1;$('#ov').classList.add('hide');setBodyState();updHUDAll();banner('LEVEL 1','FILL THE LOTUS 1→2→3',1400)}
function die(kind){if(S.phase!=='alive')return;S.phase='dying';S.dieT=0;S.shake=9;S.flash=.55;
  if(kind==='crash'){sfx.hit();burst(frog.x,frog.row,kind==='crash'?'spark':'drop',14)}
  else{sfx.splash();burst(frog.x,frog.row,'drop',16)}
  rings.push({x:frog.x,y:frog.row,r:.2,max:2.2,a:.7})}
function gameOver(){S.state='over';sfx.over();setBodyState();
  try{if(S.score>S.best){S.best=S.score;localStorage.setItem('hoplogic_best',String(S.best))}}catch(e){}
  if(S.score>S.bestPrev)S.beat=true;else S.beat=false;
  showOver()}
function nextLevel(){S.level++;
  if(S.level%2===0&&S.lives<5){S.lives++;sfx.oneup();updLives()}
  genLevel();placeStart();S.nextNum=1;S.phase='alive';updHUDAll();
  banner('LEVEL '+S.level,S.level===2?'FILL THE LOTUS · BEWARE THE PIKE':'FILL THE LOTUS 1→2→3',1400)}

const KEYD={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
function tryDir(dx,dy){if(S.state!=='play'||S.paused||S.phase!=='alive'||frog.moving)return;
  const c=frog.col+dx,rw=frog.row+dy;if(c<0||c>8||rw<0||rw>8)return;
  frog.fx=frog.x;frog.fy=frog.y;frog.toC=c;frog.toR=rw;frog.t=0;frog.moving=true;
  if(dx)frog.face=dx;sfx.hop()}
window.addEventListener('keydown',e=>{audio();const k=e.code;
  if(k==='Enter'){if(S.state!=='play')startRun();e.preventDefault();return}
  if(k==='KeyR'&&S.state!=='menu'){startRun();return}
  if(k==='KeyP'&&S.state==='play'){togglePause();return}
  if(k==='KeyM'){toggleMute();return}
  const d=KEYD[k];if(d){e.preventDefault();pending={dx:d[0],dy:d[1],at:performance.now()}}});

$('#snd').addEventListener('click',()=>{audio();toggleMute()});
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches||'ontouchstart'in window)document.body.classList.add('touch');
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.querySelectorAll('#dpad button').forEach(b=>{

/* ================= update ================= */
function onLand(){
  if(frog.row===1&&S.bouncing){S.bouncing=false;frog.grace=.6}
  if(frog.row>=1&&frog.row<=4){ // little landing ripple when on a platform
    const l=coverAt(frog.row,frog.x);if(l)rings.push({x:frog.x,y:frog.row,r:.15,max:1,a:.5})}
  if(frog.row===0){const p=pads.find(p=>p.col===frog.col&&p.state!=='done');
    if(!p)return;
    if(p.num===S.nextNum){p.state='done';const pts=100*S.level;S.score+=pts;sfx.chime();
      floatText('+'+pts,frog.x,0);burst(frog.x,0,'petal',16);updScore();
      S.timeLeft=Math.min(S.maxT,S.timeLeft+8);S.nextNum++;updatePips();
      if(S.nextNum>3){S.phase='clear';S.clearT=0;sfx.jingle();
        const bonus=Math.ceil(S.timeLeft)*5;S.score+=bonus;updScore();
        banner('LEVEL '+S.level+' CLEAR','BONUS +'+bonus,1600)}
      else{S.phase='respawn';frog.wait=.55}}
    else{p.shake=1;sfx.wrong();
      frog.fx=frog.x;frog.fy=frog.y;frog.toC=frog.col;frog.toR=1;frog.t=0;frog.moving=true;S.bouncing=true}}}
function coverAt(row,x){for(const l of lanes)if(l.row===row&&l.kind!=='pike')
  for(const b of l.items){const ix=lanePos(l,b,S.laneT)-MG;if(x-.1>ix&&x+.1<ix+l.w)return l}return null}

function checkHazards(dt){
  const curRow=frog.moving?frog.toR:frog.row,fx=frog.x;
  for(const l of lanes){if(l.row!==curRow)continue;
    for(const b of l.items){const ix=lanePos(l,b,S.laneT)-MG;
      if(fx+.36>ix&&fx-.36<ix+l.w){
        if(l.kind==='car'||l.kind==='truck'||l.kind==='taxi')return die('crash');
        if(l.kind==='pike'&&frog.grace<=0)return die('splash')}}}
  if(!frog.moving&&frog.row>=1&&frog.row<=4){
    const l=coverAt(frog.row,frog.x);
    if(frog.grace>0)return;
    if(!l)return die('splash');
    frog.x+=l.dir*l.speed*dt;
    if(frog.x<-.35||frog.x>9.35)die('splash')}}

function update(dt,now){
  if(S.state==='play'&&!S.paused&&pending){
    if(now-pending.at>180)pending=null;else{tryDir(pending.dx,pending.dy);pending=null}}
  ambT+=dt;if(ambT>1.3){ambT=0;rings.push({x:Math.random()*W,y:Math.random()*H,r:2,max:46,a:.25,px:true})}
  if(S.state==='play'){if(S.phase!=='clear')S.laneT+=dt}else S.laneT+=dt*.5;

  if(frog.moving){frog.t+=dt/.13;
    if(frog.t>=1){frog.t=1;frog.moving=false;frog.x=frog.toC;frog.y=frog.toR;frog.row=frog.toR;frog.col=frog.toC;onLand()}
    else{frog.x=lerp(frog.fx,frog.toC,frog.t);frog.y=lerp(frog.fy,frog.toR,frog.t)}}

  if(S.state==='play'){
    if(S.phase==='respawn'){frog.wait-=dt;if(frog.wait<=0){placeStart();S.phase='alive';frog.grace=.7}}
    else if(S.phase==='dying'){S.dieT+=dt;
      if(S.dieT>=.85){S.lives--;updLives();
        if(S.lives<=0)gameOver();else{S.phase='respawn';frog.wait=.3}}}
    else if(S.phase==='clear'){S.clearT+=dt;if(S.clearT>=1.7)nextLevel()}
    if(S.phase!=='clear'){S.timeLeft-=dt;
      if(S.timeLeft<=10){const s=Math.ceil(S.timeLeft);if(s!==S.tickSec){S.tickSec=s;sfx.tick()}}
      if(S.timeLeft<=0){S.timeLeft=0;
        if(S.phase==='alive')die('splash');
        else if(S.phase==='respawn'){placeStart();S.lives--;updLives();
          if(S.lives<=0)gameOver();else{S.phase='alive';frog.grace=.7}}}}
    frog.grace=Math.max(0,frog.grace-dt);
    if(S.phase==='alive')checkHazards(dt)}

  S.shake=Math.max(0,S.shake-dt*26);S.flash=Math.max(0,S.flash-dt*1.5);
  pads.forEach(p=>p.shake=Math.max(0,p.shake-dt*3));
  updTimerBar()}

/* ================= particles / fx ================= */
let parts=[],rings=[];
function burst(gx,gy,kind,n){const px=ox+(gx+.5)*cell,py=oy+(gy+.5)*cell;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(30+Math.random()*90);
    const col=kind==='spark'?['#ffd45e','#ff8c42','#fff'][i%3]
            :kind==='petal'?['#ff7ab8','#ffb1d6','#ffe08a'][i%3]
            :['#bfeaff','#7de8ff','#eafff2'][i%3];
    parts.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(kind==='drop'?60:20),g:kind==='petal'?60:260,
      life:0,max:.5+Math.random()*.5,sz:1.5+Math.random()*2.5,col})}}
function floatText(str,gx,gy){parts.push({txt:str,x:ox+(gx+.5)*cell,y:oy+(gy+.4)*cell,vx:0,vy:-34,g:0,life:0,max:1,sz:cell*.42,col:'#ffe9a8'})}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=(r.px?60:cell*2.4)*dt;r.a-=dt*(r.px?.35:.9);if(r.a<=0)rings.splice(i,1)}}

const CAR_COLS=[['#e0503a','#8f2b1d'],['#4f9ddc','#27567f'],['#c9d2de','#5d6470'],['#7fd4a0','#2f7a52']];
function drawCar(px,py,wg,dir,c1,c2){const s=cell,x=px,y=py+s*.24,w=wg*s,h=s*.52;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+w/2,y+h+2,w*.46,4,0,0,7);ctx.fill();
  ctx.fillStyle=c1;rr(x,y,w,h,s*.14);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=c2;rr(x+w*.22,y+s*.09,w*.56,h*.5,s*.08);ctx.fill();
  ctx.fillStyle='#1c2430';ctx.fillRect(x+w*.05,y+h-3,7,5);ctx.fillRect(x+w-12,y+h-3,7,5);
  const fl=dir>0?x+w-4:x+1;ctx.fillStyle='#ffe9a8';ctx.fillRect(fl,y+4,3,4);ctx.fillRect(fl,y+h-8,3,4);
  ctx.fillStyle='#ff6b6b';const bl=dir>0?x+1:x+w-4;ctx.fillRect(bl,y+5,2.5,3);ctx.fillRect(bl,y+h-8,2.5,3)}
function drawTruck(px,py,wg,dir){const s=cell,x=px,y=py+s*.2,w=wg*s,h=s*.56,cab=w*.3;
  ctx.save();if(dir<0){ctx.translate(x+w,0);ctx.scale(-1,1)}
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+w/2,y+h+2,w*.48,4,0,0,7);ctx.fill();
  ctx.fillStyle='#8fa3b8';rr(x,y,w-cab,h,s*.1);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#e8a13c';rr(x+w-cab,y+s*.04,cab,h-s*.08,s*.1);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2b3a4d';ctx.fillRect(x+w-cab+3,y+s*.1,cab-6,s*.2);
  ctx.fillStyle='#1c2430';ctx.fillRect(x+4,y+h-3,8,5);ctx.fillRect(x+w-cab+2,y+h-3,8,5);ctx.fillRect(x+w-12,y+h-3,8,5);
  ctx.fillStyle='#ffe9a8';ctx.fillRect(x+w-3,y+s*.12,3,4);ctx.restore()}
function drawTaxi(px,py,wg,dir){drawCar(px,py,wg,dir,'#f2c94c','#b58a1e');const s=cell,x=px,y=py+s*.4;
  ctx.fillStyle='#20262e';for(let i=0;i<3;i++)ctx.fillRect(x+wg*s*(.15+i*.28),y,5,5)}
function drawLog(px,py,wg){const s=cell,x=px,y=py+s*.24+Math.sin(tAmb*2+x*.05)*1.6,w=wg*s,h=s*.52;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+w/2,y+h+3,w*.48,4,0,0,7);ctx.fill();
  ctx.fillStyle='#7c4f26';rr(x,y,w,h,s*.24);ctx.fill();
  ctx.fillStyle='#a06b35';rr(x+s*.1,y+3,w-s*.2,h*.42,s*.2);ctx.fill();
  ctx.strokeStyle='rgba(60,34,12,.5)';ctx.lineWidth=1.5;
  for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(x+w*i/3,y+2);ctx.lineTo(x+w*i/3,y+h-2);ctx.stroke()}
  ctx.fillStyle='#caa06b';ctx.beginPath();ctx.ellipse(x+w-s*.1,y+h/2,s*.11,h*.4,0,0,7);ctx.fill();
  ctx.strokeStyle='#8a5c2e';ctx.beginPath();ctx.ellipse(x+w-s*.1,y+h/2,s*.06,h*.22,0,0,7);ctx.stroke()}
function drawDuck(px,py,dir){const s=cell,cx=px+s/2,cy=py+s*.5+Math.sin(tAmb*4+px*.08)*1.5;
  ctx.save();ctx.translate(cx,cy);if(dir<0)ctx.scale(-1,1);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,s*.3,s*.3,3,0,0,7);ctx.fill();
  ctx.fillStyle='#f4f8fa';ctx.beginPath();ctx.ellipse(0,0,s*.26,s*.16,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(s*.2,-s*.16,s*.11,0,7);ctx.fill();
  ctx.fillStyle='#ff9d3b';ctx.beginPath();ctx.moveTo(s*.3,-s*.18);ctx.lineTo(s*.44,-s*.13);ctx.lineTo(s*.3,-s*.09);ctx.closePath();ctx.fill();
  ctx.fillStyle='#14212e';ctx.beginPath();ctx.arc(s*.22,-s*.19,1.6,0,7);ctx.fill();
  ctx.fillStyle='rgba(180,205,220,.7)';ctx.beginPath();ctx.ellipse(-s*.08,s*.04,s*.13,s*.06,-.4,0,7);ctx.fill();ctx.restore()}
function drawPike(px,py,dir){const s=cell,cx=px+s/2,cy=py+s*.5;
  ctx.save();ctx.translate(cx,cy);if(dir<0)ctx.scale(-1,1);
  ctx.fillStyle='#f07a2e';ctx.beginPath();ctx.ellipse(0,0,s*.44,s*.15,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.38,0);ctx.lineTo(-s*.56,-s*.16);ctx.lineTo(-s*.5,s*.02);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-s*.1,-s*.12);ctx.lineTo(s*.04,-s*.24);ctx.lineTo(s*.12,-s*.1);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#9c4516';ctx.lineWidth=2;
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*s*.16,0,s*.1,-.9,.9);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.34,-s*.03,2.4,0,7);ctx.fill();
  ctx.fillStyle='#1a0d04';ctx.beginPath();ctx.arc(s*.36,-s*.03,1.2,0,7);ctx.fill();ctx.restore()}

function drawItems(){
  for(const l of lanes){const py=oy+l.row*cell;
    for(const b of l.items){const ix=lanePos(l,b,S.laneT)-MG;if(ix>COLS+1||ix+l.w<-1)continue;
      const px=ox+ix*cell;
      if(l.kind==='car')drawCar(px,py,l.w,l.dir,...CAR_COLS[(l.color*4)|0]);
      else if(l.kind==='truck')drawTruck(px,py,l.w,l.dir);
      else if(l.kind==='taxi')drawTaxi(px,py,l.w,l.dir);
      else if(l.kind==='log')drawLog(px,py,l.w);
      else if(l.kind==='duck')drawDuck(px,py,l.dir);
      else drawPike(px,py,l.dir)}}}

function drawPlayfield(){
  for(let row=0;row<ROWS;row++){const y=oy+row*cell;
    if(row===0||row===8){ctx.fillStyle=row===0?'#16452b':'#123a24';ctx.fillRect(ox,y,COLS*cell,cell);
      for(let c=0;c<COLS;c++)if(c%2){ctx.fillStyle='rgba(255,255,255,.025)';ctx.fillRect(ox+c*cell,y,cell,cell)}}
    else if(row<=4){const cols=['#0e4258','#0c3a4e','#0d4055',S.level<2?'#0c3a4e':'#0b3247'];
      ctx.fillStyle=cols[row-1];ctx.fillRect(ox,y,COLS*cell,cell);
      ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(ox,y+cell-1.5,COLS*cell,1.5)}
    else{ctx.fillStyle='#232933';ctx.fillRect(ox,y,COLS*cell,cell)}}
  // road lines
  ctx.strokeStyle='rgba(223,230,238,.5)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(ox,oy+5*cell+1);ctx.lineTo(ox+COLS*cell,oy+5*cell+1);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,oy+8*cell-1);ctx.lineTo(ox+COLS*cell,oy+8*cell-1);ctx.stroke();
  ctx.strokeStyle='rgba(217,164,65,.8)';ctx.lineWidth=3;ctx.setLineDash([cell*.3,cell*.3]);
  ctx.beginPath();ctx.moveTo(ox,oy+6*cell);ctx.lineTo(ox+COLS*cell,oy+6*cell);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,oy+7*cell);ctx.lineTo(ox+COLS*cell,oy+7*cell);ctx.stroke();
  ctx.setLineDash([]);
  // specks + tufts
  for(const s of specks){ctx.fillStyle=s.w?'rgba(255,255,255,.06)':'rgba(0,0,0,.18)';
    ctx.fillRect(ox+s.x*cell,oy+s.row*cell+s.y*cell*.9+cell*.05,2,2)}
  for(const t of tufts){const x=ox+t.x*cell,y=oy+t.row*cell+cell*(.55+t.o*.3);
    ctx.strokeStyle=t.s<.5?'#2f7a48':'#3c8f57';ctx.lineWidth=1.6;
    for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x+i*3,y+4);ctx.quadraticCurveTo(x+i*4,y-2,x+i*5,y-5);ctx.stroke()}}
  // water shimmer
  ctx.strokeStyle='rgba(191,234,255,.08)';ctx.lineWidth=1.5;
  for(let row=1;row<=4;row++){const y0=oy+row*cell;
    for(let k=0;k<2;k++){ctx.beginPath();
      for(let x=0;x<=COLS*cell;x+=cell*.9){const yy=y0+cell*(.3+.35*k)+Math.sin(x*.045+tAmb*1.6+row*2+k)*2;
        x===0?ctx.moveTo(ox+x,yy):ctx.lineTo(ox+x,yy)}ctx.stroke()}}
  // frame
  ctx.strokeStyle='rgba(3,10,14,.85)';ctx.lineWidth=7;ctx.strokeRect(ox-3,oy-3,COLS*cell+6,ROWS*cell+6);
  ctx.strokeStyle='rgba(125,232,255,.1)';ctx.lineWidth=1.5;ctx.strokeRect(ox-6.5,oy-6.5,COLS*cell+13,ROWS*cell+13)}

function drawPadsRow(){
  const y=oy, s=cell;
  for(const d of decoLilies){const cx=ox+(d.c+.5)*s,cy=y+s*.52;
    ctx.fillStyle='#2e8f52';ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,s*.3,d.r*6,d.r*6+5.1);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(cx-s*.06,cy-s*.07,s*.16,0,7);ctx.fill()}
  for(const p of pads){const shx=p.shake>0?Math.sin(p.shake*34)*p.shake*s*.06:0;
    const cx=ox+(p.col+.5)*s+shx,cy=y+s*.52,r=s*.4;
    if(p.state==='done'){ // bloomed lotus
      for(let i=0;i<8;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(i*Math.PI/4+tAmb*.15);
        ctx.fillStyle=i%2?'#ff9ec7':'#ff7ab8';ctx.beginPath();ctx.ellipse(0,-r*.62,r*.3,r*.55,0,0,7);ctx.fill();ctx.restore()}
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,r*.42,0,7);ctx.fill();
      ctx.fillStyle='#7a1f4d';ctx.font='bold '+Math.round(s*.4)+'px Impact,"Arial Black",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.num,cx,cy+1)}
    else{const isNext=p.num===S.nextNum&&S.state==='play';
      ctx.fillStyle=isNext?'#5b86a8':'#41607a';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,r*.72,0,7);ctx.stroke();
      if(isNext){const pr=r*(1.14+Math.sin(tAmb*5)*.09);
        ctx.save();ctx.shadowColor='#ffd45e';ctx.shadowBlur=14;
        ctx.strokeStyle='#ffd45e';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,pr,0,7);ctx.stroke();ctx.restore()}
      ctx.fillStyle=isNext?'#ffe9a8':'#cfe6f2';ctx.font='bold '+Math.round(s*.4)+'px Impact,"Arial Black",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.num,cx,cy+1)}}}

function drawFrog(){
  const show=(S.state==='play'&&S.phase!=='dying'&&S.phase!=='respawn')||S.state==='menu';
  if(!show)return;
  const s=cell,cx=ox+(frog.x+.5)*s,cy=oy+(frog.y+.5)*s,hop=frog.moving?Math.sin(frog.t*Math.PI):0;
  ctx.save();ctx.translate(cx,cy);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,s*.32,s*.34*(1-hop*.3),s*.1,0,0,7);ctx.fill();
  ctx.translate(0,-hop*s*.22);ctx.scale(1+hop*.18,1-hop*.2);
  const br=1+(frog.moving?0:Math.sin(tAmb*2.4)*.03);ctx.scale(1,br);
  // feet
  ctx.fillStyle='#4aa836';
  for(const fx of[-1,1]){ctx.beginPath();ctx.ellipse(fx*s*.3,s*.24,s*.11,s*.07,fx*.5,0,7);ctx.fill()}
  // body
  ctx.fillStyle='#5fc93f';ctx.beginPath();ctx.ellipse(0,0,s*.35,s*.3,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#b8eaa4';ctx.beginPath();ctx.ellipse(0,s*.09,s*.2,s*.13,0,0,7);ctx.fill();
  ctx.fillStyle='#2f7a1f';
  for(const[dx2,dy2]of[[-s*.16,-s*.05],[s*.14,-s*.08],[0,s*.14]]){ctx.beginPath();ctx.arc(dx2,dy2,s*.035,0,7);ctx.fill()}
  // eyes
  const closed=(tAmb%3.4)<.13;
  for(const ex of[-1,1]){const exx=ex*s*.16+(frog.face*ex>0?frog.face*s*.02:0),eyy=-s*.27;
    ctx.fillStyle='#5fc93f';ctx.beginPath();ctx.arc(exx,eyy,s*.115,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1.2;ctx.stroke();
    if(closed){ctx.strokeStyle='#143a0c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(exx-s*.06,eyy);ctx.lineTo(exx+s*.06,eyy);ctx.stroke()}
    else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(exx,eyy,s*.075,0,7);ctx.fill();
      ctx.fillStyle='#14212e';ctx.beginPath();ctx.arc(exx+frog.face*s*.03,eyy,s*.04,0,7);ctx.fill()}}
  // mouth
  ctx.strokeStyle='rgba(20,58,12,.6)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(frog.face*s*.04,s*.1,s*.09,.3,Math.PI-.3);ctx.stroke();
  ctx.restore()}

function draw(){
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
  // ambient pond rings (behind)
  for(const r of rings){if(!r.px)continue;ctx.strokeStyle='rgba(125,232,255,'+Math.max(0,r.a)+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()}
  ctx.save();
  if(S.shake>0)ctx.translate((Math.random()-.5)*S.shake,(Math.random()-.5)*S.shake);
  drawPlayfield();drawItems();drawPadsRow();drawFrog();
  // in-field rings
  for(const r of rings){if(r.px)continue;const x=ox+(r.x+.5)*cell,y=oy+(r.y+.5)*cell;
    ctx.strokeStyle='rgba(191,234,255,'+Math.max(0,r.a)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,r.r*cell,0,7);ctx.stroke()}
  // particles
  for(const p of parts){const k=1-p.life/p.max;
    if(p.txt){ctx.font='bold '+Math.round(p.sz)+'px Impact,"Arial Black",sans-serif';ctx.textAlign='center';
      ctx.globalAlpha=k;ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1}
    else{ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=k;
      ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,7);ctx.fill();ctx.restore()}}
  ctx.restore();
  // fireflies
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const f of flies){const x=f.bx*Math.min(W,COLS*cell+ox)+Math.sin(tAmb*f.sp+f.ph)*40,
    y=f.by*(H-120)+60+Math.cos(tAmb*f.sp*.8+f.ph)*30,a=.16+.16*Math.sin(tAmb*2+f.ph);
    ctx.fillStyle='rgba(255,235,150,'+a+')';ctx.beginPath();ctx.arc(x,y,f.r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,235,150,'+(a*.3)+')';ctx.beginPath();ctx.arc(x,y,f.r*3,0,7);ctx.fill()}
  ctx.restore();
  if(S.flash>0){ctx.fillStyle='rgba(255,60,40,'+(S.flash*.4)+')';ctx.fillRect(0,0,W,H)}}

const flies=[];for(let i=0;i<13;i++)flies.push({bx:Math.random(),by:Math.random(),ph:Math.random()*7,sp:.2+Math.random()*.5,r:1.2+Math.random()*1.4});

/* ================= boot & loop ================= */
try{S.best=parseInt(localStorage.getItem('hoplogic_best'))||0}catch(e){S.best=0}
genLevel();placeStart();setBodyState();updHUDAll();showMenu();
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  if(!S.paused){tAmb+=dt;update(dt,now);updParts(dt)}draw()}
requestAnimationFrame(frame);
})();
</script>
