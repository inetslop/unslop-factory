<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Pinball</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#05080a}
body{font-family:'Courier New',Courier,monospace;color:#cfe8d2;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:20px;padding:7px 16px;background:linear-gradient(rgba(4,9,6,.92),rgba(4,9,6,.55) 75%,transparent);pointer-events:none;flex-wrap:wrap}
.hb{display:flex;flex-direction:column;line-height:1.05}
.hb label{font-size:9px;letter-spacing:.3em;color:#6f937c;text-transform:uppercase}
.hb span{font-weight:700;font-size:16px;color:#8dff6e;text-shadow:0 0 10px rgba(110,255,120,.45);white-space:nowrap}
#scv{font-size:21px;letter-spacing:.06em}
#comboBox{display:none}
#combov{color:#ffd23d;text-shadow:0 0 10px rgba(255,210,61,.7)}
#meter{width:148px;height:11px;margin-top:3px;border:1px solid rgba(125,255,94,.45);background:rgba(0,0,0,.55);overflow:hidden}
#mfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fbf6b,#d8ff3d)}
#meter.full{box-shadow:0 0 14px rgba(216,255,61,.75);border-color:#d8ff3d}
#meter.full #mfill{animation:mpulse .45s infinite alternate}
@keyframes mpulse{to{filter:brightness(1.8)}}
#ballRow{display:flex;gap:5px;height:14px;align-items:center}
.bali{width:13px;height:13px;border-radius:50%;display:inline-block;background:radial-gradient(circle at 34% 30%,#fff,#b9c6c9 40%,#4a585c 75%,#20282b);box-shadow:0 0 6px rgba(150,255,170,.35)}
.bali.off{filter:grayscale(1) brightness(.28);box-shadow:none}
#ovl{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(3,8,4,.78);text-align:center;padding:16px}
.card{background:rgba(6,13,8,.92);border:1px solid rgba(125,255,94,.28);box-shadow:0 0 70px rgba(0,0,0,.8),inset 0 0 46px rgba(20,60,30,.28);padding:28px 44px;max-width:94vw}
.title{font-family:Impact,'Arial Black','Franklin Gothic Bold',sans-serif;font-size:min(84px,13vw);line-height:.95;color:#b6ff5e;margin:0;letter-spacing:.04em;text-shadow:0 0 22px rgba(120,255,90,.5),0 0 6px rgba(120,255,90,.85),4px 4px 0 #6e1622,7px 7px 0 rgba(0,0,0,.55);transform:rotate(-2deg)}
.title span{display:block;font-size:.48em;color:#e8e4cf;letter-spacing:.44em;text-shadow:3px 3px 0 #6e1622,0 0 14px rgba(232,228,207,.35);margin-top:8px}
.title.red{color:#ff4d5e;text-shadow:0 0 22px rgba(255,60,80,.5),0 0 6px rgba(255,90,100,.85),4px 4px 0 #2a0710,7px 7px 0 rgba(0,0,0,.55)}
.tag{color:#9fd8a8;font-size:12px;letter-spacing:.24em;margin:16px 0 0;text-transform:uppercase}
.drips{display:flex;gap:36px;justify-content:center;height:18px;margin:-4px 0 0;align-items:flex-start}
.drips i{width:7px;background:linear-gradient(#b6ff5e,#4f9b3a);border-radius:0 0 6px 6px;animation:drip 2.6s ease-in-out infinite}
.drips i:nth-child(2){width:5px;animation-delay:.9s}
.drips i:nth-child(3){width:6px;animation-delay:1.7s}
@keyframes drip{0%,100%{height:4px}50%{height:17px}}
.ctl{display:grid;grid-template-columns:auto auto;gap:7px 16px;font-size:13px;color:#9fd8a8;margin:22px auto 0;text-align:left;width:max-content}
.ctl span:nth-child(odd){color:#e8e4cf;text-align:right}
kbd{font-family:inherit;background:#d9d4bd;color:#1c2415;border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;box-shadow:0 2px 0 #6b684f}
.prompt{font-size:17px;letter-spacing:.3em;color:#e8e4cf;animation:blink 1.1s steps(2) infinite;margin-top:22px}
@keyframes blink{50%{opacity:.12}}
.hint{color:#5f7d68;font-size:11px;margin-top:12px;letter-spacing:.08em;line-height:1.7}
.bignum{font-family:Impact,'Arial Black',sans-serif;font-size:54px;color:#b6ff5e;text-shadow:0 0 20px rgba(120,255,90,.5);margin:12px 0 2px;letter-spacing:.06em}
.newbest{color:#ffd23d;font-weight:700;letter-spacing:.24em;font-size:15px;text-shadow:0 0 12px rgba(255,210,61,.6);animation:blink .8s steps(2) infinite}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="hb"><label>Score</label><span id="scv">0000000</span></div>
  <div class="hb"><label>High</label><span id="hisv">0000000</span></div>
  <div class="hb" id="comboBox"><label>Combo</label><span id="combov">x2</span></div>
  <div class="hb"><label>Brain Power</label><div id="meter"><i id="mfill"></i></div></div>
  <div class="hb"><label>Balls</label><span id="ballRow"><i class="bali"></i><i class="bali"></i><i class="bali"></i></span></div>
</div>
<div id="ovl"></div>
<script>
(()=>{ 'use strict';
/* ---------- helpers ---------- */
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t;
const pad=n=>String(Math.floor(n)).padStart(7,'0');

/* ---------- canvas fit ---------- */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=520,H=780,BR=9,GRAV=1450,MAXV=2100,PH=1/240;
let dpr=1,cw=0,ch=0,sc=1,ox=0,oy=0;
function resize(){dpr=Math.min(2.5,window.devicePixelRatio||1);cw=innerWidth;ch=innerHeight;cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);const ah=ch-52;sc=Math.min(cw/W,ah/H)*0.985;ox=(cw-W*sc)/2;oy=52+Math.max(0,(ah-H*sc)/2);}
addEventListener('resize',resize);resize();

/* ---------- audio (Web Audio, starts after first input) ---------- */
let AC=null,master=null,noiseBuf=null;
function audio(){if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.gain.value=.42;master.connect(AC.destination);noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}if(AC.state==='suspended')AC.resume();}
function tone(f,dur,type='square',vol=.3,f2=null,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,f),t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0012,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}
function noise(dur,vol,f0=800,f1=null,delay=0){if(!AC)return;const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);f.Q.value=.8;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0012,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.03);}
const S={
 flip(){tone(95,.07,'sine',.5,60);},
 bump(i){const f=[240,300,360][i%3];tone(f,.08,'square',.3,f*.6);noise(.05,.12,1500);},
 sling(){tone(500,.05,'triangle',.3,760);},
 brain(){tone(640,.09,'sine',.3,980);tone(980,.12,'sine',.2,1400,.06);},
 bonk(){tone(130,.1,'square',.4,70);},
 launch(p){noise(.3,.5,300,1800+p*1200);tone(110,.22,'sawtooth',.22,55);},
 tick(c){tone(180+c*520,.03,'square',.1);},
 drain(){tone(300,.5,'sawtooth',.35,50);noise(.4,.25,400,90);},
 storm(){noise(.7,.6,180,1400);tone(55,.55,'sine',.6,38);[523,659,784,1046].forEach((f,i)=>tone(f,.13,'square',.24,null,.08+i*.07));},
 over(){[392,311,262,196].forEach((f,i)=>tone(f,.2,'triangle',.3,null,.15*i));},
 start(){[262,330,392,523].forEach((f,i)=>tone(f,.1,'square',.22,null,.07*i));},
 nudge(){noise(.04,.25,700,300);tone(80,.05,'sine',.3);}
};

/* ---------- table geometry ---------- */
function seg(x1,y1,x2,y2,e=.35,kick=0){return{x1,y1,x2,y2,e,kick,_vn:0};}
const walls=[
 seg(12,748,12,190),
 seg(12,190,14,132),seg(14,132,36,76),seg(36,76,82,34),seg(82,34,152,12),
 seg(152,12,368,12),
 seg(368,12,438,34),seg(438,34,484,76),seg(484,76,506,132),seg(506,132,508,190),
 seg(508,190,508,752),seg(508,752,464,752),
 seg(464,752,464,214),
 seg(464,214,458,176),seg(458,176,442,146),seg(442,146,410,128),
 seg(464,730,372,719),seg(372,719,330,705),
 seg(12,748,152,723),seg(152,723,188,709)
];
const slings=[
 {pts:[[128,590],[190,672],[128,672]],flash:0,cool:0},
 {pts:[[392,590],[330,672],[392,672]],flash:0,cool:0}
];
slings.forEach(sl=>{const[a,b,c]=sl.pts;sl.face=seg(b[0],b[1],a[0],a[1],.85,520);sl.edges=[sl.face,seg(b[0],b[1],c[0],c[1]),seg(c[0],c[1],a[0],a[1])];});
const heads=[{x:168,y:232,r:26,f:0},{x:322,y:232,r:26,f:0},{x:245,y:332,r:24,f:0}];
const minis=[{x:95,y:392,r:15,f:0},{x:398,y:392,r:15,f:0}];
let brains=[];
function resetBrains(){brains=[170,230,290].map((x,i)=>({x,y:462,r:13,alive:true,scale:0,popT:-1,idx:i}));}
const walkers=[];
function mkWalker(y,x0,x1,sp){return{x:x0,y,vx:sp,x0,x1,r:16,f:0,alive:true,respawn:0,ph:rnd(TAU)};}
function resetWalkers(){walkers.length=0;walkers.push(mkWalker(512,110,410,52));walkers.push(mkWalker(565,415,238,-40));}
resetBrains();resetWalkers();

const FL={L:62,wid:8,om:17};
const flips=[{px:192,py:704,a:.52,om:0,side:-1,pressed:false},{px:328,py:704,a:Math.PI-.52,om:0,side:1,pressed:false}];
function flipTarget(f,pressed){return f.side<0?(pressed?-.52:.52):(pressed?Math.PI+.52:Math.PI-.52);}

/* chase lights along top arc */
const lightPts=[];(function(){const src=[[12,190],[14,132],[36,76],[82,34],[152,12],[368,12],[438,34],[484,76],[506,132],[508,190]];let total=0;const cum=[0];for(let i=1;i<src.length;i++){total+=Math.hypot(src[i][0]-src[i-1][0],src[i][1]-src[i-1][1]);cum.push(total);}for(let i=0;i<15;i++){const d=total*i/14;let j=1;while(j<cum.length&&cum[j]<d)j++;const t=(d-cum[j-1])/((cum[j]-cum[j-1])||1);lightPts.push([lerp(src[j-1][0],src[j][0],t),lerp(src[j-1][1],src[j][1],t)]);}})();

/* ---------- state ---------- */
const ball={x:486,y:741,vx:0,vy:0};
let trail=[],state='start',prevState='play';
let score=0,balls=3,power=0,combo=0,comboT=0,hiscore=0,newBest=false;
try{hiscore=+localStorage.getItem('zombiePinballHi')||0;}catch(e){}
let charge=0,charging=false,chargeTick=0,drainT=0,bankT=0,lowT=0,nudgeCd=0,acc=0,tGlob=0;
let shake=0,shx=0,shy=0,stormFlash=0,stormLit=false;
let parts=[],pops=[],msgs=[];
const fog=[];for(let i=0;i<6;i++)fog.push({x:rnd(W),y:rnd(120,700),r:rnd(90,180),a:rnd(.04,.1),s:rnd(6,18)*(i%2?1:-1)});
let bats=[],batT=rnd(2,5);

/* ---------- HUD ---------- */
const scv=document.getElementById('scv'),hisv=document.getElementById('hisv'),mfill=document.getElementById('mfill'),meterEl=document.getElementById('meter'),ballRow=document.getElementById('ballRow'),comboBox=document.getElementById('comboBox'),combov=document.getElementById('combov'),ovlEl=document.getElementById('ovl');
let lastScore=-1,lastHi=-1,lastBalls=-1,lastPow=-1,lastCombo=-2;
function syncHUD(force){
 if(force||score!==lastScore){scv.textContent=pad(score);lastScore=score;}
 const hi=Math.max(hiscore,score);
 if(force||hi!==lastHi){hisv.textContent=pad(hi);lastHi=hi;}
 if(force||balls!==lastBalls){const ic=ballRow.children;for(let i=0;i<3;i++)ic[i].classList.toggle('off',i>=balls);lastBalls=balls;}
 if(force||Math.round(power)!==lastPow){mfill.style.width=power+'%';meterEl.classList.toggle('full',power>=100);lastPow=Math.round(power);}
 const c=(combo>=2&&comboT>0)?combo:-1;
 if(c!==lastCombo){comboBox.style.display=c<0?'none':'flex';if(c>0)combov.textContent='x'+c;lastCombo=c;}
}

/* ---------- overlays ---------- */
function showOvl(html){ovlEl.innerHTML=html;ovlEl.style.display='flex';}
function hideOvl(){ovlEl.style.display='none';}
const startHTML=()=>`<div class="card">
 <h1 class="title">ZOMBIE<span>PINBALL</span></h1>
 <div class="drips"><i></i><i></i><i></i></div>
 <p class="tag">the graveyard is back for more brains</p>
 <div class="ctl">
  <span><kbd>&larr;</kbd>/<kbd>A</kbd></span><span>left flipper</span>
  <span><kbd>&rarr;</kbd>/<kbd>D</kbd></span><span>right flipper</span>
  <span><kbd>SPACE</kbd> hold</span><span>charge &amp; launch</span>
  <span><kbd>N</kbd>/<kbd>ENTER</kbd></span><span>nudge the table</span>
  <span><kbd>P</kbd></span><span>pause</span>
  <span><kbd>R</kbd></span><span>restart anytime</span>
 </div>
 <p class="prompt">PRESS SPACE TO START</p>
 <p class="hint">fill the BRAIN POWER meter, then smash a zombie head for a storm<br>touch: tap left / right halves to flip &middot; hold the lane to launch</p>
</div>`;
const overHTML=()=>`<div class="card">
 <h1 class="title red">GAME OVER</h1>
 <p class="tag">the brains got away&hellip;</p>
 <div class="bignum">${pad(score)}</div>
 ${newBest?'<p class="newbest">&#9733; NEW HIGH SCORE &#9733;</p>':'<p class="tag" style="margin-top:4px">high '+pad(hiscore)+'</p>'}
 <p class="prompt">PRESS SPACE TO RISE AGAIN</p>
</div>`;
const pauseHTML=()=>`<div class="card"><h1 class="title" style="font-size:min(56px,9vw)">PAUSED<span>the dead wait for no one</span></h1><p class="prompt">PRESS P TO RESUME</p></div>`;

/* ---------- game flow ---------- */
function setBallInLane(){ball.x=486;ball.y=741;ball.vx=0;ball.vy=0;trail.length=0;}
function startGame(){score=0;balls=3;power=0;combo=0;comboT=0;newBest=false;charging=false;charge=0;bankT=0;stormLit=false;acc=0;parts.length=0;pops.length=0;msgs.length=0;resetBrains();resetWalkers();heads.forEach(h=>h.f=0);minis.forEach(m=>m.f=0);setBallInLane();state='plunge';hideOvl();syncHUD(true);S.start();}
function togglePause(){if(state==='play'||state==='plunge'){prevState=state;state='pause';showOvl(pauseHTML());}else if(state==='pause'){state=prevState;hideOvl();}}
function doNudge(){if(state!=='play'||nudgeCd>0)return;nudgeCd=.3;ball.vy-=rnd(200,300);ball.vx+=rnd(-60,60);shake=Math.max(shake,5);S.nudge();}
function launch(){const p=charge;ball.vy=-(950+800*p);ball.vx=rnd(-20,20);state='play';acc=0;charging=false;charge=0;S.launch(p);shake=Math.max(shake,3+p*4);}
function doDrain(){if(state!=='play')return;state='drain';drainT=1.3;S.drain();shake=Math.max(shake,8);combo=0;addPop(W/2,H-90,'BALL LOST','#ff4d5e',26);}
function nextBall(){balls--;syncHUD(true);if(balls>0){setBallInLane();state='plunge';acc=0;charging=false;charge=0;const n=4-balls;msgs.push({text:n>=3?'LAST BALL':'BALL '+n,t:0,dur:1.6,col:n>=3?'#ff4d5e':'#8dff6e'});}else{state='over';if(score>hiscore){hiscore=score;newBest=true;try{localStorage.setItem('zombiePinballHi',String(hiscore));}catch(e){}}showOvl(overHTML());S.over();}}

/* ---------- scoring ---------- */
function bumpCombo(){combo=(comboT>0)?Math.min(8,combo+1):1;comboT=2.5;}
function addScore(base,x,y,col,big){const mul=Math.max(1,combo);score+=base*mul;addPop(x,y,'+'+(base*mul),col,big?15:11);return base*mul;}
function addPower(n){if(stormLit)return;power=clamp(power+n,0,100);if(power>=100){stormLit=true;S.brain();addMsg('BRAIN POWER FULL — SMASH A ZOMBIE HEAD!');}}
function addPop(x,y,text,col,size){pops.push({x,y,text,col,size,t:0});if(pops.length>40)pops.shift();}
function addMsg(text){msgs.push({text,t:0,dur:2.3,col:'#d8ff3d'});}
function doStorm(){score+=5000;addPop(W/2,300,'BRAIN STORM! +5000','#d8ff3d',24);walkers.forEach(w=>{if(w.alive){w.alive=false;w.respawn=6;score+=1000;goo(w.x,w.y,26,'#7dff5e');addPop(w.x,w.y,'+1000','#ff4d5e',14);}});brains.forEach((b,i)=>{if(b.alive)b.popT=.15*i+.1;});power=0;stormLit=false;stormFlash=1;shake=16;S.storm();syncHUD(true);}

/* ---------- particles ---------- */
function goo(x,y,n,col){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-260,260),vy:rnd(-340,60),g:900,life:rnd(.4,.95),max:.95,size:rnd(1.5,4),col});if(parts.length>240)parts.splice(0,parts.length-240);}
function sparks(x,y,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-320,320),vy:rnd(-320,120),g:600,life:rnd(.15,.4),max:.4,size:rnd(1,2.4),col:'#ffd23d'});if(parts.length>240)parts.splice(0,parts.length-240);}

/* ---------- physics ---------- */
function updFlips(dt){for(const f of flips){const t=flipTarget(f,f.pressed),d=t-f.a,st=FL.om*dt;if(Math.abs(d)<=st){f.om=(t-f.a)/dt;f.a=t;}else{f.om=Math.sign(d)*FL.om;f.a+=Math.sign(d)*st;}}}
function hitSeg(s){const dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy;let t=((ball.x-s.x1)*dx+(ball.y-s.y1)*dy)/L2;t=t<0?0:t>1?1:t;const cx=s.x1+t*dx,cy=s.y1+t*dy;let nx=ball.x-cx,ny=ball.y-cy;const d2=nx*nx+ny*ny;if(d2>=BR*BR||d2<1e-9)return false;const d=Math.sqrt(d2);nx/=d;ny/=d;ball.x=cx+nx*BR;ball.y=cy+ny*BR;const vn=ball.vx*nx+ball.vy*ny;s._vn=vn;if(vn<0){const j=(1+s.e)*vn;ball.vx-=j*nx;ball.vy-=j*ny;}if(s.kick&&vn<-60){const vn2=ball.vx*nx+ball.vy*ny;if(vn2<s.kick){ball.vx+=nx*(s.kick-vn2);ball.vy+=ny*(s.kick-vn2);}}return vn<0;}
function circ(x,y,R){let nx=ball.x-x,ny=ball.y-y;const d2=nx*nx+ny*ny;if(d2>=R*R||d2<1e-9)return null;const d=Math.sqrt(d2);nx/=d;ny/=d;ball.x=x+nx*R;ball.y=y+ny*R;return{nx,ny,vn:ball.vx*nx+ball.vy*ny};}
function bumperHit(b,c,big,idx){if(c.vn<0){const j=1.35*c.vn;ball.vx-=j*c.nx;ball.vy-=j*c.ny;}if(-c.vn>120){const K=big?640:520,vn2=ball.vx*c.nx+ball.vy*c.ny;if(vn2<K){ball.vx+=c.nx*(K-vn2);ball.vy+=c.ny*(K-vn2);}}if(-c.vn>60){b.f=1;S.bump(idx);shake=Math.max(shake,big?3:1.6);goo(ball.x,ball.y,big?8:4,'#7dff5e');bumpCombo();addScore(big?100:50,ball.x,ball.y-b.r-8,big?'#8dff6e':'#a5e88a',big);addPower(big?9:6);if(big&&stormLit)doStorm();}}
function dropBrain(b){b.alive=false;goo(b.x,b.y,14,'#ff8fb0');S.brain();bumpCombo();addScore(500,b.x,b.y-20,'#ff8fb0',true);addPower(12);if(!brains.some(x=>x.alive)){score+=3000;addPop(230,430,'BRAIN FEAST +3000','#ff8fb0',16);bankT=2.5;syncHUD();}}

 brains.forEach(b=>{if(!b.alive&&b.popT>0){b.popT-=dt;if(b.popT<=0)dropBrain(b);}else if(b.alive&&b.scale<1)b.scale=Math.min(1,b.scale+dt*3);});

 g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#cfd8da');g.addColorStop(.72,'#78909c');g.addColorStop(1,'#263238');
 ctx.beginPath();ctx.arc(x,y,BR,0,TAU);ctx.fillStyle=g;ctx.fill();
 ctx.beginPath();ctx.arc(x-3.5,y-4.5,2,0,TAU);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();
 ctx.strokeStyle='rgba(125,255,94,.35)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,BR-.7,0,TAU);ctx.stroke();}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 let g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#070b0d');g.addColorStop(.55,'#0a120c');g.addColorStop(1,'#04070a');ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
 ctx.translate(ox+shx,oy+shy);ctx.scale(sc,sc);
 drawField();drawWalls();drawLights();
 // brain rack panel
 ctx.fillStyle='rgba(0,0,0,.28)';ctx.strokeStyle='rgba(125,255,94,.22)';ctx.lineWidth=1.5;
 ctx.fillRect(140,436,180,52);ctx.strokeRect(140,436,180,52);
 slings.forEach(drawSling);
 brains.forEach(drawBrain);
 heads.forEach(zhead);minis.forEach((m,i)=>zhead(m,i+3));
 walkers.forEach(drawWalker);
 drawPlunger();drawGauge();
 flips.forEach(drawFlip);
 drawBall();
 // particles
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;
 // score pops
 ctx.textAlign='center';
 for(const p of pops){const a=1-p.t/.95,y=p.y-34*p.t;ctx.globalAlpha=a;ctx.font='700 '+p.size+'px "Courier New",monospace';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(p.text,p.x,y);ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,y);}
 ctx.globalAlpha=1;
 // big msgs
 for(const m of msgs){const a=m.t<.2?m.t/.2:(m.dur-m.t<.3?(m.dur-m.t)/.3:1);ctx.globalAlpha=a;ctx.font='900 30px Impact,"Arial Black",sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(m.text,W/2,240);ctx.fillStyle=m.col;ctx.fillText(m.text,W/2,240);}
 ctx.globalAlpha=1;
 // frame + corner skulls
 ctx.strokeStyle='#1a2b1e';ctx.lineWidth=8;ctx.strokeRect(2,2,W-4,H-4);
 ctx.strokeStyle='rgba(125,255,94,.14)';ctx.lineWidth=1.5;ctx.strokeRect(7,7,W-14,H-14);
 [[8,8],[W-8,8],[8,H-8],[W-8,H-8]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],6,0,TAU);ctx.fillStyle='#cfc9a8';ctx.fill();ctx.fillStyle='#241f14';ctx.beginPath();ctx.arc(p[0]-2.2,p[1]-1,1.5,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(p[0]+2.2,p[1]-1,1.5,0,TAU);ctx.fill();});
 // vignette
 const vg=ctx.createRadialGradient(W/2,H*.45,H*.3,W/2,H*.5,H*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 if(stormFlash>0){ctx.fillStyle='rgba(210,255,170,'+stormFlash*.5+')';ctx.fillRect(0,0,W,H);}
}

/* ---------- main loop ---------- */
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;tick(dt);render();requestAnimationFrame(frame);}
showOvl(startHTML());syncHUD(true);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
