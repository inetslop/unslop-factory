<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Surge Pinball</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04060f;font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:pointer}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:18px;background:radial-gradient(ellipse at 50% 38%,rgba(22,30,68,.55),rgba(3,5,12,.93) 72%);backdrop-filter:blur(3px)}
.ov.hidden{display:none}
.ttl{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(46px,10vw,88px);letter-spacing:.05em;line-height:1;color:#eafcff;animation:flick 3.2s infinite;text-shadow:0 0 6px #7ff3ff,0 0 18px #29e6ff,0 0 44px #29e6ff,3px 3px 0 rgba(255,61,129,.5)}
.ttl.pink{color:#ffeaf3;text-shadow:0 0 6px #ff9ec4,0 0 18px #ff3d81,0 0 46px #ff3d81,-3px 3px 0 rgba(41,230,255,.5)}
@keyframes flick{0%,86%,92%,100%{opacity:1}88%,90%{opacity:.5}}
.sub{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(14px,2.6vw,22px);letter-spacing:.8em;padding-left:.8em;color:#ffd23f;text-shadow:0 0 12px rgba(255,210,63,.8)}
.panel{border:1px solid #33407c;background:rgba(9,13,30,.82);padding:14px 26px;border-radius:12px;box-shadow:0 0 24px rgba(41,230,255,.14),inset 0 0 30px rgba(41,230,255,.05);color:#aebadd;font-size:14px;line-height:2.15;min-width:min(430px,88vw)}
.row{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
kbd{font-family:Consolas,Menlo,monospace;font-weight:700;font-size:12px;color:#dff3ff;background:#151d40;border:1px solid #3b4a8c;border-bottom-width:3px;border-radius:6px;padding:2px 9px;min-width:26px;display:inline-block}
.hs{color:#7f8ac0;font-size:13px;letter-spacing:.25em}
.hs b{color:#ffd23f;font-size:17px;letter-spacing:.1em;text-shadow:0 0 10px rgba(255,210,63,.6)}
.btn{font-family:Impact,'Arial Black',sans-serif;font-size:20px;letter-spacing:.18em;color:#04121a;background:linear-gradient(180deg,#7ff3ff,#29e6ff 55%,#18b7d8);border:none;border-radius:10px;padding:14px 34px;cursor:pointer;box-shadow:0 0 22px rgba(41,230,255,.55),0 4px 0 #0e6f8a;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 36px rgba(41,230,255,.9),0 6px 0 #0e6f8a}
.btn:active{transform:translateY(1px)}
.blink{color:#9fb4e8;font-size:13px;letter-spacing:.3em;animation:bl 1.2s steps(2,end) infinite}
@keyframes bl{50%{opacity:.15}}
.final{font-size:15px;color:#aebadd;letter-spacing:.2em}
.final b{display:block;font-family:Consolas,Menlo,monospace;font-size:46px;color:#ffd23f;text-shadow:0 0 16px rgba(255,210,63,.7);margin-top:6px;letter-spacing:.05em}
.newhs{color:#ff3d81;font-family:Impact,'Arial Black',sans-serif;font-size:20px;letter-spacing:.2em;text-shadow:0 0 14px #ff3d81;animation:bl .8s steps(2,end) infinite}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ov" id="startOv">
  <div>
    <div class="ttl">NEON SURGE</div>
    <div class="sub">PINBALL</div>
  </div>
  <div class="panel">
    <div class="row"><kbd>&larr;</kbd><kbd>A</kbd><span>left flipper</span></div>
    <div class="row"><kbd>&rarr;</kbd><kbd>L</kbd><span>right flipper</span></div>
    <div class="row"><kbd>SPACE</kbd><span>hold to charge plunger &middot; release to launch</span></div>
    <div class="row"><kbd>R</kbd><span>restart</span><span style="opacity:.55">&middot; touch: tap sides, hold the lane</span></div>
  </div>
  <div class="hs">HIGH SCORE&nbsp;&nbsp;<b id="startHigh">0</b></div>
  <button class="btn" type="button" id="startBtn">INSERT COIN</button>
  <div class="blink">PRESS SPACE TO START</div>
</div>

<div class="ov hidden" id="overOv">
  <div class="ttl pink">GAME OVER</div>
  <div class="final">FINAL SCORE<b id="finalScore">0</b></div>
  <div class="newhs" id="newHs" style="display:none">&#9733; NEW HIGH SCORE &#9733;</div>
  <button class="btn" type="button" id="againBtn">PLAY AGAIN</button>
  <div class="blink">PRESS SPACE OR R</div>
</div>

<script>
(function(){
'use strict';
/* ============================== SETUP ============================== */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=480,H=800,dpr=1,scale=1,offX=0,offY=0;
function resize(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=Math.max(1,Math.floor(innerWidth*dpr)); cv.height=Math.max(1,Math.floor(innerHeight*dpr)); }
addEventListener('resize',resize); resize();

var TAU=Math.PI*2;
function rr(c,x,y,w,h,r){ c.beginPath(); if(c.roundRect){c.roundRect(x,y,w,h,r);return;} r=Math.min(r,w/2,h/2); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* ============================== AUDIO ============================== */
var AC=null,master=null;
function initAudio(){ try{ if(!AC){ var A=window.AudioContext||window.webkitAudioContext; if(!A)return; AC=new A(); master=AC.createGain(); master.gain.value=.3; master.connect(AC.destination); } if(AC.state==='suspended')AC.resume(); }catch(e){} }
function tone(f0,f1,dur,type,vol,delay){ if(!AC)return; try{ var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(Math.max(1,f0),t); if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);}catch(e){} }
function noise(dur,vol,freq,q,delay){ if(!AC)return; try{ var t=AC.currentTime+(delay||0),n=Math.max(1,Math.floor(AC.sampleRate*dur)),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0); for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n); var s=AC.createBufferSource(); s.buffer=buf; var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1; var g=AC.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(master); s.start(t);}catch(e){} }
var S={
  bumper:function(){ tone(170+Math.random()*90,60,.09,'square',.5); noise(.05,.22,2400,1); },
  sling:function(){ tone(120,58,.08,'triangle',.5); noise(.04,.18,900,1); },
  flip:function(){ noise(.03,.3,3200,2); },
  target:function(){ tone(1250,1750,.18,'sine',.32); tone(620,900,.12,'square',.14); },
  roll:function(){ tone(640,640,.07,'sine',.22); },
  bonus:function(){ var a=[523,659,784,1047]; for(var i=0;i<4;i++)tone(a[i],a[i],.14,'square',.28,i*.08); },
  launch:function(p){ noise(.22,.28,700,.8); tone(90,260+340*p,.28,'sawtooth',.22); },
  drain:function(){ tone(300,60,.6,'sine',.4); },
  over:function(){ var a=[196,155,110]; for(var i=0;i<3;i++)tone(a[i],a[i]*.88,.5,'triangle',.28,i*.25); },
  start:function(){ tone(440,880,.18,'square',.28); }
};

/* ============================== GEOMETRY ============================== */
var G=760,BR=9;
var segs=[
  {a:[24,214], b:[24,780], e:.35},        // left wall (gutter drains)
  {a:[456,214],b:[456,792],e:.35},        // plunger lane right wall
  {a:[104,134],b:[376,134],e:.35},        // top
  {a:[430,222],b:[430,780],e:.35},        // divider (lane / field)
  {a:[92,628], b:[152,704],e:.3,w:4},     // left inlane guide
  {a:[388,628],b:[328,704],e:.3,w:4},     // right inlane guide
  {a:[432,762],b:[454,762],e:0,w:1}       // plunger floor
];
var arcs=[{c:[104,214],r:80,e:.35},{c:[376,214],r:80,e:.35}];
var GN={x:.475,y:.882}; // gate normal (into lane)
var bumpers=[{x:150,y:332,r:24,flash:0,rot:Math.random()*6},{x:240,y:276,r:24,flash:0,rot:Math.random()*6},{x:330,y:332,r:24,flash:0,rot:Math.random()*6}];
var slings=[{a:[94,540],b:[148,624],n:[.842,-.541],flash:0,last:-9},{a:[386,540],b:[332,624],n:[-.842,-.541],flash:0,last:-9}];
var rolls=[{x:170,y:186,lit:false,anim:0},{x:240,y:172,lit:false,anim:0},{x:310,y:186,lit:false,anim:0}];
var flippers=[
  {px:152,py:706,len:64,r:8,ang:.56,rest:.56,up:-.64,om:0,snd:-9},
  {px:328,py:706,len:64,r:8,ang:Math.PI-.56,rest:Math.PI-.56,up:Math.PI+.64,om:0,snd:-9}
];
var targets=[];
function resetTargets(){ targets.length=0; for(var i=0;i<5;i++){ var x=158+i*41, y=214+Math.abs(x-240)/82*26; targets.push({x:x,y:y,up:true,dropT:0}); } }
resetTargets();

/* ============================== STATE ============================== */
var ball={x:443,y:748,vx:0,vy:0};
var state='start', t=0;
var score=0, high=0, wasHigh=0, balls=3, mult=1;
var power=0, prevChg=false, plungerAnim=0;
var lostT=0, rollResetAt=0, rollArmed=false, stuckT=0;
var shake=0, flashBig=0;
var trail=[], parts=[], pops=[];
try{ high=parseInt(localStorage.getItem('neonSurgePinballHigh'),10)||0; }catch(e){}
function saveHigh(){ try{ localStorage.setItem('neonSurgePinballHigh',String(high)); }catch(e){} }

var startOv=document.getElementById('startOv'), overOv=document.getElementById('overOv');
document.getElementById('startHigh').textContent=high.toLocaleString('en-US');

function newBall(){ ball.x=443; ball.y=748; ball.vx=0; ball.vy=0; trail.length=0; }
function inPocket(){ return state==='play'&&ball.x>431&&ball.y>690; }
function startGame(){
  score=0; balls=3; mult=1; power=0; prevChg=false; stuckT=0; rollArmed=false; rollResetAt=0;
  wasHigh=high;
  resetTargets(); for(var i=0;i<rolls.length;i++){rolls[i].lit=false;rolls[i].anim=0;}
  newBall(); state='play';
  startOv.classList.add('hidden'); overOv.classList.add('hidden');
  S.start();
}

/* ============================== INPUT ============================== */
var keyL=false,keyR=false,keySpace=false,ptrs=new Map(),prevLeft=false,prevRight=false;
function heldL(){ return keyL||hasPtr('L'); }
function heldR(){ return keyR||hasPtr('R'); }
function hasPtr(r){ var c=0; ptrs.forEach(function(v){ if(v===r)c++; }); return c>0; }

addEventListener('keydown',function(e){
  initAudio();
  if(e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
  switch(e.code){
    case 'ArrowLeft': case 'KeyA': keyL=true; break;
    case 'ArrowRight': case 'KeyL': keyR=true; break;
    case 'Space': case 'Enter':
      if(state==='start'||state==='over')startGame(); else keySpace=true; break;
    case 'KeyR': startGame(); break;
  }
});
addEventListener('keyup',function(e){
  switch(e.code){
    case 'ArrowLeft': case 'KeyA': keyL=false; break;
    case 'ArrowRight': case 'KeyL': keyR=false; break;
    case 'Space': case 'Enter': keySpace=false; break;
  }
});
addEventListener('blur',function(){ keyL=keyR=keySpace=false; ptrs.clear(); });

function toScene(e){ var r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-offX)/scale, y:(e.clientY-r.top-offY)/scale}; }
cv.addEventListener('pointerdown',function(e){
  initAudio();
  if(state==='start'||state==='over'){ startGame(); return; }
  var p=toScene(e), role;
  if(p.x>420&&p.y>560)role='P'; else if(p.x<W/2)role='L'; else role='R';
  ptrs.set(e.pointerId,role);
});
function ptrEnd(e){ ptrs.delete(e.pointerId); }
cv.addEventListener('pointerup',ptrEnd);
cv.addEventListener('pointercancel',ptrEnd);

startOv.addEventListener('pointerdown',function(){ initAudio(); startGame(); });
overOv.addEventListener('pointerdown',function(){ initAudio(); startGame(); });
document.getElementById('startBtn').addEventListener('click',function(){ initAudio(); startGame(); });
document.getElementById('againBtn').addEventListener('click',function(){ initAudio(); startGame(); });

/* ============================== EFFECTS ============================== */
function addScore(n,x,y,txt,c){ score+=n; if(score>high)high=score; pops.push({x:clamp(x,40,440),y:y,txt:txt||('+'+n),c:c||'#ffd23f',t:0,big:false}); }
function burst(x,y,c,n,sp){ for(var i=0;i<n;i++){ var a=Math.random()*TAU,v=sp*(.3+Math.random()*.7); var l=.45+Math.random()*.4; parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:l,ml:l,c:c,r:1.4+Math.random()*2}); } if(parts.length>240)parts.splice(0,parts.length-240); }

/* ============================== PHYSICS ============================== */
function colSeg(s){
  var ax=s.a[0],ay=s.a[1],dx=s.b[0]-ax,dy=s.b[1]-ay,L2=dx*dx+dy*dy;
  var u=((ball.x-ax)*dx+(ball.y-ay)*dy)/L2; u=u<0?0:u>1?1:u;
  var cx=ax+dx*u,cy=ay+dy*u,nx=ball.x-cx,ny=ball.y-cy,d2=nx*nx+ny*ny,R=BR+(s.w||3);
  if(d2<R*R){ var d=Math.sqrt(d2)||.001; nx/=d; ny/=d; ball.x=cx+nx*R; ball.y=cy+ny*R;
    var vn=ball.vx*nx+ball.vy*ny;
    if(vn<0){ var e=(s.e==null?.35:s.e); ball.vx-=(1+e)*vn*nx; ball.vy-=(1+e)*vn*ny; ball.vx*=.999; ball.vy*=.999; } }
}
function colArc(a){
  var nx=ball.x-a.c[0],ny=ball.y-a.c[1],d=Math.sqrt(nx*nx+ny*ny),R=a.r-BR;
  if(d>R){ nx/=d; ny/=d; ball.x=a.c[0]+nx*R; ball.y=a.c[1]+ny*R;
    var vn=ball.vx*nx+ball.vy*ny;
    if(vn>0){ ball.vx-=(1+a.e)*vn*nx; ball.vy-=(1+a.e)*vn*ny; } }
}
function colGate(){
  var ax=404,ay=170,dx=28,dy=52,L2=dx*dx+dy*dy;
  var u=((ball.x-ax)*dx+(ball.y-ay)*dy)/L2; u=u<0?0:u>1?1:u;
  var cx=ax+dx*u,cy=ay+dy*u,nx=ball.x-cx,ny=ball.y-cy,d2=nx*nx+ny*ny,R=BR+4;
  if(d2<R*R){ var d=Math.sqrt(d2)||.001; nx/=d; ny/=d;
    if(ball.vx*GN.x+ball.vy*GN.y>0.05){ ball.x=cx+nx*R; ball.y=cy+ny*R;
      var vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ ball.vx-=1.3*vn*nx; ball.vy-=1.3*vn*ny; } } }
}
function colBumper(b){
  var nx=ball.x-b.x,ny=ball.y-b.y,R=b.r+BR,d2=nx*nx+ny*ny;
  if(d2<R*R){ var d=Math.sqrt(d2)||.001; nx/=d; ny/=d; ball.x=b.x+nx*R; ball.y=b.y+ny*R;
    var vn=ball.vx*nx+ball.vy*ny;
    ball.vx+=(470-vn)*nx; ball.vy+=(470-vn)*ny;
    b.flash=1; addScore(100*mult,b.x,b.y-b.r-8); S.bumper(); shake=Math.min(8,shake+1.6); burst(ball.x,ball.y,'#29e6ff',12,300); }
}
function colSling(s){
  var ax=s.a[0],ay=s.a[1],dx=s.b[0]-ax,dy=s.b[1]-ay,L2=dx*dx+dy*dy;
  var u=((ball.x-ax)*dx+(ball.y-ay)*dy)/L2; u=u<0?0:u>1?1:u;
  var cx=ax+dx*u,cy=ay+dy*u,nx=ball.x-cx,ny=ball.y-cy,d2=nx*nx+ny*ny,R=BR+4;
  if(d2<R*R){ var d=Math.sqrt(d2)||.001; nx/=d; ny/=d; ball.x=cx+nx*R; ball.y=cy+ny*R;
    var vn=ball.vx*nx+ball.vy*ny;
    if(vn<0){ var imp=-vn; ball.vx-=1.45*vn*nx; ball.vy-=1.45*vn*ny;
      if(imp>140&&t-s.last>.07){ var vn2=ball.vx*nx+ball.vy*ny; ball.vx+=(430-vn2)*nx; ball.vy+=(430-vn2)*ny;
        s.flash=1; s.last=t; addScore(50*mult,cx,cy,null,'#ff9ec4'); S.sling(); shake=Math.min(7,shake+2.2); burst(cx,cy,'#ff3d81',10,260); }
      else if(imp>40)s.flash=Math.max(s.flash,.45); } }
}
function colTarget(tg){
  var x=tg.x,y0=tg.y-13,u=(ball.y-y0)/26; u=u<0?0:u>1?1:u;
  var cy=y0+26*u,nx=ball.x-x,ny=ball.y-cy,d2=nx*nx+ny*ny,R=BR+4;
  if(d2<R*R){ tg.up=false; tg.dropT=.001; addScore(250*mult,tg.x,tg.y-22); S.target(); burst(tg.x,tg.y,'#ffd23f',14,250);
    var allDown=true; for(var i=0;i<targets.length;i++)if(targets[i].up)allDown=false;
    if(allDown){ mult=2; flashBig=1; S.bonus(); pops.push({x:240,y:300,txt:'BONUS \u00d72!',c:'#ff3d81',t:0,big:true}); addScore(1000,240,336); } }
}
function colFlip(f){
  var dx=Math.cos(f.ang)*f.len,dy=Math.sin(f.ang)*f.len,L2=f.len*f.len;
  var u=((ball.x-f.px)*dx+(ball.y-f.py)*dy)/L2; u=u<0?0:u>1?1:u;
  var cx=f.px+dx*u,cy=f.py+dy*u,nx=ball.x-cx,ny=ball.y-cy,d2=nx*nx+ny*ny,R=BR+f.r;
  if(d2<R*R){ var d=Math.sqrt(d2)||.001; nx/=d; ny/=d; ball.x=cx+nx*R; ball.y=cy+ny*R;
    var rx=cx-f.px,ry=cy-f.py,svx=-f.om*ry,svy=f.om*rx;
    var rvx=ball.vx-svx,rvy=ball.vy-svy,vn=rvx*nx+rvy*ny;
    if(vn<0){ ball.vx-=1.3*vn*nx; ball.vy-=1.3*vn*ny;
      if(-vn>350&&t-f.snd>.08){ f.snd=t; noise(.02,.15,1500,1); } } }
}
function step(h){
  for(var i=0;i<2;i++){ var f=flippers[i], held=(i?heldR():heldL()), want=held?f.up:f.rest, sp=(held?34:16)*h, d=want-f.ang;
    var mv=d>sp?sp:(d<-sp?-sp:d); f.om=mv/h; f.ang+=mv; }
  ball.vy+=G*h;
  var s2=ball.vx*ball.vx+ball.vy*ball.vy,MAX=1500;
  if(s2>MAX*MAX){ var s=MAX/Math.sqrt(s2); ball.vx*=s; ball.vy*=s; }
  ball.x+=ball.vx*h; ball.y+=ball.vy*h;
  colFlip(flippers[0]); colFlip(flippers[1]);
  for(var j=0;j<segs.length;j++)colSeg(segs[j]);
  for(var k=0;k<arcs.length;k++)colArc(arcs[k]);
  colGate();
  for(var b=0;b<bumpers.length;b++)colBumper(bumpers[b]);
  for(var l=0;l<slings.length;l++)colSling(slings[l]);
  for(var m=0;m<targets.length;m++)if(targets[m].up)colTarget(targets[m]);
}
function firePlunger(){ var p=Math.max(.15,power); power=0; plungerAnim=1; ball.vy=-(520+640*p); S.launch(p); }

/* ============================== GAME FLOW ============================== */
function onLost(){
  S.drain(); shake=5; balls--; saveHigh();
  if(balls<=0){ state='over'; S.over();
    document.getElementById('finalScore').textContent=score.toLocaleString('en-US');
    document.getElementById('newHs').style.display=(score>wasHigh&&score>0)?'block':'none';
    overOv.classList.remove('hidden');
  } else { state='lost'; lostT=0; mult=1; resetTargets();
    for(var i=0;i<rolls.length;i++){rolls[i].lit=false;rolls[i].anim=0;} rollArmed=false; }
}

/* ============================== STATIC LAYER ============================== */
var staticCv=document.createElement('canvas'); staticCv.width=W*2; staticCv.height=H*2;
(function build(){
  var g=staticCv.getContext('2d'); g.scale(2,2); g.lineCap='round';
  // backglass panel
  rr(g,8,8,464,112,10); g.fillStyle='#0a0e22'; g.fill(); g.strokeStyle='#2b3868'; g.lineWidth=2; g.stroke();
  g.fillStyle='rgba(255,255,255,.05)'; rr(g,10,10,460,24,8); g.fill();
  var sc=[[18,18],[462,18],[18,110],[462,110]]; for(var i=0;i<4;i++){ g.beginPath(); g.arc(sc[i][0],sc[i][1],2.5,0,TAU); g.fillStyle='#39466f'; g.fill(); }
  // cabinet
  var cg=g.createLinearGradient(0,122,0,798); cg.addColorStop(0,'#1a2247'); cg.addColorStop(.5,'#0e1430'); cg.addColorStop(1,'#141b3c');
  rr(g,6,122,468,676,20); g.fillStyle=cg; g.fill(); g.strokeStyle='#39466f'; g.lineWidth=2.5; g.stroke();
  // felt
  g.save(); rr(g,18,130,444,662,14); g.clip();
  var fg=g.createRadialGradient(240,430,40,240,430,430); fg.addColorStop(0,'#1c2e6a'); fg.addColorStop(.55,'#101a44'); fg.addColorStop(1,'#080d26');
  g.fillStyle=fg; g.fillRect(18,130,444,662);
  g.fillStyle='rgba(140,190,255,.05)'; for(var x=44;x<452;x+=32)for(var y=152;y<780;y+=32)g.fillRect(x,y,2,2);
  // emblem
  g.save(); g.translate(240,468);
  g.strokeStyle='rgba(41,230,255,.10)'; g.lineWidth=3; g.beginPath();
  for(var e2=0;e2<16;e2++){ var a=e2*Math.PI/8,r=e2%2?44:96,px=Math.cos(a)*r,py=Math.sin(a)*r; e2?g.lineTo(px,py):g.moveTo(px,py); }
  g.closePath(); g.stroke();
  g.strokeStyle='rgba(255,61,129,.08)'; g.beginPath(); g.arc(0,0,104,0,TAU); g.stroke(); g.beginPath(); g.arc(0,0,30,0,TAU); g.stroke();
  g.fillStyle='rgba(255,210,63,.10)'; g.font='46px Impact,"Arial Black",sans-serif'; g.textAlign='center'; g.fillText('NS',0,16);
  g.restore();
  // drain shading + lane strip
  var dg=g.createLinearGradient(0,700,0,792); dg.addColorStop(0,'rgba(0,0,0,0)'); dg.addColorStop(1,'rgba(0,0,0,.55)'); g.fillStyle=dg; g.fillRect(18,700,444,92);
  g.fillStyle='rgba(0,0,0,.28)'; g.fillRect(431,222,25,568);
  g.save(); g.translate(443,660); g.rotate(-Math.PI/2); g.fillStyle='rgba(255,210,63,.4)'; g.font='bold 10px "Trebuchet MS",sans-serif'; g.textAlign='center'; g.fillText('L A U N C H',0,4); g.restore();
  // target mounts
  for(var m=0;m<targets.length;m++){ var tg=targets[m]; rr(g,tg.x-8,tg.y-16,16,32,4); g.fillStyle='#151c3e'; g.fill(); g.strokeStyle='#3a477e'; g.lineWidth=1.5; g.stroke();
    g.fillStyle='#0b102a'; g.beginPath(); g.arc(tg.x,tg.y-11,1.6,0,TAU); g.fill(); g.beginPath(); g.arc(tg.x,tg.y+11,1.6,0,TAU); g.fill(); }
  // rollover dark rings
  for(var r2=0;r2<rolls.length;r2++){ var rl=rolls[r2]; g.beginPath(); g.arc(rl.x,rl.y,13,0,TAU); g.fillStyle='#0d1330'; g.fill(); g.strokeStyle='#2e3a6c'; g.lineWidth=3; g.stroke(); }
  // bumper shadow discs
  for(var b2=0;b2<bumpers.length;b2++){ var bb=bumpers[b2]; g.beginPath(); g.arc(bb.x,bb.y+3,bb.r+4,0,TAU); g.fillStyle='rgba(0,0,0,.5)'; g.fill(); }
  // slinger triangles
  function tri(p1,p2,p3){ g.beginPath(); g.moveTo(p1[0],p1[1]); g.lineTo(p2[0],p2[1]); g.lineTo(p3[0],p3[1]); g.closePath(); g.fillStyle='#40102c'; g.fill(); g.strokeStyle='#ff3d81'; g.lineWidth=2; g.shadowColor='#ff3d81'; g.shadowBlur=6; g.stroke(); g.shadowBlur=0;
    g.beginPath(); g.moveTo(p1[0],p1[1]); g.lineTo(p2[0],p2[1]); g.strokeStyle='#ff9ec4'; g.lineWidth=2.5; g.stroke(); }
  tri([94,540],[148,624],[92,624]); tri([386,540],[332,624],[388,624]);
  g.restore(); // felt clip
  // neon walls
  g.strokeStyle='#3fd9ff'; g.lineWidth=2.5; g.shadowColor='#3fd9ff'; g.shadowBlur=10;
  g.beginPath(); g.moveTo(24,780); g.lineTo(24,214); g.arc(104,214,80,Math.PI,1.5*Math.PI); g.lineTo(376,134); g.arc(376,214,80,-Math.PI/2,0); g.lineTo(456,792); g.stroke();
  g.beginPath(); g.moveTo(430,222); g.lineTo(430,780); g.strokeStyle='rgba(63,217,255,.45)'; g.lineWidth=2; g.shadowBlur=6; g.stroke(); g.shadowBlur=0;
  // inlane guides (gold posts)
  var gd=[[92,628,152,704],[388,628,328,704]];
  for(var q=0;q<2;q++){ g.beginPath(); g.moveTo(gd[q][0],gd[q][1]); g.lineTo(gd[q][2],gd[q][3]); g.strokeStyle='#ffd23f'; g.lineWidth=5; g.shadowColor='#ffd23f'; g.shadowBlur=8; g.stroke(); g.shadowBlur=0;
    g.beginPath(); g.arc(gd[q][0],gd[q][1],5,0,TAU); g.fillStyle='#ffe9a8'; g.fill(); }
  // outlane chevrons
  g.strokeStyle='rgba(255,61,129,.35)'; g.lineWidth=2.5;
  g.beginPath(); g.moveTo(44,718); g.lineTo(50,726); g.lineTo(56,718); g.stroke();
  g.beginPath(); g.moveTo(404,718); g.lineTo(410,726); g.lineTo(416,718); g.stroke();
  // gate pin
  g.beginPath(); g.arc(418,196,3,0,TAU); g.fillStyle='rgba(127,243,255,.5)'; g.fill();
})();

/* stars for the room background */
var stars=[]; for(var si=0;si<80;si++)stars.push({x:Math.random(),y:Math.random(),p:Math.random()*TAU,s:.5+Math.random()});

/* ============================== RENDER ============================== */
function blob(x,y,r,c){ var gr=ctx.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,c); gr.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=gr; ctx.fillRect(x-r,y-r,r*2,r*2); }

function drawFlip(f){
  var tx=f.px+Math.cos(f.ang)*f.len, ty=f.py+Math.sin(f.ang)*f.len;
  ctx.lineCap='round';
  ctx.strokeStyle='#0a0f26'; ctx.lineWidth=17; ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tx,ty); ctx.stroke();
  var gr=ctx.createLinearGradient(f.px,f.py,tx,ty); gr.addColorStop(0,'#c9d8f5'); gr.addColorStop(1,'#8fa3cf');
  ctx.strokeStyle=gr; ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tx,ty); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(f.px,f.py); ctx.lineTo(tx,ty); ctx.stroke();
  ctx.fillStyle='#7ff3ff'; ctx.shadowColor='#29e6ff'; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(tx,ty,3,0,TAU); ctx.fill(); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(f.px,f.py,6.5,0,TAU); ctx.fillStyle='#1b2450'; ctx.fill(); ctx.strokeStyle='#3b4a8c'; ctx.lineWidth=1.5; ctx.stroke();
}

function render(){
  var cw=innerWidth,chh=innerHeight;
  scale=Math.min(cw/W,chh/H); offX=(cw-W*scale)/2; offY=(chh-H*scale)/2;
  // room
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var g1=ctx.createLinearGradient(0,0,0,chh); g1.addColorStop(0,'#05070f'); g1.addColorStop(1,'#02030a'); ctx.fillStyle=g1; ctx.fillRect(0,0,cw,chh);
  blob(cw*.18+Math.sin(t*.23)*30,chh*.8,Math.max(140,cw*.42),'rgba(41,230,255,.07)');
  blob(cw*.85,chh*.12+Math.cos(t*.19)*24,Math.max(140,cw*.36),'rgba(255,61,129,.06)');
  for(var i=0;i<stars.length;i++){ var st=stars[i], a=.12+.22*(0.5+0.5*Math.sin(t*st.s+st.p)); ctx.fillStyle='rgba(200,230,255,'+a.toFixed(3)+')'; ctx.fillRect(st.x*cw,st.y*chh,1.6,1.6); }
  // scene (with shake)
  var shx=(Math.random()*2-1)*shake, shy=(Math.random()*2-1)*shake*.7;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,(offX+shx)*dpr,(offY+shy)*dpr);
  ctx.drawImage(staticCv,0,0,W,H);

  // rollover lamps
  for(var r=0;r<rolls.length;r++){ var rl=rolls[r];
    if(rl.lit){ var s2=1+rl.anim*.35;
      ctx.beginPath(); ctx.arc(rl.x,rl.y,13*s2,0,TAU);
      var rg=ctx.createRadialGradient(rl.x,rl.y,1,rl.x,rl.y,13*s2); rg.addColorStop(0,'#fff6cf'); rg.addColorStop(.6,'#ffcf4d'); rg.addColorStop(1,'#c77a00');
      ctx.fillStyle=rg; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=16; ctx.fill(); ctx.shadowBlur=0;
    } else { ctx.beginPath(); ctx.arc(rl.x,rl.y,4,0,TAU); ctx.fillStyle='rgba(90,110,180,.35)'; ctx.fill(); } }

  // targets
  for(var m=0;m<targets.length;m++){ var tg=targets[m];
    if(tg.up){ rr(ctx,tg.x-5,tg.y-13,10,26,4);
      var tgr=ctx.createLinearGradient(0,tg.y-13,0,tg.y+13); tgr.addColorStop(0,'#fff3c8'); tgr.addColorStop(1,'#f0a90a');
      ctx.fillStyle=tgr; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1; ctx.stroke();
      ctx.strokeStyle='rgba(90,50,0,.6)'; ctx.beginPath(); ctx.moveTo(tg.x,tg.y-8); ctx.lineTo(tg.x,tg.y+8); ctx.stroke();
    } else if(tg.dropT<1.2){ var k=Math.min(1,tg.dropT/.4), y2=tg.y+k*44;
      ctx.save(); ctx.globalAlpha=1-k*.75; ctx.translate(tg.x,y2); ctx.rotate(k*.8);
      rr(ctx,-5,-13,10,26,4); ctx.fillStyle='#f0a90a'; ctx.fill(); ctx.restore(); ctx.globalAlpha=1; } }

  // slinger flash overlays
  for(var l=0;l<slings.length;l++){ var s=slings[l]; if(s.flash>.02){
    ctx.beginPath(); ctx.moveTo(s.a[0],s.a[1]); ctx.lineTo(s.b[0],s.b[1]); ctx.lineTo(l===0?92:388,624); ctx.closePath();
    ctx.fillStyle='rgba(255,61,129,'+(.5*s.flash).toFixed(3)+')'; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,'+(.8*s.flash).toFixed(3)+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(s.a[0],s.a[1]); ctx.lineTo(s.b[0],s.b[1]); ctx.stroke(); } }

  // bumpers
  for(var b=0;b<bumpers.length;b++){ var bp=bumpers[b], fl=bp.flash, R=bp.r*(1+.12*fl);
    ctx.beginPath(); ctx.arc(bp.x,bp.y,R+3,0,TAU); ctx.fillStyle='#0a0f26'; ctx.fill();
    ctx.beginPath(); ctx.arc(bp.x,bp.y,R,0,TAU);
    var bg2=ctx.createRadialGradient(bp.x,bp.y,2,bp.x,bp.y,R); bg2.addColorStop(0,'#8a1a4c'); bg2.addColorStop(1,'#3a0a22');
    ctx.fillStyle=bg2; ctx.shadowColor='#ff3d81'; ctx.shadowBlur=6+18*fl; ctx.fill();
    ctx.strokeStyle='#ff3d81'; ctx.lineWidth=2.5; ctx.stroke(); ctx.shadowBlur=0;
    var ir=bp.r*.55*(1+.2*fl);
    ctx.beginPath(); ctx.arc(bp.x,bp.y,ir,0,TAU);
    var ig=ctx.createRadialGradient(bp.x-3,bp.y-4,1,bp.x,bp.y,ir); ig.addColorStop(0,'#fff6cf'); ig.addColorStop(.7,'#ffb300'); ig.addColorStop(1,'#c77a00');
    ctx.fillStyle=ig; ctx.fill();
    ctx.strokeStyle='rgba(90,50,0,.5)'; ctx.lineWidth=2;
    for(var k2=0;k2<3;k2++){ var aa=bp.rot+k2*TAU/3; ctx.beginPath(); ctx.arc(bp.x,bp.y,ir*.62,aa,aa+.7); ctx.stroke(); }
    if(fl>.02){ ctx.beginPath(); ctx.arc(bp.x,bp.y,R,0,TAU); ctx.fillStyle='rgba(255,255,255,'+(.7*fl).toFixed(3)+')'; ctx.fill(); } }

  // plunger + power
  if(state==='play'||state==='lost'){
    var comp=(prevChg&&inPocket())?power*8:0, snap=plungerAnim*-10;
    var knobY=Math.max(764,Math.min(790,778+comp+snap));
    ctx.strokeStyle='#9fb4e8'; ctx.lineWidth=2; ctx.beginPath();
    for(var c2=0;c2<=6;c2++){ var yy=764+(knobY-8-764)*c2/6; ctx.lineTo(443+((c2%2)?5:-5)*(c2===0||c2===6?0:1),yy); }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(443,knobY,7,0,TAU);
    var kg=ctx.createRadialGradient(440,knobY-3,1,443,knobY,7); kg.addColorStop(0,'#ffe9a8'); kg.addColorStop(1,'#c77a00');
    ctx.fillStyle=kg; ctx.fill(); ctx.strokeStyle='#5a3a00'; ctx.lineWidth=1.5; ctx.stroke();
  }
  if(inPocket()&&power>0){
    ctx.beginPath(); ctx.arc(443,772,13,-Math.PI/2,-Math.PI/2+power*TAU);
    ctx.strokeStyle='hsl('+(190-130*power)+',100%,60%)'; ctx.lineWidth=3; ctx.shadowColor='rgba(255,210,63,.8)'; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0; }
  if(inPocket()&&(t%1)<.7){ ctx.fillStyle='rgba(255,210,63,.85)'; ctx.font='bold 8px Consolas,Menlo,monospace'; ctx.textAlign='center'; ctx.fillText('SPACE',443,692); }

  // flippers
  drawFlip(flippers[0]); drawFlip(flippers[1]);

  // trail + ball
  if(state==='play'){
    for(var tr=0;tr<trail.length;tr++){ var p=trail[tr], al=(tr/trail.length)*.32;
      ctx.beginPath(); ctx.arc(p.x,p.y,BR*(.3+.7*tr/trail.length),0,TAU); ctx.fillStyle='rgba(120,220,255,'+al.toFixed(3)+')'; ctx.fill(); }
    if(ball.y<812){
      var bgr=ctx.createRadialGradient(ball.x-3,ball.y-4,1.5,ball.x,ball.y,BR);
      bgr.addColorStop(0,'#ffffff'); bgr.addColorStop(.25,'#dfe9ff'); bgr.addColorStop(.6,'#93a7cc'); bgr.addColorStop(1,'#3c465f');
      ctx.beginPath(); ctx.arc(ball.x,ball.y,BR,0,TAU); ctx.fillStyle=bgr; ctx.fill();
      ctx.beginPath(); ctx.arc(ball.x-3.5,ball.y-4.5,1.8,0,TAU); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill(); } }

  // particles
  if(parts.length){ ctx.save(); ctx.globalCompositeOperation='lighter';
    for(var pa=0;pa<parts.length;pa++){ var pt=parts[pa]; ctx.globalAlpha=Math.max(0,pt.l/pt.ml); ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,TAU); ctx.fillStyle=pt.c; ctx.fill(); }
    ctx.restore(); ctx.globalAlpha=1; }

  // popups
  for(var pp=0;pp<pops.length;pp++){ var po=pops[pp], al=Math.max(0,1-po.t/.9);
    ctx.globalAlpha=al; ctx.font=(po.big?'bold 22px':'bold 14px')+' Consolas,Menlo,monospace';
    ctx.textAlign='center'; ctx.shadowColor=po.c; ctx.shadowBlur=8; ctx.fillStyle=po.c;
    ctx.fillText(po.txt,po.x,po.y-po.t*34); ctx.shadowBlur=0; }
  ctx.globalAlpha=1;

  // bonus border / big flash
  if(mult>1&&state==='play'){ rr(ctx,20,132,440,658,12); ctx.strokeStyle='rgba(255,210,63,'+(.25+.15*Math.sin(t*5)).toFixed(3)+')'; ctx.lineWidth=2; ctx.stroke(); }
  if(flashBig>.01){ rr(ctx,20,132,440,658,12); ctx.fillStyle='rgba(140,240,255,'+(.3*flashBig).toFixed(3)+')'; ctx.fill(); }

  // ball lost text
  if(state==='lost'){ var a=.6+.4*Math.sin(t*10);
    ctx.globalAlpha=a; ctx.textAlign='center'; ctx.font='42px Impact,"Arial Black",sans-serif';
    ctx.fillStyle='#ff9ec4'; ctx.shadowColor='#ff3d81'; ctx.shadowBlur=20; ctx.fillText('BALL LOST',235,436); ctx.shadowBlur=0;
    ctx.font='bold 13px Consolas,Menlo,monospace'; ctx.fillStyle='#ffd23f'; ctx.fillText(balls+' BALL'+(balls===1?'':'S')+' REMAINING',235,462); ctx.globalAlpha=1; }

  // ---- backglass HUD ----
  var pu=.75+.25*Math.sin(t*2.6);
  ctx.textAlign='center'; ctx.fillStyle='#bff4ff'; ctx.shadowColor='#29e6ff'; ctx.shadowBlur=16*pu;
  ctx.font='34px Impact,"Arial Black",sans-serif'; ctx.fillText('NEON SURGE',240,42);
  ctx.shadowBlur=0; ctx.fillStyle='#ffd23f'; ctx.font='10px Impact,"Arial Black",sans-serif'; ctx.fillText('P I N B A L L',240,56);
  ctx.textAlign='left'; ctx.fillStyle='#8b97c9'; ctx.font='bold 9px "Trebuchet MS",sans-serif'; ctx.fillText('SCORE',26,74);
  ctx.fillStyle='#ffd23f'; ctx.shadowColor='rgba(255,180,0,.8)'; ctx.shadowBlur=10;
  ctx.font='bold 30px Consolas,Menlo,monospace'; ctx.fillText(String(Math.min(99999999,score)).padStart(8,'0'),24,101); ctx.shadowBlur=0;
  ctx.textAlign='right'; ctx.fillStyle='#8b97c9'; ctx.font='bold 9px "Trebuchet MS",sans-serif'; ctx.fillText('HIGH SCORE',456,74);
  ctx.fillStyle='#7ff3ff'; ctx.shadowColor='#29e6ff'; ctx.shadowBlur=6; ctx.font='bold 16px Consolas,Menlo,monospace';
  ctx.fillText(String(high).padStart(8,'0'),456,92); ctx.shadowBlur=0;
  ctx.textAlign='center'; ctx.fillStyle='#8b97c9'; ctx.font='bold 8px "Trebuchet MS",sans-serif'; ctx.fillText('BALLS',284,64);
  for(var bl=0;bl<3;bl++){ var on=bl<balls&&state!=='over';
    ctx.beginPath(); ctx.arc(262+bl*22,76,7,0,TAU);
    if(on){ ctx.fillStyle='#ffd23f'; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=10; ctx.fill(); ctx.shadowBlur=0; }
    else { ctx.fillStyle='#141b3a'; ctx.fill(); ctx.strokeStyle='#3b4a8c'; ctx.lineWidth=1.5; ctx.stroke(); } }
  if(mult>1&&state==='play'){ var ba=.7+.3*Math.sin(t*6);
    rr(ctx,232,84,80,26,7); ctx.fillStyle='rgba(255,61,129,.15)'; ctx.fill();
    ctx.strokeStyle='rgba(255,61,129,'+ba.toFixed(3)+')'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.globalAlpha=ba; ctx.fillStyle='#ff9ec4'; ctx.font='bold 13px Consolas,Menlo,monospace'; ctx.fillText('\u00d72 BONUS',272,101); ctx.globalAlpha=1; }

  // vignette
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var vg=ctx.createRadialGradient(cw/2,chh*.45,Math.min(cw,chh)*.3,cw/2,chh/2,Math.max(cw,chh)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,6,.6)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,cw,chh);
}

/* ============================== MAIN LOOP ============================== */
var last=performance.now(), acc=0, HSTEP=1/240;
function frame(now){
  requestAnimationFrame(frame);
  var dt=(now-last)/1000; last=now; if(dt>.05)dt=.05; t+=dt;

  // flipper press sounds (edge)
  var L=heldL(),R2=heldR();
  if(L&&!prevLeft)S.flip(); if(R2&&!prevRight)S.flip(); prevLeft=L; prevRight=R2;

  // plunger charge / fire edge
  var chg=(keySpace||hasPtr('P'))&&state==='play'&&inPocket();
  if(chg)power=Math.min(1,power+dt*1.05);
  else if(state==='play'&&!inPocket())power=0;
  if(prevChg&&!chg){ if(inPocket())firePlunger(); else power=0; }
  prevChg=chg;

  // physics
  if(state==='play'||state==='lost'){ acc+=dt; var n=0; while(acc>=HSTEP&&n<40){ step(HSTEP); acc-=HSTEP; n++; } }

  if(state==='play'){
    // rollover lanes
    for(var i=0;i<rolls.length;i++){ var rl=rolls[i];
      if(!rl.lit){ var dx=ball.x-rl.x,dy=ball.y-rl.y; if(dx*dx+dy*dy<(BR+13)*(BR+13)){ rl.lit=true; rl.anim=1; addScore(50*mult,rl.x,rl.y-18); S.roll(); } } }
    var allL=true; for(i=0;i<rolls.length;i++)if(!rolls[i].lit)allL=false;
    if(allL&&!rollArmed){ rollArmed=true; addScore(500*mult,240,206,'LANE BONUS +'+(500*mult),'#7ff3ff'); S.bonus(); rollResetAt=t+1.3; }
    if(rollArmed&&t>rollResetAt){ for(i=0;i<rolls.length;i++)rolls[i].lit=false; rollArmed=false; }
    // stuck safety nudge
    var spd=Math.hypot(ball.vx,ball.vy);
    if(!inPocket()&&spd<15)stuckT+=dt; else stuckT=0;
    if(stuckT>2.5){ ball.vx+=(Math.random()-.5)*140; ball.vy-=60; stuckT=0; }
    // drain
    if(ball.y-BR>806)onLost();
    // trail
    if(spd>90){ trail.push({x:ball.x,y:ball.y}); if(trail.length>15)trail.shift(); }
    else if(trail.length)trail.shift();
  }
  if(state==='lost'){ lostT+=dt; if(lostT>1.5){ newBall(); state='play'; } }

  // decays
  for(i=0;i<bumpers.length;i++){ bumpers[i].flash=Math.max(0,bumpers[i].flash-dt*3.5); bumpers[i].rot+=dt*(.6+bumpers[i].flash*8); }
  for(i=0;i<slings.length;i++)slings[i].flash=Math.max(0,slings[i].flash-dt*4);
  for(i=0;i<rolls.length;i++)rolls[i].anim=Math.max(0,rolls[i].anim-dt*3);
  for(i=0;i<targets.length;i++)if(!targets[i].up)targets[i].dropT+=dt;
  plungerAnim=Math.max(0,plungerAnim-dt*4);
  shake*=Math.exp(-6*dt); if(shake<.05)shake=0;
  flashBig=Math.max(0,flashBig-dt*1.2);
  for(i=parts.length-1;i>=0;i--){ var p=parts[i]; p.vy+=G*.35*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt; if(p.l<=0)parts.splice(i,1); }
  for(i=pops.length-1;i>=0;i--){ pops[i].t+=dt; if(pops[i].t>.95)pops.splice(i,1); }

  render();
}
requestAnimationFrame(frame);
})();
