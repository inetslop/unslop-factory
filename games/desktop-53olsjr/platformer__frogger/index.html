<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FROGHOP — Platformer Frogger</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#141026}
  #stage{position:fixed;inset:0;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#f4ead8;-webkit-user-select:none;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .disp{font-family:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;letter-spacing:.06em;font-weight:400}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:stretch;padding:10px 14px;pointer-events:none;opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .35s}
  #hud.show{opacity:1;transform:none}
  .chip{background:rgba(17,12,32,.82);border:2px solid #4a3b78;border-radius:10px;padding:6px 14px;display:flex;flex-direction:column;justify-content:center;line-height:1.05;box-shadow:0 4px 0 rgba(0,0,0,.35);min-width:74px}
  .chip .lbl{font-size:9px;letter-spacing:.26em;color:#9a8fd0;text-transform:uppercase;margin-bottom:2px}
  .chip .val{font-family:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:26px;color:#ffd76a;display:inline-block;font-variant-numeric:tabular-nums}
  #bestVal{color:#bfe0ff}
  #scoreVal.pop{animation:pop .2s ease-out}
  @keyframes pop{45%{transform:scale(1.4);color:#fff}}
  #livesVal{font-size:20px;letter-spacing:3px}
  .off{opacity:.22;filter:grayscale(1)}
  #streakChip{display:none;border-color:#f7b32b}
  #streakChip.on{display:flex;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 18px rgba(255,205,90,.55)}}
  #timeChip{flex:1;min-width:120px}
  .tbar{width:100%;height:12px;background:#120d24;border-radius:6px;border:1px solid #3a2f5c;overflow:hidden;margin-top:4px}
  #timeFill{height:100%;width:100%;background:linear-gradient(90deg,#7ee081,#ffd76a);border-radius:6px;transition:width .12s linear}
  #timeChip.low{animation:tflash .5s steps(2) infinite}
  @keyframes tflash{50%{border-color:#ff5d4d;box-shadow:0 0 14px rgba(255,80,60,.6)}}

  /* ---------- Overlay ---------- */
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 38%,rgba(24,16,48,.42),rgba(9,7,20,.86));transition:opacity .35s,visibility .35s}
  #overlay.hide{opacity:0;visibility:hidden}
  .panel{background:rgba(28,22,52,.96);border:3px solid #f7b32b;border-radius:14px;padding:30px 42px 34px;text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.35);max-width:min(94vw,620px)}
  .title{font-size:clamp(46px,9vw,86px);color:#ffd76a;text-shadow:0 4px 0 #b3541e,0 10px 22px rgba(0,0,0,.7);line-height:1}
  .title span{display:inline-block;animation:hopIn .55s cubic-bezier(.3,1.6,.5,1) backwards}
  @keyframes hopIn{from{transform:translateY(-80px) scale(.3);opacity:0}}
  .tagline{margin:12px 0 18px;color:#cfc4f2;font-size:15px;letter-spacing:.04em}
  .tagline b{color:#ffd76a}
  .howto{display:inline-grid;grid-template-columns:auto auto;gap:9px 22px;margin:0 auto 16px;text-align:left;font-size:13.5px;color:#e8e0ff;align-items:center}
  kbd{font-family:'Courier New',monospace;font-weight:700;background:#2b2350;border:2px solid #6a5aa8;border-bottom-width:4px;border-radius:6px;padding:2px 9px;color:#e9e2ff;font-size:12.5px;display:inline-block;min-width:24px;text-align:center}
  .tip{font-size:12.5px;color:#9a8fd0;margin-bottom:20px}
  .btn{pointer-events:auto;cursor:pointer;font-family:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:24px;letter-spacing:.09em;color:#241735;background:linear-gradient(#ffe08a,#f7b32b);border:3px solid #7a4a12;border-radius:12px;padding:12px 34px;box-shadow:0 6px 0 #7a4a12,0 12px 20px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 9px 0 #7a4a12,0 18px 26px rgba(0,0,0,.5)}
  .btn:active{transform:translateY(2px);box-shadow:0 3px 0 #7a4a12}
  .bestline{margin-top:16px;font-size:12.5px;color:#9a8fd0;letter-spacing:.14em;text-transform:uppercase}
  .over-title{font-size:clamp(38px,7vw,64px);color:#ff8d7e;text-shadow:0 4px 0 #7c1f16,0 8px 18px rgba(0,0,0,.7)}
  .stats{display:flex;justify-content:center;gap:34px;margin:20px 0 24px}
  .stat .lbl{font-size:10px;letter-spacing:.26em;color:#9a8fd0;text-transform:uppercase}
  .stat .num{font-family:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:40px;color:#ffd76a;line-height:1.1}
  .badge{display:inline-block;background:#f7b32b;color:#241735;font-family:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;letter-spacing:.1em;padding:5px 16px;border-radius:8px;margin-bottom:18px;animation:pulse 1s ease-in-out infinite;font-size:16px}
  .sub{font-size:12.5px;color:#9a8fd0;margin-top:14px;letter-spacing:.08em}

  /* ---------- Toast ---------- */
  #toast{position:absolute;left:50%;top:17%;transform:translateX(-50%);font-family:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;font-size:clamp(24px,4.5vw,40px);color:#fff;text-shadow:0 3px 0 #000,0 0 22px rgba(255,215,106,.9);opacity:0;pointer-events:none;white-space:nowrap;z-index:5}
  #toast.show{animation:toastUp 1.15s ease-out forwards}
  @keyframes toastUp{0%{opacity:0;transform:translate(-50%,24px) scale(.5)}16%{opacity:1;transform:translate(-50%,0) scale(1.14)}30%{transform:translate(-50%,0) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(.95)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="chip"><span class="lbl">Score</span><span class="val" id="scoreVal">0</span></div>
    <div class="chip"><span class="lbl">Best</span><span class="val" id="bestVal">0</span></div>
    <div class="chip" id="streakChip"><span class="lbl">Streak</span><span class="val" id="streakVal">×2</span></div>
    <div class="chip"><span class="lbl">Lives</span><span class="val" id="livesVal"></span></div>
    <div class="chip" id="timeChip"><span class="lbl">Time</span><div class="tbar"><div id="timeFill"></div></div></div>
  </div>

  <div id="toast"></div>
  <div id="overlay"><div class="panel" id="ovBox"></div></div>
</div>

<script>
(function(){
'use strict';
/* ============================== SETUP ============================== */
var stage=document.getElementById('stage'), cv=document.getElementById('game'), ctx=cv.getContext('2d');
var hud=document.getElementById('hud'), overlay=document.getElementById('overlay'), ovBox=document.getElementById('ovBox'), toastEl=document.getElementById('toast');
var elScore=document.getElementById('scoreVal'), elBest=document.getElementById('bestVal'), elLives=document.getElementById('livesVal'),
    elTimeFill=document.getElementById('timeFill'), elStreakChip=document.getElementById('streakChip'), elStreakVal=document.getElementById('streakVal'),
    elTimeChip=document.getElementById('timeChip');

var COLS=13, ROWS=11, GOAL_ROW=0, MID_ROW=5, START_ROW=10;
var ROAD_ROWS=[6,7,8,9];
var GOALS=[1,4,6,8,11];
var TIME_MAX=45, MARGIN=3.2, HIT_Z=0.42, HJ=1.2;
var DIVE_CYC=3.8, DIVE_DUR=0.9;
var TAU=Math.PI*2;

var W=0,H=0,DPR=1,C=40,OX=0,OY=0,VIG=null;
function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  var topPad=74, sidePad=16;
  C=Math.floor(Math.min((W-sidePad*2)/COLS,(H-topPad-20)/ROWS));
  OX=Math.round((W-COLS*C)/2); OY=Math.round(topPad+((H-topPad-20)-ROWS*C)/2)+4;
  VIG=ctx.createRadialGradient(W/2,H*0.46,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  VIG.addColorStop(0,'rgba(0,0,0,0)'); VIG.addColorStop(1,'rgba(4,2,12,0.52)');
}
window.addEventListener('resize',layout);

/* ============================== AUDIO ============================== */
var AC=null, masterG=null, noiseBuf=null;
function audio(){
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    masterG=AC.createGain(); masterG.gain.value=0.55; masterG.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    var src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=330;
    var g=AC.createGain(); g.gain.setValueAtTime(0.0001,AC.currentTime);
    g.gain.linearRampToValueAtTime(0.028,AC.currentTime+2.5);
    src.connect(f); f.connect(g); g.connect(masterG); src.start();
  }
  if(AC.state==='suspended') AC.resume();
}
function tone(type,f0,f1,dur,g,delay){
  if(!AC) return; var t0=AC.currentTime+(delay||0);
  var o=AC.createOscillator(), gn=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(28,f1),t0+dur);
  gn.gain.setValueAtTime(g,t0); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn); gn.connect(masterG); o.start(t0); o.stop(t0+dur+0.03);
}
function noiseBurst(dur,freq,g,delay){
  if(!AC) return; var t0=AC.currentTime+(delay||0);
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(freq,t0); f.frequency.exponentialRampToValueAtTime(Math.max(80,freq*0.3),t0+dur);
  var gn=AC.createGain(); gn.gain.setValueAtTime(g,t0); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(gn); gn.connect(masterG); s.start(t0); s.stop(t0+dur+0.06);
}
var sfx={
  hop:function(){ tone('square',340,640,0.07,0.10); },
  jump:function(){ tone('sawtooth',150,540,0.17,0.12); noiseBurst(0.14,1400,0.05); },
  land:function(){ tone('sine',190,85,0.08,0.16); },
  hit:function(){ tone('square',320,50,0.38,0.26); noiseBurst(0.32,520,0.24); },
  drown:function(){ noiseBurst(0.5,720,0.18); tone('sine',260,420,0.16,0.10,0.05); tone('sine',330,520,0.14,0.09,0.2); },
  goal:function(st){ var base=[523,659,784]; for(var i=0;i<3;i++) tone('triangle',base[i]+st*24,base[i]+st*24,0.1,0.14,i*0.08); },
  fanfare:function(){ var n=[392,494,587,784,988]; for(var i=0;i<n.length;i++) tone('triangle',n[i],n[i],0.16,0.15,i*0.09); },
  tick:function(){ tone('square',980,980,0.03,0.05); },
  ui:function(){ tone('triangle',620,900,0.07,0.12); },
  over:function(){ var n=[392,330,262,196]; for(var i=0;i<n.length;i++) tone('sawtooth',n[i],n[i]*0.94,0.28,0.12,i*0.22); }
};

/* ============================== STATE ============================== */
var state='menu', tWorld=0, simT=0;
var score=0, lives=3, streak=0, totalGoals=0, speedMult=1, timeLeft=TIME_MAX;
var best=loadBest(), newBest=false;
var goalsFilled=[false,false,false,false,false], padPop={};
var deadT=0, deadReason='', celebrateT=0, lastTickSec=-1, nextChirp=3;
var shakeT=0, shakeMag=0, hitFlash=0;
var frogVisible=false, buffer=null;

function loadBest(){ try{ return parseInt(localStorage.getItem('froghop_best'),10)||0; }catch(e){ return 0; } }
function saveBest(v){ try{ localStorage.setItem('froghop_best',String(v)); }catch(e){} }

var frog={col:6,row:START_ROW,x:6,y:START_ROW,z:0,facing:1,hop:null,jump:null,invuln:0,landT:9,nextBlink:2.5,blinkT:0};
function resetFrog(){
  frog.col=6; frog.row=START_ROW; frog.x=6; frog.y=START_ROW; frog.z=0; frog.facing=1;
  frog.hop=null; frog.jump=null; frog.invuln=1.2; frog.landT=9;
}

/* ---------- lanes & objects ---------- */
var LANES=[
  {row:1, type:'log',   dir:-1, speed:1.5, len:3, gap:2.0},
  {row:2, type:'turtle',dir: 1, speed:0.85,len:4, gap:2.6, dive:false, tc:0},
  {row:3, type:'turtle',dir:-1, speed:1.15,len:3, gap:3.2, dive:true,  tc:1},
  {row:4, type:'log',   dir: 1, speed:2.0, len:4, gap:1.8},
  {row:6, type:'car',   dir: 1, speed:2.3, len:1, gap:2.6},
  {row:7, type:'truck', dir:-1, speed:1.5, len:2, gap:4.0},
  {row:8, type:'car',   dir:-1, speed:2.9, len:1, gap:2.3},
  {row:9, type:'taxi',  dir: 1, speed:1.9, len:1, gap:2.2}
];
var objects=[];
function buildWorld(){
  objects=[];
  for(var i=0;i<LANES.length;i++){
    var L=LANES[i], period=L.len+L.gap, span=Math.ceil((COLS+2*MARGIN)/period);
    for(var k=0;k<span;k++){
      var o={lane:L,x:-MARGIN+k*period,vk:(i*7+k)%10,dx:0};
      if(L.dive) o.phase=((k*1.31+i*0.7)%DIVE_CYC);
      objects.push(o);
    }
  }
}
function diveState(o){
  var p=((tWorld+o.phase)%DIVE_CYC)/DIVE_CYC;
  return p<DIVE_DUR/ DIVE_CYC ? Math.sin(Math.PI*p/(DIVE_DUR/DIVE_CYC)) : 0;
}
function updateWorld(dt){
  for(var i=0;i<objects.length;i++){
    var o=objects[i], L=o.lane, v=L.speed*speedMult;
    o.dx=L.dir*v*dt; o.x+=o.dx;
    var span=(L.len+L.gap)*1; // period
    var count=Math.ceil((COLS+2*MARGIN)/span);
    var total=span*count;
    if(L.dir>0 && o.x>COLS+MARGIN) o.x-=total;
    if(L.dir<0 && o.x<-L.len-MARGIN) o.x+=total;
  }
}

/* ---------- particles ---------- */
var parts=[];
function addP(o){ if(parts.length<320) parts.push(o); }
function puff(x,y,n){ for(var i=0;i<n;i++) addP({type:'dust',x:x+(Math.random()-0.5)*0.4,y:y+0.25,vx:(Math.random()-0.5)*1.4,vy:-0.6-Math.random(),g:0,t:0,life:0.4+Math.random()*0.2,s:0.1+Math.random()*0.08,c:'rgba(200,220,170,'}); }
function goo(x,y){ var cs=['#6cc24f','#4a9e3c','#8fd96a','#3a7d33']; for(var i=0;i<16;i++){var a=Math.random()*TAU,s=2+Math.random()*5; addP({type:'dot',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,g:14,t:0,life:0.7+Math.random()*0.4,s:0.09+Math.random()*0.08,c:cs[i%4]});} }
function splash(x,y){ for(var i=0;i<16;i++){var a=Math.PI+(Math.random()-0.5)*2.2,s=2+Math.random()*4; addP({type:'dot',x:x,y:y,vx:Math.cos(a)*s,vy:-Math.abs(Math.sin(a))*s-2,g:13,t:0,life:0.6+Math.random()*0.3,s:0.07+Math.random()*0.06,c:i%3?'#bfe8ff':'#ffffff'});} addP({type:'ring',x:x,y:y,vx:0,vy:0,g:0,t:0,life:0.5,s:0.3,c:'#cfeeff'}); }
function confetti(x,y){ var cs=['#ffd76a','#ff8d7e','#9be87e','#bfa8ff','#ffffff']; for(var i=0;i<20;i++){var a=-Math.PI/2+(Math.random()-0.5)*1.8,s=3+Math.random()*4; addP({type:'conf',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:9,t:0,life:0.8+Math.random()*0.4,s:0.1,c:cs[i%5],rot:Math.random()*TAU,vr:(Math.random()-0.5)*12});} addP({type:'ring',x:x,y:y,vx:0,vy:0,g:0,t:0,life:0.45,s:0.3,c:'#ffe9a0'}); }
function updateParts(dt){
  for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.rot!==undefined) p.rot+=p.vr*dt;
  }
}

/* ============================== GAME FLOW ============================== */
function resetRun(){
  score=0; lives=3; streak=0; totalGoals=0; speedMult=1; timeLeft=TIME_MAX; newBest=false;
  goalsFilled=[false,false,false,false,false]; padPop={}; parts.length=0;
  buffer=null; lastTickSec=-1; hitFlash=0; shakeT=0;
  buildWorld(); resetFrog(); frogVisible=true;
  state='playing';
  hud.classList.add('show'); overlay.classList.add('hide');
  setScore(0,false); updateHUD(); sfx.ui();
}
function die(reason){
  if(state!=='playing') return;
  state='dead'; deadT=0; deadReason=reason;
  frog.hop=null; frog.jump=null; frog.z=0; buffer=null; streak=0;
  var fx=frog.x+0.5, fy=frog.y+0.5;
  if(reason==='drown'){ sfx.drown(); splash(fx,fy); }
  else if(reason==='time'){ tone('square',700,180,0.4,0.2); toastEl.textContent='⏰ TIME UP!'; showToast(); }
  else { sfx.hit(); goo(fx,fy); shakeT=0.35; shakeMag=11; hitFlash=0.9; }
  updateHUD();
}
function gameOver(){
  state='over'; frogVisible=false;
  if(score>best){ best=score; newBest=true; saveBest(best); }
  sfx.over(); showOver();
}
function respawn(){
  resetFrog(); timeLeft=TIME_MAX; lastTickSec=-1; elTimeChip.classList.remove('low');
  state='playing'; frogVisible=true; updateHUD();
}

/* ---------- movement ---------- */
function doMove(dc,dr){
  var nc=frog.col+dc, nr=frog.row+dr;
  if(nc<0||nc>=COLS||nr<0||nr>=ROWS) return false;
  frog.col=nc; frog.row=nr;
  if(dc) frog.facing=dc;
  frog.hop={fx:frog.x,fy:frog.y,t:0,dur:0.11};
  puff(frog.x+0.5,frog.y+0.5,4); sfx.hop();
  return true;
}
function tryMove(dc,dr){
  if(state!=='playing'||frog.jump) return;
  var ready=!frog.hop||frog.hop.t/frog.hop.dur>=0.62;
  if(!ready){ buffer={dc:dc,dr:dr,t:simT}; return; }
  doMove(dc,dr);
}
function doJump(){
  if(state!=='playing'||frog.jump||frog.hop) return;
  frog.jump={t:0,dur:0.55}; sfx.jump();
}

/* ---------- scoring ---------- */
function setScore(v,pop){ score=v; elScore.textContent=fmt(score); if(pop){elScore.classList.remove('pop'); void elScore.offsetWidth; elScore.classList.add('pop');} }
function fmt(n){ return n.toLocaleString('en-US'); }
function checkGoal(){
  if(frog.row!==GOAL_ROW||frog.hop||frog.z>0.05) return;
  var ci=GOALS.indexOf(frog.col); if(ci<0||goalsFilled[ci]) return;
  goalsFilled[ci]=true; padPop[ci]=simT; streak++; totalGoals++;
  var pts=100+Math.min(streak-1,4)*25; setScore(score+pts,true);
  sfx.goal(streak); confetti(frog.x+0.5,frog.y+0.5);
  toastEl.textContent='+'+pts+(streak>1?'  COMBO ×'+streak:''); showToast();
  updateHUD();
  if(goalsFilled.every(Boolean)){
    var bonus=Math.max(1,Math.ceil(timeLeft))*10; setScore(score+bonus,true);
    sfx.fanfare(); setTimeout(function(){ toastEl.textContent='🌿 ALL LILIES! +'+bonus+' TIME BONUS'; showToast(); },450);
    celebrateT=1.35; state='celebrate';
  }
}
function updateHUD(){
  elBest.textContent=fmt(Math.max(best,score));
  var s=''; for(var i=0;i<3;i++) s+='<span class="'+(i<lives?'':'off')+'">🐸</span>';
  elLives.innerHTML=s;
  elStreakVal.textContent='×'+streak;
  elStreakChip.classList.toggle('on',streak>=2);
}

/* ---------- frog update ---------- */
function updateFrog(dt){
  if(frog.invuln>0) frog.invuln-=dt;
  frog.landT+=dt;
  // blink
  if(frog.blinkT>0) frog.blinkT-=dt; else { frog.nextBlink-=dt; if(frog.nextBlink<=0){ frog.blinkT=0.13; frog.nextBlink=2+Math.random()*3; } }

  if(state==='dead'){
    deadT+=dt;
    if(deadT>1.05){ lives--; updateHUD(); if(lives<=0) gameOver(); else respawn(); }
    return;
  }
  if(state!=='playing'&&state!=='celebrate') return;
  if(state==='celebrate'){
    celebrateT-=dt;
    if(celebrateT<=0){
      goalsFilled=[false,false,false,false,false]; padPop={};
      speedMult=Math.min(2,1+totalGoals*0.07); resetFrog(); state='playing';
    }
    return;
  }
  // hop
  if(frog.hop){
    var h=frog.hop; h.t+=dt; var p=Math.min(1,h.t/h.dur);
    frog.x=h.fx+(frog.col-h.fx)*p; frog.y=h.fy+(frog.row-h.fy)*p;
    frog.z=0.24*Math.sin(Math.PI*p);
    if(p>=1){ frog.hop=null; frog.z=0; frog.landT=0; sfx.land(); puff(frog.x+0.5,frog.y+0.5,3); }
  } else if(buffer&&simT-buffer.t<0.28){ var b=buffer; buffer=null; doMove(b.dc,b.dr); }
  // jump
  if(frog.jump){
    var j=frog.jump; j.t+=dt; var q=Math.min(1,j.t/j.dur);
    frog.z=HJ*Math.sin(Math.PI*q);
    if(q>=1){ frog.jump=null; frog.z=0; frog.landT=0; sfx.land(); puff(frog.x+0.5,frog.y+0.5,4); }
  }

  var cx=frog.x+0.5, cy=frog.y+0.5;
  // road collisions (only when low enough)
  if(frog.z<HIT_Z&&frog.invuln<=0){
    for(var i=0;i<objects.length;i++){
      var o=objects[i], L=o.lane;
      if(L.type==='log'||L.type==='turtle') continue;
      if(Math.abs(cy-(L.row+0.5))>0.42) continue;
      if(cx>o.x-0.26&&cx<o.x+L.len+0.26){ die('hit'); return; }
    }
  }
  // river riding / drowning
  var r=Math.round(frog.y);
  if(r>=1&&r<=4){
    var carried=null;
    for(var k=0;k<objects.length;k++){
      var o2=objects[k], L2=o2.lane;
      if(L2.row!==r) continue;
      if(cx>o2.x-0.3&&cx<o2.x+L2.len+0.3){
        if(L2.type==='turtle'&&L2.dive&&diveState(o2)>0.15) continue;
        carried=o2; break;
      }
    }
    if(carried){ frog.x+=carried.dx; }
    else { die('drown'); return; }
  }
  if(cx<-0.05||cx>COLS+0.05){ die('drown'); return; }

  // timer
  timeLeft-=dt;
  var sec=Math.ceil(timeLeft);
  if(timeLeft<10&&sec!==lastTickSec){ lastTickSec=sec; sfx.tick(); elTimeChip.classList.add('low'); }
  if(timeLeft<=0){ timeLeft=0; die('time'); return; }

  checkGoal();
}

var KEYMAP={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
window.addEventListener('keydown',function(e){
  var c=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(c)>=0) e.preventDefault();
  audio();
  if(c==='KeyR'){ if(state!=='menu') resetRun(); return; }
  if(c==='KeyP'||c==='Escape'){ if(state==='playing'){ setPaused(true); } else if(state==='paused'){ setPaused(false); } return; }
  if(c==='Enter'||c==='Space'){
    if(state==='menu'||state==='over'){ resetRun(); return; }
    if(state==='paused'){ setPaused(false); return; }
    if(c==='Space'&&state==='playing'){ doJump(); }
  }
  var m=KEYMAP[c];
  if(m) tryMove(m[0],m[1]);
});
window.addEventListener('pointerdown',function(){ audio(); });

/* touch: swipe = move, tap = jump / start */
var tS=null;
stage.addEventListener('touchstart',function(e){
  audio(); if(e.target.closest&&e.target.closest('.btn')) return;
  var t=e.touches[0]; tS={x:t.clientX,y:t.clientY,t:performance.now()};
},{passive:true});
stage.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
stage.addEventListener('touchend',function(e){
  if(!tS) return; var t=e.changedTouches[0];
  var dx=t.clientX-tS.x, dy=t.clientY-tS.y, dt=performance.now()-tS.t; tS=null;
  if(Math.abs(dx)<24&&Math.abs(dy)<24&&dt<350){
    if(state==='menu'||state==='over') resetRun(); else doJump(); return;
  }
  var m=(Math.abs(dx)>Math.abs(dy))?(dx>0?[1,0]:[-1,0]):(dy>0?[0,1]:[0,-1]);
  tryMove(m[0],m[1]);
});

/* ============================== RENDER ============================== */
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function el(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,TAU); }

/* precomputed scenery */
var stars=[],clouds=[],flies=[],speckles=[],patches=[],flowers=[];
(function(){
  var i,r=Math.random;
  for(i=0;i<26;i++) stars.push({x:r(),y:r()*0.4,s:0.6+r()*1.6,ph:r()*TAU});
  for(i=0;i<6;i++) clouds.push({x:r(),y:0.05+r()*0.3,s:0.7+r()*1.2,v:0.004+r()*0.008,a:0.05+r()*0.07});
  for(i=0;i<12;i++) flies.push({x:r(),y:0.3+r()*0.6,ph:r()*TAU,speed:0.4+r()*0.7,hue:Math.random()<0.5?52:95});
  for(i=0;i<70;i++) speckles.push({x:r()*COLS,y:6+r()*4,a:0.04+r()*0.08,s:1+r()*1.6,c:r()<0.5?'#fff':'#000'});
  var gRows=[0,5,10];
  for(i=0;i<26;i++){ var gr=gRows[i%3]; patches.push({row:gr,x:r()*COLS,y:(r()-0.5)*0.5,r:0.25+r()*0.5,d:r()<0.5}); }
  for(i=0;i<18;i++){ var g2=gRows[i%3]; flowers.push({row:g2,x:r()*COLS,y:(r()-0.5)*0.6,c:['#ffe9a0','#ffb3c7','#ffffff'][i%3]}); }
})();

function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1b1240'); g.addColorStop(0.45,'#3d1f5e'); g.addColorStop(0.78,'#8a3a56'); g.addColorStop(1,'#c96b3f');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // stars
  for(var i=0;i<stars.length;i++){ var s=stars[i];
    ctx.globalAlpha=0.3+0.5*Math.abs(Math.sin(simT*1.4+s.ph));
    ctx.fillStyle='#fff'; ctx.fillRect(s.x*W,s.y*H,s.s,s.s); }
  ctx.globalAlpha=1;
  // sun
  var sx=W*0.82, sy=H*0.68;
  var sg=ctx.createRadialGradient(sx,sy,4,sx,sy,90);
  sg.addColorStop(0,'rgba(255,214,140,.9)'); sg.addColorStop(0.35,'rgba(255,170,90,.35)'); sg.addColorStop(1,'rgba(255,150,80,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,90,0,TAU); ctx.fill();
  // clouds
  for(var c2=0;c2<clouds.length;c2++){ var cl=clouds[c2];
    cl.x+=cl.v*0.016; if(cl.x>1.25) cl.x=-0.3;
    ctx.globalAlpha=cl.a; ctx.fillStyle='#f8d9c4';
    el(cl.x*W,cl.y*H,60*cl.s,16*cl.s); ctx.fill();
    el(cl.x*W+38*cl.s,cl.y*H-10*cl.s,36*cl.s,14*cl.s); ctx.fill(); }
  ctx.globalAlpha=1;
  // distant hills
  ctx.fillStyle='rgba(22,12,38,.85)';
  ctx.beginPath(); ctx.moveTo(0,H);
  for(var x=0;x<=W;x+=40) ctx.lineTo(x,H-26-Math.sin(x*0.011)*16-Math.sin(x*0.037)*8);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function drawFlies(){
  for(var i=0;i<flies.length;i++){ var f=flies[i];
    var x=(f.x+Math.sin(simT*f.speed+f.ph)*0.035)*W, y=(f.y+Math.cos(simT*f.speed*0.8+f.ph)*0.03)*H;
    var a=0.25+0.55*Math.abs(Math.sin(simT*2.1+f.ph));
    ctx.globalAlpha=a*0.4; ctx.fillStyle='hsla('+f.hue+',90%,65%,1)'; el(x,y,7,7); ctx.fill();
    ctx.globalAlpha=a; el(x,y,2.1,2.1); ctx.fill(); }
  ctx.globalAlpha=1;
}

function drawWater(){
  var y0=OY+C, h=C*4;
  var g=ctx.createLinearGradient(0,y0,0,y0+h);
  g.addColorStop(0,'#1e5f86'); g.addColorStop(1,'#123a5c');
  ctx.fillStyle=g; ctx.fillRect(OX,y0,COLS*C,h);
  for(var r=1;r<=4;r++){
    var L=LANES[r-1], dir=L.dir, yC=OY+(r+0.5)*C, off=(simT*L.speed*dir)%2.6;
    ctx.strokeStyle='rgba(255,255,255,.13)'; ctx.lineWidth=2; ctx.lineCap='round';
    for(var k=-1;k<7;k++){
      var x=OX+((k*2.6-off)% (COLS+2)+ (COLS+2))*(C/(COLS+2));
      if(x<OX-20||x>OX+COLS*C+20) continue;
      ctx.beginPath();
      ctx.moveTo(x,yC+Math.sin(simT*3+k)*2-C*0.16);
      ctx.quadraticCurveTo(x+C*0.35,yC+Math.sin(simT*3+k+1)*2, x+C*0.7,yC+Math.sin(simT*3+k)*2+C*0.16);
      ctx.stroke();
    }
  }
}
function drawGrassRow(row){
  var y=OY+row*C;
  var g=ctx.createLinearGradient(0,y,0,y+C);
  g.addColorStop(0,'#4f9e3c'); g.addColorStop(1,'#3d7d2e');
  ctx.fillStyle=g; ctx.fillRect(OX,y,COLS*C,C);
  for(var i=0;i<patches.length;i++){ var p=patches[i]; if(p.row!==row) continue;
    ctx.globalAlpha=0.28; ctx.fillStyle=p.d?'#2c5f22':'#63b44a';
    el(OX+p.x*C,y+(0.5+p.y)*C,p.r*C,p.r*C*0.6); ctx.fill(); }
  ctx.globalAlpha=1;
  for(var f=0;f<flowers.length;f++){ var fl=flowers[f]; if(fl.row!==row) continue;
    ctx.fillStyle=fl.c; el(OX+fl.x*C,y+(0.5+fl.y)*C,2.4,2.4); ctx.fill(); }
  // grass blades at edges
  ctx.strokeStyle='rgba(30,70,25,.6)'; ctx.lineWidth=1.5;
  for(var b=0;b<COLS*3;b++){ var bx=OX+((b*0.37)%1)*COLS*C;
    var top=(row!==ROWS-1)?y:y+C, dirr=(row!==ROWS-1)?-1:1;
    ctx.beginPath(); ctx.moveTo(bx,top); ctx.lineTo(bx+2*dirr*Math.sin(simT+b),top+4.5*dirr); ctx.stroke(); }
}
function drawRoad(){
  var y=OY+6*C, h=C*4;
  var g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'#33343f'); g.addColorStop(1,'#262732');
  ctx.fillStyle=g; ctx.fillRect(OX,y,COLS*C,h);
  for(var i=0;i<speckles.length;i++){ var s=speckles[i];
    ctx.globalAlpha=s.a; ctx.fillStyle=s.c; ctx.fillRect(OX+s.x*C,y+(s.y-6)*C,s.s,s.s); }
  ctx.globalAlpha=1;
  // double yellow edges
  ctx.strokeStyle='#d9b23a'; ctx.lineWidth=2.5; ctx.globalAlpha=0.8;
  [y+3,y+h-3].forEach(function(ly){ ctx.beginPath(); ctx.moveTo(OX,ly); ctx.lineTo(OX+COLS*C,ly); ctx.stroke(); });
  // dashed lane dividers
  ctx.strokeStyle='#cfc9a6'; ctx.lineWidth=2; ctx.setLineDash([10,12]); ctx.globalAlpha=0.5;
  for(var r=7;r<=9;r++){ var dy=OY+r*C; ctx.beginPath(); ctx.moveTo(OX,dy); ctx.lineTo(OX+COLS*C,dy); ctx.stroke(); }
  ctx.setLineDash([]); ctx.globalAlpha=1;
}

/* ---------- entities ---------- */
var CARC=['#e8574f','#4f8fe8','#9a6fe0','#5fc98a','#e87bb0','#e07b3f'];
function drawLog(o){
  var L=o.lane, x=OX+o.x*C, cy=OY+(L.row+0.5)*C, w=L.len*C*0.96, h=C*0.56;
  ctx.globalAlpha=0.25; ctx.fillStyle='#04121e'; rr(x+3,cy-h/2+4,w,h,h/2); ctx.fill(); ctx.globalAlpha=1;
  var g=ctx.createLinearGradient(0,cy-h/2,0,cy+h/2);
  g.addColorStop(0,'#a9713a'); g.addColorStop(1,'#75481f');
  ctx.fillStyle=g; rr(x,cy-h/2,w,h,h/2); ctx.fill();
  ctx.strokeStyle='#543312'; ctx.lineWidth=2; rr(x,cy-h/2,w,h,h/2); ctx.stroke();
  ctx.strokeStyle='rgba(60,35,10,.4)'; ctx.lineWidth=1.5;
  for(var i=1;i<3;i++){ var ly=cy-h/2+h*i/3; ctx.beginPath(); ctx.moveTo(x+8,ly); ctx.lineTo(x+w-8,ly); ctx.stroke(); }
  [x+w/2-h*0.5,x+w/2+h*0.5].forEach(function(ex){
    ctx.fillStyle='#d9a76b'; ctx.beginPath(); ctx.arc(ex,cy,h*0.42,0,TAU); ctx.fill();
    ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(ex,cy,h*0.24,0,TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex,cy,h*0.1,0,TAU); ctx.stroke();
  });
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+h*0.4,cy-h/2+3); ctx.lineTo(x+w-h*0.4,cy-h/2+3); ctx.stroke();
}
function drawTurtle(o){
  var L=o.lane, cx=OX+(o.x+L.len/2)*C, cy=OY+(L.row+0.5)*C, s=C*0.3;
  var sink=L.dive?diveState(o):0;
  if(sink>0.86){ // fully under: ripple ring
    ctx.strokeStyle='rgba(210,240,255,'+(0.5*(1-sink/1))+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,s*(1+sink),0,TAU); ctx.stroke(); return;
  }
  var sc=1-sink*0.85, al=1-sink*0.8;
  var shell=L.tc===0?'#4f9e46':'#c8524a', patt=L.tc===0?'#3a7d33':'#96392f', skin=L.tc===0?'#cfe08a':'#e6bfa4';
  ctx.save(); ctx.translate(cx,cy); ctx.scale(sc,sc); ctx.globalAlpha=al;
  ctx.globalAlpha=al*0.3; ctx.fillStyle='#04121e'; el(2,3,s*1.25,s*1.0); ctx.fill(); ctx.globalAlpha=al;
  // flippers
  ctx.fillStyle=skin;
  for(var i=0;i<4;i++){ var ang=(L.dir>0?0:Math.PI)+ (i%2? 0.9:-0.9) + Math.sin(simT*6+i*1.7)*0.25;
    el(Math.cos(ang)*s*1.15,Math.sin(ang)*s*0.8,s*0.42,s*0.26); ctx.fill(); }
  // head
  el(L.dir*s*1.35,0,s*0.5,s*0.42); ctx.fill();
  ctx.fillStyle='#222'; el(L.dir*s*1.5,-s*0.14,s*0.09,s*0.09); ctx.fill(); el(L.dir*s*1.5,s*0.14,s*0.09,s*0.09); ctx.fill();
  // shell
  ctx.fillStyle=shell; el(0,0,s*1.25,s*1.02); ctx.fill();
  ctx.strokeStyle=patt; ctx.lineWidth=2; el(0,0,s*1.25,s*1.02); ctx.stroke();
  ctx.globalAlpha=al*0.5; ctx.fillStyle=patt;
  el(0,0,s*0.4,s*0.34); ctx.fill();
  for(var k=0;k<6;k++){ var a=k/6*TAU+simT*L.dir*0.15; el(Math.cos(a)*s*0.72,Math.sin(a)*s*0.55,s*0.28,s*0.24); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1;
}
function drawVehicle(o){
  var L=o.lane, x=OX+o.x*C, cy=OY+(L.row+0.5)*C, w=L.len*C*0.94, h=C*0.62, d=L.dir;
  ctx.globalAlpha=0.28; ctx.fillStyle='#000'; rr(x-w/2+3,cy-h/2+4,w,h,C*0.14); ctx.fill(); ctx.globalAlpha=1;
  var col;
  if(L.type==='taxi') col='#f2d76e';
  else if(L.type==='truck') col=CARC[o.vk%3];
  else col=CARC[o.vk%CARC.length];
  ctx.fillStyle=col; rr(x-w/2,cy-h/2,w,h,C*0.14); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2; rr(x-w/2,cy-h/2,w,h,C*0.14); ctx.stroke();
  if(L.type==='truck'){
    var cabW=w*0.3, bedX=d>0?x-w/2+cabW:x+w/2-cabW-w*0.68;
    ctx.fillStyle='#9aa0ae'; ctx.fillRect(bedX,cy-h/2+3,w*0.68,h-6);
    ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.lineWidth=1.5;
    for(var i=1;i<4;i++){ var px=bedX+w*0.68*i/4; ctx.beginPath(); ctx.moveTo(px,cy-h/2+4); ctx.lineTo(px,cy+h/2-4); ctx.stroke(); }
    var wx=d>0?x-w/2+cabW*0.55:x+w/2-cabW*0.55;
    ctx.fillStyle='#bfe3f7'; rr(wx-Math.abs(cabW*0.28)/2,cy-h*0.34,Math.abs(cabW*0.28),h*0.68,3); ctx.fill();
  } else {
    var wx=d>0?x+w*0.16:x-w*0.16;
    ctx.fillStyle='#bfe3f7'; rr(wx-w*0.11,cy-h*0.32,w*0.22,h*0.64,3); ctx.fill();
    var rx2=d>0?x-w*0.28:x+w*0.28;
    ctx.fillStyle='#a5cfe6'; rr(rx2-w*0.08,cy-h*0.26,w*0.16,h*0.52,3); ctx.fill();
    if(L.type==='taxi'){
      ctx.fillStyle='#2b2b2b';
      for(var k=0;k<Math.floor(w/9);k++){ if(k%2===0) ctx.fillRect(x-w/2+2+k*(w-4)/Math.floor(w/9),cy-2,((w-4)/Math.floor(w/9))-1,4); }
      ctx.fillStyle='#333'; rr(x-w*0.16,cy-h*0.5,w*0.32,h*0.22,3); ctx.fill();
      ctx.fillStyle='#fff'; ctx.fillRect(x-w*0.08,cy-h*0.44,w*0.05,h*0.09); ctx.fillRect(x+w*0.02,cy-h*0.44,w*0.05,h*0.09);
    }
  }
  var fx=d>0?x+w/2-3:x-w/2+3, bx=d>0?x-w/2+3:x+w/2-3;
  ctx.fillStyle='#ffe9a0'; el(fx,cy-h*0.28,2.6,2.6); ctx.fill(); el(fx,cy+h*0.28,2.6,2.6); ctx.fill();
  ctx.fillStyle='#ff5d4d'; el(bx,cy-h*0.28,2.3,2.3); ctx.fill(); el(bx,cy+h*0.28,2.3,2.3); ctx.fill();
}

function drawPads(){
  for(var i=0;i<GOALS.length;i++){
    var gx=OX+(GOALS[i]+0.5)*C, gy=OY+0.5*C;
    var hg=ctx.createRadialGradient(gx,gy,2,gx,gy,C*0.46);
    hg.addColorStop(0,'#0b1f12'); hg.addColorStop(1,'#143a20');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(gx,gy,C*0.44,0,TAU); ctx.fill();
    if(goalsFilled[i]){
      var pt=simT-(padPop[i]||0), pop=pt<0.35? (1+2.2*Math.pow(pt/0.35,3)*(1-pt/0.35)*4) : 1;
      var br=1+0.04*Math.sin(simT*2.5+i);
      ctx.save(); ctx.translate(gx,gy); ctx.scale(pop*br,pop*br);
      ctx.fillStyle='#5cbf4e'; el(0,C*0.03,C*0.2,C*0.18); ctx.fill();
      ctx.strokeStyle='#2f7d2e'; ctx.lineWidth=2; el(0,C*0.03,C*0.2,C*0.18); ctx.stroke();
      [-1,1].forEach(function(sx){ ctx.fillStyle='#5cbf4e'; ctx.beginPath(); ctx.arc(sx*C*0.1,-C*0.1,C*0.07,0,TAU); ctx.fill();
        ctx.fillStyle='#fff'; el(sx*C*0.1,-C*0.12,C*0.045,C*0.045); ctx.fill();
        ctx.fillStyle='#222'; el(sx*C*0.1,-C*0.13,C*0.02,C*0.02); ctx.fill(); });
      ctx.restore();
    } else {
      var rot=simT*0.3+i, pr=C*(0.34+0.015*Math.sin(simT*2+i));
      ctx.save(); ctx.translate(gx,gy); ctx.rotate(rot);
      ctx.fillStyle='#58b04e'; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,pr,-0.35,TAU-0.35); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1.5;
      for(var v=0;v<4;v++){ ctx.beginPath(); ctx.moveTo(0,0); var va=v/4*TAU+0.5; if(Math.abs(((va-rot)%TAU))>0.35){ ctx.lineTo(Math.cos(va)*pr*0.85,Math.sin(va)*pr*0.85); ctx.stroke(); } }
      ctx.restore();
      ctx.strokeStyle='rgba(182,255,158,'+(0.3+0.2*Math.sin(simT*3+i))+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(gx,gy,C*(0.42+0.02*Math.sin(simT*3+i)),0,TAU); ctx.stroke();
    }
  }
}
function drawStartPad(){
  var gx=OX+(6+0.5)*C, gy=OY+(START_ROW+0.5)*C;
  ctx.fillStyle='#7d8494'; el(gx,gy+C*0.1,C*0.3,C*0.2); ctx.fill();
  ctx.strokeStyle='#5a6070'; ctx.lineWidth=2; el(gx,gy+C*0.1,C*0.3,C*0.2); ctx.stroke();
  if(!frogVisible){
    ctx.strokeStyle='rgba(182,255,158,'+(0.4+0.3*Math.sin(simT*4))+')'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(gx,gy,C*(0.36+0.04*Math.sin(simT*4)),0,TAU); ctx.stroke();
  }
}

function drawFrog(){
  var cxp=OX+(frog.x+0.5)*C, gyp=OY+(frog.y+0.5)*C, z=frog.z;
  // shadow
  ctx.globalAlpha=Math.max(0.08,0.3-z*0.22); ctx.fillStyle='#000';
  el(cxp,gyp+C*0.2,C*0.3*(1-z*0.22),C*0.16*(1-z*0.22)); ctx.fill(); ctx.globalAlpha=1;
  var lift=z*C*0.78, sc=1+z*0.32;
  var lk=Math.max(0,1-frog.landT/0.16), sy2=(1-0.25*lk)*sc, sx2=(1+0.22*lk)*sc;
  if(frog.invuln>0&&state==='playing') ctx.globalAlpha=Math.sin(simT*28)>0?1:0.4;
  var rot=frog.jump? Math.sin(Math.PI*Math.min(1,frog.jump.t/frog.jump.dur))*-frog.facing*0.22 : 0;
  ctx.save(); ctx.translate(cxp,gyp-lift+((z<0.01&&!frog.hop)?Math.sin(simT*3)*C*0.02:0));
  ctx.scale(sx2,sy2); ctx.rotate(rot);
  var R=C*0.34, dead=(state==='dead');
  var body=dead?'#8fa08f':'#6cc24f', dark=dead?'#5c6b5c':'#2f7d2e', belly=dead?'#b9c4b4':'#bfe88a';
  // feet
  ctx.fillStyle=dead?'#77877a':'#4a9e3c';
  el(-R*0.78,R*0.95,R*0.34,R*0.2); ctx.fill(); el(R*0.78,R*0.95,R*0.34,R*0.2); ctx.fill();
  // body
  var bg=ctx.createLinearGradient(0,-R,0,R); bg.addColorStop(0,body); bg.addColorStop(1,dead?'#6b7a6c':'#4a9e3c');
  ctx.fillStyle=bg; el(0,R*0.12,R*1.06,R*0.98); ctx.fill();
  ctx.strokeStyle=dark; ctx.lineWidth=Math.max(2,C*0.05); el(0,R*0.12,R*1.06,R*0.98); ctx.stroke();
  ctx.fillStyle=belly; el(0,R*0.45,R*0.58,R*0.42); ctx.fill();
  // back spots
  if(!dead){ ctx.fillStyle='rgba(31,90,30,.5)'; el(-R*0.3,-R*0.15,R*0.13,R*0.1); ctx.fill(); el(R*0.32,-R*0.08,R*0.11,R*0.09); ctx.fill(); }
  // eyes
  var ex=R*0.56, ey=-R*0.72, blink=frog.blinkT>0;
  [-1,1].forEach(function(s){
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(s*ex,ey,R*0.44,0,TAU); ctx.fill();
    ctx.strokeStyle=dark; ctx.lineWidth=Math.max(1.5,C*0.035); ctx.stroke();
    if(dead){
      ctx.strokeStyle='#333'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(s*ex-R*0.16,ey-R*0.16); ctx.lineTo(s*ex+R*0.16,ey+R*0.16);
      ctx.moveTo(s*ex+R*0.16,ey-R*0.16); ctx.lineTo(s*ex-R*0.16,ey+R*0.16); ctx.stroke();
    } else if(blink){
      ctx.strokeStyle='#2f5d2c'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(s*ex-R*0.22,ey); ctx.lineTo(s*ex+R*0.22,ey); ctx.stroke();
    } else {
      ctx.fillStyle='#fff'; el(s*ex,ey,R*0.3,R*0.3); ctx.fill();
      var px=s*ex+frog.facing*R*0.12;
      ctx.fillStyle='#1c1c1c'; el(px,ey+R*0.04,R*0.15,R*0.15); ctx.fill();
      ctx.fillStyle='#fff'; el(px-R*0.05,ey-R*0.03,R*0.05,R*0.05); ctx.fill();
    }
  });
  // mouth
  if(dead){ ctx.fillStyle='#e88'; el(0,R*0.72,R*0.16,R*0.2); ctx.fill(); }
  else { ctx.strokeStyle='rgba(30,70,25,.8)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,R*0.42,R*0.34,Math.PI*0.25,Math.PI*0.75); ctx.stroke(); }
  ctx.restore(); ctx.globalAlpha=1;
}

function drawParts(){
  for(var i=0;i<parts.length;i++){ var p=parts[i], k=p.t/p.life, sx=OX+p.x*C, sy=OY+p.y*C;
    if(p.type==='dust'){ ctx.fillStyle=p.c+(0.4*(1-k))+')'; el(sx,sy,p.s*C*(1+k*2),p.s*C*(1+k*2)); ctx.fill(); }
    else if(p.type==='dot'){ ctx.globalAlpha=1-k; ctx.fillStyle=p.c; el(sx,sy,p.s*C,p.s*C); ctx.fill(); ctx.globalAlpha=1; }
    else if(p.type==='ring'){ ctx.strokeStyle=p.c; ctx.globalAlpha=1-k; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sx,sy,(p.s+k*1.4)*C,0,TAU); ctx.stroke(); ctx.globalAlpha=1; }
    else if(p.type==='conf'){ ctx.save(); ctx.translate(sx,sy); ctx.rotate(p.rot); ctx.globalAlpha=1-k*k; ctx.fillStyle=p.c; ctx.fillRect(-p.s*C,-p.s*C*0.5,p.s*C*2,p.s*C); ctx.restore(); ctx.globalAlpha=1; }
  }
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky();
  // shake
  var shx=0,shy=0;
  if(shakeT>0){ shakeT-=0.016; shx=(Math.random()-0.5)*shakeMag*(shakeT/0.35); shy=(Math.random()-0.5)*shakeMag*(shakeT/0.35); }
  ctx.save(); ctx.translate(shx,shy);
  // field shadow + frame
  ctx.fillStyle='rgba(0,0,0,.4)'; rr(OX+6,OY+8,COLS*C,ROWS*C,10); ctx.fill();
  drawWater();
  [0,5,10].forEach(drawGrassRow);
  drawRoad();
  // objects by row
  for(var r=1;r<=9;r++){
    for(var i=0;i<objects.length;i++){ var o=objects[i]; if(o.lane.row!==r) continue;
      if(o.lane.type==='log') drawLog(o); else if(o.lane.type==='turtle') drawTurtle(o); else drawVehicle(o); }
  }
  drawPads(); drawStartPad();
  if(frogVisible) drawFrog();
  drawParts();
  ctx.restore();
  // frame stroke
  ctx.strokeStyle='rgba(255,214,120,.28)'; ctx.lineWidth=2; rr(OX-3,OY-3,COLS*C+6,ROWS*C+6,12); ctx.stroke();
  drawFlies();
  if(hitFlash>0){ hitFlash=Math.max(0,hitFlash-0.04); ctx.fillStyle='rgba(255,70,50,'+(hitFlash*0.3)+')'; ctx.fillRect(0,0,W,H); }
  ctx.fillStyle=VIG; ctx.fillRect(0,0,W,H);
}

/* ============================== HUD LOOP BITS ============================== */
function hudTick(){
  var f=Math.max(0,timeLeft/TIME_MAX);
  elTimeFill.style.width=(f*100)+'%';
  var hue=f*105;
  elTimeFill.style.background='hsl('+hue+',72%,55%)';
}

/* ============================== MAIN LOOP ============================== */
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state!=='paused'){ simT+=dt; tWorld+=dt; }
  if(state!=='paused') updateWorld(dt);
  updateFrog(dt);
  if(state!=='paused') updateParts(dt);
  // crickets
  nextChirp-=dt;
  if(nextChirp<=0&&AC){
    for(var i=0;i<3;i++) tone('sine',4200+Math.random()*300,4400,0.035,0.011,i*0.09);
    nextChirp=2.5+Math.random()*4;
  }
  if(state==='playing') hudTick();
  render();
}

/* ============================== BOOT ============================== */
layout(); buildWorld(); resetFrog(); frogVisible=false;
showMenu(); updateHUD(); elTimeFill.style.width='100%';
requestAnimationFrame(frame);
})();
</script>
