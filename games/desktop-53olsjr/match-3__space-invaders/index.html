<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Invaders Match-3</title>
<style>
  :root{
    --mono: ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
    --cyan:#5ee7ff; --gold:#ffd23f; --red:#ff5c7a; --ink:#cfe6ff; --dim:#7f95c9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04050f}
  body{font-family:var(--mono);color:var(--ink);user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0}
  #game{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}

  /* CRT overlay */
  .crt{position:absolute;inset:0;pointer-events:none;z-index:30;
    background:
      radial-gradient(ellipse at center, transparent 52%, rgba(0,0,12,.55) 100%),
      repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
    animation:flick 4s infinite;
  }
  @keyframes flick{0%,100%{opacity:1}50%{opacity:.94}}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;height:58px;z-index:10;display:flex;align-items:center;
    justify-content:space-between;padding:0 18px;gap:12px;
    background:linear-gradient(to bottom, rgba(6,10,26,.92), rgba(6,10,26,0));}
  .stat{display:flex;flex-direction:column;line-height:1.15}
  .stat.center{align-items:center}
  .stat.right{align-items:flex-end}
  .label{font-size:9px;letter-spacing:.32em;color:#5f7bb8}
  .val{font-weight:700;font-size:20px;letter-spacing:.08em}
  .val.cyan{color:#aef4ff;text-shadow:0 0 10px rgba(94,231,255,.7)}
  .val.dim{color:#6f87c0;font-size:15px}
  .val.gold{color:var(--gold);text-shadow:0 0 10px rgba(255,210,63,.6)}
  #muteChip{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#7fe8ff;
    border:1px solid rgba(94,231,255,.35);background:rgba(10,25,45,.5);padding:6px 10px;cursor:pointer}
  #muteChip.off{color:#5a6c96;border-color:#2b3a63;text-decoration:line-through}
  #lvlbar{position:absolute;top:58px;left:0;right:0;height:3px;background:rgba(18,28,58,.7);z-index:9}
  #lvlfill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 8px rgba(94,231,255,.8)}

  #hint{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;
    letter-spacing:.16em;color:#8fa9e0;background:rgba(8,14,32,.72);border:1px solid rgba(94,231,255,.22);
    padding:6px 14px;white-space:nowrap;transition:opacity .9s}
  #hint.off{opacity:0}

  /* Overlays */
  #overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(3,5,14,.78);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .28s}
  #overlay.show{opacity:1;pointer-events:auto}
  .ov-inner{display:flex;flex-direction:column;align-items:center;gap:15px;padding:20px;max-width:94vw;text-align:center}
  .title{font-weight:800;font-size:clamp(26px,6.2vw,54px);letter-spacing:.14em;color:#eaf9ff;line-height:1.05;
    text-shadow:0 0 18px rgba(94,231,255,.85), 3px 0 0 rgba(255,60,120,.5), -3px 0 0 rgba(60,255,220,.5)}
  .title .t2{display:block;font-size:.58em;letter-spacing:.55em;color:var(--gold);margin-top:6px;
    text-shadow:0 0 14px rgba(255,210,63,.9), 2px 0 0 rgba(255,80,80,.5)}
  .title.over-t{color:#ffe3e8;text-shadow:0 0 20px rgba(255,70,110,.9), 3px 0 0 rgba(255,60,60,.55), -3px 0 0 rgba(120,200,255,.4)}
  .title.pause-t{color:#fff3cf;text-shadow:0 0 18px rgba(255,210,63,.9), 2px 0 0 rgba(255,90,60,.5)}
  .tag{color:var(--dim);letter-spacing:.28em;font-size:11px;text-transform:uppercase;line-height:2}
  .ctrls{font-size:12.5px;line-height:2.1;color:#9fb6e8;letter-spacing:.04em}
  .kbd{display:inline-block;border:1px solid #3a4a7a;background:#0d1633;color:#cfe6ff;padding:2px 8px;
    font-size:11px;letter-spacing:.1em;margin:0 2px;box-shadow:0 2px 0 #050914}
  .btn{font-family:var(--mono);font-weight:700;letter-spacing:.22em;font-size:15px;color:#aef4ff;
    background:rgba(10,30,50,.55);border:2px solid #3fd8ff;padding:13px 30px;cursor:pointer;border-radius:0;
    text-shadow:0 0 8px rgba(94,231,255,.7);box-shadow:0 0 16px rgba(63,216,255,.25), inset 0 0 14px rgba(63,216,255,.1);
    transition:background .12s,color .12s,box-shadow .12s,transform .08s}
  .btn:hover{background:#3fd8ff;color:#03121f;text-shadow:none;box-shadow:0 0 30px rgba(94,231,255,.75)}
  .btn:active{transform:translateY(2px)}
  .prompt{font-size:12px;letter-spacing:.3em;color:#8fd8ff;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .hiscore{font-size:12px;letter-spacing:.3em;color:#6f87c0}
  .final{font-size:12px;letter-spacing:.4em;color:#8fa9e0}
  .score-big{font-size:42px;font-weight:800;color:#aef4ff;letter-spacing:.12em;text-shadow:0 0 16px rgba(94,231,255,.8)}
  .newrec{color:var(--gold);text-shadow:0 0 12px rgba(255,210,63,.9);animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
  #mini{filter:drop-shadow(0 0 10px rgba(94,231,255,.35))}
  @media (max-width:600px){ .stat.hi{display:none} .val{font-size:16px} }
  @media (max-height:520px){ .ctrls{display:none} .ov-inner{gap:9px} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="crt"></div>

  <header id="hud">
    <div class="stat"><span class="label">SCORE</span><span id="score" class="val cyan">000000</span></div>
    <div class="stat center hi"><span class="label">HI-SCORE</span><span id="hiscore" class="val dim">000000</span></div>
    <div class="stat center"><span class="label">LEVEL</span><span id="level" class="val gold">1</span></div>
    <div class="stat right">
      <span class="label">SHIELDS</span>
      <canvas id="shields" width="84" height="30"></canvas>
    </div>
    <div id="muteChip">SOUND ON</div>
  </header>
  <div id="lvlbar"><div id="lvlfill"></div></div>
  <div id="hint" class="off">DRAG TO SWAP &nbsp;·&nbsp; ARROWS + SPACE &nbsp;·&nbsp; P PAUSE &nbsp;·&nbsp; M SOUND</div>

  <div id="overlay"></div>
</div>

<script>
(()=>{ 'use strict';
/* ============================== helpers ============================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const irand=n=>(Math.random()*n)|0;
const pad=n=>String(Math.max(0,Math.floor(n))).padStart(6,'0');
const easeInOut=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const easeOutBack=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const MONO='ui-monospace,"Cascadia Mono",Consolas,monospace';
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

/* ============================== canvas ============================== */
const cv=$('#game'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
let cell=40,boardX=0,boardY=0,boardW=0,boardH=0,defenseY=0,cityH=80,maxDrop=100;
let cityCv=null, cityLights=[];

/* ============================== sprites ============================== */
const TYPES=[
 {color:'#5ee7ff',accent:'#0a1030',frames:[
   ["...##..##..","..#######..",".#########.","##.#####.##","###########","..#.###.#..",".#.#.#.#.#.","#..#...#..#"],
   ["...##..##..","..#######..",".#########.","##.#####.##","###########",".#.#####.#.","..#.#.#.#..","...#.#.#..."]]},
 {color:'#ff6ad5',accent:'#0a1030',frames:[
   ["..#......#..","...#....#...","..########..",".##.####.##.","############","#.########.#","#.#......#.#","...#....#..."],
   ["..#......#..","...#....#...","..########..",".##.####.##.","############","#.########.#",".#........#.","#..........#"]]},
 {color:'#ffd23f',accent:'#0a1030',frames:[
   ["...######...","..########..",".##########.",".##..##..##.",".##########.","...##..##...","..#.####.#..","..#......#.."],
   ["...######...","..########..",".##########.",".##..##..##.",".##########.","...##..##...","...#.##..#..",".#..#..#..#."]]},
 {color:'#6bff9e',accent:'#fff6b0',frames:[
   ["....####....","...######...","############","#o#o#o#o#o#o",".##########."],
   ["....####....","...######...","############","o#o#o#o#o#o.",".##########."]]},
 {color:'#ffa14d',accent:'#0a1030',frames:[
   [".#####.","#######","#o###o#","#######","#######","#.#.#.#"],
   [".#####.","#######","#o###o#","#######","#######",".#.#.#."]]},
 {color:'#ff5c7a',accent:'#fff6b0',frames:[
   ["..########..",".##########.","############","##o##o##o###","############",".##########.","..########..","...o....o..."],
   ["..########..",".##########.","############","###o##o##o##","############",".##########.","..########..","....o..o...."]]}
];
const sprites=[], glows=[];
TYPES.forEach(t=>{
  t.frames.map(rows=>{
    const h=rows.length,w=rows[0].length,c=document.createElement('canvas');
    c.width=w;c.height=h;const g=c.getContext('2d');
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const ch=rows[y][x]; if(ch==='.')continue;
      g.fillStyle=ch==='o'?t.accent:t.color; g.fillRect(x,y,1,1);
    }
    return c;
  }).forEach(c=>sprites.push?0:0); // noop guard (populated below)
});
TYPES.forEach(t=>{
  sprites.push(t.frames.map(rows=>{
    const h=rows.length,w=rows[0].length,c=document.createElement('canvas');
    c.width=w;c.height=h;const g=c.getContext('2d');
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const ch=rows[y][x]; if(ch==='.')continue;
      g.fillStyle=ch==='o'?t.accent:t.color; g.fillRect(x,y,1,1);
    }
    return c;
  }));
  const gc=document.createElement('canvas');gc.width=96;gc.height=96;
  const gg=gc.getContext('2d'),[r,g,b]=hexRGB(t.color);
  const gr=gg.createRadialGradient(48,48,2,48,48,48);
  gr.addColorStop(0,`rgba(${r},${g},${b},.55)`);gr.addColorStop(.55,`rgba(${r},${g},${b},.16)`);gr.addColorStop(1,'rgba(0,0,0,0)');
  gg.fillStyle=gr;gg.fillRect(0,0,96,96); glows.push(gc);
});

/* ============================== audio ============================== */
let AC=null,master=null,muted=false,noiseBuf=null;
function audioInit(){
  if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=.28; master.connect(AC.destination);
  }catch(e){}
}
function beep(o){ if(!AC||muted)return; const t0=AC.currentTime+(o.delay||0),t=o.t||.1;
  const os=AC.createOscillator(),g=AC.createGain();
  os.type=o.type||'square'; os.frequency.setValueAtTime(o.f0,t0);
  os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1||o.f0),t0+t);
  g.gain.setValueAtTime(o.vol||.4,t0); g.gain.exponentialRampToValueAtTime(.001,t0+t);
  os.connect(g).connect(master); os.start(t0); os.stop(t0+t+.03);
}
function noiseFx(o){ if(!AC||muted)return; const t0=AC.currentTime+(o.delay||0),t=o.t||.3;
  if(!noiseBuf){const len=AC.sampleRate,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1; noiseBuf=b;}
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=o.type||'lowpass';
  f.frequency.setValueAtTime(o.f||800,t0); f.frequency.exponentialRampToValueAtTime(Math.max(40,(o.f||800)*.15),t0+t);
  const g=AC.createGain();g.gain.setValueAtTime(o.vol||.4,t0);g.gain.exponentialRampToValueAtTime(.001,t0+t);
  s.connect(f).connect(g).connect(master); s.start(t0); s.stop(t0+t+.03);
}
const SFX={
  select(){beep({type:'square',f0:680,f1:920,t:.06,vol:.22});},
  swap(){beep({type:'triangle',f0:300,f1:540,t:.09,vol:.3});},
  bad(){beep({type:'sawtooth',f0:150,f1:85,t:.18,vol:.3});},
  laser(cb){beep({type:'sawtooth',f0:920+cb*70,f1:220,t:.12,vol:.3});noiseFx({t:.1,vol:.12,f:4200,type:'highpass'});},
  boom(sz){noiseFx({t:.28+sz*.06,vol:.5,f:900});beep({type:'sine',f0:130,f1:42,t:.26,vol:.5});},
  shield(){for(let i=0;i<3;i++)beep({type:'square',f0:i%2?440:660,t:.12,vol:.3,delay:i*.13});noiseFx({t:.5,vol:.4,f:500});},
  levelup(){[523,659,784,1047].forEach((f,i)=>beep({type:'square',f0:f,t:.12,vol:.22,delay:i*.09}));},
  over(){[392,330,262,196].forEach((f,i)=>beep({type:'triangle',f0:f,f1:f*.93,t:.32,vol:.35,delay:i*.28}));},
  thump(a){beep({type:'sine',f0:a?62:76,t:.09,vol:.05});},
  shuffle(){beep({type:'triangle',f0:180,f1:760,t:.26,vol:.3});},
  go(){[440,660,880].forEach((f,i)=>beep({type:'square',f0:f,t:.1,vol:.2,delay:i*.07}));}
};

/* ============================== state ============================== */
const COLS=8, ROWS=9;
function loadHi(){try{return +localStorage.getItem('sia_m3_hi')||0}catch(e){return 0}}
function saveHi(v){try{localStorage.setItem('sia_m3_hi',String(v))}catch(e){}}
const grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
const S={screen:'start',score:0,hi:loadHi(),newHi:false,level:1,activeTypes:4,speed:8,shields:3,
  drop:0,dropPause:0,marchT:0,frame:0,state:'idle',sel:null,cursor:{r:4,c:3},hover:null,combo:0,
  swap:null,clearT:0,banner:null,shake:0,flash:0,recoil:0,aimCur:-Math.PI/2,aimTgt:-Math.PI/2,
  boardDead:false,overT:0,overShown:false,boardFlash:0,hintT:99,shootT:3,pDown:null};
let particles=[],beams=[],texts=[],stars=[],shoot=null,T=0;
const COMBO_WORDS=['','','CHAIN ×2','CHAIN ×3','CHAIN ×4!','UNSTOPPABLE!','COSMIC STORM'];

/* ============================== layout / city ============================== */
function genStars(){ stars=[]; const n=clamp(Math.round(W*H/9000),60,240);
  for(let i=0;i<n;i++){const z=irand(3);
    stars.push({x:Math.random()*W,y:Math.random()*H,r:z===2?2:(z===1?1.5:1),tw:rand(.5,2),ph:rand(0,6),
      col:Math.random()<.85?'#cfe4ff':(Math.random()<.5?'#9fd8ff':'#ffd9f0')});}
}
function buildCity(){
  cityCv=document.createElement('canvas');cityCv.width=W;cityCv.height=cityH+6;
  const g=cityCv.getContext('2d'),base=cityCv.height;
  let x=-12;
  while(x<W+20){
    const bw=rand(26,74),bh=rand(cityH*.3,cityH*.95);
    g.fillStyle='#0a1128';g.fillRect(x,base-bh,bw,bh);
    g.fillStyle='rgba(94,231,255,.2)';g.fillRect(x,base-bh,bw,2);
    for(let wy=base-bh+7;wy<base-6;wy+=8)for(let wx=x+4;wx<x+bw-6;wx+=7){
      if(Math.random()<.3){g.fillStyle=Math.random()<.7?`rgba(255,214,120,${rand(.25,.7)})`:`rgba(140,210,255,${rand(.2,.55)})`;g.fillRect(wx,wy,3,4);}}
    if(bw>42&&Math.random()<.5){g.fillStyle='#0a1128';g.fillRect(x+bw/2-1,base-bh-11,2,11);
      g.fillStyle='rgba(255,80,90,.85)';g.fillRect(x+bw/2-1.5,base-bh-13,3,3);}
    x+=bw+rand(4,18);
  }
  cityLights=[]; for(let i=0;i<16;i++)cityLights.push({x:rand(4,W-6),y:rand(defenseY+8,H-8),ph:rand(0,6),sp:rand(1.5,5),col:Math.random()<.6?'#ffd97a':'#9fd8ff'});
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const hudH=58,pad=Math.max(14,W*.03),gap=clamp(H*.12,50,130);
  cityH=clamp(H*.14,60,120); defenseY=H-cityH;
  cell=Math.max(14,Math.floor(Math.min((W-pad*2)/COLS,(defenseY-hudH-10-gap)/ROWS)));
  boardW=cell*COLS;boardH=cell*ROWS;
  boardX=(W-boardW)/2; boardY=hudH+10;
  maxDrop=Math.max(24,defenseY-boardY-boardH-8);
  S.drop=Math.min(S.drop,maxDrop);
  genStars(); buildCity();
}
window.addEventListener('resize',resize);

/* ============================== grid logic ============================== */
const randType=()=>irand(S.activeTypes);
function findMatches(){
  const groups=[],seen=new Set();
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){const v=grid[r][c].t;let e=c+1;
    while(e<COLS&&grid[r][e].t===v)e++;
    if(e-c>=3){const g={cells:[],len:e-c,t:v};for(let i=c;i<e;i++){g.cells.push([r,i]);seen.add(r*COLS+i);}groups.push(g);}c=e;}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){const v=grid[r][c].t;let e=r+1;
    while(e<ROWS&&grid[e][c].t===v)e++;
    if(e-r>=3){const g={cells:[],len:e-r,t:v};for(let i=r;i<e;i++){g.cells.push([i,c]);seen.add(i*COLS+c);}groups.push(g);}r=e;}}
  return {groups,set:seen};
}
function matchAt(r,c){const v=grid[r][c].t;let n=1;
  for(let i=c-1;i>=0&&grid[r][i].t===v;i--)n++; for(let i=c+1;i<COLS&&grid[r][i].t===v;i++)n++; if(n>=3)return true;
  n=1; for(let i=r-1;i>=0&&grid[i][c].t===v;i--)n++; for(let i=r+1;i<ROWS&&grid[i][c].t===v;i++)n++; return n>=3;}
function hasMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c<COLS-1){const a=grid[r][c],b=grid[r][c+1];grid[r][c]=b;grid[r][c+1]=a;
      const ok=matchAt(r,c)||matchAt(r,c+1); grid[r][c]=a;grid[r][c+1]=b; if(ok)return true;}
    if(r<ROWS-1){const a=grid[r][c],b=grid[r+1][c];grid[r][c]=b;grid[r+1][c]=a;
      const ok=matchAt(r,c)||matchAt(r+1,c); grid[r][c]=a;grid[r+1][c]=b; if(ok)return true;}
  } return false;
}
function genGrid(fallIn){
  let guard=0;
  do{ for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      let t; do{t=randType();}while((c>=2&&grid[r][c-1].t===t&&grid[r][c-2].t===t)||(r>=2&&grid[r-1][c].t===t&&grid[r-2][c].t===t));
      grid[r][c]={t,dy:0,vy:0};}
  }while(!hasMove()&&++guard<60);
  if(fallIn)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c].dy=r+1;
}
function swapCells(a,b){const t=grid[a.r][a.c];grid[a.r][a.c]=grid[b.r][b.c];grid[b.r][b.c]=t;}
function applyGravity(){
  const G_N=[];
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){const o=grid[r][c];
      if(o&&!o.dead){grid[write][c]=o;o.dy=write-r;o.vy=0;write--;}}
    const N=write+1; G_N[c]=N;
    for(let r=write;r>=0;r--)grid[r][c]={t:randType(),dy:N,vy:0};
  }
}

/* ============================== fx spawners ============================== */
function burst(x,y,color,n){ if(particles.length>650)return n=Math.min(n,3);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=rand(40,190);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,g:380,life:rand(.35,.75),max:.75,size:rand(2,5),color});}}
function aimAt(x,y){S.aimTgt=Math.atan2(y-(H-18),x-W/2);}

/* ============================== flow ============================== */
function attemptSwap(a,b){
  if(S.state!=='idle'||S.screen!=='play')return;
  if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1)return;
  swapCells(a,b); const res=findMatches(); swapCells(a,b);
  SFX.swap(); S.swap={a,b,q:0,res}; S.state='swap';
}
function commitSwap(){const sw=S.swap;swapCells(sw.a,sw.b);S.swap=null;beginClear(sw.res,1);}
function beginClear(m,combo){
  S.state='clear';S.clearT=0;S.combo=combo;S.recoil=1;
  let total=0;
  for(const g of m.groups){
    const pts=10*g.len*combo+(g.len>=5?50*combo:0); total+=pts;
    let cx=0,cy=0;
    for(const [r,c] of g.cells){cx+=boardX+c*cell+cell/2;cy+=boardY+S.drop+r*cell+cell/2;}
    cx/=g.len;cy/=g.len;
    texts.push({text:'+'+pts,x:cx,y:cy,vy:-46,life:1,size:Math.min(23,13+g.len),color:TYPES[g.t].color});
    beams.push({x1:W/2,y1:H-18,x2:cx,y2:cy,life:.22,max:.22,color:TYPES[g.t].color});
    aimAt(cx,cy);
    for(const [r,c] of g.cells){const o=grid[r][c];o.dead=true;
      burst(boardX+c*cell+cell/2,boardY+S.drop+r*cell+cell/2,TYPES[o.t].color,7);}
  }
  S.score+=total;
  S.drop=Math.max(0,S.drop-5*m.groups.length);
  SFX.laser(combo);SFX.boom(m.groups.length>1?1.6:1);
  if(m.groups.length>1||combo>=2)S.shake=Math.max(S.shake,3+Math.min(9,combo*2));
  if(combo>=2)S.banner={text:COMBO_WORDS[Math.min(combo,6)],t:0,color:combo>=4?'#ffd23f':'#aef4ff',big:false};
}
function doGravity(){applyGravity();S.state='fall';}
function settle(){
  S.state='idle';
  const m=findMatches();
  if(m.set.size){beginClear(m,S.combo+1);return;}
  S.combo=0; checkLevel();
  if(!hasMove())doReshuffle();
}
function checkLevel(){
  const nl=1+Math.floor(S.score/500);
  if(nl>S.level){S.level=nl;S.activeTypes=nl===1?4:nl===2?5:6;
    S.speed=Math.min(44,8+(S.level-1)*3.2);
    SFX.levelup();S.banner={text:'LEVEL '+S.level,t:0,color:'#ffd23f',big:true};}
}
function doReshuffle(){
  let tries=0;
  do{for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)grid[r][c].t=randType();tries++;}
  while((findMatches().set.size>0||!hasMove())&&tries<400);
  SFX.shuffle();S.boardFlash=.3;S.banner={text:'RESHUFFLE',t:0,color:'#aef4ff',big:false};
}
function shieldHit(){
  S.shields--;drawShields();SFX.shield();S.flash=.55;S.shake=14;
  for(let i=0;i<26;i++)particles.push({x:rand(0,W),y:defenseY+rand(-6,8),vx:rand(-130,130),vy:rand(-280,-40),g:500,life:rand(.4,.9),max:.9,size:rand(2,5),color:i%2?'#ff5c7a':'#ffd23f'});
  if(S.shields<=0){gameOver();}
  else{S.drop=0;S.dropPause=1.4;texts.push({text:'SHIELD DOWN!',x:W/2,y:defenseY-42,vy:-20,life:1,size:26,color:'#ff5c7a'});}
}
function gameOver(){
  S.screen='over';S.overT=1.0;S.overShown=false;S.sel=null;SFX.over();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const o=grid[r][c];if(o)burst(boardX+c*cell+cell/2,boardY+S.drop+r*cell+cell/2,TYPES[o.t].color,4);}
  S.boardDead=true;S.shake=18;S.flash=.35;
  if(S.score>S.hi){S.hi=S.score;saveHi(S.hi);S.newHi=true;}else S.newHi=false;
}
function startGame(){
  S.score=0;S.newHi=false;S.level=1;S.activeTypes=4;S.speed=8;S.shields=3;
  S.drop=0;S.dropPause=0;S.combo=0;S.swap=null;S.sel=null;S.state='fall';
  S.boardDead=false;S.overShown=false;S.banner=null;S.flash=0;S.hintT=6;
  genGrid(true);S.screen='play';hideOverlay();drawShields();forceHUD();SFX.go();
}
function togglePause(){
  if(S.screen==='play'){S.screen='pause';showOverlay('pause');}
  else if(S.screen==='pause'){S.screen='play';hideOverlay();}
}

/* ============================== HUD / overlays ============================== */
const scoreEl=$('#score'),hiEl=$('#hiscore'),lvEl=$('#level'),lvlFill=$('#lvlfill'),
      hintEl=$('#hint'),ov=$('#overlay'),muteChip=$('#muteChip');
const shCtx=$('#shields').getContext('2d');
let sShown=-1,hShown=-1,lShown=-1;
function forceHUD(){sShown=hShown=lShown=-1;}
function drawShields(){
  shCtx.clearRect(0,0,84,30);
  for(let i=0;i<3;i++){const x=16+i*28,y=27;
    if(i<S.shields){shCtx.fillStyle='#5ee7ff';shCtx.shadowColor='#5ee7ff';shCtx.shadowBlur=9;}
    else{shCtx.fillStyle='rgba(90,120,190,.35)';shCtx.shadowBlur=0;}
    shCtx.beginPath();shCtx.arc(x,y,9,Math.PI,0);shCtx.closePath();shCtx.fill();shCtx.shadowBlur=0;}
}
function updateHUD(){
  if(sShown!==S.score){sShown=S.score;scoreEl.textContent=pad(S.score);lvlFill.style.width=((S.score%500)/5)+'%';}
  if(hShown!==S.hi){hShown=S.hi;hiEl.textContent=pad(S.hi);}
  if(lShown!==S.level){lShown=S.level;lvEl.textContent=S.level;}
}
function toggleMute(){muted=!muted;muteChip.textContent=muted?'SOUND OFF':'SOUND ON';muteChip.classList.toggle('off',muted);if(!muted)audioInit();}
muteChip.addEventListener('click',e=>{e.stopPropagation();toggleMute();});

/* ============================== input ============================== */
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter'].includes(k))e.preventDefault();
  audioInit();
  if(S.screen==='start'){if(k==='Enter'||k==='Space')startGame();return;}
  if(S.screen==='over'){if(k==='Enter'||k==='Space'||k==='KeyR')startGame();return;}
  if(k==='KeyM'){toggleMute();return;}
  if(k==='KeyP'||k==='Escape'){togglePause();return;}
  if(k==='KeyR'){startGame();return;}
  if(S.screen==='pause'){if(k==='Enter')togglePause();return;}
  const dir={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[k];
  if(dir){
    const [dr,dc]=dir;
    if(S.sel){const nr=S.sel.r+dr,nc=S.sel.c+dc;
      S.cursor={r:clamp(nr,0,ROWS-1),c:clamp(nc,0,COLS-1)};
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)attemptSwap(S.sel,S.cursor);
      S.sel=null;return;}
    S.cursor={r:clamp(S.cursor.r+dr,0,ROWS-1),c:clamp(S.cursor.c+dc,0,COLS-1)};return;
  }
  if((k==='Space'||k==='Enter')&&!e.repeat){
    if(S.state!=='idle')return;
    if(S.sel&&S.sel.r===S.cursor.r&&S.sel.c===S.cursor.c)S.sel=null;
    else{S.sel={...S.cursor};SFX.select();}
  }
});
function pos(e){return {x:e.clientX,y:e.clientY};}
function cellAt(p){
  if(S.screen!=='play')return null;
  const c=Math.floor((p.x-boardX)/cell),r=Math.floor((p.y-(boardY+S.drop))/cell);
  return (c<0||c>=COLS||r<0||r>=ROWS)?null:{r,c};
}
cv.addEventListener('pointerdown',e=>{audioInit();const p=pos(e);
  S.pDown={x:p.x,y:p.y,cell:cellAt(p),done:false};});
window.addEventListener('pointermove',e=>{
  const p=pos(e);S.hover=cellAt(p);
  if(S.pDown&&!S.pDown.done&&S.pDown.cell){
    const dx=p.x-S.pDown.x,dy=p.y-S.pDown.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))>cell*.5){
      const a=S.pDown.cell;let t;
      if(Math.abs(dx)>Math.abs(dy))t={r:a.r,c:clamp(a.c+(dx>0?1:-1),0,COLS-1)};
      else t={r:clamp(a.r+(dy>0?1:-1),0,ROWS-1),c:a.c};
      if(t.r!==a.r||t.c!==a.c)attemptSwap(a,t);
      S.pDown.done=true;
    }
  }
});
window.addEventListener('pointerup',()=>{
  const pd=S.pDown;S.pDown=null;
  if(pd&&!pd.done&&S.screen==='play'){
    const c=pd.cell;if(!c||S.state!=='idle')return;
    S.cursor=c;
    if(!S.sel){S.sel={...c};SFX.select();}
    else if(S.sel.r===c.r&&S.sel.c===c.c)S.sel=null;
    else if(Math.abs(S.sel.r-c.r)+Math.abs(S.sel.c-c.c)===1){attemptSwap(S.sel,c);S.sel=null;}
    else{S.sel={...c};SFX.select();}
  }
});
cv.addEventListener('pointerleave',()=>S.hover=null);

/* ============================== update ============================== */
function update(dt){
  // ambience always
  for(const s of stars){s.y+=(4+s.r*9)*dt;if(s.y>H+2){s.y=-2;s.x=Math.random()*W;}}
  S.shootT-=dt;
  if(S.shootT<=0){S.shootT=rand(3,8);shoot={x:rand(W*.1,W*.9),y:rand(20,H*.35),vx:(Math.random()<.5?-1:1)*rand(260,420),vy:rand(90,170),life:.8};}
  if(shoot){shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;shoot.life-=dt;if(shoot.life<=0)shoot=null;}

  // fx always
  for(const p of particles){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
  for(const b of beams)b.life-=dt;
  beams=beams.filter(b=>b.life>0);
  for(const t of texts){t.life-=dt*.9;t.y+=t.vy*dt;}
  texts=texts.filter(t=>t.life>0);
  S.shake*=Math.exp(-5*dt);if(S.shake<.1)S.shake=0;
  S.flash=Math.max(0,S.flash-dt*1.4);
  S.recoil*=Math.exp(-7*dt);
  S.boardFlash=Math.max(0,S.boardFlash-dt*1.2);
  S.aimCur+=(S.aimTgt-S.aimCur)*Math.min(1,dt*14);
  if(S.banner){S.banner.t+=dt;if(S.banner.t>1.5)S.banner=null;}

  // march (attract + play)
  if(S.screen==='play'||S.screen==='start'){
    S.marchT+=dt;
    if(S.marchT>=.5){S.marchT-=.5;S.frame^=1;if(S.screen==='play')SFX.thump(S.frame);}
  }

  if(S.screen==='play'){
    S.hintT-=dt;hintEl.classList.toggle('off',S.hintT<=0);
    if(S.dropPause>0)S.dropPause-=dt;else S.drop+=S.speed*dt;
    if(S.drop>=maxDrop){shieldHit();return;}
    let falling=false;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const o=grid[r][c];
      if(o&&o.dy>0){falling=true;o.vy=Math.min(42,o.vy+70*dt);o.dy-=o.vy*dt;
        if(o.dy<=0){o.dy=0;o.vy=0;}}}
    switch(S.state){
      case 'swap':S.swap.q+=dt/.16;if(S.swap.q>=1){S.swap.q=1;commitSwap();}break;
      case 'revert':S.swap.q-=dt/.16;if(S.swap.q<=0){S.swap=null;S.state='idle';SFX.bad();}break;
      case 'clear':S.clearT+=dt/.24;if(S.clearT>=1)doGravity();break;
      case 'fall':if(!falling)settle();break;
    }
  } else if(S.screen==='over'){
    S.overT-=dt;
    if(S.overT<=0&&!S.overShown){S.overShown=true;showOverlay('over');}
  }
}

/* ============================== render ============================== */
function blob(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function drawTile(t,x,y,scale,alpha){
  ctx.globalAlpha=alpha*.55;ctx.imageSmoothingEnabled=true;
  const gs=cell*1.35*scale;ctx.drawImage(glows[t],x-gs/2,y-gs/2,gs,gs);
  ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;
  const spr=sprites[t][S.frame],asp=spr.width/spr.height;
  let h=cell*.8*scale,w=h*asp;if(w>cell*.96){w=cell*.96;h=w/asp;}
  ctx.drawImage(spr,x-w/2,y-h/2,w,h);ctx.globalAlpha=1;
}
function cellPos(rc){return {x:boardX+rc.c*cell+cell/2,y:boardY+S.drop+rc.r*cell+cell/2};}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

function drawBoard(){
  const sw=(S.swap&&(S.state==='swap'||S.state==='revert'))?S.swap:null;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const o=grid[r][c];if(!o)continue;
    if(sw&&((sw.a.r===r&&sw.a.c===c)||(sw.b.r===r&&sw.b.c===c)))continue;
    const x=boardX+c*cell+cell/2,y=boardY+S.drop+r*cell-o.dy*cell+cell/2;
    if(o.dead){if(S.state!=='clear')continue;const k=1-S.clearT;if(k>0)drawTile(o.t,x,y,k,k);continue;}
    let sc=1,yy=y;
    if(S.sel&&S.sel.r===r&&S.sel.c===c&&!sw){yy-=3;sc=1.07;}
    drawTile(o.t,x,yy,sc,1);
  }
  if(sw){
    const q=easeInOut(clamp(sw.q,0,1)),pa=cellPos(sw.a),pb=cellPos(sw.b);
    const sc=1+.18*Math.sin(Math.PI*q);
    drawTile(grid[sw.a.r][sw.a.c].t,pa.x+(pb.x-pa.x)*q,pa.y+(pb.y-pa.y)*q,sc,1);
    drawTile(grid[sw.b.r][sw.b.c].t,pb.x+(pa.x-pb.x)*q,pb.y+(pa.y-pb.y)*q,sc,1);
  }
  if(S.screen==='play'){
    if(S.hover&&!sw){const x=boardX+S.hover.c*cell,y=boardY+S.drop+S.hover.r*cell;
      ctx.strokeStyle='rgba(160,230,255,.3)';ctx.lineWidth=1.5;ctx.strokeRect(x+3,y+3,cell-6,cell-6);}
    if(S.sel&&S.state==='idle'){const x=boardX+S.sel.c*cell,y=boardY+S.drop+S.sel.r*cell-3;
      ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.strokeRect(x+4,y+4,cell-8,cell-8);
      ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.strokeRect(x+3,y+3,cell-6,cell-6);}
    const {r,c}=S.cursor,x0=boardX+c*cell,y0=boardY+S.drop+r*cell,L=cell*.24,m=3;
    ctx.strokeStyle='rgba(255,255,255,'+(.5+.35*Math.sin(T*6)).toFixed(3)+')';ctx.lineWidth=2;
    line(x0+m,y0+m,x0+m+L,y0+m);line(x0+m,y0+m,x0+m,y0+m+L);
    line(x0+cell-m,y0+m,x0+cell-m-L,y0+m);line(x0+cell-m,y0+m,x0+cell-m,y0+m+L);
    line(x0+m,y0+cell-m,x0+m+L,y0+cell-m);line(x0+m,y0+cell-m,x0+m,y0+cell-m-L);
    line(x0+cell-m,y0+cell-m,x0+cell-m-L,y0+cell-m);line(x0+cell-m,y0+cell-m,x0+cell-m,y0+cell-m-L);
  }
}

function render(){
  ctx.imageSmoothingEnabled=false;
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#050714');bg.addColorStop(.6,'#080b20');bg.addColorStop(1,'#0b1028');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  blob(W*.22,H*.3,Math.max(W,H)*.5,'rgba(46,90,180,.10)');
  blob(W*.82,H*.62,Math.max(W,H)*.45,'rgba(170,40,130,.07)');
  blob(W*.55,H*.12,Math.max(W,H)*.35,'rgba(30,170,150,.06)');

  for(const s of stars){ctx.globalAlpha=.25+.6*Math.abs(Math.sin(T*s.tw+s.ph));
    ctx.fillStyle=s.col;ctx.fillRect(s.x,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
  if(shoot){ctx.strokeStyle='rgba(200,230,255,.7)';ctx.lineWidth=1.5;
    line(shoot.x,shoot.y,shoot.x-shoot.vx*.09,shoot.y-shoot.vy*.09);
    ctx.fillStyle='#fff';ctx.fillRect(shoot.x-1,shoot.y-1,2,2);}

  const sx=(Math.random()*2-1)*S.shake,sy=(Math.random()*2-1)*S.shake;
  ctx.save();ctx.translate(sx,sy);

  // city + defense line
  if(cityCv)ctx.drawImage(cityCv,0,defenseY-4);
  for(const l of cityLights){ctx.globalAlpha=.3+.7*Math.abs(Math.sin(T*l.sp+l.ph));
    ctx.fillStyle=l.col;ctx.fillRect(l.x,l.y,2,3);}
  ctx.globalAlpha=1;
  const prox=clamp(S.drop/maxDrop,0,1);
  const R=(94+161*prox)|0,G=(255-191*prox)|0,B=(158-74*prox)|0;
  const pulse=.55+.45*Math.sin(T*(3+prox*9));
  const lg=ctx.createLinearGradient(0,defenseY,0,defenseY+22);
  lg.addColorStop(0,`rgba(${R},${G},${B},${.16+.3*prox})`);lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lg;ctx.fillRect(0,defenseY,W,22);
  ctx.strokeStyle=`rgba(${R},${G},${B},${(.35+.55*pulse).toFixed(3)})`;
  ctx.lineWidth=2;ctx.setLineDash([16,12]);ctx.lineDashOffset=-T*40;
  line(0,defenseY,W,defenseY);ctx.setLineDash([]);

  // cannon
  const bx=W/2,by=H-14,a=S.aimCur,rec=S.recoil*5;
  ctx.save();ctx.translate(bx,by);
  ctx.fillStyle='#101b3d';ctx.beginPath();
  ctx.moveTo(-18,12);ctx.lineTo(18,12);ctx.lineTo(11,-6);ctx.lineTo(-11,-6);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(94,231,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.rotate(a);
  ctx.fillStyle='#1b2c5e';ctx.fillRect(-8-rec,-4.5,34,9);
  ctx.fillStyle='#5ee7ff';ctx.fillRect(20-rec,-4.5,4,9);
  if(S.recoil>.5){ctx.fillStyle=`rgba(190,255,255,${((S.recoil-.5)*1.5).toFixed(3)})`;
    ctx.beginPath();ctx.moveTo(34-rec,-8);ctx.lineTo(48-rec,0);ctx.lineTo(34-rec,8);ctx.closePath();ctx.fill();}
  ctx.restore();

  if(!S.boardDead)drawBoard();

  // beams
  for(const b of beams){const p=1-b.life/b.max,al=b.life/b.max;
    ctx.strokeStyle=b.color;ctx.globalAlpha=al*.35;ctx.lineWidth=7;line(b.x1,b.y1,b.x2,b.y2);
    ctx.globalAlpha=al;ctx.lineWidth=2.5;ctx.strokeStyle='#fff';line(b.x1,b.y1,b.x2,b.y2);
    ctx.globalAlpha=(1-p)*.9;ctx.lineWidth=3;ctx.strokeStyle=b.color;
    ctx.beginPath();ctx.arc(b.x2,b.y2,cell*(.3+p*1.2),0,7);ctx.stroke();}
  ctx.globalAlpha=1;

  // particles
  for(const p of particles){const al=clamp(p.life/p.max,0,1),s=p.size*al+.5;
    ctx.globalAlpha=al;ctx.fillStyle=p.color;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);}
  ctx.globalAlpha=1;

  // floating text
  for(const t of texts){ctx.globalAlpha=clamp(t.life,0,1);
    ctx.font='900 '+t.size+'px '+MONO;ctx.textAlign='center';
    ctx.shadowColor=t.color;ctx.shadowBlur=10;ctx.fillStyle=t.color;
    ctx.fillText(t.text,t.x,t.y);}
  ctx.shadowBlur=0;ctx.globalAlpha=1;

  // banner
  if(S.banner){const b=S.banner,inT=Math.min(1,b.t*4),out=b.t>1?1-(b.t-1)/.5:1;
    if(out<=0)S.banner=null;else{
      const s=easeOutBack(inT)*(b.big?1.15:.85);
      ctx.save();ctx.translate(W/2,boardY+boardH*.42);ctx.scale(s,s);
      ctx.globalAlpha=clamp(out,0,1);ctx.font='900 '+(b.big?38:30)+'px '+MONO;ctx.textAlign='center';
      ctx.shadowColor=b.color;ctx.shadowBlur=16;ctx.fillStyle=b.color;ctx.fillText(b.text,0,0);
      ctx.restore();ctx.shadowBlur=0;ctx.globalAlpha=1;}}

  if(S.boardFlash>0){ctx.fillStyle=`rgba(160,240,255,${(S.boardFlash*.5).toFixed(3)})`;
    ctx.fillRect(boardX-6,boardY+S.drop-6,boardW+12,boardH+12);}
  ctx.restore();

  if(S.flash>0){ctx.fillStyle=`rgba(255,45,80,${(Math.min(.5,S.flash)*.9).toFixed(3)})`;ctx.fillRect(0,0,W,H);}

  updateHUD();

  // attract mini canvas
  const m=document.getElementById('mini');
  if(m&&S.screen==='start'){const g=m.getContext('2d');g.imageSmoothingEnabled=false;
    g.clearRect(0,0,m.width,m.height);
    for(let i=0;i<3;i++){const spr=sprites[i][S.frame],asp=spr.width/spr.height;
      let w=46,h=w/asp;if(h>48){h=48;w=h*asp;}
      const x=m.width/2+(i-1)*64,y=m.height/2+Math.sin(T*2.8+i*1.7)*6;
      g.drawImage(spr,x-w/2,y-h/2,w,h);}}
}

/* ============================== boot ============================== */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;T+=dt;
  update(dt);render();}
resize();
genGrid(false);
drawShields();
showOverlay('start');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
