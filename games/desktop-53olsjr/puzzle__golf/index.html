<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Putt Paradox — Puzzle Golf</title>
<style>
:root{
  --disp: Impact,'Arial Black','Franklin Gothic Bold',sans-serif;
  --body:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  --flavor: Georgia,'Times New Roman',serif;
  --cream:#f6ecd4; --ink:#241708; --coral:#ff5340; --gold:#ffc94b; --teal:#3fd8c2;
  --felt:#1a8a5c; --wood:#8a5a33; --wood-d:#5e3b1f; --bg:#061a12;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none}
body{
  font-family:var(--body); color:var(--cream);
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 3px, transparent 3px 9px),
    radial-gradient(1300px 780px at 50% 36%, #144531 0%, #0b2a1f 52%, #05150e 100%);
}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#gamebox{position:relative;box-shadow:0 34px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(246,236,212,.08)}
canvas{display:block;cursor:crosshair}
canvas.aiming{cursor:grabbing}

/* ---------- HUD ---------- */
#hud{position:absolute;top:.7em;left:.7em;right:.7em;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.chip{display:flex;align-items:center;gap:.55em;background:rgba(5,24,16,.78);border:2px solid rgba(246,236,212,.28);border-radius:9px;padding:.32em .75em;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.chip .lbl{font-size:.62em;letter-spacing:.18em;opacity:.65;font-weight:bold}
.chip b{font-family:var(--disp);font-size:1.25em;letter-spacing:.04em;color:var(--gold);line-height:1}
.chip i{font-family:var(--flavor);font-style:italic;font-size:.92em;opacity:.85;max-width:16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .sep{width:1px;height:1.3em;background:rgba(246,236,212,.25)}
#muteBtn{pointer-events:auto;border:none;background:transparent;color:var(--cream);font-size:1.15em;cursor:pointer;padding:0 .2em;line-height:1}
#muteBtn.off{opacity:.4;text-decoration:line-through}

/* scorecard strip */
#card{position:absolute;bottom:.7em;left:50%;transform:translateX(-50%);display:flex;gap:.32em;z-index:5}
.cell{width:2.15em;height:2.15em;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:.95em;border-radius:6px;background:rgba(5,24,16,.7);border:2px solid rgba(246,236,212,.18);color:rgba(246,236,212,.4)}
.cell.cur{border-color:var(--gold);color:var(--cream);animation:cellPulse 1.4s ease-in-out infinite}
.cell.good{background:var(--gold);color:var(--ink);border-color:#8a6a12}
.cell.bad{background:rgba(255,83,64,.28);color:#ffb0a3;border-color:rgba(255,83,64,.5)}
@keyframes cellPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,75,0)}50%{box-shadow:0 0 0 .28em rgba(255,201,75,.28)}}
#keysHint{position:absolute;bottom:.75em;right:.9em;font-size:.62em;letter-spacing:.14em;opacity:.4;z-index:5}

/* toast */
#toast{position:absolute;top:15%;left:0;right:0;text-align:center;pointer-events:none;z-index:6;opacity:0}
#toast .t1{font-family:var(--disp);font-size:2.4em;letter-spacing:.08em;color:var(--cream);text-shadow:.05em .05em 0 var(--coral)}
#toast .t2{font-family:var(--flavor);font-style:italic;font-size:1.05em;opacity:.9;margin-top:.15em}
#toast.show{animation:toastIn 2s ease forwards}
@keyframes toastIn{0%{opacity:0;transform:translateY(-.6em) scale(.94)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(.5em)}}

/* first-putt hint */
#hint{position:absolute;bottom:3.2em;left:50%;transform:translateX(-50%);font-size:.8em;letter-spacing:.06em;background:rgba(5,24,16,.72);border:1px solid rgba(246,236,212,.3);padding:.4em .9em;border-radius:20px;z-index:5;pointer-events:none;transition:opacity .5s}
#hint.hide{opacity:0}

/* ---------- overlay screens ---------- */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:radial-gradient(90% 90% at 50% 45%, rgba(4,18,12,.5), rgba(3,13,9,.78))}
#overlay.soft{background:radial-gradient(90% 90% at 50% 45%, rgba(4,18,12,.34), rgba(3,13,9,.66))}
#overlay.hide{display:none}

.startWrap{text-align:center;padding:1em;max-width:34em}
.eyebrow{font-size:.7em;letter-spacing:.42em;font-weight:bold;color:var(--gold);margin-bottom:.9em}
.flagArt{position:relative;height:5.6em;margin:0 auto .2em;width:6em}
.flagArt i{position:absolute;left:1.1em;top:0;width:.32em;height:5.4em;background:linear-gradient(var(--cream),#cbbf9d);border-radius:.2em}
.flagArt b{position:absolute;left:calc(1.1em + .32em);top:.3em;width:3.4em;height:2em;background:var(--coral);clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:left center;animation:flutter 2.2s ease-in-out infinite;box-shadow:inset 0 -.4em 0 rgba(0,0,0,.18)}
@keyframes flutter{0%,100%{transform:skewY(-5deg) scaleX(1)}50%{transform:skewY(6deg) scaleX(.93)}}
.title{font-family:var(--disp);font-size:clamp(2.6em,7.5vw,4.6em);line-height:.95;letter-spacing:.03em;color:var(--cream);transform:rotate(-1.6deg);text-shadow:.055em .055em 0 var(--coral), .11em .11em 0 rgba(0,0,0,.4)}
.title em{font-style:normal;color:var(--gold);text-shadow:.055em .055em 0 #7a3c08,.11em .11em 0 rgba(0,0,0,.4)}
.tag{font-family:var(--flavor);font-style:italic;font-size:1.02em;opacity:.85;margin:.9em auto 1.2em;line-height:1.5}
.ctlCard{display:inline-block;text-align:left;background:rgba(5,24,16,.72);border:2px solid rgba(246,236,212,.3);border-radius:10px;padding:.8em 1.1em;margin-bottom:1.3em;font-size:.82em;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.ctlCard div{display:flex;align-items:center;gap:.7em;padding:.28em 0}
.keycap{display:inline-block;min-width:1.7em;text-align:center;padding:.12em .45em;border:2px solid rgba(246,236,212,.75);border-bottom-width:4px;border-radius:5px;background:rgba(246,236,212,.12);font-weight:bold;font-size:.95em}
.btn{font-family:var(--disp);letter-spacing:.08em;font-size:1.15em;padding:.55em 1.5em .6em;color:var(--ink);background:var(--cream);border:3px solid var(--ink);border-radius:10px;cursor:pointer;box-shadow:0 .5em 0 var(--wood-d), 0 .9em 0 rgba(0,0,0,.28);transition:transform .07s, box-shadow .07s}
.btn:hover{transform:translateY(-.12em);box-shadow:0 .62em 0 var(--wood-d), 0 1.05em 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(.3em);box-shadow:0 .15em 0 var(--wood-d)}
.btn.primary{background:var(--coral);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bestLine{margin-top:1.1em;font-size:.78em;letter-spacing:.2em;color:var(--gold);font-weight:bold;min-height:1.2em}
.kbdHint{margin-top:.6em;font-size:.68em;opacity:.5;letter-spacing:.08em}

/* ticket panels */
.ticket{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:12px;width:min(22em,88%);box-shadow:0 12px 0 rgba(0,0,0,.4);overflow:hidden;animation:popIn .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.perf{height:.7em;background:repeating-linear-gradient(90deg,var(--ink) 0 .55em,transparent .55em 1.1em);background-size:100% .18em;background-repeat:no-repeat;background-position:center}
.tBody{padding:1.1em 1.4em 1.3em;text-align:center}
.tHole{font-size:.68em;letter-spacing:.3em;font-weight:bold;opacity:.7}
.resWord{font-family:var(--disp);font-size:2.9em;line-height:1.05;margin:.25em 0 .1em;letter-spacing:.02em}
.resSub{font-family:var(--flavor);font-style:italic;font-size:.95em;opacity:.8}
.resTotal{margin-top:.7em;font-weight:bold;font-size:.9em;border-top:2px dashed rgba(36,23,8,.35);padding-top:.6em}
.tBtns{margin-top:1.1em;display:flex;gap:.8em;justify-content:center;flex-wrap:wrap}
.pTitle{font-family:var(--disp);font-size:2.4em;letter-spacing:.06em;margin-bottom:.4em}

/* final scorecard */
.fcTable{width:100%;border-collapse:collapse;font-size:.85em;margin-top:.3em}
.fcTable th{font-size:.62em;letter-spacing:.22em;text-align:left;opacity:.6;padding:.3em .4em;border-bottom:2px solid var(--ink)}
.fcTable td{padding:.28em .4em;border-bottom:1px dotted rgba(36,23,8,.35)}
.fcTable td.n{font-family:var(--disp);font-size:1.05em}
.fcTable tr.tot td{border-top:3px double var(--ink);border-bottom:none;font-weight:bold;padding-top:.5em}
.fcTable .w-good{color:#0e7a4f;font-weight:bold}
.fcTable .w-bad{color:#c2371f;font-weight:bold}
.stamp{display:inline-block;margin-top:1em;font-family:var(--disp);font-size:1.5em;color:var(--coral);border:4px double var(--coral);padding:.28em .9em;transform:rotate(-5deg);letter-spacing:.06em;border-radius:6px}
.newBest{display:inline-block;margin-left:.7em;font-family:var(--disp);background:var(--gold);color:var(--ink);border:3px solid var(--ink);padding:.28em .7em;transform:rotate(3deg);font-size:1.05em;border-radius:6px;animation:cellPulse 1.2s infinite}
</style>
</head>
<body>
<div id="stage">
  <div id="gamebox">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="chip"><span class="lbl">HOLE</span><b id="holeNo">1/9</b><i id="holeName">&nbsp;</i></div>
      <div class="chip"><span class="lbl">STROKES</span><b id="strokeNo">0</b></div>
      <div class="chip"><span class="lbl">PAR</span><b id="parNo">1</b><span class="sep"></span><span class="lbl">TOTAL</span><b id="totNo">±0</b><button id="muteBtn" title="Sound (M)">♪</button></div>
    </div>
    <div id="card"></div>
    <div id="keysHint">R RETRY · P PAUSE · M SOUND</div>
    <div id="toast"></div>
    <div id="hint" class="hide">Drag back from the ball, release to putt</div>
    <div id="overlay" class="hide"></div>
  </div>
</div>

<script>
"use strict";
/* ============================== helpers ============================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hyp=Math.hypot;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ============================== audio ============================== */
const Snd=(()=>{
  let ctx=null,master,noiseBuf,muted=false;
  try{muted=localStorage.getItem('ppMute')==='1';}catch(e){}
  function ensure(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    const comp=ctx.createDynamicsCompressor();
    master=ctx.createGain();master.gain.value=muted?0:.55;
    master.connect(comp);comp.connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function tone(f0,f1,dur,type,vol,when){
    if(!ctx)return;const t=ctx.currentTime+(when||0);
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(Math.max(1,f0),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.3,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.06);
  }
  function noise(dur,vol,f0,f1,when){
    if(!ctx)return;const t=ctx.currentTime+(when||0);
    const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const f=ctx.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol||.3,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);
  }
  return{
    ensure,
    get muted(){return muted;},
    toggle(){muted=!muted;if(master)master.gain.value=muted?0:.55;try{localStorage.setItem('ppMute',muted?'1':'0');}catch(e){}return muted;},
    putt(p){tone(150+p*.12,68,.09,'triangle',.5);noise(.045,.22,900,300);},
    wall(i){noise(.06,clamp(i/900*.55,.06,.5),520,180);},
    bump(chain){const f=430*Math.pow(1.13,chain);tone(f,f*.62,.11,'triangle',.5);noise(.03,.15,1800,700);},
    sink(under){tone(75,40,.18,'sine',.55);tone(392,392,.16,'sine',.32,.06);tone(523,523,.16,'sine',.32,.15);tone(659,659,.2,'sine',.32,.24);if(under)tone(784,784,.3,'sine',.3,.34);},
    splash(){noise(.4,.5,1500,220);tone(220,55,.25,'sine',.22);},
    portal(){tone(300,950,.22,'sine',.32);tone(600,1500,.22,'sine',.14,.04);},
    chime(){tone(660,660,.12,'sine',.18);tone(990,990,.16,'sine',.12,.07);},
    ui(){tone(540,470,.05,'square',.12);}
  };
})();

/* ============================== course data ============================== */
const CW=1000,CH=620,FRAME=34,LW=CW+FRAME*2,LH=CH+FRAME*2;
const BALL_R=9,CUP_R=17,PORT_R=26;
const MAX_POW=920,MIN_POW=75,DRAG_MAX=230,MIN_DRAG=14;
const FRICTION=.8,LIN_DECEL=14,REST_WALL=.72,REST_BUMP=1.12,CAP=10;

const HOLES=[
 {name:'Tee Box Basics',par:1,ball:[150,310],cup:[820,310]},
 {name:'The Dogleg',par:2,ball:[150,150],cup:[855,470],walls:[[505,0,40,430]]},
 {name:'Spike Alley',par:3,ball:[150,310],cup:[855,310],bumpers:[[450,170,26],[560,310,26],[450,450,26]]},
 {name:'The Squeeze',par:3,ball:[150,310],cup:[855,310],walls:[[470,0,60,190],[470,430,60,190]],movers:[{x:470,yMin:190,yMax:320,w:60,h:110,period:2.6}]},
 {name:'Water Line',par:3,ball:[150,140],cup:[855,480],water:[[0,275,690,64],[770,275,230,64]]},
 {name:'Warp Green',par:3,ball:[140,150],cup:[855,470],walls:[[520,0,40,620]],portals:[[300,470,700,150]]},
 {name:'Gravity Garden',par:4,ball:[120,310],cup:[880,310],slopes:[[0,0,260,620,1,0,150],[740,0,260,620,-1,0,150]],bumpers:[[500,310,30],[370,160,20],[630,460,20]]},
 {name:'The Maze',par:4,ball:[130,510],cup:[870,110],walls:[[300,0,40,420],[660,200,40,420]],bumpers:[[480,310,24]]},
 {name:'Grand Finale',par:5,ball:[140,520],cup:[870,90],walls:[[320,180,40,440],[640,120,40,500]],water:[[360,0,230,180]],slopes:[[680,140,320,480,0,-1,140]],bumpers:[[790,270,22]]}
];
const TOTAL_PAR=HOLES.reduce((a,h)=>a+h.par,0);

/* ============================== state ============================== */
let cv=document.getElementById('cv'),box=document.getElementById('gamebox'),ctx=cv.getContext('2d');
let scale=1,state='start',T=0;
let holeIdx=0,strokes=0,results=new Array(HOLES.length).fill(null);
let cur=null,ball={x:0,y:0,vx:0,vy:0},lastShot={x:0,y:0};
let aiming=false,aimPt={x:0,y:0},portalCd=0,lockT=0;
let sinkT=0,sunkFrom={x:0,y:0},flagH=54,flagPulse=0,bumperChain=0,lastBumpT=-9,hintShown=false;
let shake=0,parts=[],rings=[],confetti=[],trail=[];
const motes=[];for(let i=0;i<26;i++)motes.push({x:Math.random()*CW,y:Math.random()*CH,s:4+Math.random()*8,ph:Math.random()*TAU});

/* speckle pattern for felt */
const speck=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');
 for(let i=0;i<520;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';g.fillRect(Math.random()*160,Math.random()*160,1.4,1.4);}
 return g;})();

/* ============================== dom refs ============================== */
const $=id=>document.getElementById(id);
const overlay=$('overlay'),toastEl=$('toast'),hintEl=$('hint'),cardEl=$('card');
const holeNo=$('holeNo'),holeName=$('holeName'),strokeNo=$('strokeNo'),parNo=$('parNo'),totNo=$('totNo'),muteBtn=$('muteBtn');

function buildCard(){cardEl.innerHTML='';for(let i=0;i<HOLES.length;i++){const d=document.createElement('div');d.className='cell';d.title='Hole '+(i+1)+' · par '+HOLES[i].par;cardEl.appendChild(d);}}
buildCard();

function committedDiff(){let s=0,p=0;results.forEach((r,i)=>{if(r!=null){s+=r;p+=HOLES[i].par;}});return s-p;}
function fmtD(d){return d>0?'+'+d:(d<0?''+d:'±0');}

function updateHUD(){
  holeNo.textContent=(holeIdx+1)+'/9';
  holeName.innerHTML='&nbsp;'+cur.name;
  strokeNo.textContent=strokes;
  parNo.textContent=cur.par;
  totNo.textContent=fmtD(committedDiff());
  [...cardEl.children].forEach((c,i)=>{
    c.className='cell'+(i===holeIdx&&state!=='done'?' cur':'')+(results[i]!=null?(results[i]<=HOLES[i].par?' good':' bad'):'' );
    c.textContent=results[i]!=null?results[i]:'·';
  });
}

function showToast(t1,t2){
  toastEl.innerHTML='<div class="t1">'+t1+'</div>'+(t2?'<div class="t2">'+t2+'</div>':'');
  toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');
}

/* ============================== overlay screens ============================== */
function showOverlay(html,soft){overlay.innerHTML=html;overlay.classList.remove('hide');overlay.classList.toggle('soft',!!soft);}
function hideOverlay(){overlay.classList.add('hide');}
function bestLabel(){try{const b=localStorage.getItem('ppBest');return b===null?'':'BEST ROUND  '+fmtD(+b);}catch(e){return'';}}

function renderStart(){
  state='start';
  showOverlay(
   '<div class="startWrap">'+
   '<div class="eyebrow">A NINE-HOLE PUZZLE PUTT · PAR '+TOTAL_PAR+'</div>'+
   '<div class="flagArt"><i></i><b></b></div>'+
   '<h1 class="title">PUTT<br><em>PARADOX</em></h1>'+
   '<p class="tag">Nine impossible greens. One very small ball.<br>Portals, spikes, water — and windless wonder.</p>'+
   '<div class="ctlCard">'+
     '<div><span class="keycap">Drag</span>&nbsp;pull back from the ball &amp; release to putt</div>'+
     '<div><span class="keycap">R</span> retry hole &nbsp;·&nbsp; <span class="keycap">P</span> pause</div>'+
     '<div><span class="keycap">M</span> sound on / off</div>'+
   '</div><br>'+
   '<button class="btn primary" data-act="start">TEE OFF ▸</button>'+
   '<div class="bestLine">'+bestLabel()+'</div>'+
   '<div class="kbdHint">or press <span class="keycap">Enter</span></div>'+
   '</div>',true);
}
function renderPause(){
  showOverlay(
   '<div class="ticket"><div class="perf"></div><div class="tBody">'+
   '<div class="pTitle">PAUSED</div>'+
   '<div class="resSub">Hole '+(holeIdx+1)+' · '+cur.name+'</div>'+
   '<div class="tBtns">'+
     '<button class="btn primary" data-act="resume">RESUME</button>'+
     '<button class="btn" data-act="retry">RETRY HOLE</button>'+
     '<button class="btn" data-act="menu">MENU</button>'+
   '</div></div></div>');
}
function resWord(st,par){
  if(st===1)return['HOLE IN ONE!','#c78a00'];
  const d=st-par;
  if(d<=-3)return['ALBATROSS!','#c78a00'];
  if(d===-2)return['EAGLE!','#c78a00'];
  if(d===-1)return['BIRDIE','#0e7a4f'];
  if(d===0)return['PAR','#241708'];
  if(d===1)return['BOGEY','#c2371f'];
  if(d===2)return['DOUBLE BOGEY','#c2371f'];
  return['+'+d,'#c2371f'];
}
function renderResult(picked){
  const par=cur.par,[w,c]=resWord(strokes,par);
  const last=holeIdx===HOLES.length-1;
  const sTot=results.reduce((a,b)=>a+b,0),pTot=HOLES.slice(0,holeIdx+1).reduce((a,h)=>a+h.par,0);
  showOverlay(
   '<div class="ticket"><div class="perf"></div><div class="tBody">'+
   '<div class="tHole">HOLE '+(holeIdx+1)+' · '+cur.name.toUpperCase()+'</div>'+
   '<div class="resWord" style="color:'+c+'">'+(picked?'PICKED UP':w)+'</div>'+
   '<div class="resSub">'+strokes+' strokes · par '+par+(picked?' · capped at '+CAP:'')+'</div>'+
   '<div class="resTotal">ROUND SO FAR&nbsp; '+fmtD(sTot-pTot)+' &nbsp;('+(sTot)+' / '+(pTot)+')</div>'+
   '<div class="tBtns"><button class="btn primary" data-act="next">'+(last?'SEE SCORECARD ▸':'NEXT HOLE ▸')+'</button></div>'+
   '<div class="kbdHint">Space / Enter</div>'+
   '</div></div></div>');
}
function rankName(d){return d<=-8?'PUTT IMMORTAL':d<=-4?'TOUR GENIUS':d<=0?'SCRATCH PRO':d<=6?'CLUB REGULAR':'FRESH CADDIE';}
function renderFinal(){
  state='done';updateHUD();
  const tot=results.reduce((a,b)=>a+b,0),diff=tot-TOTAL_PAR;
  let newBest=false;try{const b=localStorage.getItem('ppBest');if(b===null||diff<+b){localStorage.setItem('ppBest',''+diff);newBest=true;}else if(diff===+b)newBest=false;}catch(e){}
  let rows='';
  results.forEach((r,i)=>{
    const d=r-HOLES[i].par,[w]=resWord(r,HOLES[i].par);
    rows+='<tr><td class="n">'+(i+1)+'</td><td>'+HOLES[i].name+'</td><td>'+HOLES[i].par+'</td><td class="n">'+r+'</td><td class="'+(d<=0?'w-good':'w-bad')+'">'+(r===1?'ACE':w)+'</td></tr>';
  });
  showOverlay(
   '<div class="ticket" style="width:min(26em,94%)"><div class="perf"></div><div class="tBody">'+
   '<div class="tHole">NINETEEN… I MEAN — FINAL SCORECARD</div>'+
   '<table class="fcTable"><tr><th>HOLE</th><th>NAME</th><th>PAR</th><th>YOU</th><th></th></tr>'+rows+
   '<tr class="tot"><td></td><td>TOTAL</td><td>'+TOTAL_PAR+'</td><td class="n">'+tot+'</td><td class="'+(diff<=0?'w-good':'w-bad')+'">'+fmtD(diff)+'</td></tr></table>'+
   '<div><span class="stamp">'+rankName(diff)+'</span>'+(newBest?'<span class="newBest">NEW BEST!</span>':'')+'</div>'+
   '<div class="tBtns"><button class="btn primary" data-act="again">PLAY AGAIN ▸</button><button class="btn" data-act="menu">MENU</button></div>'+
   '</div></div></div>');
}

/* ============================== flow ============================== */
function loadHole(quiet){
  const H=HOLES[holeIdx];
  cur={name:H.name,par:H.par,
    walls:(H.walls||[]).map(w=>({x:w[0],y:w[1],w:w[2],h:w[3]})),
    bumpers:(H.bumpers||[]).map(b=>({x:b[0],y:b[1],r:b[2],pulse:0})),
    water:H.water||[],slopes:H.slopes||[],portals:H.portals||[],
    movers:(H.movers||[]).map(m=>Object.assign({},m,{cy:m.yMin}))};
  ball.x=H.ball[0];ball.y=H.ball[1];ball.vx=ball.vy=0;
  lastShot={x:ball.x,y:ball.y};
  strokes=0;sinkT=0;portalCd=0;lockT=0;flagH=54;flagPulse=0;bumperChain=0;
  parts=[];rings=[];confetti=[];trail=[];aiming=false;
  updateHUD();
  if(!quiet){showToast('HOLE '+(holeIdx+1),H.name+' — par '+H.par);Snd.chime();}
}
function startGame(){hideOverlay();state='play';loadHole(true);showToast('HOLE 1',cur.name+' — par '+cur.par);Snd.chime();if(holeIdx===0&&!hintShown)hintEl.classList.remove('hide');}
function retryHole(){strokes=0;const H=HOLES[holeIdx];ball.x=H.ball[0];ball.y=H.ball[1];ball.vx=ball.vy=0;lastShot={x:ball.x,y:ball.y};lockT=.3;portalCd=0;parts=[];rings=[];confetti=[];trail=[];state='play';hideOverlay();updateHUD();showToast('RETRY','hole '+(holeIdx+1));}
function pauseGame(){if(state!=='play')return;state='paused';renderPause();}
function resumeGame(){state='play';hideOverlay();}
function toMenu(){loadHole(true);renderStart();}
function playAgain(){results.fill(null);holeIdx=0;hideOverlay();state='play';loadHole(false);}
function nextHole(){
  if(holeIdx>=HOLES.length-1){renderFinal();return;}
  holeIdx++;state='play';loadHole(false);
}
function finishHole(picked){
  results[holeIdx]=Math.min(strokes,CAP);
  state='result';updateHUD();
  if(!picked&&strokes<=cur.par)spawnConfetti(cur.cup?0:0,ball.x,ball.y,strokes<cur.par?60:34);
  renderResult(picked);
}

/* ============================== input ============================== */
function toLog(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW-FRAME,y:(e.clientY-r.top)/r.height*LH-FRAME};}
function ballAtRest(){return state==='play'&&lockT<=0&&hyp(ball.vx,ball.vy)<7;}

cv.addEventListener('pointerdown',e=>{
  Snd.ensure();
  if(state!=='play'||!ballAtRest())return;
  aiming=true;aimPt=toLog(e);cv.classList.add('aiming');
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  e.preventDefault();
});
cv.addEventListener('pointermove',e=>{if(aiming)aimPt=toLog(e);});
function releaseAim(){
  if(!aiming)return;aiming=false;cv.classList.remove('aiming');
  const dx=ball.x-aimPt.x,dy=ball.y-aimPt.y,len=hyp(dx,dy);
  if(len<MIN_DRAG)return;
  const pow=MIN_POW+(MAX_POW-MIN_POW)*Math.pow(clamp(len/DRAG_MAX,0,1),1.2);
  ball.vx=dx/len*pow;ball.vy=dy/len*pow;
  strokes++;lastShot={x:ball.x,y:ball.y};
  Snd.putt(pow);ringFx(ball.x,ball.y,6,34,'rgba(246,236,212,.8)',3);
  updateHUD();
  if(!hintShown){hintShown=true;hintEl.classList.add('hide');}
}
cv.addEventListener('pointerup',releaseAim);
cv.addEventListener('pointercancel',()=>{aiming=false;cv.classList.remove('aiming');});

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();if(e.repeat)return;Snd.ensure();
  if(k==='m'){toggleMute();return;}
  if(state==='start'&&(k===' '||k==='enter')){Snd.ui();startGame();}
  else if(state==='play'){if(k==='r'){Snd.ui();retryHole();}if(k==='p'||k==='escape')pauseGame();}
  else if(state==='paused'){if(k==='p'||k==='escape'||k===' '){Snd.ui();resumeGame();}if(k==='r'){Snd.ui();retryHole();}}
  else if(state==='result'&&(k===' '||k==='enter')){Snd.ui();nextHole();}
  else if(state==='done'&&(k==='enter'||k===' ')){Snd.ui();playAgain();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame();});

overlay.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;Snd.ensure();Snd.ui();
  const act=a.dataset.act;
  if(act==='start')startGame();
  else if(act==='next')nextHole();
  else if(act==='again')playAgain();
  else if(act==='menu'){hideOverlay();toMenu();}
  else if(act==='resume')resumeGame();
  else if(act==='retry')retryHole();
});
function toggleMute(){const m=Snd.toggle();muteBtn.classList.toggle('off',m);muteBtn.title=m?'Sound off (M)':'Sound on (M)';}
muteBtn.addEventListener('click',e=>{e.stopPropagation();Snd.ensure();toggleMute();});
muteBtn.classList.toggle('off',Snd.muted);

/* ============================== physics ============================== */
function moverY(m){const mid=(m.yMin+m.yMax)/2,amp=(m.yMax-m.yMin)/2;return mid+amp*Math.sin(T*TAU/m.period-Math.PI/2);}
function allRects(){const a=cur.walls.slice();for(const m of cur.movers)a.push({x:m.x,y:m.cy,w:m.w,h:m.h});return a;}
function inRect(x,y,s){return x>=s[0]&&x<=s[0]+s[4]&&y>=s[1]&&y<=s[1]+s[5];}

let stepHits=[];
function collideRect(b,rx,ry,rw,rh){
  const cx=clamp(b.x,rx,rx+rw),cy=clamp(b.y,ry,ry+rh);
  let dx=b.x-cx,dy=b.y-cy;const d2=dx*dx+dy*dy;
  if(d2>BALL_R*BALL_R)return;
  let d=Math.sqrt(d2),nx,ny;
  if(d<1e-6){
    const l=b.x-rx,r=rx+rw-b.x,t=b.y-ry,bt=ry+rh-b.y,m=Math.min(l,r,t,bt);
    if(m===l){nx=-1;ny=0;b.x=rx-BALL_R;}else if(m===r){nx=1;ny=0;b.x=rx+rw+BALL_R;}
    else if(m===t){nx=0;ny=-1;b.y=ry-BALL_R;}else{nx=0;ny=1;b.y=ry+rh+BALL_R;}
  }else{nx=dx/d;ny=dy/d;b.x=cx+nx*BALL_R;b.y=cy+ny*BALL_R;}
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){b.vx-=(1+REST_WALL)*vn*nx;b.vy-=(1+REST_WALL)*vn*ny;if(-vn>45)stepHits.push({x:cx,y:cy,nx,ny,i:-vn});}
}

function physics(h){
  stepHits=[];
  for(const s of cur.slopes)if(inRect(ball.x,ball.y,s)){ball.vx+=s[4]*s[6]*h;ball.vy+=s[5]*s[6]*h;}
  ball.x+=ball.vx*h;ball.y+=ball.vy*h;
  const f=Math.exp(-FRICTION*h);ball.vx*=f;ball.vy*=f;
  let sp=hyp(ball.vx,ball.vy);
  if(sp>0){sp=Math.max(0,sp-LIN_DECEL*h);const k=sp/hyp(ball.vx,ball.vy)||0;ball.vx*=k;ball.vy*=k;}
  // boundary
  if(ball.x<BALL_R){ball.x=BALL_R;if(ball.vx<0){if(-ball.vx>45)stepHits.push({x:0,y:ball.y,nx:1,ny:0,i:-ball.vx});ball.vx*=-REST_WALL;}}
  if(ball.x>CW-BALL_R){ball.x=CW-BALL_R;if(ball.vx>0){if(ball.vx>45)stepHits.push({x:CW,y:ball.y,nx:-1,ny:0,i:ball.vx});ball.vx*=-REST_WALL;}}
  if(ball.y<BALL_R){ball.y=BALL_R;if(ball.vy<0){if(-ball.vy>45)stepHits.push({x:ball.x,y:0,nx:0,ny:1,i:-ball.vy});ball.vy*=-REST_WALL;}}
  if(ball.y>CH-BALL_R){ball.y=CH-BALL_R;if(ball.vy>0){if(ball.vy>45)stepHits.push({x:ball.x,y:CH,nx:0,ny:-1,i:ball.vy});ball.vy*=-REST_WALL;}}
  for(const w of allRects())collideRect(ball,w.x,w.y,w.w,w.h);
  // bumpers
  for(const b of cur.bumpers){
    let dx=ball.x-b.x,dy=ball.y-b.y,d=hyp(dx,dy),min=BALL_R+b.r;
    if(d<min){
      if(d<1e-6){dx=1;d=1;}
      const nx=dx/d,ny=dy/d;ball.x=b.x+nx*min;ball.y=b.y+ny*min;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ball.vx-=(1+REST_BUMP)*vn*nx;ball.vy-=(1+REST_BUMP)*vn*ny;}
      let s2=hyp(ball.vx,ball.vy);if(s2<240){const k=240/(s2||1);ball.vx*=k;ball.vy*=k;}
      b.pulse=1;
      if(T-lastBumpT<.9)bumperChain++;else bumperChain=0;lastBumpT=T;
      Snd.bump(Math.min(bumperChain,8));
      shake=Math.min(13,shake+Math.min(5,60/ (b.r)) * .9);
      sparkFx(ball.x,ball.y,nx,ny,7,'#ffc94b');ringFx(b.x,b.y,b.r*.6,b.r*2.1,'rgba(255,201,75,.85)',3);
    }
  }
  // portals
  if(portalCd>0)portalCd-=h;
  else for(const p of cur.portals){
    const dx=ball.x-p[0],dy=ball.y-p[1];
    if(hyp(dx,dy)<PORT_R-4){
      const d=hyp(dx,dy)||1,nx=dx/d,ny=dy/d;
      ringFx(p[0],p[1],6,40,'rgba(255,201,75,.9)',3);ringFx(p[2],p[3],6,40,'rgba(63,216,194,.9)',3);
      ball.x=p[2]+nx*10;ball.y=p[3]+ny*10;portalCd=.35;Snd.portal();shake=Math.min(13,shake+3);
      break;
    }
  }
  // water
  for(const w of cur.water){
    if(ball.x>w[0]&&ball.x<w[0]+w[2]&&ball.y>w[1]&&ball.y<w[1]+w[3]){splash();break;}
  }
  // cup
  const cdx=ball.x-cur.cup[0],cdy=ball.y-cur.cup[1],d=hyp(cdx,cdy),spd=hyp(ball.vx,ball.vy);
  if(d<30&&d>0.001){const a=700*(1-d/30)*h;ball.vx-=cdx/d*a;ball.vy-=cdy/d*a;}
  if(d<13&&spd<240)sink();
  // rest
  const s3=hyp(ball.vx,ball.vy);
  if(s3<7){ball.vx=ball.vy=0;if(bumperChain>0)bumperChain=0;
    if(strokes>0&&strokes>=CAP)finishHole(true);}
}
function splash(){
  Snd.splash();shake=Math.min(13,shake+5);
  for(let i=0;i<18;i++){const a=Math.random()*TAU,s=60+Math.random()*220;
    parts.push({x:ball.x,y:ball.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-140,l:.7,c:'#7fc4ff',r:2+Math.random()*3,g:520});}
  ringFx(ball.x,ball.y,8,46,'rgba(127,196,255,.9)',3);
  strokes++;lockT=.5;ball.x=lastShot.x;ball.y=lastShot.y;ball.vx=ball.vy=0;
  showToast('SPLASH!','+1 penalty stroke');updateHUD();
}
function sink(){
  if(state!=='play')return;
  state='sinking';sinkT=0;sunkFrom={x:ball.x,y:ball.y};flagPulse=1;
  Snd.sink(strokes<cur.par);shake=Math.min(13,shake+5);
}

/* ============================== fx ============================== */
function sparkFx(x,y,nx,ny,n,col){for(let i=0;i<n;i++){const a=Math.atan2(ny,nx)+(Math.random()-.5)*2.2,s=90+Math.random()*260;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.45,c:col,r:1.6+Math.random()*2,g:0});}}
function ringFx(x,y,r0,r1,col,w){rings.push({x,y,r0,r1,l:1,col,w});}
const CONF_COLS=['#ffc94b','#ff5340','#3fd8c2','#f6ecd4'];
function spawnConfetti(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=120+Math.random()*340;confetti.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-260,rot:Math.random()*TAU,vr:(Math.random()-.5)*12,c:CONF_COLS[i%4],w:4+Math.random()*4,h:3+Math.random()*3,l:1.4});}}
function updateFx(dt){
  shake*=Math.exp(-6.5*dt);if(shake<.05)shake=0;
  flagPulse*=Math.exp(-2.4*dt);
  lockT-=dt;
  for(const b of cur.bumpers)b.pulse*=Math.exp(-7*dt);
  for(const m of cur.movers)m.cy=moverY(m);
  parts=parts.filter(p=>(p.l-=dt*1.8)>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;}
  rings=rings.filter(r=>(r.l-=dt*2.4)>0);
  confetti=confetti.filter(c=>(c.l-=dt*.85)>0);
  for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=560*dt;c.rot+=c.vr*dt;c.vx*=Math.exp(-.9*dt);}
  const sp=hyp(ball.vx,ball.vy);
  if(sp>90)trail.push({x:ball.x,y:ball.y,l:1});
  trail=trail.filter(t=>(t.l-=dt*2.4)>0);
  for(const m of motes){m.y-=m.s*dt;m.x+=Math.sin(T*.7+m.ph)*6*dt;if(m.y<-8){m.y=CH+8;m.x=Math.random()*CW;}}
  if(state==='sinking'){sinkT+=dt;if(sinkT>=.5)finishHole(false);}
}

/* ============================== preview sim ============================== */
function simPath(x,y,vx,vy,tMax){
  const pts=[];let hit=false,cupEnd=false,h=1/90,n=Math.ceil(tMax/h),px=x,py=y,pvx=vx,pvy=vy;
  for(let i=0;i<n&&!hit;i++){
    for(const s of cur.slopes)if(inRect(px,py,s)){pvx+=s[4]*s[6]*h;pvy+=s[5]*s[6]*h;}
    const f=Math.exp(-FRICTION*h);pvx*=f;pvy*=f;px+=pvx*h;py+=pvy*h;
    if(px<BALL_R){px=BALL_R;pvx*=-REST_WALL;hit=true;}if(px>CW-BALL_R){px=CW-BALL_R;pvx*=-REST_WALL;hit=true;}
    if(py<BALL_R){py=BALL_R;pvy*=-REST_WALL;hit=true;}if(py>CH-BALL_R){py=CH-BALL_R;pvy*=-REST_WALL;hit=true;}
    for(const w of allRects()){
      const cx=clamp(px,w.x,w.x+w.w),cy=clamp(py,w.y,w.y+w.h);
      let dx=px-cx,dy=py-cy,d=hyp(dx,dy);
      if(d<BALL_R){if(d<1e-6)dx=1;const nx=dx/(d||1),ny=dy/(d||1);px=cx+nx*BALL_R;py=cy+ny*BALL_R;const vn=pvx*nx+pvy*ny;if(vn<0){pvx-=(1+REST_WALL)*vn*nx;pvy-=(1+REST_WALL)*vn*ny;}hit=true;}
    }
    for(const b of cur.bumpers){let dx=px-b.x,dy=py-b.y,d=hyp(dx,dy);if(d<BALL_R+b.r){const nx=dx/(d||1),ny=dy/(d||1);px=b.x+nx*(BALL_R+b.r);py=b.y+ny*(BALL_R+b.r);const vn=pvx*nx+pvy*ny;if(vn<0){pvx-=(1+REST_BUMP)*vn*nx;pvy-=(1+REST_BUMP)*vn*ny;}hit=true;}}
    const cd=hyp(px-cur.cup[0],py-cur.cup[1]);
    if(cd<14&&hyp(pvx,pvy)<280){cupEnd=true;hit=true;}
    if(i%3===0)pts.push({x:px,y:py});
  }
  return{pts,hit,cupEnd};
}

/* ============================== update ============================== */
function update(dt){
  T+=dt;
  updateFx(dt);
  for(const m of cur.movers)m.cy=moverY(m);
  if(state==='play'){
    let acc=Math.min(dt,.05),hh=1/120;
    while(acc>1e-6){const s=Math.min(hh,acc);physics(s);acc-=s;}
  }
  // flag height
  const dCup=hyp(ball.x-cur.cup[0],ball.y-cur.cup[1]);
  const target=(state==='sinking'||state==='result')?20:(dCup<75?32:54);
  flagH+=(target-flagH)*Math.min(1,dt*6);
}

/* ============================== draw ============================== */
function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,LW,LH);
  const sx=(Math.random()*2-1)*shake,sy=(Math.random()*2-1)*shake;
  ctx.translate(sx,sy);
  drawFrame();
  ctx.save();ctx.translate(FRAME,FRAME);
  drawFelt();drawSlopes();drawWater();drawTee();drawCupHole();drawPortals();drawWalls();drawBumpers();
  // trail
  for(const t of trail){ctx.globalAlpha=t.l*.2;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(t.x,t.y,3+t.l*4,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  drawBall();drawFlag();
  // particles
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  for(const r of rings){const k=1-r.l;ctx.globalAlpha=r.l;ctx.strokeStyle=r.col;ctx.lineWidth=r.w*r.l+.5;ctx.beginPath();ctx.arc(r.x,r.y,lerp(r.r0,r.r1,k),0,TAU);ctx.stroke();}
  ctx.globalAlpha=1;
  for(const c of confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.globalAlpha=Math.min(1,c.l*1.4);ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();}
  ctx.globalAlpha=1;
  drawAim();
  // motes (ambient life)
  for(const m of motes){ctx.globalAlpha=.06+.05*Math.sin(T*2+m.ph);ctx.fillStyle='#f6ecd4';ctx.beginPath();ctx.arc(m.x,m.y,1.4,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  // drifting spotlight
  const gx=CW/2+Math.sin(T*.13)*190,gy=CH/2+Math.cos(T*.09)*150;
  let g=ctx.createRadialGradient(gx,gy,40,gx,gy,420);g.addColorStop(0,'rgba(255,244,214,.06)');g.addColorStop(1,'rgba(255,244,214,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  ctx.restore();
}
function drawFrame(){
  ctx.fillStyle='#8a5a33';ctx.fillRect(0,0,LW,LH);
  // wood grain (ring clip)
  ctx.save();ctx.beginPath();ctx.rect(0,0,LW,LH);ctx.rect(FRAME,FRAME,CW,CH);ctx.clip('evenodd');
  for(let y=0;y<LH;y+=7){ctx.strokeStyle='rgba(60,32,10,'+(.05+.06*Math.sin(y*.8)+ (Math.random()<.02?.08:0))+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(LW,y+Math.sin(y)*2);ctx.stroke();}
  ctx.restore();
  // bevels
  ctx.strokeStyle='rgba(255,235,200,.35)';ctx.lineWidth=2;ctx.strokeRect(2,2,LW-4,LH-4);
  ctx.strokeStyle='rgba(30,15,4,.7)';ctx.strokeRect(FRAME-1.5,FRAME-1.5,CW+3,CH+3);
  // screws
  const cs=[[FRAME/2,FRAME/2],[LW-FRAME/2,FRAME/2],[FRAME/2,LH-FRAME/2],[LW-FRAME/2,LH-FRAME/2]];
  for(const s of cs){ctx.fillStyle='#3a2008';ctx.beginPath();ctx.arc(s[0],s[1],4.5,0,TAU);ctx.fill();ctx.strokeStyle='rgba(255,240,210,.5)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(s[0]-3,s[1]);ctx.lineTo(s[0]+3,s[1]);ctx.stroke();}
}
function drawFelt(){
  for(let x=0;x<CW;x+=64){ctx.fillStyle=(x/64)%2?'#188257':'#1c9160';ctx.fillRect(x,0,64,CH);}
  ctx.globalAlpha=.5;const pat=ctx.createPattern(speck,'repeat');ctx.fillStyle=pat;ctx.fillRect(0,0,CW,CH);ctx.globalAlpha=1;
  let g=ctx.createRadialGradient(CW/2,CH/2,CH*.35,CW/2,CH/2,CW*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,10,6,.34)');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
}
function drawSlopes(){
  for(const s of cur.slopes){
    const ang=Math.atan2(s[5],s[4]),sp=42,off=(T*55)%sp;
    ctx.save();ctx.translate(s[0]+s[4]/2,s[1]+s[5]/2);ctx.rotate(ang);
    ctx.strokeStyle='rgba(246,236,212,.28)';ctx.lineWidth=3;ctx.lineCap='round';
    for(let i=-1;i<Math.ceil(s[4]/sp)+1;i++){const xx=-s[4]/2+i*sp+off;
      for(let j=0;j<Math.ceil(s[5]/34);j++){const yy=-s[5]/2+17+j*34;
        ctx.beginPath();ctx.moveTo(xx-6,yy-8);ctx.lineTo(xx+5,yy);ctx.lineTo(xx-6,yy+8);ctx.stroke();}}
    ctx.restore();
  }
}
function drawWater(){
  for(const w of cur.water){
    const g=ctx.createLinearGradient(0,w[1],0,w[1]+w[3]);g.addColorStop(0,'#2f8fd6');g.addColorStop(1,'#1c548f');
    ctx.fillStyle=g;ctx.fillRect(w[0],w[1],w[2],w[3]);
    ctx.save();ctx.beginPath();ctx.rect(w[0],w[1],w[2],w[3]);ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=2;
    for(let k=0;k<3;k++){const yy=w[1]+(k+1)*w[3]/4;ctx.beginPath();
      for(let x=w[0];x<=w[0]+w[2];x+=9){const y2=yy+Math.sin(x*.05+T*2.2+k*2)*2.6;x===w[0]?ctx.moveTo(x,y2):ctx.lineTo(x,y2);}
      ctx.stroke();}
    ctx.restore();
    ctx.strokeStyle='rgba(10,45,80,.7)';ctx.lineWidth=2;ctx.strokeRect(w[0]+1,w[1]+1,w[2]-2,w[3]-2);
  }
}
function drawTee(){
  const H=HOLES[holeIdx];
  ctx.strokeStyle='rgba(246,236,212,.35)';ctx.lineWidth=2;ctx.setLineDash([4,5]);
  ctx.beginPath();ctx.arc(H.ball[0],H.ball[1],15,0,TAU);ctx.stroke();ctx.setLineDash([]);
}
function drawCupHole(){
  const c=cur.cup;
  let g=ctx.createRadialGradient(c[0]-3,c[1]-4,2,c[0],c[1],CUP_R);
  g.addColorStop(0,'#03150d');g.addColorStop(.75,'#06281b');g.addColorStop(1,'#0a3d29');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c[0],c[1],CUP_R,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(246,236,212,.5)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(c[0],c[1],CUP_R,-2.6,-.6);ctx.stroke();
}
function drawPortals(){
  const cols=['#ffc94b','#3fd8c2'];
  for(let i=0;i<cur.portals.length;i++){const p=cur.portals[i];
    for(let k=0;k<2;k++){
      const x=k?p[2]:p[0],y=k?p[3]:p[1],col=cols[k];
      let g=ctx.createRadialGradient(x,y,4,x,y,52);g.addColorStop(0,col+'');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=.4;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,52,0,TAU);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='rgba(4,18,12,.55)';ctx.beginPath();ctx.arc(x,y,PORT_R-6,0,TAU);ctx.fill();
      ctx.strokeStyle=col;ctx.lineWidth=3.5;ctx.setLineDash([9,7]);ctx.lineDashOffset=(k?-T*42:T*42);
      ctx.beginPath();ctx.arc(x,y,PORT_R-2,0,TAU);ctx.stroke();
      ctx.globalAlpha=.45;ctx.lineWidth=2;ctx.setLineDash([6,10]);ctx.lineDashOffset=(k?T*30:-T*30);
      ctx.beginPath();ctx.arc(x,y,PORT_R+7,0,TAU);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
      for(let j=0;j<3;j++){const a=T*2.4+j*TAU/3+k*2;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x+Math.cos(a)*15,y+Math.sin(a)*15,2.4,0,TAU);ctx.fill();}
    }
  }
}
function drawWalls(){
  const draw=(w,hazard)=>{
    ctx.fillStyle='rgba(0,0,0,.28)';rr(ctx,w.x+3,w.y+5,w.w,w.h,6);ctx.fill();
    if(hazard){
      ctx.save();rr(ctx,w.x,w.y,w.w,w.h,6);ctx.clip();
      ctx.fillStyle='#ff5340';ctx.fillRect(w.x,w.y,w.w,w.h);
      ctx.translate(w.x,w.y);ctx.rotate(-Math.PI/4);ctx.fillStyle='#7a1f12';
      for(let x=-w.h;x<w.w+w.h;x+=26)ctx.fillRect(x,-w.h,13,w.h+w.h*2);
      ctx.restore();
    }else{ctx.fillStyle='#f2e7cd';rr(ctx,w.x,w.y,w.w,w.h,6);ctx.fill();}
    ctx.strokeStyle='rgba(35,20,8,.6)';ctx.lineWidth=2;rr(ctx,w.x,w.y,w.w,w.h,6);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(w.x+5,w.y+3);ctx.lineTo(w.x+w.w-5,w.y+3);ctx.stroke();
  };
  for(const w of cur.walls)draw(w,false);
  for(const m of cur.movers)draw({x:m.x,y:m.cy,w:m.w,h:m.h},true);
}
function drawBumpers(){
  for(const b of cur.bumpers){
    const r=b.r*(1+.22*b.pulse);
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(b.x+3,b.y+5,r,r*.85,0,0,TAU);ctx.fill();
    if(b.pulse>.05){ctx.globalAlpha=b.pulse*.6;ctx.strokeStyle='#ffc94b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(b.x,b.y,r+7,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
    const g=ctx.createRadialGradient(b.x-r*.3,b.y-r*.35,2,b.x,b.y,r);
    g.addColorStop(0,'#ff8a68');g.addColorStop(.6,'#f4502f');g.addColorStop(1,'#b52a17');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.fill();
    ctx.strokeStyle='#f6ecd4';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x-r*.32,b.y-r*.34,r*.16,0,TAU);ctx.fill();
  }
}
function drawBall(){
  if(state==='result')return;
  let x=ball.x,y=ball.y,scl=1;
  if(state==='sinking'){const k=clamp(sinkT/.42,0,1);x=lerp(sunkFrom.x,cur.cup[0],k);y=lerp(sunkFrom.y,cur.cup[1],k);scl=1-k*.9;}
  const sp=hyp(ball.vx,ball.vy);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+3,y+5,BALL_R*scl,BALL_R*.6*scl,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(x,y);
  if(sp>160&&state!=='sinking'){const a=Math.atan2(ball.vy,ball.vx),k=Math.min(.16,sp/4500);ctx.rotate(a);ctx.scale(1+k,1-k*.6);}
  ctx.scale(scl,scl);
  const g=ctx.createRadialGradient(-3.5,-4,1,0,0,BALL_R+1);
  g.addColorStop(0,'#ffffff');g.addColorStop(.75,'#f2efe6');g.addColorStop(1,'#c9c4b4');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,BALL_R,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(60,50,30,.35)';ctx.lineWidth=1;ctx.stroke();
  ctx.restore();
}
function drawFlag(){
  const c=cur.cup,topX=Math.sin(T*2.6)*(3+flagPulse*9);
  ctx.strokeStyle='#e8dcbc';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(c[0],c[1]);ctx.lineTo(c[0]+topX*.4,c[1]-flagH);ctx.stroke();
  const fx=c[0]+topX*.4,fy=c[1]-flagH,flut=Math.sin(T*5.2)*3;
  ctx.fillStyle='#ff5340';ctx.beginPath();
  ctx.moveTo(fx+1.5,fy);ctx.quadraticCurveTo(fx+16,fy-3+flut,fx+30,fy+7+flut);ctx.quadraticCurveTo(fx+16,fy+9+flut*.4,fx+1.5,fy+16);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(120,20,8,.5)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#ffc94b';ctx.beginPath();ctx.arc(fx,fy-1,2.6,0,TAU);ctx.fill();
}
function drawAim(){
  if(!aiming||!ballAtRest())return;
  const dx=ball.x-aimPt.x,dy=ball.y-aimPt.y,len=hyp(dx,dy);
  if(len<6)return;
  const nx=dx/len,ny=dy/len,pow=MIN_POW+(MAX_POW-MIN_POW)*Math.pow(clamp(len/DRAG_MAX,0,1),1.2),frac=pow/MAX_POW;
  // pull band
  ctx.strokeStyle='rgba(246,236,212,.5)';ctx.lineWidth=3;ctx.setLineDash([7,7]);
  ctx.beginPath();ctx.moveTo(aimPt.x,aimPt.y);ctx.lineTo(ball.x,ball.y);ctx.stroke();ctx.setLineDash([]);
  // preview path
  const p=simPath(ball.x,ball.y,nx*pow,ny*pow,.35+.5*frac);
  const n=p.pts.length;
  for(let i=0;i<n;i++){const t=i/Math.max(1,n-1);
    ctx.globalAlpha=(1-t)*.75;ctx.fillStyle='#f6ecd4';
    ctx.beginPath();ctx.arc(p.pts[i].x,p.pts[i].y,4-t*2.2,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  if(p.cupEnd){const e=p.pts[p.pts.length-1];ctx.strokeStyle='#ffc94b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,10,0,TAU);ctx.stroke();}
  else if(p.hit&&n>2){const e=p.pts[n-1],s=5;ctx.strokeStyle='rgba(255,83,64,.9)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(e.x-s,e.y-s);ctx.lineTo(e.x+s,e.y+s);ctx.moveTo(e.x+s,e.y-s);ctx.lineTo(e.x-s,e.y+s);ctx.stroke();}
  // arrow head
  const ax=ball.x+nx*34,ay=ball.y+ny*34,px=-ny,py=nx;
  ctx.fillStyle='#f6ecd4';ctx.beginPath();
  ctx.moveTo(ax+nx*9,ay+ny*9);ctx.lineTo(ax-px*5.5,ay-py*5.5);ctx.lineTo(ax+px*5.5,ay+py*5.5);ctx.closePath();ctx.fill();
  // power arc
  ctx.strokeStyle='rgba(246,236,212,.18)';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(ball.x,ball.y,20,0,TAU);ctx.stroke();
  ctx.strokeStyle='hsl('+(140-130*frac)+',90%,60%)';
  ctx.beginPath();ctx.arc(ball.x,ball.y,20,-Math.PI/2,-Math.PI/2+frac*TAU);ctx.stroke();
}

/* ============================== boot / loop / resize ============================== */
function resize(){
  const vw=innerWidth,vh=innerHeight,s=Math.min(vw/LW,vh/LH)*.985;
  box.style.width=(LW*s)+'px';box.style.height=(LH*s)+'px';
  box.style.fontSize=Math.max(8,15*s)+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(LW*s*dpr);cv.height=Math.round(LH*s*dpr);
  cv.style.width=(LW*s)+'px';cv.style.height=(LH*s)+'px';
  scale=s*dpr;
}
window.addEventListener('resize',resize);

loadHole(true);renderStart();resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
