function textW(str,scale){let w=0;for(const ch of String(str).toUpperCase()){const g=FONT[ch]||FONT[' '];w+=g[0].length+1;}return (w-1)*scale;}
function ptext(str,x,y,scale,color,align,alpha){
  str=String(str).toUpperCase();
  let w=textW(str,scale);
  if(align==='center')x-=w/2; else if(align==='right')x-=w;
  if(alpha===undefined)alpha=1;
  ctx.globalAlpha=alpha; ctx.fillStyle=color;
  let cx=x;
  for(const ch of str){
    const g=FONT[ch]||FONT[' '];
    for(let r=0;r<g.length;r++){const row=g[r];
      for(let c=0;c<row.length;c++) if(row[c]==='#') ctx.fillRect(cx+c*scale,y+r*scale,scale,scale);}
    cx+=(g[0].length+1)*scale;
  }
  ctx.globalAlpha=1;
}

/* ================= AUDIO (WebAudio, post-gesture) ================= */
let AC=null, master=null, noiseBuf=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function beep(f0,f1,dur,type,vol,delay){
  if(!AC)return;
  try{
    const t0=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(Math.max(1,f0),t0);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol||0.15,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);
  }catch(e){}
}
function noise(dur,vol,delay){
  if(!AC)return;
  try{
    const t0=AC.currentTime+(delay||0);
    const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const g=AC.createGain(),f=AC.createBiquadFilter();
    f.type='lowpass';f.frequency.value=2400;
    g.gain.setValueAtTime(vol||0.2,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+0.05);
  }catch(e){}
}
const sfx={
  coin(){beep(987,0,.07,'square',.14);beep(1319,0,.22,'square',.14,.07);},
  dot(s){beep(420+Math.min(s,12)*45,(420+Math.min(s,12)*45)*1.7,.06,'sine',.11);},
  power(){beep(392,0,.08,'square',.12);beep(523,0,.08,'square',.12,.08);beep(784,0,.18,'square',.12,.16);},
  shoot(){beep(1150,260,.07,'triangle',.09);beep(880,180,.06,'square',.06);},
  dry(){beep(140,80,.05,'square',.07);},
  hitG(){beep(230,80,.12,'square',.14);noise(.06,.08);},
  kill(){noise(.28,.2);beep(620,70,.3,'sawtooth',.11);},
  boltFire(){beep(170,55,.3,'sawtooth',.13);},
  charge(){beep(210,420,.18,'sawtooth',.05);},
  boltHit(){noise(.22,.24);beep(110,50,.32,'square',.18);},
  clank(){beep(1250,900,.07,'square',.11);beep(1900,1400,.05,'triangle',.07);},
  pickup(){beep(660,0,.06,'square',.11);beep(880,0,.06,'square',.11,.06);beep(1320,0,.12,'square',.11,.12);},
  jingle(){[523,659,784,1046].forEach((f,i)=>beep(f,0,.14,'triangle',.12,i*.09));},
  over(){[392,330,262,196].forEach((f,i)=>beep(f,f*0.8,.2,'square',.13,i*.18));},
  dash(){beep(300,700,.22,'sawtooth',.07);},
  ui(){beep(760,980,.05,'square',.08);}

/* ================= STATE ================= */
let state='start', paused=false;
let score=0, hi=loadHi(), runStartHi=0, newHi=false, level=1, lives=3;
let vulnT=0, combo=0, frenzyAcc=0, beepFlip=false;
let readyT=0, levelT=0, dyingT=0, overT=0;
let energy=100, fireCd=0, muzzleT=0, rapidT=0, spreadT=0, shieldT=0, invulnT=0, dryT=0;
let shake=0, flashT=0, flashCol='255,70,80';
let t=0, chewT=0, lastDotT=-9, streak=0, ambAcc=0;
let dotsLeft=0, powersLeft=0;

const walls=[], dots=[], powers=[];
for(let y=0;y<ROWS;y++){walls.push([]);dots.push([]);powers.push([]);}

const player={gx:10,gy:9,x:0,y:0,dirX:0,dirY:0,speed:272,r:16,face:-Math.PI/2,moving:false};

  {c:'#ff9ad5',base:206,shooter:false,ai:'flank'},
  {c:'#3fe8d0',base:198,shooter:false,ai:'wander'},
  {c:'#ffa42e',base:202,shooter:true, ai:'lurker'}
];
const ghosts=[];
for(let i=0;i<4;i++){
  const T=TYPES[i];
  ghosts.push({ti:i,color:T.c,base:T.base,shooter:T.shooter,ai:T.ai,r:15,hp:3,speed:120,
    x:0,y:0,gx:0,gy:7,dirX:0,dirY:-1,stun:0,state:'house',bob:Math.random()*6,phase:Math.random()*6,
    exitT:99,fireCd:3,chargeT:0,dashT:0,dashCd:5,deathT:0,deadT:0});
}
const bullets=[], bolts=[], pickups=[], parts=[], floats=[];

function loadHi(){try{return Math.max(0,parseInt(localStorage.getItem('mazeBlasterHi'))||0);}catch(e){return 0;}}
function saveHi(){try{localStorage.setItem('mazeBlasterHi',String(hi));}catch(e){}}

/* ================= GRID HELPERS ================= */
const cellCX=gx=>OFFX+gx*CELL+CELL/2;
const cellCY=gy=>TOP+gy*CELL+CELL/2;
const cellOf=x=>Math.floor((x-OFFX)/CELL);
const rowOf=y=>Math.floor((y-TOP)/CELL);
function openG(gx,gy){if(gx<0||gy<0||gx>=COLS||gy>=ROWS)return false;return !walls[gy][gx];}
function openP(gx,gy){if(!openG(gx,gy))return false;for(const h of HOUSE)if(h[0]===gx&&h[1]===gy)return false;return true;}
function losClear(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0); if(d<2)return true;
  const n=Math.ceil(d/14);
  for(let i=1;i<n;i++){const px=x0+(x1-x0)*i/n,py=y0+(y1-y0)*i/n;if(!openG(cellOf(px),rowOf(py)))return false;}
  return true;
}

/* ================= PRERENDER LAYERS ================= */
const offMaze=document.createElement('canvas'); offMaze.width=W*RS; offMaze.height=H*RS;
const mctx=offMaze.getContext('2d');
const offDots=document.createElement('canvas'); offDots.width=W*RS; offDots.height=H*RS;
const dctx=offDots.getContext('2d');

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function buildMazeLayer(){
  mctx.setTransform(RS,0,0,RS,0,0); mctx.clearRect(0,0,W,H);
  // playfield panel
  rr(mctx,OFFX-16,TOP-16,COLS*CELL+32,ROWS*CELL+32,14);
  mctx.fillStyle='rgba(9,15,38,0.62)'; mctx.fill();
  mctx.strokeStyle='rgba(70,110,255,0.4)'; mctx.lineWidth=2; mctx.stroke();
  // faint grid
  mctx.strokeStyle='rgba(90,130,255,0.05)'; mctx.lineWidth=1;
  for(let gx=0;gx<=COLS;gx++){mctx.beginPath();mctx.moveTo(OFFX+gx*CELL,TOP);mctx.lineTo(OFFX+gx*CELL,TOP+ROWS*CELL);mctx.stroke();}
  for(let gy=0;gy<=ROWS;gy++){mctx.beginPath();mctx.moveTo(OFFX,TOP+gy*CELL);mctx.lineTo(OFFX+COLS*CELL,TOP+gy*CELL);mctx.stroke();}
  // house tint
  mctx.fillStyle='rgba(70,95,220,0.12)';
  for(const h of HOUSE)mctx.fillRect(OFFX+h[0]*CELL+2,TOP+h[1]*CELL+2,CELL-4,CELL-4);
  // wall edge segments
  const segs=[];
  const wallAt=(gx,gy)=>{if(gx<0||gy<0||gx>=COLS||gy>=ROWS)return false;return walls[gy][gx];};
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    if(!walls[gy][gx])continue;
    const x=OFFX+gx*CELL,y=TOP+gy*CELL;
    if(!wallAt(gx-1,gy))segs.push([x+2.5,y+2,x+2.5,y+CELL-2]);
    if(!wallAt(gx+1,gy))segs.push([x+CELL-2.5,y+2,x+CELL-2.5,y+CELL-2]);
    if(!wallAt(gx,gy-1))segs.push([x+2,y+2.5,x+CELL-2,y+2.5]);
    if(!wallAt(gx,gy+1))segs.push([x+2,y+CELL-2.5,x+CELL-2,y+CELL-2.5]);
  }
  const pass=(lw,col)=>{mctx.lineWidth=lw;mctx.strokeStyle=col;mctx.lineCap='round';mctx.beginPath();
    for(const s of segs){mctx.moveTo(s[0],s[1]);mctx.lineTo(s[2],s[3]);} mctx.stroke();};
  pass(7,'rgba(56,96,255,0.30)');
  pass(3,'#4d7dff');
  pass(1.2,'rgba(190,214,255,0.85)');
}

function drawDotAt(c,gx,gy){
  const x=cellCX(gx),y=cellCY(gy);
  const g=c.createRadialGradient(x,y,0,x,y,7);
  g.addColorStop(0,'rgba(255,168,110,0.35)');g.addColorStop(1,'rgba(255,168,110,0)');
  c.fillStyle=g;c.beginPath();c.arc(x,y,7,0,TAU);c.fill();
  c.fillStyle='#ffb27a';c.beginPath();c.arc(x,y,3.4,0,TAU);c.fill();
  c.fillStyle='#fff1dc';c.beginPath();c.arc(x,y,1.8,0,TAU);c.fill();
}
let dotCells=[];
function buildDots(){
  dotsLeft=0;powersLeft=0;dotCells=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const ch=MAZE[y][x];
    walls[y][x]=(ch==='#');dots[y][x]=0;powers[y][x]=0;
    if(ch==='.'){dots[y][x]=1;dotsLeft++;dotCells.push([x,y]);}
    else if(ch==='O'){powers[y][x]=1;powersLeft++;}
  }
  dots[9][10]=0; dotsLeft--; dotCells=dotCells.filter(c=>!(c[0]===10&&c[1]===9));
  dctx.setTransform(RS,0,0,RS,0,0);dctx.clearRect(0,0,W,H);
  for(const c of dotCells)drawDotAt(dctx,c[0],c[1]);
}
function clearDotLayer(gx,gy){dctx.setTransform(RS,0,0,RS,0,0);dctx.clearRect(OFFX+gx*CELL-4,TOP+gy*CELL-4,CELL+8,CELL+8);}

/* ================= SETUP / RESET ================= */
const SLOTS=[[10,-12],[9,6],[11,6],[10,16]];
function resetToHouse(g){
  const s=SLOTS[g.ti];
  g.gx=s[0];g.x=cellCX(s[0]);g.y=cellCY(7)+s[1];
  g.dirX=0;g.dirY=-1;g.state='house';g.hp=3;g.stun=0;g.chargeT=0;
}
function resetGhosts(){
  for(let i=0;i<4;i++){const g=ghosts[i];resetToHouse(g);g.exitT=1.2+i*1.1;g.fireCd=2.5+i*.8;g.dashT=0;g.dashCd=4+Math.random()*3;}
}
function resetPositions(){
  player.gx=10;player.gy=9;player.x=cellCX(10);player.y=cellCY(9);
  player.dirX=0;player.dirY=0;player.face=-Math.PI/2;
  invulnT=2.2;vulnT=0;combo=0;frenzyAcc=0;
  bullets.length=0;bolts.length=0;pickups.length=0;queued.length=0;
  resetGhosts();
}
function startRun(){
  initAudio();
  score=0;level=1;lives=3;energy=100;runStartHi=hi;newHi=false;
  rapidT=spreadT=shieldT=0;fireCd=0;muzzleT=0;shake=0;flashT=0;
  bullets.length=0;bolts.length=0;pickups.length=0;parts.length=0;floats.length=0;
  buildDots();resetPositions();
  state='play';paused=false;readyT=1.4;overT=0;
  sfx.coin();
}
function gameOver(){
  state='over';overT=0;newHi=score>runStartHi;
  if(newHi){hi=score;saveHi();}
  sfx.over();
}

/* ================= PARTICLES / FLOATERS ================= */
function explode(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,sp=60+Math.random()*280,life=.4+Math.random()*.5;
    parts.push({kind:'p',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life,max:life,size:2+Math.random()*3.5,color:color});
  }
  for(let i=0;i<6;i++){
    const a=Math.random()*TAU,sp=200+Math.random()*200,life=.25+Math.random()*.3;
    parts.push({kind:'p',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:life,max:life,size:1.6,color:'#ffffff'});
  }
}
function addRing(x,y,color){parts.push({kind:'ring',x:x,y:y,life:.5,max:.5,r0:8,size:72,color:color});}
function sparkle(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,sp=30+Math.random()*110,life=.25+Math.random()*.3;
    parts.push({kind:'p',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:life,max:life,size:1.5+Math.random()*1.8,color:color});
  }
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    if(p.kind==='p'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=(1-3*dt);p.vy*=(1-3*dt);}
  }
  if(parts.length>420)parts.splice(0,parts.length-420);
}
function updateFloaters(dt){for(let i=floats.length-1;i>=0;i--){floats[i].t-=dt;if(floats[i].t<=0)floats.splice(i,1);}}

/* ================= INPUT ================= */
const DIRMAP={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
let heldOrder=[], queued=[];
const mouse={cx:innerWidth/2,cy:innerHeight/2};
let firing=false, spaceHeld=false, aimAngle=-Math.PI/2;

window.addEventListener('keydown',e=>{
  initAudio();
  const k=e.code;
  if(k==='Space'||k.indexOf('Arrow')===0)e.preventDefault();
  if(state==='start'){
    if(!e.repeat&&(DIRMAP[k]||k==='Space'||k==='Enter'))startRun();
    return;
  }
  if(state==='over'){
    if((k==='Enter'||k==='Space')&&overT>0.8)startRun();
    if(k==='KeyR')startRun();
    return;
  }
  // play
  if(k==='KeyP'||k==='Escape'){if(!e.repeat){paused=!paused;sfx.ui();}return;}
  if(k==='KeyR'){startRun();return;}
  if(paused)return;
  const d=DIRMAP[k];
  if(d){
    if(e.repeat)return;
    if(heldOrder.indexOf(d)<0)heldOrder.push(d);
    if(player.dirX===-d[0]&&player.dirY===-d[1]&&(player.dirX||player.dirY)){player.dirX=d[0];player.dirY=d[1];}
    else if(queued.length<3)queued.push(d);
  }
  if(k==='Space')spaceHeld=true;
});
window.addEventListener('keyup',e=>{
  const d=DIRMAP[e.code];
  if(d){const i=heldOrder.indexOf(d);if(i>=0)heldOrder.splice(i,1);}
  if(e.code==='Space')spaceHeld=false;
});
window.addEventListener('mousemove',e=>{mouse.cx=e.clientX;mouse.cy=e.clientY;});
window.addEventListener('mousedown',e=>{
  initAudio();
  mouse.cx=e.clientX;mouse.cy=e.clientY;
  if(state==='start'){startRun();return;}
  if(state==='over'){if(overT>0.8)startRun();return;}
  firing=true;
});
window.addEventListener('mouseup',()=>{firing=false;});
window.addEventListener('contextmenu',e=>{if(e.target===cvs)e.preventDefault();});
window.addEventListener('blur',()=>{if(state==='play'&&!paused)paused=true;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)paused=true;});

function playerWant(){
  const d=queued.length?queued.shift():heldOrder.length?heldOrder[heldOrder.length-1]:null;
  return d;
}

/* ================= MOVEMENT (grid) ================= */
function stepGrid(e,dt,open,wantFn){
  if(!e.dirX&&!e.dirY){
    const d=wantFn();
    if(d&&(d[0]||d[1])&&open(e.gx+d[0],e.gy+d[1])){e.dirX=d[0];e.dirY=d[1];}
    return;
  }
  const sp=e.speed*dt,nx=e.x+e.dirX*sp,ny=e.y+e.dirY*sp;
  const tx=e.gx+e.dirX,ty=e.gy+e.dirY;
  const tcx=cellCX(tx),tcy=cellCY(ty);
  if((e.dirX>0&&nx>=tcx)||(e.dirX<0&&nx<=tcx)||(e.dirY>0&&ny>=tcy)||(e.dirY<0&&ny<=tcy)){
    e.x=tcx;e.y=tcy;e.gx=tx;e.gy=ty;
    const d=wantFn();
    if(d&&(d[0]||d[1])&&open(tx+d[0],ty+d[1])&&(d[0]!==e.dirX||d[1]!==e.dirY)){e.dirX=d[0];e.dirY=d[1];}
    if(!open(tx+e.dirX,ty+e.dirY)){e.dirX=0;e.dirY=0;}
  }else{e.x=nx;e.y=ny;}
}

/* ================= GHOST AI ================= */
function ghostWant(g){
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  let opts=[];
  for(const d of D){if(d[0]===-g.dirX&&d[1]===-g.dirY)continue;if(openG(g.gx+d[0],g.gy+d[1]))opts.push(d);}
  if(!opts.length)return openG(g.gx-g.dirX,g.gy-g.dirY)?[-g.dirX,-g.dirY]:[0,0];
  const pgx=player.gx,pgy=player.gy;
  let tx=pgx,ty=pgy,flee=false;
  if(g.ai==='flank'){tx=pgx+player.dirX*3;ty=pgy+player.dirY*3;}
  else if(g.ai==='wander'){if(Math.random()<0.45)return opts[(Math.random()*opts.length)|0];}
  else if(g.ai==='lurker'){const dd=Math.hypot(g.gx-pgx,g.gy-pgy);if(!g.dashT&&dd<=7)flee=true;}
  let best=null,bs=flee?-1:1e9;
  for(const d of opts){
    const v=(g.gx+d[0]-tx)*(g.gx+d[0]-tx)+(g.gy+d[1]-ty)*(g.gy+d[1]-ty);
    if(flee?v>bs:v<bs){bs=v;best=d;}
  }
  return best||opts[0];
}

/* ================= COMBAT ================= */
function spawnBullet(a){
  let mx=player.x+Math.cos(a)*(player.r+8),my=player.y+Math.sin(a)*(player.r+8);
  if(!openG(cellOf(mx),rowOf(my))){mx=player.x;my=player.y;}
  bullets.push({x:mx,y:my,vx:Math.cos(a)*920,vy:Math.sin(a)*920,life:1.3,grace:.05});
}
function tryFire(){
  if(state!=='play'||paused)return;
  if(readyT>0||levelT>0||dyingT>0)return;
  if(fireCd>0)return;
  const cost=spreadT>0?14:8;
  if(energy<cost){if(dryT<=0){sfx.dry();dryT=.25;}return;}
  energy-=cost;fireCd=rapidT>0?0.065:0.13;muzzleT=0.07;
  spawnBullet(aimAngle);
  if(spreadT>0){spawnBullet(aimAngle-0.24);spawnBullet(aimAngle+0.24);}
  sfx.shoot();
}
function fireBolt(g){
  const a=Math.atan2(player.y-g.y,player.x-g.x);
  const sp=Math.min(430,300+level*12);
  bolts.push({x:g.x+Math.cos(a)*20,y:g.y+Math.sin(a)*20,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:6,grace:.05});
  sfx.boltFire();sparkle(g.x+Math.cos(a)*24,g.y+Math.sin(a)*24,'#ff4fd8',5);
}
function killGhost(g,viaVuln){
  if(g.state!=='out')return;
  g.state='dying';g.deathT=.35;
  const pts=viaVuln?200*(1<<Math.min(combo,3)):(shieldT>0?200:150);
  if(viaVuln)combo++;
  score+=pts;if(score>hi)hi=score;
  floats.push({x:g.x,y:g.y-16,txt:'+'+pts,color:viaVuln?'#7df5ff':g.color,t:.9,max:.9});
  explode(g.x,g.y,g.color,20);addRing(g.x,g.y,g.color);
  shake=Math.max(shake,viaVuln?8:4.5);sfx.kill();
  if(Math.random()<0.35){
    const types=['rapid','spread','shield'];
    pickups.push({x:g.x,y:g.y,type:types[(Math.random()*3)|0],life:9,bob:Math.random()*6});
  }
}
function playerHit(){
  if(invulnT>0||dyingT>0||state!=='play')return;
  lives--;
  explode(player.x,player.y,'#ffe23f',28);addRing(player.x,player.y,'#ffe23f');
  shake=15;flashT=.4;flashCol='255,70,80';
  sfx.boltHit();sfx.kill();
  dyingT=1.15;
}

/* ================= EATING / POWER ================= */
function checkEat(gx,gy){
  if(gx<0||gy<0||gx>=COLS||gy>=ROWS)return;
  if(dots[gy][gx]){
    dots[gy][gx]=0;dotsLeft--;score+=10;if(score>hi)hi=score;
    clearDotLayer(gx,gy);
    streak=(t-lastDotT<0.7)?Math.min(streak+1,12):0;lastDotT=t;
    sfx.dot(streak);sparkle(cellCX(gx),cellCY(gy),'#ffcf9a',3);
  }else if(powers[gy][gx]){
    powers[gy][gx]=0;powersLeft--;score+=50;if(score>hi)hi=score;
    clearDotLayer(gx,gy);
    energy=Math.min(100,energy+40);
    vulnT=Math.max(3.5,8-(level-1)*0.5);combo=0;frenzyAcc=0;
    for(const g of ghosts)if(g.state==='out'&&(g.dirX||g.dirY)){g.dirX*=-1;g.dirY*=-1;}
    flashT=.2;flashCol='90,150,255';
    floats.push({x:cellCX(gx),y:cellCY(gy)-18,txt:'POWER!',color:'#ffb347',t:.9,max:.9});
    sparkle(cellCX(gx),cellCY(gy),'#ffb347',16);addRing(cellCX(gx),cellCY(gy),'#ffb347');
    sfx.power();
  }
}

/* ================= UPDATE ================= */
function update(dt){
  t+=dt;
  shake=Math.max(0,shake-shake*6*dt);
  flashT=Math.max(0,flashT-dt);
  muzzleT=Math.max(0,muzzleT-dt);
  dryT=Math.max(0,dryT-dt);
  updateParticles(dt);updateFloaters(dt);

  if(state==='start'){
    for(const g of ghosts)if(g.state==='house')g.bob+=dt;
    ambAcc+=dt;
    while(ambAcc>0.14){ambAcc-=0.14;if(dotCells.length){const c=dotCells[(Math.random()*dotCells.length)|0];sparkle(cellCX(c[0]),cellCY(c[1]),'#ffcf9a',1);}}
    return;
  }
  if(state==='over'){overT+=dt;return;}
  if(paused)return;

  fireCd=Math.max(0,fireCd-dt);
  rapidT=Math.max(0,rapidT-dt);spreadT=Math.max(0,spreadT-dt);
  shieldT=Math.max(0,shieldT-dt);invulnT=Math.max(0,invulnT-dt);
  energy=Math.min(100,energy+30*dt);

  if(vulnT>0){
    vulnT-=dt;frenzyAcc+=dt;
    while(frenzyAcc>=0.22){frenzyAcc-=0.22;beepFlip=!beepFlip;beep(beepFlip?700:480,0,.05,'square',.045);}
    if(vulnT<=0)combo=0;
  }

  if(dyingT>0){
    dyingT-=dt;
    if(dyingT<=0){if(lives<=0)gameOver();else{resetPositions();readyT=1.4;}}
  }
  if(levelT>0)levelT-=dt;
  if(readyT>0)readyT-=dt;
  const frozen=dyingT>0||readyT>0||levelT>0;
  if(frozen)return;

  // aim
  const mx=(mouse.cx-offX)/scale,my=(mouse.cy-offY)/scale;
  aimAngle=Math.atan2(my-player.y,mx-player.x);

  // player
  player.moving=!!(player.dirX||player.dirY);
  stepGrid(player,dt,openP,playerWant);
  if(player.moving){chewT+=dt;player.face=Math.atan2(player.dirY,player.dirX);}
  checkEat(player.gx,player.gy);
  if(firing||spaceHeld)tryFire();

  // ghosts
  for(const g of ghosts){
    if(g.state==='dying'){g.deathT-=dt;if(g.deathT<=0){g.state='dead';g.deadT=2.4;}continue;}
    if(g.state==='dead'){g.deadT-=dt;if(g.deadT<=0){resetToHouse(g);g.exitT=1.4;}continue;}
    if(g.state==='house'){
      g.bob+=dt;
      if(g.exitT>0)g.exitT-=dt;
      else{g.gx=10;g.gy=7;g.x=cellCX(10);g.y=cellCY(7);g.dirX=0;g.dirY=-1;g.state='out';}
      continue;
    }
    if(g.stun>0){g.stun-=dt;continue;}
    if(g.ai==='lurker'){
      g.dashCd-=dt;
      if(g.dashCd<=0){g.dashT=1.1;g.dashCd=5+Math.random()*3;sfx.dash();}
      if(g.dashT>0)g.dashT-=dt;
    }
    let sp=g.base*(1+0.06*(level-1));
    if(vulnT>0)sp*=0.5;else if(g.dashT>0)sp=400;else sp=Math.min(sp,258);
    g.speed=sp;
    stepGrid(g,dt,openG,()=>ghostWant(g));
    if(g.shooter&&vulnT<=0){
      g.fireCd-=dt;
      const dist=Math.hypot(player.x-g.x,player.y-g.y);
      if(g.chargeT>0){g.chargeT-=dt;if(g.chargeT<=0)fireBolt(g);}
      else if(g.fireCd<=0&&dist<430&&losClear(g.x,g.y,player.x,player.y)){g.chargeT=0.55;sfx.charge();}
    }
    const dd=Math.hypot(player.x-g.x,player.y-g.y);
    if(dd<g.r+player.r-4){
      if(vulnT>0)killGhost(g,true);
      else if(shieldT>0)killGhost(g,false);
      else playerHit();
    }
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.life-=dt;b.grace-=dt;
    let dead=b.life<=0;
    for(let s2=0;s2<2&&!dead;s2++){
      b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
      if(b.grace<=0&&!openG(cellOf(b.x),rowOf(b.y))){sparkle(b.x,b.y,'#9fd4ff',5);sfx.ui();dead=true;break;}
    }
    if(!dead)for(let j=ghosts.length-1;j>=0;j--){
      const g=ghosts[j];if(g.state!=='out')continue;
      if(Math.hypot(b.x-g.x,b.y-g.y)<22){
        if(vulnT>0)killGhost(g,true);
        else{g.hp--;g.stun=.55;sfx.hitG();sparkle(b.x,b.y,'#ffffff',8);if(g.hp<=0)killGhost(g,false);}
        dead=true;break;
      }
    }
    if(!dead)for(let j=bolts.length-1;j>=0;j--){
      const bl=bolts[j];
      if(Math.hypot(b.x-bl.x,b.y-bl.y)<14){
        score+=50;if(score>hi)hi=score;
        floats.push({x:bl.x,y:bl.y-12,txt:'+50',color:'#7df5ff',t:.7,max:.7});
        sparkle(bl.x,bl.y,'#ffd6f2',8);sfx.clank();
        bolts.splice(j,1);dead=true;break;
      }
    }
    if(dead)bullets.splice(i,1);
  }

  // enemy bolts
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];b.life-=dt;b.grace-=dt;
    let dead=b.life<=0;
    for(let s2=0;s2<2&&!dead;s2++){
      b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
      if(b.grace<=0&&!openG(cellOf(b.x),rowOf(b.y))){sparkle(b.x,b.y,'#ff4fd8',6);dead=true;}
    }
    if(!dead&&invulnT<=0&&dyingT<=0){
      if(Math.hypot(b.x-player.x,b.y-player.y)<21){
        if(shieldT>0){addRing(player.x,player.y,'#7dff9b');sparkle(b.x,b.y,'#7dff9b',8);sfx.clank();}
        else{playerHit();}
        dead=true;
      }
    }
    if(dead)bolts.splice(i,1);
  }

  // pickups
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.life-=dt;p.bob+=dt;
    if(p.life<=0){pickups.splice(i,1);continue;}
    if(Math.hypot(p.x-player.x,p.y-player.y)<24){
      const names={rapid:'RAPID FIRE',spread:'SPREAD SHOT',shield:'SHIELD'};
      const cols={rapid:'#ff9f43',spread:'#7df5ff',shield:'#7dff9b'};
      if(p.type==='rapid')rapidT=8;else if(p.type==='spread')spreadT=8;else shieldT=4.5;
      floats.push({x:p.x,y:p.y-14,txt:names[p.type],color:cols[p.type],t:1,max:1});
      addRing(p.x,p.y,cols[p.type]);sfx.pickup();
      pickups.splice(i,1);
    }
  }

  // level clear
  if(dotsLeft<=0&&powersLeft<=0){
    level++;score+=500;if(score>hi)hi=score;
    buildDots();resetPositions();
    bullets.length=0;bolts.length=0;pickups.length=0;
    levelT=1.7;sfx.jingle();
  }
}

/* ================= SCREEN FIT / CACHES ================= */
let fw=0,fh=0,dpr=1,scale=1,offX=0,offY=0,bgGrad=null,vigGrad=null,scanPat=null;
const stars=[];
for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.6,tw:.5+Math.random()*2,ph:Math.random()*TAU,sp:.4+Math.random()*1.4,c:Math.random()<.85?'#cfe0ff':'#ffd9b0'});

function fit(){
  const w=innerWidth,h=innerHeight;
  if(w===fw&&h===fh)return;
  fw=w;fh=h;dpr=Math.min(window.devicePixelRatio||1,2);
  cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);
  scale=Math.min(w/W,h/H);offX=(w-W*scale)/2;offY=(h-H*scale)/2;
  bgGrad=ctx.createLinearGradient(0,0,0,h);
  bgGrad.addColorStop(0,'#05070f');bgGrad.addColorStop(.6,'#081026');bgGrad.addColorStop(1,'#04060f');
  vigGrad=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.35,w/2,h/2,Math.max(w,h)*.75);
  vigGrad.addColorStop(0,'rgba(2,4,12,0)');vigGrad.addColorStop(1,'rgba(2,4,12,0.62)');
  const sc=document.createElement('canvas');sc.width=4;sc.height=4;
  const s2=sc.getContext('2d');s2.fillStyle='rgba(0,0,0,0.5)';s2.fillRect(0,0,4,1);
  scanPat=ctx.createPattern(sc,'repeat');
}

/* ================= DRAWING ================= */
function drawPickupIcon(type,x,y,col){
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#fff';ctx.strokeStyle='#fff';
  if(type==='rapid'){
    ctx.beginPath();ctx.moveTo(2.5,-7);ctx.lineTo(-4,1.5);ctx.lineTo(-.5,1.5);ctx.lineTo(-2.5,7);ctx.lineTo(4,-1.5);ctx.lineTo(.5,-1.5);ctx.closePath();ctx.fill();
  }else if(type==='spread'){
    ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,6);ctx.lineTo(-6,-5);ctx.moveTo(0,6);ctx.lineTo(0,-7);ctx.moveTo(0,6);ctx.lineTo(6,-5);ctx.stroke();
  }else{
    ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(6.5,-4.5);ctx.lineTo(5.5,2);ctx.quadraticCurveTo(5.5,6.5,0,8);ctx.quadraticCurveTo(-5.5,6.5,-5.5,2);ctx.lineTo(-6.5,-4.5);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

function drawGhost(g){
  const x=g.x,y=g.y+(g.state==='house'?Math.sin(g.bob*3+g.phase)*3:0);
  let body=g.color;
  if(vulnT>0&&state!=='start'&&(g.state==='out'||g.state==='house')){
    body=(vulnT<1.6&&Math.floor(t*8)%2)?'#f4f7ff':'#2440ff';
  }
  if(g.dashT>0&&Math.floor(t*10)%2)body='#ffffff';
  if(g.stun>0&&Math.floor(t*20)%2)body='#ffffff';
  ctx.save();ctx.translate(x,y);
  const r=g.r;
  if(g.state==='dying'){const k=1-g.deathT/.35;ctx.globalAlpha=Math.max(0,1-k);ctx.rotate(k*7);ctx.scale(Math.max(.05,1-k),Math.max(.05,1-k));}
  const wob=Math.sin(t*10+g.phase)*2.5,sw=r*2/3;
  ctx.beginPath();
  ctx.moveTo(-r,r*.62);ctx.lineTo(-r,-r*.15);
  ctx.arc(0,-r*.15,r,Math.PI,0);
  ctx.lineTo(r,r*.62);
  for(let i=0;i<3;i++){const x0=r-i*sw;ctx.quadraticCurveTo(x0-sw/2,r*.62+(i%2?4+wob:8-wob),x0-sw,r*.62);}
  ctx.closePath();
  ctx.fillStyle=body;ctx.fill();
  if(g.state==='dying'){ctx.restore();return;}
  // eyes
  let lx,ly;
  if(g.state==='house'){const a=Math.atan2(player.y-y,player.x-x);lx=Math.cos(a)*2;ly=Math.sin(a)*2;}
  else{lx=g.dirX*2.4;ly=g.dirY*2.4;}
  for(const s of[-1,1]){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(s*6.2,-4+ly*.5,4.4,5.6,0,0,TAU);ctx.fill();
    ctx.fillStyle='#0c1445';ctx.beginPath();ctx.arc(s*6.2+lx,-4+ly,2.4,0,TAU);ctx.fill();
  }
  if(vulnT>0&&!(vulnT<1.6&&Math.floor(t*8)%2)&&state!=='start'){
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(-8,4);ctx.lineTo(-4.5,7);ctx.lineTo(0,4);ctx.lineTo(4.5,7);ctx.lineTo(8,4);ctx.stroke();
  }
  // charge orb (about to fire)
  if(g.chargeT>0&&state==='play'){
    const a=Math.atan2(player.y-y,player.x-x),k=1-g.chargeT/.55;
    ctx.fillStyle='rgba(255,79,216,'+(0.3+0.6*k)+')';
    ctx.beginPath();ctx.arc(Math.cos(a)*20,Math.sin(a)*20,2+6*k,0,TAU);ctx.fill();
  }
  ctx.restore();
}

function drawPlayer(){
  if(dyingT>0)return;
  const x=player.x,y=player.y,r=player.r,a=aimAngle;
  // barrel
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  const rec=muzzleT>0?3:0;
  ctx.fillStyle='#8fa3c8';ctx.fillRect(6-rec,-4.5,14,9);
  ctx.fillStyle='#59e6ff';ctx.beginPath();ctx.arc(r+7-rec,0,3.6,0,TAU);ctx.fill();
  ctx.restore();
  // body (blink while invulnerable)
  const blink=invulnT>0&&Math.floor(t*14)%2===0;
  if(!blink){
    const m=player.moving?0.28+0.75*Math.abs(Math.sin(chewT*10)):0.45+0.15*Math.sin(t*3);
    ctx.fillStyle='#ffe23f';
    ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r+1,player.face+m,player.face-m+TAU);ctx.closePath();ctx.fill();
  }
  if(shieldT>0){
    ctx.save();ctx.translate(x,y);
    ctx.strokeStyle='rgba(125,255,155,'+(0.55+0.3*Math.sin(t*8))+')';
    ctx.lineWidth=2.5;ctx.setLineDash([7,5]);ctx.lineDashOffset=-t*40;
    ctx.beginPath();ctx.arc(0,0,r+7,0,TAU);ctx.stroke();
    ctx.restore();ctx.setLineDash([]);
  }
  // muzzle flash
  if(muzzleT>0){
    const fx=x+Math.cos(a)*(r+9),fy=y+Math.sin(a)*(r+9);
    ctx.save();ctx.translate(fx,fy);ctx.rotate(a+t*20);
    ctx.fillStyle='rgba(160,245,255,0.9)';
    ctx.beginPath();
    for(let i=0;i<8;i++){const rr2=i%2?3:9,an=i/8*TAU;ctx.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2);}
    ctx.closePath();ctx.fill();ctx.restore();
  }
}

function drawHUD(){
  ptext('SCORE',24,10,1,'#6e80b4');
  ptext(String(score).padStart(6,'0'),24,22,3,'#ffe23f');
  ptext('HI-SCORE',W/2,10,1,'#6e80b4','center');
  ptext(String(Math.max(hi,score)).padStart(6,'0'),W/2,22,3,'#7fd4ff','center');
  ptext('LEVEL',W-24,10,1,'#6e80b4','right');
  ptext(String(level),W-24,22,3,'#ffa42e','right');
  // energy bar
  const by=H-30;
  ptext('PWR',24,by+2,1,'#6e80b4');
  ctx.fillStyle='#141d3f';ctx.fillRect(64,by,150,12);
  const low=energy<20&&Math.floor(t*8)%2;
  ctx.fillStyle=low?'#ff5d6c':'#59e6ff';
  ctx.fillRect(64,by,150*(energy/100),12);
  ctx.strokeStyle='#3b4f8c';ctx.lineWidth=1.5;ctx.strokeRect(64,by,150,12);
  // lives orbs
  for(let i=0;i<lives;i++){
    const x=238+i*24,y=by+6,m=0.5+0.3*Math.sin(t*6+i);
    ctx.fillStyle='#ffe23f';ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,8,Math.PI+m,Math.PI-m+TAU);ctx.closePath();ctx.fill();
  }
  // active powerups
  const act=[];
  if(rapidT>0)act.push(['rapid',rapidT/8,'#ff9f43']);
  if(spreadT>0)act.push(['spread',spreadT/8,'#7df5ff']);
  if(shieldT>0)act.push(['shield',shieldT/4.5,'#7dff9b']);
  act.forEach((a2,i)=>{
    const x=W-36-i*38,y=by+6;
    ctx.fillStyle='#0d1738';ctx.beginPath();ctx.arc(x,y,11,0,TAU);ctx.fill();
    ctx.strokeStyle=a2[2];ctx.lineWidth=1.5;ctx.stroke();
    drawPickupIcon(a2[0],x,y,a2[2]);
    ctx.strokeStyle=a2[2];ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(x,y,14.5,-Math.PI/2,-Math.PI/2+TAU*a2[1]);ctx.stroke();
  });
}

function bigTitle(str,cx,y){
  const s=6;let w=0;for(const ch of str)w+=(FONT[ch]||FONT[' '])[0].length+1;w=(w-1)*s;
  let x=cx-w/2;
  for(let i=0;i<str.length;i++){
    const ch=str[i],bob=Math.sin(t*2.6+i*.55)*5,col=i<4?'#5fd8ff':'#ffe23f';
    ptext(ch,x+4,y+bob+4,s,'rgba(8,14,40,0.9)');
    ptext(ch,x,y+bob,s,col);
    x+=(FONT[ch]||FONT[' '])[0].length+1; x*= 1; // advance in units*s handled below
  }
}
// (advance fix: re-implement cleanly)
function bigTitleDraw(str,cx,y){
  const s=6;let w=0;for(const ch of str)w+=(FONT[ch]||FONT[' '])[0].length+1;w-=1;w*=s;
  let x=cx-w/2;
  for(let i=0;i<str.length;i++){
    const ch=str[i],g=FONT[ch]||FONT[' '],bob=Math.sin(t*2.6+i*.55)*5,col=i<4?'#5fd8ff':'#ffe23f';
    ptext(ch,x+4,y+bob+4,s,'rgba(8,14,40,0.9)');
    ptext(ch,x,y+bob,s,col);
    x+=(g[0].length+1)*s;
  }
}

function drawStart(){
  ctx.fillStyle='rgba(3,5,14,0.78)';ctx.fillRect(0,0,W,H);
  bigTitleDraw('MAZE BLASTER',W/2,150);
  ptext('A PAC-STYLE ARENA SHOOTER',W/2,236,2,'#8fa3d8','center');
  if(hi>0)ptext('HI SCORE '+String(hi).padStart(6,'0'),W/2,268,2,'#7fd4ff','center');
  const rows=[['MOVE','WASD / ARROWS'],['AIM','MOUSE'],['FIRE','CLICK OR SPACE'],['PAUSE / RESTART','P / R']];
  let y=330;
  for(const r of rows){
    ptext(r[0],W/2-18,y,2,'#5fd8ff','right');
    ptext(r[1],W/2+18,y,2,'#dfe9ff');
    y+=30;
  }
  // pickup legend
  const leg=[['rapid','#ff9f43','RAPID FIRE'],['spread','#7df5ff','SPREAD SHOT'],['shield','#7dff9b','SHIELD']];
  let lx=W/2-150;
  for(const l of leg){
    ctx.fillStyle='#0d1738';ctx.beginPath();ctx.arc(lx,468,15,0,TAU);ctx.fill();
    ctx.strokeStyle=l[1];ctx.lineWidth=2;ctx.stroke();
    drawPickupIcon(l[0],lx,468,l[1]);
    ptext(l[2],lx,494,1,'#9fb4e8','center');
    lx+=150;
  }
  ptext('HIT A GHOST 3 TIMES - OR CATCH IT ON A POWER PELLET FOR ONE-SHOT KILLS',W/2,540,2,'#9fb4e8','center');
  ptext('SHOOT ENEMY BOLTS DOWN BEFORE THEY HIT YOU',W/2,566,2,'#9fb4e8','center');
  if(Math.sin(t*4)>-0.3)ptext('CLICK OR PRESS ANY KEY TO START',W/2,620,3,'#ffe23f','center');
}

function drawOver(){
  ctx.fillStyle='rgba(3,5,14,0.8)';ctx.fillRect(0,0,W,H);
  ptext('GAME OVER',W/2+5,225+5,6,'rgba(30,6,14,0.9)','center');
  ptext('GAME OVER',W/2,225,6,'#ff4b5c','center');
  ptext('SCORE',W/2,330,2,'#8fa3d8','center');
  ptext(String(score).padStart(6,'0'),W/2,352,4,'#ffe23f','center');
  ptext('BEST '+String(hi).padStart(6,'0'),W/2,412,2,'#7fd4ff','center');
  if(newHi&&Math.sin(t*5)>0)ptext('NEW BEST SCORE!',W/2,448,2,'#ff9ad5','center');
  if(overT>0.8&&Math.sin(t*4)>-0.3)ptext('CLICK OR PRESS ENTER TO RESTART',W/2,510,3,'#ffe23f','center');
}

function drawPause(){
  ctx.fillStyle='rgba(3,5,14,0.7)';ctx.fillRect(0,0,W,H);
  ptext('PAUSED',W/2,360,5,'#5fd8ff','center');
  ptext('P TO RESUME - R TO RESTART',W/2,430,2,'#9fb4e8','center');
}

function drawAimLine(){
  if(state!=='play'||paused||dyingT>0||readyT>0||levelT>0)return;
  const a=aimAngle;let px=player.x+Math.cos(a)*(player.r+10),py=player.y+Math.sin(a)*(player.r+10);
  ctx.strokeStyle='rgba(125,245,255,0.09)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,py);
  for(let i=0;i<40;i++){
    px+=Math.cos(a)*16;py+=Math.sin(a)*16;
    if(!openG(cellOf(px),rowOf(py)))break;
    ctx.lineTo(px,py);
  }
  ctx.stroke();
}

function render(){
  fit();
  // ---- screen space: backdrop ----
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,fw,fh);
  for(const s of stars){
    const x=((s.x+t*s.sp*0.004)%1)*fw,y=s.y*fh;
    ctx.globalAlpha=.25+.4*(.5+.5*Math.sin(t*s.tw+s.ph));
    ctx.fillStyle=s.c;ctx.fillRect(x,y,s.r,s.r);
  }
  ctx.globalAlpha=1;
  let ng=ctx.createRadialGradient(fw*.3+Math.sin(t*.07)*60,fh*.32,0,fw*.3+Math.sin(t*.07)*60,fh*.32,Math.max(fw,fh)*.5);
  ng.addColorStop(0,'rgba(38,66,180,0.16)');ng.addColorStop(1,'rgba(38,66,180,0)');
  ctx.fillStyle=ng;ctx.fillRect(0,0,fw,fh);
  ng=ctx.createRadialGradient(fw*.72+Math.cos(t*.05)*50,fh*.7,0,fw*.72+Math.cos(t*.05)*50,fh*.7,Math.max(fw,fh)*.45);
  ng.addColorStop(0,'rgba(150,40,120,0.10)');ng.addColorStop(1,'rgba(150,40,120,0)');
  ctx.fillStyle=ng;ctx.fillRect(0,0,fw,fh);

  // ---- world space ----
  const shx=(Math.random()*2-1)*shake,shy=(Math.random()*2-1)*shake;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*(offX+shx*scale),dpr*(offY+shy*scale));
  ctx.drawImage(offMaze,0,0,W,H);
  // dot field shimmer
  ctx.globalCompositeOperation='lighter';
  const sg=ctx.createRadialGradient(W/2,TOP+ROWS*CELL/2,50,W/2,TOP+ROWS*CELL/2,430);
  sg.addColorStop(0,'rgba(255,180,120,'+(0.03+0.02*Math.sin(t*1.7))+')');sg.addColorStop(1,'rgba(255,180,120,0)');
  ctx.fillStyle=sg;ctx.fillRect(OFFX,TOP,COLS*CELL,ROWS*CELL);
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(offDots,0,0,W,H);
  // power pellets (pulsing)
  for(let gy=0;gy<ROWS;gy++)for(let gx=0;gx<COLS;gx++){
    if(!powers[gy][gx])continue;
    const x=cellCX(gx),y=cellCY(gy),pu=1+0.25*Math.sin(t*6+gx);
    ctx.globalCompositeOperation='lighter';
    const pg=ctx.createRadialGradient(x,y,0,x,y,16*pu);
    pg.addColorStop(0,'rgba(255,179,71,0.5)');pg.addColorStop(1,'rgba(255,179,71,0)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(x,y,16*pu,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(x,y,8*pu,0,TAU);ctx.fill();
    ctx.fillStyle='#ffe9c2';ctx.beginPath();ctx.arc(x,y,4.5*pu,0,TAU);ctx.fill();
  }
  // house core emblem
  const hx=cellCX(10),hy=cellCY(7)+2;
  ctx.save();ctx.translate(hx,hy);ctx.rotate(t*.8);
  ctx.fillStyle='rgba(95,140,255,'+(0.25+0.18*Math.sin(t*3))+')';
  ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(5,0);ctx.lineTo(0,7);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();
  ctx.restore();

  drawAimLine();

  // pickups
  for(const p of pickups){
    const y=p.y+Math.sin(p.bob*3)*4;
    const cols={rapid:'#ff9f43',spread:'#7df5ff',shield:'#7dff9b'};
    if(p.life<2&&Math.floor(t*6)%2)continue;
    ctx.fillStyle='rgba(13,23,56,0.9)';ctx.beginPath();ctx.arc(p.x,y,13+Math.sin(p.bob*4)*1.5,0,TAU);ctx.fill();
    ctx.strokeStyle=cols[p.type];ctx.lineWidth=2;ctx.stroke();
    drawPickupIcon(p.type,p.x,y,cols[p.type]);
  }

  // player + ghosts
  if(state!=='start')drawPlayer();
  for(const g of ghosts){if(g.state==='dead')continue;drawGhost(g);}

  // additive pass: bolts, bullets, particles
  ctx.globalCompositeOperation='lighter';
  for(const b of bolts){
    const a=Math.atan2(b.vy,b.vx);
    for(let i=1;i<=3;i++){
      ctx.fillStyle='rgba(255,79,216,'+(0.18*(4-i)/3)+')';
      ctx.beginPath();ctx.arc(b.x-Math.cos(a)*9*i,b.y-Math.sin(a)*9*i,7-i*1.5,0,TAU);ctx.fill();
    }
    ctx.fillStyle='rgba(255,79,216,0.3)';ctx.beginPath();ctx.arc(b.x,b.y,10+Math.sin(t*12)*2,0,TAU);ctx.fill();
    ctx.fillStyle='#ff4fd8';ctx.beginPath();ctx.arc(b.x,b.y,5.5,0,TAU);ctx.fill();
    ctx.fillStyle='#ffd6f2';ctx.beginPath();ctx.arc(b.x,b.y,2.4,0,TAU);ctx.fill();
  }
  for(const b of bullets){
    ctx.strokeStyle='rgba(125,245,255,0.85)';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(b.x-b.vx*0.016,b.y-b.vy*0.016);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(b.x,b.y,2.4,0,TAU);ctx.fill();
  }
  for(const p of parts){
    const al=Math.max(0,p.life/p.max);
    if(p.kind==='ring'){
      ctx.strokeStyle=p.color;ctx.globalAlpha=al*0.8;ctx.lineWidth=3*al+1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r0+(1-al)*p.size,0,TAU);ctx.stroke();
    }else{
      ctx.globalAlpha=al;ctx.fillStyle=p.color;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  // floaters
  for(const f of floats){
    const k=f.t/f.max;
    ptext(f.txt,f.x,f.y-(1-k)*30,2,f.color,'center',k);
  }

  drawHUD();

  if(state==='start')drawStart();
  else{
    if(readyT>0&&state==='play')ptext('READY!',W/2,TOP+10.6*CELL-8,4,'#ffe23f','center');
    if(levelT>0){
      ctx.fillStyle='rgba(3,5,14,0.35)';ctx.fillRect(0,0,W,H);
      ptext('LEVEL '+level,W/2,TOP+ROWS*CELL/2-40,5,'#5fd8ff','center');
      ptext('GHOSTS GET FASTER',W/2,TOP+ROWS*CELL/2+30,2,'#9fb4e8','center');
    }
    if(state==='over')drawOver();
    if(paused&&state==='play')drawPause();
  }

  // crosshair
  const mx=(mouse.cx-offX)/scale,my=(mouse.cy-offY)/scale;
  const cc=energy<8?'#ff5d6c':'#7df5ff';
  ctx.save();ctx.translate(mx,my);ctx.rotate(t*.8);
  ctx.strokeStyle=cc;ctx.lineWidth=1.6;ctx.globalAlpha=.9;
  ctx.beginPath();ctx.arc(0,0,9,0,TAU);ctx.stroke();
  for(let i=0;i<4;i++){const an=i*Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(an)*11,Math.sin(an)*11);ctx.lineTo(Math.cos(an)*16,Math.sin(an)*16);ctx.stroke();}
  ctx.fillStyle=cc;ctx.beginPath();ctx.arc(0,0,1.8,0,TAU);ctx.fill();
  ctx.restore();ctx.globalAlpha=1;

  // ---- screen space: CRT finish ----
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=vigGrad;ctx.fillRect(0,0,fw,fh);
  ctx.globalAlpha=.28;ctx.fillStyle=scanPat;ctx.fillRect(0,0,fw,fh);ctx.globalAlpha=1;
  if(flashT>0){ctx.fillStyle='rgba('+flashCol+','+Math.min(.45,flashT)+')';ctx.fillRect(0,0,fw,fh);}
}

/* ================= LOOP ================= */
buildMazeLayer();buildDots();resetPositions();
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  update(dt);render();
}
requestAnimationFrame(frame);
</script>
