<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAC vs PAC — Two-Player Maze Duel</title>
<style>
:root{
  --cy:#35e8ff; --pk:#ff4fd8; --yl:#ffd94a;
  --disp:'Arial Black','Arial Bold',Impact,'Franklin Gothic Medium',sans-serif;
  --mono:Consolas,Menlo,Monaco,'Courier New',monospace;
  --body:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:var(--body);color:#dfe7ff;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(900px 520px at 6% -10%, rgba(53,232,255,.16), transparent 60%),
    radial-gradient(900px 520px at 104% 112%, rgba(255,79,216,.16), transparent 60%),
    radial-gradient(circle at 50% 42%, #0b1132 0%, #060a1f 72%);
}
canvas#game{position:fixed;inset:0;display:block;z-index:0}
#scan{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
/* ---------- HUD ---------- */
#hud{position:fixed;top:8px;left:0;right:0;z-index:5;display:flex;justify-content:center;align-items:stretch;gap:10px;padding:0 8px;pointer-events:none;flex-wrap:wrap}
.panel{background:rgba(9,13,44,.9);border:1px solid #2b3a8f;border-radius:10px;padding:6px 14px;display:flex;align-items:center;gap:12px;min-width:150px}
.panel.p1{border-left:4px solid var(--cy);box-shadow:0 0 18px rgba(53,232,255,.2)}
.panel.p2{border-right:4px solid var(--pk);box-shadow:0 0 18px rgba(255,79,216,.2);flex-direction:row-reverse;text-align:right}
.pname{font-family:var(--disp);font-size:12px;letter-spacing:.08em;display:flex;align-items:center;gap:7px;line-height:1.1}
.pname small{display:block;font-family:var(--mono);font-size:9px;opacity:.65;letter-spacing:.14em}
.cA-t{color:var(--cy)} .cB-t{color:var(--pk)}
.score{font-family:var(--mono);font-weight:700;font-size:clamp(15px,2.4vw,23px);min-width:3.4ch;text-align:center}
.score.pop{animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.3)}}
.lives{display:flex;gap:4px;align-items:center;min-height:14px}
.lf{display:inline-block;width:13px;height:13px;border-radius:50%}
.lfa{background:conic-gradient(from 50deg,transparent 0 80deg,var(--cy) 80deg);box-shadow:0 0 6px rgba(53,232,255,.7)}
.lfb{background:conic-gradient(from 230deg,transparent 0 80deg,var(--pk) 80deg);box-shadow:0 0 6px rgba(255,79,216,.7)}
.dead{font-family:var(--mono);font-size:10px;color:#ff6b6b;letter-spacing:.1em}
.mid{background:rgba(9,13,44,.9);border:1px solid #2b3a8f;border-radius:10px;padding:5px 18px;text-align:center;min-width:120px;display:flex;flex-direction:column;justify-content:center}
.time{font-family:var(--mono);font-weight:700;font-size:clamp(17px,2.8vw,26px);color:#fff}
.dots{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#9fb0ff}
#fchip{display:none;margin-top:3px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#cfe0ff;background:#22307a;border-radius:6px;padding:2px 8px;width:max-content;box-shadow:0 0 12px rgba(90,120,255,.6)}
#fchip.on{display:block;animation:fblink .5s steps(2) infinite}
@keyframes fblink{50%{background:#4d6bff}}
#hint{position:fixed;bottom:7px;left:0;right:0;z-index:4;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:rgba(160,180,255,.42);pointer-events:none}
/* ---------- overlay ---------- */
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .25s ease}
#ov.show{opacity:1;pointer-events:auto}
#ov.dim{background:rgba(4,7,22,.8)}
.wrap{max-width:760px;width:100%;max-height:96vh;overflow:auto;text-align:center;padding:10px;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(14px) scale(.96);opacity:0}}
.lane{width:min(420px,72vw);height:8px;margin:0 auto 16px;opacity:.9;
  background:radial-gradient(circle at 50% 50%, #ffd9b8 0 2px, transparent 2.7px) repeat-x center;background-size:22px 8px;animation:laneMove .9s linear infinite}
@keyframes laneMove{to{background-position-x:-22px}}
h1{font-family:var(--disp);font-size:clamp(38px,9vw,84px);line-height:1;display:flex;align-items:center;justify-content:center;gap:.28em;flex-wrap:wrap}
.t1,.t2{display:inline-flex;align-items:center;gap:.18em}
.t1{color:var(--cy);text-shadow:0 0 26px rgba(53,232,255,.6),4px 4px 0 #072a44;transform:rotate(-2deg)}
.t2{color:var(--pk);text-shadow:0 0 26px rgba(255,79,216,.6),4px 4px 0 #44103a;transform:rotate(2deg)}
h1 em{font-style:normal;font-size:.42em;color:var(--yl);text-shadow:3px 3px 0 #4a3200;transform:translateY(-.55em) rotate(-8deg)}
.pac{width:.72em;height:.72em;border-radius:50%;display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.12em)}}
.p1c{background:conic-gradient(from 50deg,transparent 0 80deg,var(--cy) 80deg);box-shadow:0 0 18px rgba(53,232,255,.8)}
.p2c{background:conic-gradient(from 230deg,transparent 0 80deg,var(--pk) 80deg);box-shadow:0 0 18px rgba(255,79,216,.8)}
.tag{margin:14px 0 18px;font-size:clamp(13px,2vw,16px);letter-spacing:.14em;text-transform:uppercase;color:#9fb0ff}
.cols{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.ccard{background:rgba(10,15,48,.88);border:1px solid rgba(90,120,255,.3);border-top:3px solid var(--c);border-radius:12px;padding:14px 22px;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 26px var(--g);transition:transform .18s ease}
.ccard:hover{transform:translateY(-3px)}
.cA{--c:var(--cy);--g:rgba(53,232,255,.14)} .cB{--c:var(--pk);--g:rgba(255,79,216,.14)}
.ccard h3{font-family:var(--disp);font-size:14px;letter-spacing:.1em;color:var(--c);margin-bottom:10px}
.kgrid{display:grid;grid-template-columns:repeat(3,auto);gap:5px;justify-content:center;margin-bottom:8px}
kbd{font-family:var(--mono);background:#141b46;border:1px solid #3d4db3;border-bottom-width:3px;border-radius:6px;padding:.32em .55em;min-width:2.3em;text-align:center;display:inline-block;color:#cfe0ff;font-size:.92em}
.ccard p{font-size:12px;color:#9fb0ff;letter-spacing:.05em}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:rgba(20,27,70,.9);border:1px solid #34418f;border-radius:999px;padding:5px 12px;color:#cfe0ff}
.chip b{color:var(--yl)}
.btn{font-family:var(--disp);font-size:clamp(15px,2.4vw,21px);letter-spacing:.06em;color:#1a1206;background:linear-gradient(#ffe27a,#ffcf3d);border:0;border-radius:10px;padding:.75em 1.6em;cursor:pointer;
  box-shadow:0 6px 0 #8a6a12,0 12px 26px rgba(255,200,60,.25);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 8px 0 #8a6a12,0 16px 30px rgba(255,200,60,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a6a12}
.sub{margin-top:14px;font-family:var(--mono);font-size:11px;color:rgba(160,180,255,.55);letter-spacing:.08em;line-height:1.8}
.ready{text-align:center;animation:rise .3s ease}
.ready h2{font-family:var(--disp);font-size:clamp(44px,10vw,96px);color:var(--yl);text-shadow:0 0 30px rgba(255,217,74,.55),5px 5px 0 #4a3200;animation:rpulse .8s ease-in-out infinite}
@keyframes rpulse{50%{transform:scale(1.09)}}
.ready p{margin-top:10px;font-family:var(--mono);letter-spacing:.14em;font-size:clamp(12px,2vw,16px);color:#cfe0ff;text-shadow:0 2px 8px #000}
h2.winT{font-family:var(--disp);font-size:clamp(36px,8vw,76px);margin-bottom:6px;animation:rise .4s ease}
.t1c{color:var(--cy);text-shadow:0 0 30px rgba(53,232,255,.6),4px 4px 0 #072a44}
.t2c{color:var(--pk);text-shadow:0 0 30px rgba(255,79,216,.6),4px 4px 0 #44103a}
.drc{color:#fff;text-shadow:0 0 24px rgba(255,255,255,.4)}
.scoreboard{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.sb{background:rgba(10,15,48,.9);border:1px solid #34418f;border-radius:12px;padding:12px 26px;min-width:170px}
.sb span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#9fb0ff;margin-bottom:4px}
.sb b{font-family:var(--mono);font-size:clamp(24px,4vw,38px)}
.sb.wA{border-color:var(--cy);box-shadow:0 0 26px rgba(53,232,255,.35)} .sb.wA b{color:var(--cy)}
.sb.wB{border-color:var(--pk);box-shadow:0 0 26px rgba(255,79,216,.35)} .sb.wB b{color:var(--pk)}
.nb{margin:8px 0 4px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--yl);animation:fblink .6s steps(2) infinite}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="scan"></div>

<div id="hud">
  <div class="panel p1">
    <div class="pname"><span class="cA-t">P1 CYAN<small>W A S D</small></span></div>
    <div class="score" id="s1">0</div>
    <div class="lives" id="l1"></div>
  </div>
  <div class="mid">
    <div class="time" id="time">2:30</div>
    <div class="dots" id="dots">DOTS 0</div>
    <div id="fchip">👻 GHOSTS! <b id="ft">7</b>s</div>
  </div>
  <div class="panel p2">
    <div class="pname"><span class="cB-t">P2 PINK<small>ARROWS</small></span></div>
    <div class="score" id="s2">0</div>
    <div class="lives" id="l2"></div>
  </div>
</div>

<div id="hint">P PAUSE · M SOUND · R RESTART — KEYBOARD REQUIRED</div>
<div id="ov"></div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const $=s=>document.querySelector(s);
const cv=$('#game'),ctx=cv.getContext('2d');
const ovEl=$('#ov'),hudS1=$('#s1'),hudS2=$('#s2'),hudL1=$('#l1'),hudL2=$('#l2'),
      hudTime=$('#time'),hudDots=$('#dots'),fchip=$('#fchip'),ftEl=$('#ft');

const COLS=25,ROWS=21,DOOR={x:12,y:8};
const MAP=[
"#########################",
"#.....................#",
"#o###.....#####.....###o#",
"#.#.......#####.......#.#",
"#...........#...........#",
"#.....###.......###.....#",
"#......#.........#......#",
"#.....#.#.......#.#.....#",
"#........#######........#",
"#........#     #........#",
"#........#######........#",
"#.....###.......###.....#",
"#......#.........#......#",
"#......#...#.#...#......#",
"#.....o...........o....#",
"#.....#.#.......#.#.....#",
"#.###.......#.......###.#",
"#......#.........#......#",
"#..........###..........#",
"#.....................#",
"#########################"
];

const DIRS={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}};
const PAC_SPEED=7.2,GHOST_SPEED=6.1,FRIGHT_SPEED=3.5,GAME_TIME=150,CHAIN=[200,400,800,1600];
const SPAWNS={1:{x:5,y:17,dir:'R'},2:{x:19,y:17,dir:'L'}};
const corners=[{x:1,y:1},{x:23,y:19},{x:1,y:19},{x:23,y:1}];

let grid=null,wall=null,dotsLeft=0;
function parseMap(){
  grid=[];wall=[];dotsLeft=0;
  for(let y=0;y<ROWS;y++){
    let row=(MAP[y]||'');while(row.length<COLS)row+='#';row=row.slice(0,COLS);
    grid[y]=[];wall[y]=[];
    for(let x=0;x<COLS;x++){
      const c=row[x];wall[y][x]=(c==='#')?1:0;
      if(c==='.'){grid[y][x]=1;dotsLeft++;}else if(c==='o'){grid[y][x]=2;dotsLeft++;}else grid[y][x]=0;
    }
  }
}
function canGo(gx,gy,d){const nx=gx+d.x,ny=gy+d.y;if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return false;return !wall[ny][nx];}

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false;
function audio(){
  if(AC){if(AC.state==='suspended')AC.resume();return AC;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.16;master.connect(AC.destination);}catch(e){}
  return AC;
}
function tone(f0,f1,dur,type,vol,delay){
  const ac=audio();if(!ac||muted)return;type=type||'square';vol=vol==null?1:vol;delay=delay||0;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
let dotAlt=false;
const S={
  dot(){dotAlt=!dotAlt;tone(dotAlt?620:500,0,.06,'square',.45);},
  pellet(){tone(180,70,.4,'sawtooth',.6);tone(900,300,.25,'square',.3,.05);},
  ghost(){tone(240,980,.45,'square',.55);},
  death(){for(let i=0;i<7;i++)tone(420-i*52,420-i*52-16,.13,'sawtooth',.5,i*.09);tone(300,40,.5,'triangle',.45,.68);},
  tick(){tone(1250,0,.04,'square',.25);},
  start(){tone(392,0,.09,'square',.45);tone(523,0,.09,'square',.45,.1);tone(659,0,.16,'square',.45,.2);},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,0,.16,'square',.5,i*.13));tone(1046,0,.42,'square',.35,.55);}
};

/* ============================== STORAGE ============================== */
function loadStore(){try{return JSON.parse(localStorage.getItem('pvpp')||'{}');}catch(e){return {};}}
function saveStore(o){try{localStorage.setItem('pvpp',JSON.stringify(o));}catch(e){}}
let store=loadStore();muted=!!store.muted;
let best={p1:store.p1|0,p2:store.p2|0};

/* ============================== STATE ============================== */
let pacs=[],ghosts=[],parts=[],rings=[],floaters=[];
let state='menu',now=0,frightT=0,chainIdx=0,gameT=GAME_TIME,readyT=0,dyingT=0,
    deadPac=null,koWinner=null,shakeT=0;

function makePac(n){
  const s=SPAWNS[n];
  return {n,color:n===1?'#35e8ff':'#ff4fd8',gx:s.x,gy:s.y,x:s.x+.5,y:s.y+.5,
    dir:DIRS[s.dir],nextDir:null,score:0,lives:3,alive:true,invulnT:2.5,ph:Math.random()*6,
    onCenter(e){ if(state!=='menu')return; const o=[]; for(const k in DIRS){const d=DIRS[k];if(canGo(e.gx,e.gy,d))o.push(d);} e.nextDir=o.length?o[(Math.random()*o.length)|0]:null; }};
}
function resetPacPos(p){const s=SPAWNS[p.n];p.gx=s.x;p.gy=s.y;p.x=s.x+.5;p.y=s.y+.5;p.dir=DIRS[s.dir];p.nextDir=null;p.invulnT=2.5;p.alive=true;}
function makeGhost(i){
  const G=[{c:'#ff4b57',h:10,p:0},{c:'#ffb03a',h:12,p:1},{c:'#a06bff',h:14,p:2}][i];
  return {i,color:G.c,homeX:G.h,persona:G.p,gx:G.h,gy:9,x:G.h+.5,y:9.5,dir:DIRS.L,nextDir:null,
    mode:'house',exitT:0,bobP:i*2.1,tgt:null,lastT:-9,onCenter(e){ghostThink(e);}};
}

/* ============================== MOVEMENT ============================== */
function moveEntity(e,dist){
  let guard=0;
  while(dist>1e-9&&guard++<80){
    const cx=e.gx+0.5,cy=e.gy+0.5;
    const rem=(cx-e.x)*e.dir.x+(cy-e.y)*e.dir.y;
    if(rem>1e-9){const m=Math.min(dist,rem);e.x+=e.dir.x*m;e.y+=e.dir.y*m;dist-=m;continue;}
    e.x=cx;e.y=cy;
    if(e.onCenter)e.onCenter(e);
    let d=(e.nextDir&&canGo(e.gx,e.gy,e.nextDir))?e.nextDir:((!canGo(e.gx,e.gy,e.dir))?(d={x:-e.dir.x,y:-e.dir.y}):e.dir);
    if(!canGo(e.gx,e.gy,d))break;
    e.dir=d;e.gx+=d.x;e.gy+=d.y;
  }
}

/* ============================== GHOST AI ============================== */
function ghostTarget(g){
  const alive=pacs.filter(p=>p.alive);
  if(!alive.length)return corners[(Math.floor(now/7))%4];
  if(g.persona===2){
    if(now-g.lastT>2.5||!g.tgt){const p=alive[(Math.random()*alive.length)|0];g.tgt={x:p.gx,y:p.gy};g.lastT=now;}
    return g.tgt;
  }
  const p=alive.reduce((a,b)=>(((a.x-g.x)**2+(a.y-g.y)**2)<((b.x-g.x)**2+(b.y-g.y)**2)?a:b));
  const L=g.persona===0?2:4;
  return {x:p.gx+p.dir.x*L,y:p.gy+p.dir.y*L};
}
function ghostThink(g){
  let opts=[];for(const k in DIRS){const d=DIRS[k];if(canGo(g.gx,g.gy,d))opts.push(d);}
  if(!opts.length)return;
  let pool=opts.filter(d=>d.x!==-g.dir.x||d.y!==-g.dir.y);if(!pool.length)pool=opts;
  if(frightT>0||Math.random()<(g.persona===2?0.3:0.1)){g.nextDir=pool[(Math.random()*pool.length)|0];return;}
  const t=ghostTarget(g);let best=pool[0],bs=1e9;
  for(const d of pool){
    const tx=g.gx+d.x,ty=g.gy+d.y;
    let s=(tx-t.x)**2+(ty-t.y)**2;if(d.x===g.dir.x&&d.y===g.dir.y)s-=0.05;
    if(s<bs){bs=s;best=d;}
  }
  g.nextDir=best;
}

/* ============================== EFFECTS ============================== */
function burst(x,y,n,color,spd,life){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(0.4+Math.random()*0.8)*spd;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:life,life,color});}
}

/* ============================== GAME FLOW ============================== */
function eatAt(p,award){
  const tx=Math.floor(p.x),ty=Math.floor(p.y);
  if(ty<0||ty>=ROWS||tx<0||tx>=COLS)return;
  const v=grid[ty][tx];if(v===0)return;
  if(v===1){
    grid[ty][tx]=0;dotsLeft--;if(award)p.score+=10;
    S.dot();burst(tx+.5,ty+.5,3,'#ffd9b8',1.2,.3);
  }else{
    grid[ty][tx]=0;dotsLeft--;if(award)p.score+=50;
    S.pellet();frightT=7;chainIdx=0;
    for(const g of ghosts)if(g.mode==='out'){g.dir={x:-g.dir.x,y:-g.dir.y};g.nextDir=null;}
    rings.push({x:tx+.5,y:ty+.5,r:.2,t:1,color:award?p.color:'#ffd94a'});
    burst(tx+.5,ty+.5,10,'#ffd94a',2.6,.5);
  }
}
function killPac(p){
  p.alive=false;p.lives--;koWinner=pacs[p.n===1?1:0];
  S.death();shakeT=.45;deadPac=p;dyingT=1.35;state='dying';
}
function endGame(reason){
  state='over';S.win();
  const a=pacs[0].score,b=pacs[1].score;
  const w=reason==='ko'?koWinner:(a>b?pacs[0]:(b>a?pacs[1]:null));
  const why=reason==='ko'?('K.O. — '+(deadPac.n===1?'CYAN':'PINK')+' ran out of lives')
            :reason==='time'?'time is up — highest score wins':'the maze cleared — highest score wins';
  const nb=[];
  if(pacs[0].score>best.p1){nb.push('P1 CYAN');best.p1=pacs[0].score;}
  if(pacs[1].score>best.p2){nb.push('P2 PINK');best.p2=pacs[1].score;}
  saveStore({p1:best.p1,p2:best.p2,muted});
  showOv(overHTML(w,why,nb),'dim');
}
function startGame(){
  parseMap();
  pacs=[makePac(1),makePac(2)];
  ghosts=[makeGhost(0),makeGhost(1),makeGhost(2)];
  ghosts[0].exitT=2;ghosts[1].exitT=4.5;ghosts[2].exitT=7;
  parts=[];rings=[];floaters=[];
  frightT=0;chainIdx=0;gameT=GAME_TIME;shakeT=0;deadPac=null;koWinner=null;
  lastS=[-1,-1];lastL=[-1,-1];lastT='';lastD=-1;
  state='ready';readyT=1.8;S.start();showOv(readyHTML(),'');
}
function initMenu(){
  parseMap();
  pacs=[makePac(1),makePac(2)];
  ghosts=[makeGhost(0),makeGhost(1),makeGhost(2)];
  const spots=[[12,7],[4,5],[20,5]];
  ghosts.forEach((g,i)=>{g.mode='out';g.gx=spots[i][0];g.gy=spots[i][1];g.x=g.gx+.5;g.y=g.gy+.5;});
  parts=[];rings=[];floaters=[];frightT=0;gameT=GAME_TIME;state='menu';
  showOv(menuHTML(),'dim');
}

/* ============================== UPDATE ============================== */
function update(dt){
  now+=dt;
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  parts=parts.filter(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=(1-2.6*dt);p.vy*=(1-2.6*dt);return p.t>0;});
  rings=rings.filter(r=>{r.r+=dt*4;r.t-=dt*2.4;return r.t>0;});
  floaters=floaters.filter(f=>{f.t-=dt*1.15;f.y-=dt*1.3;return f.t>0;});

  if(state==='menu'){
    for(const p of pacs){if(!p.alive)continue;p.invulnT=0;moveEntity(p,PAC_SPEED*dt);eatAt(p,false);}
    for(const g of ghosts)if(g.mode==='out')moveEntity(g,GHOST_SPEED*dt);
    if(dotsLeft<40)parseMap();
    for(const g of ghosts){if(g.mode!=='out')continue;
      for(const p of pacs){if(!p.alive)continue;
        if((g.x-p.x)**2+(g.y-p.y)**2<0.34){resetPacPos(p);burst(p.gx+.5,p.gy+.5,10,p.color,2.5,.6);break;}}}
    return;
  }
  if(state==='ready'){readyT-=dt;if(readyT<=0){state='play';showOv(null,'');}return;}
  if(state==='dying'){
    dyingT-=dt;
    if(dyingT<=0){if(deadPac.lives>0){resetPacPos(deadPac);state='play';}else endGame('ko');}
    return;
  }
  if(state!=='play')return;

  gameT-=dt;
  if(gameT>0&&gameT<=10&&Math.ceil(gameT)!==Math.ceil(gameT+dt))S.tick();
  frightT=Math.max(0,frightT-dt);

  for(const p of pacs){if(!p.alive)continue;p.invulnT=Math.max(0,p.invulnT-dt);moveEntity(p,PAC_SPEED*dt);eatAt(p,true);}
  for(const g of ghosts){
    if(g.mode==='house'){g.exitT-=dt;if(g.exitT<=0){g.mode='out';g.gx=12;g.gy=7;g.x=12.5;g.y=7.5;g.dir=Math.random()<.5?DIRS.L:DIRS.R;g.nextDir=null;}continue;}
    moveEntity(g,(frightT>0?FRIGHT_SPEED:GHOST_SPEED)*dt);
  }
  for(const g of ghosts){if(g.mode!=='out')continue;
    for(const p of pacs){if(!p.alive)continue;
      if((g.x-p.x)**2+(g.y-p.y)**2<0.34){
        if(frightT>0){
          const pts=CHAIN[Math.min(chainIdx,3)];chainIdx++;p.score+=pts;
          S.ghost();floaters.push({x:g.x,y:g.y-.4,text:'+'+pts,color:p.color,t:1});
          burst(g.x,g.y,14,'#bcd2ff',3,.6);
          g.mode='house';g.gx=g.homeX;g.gy=9;g.x=g.homeX+.5;g.y=9.5;g.exitT=3;
        }else if(p.invulnT<=0)killPac(p);
        break;
      }}}
  if(state!=='play')return;
  if(dotsLeft<=0)endGame('dots');
  else if(gameT<=0){gameT=0;endGame('time');}
}

/* ============================== RENDER ============================== */
let W=0,H=0,dpr=1,T=16,mx=0,my=0,mcz=null,mzPad=0;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const hud=78,pad=16;
  T=Math.max(6,Math.floor(Math.min((W-pad*2)/COLS,(H-hud-pad*2)/ROWS)));
  mx=Math.round((W-COLS*T)/2);
  my=Math.round(hud+Math.max(0,(H-hud-ROWS*T)/2));
  buildMaze();
}
function rr(c,x,y,w,h,r){c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function buildMaze(){
  mzPad=Math.ceil(T*.8)+12;
  mcz=document.createElement('canvas');
  mcz.width=(COLS*T+2*mzPad)*dpr;mcz.height=(ROWS*T+2*mzPad)*dpr;
  const c=mcz.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.translate(mzPad,mzPad);
  // board backdrop
  c.beginPath();rr(c,-T*.6,-T*.6,COLS*T+1.2*T,ROWS*T+1.2*T,T);
  c.fillStyle='rgba(7,11,40,.85)';c.fill();
  c.lineWidth=2;c.strokeStyle='rgba(99,132,255,.4)';c.shadowColor='rgba(80,120,255,.6)';c.shadowBlur=T*.8;c.stroke();c.shadowBlur=0;
  // wall mass
  c.fillStyle='#0d1550';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
    if(wall[y][x]&&!(x===DOOR.x&&y===DOOR.y))c.fillRect(x*T,y*T,T+.6,T+.6);
  // glowing edges facing corridors
  c.strokeStyle='#5f7dff';c.lineWidth=Math.max(1.5,T*.14);c.lineCap='round';
  c.shadowColor='#7d9bff';c.shadowBlur=T*.4;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(!wall[y][x]||(x===DOOR.x&&y===DOOR.y))continue;
    const X=x*T,Y=y*T;
    if(y>0&&!wall[y-1][x]){c.beginPath();c.moveTo(X,Y);c.lineTo(X+T,Y);c.stroke();}
    if(y<ROWS-1&&!wall[y+1][x]){c.beginPath();c.moveTo(X,Y+T);c.lineTo(X+T,Y+T);c.stroke();}
    if(x>0&&!wall[y][x-1]){c.beginPath();c.moveTo(X,Y);c.lineTo(X,Y+T);c.stroke();}
    if(x<COLS-1&&!wall[y][x+1]){c.beginPath();c.moveTo(X+T,Y);c.lineTo(X+T,Y+T);c.stroke();}
  }
  // house door
  const dx=DOOR.x*T,dy=DOOR.y*T;
  c.fillStyle='#ff9ad5';c.shadowColor='#ff9ad5';c.shadowBlur=T*.4;
  c.fillRect(dx+1,dy+T*.42,T-2,T*.16);c.shadowBlur=0;
}
function angOf(d){return d.x===1?0:(d.x===-1?Math.PI:(d.y===1?Math.PI/2:-Math.PI/2));}
function drawPac(px,py,r,color,ang,mouth,alpha){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;
  ctx.translate(px,py);ctx.rotate(ang);
  ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=r*.8;
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,mouth,Math.PI*2-mouth);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawGhost(g,px,py){
  const r=T*.44,fr=frightT>0&&g.mode==='out';
  const flash=fr&&frightT<2&&(Math.floor(now*8)%2);
  const body=fr?(flash?'#e8f0ff':'#2b3cff'):g.color;
  const cy=py-r*.1,feetY=py+r*.72,w=r*2/3,ph=Math.sin(now*10+g.i)*r*.06;
  ctx.save();
  ctx.shadowColor=fr?(flash?'#ffffff':'#4658ff'):g.color;ctx.shadowBlur=T*.45;
  ctx.fillStyle=body;ctx.beginPath();
  ctx.arc(px,cy,r,Math.PI,Math.PI*2);
  ctx.lineTo(px+r,feetY+ph);
  for(let k=0;k<3;k++){const cx2=px+r-w*(k+.5);ctx.arc(cx2,feetY+ph,w/2,0,Math.PI,true);}
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  const ec=(fr&&flash)?'#2b3cff':'#ffffff';
  const ex=r*.36,ey=cy-r*.05,ox=g.dir.x*r*.14,oy=g.dir.y*r*.14;
  ctx.fillStyle=ec;
  ctx.beginPath();ctx.arc(px-ex,ey,r*.26,0,6.283);ctx.arc(px+ex,ey,r*.26,0,6.283);ctx.fill();
  ctx.fillStyle=(fr&&flash)?'#1a2a99':'#101433';
  ctx.beginPath();ctx.arc(px-ex+ox,ey+oy,r*.13,0,6.283);ctx.arc(px+ex+ox,ey+oy,r*.13,0,6.283);ctx.fill();
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(!grid||!mcz)return;
  ctx.save();
  if(shakeT>0){const a=shakeT*12;ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a);}
  ctx.drawImage(mcz,mx-mzPad,my-mzPad);
  // dots (batched)
  ctx.fillStyle='#ffd9b8';ctx.shadowColor='rgba(255,190,140,.7)';ctx.shadowBlur=T*.3;
  ctx.beginPath();let has=false;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]===1){const px=mx+(x+.5)*T,py=my+(y+.5)*T,r=T*.09;ctx.moveTo(px+r,py);ctx.arc(px,py,r,0,6.283);has=true;}
  }
  if(has)ctx.fill();
  // pellets (pulsing)
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]===2){
      const px=mx+(x+.5)*T,py=my+(y+.5)*T,pr=T*(.26+.05*Math.sin(now*7+x*.7+y));
      ctx.shadowBlur=T*.7;ctx.beginPath();ctx.arc(px,py,pr,0,6.283);ctx.fill();
    }
  }
  ctx.shadowBlur=0;
  // rings
  for(const r of rings){ctx.globalAlpha=Math.max(0,r.t);ctx.strokeStyle=r.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(mx+r.x*T,my+r.y*T,r.r*T,0,6.283);ctx.stroke();}
  ctx.globalAlpha=1;
  // ghosts
  for(const g of ghosts){const bob=g.mode==='house'?Math.sin(now*4+g.bobP)*.1:0;drawGhost(g,mx+g.x*T,my+(g.y+bob)*T);}
  // pacs
  for(const p of pacs){
    if(!p.alive)continue;
    let al=1;if(p.invulnT>0&&state==='play')al=(Math.floor(now*14)%2)?.35:1;
    drawPac(mx+p.x*T,my+p.y*T,T*.42,p.color,angOf(p.dir),.18+.4*Math.abs(Math.sin(now*9+p.ph)),al);
  }
  // death animation
  if(state==='dying'&&deadPac){
    const ph=1-dyingT/1.35;
    const mo=Math.min(1,ph*1.7);
    const sc=ph<.7?1:Math.max(.05,1-(ph-.7)/.3);
    drawPac(mx+deadPac.x*T,my+deadPac.y*T,T*.42*sc,deadPac.color,angOf(deadPac.dir),.3+mo*(Math.PI-.3));
  }
  // particles
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.t/p.life);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(mx+p.x*T,my+p.y*T,T*.07,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  // floaters
  for(const f of floaters){
    const px=mx+f.x*T,py=my+f.y*T;
    ctx.globalAlpha=Math.max(0,f.t);
    ctx.font='700 '+Math.round(T*.95)+'px Verdana';ctx.textAlign='center';
    ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';
    ctx.strokeText(f.text,px,py);ctx.fillStyle=f.color;ctx.fillText(f.text,px,py);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ============================== HUD ============================== */
let lastS=[-1,-1],lastL=[-1,-1],lastT='',lastD=-1;
function popEl(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function livesHTML(p){
  let s='';for(let i=0;i<Math.max(0,p.lives);i++)s+='<i class="lf '+(p.n===1?'lfa':'lfb')+'"></i>';
  return s||'<span class="dead">OUT</span>';
}
function hud(){
  if(!pacs.length)return;
  const s1=pacs[0].score,s2=pacs[1].score;
  if(s1!==lastS[0]){hudS1.textContent=s1;popEl(hudS1);lastS[0]=s1;}
  if(s2!==lastS[1]){hudS2.textContent=s2;popEl(hudS2);lastS[1]=s2;}
  const t=Math.max(0,Math.ceil(gameT)),ts=(t/60|0)+':'+String(t%60).padStart(2,'0');
  if(ts!==lastT){hudTime.textContent=ts;lastT=ts;}
  if(dotsLeft!==lastD){hudDots.textContent='DOTS '+dotsLeft;lastD=dotsLeft;}
  if(pacs[0].lives!==lastL[0]){hudL1.innerHTML=livesHTML(pacs[0]);lastL[0]=pacs[0].lives;}
  if(pacs[1].lives!==lastL[1]){hudL2.innerHTML=livesHTML(pacs[1]);lastL[1]=pacs[1].lives;}
  fchip.classList.toggle('on',frightT>0&&state==='play');
  if(frightT>0)ftEl.textContent=Math.ceil(frightT);
}

/* ============================== OVERLAYS ============================== */
function showOv(html,mode){ovEl.className=html?('show '+(mode||'')).trim():'';ovEl.innerHTML=html||'';}
function menuHTML(){
  const bl=(best.p1||best.p2)?('BEST — P1 CYAN '+best.p1+' · P2 PINK '+best.p2+'<br>'):'';
  return '<div class="wrap">'+
  '<div class="lane"></div>'+
  '<h1><span class="t1"><i class="pac p1c"></i>PAC</span><em>VS</em><span class="t2">PAC<i class="pac p2c"></i></span></h1>'+
  '<p class="tag">two-player maze duel · race the dots · eat the ghosts</p>'+
  '<div class="cols">'+
    '<div class="ccard cA"><h3>P1 · CYAN</h3>'+
      '<div class="kgrid"><span></span><kbd>W</kbd><span></span><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span></span></div>'+
      '<p>steer with <b>W A S D</b></p></div>'+
    '<div class="ccard cB"><h3>P2 · PINK</h3>'+
      '<div class="kgrid"><span></span><kbd>↑</kbd><span></span><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span></span></div>'+
      '<p>steer with <b>arrow keys</b></p></div>'+
  '</div>'+
  '<div class="chips"><span class="chip">DOT · <b>10</b></span><span class="chip">PELLET · <b>50</b> — ghosts turn blue</span><span class="chip">GHOST · <b>200</b>, chain ×2</span><span class="chip"><b>3 lives</b> — K.O. ends the round</span></div>'+
  '<button class="btn" data-act="start">▶&nbsp; START GAME — ENTER</button>'+
  '<p class="sub">'+bl+'P pause · M sound ('+(muted?'off':'on')+') · R restart</p>'+
  '</div>';
}
function readyHTML(){
  return '<div class="ready"><h2>READY!</h2><p><b class="cA-t">CYAN</b> WASD &nbsp;·&nbsp; <b class="cB-t">PINK</b> ARROWS</p></div>';
}
function pauseHTML(){
  return '<div class="ready"><h2 style="font-size:clamp(34px,7vw,64px)">PAUSED</h2><p>P TO RESUME</p></div>';
}
function overHTML(w,why,nb){
  const wt=w?(w.n===1?'P1 WINS!':'P2 WINS!'):"IT'S A DRAW";
  const cls=w?(w.n===1?'t1c':'t2c'):'drc';
  return '<div class="wrap">'+
  '<h2 class="winT '+cls+'">'+wt+'</h2>'+
  '<p class="tag" style="margin:6px 0 4px">'+why+'</p>'+
  '<div class="scoreboard">'+
    '<div class="sb '+(w&&w.n===1?'wA':'')+'"><span>P1 · CYAN</span><b>'+pacs[0].score+'</b></div>'+
    '<div class="sb '+(w&&w.n===2?'wB':'')+'"><span>P2 · PINK</span><b>'+pacs[1].score+'</b></div>'+
  '</div>'+
  (nb.length?'<p class="nb">★ NEW BEST — '+nb.join(' & ')+' ★</p>':'')+
  '<br><button class="btn" data-act="start">REMATCH — ENTER</button>'+
  '<p class="sub">or press R anytime · M sound ('+(muted?'off':'on')+')'+((best.p1||best.p2)?('<br>BEST — P1 '+best.p1+' · P2 '+best.p2):'')+'</p>'+
  '</div>';
}

/* ============================== INPUT ============================== */
const K1={KeyW:'U',KeyA:'L',KeyS:'D',KeyD:'R'};
const K2={ArrowUp:'U',ArrowLeft:'L',ArrowDown:'D',ArrowRight:'R'};
function setDir(p,d){
  if(!p||!p.alive)return;
  const v=DIRS[d];
  if(v.x===-p.dir.x&&v.y===-p.dir.y){p.dir=v;p.nextDir=null;}
  else p.nextDir=v;
}
function togglePause(){
  if(state==='play'){state='pause';showOv(pauseHTML(),'dim');}
  else if(state==='pause'){state='play';showOv(null,'');}
}
window.addEventListener('keydown',e=>{
  const c=e.code;
  if(c.indexOf('Arrow')===0||c==='Space')e.preventDefault();
  audio();
  if(c==='KeyM'){muted=!muted;saveStore({p1:best.p1,p2:best.p2,muted});
    if(state==='menu')showOv(menuHTML(),'dim');else if(state==='over')showOv(ovEl.querySelector('.wrap').outerHTML,'dim');return;}
  if(c==='KeyP'){if(state==='play'||state==='pause')togglePause();return;}
  if(c==='Enter'||c==='NumpadEnter'){if(state==='menu'||state==='over')startGame();return;}
  if(c==='KeyR'){startGame();return;}
  if(K1[c])setDir(pacs[0],K1[c]);
  if(K2[c])setDir(pacs[1],K2[c]);
});
document.addEventListener('pointerdown',()=>audio());
ovEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  audio();if(b.dataset.act==='start')startGame();
});
window.addEventListener('blur',()=>{if(state==='play')togglePause();});
window.addEventListener('resize',resize);

/* ============================== LOOP ============================== */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);render();hud();
}
initMenu();
resize();
requestAnimationFrame(frame);
</script>
</body>
