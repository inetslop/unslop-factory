<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hop Fortune — Frogger Clicker</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04120d}
  canvas{display:block;position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
"use strict";
/* ============================== SETUP ============================== */
const cv=document.getElementById('g'),ctx=cv.getContext('2d');
const DW=1120,DH=600,COLS=13,CELL=52,BX=28,BY=104,BW=COLS*CELL,BH=7*CELL;
const PAD_COLS=[1,3,6,9,11];
let dpr=1,scale=1,offX=0,offY=0,W=0,H=0;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;scale=Math.min(W/DW,H/DH);offX=(W-DW*scale)/2;offY=(DH*0+ (H-DH*scale))/2;}
addEventListener('resize',resize);resize();

const FD="Impact,'Arial Black','Franklin Gothic Bold',sans-serif";
const FU="'Trebuchet MS',Verdana,sans-serif";
const FM="'Courier New',monospace";
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,t)=>a+(b-a)*t;
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);ctx.fill();}
function text(s,x,y,o){o=o||{};const f=o.f||FU,sz=o.s||14,c=o.c||'#eaffea',a=o.a||'left',base=o.base||'alphabetic';
 ctx.font=(o.b?'bold ':'')+sz+'px '+f;ctx.fillStyle=c;ctx.textAlign=a;ctx.textBaseline=base;let sp=null;
 if(o.ls){try{sp=ctx.letterSpacing;ctx.letterSpacing=o.ls+'px';}catch(e){}}
 ctx.fillText(s,x,y);if(sp!=null){try{ctx.letterSpacing=sp;}catch(e){}}}
function easeOutBack(p){const c=1.70158;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);}

/* ============================== SAVE ============================== */
const KEY='hopFortune.v1';
let bestLevel=0,muted=false,hasSave=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify({c:S.coins,u:S.up,best:bestLevel,cl:S.clicks,m:muted}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;
 S.coins=d.c|0;for(const k in S.up)S.up[k]=clamp(d.u?d.u[k]|0:0,0,9);bestLevel=d.best|0;S.clicks=d.cl|0;muted=!!d.m;
 hasSave=(S.coins>0||S.clicks>0||Object.values(S.up).some(v=>v>0));}catch(e){}}

/* ============================== AUDIO ============================== */
let AC=null,masterG=null;
function ensureAudio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();masterG=AC.createGain();masterG.gain.value=.45;masterG.connect(AC.destination);}if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f0,f1,d,type,v,dl){if(!AC||muted)return;type=type||'square';v=v==null?.25:v;dl=dl||0;const t0=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(masterG);o.start(t0);o.stop(t0+d+.02);}
function noiseS(d,f0,f1,v,dl){if(!AC||muted)return;v=v==null?.3:v;dl=dl||0;const t0=AC.currentTime+dl,n=(AC.sampleRate*d)|0,b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+d);const g=AC.createGain();g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);s.connect(f);f.connect(g);g.connect(masterG);s.start(t0);}
const sfx={
 hop(){tone(320,540,.06,'square',.13);},
 pad(){tone(660,990,.08,'triangle',.2);tone(990,1320,.09,'triangle',.14,.06);},
 coin(){tone(988,988,.05,'sine',.16);tone(1319,1319,.08,'sine',.16,.05);},
 splash(){noiseS(.35,1400,180,.32);tone(200,60,.3,'sine',.2);},
 crash(){tone(300,55,.32,'sawtooth',.28);noiseS(.22,2400,300,.22);},
 pop(){tone(300,980,.14,'sine',.2);noiseS(.12,3200,700,.08);},
 buy(){tone(520,780,.1,'triangle',.2);tone(1040,1560,.12,'triangle',.14,.07);},
 deny(){tone(150,95,.16,'square',.18);},
 click(){tone(230,190,.05,'square',.09);},
 level(){[523,659,784,1046].forEach((f,i)=>tone(f,f,.12,'triangle',.18,i*.09));},
 over(){tone(392,196,.5,'sawtooth',.18);tone(196,98,.6,'sawtooth',.16,.25);},
 revive(){tone(220,880,.4,'sine',.2);}
};

/* ============================== STATE ============================== */
const S={mode:'start',paused:false,coins:0,up:{speed:0,gold:0,auto:0,life:0,shield:0},level:1,
 pads:[false,false,false,false,false],lives:3,shields:0,runCoins:0,runCross:0,clicks:0,bannerT:0,lastBonus:0};
const F={x:6.5,row:6,state:'idle',t:0,p:1,fromX:6.5,toX:6.5,fromRow:6,toRow:6,face:1,lookUp:true,pending:null,invuln:0,deathCause:''};
let t=0,coinPop=0,landT=0,autoT=0,tipI=0,tipT=0,wipeArm=0;
const shake={t:0,dur:1,mag:0};
const denied={},flash={};

const UPS=[
 {id:'speed', name:'QUICK HOPS',  desc:'Your frog pounces faster',        base:15,g:1.7,max:5},
 {id:'gold',  name:'GOLDEN TONGUE',desc:'+40% coins from every pad',       base:25,g:1.8,max:5},
 {id:'auto',  name:'AUTO-HOPPER', desc:'A tireless hopper works for you',  base:45,g:2.3,max:5},
 {id:'life',  name:'SPARE LIVES', desc:'+1 max life, +1 right now',        base:30,g:2,  max:6},
 {id:'shield',name:'LUCKY CHARM', desc:'Bubble shield; +1 each level-up',  base:60,g:2.2,max:3}];
const costOf=u=>Math.round(u.base*Math.pow(u.g,S.up[u.id]));
const maxLives=()=>3+S.up.life, goldMult=()=>1+.4*S.up.gold;
const autoInt=()=>[0,2.6,2.1,1.7,1.35,1.0][S.up.auto];
const hopDur=()=>.13*Math.pow(.88,S.up.speed);
const reviveCost=()=>40+25*S.level;

/* ============================== LANES ============================== */
let roadLanes=[],riverLanes=[];
function buildLanes(){
 const rm=Math.min(2.4,1+.13*(S.level-1)),wm=Math.min(2.2,1+.09*(S.level-1));
 const mk=(row,dir,spd,len,type,gap,body,trim)=>({row,dir,spd,len,type,gap,body,trim,ents:[]});
 roadLanes=[mk(3, 1,2.0*rm,2,'car',4,'#ff8b4a','#b35a1f'),mk(4,-1,1.4*rm,3,'truck',5,'#a9c0d4','#5f7890'),mk(5, 1,1.05*rm,4,'bus',6,'#ffd166','#bd8f2e')];
 riverLanes=[{row:2,dir:1,spd:1.2*wm,gap:5,ents:[]},{row:1,dir:-1,spd:.95*wm,gap:5,ents:[]}];
 for(const L of roadLanes){const n=Math.max(2,Math.round(COLS*.5/L.len));for(let i=0;i<n;i++)L.ents.push({x:-3+(COLS+6)/n*i+rand(-.6,.6),w:L.len});}
 for(const L of riverLanes){for(let i=0;i<3;i++){const w=Math.random()<.5?2:3;L.ents.push({x:-4+(COLS+8)/3*i+rand(-1,1),w});}}
}
buildLanes();load();

function carHit(row,x){const L=roadLanes.find(l=>l.row===row);if(!L)return false;for(const e of L.ents){const m=.18;if(x+.3>e.x+m&&x-.3<e.x+e.w-m)return true;}return false;}
function logAt(row,x){const L=riverLanes.find(l=>l.row===row);if(!L)return null;for(const e of L.ents){if(x>e.x-.15&&x<e.x+e.w+.15)return e;}return null;}

/* ============================== FROG LOGIC ============================== */
function resetFrog(){F.x=6.5;F.row=6;F.state='idle';F.t=0;F.p=1;F.face=1;F.lookUp=true;F.pending=null;autoT=0;}
resetFrog();

function doHop(dx,dy,manual){
 if(S.mode!=='play'||S.paused||S.bannerT>0||F.state==='dying')return;
 if(F.state==='hop'){if((F.t||0)>.5)F.pending=[dx,dy];return;}
 let tx=F.x+dx,ty=F.row+dy;tx=clamp(tx,.5,COLS-.5);ty=clamp(ty,0,6);
 if(tx===F.x&&ty===F.row)return;
 F.fromX=F.x;F.toX=tx;F.fromRow=F.row;F.toRow=ty;F.state='hop';F.t=0;F.p=0;
 if(dx)F.face=dx>0?1:-1;if(dy)F.lookUp=dy<0;
 if(manual)S.clicks++;
 sfx.hop();
 const px=BX+F.x*CELL,py=BY+(F.row+.5)*CELL;
 for(let i=0;i<4;i++)parts.push({k:'dot',x:px,y:py+8,vx:rand(-30,30),vy:rand(-10,26),g:0,r:rand(1.5,3),c:'#3f8f5a',t:0,dur:.3});
}
function resolveArrival(){
 if(F.state!=='idle')return;
 if(F.row===0){const i=PAD_COLS.findIndex((c,k)=>!S.pads[k]&&Math.abs(F.x-(c+.5))<.45);if(i>=0)fillPad(i);else drown();return;}
 if(F.row<=2){if(!logAt(F.row,F.x))drown();return;}
 if(F.invuln<=0&&carHit(F.row,F.x))hitCar();
}
function drown(){
 if(S.shields>0){S.shields--;F.invuln=1.4;sfx.pop();
  const px=BX+F.x*CELL,py=BY+(F.row+.5)*CELL;ringFx(px,py,'#9ff0ff');
  floater('BUOYED!',px,py-14,'#9ff0ff');resetFrog();puff(BX+6.5*CELL,BY+6.5*CELL,'#7ded8a',12,50);return;}
 die('splash');
}
function hitCar(){
 if(S.shields>0){S.shields--;F.invuln=1.6;sfx.pop();
  const px=BX+F.x*CELL,py=BY+(F.row+.5)*CELL;ringFx(px,py,'#9ff0ff');floater('CHARM!',px,py-14,'#9ff0ff');
  F.row=Math.min(6,F.row+1);F.x=Math.round(F.x-.5)+.5;puff(px,py,'#ffb35c',8,70);return;}
 die('crash');
}
function die(cause){
 S.lives--;F.state='dying';F.t=1;F.deathCause=cause;F.pending=null;
 shake.t=.45;shake.dur=.45;shake.mag=9;
 const px=BX+F.x*CELL,py=BY+(F.row+.5)*CELL;
 if(cause==='splash'){sfx.splash();ringFx(px,py,'#bfe8f7');
  for(let i=0;i<12;i++)parts.push({k:'dot',x:px,y:py,vx:rand(-90,90),vy:-rand(50,170),g:340,r:rand(1.5,3.5),c:'#9fd8ef',t:0,dur:.7});
  for(let i=0;i<4;i++)parts.push({k:'bubble',x:px+rand(-8,8),y:py,vx:rand(-6,6),vy:-rand(24,50),r:rand(2,4),c:'#bfe8f7',t:0,dur:.8});}
 else{sfx.crash();
  for(let i=0;i<12;i++)parts.push({k:'spark',x:px,y:py,vx:rand(-190,190),vy:-rand(40,210),g:380,r:2.5,c:'#ffb35c',t:0,dur:.6});
  for(let i=0;i<6;i++)parts.push({k:'dot',x:px,y:py,vx:rand(-40,40),vy:-rand(10,50),g:-20,r:rand(2,4),c:'#6b7a80',t:0,dur:.9});}
 floater('-1 LIFE',px,py-22,'#ff8a63');
}
function fillPad(i){
 S.pads[i]=true;S.runCross++;
 const px=BX+(PAD_COLS[i]+.5)*CELL,py=BY+CELL/2;
 sfx.pad();addCoins(Math.round((2+S.level)*goldMult()),px,py);
 for(let k=0;k<10;k++)parts.push({k:'spark',x:px,y:py,vx:rand(-140,140),vy:-rand(30,160),g:220,r:2.5,c:k%2?'#ffd75e':'#7ded8a',t:0,dur:.5});
 if(S.pads.every(p=>p)){S.lastBonus=Math.round(25*S.level*goldMult());addCoins(S.lastBonus,BX+BW/2,BY+BH/2);S.bannerT=1.7;sfx.level();confetti();}
}
function addCoins(n,px,py){S.coins+=n;S.runCoins+=n;coinPop=1;sfx.coin();floater('+'+n,px,py-8,'#ffd75e');
 const c=Math.min(6,1+(n/4|0));for(let i=0;i<c;i++)parts.push({k:'coin',sx:px,sy:py,t:0,dur:.55+i*.09});}
function advanceLevel(){S.level++;bestLevel=Math.max(bestLevel,S.level);buildLanes();S.pads=[false,false,false,false,false];resetFrog();F.invuln=.8;
 puff(BX+6.5*CELL,BY+6.5*CELL,'#7ded8a',14,50);
 if(S.up.shield>0&&S.shields<S.up.shield){S.shields++;floater('+ BUBBLE',BX+6.5*CELL,BY+6.5*CELL-18,'#9ff0ff');}save();}
function startRun(){S.level=1;S.pads=[false,false,false,false,false];S.lives=maxLives();S.shields=S.up.shield;S.runCoins=0;S.runCross=0;buildLanes();resetFrog();S.bannerT=0;S.paused=false;S.mode='play';sfx.level();}
function gameOver(){F.t=Math.max(0,F.t);S.mode='over';bestLevel=Math.max(bestLevel,S.level);save();sfx.over();}
function revive(){const c=reviveCost();if(S.coins<c)return false;S.coins-=c;S.lives=maxLives();resetFrog();F.invuln=1.5;puff(BX+6.5*CELL,BY+6.5*CELL,'#7ded8a',16,60);S.mode='play';sfx.revive();save();return true;}
function buy(id){const u=UPS.find(x=>x.id===id);if(!u||S.up[id]>=u.max)return;const c=costOf(u);
 if(S.coins<c){denied[id]=.4;sfx.deny();return;}S.coins-=c;S.up[id]++;flash[id]=.5;
 if(id==='life')S.lives=Math.min(maxLives(),S.lives+1);sfx.buy();save();}

function autoStep(){
 if(S.mode!=='play'||S.paused||S.bannerT>0||F.state!=='idle'||F.row===0)return;
 if(F.row<=2){const L=riverLanes.find(l=>l.row===F.row);
  if(!logAt(F.row,F.x)){let best=null,bd=1e9;for(const e of L.ents){const c=e.x+e.w/2,d=Math.abs(c-F.x);if(d<bd&&d<=3.2){bd=d;best=c;}}if(best!=null)doHop(best>F.x?1:-1,0);}
  else{const proj=F.x+L.dir*L.spd*autoInt()*1.15;const exit=(L.dir>0&&proj>COLS-1)||(L.dir<0&&proj<1);
   if(exit){if(F.row===2&&!carHit(3,F.x))doHop(0,-1);else doHop(L.dir>0?-1:1,0);}}
 }else{const up=F.row-1;if(up>=3&&carHit(up,F.x))doHop(F.x<COLS/2?1:-1,0);else doHop(0,-1);}
}

/* ============================== PARTICLES ============================== */
let parts=[],floats=[];
function puff(px,py,c,n,sp){for(let i=0;i<(n||10);i++)parts.push({k:'dot',x:px,y:py,vx:rand(-sp,sp),vy:rand(-sp,sp)-20,g:0,r:rand(2,4.5),c,t:0,dur:rand(.35,.7)});}
function ringFx(px,py,c){parts.push({k:'ring',x:px,y:py,r:6,vr:150,c,t:0,dur:.5});}
function confetti(){const cs=['#ffd75e','#7ded8a','#9ff0ff','#ff8b4a'];for(let i=0;i<46;i++)parts.push({k:'conf',x:rand(BX,BX+BW),y:BY-10,vx:rand(-30,30),vy:rand(20,90),g:120,c:cs[i%4],r:rand(3,5),rot:rand(0,6.3),vr:rand(-6,6),t:0,dur:rand(1.2,2)});}
function floater(s,x,y,c){floats.push({s,x,y,c,t:1});}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.dur){parts.splice(i,1);continue;}
 if(p.k==='dot'||p.k==='spark'){p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
 else if(p.k==='bubble'){p.x+=p.vx*dt+Math.sin(t*8+p.r)*.4;p.y+=p.vy*dt;}
 else if(p.k==='conf'){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}}}
function updateFloats(dt){for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt*.85;f.y-=26*dt;if(f.t<=0)floats.splice(i,1);}}

/* ============================== INPUT ============================== */
let mX=null,mY=null,uiBtns=[];
function toDesign(e){return[(e.clientX-offX)/scale,(e.clientY-offY)/scale];}
function hopDirFromPoint(mx,my){if(S.mode!=='play'||S.paused||F.state==='dying')return null;
 const fx=mx-(BX+F.x*CELL),fy=my-(BY+(F.row+.5)*CELL);if(Math.hypot(fx,fy)<12)return null;
 return Math.abs(fx)>Math.abs(fy)?[fx>0?1:-1,0]:[0,fy>0?1:-1];}

cv.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();const p=toDesign(e);mX=p[0];mY=p[1];
 for(let i=uiBtns.length-1;i>=0;i--){const b=uiBtns[i];if(mX>=b.x&&mX<=b.x+b.w&&mY>=b.y&&mY<=b.y+b.h){if(b.on)b.on();else sfx.deny();return;}}
 if(S.mode==='play'&&!S.paused){const d=hopDirFromPoint(mX,mY);if(d)doHop(d[0],d[1],true);}
});
cv.addEventListener('pointermove',e=>{const p=toDesign(e);mX=p[0];mY=p[1];});
cv.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{ensureAudio();const k=e.key;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>=0)e.preventDefault();
 if(k==='m'||k==='M'){muted=!muted;save();return;}
 if(S.mode==='start'){if(k==='Enter'||k===' ')startRun();return;}
 if(S.mode==='over'){if(k==='Enter'||k===' '){if(S.coins>=reviveCost())revive();else startRun();}return;}
 if(S.mode==='play'){if(k==='p'||k==='P'){S.paused=!S.paused;sfx.click();return;}
  const m={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[k];
  if(m)doHop(m[0],m[1],true);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='play')S.paused=true;});
window.addEventListener('beforeunload',save);

/* ============================== UPDATE ============================== */
function moveVehicles(dt){for(const L of roadLanes.concat(riverLanes))for(const e of L.ents){e.x+=L.dir*L.spd*dt;
 if(L.dir>0?e.x>COLS+.3:e.x+e.w<-.3)e.x=L.dir>0?-e.w-rand(1,L.gap):COLS+rand(1,L.gap);}}

function update(dt){
 t+=dt;coinPop=Math.max(0,coinPop-dt*3.2);landT=Math.max(0,landT-dt);F.invuln=Math.max(0,F.invuln-dt);
 if(shake.t>0)shake.t-=dt;if(wipeArm>0)wipeArm-=dt;
 for(const id in denied){denied[id]=Math.max(0,denied[id]-dt);}for(const id in flash){flash[id]=Math.max(0,flash[id]-dt);}
 updateParts(dt);updateFloats(dt);
 if(S.bannerT>0){S.bannerT-=dt;if(S.bannerT<=0){S.bannerT=0;advanceLevel();}}
 const worldLive=S.mode==='play'&&!S.paused&&S.bannerT<=0;
 if(worldLive||(S.mode==='start'||S.mode==='over'))moveVehicles(dt);
 if(!worldLive)return;
 if(F.state==='hop'){F.t+=dt/hopDur();F.p=Math.min(1,F.t);
  if(F.p>=1){F.x=F.toX;F.row=F.toRow;F.state='idle';landT=.12;if(F.row!==1&&F.row!==2)F.x=Math.round(F.x-.5)+.5;resolveArrival();
   const q=F.pending;F.pending=null;if(q&&(q[0]||q[1]))doHop(q[0],q[1]);}}
 else if(F.state==='idle'){
  if(F.row>=3){if(F.invuln<=0&&carHit(F.row,F.x))hitCar();}
  else if(F.row===1||F.row===2){const L=riverLanes.find(l=>l.row===F.row);F.x+=L.dir*L.spd*dt;if(!logAt(F.row,F.x))drown();}}
 else if(F.state==='dying'){F.t-=dt;if(F.t<=0){if(S.lives>0){resetFrog();F.invuln=1.2;puff(BX+6.5*CELL,BY+6.5*CELL,'#7ded8a',14,50);}else gameOver();}}
 if(S.up.auto>0&&F.state==='idle'){autoT+=dt;if(autoT>=autoInt()){autoT=0;autoStep();}}
}

/* ============================== DRAW: BACKGROUND ============================== */
const stars=[],flies=[];

 // pond row 0
 ctx.fillStyle='#0b3040';ctx.fillRect(BX,BY,BW,CELL);
 const pg=ctx.createLinearGradient(0,BY,0,BY+CELL);pg.addColorStop(0,'rgba(255,255,255,.06)');pg.addColorStop(.3,'rgba(255,255,255,0)');pg.addColorStop(1,'rgba(0,0,0,.3)');

 for(const L of riverLanes)for(let k=0;k<5;k++){const span=BW+120;let x=((k*167+t*L.dir*30+L.row*90)%span+span)%span-60;

 ctx.fillStyle='#175c38';ctx.fillRect(BX,BY+6*CELL,BW,CELL);
 for(const d of GRASS){ctx.fillStyle=d.c;ell(BX+d.x,BY+d.y-BY,d.r,d.r*.7);}
 for(const f of FLOWERS){ctx.fillStyle=f.c;const x=BX+f.x,y=BY+6*CELL+(f.y-BY);for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;ell(x+Math.cos(a)*3,y+Math.sin(a)*3,2.2,1.6);}ctx.fillStyle='#fff';ell(x,y,1.4,1.4);}
 text('START',BX+BW/2,BY+6*CELL+CELL-8,{s:10,c:'rgba(255,255,255,.22)',a:'center',b:true,ls:3});
 // pads
 PAD_COLS.forEach((c,i)=>{const px=BX+(c+.5)*CELL,py=BY+CELL/2;
  if(S.pads[i]){const gl=ctx.createRadialGradient(px,py,2,px,py,26);gl.addColorStop(0,'rgba(255,215,94,.5)');gl.addColorStop(1,'rgba(255,215,94,0)');
   ctx.fillStyle=gl;ctx.beginPath();ctx.arc(px,py,26,0,7);ctx.fill();
   ctx.fillStyle='#37b06b';ctx.beginPath();ctx.arc(px,py,15,0,7);ctx.fill();ctx.strokeStyle='#1f6b31';ctx.lineWidth=2;ctx.stroke();
   ctx.fillStyle='#0b3040';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+17,py-8);ctx.lineTo(px+17,py+8);ctx.closePath();ctx.fill();
   ctx.save();ctx.translate(px,py);ctx.rotate(t*1.2);ctx.fillStyle='#ffd75e';for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ell(6,0,3.4,1.6);}ctx.restore();}
  else{const a=.4+.3*Math.sin(t*3+i);ctx.strokeStyle='rgba(255,215,94,'+a.toFixed(2)+')';ctx.lineWidth=2;ctx.setLineDash([5,5]);
   ctx.beginPath();ctx.arc(px,py,13,0,7);ctx.stroke();ctx.setLineDash([]);
   ctx.fillStyle='rgba(55,176,107,.4)';ctx.beginPath();ctx.arc(px,py+2,9,0,7);ctx.fill();}});
 // row separators + frame
 ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
 for(let r=1;r<7;r++){ctx.beginPath();ctx.moveTo(BX,BY+r*CELL);ctx.lineTo(BX+BW,BY+r*CELL);ctx.stroke();}
 rr(BX-7,BY-7,BW+14,BH+14,12);ctx.strokeStyle='#0a1f18';ctx.lineWidth=7;ctx.stroke();
 rr(BX-7,BY-7,BW+14,BH+14,12);ctx.strokeStyle='#2f7a5c';ctx.lineWidth=3;ctx.stroke();
 // hop target highlight
 const d=hopDirFromPoint(mX,mY);
 if(d&&(F.state==='idle'||F.state==='hop')){let tx=clamp(F.x+d[0],.5,COLS-.5),ty=clamp(F.row+d[1],0,6);
  if(tx!==F.x||ty!==F.row){const a=.14+.08*Math.sin(t*7);ctx.fillStyle='rgba(255,215,94,'+a.toFixed(2)+')';

 rr(px+5,py+8,w-10,h-16,8);ctx.fillStyle=L.body;ctx.fill();ctx.strokeStyle=L.trim;ctx.lineWidth=2;ctx.stroke();

 else if(L.type==='truck'){const cw=w*.28,cx0=L.dir>0?px+w-cw:px;

 else{ctx.fillStyle='rgba(20,40,60,.55)';const ww=(w-44)/4;for(let i=0;i<4;i++){rr(px+20+i*(ww+6),py+15,ww,h-30,3);ctx.fill();}}

 ctx.beginPath();ctx.arc(0,0,r*.62,0,7);ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.75)';ell(-r*.32,-r*.34,r*.2,r*.16);ctx.restore();}

function drawFrogBody(cx,cy,sx_,sy_,o){o=o||{};ctx.save();ctx.translate(cx,cy);if(o.rot)ctx.rotate(o.rot);
 if(o.alpha!=null)ctx.globalAlpha=o.alpha;ctx.scale(sx_,sy_);
 ctx.fillStyle='#2f9e4b';
 const leg=(lx,ly)=>{const a=Math.atan2(ly,lx);ctx.save();ctx.translate(lx,ly);ctx.rotate(a);ell(0,0,8,4.5);ell(6.5,-2.4,1.7,1.7);ell(7,0,1.7,1.7);ell(6.5,2.4,1.7,1.7);ctx.restore();};
 leg(-12,-11);leg(12,-11);leg(-12,11);leg(12,11);
 const g=ctx.createRadialGradient(-4,-6,2,0,0,19);g.addColorStop(0,'#8df39a');g.addColorStop(.7,'#4cc463');g.addColorStop(1,'#2f9e4b');
 ctx.fillStyle=g;ell(0,0,15.5,14);ctx.strokeStyle='#1f6b31';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,15.5,14,0,0,7);ctx.stroke();
 ctx.fillStyle='rgba(31,110,58,.55)';ell(-5,4,3,2.2);ell(6,-1,2.6,2);ell(0,8,2.4,1.8);
 const up=o.lookUp!==false,ey=up?-11:11;
 for(const ex of [-6,6]){ctx.fillStyle='#fff';ell(ex,ey,4.2,4.2);ctx.fillStyle='#132';ell(ex+(o.face||1)*1.4,ey+(up?-1.5:1.5),2.3,2.3);}
 ctx.restore();}

function frontFrog(cx,cy,r,look){const bl=(t%3.2)<.12;ctx.save();ctx.translate(cx,cy);
 ctx.fillStyle='#2f9e4b';ell(-r*.72,r*.8,r*.36,r*.2);ell(r*.72,r*.8,r*.36,r*.2);
 const g=ctx.createRadialGradient(-r*.3,-r*.3,1,0,0,r*1.2);g.addColorStop(0,'#8df39a');g.addColorStop(.75,'#4cc463');g.addColorStop(1,'#2f9e4b');
 ctx.fillStyle=g;ell(0,0,r,r*.92);ctx.strokeStyle='#1f6b31';ctx.lineWidth=Math.max(1.4,r*.12);ctx.beginPath();ctx.ellipse(0,0,r,r*.92,0,0,7);ctx.stroke();
 const er=r*.4,ex=r*.55,ey=-r*.6;
 for(const s of [-1,1]){ctx.save();ctx.translate(s*ex,ey);if(bl)ctx.scale(1,.18);
  ctx.fillStyle='#fff';ell(0,0,er,er);if(!bl){const lx=look?clamp(look.x,-1,1)*er*.35:0,ly=look?clamp(look.y,-1,1)*er*.35+er*.12:er*.12;
   ctx.fillStyle='#132';ell(lx,ly,er*.48,er*.48);}ctx.restore();}
 if(!bl){ctx.strokeStyle='#1f6b31';ctx.lineWidth=Math.max(1.2,r*.13);ctx.beginPath();ctx.arc(0,r*.28,r*.4,.15*Math.PI,.85*Math.PI);ctx.stroke();}
 ctx.fillStyle='rgba(31,110,58,.5)';ell(-r*.5,r*.35,r*.14,r*.1);ell(r*.55,r*.4,r*.12,r*.09);
 ctx.restore();}

function drawFrog(){let cx,cy,sx_=1,sy_=1,rot=0,alpha=1,gy;
 if(F.state==='hop'){const p=F.p||0;const lx=lerp(F.fromX,F.toX,p),lr=lerp(F.fromRow,F.toRow,p);
  cx=BX+lx*CELL;gy=BY+(lr+.5)*CELL;cy=gy-Math.sin(p*Math.PI)*16;const a=Math.sin(p*Math.PI);sx_=1-.14*a;sy_=1+.22*a;}
 else{cx=BX+F.x*CELL;gy=cy=BY+(F.row+.5)*CELL;
  if(landT>0){const k=landT/.12;sx_=1+.26*k;sy_=1-.26*k;}
  if(F.state==='dying'){const pr=clamp(1-F.t,0,1);
   if(F.deathCause==='splash'){cy+=pr*14;alpha=1-pr*.9;}else{cy-=Math.sin(pr*Math.PI)*26;rot=pr*6;alpha=1-pr*.85;}}}
 ctx.fillStyle='rgba(0,0,0,'+(F.state==='hop'?.17:.3)+')';ell(cx,gy,F.state==='hop'?11:14,5);
 if(F.invuln>0&&F.state!=='dying')alpha*=Math.sin(t*20)>0?1:.4;
 drawFrogBody(cx,cy,sx_,sy_,{rot,alpha,lookUp:F.lookUp,face:F.face});}

function drawParts(){for(const p of parts){const k=1-p.t/p.dur;
 if(p.k==='dot'){ctx.globalAlpha=k;ctx.fillStyle=p.c;ell(p.x,p.y,p.r*k+.4,p.r*k+.4);}
 else if(p.k==='spark'){ctx.globalAlpha=k;ctx.strokeStyle=p.c;ctx.lineWidth=p.r;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();}
 else if(p.k==='bubble'){ctx.globalAlpha=k*.8;ctx.strokeStyle=p.c;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();}
 else if(p.k==='ring'){ctx.globalAlpha=k;ctx.strokeStyle=p.c;ctx.lineWidth=3*k+1;ctx.beginPath();ctx.arc(p.x,p.y,p.r+p.vr*p.t,0,7);ctx.stroke();}
 else if(p.k==='conf'){ctx.globalAlpha=Math.min(1,k*2);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);ctx.restore();}
 else if(p.k==='coin'){const q=p.t/p.dur,bx=lerp(p.sx,62,q),by=lerp(p.sy,59,q)-Math.sin(q*Math.PI)*70;ctx.globalAlpha=1;coinIcon(bx,by,6.5*(1-q*.3));}}
 ctx.globalAlpha=1;}
function drawFloats(){for(const f of floats){const s=f.t>.85?1+(f.t-.85)*2:1;

function upIcon(id,cx,cy){
 if(id==='speed'){ctx.fillStyle='#ffd75e';ctx.strokeStyle='#b9862a';ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(cx+3,cy-16);ctx.lineTo(cx-9,cy+4);ctx.lineTo(cx-1,cy+4);ctx.lineTo(cx-3,cy+16);ctx.lineTo(cx+9,cy-4);ctx.lineTo(cx+1,cy-4);ctx.closePath();ctx.fill();ctx.stroke();}
 else if(id==='gold'){for(let i=0;i<3;i++){const y=cy+9-i*8;ctx.fillStyle=i===2?'#ffe28a':'#ffd75e';ell(cx,y,11,6);ctx.strokeStyle='#b9862a';ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(cx,y,11,6,0,0,7);ctx.stroke();}}
 else if(id==='auto'){ctx.strokeStyle='#9ff0ff';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy,13,-2.5,1.5);ctx.stroke();
  const ax=cx+Math.cos(1.5)*13,ay=cy+Math.sin(1.5)*13;ctx.fillStyle='#9ff0ff';ctx.beginPath();ctx.moveTo(ax+7,ay-4);ctx.lineTo(ax-2,ay-8);ctx.lineTo(ax,ay+3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7ded8a';ell(cx,cy,5,5);ctx.lineCap='butt';}
 else if(id==='life'){frontFrog(cx,cy+3,12,null);ctx.strokeStyle='#ffd75e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+11,cy-14);ctx.lineTo(cx+19,cy-6);ctx.moveTo(cx+19,cy-14);ctx.lineTo(cx+11,cy-6);ctx.stroke();}
 else if(id==='shield'){ctx.fillStyle='#4cc463';ctx.strokeStyle='#1f6b31';ctx.lineWidth=1.6;
  for(const s of [[-5,-5],[5,-5],[-5,5],[5,5]]){ell(cx+s[0],cy+s[1],6.5,6.5);ctx.beginPath();ctx.arc(cx+s[0],cy+s[1],6.5,0,7);ctx.stroke();}
  ctx.strokeStyle='#2f9e4b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy+4);ctx.quadraticCurveTo(cx+3,cy+12,cx-1,cy+18);ctx.stroke();}}

function drawShop(){
 const x=728,w=364;rr(x,26,w,546,12);ctx.fillStyle='rgba(9,30,24,.9)';ctx.fill();ctx.strokeStyle='#245c47';ctx.lineWidth=2;ctx.stroke();

 UPS.forEach((u,i)=>{const cy=96+i*94,cw=w-24,cx=x+12;
  const sh=denied[u.id]>0?Math.sin(t*45)*4*denied[u.id]:0;

  rr(cx+sh+10,cy+13,58,58,8);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fill();ctx.strokeStyle='#2a6b52';ctx.lineWidth=1.4;ctx.stroke();

  text(u.desc,cx+sh+82,cy+48,{s:11,c:'#9cc9ae'});
  for(let k=0;k<u.max;k++){const px=cx+sh+86+k*13,py=cy+66;
   if(k<S.up[u.id]){ctx.fillStyle='#ffd75e';ell(px,py,4.2,4.2);}else{ctx.strokeStyle='#2c5a47';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(px,py,4,0,7);ctx.stroke();}}

  else button('buy_'+u.id,cx+sh+cw-96,cy+26,86,32,String(costOf(u)),()=>buy(u.id),{kind:'primary',fs:15,coin:true,enabled:S.coins>=costOf(u)});});}

 if(hasSave)text('Welcome back — '+S.coins.toLocaleString('en-US')+' coins in the jar'+(bestLevel>1?' · best level '+bestLevel:''),x+48,y+268,{s:13,c:'#ffd75e',b:true});

/* ============================== MAIN DRAW ============================== */
function draw(){
 uiBtns.length=0;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 drawBG();
 let sx=0,sy=0;if(shake.t>0){const k=shake.mag*Math.max(0,shake.t)/shake.dur;sx=rand(-k,k);sy=rand(-k,k);}
 ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*(offX+sx),dpr*(offY+sy));
 drawBoard();
 for(const L of riverLanes)for(const e of L.ents)drawLog(L,e);
 for(const L of roadLanes)for(const e of L.ents)drawVehicle(L,e);
 drawFrog();drawParts();drawFloats();
 drawHUD();drawShop();drawBottom();
 if(S.bannerT>0)drawBanner();
 if(S.mode==='start')drawStart();
 else if(S.mode==='over')drawOver();
 if(S.paused&&S.mode==='play')drawPause();
 let cur='default';
 for(const b of uiBtns)if(mX>=b.x&&mX<=b.x+b.w&&mY>=b.y&&mY<=b.y+b.h){cur=b.on?'pointer':'not-allowed';break;}
 cv.style.cursor=cur;
}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
