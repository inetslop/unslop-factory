function ptext(str,x,y,s,col,align,c2){
  const c=c2||ctx; str=(''+str).toUpperCase();
  const w=(str.length*6-1)*s;
  if(align==='c')x-=w/2; else if(align==='r')x-=w;
  const p=new Path2D();
  for(let i=0;i<str.length;i++){
    const px=GPIX[str[i]]||GPIX[' ']; const gx=x+i*6*s;
    for(let j=0;j<px.length;j+=2)p.addRect(gx+px[j]*s,y+px[j+1]*s,s,s);
  }
  c.fillStyle=col; c.fill(p); return w;
}
function pglow(str,x,y,s,col,align,blur){ctx.save();ctx.shadowColor=col;ctx.shadowBlur=blur==null?10:blur;ptext(str,x,y,s,col,align);ctx.restore();}
const pad=(n,l)=>(''+n).padStart(l,'0');

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false,noiseBuf=null,chargeOsc=null,chargeGain=null,lastWall=0;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.45; master.connect(AC.destination);
    const len=AC.sampleRate; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return; type=type||'square'; vol=vol==null?0.3:vol; delay=delay||0;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(Math.max(1,f0),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function noise(dur,vol,freq,delay){
  if(!AC||muted||!noiseBuf)return; vol=vol==null?0.3:vol; freq=freq||800; delay=delay||0;
  const t=AC.currentTime+delay,s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.05);
}
function startChargeOsc(){ stopChargeOsc(); if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain(); o.type='sawtooth'; o.frequency.value=90; g.gain.value=0.05;
  o.connect(g); g.connect(master); o.start(); chargeOsc=o; chargeGain=g; }
function stopChargeOsc(){ if(chargeOsc){ try{chargeGain.gain.setTargetAtTime(0.0001,AC.currentTime,0.02);chargeOsc.stop(AC.currentTime+0.06);}catch(e){} chargeOsc=null; } }

["..#.....#..","...#...#...","..#######..",".##.###.##.","###########",".#..#.#..#.",".#.#...#.#.","##.......##"]]},

for(let t=0;t<3;t++){SPR[t]=[makeSprite(SPRA[t].f[0],SPRA[t].c),makeSprite(SPRA[t].f[1],SPRA[t].c)];}

const WALLS=[];

W(24,350,24,640); W(24,640,64,706); W(64,706,64,790); W(64,790,166,800);

const BUMPERS=[{x:160,y:470,r:26,flash:0,cool:0},{x:340,y:470,r:26,flash:0,cool:0},{x:250,y:392,r:26,flash:0,cool:0}];
const SLINGS=[
 {pts:[[125,745],[190,680],[125,680]],kick:[0.707,0.707],cx:147,cy:702,flash:0,cool:0},

  const gr=g.createRadialGradient(250,430,60,250,470,560);
  gr.addColorStop(0,'#0d2140');gr.addColorStop(.55,'#081527');gr.addColorStop(1,'#040a16');

  dg.addColorStop(0,'rgba(255,79,216,0)');dg.addColorStop(1,'rgba(255,79,216,.08)');

  g.restore();
  for(const [rx,ry] of [[34,378],[506,378],[34,618],[506,850]]){
    g.fillStyle='#1c3a5e';g.beginPath();g.arc(rx,ry,4.5,0,7);g.fill();
    g.fillStyle='#4f83b5';g.beginPath();g.arc(rx-1,ry-1,1.6,0,7);g.fill();

})();

const slPat=(()=>{const c=document.createElement('canvas');c.width=2;c.height=4;const g=c.getContext('2d');
  g.fillStyle='rgba(0,0,12,.55)';g.fillRect(0,3,2,1);return ctx.createPattern(c,'repeat');})();

/* stars */
const STARS=[];for(let i=0;i<130;i++)STARS.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.7,tw:1+Math.random()*3,ph:Math.random()*7,sp:.004+Math.random()*.02,c:['#cfe8ff','#9fd7ff','#ffffff','#ffd9f4'][i%4]});

/* ============================== GAME STATE ============================== */
let state='start',score=0,hi=0,wave=1,ballsLeft=3;
try{hi=parseInt(localStorage.getItem('invaderPinballHi')||'0',10)||0;}catch(e){}
let ambientT=0,shake=0,redFlash=0,banner=null,endT=0,endMsg='',pendingNext=null,laneRestT=0,stallT=0,newRecord=false;
const ball={x:496,y:840,vx:0,vy:0,live:false};
let charging=false,charge=0;
const trail=[],parts=[],floats=[];
const ufo={on:false,t:12,x:-30,y:150,dir:1,spd:120};

let aliens=[],form={x:0,y:0,dir:1,timer:1,frame:0},waveTotal=40;
function spawnWave(n){
  aliens=[];form={x:0,y:0,dir:1,timer:0.9,frame:0};
  for(let r=0;r<5;r++)for(let c=0;c<8;c++){
    const type=r<2?0:(r<4?1:2);
    aliens.push({bx:250+(c-3.5)*42,by:175+r*38,type:0|type,alive:true,seed:Math.random()*6});
  }
  waveTotal=aliens.length;
}
function aliveCount(){let n=0;for(const a of aliens)if(a.alive)n++;return n;}

const FLIP={
  l:{px:176,py:798,len:64,a:0.4538,restA:0.4538,actA:-0.384,om:0},
  r:{px:324,py:798,len:64,a:2.6878,restA:2.6878,actA:3.5255,om:0}
};
let keyL=false,keyR=false;
function updFlip(f,h){
  const target=(f===FLIP.l?keyL:keyR)?f.actA:f.restA;
  const spd=target>f.a?16:10;
  let na=f.a;
  if(na<target)na=Math.min(target,na+spd*h); else na=Math.max(target,na-spd*h);
  f.om=(na-f.a)/h; f.a=na;
}

/* ============================== FX HELPERS ============================== */
function burst(x,y,col,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=spd*(.3+Math.random()*.7);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,t:0,life:.4+Math.random()*.5,c:col,s:2+Math.random()*3});}
  if(parts.length>420)parts.splice(0,parts.length-420);
}
function addFloat(txt,x,y,col,s){floats.push({txt,x,y,c:col||'#eaf6ff',s:s||1,t:0,life:.95});}
function setBanner(t1,t2,dur){banner={t1,t2,start:ambientT,until:ambientT+dur,dur};}

/* ============================== GAME FLOW ============================== */
function resetBall(){ball.x=496;ball.y=840;ball.vx=0;ball.vy=0;ball.live=false;charging=false;charge=0;trail.length=0;laneRestT=0;stallT=0;}
function startGame(){
  score=0;wave=1;ballsLeft=3;newRecord=false;pendingNext=null;redFlash=0;shake=0;
  ufo.on=false;ufo.t=12;parts.length=0;floats.length=0;trail.length=0;
  spawnWave(1);resetBall();state='play';setBanner('WAVE 1','GET READY',2.2);
}
function launch(){
  if(ball.live||state!=='play')return;
  const v=1250+520*charge;
  ball.vy=-v;ball.vx=(Math.random()*40-20);ball.live=true;
  charging=false;charge=0;stopChargeOsc();
  tone(160,400+v*.3,.3,'square',.28);noise(.22,.25,700);shake=Math.max(shake,3);
}
function loseBall(msg){
  stopChargeOsc();charging=false;ballsLeft--;shake=Math.max(shake,8);
  if(ballsLeft<=0){
    newRecord=score>hi;
    if(newRecord){hi=score;try{localStorage.setItem('invaderPinballHi',String(hi));}catch(e){}}
    state='gameover';
    tone(392,392,.25,'sawtooth',.3);tone(311,311,.25,'sawtooth',.3,.25);
    tone(262,262,.25,'sawtooth',.3,.5);tone(196,196,.55,'sawtooth',.3,.75);
  }else{
    state='ballend';endT=1.6;endMsg=msg;
    if(msg!=='BREACH!'){tone(500,120,.4,'square',.25);noise(.3,.2,500);}
  }
}
function killAlien(a,isBreach){
  if(a.alive===false)return; a.alive=false;
  const ax=a.bx+form.x,ay=a.by+form.y;
  const col=SPRA[a.type].c;
  burst(ax,ay,col,16,260);burst(ax,ay,'#ffffff',5,150);
  if(isBreach){
    redFlash=1;shake=Math.max(shake,13);
    tone(520,60,.7,'sawtooth',.4);noise(.5,.35,400);
    loseBall('BREACH!');
  }else{
    const pts=[30,20,10][a.type]*wave;
    score+=pts;addFloat('+'+pts,ax,ay-16,'#eaf6ff',1.5);
    tone(1400,180,.16,'sawtooth',.3);noise(.1,.25,1500);shake=Math.max(shake,3);
  }
  if(aliveCount()===0&&pendingNext==null){
    const bonus=500*wave;score+=bonus;
    setBanner('WAVE '+wave+' CLEARED','+'+bonus+' BONUS',2.4);
    tone(523,523,.1,'square',.25);tone(659,659,.1,'square',.25,.09);
    tone(784,784,.1,'square',.25,.18);tone(1046,1046,.16,'square',.25,.27);
    pendingNext=2.6;
  }
}
function stepMarch(){
  let nx=form.x+form.dir*16;
  if(nx<-47||nx>47){form.dir*=-1;form.y+=11;nx=form.x+form.dir*16;if(nx<-47||nx>47)nx=form.x;}
  form.x=nx;form.frame^=1;
}
function march(dt){
  if(aliveCount()===0)return;
  form.timer-=dt;if(form.timer>0)return;
  stepMarch();
  const base=Math.max(0.42,1.0-wave*0.07);
  form.timer=base*(0.45+0.55*(aliveCount()/waveTotal));
}
function ufoUpdate(dt){
  if(ufo.on){
    ufo.x+=ufo.dir*ufo.spd*dt;
    if(ufo.x<138||ufo.x>402){ufo.on=false;ufo.t=16+Math.random()*14;}
  }else{
    ufo.t-=dt;
    if(ufo.t<=0&&state==='play'){
      ufo.on=true;ufo.y=150+Math.random()*30;
      const left=Math.random()<.5;ufo.x=left?148:392;ufo.dir=left?1:-1;ufo.spd=110+wave*8;
      tone(700,1400,.12,'sine',.2);tone(700,1400,.12,'sine',.15,.16);
    }
  }
}

/* ============================== PHYSICS ============================== */
const BR=12,HSTEP=1/240;
function closestOnSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy||.0001;
  let t=((px-x1)*dx+(py-y1)*dy)/l2;t=t<0?0:(t>1?1:t);
  return{x:x1+t*dx,y:y1+t*dy};
}
function stepBall(h){
  updFlip(FLIP.l,h);updFlip(FLIP.r,h);
  if(!ball.live)return;
  ball.vy+=1350*h;
  const dr=1-0.04*h;ball.vx*=dr;ball.vy*=dr;
  ball.x+=ball.vx*h;ball.y+=ball.vy*h;

  /* walls */
  for(const w of WALLS){
    if(w.ow&&ball.x>=472)continue;
    const p=closestOnSeg(ball.x,ball.y,w.x1,w.y1,w.x2,w.y2);
    let dx=ball.x-p.x,dy=ball.y-p.y,d2=dx*dx+dy*dy;
    if(d2<BR*BR){
      let d=Math.sqrt(d2);if(d<.001){d=.001;dx=0;dy=-1;}
      const nx=dx/d,ny=dy/d;
      ball.x=p.x+nx*BR;ball.y=p.y+ny*BR;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){
        ball.vx-=1.45*vn*nx;ball.vy-=1.45*vn*ny;
        if(-vn>170&&ambientT-lastWall>0.045){lastWall=ambientT;tone(260+Math.min(300,-vn*.4),180,.04,'triangle',Math.min(.16,.04+-vn/5000));}
      }
    }
  }
  /* flippers */
  for(const f of [FLIP.l,FLIP.r]){
    const tx=f.px+f.len*Math.cos(f.a),ty=f.py+f.len*Math.sin(f.a);
    const p=closestOnSeg(ball.x,ball.y,f.px,f.py,tx,ty);
    let dx=ball.x-p.x,dy=ball.y-p.y,d2=dx*dx+dy*dy;const R=BR+11;
    if(d2<R*R){
      let d=Math.sqrt(d2);if(d<.001){d=.001;dx=0;dy=-1;}
      const nx=dx/d,ny=dy/d;
      ball.x=p.x+nx*R;ball.y=p.y+ny*R;
      const rx=p.x-f.px,ry=p.y-f.py;
      const vcx=-f.om*ry,vcy=f.om*rx;
      const vrX=ball.vx-vcx,vrY=ball.vy-vcy;
      const vn=vrX*nx+vrY*ny;
      if(vn<0){ball.vx-=1.5*vn*nx;ball.vy-=1.5*vn*ny;}
    }
  }
  /* bumpers */
  for(const b of BUMPERS){
    const dx=ball.x-b.x,dy=ball.y-b.y,d2=dx*dx+dy*dy,R=b.r+BR;
    if(d2<R*R){
      let d=Math.sqrt(d2);if(d<.001)d=.001;
      const nx=dx/d,ny=dy/d;
      ball.x=b.x+nx*R;ball.y=b.y+ny*R;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){const k=1.3*vn;ball.vx-=k*nx;ball.vy-=k*ny;}
      let m=Math.hypot(ball.vx,ball.vy);const sp=Math.max(m,800);
      if(m>.001){ball.vx*=sp/m;ball.vy*=sp/m;}else{ball.vx=nx*sp;ball.vy=ny*sp;}
      if(b.cool<=0){
        b.cool=.12;b.flash=1;score+=100;addFloat('+100',b.x,b.y-b.r-8,'#7fe9ff');
        tone(700,1400,.1,'square',.35);tone(1400,2200,.08,'square',.2,.02);noise(.05,.2,2500);
        burst(ball.x,ball.y,'#7fe9ff',8,300);shake=Math.max(shake,2.5);
      }
    }
  }
  /* slingshots */
  for(const s of SLINGS){
    if(s.cool>0)continue;
    let hit=false;
    const pts=s.pts;
    for(let e=0;e<3&&!hit;e++){
      const x1=pts[e][0],y1=pts[e][1],x2=pts[(e+1)%3][0],y2=pts[(e+1)%3][1];
      const p=closestOnSeg(ball.x,ball.y,x1,y1,x2,y2);
      let dx=ball.x-p.x,dy=ball.y-p.y,d2=dx*dx+dy*dy;
      if(d2<BR*BR){
        let d=Math.sqrt(d2);if(d<.001){d=.001;dx=0;dy=-1;}
        const nx=dx/d,ny=dy/d;
        ball.x=p.x+nx*BR;ball.y=p.y+ny*BR;
        const vn=ball.vx*nx+ball.vy*ny;
        if(vn<0){ball.vx-=1.45*vn*nx;ball.vy-=1.45*vn*ny;}
        let kx=ball.vx*.35+s.kick[0]*.65,ky=ball.vy*.35+s.kick[1]*.65;
        const km=Math.hypot(kx,ky)||1;const sp=Math.max(780,Math.hypot(ball.vx,ball.vy));
        ball.vx=kx/km*sp;ball.vy=ky/km*sp;
        s.cool=.1;s.flash=1;hit=true;
      }
    }
    if(hit){score+=50;addFloat('+50',s.cx,s.cy-24,'#ffb0a0');tone(160,90,.09,'triangle',.4);noise(.05,.25,500);burst(ball.x,ball.y,'#ff8a7a',6,220);shake=Math.max(shake,2);}
  }
  /* aliens */
  for(const a of aliens){
    if(a.alive===false)continue;
    const ax=a.bx+form.x,ay=a.by+form.y+Math.sin(ambientT*3+a.seed)*2;
    const dx=ball.x-ax,dy=ball.y-ay,d2=dx*dx+dy*dy,R=17+BR;
    if(d2<R*R){
      let d=Math.sqrt(d2);if(d<.001){d=.001;}
      const nx=dx/d,ny=dy/d;
      ball.x=ax+nx*R;ball.y=ay+ny*R;
      const vn=ball.vx*nx+ball.vy*ny;
      if(vn<0){ball.vx-=1.5*vn*nx;ball.vy-=1.5*vn*ny;}
      let m=Math.hypot(ball.vx,ball.vy);const sp=Math.max(m,460);
      if(m>.001){ball.vx*=sp/m;ball.vy*=sp/m;}else{ball.vx=nx*sp;ball.vy=ny*sp;}
      killAlien(a,false);
    }
  }
  /* ufo */
  if(ufo.on&&state==='play'){
    const dx=ball.x-ufo.x,dy=ball.y-ufo.y;
    if(dx*dx+dy*dy<28*28){
      ufo.on=false;ufo.t=18+Math.random()*14;score+=500;
      addFloat('+500',ufo.x,ufo.y-20,'#7fe9ff');
      burst(ufo.x,ufo.y,'#7fe9ff',22,340);burst(ufo.x,ufo.y,'#ffffff',10,200);
      tone(784,784,.09,'square',.25);tone(988,988,.09,'square',.25,.09);tone(1319,1319,.18,'square',.25,.18);
      shake=Math.max(shake,5);
      if(Math.random()<.3&&ballsLeft<5){ballsLeft++;addFloat('EXTRA BALL!',250,470,'#ff4fd8',2);tone(600,1200,.3,'square',.25);}
    }
  }
  /* clamp speed */
  const sp2=Math.hypot(ball.vx,ball.vy);
  if(sp2>2100){ball.vx*=2100/sp2;ball.vy*=2100/sp2;}
  /* drain */
  if(ball.y>905||ball.x<-30||ball.x>570){loseBall('BALL LOST');return;}
}

/* ============================== UPDATE ============================== */
function updateFX(dt){
  shake*=Math.exp(-6.5*dt);if(shake<.15)shake=0;
  redFlash=Math.max(0,redFlash-2.2*dt);
  for(const b of BUMPERS){b.flash=Math.max(0,b.flash-4*dt);b.cool-=dt;}
  for(const s of SLINGS){s.flash=Math.max(0,s.flash-5*dt);s.cool-=dt;}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>p.life){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.y-=46*dt;if(f.t>f.life)floats.splice(i,1);}
  if(chargeOsc)chargeOsc.frequency.value=90+charge*560;
}
function updatePlay(dt){
  if(state!=='play')return;
  if(!ball.live){if(charging)charge=Math.min(1,charge+dt/0.85);}
  else{
    march(dt);
    trail.push({x:ball.x,y:ball.y});if(trail.length>14)trail.shift();
    for(const a of aliens){
      if(a.alive!==false){
        const ay=a.by+form.y+Math.sin(ambientT*3+a.seed)*2;
        if(ay>596){killAlien(a,true);break;}
      }
    }
    if(state!=='play')return;
    const sp=Math.hypot(ball.vx,ball.vy);
    if(sp<30&&ball.y<760){stallT+=dt;if(stallT>1.1){ball.vy-=230;ball.vx+=(Math.random()-.5)*260;stallT=0;}}else stallT=0;
    if(ball.x>478&&ball.y>800&&sp<40){laneRestT+=dt;if(laneRestT>1)resetBall();}else laneRestT=0;
  }
  ufoUpdate(dt);
  if(pendingNext!=null&&aliveCount()===0){
    pendingNext-=dt;
    if(pendingNext<=0){wave++;spawnWave(wave);pendingNext=null;setBanner('WAVE '+wave,'GET READY',2.2);tone(660,880,.15,'square',.2);}
  }
}

  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
}

function strokeSeg(x1,y1,x2,y2,w,col,dx,dy){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1+dx,y1+dy);ctx.lineTo(x2+dx,y2+dy);ctx.stroke();
}
function drawFlip(f){
  const tx=f.px+f.len*Math.cos(f.a),ty=f.py+f.len*Math.sin(f.a);
  strokeSeg(f.px,f.py,tx,ty,26,'rgba(0,0,0,.5)',0,4);
  strokeSeg(f.px,f.py,tx,ty,24,'#5b1a4e');
  strokeSeg(f.px,f.py,tx,ty,18,'#ff4fd8');
  strokeSeg(f.px,f.py,tx,ty,7,'rgba(255,255,255,.55)',0,-5);
  ctx.fillStyle='#2a0f2e';ctx.beginPath();ctx.arc(f.px,f.py,13,0,7);ctx.fill();

}
function drawTable(){
  ctx.drawImage(tbg,0,0);

  ctx.setLineDash([9,7]);ctx.lineDashOffset=-ambientT*30;

  ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(30,596);ctx.lineTo(470,596);ctx.stroke();
  ctx.setLineDash([]);
  /* walls */
  ctx.lineCap='round';

  ctx.strokeStyle='rgba(130,235,255,.8)';ctx.lineWidth=1.5;ctx.stroke(WPATH);ctx.restore();
  /* slingshots */
  for(const s of SLINGS){
    const f=s.flash;
    ctx.beginPath();ctx.moveTo(s.pts[0][0],s.pts[0][1]);ctx.lineTo(s.pts[1][0],s.pts[1][1]);ctx.lineTo(s.pts[2][0],s.pts[2][1]);ctx.closePath();
    ctx.fillStyle=f>0?'rgb('+(74+181*f)+','+(18+132*f)+','+(32+96*f)+')':'#4a1220';ctx.fill();
    ctx.strokeStyle='#ff5b4d';ctx.lineWidth=2.5;ctx.stroke();

  }
  /* bumpers */
  for(const b of BUMPERS){
    const s=1+.22*b.flash;
    if(b.flash>0){ctx.save();ctx.shadowColor='#59e6ff';ctx.shadowBlur=20*b.flash;}
    ctx.fillStyle=b.flash>.4?'#1b3a5e':'#0d2036';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*s,0,7);ctx.fill();
    if(b.flash>0)ctx.restore();
    ctx.strokeStyle=b.flash>.4?'#ffffff':'#59e6ff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*s,0,7);ctx.stroke();
    ctx.fillStyle='rgba(255,79,216,'+(.85+.15*Math.sin(ambientT*5+b.x))+')';

    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,3.2*s,0,7);ctx.fill();
  }
  /* plunger lane: spring + power bar */
  if(state==='play'&&!ball.live){
    const h=16-12*charge,topY=868-h;
    ctx.strokeStyle='#4e7ca8';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(489,867);ctx.lineTo(503,topY+h*.33);ctx.lineTo(489,topY+h*.66);ctx.lineTo(503,topY);ctx.stroke();
    ctx.fillStyle='#0d1c33';ctx.fillRect(522,800,12,68);
    const ch=68*charge;
    if(ch>1){ctx.fillStyle=charge<.5?'#6bff8a':(charge<.8?'#ffd166':'#ff5b4d');ctx.fillRect(523,867-ch,10,ch);}
    ctx.strokeStyle='#2b5f8f';ctx.lineWidth=1;ctx.strokeRect(522.5,800.5,11,67);
    if(charging)pglow('RELEASE!',250,614,3,'#ff7fe0','c');
    else{
      ctx.globalAlpha=.35+.55*(.5+.5*Math.sin(ambientT*4));
      ptext('HOLD SPACE OR TAP TO LAUNCH',250,618,2,'#9fd7ff','c');
      ctx.globalAlpha=1;
    }
  }
  /* ufo */
  if(ufo.on){
    const u=ufo;
    const bg=ctx.createLinearGradient(0,u.y,0,u.y+90);
    bg.addColorStop(0,'rgba(120,230,255,.14)');bg.addColorStop(1,'rgba(120,230,255,0)');
    ctx.fillStyle=bg;ctx.beginPath();
    ctx.moveTo(u.x-8,u.y+4);ctx.lineTo(u.x+8,u.y+4);ctx.lineTo(u.x+26,u.y+90);ctx.lineTo(u.x-26,u.y+90);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1a2f4a';ctx.beginPath();ctx.ellipse(u.x,u.y,17,8,0,0,7);ctx.fill();
    ctx.strokeStyle='#59e6ff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(120,230,255,.85)';ctx.beginPath();ctx.arc(u.x,u.y-3,8,Math.PI,0);ctx.fill();
    for(let i=-1;i<=1;i++){
      ctx.fillStyle=((i+Math.floor(ambientT*6))%3===0)?'#ffd166':'#ff4fd8';
      ctx.beginPath();ctx.arc(u.x+i*9,u.y+3,1.8,0,7);ctx.fill();
    }
  }
  /* aliens */
  const fr=form.frame;
  for(const a of aliens){
    if(a.alive===false)continue;
    const ax=a.bx+form.x,ay=a.by+form.y+Math.sin(ambientT*3+a.seed)*2;
    ctx.drawImage(SPR[a.type][fr],ax-22,ay-16);
  }
  /* ball trail + ball */
  if(ball.live){
    for(let i=0;i<trail.length;i++){
      const f=i/trail.length;
      ctx.globalAlpha=f*.4;ctx.fillStyle='#67e8ff';
      ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,2+f*8,0,7);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  const bg2=ctx.createRadialGradient(ball.x-3,ball.y-4,1,ball.x,ball.y,17);
  bg2.addColorStop(0,'#ffffff');bg2.addColorStop(.45,'#9fe8ff');bg2.addColorStop(1,'rgba(80,200,255,0)');
  ctx.fillStyle=bg2;ctx.beginPath();ctx.arc(ball.x,ball.y,17,0,7);ctx.fill();
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ball.x,ball.y,6.5,0,7);ctx.fill();
  /* flippers */
  drawFlip(FLIP.l);drawFlip(FLIP.r);
  /* particles */
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life)*.9;
    ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
  }
  ctx.globalAlpha=1;
  /* floaters */
  for(const f of floats){
    ctx.globalAlpha=Math.max(0,1-f.t/f.life);
    ptext(f.txt,f.x,f.y,f.s,f.c,'c');
  }
  ctx.globalAlpha=1;
  if(redFlash>0){ctx.fillStyle='rgba(255,45,70,'+(.28*redFlash)+')';ctx.fillRect(24,104,492,768);}
}

/* ============================== MAIN LOOP ============================== */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  ambientT+=dt;
  if(state!=='paused'){
    updateFX(dt);
    if(state==='play'||state==='ballend'){
      acc+=dt;let n=0;
      while(acc>=HSTEP&&n<10){stepBall(HSTEP);acc-=HSTEP;n++;}
    }else acc=0;
    if(state==='play')updatePlay(dt);
    if(state==='ballend'){endT-=dt;if(endT<=0){resetBall();state='play';}}
  }
  render();
}

/* ============================== INPUT ============================== */
function pressFlip(side){
  if(side==='L'){if(!keyL&&state!=='start'&&state!=='gameover')tone(90,55,.07,'sine',.4);keyL=true;}
  else{if(!keyR&&state!=='start'&&state!=='gameover')tone(90,55,.07,'sine',.4);keyR=true;}
}
function beginCharge(){if(state==='play'&&!ball.live&&!charging){charging=true;charge=0;startChargeOsc();}}
addEventListener('keydown',e=>{
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  const k=e.code;
  if(k==='Space'||k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown')e.preventDefault();
  if(e.repeat)return;
  if(k==='ArrowLeft'||k==='KeyA')pressFlip('L');
  else if(k==='ArrowRight'||k==='KeyD')pressFlip('R');
  else if(k==='Space'){
    if(state==='start'||state==='gameover')startGame();
    else beginCharge();
  }
  else if(k==='Enter'){if(state==='start'||state==='gameover')startGame();}
  else if(k==='KeyR')startGame();
  else if(k==='KeyP'){if(state==='play')state='paused';else if(state==='paused')state='play';}
  else if(k==='KeyM'){muted=!muted;if(muted)stopChargeOsc();}
});
addEventListener('keyup',e=>{
  const k=e.code;
  if(k==='ArrowLeft'||k==='KeyA')keyL=false;
  else if(k==='ArrowRight'||k==='KeyD')keyR=false;
  else if(k==='Space'){if(charging){charging=false;launch();}}
});
const ptrs=new Map();
function toLogical(e){return{x:(e.clientX-ox)/scl,y:(e.clientY-oy)/scl};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(state==='start'||state==='gameover'){startGame();return;}
  if(state!=='play')return;
  const p=toLogical(e);
  if(!ball.live){beginCharge();ptrs.set(e.pointerId,'charge');}
  else{const side=p.x<250?'L':'R';pressFlip(side);ptrs.set(e.pointerId,side);}
});
function releasePtr(e){
  const m=ptrs.get(e.pointerId);if(m===undefined)return;
  if(m==='L')keyL=false;else if(m==='R')keyR=false;else{charging=false;launch();}
  ptrs.delete(e.pointerId);
}
cv.addEventListener('pointerup',releasePtr);
cv.addEventListener('pointercancel',releasePtr);
addEventListener('blur',()=>{keyL=false;keyR=false;ptrs.clear();if(charging){charging=false;stopChargeOsc();}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='paused';});

/* ============================== GO ============================== */
spawnWave(1);resetBall();
requestAnimationFrame(frame);
})();
</script>
