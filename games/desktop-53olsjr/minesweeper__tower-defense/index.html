<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blastline — Minesweeper Tower Defense</title>
<style>
:root{
  --bg:#0c120a; --panel:#141d10; --line:#31422a; --ink:#dfeac9; --dim:#8fa37b;
  --green:#9fe870; --amber:#ffc857; --red:#ff5c46;
  --disp:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--mono);color:var(--ink);-webkit-user-select:none;user-select:none}
#cv{position:absolute;inset:0;display:block;cursor:crosshair}
/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:5;display:flex;align-items:center;gap:16px;padding:0 16px;background:linear-gradient(180deg,rgba(27,38,23,.96),rgba(19,28,15,.94))}
#topbar::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(-45deg,#ffc857 0 10px,#151b10 10px 20px);opacity:.45}
#logo{font-family:var(--disp);font-style:italic;font-size:24px;letter-spacing:1px;color:#eaf5d8;text-shadow:2px 2px 0 #000;white-space:nowrap}
#logo span{color:var(--green)}
.stat{display:flex;flex-direction:column;line-height:1.05;padding:4px 10px;border:1px solid var(--line);background:#182213}
.stat label{font-size:9px;letter-spacing:2px;color:var(--dim)}
.stat b{font-size:17px;color:#eaf5d8}
#goldV{color:var(--amber)}
#hpV i{display:inline-block;width:6px;height:13px;margin-right:2px;background:var(--green);box-shadow:0 0 4px rgba(159,232,112,.5)}
#hpV.low i{background:var(--red);box-shadow:0 0 4px rgba(255,92,70,.6)}
#nextV{font-size:11px;letter-spacing:1px;color:var(--dim);white-space:nowrap}
#nextV.hot{color:var(--amber);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.spacer{flex:1}
.tbtn{font-family:var(--mono);font-size:12px;color:var(--ink);background:#182213;border:1px solid var(--line);padding:6px 10px;cursor:pointer;letter-spacing:1px}
.tbtn:hover{border-color:var(--green);color:var(--green)}
.tbtn.on{border-color:var(--green);color:var(--green);box-shadow:inset 0 0 8px rgba(159,232,112,.25)}
.tbtn.off{opacity:.4;text-decoration:line-through}
/* ---------- bottom bar ---------- */
#botbar{position:absolute;bottom:0;left:0;right:0;height:86px;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(0deg,rgba(27,38,23,.96),rgba(19,28,15,.9))}
#botbar::before{content:'';position:absolute;left:0;right:0;top:-6px;height:6px;background:repeating-linear-gradient(-45deg,#ffc857 0 10px,#151b10 10px 20px);opacity:.45}
.cards{display:flex;gap:8px}
.card{position:relative;display:flex;align-items:center;gap:9px;padding:6px 12px 6px 8px;min-width:134px;height:62px;background:#1d2817;border:2px solid #35482b;color:var(--ink);cursor:pointer;text-align:left;font-family:var(--mono);transition:border-color .12s,background .12s}
.card svg{width:26px;height:26px;flex:none}
.card b{display:block;font-size:11.5px;letter-spacing:.8px;color:#eaf5d8}
.card span{font-size:9.5px;color:var(--dim);letter-spacing:.4px}
.card i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9px;color:var(--dim);border:1px solid #3a4c2e;padding:0 3px;border-radius:2px}
.card:hover{border-color:#55703d}
.card.sel{border-color:var(--green);background:#24351b;box-shadow:0 0 14px rgba(159,232,112,.25),inset 0 0 10px rgba(159,232,112,.12)}
.card.no{opacity:.42;filter:saturate(.35)}
.hint{flex:1;font-size:10.5px;line-height:1.6;color:var(--dim);letter-spacing:.4px}
.hint b{color:#cfdcb4}
/* ---------- banner ---------- */
#banner{position:absolute;top:72px;left:0;right:0;text-align:center;z-index:6;pointer-events:none;opacity:0;font-family:var(--disp);font-style:italic;font-size:clamp(26px,4vw,42px);letter-spacing:3px;color:#f2fadf;text-shadow:0 3px 0 #000,0 0 18px rgba(159,232,112,.35)}
#banner.show{animation:ban 2.1s ease forwards}
#banner.good{color:#b9f58e}
#banner.bad{color:#ff9d8a;text-shadow:0 3px 0 #000,0 0 18px rgba(255,92,70,.4)}
@keyframes ban{0%{opacity:0;transform:translateY(-16px) scale(.96)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
/* ---------- overlay ---------- */
#ovl{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,rgba(14,23,12,.86),rgba(7,11,6,.94));overflow:auto}
.panel{position:relative;background:#121a0f;border:2px solid #3c5230;padding:30px 40px 34px;width:min(92vw,660px);margin:20px auto;box-shadow:0 24px 70px rgba(0,0,0,.8),inset 0 0 0 1px rgba(0,0,0,.5)}
.panel::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;height:8px;background:repeating-linear-gradient(-45deg,#ffc857 0 12px,transparent 12px 24px);opacity:.35}
.kicker{font-size:10px;letter-spacing:3px;color:var(--dim)}
.kicker::before{content:'▸ ';color:var(--green)}
.kicker.red{color:#c98a7d}.kicker.red::before{color:var(--red);content:'▲ '}
h1.title{font-family:var(--disp);font-style:italic;font-size:clamp(46px,7vw,74px);line-height:.95;letter-spacing:2px;margin:8px 0 4px;color:#f2fadf;text-shadow:3px 3px 0 #0a0d07,0 0 26px rgba(159,232,112,.22)}
h1.title span{color:var(--green)}
h1.title.red{color:#ff7a63;text-shadow:3px 3px 0 #0a0d07,0 0 26px rgba(255,92,70,.3)}
h1.title.small{font-size:44px}
.tag{color:var(--dim);letter-spacing:2.5px;font-size:11px;text-transform:uppercase;margin-top:8px}
.note{margin:16px 0;padding:10px 14px;background:#1a2312;border-left:3px solid var(--amber);font-size:12px;line-height:1.6;color:#cfdcb4}
.note b{color:#ffe9b0}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:12px;color:#c3d3a8;margin:14px 0 4px;align-items:center}
kbd{border:1px solid #4a5f3a;border-bottom-width:3px;padding:1px 7px;border-radius:4px;background:#1c2616;font-size:11px;color:#eaf5d8;font-family:var(--mono);white-space:nowrap}
.row{display:flex;gap:16px;margin-top:22px;align-items:center;flex-wrap:wrap}
.dim{font-size:11px;color:var(--dim);letter-spacing:1px}
.big{font-family:var(--disp);font-style:italic;font-size:21px;letter-spacing:2px;padding:12px 30px;background:var(--green);color:#0e150a;border:none;cursor:pointer;box-shadow:0 6px 0 #4c7a2f,0 10px 24px rgba(0,0,0,.6)}
.big small{font-size:13px;letter-spacing:0}
.big:hover{transform:translateY(2px);box-shadow:0 4px 0 #4c7a2f,0 8px 18px rgba(0,0,0,.6);background:#b6f58e}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 #4c7a2f}
.big.ghost{background:transparent;color:#dfeac9;border:2px solid #3c5230;box-shadow:none}
.big.ghost:hover{background:rgba(159,232,112,.1);transform:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:20px 0 4px}
.stats div{background:#182213;border:1px solid var(--line);padding:10px 12px}
.stats label{display:block;font-size:9px;letter-spacing:2px;color:var(--dim);margin-bottom:5px}
.stats b{font-family:var(--disp);font-style:italic;font-size:30px;color:#eaf5d8;letter-spacing:1px}
.stats div:nth-child(4) b{color:var(--amber)}
@media(max-width:920px){.hint{display:none}}
@media(max-width:680px){#nextV{display:none}.card{min-width:112px;padding:5px 8px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="topbar">
  <div id="logo">BLAST<span>LINE</span></div>
  <div class="stat"><label>WAVE</label><b id="waveV">—</b></div>
  <div class="stat"><label>GOLD</label><b id="goldV">130</b></div>
  <div class="stat"><label>BASE HP</label><b id="hpV"></b></div>
  <div id="nextV"></div>
  <div class="spacer"></div>
  <button class="tbtn" id="spdB" title="toggle speed (T)">1×</button>
  <button class="tbtn" id="muteB" title="mute (M)">♪</button>
  <button class="tbtn" id="pauseB" title="pause (P)">II</button>
  <button class="tbtn" id="reB" title="restart run">↻</button>
</div>

<div id="botbar">
  <div class="cards">
    <button class="card sel" id="c0">
      <svg viewBox="0 0 24 24"><circle cx="10" cy="13" r="6.5" fill="#8fd14f"/><rect x="9" y="7" width="12" height="4.5" rx="2" fill="#cfe8a8" transform="rotate(32 9 9)"/><circle cx="10" cy="13" r="2.6" fill="#2c4018"/></svg>
      <div><b>POUNDER</b><span>50g · dmg 14 · rng 2.3</span></div><i>1</i>
    </button>
    <button class="card" id="c1">
      <svg viewBox="0 0 24 24"><path d="M13 2 5 14h5l-2 8 9-13h-5l1-7z" fill="#5fe0d8"/><circle cx="12" cy="12" r="10" fill="none" stroke="#2b6f6a" stroke-width="1.4" stroke-dasharray="3 3"/></svg>
      <div><b>ZAPPER</b><span>70g · fast zap · rng 1.9</span></div><i>2</i>
    </button>
    <button class="card" id="c2">
      <svg viewBox="0 0 24 24"><rect x="3" y="11.5" width="13" height="6" rx="3" fill="#e09a4e"/><circle cx="17.5" cy="14.5" r="3.6" fill="#2c2015"/><circle cx="8" cy="7.5" r="2.8" fill="#b8b8ae"/></svg>
      <div><b>MORTAR</b><span>110g · splash · rng 3.5</span></div><i>3</i>
    </button>
    <button class="card" id="cF">
      <svg viewBox="0 0 24 24"><path d="M8 3v18" stroke="#dfeac9" stroke-width="2.4"/><path d="M8 4l10 3.2L8 10.5z" fill="#ff4d3d"/></svg>
      <div><b>FLAG</b><span>15g · arm a trap · RMB</span></div><i>F</i>
    </button>
  </div>
  <div class="hint">LMB build tower · RMB flag / unflag a suspected mine (refunded) · click a tower to sell 60%<br>numbers count adjacent mines — <b>mines only detonate when flagged</b>, so flag the road and let them walk into your traps</div>
</div>

<div id="banner"></div>
<div id="ovl"><div id="panel"></div></div>

<script>
'use strict';
/* ================= helpers / constants ================= */
const $=id=>document.getElementById(id);
const R=Math.random, TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const COLS=16, ROWS=9, FLAGCOST=15, STARTGOLD=130, MAXHP=10;
const TOPBAR=54, BOTBAR=86;
const TDEF=[
  {name:'POUNDER',cost:50, range:2.3,dmg:14, rate:1.1, kind:'shot',  col:'#8fd14f'},
  {name:'ZAPPER', cost:70, range:1.9,dmg:5,  rate:3.6, kind:'zap',   col:'#5fe0d8'},
  {name:'MORTAR', cost:110,range:3.5,dmg:26, rate:.55, kind:'mortar',splash:1.15,col:'#e09a4e'}
];
const EDEF={
  grub:{hp:1,  spd:.78,r:.29,dmg:1,gold:8, col:'#a3bd6d'},
  scut:{hp:.55,spd:1.4,r:.23,dmg:1,gold:9, col:'#ecc95f'},
  tank:{hp:6,  spd:.47,r:.37,dmg:2,gold:20,col:'#d0704f'},
  boss:{hp:16, spd:.35,r:.5, dmg:4,gold:80,col:'#ff5d8f'}
};
const NUMCOL=['','#79b6ff','#8fe08a','#ff8d6b','#b18cff','#e89a8f','#5fd4d4','#d9c27a','#c9c9c9'];

/* ================= canvas / layout ================= */
const cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0,CS=40,OX=0,OY=0,vign=null,GDT=0,GT=0;
const M={x:-99,y:-99};
function resize(){
  W=innerWidth;H=innerHeight;const dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const aw=W-36, ah=H-TOPBAR-BOTBAR-28;
  CS=Math.max(14,Math.min(aw/COLS,ah/ROWS));
  OX=(W-CS*COLS)/2; OY=TOPBAR+(H-TOPBAR-BOTBAR-CS*ROWS)/2;
  vign=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,.55)');
  initDust();
}
addEventListener('resize',resize);

/* ================= ambient dust ================= */
let DUST=[];
function initDust(){DUST=[];for(let i=0;i<46;i++)DUST.push({x:R()*W,y:R()*H,s:.5+R()*1.6,v:2+R()*7,ph:R()*TAU});}
function updDust(dt){for(const d of DUST){d.y-=d.v*dt;d.x+=Math.sin(GT*.6+d.ph)*4*dt;if(d.y<-5){d.y=H+5;d.x=R()*W;}}}

/* ================= state / field ================= */
let S=null, BEST=0;
try{BEST=+(localStorage.getItem('bl_best')||0);}catch(e){}
function newRun(){
  S={mode:'menu',gold:STARTGOLD,hp:MAXHP,wave:0,kills:0,earned:0,tool:0,fast:false,
     between:6,cleared:false,shake:0,baseFx:0,time:0,
     enemies:[],towers:[],tmap:{},shots:[],beams:[],parts:[],rings:[],floats:[],pending:[],
     spawnQ:[],spawnT:0,spawnI:.9};
  genField();updHUD(true);
}
function makePath(){
  for(let a=0;a<24;a++){
    const p=[];let r=(R()*ROWS)|0;
    for(let c=0;c<COLS;c++){p.push({r,c});const d=R();if(d<.34)r--;else if(d>.66)r++;r=clamp(r,0,ROWS-1);}
    if(new Set(p.map(q=>q.r)).size>=3)return p;
  }
  const p=[];let r=2;for(let c=0;c<COLS;c++){p.push({r,c});if(c%4===3)r=((c/4)|0)%2?5:2;}return p;
}
function genField(){
  S.path=makePath();
  S.pset=new Set(S.path.map(p=>p.r+','+p.c));
  S.cum=[0];for(let i=1;i<S.path.length;i++){const a=S.path[i-1],b=S.path[i];S.cum.push(S.cum[i-1]+Math.hypot(b.r-a.r,b.c-a.c));}
  S.total=S.cum[S.path.length-1];
  const base=S.path[S.path.length-1], sp0=S.path[0];
  S.C=[];S.flat=[];
  for(let r=0;r<ROWS;r++){S.C[r]=[];for(let c=0;c<COLS;c++){const cell={m:false,rv:false,fl:false,cr:false,nt:0,rt:0};S.C[r][c]=cell;S.flat.push(cell);}}
  for(const cell of S.flat)if(R()<.165)cell.m=true;
  S.C[sp0.r][sp0.c].m=false;S.C[base.r][base.c].m=false;
  let onP=0;for(const p of S.path)if(S.C[p.r][p.c].m)onP++;
  let tries=0;
  while(onP<5&&tries++<400){const p=S.path[1+((R()*(S.path.length-2))|0)];if(!S.C[p.r][p.c].m){S.C[p.r][p.c].m=true;onP++;}}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let n=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr>=0&&cc>=0&&rr<ROWS&&cc<COLS&&S.C[rr][cc].m)n++;}
    S.C[r][c].nt=n;}
}
function isBase(r,c){const b=S.path[S.path.length-1];return r===b.r&&c===b.c;}
function buildOK(r,c){const cell=S.C[r][c];if(S.tmap[r+','+c])return false;if(cell.fl||cell.cr)return false;if(isBase(r,c))return false;if(S.pset.has(r+','+c))return false;return true;}
function revealRC(r,c){if(r<0||c<0||r>=ROWS||c>=COLS)return;const cell=S.C[r][c];if(!cell.rv){cell.rv=true;cell.rt=.35;}}
function reveal3(r,c){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)revealRC(r+dr,c+dc);}

/* ================= audio (created on first input) ================= */
let AC=null,master=null,MUTE=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.42;master.connect(AC.destination);}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,peak,slide,delay){const a=ac();if(!a||MUTE)return;const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(peak||.15,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g).connect(master);o.start(t0);o.stop(t0+d+.06);}
function noise(d,peak,fq,delay){const a=ac();if(!a||MUTE)return;const t0=a.currentTime+(delay||0);
  const n=Math.max(1,Math.floor(a.sampleRate*d)),buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(R()*2-1)*(1-i/n);
  const src=a.createBufferSource();src.buffer=buf;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||800;
  const g=a.createGain();g.gain.value=peak||.3;src.connect(f).connect(g).connect(master);src.start(t0);}
function snd(n){switch(n){
  case 'place':tone(160,.09,'triangle',.25,-60);noise(.05,.14,1200);break;
  case 'flag':tone(760,.05,'square',.12);break;
  case 'unflag':tone(420,.05,'square',.1);break;
  case 'zap':tone(1300,.045,'sawtooth',.06,-900);break;
  case 'cannon':noise(.06,.2,900);tone(150,.07,'triangle',.22,-70);break;
  case 'mortarf':noise(.12,.2,500);tone(90,.12,'sine',.2,-30);break;
  case 'boom2':noise(.16,.28,400);tone(80,.14,'sine',.24,-40);break;
  case 'boom':noise(.35,.5,300);tone(60,.35,'sine',.5,-35);tone(300,.1,'sawtooth',.14,-250);break;
  case 'coin':tone(880,.05,'square',.08,300);tone(1320,.06,'square',.06,200,.04);break;
  case 'err':tone(110,.12,'sawtooth',.16,-30);break;
  case 'sell':tone(520,.06,'triangle',.15);tone(340,.07,'triangle',.13,0,.06);break;
  case 'leak':tone(240,.14,'square',.2,-140);tone(180,.16,'square',.18,-100,.12);break;
  case 'wave':tone(392,.09,'square',.15);tone(523,.14,'square',.15,0,.1);break;
  case 'clear':tone(523,.07,'triangle',.14);tone(659,.07,'triangle',.14,0,.08);tone(784,.12,'triangle',.14,0,.16);break;
  case 'over':tone(392,.16,'sawtooth',.2,-100);tone(311,.16,'sawtooth',.2,-80,.18);tone(233,.3,'sawtooth',.22,-100,.36);break;
}}

/* ================= combat / actions ================= */
function floatAt(x,y,txt,col){S.floats.push({x,y,txt,col,t:0,max:1.15});}
function boomFX(x,y,s){
  S.rings.push({x,y,t:0,max:.45,r:s*1.25,col:'255,190,80'});
  const cols=['#ffd27a','#ff8f3d','#ff5c3a','#9a9a8a'];
  for(let i=0;i<26;i++){const a=R()*TAU,v=(1+R()*3.2)*s*.9;S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,max:.4+R()*.5,sz:.06+R()*.1,col:cols[(R()*4)|0],g:2.5});}
  for(let i=0;i<8;i++){const a=R()*TAU,v=.4+R();S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.6,t:0,max:.9+R()*.6,sz:.18+R()*.2,col:'70,66,58',g:-.4,smoke:true});}
}
function detonate(r,c){
  const cell=S.C[r][c];if(!cell.m||!cell.fl)return;
  cell.m=false;cell.fl=false;cell.cr=true;reveal3(r,c);
  boomFX(c+.5,r+.5,1.6);snd('boom');S.shake=Math.min(14,Math.max(S.shake,9));
  S.gold+=6;S.earned+=6;floatAt(c+.5,r+.5,'TRAP +6','#ffc857');
  for(const e of S.enemies){if(e.dead)continue;if(Math.hypot(e.x-(c+.5),e.y-(r+.5))<1.7)hit(e,400);}
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;
    if(rr<0||cc<0||rr>=ROWS||cc>=COLS||(!dr&&!dc))continue;
    const n=S.C[rr][cc];if(n.m&&n.fl)S.pending.push({t:.12+Math.hypot(dr,dc)*.06,r:rr,c:cc});}
}
function hit(e,d){if(e.dead)return;e.hp-=d;e.flash=Math.max(e.flash,.09);if(e.hp<=0)kill(e);}
function kill(e){if(e.dead)return;e.dead=true;S.kills++;S.gold+=e.gold;S.earned+=e.gold;
  floatAt(e.x,e.y,'+'+e.gold,'#ffc857');snd('coin');
  S.rings.push({x:e.x,y:e.y,t:0,max:.3,r:.6,col:'255,255,255'});
  for(let i=0;i<14;i++){const a=R()*TAU,v=.8+R()*2.4;S.parts.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,max:.35+R()*.4,sz:.05+R()*.08,col:i%3?e.col:'#ffffff',g:2});}}
function placeTower(r,c){
  const def=TDEF[S.tool],cell=S.C[r][c];
  if(!buildOK(r,c)){snd('err');return;}
  if(S.gold<def.cost){snd('err');floatAt(c+.5,r+.5,'NEED '+def.cost+'g','#ff5c46');return;}
  S.gold-=def.cost;
  if(cell.m){ // built on a hidden mine — oops
    reveal3(r,c);boomFX(c+.5,r+.5,1.1);snd('boom');S.shake=Math.min(14,Math.max(S.shake,7));
    floatAt(c+.5,r+.5,'MINE!','#ff5c46');
    for(const e of S.enemies){if(e.dead)continue;if(Math.hypot(e.x-(c+.5),e.y-(r+.5))<1.6)hit(e,60);}
    return;
  }
  const t={r,c,x:c+.5,y:r+.5,type:S.tool,cd:R()*.3,a:-Math.PI/2};
  S.towers.push(t);S.tmap[r+','+c]=t;snd('place');reveal3(r,c);
}
function sellTower(t){
  const refund=Math.floor(TDEF[t.type].cost*.6);
  S.gold+=refund;S.earned+=0;floatAt(t.x,t.y,'+'+refund,'#ffc857');snd('sell');
  S.towers.splice(S.towers.indexOf(t),1);delete S.tmap[t.r+','+t.c];
}
function toggleFlag(r,c){
  const cell=S.C[r][c],key=r+','+c;
  if(isBase(r,c)||S.tmap[key]||cell.cr){snd('err');return;}
  if(cell.fl){cell.fl=false;S.gold+=FLAGCOST;snd('unflag');return;}
  if(S.gold<FLAGCOST){snd('err');floatAt(c+.5,r+.5,'NEED '+FLAGCOST+'g','#ff5c46');return;}
  S.gold-=FLAGCOST;cell.fl=true;reveal3(r,c);snd('flag');
}

/* ================= enemies / waves ================= */
function spawnEnemy(type){
  const d=EDEF[type],w=S.wave,hp=d.hp*(16+8*(w-1));
  S.enemies.push({type,hp,maxhp:hp,dist:.001,seg:0,x:S.path[0].c+.5,y:S.path[0].r+.5,
    spd:d.spd*Math.min(1.45,1+w*.012),r:d.r,dmg:d.dmg,gold:Math.round(d.gold*(1+.04*w)),
    col:d.col,ph:R()*TAU,flash:0,dead:false,dx:1,dy:0});
}
function onEnter(p,e){
  const cell=S.C[p.r][p.c];if(!cell.rv){cell.rv=true;cell.rt=.35;}
  if(cell.m&&cell.fl)detonate(p.r,p.c);
}
function leak(e){
  e.dead=true;S.hp-=e.dmg;S.baseFx=1;S.shake=Math.min(14,Math.max(S.shake,6));snd('leak');
  const b=S.path[S.path.length-1];floatAt(b.c+.5,b.r-.3,'-'+e.dmg,'#ff5c46');
  if(S.hp<=0){S.hp=0;gameOver();}
}
function buildWave(w){
  const q=[];
  if(w%5===0){q.push('boss');const n=4+Math.floor(w/2);for(let i=0;i<n;i++)q.push(i%2?'scut':'grub');}
  else{const n=5+Math.ceil(w*1.6);
    for(let i=0;i<n;i++){let t='grub';const r=R();if(w>=4&&r<.2)t='tank';else if(w>=3&&r<.52)t='scut';q.push(t);}}
  S.spawnQ=q;S.spawnI=Math.max(.38,.95-w*.03);S.spawnT=.6;
}
function waveSub(){const q=S.spawnQ;if(q.includes('boss'))return 'WARDEN INBOUND';if(q.includes('tank'))return 'ARMORED COLUMN';if(q.includes('scut'))return 'SWARM VELOCITY';return 'INFANTRY PROBE';}
function startWave(){S.wave++;S.cleared=false;buildWave(S.wave);S.between=12;banner('WAVE '+S.wave+' — '+waveSub(),S.spawnQ.includes('boss')?'bad':'');snd('wave');}
function tryCall(){
  if(S.mode!=='playing'||S.spawnQ.length||S.enemies.length)return;
  const b=Math.floor(Math.max(0,S.between))*2;
  if(b>0){S.gold+=b;S.earned+=b;}
  startWave();
}

/* ================= update ================= */
function update(dt){
  S.time+=dt;
  S.shake=Math.max(0,S.shake-dt*18);
  S.baseFx=Math.max(0,S.baseFx-dt*1.8);
  for(const cell of S.flat){cell.rt=Math.max(0,cell.rt-dt*2.4);if(cell.cr&&R()<dt*1.3)S.parts.push({x:(S.flat.indexOf(cell)%COLS)+.5,y:0,vx:0,vy:-.35,t:0,max:1.2,sz:.14,col:'60,58,50',g:-.15,smoke:true});}
  // waves
  if(S.spawnQ.length){S.spawnT-=dt;if(S.spawnT<=0){spawnEnemy(S.spawnQ.shift());S.spawnT=S.spawnI;}}
  else if(!S.enemies.length){
    if(S.wave>0&&!S.cleared){S.cleared=true;const b=18+S.wave*4;S.gold+=b;S.earned+=b;banner('WAVE '+S.wave+' CLEARED · +'+b+'g','good');snd('clear');}
    S.between-=dt;if(S.between<=0)startWave();
  }
  // enemies
  for(const e of S.enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);
    e.dist+=e.spd*dt;
    while(e.seg<S.path.length-1&&e.dist>S.cum[e.seg+1]){e.seg++;onEnter(S.path[e.seg],e);if(e.dead)break;}
    if(e.dead)continue;
    if(e.dist>=S.total){leak(e);continue;}
    const a=S.path[e.seg],b=S.path[e.seg+1],L=S.cum[e.seg+1]-S.cum[e.seg],t=(e.dist-S.cum[e.seg])/L;
    e.x=a.c+(b.c-a.c)*t+.5;e.y=a.r+(b.r-a.r)*t+.5;e.dx=b.c-a.c;e.dy=b.r-a.r;
  }
  if(S.enemies.some(e=>e.dead))S.enemies=S.enemies.filter(e=>!e.dead);
  // towers
  for(const t of S.towers){
    const def=TDEF[t.type];t.cd-=dt;if(t.cd>0)continue;
    let best=null,bd=-1;
    for(const e of S.enemies){if(e.dead)continue;const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<=def.range&&e.dist>bd){bd=e.dist;best=e;}}
    if(!best)continue;
    t.a=Math.atan2(best.y-t.y,best.x-t.x);t.cd=1/def.rate;
    if(def.kind==='zap'){hit(best,def.dmg);S.beams.push({x1:t.x,y1:t.y,x2:best.x,y2:best.y,t:.09,max:.09,col:def.col});if(R()<.7)snd('zap');}
    else{
      S.shots.push({x:t.x,y:t.y,tgt:best,lx:best.x,ly:best.y,spd:def.kind==='mortar'?4.5:8,dmg:def.dmg,kind:def.kind,splash:def.splash||0,col:def.col,t:0,tot:1});
      if(def.kind==='shot')snd('cannon');else snd('mortarf');
    }
  }
  // shots
  for(let i=S.shots.length-1;i>=0;i--){
    const s=S.shots[i];s.t+=dt;
    const alive=s.tgt&&!s.tgt.dead;
    if(alive){s.lx=s.tgt.x;s.ly=s.tgt.y;}
    const dx=s.lx-s.x,dy=s.ly-s.y,d=Math.hypot(dx,dy),step=s.spd*dt;
    if(d<=step+.08){
      if(s.kind==='mortar'){
        S.rings.push({x:s.lx,y:s.ly,t:0,max:.35,r:1.2,col:'224,154,78'});snd('boom2');S.shake=Math.min(14,Math.max(S.shake,3));
        for(let k=0;k<6;k++){const a=R()*TAU,v=.4+R();S.parts.push({x:s.lx,y:s.ly,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.5,t:0,max:.7,sz:.15,col:'80,72,58',g:-.3,smoke:true});}
        for(const e of S.enemies){if(e.dead)continue;if(Math.hypot(e.x-s.lx,e.y-s.ly)<=s.splash)hit(e,s.dmg);}
      }else if(alive)hit(s.tgt,s.dmg);
      S.shots.splice(i,1);continue;
    }
    s.x+=dx/d*step;s.y+=dy/d*step;
  }
  // fx decay
  for(let i=S.beams.length-1;i>=0;i--){S.beams[i].t-=dt;if(S.beams[i].t<=0)S.beams.splice(i,1);}
  for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.t+=dt;if(p.t>p.max){S.parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;if(!p.smoke)p.vx*=Math.max(0,1-2.2*dt);}
  for(let i=S.rings.length-1;i>=0;i--){S.rings[i].t+=dt;if(S.rings[i].t>S.rings[i].max)S.rings.splice(i,1);}
  for(let i=S.floats.length-1;i>=0;i--){const f=S.floats[i];f.t+=dt;f.y-=dt*.85;if(f.t>f.max)S.floats.splice(i,1);}
  for(let i=S.pending.length-1;i>=0;i--){const p=S.pending[i];p.t-=dt;if(p.t<=0){S.pending.splice(i,1);detonate(p.r,p.c);}}
}

/* ================= drawing ================= */
function dot(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function poly(x,y,r,n,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*TAU;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
function numFont(){return 'bold '+Math.floor(CS*.46)+'px ui-monospace,Consolas,Menlo,monospace';}

function drawGrid(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=S.C[r][c],x=OX+c*CS,y=OY+r*CS;
    if(S.pset.has(r+','+c)){
      ctx.fillStyle=(r+c)&1?'#5f4d2e':'#665334';ctx.fillRect(x,y,CS,CS);
      ctx.fillStyle='rgba(0,0,0,.22)';
      ctx.fillRect(x+CS*.32,y+CS/2-1.5,CS*.15,3);ctx.fillRect(x+CS*.55,y+CS/2-1.5,CS*.15,3);
    }else{
      ctx.fillStyle=(r+c)&1?'#28331f':'#242e1c';ctx.fillRect(x,y,CS,CS);
      if(!cell.rv){ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(x,y,CS,2);}
    }
    if(cell.rv&&!S.pset.has(r+','+c)){
      ctx.fillStyle='#182113';ctx.fillRect(x+2,y+2,CS-4,CS-4);
    }
    if(cell.rt>0){ctx.fillStyle='rgba(255,255,255,'+(cell.rt*.6)+')';ctx.fillRect(x,y,CS,CS);}
    if(cell.cr){
      ctx.fillStyle='#0b0e08';dot(x+CS/2,y+CS/2,CS*.36);
      ctx.strokeStyle='#33291a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+CS/2,y+CS/2,CS*.36,0,TAU);ctx.stroke();
      for(let i=0;i<4;i++){const a=(r*31+c*17+i*97)%360*Math.PI/180;ctx.fillStyle='#2c2417';dot(x+CS/2+Math.cos(a)*CS*.2,y+CS/2+Math.sin(a)*CS*.2,CS*.05);}
    }
  }
  // grid lines + frame
  ctx.strokeStyle='rgba(8,12,6,.55)';ctx.lineWidth=1;ctx.beginPath();
  for(let c=0;c<=COLS;c++){const x=Math.round(OX+c*CS)+.5;ctx.moveTo(x,OY);ctx.lineTo(x,OY+ROWS*CS);}
  for(let r=0;r<=ROWS;r++){const y=Math.round(OY+r*CS)+.5;ctx.moveTo(OX,y);ctx.lineTo(OX+COLS*CS,y);}
  ctx.stroke();
  ctx.strokeStyle='#3a4c2e';ctx.lineWidth=2;ctx.strokeRect(OX-1,OY-1,COLS*CS+2,ROWS*CS+2);
  // numbers + flags
  ctx.font=numFont();ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=S.C[r][c];if(!cell.rv||cell.nt===0)continue;
    const x=OX+c*CS,y=OY+r*CS,road=S.pset.has(r+','+c);
    if(road){ctx.fillStyle='rgba(10,14,8,.75)';const w=CS*.62,h=CS*.52;ctx.fillRect(x+CS/2-w/2,y+CS/2-h/2,w,h);}
    ctx.fillStyle=NUMCOL[cell.nt];ctx.fillText(cell.nt,x+CS/2,y+CS/2+1);
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=S.C[r][c];if(!cell.fl)continue;
    const x=OX+c*CS,y=OY+r*CS,s=CS;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+s/2,y+s*.82,s*.16,s*.07,0,0,TAU);ctx.fill();
    ctx.strokeStyle='#dfeac9';ctx.lineWidth=Math.max(1.5,s*.05);
    ctx.beginPath();ctx.moveTo(x+s*.38,y+s*.78);ctx.lineTo(x+s*.38,y+s*.2);ctx.stroke();
    ctx.fillStyle='#ff4d3d';ctx.beginPath();ctx.moveTo(x+s*.38,y+s*.2);ctx.lineTo(x+s*.8,y+s*.31);ctx.lineTo(x+s*.38,y+s*.44);ctx.closePath();ctx.fill();
  }
  // scan sweep
  const sy=OY+((GT*26)%(CS*ROWS));
  ctx.fillStyle='rgba(159,232,112,.05)';ctx.fillRect(OX,sy,CS*COLS,3);
}
function drawEndpoints(){
  const sp=S.path[0],bs=S.path[S.path.length-1];
  let x=OX+sp.c*CS,y=OY+sp.r*CS;
  ctx.fillStyle='#141b0e';ctx.fillRect(x,y,CS,CS);
  for(let i=0;i<3;i++){const yy=y+i*(CS/3);ctx.fillStyle=i%2?'#ffc857':'#1a1a12';ctx.fillRect(x,yy+1,4,CS/3-2);}
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.ellipse(x+CS*.5,y+CS*.5,CS*.32,CS*.42,0,0,TAU);ctx.fill();
  x=OX+bs.c*CS;y=OY+bs.r*CS;
  ctx.fillStyle='#5a6152';ctx.fillRect(x+3,y+4,CS-6,CS-8);
  ctx.fillStyle='#79816d';ctx.fillRect(x+3,y+4,CS-6,(CS-8)*.45);
  for(let i=0;i<Math.ceil((CS-6)/6);i++){ctx.fillStyle=i%2?'#ffc857':'#20241a';ctx.fillRect(x+3+i*6,y+CS-9,6,5);}
  ctx.strokeStyle='#dfeac9';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+CS-9,y+CS-4);ctx.lineTo(x+CS-9,y+2);ctx.stroke();
  const wv=Math.sin(GT*3)*2;
  ctx.fillStyle='#9fe870';ctx.beginPath();ctx.moveTo(x+CS-9,y+2);ctx.quadraticCurveTo(x+CS-9+7,y+3+wv,x+CS-9+14,y+5+wv);ctx.lineTo(x+CS-9,y+10);ctx.closePath();ctx.fill();
  if(S.baseFx>0){ctx.fillStyle='rgba(255,60,40,'+(S.baseFx*.5)+')';ctx.fillRect(x-3,y-3,CS+6,CS+6);}
}
function drawTowers(){
  const hk=hoverKey();
  for(const t of S.towers){
    const def=TDEF[t.type],x=OX+t.x*CS,y=OY+t.y*CS;
    if(hk===t.r+','+t.c){
      ctx.strokeStyle=def.col+'55';ctx.fillStyle=def.col+'0d';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(x,y,def.range*CS,0,TAU);ctx.fill();ctx.stroke();
    }
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x,y+CS*.32,CS*.3,CS*.12,0,0,TAU);ctx.fill();
    ctx.fillStyle='#1c2614';ctx.strokeStyle='#3a4c2e';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,CS*.38,0,TAU);ctx.fill();ctx.stroke();
    ctx.save();ctx.translate(x,y);ctx.rotate(t.a);
    if(def.kind==='shot'){
      ctx.fillStyle='#42602a';ctx.fillRect(0,-CS*.11,CS*.5,CS*.22);
      ctx.fillStyle='#7ba04f';ctx.fillRect(CS*.36,-CS*.11,CS*.14,CS*.22);
      if(t.cd>1/def.rate-.07){ctx.fillStyle='#ffe9a8';dot(CS*.55,0,CS*(.09+R()*.05));}
    }else if(def.kind==='zap'){
      ctx.fillStyle='#123f3c';dot(0,0,CS*.2);
      ctx.strokeStyle=def.col;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(CS*.1,-CS*.1);ctx.lineTo(CS*.34,-CS*.17);ctx.moveTo(CS*.1,CS*.1);ctx.lineTo(CS*.34,CS*.17);ctx.stroke();
      ctx.fillStyle=def.col;dot(0,0,CS*.1);
    }else{
      ctx.fillStyle='#5c4326';ctx.fillRect(-CS*.1,-CS*.17,CS*.55,CS*.34);
      ctx.fillStyle='#8a6b3f';ctx.fillRect(CS*.35,-CS*.17,CS*.1,CS*.34);
      ctx.fillStyle='#2c2015';dot(CS*.45,0,CS*.12);
    }
    ctx.restore();
  }
}
function drawGhost(){
  const hc=hoverCell();if(!hc||S.mode!=='playing')return;
  const key=hc.r+','+hc.c,x=OX+(hc.c+.5)*CS,y=OY+(hc.r+.5)*CS;
  if(S.tool<3){
    const def=TDEF[S.tool],ok=buildOK(hc.r,hc.c)&&S.gold>=def.cost;
    ctx.globalAlpha=.55;ctx.fillStyle='#1c2614';dot(x,y,CS*.38);ctx.fillStyle=def.col;dot(x,y,CS*.18);ctx.globalAlpha=1;
    ctx.strokeStyle=ok?def.col+'77':'#ff5c4688';ctx.setLineDash([6,6]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(x,y,def.range*CS,0,TAU);ctx.stroke();ctx.setLineDash([]);
    if(!ok){ctx.strokeStyle='#ff5c46cc';ctx.lineWidth=2;ctx.strokeRect(OX+hc.c*CS+2,OY+hc.r*CS+2,CS-4,CS-4);}
  }else{
    const ok=!S.tmap[key]&&!isBase(hc.r,hc.c)&&!S.C[hc.r][hc.c].cr;
    ctx.globalAlpha=.55;drawFlagIcon(OX+hc.c*CS,OY+hc.r*CS,CS);ctx.globalAlpha=1;
    if(!ok){ctx.strokeStyle='#ff5c46cc';ctx.lineWidth=2;ctx.strokeRect(OX+hc.c*CS+2,OY+hc.r*CS+2,CS-4,CS-4);}
  }
  const t=S.tmap[key];
  if(t){
    const refund=Math.floor(TDEF[t.type].cost*.6);
    ctx.font='bold 11px ui-monospace,Consolas,Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    const txt='SELL +'+refund;const tw=ctx.measureText(txt).width+12;
    ctx.fillStyle='rgba(10,14,8,.85)';ctx.fillRect(x-tw/2,y-CS*.75,tw,16);
    ctx.strokeStyle='#3a4c2e';ctx.strokeRect(x-tw/2,y-CS*.75,tw,16);
    ctx.fillStyle='#ffc857';ctx.fillText(txt,x,y-CS*.75+8);
  }
}
function drawFlagIcon(x,y,s){
  ctx.strokeStyle='#dfeac9';ctx.lineWidth=Math.max(1.5,s*.05);
  ctx.beginPath();ctx.moveTo(x+s*.38,y+s*.78);ctx.lineTo(x+s*.38,y+s*.2);ctx.stroke();
  ctx.fillStyle='#ff4d3d';ctx.beginPath();ctx.moveTo(x+s*.38,y+s*.2);ctx.lineTo(x+s*.8,y+s*.31);ctx.lineTo(x+s*.38,y+s*.44);ctx.closePath();ctx.fill();
}
function drawEnemies(){
  for(const e of S.enemies){
    if(e.dead)continue;
    const px=OX+e.x*CS,gy=OY+e.y*CS,Rr=e.r*CS;
    const bob=Math.sin(GT*7+e.ph)*Rr*.28,py=gy+bob;
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(px,gy+Rr*.95,Rr*.85,Rr*.32,0,0,TAU);ctx.fill();
    let dx=e.dx,dy=e.dy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;const pxp=-dy,pyp=dx,ang=Math.atan2(dy,dx);
    if(e.type==='scut'){
      ctx.fillStyle=e.col;ctx.beginPath();
      ctx.moveTo(px+dx*Rr*1.7,py+dy*Rr*1.7);
      ctx.lineTo(px-dx*Rr*.9+pxp*Rr*.85,py-dy*Rr*.9+pyp*Rr*.85);
      ctx.lineTo(px-dx*Rr*.9-pxp*Rr*.85,py-dy*Rr*.9-pyp*Rr*.85);
      ctx.closePath();ctx.fill();
    }else if(e.type==='tank'){
      ctx.fillStyle='#3a2a1e';poly(px,py,Rr*1.05,6,ang);ctx.fill();
      ctx.fillStyle=e.col;poly(px,py,Rr*.78,6,ang);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.3)';dot(px-dx*Rr*.15,py-dy*Rr*.15,Rr*.3);
    }else if(e.type==='boss'){
      const au=.25+.15*Math.sin(GT*4+e.ph);
      ctx.strokeStyle='rgba(255,93,143,'+au+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,py,Rr*1.4,0,TAU);ctx.stroke();
      ctx.fillStyle='#4a1f33';
      for(let i=0;i<8;i++){const a=i/8*TAU+GT;
        const bx=px+Math.cos(a)*Rr*.9,by=py+Math.sin(a)*Rr*.9;
        ctx.beginPath();ctx.moveTo(bx+Math.cos(a+.45)*Rr*.3,by+Math.sin(a+.45)*Rr*.3);
        ctx.lineTo(bx+Math.cos(a)*Rr*1.6,by+Math.sin(a)*Rr*1.6);
        ctx.lineTo(bx+Math.cos(a-.45)*Rr*.3,by+Math.sin(a-.45)*Rr*.3);ctx.closePath();ctx.fill();}
      ctx.fillStyle=e.col;dot(px,py,Rr);
      ctx.fillStyle='#2c0f1d';dot(px,py,Rr*.55);
    }else{
      ctx.fillStyle=e.col;ctx.beginPath();ctx.ellipse(px,py,Rr,Rr*.85,ang,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(px-dx*Rr*.3,py-dy*Rr*.3,Rr*.4,Rr*.3,0,0,TAU);ctx.fill();
    }
    const ex=px+dx*Rr*.5,ey=py+dy*Rr*.5;
    ctx.fillStyle='#fff';dot(ex+pxp*Rr*.38,ey+pyp*Rr*.38,Rr*.22);dot(ex-pxp*Rr*.38,ey-pyp*Rr*.38,Rr*.22);
    ctx.fillStyle='#141a10';dot(ex+dx*Rr*.08+pxp*Rr*.38,ey+dy*Rr*.08+pyp*Rr*.38,Rr*.1);dot(ex+dx*Rr*.08-pxp*Rr*.38,ey+dy*Rr*.08-pyp*Rr*.38,Rr*.1);
    if(e.flash>0){ctx.fillStyle='rgba(255,255,255,'+(e.flash/.09*.7)+')';dot(px,py,Rr*1.05);}
    if(e.hp<e.maxhp){
      const w=Rr*2.2,pct=Math.max(0,e.hp/e.maxhp);
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(px-w/2,py-Rr-9,w,3.5);
      ctx.fillStyle=pct>.5?'#9fe870':pct>.25?'#ffc857':'#ff5c46';
      ctx.fillRect(px-w/2,py-Rr-9,w*pct,3.5);
    }
  }
}
function drawShots(){
  for(const s of S.shots){
    const px=OX+s.x*CS,py=OY+s.y*CS;
    if(s.kind==='shot'){
      const dx=s.lx-s.x,dy=s.ly-s.y,d=Math.hypot(dx,dy)||1;
      ctx.strokeStyle=s.col+'cc';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(px-dx/d*CS*.28,py-dy/d*CS*.28);ctx.lineTo(px,py);ctx.stroke();
      ctx.fillStyle='#eaffd0';dot(px,py,3);
    }else{
      const p=clamp(s.t/s.tot,0,1),arc=Math.sin(Math.PI*p)*CS*.9;
      ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(px,py+3,5,2.4,0,0,TAU);ctx.fill();
      ctx.fillStyle='#3a2f26';dot(px,py-arc,CS*.11);
      ctx.strokeStyle=s.col;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py-arc,CS*.11,0,TAU);ctx.stroke();
    }
  }
}
function drawBeams(){
  for(const b of S.beams){
    const a=b.t/b.max,px1=OX+b.x1*CS,py1=OY+b.y1*CS,px2=OX+b.x2*CS,py2=OY+b.y2*CS;
    ctx.globalAlpha=a*.9;ctx.strokeStyle=b.col;ctx.lineWidth=2;
    const nx=-(py2-py1),ny=(px2-px1),nl=Math.hypot(nx,ny)||1;
    ctx.beginPath();ctx.moveTo(px1,py1);
    for(let i=1;i<4;i++){const t=i/4,j=(R()-.5)*CS*.16;ctx.lineTo(px1+(px2-px1)*t+nx/nl*j,py1+(py2-py1)*t+ny/nl*j);}
    ctx.lineTo(px2,py2);ctx.stroke();ctx.globalAlpha=1;
  }
}
function drawParts(){
  for(const p of S.parts){
    const a=1-p.t/p.max,px=OX+p.x*CS,py=OY+p.y*CS;
    if(p.smoke){
      ctx.fillStyle='rgba('+p.col+','+(a*.4)+')';dot(px,py,p.sz*CS*(1+p.t*2));
    }else{
      ctx.globalAlpha=a;ctx.fillStyle=p.col;dot(px,py,p.sz*CS);ctx.globalAlpha=1;
    }
  }
  for(const r of S.rings){
    const t=r.t/r.max;
    ctx.strokeStyle='rgba('+r.col+','+((1-t)*.8)+')';ctx.lineWidth=3*(1-t)+1;
    ctx.beginPath();ctx.arc(OX+r.x*CS,OY+r.y*CS,r.r*t*CS,0,TAU);ctx.stroke();
  }
}
function drawFloats(){
  ctx.font='bold 12px ui-monospace,Consolas,Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const f of S.floats){
    const a=1-f.t/f.max,px=OX+f.x*CS,py=OY+f.y*CS;
    ctx.globalAlpha=a;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';
    ctx.strokeText(f.txt,px,py);ctx.fillStyle=f.col;ctx.fillText(f.txt,px,py);ctx.globalAlpha=1;
  }
}
function drawDust(){
  for(const d of DUST){
    const a=.04+.05*(.5+.5*Math.sin(GT+d.ph));
    ctx.fillStyle='rgba(200,230,180,'+a+')';dot(d.x,d.y,d.s);
  }
}
function hoverCell(){
  if(M.x<-90)return null;
  const c=Math.floor((M.x-OX)/CS),r=Math.floor((M.y-OY)/CS);
  if(r<0||c<0||r>=ROWS||c>=COLS)return null;
  return {r,c};
}
function hoverKey(){const h=hoverCell();return h?h.r+','+h.c:null;}

function render(){
  ctx.fillStyle='#0c120a';ctx.fillRect(0,0,W,H);
  const sh=S.shake;
  ctx.save();ctx.translate((R()-.5)*sh,(R()-.5)*sh);
  drawDust();drawGrid();drawEndpoints();drawTowers();drawGhost();drawEnemies();drawShots();drawBeams();drawParts();drawFloats();
  ctx.restore();
  ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
}

/* ================= HUD / overlay ================= */
const el={};['goldV','hpV','waveV','nextV','spdB','muteB','pauseB','reB','banner','ovl','panel','c0','c1','c2','cF'].forEach(id=>el[id]=$(id));
let prevGold=STARTGOLD,prevHp=-1;
function updHUD(force){
  const gs=String(S.gold);
  if(el.goldV.textContent!==gs||force){el.goldV.textContent=gs;
    if(!force&&S.gold>prevGold&&el.goldV.animate)el.goldV.animate([{transform:'scale(1.28)'},{transform:'scale(1)'}],{duration:180});}
  prevGold=S.gold;
  if(el.hpV.textContent!==String(S.hp)||force||S.hp!==prevHp){
    let s='';for(let i=0;i<MAXHP;i++)s+=i<S.hp?'<i></i>':'';
    el.hpV.innerHTML=s;el.hpV.classList.toggle('low',S.hp<=3);prevHp=S.hp;
  }
  el.waveV.textContent=S.wave>0?S.wave:'—';
  const active=S.spawnQ.length+S.enemies.length;
  if(active)el.nextV.textContent='HOSTILES LEFT: '+active;
  else{const b=Math.floor(Math.max(0,S.between));
    el.nextV.textContent=(S.wave===0?'FIRST WAVE':'NEXT WAVE')+' IN '+b+'s · SPACE +'+(b*2)+'g';}
  el.nextV.classList.toggle('hot',!active&&S.between<=3&&S.mode==='playing');
  for(let i=0;i<3;i++)el['c'+i].classList.toggle('no',S.gold<TDEF[i].cost);
  el.cF.classList.toggle('no',S.gold<FLAGCOST);
  el.spdB.textContent=S.fast?'2×':'1×';el.spdB.classList.toggle('on',S.fast);
  el.muteB.textContent=MUTE?'♪':'♪';el.muteB.classList.toggle('off',MUTE);
}
function setTool(i){S.tool=i;for(let j=0;j<3;j++)el['c'+j].classList.toggle('sel',i===j);el.cF.classList.toggle('sel',i===3);}
let banTO=null;
function banner(txt,cls){
  el.banner.textContent=txt;el.banner.className='';void el.banner.offsetWidth;
  el.banner.className='show'+(cls?' '+cls:'');
}
function menuHTML(){return '<div class="kicker">SECTOR 7 · MINEFIELD SURVEY COMPLETE</div>'
 +'<h1 class="title">BLAST<span>LINE</span></h1>'
 +'<p class="tag">Minesweeper × Tower Defense — know your ground, hold the line</p>'
 +'<div class="note">Every cell may hide a mine — and mines <b>only detonate when flagged</b>. Build near the enemy lane to read the numbers, deduce where the mines sit, plant flags on the road… and let the column walk into your traps. Flagged mines chain-detonate. Building directly on a hidden mine? That blows up too.</div>'
 +'<div class="ctl">'
 +'<span><kbd>LMB</kbd></span><span>build selected tower · click a tower to sell (60%)</span>'
 +'<span><kbd>RMB</kbd></span><span>flag / unflag a cell — 15g, refunded on remove</span>'
 +'<span><kbd>1·2·3</kbd>&nbsp;<kbd>F</kbd></span><span>Pounder · Zapper · Mortar · Flag tool</span>'
 +'<span><kbd>SPACE</kbd></span><span>call next wave early (+2g per second)</span>'
 +'<span><kbd>T</kbd>&nbsp;<kbd>P</kbd>&nbsp;<kbd>M</kbd></span><span>2× speed · pause · mute</span></div>'
 +'<div class="row"><button class="big" data-act="start">DEPLOY ▸</button><span class="dim">'+(BEST>0?'best run · wave '+BEST:'no prior deployments')+'</span></div>';}
function overHTML(){return '<div class="kicker red">CONNECTION LOST — SECTOR 7 OVERRUN</div>'
 +'<h1 class="title red">BASE<br>BREACHED</h1>'
 +'<div class="stats">'
 +'<div><label>WAVE SURVIVED</label><b>'+S.wave+'</b></div>'
 +'<div><label>KILLS</label><b>'+S.kills+'</b></div>'
 +'<div><label>GOLD EARNED</label><b>'+S.earned+'</b></div>'
 +'<div><label>BEST WAVE</label><b>'+BEST+'</b></div></div>'
 +'<div class="row"><button class="big" data-act="restart">REDEPLOY ▸ <small>(R)</small></button><button class="big ghost" data-act="menu">COMMAND MENU</button></div>';}
function pauseHTML(){return '<h1 class="title small">PAUSED</h1><p class="tag">sector 7 holding…</p>'
 +'<div class="row"><button class="big" data-act="resume">RESUME ▸ <small>(P)</small></button><button class="big ghost" data-act="restart">RESTART ⟲</button></div>';}
function panelShow(html){el.ovl.style.display='flex';el.panel.innerHTML=html;}
function hideOvl(){el.ovl.style.display='none';}
function showMenu(){S.mode='menu';panelShow(menuHTML());}
function startGame(){S.mode='playing';S.between=6;hideOvl();banner('DEPLOY · WAVE 1 INCOMING');snd('wave');}
function restart(){newRun();setTool(0);S.mode='playing';S.between=6;hideOvl();banner('NEW DEPLOYMENT');snd('wave');}
function togglePause(){
  if(S.mode==='playing'){S.mode='paused';panelShow(pauseHTML());}
  else if(S.mode==='paused'){S.mode='playing';hideOvl();}
}
function gameOver(){
  S.mode='over';snd('over');
  if(S.wave>BEST){BEST=S.wave;try{localStorage.setItem('bl_best',String(BEST));}catch(e){}}
  panelShow(overHTML());
}

/* ================= input ================= */
addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousemove',e=>{M.x=e.clientX;M.y=e.clientY;});
cv.addEventListener('mouseleave',()=>{M.x=-99;M.y=-99;});
cv.addEventListener('mousedown',e=>{
  ac();if(S.mode!=='playing')return;
  const p=hoverCell();if(!p)return;
  if(e.button===0){
    const t=S.tmap[p.r+','+p.c];
    if(t){sellTower(t);return;}
    if(S.tool<3)placeTower(p.r,p.c);else toggleFlag(p.r,p.c);
  }else if(e.button===2)toggleFlag(p.r,p.c);
});
addEventListener('keydown',e=>{
  ac();const k=e.key;
  if(k===' '){e.preventDefault();
    if(S.mode==='playing')tryCall();else if(S.mode==='menu')startGame();else if(S.mode==='over')restart();return;}
  if(k==='Enter'){if(S.mode==='menu')startGame();else if(S.mode==='over')restart();return;}
  if(k==='1'||k==='2'||k==='3')setTool(+k-1);
  else if(k==='4'||k.toLowerCase()==='f')setTool(3);
  else if(k.toLowerCase()==='t'){S.fast=!S.fast;}
  else if(k.toLowerCase()==='m'){MUTE=!MUTE;if(!MUTE)snd('flag');}
  else if(k.toLowerCase()==='p'||k==='Escape')togglePause();
  else if(k.toLowerCase()==='r'){if(S.mode==='over'||S.mode==='paused')restart();}
});
el.c0.onclick=()=>{ac();setTool(0);};el.c1.onclick=()=>{ac();setTool(1);};
el.c2.onclick=()=>{ac();setTool(2);};el.cF.onclick=()=>{ac();setTool(3);};
el.spdB.onclick=()=>{ac();S.fast=!S.fast;};
el.muteB.onclick=()=>{ac();MUTE=!MUTE;};
el.pauseB.onclick=()=>{ac();togglePause();};
el.reB.onclick=()=>{ac();if(S.mode!=='menu')restart();};
el.panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;ac();
  const a=b.dataset.act;
  if(a==='start')startGame();else if(a==='restart')restart();
  else if(a==='resume'){S.mode='playing';hideOvl();}
  else if(a==='menu'){newRun();showMenu();}
});
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>ac(),{once:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='playing')togglePause();});

/* ================= main loop / init ================= */
let lastT=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;GDT=dt;GT+=dt;
  if(S.mode==='playing')update(dt*(S.fast?2:1));
  updDust(dt);updHUD();render();
}
resize();newRun();showMenu();setTool(0);requestAnimationFrame(frame);
</script>
</body>
