<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cargo Spire — Isometric 3D Sokoban</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#081a22}
body{font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;color:#cfe8e6;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.disp{font-family:Impact,'Arial Black','Franklin Gothic Medium',sans-serif;font-weight:400;letter-spacing:.05em}
#cvs{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#topbar{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
#brand{display:flex;align-items:center;gap:10px}
#brand .bmark{width:26px;height:30px;background:linear-gradient(160deg,#ffb45e 0 34%,#c97b32 34% 68%,#8f5522 68%);transform:skewX(-14deg) rotate(4deg);box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.15)}
#brand .btxt{font-family:Impact,'Arial Black',sans-serif;font-size:21px;letter-spacing:.08em;color:#ffd9a0;text-shadow:0 2px 0 #7c3a16,0 5px 14px rgba(0,0,0,.5)}
#brand .btxt em{font-style:normal;color:#6fe7c8}
#leveltag{margin-top:4px;font-size:11px;letter-spacing:.22em;color:#7fb3ac;text-transform:uppercase}
#hint{margin-top:3px;font-size:13px;font-style:italic;color:#9fd0c6;max-width:340px;line-height:1.35}
#stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(10,27,35,.8);border:1px solid #2e5a68;border-radius:7px;padding:6px 10px;text-align:center;min-width:64px}
.chip span{display:block;font-size:9px;letter-spacing:.2em;color:#6fa39c;text-transform:uppercase;margin-bottom:2px}
.chip b{font-family:Impact,'Arial Black',sans-serif;font-weight:400;font-size:19px;color:#eafcf7;display:inline-block}
.chip b.bump{animation:bump .25s ease}
@keyframes bump{40%{transform:scale(1.35);color:#ffd9a0}}

#ctl{position:absolute;left:16px;bottom:14px;font-size:11.5px;color:#7fb3ac;display:flex;gap:12px;align-items:center}
.kc{display:inline-block;min-width:22px;padding:2px 6px;border-radius:5px;background:#123039;border:1px solid #35606e;border-bottom-width:3px;color:#bfe8e0;font-size:11px;text-align:center;font-weight:bold;margin:0 1px}
#btns{position:absolute;right:16px;bottom:14px;display:flex;gap:8px;pointer-events:auto}
.btn{cursor:pointer;background:#143440;border:1px solid #3a6d7c;border-bottom:4px solid #0c222b;color:#dff5ef;padding:8px 13px;font-family:inherit;font-weight:bold;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:8px;transition:transform .08s,background .15s}
.btn:hover{background:#1b4553;transform:translateY(-1px)}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.primary{background:#b3641f;border-color:#e89a4a;border-bottom-color:#6d3a10;color:#fff3df}
.btn.primary:hover{background:#c9752a}

/* ---------- dpad (touch) ---------- */
#dpad{position:fixed;right:16px;bottom:70px;display:none;grid-template-areas:". u ." "l . r" ". d .";gap:7px;z-index:4}
@media (pointer:coarse){ #dpad{display:grid} #ctl{display:none} }
#dpad button{width:52px;height:52px;border-radius:10px;background:rgba(16,42,52,.8);border:1px solid #3a6d7c;border-bottom:4px solid #0c222b;color:#dff5ef;font-size:19px;touch-action:none}
#dpad button:active{transform:translateY(2px)}
#dpad [data-d="up"]{grid-area:u}#dpad [data-d="left"]{grid-area:l}#dpad [data-d="right"]{grid-area:r}#dpad [data-d="down"]{grid-area:d}

/* ---------- splash ---------- */
#splash{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;z-index:4;width:90%}
#splash span{display:block;font-size:clamp(38px,6vw,64px);color:#ffd9a0;text-shadow:0 3px 0 #7c3a16,0 10px 26px rgba(0,0,0,.6)}
#splash em{font-style:normal;font-size:clamp(13px,1.8vw,17px);letter-spacing:.5em;color:#6fe7c8;text-transform:uppercase}
#splash.go{animation:splash 1.5s ease forwards}
@keyframes splash{0%{opacity:0;transform:translate(-50%,-46%) scale(.94)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%)}}

/* ---------- overlay screens ---------- */
#overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s}
#overlay.show{opacity:1;pointer-events:auto}
#overlay.menu{justify-content:flex-start;padding:5vh 4vw 0}
.panel{background:rgba(9,24,31,.88);border:1px solid #2e5a68;border-left:4px solid #ffb45e;border-radius:10px;padding:28px 32px;max-width:560px;width:min(560px,94vw);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.02)}
#overlay.menu .panel{animation:slideIn .45s cubic-bezier(.2,.9,.3,1.25)}
@keyframes slideIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.logo svg{display:block;margin-bottom:6px}
.logo{animation:bob 3.2s ease-in-out infinite;width:max-content}
@keyframes bob{50%{transform:translateY(-7px)}}
h1.title{font-size:clamp(44px,7vw,80px);line-height:.95;color:#ffd9a0;text-shadow:0 3px 0 #b3541e,0 7px 0 #5e2c0f,0 16px 34px rgba(0,0,0,.6);transform:skewX(-3deg)}
h1.title em{font-style:normal;color:#6fe7c8;text-shadow:0 3px 0 #1d6a58,0 7px 0 #0e3a31,0 16px 34px rgba(0,0,0,.6)}
.tag{margin-top:8px;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:#7fb3ac}
.blurb{margin:16px 0 4px;font-size:14.5px;line-height:1.55;color:#b9dcd4}
.keys{margin:16px 0;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:#9fd0c6}
.dots{display:flex;gap:8px;margin:20px 0 6px}
.dot{position:relative;width:44px;height:44px;font-weight:bold;font-size:15px;background:#12303a;border:1px solid #35606e;color:#bfe8e0;cursor:pointer;border-radius:8px;font-family:inherit}
.dot:hover{background:#1a4250}
.dot.done{background:#17493f;border-color:#4fae8c;color:#bff2dd}
.dot.done i{position:absolute;top:-9px;right:-8px;font-style:normal;font-size:10px;background:#6fe7c8;color:#0b2a22;border-radius:50%;width:17px;height:17px;line-height:17px;text-align:center;font-weight:bold}
.dot.lock{opacity:.32;cursor:not-allowed}
.press{margin-top:22px;font-size:14px;letter-spacing:.3em;color:#9fd8cf;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
h2.stamp{display:inline-block;font-size:clamp(28px,4.6vw,50px);color:#bff2dd;border:3px solid #6fe7c8;padding:6px 18px;transform:rotate(-2deg);letter-spacing:.05em;background:rgba(111,231,200,.07);text-shadow:0 3px 12px rgba(0,0,0,.5)}
h2.stamp.gold{color:#ffd9a0;border-color:#ffb45e;background:rgba(255,180,94,.08)}
.rows{margin:24px 0 6px;display:flex;gap:10px}
.rows div{flex:1;background:#0d2731;border:1px solid #2e5a68;border-radius:8px;padding:12px 6px;text-align:center}
.rows span{display:block;font-size:9.5px;letter-spacing:.2em;color:#6fa39c;text-transform:uppercase;margin-bottom:6px}
.rows b{font-family:Impact,'Arial Black',sans-serif;font-weight:400;font-size:28px;color:#fff}
.new{display:inline-block;margin-left:8px;font-style:normal;font-size:10px;background:#ffb45e;color:#3a1d05;padding:3px 7px;border-radius:20px;transform:rotate(-4deg);font-weight:bold;animation:pop .45s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{from{transform:scale(0) rotate(-4deg)}}
.brow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.foot{margin-top:16px;font-size:11.5px;color:#6fa39c}
@media (max-width:640px){ #hint{display:none} .chip{min-width:52px;padding:5px 7px} .chip b{font-size:16px} #btns .lbl{display:none} }
</style>
</head>
<body>
<canvas id="cvs"></canvas>

<div id="hud">
  <div id="topbar">
    <div>
      <div id="brand"><span class="bmark"></span><span class="btxt">CARGO <em>SPIRE</em></span></div>
      <div id="leveltag">DECK 01 · FIRST SHIFT</div>
      <div id="hint"></div>
    </div>
    <div id="stats">
      <div class="chip"><span>Moves</span><b id="cMoves">0</b></div>
      <div class="chip"><span>Pushes</span><b id="cPushes">0</b></div>
      <div class="chip"><span>Pads</span><b id="cPads">0/1</b></div>
      <div class="chip"><span>Best</span><b id="cBest">—</b></div>
    </div>
  </div>
  <div id="ctl">
    <span><i class="kc">W</i><i class="kc">A</i><i class="kc">S</i><i class="kc">D</i> move &amp; push</span>
    <span><i class="kc">Z</i> undo</span><span><i class="kc">R</i> restart</span><span><i class="kc">M</i> sound</span>
  </div>
  <div id="btns">
    <button class="btn" id="bUndo"><span class="lbl">⟲ </span>Undo</button>
    <button class="btn" id="bRestart"><span class="lbl">↻ </span>Restart</button>
    <button class="btn" id="bMenu"><span class="lbl">☰ </span>Menu</button>
    <button class="btn" id="bMute">Sound On</button>
  </div>
</div>

<div id="dpad">
  <button data-d="up">▲</button><button data-d="left">◀</button>
  <button data-d="right">▶</button><button data-d="down">▼</button>
</div>

<div id="splash"></div>
<div id="overlay"><div class="panel" id="panel"></div></div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const cvs=document.getElementById('cvs'), ctx=cvs.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;makeVignette();}
addEventListener('resize',resize);

const PAL={
 floorA:[47,86,98],floorB:[53,94,106],skirtR:[24,48,57],skirtL:[15,33,41],
 wallT:[62,105,119],wallR:[39,72,84],wallL:[26,50,60],
 crateT:[255,180,94],crateR:[201,123,50],crateL:[143,85,34],
 crateOnT:[255,215,106],crateOnR:[217,161,60],crateOnL:[163,118,43],
 bodyT:[255,141,122],bodyR:[226,89,75],bodyL:[168,60,51],
 head:[247,234,217],eye:[24,38,44],
 pad:[111,231,200],gold:[255,215,106],
 upT:[127,232,201],upR:[42,91,84],upL:[29,63,58],
 dnT:[255,180,94],dnR:[138,90,38],dnL:[104,66,30]};
const col=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix=(c,f)=>[c[0]*f|0,c[1]*f|0,c[2]*f|0];
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=p=>1-(1-p)*(1-p);
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;

/* ============================== AUDIO ============================== */
let AC=null,master=null,nbuf=null;
function ensureAudio(){ if(AC){ if(AC.state==='suspended')AC.resume(); return;}
 try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain();
  master.gain.value=S.muted?0:0.32; master.connect(AC.destination);
  const len=AC.sampleRate|0; nbuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=nbuf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 }catch(e){} }
function tone(f,f2,dur,type,vol,delay=0){ if(!AC||S.muted)return;
 const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function thud(dur=0.12,vol=0.4,freq=900,delay=0){ if(!AC||S.muted)return;
 const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=nbuf;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);}
const sfx={
 move(){tone(340,260,.05,'square',.09)},
 push(){thud(.14,.5,700);tone(95,60,.12,'triangle',.32)},
 bump(){tone(70,45,.1,'square',.28);thud(.08,.22,300)},
 pad(){tone(660,0,.08,'sine',.3);tone(990,0,.1,'sine',.28,.07);tone(1480,0,.18,'triangle',.12,.15)},
 stair(up){up?tone(260,760,.22,'sawtooth',.1):tone(760,260,.22,'sawtooth',.1);thud(.14,.12,500,.05)},
 undo(){tone(520,300,.12,'sine',.18)},
 click(){tone(880,0,.04,'square',.1)},
 win(){[523,659,784,1046].forEach((f,i)=>tone(f,0,.16,'triangle',.28,i*.09));tone(1568,0,.3,'sine',.14,.38)},
 all(){[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,0,.2,'triangle',.28,i*.11))}};

/* ============================== STORAGE ============================== */
const S={best:{},cleared:[],muted:false};
try{const j=JSON.parse(localStorage.getItem('cargospire1')||'{}');if(j.best)S.best=j.best;if(Array.isArray(j.cleared))S.cleared=j.cleared;S.muted=!!j.muted;}catch(e){}
function save(){try{localStorage.setItem('cargospire1',JSON.stringify(S));}catch(e){}}

/* ============================== LEVELS ============================== */
const LEVELS=[
{name:'First Shift',hint:'Push the crate right onto its glowing pad. You get one move at a time — plan ahead.',
 floors:[["#######","#.....#","#@B..T#","#.....#","#######"]]},
{name:'Double Up',hint:'Two crates, two pads. Mind the order and work around the open deck.',
 floors:[["########","#......#","#@..B..#","#..T...#","#.B.T..#","#......#","########"]]},
{name:'The Climb',hint:'Stairwells link the decks — step on ▲ to climb, ▼ to descend. Crates can’t ride them.',
 floors:[["#######","#.....#","#.B..T#","#@...u#","#######"],
          ["#######","#.....#","#.T.B.#","#....d#","#######"]]},
{name:'The Vault',hint:'Three crates, crooked pads. Clear the eastern pad first or you’ll box yourself in.',
 floors:[["#########","#.......#","#.B.B.B.#","#.......#","#..T.T.T#","#@......#","#########"]]},
{name:'Tri-Spire',hint:'Three decks, three pads. Keep climbing until every deck glows.',
 floors:[["########","#.....u#","#@..B.T#","########"],
          ["########","#u....d#","#..T.B.#","########"],
          ["########","#d.....#","#..T.B..","########"]]},
{name:'Grand Haul',hint:'The final haul — clear both decks of the Spire.',
 floors:[["##########","#........#","#@..B....#","#...##...#","#...B....#","#T..T..u.#","##########"],
          ["##########","#........#","#..B.B...#","#........#","#T.....T.#","#......d.#","##########"]]}];

/* ============================== STATE ============================== */
let L=null,cur=0,moves=0,pushes=0,sessMoves=0,doneCount=0;
let undoStack=[],P={x:0,y:0,z:0,dir:{x:1,y:0},rz:0};
let anim=null,queue=null,state='menu';
let tGlobal=0,dtLast=0,shake={t:0,amp:0},pulse=0,blinkT=2.5,blink=0;
let view={scale:1,ox:0,oy:0};
const parts=[],confetti=[];
const Cf=[[255,180,94],[111,231,200],[255,107,94],[247,234,217],[255,215,106]];

/* ============================== LEVEL LOGIC ============================== */
function loadLevel(i){
 cur=i;const def=LEVELS[i];L={name:def.name,hint:def.hint,floors:[],pads:0,boxes:[]};
 for(let z=0;z<def.floors.length;z++){
  const rows=def.floors[z];
  const f={h:rows.length,w:Math.max(...rows.map(r=>r.length)),floor:new Set(),wall:new Set(),pad:new Set(),up:new Set(),down:new Set(),shade:{}};
  for(let y=0;y<f.h;y++)for(let x=0;x<f.w;x++){
   const c=rows[y][x],k=x+','+y;
   f.shade[k]=0.94+(((x*73856093)^(y*19349663)^(z*83492791))>>>0)%100/100*0.12;
   if(c==='#'){f.wall.add(k);continue;}
   f.floor.add(k);
   if(c==='T')f.pad.add(k),L.pads++;
   else if(c==='u')f.up.add(k);
   else if(c==='d')f.down.add(k);
   else if(c==='@'){P.x=x;P.y=y;P.z=z;}
   else if(c==='B')L.boxes.push({x,y,z});
  } L.floors.push(f);}
 P.rz=0;P.dir={x:1,y:0};moves=0;pushes=0;undoStack=[];anim=null;queue=null;doneCount=countDone();
 fitView();updateHUD();splash(i);hideOverlay();state='play';
}
function countDone(){return L.boxes.reduce((n,b)=>n+(L.floors[b.z].pad.has(b.x+','+b.y)?1:0),0);}
function isFloor(z,x,y){const f=L.floors[z];return f&&f.floor.has(x+','+y);}
function isWall(z,x,y){const f=L.floors[z];return f&&f.wall.has(x+','+y);}
function boxAt(x,y,z){for(const b of L.boxes)if(b.x===x&&b.y===y&&b.z===z)return b;return null;}
function solidForBox(z,x,y){const f=L.floors[z];if(!f||!f.floor.has(x+','+y))return true;if(f.wall.has(x+','+y))return true;if(f.up.has(x+','+y)||f.down.has(x+','+y))return true;return !!boxAt(x,y,z);}

function tryMove(dx,dy){
 if(state!=='play')return; P.dir={x:dx,y:dy};
 if(anim){queue={dx,dy};return;}
 const z=P.z,x=P.x+dx,y=P.y+dy;
 if(!isFloor(z,x,y)||isWall(z,x,y)){bump(dx,dy);return;}
 const b=boxAt(x,y,z);
 if(b){
  const x2=x+dx,y2=y+dy;
  if(solidForBox(z,x2,y2)){bump(dx,dy);return;}
  undoStack.push({px:P.x,py:P.y,pz:z,b,bx:b.x,by:b.y});
  moves++;pushes++;sessMoves++;
  const bx0=b.x,by0=b.y; b.x=x2;b.y=y2; P.x=x;P.y=y;
  anim={type:'push',t:0,dur:.16,pf:{x:x-dx,y:y-dy,z},pt:{x,y,z},bf:{x:bx0,y:by0,z},bt:{x:x2,y:y2,z}};
  sfx.push();
 }else{
  undoStack.push({px:P.x,py:P.y,pz:z});
  moves++;sessMoves++;
  const px0=P.x,py0=P.y; P.x=x;P.y=y;
  anim={type:'move',t:0,dur:.13,pf:{x:px0,y:py0,z},pt:{x,y,z}};
  sfx.move();
 }
 updateHUD();
}
function bump(dx,dy){anim={type:'bump',t:0,dur:.2,dx,dy};shake={t:.25,amp:3.4};sfx.bump();}

function finishAnim(){
 const a=anim;anim=null;
 if(a.type==='move'||a.type==='push'){
  puff(a.pt.x,a.pt.y,P.z,a.type==='push'?6:2);
  const f=L.floors[P.z],k=P.x+','+P.y;
  if(f.up.has(k)&&L.floors[P.z+1]){P.z++;P.rz=-1;anim={type:'stair',t:0,dur:.3};sfx.stair(true);sparkle(P.x,P.y,P.z-.4);return;}
  if(f.down.has(k)){P.z--;P.rz=1;anim={type:'stair',t:0,dur:.3};sfx.stair(false);sparkle(P.x,P.y,P.z+.6);return;}
  const dc=countDone();
  if(a.type==='push'&&dc>doneCount){
   sfx.pad();pulse=1;
   const b=a.bt&&boxAt(a.bt.x,a.bt.y,P.z);
   if(b){for(let i=0;i<10;i++)sparkle(b.x,b.y,b.z);}
  }
  doneCount=dc;updateHUD();
  if(L.pads>0&&doneCount===L.pads){winLevel();return;}
 }else if(a.type==='stair'){P.rz=0;}
 if(queue){const q=queue;queue=null;tryMove(q.dx,q.dy);}
}

function undo(){
 if(state!=='play'||anim||!undoStack.length)return;
 const u=undoStack.pop();
 P.x=u.px;P.y=u.py;P.z=u.pz;
 if(u.b){u.b.x=u.bx;u.b.y=u.by;}
 moves=Math.max(0,moves-1);if(u.b)pushes=Math.max(0,pushes-1);
 doneCount=countDone();sfx.undo();puff(P.x,P.y,P.z,4);updateHUD();
}

function winLevel(){
 state=(cur===LEVELS.length-1)?'done':'clear';
 const isBest=S.best[cur]===undefined||moves<S.best[cur];
 if(isBest)S.best[cur]=moves; S.cleared[cur]=true; save();
 pulse=1.4;confettiBig();
 (state==='done'?sfx.all:sfx.win)();
 setTimeout(()=>{ if(state==='clear')showClear(isBest); else showDone(); },950);
}

/* ============================== VIEW / PROJECTION ============================== */
function fitView(){
 let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;const nf=L.floors.length;
 for(const f of L.floors){for(const k of f.floor){const p=k.split(',');mnx=Math.min(mnx,+p[0]);mny=Math.min(mny,+p[1]);mxx=Math.max(mxx,+p[0]);mxy=Math.max(mxy,+p[1]);}
  for(const k of f.wall){const p=k.split(',');mnx=Math.min(mnx,+p[0]);mny=Math.min(mny,+p[1]);mxx=Math.max(mxx,+p[0]);mxy=Math.max(mxy,+p[1]);}}
 const loX=(mnx-mxy)*32,hiX=(mxx-mny)*32;
 const loY=(mnx+mny)*16-nf*32-18,hiY=(mxx+mxy)*16+70;
 const s=Math.max(.3,Math.min((W-50)/(hiX-loX),(H-90)/(hiY-loY),1.25));
 view={scale:s,ox:W/2-(loX+hiX)/2*s,oy:H/2+16-(loY+hiY)/2*s};
}
function prj(x,y,z){return [view.ox+(x-y)*32*view.scale, view.oy+(x+y)*16*view.scale - z*32*view.scale];}

/* ============================== BACKDROP ============================== */
let bgGrad=null,vig=null,glowSpr=null,mistSpr=null;const motes=[];
for(let i=0;i<55;i++)motes.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*1.6,v:4+Math.random()*8,ph:Math.random()*7});
function makeVignette(){
 vig=document.createElement('canvas');vig.width=Math.max(2,W);vig.height=Math.max(2,H);
 const c=vig.getContext('2d');
 const g=c.createRadialGradient(W/2,H*.45,Math.min(W,H)*.38,W/2,H*.5,Math.max(W,H)*.78);
 g.addColorStop(0,'rgba(3,10,14,0)');g.addColorStop(1,'rgba(3,10,14,.55)');
 c.fillStyle=g;c.fillRect(0,0,W,H);
 bgGrad=ctx.createLinearGradient(0,0,0,H);
 bgGrad.addColorStop(0,'#081a22');bgGrad.addColorStop(.55,'#0d2c37');bgGrad.addColorStop(1,'#123c46');
 if(!glowSpr){glowSpr=document.createElement('canvas');glowSpr.width=glowSpr.height=512;const g2=glowSpr.getContext('2d');
  let r=g2.createRadialGradient(318,140,10,318,140,300);r.addColorStop(0,'rgba(90,200,210,.17)');r.addColorStop(1,'rgba(90,200,210,0)');g2.fillStyle=r;g2.fillRect(0,0,512,512);
  r=g2.createRadialGradient(96,430,10,96,430,330);r.addColorStop(0,'rgba(255,170,90,.10)');r.addColorStop(1,'rgba(255,170,90,0)');g2.fillStyle=r;g2.fillRect(0,0,512,512);}
 if(!mistSpr){mistSpr=document.createElement('canvas');mistSpr.width=256;mistSpr.height=128;const m=mistSpr.getContext('2d');
  const r=m.createRadialGradient(128,64,4,128,64,120);r.addColorStop(0,'rgba(150,215,220,.10)');r.addColorStop(1,'rgba(150,215,220,0)');m.fillStyle=r;m.fillRect(0,0,256,128);}
}
function drawBackdrop(){
 ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
 const gs=Math.max(W,H)*.9;
 ctx.globalAlpha=.75+.1*Math.sin(tGlobal*.35);
 ctx.drawImage(glowSpr,W*.62-gs/2,H*.18-gs/2,gs,gs);ctx.globalAlpha=1;
 for(let i=0;i<3;i++){const mw=W*.9,mx=((tGlobal*(8+i*5)+i*W*.4)%(W+mw))-mw,my=H*(.6+i*.17);
  ctx.globalAlpha=.5;ctx.drawImage(mistSpr,mx,my-70,mw,140);}
 ctx.globalAlpha=1;
 for(const m of motes){m.y-=m.v*dtLast;m.x+=Math.sin(tGlobal*.6+m.ph)*.25;
  if(m.y<-8){m.y=H+8;m.x=Math.random()*W;}
  const a=.1+.14*(.5+.5*Math.sin(tGlobal*2+m.ph));
  ctx.fillStyle='rgba(190,235,235,'+a.toFixed(3)+')';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill();}
}

/* ============================== DRAW HELPERS ============================== */
function diamondPath(cx,cy,w,h){ctx.beginPath();ctx.moveTo(cx,cy-h);ctx.lineTo(cx+w,cy);ctx.lineTo(cx,cy+h);ctx.lineTo(cx-w,cy);ctx.closePath();}
function faceQuad(p1,p2,p3,p4,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.lineTo(p3[0],p3[1]);ctx.lineTo(p4[0],p4[1]);ctx.closePath();ctx.fill();}

function drawPad(cx,cy,w,h,occ){
 const pl=.5+.5*Math.sin(tGlobal*2.6+cx*.05),c=occ?PAL.gold:PAL.pad;
 const g=ctx.createRadialGradient(cx,cy,2,cx,cy,w*1.5);
 g.addColorStop(0,col(c,occ?.34:.15+.1*pl));g.addColorStop(1,col(c,0));
 ctx.fillStyle=g;ctx.fillRect(cx-w*1.5,cy-h*1.5,w*3,h*3);
 const iw=w*(occ?.62:.5+.1*pl),ih=iw/2;
 diamondPath(cx,cy,iw,ih);ctx.fillStyle=col(c,occ?.5:.2+.15*pl);ctx.fill();
 ctx.strokeStyle=col(c,occ?.9:.5+.3*pl);ctx.lineWidth=Math.max(1,1.4*view.scale);ctx.stroke();
 const jw=iw*(.45+.2*pl),jh=jw/2;
 diamondPath(cx,cy,jw,jh);ctx.strokeStyle=col(c,.8);ctx.lineWidth=Math.max(1,1.2*view.scale);ctx.stroke();
}
function drawStairs(cx,cy,S,up){
 const m=up?1:-1;
 ctx.fillStyle='rgba(8,20,26,.5)';diamondPath(cx,cy,30*S,15*S);ctx.fill();
 for(let i=0;i<3;i++){
  const sw=(24-i*5)*S,sh=sw/2,d=9*S,sx=cx+m*i*8*S,sy=cy-m*i*9*S;
  faceQuad([sx-sw,sy],[sx,sy+sh],[sx,sy+sh+d],[sx-sw,sy+d],col(up?PAL.upL:PAL.dnL));
  faceQuad([sx,sy+sh],[sx+sw,sy],[sx+sw,sy+d],[sx,sy+sh+d],col(up?PAL.upR:PAL.dnR));
  diamondPath(sx,sy,sw,sh);ctx.fillStyle=col(up?PAL.upT:PAL.dnT);ctx.fill();}
 const by=cy-30*S-m*4*S+Math.sin(tGlobal*3)*3*S;
 ctx.strokeStyle=col(up?PAL.upT:PAL.dnT,.95);ctx.lineWidth=Math.max(1.5,2.2*S);ctx.lineCap='round';
 ctx.beginPath();
 if(up){ctx.moveTo(cx-7*S,by+5*S);ctx.lineTo(cx,by-3*S);ctx.lineTo(cx+7*S,by+5*S);}
 else{ctx.moveTo(cx-7*S,by-5*S);ctx.lineTo(cx,by+3*S);ctx.lineTo(cx+7*S,by-5*S);}
 ctx.stroke();ctx.lineCap='butt';
}
function drawTile(x,y,z,f,k){
 const S=view.scale,[cx,cy]=prj(x,y,z),w=32*S,h=16*S,sk=18*S;
 if(!f.floor.has((x+1)+','+y))faceQuad([cx,cy+h],[cx+w,cy],[cx+w,cy+sk],[cx,cy+h+sk],col(PAL.skirtR));
 if(!f.floor.has(x+','+(y+1)))faceQuad([cx-w,cy],[cx,cy+h],[cx,cy+h+sk],[cx-w,cy+sk],col(PAL.skirtL));
 const j=f.shade[k]||1,base=((x+y)&1)?PAL.floorA:PAL.floorB;
 diamondPath(cx,cy,w,h);ctx.fillStyle=col(mix(base,j));ctx.fill();
 ctx.strokeStyle='rgba(160,225,225,.09)';ctx.lineWidth=1;ctx.stroke();
 if(f.pad.has(k))drawPad(cx,cy,w*32/32,h,f.pad.has(k)&&!!boxAt(x,y,z));
 if(f.up.has(k))drawStairs(cx,cy,S,true);
 else if(f.down.has(k))drawStairs(cx,cy,S,false);
}
function drawWall(x,y,z,f,k){
 const S=view.scale,[cx,cy0]=prj(x,y,z),w=32*S,h=16*S,d=32*S,ty=cy0-d,j=f.shade[k]||1;
 faceQuad([cx-w,ty],[cx,ty+h],[cx,ty+h+d],[cx-w,ty+d],col(mix(PAL.wallL,j)));
 faceQuad([cx,ty+h],[cx+w,ty],[cx+w,ty+d],[cx,ty+h+d],col(mix(PAL.wallR,j)));
 diamondPath(cx,ty,w,h);ctx.fillStyle=col(mix(PAL.wallT,j));ctx.fill();
 ctx.strokeStyle='rgba(205,245,245,.10)';ctx.lineWidth=1;ctx.stroke();
}
function drawBox(b){
 const S=view.scale;let px=b.x,py=b.y;
 if(anim&&anim.type==='push'&&anim.bt){const p=easeOut(Math.min(1,anim.t/anim.dur));px=lerp(anim.bf.x,anim.bt.x,p);py=lerp(anim.bf.y,anim.bt.y,p);}
 const [cx,cy]=prj(px,py,b.z),w=27*S,h=w/2,d=30*S,ty=cy-d;
 const occ=L.floors[b.z].pad.has(b.x+','+b.y);
 ctx.fillStyle='rgba(4,12,16,.3)';diamondPath(cx,cy+2*S,w*1.02,h*1.02);ctx.fill();
 faceQuad([cx-w,ty],[cx,ty+h],[cx,ty+h+d],[cx-w,ty+d],col(occ?PAL.crateOnL:PAL.crateL));
 faceQuad([cx,ty+h],[cx+w,ty],[cx+w,ty+d],[cx,ty+h+d],col(occ?PAL.crateOnR:PAL.crateR));
 ctx.strokeStyle='rgba(70,35,12,.4)';ctx.lineWidth=Math.max(1,1.2*S);
 ctx.beginPath();ctx.moveTo(cx-w,ty+d/2);ctx.lineTo(cx,ty+h+d/2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(cx,ty+h+d/2);ctx.lineTo(cx+w,ty+d/2);ctx.stroke();
 diamondPath(cx,ty,w,h);ctx.fillStyle=col(occ?PAL.crateOnT:PAL.crateT);ctx.fill();
 ctx.strokeStyle='rgba(90,45,15,.55)';ctx.lineWidth=Math.max(1,1.3*S);ctx.stroke();
 const iw=w*.76,ih=h*.76;
 ctx.beginPath();ctx.moveTo(cx,ty-ih);ctx.lineTo(cx+iw,ty);ctx.lineTo(cx,ty+ih);ctx.lineTo(cx-iw,ty);ctx.closePath();ctx.strokeStyle='rgba(90,45,15,.4)';ctx.stroke();
 ctx.beginPath();ctx.moveTo(cx,ty-ih);ctx.lineTo(cx,ty+ih);ctx.moveTo(cx-iw,ty);ctx.lineTo(cx+iw,ty);ctx.stroke();
 if(occ){const pl=.5+.5*Math.sin(tGlobal*4+b.x);
  diamondPath(cx,ty,w+3*S,h+3*S);ctx.strokeStyle=col(PAL.pad,.35+.4*pl);ctx.lineWidth=Math.max(1,2*S);ctx.stroke();}
}
function drawPlayer(){
 const S=view.scale;let px=P.x,py=P.y,pz=P.z+P.rz;
 let stairFade=1;
 if(anim){const p=Math.min(1,anim.t/anim.dur);
  if(anim.type==='move'||anim.type==='push'){const e=easeOut(p);px=lerp(anim.pf.x,anim.pt.x,e);py=lerp(anim.pf.y,anim.pt.y,e);pz-=Math.sin(p*Math.PI)*.1;}
  else if(anim.type==='bump'){px=P.x+anim.dx*Math.sin(p*Math.PI)*.24;py=P.y+anim.dy*Math.sin(p*Math.PI)*.24;}
  else if(anim.type==='stair'){pz=P.z+P.rz*(1-easeInOut(p));stairFade=1-p;}
 }else pz+=Math.sin(tGlobal*2.3)*.03;
 const [cx,cy]=prj(px,py,pz),w=20*S,h=w/2,d=26*S,ty=cy-d;
 const [scx,scy]=prj(px,py,P.z);
 ctx.fillStyle='rgba(4,12,16,'+(0.3*stairFade).toFixed(3)+')';diamondPath(scx,scy+2*S,w*1.05,h*1.05);ctx.fill();
 faceQuad([cx-w,ty],[cx,ty+h],[cx,ty+h+d],[cx-w,ty+d],col(PAL.bodyL));
 faceQuad([cx,ty+h],[cx+w,ty],[cx+w,ty+d],[cx,ty+h+d],col(PAL.bodyR));
 diamondPath(cx,ty,w,h);ctx.fillStyle=col(PAL.bodyT);ctx.fill();
 const hx=cx,hy=ty-9*S,r=8.5*S;
 const lean=(P.dir.x-P.dir.y)*2*S;
 ctx.strokeStyle='rgba(160,220,215,.8)';ctx.lineWidth=Math.max(1,1.4*S);
 ctx.beginPath();ctx.moveTo(hx+r*.4,hy-r*.7);ctx.lineTo(hx+r*.4+lean*.5,hy-r-6*S);ctx.stroke();
 const gl=.5+.5*Math.sin(tGlobal*5);
 ctx.fillStyle=col(PAL.pad,.3+.5*gl);ctx.beginPath();ctx.arc(hx+r*.4+lean*.5,hy-r-7*S,r*.55,0,7);ctx.fill();
 ctx.fillStyle=col(PAL.head);ctx.beginPath();ctx.arc(hx,hy,r,0,7);ctx.fill();
 ctx.strokeStyle='rgba(30,40,45,.35)';ctx.lineWidth=Math.max(1,1*S);ctx.stroke();
 const exo=(P.dir.x-P.dir.y)*2.6*S,eyo=((P.dir.x+P.dir.y)/2)*2.6*S;
 if(blink>0){ctx.strokeStyle=col(PAL.eye);ctx.lineWidth=Math.max(1,1.4*S);
  ctx.beginPath();ctx.moveTo(hx+exo-4.6*S,hy+eyo);ctx.lineTo(hx+exo-1.8*S,hy+eyo);
  ctx.moveTo(hx+exo+1.8*S,hy+eyo);ctx.lineTo(hx+exo+4.6*S,hy+eyo);ctx.stroke();}
 else{ctx.fillStyle=col(PAL.eye);
  ctx.beginPath();ctx.arc(hx+exo-3.2*S,hy+eyo,2*S,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(hx+exo+3.2*S,hy+eyo,2*S,0,7);ctx.fill();}
}

/* ============================== PARTICLES ============================== */
function puff(x,y,z,n=5){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*.5,y:y+(Math.random()-.5)*.5,z:z+.05+Math.random()*.1,vx:(Math.random()-.5)*1.6,vy:(Math.random()-.5)*1.6,vz:.4+Math.random()*.8,life:.35+Math.random()*.25,max:.6,s:2+Math.random()*2.5,c:[255,220,180]});}
function sparkle(x,y,z){parts.push({x:x+(Math.random()-.5)*.4,y:y+(Math.random()-.5)*.4,z,vx:0,vy:0,vz:.9+Math.random()*.6,life:.7,max:.7,s:1.6+Math.random()*2,c:[140,255,220]});}
function confettiAt(sx,sy,n){for(let i=0;i<n;i++)confetti.push({x:sx,y:sy,vx:(Math.random()-.5)*340,vy:-120-Math.random()*260,g:520,rot:Math.random()*6.28,vr:(Math.random()-.5)*10,w:5+Math.random()*5,h:7+Math.random()*6,c:Cf[i%5],life:1.4+Math.random()*.8,max:2.2});}
function confettiBig(){for(let i=0;i<90;i++)confetti.push({x:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*60,vy:40+Math.random()*80,g:160,rot:Math.random()*6.28,vr:(Math.random()-.5)*8,w:5+Math.random()*5,h:7+Math.random()*6,c:Cf[i%5],life:1.8+Math.random(),max:2.8});
 for(const b of L.boxes){const p=prj(b.x,b.y,b.z+.5);confettiAt(p[0],p[1],24);}}

/* ============================== UPDATE ============================== */
function update(dt){
 tGlobal+=dt;dtLast=dt;
 if(anim){anim.t+=dt;if(anim.t>=anim.dur)finishAnim();}
 shake.t=Math.max(0,shake.t-dt);pulse=Math.max(0,pulse-dt*2.2);
 blinkT-=dt;if(blinkT<0){blink=.13;blinkT=2+Math.random()*3;}blink=Math.max(0,blink-dt);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.life<=0)parts.splice(i,1);}
 if(parts.length>350)parts.splice(0,parts.length-350);
 for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.life-=dt;c.vy+=c.g*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;if(c.life<=0||c.y>H+40)confetti.splice(i,1);}
 if(state!=='menu'&&Math.random()<dt*5){for(const b of L.boxes)if(L.floors[b.z].pad.has(b.x+','+b.y)){sparkle(b.x,b.y,b.z);break;}}
}

/* ============================== RENDER ============================== */
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 drawBackdrop();
 let k=1;
 if(state==='menu')k*=1+.012*Math.sin(tGlobal*.8);
 k*=1+.02*pulse;
 let shx=0,shy=0;
 if(shake.t>0){const s=shake.amp*(shake.t/.25);shx=(Math.random()*2-1)*s;shy=(Math.random()*2-1)*s;}
 ctx.save();
 ctx.translate(W/2,H*.45);ctx.scale(k,k);ctx.translate(-W/2,-H*.45);
 ctx.translate(shx,shy);
 // build sorted draw list: depth = floor * 100 + (x+y) * 2 + solidness
 const items=[];
 for(let z=0;z<L.floors.length;z++){const f=L.floors[z];
  for(const kk of f.floor){const p=kk.split(','),x=+p[0],y=+p[1];items.push({key:z*100+(x+y)*2,fn:()=>drawTile(x,y,z,f,kk)});}
  for(const kk of f.wall){const p=kk.split(','),x=+p[0],y=+p[1];items.push({key:z*100+(x+y)*2+1,fn:()=>drawWall(x,y,z,f,kk)});}}
 for(const b of L.boxes)items.push({key:b.z*100+(b.x+b.y)*2+1,fn:()=>drawBox(b)});
 items.push({key:P.z*100+(P.x+P.y)*2+1,fn:drawPlayer});
 items.sort((a,b)=>a.key-b.key);
 for(const it of items)it.fn();
 // world particles
 for(const p of parts){const a=Math.max(0,p.life/p.max),[sx,sy]=prj(p.x,p.y,p.z),s=p.s*view.scale;
  ctx.fillStyle=col(p.c,a*.8);ctx.fillRect(sx-s/2,sy-s/2,s,s);}
 ctx.restore();
 // confetti (screen space)
 for(const c of confetti){const a=Math.min(1,c.life/c.max*2);
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=col(c.c,a);ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();}
 if(vig)ctx.drawImage(vig,0,0,W,H);
}

function updateHUD(){

function showClear(isBest){
 panel.innerHTML='<h2 class="stamp disp">DECK '+(cur+1)+' CLEARED</h2>'
 +'<div class="rows"><div><span>Moves</span><b>'+moves+'</b></div>'
 +'<div><span>Pushes</span><b>'+pushes+'</b></div>'
 +'<div><span>Deck best</span><b>'+S.best[cur]+(isBest?'<em class="new">NEW BEST!</em>':'')+'</b></div></div>'
 +'<div class="brow"><button class="btn primary" data-act="next">Next deck ▸</button>'
 +'<button class="btn" data-act="replay">Replay ⟲</button><button class="btn" data-act="menu">Menu ☰</button></div>'
 +'<p class="foot">or press <i class="kc">N</i> to continue the climb</p>';
 overlay.classList.add('show');
}
function showDone(){
 panel.innerHTML='<h2 class="stamp gold disp">SPIRE CLEARED!</h2>'
 +'<p class="blurb">All six decks hauled. The Spire hums, satisfied — every pad lit from the ground to the top.</p>'
 +'<div class="rows"><div><span>Session moves</span><b>'+sessMoves+'</b></div>'
 +'<div><span>Decks best total</span><b>'+Object.values(S.best).reduce((a,b)=>a+(+b||0),0)+'</b></div></div>'
 +'<div class="brow"><button class="btn primary" data-act="again">Play again ↻</button>'
 +'<button class="btn" data-act="menu">Menu ☰</button></div>';
 overlay.classList.add('show');
}

overlay.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 ensureAudio();const a=b.dataset.act;sfx.click();
 if(a==='start')startGame();
 else if(a==='lvl'){const i=+b.dataset.i;if(i===0||S.cleared[i-1])loadLevel(i);}
 else if(a==='next')loadLevel(Math.min(cur+1,LEVELS.length-1));
 else if(a==='replay')loadLevel(cur);
 else if(a==='menu')showMenu();
 else if(a==='again'){sessMoves=0;loadLevel(0);}
});
function startGame(){if(state!=='menu')return;sfx.click();hideOverlay();state='play';}

/* ============================== INPUT ============================== */
const DIRS={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0]};
function toggleMute(){ensureAudio();S.muted=!S.muted;save();if(master)master.gain.value=S.muted?0:0.32;sfx.click();updateHUD();}
addEventListener('keydown',e=>{
 const k=e.key;ensureAudio();
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
 if(k==='m'||k==='M'){toggleMute();return;}
 if(state==='menu'){
  if(/^[1-6]$/.test(k)){const i=+k-1;if(i===0||S.cleared[i-1]){sfx.click();loadLevel(i);}return;}
  if(DIRS[k]||k==='Enter'||k===' ')startGame();
  return;}
 if(state==='play'){
  const d=DIRS[k];if(d){tryMove(d[0],d[1]);return;}
  if(k==='z'||k==='Z'||k==='u'||k==='U')undo();
  else if(k==='r'||k==='R'){sfx.click();loadLevel(cur);}
  else if(k==='Escape')showMenu();
  else if(/^[1-6]$/.test(k)){const i=+k-1;if(i===0||S.cleared[i-1])loadLevel(i);}
  return;}
 if(state==='clear'||state==='done'){
  if((k==='n'||k==='N'||k==='Enter'||k===' ')){if(state==='clear')loadLevel(Math.min(cur+1,LEVELS.length-1));else{sessMoves=0;loadLevel(0);}}
  else if(k==='r'||k==='R')loadLevel(cur);
  else if(k==='Escape')showMenu();
 }
});
let tS=null;
cvs.addEventListener('pointerdown',e=>{ensureAudio();if(state==='menu'){startGame();return;}tS={x:e.clientX,y:e.clientY};});
addEventListener('pointerup',e=>{if(!tS)return;const dx=e.clientX-tS.x,dy=e.clientY-tS.y;tS=null;
 if(Math.hypot(dx,dy)>26){if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0);else tryMove(0,dy>0?1:-1);}});
document.getElementById('bUndo').addEventListener('click',()=>{ensureAudio();sfx.click();undo();});
document.getElementById('bRestart').addEventListener('click',()=>{ensureAudio();sfx.click();if(state!=='menu')loadLevel(cur);});
document.getElementById('bMenu').addEventListener('click',()=>{ensureAudio();sfx.click();showMenu();});
document.getElementById('bMute').addEventListener('click',toggleMute);
const DP={up:[0,-1],down:[0,1],right:[1,0],left:[-1,0]};
document.querySelectorAll('#dpad [data-d]').forEach(b=>{
 let rep;const go=()=>{ensureAudio();if(state==='menu')startGame();const d=DP[b.dataset.d];if(d)tryMove(d[0],d[1]);};
 b.addEventListener('pointerdown',e=>{e.preventDefault();go();rep=setInterval(go,175);});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearInterval(rep)));
});

/* ============================== BOOT / LOOP ============================== */
resize();loadLevel(0);showMenu();
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
