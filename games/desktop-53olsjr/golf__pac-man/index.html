<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pac-Golf</title>
<style>
  :root{
    --bg:#05080f; --panel:#0b1226; --line:#2c3f7e; --ink:#dfe8ff;
    --yellow:#ffe600; --blue:#3b4dff; --cyan:#7df9ff; --good:#6dff8a; --bad:#ff5d5d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{position:fixed;inset:0;font-family:'Trebuchet MS','Segoe UI',Tahoma,Verdana,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas{position:absolute;inset:0;display:block;touch-action:none;cursor:crosshair}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;height:52px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;
    background:linear-gradient(rgba(11,18,38,.96),rgba(11,18,38,.85));border-bottom:2px solid #22306a;box-shadow:0 4px 18px rgba(0,0,0,.55);font-size:12px;letter-spacing:.07em}
  .hgroup{display:flex;align-items:center;gap:8px;min-width:0}
  .chip{background:#0f1b3d;border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-transform:uppercase;font-weight:700;white-space:nowrap}
  .chip b{color:var(--yellow);font-size:15px;margin-left:6px;font-variant-numeric:tabular-nums}
  #holeName{font-weight:700;color:#9fb4ff;text-transform:uppercase;letter-spacing:.12em;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #muteBtn{cursor:pointer;background:#0f1b3d;border:1px solid var(--line);color:#bcd0ff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;letter-spacing:.08em}
  #muteBtn:hover{background:#16244f;color:#fff}
  @media (max-width:680px){ #holeName,.hide-sm{display:none} .chip{padding:3px 7px} }

  /* ---------- toast ---------- */
  #toast{position:absolute;left:50%;bottom:11%;transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;z-index:6;text-align:center;
    font-family:'Arial Black',Impact,'Franklin Gothic Medium',sans-serif;font-size:clamp(17px,3.2vw,32px);letter-spacing:.1em;color:#fff;
    text-shadow:0 0 18px rgba(255,230,0,.45),3px 3px 0 #2a3bff;transition:opacity .22s ease,transform .22s ease}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.big{font-size:clamp(26px,5.4vw,56px)}
  #toast.good{color:var(--good);text-shadow:0 0 20px rgba(109,255,138,.5),3px 3px 0 #123a1c}
  #toast.bad{color:var(--bad);text-shadow:0 0 20px rgba(255,93,93,.5),3px 3px 0 #471515}
  #toast.ace{color:var(--yellow);text-shadow:0 0 26px rgba(255,230,0,.8),3px 3px 0 #2a3bff}

  /* ---------- overlay ---------- */
  #overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;
    background:radial-gradient(ellipse at 50% 28%, rgba(10,18,38,.82), rgba(4,6,14,.94));opacity:0;pointer-events:none;transition:opacity .3s ease}
  #overlay.show{opacity:1;pointer-events:auto}
  .card{width:min(560px,94vw);max-height:92vh;overflow-y:auto;background:rgba(11,18,38,.94);border:2px solid var(--line);border-radius:16px;
    padding:26px 30px 28px;text-align:center;box-shadow:0 0 60px rgba(59,77,255,.25),0 24px 60px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.34em;color:#7d92d8;text-transform:uppercase;margin-bottom:8px}
  .title{font-family:'Arial Black',Impact,'Franklin Gothic Medium',sans-serif;font-size:clamp(46px,9vw,80px);line-height:.95;letter-spacing:.01em;color:var(--yellow);
    text-shadow:0 0 24px rgba(255,230,0,.4),5px 5px 0 #2a3bff;margin:2px 0 12px}
  .title span{color:#fff;text-shadow:0 0 20px rgba(125,249,255,.6),5px 5px 0 #0e2f8a}
  .title.small{font-size:clamp(24px,4.5vw,38px);margin-bottom:6px}
  .tag{color:#b9c7f2;font-size:14px;line-height:1.55;margin:0 auto 16px;max-width:42ch}
  .ctrls{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:18px;font-size:13px;color:#c9d6ff}
  kbd{background:#101d44;border:1px solid #3450a8;border-bottom-width:3px;border-radius:6px;padding:2px 8px;font-family:inherit;font-size:11.5px;font-weight:700;color:#bcd0ff;margin:0 2px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:11.5px;color:#93a6dd;margin-bottom:20px}
  .legend i{display:inline-block;vertical-align:-2px;margin-right:5px}
  .ld{width:7px;height:7px;border-radius:50%;background:#ffe3c9}
  .lp{width:12px;height:12px;border-radius:50%;background:#ffd84d;box-shadow:0 0 8px #ffd84d;animation:pulse 1s infinite alternate}
  @keyframes pulse{from{transform:scale(.8)}to{transform:scale(1.15)}}
  .lg{width:13px;height:11px;background:#ff3b30;border-radius:7px 7px 2px 2px}
  .lw{color:#4da3ff;font-weight:900;font-style:normal}
  .ls{width:11px;height:11px;background:#8d7b4c;border-radius:3px}
  .btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{font-family:'Arial Black',Impact,sans-serif;font-size:17px;letter-spacing:.1em;color:#1a1400;background:var(--yellow);border:0;border-radius:10px;padding:13px 28px;cursor:pointer;
    box-shadow:0 5px 0 #b98f00,0 0 26px rgba(255,230,0,.28);transition:transform .12s ease,box-shadow .12s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #b98f00,0 0 36px rgba(255,230,0,.45)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b98f00}
  .btn.ghost{background:transparent;color:#bcd0ff;border:2px solid var(--line);box-shadow:none;font-size:14px;padding:12px 20px}
  .btn.ghost:hover{border-color:#5a76d8;color:#fff;box-shadow:0 0 18px rgba(90,118,216,.3)}
  .hint{margin-top:16px;font-size:11px;color:#7183b4;letter-spacing:.05em}
  .pac{width:34px;height:34px;background:var(--yellow);border-radius:50%;display:inline-block;margin-right:10px;vertical-align:-6px;
    clip-path:polygon(100% 50%,38% 22%,0 36%,0 64%,38% 78%);animation:chomp .9s infinite}
  @keyframes chomp{0%,100%{clip-path:polygon(100% 50%,38% 22%,0 36%,0 64%,38% 78%)}50%{clip-path:polygon(100% 50%,38% 45%,0 49%,0 51%,38% 55%)}}
  .rating{font-family:'Arial Black',Impact,sans-serif;font-size:clamp(22px,4.6vw,38px);letter-spacing:.06em;color:var(--cyan);text-shadow:0 0 18px rgba(125,249,255,.5),3px 3px 0 #0e2f8a;margin:6px 0 14px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}
  th{font-size:10px;letter-spacing:.2em;color:#7d92d8;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid #1a2750;font-variant-numeric:tabular-nums}
  td.num{text-align:center}
  .word{font-weight:900;letter-spacing:.06em;text-align:center}
  .wgood{color:var(--good)} .wbad{color:var(--bad)} .winfo{color:#c9d6ff} .wace{color:var(--yellow)}
  tfoot td{border-top:2px solid var(--line);border-bottom:0;font-weight:900;color:#fff;padding-top:9px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hgroup">
    <span class="chip" id="holeChip">HOLE 1/5<b>–</b></span>
    <span id="holeName">Maze Tee</span>
  </div>
  <div class="hgroup hide-sm">
    <span class="chip">Par<b id="parVal">2</b></span>
    <span class="chip">Strokes<b id="strokeVal">0</b></span>
    <span class="chip">To Par<b id="toPar">E</b></span>
  </div>
  <div class="hgroup">
    <span class="chip">Score<b id="scoreVal">00000</b></span>
    <button id="muteBtn" title="toggle sound (M)">♪ ON</button>
  </div>
</div>

<div id="toast"></div>
<div id="overlay"></div>

<script>
'use strict';
/* ================= DOM ================= */
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const hudHole=$('holeChip'),hudName=$('holeName'),hudPar=$('parVal'),hudStrokes=$('strokeVal'),hudToPar=$('toPar'),hudScore=$('scoreVal'),muteBtn=$('muteBtn');
const toastEl=$('toast'),overlay=$('overlay');

/* ================= AUDIO (Web Audio, after first input) ================= */
let AC=null,master=null,muted=false;
try{muted=localStorage.getItem('pacgolf_mute')==='1'}catch(e){}
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);}catch(e){}
  if(muted)muteBtn.textContent='♪ OFF';
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;type=type||'square';vol=vol||0.2;delay=delay||0;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,vol,freq,q,delay){
  if(!AC||muted)return;vol=vol||0.25;freq=freq||800;q=q||1;delay=delay||0;
  const t=AC.currentTime+delay,len=Math.max(1,(AC.sampleRate*dur)|0),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=AC.createBufferSource();n.buffer=buf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(master);n.start(t);
}
const sfx={
  shot:p=>{noise(.22,.16+.2*p,300+700*p,.7);tone(240+260*p,70,.16,'triangle',.22);},
  bounce:v=>{const vol=Math.min(.28,Math.max(.05,v/9));tone(150,65,.07,'square',vol);noise(.05,vol*.6,500);},
  dot:f=>f?tone(620,880,.06,'square',.15):tone(880,540,.06,'square',.15),
  power:()=>{tone(160,90,.35,'sawtooth',.18);tone(320,180,.35,'sawtooth',.12,.04);noise(.2,.14,1200);},
  ghostHit:()=>{tone(320,55,.45,'sawtooth',.26);noise(.3,.18,250,.7);},
  pop:()=>{tone(500,1400,.14,'square',.2);noise(.12,.16,2400,1.2);},
  splash:()=>{noise(.5,.32,700,.6);tone(220,70,.35,'sine',.16);},
  sink:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f,.12,'square',.18,i*.08));noise(.15,.1,300);},
  rim:()=>tone(950,720,.05,'triangle',.12),
  ui:()=>tone(760,980,.07,'square',.13)
};

/* ================= COURSES ================= */
const MAPS=[
 {name:'Maze Tee',par:2,gs:1.05,rows:[
  "###############",
  "#P.....#......#",
  "#..##..#.####.#",
  "#....#..#....*#",
  "#.##.#.#####.##",
  "#...#.....G.s.#",
  "#.###.######.##",
  "#...#..#s....##",
  "##.#..#.#....##",
  "#........~...F#",
  "###############"]},
 {name:'Ghost Alley',par:3,gs:1.2,rows:[
  "#################",
  "#P....*...#..G..#",
  "#.###.#.##.#.##.#",
  "#...#.....#....F#",
  "#.##.#####.##.###",
  "#.#.....s..#...s#",
  "#.#.####.##.###~#",
  "#.#........~~~..#",
  "#.*.####.##.#.###",
  "#......G.#...#..#",
  "#################"]},
 {name:'Sandy Links',par:3,gs:1.35,rows:[
  "###############",
  "#P...s..*.....#",
  "#.###.#..##..##",
  "#...#....#..s.#",
  "#.#####.##..#.#",
  "#....G...#..*##",
  "#.###.####..s.#",
  "#...#......##.#",
  "#.##.####....##",
  "#s..~~~....F..#",
  "###############"]},
 {name:'The Gauntlet',par:4,gs:1.5,rows:[
  "#################",
  "#P...#.....#....#",
  "#.##.#.###.#.##.#",
  "#...#.....#.s..##",
  "#.####.###.#..s.#",
  "#....G...#.###..#",
  "#.####.#.#.#.##.#",
  "#.*...#.#...#..G#",
  "#.####.###.#.##.#",
  "#.....~~~.#....##",
  "#..##..##.###.#.#",
  "#....G....*...F.#",
  "#################"]},
 {name:'Ghost Green',par:4,gs:1.7,rows:[
  "###############",
  "#P..*...##....#",
  "#.#####.##.#.##",
  "#...G.....s..##",
  "#.###.###.#.s.#",
  "#...#...#.#..G#",
  "#.###.#.##.#.##",
  "#...#.....#..s#",
  "#.##.#####.#.##",
  "#....G.....F..#",
  "###############"]}
];
const GHOSTS=[{c:'#ff3b30'},{c:'#ffb8de'},{c:'#35e6ff'},{c:'#ffa245'}];

/* ================= STATE ================= */
let W=0,H=0,DPR=1,cs=24,ox=0,oy=0,topH=52;
let cols=0,rows=0,grid=[],dots=[];
const hole={x:0,y:0},start={x:0,y:0};
const ballR=0.40,ghostR=0.44,holeR=0.5,captureSpeed=3.4,MAXSPEED=13;
let ball={x:0,y:0,vx:0,vy:0,mouth:0,invuln:0,scale:1,spin:0};
let origin={x:0,y:0},ghosts=[];
let state='menu',paused=false,phase='aim';
let holeIndex=0,strokes=0,score=0,results=[],scored=false,lastBest=null;
let aimAngle=0,charging=false,power=0,chargeStart=0,drag=null,wakaFlip=false;
let sinkT=0,doneT=0,shake=0,T=0,lastT=performance.now();
let lastClack=0;
const keys=new Set();
let particles=[],rings=[],floats=[];
let stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()<.8?1:2,ph:Math.random()*6.3,sp:.4+Math.random()*1.2});

/* ================= HELPERS ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a===undefined?Math.random():(b===undefined?Math.random()*a:a+Math.random()*(b-a));
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const isWall=(x,y)=>x<0||y<0||x>=cols||y>=rows||grid[y][x]==='#';
function floorAt(x,y){const cx=clamp(Math.floor(x),0,cols-1),cy=clamp(Math.floor(y),0,rows-1);return grid[cy][cx];}

/* ================= LAYOUT / TILES ================= */
let tiles={};
function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(cols){
    const padX=Math.max(18,W*0.04),padB=64;
    cs=clamp(Math.min((W-padX*2)/cols,(H-topH-34-padB)/rows),10,64);
    ox=(W-cs*cols)/2; oy=topH+((H-topH)-cs*rows)/2-8;
  }
  makeTiles();
}
function makeTiles(){
  const s=Math.max(12,Math.ceil(cs)+2);
  const mk=draw=>{const c=document.createElement('canvas');c.width=c.height=s;draw(c.getContext('2d'),s);return c;};
  tiles.floorA=mk(g=>{g.fillStyle='#0d2116';g.fillRect(0,0,s,s);});
  tiles.floorB=mk(g=>{g.fillStyle='#0f2819';g.fillRect(0,0,s,s);});
  tiles.sand=mk((g)=>{
    g.fillStyle='#8d7b4c';g.fillRect(0,0,s,s);
    g.fillStyle='rgba(255,240,200,.14)';g.fillRect(0,0,s,Math.max(1,s*.06));
    g.fillStyle='#6e5f3a';
    for(let i=0;i<9;i++){g.beginPath();g.arc(rnd(s*.1,s*.9),rnd(s*.15,s*.9),rnd(s*.02,s*.05),0,7);g.fill();}
  });
  tiles.water=mk(g=>{
    g.fillStyle='#14406f';g.fillRect(0,0,s,s);
    const gr=g.createLinearGradient(0,0,0,s);gr.addColorStop(0,'rgba(90,170,255,.18)');gr.addColorStop(1,'rgba(0,0,30,.25)');
    g.fillStyle=gr;g.fillRect(0,0,s,s);
  });
  tiles.wall=mk(g=>{
    const inset=s*.1,r=s*.16;
    g.shadowColor='rgba(70,110,255,.85)';g.shadowBlur=s*.16;
    const gr=g.createLinearGradient(0,inset,0,s-inset);gr.addColorStop(0,'#4a63ff');gr.addColorStop(1,'#1c2ba8');
    g.fillStyle=gr;rr(g,inset,inset,s-2*inset,s-2*inset,r);g.fill();
    g.shadowBlur=0;
    const lw=Math.max(1,s*.045);
    g.strokeStyle='rgba(170,195,255,.5)';g.lineWidth=lw;
    rr(g,inset+lw,inset+lw,s-2*(inset+lw),s-2*(inset+lw),r);g.stroke();
  });
  tiles.glow=mk(g=>{
    const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    gr.addColorStop(0,'rgba(255,216,77,.85)');gr.addColorStop(.4,'rgba(255,216,77,.3)');gr.addColorStop(1,'rgba(255,216,77,0)');
    g.fillStyle=gr;g.fillRect(0,0,s,s);
  });
}
window.addEventListener('resize',layout);

/* ================= LOAD HOLE ================= */
function newGhost(x,y,i){return{x,y,vx:0,vy:0,spawn:{x,y},c:GHOSTS[i%4].c,ph:rnd(6.28),frozen:0,pop:0,look:rnd(6.28)};}
function loadHole(i){
  holeIndex=i;strokes=0;scored=false;
  const M=MAPS[i];rows=M.rows.length;cols=Math.max.apply(null,M.rows.map(r=>r.length));
  grid=[];dots=[];ghosts=[];particles=[];rings=[];floats=[];
  for(let y=0;y<rows;y++){
    grid[y]=[];dots[y]=[];
    for(let x=0;x<cols;x++){
      const ch=M.rows[y][x]||'#';let g='.',d=0;
      switch(ch){
        case '#':g='#';break;
        case 's':g='S';break;
        case '~':g='~';break;
        case '.':g='.';d=1;break;
        case ',':g='.';break;
        case '*':g='.';d=2;break;
        case 'P':g='.';start.x=x+.5;start.y=y+.5;break;
        case 'F':g='.';hole.x=x+.5;hole.y=y+.5;break;
        case 'G':g='.';ghosts.push(newGhost(x+.5,y+.5,ghosts.length));break;
      }
      grid[y][x]=g;dots[y][x]=d;
    }
  }
  ball.x=start.x;ball.y=start.y;ball.vx=0;ball.vy=0;ball.invuln=1.2;ball.scale=1;ball.spin=0;
  origin={x:ball.x,y:ball.y};
  aimAngle=Math.atan2(hole.y-start.y,hole.x-start.x);
  charging=false;power=0;drag=null;sinkT=0;doneT=0;shake=0;
  state='play';paused=false;phase='aim';
  hideOverlay();layout();updateHUD();
  toast('HOLE '+(i+1)+' · '+M.name.toUpperCase()+' — PAR '+M.par,'info',1700);
}

/* ================= PHYSICS ================= */
function collideWalls(o,r,rest){
  const cx=Math.floor(o.x),cy=Math.floor(o.y);let impact=0;
  for(let yy=cy-1;yy<=cy+1;yy++)for(let xx=cx-1;xx<=cx+1;xx++){
    if(!isWall(xx,yy))continue;
    const nx=clamp(o.x,xx,xx+1),ny=clamp(o.y,yy,yy+1);
    let dx=o.x-nx,dy=o.y-ny,d2=dx*dx+dy*dy;
    if(d2>r*r)continue;
    let d=Math.sqrt(d2);
    if(d<1e-6){
      const l=o.x-xx,rg=xx+1-o.x,t=o.y-yy,b=yy+1-o.y,m=Math.min(l,rg,t,b);
      if(m===l)o.x=xx-r;else if(m===rg)o.x=xx+1+r;else if(m===t)o.y=yy-r;else o.y=yy+1+r;
      continue;
    }
    const px=dx/d,py=dy/d;
    o.x=nx+px*r;o.y=ny+py*r;
    const vn=o.vx*px+o.vy*py;
    if(vn<0){impact=Math.max(impact,-vn);o.vx-=(1+rest)*vn*px;o.vy-=(1+rest)*vn*py;}
  }
  return impact;
}
function eatDot(cx,cy){
  const v=dots[cy][cx];if(!v)return;dots[cy][cx]=0;
  const px=cx+.5,py=cy+.5;
  if(v===2){
    score+=50;sfx.power();floatText('+50',px,py,'#ffd84d');
    rings.push({x:px,y:py,r:.2,max:2.2,c:'rgba(255,216,77,',t:0});
    for(const g of ghosts)if(g.pop<=0)g.frozen=5;
  }else{score+=10;wakaFlip=!wakaFlip;sfx.dot(wakaFlip);}
  const sp=Math.hypot(ball.vx,ball.vy)||.001,mult=v===2?1.5:1.06;
  const nsp=Math.min(sp*mult,MAXSPEED*1.35);
  ball.vx=ball.vx/sp*nsp;ball.vy=ball.vy/sp*nsp;
  spark(px,py,v===2?'#ffd84d':'#ffe9c9',v===2?10:3);
  updateHUD();
}
function respawnBall(){
  ball.x=origin.x;ball.y=origin.y;ball.vx=0;ball.vy=0;ball.invuln=1.2;ball.scale=1;
  phase='aim';aimAngle=Math.atan2(hole.y-ball.y,hole.x-ball.x);updateHUD();
}
function ghostCheck(){
  if(state!=='play'||ball.invuln>0)return;
  for(const g of ghosts){
    if(g.pop>0)continue;
    const d=Math.hypot(g.x-ball.x,g.y-ball.y);
    if(d<ballR+ghostR-0.06){
      if(g.frozen>0){
        g.pop=4;score+=200;sfx.pop();floatText('+200',g.x,g.y,'#7df9ff');
        spark(g.x,g.y,g.c,16);rings.push({x:g.x,y:g.y,r:.3,max:1.6,c:'rgba(125,249,255,',t:0});updateHUD();
      }else{
        strokes++;sfx.ghostHit();shake=.6;toast('GHOSTED! +1','bad',1300);
        spark(ball.x,ball.y,'#ff5d5d',14);respawnBall();return;
      }
    }
  }
}
function doSplash(){
  strokes++;sfx.splash();shake=.45;toast('SPLASH! +1','bad',1300);
  spark(ball.x,ball.y,'#4da3ff',18);respawnBall();
}
function updateBall(dt){
  const b=ball;let end=null;
  const cell=floorAt(b.x,b.y),k=cell==='S'?5:0.9;
  const f=Math.exp(-k*dt);b.vx*=f;b.vy*=f;
  b.vx-=Math.sign(b.vx)*Math.min(Math.abs(b.vx),0.4*dt);
  b.vy-=Math.sign(b.vy)*Math.min(Math.abs(b.vy),0.4*dt);
  let sp=Math.hypot(b.vx,b.vy);
  if(sp>MAXSPEED*1.4){const s=MAXSPEED*1.4/sp;b.vx*=s;b.vy*=s;sp=MAXSPEED*1.4;}
  const dx=hole.x-b.x,dy=hole.y-b.y,d=Math.hypot(dx,dy);
  if(d<1.35&&d>0.001){const pull=14*(1-d/1.35);b.vx+=dx/d*pull*dt;b.vy+=dy/d*pull*dt;}
  const steps=clamp(Math.ceil((sp*dt)/(ballR*.6)),1,8);
  for(let i=0;i<steps&&!end;i++){
    b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
    const imp=collideWalls(b,ballR,.72);
    if(imp>0.6)sfx.bounce(imp);
    if(floorAt(b.x,b.y)==='~'){end='water';break;}
    const hd=Math.hypot(hole.x-b.x,hole.y-b.y);
    const hsp=Math.hypot(b.vx,b.vy);
    if(hd<holeR&&hsp<captureSpeed){end='sink';break;}
    else if(hd<holeR*.9&&hsp>=captureSpeed&&T-lastClack>0.12){b.vx*=.94;b.vy*=.94;lastClack=T;sfx.rim();}
    const cx=Math.floor(b.x),cy=Math.floor(b.y);
    if(dots[cy]&&dots[cy][cx])eatDot(cx,cy);
  }
  if(end==='water'){doSplash();return;}
  if(end==='sink'){startSink();return;}
  b.mouth+=Math.hypot(b.vx,b.vy)*dt*3;
  ghostCheck();
  sp=Math.hypot(b.vx,b.vy);
  if(sp<0.2){
    aimAngle=Math.atan2(b.vy,b.vx);
    b.vx=0;b.vy=0;phase='aim';origin={x:b.x,y:b.y};
  }
}
function startSink(){
  state='sinking';sinkT=0;sfx.sink();
  rings.push({x:hole.x,y:hole.y,r:.3,max:1.8,c:'rgba(255,230,0,',t:0});
}
function stepSink(dt){
  sinkT+=dt;
  const k=1-Math.exp(-9*dt);
  ball.x+=(hole.x-ball.x)*k;ball.y+=(hole.y-ball.y)*k;
  ball.spin+=14*dt;ball.scale=Math.max(0,1-sinkT/.5);
  if(sinkT>=.55)finishHole();
}
function finishHole(){
  if(state!=='sinking')return;
  const par=MAPS[holeIndex].par,d=strokes-par;
  let word='PAR',cls='winfo';
  if(strokes===1){word='ACE!';cls='wace';}
  else if(d<=-2){word='EAGLE!';cls='wgood';}
  else if(d===-1){word='BIRDIE!';cls='wgood';}
  else if(d===0){word='PAR';cls='winfo';}
  else if(d===1){word='BOGEY';cls='wbad';}
  else{word='+'+d;cls='wbad';}
  const bonus=Math.max(0,-d)*300+(strokes===1?500:0)+50;
  score+=bonus;results.push({par,strokes,word,cls});scored=true;
  state='done';doneT=0;updateHUD();
  toast(word+' · '+strokes+(strokes>1?' STROKES':' STROKE')+(d<0?'  ('+d+')':d>0?'  (+'+d+')':''),'big '+(cls==='wgood'||cls==='wace'?'good':cls==='wbad'?'bad':'info'),2100);
  floatText('+'+bonus,hole.x,hole.y-1,'#6dff8a');
  if(d<0)confetti();
}

/* ================= GHOSTS ================= */
function stepGhost(g,dt,chase){
  if(g.pop>0){g.pop-=dt;if(g.pop<=0){g.x=g.spawn.x;g.y=g.spawn.y;g.frozen=1;}return;}
  if(g.frozen>0){g.frozen-=dt;return;}
  const tx=chase?ball.x:start.x,ty=chase?ball.y:start.y;
  let ang=Math.atan2(ty-g.y,tx-g.x)+Math.sin(T*1.4+g.ph)*.55;
  g.look=ang;
  const v=MAPS[holeIndex].gs;
  g.vx=Math.cos(ang)*v;g.vy=Math.sin(ang)*v;
  g.x+=g.vx*dt;g.y+=g.vy*dt;
  collideWalls(g,ghostR,0);
}

/* ================= SHOT ================= */
function fire(ang,p){
  if(state!=='play'||phase!=='aim')return;
  strokes++;updateHUD();
  const v=p*MAXSPEED;
  ball.vx=Math.cos(ang)*v;ball.vy=Math.sin(ang)*v;
  phase='roll';charging=false;power=0;
  sfx.shot(p);spark(ball.x,ball.y,'#ffe9c9',5);
}

/* ================= FX (screen space) ================= */
const w2sx=wx=>wx*cs+ox, w2sy=wy=>wy*cs+oy;
function spark(wx,wy,c,n){
  for(let i=0;i<n;i++){const a=rnd(6.28),s=rnd(30,140);
    particles.push({x:w2sx(wx),y:w2sy(wy),vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0,life:rnd(.3,.7),max:.7,c,sz:rnd(1.5,3.5)});}
}
function confetti(){
  const csx=w2sx(hole.x),csy=w2sy(hole.y);
  const cols=['#ffe600','#7df9ff','#ffb8de','#6dff8a','#ffa245'];
  for(let i=0;i<46;i++){const a=rnd(-Math.PI,. )||rnd(0,6.28),s=rnd(60,230);
    particles.push({x:csx,y:csy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,g:420,life:rnd(.7,1.4),max:1.4,c:cols[i%5],sz:rnd(2,4)});}
}
function floatText(txt,wx,wy,c){floats.push({x:w2sx(wx),y:w2sy(wy)-cs*.4,txt,c,t:0});}
function updateFx(dt){
  particles=particles.filter(p=>{p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const dr=Math.max(0,1-3*dt);p.vx*=dr;p.vy*=dr;return p.life>0;});
  if(particles.length>320)particles.splice(0,particles.length-320);
  rings=rings.filter(r=>{r.t+=dt;r.r+=(r.max-.2)*dt/0.5;return r.t<0.5;});
  floats=floats.filter(f=>{f.t+=dt;return f.t<1;});
}

/* ================= UPDATE LOOP ================= */
function update(dt){
  T+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*2.2);
  updateFx(dt);
  if(state==='menu'){ghosts.forEach(g=>stepGhost(g,dt,false));return;}
  if(paused||state==='final')return;
  ball.invuln=Math.max(0,ball.invuln-dt);
  if(state==='sinking'){stepSink(dt);ghosts.forEach(g=>stepGhost(g,dt,true));return;}
  if(state==='done'){
    doneT+=dt;ghosts.forEach(g=>stepGhost(g,dt,true));
    if(doneT>2){if(holeIndex+1<MAPS.length)loadHole(holeIndex+1);else showFinal();}
    return;
  }
  ghosts.forEach(g=>stepGhost(g,dt,true));
  if(phase==='aim'){
    const rot=2.8*dt;
    if(keys.has('ArrowLeft')||keys.has('a'))aimAngle-=rot;
    if(keys.has('ArrowRight')||keys.has('d'))aimAngle+=rot;
    if(charging){const p=((T-chargeStart)*0.75)%2;power=p<1?p:2-p;}
    ghostCheck();
    return;
  }
  updateBall(dt);
}

/* ================= DRAW ================= */
function draw(){
  ctx.fillStyle='#05080f';ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(38,64,150,.2)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#9fb4ff';
  for(const s of stars){ctx.globalAlpha=.12+.3*(.5+.5*Math.sin(T*s.sp+s.ph));ctx.fillRect(s.x*W,s.y*H,s.s,s.s);}
  ctx.globalAlpha=1;

  const shx=shake>0?rnd(-1,1)*7*shake:0,shy=shake>0?rnd(-1,1)*7*shake:0;
  ctx.save();ctx.translate(shx,shy);
  drawCourse();drawFlag();drawPellets();
  for(const gh of ghosts)drawGhost(gh);
  if(state!=='done'&&state!=='final')drawPac();
  drawAim();
  ctx.restore();

  drawFx();drawPowerBar();

  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,4,10,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function drawCourse(){
  const px=ox-14,py=oy-14,pw=cs*cols+28,ph=cs*rows+28;
  ctx.save();
  ctx.shadowColor='rgba(50,80,200,.35)';ctx.shadowBlur=26;
  ctx.fillStyle='#0a1322';rr(ctx,px,py,pw,ph,12);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(60,90,190,.5)';ctx.lineWidth=2;rr(ctx,px,py,pw,ph,12);ctx.stroke();
  ctx.restore();
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const t=grid[y][x],X=ox+x*cs,Y=oy+y*cs;
    if(t==='#'){ctx.drawImage(tiles.wall,X-1,Y-1,cs+2,cs+2);}
    else if(t==='S')ctx.drawImage(tiles.sand,X,Y,cs,cs);
    else if(t==='~')ctx.drawImage(tiles.water,X,Y,cs,cs);
    else ctx.drawImage(x%2?tiles.floorB:tiles.floorA,X,Y,cs,cs);
  }
  // water ripples
  ctx.strokeStyle='rgba(140,200,255,.35)';ctx.lineWidth=1.4;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(grid[y][x]!=='~')continue;
    const X=ox+x*cs,Y=oy+y*cs;
    for(let i=0;i<2;i++){
      const yy=Y+cs*(.32+i*.4);
      ctx.beginPath();
      for(let q=0;q<=cs;q+=4){const off=Math.sin((X+q)*.09+T*2.4+i*2)*2.2;q?ctx.lineTo(X+q,yy+off):ctx.moveTo(X+q,yy+off);}
      ctx.stroke();
    }
  }
  // hole
  const hx=w2sx(hole.x),hy=w2sy(hole.y);
  const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,holeR*cs);
  hg.addColorStop(0,'#01030a');hg.addColorStop(.75,'#04070c');hg.addColorStop(1,'#0b1626');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(hx,hy,holeR*cs,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy,holeR*cs,0,7);ctx.stroke();
}
function drawFlag(){
  const hx=w2sx(hole.x),hy=w2sy(hole.y);
  const ph=cs*1.5,pw=Math.max(2,cs*.07);
  ctx.strokeStyle='#cdd6f4';ctx.lineWidth=pw;
  ctx.beginPath();ctx.moveTo(hx,hy-cs*.12);ctx.lineTo(hx,hy-ph);ctx.stroke();
  ctx.fillStyle='#e8ecff';ctx.beginPath();ctx.arc(hx,hy-ph,pw*.9,0,7);ctx.fill();
  const fw=cs*.75,fh=cs*.4,wv=Math.sin(T*4)*cs*.08;
  ctx.fillStyle='#ff4136';ctx.strokeStyle='rgba(120,10,10,.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(hx+pw/2,hy-ph);
  ctx.quadraticCurveTo(hx+fw*.5,hy-ph+fh*.4+wv,hx+fw,hy-ph+fh*.5+wv);
  ctx.lineTo(hx+pw/2,hy-ph+fh);ctx.closePath();ctx.fill();ctx.stroke();
  if(cs>26){ctx.fillStyle='#fff';ctx.font='900 '+(cs*.3)+'px Arial Black,Impact,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(''+(holeIndex+1),hx+fw*.42,hy-ph+fh*.5+wv*.5);}
}
function drawPellets(){
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const v=dots[y][x];if(!v)continue;
    const X=w2sx(x+.5),Y=w2sy(y+.5);
    if(v===1){
      const r=cs*.11*(1+.14*Math.sin(T*4+x*1.3+y));
      ctx.fillStyle='#ffe3c9';ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
    }else{
      const s=cs*.95*(1+.2*Math.sin(T*5));
      ctx.drawImage(tiles.glow,X-s/2,Y-s/2,s,s);
      ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(X,Y,cs*.26,0,7);ctx.fill();
    }
  }
}
function drawGhost(g){
  if(g.pop>0)return;
  const frozen=g.frozen>0;
  let jx=0,jy=0;if(frozen){jx=rnd(-1,1);jy=rnd(-1,1);}
  const x=w2sx(g.x)+jx,y=w2sy(g.y)+jy,r=ghostR*cs;
  ctx.save();ctx.translate(x,y);
  if(!frozen){ctx.shadowColor=g.c;ctx.shadowBlur=r*.5;}
  ctx.fillStyle=frozen?'#2b3fe0':g.c;
  const by=r*.75,seg=r*.5;
  ctx.beginPath();ctx.arc(0,-r*.15,r,Math.PI,0);ctx.lineTo(r,by);
  for(let i=1;i<4;i++)ctx.lineTo(r-i*seg,by-(i%2?r*.22*(.6+.4*Math.sin(T*9+g.ph)):0));
  ctx.lineTo(-r,by);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  const ex=Math.cos(g.look)*r*.15,ey=Math.sin(g.look)*r*.15;
  for(const s of[-1,1]){
    ctx.fillStyle='#fff';ctx.beginPath();
    ctx.ellipse(s*r*.32+ex,-r*.25+ey,r*.2,r*.26,0,0,7);ctx.fill();
    ctx.fillStyle=frozen?'#8fb4ff':'#1b2a6b';ctx.beginPath();
    ctx.arc(s*r*.32+ex*1.8,-r*.25+ey*1.8,r*.1,0,7);ctx.fill();
  }
  ctx.restore();
}
function drawPac(){
  const b=ball,x=w2sx(b.x),y=w2sy(b.y),r=Math.max(.1,ballR*cs*b.scale);
  let ang;
  if(state==='sinking')ang=aimAngle;
  else if(phase==='aim'&&state==='play')ang=aimAngle;
  else{const s=Math.hypot(b.vx,b.vy);ang=s>0.15?Math.atan2(b.vy,b.vx):aimAngle;}
  const moving=Math.hypot(b.vx,b.vy)>0.15&&state==='play';
  let m=state==='sinking'?Math.PI*.8:moving?(0.3+0.4*Math.abs(Math.sin(b.mouth)))*Math.PI:0.16*Math.PI*(1+.3*Math.sin(T*3));
  ctx.save();ctx.translate(x,y);
  if(state==='sinking')ctx.rotate(b.spin);
  ctx.globalAlpha=(b.invuln>0&&Math.floor(T*14)%2===0)?.35:1;
  ctx.shadowColor='rgba(255,230,0,.4)';ctx.shadowBlur=r*.6;
  ctx.fillStyle='#ffe600';
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,m,Math.PI*2-m,false);ctx.closePath();
  ctx.rotate(ang);
  ctx.fill();
  ctx.restore();
  if(state==='sinking'&&b.scale<.6){
    ctx.fillStyle='#04070c';ctx.beginPath();ctx.arc(x,y,holeR*cs*.9,0,7);ctx.fill();
  }
}
function drawAim(){
  if(state!=='play'||phase!=='aim'||paused)return;
  const bx=w2sx(ball.x),by=w2sy(ball.y);
  // spot ring
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.5;
  ctx.setLineDash([5,6]);ctx.lineDashOffset=-T*20;
  ctx.beginPath();ctx.arc(bx,by,ballR*cs+7,0,7);ctx.stroke();
  ctx.restore();
  let ang=aimAngle,pw=charging?power:0,dragging=false;
  if(drag){
    const dx=drag.sx-drag.cx,dy=drag.sy-drag.cy,len=Math.hypot(dx,dy);
    if(len>0.15){ang=Math.atan2(dy,dx);pw=clamp(len/4.5,.06,1);dragging=true;}
  }
  if(pw<=0)return;
  // slingshot band
  if(dragging){
    ctx.save();ctx.strokeStyle='rgba(200,210,255,.35)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(w2sx(drag.cx),w2sy(drag.cy));ctx.stroke();ctx.restore();
  }
  const L=(0.9+pw*2.6)*cs,col='hsl('+(120-120*pw)+',95%,60%)';
  ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=3;ctx.globalAlpha=.9;
  const ex=bx+Math.cos(ang)*(ballR*cs+L),ey=by+Math.sin(ang)*(ballR*cs+L);
  ctx.beginPath();ctx.moveTo(bx+Math.cos(ang)*(ballR*cs+4),by+Math.sin(ang)*(ballR*cs+4));ctx.lineTo(ex,ey);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ex+Math.cos(ang)*10,ey+Math.sin(ang)*10);
  ctx.lineTo(ex+Math.cos(ang+2.5)*9,ey+Math.sin(ang+2.5)*9);
  ctx.lineTo(ex+Math.cos(ang-2.5)*9,ey+Math.sin(ang-2.5)*9);ctx.closePath();ctx.fill();
  if(charging||dragging){
    ctx.font='700 12px Trebuchet MS,sans-serif';ctx.textAlign='center';
    ctx.fillText(Math.round(pw*100)+'%',ex+Math.cos(ang)*24,ey+Math.sin(ang)*24+4);
  }
  ctx.restore();
}
function drawPowerBar(){
  if(!(charging&&state==='play'&&phase==='aim'&&!paused))return;
  const bw=Math.min(430,W*.6),bh=15,x=W/2-bw/2,y=H-58;
  ctx.fillStyle='#101c3f';rr(ctx,x,y,bw,bh,7);ctx.fill();
  ctx.strokeStyle='#2c3f7e';ctx.lineWidth=1.5;rr(ctx,x,y,bw,bh,7);ctx.stroke();
  const gr=ctx.createLinearGradient(x,0,x+bw,0);
  gr.addColorStop(0,'#6dff8a');gr.addColorStop(.6,'#ffe600');gr.addColorStop(1,'#ff5d5d');
  ctx.fillStyle=gr;rr(ctx,x+2,y+2,Math.max(4,(bw-4)*power),bh-4,5);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(x+(bw*power)-1,y-3,2,bh+6);
  ctx.font='700 12px Trebuchet MS,sans-serif';ctx.textAlign='center';ctx.fillStyle='#9fb4ff';
  ctx.fillText('P O W E R',W/2,y-8);
}
function drawFx(){
  for(const r of rings){
    const a=1-r.t/.5;
    ctx.strokeStyle=r.c+(a*.7)+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(w2sx(r.x),w2sy(r.y),r.r*cs,0,7);ctx.stroke();
  }
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;
    ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }
  ctx.globalAlpha=1;
  for(const f of floats){
    const a=1-f.t;
    ctx.globalAlpha=a;
    ctx.font='900 '+Math.max(14,cs*.55)+'px Arial Black,Impact,sans-serif';ctx.textAlign='center';
    const y=f.y-f.t*42;
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.txt,f.x,y);
    ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,y);
  }
  ctx.globalAlpha=1;
}

/* ================= HUD / TOAST ================= */
function fmt(d){return d>0?'+'+d:d<0?''+d:'E';}
function totalDiff(){
  let tp=0,ts=0;
  for(const r of results){tp+=r.par;ts+=r.strokes;}
  if(!scored&&state!=='menu'&&state!=='final'){tp+=MAPS[holeIndex].par;ts+=strokes;}
  return ts-tp;
}
function updateHUD(){
  hudHole.innerHTML='HOLE '+(holeIndex+1)+'/'+MAPS.length+'<b>'+MAPS[holeIndex].name+'</b>';
  hudName.textContent=MAPS[holeIndex].name;
  hudPar.textContent=MAPS[holeIndex].par;
  hudStrokes.textContent=strokes;
  const d=totalDiff();hudToPar.textContent=fmt(d);
  hudScore.textContent=String(score).padStart(5,'0');
}
let toastTimer=null;
function toast(msg,cls,dur){
  toastEl.innerHTML=msg;toastEl.className='show '+(cls||'info');
  clearTimeout(toastTimer);
  if(dur)toastTimer=setTimeout(()=>{toastEl.className='';},dur);
}

/* ================= OVERLAYS ================= */
function showOverlay(html){overlay.innerHTML=html;overlay.classList.add('show');}
function hideOverlay(){overlay.classList.remove('show');}
function bestDiff(){let b=null;try{const v=localStorage.getItem('pacgolf_best');if(v!==null)b=+v;}catch(e){}return b;}
function showStart(){
  state='menu';paused=false;loadHole(0);state='menu';
  const b=bestDiff();
  showOverlay(
   '<div class="card">'+
   '<div class="eyebrow">A putting-green odyssey</div>'+
   '<h1 class="title"><span class="pac"></span>PAC<span>·GOLF</span></h1>'+
   '<p class="tag">Slingshot the chomper across mowed mazes. Dots feed your roll, ghosts cost you strokes — sink it under par.</p>'+
   '<div class="ctrls">'+
   '<div><kbd>DRAG</kbd> pull back &amp; release to shoot</div>'+
   '<div><kbd>←</kbd><kbd>→</kbd> aim &nbsp;·&nbsp; <kbd>SPACE</kbd> hold to charge, release to fire</div>'+
   '<div><kbd>ESC</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> sound</div></div>'+
   '<div class="legend">'+
   '<span><i class="ld"></i>dot · roll boost</span>'+
   '<span><i class="lp"></i>power dot · freeze ghosts</span>'+
   '<span><i class="lg"></i>ghost · +1 stroke</span>'+
   '<span><i class="lw">~</i>water · +1</span>'+
   '<span><i class="ls"></i>sand · slows you</span></div>'+
   '<div class="btnrow"><button class="btn" data-act="start">TEE OFF ▸</button></div>'+
   (b!==null?'<div class="hint">BEST ROUND: '+fmt(b)+' TO PAR</div>':'<div class="hint">5 holes · 1 shot = 1 stroke · power dots turn ghosts blue — pop them for +200</div>')+
   '</div>');
}
function showPause(){
  paused=true;
  showOverlay(
   '<div class="card">'+
   '<div class="eyebrow">Intermission</div>'+
   '<h1 class="title small">PAUSED</h1>'+
   '<p class="tag">Hole '+(holeIndex+1)+' · '+MAPS[holeIndex].name+' — strokes: '+strokes+'</p>'+
   '<div class="btnrow">'+
   '<button class="btn" data-act="resume">RESUME ▸</button>'+
   '<button class="btn ghost" data-act="restart">RESTART ROUND (R)</button>'+
   '<button class="btn ghost" id="soundLbl">SOUND: '+(muted?'OFF':'ON')+'</button></div>'+
   '</div>');
  const sl=document.getElementById('soundLbl');if(sl)sl.dataset.act='mute';
}
function togglePause(){if(state==='play'||state==='sinking'){if(paused){paused=false;hideOverlay();}else showPause();}}
function showFinal(){
  state='final';
  let tp=0,ts=0;
  for(const r of results){tp+=r.par;ts+=r.strokes;}
  const d=ts-tp;
  const rating=d<=-3?'GHOST-HUNTING ACE':d===-2?'EAGLE TOUR':d===-1?'BIRDIE BOSS':d===0?'SOLID PAR PRO':d===1?'BOGEY BANGER':'TOFEE TROPHY';
  let b=bestDiff();if(b===null||d<b){b=d;try{localStorage.setItem('pacgolf_best',d);}catch(e){}}
  const rowsHtml=results.map((r,i)=>
    '<tr><td class="num">'+(i+1)+'</td><td>'+MAPS[i].name+'</td><td class="num">'+r.par+'</td><td class="num">'+r.strokes+'</td><td class="word '+r.cls+'">'+r.word+'</td></tr>').join('');
  showOverlay(
   '<div class="card">'+
   '<div class="eyebrow">Final scorecard</div>'+
   '<h1 class="title small">PAC<span>·GOLF</span></h1>'+
   '<div class="rating">'+rating+'</div>'+
   '<table><thead><tr><th>Hole</th><th>Name</th><th>Par</th><th>You</th><th>Result</th></tr></thead>'+
   '<tbody>'+rowsHtml+'</tbody>'+
   '<tfoot><tr><td colspan="2">TOTAL</td><td class="num">'+tp+'</td><td class="num">'+ts+'</td><td class="word '+(d<0?'wgood':d>0?'wbad':'winfo')+'">'+fmt(d)+'</td></tr></tfoot></table>'+
   '<p class="tag" style="margin-bottom:16px">Dot &amp; bonus score: <b style="color:#ffe600">'+score.toLocaleString()+'</b> pts · Best round: '+fmt(b)+'</p>'+
   '<div class="btnrow"><button class="btn" data-act="restart">PLAY AGAIN ▸</button><button class="btn ghost" data-act="menu">MENU</button></div>'+
   '</div>');
}
function startGame(){sfx.ui();score=0;results=[];paused=false;hideOverlay();loadHole(0);}
overlay.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  audioInit();sfx.ui();
  const a=b.dataset.act;
  if(a==='start'||a==='restart')startGame();
  else if(a==='resume'){paused=false;hideOverlay();}
  else if(a==='menu')showStart();
  else if(a==='mute'){toggleMute();if(paused)showPause();}
});

/* ================= INPUT ================= */
function toggleMute(){
  muted=!muted;try{localStorage.setItem('pacgolf_mute',muted?'1':'0');}catch(e){}
  muteBtn.textContent=muted?'♪ OFF':'♪ ON';
}
muteBtn.addEventListener('click',()=>{audioInit();sfx.ui();toggleMute();});

window.addEventListener('keydown',e=>{
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  keys.add(k);
  if(e.repeat)return;
  if(k==='m'){toggleMute();return;}
  if(state==='menu'&&(e.key==='Enter'||e.key===' ')){startGame();return;}
  if(state==='final'&&e.key==='Enter'){startGame();return;}
  if(e.key==='Escape'){if(state==='play'||state==='sinking')togglePause();return;}
  if(k==='r'&&(paused||state==='final')){startGame();return;}
  if(state==='play'&&!paused&&phase==='aim'&&e.key===' '){charging=true;power=0;chargeStart=T;}
});
window.addEventListener('keyup',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  keys.delete(k);
  if(e.key===' '&&state==='play'&&!paused&&phase==='aim'&&charging){
    charging=false;
    if(power>0.04)fire(aimAngle,power);
    power=0;
  }
});
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/cs,y:(e.clientY-r.top-oy)/cs};}
cv.addEventListener('pointerdown',e=>{
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  if(state!=='play'||paused||phase!=='aim')return;
  const p=toWorld(e);drag={sx:p.x,sy:p.y,cx:p.x,cy:p.y};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',e=>{if(drag){const p=toWorld(e);drag.cx=p.x;drag.cy=p.y;}});
function endDrag(){
  if(!drag)return;
  const dx=drag.sx-drag.cx,dy=drag.sy-drag.cy,len=Math.hypot(dx,dy);
  charging=false;power=0;
  if(len>0.15)fire(Math.atan2(dy,dx),clamp(len/4.5,.06,1));
  drag=null;
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',()=>{drag=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='sinking')&&!paused)showPause();});

/* ================= BOOT ================= */
layout();
loadHole(0);
state='menu';
showStart();
requestAnimationFrame(function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.035,(t-lastT)/1000||.016);lastT=t;
  update(dt);draw();
});
</script>
</body>
</html>
