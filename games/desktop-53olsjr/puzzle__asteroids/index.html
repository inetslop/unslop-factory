<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPLIT CASCADE — Puzzle Asteroids</title>
<style>
:root{
  --display:Impact,'Haettenschweiler','Franklin Gothic Bold','Arial Black',sans-serif;
  --mono:'Consolas','Menlo','SF Mono','Cascadia Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04070f}
body{font-family:var(--mono);color:#eaf6ff;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;display:block}
body.playing{cursor:crosshair}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(2,4,10,.6) 100%)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 22px;pointer-events:none;opacity:0;transition:opacity .5s}
body.playing #hud{opacity:1}
.label{font-size:10px;letter-spacing:.28em;color:rgba(160,210,250,.55)}
#hudScore{font-family:var(--display);font-size:34px;letter-spacing:.05em;line-height:1.05;text-shadow:0 0 14px rgba(87,230,255,.5)}
#hudHi{font-size:11px;color:rgba(160,210,250,.6);letter-spacing:.12em;margin-top:2px}
.hudRight{text-align:right}
#waveChip{display:inline-block;font-family:var(--display);font-size:18px;letter-spacing:.14em;color:#0a1220;background:linear-gradient(90deg,#57e6ff,#7ef0c8);padding:3px 14px 2px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.ammoRow{margin-top:10px;display:flex;align-items:center;gap:8px;justify-content:flex-end}
#ammoText{font-size:15px;font-weight:700;color:#9fe8ff;min-width:34px;text-align:right}
#ammoBar{width:170px;height:9px;border:1px solid rgba(120,210,255,.4);background:rgba(8,18,36,.7);overflow:hidden}
#ammoFill{height:100%;width:100%;background:linear-gradient(90deg,#37e0ff,#7ef0c8);transition:width .15s}
#ammoFill.low{background:linear-gradient(90deg,#ffb457,#ffd76a)}
#ammoFill.zero{background:#ff5470;animation:pulse .5s infinite alternate}
#resupTag{font-size:11px;color:#ff8ba3;letter-spacing:.1em;min-width:96px;text-align:right}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
#livesBox{margin-top:8px;font-size:15px;letter-spacing:4px;color:#7de0ff;text-shadow:0 0 10px rgba(90,220,255,.6)}
#livesBox .off{color:rgba(120,160,200,.25);text-shadow:none}

/* ---------- combo ---------- */
#combo{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:10;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#combo.on{opacity:1}
#comboText{font-family:var(--display);font-size:36px;letter-spacing:.1em;color:#ffd76a;text-shadow:0 0 20px rgba(255,180,60,.65)}
#comboBar{width:150px;height:4px;margin:7px auto 0;background:rgba(255,255,255,.14)}
#comboFill{height:100%;background:#ffd76a;width:100%}

/* ---------- banner ---------- */
#banner{position:fixed;top:36%;left:0;right:0;z-index:15;text-align:center;pointer-events:none;opacity:0;transform:translateY(16px) scale(.96);transition:all .4s cubic-bezier(.2,.9,.3,1.25)}
#banner.show{opacity:1;transform:none}
#bannerTitle{font-family:var(--display);font-size:clamp(30px,6vw,56px);letter-spacing:.12em;color:#fff;text-shadow:-3px 0 rgba(87,230,255,.5),3px 0 rgba(255,110,190,.4),0 0 26px rgba(120,200,255,.5)}
#bannerSub{margin-top:6px;font-size:13px;letter-spacing:.3em;color:#9fd8ff}

/* ---------- hint ---------- */
#hint{position:fixed;bottom:10px;left:0;right:0;z-index:10;text-align:center;font-size:10px;letter-spacing:.22em;color:rgba(150,195,240,.45);pointer-events:none}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(4,9,20,.3),rgba(3,6,14,.8));transition:background .3s}
#overlay.hide{display:none}
#plate{position:relative;width:min(92vw,620px);max-height:94vh;overflow:auto;padding:30px 38px 26px;background:repeating-linear-gradient(0deg,rgba(140,200,255,.025) 0 1px,transparent 1px 4px),linear-gradient(160deg,rgba(12,22,44,.94),rgba(6,11,24,.92));border:1px solid rgba(120,200,255,.28);clip-path:polygon(0 16px,16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px));box-shadow:inset 0 0 70px rgba(30,90,170,.12)}
.tag{font-size:10px;letter-spacing:.5em;color:rgba(140,205,255,.6)}
h1.title{font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,70px);line-height:.95;letter-spacing:.04em;margin:10px 0 4px;color:#f2faff;text-shadow:-3px 0 rgba(87,230,255,.85),3px 0 rgba(255,110,190,.7),0 0 30px rgba(110,200,255,.4)}
.subtitle{font-size:12px;letter-spacing:.2em;color:#8fc8ef;margin-bottom:14px}
.ruleRow{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:12px;color:#bfe3ff;letter-spacing:.05em;flex-wrap:wrap}
.chip{flex:none;display:inline-grid;place-items:center;width:27px;height:27px;font-weight:700;font-size:13px;color:hsl(var(--h) 95% 74%);background:hsl(var(--h) 65% 13% / .85);border:1px solid hsl(var(--h) 85% 48% / .65);box-shadow:0 0 12px hsl(var(--h) 90% 55% / .3);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.mini{color:rgba(160,210,250,.7);font-size:11px}
.fuseWord{color:#ffd76a;font-weight:700;letter-spacing:.14em}
hr.sep{border:none;height:1px;margin:15px 0;background:linear-gradient(90deg,rgba(87,230,255,.5),transparent)}
.ctrlGrid{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:11px;color:#a8d4f5}
.ctrlGrid .k{text-align:right;white-space:nowrap}
kbd{font-family:var(--mono);font-size:10px;padding:2px 7px;border:1px solid rgba(130,200,255,.4);border-bottom-width:2px;background:rgba(16,34,64,.6);color:#cfeaff;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.prompt{margin-top:20px;text-align:center;font-family:var(--display);font-size:19px;letter-spacing:.3em;color:#eaf6ff;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hiTag{position:absolute;top:18px;right:24px;font-size:10px;letter-spacing:.24em;color:rgba(160,210,250,.6)}
.goTitle{font-family:var(--display);font-size:clamp(34px,7vw,58px);letter-spacing:.1em;text-align:center;color:#ff8ba3;text-shadow:0 0 26px rgba(255,90,120,.5)}
.goScore{font-family:var(--display);font-size:clamp(40px,8vw,64px);text-align:center;margin:10px 0 4px;text-shadow:0 0 20px rgba(87,230,255,.5)}
.goBest{text-align:center;font-size:12px;letter-spacing:.3em;color:#9fd8ff}
.newBest{color:#ffd76a!important;animation:blink 1s infinite}
.pauseTitle{font-family:var(--display);font-size:44px;letter-spacing:.2em;text-align:center;color:#eaf6ff;text-shadow:0 0 20px rgba(87,230,255,.5)}
.centerSmall{text-align:center;font-size:11px;letter-spacing:.2em;color:#8fc8ef;margin-top:14px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>

<div id="hud">
  <div class="hudLeft">
    <div class="label">SCORE</div>
    <div id="hudScore">0</div>
    <div id="hudHi">BEST 0</div>
  </div>
  <div class="hudRight">
    <span id="waveChip">WAVE 1</span>
    <div class="ammoRow">
      <span id="ammoText">0</span>
      <div id="ammoBar"><div id="ammoFill"></div></div>
      <span id="resupTag"></span>
    </div>
    <div id="livesBox"></div>
  </div>
</div>

<div id="combo"><div id="comboText"></div><div id="comboBar"><div id="comboFill"></div></div></div>
<div id="banner"><div id="bannerTitle"></div><div id="bannerSub"></div></div>
<div id="hint">EQUAL NUMBERS FUSE · EVEN VALUES SPLIT IN HALF · HOLD SHIFT TO TRACTOR <span id="muteTag"></span></div>
<div id="overlay"></div>

<script>
'use strict';
/* ================= helpers ================= */
const TAU=Math.PI*2;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irand=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[irand(a.length)];
const hs=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
const $=id=>document.getElementById(id);

/* ================= dom ================= */
const cv=$('game'),ctx=cv.getContext('2d');
const elScore=$('hudScore'),elHi=$('hudHi'),elWave=$('waveChip'),
elAmmoText=$('ammoText'),elAmmoFill=$('ammoFill'),elResup=$('resupTag'),elLives=$('livesBox'),
elCombo=$('combo'),elComboText=$('comboText'),elComboFill=$('comboFill'),
elBanner=$('banner'),elBTitle=$('bannerTitle'),elBSub=$('bannerSub'),
overlay=$('overlay'),muteTag=$('muteTag');

/* ================= game data ================= */
const HUES={10:318,8:192,6:96,5:26,4:52,3:347,2:160};
const SHIP_R=13,FIRE_CD=.26,BULLET_SPEED=640,CHAIN_WINDOW=3.5,RESUP_TIME=6;
let asteroids=[],bullets=[],particles=[],rings=[],popups=[];
const ship={x:0,y:0,vx:0,vy:0,invuln:0,respawn:0};
let state='menu',T=0,score=0,hi=0,lives=3,wave=1,ammo=0,budget=1,energy=100,shake=0;
let chain={count:0,timer:0},resup=0,wavePending=false,waveTimer=0,nextFire=0,attractT=2,goReadyAt=0;
const mouse={x:0,y:0,down:false};const keys={};
let aimAng=0,thrusting=false;
try{hi=parseInt(localStorage.getItem('splitCascadeHi'))||0;}catch(e){hi=0;}

/* ================= background / stars ================= */
let W=0,H=0,DPR=1;
const bg=document.createElement('canvas');
let starsFar=[],starsNear=[];
function blob(g,x,y,r,c){const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);}
function buildBackground(){
  bg.width=Math.max(2,W);bg.height=Math.max(2,H);
  const g=bg.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#040810');grad.addColorStop(.55,'#071021');grad.addColorStop(1,'#0a1528');
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  const m=Math.max(W,H);
  blob(g,W*.2,H*.32,m*.6,'rgba(40,160,190,0.10)');
  blob(g,W*.82,H*.75,m*.55,'rgba(255,150,60,0.075)');
  blob(g,W*.62,H*.12,m*.4,'rgba(150,90,255,0.06)');
  starsFar=[];starsNear=[];
  for(let i=0;i<120;i++)starsFar.push({x:rand(W),y:rand(H),p:rand(TAU)});
  for(let i=0;i<48;i++)starsNear.push({x:rand(W),y:rand(H),p:rand(TAU),s:Math.random()<.3?3:2});
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  buildBackground();
  for(const a of asteroids){a.x=((a.x%W)+W)%W;a.y=((a.y%H)+H)%H;}
  if(state==='playing'){ship.x=clamp(ship.x,20,W-20);ship.y=clamp(ship.y,20,H-20);}
}
window.addEventListener('resize',resize);
let meteor={on:false,x:0,y:0,vx:0,vy:0},nextMeteor=3;

/* ================= audio (WebAudio, post-gesture) ================= */
let AC=null,master=null,muted=false,noiseBuf=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function tone(f,f2,type,dur,vol,delay=0){
  if(!AC||muted)return;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f),t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);
}
function noise(dur,vol,freq,type='lowpass',delay=0){
  if(!AC||muted)return;
  const t0=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const flt=AC.createBiquadFilter();flt.type=type;flt.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(flt);flt.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+.05);
}
const sfx={
  laser(){tone(920,240,'square',.11,.10);},
  split(){noise(.22,.30,600);tone(150,55,'sine',.2,.28);},
  kill(){tone(330,70,'triangle',.22,.24);noise(.12,.16,1400,'bandpass');},
  fuse(ch){const b=360*Math.pow(1.13,Math.min(ch,9));[0,4,7].forEach((s,i)=>tone(b*Math.pow(2,s/12),0,'triangle',.15,.15,i*.055));tone(b*2,0,'sine',.3,.06,.1);},
  boom(){noise(.6,.5,320);tone(170,38,'sawtooth',.5,.26);},
  dry(){tone(190,140,'square',.05,.07);},
  resup(){tone(620,0,'sine',.12,.16);tone(930,0,'sine',.14,.16,.09);},
  clear(){[523,659,784,1046].forEach((f,i)=>tone(f,0,'triangle',.16,.14,i*.08));},
  start(){tone(220,440,'triangle',.22,.18);tone(440,880,'sine',.3,.1,.1);}
};

/* ================= entities ================= */
function makeAsteroid(x,y,v,vx,vy){
  const r=12+v*3,n=9+irand(3),verts=[];
  for(let k=0;k<n;k++){const a=k/n*TAU+rand(-.25,.25),rr=rand(.72,1.14);verts.push([Math.cos(a)*rr,Math.sin(a)*rr]);}
  const craters=[];for(let k=0;k<3;k++)craters.push([rand(-.45,.45),rand(-.45,.45),rand(.08,.2)]);
  asteroids.push({x,y,vx,vy,r,value:v,hue:HUES[v]!==undefined?HUES[v]:Math.floor(v*47)%360,
    verts,craters,rot:rand(TAU),vr:rand(-1,1)*(22/r),birth:T,dead:false,_beam:false});
}
function burst(x,y,hue,n,spd=200,size=3){
  for(let i=0;i<n;i++){const a=rand(TAU),s=rand(spd*.25,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),max:.7,size:rand(1.5,size),c:hs(hue,85,65),drag:2.2});}
  if(particles.length>450)particles.splice(0,particles.length-450);
}
function ring(x,y,r0,maxR,dur=.5,color='#7de0ff',wdt=3){rings.push({x,y,r:r0,vr:(maxR-r0)/dur,life:dur,max:dur,c:color,w:wdt});}
function popup(x,y,txt,color,size=14){popups.push({x,y,txt,c:color,size,life:.9,max:.9});}

/* ================= flow ================= */
function setState(s){state=s;document.body.classList.toggle('playing',s==='playing');}
function setLives(n){let h='';for(let i=0;i<3;i++)h+=`<span class="${i<n?'':'off'}">▲</span>`;elLives.innerHTML=h;}
function banner(t,s,dur=2.2){elBTitle.textContent=t;elBSub.textContent=s||'';elBanner.classList.add('show');clearTimeout(banner._t);banner._t=setTimeout(()=>elBanner.classList.remove('show'),dur*1000);}

function startGame(){
  score=0;lives=3;setLives(3);
  ship.x=W/2;ship.y=H/2;ship.vx=ship.vy=0;ship.invuln=1.8;ship.respawn=0;energy=100;
  bullets.length=0;particles.length=0;rings.length=0;popups.length=0;
  chain={count:0,timer:0};resup=0;wavePending=false;nextFire=T+.5;
  overlay.classList.add('hide');
  setState('playing');
  startWave(1);
  sfx.start();syncHud(true);
}
function startWave(n){
  wave=n;asteroids.length=0;bullets.length=0;resup=0;chain={count:0,timer:0};
  const pairs=Math.min(n+1,6);
  const pool=n===1?[8,8,6]:n===2?[8,10,6]:n===3?[8,10,6,4]:[10,8,6,4];
  const vals=[];for(let p=0;p<pairs;p++){const v=pick(pool);vals.push(v,v);}
  for(let i=vals.length-1;i>0;i--){const j=irand(i+1);[vals[i],vals[j]]=[vals[j],vals[i]];}
  const cx=W/2,cy=H/2,R=Math.max(130,Math.min(W,H)*.36);
  for(let i=0;i<vals.length;i++){
    const a=i/vals.length*TAU+rand(-.3,.3),rr=R*rand(.85,1.15);
    const x=clamp(cx+Math.cos(a)*rr,40,W-40),y=clamp(cy+Math.sin(a)*rr,40,H-40);
    const sp=Math.min(70,20+n*4+rand(0,16)),d=rand(TAU);
    makeAsteroid(x,y,vals[i],Math.cos(d)*sp,Math.sin(d)*sp);
  }
  budget=10+asteroids.length*7;ammo=budget;
  if(ship.respawn<=0)ship.invuln=Math.max(ship.invuln,1.4);
  banner('WAVE '+n,n===1?'SPLIT · HERD · FUSE':'DEBRIS INBOUND',2.2);
}
function spawnAttract(){
  asteroids.length=0;
  const cx=W/2,cy=H/2,R=Math.max(120,Math.min(W,H)*.36);
  const vals=[];for(let p=0;p<3;p++){const v=pick([8,10,6,4]);vals.push(v,v);}
  for(let i=0;i<6;i++){
    const a=i/6*TAU+rand(-.4,.4),rr=R*rand(.8,1.2);
    const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr,d=rand(TAU),sp=rand(18,36);
    makeAsteroid(x,y,vals[i],Math.cos(d)*sp,Math.sin(d)*sp);
  }
  attractT=2.5;
}
function gameOver(){
  setState('gameover');goReadyAt=T+.8;bullets.length=0;
  explodeShip();shake=14;sfx.boom();
  let nb=false;if(score>hi){hi=score;nb=true;try{localStorage.setItem('splitCascadeHi',String(hi));}catch(e){}}
  showOverlay(overHTML(nb));syncHud(true);
}
function pauseGame(on){
  if(on&&state==='playing'){setState('paused');showOverlay(pauseHTML());}
  else if(!on&&state==='paused'){setState('playing');overlay.classList.add('hide');}
}

/* ================= combat / fusion ================= */
const inPlay=()=>state==='playing';
function fuse(A,B){
  A.dead=B.dead=true;
  const mx=(A.x+B.x)/2,my=(A.y+B.y)/2,v=A.value,h=A.hue;
  burst(mx,my,h,26,300,4);burst(mx,my,55,8,180,2.5);
  ring(mx,my,A.r*.4,A.r*2.9,.55,hs(h,90,65),3);
  ring(mx,my,A.r*.2,A.r*1.6,.35,'#ffffff',2);
  if(inPlay()){
    chain.count++;chain.timer=CHAIN_WINDOW;
    const pts=40*v*chain.count;score+=pts;
    popup(mx,my,'+'+pts,hs(h,90,72),15+Math.min(chain.count,6)*2);
    ammo=Math.min(budget,ammo+2);
    shake=Math.min(11,shake+1.4+chain.count*.35);
    sfx.fuse(chain.count);
    elComboText.textContent='×'+chain.count+' CHAIN';
    if(elComboText.animate)elComboText.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'});
  }else sfx.fuse(1);
}
function hitAsteroid(a,b){
  b.dead=true;
  const h=a.hue;
  if(a.value%2===0&&a.value>=4){
    a.dead=true;
    const half=a.value/2,ba=Math.atan2(b.vy,b.vx),spd=70+a.value*9;
    for(const s of[-1,1]){
      const dir=ba+s*.85+rand(-.2,.2);
      makeAsteroid(a.x+Math.cos(dir)*a.r*.7,a.y+Math.sin(dir)*a.r*.7,half,
        a.vx*.55+Math.cos(dir)*spd,a.vy*.55+Math.sin(dir)*spd);
    }
    burst(a.x,a.y,h,10,160,2.5);ring(a.x,a.y,a.r*.5,a.r*1.7,.4,hs(h,85,60),2);
    if(inPlay())score+=15;
    sfx.split();shake=Math.min(9,shake+1.1);
  }else{
    a.dead=true;
    const pts=25*a.value;
    burst(a.x,a.y,h,16,240,3.5);ring(a.x,a.y,a.r*.4,a.r*2,.45,hs(h,90,65),2.5);
    if(inPlay()){score+=pts;popup(a.x,a.y,'+'+pts,hs(h,85,75),13);}
    sfx.kill();shake=Math.min(8,shake+.8);
  }
}
function explodeShip(){
  burst(ship.x,ship.y,195,26,340,4);burst(ship.x,ship.y,28,18,260,3.5);burst(ship.x,ship.y,55,10,200,2.5);
  ring(ship.x,ship.y,10,120,.6,'#9fe8ff',3);ring(ship.x,ship.y,4,60,.4,'#ffffff',2);
}
function shipHit(){
  lives--;setLives(lives);sfx.boom();explodeShip();shake=13;
  if(lives<=0)gameOver();else ship.respawn=1.1;
}
function respawnShip(){
  ship.x=W/2;ship.y=H/2;ship.vx=ship.vy=0;ship.invuln=2.4;
  ring(ship.x,ship.y,10,300,.7,'rgba(140,230,255,.9)',3);
  for(const a of asteroids){const dx=a.x-ship.x,dy=a.y-ship.y,d=Math.hypot(dx,dy)||1;
    if(d<300){const f=240*(1-d/300);a.vx+=dx/d*f;a.vy+=dy/d*f;}}
}
function fire(){
  if(state!=='playing'||ship.respawn>0||T<nextFire)return;
  if(ammo<=0){sfx.dry();return;}
  nextFire=T+FIRE_CD;ammo--;
  const c=Math.cos(aimAng),s=Math.sin(aimAng);
  bullets.push({x:ship.x+c*16,y:ship.y+s*16,vx:c*BULLET_SPEED,vy:s*BULLET_SPEED,life:.9,dead:false});
  ship.vx-=c*26;ship.vy-=s*26;
  burst(ship.x+c*18,ship.y+s*18,195,3,90,1.8);
  sfx.laser();
}

/* ================= input (window) ================= */
window.addEventListener('keydown',e=>{
  initAudio();
  const c=e.code;
  if(c==='Space'||c.indexOf('Arrow')===0)e.preventDefault();
  keys[c]=true;
  if(e.repeat)return;
  if(c==='KeyM'){muted=!muted;muteTag.textContent=muted?'· MUTED':'';return;}
  if(c==='KeyP'){if(state==='playing')pauseGame(true);else if(state==='paused')pauseGame(false);return;}
  if(c==='KeyR'){startGame();return;}
  if(c==='Enter'||c==='Space'){
    if(state==='menu')startGame();
    else if(state==='gameover'&&T>=goReadyAt)startGame();
    else if(state==='paused')pauseGame(false);
  }
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;if(state==='playing')pauseGame(true);});
window.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('pointerdown',e=>{
  initAudio();mouse.x=e.clientX;mouse.y=e.clientY;mouse.down=true;
  if(state==='menu')startGame();
  else if(state==='gameover'&&T>=goReadyAt)startGame();
  else if(state==='paused')pauseGame(false);
});
window.addEventListener('pointerup',()=>{mouse.down=false;});

/* ================= update ================= */
const tractorR=()=>Math.min(210,Math.min(W,H)*.42);
function gameplayUpdate(dt){
  if(chain.timer>0){chain.timer-=dt;if(chain.timer<=0)chain.count=0;}
  if(wavePending){waveTimer-=dt;if(waveTimer<=0){wavePending=false;startWave(wave+1);}}
  if(ammo<=0&&!wavePending&&asteroids.length>0){
    if(resup<=0)resup=RESUP_TIME;
    else{resup-=dt;if(resup<=0){ammo=budget;sfx.resup();popup(ship.x,ship.y-34,'AMMO RESTOCKED','#7ef0c8',13);}}
  }else resup=0;

  if(ship.respawn>0){ship.respawn-=dt;if(ship.respawn<=0)respawnShip();}
  else{
    ship.invuln=Math.max(0,ship.invuln-dt);
    let ax=0,ay=0;
    if(keys.KeyW||keys.ArrowUp)ay--;if(keys.KeyS||keys.ArrowDown)ay++;
    if(keys.KeyA||keys.ArrowLeft)ax--;if(keys.KeyD||keys.ArrowRight)ax++;
    const il=Math.hypot(ax,ay);thrusting=il>0;
    if(il){
      ax/=il;ay/=il;ship.vx+=ax*470*dt;ship.vy+=ay*470*dt;
      for(let i=0;i<2;i++)particles.push({x:ship.x-ax*12+rand(-3,3),y:ship.y-ay*12+rand(-3,3),
        vx:-ax*rand(60,140)+rand(-20,20),vy:-ay*rand(60,140)+rand(-20,20),life:rand(.15,.35),max:.35,size:rand(1,2.4),c:hs(rand(18,40),95,60),drag:1.5});
    }
    const damp=Math.exp(-dt*(il?1.1:1.7));ship.vx*=damp;ship.vy*=damp;
    const sp=Math.hypot(ship.vx,ship.vy);if(sp>340){ship.vx*=340/sp;ship.vy*=340/sp;}
    ship.x+=ship.vx*dt;ship.y+=ship.vy*dt;
    if(ship.x<-SHIP_R)ship.x+=W+2*SHIP_R;else if(ship.x>W+SHIP_R)ship.x-=W+2*SHIP_R;
    if(ship.y<-SHIP_R)ship.y+=H+2*SHIP_R;else if(ship.y>H+SHIP_R)ship.y-=H+2*SHIP_R;
    aimAng=Math.atan2(mouse.y-ship.y,mouse.x-ship.x);
  }

  const beamOn=(keys.ShiftLeft||keys.ShiftRight)&&energy>0&&ship.respawn<=0;
  for(const a of asteroids)a._beam=false;
  if(beamOn){
    energy=Math.max(0,energy-30*dt);
    const TR=tractorR();
    for(const a of asteroids){const dx=ship.x-a.x,dy=ship.y-a.y,d=Math.hypot(dx,dy);
      if(d<TR&&d>1){a._beam=true;let f=430*(1-d/TR)*Math.min(1,26/a.r);if(d<70)f*=d/70;
        a.vx+=dx/d*f*dt;a.vy+=dy/d*f*dt;}}
  }else energy=Math.min(100,energy+13*dt);

  if(mouse.down||keys.Space)fire();

  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){b.dead=true;continue;}
    for(const a of asteroids){if(a.dead)continue;const dx=a.x-b.x,dy=a.y-b.y;
      if(dx*dx+dy*dy<(a.r+4)*(a.r+4)){hitAsteroid(a,b);break;}}
  }
  bullets=bullets.filter(b=>!b.dead);

  if(!wavePending&&asteroids.length===0){
    wavePending=true;waveTimer=2.3;
    const bonus=ammo*40+wave*250;score+=bonus;
    banner('WAVE '+wave+' CLEAR','BONUS +'+bonus,2.3);sfx.clear();
  }
}
function moveAsteroids(dt){
  for(const a of asteroids){if(a.dead)continue;a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.vr*dt;
    if(a.x<-a.r)a.x+=W+2*a.r;else if(a.x>W+a.r)a.x-=W+2*a.r;
    if(a.y<-a.r)a.y+=H+2*a.r;else if(a.y>H+a.r)a.y-=H+2*a.r;}
  asteroids=asteroids.filter(a=>!a.dead);
}
function bounce(A,B){
  const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||.001,nx=dx/d,ny=dy/d,min=A.r+B.r;
  const mA=A.r*A.r,mB=B.r*B.r,tot=mA+mB,ov=min-d;
  A.x-=nx*ov*(mB/tot);A.y-=ny*ov*(mB/tot);B.x+=nx*ov*(mA/tot);B.y+=ny*ov*(mA/tot);
  const rel=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;
  if(rel<0){const imp=-1.85*rel/(1/mA+1/mB);
    A.vx-=imp*nx/mA;A.vy-=imp*ny/mA;B.vx+=imp*nx/mB;B.vy+=imp*ny/mB;}
}
function collideAsteroids(){
  for(let i=0;i<asteroids.length;i++){const A=asteroids[i];if(A.dead)continue;
    for(let j=i+1;j<asteroids.length;j++){const B=asteroids[j];if(B.dead)continue;
      const dx=B.x-A.x,dy=B.y-A.y,min=A.r+B.r,d2=dx*dx+dy*dy;
      if(d2<min*min&&d2>1e-4){
        if(A.value===B.value&&T-A.birth>.55&&T-B.birth>.55){fuse(A,B);break;}
        else bounce(A,B);
      }}}
  asteroids=asteroids.filter(a=>!a.dead);
}
function shipCollide(){
  if(ship.respawn>0)return;
  for(const a of asteroids){if(a.dead)continue;
    const dx=a.x-ship.x,dy=a.y-ship.y,d=Math.hypot(dx,dy),min=a.r+SHIP_R-2;
    if(d<min&&d>1e-3){
      if(ship.invuln>0){const nx=dx/d,ny=dy/d;a.vx+=nx*170;a.vy+=ny*170;
        a.x=ship.x+nx*(a.r+SHIP_R);a.y=ship.y+ny*(a.r+SHIP_R);}
      else{shipHit();return;}
    }}
}
function update(dt){
  T+=dt;
  shake=Math.max(0,shake-dt*(shake*2.5+3));
  for(const st of starsFar){st.x-=7*dt;st.y+=3*dt;if(st.x<0)st.x+=W;if(st.y>H)st.y-=H;}
  for(const st of starsNear){st.x-=16*dt;st.y+=8*dt;if(st.x<0)st.x+=W;if(st.y>H)st.y-=H;}
  if(!meteor.on&&T>nextMeteor){meteor.on=true;const dir=Math.random()<.5?-1:1;
    meteor.x=rand(W*.2,W*.8);meteor.y=-30;meteor.vx=dir*rand(300,520);meteor.vy=rand(420,640);}
  if(meteor.on){meteor.x+=meteor.vx*dt;meteor.y+=meteor.vy*dt;
    if(meteor.y>H+60||meteor.x<-80||meteor.x>W+80){meteor.on=false;nextMeteor=T+rand(5,11);}}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}
    const d=Math.exp(-p.drag*dt);p.vx*=d;p.vy*=d;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;if(r.life<=0){rings.splice(i,1);continue;}r.r+=r.vr*dt;}
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.life-=dt;p.y-=26*dt;if(p.life<=0)popups.splice(i,1);}

  if(state==='menu'){if(!asteroids.length){attractT-=dt;if(attractT<=0)spawnAttract();}}
  else if(state==='playing')gameplayUpdate(dt);

  moveAsteroids(dt);collideAsteroids();
  if(state==='playing')shipCollide();
  syncHud();
}

/* ================= HUD / overlay ================= */
let lastScore=-1,lastWave=-1;
function syncHud(force){
  if(state==='menu'&&!force)return;
  if(score!==lastScore||force){elScore.textContent=score.toLocaleString('en-US');lastScore=score;}
  elHi.textContent='BEST '+hi.toLocaleString('en-US');
  if(wave!==lastWave||force){elWave.textContent='WAVE '+wave;lastWave=wave;}
  const pct=budget?clamp(ammo/budget,0,1)*100:0;
  elAmmoFill.style.width=pct+'%';
  elAmmoFill.className=ammo<=0?'zero':pct<25?'low':'';
  elAmmoText.textContent=ammo;
  elResup.textContent=(ammo<=0&&resup>0&&!wavePending)?'RESTOCK '+Math.ceil(resup)+'s':'';
  if(state==='playing'&&chain.count>=2&&chain.timer>0){
    elCombo.classList.add('on');
    const txt='×'+chain.count+' CHAIN';
    if(elComboText.textContent!==txt)elComboText.textContent=txt;
    elComboFill.style.width=(clamp(chain.timer/CHAIN_WINDOW,0,1)*100)+'%';
  }else elCombo.classList.remove('on');
}
function showOverlay(html){overlay.innerHTML=html;overlay.classList.remove('hide');}
const chip=v=>{const h=HUES[v]!==undefined?HUES[v]:190;return `<span class="chip" style="--h:${h}">${v}</span>`;};
function menuHTML(){return `
  <div class="hiTag">BEST ${hi.toLocaleString('en-US')}</div>
  <div class="tag">PUZZLE · ASTEROIDS</div>
  <h1 class="title">SPLIT CASCADE</h1>
  <div class="subtitle">SHOOT THE ROCKS. READ THE NUMBERS. CHAIN THE FUSES.</div>
  <hr class="sep">
  <div class="ruleRow">${chip(8)}<span class="mini">→</span>${chip(4)}<span class="mini">+</span>${chip(4)}<span>EVEN VALUES SPLIT IN HALF WHEN SHOT</span></div>
  <div class="ruleRow">${chip(4)}<span class="mini">+</span>${chip(4)}<span class="mini">→</span><span class="fuseWord">FUSE ×CHAIN</span><span>EQUAL VALUES TOUCHING FUSE — QUICK CHAINS MULTIPLY SCORE, +2 SHOTS EACH</span></div>
  <div class="ruleRow"><kbd>SHIFT</kbd><span>HOLD TO TRACTOR-HERD ROCKS INTO CONTACT. WATCH YOUR HULL.</span></div>
  <hr class="sep">
  <div class="ctrlGrid">
    <div class="k"><kbd>W A S D</kbd> / <kbd>↑←↓→</kbd></div><div>THRUST</div>
    <div class="k"><kbd>MOUSE</kbd></div><div>AIM TURRET</div>
    <div class="k"><kbd>CLICK</kbd> / <kbd>SPACE</kbd></div><div>FIRE (HOLD)</div>
    <div class="k"><kbd>P</kbd></div><div>PAUSE</div>
    <div class="k"><kbd>R</kbd></div><div>RESTART RUN</div>
    <div class="k"><kbd>M</kbd></div><div>SOUND ON / OFF</div>
  </div>
  <div class="prompt">CLICK OR PRESS ENTER TO LAUNCH</div>`;
}
function pauseHTML(){return `<div class="pauseTitle">PAUSED</div>
  <div class="centerSmall">P — RESUME &nbsp;·&nbsp; R — RESTART &nbsp;·&nbsp; M — ${muted?'SOUND ON':'MUTE'}</div>`;}
function overHTML(nb){return `
  <div class="goTitle">SHIP LOST</div>
  <div class="centerSmall">FINAL SCORE</div>
  <div class="goScore">${score.toLocaleString('en-US')}</div>
  <div class="goBest ${nb?'newBest':''}">${nb?'★ NEW BEST ★':'BEST '+hi.toLocaleString('en-US')} · WAVE ${wave}</div>
  <div class="prompt">CLICK OR PRESS ENTER TO RELAUNCH</div>`;}

/* ================= draw ================= */
function drawAsteroid(a){
  const h=a.hue,born=T-a.birth;
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);
  ctx.beginPath();
  for(let i=0;i<a.verts.length;i++){const v=a.verts[i];i?ctx.lineTo(v[0]*a.r,v[1]*a.r):ctx.moveTo(v[0]*a.r,v[1]*a.r);}
  ctx.closePath();
  ctx.fillStyle=hs(h,42,13);ctx.fill();
  for(const c of a.craters){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.arc(c[0]*a.r,c[1]*a.r,a.r*c[2],0,TAU);ctx.fill();}
  ctx.lineWidth=5;ctx.strokeStyle=hs(h,85,55,.22);ctx.stroke();
  ctx.lineWidth=1.6;ctx.strokeStyle=hs(h,90,62,.95);ctx.stroke();
  if(born<.45){ctx.lineWidth=2;ctx.strokeStyle=`rgba(255,255,255,${(1-born/.45)*.8})`;ctx.stroke();}
  ctx.restore();
  ctx.beginPath();ctx.arc(a.x,a.y,a.r*.56,0,TAU);ctx.fillStyle='rgba(3,7,15,.5)';ctx.fill();
  ctx.font=`700 ${Math.round(a.r*.72)}px Consolas,Menlo,monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=hs(h,85,84);
  ctx.fillText(a.value,a.x,a.y+1);
}
function drawShip(){
  if(ship.respawn>0)return;
  const e=energy/100;
  ctx.beginPath();ctx.arc(ship.x,ship.y,SHIP_R+11,-Math.PI/2,-Math.PI/2+e*TAU);
  ctx.strokeStyle=e>.3?'rgba(90,220,255,.4)':'rgba(255,180,87,.55)';ctx.lineWidth=3;ctx.stroke();
  if(thrusting){
    const ta=Math.atan2(ship.vy,ship.vx),fl=rand(10,22);
    ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ta+Math.PI);
    const g=ctx.createLinearGradient(6,0,8+fl,0);
    g.addColorStop(0,'rgba(255,220,150,.9)');g.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(6,-4);ctx.lineTo(8+fl,0);ctx.lineTo(6,4);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(aimAng);
  ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-11,-10);ctx.lineTo(-5,0);ctx.lineTo(-11,10);ctx.closePath();
  ctx.fillStyle='#dfeaff';ctx.fill();
  ctx.lineWidth=1.6;ctx.strokeStyle='#57e6ff';ctx.stroke();
  ctx.beginPath();ctx.arc(4,0,2.6,0,TAU);ctx.fillStyle='#57e6ff';ctx.fill();
  ctx.restore();
  if(ship.invuln>0){
    const k=.5+.3*Math.sin(T*12);
    ctx.beginPath();ctx.arc(ship.x,ship.y,SHIP_R+8,0,TAU);
    ctx.strokeStyle=`rgba(140,230,255,${k})`;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(140,230,255,.06)';ctx.fill();
  }
}
function draw(){
  ctx.drawImage(bg,0,0,W,H);
  for(const s of starsFar){ctx.globalAlpha=.35+.25*Math.sin(T*1.4+s.p);ctx.fillStyle='#9fc8e8';ctx.fillRect(s.x,s.y,1,1);}
  for(const s of starsNear){ctx.globalAlpha=.55+.35*Math.sin(T*2.1+s.p);ctx.fillStyle='#dceeff';ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;
  if(meteor.on){
    const g=ctx.createLinearGradient(meteor.x,meteor.y,meteor.x-meteor.vx*.14,meteor.y-meteor.vy*.14);
    g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(120,200,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(meteor.x,meteor.y);ctx.lineTo(meteor.x-meteor.vx*.14,meteor.y-meteor.vy*.14);ctx.stroke();
  }

  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);

  ctx.globalCompositeOperation='lighter';
  for(const r of rings){const k=r.life/r.max;ctx.globalAlpha=k*.9;ctx.strokeStyle=r.c;
    ctx.lineWidth=r.w*(.4+.6*k);ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();}
  for(const p of particles){const k=clamp(p.life/p.max,0,1);ctx.globalAlpha=k;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(.5+.5*k),0,TAU);ctx.fill();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  if(state==='playing'&&ship.respawn<=0&&(keys.ShiftLeft||keys.ShiftRight)&&energy>0){
    const TR=tractorR();
    const g2=ctx.createRadialGradient(ship.x,ship.y,10,ship.x,ship.y,TR);
    g2.addColorStop(0,'rgba(90,220,255,.02)');g2.addColorStop(.8,'rgba(90,220,255,.07)');g2.addColorStop(1,'rgba(90,220,255,0)');
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(ship.x,ship.y,TR,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(140,230,255,.3)';ctx.lineWidth=1.5;ctx.setLineDash([12,16]);ctx.lineDashOffset=-T*70;
    ctx.beginPath();ctx.arc(ship.x,ship.y,TR*.62,0,TAU);ctx.stroke();ctx.setLineDash([]);
    for(const a of asteroids)if(a._beam){
      ctx.strokeStyle=hs(a.hue,85,65,.3);ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(ship.x,ship.y);ctx.lineTo(a.x,a.y);ctx.stroke();
      ctx.fillStyle=hs(a.hue,85,60,.07);ctx.beginPath();ctx.arc(a.x,a.y,a.r+7,0,TAU);ctx.fill();
    }
  }

  for(const a of asteroids)drawAsteroid(a);

  ctx.globalCompositeOperation='lighter';
  for(const b of bullets){const tx=b.x-b.vx*.02,ty=b.y-b.vy*.02;
    ctx.strokeStyle='rgba(150,230,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.strokeStyle='rgba(150,230,255,.25)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(b.x,b.y);ctx.stroke();}
  ctx.globalCompositeOperation='source-over';

  if(state==='playing'||state==='paused')drawShip();

  for(const p of popups){const k=clamp(p.life/p.max,0,1),age=p.max-p.life,s=1+.6*Math.max(0,1-age/.15);
    ctx.globalAlpha=k;ctx.font=`700 ${Math.round(p.size*s)}px Consolas,Menlo,monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=p.c;ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ================= boot ================= */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;
  if(state!=='paused')update(dt);
  draw();
}
resize();
mouse.x=W*.72;mouse.y=H*.4;
setLives(3);
spawnAttract();
showOverlay(menuHTML());
setState('menu');
requestAnimationFrame(frame);
</script>
</body>
</html>
