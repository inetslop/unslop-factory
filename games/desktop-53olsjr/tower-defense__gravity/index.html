<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singularity Siege — Gravity Tower Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --disp:'Arial Black','Avenir Next Condensed',Impact,'Segoe UI',sans-serif;
  --body:'Segoe UI','Helvetica Neue',system-ui,sans-serif;
  --mono:Consolas,'SF Mono',Menlo,'Courier New',monospace;
  --cyan:#5fe8ff;--amber:#ffb14d;--violet:#c07bff;--red:#ff5468;--gold:#ffd23f;
  --panel:rgba(9,15,28,.88);--line:rgba(110,190,255,.22);
}
html,body{width:100%;height:100%;overflow:hidden;background:#04070f}
body{font-family:var(--body);color:#cfe3ff;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;display:block;cursor:crosshair}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
kbd{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#0d1830;color:#9fd8ff}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
body.menu #ui,body.menu #pauser{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-top:2px solid rgba(95,232,255,.5);padding:7px 12px;border-radius:6px}
.chip .lbl{font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:#6f8ab5}
.chip .val{font-size:16px;font-weight:700;color:#eaf6ff}
#chipFlux{border-top-color:rgba(255,210,63,.6)}#chipFlux .val{color:var(--gold)}
#chipFlux.deny{animation:deny .3s}
@keyframes deny{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bar{width:64px;height:5px;background:#132038;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5fe8ff,#7dff8a);transition:width .2s}
#chipLives.low{border-color:var(--red);animation:alarm .6s infinite alternate}
@keyframes alarm{to{box-shadow:0 0 14px rgba(255,84,104,.7)}}
#topbar{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ctrls{display:flex;gap:6px}
.ctrls button,#banner,.sell,.btn{pointer-events:auto}
.ctrls button{width:42px;height:34px;font-family:var(--disp);font-size:11px;letter-spacing:.05em;color:#cfe3ff;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.ctrls button:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 4px 14px rgba(95,232,255,.25)}
.ctrls button.off{color:#5b6c8f;text-decoration:line-through}
#banner{position:absolute;top:60px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
#banner.clickable{pointer-events:auto;cursor:pointer}
.b-big{display:block;font-family:var(--disp);font-size:30px;letter-spacing:.06em;color:#eaf6ff;text-shadow:0 0 18px rgba(95,232,255,.5),3px 3px 0 #10233f}
.b-big em{color:var(--amber);font-style:normal}
.b-sub{display:block;margin-top:4px;font-size:12px;letter-spacing:.1em;color:#8fa7cf}
.b-sub b{color:var(--gold);font-family:var(--mono)}
#banner .cd{color:var(--cyan);font-family:var(--mono);font-weight:700}
.dots{display:inline-flex;gap:5px;align-items:center;margin-left:12px;vertical-align:middle}
.dot{border-radius:50%;display:inline-block}
.dm{color:#5b6c8f;font-size:10px;font-family:var(--mono)}
#shop{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
.card{position:relative;width:97px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:var(--body);transition:transform .12s,box-shadow .12s,border-color .12s}
.card svg{width:34px;height:34px}
.card .nm{font-family:var(--disp);font-size:9.5px;letter-spacing:.1em;color:#a9c4ea}
.card .cost{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--gold)}
.card kbd{position:absolute;top:4px;right:5px}
.card:hover{transform:translateY(-4px);border-color:currentColor;box-shadow:0 8px 18px rgba(0,0,0,.5)}
.card.sel{transform:translateY(-7px);border-color:currentColor;box-shadow:0 0 0 1px currentColor,0 10px 22px rgba(0,0,0,.55),0 0 18px -4px currentColor}
.card.dis{opacity:.42}.card.dis .cost{color:var(--red)}
#inspector{position:absolute;right:14px;bottom:102px;width:198px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:8px;pointer-events:auto}
.ihead{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-size:12px;letter-spacing:.08em;color:#eaf6ff}
.istats{margin:7px 0;font-family:var(--mono);font-size:11px;line-height:1.75;color:#9db4dc}
.sell{width:100%;padding:7px;font-family:var(--disp);font-size:11px;letter-spacing:.08em;color:var(--red);background:var(--panel);border:1px solid rgba(255,84,104,.4);border-radius:6px;cursor:pointer}
.sell:hover{background:rgba(255,84,104,.12);transform:translateY(-1px)}
#pauser{position:fixed;inset:0;z-index:8;background:rgba(4,8,15,.62);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ptxt{font-family:var(--disp);font-size:46px;letter-spacing:.1em;color:#eaf6ff;text-shadow:3px 3px 0 #10233f;display:flex;flex-direction:column;align-items:center;gap:8px}
.ptxt span{font-family:var(--body);font-size:13px;letter-spacing:.15em;color:#8fa7cf}
#screen{position:fixed;inset:0;z-index:10;background:rgba(4,8,15,.72);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px}
#scrInner{position:relative;width:min(780px,94vw);max-height:94vh;overflow:auto;background:rgba(8,13,25,.94);border:1px solid var(--line);padding:34px 44px 28px;clip-path:polygon(0 16px,16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.o1{width:380px;height:380px;left:50%;top:-46px;margin-left:-190px;border:2px dashed rgba(95,232,255,.22);animation:spin 26s linear infinite}
.o2{width:250px;height:250px;left:50%;top:20px;margin-left:-125px;border:2px dotted rgba(192,123,255,.28);animation:spin 18s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--cyan);margin-bottom:14px}
h1.title{position:relative;font-family:var(--disp);text-transform:uppercase;line-height:.9;font-size:clamp(42px,7vw,76px);letter-spacing:-.015em}
h1.title.sm{font-size:clamp(34px,5.5vw,58px)}
h1 .l1{display:block;color:#eaf6ff;text-shadow:4px 4px 0 #155e8a,8px 8px 0 rgba(0,0,0,.45)}
h1 .l2{display:block;color:var(--amber);text-shadow:4px 4px 0 #8a3d15,8px 8px 0 rgba(0,0,0,.45)}
.sub{margin:16px 0 18px;font-size:14.5px;line-height:1.6;color:#9db4dc;max-width:620px}
.sub b{color:#eaf6ff}.sub .vi{color:var(--violet)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:18px}
.leg{display:flex;align-items:center;gap:10px;background:rgba(13,24,46,.6);border:1px solid rgba(110,190,255,.14);padding:8px 10px;border-radius:7px}
.leg .ic{width:12px;height:12px;border-radius:50%;flex:none;background:currentColor;box-shadow:0 0 10px currentColor}
.leg .tx b{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.08em;color:#eaf6ff}
.leg .tx span{font-size:11px;color:#7f96c2}
.leg .pr{margin-left:auto;font-family:var(--mono);color:var(--gold);font-weight:700;font-size:13px}
.keysrow{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:22px;font-size:11.5px;color:#8fa7cf;align-items:center}
.keysrow i{font-style:normal;color:#dceaff;margin-right:5px}
.menuBtns{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{background:var(--amber);border:none;color:#221302;font-family:var(--disp);font-size:16px;letter-spacing:.1em;padding:14px 30px;border-radius:6px;cursor:pointer;box-shadow:0 5px 0 #7a4b12,0 10px 24px rgba(255,177,77,.25);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 #7a4b12,0 16px 30px rgba(255,177,77,.4)}
.btn:active{transform:translateY(1px);box-shadow:0 2px 0 #7a4b12}
.hint{font-size:12px;letter-spacing:.12em;color:#6f8ab5}
.bestline{margin-top:18px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:#6f8ab5}
.bestline b{color:var(--gold)}
.stats{display:flex;gap:10px;margin:20px 0 24px;flex-wrap:wrap}
.stat{background:rgba(13,24,46,.6);border:1px solid rgba(110,190,255,.14);padding:10px 16px;border-radius:7px;min-width:108px}
.stat .k{font-family:var(--disp);font-size:9.5px;letter-spacing:.16em;color:#6f8ab5}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:700;color:#eaf6ff;margin-top:3px}
.newbest{display:inline-block;background:var(--gold);color:#221302;font-family:var(--disp);font-size:11px;letter-spacing:.14em;padding:5px 12px;border-radius:4px;margin-left:12px;vertical-align:middle;animation:pulseB .8s infinite alternate}
@keyframes pulseB{to{box-shadow:0 0 18px rgba(255,210,63,.8)}}
</style>
</head>
<body class="menu">
<canvas id="game"></canvas>

<div id="ui">
  <div id="topbar">
    <div class="chips">
      <div class="chip" id="chipFlux"><span class="lbl">FLUX</span><span class="val mono" id="fluxVal">140</span></div>
      <div class="chip" id="chipLives"><span class="lbl">CORE</span><span class="val mono" id="livesVal">20</span><div class="bar"><i id="livesBar"></i></div></div>
      <div class="chip"><span class="lbl">WAVE</span><span class="val mono" id="waveVal">–/15</span></div>
      <div class="chip"><span class="lbl">SCORE</span><span class="val mono" id="scoreVal">000000</span></div>
    </div>
    <div class="ctrls">
      <button id="btnSpeed" title="Game speed (F)">1×</button>
      <button id="btnPause" title="Pause (P)">❚❚</button>
      <button id="btnMute" title="Sound (M)">SND</button>
      <button id="btnReset" title="Restart run">↺</button>
    </div>
  </div>
  <div id="banner"></div>
  <div id="shop"></div>
  <div id="inspector" class="hidden">
    <div class="ihead"><span id="inspName"></span><kbd>X</kbd></div>
    <div id="inspStats" class="istats"></div>
    <button id="btnSell" class="sell"></button>
  </div>
</div>

<div id="pauser" class="hidden"><div class="ptxt">PAUSED<span>P OR CLICK TO RESUME</span></div></div>
<div id="screen"><div id="scrInner"></div></div>

<script>
'use strict';
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const TAU=Math.PI*2;
function lerpAngle(a,b,t){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t;}

/* ============ world / path ============ */
const W=1280,H=720,CELL=40,COLS=32,ROWS=18,G=460,MAXW=15;
const PATH=[[-60,150],[420,150],[420,560],[900,560],[900,320],[1250,320]];
const segs=[];let totalLen=0;
for(let i=0;i<PATH.length-1;i++){
  const x1=PATH[i][0],y1=PATH[i][1],x2=PATH[i+1][0],y2=PATH[i+1][1];
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
  segs.push({x1,y1,dx,dy,len,cum:totalLen});totalLen+=len;
}
function posAt(d){
  if(d<=0){const s=segs[0],t=d/s.len;return{x:s.x1+s.dx*t,y:s.y1+s.dy*t,a:Math.atan2(s.dy,s.dx)};}
  if(d>=totalLen){const s=segs[segs.length-1];return{x:s.x1+s.dx,y:s.y1+s.dy,a:Math.atan2(s.dy,s.dx)};}
  for(const s of segs){if(d<=s.cum+s.len){const t=(d-s.cum)/s.len;return{x:s.x1+s.dx*t,y:s.y1+s.dy*t,a:Math.atan2(s.dy,s.dx)};}}
  const s=segs[segs.length-1];return{x:s.x1+s.dx,y:s.y1+s.dy,a:Math.atan2(s.dy,s.dx)};
}
function distToPath(x,y){let m=1e9;for(const s of segs){const t=clamp(((x-s.x1)*s.dx+(y-s.y1)*s.dy)/(s.len*s.len),0,1);const px=s.x1+s.dx*t,py=s.y1+s.dy*t;const d=Math.hypot(x-px,y-py);if(d<m)m=d;}return m;}
const blocked=new Set();
for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++){if(distToPath(i*CELL+20,j*CELL+20)<42)blocked.add(i+','+j);}

/* ============ canvas ============ */
const cv=$('#game'),ctx=cv.getContext('2d');
let dpr=1,scale=1,ox=0,oy=0;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const w=innerWidth,h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  scale=Math.min(w/W,h/H);ox=(w-W*scale)/2;oy=(h-H*scale)/2;
}
addEventListener('resize',resize);resize();

/* static background plate (space + nebulae + grid) */
const bg=document.createElement('canvas');bg.width=W+400;bg.height=H+400;
{
  const b=bg.getContext('2d');
  b.fillStyle='#050910';b.fillRect(0,0,bg.width,bg.height);
  const neb=(x,y,r,c)=>{const g=b.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=g;b.fillRect(x-r,y-r,r*2,r*2);};
  neb(380,260,430,'rgba(24,78,96,.17)');neb(960,480,520,'rgba(52,42,120,.15)');neb(760,140,360,'rgba(120,70,30,.09)');
  for(let i=0;i<300;i++){b.globalAlpha=rand(.18,.8);b.fillStyle=i%7?'#cfe3ff':'#9fd8ff';b.beginPath();b.arc(rand(bg.width),rand(bg.height),rand(.4,1.5),0,TAU);b.fill();}
  b.globalAlpha=1;
  b.fillStyle='#0c1526';b.fillRect(200,200,W,H);
  const gl=b.createRadialGradient(200+W/2,200+H/2,60,200+W/2,200+H/2,W*.7);gl.addColorStop(0,'rgba(90,160,255,.06)');gl.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=gl;b.fillRect(200,200,W,H);
  b.strokeStyle='rgba(110,170,255,.05)';b.lineWidth=1;
  for(let x=0;x<=COLS;x++){b.beginPath();b.moveTo(200+x*CELL+.5,200);b.lineTo(200+x*CELL+.5,200+H);b.stroke();}
  for(let y=0;y<=ROWS;y++){b.beginPath();b.moveTo(200,200+y*CELL+.5);b.lineTo(200+W,200+y*CELL+.5);b.stroke();}
  b.strokeStyle='rgba(120,190,255,.2)';b.lineWidth=2;b.strokeRect(201,201,W-2,H-2);
}
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
{
  const v=vig.getContext('2d');
  const g=v.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,W*.75);
  g.addColorStop(0,'rgba(3,6,14,0)');g.addColorStop(1,'rgba(3,6,14,.55)');
  v.fillStyle=g;v.fillRect(0,0,W,H);
}
const twinkles=[];for(let i=0;i<36;i++)twinkles.push({x:rand(W),y:rand(H),s:rand(1,3.2),ph:rand(TAU),r:rand(.8,1.7)});

/* ============ config ============ */
const TOWERS={
  turret:{name:'TURRET',cost:50,range:170,rate:3,dmg:9,splash:0,color:'#5fe8ff',pr:4,arc:.95,barrel:17,bw:6,big:false,desc:'Rapid auto-cannon'},
  cannon:{name:'CANNON',cost:90,range:230,rate:.8,dmg:30,splash:52,color:'#ffb14d',pr:7,arc:1.15,barrel:21,bw:9,big:true,desc:'Arcing splash shells'},
  well:{name:'GRAV-WELL',cost:70,range:120,slow:.45,push:32,color:'#c07bff',pr:0,arc:0,barrel:0,bw:0,big:false,desc:'Bends shots · drags foes back'},
  mortar:{name:'MORTAR',cost:120,range:320,rate:.45,dmg:46,splash:78,color:'#ffe9b8',pr:9,arc:1.7,barrel:15,bw:11,big:true,desc:'High lob · big blast'}
};
const TORDER=['turret','cannon','well','mortar'];
const ETYPES={
  scout:{hp:22,sp:85,r:11,reward:6,dmg:1,col:'#4a5468',wres:0},
  brawler:{hp:62,sp:55,r:15,reward:10,dmg:1,col:'#3d4356',wres:0},
  swarm:{hp:11,sp:118,r:8,reward:3,dmg:1,col:'#585f74',wres:.3},
  juggernaut:{hp:230,sp:34,r:20,reward:26,dmg:3,col:'#333a4c',wres:.5},
  boss:{hp:950,sp:26,r:30,reward:250,dmg:8,col:'#2b3145',wres:.3}
};
const DOTC={scout:['#9fb4dd',8],swarm:['#cfd9f2',6],brawler:['#7f92bd',10],juggernaut:['#5a6d96',13],boss:['#ff5468',16]};
const DEMO_WELLS=[{x:600,y:330,sw:0},{x:840,y:470,sw:.2}];

/* ============ state ============ */
const game={state:'menu',phase:'build',paused:false,speed:1,flux:140,lives:20,wave:0,score:0,kills:0,buildT:12,spawnT:0};
let towers=[],enemies=[],shots=[],parts=[],floats=[],occ=new Map();
let spawnList=[];
let placing=null,selected=null,shake=0,coreFlash=0,gatePulse=0,t=0;
const hover={gx:0,gy:0,wx:0,wy:0,in:false};

function makeWave(w){
  const L=[];let tt=0;
  const add=(type,n,gap,lead)=>{if(lead)tt+=lead;for(let i=0;i<n;i++){L.push({t:type,at:tt});tt+=gap;}};
  add('scout',4+Math.ceil(w*1.3),.8);
  if(w>=3)add('brawler',1+Math.floor((w-2)/2),1.5,.8);
  if(w%4===0)add('swarm',7+w,.26,1.2);
  if(w>=5&&w%5===0)add('juggernaut',1+Math.floor((w-5)/5),3,1);
  if(w===MAXW){add('brawler',6,.9,1.5);add('boss',1,1,.5);}
  return L;
}

/* ============ audio ============ */
let AC=null,master=null,noiseBuf=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.45;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){}
}
function beep(o){
  if(!AC||muted)return;
  const t0=AC.currentTime+(o.delay||0),dur=o.dur||.1;
  const os=AC.createOscillator(),g=AC.createGain();
  os.type=o.type||'sine';
  os.frequency.setValueAtTime(Math.max(1,o.f0||440),t0);
  os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1||o.f0||440),t0+dur);
  g.gain.setValueAtTime(o.vol||.25,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  os.connect(g);g.connect(master);os.start(t0);os.stop(t0+dur+.03);
}
function boom(dur,vol,f){
  if(!AC||muted)return;
  const t0=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;
  const flt=AC.createBiquadFilter();flt.type='lowpass';
  flt.frequency.setValueAtTime(f,t0);flt.frequency.exponentialRampToValueAtTime(60,t0+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(flt);flt.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+.05);
}
const sfxGate={};
function gated(k,min){const n=performance.now();if(sfxGate[k]&&n-sfxGate[k]<min)return false;sfxGate[k]=n;return true;}
function sfxShoot(type){
  if(type==='turret'){if(gated('s1',45))beep({type:'square',f0:840,f1:320,dur:.06,vol:.09});}
  else if(type==='cannon'){if(gated('s2',60)){beep({type:'triangle',f0:220,f1:55,dur:.16,vol:.3});boom(.1,.14,900);}}
  else{if(gated('s3',80))beep({type:'sine',f0:150,f1:45,dur:.22,vol:.28});}
}

/* ============ simulation ============ */
function solve(sx,sy,tx,ty,arc){
  const dx=tx-sx,dy=ty-sy,D=Math.hypot(dx,dy)||1;
  let T=Math.sqrt(2*D/G)*arc;if(T<.18)T=.18;
  return{vx:dx/T,vy:dy/T+.5*G*T,T};
}
function simTowers(dt){
  for(const tw of towers){
    const c=TOWERS[tw.type];
    if(tw.type==='well'){wellAmbient(tw,dt);continue;}
    tw.cd-=dt;tw.recoil*=Math.exp(-7*dt);
    let best=null,bd=-1e9;const r2=c.range*c.range;
    for(const e of enemies){if(e.dead)continue;const dx=e.x-tw.x,dy=e.y-tw.y;if(dx*dx+dy*dy<=r2&&e.dist>bd){bd=e.dist;best=e;}}
    tw.target=best;
    if(best){
      let sol=solve(tw.x,tw.y,best.x,best.y,c.arc);
      const eff=Math.max(8,best.sp*(1+0.012*(game.wave-1))*best.slow-best.push);
      const pr=posAt(clamp(best.dist+eff*sol.T,0,totalLen));
      sol=solve(tw.x,tw.y,pr.x,pr.y,c.arc);
      tw.angle=lerpAngle(tw.angle,Math.atan2(sol.vy,sol.vx),Math.min(1,dt*12));
      if(tw.cd<=0){
        tw.cd=1/c.rate;tw.recoil=1;
        const mx=tw.x+Math.cos(tw.angle)*c.barrel,my=tw.y+Math.sin(tw.angle)*c.barrel;
        shots.push({x:mx,y:my,vx:sol.vx,vy:sol.vy,r:c.pr,dmg:c.dmg,splash:c.splash,type:tw.type,col:c.color,big:c.big,life:6,trail:[],dead:false});
        parts.push({type:'flash',x:mx,y:my,r:c.big?10:6,life:.07,max:.07,col:c.color});
        sfxShoot(tw.type);
      }
    }
  }
}
function simEnemies(dt){
  const wl=towers.filter(x=>x.type==='well');
  for(const e of enemies){
    if(e.dead)continue;
    let slow=1,push=0,near=null;const R=TOWERS.well.range;
    for(const w of wl){
      const dx=w.x-e.x,dy=w.y-e.y,d=Math.hypot(dx,dy);
      if(d<R&&d>.001){
        const f=1-d/R,s=1-TOWERS.well.slow*(1-e.wres);
        if(s<slow){slow=s;near=w;}
        push=Math.max(push,TOWERS.well.push*f*(1-e.wres));
      }
    }
    e.slow=slow;e.push=push;e.near=near;
    const net=e.sp*(1+0.012*(game.wave-1))*slow-push;
    e.dist+=net*dt;if(e.dist<-140)e.dist=-140;
    const p=posAt(e.dist);e.x=p.x;e.y=p.y;e.a=p.a;
    e.rot+=(net*dt)/e.r;
    e.flash=Math.max(0,e.flash-dt);
    if(slow<1&&Math.random()<dt*7)spawnSwirl(near,e.x,e.y);
    if(e.dist>=totalLen)coreHit(e);
  }
}
function hitShot(p,e){
  e.hp-=p.dmg;e.flash=.12;p.dead=true;
  sparks(p.x,p.y,p.col,4);
  if(p.splash>0){
    for(const o of enemies){
      if(o===e||o.dead)continue;
      const d=Math.hypot(o.x-p.x,o.y-p.y);
      if(d<p.splash){o.hp-=p.dmg*(.35+.65*(1-d/p.splash));o.flash=.12;}
    }
    parts.push({type:'ring',x:p.x,y:p.y,r0:p.r+2,r1:p.splash,life:.35,max:.35,col:p.col});
    chunkBurst(p.x,p.y,p.big?12:7,'#39415a');
    shake=Math.max(shake,p.big?6:3);sfxBoom(p.big);
  }else sfxTick();
}
function updateShots(dt,demo){
  const wells=demo?DEMO_WELLS:towers.filter(x=>x.type==='well');
  for(const p of shots){
    if(p.dead)continue;
    p.vy+=G*dt;
    for(const w of wells){
      const dx=w.x-p.x,dy=w.y-p.y,d=Math.hypot(dx,dy);
      if(d<w.range&&d>1){const f=(1-d/w.range)*300/d;p.vx+=dx*f*dt;p.vy+=dy*f*dt;}
    }
    const sp=Math.hypot(p.vx,p.vy);if(sp>980){p.vx*=980/sp;p.vy*=980/sp;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    p.trail.push({x:p.x,y:p.y});if(p.trail.length>7)p.trail.shift();
    if(!demo){
      for(const e of enemies){
        if(e.dead)continue;
        const dx=e.x-p.x,dy=e.y-p.y,rr=p.r+e.r;
        if(dx*dx+dy*dy<rr*rr){hitShot(p,e);break;}
      }
    }
  }
  shots=shots.filter(p=>!p.dead&&p.life>0&&p.y<H+90&&p.x>-140&&p.x<W+140);
}
function simUpdate(dt){
  if(game.phase==='build'){game.buildT-=dt;if(game.buildT<=0)callWave();}
  else{
    game.spawnT+=dt;
    while(spawnList.length&&game.spawnT>=spawnList[0].at)spawnEnemy(spawnList.shift().t);
    if(!spawnList.length&&!enemies.length){waveComplete();if(game.state!=='play')return;}
  }
  simTowers(dt);simEnemies(dt);updateShots(dt,false);
  for(const e of enemies)if(!e.dead&&e.hp<=0)kill(e);
  enemies=enemies.filter(e=>!e.dead);
  hudUpdate();
}

/* ============ particles / floats ============ */
function addFloat(x,y,txt,col){floats.push({x,y,txt,col,life:1.1,max:1.1});}
function sparks(x,y,col,n){for(let i=0;i<n;i++){const a=rand(TAU),s=rand(60,230);parts.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.5),max:.5,col});}}
function chunkBurst(x,y,n,col){for(let i=0;i<n;i++)parts.push({type:'chunk',x,y,vx:rand(-130,130),vy:rand(-270,-40),g:G*.85,size:rand(3,7),rot:rand(TAU),vr:rand(-9,9),life:rand(.6,1.1),max:1.1,col:i%4===0?'#ff9d3f':(col||'#4a5468')});}
function wellAmbient(w,dt){w.sw-=dt;if(w.sw<=0){w.sw=rand(.12,.3);const a=rand(TAU),rad=TOWERS.well.range*rand(.45,.85);parts.push({type:'swirl',cx:w.x,cy:w.y,a,rad,col:'#c07bff',life:.9,max:.9});}}
function spawnSwirl(w,x,y){if(!w)return;const d=Math.hypot(w.x-x,w.y-y)||1;parts.push({type:'swirl',cx:w.x,cy:w.y,a:Math.atan2(y-w.y,x-w.x),rad:d,col:'#c07bff',life:.8,max:.8});}
function updateParts(dt){
  for(const p of parts){
    p.life-=dt;
    if(p.type==='chunk'){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
    else if(p.type==='spark'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;}
    else if(p.type==='swirl'){p.rad-=150*dt;p.a+=4.5*dt;}
  }
  parts=parts.filter(p=>p.life>0&&!(p.type==='swirl'&&p.rad<5));
  floats=floats.filter(f=>(f.life-=dt)>0);
  shake*=Math.exp(-5*dt);if(shake<.1)shake=0;
  coreFlash=Math.max(0,coreFlash-dt*1.2);gatePulse=Math.max(0,gatePulse-dt*1.4);
}

function hudUpdate(){
  elFlux.textContent=Math.floor(game.flux);
  elLives.textContent=game.lives;
  elBar.style.width=(game.lives/20*100)+'%';

  elScore.textContent=String(game.score).padStart(6,'0');
  if(elCd){elCd.textContent=Math.ceil(Math.max(0,game.buildT))+'s';elBn.textContent=(Math.floor(Math.max(0,game.buildT))*2)+'◈';}
  if(elRem)elRem.textContent=enemies.length+spawnList.length;
  updateShop();
}

/* ============ input ============ */
window.addEventListener('keydown',e=>{
  initAudio();
  const k=e.key;
  if(k===' '){e.preventDefault();if(game.state==='menu')startGame();else if(game.state==='play'&&!game.paused&&game.phase==='build')callWave();return;}
  const lk=k.toLowerCase();
  if(k>='1'&&k<='4'){if(game.state==='play'){const idx=+k-1;togglePlace(TORDER[idx]);}}
  else if(lk==='p'){if(game.state==='play')togglePause();}
  else if(lk==='m'){toggleMute();}
  else if(lk==='f'){if(game.state==='play'){game.speed=game.speed===1?2:1;btnSpeed.textContent=game.speed+'×';}}
  else if(lk==='x'){if(selected)btnSell.click();}
  else if(lk==='escape'){placing=null;hideInspector();updateShop();}
  else if(lk==='r'){if(game.state==='over'||game.state==='won')startGame();}
});
window.addEventListener('pointerdown',initAudio);
window.addEventListener('blur',()=>{if(game.state==='play'&&!game.paused)togglePause(true);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.state==='play'&&!game.paused)togglePause(true);});

function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale};}
cv.addEventListener('mousemove',e=>{
  const p=toWorld(e);hover.wx=p.x;hover.wy=p.y;
  hover.gx=Math.floor(p.x/CELL);hover.gy=Math.floor(p.y/CELL);
  hover.in=p.x>=0&&p.x<W&&p.y>=0&&p.y<H;
});
cv.addEventListener('mouseleave',()=>hover.in=false);
cv.addEventListener('click',e=>{
  if(game.state!=='play')return;
  const p=toWorld(e),gx=Math.floor(p.x/CELL),gy=Math.floor(p.y/CELL);
  if(gx<0||gx>=COLS||gy<0||gy>=ROWS){placing=null;hideInspector();updateShop();return;}
  if(placing){
    const c=TOWERS[placing],key=gx+','+gy;
    const ok=!blocked.has(key)&&!occ.has(key);
    if(ok&&game.flux>=c.cost){
      game.flux-=c.cost;
      const tw={type:placing,gx,gy,x:gx*CELL+20,y:gy*CELL+20,cd:rand(0,.2),angle:-Math.PI/2,recoil:0,sw:rand(.5),target:null};
      towers.push(tw);occ.set(key,tw);sfxPlace();
      sparks(tw.x,tw.y,c.color,6);
      if(!e.shiftKey){placing=null;}
      updateShop();
    }else{
      sfxError();
      elChipFlux.classList.remove('deny');void elChipFlux.offsetWidth;elChipFlux.classList.add('deny');
    }
    return;
  }
  const tw=occ.get(gx+','+gy);
  if(tw){selected=tw;showInspector(tw);}else hideInspector();
});
cv.addEventListener('contextmenu',e=>{e.preventDefault();placing=null;hideInspector();updateShop();});

function togglePause(forceOn){
  if(game.state!=='play')return;
  game.paused=forceOn===true?true:!game.paused;
  pauser.classList.toggle('hidden',!game.paused);
  btnPause.textContent=game.paused?'▶':'❚❚';
}
function toggleMute(){muted=!muted;btnMute.textContent=muted?'MUT':'SND';btnMute.classList.toggle('off',muted);}
btnSpeed.addEventListener('click',e=>{if(game.state==='play'){game.speed=game.speed===1?2:1;btnSpeed.textContent=game.speed+'×';}e.currentTarget.blur();});
btnPause.addEventListener('click',e=>{togglePause();e.currentTarget.blur();});
btnMute.addEventListener('click',e=>{initAudio();toggleMute();e.currentTarget.blur();});
btnReset.addEventListener('click',e=>{startGame();e.currentTarget.blur();});
pauser.addEventListener('click',()=>togglePause());

/* ============ rendering ============ */
function drawPath(){
  ctx.lineJoin='round';ctx.lineCap='round';
  const P=PATH;
  const stroke=(w,c,dash,off)=>{ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)ctx.lineTo(P[i][0],P[i][1]);ctx.lineWidth=w;ctx.strokeStyle=c;if(dash){ctx.setLineDash(dash);ctx.lineDashOffset=off;}else ctx.setLineDash([]);ctx.stroke();};
  stroke(46,'#0a1120');stroke(38,'#141d31');stroke(26,'#1c2740');
  stroke(10,'rgba(255,140,50,.10)');stroke(5,'rgba(255,150,60,.32)');
  stroke(2.2,`rgba(255,170,80,${(.5+.25*Math.sin(t*3)).toFixed(3)})`);
  stroke(3,'rgba(255,190,120,.28)',[12,30],-t*70);
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<26;i++){
    const d=(t*46+i*148)%totalLen,p=posAt(d);
    ctx.globalAlpha=.2+.2*Math.sin(t*5+i);
    ctx.fillStyle='#ffb060';ctx.beginPath();ctx.arc(p.x,p.y,2,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawGate(){
  const x=30,y=150;
  ctx.fillStyle='#0a0f1c';ctx.beginPath();ctx.arc(x,y,34,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,150,70,.4)';ctx.lineWidth=2;ctx.stroke();
  for(let k=0;k<3;k++){
    const a0=t*(1.5+k*.7)+k*2.1,r=26-7*k;
    ctx.strokeStyle=`rgba(255,${140-k*30},60,${(.55-.13*k).toFixed(2)})`;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(x,y,r,a0,a0+1.3);ctx.stroke();
  }
  ctx.fillStyle=`rgba(255,140,58,${(.75+.2*Math.sin(t*6)).toFixed(2)})`;
  ctx.beginPath();ctx.arc(x,y,9,0,TAU);ctx.fill();
  if(gatePulse>0){ctx.strokeStyle=`rgba(255,150,70,${gatePulse.toFixed(2)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,(1-gatePulse)*40+18,0,TAU);ctx.stroke();}
}
function drawCore(){
  const x=1250,y=320;
  ctx.strokeStyle=`rgba(95,232,255,${(.35+.2*Math.sin(t*2.4)).toFixed(2)})`;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,30,0,TAU);ctx.stroke();
  for(let k=0;k<4;k++){
    const a0=t*.8+k*TAU/4;
    ctx.strokeStyle='rgba(95,232,255,.6)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,23,a0,a0+.7);ctx.stroke();
  }
  const g=ctx.createRadialGradient(x,y,1,x,y,18+Math.sin(t*3));
  g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#5fe8ff');g.addColorStop(1,'rgba(95,232,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,18+Math.sin(t*3),0,TAU);ctx.fill();
  if(coreFlash>0){ctx.strokeStyle=`rgba(255,84,104,${coreFlash.toFixed(2)})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,(1-coreFlash/.5)*50+10,0,TAU);ctx.stroke();}
}
function drawWell(x,y){
  const pu=.6+.4*Math.sin(t*3+x);
  const g=ctx.createRadialGradient(x,y,0,x,y,12);
  g.addColorStop(0,'rgba(220,180,255,.9)');g.addColorStop(.5,'rgba(192,123,255,.55)');g.addColorStop(1,'rgba(192,123,255,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,12*pu,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(192,123,255,.55)';ctx.lineWidth=2;
  ctx.setLineDash([10,9]);ctx.lineDashOffset=-t*40;
  ctx.beginPath();ctx.arc(x,y,24,0,TAU);ctx.stroke();
  ctx.strokeStyle='rgba(192,123,255,.3)';
  ctx.setLineDash([4,7]);ctx.lineDashOffset=t*30;
  ctx.beginPath();ctx.arc(x,y,38,0,TAU);ctx.stroke();
  ctx.setLineDash([]);
}
function drawTower(tw){
  const c=TOWERS[tw.type];
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(tw.x,tw.y+12,13,5,0,0,TAU);ctx.fill();
  if(tw.type==='well'){drawWell(tw.x,tw.y);return;}
  ctx.fillStyle='#16233c';ctx.strokeStyle='rgba(95,232,255,.35)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(tw.x,tw.y,14,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#0d1730';ctx.beginPath();ctx.arc(tw.x,tw.y,9,0,TAU);ctx.fill();
  ctx.save();ctx.translate(tw.x,tw.y);ctx.rotate(tw.angle);
  const ro=tw.recoil*-5;
  ctx.fillStyle='#9fb6d8';ctx.fillRect(ro,-c.bw/2,c.barrel,c.bw);
  ctx.fillStyle=c.color;ctx.fillRect(ro+c.barrel-4,-c.bw/2,4,c.bw);
  ctx.restore();
  ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(tw.x,tw.y,5,0,TAU);ctx.fill();
}
function drawEnemy(e){
  const s=ETYPES[e.type],pct=e.hp/e.maxhp;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.75,e.r*.9,e.r*.32,0,0,TAU);ctx.fill();
  if(e.type==='boss'){
    const g=ctx.createRadialGradient(e.x,e.y,e.r*.4,e.x,e.y,e.r*1.7);
    g.addColorStop(0,'rgba(255,84,104,0)');g.addColorStop(.7,`rgba(255,84,104,${(.25+.15*Math.sin(t*4)).toFixed(2)})`);g.addColorStop(1,'rgba(255,84,104,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.7,0,TAU);ctx.fill();
  }
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
  ctx.beginPath();
  e.poly.forEach((v,i)=>{const x=Math.cos(v.a)*v.r,y=Math.sin(v.a)*v.r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.closePath();
  ctx.fillStyle=s.col;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=2;ctx.stroke();
  if(pct<.66){
    ctx.strokeStyle=`rgba(255,157,63,${pct<.33?.95:.55})`;ctx.lineWidth=pct<.33?1.8:1.2;
    for(const c of e.cracks){ctx.beginPath();ctx.moveTo(c.x1*e.r,c.y1*e.r);ctx.lineTo(c.x2*e.r,c.y2*e.r);ctx.stroke();}
  }
  ctx.restore();
  if(e.flash>0){ctx.globalAlpha=e.flash/.12*.7;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  if(pct<1){
    const bw=e.r*2,bx=e.x-e.r,by=e.y-e.r-9;
    ctx.fillStyle='rgba(5,10,20,.8)';ctx.fillRect(bx-1,by-1,bw+2,5.5);
    ctx.fillStyle=pct>.5?'#7dff8a':pct>.25?'#ffd23f':'#ff5468';
    ctx.fillRect(bx,by,bw*pct,3.5);
  }
}
function drawShots(){
  ctx.globalCompositeOperation='lighter';
  for(const p of shots){
    const n=p.trail.length;
    for(let i=1;i<n;i++){
      ctx.globalAlpha=(i/n)*.45;ctx.strokeStyle=p.col;ctx.lineWidth=p.r*(i/n);
      ctx.beginPath();ctx.moveTo(p.trail[i-1].x,p.trail[i-1].y);ctx.lineTo(p.trail[i].x,p.trail[i].y);ctx.stroke();
    }
    ctx.globalAlpha=.3;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.4,0,TAU);ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.r*.5,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawParts(){
  for(const p of parts){
    const k=Math.max(0,p.life/p.max);
    if(p.type==='chunk'){
      ctx.globalAlpha=k;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.col;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();
    }else{
      ctx.globalCompositeOperation='lighter';
      if(p.type==='spark'){
        ctx.globalAlpha=k;ctx.strokeStyle=p.col;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);ctx.stroke();
      }else if(p.type==='ring'){
        const r=lerp(p.r0,p.r1,1-k);
        ctx.globalAlpha=k*.8;ctx.strokeStyle=p.col;ctx.lineWidth=3*k+1;
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.stroke();
      }else if(p.type==='flash'){
        const r=p.r*(1+(1-k)*1.6);
        ctx.globalAlpha=k*.9;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();
      }else if(p.type==='swirl'){
        const x=p.cx+Math.cos(p.a)*p.rad,y=p.cy+Math.sin(p.a)*p.rad;
        ctx.globalAlpha=k*.8;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
    }
  }
  ctx.globalAlpha=1;
}
function drawFloats(){
  ctx.font='700 15px Consolas,Menlo,monospace';ctx.textAlign='center';
  for(const f of floats){
    const k=f.life/f.max;
    ctx.globalAlpha=Math.min(1,k*1.4);
    ctx.fillStyle='#050a14';ctx.fillText(f.txt,f.x+1,f.y-(1-k)*26+1);
    ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-(1-k)*26);
  }
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawRange(x,y,r,col,a){
  ctx.globalAlpha=a*.15;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1;
}
function drawArc(sx,sy,col){
  let x=sx,y=sy,vx=190,vy=-170;
  ctx.fillStyle=col;
  for(let i=0;i<46;i++){
    vy+=G*.045;x+=vx*.045;y+=vy*.045;
    if(i%3===0){ctx.globalAlpha=Math.max(0,.8-i*.016);ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();}
    if(y>H)break;
  }
  ctx.globalAlpha=1;
}
function drawGhost(){
  const c=TOWERS[placing],x=hover.gx*CELL+20,y=hover.gy*CELL+20;
  const ok=!blocked.has(hover.gx+','+hover.gy)&&!occ.has(hover.gx+','+hover.gy)&&game.flux>=c.cost;
  drawRange(x,y,c.range,ok?'#5fe8ff':'#ff5468',.35);
  ctx.globalAlpha=.75;
  if(placing==='well')drawWell(x,y);
  else{
    ctx.fillStyle='#16233c';ctx.beginPath();ctx.arc(x,y,14,0,TAU);ctx.fill();
    ctx.strokeStyle=c.color;ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(x,y);ctx.rotate(-.5);ctx.fillStyle='#9fb6d8';ctx.fillRect(0,-c.bw/2,c.barrel,c.bw);ctx.restore();
  }
  ctx.globalAlpha=1;
  if(ok&&placing!=='well')drawArc(x,y-6,c.color);
  ctx.strokeStyle=ok?'rgba(95,232,255,.8)':'rgba(255,84,104,.8)';ctx.lineWidth=1.5;
  ctx.strokeRect(hover.gx*CELL+1,hover.gy*CELL+1,CELL-2,CELL-2);
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=cv.width/dpr,h=cv.height/dpr;
  ctx.fillStyle='#04070f';ctx.fillRect(0,0,w,h);
  ctx.save();
  ctx.translate(ox+(Math.random()*2-1)*shake,oy+(Math.random()*2-1)*shake);
  ctx.scale(scale,scale);
  ctx.drawImage(bg,-200,-200);
  ctx.globalCompositeOperation='lighter';
  for(const s of twinkles){
    ctx.globalAlpha=.2+.45*(.5+.5*Math.sin(t*s.s+s.ph));
    ctx.fillStyle='#cfe3ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  drawPath();drawGate();drawCore();
  if(game.state==='menu'){for(const dw of DEMO_WELLS)drawWell(dw.x,dw.y);}
  else for(const tw of towers){tw.type==='well'?drawWell(tw.x,tw.y):drawTower(tw);}
  for(const e of enemies)drawEnemy(e);
  drawShots();drawParts();drawFloats();
  if(game.state==='play'&&placing&&hover.in)drawGhost();
  if(selected&&game.state==='play')drawRange(selected.x,selected.y,TOWERS[selected.type].range,TOWERS[selected.type].color,.5);
  ctx.drawImage(vig,0,0);
  ctx.restore();
}

/* ============ main loop ============ */
let last=performance.now(),ambT=0;
function menuAmbient(dt){
  ambT-=dt;
  if(ambT<=0){
    ambT=rand(.5,1);
    shots.push({x:rand(80,260),y:rand(140,600),vx:rand(170,260),vy:rand(-90,30),r:rand(3.5,6),dmg:0,splash:0,type:'turret',col:Math.random()<.5?'#5fe8ff':'#ffb14d',big:false,life:6,trail:[],dead:false});
  }
  wellAmbient(DEMO_WELLS[0],dt);wellAmbient(DEMO_WELLS[1],dt);
}
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min(.05,(now-last)/1000);last=now;t+=raw;
  if(game.state==='menu'){menuAmbient(raw);updateShots(raw,true);}
  else if(game.state==='play'&&!game.paused)simUpdate(raw*game.speed);
  const tick=(game.state==='play'&&!game.paused)?raw*game.speed:raw;
  updateParts(tick);
  render();
}

/* ============ boot ============ */
buildShop();updateShop();hudUpdate();showMenu();
requestAnimationFrame(frame);
</script>
