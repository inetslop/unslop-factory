<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maze Clash — Two-Player Maze Game</title>
<style>
  :root{
    --disp: Impact,'Arial Black','Franklin Gothic Medium',sans-serif;
    --body: 'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    --ember:#ff7a3d; --frost:#3fd8ff; --gold:#ffd257; --ink:#0a1620;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#070f16}
  body{font-family:var(--body);color:#dfeaf2;-webkit-user-select:none;user-select:none}
  #game{position:fixed;inset:0;display:block}
  .display{font-family:var(--disp)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;
       padding:12px 16px;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s}
  #hud.on{opacity:1;transform:none}
  .panel{background:linear-gradient(180deg,rgba(14,28,40,.88),rgba(9,18,27,.72));border:1px solid rgba(120,180,210,.16);
         padding:10px 14px 11px;min-width:172px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
  .panel.p1{border-left:3px solid var(--ember)}
  .panel.p2{border-right:3px solid var(--frost);text-align:right}
  .pname{font-size:20px;letter-spacing:.16em;line-height:1}
  .p1 .pname{color:#ffb08a;text-shadow:0 0 14px rgba(255,122,61,.55)}
  .p2 .pname{color:#9fe6ff;text-shadow:0 0 14px rgba(63,216,255,.55)}
  .pips{display:flex;gap:8px;margin-top:9px}
  .p2 .pips{justify-content:flex-end}
  .pip{width:11px;height:11px;transform:rotate(45deg);background:rgba(140,190,220,.12);border:1px solid rgba(140,190,220,.3)}
  .p1 .pip.on{background:var(--ember);border-color:#ffc9a8;box-shadow:0 0 10px rgba(255,122,61,.95);animation:pippop .35s}
  .p2 .pip.on{background:var(--frost);border-color:#c4f1ff;box-shadow:0 0 10px rgba(63,216,255,.95);animation:pippop .35s}
  @keyframes pippop{0%{transform:rotate(45deg) scale(2.2)}100%{transform:rotate(45deg) scale(1)}}
  .pkeys{margin-top:8px;font-size:10px;letter-spacing:.28em;color:#63829a}
  .mid{text-align:center;padding-top:2px}
  .ft{font-size:12px;letter-spacing:.34em;color:#7fa3bd}
  #ftN{color:var(--gold);font-size:17px;text-shadow:0 0 10px rgba(255,210,87,.6)}
  .surge{margin-top:6px;font-size:10px;letter-spacing:.3em;color:#54718a;min-height:12px}
  .surge.live{color:var(--gold);text-shadow:0 0 12px rgba(255,210,87,.8);animation:spulse .6s infinite alternate}
  @keyframes spulse{to{opacity:.4}}
  .panel.bump{animation:pbump .35s}
  @keyframes pbump{40%{transform:scale(1.07)}}

  /* ---------- Overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;
           background:radial-gradient(ellipse at center,rgba(6,13,20,.5),rgba(4,9,14,.84));transition:opacity .3s}
  #overlay.hidden{opacity:0;pointer-events:none}
  .card{width:min(660px,94vw);max-height:94vh;overflow:auto;text-align:center;padding:36px 42px 30px;
        background:linear-gradient(165deg,rgba(15,34,49,.97),rgba(9,20,31,.98));
        border:1px solid rgba(130,190,220,.2);box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 0 70px rgba(40,95,135,.12);
        clip-path:polygon(0 18px,18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px));
        animation:cardIn .45s cubic-bezier(.2,1.4,.3,1)}
  .card.narrow{width:min(400px,92vw)}
  @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
  .kicker{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.4em;color:#7fa3bd;margin-bottom:18px}
  .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(140,200,230,.45))}
  .kicker .ln:last-child{background:linear-gradient(90deg,rgba(140,200,230,.45),transparent)}
  .title{font-size:clamp(46px,9.5vw,84px);line-height:.95;letter-spacing:.04em;color:#f2f8fc;
         text-shadow:-10px 0 26px rgba(255,122,61,.35),10px 0 26px rgba(63,216,255,.35),0 5px 0 rgba(0,0,0,.4)}
  .sub{margin:18px auto 0;max-width:46ch;font-size:15px;line-height:1.65;color:#a9c4d6}
  .sub b{color:#eaf4fb}
  .ctrls{display:flex;gap:16px;justify-content:center;align-items:stretch;margin:28px 0 4px;flex-wrap:wrap}
  .pad{background:rgba(7,16,24,.75);border:1px solid rgba(120,170,200,.16);padding:14px 18px 16px;min-width:158px;
       clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
  .pad h4{font-size:10px;letter-spacing:.24em;font-weight:700}
  .p1c h4{color:#ffb08a}.p2c h4{color:#9fe6ff}
  .keys{display:grid;grid-template-columns:repeat(3,32px);grid-auto-rows:32px;gap:6px;justify-content:center;margin-top:12px}
  .key{display:grid;place-items:center;background:#122736;border:1px solid rgba(150,200,230,.28);border-bottom:3px solid #0a1620;
       font-weight:700;font-size:14px;color:#cfe4f0}
  .vs{align-self:center;width:46px;height:46px;border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;
      transform:rotate(45deg);font-size:16px;margin:0 4px;box-shadow:0 0 18px rgba(255,210,87,.35)}
  .vs span{transform:rotate(-45deg);display:block}
  .tips{margin:16px auto 24px;font-size:11.5px;letter-spacing:.14em;color:#8fb0c6;line-height:1.9}
  .btn{pointer-events:auto;cursor:pointer;font-family:var(--disp);letter-spacing:.2em;font-size:19px;color:#071219;
       background:linear-gradient(180deg,#ffd96b,#ffb03a);border:none;padding:15px 36px;
       clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
       box-shadow:0 6px 0 #8a5b12,0 16px 34px rgba(255,176,58,.28);transition:transform .15s,filter .15s}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5b12}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .hint{margin-top:15px;font-size:10.5px;letter-spacing:.28em;color:#5d7c93;text-transform:uppercase}
  .win{font-size:clamp(34px,6.5vw,56px);letter-spacing:.06em;margin-bottom:8px}
  .scoreline{font-size:38px;letter-spacing:.2em;color:#d7e9f4;margin:6px 0 18px}
  .chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .chip{border:1px solid rgba(130,190,220,.25);background:rgba(8,17,25,.7);padding:7px 14px;font-size:10.5px;letter-spacing:.2em;color:#8fb0c6}
  .chip b{color:#eef6fb;margin-left:6px}
  .paused-t{font-size:clamp(34px,6vw,50px);letter-spacing:.3em;color:#eaf4fb;text-shadow:0 0 26px rgba(140,200,240,.4)}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel p1" id="panel1"><div class="pname display">EMBER</div><div class="pips" id="pips1"></div><div class="pkeys">W A S D</div></div>
  <div class="mid"><div class="ft display">FIRST TO <span id="ftN">5</span></div><div id="surgeLine" class="surge"></div></div>
  <div class="panel p2" id="panel2"><div class="pname display">FROST</div><div class="pips" id="pips2"></div><div class="pkeys">ARROW KEYS</div></div>
</div>

<div id="overlay"></div>

<script>
(()=>{ 'use strict';
/* ================= DOM & CANVAS ================= */
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud'), overlay=document.getElementById('overlay');
const surgeEl=document.getElementById('surgeLine');
const pipsEls=[document.getElementById('pips1'),document.getElementById('pips2')];
const panels=[document.getElementById('panel1'),document.getElementById('panel2')];
let DPR=1, vig=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.max(2,Math.floor(innerWidth*DPR));canvas.height=Math.max(2,Math.floor(innerHeight*DPR));
  const w=innerWidth,h=innerHeight;
  vig=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.34,w/2,h/2,Math.max(w,h)*.78);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(2,6,10,.55)');}
addEventListener('resize',resize);resize();

/* ================= CONSTANTS ================= */
const P=48, WT=4, TARGET=5, GEMN=4;
const SPEED_N=172, SPEED_B=258, ACC=1500, VIS=P*3.2;
const SURGE_IDLE=14, SURGE_LIFE=6.5, SURGE_AFTER=9;
const P1C={name:'EMBER',c:'#ff7a3d',lite:'#ffcfae',dark:'#7e3210',rgb:'255,122,61'};
const P2C={name:'FROST',c:'#3fd8ff',lite:'#c9f2ff',dark:'#0f5b7d',rgb:'63,216,255'};
const GEMRGB='255,210,87';

/* ================= STATE ================= */
let state='menu'; // menu | count | play | pause | over
let cols=0,rows=0,mw=0,mh=0,hW=null,vW=null;
let mazeC=null,fogC=null,fg=null,spores=[];
let p1=null,p2=null,gems=[],rings=[],parts=[];
let bots=[];
let surge={state:'idle',timer:SURGE_IDLE,x:0,y:0,t:1};
let scores=[0,0],clashes=0,surgeTaken=[0,0],matchTime=0,clashCd=0;
let countT=0,goT=0,shake=0,lastSec=-1,winDelay=0,winner=null,overlayShown=false,confT=0,menuPingT=2;
const keys={};
let nowGlobal=performance.now(), lastT=nowGlobal;

/* ================= AUDIO (Web Audio, post-gesture) ================= */
let AC=null,master=null,noiseBuf=null;
function audio(){ if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.4;master.connect(AC.destination);
    const len=(AC.sampleRate*.5)|0;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;} }
function tone(f0,f1,dur,type,vol,delay){ if(!AC)return; delay=delay||0;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.014);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.06); }
function thud(dur,vol,fq,delay){ if(!AC||!noiseBuf)return; delay=delay||0;
  const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(master);s.start(t,Math.random()*.15);s.stop(t+dur+.05); }
const sPick=i=>{ if(i===0){tone(523,784,.1,'square',.16);tone(784,1175,.12,'square',.11,.06);}
                 else    {tone(440,659,.1,'triangle',.2);tone(659,988,.13,'triangle',.14,.06);} };
const sSurge=()=>{tone(880,880,.08,'sine',.18);tone(1174,1174,.08,'sine',.15,.08);tone(1568,1568,.18,'sine',.13,.16);};
let lastWall=-9;
const sWall=()=>{const n=performance.now();if(n-lastWall<110)return;lastWall=n;thud(.05,.22,600);};
const sClash=()=>{thud(.14,.5,260);tone(170,55,.18,'sawtooth',.25);};
const sCount=()=>tone(440,440,.09,'square',.2);
const sGo=()=>{tone(660,880,.3,'square',.22);thud(.2,.18,400);};
const sWin=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,f,.14,'square',.17,i*.11));tone(1047,1047,.45,'square',.14,.46);};
const sUI=()=>tone(700,940,.07,'triangle',.15);

/* ================= MAZE GENERATION ================= */
function genMaze(c,r){
  cols=c;rows=r;mw=cols*P+8;mh=rows*P+8;
  hW=new Uint8Array((r+1)*c).fill(1); vW=new Uint8Array(r*(c+1)).fill(1);
  const vis=new Uint8Array(c*r), st=[[0,0]];vis[0]=1;
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(st.length){
    const top=st[st.length-1],cx=top[0],cy=top[1],opts=[];
    for(const d of D){const nx=cx+d[0],ny=cy+d[1];
      if(nx>=0&&ny>=0&&nx<c&&ny<r&&!vis[ny*c+nx])opts.push([nx,ny,d]);}
    if(!opts.length){st.pop();continue;}
    const o=opts[(Math.random()*opts.length)|0],nx=o[0],ny=o[1];
    vis[ny*c+nx]=1;
    if(o[2][0]===1)vW[cy*(c+1)+cx+1]=0; else hW[(cy+1)*c+cx]=0;
    st.push([nx,ny]);
  }
  // braid: open some dead ends so rival routes exist
  for(let cy=0;cy<r;cy++)for(let cx=0;cx<c;cx++){
    const cand=[];let walls=0;
    if(vW[cy*(c+1)+cx]){walls++;if(cx>0)cand.push(['v',cy*(c+1)+cx]);}
    if(vW[cy*(c+1)+cx+1]){walls++;if(cx<c-1)cand.push(['v',cy*(c+1)+cx+1]);}
    if(hW[cy*c+cx]){walls++;if(cy>0)cand.push(['h',cy*c+cx]);}
    if(hW[(cy+1)*c+cx]){walls++;if(cy<r-1)cand.push(['h',(cy+1)*c+cx]);}
    if(walls>=3&&cand.length&&Math.random()<.5){const w=cand[(Math.random()*cand.length)|0];
      if(w[0]==='v')vW[w[1]]=0;else hW[w[1]]=0;}
  }
  buildMazeCanvas();
  fogC=document.createElement('canvas');fogC.width=mw;fogC.height=mh;fg=fogC.getContext('2d');
  spores=[];for(let i=0;i<38;i++)spores.push({x:Math.random()*mw,y:Math.random()*mh,s:4+Math.random()*11,ph:Math.random()*7});
}
function buildMazeCanvas(){
  mazeC=document.createElement('canvas');mazeC.width=mw;mazeC.height=mh;
  const g=mazeC.getContext('2d'),ox=4,oy=4;
  g.fillStyle='#0e2130';g.fillRect(0,0,mw,mh);
  g.strokeStyle='rgba(125,185,220,.05)';g.lineWidth=1;g.beginPath();
  for(let x=ox;x<=mw-ox;x+=P){g.moveTo(x+.5,oy);g.lineTo(x+.5,mh-oy);}
  for(let y=oy;y<=mh-oy;y+=P){g.moveTo(ox,y+.5);g.lineTo(mw-ox,y+.5);}
  g.stroke();
  const wallRect=(x,y,w,h)=>{ g.fillStyle='#315a72';g.fillRect(x,y,w,h);
    g.fillStyle='rgba(150,215,245,.34)';g.fillRect(x,y,w,2);
    g.fillStyle='rgba(3,9,14,.5)';g.fillRect(x,y+h-2,w,2); };
  for(let cy=0;cy<rows;cy++)for(let cxi=0;cxi<=cols;cxi++)
    if(vW[cy*(cols+1)+cxi])wallRect(cxi*P-4,cy*P-4,8,P+8);
  for(let rwi=0;rwi<=rows;rwi++)for(let cx=0;cx<cols;cx++)
    if(hW[rwi*cols+cx])wallRect(cx*P-4,rwi*P-4,P+8,8);
  const s1=startPos(0),s2=startPos(1);
  [[s1,P1C],[s2,P2C]].forEach(([s,c])=>{ g.strokeStyle='rgba('+c.rgb+',.5)';g.lineWidth=2;
    g.beginPath();g.arc(s.x,s.y,17,0,7);g.stroke();
    g.fillStyle='rgba('+c.rgb+',.1)';g.fill(); });
  g.strokeStyle='rgba(95,170,210,.4)';g.lineWidth=2;g.strokeRect(1,1,mw-2,mh-2);
}
function startPos(i){ return i===0?{x:P/2+4,y:P/2+4}:{x:cols*P-P/2+4,y:rows*P-P/2+4}; }

/* ================= PHYSICS ================= */
function circRect(px,py,r,rx,ry,rw,rh){ const nx=Math.max(rx,Math.min(px,rx+rw)),ny=Math.max(ry,Math.min(py,ry+rh));
  const dx=px-nx,dy=py-ny;return dx*dx+dy*dy<r*r; }
function nearRects(p,rad,fn){
  const x0=Math.max(0,Math.floor((p.x-rad-8)/P)-1),x1=Math.min(cols,Math.floor((p.x+rad+8)/P)+1);
  const y0=Math.max(0,Math.floor((p.y-rad-8)/P)-1),y1=Math.min(rows,Math.floor((p.y+rad+8)/P)+1);
  for(let cj=y0;cj<=y1;cj++)for(let cxi=x0;cxi<=x1;cxi++)
    if(vW[cj*(cols+1)+cxi]&&fn(cxi*P-4,cj*P-4,8,P+8))return true;
  for(let rwi=y0;rwi<=y1;rwi++)for(let ci=x0;ci<=x1;ci++)
    if(hW[rwi*cols+ci]&&fn(ci*P-4,rwi*P-4,P+8,8))return true;
  return false;
}
function moveAxis(p,axis,d){
  if(!d)return false;
  const prev=p[axis];p[axis]+=d;const r=p.r;
  let hit=nearRects(p,r,(rx,ry,rw,rh)=>circRect(p.x,p.y,r,rx,ry,rw,rh));
  if(hit){p[axis]=prev;if(axis==='x')p.vx=0;else p.vy=0;return true;}
  return false;
}
function clearPos(p){ let bad=false;
  nearRects(p,p.r*.92,(rx,ry,rw,rh)=>{if(circRect(p.x,p.y,p.r*.92,rx,ry,rw,rh))bad=true;});return !bad; }
function stepPlayer(p,ix,iy,dt){
  const sp=p.boost>0?SPEED_B:SPEED_N;
  if(ix||iy){const l=Math.hypot(ix,iy);p.vx+=ix/l*ACC*dt;p.vy+=iy/l*ACC*dt;}
  else{const f=Math.exp(-9.5*dt);p.vx*=f;p.vy*=f;}
  const v=Math.hypot(p.vx,p.vy);if(v>sp){p.vx*=sp/v;p.vy*=sp/v;}
  const n=Math.max(1,Math.ceil(v*dt/(P*.4)));let hit=false;
  for(let i=0;i<n;i++){ if(moveAxis(p,'x',p.vx*dt/n))hit=true; if(moveAxis(p,'y',p.vy*dt/n))hit=true; }
  if(hit){sWall();const a=Math.random()*7;
    parts.push({x:p.x+Math.cos(a)*p.r,y:p.y+Math.sin(a)*p.r,vx:Math.cos(a)*30,vy:Math.sin(a)*30-20,
      g:60,life:.3,max:.3,size:1.6,rgb:'170,215,245',glow:true});}
}

/* ================= ENTITIES ================= */
function makePlayer(pos,cfg,num){return{x:pos.x,y:pos.y,vx:0,vy:0,r:12,boost:0,c:cfg.c,lite:cfg.lite,dark:cfg.dark,rgb:cfg.rgb,name:cfg.name,num};}
function pickCell(minD,anchors,extra){
  for(let t=0;t<70;t++){
    const cx=(Math.random()*cols)|0,cy=(Math.random()*rows)|0,x=cx*P+P/2+4,y=cy*P+P/2+4;
    let ok=true;
    for(const a of anchors)if((a.x-x)**2+(a.y-y)**2<minD**2){ok=false;break;}
    if(ok&&!extra)return{x,y};
  } return null;
}
function spawnGem(anchors){
  const g=pickCell(P*3,anchors);if(!g)return false;
  for(const o of gems)if((o.x-g.x)**2+(o.y-g.y)**2<(P*2)**2)return false;
  if(surge.state==='live'&&(surge.x-g.x)**2+(surge.y-g.y)**2<(P*2)**2)return false;
  gems.push({x:g.x,y:g.y,t:0,ph:Math.random()*7});return true;
}
function spawnSurge(){
  let x,y;for(let t=0;t<50;t++){
    const cx=(cols*.25+Math.random()*cols*.5)|0,cy=(rows*.25+Math.random()*rows*.5)|0;
    x=cx*P+P/2+4;y=cy*P+P/2+4;
    if((p1.x-x)**2+(p1.y-y)**2<(P*2)**2||(p2.x-x)**2+(p2.y-y)**2<(P*2)**2)continue;
    break;}
  surge={state:'live',timer:SURGE_LIFE,x,y,t:0};sSurge();shake=Math.max(shake,4);
  rings.push({x,y,t:0,dur:.7,rgb:GEMRGB});burst(x,y,GEMRGB,16);
}
function burst(x,y,rgb,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=40+Math.random()*160;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:50,life:.45+Math.random()*.4,max:.85,size:1.5+Math.random()*2.4,rgb,glow:true});}}

/* ================= GAME FLOW ================= */
function startMatch(){
  audio();
  let c=Math.round((innerWidth-30)/P),r=Math.round((innerHeight-115)/P);
  c=Math.max(13,Math.min(25,c));r=Math.max(9,Math.min(17,r));
  if(c%2===0)c++;if(r%2===0)r--;
  genMaze(c,r);
  p1=makePlayer(startPos(0),P1C,'1');p2=makePlayer(startPos(1),P2C,'2');
  gems=[];rings=[];parts.length=0;bots=[];
  scores=[0,0];clashes=0;surgeTaken=[0,0];matchTime=0;clashCd=0;lastSec=-1;
  for(let i=0;i<GEMN;i++)spawnGem([p1,p2]);
  surge={state:'idle',timer:12,x:0,y:0,t:1};
  state='count';countT=3.0;goT=0;winner=null;overlayShown=false;confT=0;
  updatePips();hud.classList.add('on');overlay.classList.add('hidden');sCount();
}
function onPickup(p,idx,x,y,isSurge){
  scores[idx]+=isSurge?2:1;if(isSurge){surgeTaken[idx]++;surge.state='idle';surge.timer=SURGE_AFTER;}
  p.boost=2.0;
  rings.push({x,y,t:0,dur:.55,rgb:p.rgb});burst(x,y,p.rgb,isSurge?20:11);
  sPick(idx);if(isSurge)sSurge();
  updatePips(idx);
  if(scores[idx]>=TARGET){
    winner=idx;state='over';winDelay=.95;overlayShown=false;sWin();shake=8;
    rings.push({x:p.x,y:p.y,t:0,dur:.9,rgb:p.rgb});rings.push({x:p.x,y:p.y,t:0,dur:.7,rgb:GEMRGB});
  }
}
function handleClash(){
  const dx=p2.x-p1.x,dy=p2.y-p1.y,d=Math.hypot(dx,dy),minD=p1.r+p2.r;
  if(d>=minD||d===0)return;
  const nx=dx/d,ny=dy/d,pen=(minD-d)/2+.1;
  const o1x=p1.x,o1y=p1.y,o2x=p2.x,o2y=p2.y;
  p1.x-=nx*pen;p1.y-=ny*pen;p2.x+=nx*pen;p2.y+=ny*pen;
  if(!clearPos(p1)){p1.x=o1x;p1.y=o1y;}if(!clearPos(p2)){p2.x=o2x;p2.y=o2y;}
  if(clashCd<=0){
    clashCd=.55;const k=215;
    p1.vx-=nx*k;p1.vy-=ny*k;p2.vx+=nx*k;p2.vy+=ny*k;
    clashes++;shake=7;sClash();
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    burst(mx,my,'255,240,220',13);rings.push({x:mx,y:my,t:0,dur:.4,rgb:'255,240,220'});
  }
}

/* ================= MENU ATTRACT MODE ================= */
function genMenu(){
  let c=Math.round((innerWidth-30)/P),r=Math.round((innerHeight-60)/P);
  c=Math.max(13,Math.min(25,c));r=Math.max(9,Math.min(17,r));
  if(c%2===0)c++;if(r%2===0)r--;
  genMaze(c,r);
  const s0=startPos(0),s1=startPos(1);
  bots=[{x:s0.x,y:s0.y,vx:0,vy:0,r:12,c:P1C.c,lite:P1C.lite,dark:P1C.dark,rgb:P1C.rgb,num:'',tx:s0.x,ty:s0.y,timer:0},
        {x:s1.x,y:s1.y,vx:0,vy:0,r:12,c:P2C.c,lite:P2C.lite,dark:P2C.dark,rgb:P2C.rgb,num:'',tx:s1.x,ty:s1.y,timer:0}];
  gems=[];for(let i=0;i<GEMN;i++){const g=pickCell(0,[]);if(g)gems.push({x:g.x,y:g.y,t:1,ph:Math.random()*7});}
  surge={state:'idle',timer:99,x:0,y:0,t:1};
}
function botPick(b){
  const cx=Math.floor((b.x-4)/P),cy=Math.floor((b.y-4)/P),opts=[];
  if(cx>0&&!vW[cy*(cols+1)+cx])opts.push([cx-1,cy]);
  if(cx<cols-1&&!vW[cy*(cols+1)+cx+1])opts.push([cx+1,cy]);
  if(cy>0&&!hW[cy*cols+cx])opts.push([cx,cy-1]);
  if(cy<rows-1&&!hW[(cy+1)*cols+cx])opts.push([cx,cy+1]);
  const o=opts.length?opts[(Math.random()*opts.length)|0]:[cx,cy];
  b.tx=o[0]*P+P/2+4;b.ty=o[1]*P+P/2+4;b.timer=.5+Math.random()*1.3;
}
function updateBots(dt){
  for(const b of bots){
    const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy);
    b.timer-=dt;
    if(d<6||b.timer<=0)botPick(b);
    else{const sp=95;b.x+=dx/d*sp*dt;b.y+=dy/d*sp*dt;}
  }
}

/* ================= UPDATE ================= */
function update(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;
    if(q.life<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.g||0)*dt;q.vx*=Math.exp(-2*dt);if(q.vr)q.rot+=q.vr*dt;}
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>rings[i].dur)rings.splice(i,1);}
  shake*=Math.exp(-7*dt);if(shake<.15)shake=0;
  goT=Math.max(0,goT-dt);clashCd=Math.max(0,clashCd-dt);
  for(const s of spores){s.ph+=dt;s.y-=s.s*dt;if(s.y<-4){s.y=mh+4;s.x=Math.random()*mw;}}

  if(state==='menu'){
    updateBots(dt);
    menuPingT-=dt;
    if(menuPingT<=0&&gems.length){menuPingT=1.5+Math.random();const g=gems[(Math.random()*gems.length)|0];
      rings.push({x:g.x,y:g.y,t:0,dur:.8,rgb:GEMRGB});}
    return;
  }
  if(state==='count'){
    const prev=Math.ceil(countT);countT-=dt;const cur=Math.ceil(countT);
    if(cur!==prev&&cur>=1)sCount();
    if(countT<=0){state='play';goT=.6;sGo();}
    return;
  }
  if(state==='pause')return;
  if(state==='over'){
    winDelay-=dt;if(winDelay<=0&&!overlayShown){overlayShown=true;showWin();}
    confT-=dt;const wc=winner===0?P1C:P2C;
    while(confT<=0){confT+=.13;
      for(let i=0;i<3;i++)parts.push({x:Math.random()*mw,y:-8,vx:(Math.random()-.5)*70,vy:60+Math.random()*90,g:150,
        life:2.4,max:2.4,size:3+Math.random()*3.5,rgb:[wc.rgb,GEMRGB,'255,255,255'][(Math.random()*3)|0],rot:Math.random()*7,vr:(Math.random()-.5)*9,glow:false});}
    return;
  }
  /* ---- play ---- */
  matchTime+=dt;
  const i1x=(keys.KeyD?1:0)-(keys.KeyA?1:0),i1y=(keys.KeyS?1:0)-(keys.KeyW?1:0);
  const i2x=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),i2y=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  stepPlayer(p1,i1x,i1y,dt);stepPlayer(p2,i2x,i2y,dt);
  for(const p of [p1,p2]){
    if(p.boost>0){p.boost-=dt;
      parts.push({x:p.x+(Math.random()*8-4),y:p.y+(Math.random()*8-4),vx:-p.vx*.12,vy:-p.vy*.12,
        life:.3,max:.3,size:2.1,rgb:p.rgb,glow:true});}
  }
  handleClash();
  let gt=0;
  while(gems.length<GEMN&&gt<8){if(spawnGem([p1,p2]))break;gt++;}
  for(let i=gems.length-1;i>=0;i--){const gm=gems[i];gm.t=Math.min(1,gm.t+dt/.45);
    let taken=false;
    for(let pi=0;pi<2&&!taken;pi++){const p=pi===0?p1:p2;
      if((p.x-gm.x)**2+(p.y-gm.y)**2<(p.r+9)**2){gems.splice(i,1);onPickup(p,pi,gm.x,gm.y,false);taken=true;}}
    if(state!=='play')return;
  }
  surge.t=Math.min(1,surge.t+dt/.45);
  if(surge.state==='idle'){surge.timer-=dt;if(surge.timer<=0)spawnSurge();}
  else{
    surge.timer-=dt;
    if(Math.random()<.3)parts.push({x:surge.x+(Math.random()*16-8),y:surge.y+(Math.random()*16-8),
      vx:0,vy:-25,life:.4,max:.4,size:1.6,rgb:GEMRGB,glow:true});
    for(let pi=0;pi<2;pi++){const p=pi===0?p1:p2;
      if((p.x-surge.x)**2+(p.y-surge.y)**2<(p.r+13)**2){onPickup(p,pi,surge.x,surge.y,true);break;}}
    if(state!=='play')return;
    if(surge.timer<=0&&surge.state==='live'){surge.state='idle';surge.timer=SURGE_IDLE;}
  }
}

/* ================= DRAWING ================= */
function eob(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function visR(p,t){const b=VIS*(1+.3*Math.min(1,p.boost/2));return b*(1+.035*Math.sin(t*2.6+(p===p1?0:2)));}

function drawPlayerBody(p){
  const g=ctx.createRadialGradient(p.x-4,p.y-5,2,p.x,p.y,p.r);
  g.addColorStop(0,p.lite);g.addColorStop(.55,p.c);g.color=g;g.addColorStop(1,p.dark);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.4;ctx.stroke();
  if(p.num){ctx.fillStyle='rgba(8,16,24,.85)';ctx.font='700 13px "Trebuchet MS",Verdana,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.num,p.x,p.y+.5);}
  if(p.boost>0){const a=Math.min(1,p.boost/.5)*(.5+.5*Math.sin(nowGlobal/60));
    ctx.strokeStyle='rgba('+p.rgb+','+a+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r+4.5,0,7);ctx.stroke();}
}
function drawGemsNow(){
  for(const gm of gems){
    const s=eob(gm.t),bob=Math.sin(nowGlobal/480+gm.ph)*2.5;
    ctx.save();ctx.translate(gm.x,gm.y+bob);ctx.rotate(Math.PI/4+nowGlobal/1400);
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(0,0,0,0,0,18*s);
    g.addColorStop(0,'rgba('+GEMRGB+',.5)');g.addColorStop(1,'rgba('+GEMRGB+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,18*s,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    const r=6.5*s;
    ctx.fillStyle='#ffdf8e';ctx.fillRect(-r,-r,r*2,r*2);
    ctx.strokeStyle='rgba(255,240,190,.9)';ctx.lineWidth=1.4;ctx.strokeRect(-r,-r,r*2,r*2);
    ctx.fillStyle='rgba(255,255,255,.95)';ctx.fillRect(-r*.4,-r*.4,r*.8,r*.8);
    ctx.restore();
  }
  if(surge.state==='live'){
    const s=eob(surge.t),t=nowGlobal/1000;
    ctx.save();ctx.translate(surge.x,surge.y);
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(0,0,0,0,0,34*s);
    g.addColorStop(0,'rgba('+GEMRGB+',.75)');g.addColorStop(1,'rgba('+GEMRGB+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,34*s,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.rotate(Math.PI/4+t*.8);
    const r=11*s;
    ctx.fillStyle='#ffd257';ctx.fillRect(-r,-r,r*2,r*2);
    ctx.strokeStyle='rgba(255,250,220,.95)';ctx.lineWidth=2;ctx.strokeRect(-r,-r,r*2,r*2);
    ctx.rotate(-Math.PI/4-t*.8);
    ctx.fillStyle='#3a2604';ctx.font='900 13px Impact,"Arial Black",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('2',0,.5);
    ctx.restore();
  }
}
function drawSpores(){ctx.fillStyle='rgba(160,215,245,.1)';
  for(const s of spores){ctx.beginPath();ctx.arc(s.x+Math.sin(s.ph)*8,s.y,1.4,0,7);ctx.fill();}}
function drawFog(){
  fg.globalCompositeOperation='source-over';
  fg.fillStyle='rgba(4,9,15,.93)';fg.fillRect(0,0,mw,mh);
  fg.globalCompositeOperation='destination-out';
  const t=nowGlobal/1000,Ls=[];
  if(state==='menu')Ls.push([bots[0].x,bots[0].y,VIS],[bots[1].x,bots[1].y,VIS]);
  else Ls.push([p1.x,p1.y,visR(p1,t)],[p2.x,p2.y,visR(p2,t)]);
  for(const L of Ls){const g=fg.createRadialGradient(L[0],L[1],0,L[0],L[1],L[2]);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');
    fg.fillStyle=g;fg.beginPath();fg.arc(L[0],L[1],L[2],0,7);fg.fill();}
  for(const gm of gems){const rr=P*.55,g=fg.createRadialGradient(gm.x,gm.y,0,gm.x,gm.y,rr);
    g.addColorStop(0,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');
    fg.fillStyle=g;fg.beginPath();fg.arc(gm.x,gm.y,rr,0,7);fg.fill();}
  if(surge.state==='live'){const rr=P*2.4,g=fg.createRadialGradient(surge.x,surge.y,0,surge.x,surge.y,rr);
    g.addColorStop(0,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');
    fg.fillStyle=g;fg.beginPath();fg.arc(surge.x,surge.y,rr,0,7);fg.fill();}
  ctx.drawImage(fogC,0,0);
}
function drawRings(){
  for(const rg of rings){const k=rg.t/rg.dur;
    ctx.globalAlpha=(1-k)*.9;ctx.strokeStyle='rgba('+rg.rgb+',1)';ctx.lineWidth=3*(1-k)+1;
    ctx.beginPath();ctx.arc(rg.x,rg.y,10+k*95,0,7);ctx.stroke();}
  ctx.globalAlpha=1;
}
function drawParts(){
  for(const q of parts){const a=Math.max(0,q.life/q.max);
    if(q.glow)ctx.globalCompositeOperation='lighter';else ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba('+q.rgb+','+(a*(q.glow?.9:.85))+')';
    if(q.rot!==undefined){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);
      ctx.fillRect(-q.size/2,-q.size/2,q.size,q.size*.7);ctx.restore();}
    else{ctx.beginPath();ctx.arc(q.x,q.y,q.size*a+.4,0,7);ctx.fill();}}
  ctx.globalCompositeOperation='source-over';
}
function drawSurgeBeacon(){
  const t=nowGlobal/1000,x=surge.x,y=surge.y;
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba('+GEMRGB+','+(.5+.4*Math.sin(t*6))+')';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,14+3*Math.sin(t*5),0,7);ctx.stroke();
  for(let i=0;i<4;i++){const a=t*1.2+i*Math.PI/2;
    ctx.beginPath();ctx.moveTo(x+Math.cos(a)*8,y+Math.sin(a)*8);
    ctx.lineTo(x+Math.cos(a)*19,y+Math.sin(a)*19);ctx.stroke();}
  ctx.fillStyle='rgba(255,246,214,.9)';ctx.beginPath();ctx.arc(x,y,4.5,0,7);ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

function render(){
  const w=innerWidth,h=innerHeight;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#070f16';ctx.fillRect(0,0,w,h);
  const amb=ctx.createRadialGradient(w/2,h*.42,0,w/2,h*.42,Math.max(w,h)*.75);
  amb.addColorStop(0,'rgba(30,66,92,.32)');amb.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=amb;ctx.fillRect(0,0,w,h);

  const padT=state==='menu'?26:80,padB=state==='menu'?26:42;
  const s=Math.max(.3,Math.min((w-24)/mw,(h-padT-padB)/mh));
  const ox=(w-mw*s)/2+(Math.random()*2-1)*shake,oy=padT+(h-padT-mh*s)/2+(Math.random()*2-1)*shake;

  ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);
  ctx.drawImage(mazeC,0,0);
  drawSpores();drawGemsNow();
  if(state==='menu'){drawPlayerBody(bots[0]);drawPlayerBody(bots[1]);}
  else{drawPlayerBody(p1);drawPlayerBody(p2);}
  drawFog();

  ctx.globalCompositeOperation='lighter';
  let haloL;
  if(state==='menu')haloL=[{x:bots[0].x,y:bots[0].y,r:VIS*.75,rgb:P1C.rgb},{x:bots[1].x,y:bots[1].y,r:VIS*.75,rgb:P2C.rgb}];
  else haloL=[{x:p1.x,y:p1.y,r:visR(p1,nowGlobal/1000)*.8,rgb:P1C.rgb},{x:p2.x,y:p2.y,r:visR(p2,nowGlobal/1000)*.8,rgb:P2C.rgb}];
  for(const L of haloL){const g=ctx.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r);
    g.addColorStop(0,'rgba('+L.rgb+',.16)');g.addColorStop(.5,'rgba('+L.rgb+',.07)');g.addColorStop(1,'rgba('+L.rgb+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(L.x,L.y,L.r,0,7);ctx.fill();}
  drawRings();
  ctx.globalCompositeOperation='source-over';
  drawParts();
  if(surge.state==='live')drawSurgeBeacon();
  ctx.restore();

  ctx.fillStyle=vig;ctx.fillRect(0,0,w,h);

  const tcx=ox+mw*s/2,tcy=oy+mh*s/2;
  if(state==='count'){
    const num=Math.max(1,Math.ceil(countT)),frac=countT-Math.floor(countT);
    const size=Math.min(w,h)*.2*(1+(1-frac)*.3);
    ctx.font='900 '+size+'px Impact,"Arial Black",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(255,210,87,.9)';ctx.shadowBlur=32;
    ctx.fillStyle='rgba(240,248,255,'+(.25+.75*frac)+')';
    ctx.fillText(num,tcx,tcy);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
  }
  if(goT>0&&state==='play'){
    const k=goT/.6,size=Math.min(w,h)*.18*(1+(1-k)*.6);
    ctx.font='900 '+size+'px Impact,"Arial Black",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(255,170,40,.9)';ctx.shadowBlur=34;
    ctx.fillStyle='rgba(255,210,87,'+k+')';
    ctx.fillText('GO!',tcx,tcy);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
  }
  hudSurge();
}

/* ================= HUD & SCREENS ================= */
function buildPips(){pipsEls.forEach(el=>{el.innerHTML='';for(let i=0;i<TARGET;i++){const s=document.createElement('span');s.className='pip';el.appendChild(s);}});}
function updatePips(idx){
  pipsEls.forEach((el,i)=>[...el.children].forEach((s,j)=>s.classList.toggle('on',j<scores[i])));
  if(idx!==undefined&&idx>=0){const pn=panels[idx];pn.classList.remove('bump');void pn.offsetWidth;pn.classList.add('bump');}
}
function hudSurge(){
  if(state!=='play'&&state!=='count'){surgeEl.textContent='';return;}
  if(surge.state==='live'){if(surgeEl.dataset.s!=='L'){surgeEl.dataset.s='L';surgeEl.className='surge live';surgeEl.textContent='\u26A1 SURGE LIVE \u2014 WORTH 2';}}
  else{const sec=Math.max(0,Math.ceil(surge.timer));if(sec!==lastSec){lastSec=sec;surgeEl.dataset.s='I';surgeEl.className='surge';
    surgeEl.textContent='NEXT SURGE '+String(sec).padStart(2,'0')+'s';}}
}
function fmt(t){const m=(t/60)|0,s=(t%60)|0;return m+':'+String(s).padStart(2,'0');}

function showWin(){
  const col=winner===0?P1C:P2C;
  overlay.classList.remove('hidden');
  overlay.innerHTML=
   '<div class="card">'+
   '<div class="kicker"><span class="ln"></span>MATCH OVER<span class="ln"></span></div>'+
   '<h2 class="win display" style="color:'+col.c+';text-shadow:0 0 34px rgba('+col.rgb+',.65),0 4px 0 rgba(0,0,0,.5)">'+col.name+' WINS</h2>'+
   '<div class="scoreline display">'+scores[0]+' \u2014 '+scores[1]+'</div>'+
   '<div class="chips"><span class="chip">\u23F1 TIME<b>'+fmt(matchTime)+'</b></span><span class="chip">\uD83D\uDCA5 CLASHES<b>'+clashes+'</b></span><span class="chip">\u26A5 SURGES<b>'+surgeTaken[0]+' \u2013 '+surgeTaken[1]+'</b></span></div>'+
   '<button id="btnAgain" class="btn display">REMATCH \u00B7 NEW MAZE</button>'+
   '<div class="hint">press ENTER or R</div></div>';
  document.getElementById('btnAgain').onclick=()=>{audio();sUI();startMatch();};
}
function showPause(){
  overlay.classList.remove('hidden');
  overlay.innerHTML='<div class="card narrow"><h2 class="display paused-t">PAUSED</h2><p class="hint" style="margin-top:18px">P \u2014 RESUME &nbsp;\u00B7&nbsp; R \u2014 NEW MAZE</p></div>';
}
function togglePause(){
  if(state==='play'){state='pause';showPause();}
  else if(state==='pause'){state='play';overlay.classList.add('hidden');sUI();}
}

/* ================= INPUT ================= */
addEventListener('keydown',e=>{
  audio();
  const c=e.code;
  if(c==='ArrowUp'||c==='ArrowDown'||c==='ArrowLeft'||c==='ArrowRight'||c==='Space')e.preventDefault();
  keys[c]=1;
  if(c==='Enter'||c==='NumpadEnter'){
    if(state==='menu')startMatch();
    else if(state==='over'&&overlayShown)startMatch();
    else if(state==='pause')togglePause();
  }
  if(c==='KeyR'&&state!=='menu')startMatch();
  if((c==='KeyP'||c==='Escape')&&(state==='play'||state==='pause'))togglePause();
});
addEventListener('keyup',e=>{keys[e.code]=0;});
addEventListener('blur',()=>{keys={};if(state==='play'){state='pause';showPause();}});
addEventListener('pointerdown',audio);

/* ================= LOOP & BOOT ================= */
function frame(now){nowGlobal=now;requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  update(dt);render();}

document.getElementById('ftN').textContent=TARGET;
buildPips();
genMenu();
showStart();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
