<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PAC-PONG</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04050c;}
  #c{position:fixed;inset:0;display:block;touch-action:none;}
  .crt{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      repeating-linear-gradient(0deg, rgba(3,6,18,.20) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 55%, rgba(2,3,10,.55) 100%);
    animation:flick 3.4s infinite steps(60);}
  @keyframes flick{0%,100%{opacity:.9}50%{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="crt"></div>
<script>
(function(){
'use strict';
/* ============================== SETUP ============================== */
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,U=1;
var COLS=24, ROWS=13, WINSCORE=7, SERVE_T=1.05, FRIGHT_DUR=4;
var ACC=['#ffe600','#ff7ad9'];
var GCOLS=['#ff2b2b','#ffb8ff','#00ffff','#ffb852'];

/* ============================== PIXEL FONT ============================== */
var FONT={A:[14,17,17,31,17,17,17],B:[30,17,30,17,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],E:[31,16,30,16,16,16,31],F:[31,16,30,16,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,25,21,19,17,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,27,17],X:[17,17,10,4,10,17,17],Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,6,8,16,31],'3':[30,1,1,14,1,1,30],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[14,16,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,1,14],'-':[0,0,0,31,0,0,0],'/':[1,2,2,4,8,8,16],'!':[4,4,4,4,4,0,4],':':[0,4,4,0,4,4,0],'.':[0,0,0,0,0,0,4],'>':[16,8,4,2,4,8,16],' ':[0,0,0,0,0,0,0]};
function text(s,x,y,scale,col,align,wob){
  s=String(s).toUpperCase();
  var w=s.length*6*scale-scale;
  if(align==='center')x-=w/2; else if(align==='right')x-=w;
  ctx.fillStyle=col;
  for(var i=0;i<s.length;i++){
    var g=FONT[s[i]]; if(!g)continue;
    var dx=x+i*6*scale, dy=y+(wob?wob(i):0);
    for(var r=0;r<7;r++){var bits=g[r];if(!bits)continue;
      for(var c=0;c<5;c++)if(bits&(1<<(4-c)))ctx.fillRect(dx+c*scale,dy+r*scale,scale,scale);}
  }
}
function tw(s,scale){return String(s).length*6*scale-scale;}

/* ============================== AUDIO ============================== */
var A={ctx:null,master:null,muted:false};
function audioInit(){
  if(!A.ctx){try{var AC=window.AudioContext||window.webkitAudioContext;A.ctx=new AC();
    A.master=A.ctx.createGain();A.master.gain.value=0.5;A.master.connect(A.ctx.destination);}catch(e){}}
  if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
}
function tone(type,f0,f1,dur,vol,delay){
  if(!A.ctx||A.muted)return; delay=delay||0;
  var t0=A.ctx.currentTime+delay,o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t0);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(A.master);o.start(t0);o.stop(t0+dur+0.03);
}
var sfx={
  chomp:function(){tone('square',300,80,0.09,0.5);tone('square',240,60,0.09,0.4,0.05);},
  paddle:function(){tone('triangle',340,560,0.07,0.5);},
  wall:function(){tone('square',190,150,0.05,0.28);},
  pellet:function(n){var f=520*Math.pow(1.06,n||0);tone('sine',f,f*1.4,0.07,0.3);},
  power:function(){[523,659,784,1047].forEach(function(f,i){tone('square',f,f,0.09,0.3,i*0.08);});},
  score:function(){tone('sawtooth',300,90,0.35,0.4);[660,520,390,260].forEach(function(f,i){tone('square',f,f,0.07,0.25,0.1+i*0.07);});},
  count:function(){tone('square',440,440,0.06,0.3);},
  go:function(){tone('square',880,880,0.12,0.35);},
  win:function(){[392,523,659,784,659,1047].forEach(function(f,i){tone('triangle',f,f,0.14,0.35,i*0.12);});},
  click:function(){tone('square',700,900,0.05,0.25);}
};

/* ============================== STATE ============================== */
var state='menu', t=0, mode=0;
var scores=[0,0], rally=0, bestRally=0;
var pendingWinner=-1, winner=-1, lastScorer=-1;
var shake=0, flashT=0, flashSide=0, confT=0, stateT=0;
var menuSel=0, menuRects=[{x:0,y:0,w:0,h:0},{x:0,y:0,w:0,h:0}];
var p=[{side:0,y:0,vy:0,chomp:0,pt:null},{side:1,y:0,vy:0,chomp:0,pt:null}];
var b={x:0,y:0,vx:0,vy:0,r:12,speed:400,fright:0,flash:0,color:'#ff2b2b',trail:[],lastHit:-1,lx:1,ly:0,demo:false};
var eaten=new Set(), present=0, eatenCount=0;
var power={c:5,r:3,timer:6};
var parts=[], pops=[];
var keys={};
try{bestRally=+localStorage.getItem('pacpong_best')||0;}catch(e){}

function hash2(x,y){var n=(x*73856093)^(y*19349663);n=(n^(n>>13))>>>0;return (n%1000)/1000;}
function cellX(c){return (c+0.5)*W/COLS;}
function cellY(r){return (r+0.5)*H/ROWS;}
function inField(x,y){return x>95*U&&x<W-95*U&&y>26*U&&y<H-26*U;}
function presence(c,r){var x=cellX(c),y=cellY(r);if(!inField(x,y))return false;return hash2(c+31,r+7)<0.52;}

/* ============================== RESIZE ============================== */
var bg=document.createElement('canvas');
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  if(W>0){
    var sx=w/W,sy=h/H,i;
    for(i=0;i<2;i++){p[i].y*=sy;p[i].vy*=sy;}
    b.x*=sx;b.y*=sy;b.vx*=sx;b.vy*=sy;
  }
  W=w;H=h;U=Math.max(0.5,Math.min(W/1280,H/720));
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  b.r=12*U;p[0].r=p[1].r=20*U;
  present=0;
  for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++)if(presence(c,r))present++;
  buildBG();
}
function buildBG(){
  bg.width=W*DPR;bg.height=H*DPR;
  var g=bg.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);
  var grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#070a1c');grd.addColorStop(0.5,'#04060f');grd.addColorStop(1,'#070a1c');
  g.fillStyle=grd;g.fillRect(0,0,W,H);
  var step=Math.max(36,48*U),k,i;
  for(k=step;k<W;k+=step){
    for(i=0;i<H/step+1;i++){
      if(hash2(Math.round(k/step),i)<0.55)continue;
      g.fillStyle='rgba(43,76,255,0.085)';g.fillRect(k-1.5,i*step,3,step*0.62);
    }
  }
  for(k=step;k<H;k+=step){
    for(i=0;i<W/step+1;i++){
      if(hash2(i,Math.round(k/step)+99)<0.55)continue;
      g.fillStyle='rgba(43,76,255,0.085)';g.fillRect(i*step,k-1.5,step*0.62,3);
    }
  }
}

/* ============================== FLOW ============================== */
function saveBest(){try{localStorage.setItem('pacpong_best',String(bestRally));}catch(e){}}
function serve(dir,demo){
  b.demo=!!demo;
  b.x=W/2;b.y=H/2;b.speed=400*U;b.fright=0;b.flash=0;b.trail.length=0;b.lastHit=-1;
  var a=(Math.random()*0.9-0.45);
  if(dir===undefined)dir=Math.random()<0.5?-1:1;
  b.vx=Math.cos(a)*b.speed*dir;b.vy=Math.sin(a)*b.speed;
  b.lx=b.vx;b.ly=b.vy;
  var nc;do{nc=GCOLS[(Math.random()*GCOLS.length)|0];}while(nc===b.color&&GCOLS.length>1);
  b.color=nc;
  state='serve';stateT=0;
}
function startMatch(m){mode=m;scores=[0,0];rally=0;pendingWinner=-1;winner=-1;lastScorer=-1;
  eaten.clear();eatenCount=0;parts.length=0;pops.length=0;
  p[0].y=H*0.4;p[1].y=H*0.6;serve(undefined,false);sfx.go();}
function toMenu(){state='menu';menuSel=0;winner=-1;pendingWinner=-1;rally=0;
  parts.length=0;pops.length=0;p[0].y=H*0.4;p[1].y=H*0.6;serve(undefined,true);}

/* ============================== INPUT ============================== */
function humanCtrl(i,dt){
  var up=(i===0)?(keys.KeyW||keys.ArrowUp):(keys.KeyW);
  var dn=(i===0)?(keys.KeyS||keys.ArrowDown):(keys.KeyS);
  if(mode===0&&i===0){up=keys.KeyW||keys.ArrowUp;dn=keys.KeyS||keys.ArrowDown;}
  var want=((dn?1:0)-(up?1:0))*620*U;
  if(p[i].pt!=null)want=Math.max(-700*U,Math.min(700*U,(p[i].pt-p[i].y)*12));
  p[i].vy+=(want-p[i].vy)*Math.min(1,dt*18);
  p[i].y+=p[i].vy*dt;
}
function aiCtrl(i,dt){
  var toward=(i===0)?(b.vx<0):(b.vx>0);
  var target=toward?b.y+Math.sign(b.vy||1)*b.r*0.4:H/2;
  var maxV=b.demo?380*U:455*U;
  var want=Math.max(-maxV,Math.min(maxV,(target-p[i].y)*6));
  p[i].vy+=(want-p[i].vy)*Math.min(1,dt*9);
  p[i].y+=p[i].vy*dt;
}
function ctrlPaddles(dt){
  for(var i=0;i<2;i++){
    var human=(state!=='menu')&&(i===0||(mode===1&&i===1));
    if(human)humanCtrl(i,dt);else aiCtrl(i,dt);
    var lo=p[i].r+6,hi=H-p[i].r-6;
    if(p[i].y<lo){p[i].y=lo;if(p[i].vy<0)p[i].vy=0;}
    if(p[i].y>hi){p[i].y=hi;if(p[i].vy>0)p[i].vy=0;}
    p[i].chomp=Math.max(0,p[i].chomp-dt);
  }
}

/* ============================== PHYSICS ============================== */
function hitPaddle(i){
  var px=p[i].side===0?46*U:W-46*U, py=p[i].y, R=p[i].r+b.r;
  var dx=b.x-px, dy=b.y-py, d=Math.hypot(dx,dy);
  if(d>=R)return false;
  var toward=(i===0)?(b.vx<=0):(b.vx>=0);
  if(!toward&&d>R*0.6){var nx=dx/(d||1),ny=dy/(d||1);b.x=px+nx*R;b.y=py+ny*R;return false;}
  var off=Math.max(-1,Math.min(1,(b.y-py)/p[i].r));
  var ang=off*1.05*Math.PI/2;
  b.speed=Math.min(b.speed*1.045*(b.fright>0?1.02:1),900*U);
  var dir=i===0?1:-1;
  b.vx=Math.cos(ang)*b.speed*dir;
  b.vy=Math.sin(ang)*b.speed+p[i].vy*0.22;
  if(Math.abs(b.vy)<40*U)b.vy=(b.vy<0?-1:1)*40*U;
  var nx=dx/(d||1),ny=dy/(d||1);
  b.x=px+nx*R;b.y=py+ny*R;
  p[i].chomp=0.26;b.flash=0.09;b.lastHit=i;
  if(!b.demo){
    rally++;if(rally>bestRally)bestRally=rally;
    if(rally%6===0&&b.lastHit>=0){scores[b.lastHit]+=1;
      pops.push({x:W/2,y:H*0.3,txt:'RALLY +1',col:ACC[b.lastHit],t:0,life:0.9});}
  }
  for(var k=0;k<7;k++)parts.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*260*U,vy:(Math.random()-0.5)*260*U,
    life:0.3+Math.random()*0.2,max:0.5,sz:2+Math.random()*2,col:'#ffffff'});
  shake=Math.max(shake,3*U);
  if(!b.demo)sfx.paddle();
  return true;
}
function physics(dt){
  var S=2,i,sdt;
  for(i=0;i<S;i++){
    sdt=dt/S;
    b.x+=b.vx*sdt;b.y+=b.vy*sdt;
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);if(!b.demo)sfx.wall();
      parts.push({x:b.x,y:2,vx:(Math.random()-0.5)*120*U,vy:80*U,life:0.25,max:0.25,sz:2,col:'#7f9bff'});}
    if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy);if(!b.demo)sfx.wall();
      parts.push({x:b.x,y:H-2,vx:(Math.random()-0.5)*120*U,vy:-80*U,life:0.25,max:0.25,sz:2,col:'#7f9bff'});}
    hitPaddle(0);hitPaddle(1);
  }
  b.lx=b.vx;b.ly=b.vy;
  if(b.fright>0)b.fright=Math.max(0,b.fright-dt);
  b.flash=Math.max(0,b.flash-dt);
  b.trail.push({x:b.x,y:y_(),col:b.color});
  function y_(){return b.y;}
  while(b.trail.length>9)b.trail.shift();
  if(state!=='menu')eatPellets(dt);
}

/* ============================== PELLETS ============================== */
function eatPellets(dt){
  var c0=Math.max(0,Math.floor((b.x/W)*COLS)-1),c1=Math.min(COLS-1,Math.ceil((b.x/W)*COLS)+1);
  var r0=Math.max(0,Math.floor((b.y/H)*ROWS)-1),r1=Math.min(ROWS-1,Math.ceil((b.y/H)*ROWS)+1);
  for(var c=c0;c<=c1;c++)for(var r=r0;r<=r1;r++){
    var key=c+','+r;
    if(eaten.has(key)||!presence(c,r))continue;
    var dx=b.x-cellX(c),dy=b.y-cellY(r);
    if(dx*dx+dy*dy<(b.r+7*U)*(b.r+7*U)){
      eaten.add(key);eatenCount++;
      for(var k=0;k<5;k++)parts.push({x:cellX(c),y:cellY(r),vx:(Math.random()-0.5)*200*U,vy:(Math.random()-0.5)*200*U,
        life:0.3,max:0.3,sz:1.8+Math.random()*1.6,col:'#ffd9a8'});
      var pts=0;
      if(b.lastHit>=0)pts=b.fright>0?2:1;
      if(pts){scores[b.lastHit]+=pts;pops.push({x:cellX(c),y:cellY(r)-8*U,txt:'+'+pts,col:ACC[b.lastHit],t:0,life:0.7});}
      sfx.pellet(Math.min(12,rally));
      if(eatenCount>=present*0.85){eaten.clear();eatenCount=0;
        pops.push({x:W/2,y:H*0.35,txt:'WAKA RAIN',col:'#ffe600',t:0,life:1});sfx.power();
        for(k=0;k<40;k++)parts.push({x:Math.random()*W,y:Math.random()*H,vx:0,vy:-20*U,life:0.5,max:0.5,sz:2,col:'#ffd9a8'});}
    }
  }
  var pc=cellX(power.c),pr=cellY(power.r);
  var pdx=b.x-pc,pdy=b.y-pr;
  if(pdx*pdx+pdy*pdy<(b.r+10*U)*(b.r+10*U)){
    b.fright=FRIGHT_DUR;b.speed=Math.min(b.speed*1.28,950*U);
    var pts2=b.lastHit>=0?5:0;
    if(pts2){scores[b.lastHit]+=pts2;pops.push({x:pc,y:pr-14*U,txt:'+'+pts2,col:'#ffffff',t:0,life:0.9});}
    pops.push({x:pc,y:pr,txt:b.fright>0?'FRIGHT! 2X PTS':'FRIGHT!',col:'#8f8fff',t:0,life:1});
    sfx.power();shake=Math.max(shake,4*U);
    power.timer=6+Math.random()*8;newPowerCell(pc,pr);
  }
}
function newPowerCell(ox,oy){
  for(var tries=0;tries<50;tries++){
    var c=2+((Math.random()*(COLS-4))|0),r=1+((Math.random()*(ROWS-2))|0);
    if(Math.abs(cellX(c)-ox)+Math.abs(cellY(r)-oy)<W*0.25)continue;
    power.c=c;power.r=r;return;
  }
}

/* ============================== GOAL / POINT ============================== */
function goal(scorer){
  lastScorer=scorer;
  var pts=b.fright>0?2:1;
  scores[scorer]+=pts;
  if(rally>bestRally)bestRally=rally;
  saveBest();
  shake=13*U;flashT=0.35;flashSide=scorer;
  var gx=scorer===0?W-40*U:40*U;
  pops.push({x:gx,y:H/2,txt:'+'+pts,col:ACC[scorer],t:0,life:1.1});
  for(var k=0;k<26;k++)parts.push({x:gx,y:b.y,vx:(scorer===0?-1:1)*(60+Math.random()*300)*U,vy:(Math.random()-0.5)*400*U,
    life:0.6,max:0.6,sz:2+Math.random()*3,col:k%2?b.color:'#ffffff'});
  if(!b.demo)sfx.score();
  pendingWinner=scores[scorer]>=WINSCORE?scorer:-1;
  state='point';stateT=0;
}

/* ============================== UPDATE ============================== */
function update(dt){
  t+=dt;
  shake=Math.max(0,shake-dt*40);
  flashT=Math.max(0,flashT-dt);
  for(var i=parts.length-1;i>=0;i--){var q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=(1-2.5*dt);q.vy*=(1-2.5*dt);}
  for(i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>pops[i].life)pops.splice(i,1);}

  if(state==='pause')return;

  if(state==='menu'){
    ctrlPaddles(dt);
    if(b.demo)physics(dt);
    else serve(undefined,true);
    return;
  }
  if(state==='serve'){
    ctrlPaddles(dt);
    stateT+=dt;
    var num=Math.ceil((SERVE_T-stateT)/(SERVE_T/3));
    if(num!==update._n){update._n=num;if(!b.demo)sfx.count();}
    b.x=W/2+Math.sin(t*4)*5*U;b.y=H/2+Math.cos(t*3.1)*7*U;
    if(stateT>=SERVE_T){state='play';if(!b.demo)sfx.go();}
    return;
  }
  if(state==='play'){
    ctrlPaddles(dt);
    physics(dt);
    power.timer-=dt;
    if(power.timer<=0)newPowerCell(cellX(power.c),cellY(power.r));
    if(b.x<-26*U)goal(1);
    else if(b.x>W+26*U)goal(0);
    return;
  }
  if(state==='point'){
    ctrlPaddles(dt);stateT+=dt;
    if(stateT>1.25){
      if(pendingWinner>=0){winner=pendingWinner;pendingWinner=-1;state='over';stateT=0;confT=0;sfx.win();}
      else serve(lastScorer===0?1:-1,false);
    }
    return;
  }
  if(state==='over'){
    stateT+=dt;confT-=dt;
    if(confT<=0){confT=0.07;
      var cols=['#ffe600','#ff2b2b','#ffb8ff','#00ffff','#ffb852'];
      parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-0.5)*40*U,vy:(60+Math.random()*120)*U,
        life:4,max:4,sz:2+Math.random()*3,col:cols[(Math.random()*cols.length)|0]});}
  }
}

/* ============================== DRAW HELPERS ============================== */
function drawPac(x,y,r,face,mouth,col){
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.arc(x,y,r,face+mouth,face-mouth+2*Math.PI);
  ctx.closePath();ctx.fill();
}
function drawGhostShape(x,y,r,col,fright,flash,jit){
  if(flight)jx+=Math.sin(t*30)*1.5*U;
  var fill=flash>0?'#ffffff':(fright?'#2121f4':col);
  ctx.fillStyle=fill;ctx.beginPath();
  ctx.arc(x,y-r*0.2,r,Math.PI,0);
  ctx.lineTo(x+r,y+r*0.55);
  var n=3,sw=(2*r)/n,i;
  for(i=0;i<n;i++){var x1=x+r-sw*i;ctx.quadraticCurveTo(x1-sw/2,y+r*0.98,x1-sw,y+r*0.55);}
  ctx.closePath();ctx.fill();
  if(flight){
    ctx.fillStyle='#e8e8ff';
    ctx.fillRect(x-r*0.45,y-r*0.35,r*0.22,r*0.22);ctx.fillRect(x+r*0.23,y-r*0.35,r*0.22,r*0.22);
    ctx.strokeStyle='#e8e8ff';ctx.lineWidth=Math.max(1.5,r*0.14);ctx.beginPath();
    var my=y+r*0.18;
    for(i=0;i<=6;i++){var zx=x-r*0.7+i*(r*1.4/6),zy=my+(i%2?r*0.18:-r*0.18);
      if(i===0)ctx.moveTo(zx,zy);else ctx.lineTo(zx,zy);}
    ctx.stroke();
  }else{
    var lx=b.lx,ly=b.ly,l=Math.hypot(lx,ly)||1;lx/=l;ly/=l;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.ellipse(x-r*0.38+lx*r*0.1,y-r*0.22+ly*r*0.1,r*0.3,r*0.34,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+r*0.38+lx*r*0.1,y-r*0.22+ly*r*0.1,r*0.3,r*0.34,0,0,7);ctx.fill();
    ctx.fillStyle='#1b1b6f';
    ctx.beginPath();ctx.arc(x-r*0.38+lx*r*0.2,y-r*0.22+ly*r*0.2,r*0.15,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*0.38+lx*r*0.2,y-r*0.22+ly*r*0.2,r*0.15,0,7);ctx.fill();
  }
}

/* ============================== DRAW ============================== */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  var sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.translate(sx,sy);
  ctx.drawImage(bg,0,0,W,H);

  /* goal glows */
  var proxL=Math.max(0,1-b.x/(W*0.4)),proxR=Math.max(0,1-(W-b.x)/(W*0.4));
  var g1=ctx.createLinearGradient(0,0,W*0.16,0);
  g1.addColorStop(0,'rgba(255,230,0,'+(0.05+0.22*proxL)+')');g1.addColorStop(1,'rgba(255,230,0,0)');
  ctx.fillStyle=g1;ctx.fillRect(0,0,W*0.16,H);
  var g2=ctx.createLinearGradient(W,0,W-W*0.16,0);
  g2.addColorStop(0,'rgba(255,122,217,'+(0.05+0.22*proxR)+')');g2.addColorStop(1,'rgba(255,122,217,0)');
  ctx.fillStyle=g2;ctx.fillRect(W-W*0.16,0,W*0.16,H);

  /* center line */
  ctx.save();
  ctx.strokeStyle='rgba(130,150,255,'+(0.28+0.1*Math.sin(t*2))+')';
  ctx.lineWidth=3*U;ctx.setLineDash([12*U,16*U]);
  ctx.beginPath();ctx.moveTo(W/2,14);ctx.lineTo(W/2,H-14);ctx.stroke();
  ctx.restore();

  /* pellets */
  ctx.fillStyle='rgba(255,217,168,0.9)';
  ctx.beginPath();
  for(var c=0;c<COLS;c++)for(var r=0;r<ROWS;r++){
    if(!presence(c,r)||eaten.has(c+','+r))continue;
    var px=cellX(c),py=cellY(r);
    ctx.moveTo(px+3.4*U,py);ctx.arc(px,py,3.4*U,0,7);
  }
  ctx.fill();
  /* power pellet */
  if(state!=='pause'){
    var pw=cellX(power.c),pry=cellY(power.r);
    var bl=0.6+0.4*Math.sin(t*8),pu=1+0.12*Math.sin(t*5);
    ctx.fillStyle='rgba(255,255,255,'+(0.18*bl)+')';
    ctx.beginPath();ctx.arc(pw,pry,16*U*pu,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,240,200,'+bl+')';
    ctx.beginPath();ctx.arc(pw,pry,9*U*pu,0,7);ctx.fill();
  }

  /* trail + ball */
  if(state==='play'||state==='serve'||state==='menu'){
    for(var i=0;i<b.trail.length;i++){var tr=b.trail[i];
      ctx.globalAlpha=0.16*(i/b.trail.length);
      ctx.fillStyle=tr.col;ctx.beginPath();ctx.arc(tr.x,tr.y,b.r*(0.4+0.5*i/b.trail.length),0,7);ctx.fill();}
    ctx.globalAlpha=1;
    if(state==='serve'){
      var a=Math.atan2(b.vy,b.vx);
      ctx.save();ctx.strokeStyle='rgba(255,255,255,'+(0.3+0.25*Math.sin(t*9))+')';
      ctx.lineWidth=2.5*U;ctx.setLineDash([6*U,8*U]);
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*110*U,b.y+Math.sin(a)*110*U);ctx.stroke();ctx.restore();
    }
    drawGhostShape(b.x,b.y,b.r,b.color,b.fright>0,b.flash,false);
  }

  /* paddles */
  for(i=0;i<2;i++){
    var pp=p[i],ppx=pp.side===0?46*U:W-46*U;
    var face=pp.side===0?0:Math.PI;
    var mouth=0.3+0.25*Math.abs(Math.sin(t*9+i*2))+Math.min(0.3,Math.abs(pp.vy)*0.0004);
    if(pp.chomp>0)mouth+=Math.sin((1-pp.chomp/0.26)*Math.PI)*0.85;
    mouth=Math.min(mouth,1.45);
    ctx.fillStyle='rgba(255,230,0,0.12)';
    ctx.beginPath();ctx.arc(ppx,pp.y,pp.r+7*U,0,7);ctx.fill();
    drawPac(ppx,pp.y,pp.r,face,mouth,'#ffe600');
  }

  /* particles + popups */
  for(i=0;i<parts.length;i++){var q=parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;
    ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
  ctx.globalAlpha=1;
  for(i=0;i<pops.length;i++){var po=pops[i],k=po.t/po.life;
    ctx.globalAlpha=k<0.7?1:(1-k)/0.3;
    text(po.txt,po.x,po.y-28*U*k,2.2*U,po.col,'center');}
  ctx.globalAlpha=1;

  /* score flash */
  if(flashT>0){var fa=flashT/0.35;
    var fg=ctx.createLinearGradient(flashSide===0?W:0,0,flashSide===0?W*0.45:W*0.55,0);
    fg.addColorStop(0,'rgba(255,255,255,'+(0.35*fa)+')');fg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);}

  /* ============================== HUD ============================== */
  if(state!=='menu'){
    var bigS=Math.max(2.2,3.4*U);
    text('FIRST TO '+WINSCORE,W/2,16*U,1.3*U,'rgba(150,170,255,0.55)','center');
    drawPac(W/2-95*U,H*0.1,bigS*4.2,0,0.5,'#ffe600');
    drawGhostShape(W/2+95*U,H*0.1,bigS*4.8,'#ffb8ff',false,false,false);
    text(mode===1?'P2':'CPU',W/2+95*U,30*U-bigS*0,1.6*U,ACC[1],'center');
    text('P1',W/2-95*U,30*U,1.6*U,ACC[0],'center');
    text(String(scores[0]),W/2-40*U,H*0.1-bigS*3.5,bigS,ACC[0],'right');
    text(String(scores[1]),W/2+40*U,H*0.1-bigS*3.5,bigS,ACC[1],'left');

    if(state==='play'&&rally>=3){
      var near=rally%6===5;
      text(near?'NEXT HIT = BONUS!':'RALLY '+rally,W/2,H*0.24,near?2.3*U:2*U,
        near?(Math.sin(t*14)>0?'#ffb852':'#fff'):'#ffffff','center');
    }
    if(b.fright>0){
      var bw=120*U,bx=W/2-bw/2,byy=H*0.3;
      ctx.fillStyle='rgba(40,40,180,0.5)';ctx.fillRect(bx,byy,bw,6*U);
      ctx.fillStyle='#8f8fff';ctx.fillRect(bx,byy,bw*(b.fright/FRIGHT_DUR),6*U);
      text('2X',bx-14*U,byy-4*U,1.8*U,'#8f8fff','right');
    }
    if(state==='serve'){
      var num=Math.max(1,Math.ceil((SERVE_T-stateT)/(SERVE_T/3)));
      text(String(num),W/2,H*0.62,5*U,'rgba(255,255,255,'+(0.5+0.4*Math.sin(t*10))+')','center');
    }
    if(state==='point'){
      var nm=lastScorer===0?'P1 SCORES!':(mode===1?'P2 SCORES!':'CPU SCORES!');
      text(nm,W/2,H*0.4,3.2*U,ACC[lastScorer],'center',function(i){return Math.sin(t*10+i)*2;});
    }
    if(state==='pause'){
      ctx.fillStyle='rgba(4,6,18,0.55)';ctx.fillRect(-20,-20,W+40,H+40);
      text('PAUSED',W/2,H*0.4,7*U,'#ffe600','center');
      text('P RESUME  R RESTART  ESC MENU',W/2,H*0.55,1.8*U,'rgba(200,215,255,0.8)','center');
    }
    if(state==='over'){
      ctx.fillStyle='rgba(4,6,18,0.7)';ctx.fillRect(-20,-20,W+40,H+40);
      for(i=0;i<parts.length;i++){q=parts[i];
        ctx.globalAlpha=Math.min(1,q.life);ctx.fillStyle=q.col;
        ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);}
      ctx.globalAlpha=1;
      var wtxt=(winner===0)?'PLAYER 1 WINS!':(mode===1?'PLAYER 2 WINS!':'CPU WINS!');
      var ws=Math.max(3,Math.min(W/(wtxt.length*5.6),H/18,13));
      text(wtxt,W/2,H*0.34,ws,ACC[winner],'center',function(i){return Math.sin(t*3+i*0.7)*4;});
      text(scores[0]+' - '+scores[1],W/2,H*0.5,4*U,'#ffffff','center');
      text('LONGEST RALLY: '+bestRally,W/2,H*0.6,2*U,'rgba(200,215,255,0.8)','center');
      if(Math.sin(t*4)>0)text('ENTER REMATCH   ESC MENU',W/2,H*0.72,2.2*U,'#ffe600','center');
    }
    var hint='P PAUSE  M SOUND  R RESTART  ESC MENU';
    if(mode===1)hint='P1 W/S   P2 UP/DOWN   '+hint; else hint='W/S OR UP/DOWN   '+hint;
    text(hint,W/2,H-20*U,1.4*U,'rgba(150,170,255,0.4)','center');
  }

  /* ============================== MENU ============================== */
  if(state==='menu'){
    ctx.fillStyle='rgba(4,6,18,0.6)';ctx.fillRect(-20,-20,W+40,H+40);
    var ls=Math.max(4,Math.min(W/58,H/17,20));
    text('PAC-PONG',W/2,H*0.22,ls,'#2121f4','center',function(i){return Math.sin(t*3+i*0.7)*3+3;});
    text('PAC-PONG',W/2,H*0.22,ls,'#ffe600','center',function(i){return Math.sin(t*3+i*0.7)*3;});
    text('A CHOMPING TAKE ON PONG',W/2,H*0.22+ls*8,Math.max(1.6,ls*0.4),'rgba(160,180,255,0.8)','center');

    var my=H*0.5,mx=((t*150)%(W+320))-160;
    for(i=3;i>=0;i--){var gx=mx-(i+1)*74*U;
      drawGhostShape(gx,my+Math.sin(t*6+i)*6*U,15*U,GCOLS[i],false,false,false);}
    drawPac(mx,my,18*U,0,0.35+0.4*Math.abs(Math.sin(t*11)),'#ffe600');

    var os=Math.max(2,Math.min(W/70,H/26,4)),oy=H*0.63;
    for(i=0;i<2;i++){
      var sel=menuSel===i,ox=W/2,ow=Math.max(tw('1P VS CPU',os),tw('2P VERSUS',os))+56*U;
      menuRects[i]={x:ox-ow/2,y:oy+i*(os*7+22)-os*4,w:ow,h:os*7+22};
      if(sel){ctx.strokeStyle='#ffe600';ctx.lineWidth=2.5*U;
        ctx.strokeRect(menuRects[i].x,menuRects[i].y,ow,os*7+22);
        drawPac(menuRects[i].x+16*U,oy+i*(os*7+22),9*U,0,0.3+0.4*Math.abs(Math.sin(t*10)),'#ffe600');}
      text(i===0?'1P VS CPU':'2P VERSUS',ox+10*U,oy+i*(os*7+22),os,sel?'#ffe600':'rgba(150,165,230,0.7)','center');
    }
    if(bestRally>0)text('TOP RALLY: '+bestRally,W/2,oy+2*(os*7+22)+8,Math.max(1.4,os*0.6),'rgba(255,184,82,0.85)','center');
    var cs=Math.max(1.3,Math.min(W/95,H/46,1.8));
    text('P1: W/S      P2: UP/DOWN',W/2,H*0.87,cs,'rgba(180,195,255,0.6)','center');
    text('ENTER START  P PAUSE  R RESTART  M SOUND  ESC MENU',W/2,H*0.87+cs*10,cs,'rgba(180,195,255,0.6)','center');
    if(Math.sin(t*4)>0)text('PRESS ENTER TO START',W/2,H*0.94,Math.max(1.8,os*0.7),'#ffffff','center');
  }

  /* mute chip */
  text(A.muted?'SOUND OFF':'SOUND ON',W-12,H-26,1.3*U,'rgba(150,170,255,'+(A.muted?0.4:0.7)+')','right');
}

/* ============================== EVENTS ============================== */
window.addEventListener('keydown',function(e){
  var c=e.code;
  if(c==='ArrowUp'||c==='ArrowDown'||c==='Space')e.preventDefault();
  audioInit();keys[c]=true;
  if(c==='KeyM'){A.muted=!A.muted;sfx.click();return;}
  if(state==='menu'){
    if(c==='Digit1'||c==='ArrowLeft'){menuSel=0;sfx.click();}
    else if(c==='Digit2'||c==='ArrowRight'){menuSel=1;sfx.click();}
    else if(c==='Enter'||c==='Space'){startMatch(menuSel);}
    return;
  }
  if(state==='over'){
    if(c==='Enter')startMatch(mode);
    else if(c==='Escape')toMenu();
    else if(c==='KeyR')startMatch(mode);
    return;
  }
  if(c==='KeyP'){
    if(state==='pause'){state=update._prev||'play';sfx.click();}
    else{update._prev=state;state='pause';sfx.click();}
    return;
  }
  if(c==='Escape'){toMenu();return;}
  if(c==='KeyR'&&state!=='pause')startMatch(mode);
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
function ptrY(e){var r=cv.getBoundingClientRect();return (e.clientY-r.top)*(H/r.height);}
function ptrX(e){var r=cv.getBoundingClientRect();return (e.clientX-r.left)*(W/r.width);}
window.addEventListener('pointerdown',function(e){
  audioInit();
  if(state==='menu'){
    for(var i=0;i<2;i++)if(ptrX(e)>=menuRects[i].x&&ptrX(e)<=menuRects[i].x+menuRects[i].w&&
      ptrY(e)>=menuRects[i].y&&ptrY(e)<=menuRects[i].y+menuRects[i].h){startMatch(i);return;}
    startMatch(menuSel);return;
  }
  if(state==='over'){startMatch(mode);return;}
  var side=ptrX(e)<W/2?0:1;
  if(mode===0)side=0;
  p[side].pt=ptrY(e);
});
window.addEventListener('pointermove',function(e){
  if(state==='menu'||state==='over'||state==='pause')return;
  var side=ptrX(e)<W/2?0:1;
  if(mode===0)side=0;
  p[side].pt=ptrY(e);
});
window.addEventListener('pointerup',function(){for(var i=0;i<2;i++)p[i].pt=null;});
window.addEventListener('resize',resize);

/* ============================== LOOP ============================== */
resize();toMenu();
var last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
