<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frog Tetris</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#04161b}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:default}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================== FROG TETRIS ============================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,uiS=1,hudH=64;
let cell=30,bx=0,by=0,bw=0,bh=0;
const COLS=10, ROWS=20, LANES=[4,8,12,16];
const TYPES=['I','O','T','S','Z','J','L'];
const TCOL={I:'#3fd0c9',O:'#f5b942',T:'#a78bfa',S:'#b7e04a',Z:'#ef6a5a',J:'#5aa0ef',L:'#f28bb8'};
const SHAPE={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
const TIDX={I:1,O:2,T:3,S:4,Z:5,J:6,L:7};
const CARCOLS=['#e4573d','#f2a93b','#5a8fd6','#e8e3d0'];
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ----------------------------- utils ----------------------------- */
function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function eob(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);}
function easeIO(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return 'rgb('+r+','+g+','+b+')';}
function F(sz,w){return (w||800)+' '+sz+'px "Trebuchet MS","Segoe UI",Verdana,sans-serif';}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

/* ----------------------------- audio ----------------------------- */
let AC=null,mg=null,muted=lsGet('ft.muted')==='1';
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=muted?0:0.5;mg.connect(AC.destination);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;delay=delay||0;const t0=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(Math.max(30,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1||f0),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(mg);o.start(t0);o.stop(t0+dur+0.03);
}
function noise(dur,vol,freq,delay){
  if(!AC||muted)return;delay=delay||0;const t0=AC.currentTime+delay;
  const n=Math.max(1,Math.floor(AC.sampleRate*dur));
  const buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=buf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(mg);s.start(t0);
}
const SFX={
  hop(){tone(500+Math.random()*90,760,0.06,'square',0.14);},
  land(){tone(140,62,0.12,'triangle',0.32);noise(0.08,0.12,420);},
  clear(n){const nt=[523,659,784];for(let i=0;i<nt.length;i++)tone(nt[i],nt[i],0.11,'square',0.2,i*0.07);if(n>=4){tone(1046,1046,0.14,'square',0.22,0.22);tone(1318,1318,0.18,'square',0.2,0.3);}},
  hit(){tone(200,45,0.3,'sawtooth',0.4);noise(0.22,0.3,900);},
  lvl(){[392,523,659,784].forEach((f,i)=>tone(f,f,0.13,'triangle',0.3,i*0.1));noise(0.4,0.14,600,0.1);},
  over(){[330,247,196].forEach((f,i)=>tone(f,f*0.9,0.28,'sawtooth',0.22,i*0.24));},
  horn(){tone(415,415,0.14,'square',0.07);tone(523,523,0.14,'square',0.06);}
};

/* ----------------------------- state ----------------------------- */
let t=0,state='start';
let score=0,best=parseInt(lsGet('ft.best')||'0',10)||0,level=1,hearts=3,clears=0;
let combo=0,lastClearT=-99,newBest=false,overReason='',overT=0,levelT=0,hintT=6;
let board,bag=[],queue=[],piece=null,spawnWarn=0;
let cars=[],carTimer=1.6;
let frog={c:4,r:ROWS-1,fc:4,fr:ROWS-1,hopT:2,hopDur:0.12,inv:0,fx:0,fy:-1};
let particles=[],popups=[],clearFlash=[],washFx=null,shake=0,redFlash=0;
let uiPause=null,uiMute=null;

function newBoard(){board=[];for(let r=0;r<ROWS;r++)board.push(new Array(COLS).fill(0));}
newBoard();

/* ----------------------------- pieces ----------------------------- */
function drawFromBag(){
  if(!bag.length){bag=TYPES.slice();for(let i=bag.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const tmp=bag[i];bag[i]=bag[j];bag[j]=tmp;}}
  return bag.pop();
}
function takeNext(){queue.shift();queue.push(drawFromBag());}
function fallMs(){return Math.max(150,640-(level-1)*55-Math.min(120,clears*3));}
function spawnPiece(){
  const ty=queue[0],m=SHAPE[ty];
  piece={type:ty,m:m,col:(Math.random()*(COLS-m.length))|0,row:-m.length};
  spawnWarn=0.8;takeNext();tone(240,310,0.05,'sine',0.06);
}
function pieceHas(c,r){
  if(!piece)return false;const rf=Math.floor(piece.row);
  for(let dr=0;dr<piece.m.length;dr++)for(let dc=0;dc<piece.m[0].length;dc++){
    if(piece.m[dr][dc]&&rf+dr===r&&piece.col+dc===c)return true;
  }return false;
}
function updatePiece(dt){
  if(!piece)return;
  piece.row+=dt*1000/fallMs();
  const rf=Math.floor(piece.row);let landed=false;
  for(let dr=0;dr<piece.m.length&&!landed;dr++)for(let dc=0;dc<piece.m[0].length;dc++){
    if(!piece.m[dr][dc])continue;const rr=rf+dr;
    if(rr>=0&&(rr+1>=ROWS||board[rr+1][piece.col+dc])){landed=true;break;}
  }
  if(landed)lockPiece();
}
function lockPiece(){
  const rf=Math.floor(piece.row),ti=TIDX[piece.type],tc=TCOL[piece.type];
  let top=false;
  for(let dr=0;dr<piece.m.length;dr++)for(let dc=0;dc<piece.m[0].length;dc++){
    if(!piece.m[dr][dc])continue;const rr=rf+dr,cc=piece.col+dc;
    if(rr<0)continue;board[rr][cc]=ti;if(rr===0)top=true;
    const hasBelow=(dr+1<piece.m.length&&piece.m[dr+1][dc]);
    if(!hasBelow)puff(cc+0.5,rr+1,tc,3,1.4,2);
  }
  SFX.land();piece=null;
  if(top){gameOver('sky');return;}
  const full=[];
  for(let r=0;r<ROWS;r++){let f=true;for(let c=0;c<COLS;c++)if(!board[r][c]){f=false;break;}if(f)full.push(r);}
  if(full.length){
    clearFlash=full.map(r=>({r:r,t:0}));
    const n=full.length,base=[0,100,300,500,800][n-1]*level;
    combo=(t-lastClearT<6)?combo+1:1;lastClearT=t;
    let pts=base;if(combo>1)pts+=(combo-1)*50*level;
    score+=pts;clears+=n;
    popups.push({x:COLS/2,y:full[0]-0.7,txt:'+'+pts,col:'#ffe9a0',t:0,life:1.1});
    const name=n===4?'TETRIS!':n===3?'TRIPLE!':n===2?'DOUBLE!':'CLEAR';
    if(n>1||combo>1)popups.push({x:COLS/2,y:full[0]+0.5,txt:name+(combo>1?' ×'+combo:''),col:'#8ff0d8',t:0,life:1.1});
    SFX.clear(n);
  }
  spawnPiece();
}
function processClearFlashes(dt){
  for(let i=clearFlash.length-1;i>=0;i--){
    const f=clearFlash[i];f.t+=dt;
    if(f.t>0.28){
      const keep=[];for(let r=0;r<ROWS;r++)if(r!==f.r)keep.push(board[r]);
      keep.unshift(new Array(COLS).fill(0));board=keep;
      if(frog.r>f.r){frog.r++;if(frog.fr>f.r)frog.fr++;if(frog.r>=ROWS)hitFrog();}
      for(let c=0;c<COLS;c+=2)bubble(c+rand(0.3,0.7),f.r);
      clearFlash.splice(i,1);
    }
  }
}

/* ----------------------------- cars ----------------------------- */
function spawnCar(){
  if(cars.length>=8)return;
  const lane=LANES[(Math.random()*LANES.length)|0];
  if(cars.filter(k=>k.row===lane).length>=2)return;
  const dir=Math.random()<0.5?1:-1,truck=Math.random()<0.3;
  cars.push({row:lane,x:dir>0?-3:COLS+0.6,w:truck?3:2,sp:(1.7+level*0.16)*rand(0.85,1.2)*(truck?0.72:1),dir:dir,col:CARCOLS[(Math.random()*CARCOLS.length)|0],truck:truck,seed:Math.random()*10});
  if(Math.random()<0.14)SFX.horn();
}
function updateCars(dt){
  carTimer-=dt;
  if(carTimer<=0){spawnCar();carTimer=rand(1.3,2.6)*Math.max(0.5,1-(level-1)*0.07);}
  for(let i=cars.length-1;i>=0;i--){
    const k=cars[i];let nx=k.x+k.dir*k.sp*dt;
    if(k.dir>0){
      let lim=Infinity;
      for(let c=0;c<COLS;c++)if(board[k.row][c])lim=Math.min(lim,c-k.w);
      for(const o of cars)if(o!==k&&o.row===k.row&&o.x>k.x)lim=Math.min(lim,o.x-k.w-0.25);
      nx=Math.max(k.x,Math.min(nx,lim));
    }else{
      let lim=-Infinity;
      for(let c=0;c<COLS;c++)if(board[k.row][c])lim=Math.max(lim,c+1);
      for(const o of cars)if(o!==k&&o.row===k.row&&o.x<k.x)lim=Math.max(lim,o.x+o.w+0.25);
      nx=Math.min(k.x,Math.max(nx,lim));
    }
    k.x=nx;
    if(k.x<-k.w-1||k.x>COLS+1)cars.splice(i,1);
  }
}
function carCovers(c,r){
  for(const k of cars)if(k.row===r&&c>=Math.floor(k.x)&&c<Math.ceil(k.x+k.w))return true;
  return false;
}

/* ----------------------------- frog ----------------------------- */
function findSpot(){
  const offs=[0,1,-1,2,-2,3,-3];
  for(let r=ROWS-1;r>=ROWS-4;r--)for(const o of offs){
    const c=4+o;if(c<0||c>=COLS)continue;
    if(board[r][c]||pieceHas(c,r)||carCovers(c,r))continue;
    return [c,r];
  }
  return null;
}
function tryHop(dc,dr){
  if(state!=='play')return false;
  const nc=frog.c+dc,nr=frog.r+dr;
  if(nc<0||nc>=COLS||nr<0||nr>=ROWS)return false;
  if(board[nr][nc]||pieceHas(nc,nr)||carCovers(nc,nr))return false;
  frog.fc=frog.c;frog.fr=frog.r;frog.c=nc;frog.r=nr;frog.hopT=0;
  if(dc||dr){frog.fx=dc;frog.fy=dr;}
  SFX.hop();return true;
}
function hitFrog(){
  SFX.hit();redFlash=1;shake=14;hearts--;
  puff(frog.c+0.5,frog.r+0.5,'#57d83e',14,2.4,3);puff(frog.c+0.5,frog.r+0.5,'#2f9c2a',8,1.6,3);
  if(hearts<=0){gameOver('splash');return;}
  const spot=findSpot();
  if(!spot){gameOver('splash');return;}
  frog.c=spot[0];frog.r=spot[1];frog.fc=frog.c;frog.fr=frog.r;frog.hopT=2;frog.inv=1.8;
}
function startLevelUp(){
  state='level';levelT=0;level++;score+=400*level;hearts=Math.min(3,hearts+1);
  SFX.lvl();
  washFx={t:0,snap:board.slice(ROWS-6).map(row=>row.slice())};
  for(let r=ROWS-6;r<ROWS;r++)board[r].fill(0);
  cars=cars.filter(k=>k.row<ROWS-6);
  puff(frog.c+0.5,frog.r+0.5,'#ffd166',12,2.5,-1);puff(frog.c+0.5,frog.r+0.5,'#7dffb0',10,2,-1);
}
function finishLevel(){
  const spot=findSpot();
  if(spot){frog.c=spot[0];frog.r=spot[1];}else{frog.c=4;frog.r=ROWS-1;}
  frog.fc=frog.c;frog.fr=frog.r;frog.hopT=2;frog.inv=1.2;washFx=null;state='play';
}

/* ----------------------------- flow ----------------------------- */
function startGame(){
  score=0;level=1;hearts=3;clears=0;combo=0;lastClearT=-99;newBest=false;
  newBoard();bag=[];queue=[drawFromBag(),drawFromBag()];
  cars=[];carTimer=1.6;piece=null;spawnWarn=0;
  frog={c:4,r:ROWS-1,fc:4,fr:ROWS-1,hopT:2,hopDur:0.12,inv:0,fx:0,fy:-1};
  particles=[];popups=[];clearFlash=[];washFx=null;shake=0;redFlash=0;hintT=6;
  held.length=0;spawnPiece();state='play';
}
function gameOver(reason){
  state='over';overReason=reason;overT=0;held.length=0;SFX.over();
  if(score>best){best=score;lsSet('ft.best',String(best));newBest=true;}else newBest=false;
}
function togglePause(){
  if(state==='play'){state='pause';held.length=0;}
  else if(state==='pause')state='play';
}
function toggleMute(){muted=!muted;lsSet('ft.muted',muted?'1':'0');if(mg)mg.gain.value=muted?0:0.5;}

/* ----------------------------- particles ----------------------------- */
function puff(x,y,col,n,spd,grav){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rand(0.3,1)*spd;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.5,gr:grav,t:0,life:rand(0.4,0.9),r:rand(0.08,0.2),col:col,kind:'f'});}
  if(particles.length>320)particles.splice(0,particles.length-320);
}
function bubble(x,y){particles.push({x:x,y:y,vx:rand(-0.3,0.3),vy:rand(-2.5,-1.2),gr:-0.6,t:0,life:rand(0.5,1),r:rand(0.06,0.16),col:'#bfeaff',kind:'b'});}

/* ----------------------------- ambient ----------------------------- */
const FF=[];for(let i=0;i<26;i++)FF.push({x:Math.random(),y:Math.random(),ph:rand(0,7),sp:rand(0.3,0.9),r:rand(1.2,2.4)});
function updateFireflies(dt){for(const f of FF){f.x+=Math.sin(t*f.sp+f.ph)*dt*0.02;f.y+=Math.cos(t*f.sp*0.8+f.ph)*dt*0.015;if(f.x<0)f.x+=1;if(f.x>1)f.x-=1;if(f.y<0)f.y+=1;if(f.y>1)f.y-=1;}}
function drawFireflies(a,b){
  for(let i=a;i<b;i++){const f=FF[i],px=f.x*W,py=f.y*H,al=0.35+0.3*Math.sin(t*2+f.ph);
    ctx.fillStyle='rgba(217,255,176,'+(al*0.18).toFixed(3)+')';ctx.beginPath();ctx.arc(px,py,f.r*4,0,7);ctx.fill();
    ctx.fillStyle='rgba(244,255,216,'+al.toFixed(3)+')';ctx.beginPath();ctx.arc(px,py,f.r,0,7);ctx.fill();}
}
let decor=[];for(let i=0;i<9;i++)decor.push({ty:TYPES[i%7],x:Math.random(),y:Math.random()*1.4-0.4,sp:rand(0.02,0.05)});
function updateDecor(dt){for(const d of decor){d.y+=d.sp*dt;if(d.y>1.3){d.y=-0.3;d.x=Math.random();}}}

/* ----------------------------- layout ----------------------------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  hudH=clamp(H*0.10,58,76);uiS=clamp(W/900,0.72,1);
  const availH=H-hudH-16,availW=W-12;
  cell=Math.max(10,Math.floor(Math.min(availH/ROWS,availW/COLS)));
  bw=cell*COLS;bh=cell*ROWS;bx=Math.round((W-bw)/2);by=hudH+8+Math.floor(Math.max(0,(availH-bh)/2));
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);

/* ----------------------------- tile renderer ----------------------------- */
let GRADS=[null];
function makeGrads(){GRADS=[null];for(const ty of TYPES){const c=TCOL[ty],g=ctx.createLinearGradient(0,0,0,1);g.addColorStop(0,shade(c,70));g.addColorStop(0.5,c);g.addColorStop(1,shade(c,-52));GRADS[TIDX[ty]]=g;}}
function tile(px,py,s,ti,alpha){
  ctx.save();ctx.globalAlpha*=(alpha===undefined?1:alpha);
  ctx.translate(px,py);ctx.scale(s,s);
  rr(0.03,0.03,0.94,0.94,0.18);ctx.fillStyle=GRADS[ti];ctx.fill();
  ctx.lineWidth=0.06;ctx.strokeStyle='rgba(0,20,25,.35)';ctx.stroke();
  rr(0.14,0.1,0.72,0.18,0.09);ctx.fillStyle='rgba(255,255,255,.16)';ctx.fill();
  ctx.restore();
}

/* ----------------------------- frog & pad renderers ----------------------------- */
function drawFrog(px,py,s,fx,fy,sq){
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(px,py+s*0.52,s*0.42,s*0.13,0,0,7);ctx.fill();
  const sy=1+0.2*sq,sx=1-0.14*sq;
  ctx.save();ctx.translate(px,py);ctx.scale(sx,sy);
  const g=ctx.createLinearGradient(0,-s*0.5,0,s*0.5);g.addColorStop(0,'#6ee84f');g.addColorStop(1,'#3fae33');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,s*0.48,s*0.36,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(220,255,190,.45)';ctx.beginPath();ctx.ellipse(0,s*0.14,s*0.33,s*0.19,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(47,140,42,.85)';
  [[-0.18,-0.06],[0.15,-0.12],[0.02,0.0]].forEach(p=>{ctx.beginPath();ctx.arc(p[0]*s,p[1]*s,s*0.05,0,7);ctx.fill();});
  ctx.fillStyle='#3fae33';
  ctx.beginPath();ctx.ellipse(-s*0.4,s*0.28,s*0.13,s*0.09,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(s*0.4,s*0.28,s*0.13,s*0.09,0,0,7);ctx.fill();
  ctx.fillStyle='#57c93e';
  ctx.beginPath();ctx.arc(-s*0.22,s*0.36,s*0.07,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(s*0.22,s*0.36,s*0.07,0,7);ctx.fill();
  for(const ex of [-0.2,0.2]){
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex*s,-s*0.34,s*0.17,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex*s+fx*s*0.045,-s*0.34+fy*s*0.045,s*0.105,0,7);ctx.fill();
    ctx.fillStyle='#12261a';ctx.beginPath();ctx.arc(ex*s+fx*s*0.08,-s*0.34+fy*s*0.08,s*0.055,0,7);ctx.fill();
  }
  ctx.strokeStyle='rgba(10,40,15,.55)';ctx.lineWidth=s*0.04;
  ctx.beginPath();ctx.arc(0,-s*0.02,s*0.24,Math.PI*0.2,Math.PI*0.8);ctx.stroke();
  ctx.restore();
}
function lilyPad(px,py,r,bloom){
  ctx.fillStyle='#2f8c4f';ctx.beginPath();ctx.ellipse(px,py+r*0.16,r*1.15,r*0.7,0,0,7);ctx.fill();
  ctx.fillStyle='#3fae62';ctx.beginPath();ctx.ellipse(px,py,r*1.1,r*0.66,0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(7,40,30,.9)';ctx.lineWidth=r*0.22;
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+r*1.05,py-r*0.15);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=r*0.14;
  ctx.beginPath();ctx.arc(px,py,r*0.75,Math.PI*1.1,Math.PI*1.6);ctx.stroke();
  if(bloom){
    for(let i=0;i<5;i++){const a=i*Math.PI*2/5-t*0.3;
      ctx.fillStyle='rgba(255,240,245,.9)';ctx.beginPath();ctx.ellipse(px+Math.cos(a)*r*0.3,py-r*0.15+Math.sin(a)*r*0.3,r*0.2,r*0.12,a,0,7);ctx.fill();}
    ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(px,py-r*0.15,r*0.14,0,7);ctx.fill();
  }
}

function drawBG(){

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const mx=W*0.82,my=H*0.15,mr=clamp(H*0.06,24,58);
  const halo=ctx.createRadialGradient(mx,my,mr*0.3,mx,my,mr*3.2);halo.addColorStop(0,'rgba(244,236,216,.22)');halo.addColorStop(1,'rgba(244,236,216,0)');
  ctx.fillStyle=halo;ctx.fillRect(mx-mr*3.2,my-mr*3.2,mr*6.4,mr*6.4);
  ctx.fillStyle='rgba(242,234,210,.95)';ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
  ctx.fillStyle='rgba(180,170,140,.18)';
  ctx.beginPath();ctx.arc(mx-mr*0.3,my-mr*0.2,mr*0.18,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(mx+mr*0.25,my+mr*0.3,mr*0.13,0,7);ctx.fill();
  for(let i=0;i<2;i++){const mxp=((t*(8+i*5))%(W+900))-450;
    ctx.fillStyle='rgba(160,220,230,.035)';ctx.beginPath();ctx.ellipse(mxp,H*(0.3+i*0.4),320,60,0,0,7);ctx.fill();}
  drawReeds(bx-bw*0.18,-1);drawReeds(W-(bx-bw*0.18),1);
  drawFireflies(0,16);
}
function drawReeds(xBase,dir){
  for(let i=0;i<6;i++){
    const h=H*(0.1+i*0.022),sway=Math.sin(t*0.9+i)*8,x=xBase+dir*i*7;
    ctx.strokeStyle=i%2?'#0e4632':'#12583c';ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,H+4);
    ctx.quadraticCurveTo(x+dir*i*3,H-h*0.55,x+dir*(10+i*4)+sway,H-h);ctx.stroke();
    if(i===2){ctx.fillStyle='#7a4a26';rr(x+dir*(10+i*4)+sway-4,H-h-14,8,18,4);ctx.fill();}
  }
}
function drawBoardScene(){
  ctx.save();
  ctx.shadowColor='rgba(60,200,255,.22)';ctx.shadowBlur=26;
  ctx.fillStyle='#0b3040';rr(bx,by,bw,bh,8);ctx.fill();
  ctx.restore();
  ctx.save();rr(bx,by,bw,bh,8);ctx.clip();
  // caustics
  for(let i=0;i<4;i++){
    const cxp=bx+bw*(0.2+0.6*Math.abs(Math.sin(t*0.11+i*2.1)));
    const cyp=by+bh*(0.15+0.7*Math.abs(Math.cos(t*0.09+i*1.7)));
    const rad=cell*(2.4+Math.sin(t*0.5+i)*0.8);
    const cg=ctx.createRadialGradient(cxp,cyp,0,cxp,cyp,rad);
    cg.addColorStop(0,'rgba(190,255,255,.05)');cg.addColorStop(1,'rgba(190,255,255,0)');
    ctx.fillStyle=cg;ctx.fillRect(cxp-rad,cyp-rad,rad*2,rad*2);
  }
  // road lanes
  for(const lr of LANES){
    const y=by+lr*cell;
    ctx.fillStyle='rgba(4,16,20,.38)';ctx.fillRect(bx,y,bw,cell);
    ctx.strokeStyle='rgba(255,196,74,.22)';ctx.lineWidth=2;ctx.setLineDash([cell*0.45,cell*0.55]);
    ctx.beginPath();ctx.moveTo(bx,y+cell/2);ctx.lineTo(bx+bw,y+cell/2);ctx.stroke();ctx.setLineDash([]);
  }
  // grid
  ctx.strokeStyle='rgba(159,223,255,.05)';ctx.lineWidth=1;
  for(let c=1;c<COLS;c++){ctx.beginPath();ctx.moveTo(bx+c*cell,by);ctx.lineTo(bx+c*cell,by+bh);ctx.stroke();}
  for(let r=1;r<ROWS;r++){ctx.beginPath();ctx.moveTo(bx,by+r*cell);ctx.lineTo(bx+bw,by+r*cell);ctx.stroke();}
  // home strip
  const hg=ctx.createLinearGradient(0,by,0,by+cell*1.2);
  hg.addColorStop(0,'rgba(120,255,190,'+(0.24+0.1*Math.sin(t*3)).toFixed(3)+')');hg.addColorStop(1,'rgba(120,255,190,0)');
  ctx.fillStyle=hg;ctx.fillRect(bx,by,bw,cell*1.2);
  ctx.fillStyle='rgba(160,255,210,.6)';ctx.font=F(Math.max(8,cell*0.3),700);ctx.textAlign='center';
  ctx.fillText('H O M E   P O N D',bx+bw/2,by+Math.max(9,cell*0.42));
  // wash ghost (level-up)
  if(washFx){
    const al=1-Math.min(1,washFx.t/0.7),off=(1-al)*1.2;
    for(let i=0;i<washFx.snap.length;i++)for(let c=0;c<COLS;c++){
      const v=washFx.snap[i][c];if(v)tile(bx+c*cell+1.5,by+(ROWS-6+i-off)*cell+1.5,cell-3,v,al*0.8);
    }
  }
  // locked blocks
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const v=board[r][c];if(v)tile(bx+c*cell+1.5,by+r*cell+1.5,cell-3,v);}
  // clearing flash
  for(const f of clearFlash){
    const al=Math.max(0,0.9*(1-f.t/0.28));
    for(let c=0;c<COLS;c++)if(board[f.r][c]){ctx.fillStyle='rgba(255,255,255,'+al.toFixed(3)+')';rr(bx+c*cell+1,by+f.r*cell+1,cell-2,cell-2,4);ctx.fill();}
  }
  // ghost + warning + falling piece
  if(piece){
    const m=piece.m;let d=0;
    for(;;){let can=true;
      for(let dr=0;dr<m.length&&can;dr++)for(let dc=0;dc<m[0].length;dc++){
        if(!m[dr][dc])continue;const rr2=Math.floor(piece.row)+dr+d+1;
        if(rr2>=ROWS||(rr2>=0&&board[rr2][piece.col+dc])){can=false;break;}
      }
      if(can)d++;else break;
    }
    const gr=Math.floor(piece.row)+d,ti=TIDX[piece.type];
    for(let dr=0;dr<m.length;dr++)for(let dc=0;dc<m[0].length;dc++)if(m[dr][dc]&&gr+dr>=0)tile(bx+(piece.col+dc)*cell+1.5,by+(gr+dr)*cell+1.5,cell-3,ti,0.12);
    if(piece.row<-0.5&&spawnWarn>0){
      const wx=bx+(piece.col+m[0].length/2)*cell,wa=Math.max(0,(spawnWarn/0.8))*(0.5+0.5*Math.sin(t*20));
      ctx.fillStyle='rgba(255,209,102,'+wa.toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(wx-cell*0.28,by+4);ctx.lineTo(wx+cell*0.28,by+4);ctx.lineTo(wx,by+cell*0.42);ctx.closePath();ctx.fill();
    }
    for(let dr=0;dr<m.length;dr++)for(let dc=0;dc<m[0].length;dc++){
      if(!m[dr][dc])continue;const rrr=Math.floor(piece.row)+dr;if(rrr<0)continue;
      tile(bx+(piece.col+dc)*cell+1.5,by+rrr*cell+1.5,cell-3,ti);
    }
  }
  // cars
  for(const k of cars)drawCar(k);
  // frog
  if(state!=='over'){
    const ht=clamp(frog.hopT,0,1);
    const cxp=frog.fc+(frog.c-frog.fc)*ht,cyp=frog.fr+(frog.r-frog.fr)*ht;
    const arc=Math.sin(Math.PI*ht)*0.42*cell*(frog.hopT<=1?1:0);
    const px=bx+(cxp+0.5)*cell,py=by+(cyp+0.5)*cell-arc,sq=(frog.hopT<=1)?Math.sin(Math.PI*ht):0;
    if(frog.inv>0&&Math.floor(t*20)%2)ctx.globalAlpha=0.35;
    drawFrog(px,py,cell*0.92,frog.fx,frog.fy,sq);
    ctx.globalAlpha=1;
  }else{
    ctx.fillStyle='rgba(87,216,62,.4)';ctx.beginPath();ctx.ellipse(bx+(frog.c+0.5)*cell,by+(Math.min(frog.r,ROWS-1)+0.6)*cell,cell*0.7,cell*0.2,0,0,7);ctx.fill();
  }
  // particles
  for(const p of particles){
    const al=Math.max(0,1-p.t/p.life),px=bx+p.x*cell,py=by+p.y*cell;
    if(p.kind==='b'){ctx.strokeStyle='rgba(191,234,255,'+al.toFixed(3)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,p.r*cell,0,7);ctx.stroke();}
    else{ctx.globalAlpha=al;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(px,py,p.r*cell,0,7);ctx.fill();ctx.globalAlpha=1;}
  }
  ctx.restore();
  // frame
  ctx.strokeStyle='rgba(24,86,105,.95)';ctx.lineWidth=3;rr(bx-4,by-4,bw+8,bh+8,10);ctx.stroke();
  // home pads on border
  for(const fx of [0.18,0.5,0.82]){
    const px=bx+bw*fx,py=by-3;
    lilyPad(px,py,cell*0.16,fx===0.5);
  }
  // popups
  ctx.textAlign='center';
  for(const p of popups){
    const al=Math.max(0,1-p.t/p.life),px=bx+p.x*cell,py=by+(p.y-p.t*1.2)*cell;
    ctx.font=F(Math.max(14,Math.min(26,cell*0.8)),900);
    ctx.strokeStyle='rgba(5,30,25,.8)';ctx.lineWidth=4;ctx.globalAlpha=al;
    ctx.strokeText(p.txt,px,py);ctx.fillStyle=p.col;ctx.fillText(p.txt,px,py);ctx.globalAlpha=1;
  }
  // hint
  if(state==='play'&&hintT>0){
    const al=Math.min(1,hintT)*(0.5+0.4*Math.sin(t*3));
    ctx.font=F(Math.max(11,cell*0.42),700);ctx.textAlign='center';
    ctx.fillStyle='rgba(255,209,102,'+al.toFixed(3)+')';
    ctx.fillText('HOP TO THE GLOWING HOME POND \u2191',bx+bw/2,by+bh+Math.max(14,cell*0.6));
  }
}
function drawCar(k){
  const x=bx+k.x*cell,y=by+k.row*cell,w=k.w*cell,h=cell*0.6;
  const top=y+(cell-h)/2+Math.sin(t*18+k.seed)*0.5;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+w/2,y+cell-2,w*0.46,cell*0.1,0,0,7);ctx.fill();
  if(k.truck){
    ctx.fillStyle=shade(k.col,50);rr(x,top+h*0.1,w*0.6,h*0.85,3);ctx.fill();
    ctx.strokeStyle='rgba(0,20,25,.3)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=k.col;rr(x+w*0.62,top+h*0.24,w*0.38,h*0.7,3);ctx.fill();
    ctx.fillStyle='rgba(210,240,255,.75)';rr(x+w*0.7,top+h*0.3,w*0.24,h*0.26,2);ctx.fill();
  }else{
    ctx.fillStyle=k.col;rr(x+cell*0.04,top+h*0.22,w-cell*0.08,h*0.62,cell*0.14);ctx.fill();
    ctx.fillStyle=shade(k.col,35);rr(x+w*0.2,top+h*0.02,w*0.56,h*0.42,cell*0.1);ctx.fill();
    ctx.fillStyle='rgba(210,240,255,.7)';rr(x+w*0.28,top+h*0.09,w*0.38,h*0.26,2);ctx.fill();
  }
  const wr=cell*0.13,wy=top+h-wr*0.4;
  const wpos=k.truck?[0.14,0.5,0.84]:[0.2,0.8];
  for(const wp of wpos){
    ctx.fillStyle='#10232a';ctx.beginPath();ctx.arc(x+w*wp,wy,wr,0,7);ctx.fill();
    ctx.fillStyle='#cfd8dd';ctx.beginPath();ctx.arc(x+w*wp,wy,wr*0.4,0,7);ctx.fill();
  }
  const front=k.dir>0?x+w-2:x+2;
  ctx.fillStyle='#ffe9a0';ctx.beginPath();ctx.arc(front,top+h*0.6,1.8,0,7);ctx.fill();
  const back=k.dir>0?x+2:x+w-2;
  ctx.fillStyle='#ff5b4d';ctx.beginPath();ctx.arc(back,top+h*0.6,1.6,0,7);ctx.fill();
}

function drawHUD(){
  const s=uiS,cy=hudH/2;
  ctx.textAlign='left';
  ctx.fillStyle='#7fb8a8';ctx.font=F(10*s,700);ctx.fillText('SCORE',16,hudH*0.36);

    ctx.fillStyle='#7fb8a8';ctx.font=F(9*s,700);ctx.fillText('BEST',150,hudH*0.36);
    ctx.fillStyle='#9fd8c4';ctx.font=F(15*s,800);ctx.fillText(String(best),148,hudH*0.8);
  }
  // hearts (lily pads)
  for(let i=0;i<3;i++){
    const px=W/2-36+i*24*s;
    if(i<hearts)lilyPad(px,cy+2,8*s,false);
    else{ctx.strokeStyle='rgba(120,170,145,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(px,cy+2,9*s,6*s,0,0,7);ctx.stroke();}
  }
  ctx.fillStyle='#ffd166';ctx.font=F(15*s,900);ctx.textAlign='left';
  ctx.fillText('LVL '+level,W/2+42,cy+5);
  // next box
  const bwid=78*s,bxh=44*s,nx=W-160*s,ny=(hudH-bxh)/2;
  ctx.fillStyle='rgba(8,36,46,.8)';rr(nx,ny,bwid,bxh,6);ctx.fill();
  ctx.strokeStyle='rgba(120,220,255,.18)';ctx.lineWidth=1.5;rr(nx,ny,bwid,bxh,6);ctx.stroke();
  ctx.fillStyle='#7fb8a8';ctx.font=F(8*s,700);ctx.textAlign='center';ctx.fillText('NEXT',nx+bwid/2,ny-3<10?ny+10:ny-3);
  if(queue[0]){
    const m=SHAPE[queue[0]],ms=Math.min(10*s,(bwid-12)/m[0].length,(bxh-8)/m.length);
    const ox=nx+bwid/2-m[0].length*ms/2,oy=ny+bxh/2-m.length*ms/2;
    for(let dr=0;dr<m.length;dr++)for(let dc=0;dc<m[0].length;dc++)if(m[dr][dc])tile(ox+dc*ms+0.5,oy+dr*ms+0.5,ms-1,TIDX[queue[0]]);
  }
  // pause & mute icons
  drawIcon(W-52*s,cy,'pause');drawIcon(W-20*s,cy,'mute');
}
function drawIcon(cx,cy,kind){
  const r=13*uiS;
  ctx.fillStyle='rgba(8,36,46,.8)';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
  ctx.strokeStyle='rgba(120,220,255,.2)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
  if(kind==='pause'){
    uiPause=[cx-r,cy-r,r*2,r*2];
    ctx.fillStyle='#c8ffe0';
    if(state==='pause'){ctx.beginPath();ctx.moveTo(cx-4*uiS,cy-6*uiS);ctx.lineTo(cx+7*uiS,cy);ctx.lineTo(cx-4*uiS,cy+6*uiS);ctx.closePath();ctx.fill();}
    else{rr(cx-5*uiS,cy-6*uiS,3.5*uiS,12*uiS,1.5);ctx.fill();rr(cx+1.5*uiS,cy-6*uiS,3.5*uiS,12*uiS,1.5);ctx.fill();}
  }else{
    uiMute=[cx-r,cy-r,r*2,r*2];
    ctx.fillStyle=muted?'#7c8f96':'#c8ffe0';
    ctx.beginPath();ctx.moveTo(cx-6*uiS,cy-3*uiS);ctx.lineTo(cx-2.5*uiS,cy-3*uiS);ctx.lineTo(cx+1.5*uiS,cy-6*uiS);ctx.lineTo(cx+1.5*uiS,cy+6*uiS);ctx.lineTo(cx-2.5*uiS,cy+3*uiS);ctx.lineTo(cx-6*uiS,cy+3*uiS);ctx.closePath();ctx.fill();
    if(muted){ctx.strokeStyle='#ff7a5c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-8*uiS,cy-8*uiS);ctx.lineTo(cx+8*uiS,cy+8*uiS);ctx.stroke();}
    else{ctx.strokeStyle='#c8ffe0';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(cx+3*uiS,cy,4*uiS,-0.9,0.9);ctx.stroke();}
  }
}

/* ----------------------------- screens ----------------------------- */
function drawTitle(cx,y){
  const str='FROG TETRIS',size=clamp(W*0.085,32,76);
  ctx.font=F(size,900);ctx.textAlign='left';
  const chars=str.split('');let widths=chars.map(c=>ctx.measureText(c).width),total=widths.reduce((a,b)=>a+b,0)+size*0.08*(chars.length-1);
  let x=cx-total/2;
  for(let i=0;i<chars.length;i++){
    const ch=chars[i];
    if(ch===' '){x+=widths[i]+size*0.08;continue;}
    const col=str.slice(0,4)===str.slice(i,i+1)?'#5ce84f':'#ffd166';
    const yy=y+Math.sin(t*2.2+i*0.55)*size*0.06,rot=Math.sin(t*1.6+i*0.7)*0.05;
    ctx.save();ctx.translate(x+widths[i]/2,yy);ctx.rotate(rot);
    ctx.fillStyle='rgba(4,30,24,.9)';ctx.fillText(ch,-widths[i]/2,size*0.08);
    ctx.lineWidth=size*0.16;ctx.strokeStyle='#05231d';ctx.lineJoin='round';ctx.strokeText(ch,-widths[i]/2,0);
    ctx.fillStyle=col;ctx.fillText(ch,-widths[i]/2,0);
    ctx.restore();x+=widths[i]+size*0.08;
  }
}
function drawStart(){
  const cx=W/2;
  for(const d of decor){
    const m=SHAPE[d.ty],s=Math.max(13,cell*0.75),px=d.x*(W-m[0].length*s)+m[0].length*s/2,py=d.y*H;
    for(let dr=0;dr<m.length;dr++)for(let dc=0;dc<m[0].length;dc++)if(m[dr][dc])tile(px+dc*s,py+dr*s,s,TIDX[d.ty],0.13);
  }
  drawTitle(cx,H*0.24);
  ctx.textAlign='center';
  ctx.fillStyle='#9fd8c4';ctx.font=F(clamp(W*0.016,11,15),700);
  ctx.fillText('HOP THE TRAFFIC \u00B7 CLEAR THE LINES \u00B7 REACH THE HOME POND',cx,H*0.24+clamp(W*0.085,32,76)*0.72);
  if(best>0){ctx.fillStyle='#ffd166';ctx.font=F(14,800);ctx.fillText('BEST  '+best,cx,H*0.24+clamp(W*0.085,32,76)*0.72+22);}
  // lily pad hop scene
  const minD=Math.min(W*0.17,130),padY=H*0.6,padR=clamp(cell*1.5,26,46);
  const padX=[cx-minD,cx,cx+minD];
  for(let i=0;i<3;i++)lilyPad(padX[i],padY,padR,i===1);
  const ph=(t*0.9)%3,i0=Math.floor(ph),p=ph-i0,e=easeIO(p);
  const nx2=(i0+1)%3,fxp=lerp(padX[i0],padX[nx2],e),fyp=padY-Math.sin(Math.PI*p)*cell*2.2;
  drawFrog(fxp,fyp,padR*0.62,Math.sign(padX[nx2]-padX[i0])||1,0,Math.sin(Math.PI*p));
  // controls panel
  const pw=Math.min(620,W*0.92),phh=92*uiS,px=cx-pw/2,pyy=H*0.7;
  ctx.fillStyle='rgba(6,30,36,.75)';rr(px,pyy,pw,phh,10);ctx.fill();

  const fs=clamp(W*0.016,11.5,14.5);
  ctx.font=F(fs,700);ctx.fillStyle='#ffd166';
  ctx.fillText('REACH THE GLOWING HOME POND BEFORE YOUR STACK DOES',cx,pyy+phh*0.28);
  ctx.fillStyle='#c8ffe0';
  ctx.fillText(isTouch?'SWIPE TO HOP \u00B7 TAP THE CIRCLE ICONS TO PAUSE / MUTE':'\u2190 \u2192 \u2191 \u2193  HOP     P  PAUSE     R  RESTART     M  SOUND',cx,pyy+phh*0.56);
  ctx.fillStyle='#7fb8a8';ctx.font=F(fs*0.92,600);
  ctx.fillText('CARS AND TRUCKS JAM ON YOUR PADS \u2014 3 SPLASHES AND YOU DROWN',cx,pyy+phh*0.84);
  const al=0.55+0.4*Math.sin(t*4);
  ctx.fillStyle='rgba(200,255,224,'+al.toFixed(3)+')';ctx.font=F(clamp(W*0.02,14,19),800);
  ctx.fillText(isTouch?'TAP TO START':'PRESS ENTER TO HOP IN',cx,H*0.92);
}

  ctx.fillText(isTouch?'TAP \u25B6 TO RESUME \u00B7 TAP \u21BA TO RESTART':'P  RESUME     R  RESTART',W/2,H*0.45+34);
}
function drawOver(){
  ctx.fillStyle='rgba(3,12,15,.74)';ctx.fillRect(0,0,W,H);
  const sc=eob(Math.min(1,overT/0.35));
  ctx.save();ctx.translate(W/2,H*0.42);ctx.scale(sc,sc);ctx.textAlign='center';
  const sky=overReason==='sky',sz=clamp(W*0.05,28,52);
  ctx.font=F(sz,900);ctx.lineWidth=sz*0.15;ctx.strokeStyle='#0a1418';ctx.lineJoin='round';
  const tt=sky?'STACKED TO THE SKY':'SPLASHED!';
  ctx.strokeText(tt,0,-30);ctx.fillStyle=sky?'#ffd166':'#ff7a5c';ctx.fillText(tt,0,-30);
  ctx.font=F(14,600);ctx.fillStyle='#9fd8c4';
  ctx.fillText(sky?'Your pads reached the home pond.':'The traffic got you.',0,2);
  ctx.font=F(13,700);ctx.fillStyle='#7fb8a8';ctx.fillText('SCORE',0,42);
  ctx.font=F(36,900);ctx.fillStyle='#eaf6ef';ctx.fillText(String(score),0,78);
  ctx.font=F(14,800);ctx.fillStyle=newBest?'#ffd166':'#7fb8a8';
  ctx.fillText('BEST  '+best+(newBest?'   \u2605 NEW BEST! \u2605':''),0,104);
  if(newBest){const al=0.5+0.5*Math.sin(t*6);ctx.fillStyle='rgba(255,209,102,'+al.toFixed(3)+')';ctx.font=F(12,800);ctx.fillText('\u2605 NEW BEST \u2605',0,124);}
  ctx.restore();
  const al=0.5+0.4*Math.sin(t*4);
  ctx.textAlign='center';ctx.fillStyle='rgba(200,255,224,'+al.toFixed(3)+')';
  ctx.font=F(clamp(W*0.018,13,17),800);
  ctx.fillText(isTouch?'TAP TO HOP AGAIN':'ENTER / R \u2014 HOP AGAIN',W/2,H*0.42+150);
}

/* ----------------------------- tick & draw ----------------------------- */
function tick(dt){
  t+=dt;
  if(shake>0)shake=Math.max(0,shake-36*dt);
  if(redFlash>0)redFlash=Math.max(0,redFlash-dt*1.6);
  updateFireflies(dt);
  if(state==='start'||state==='over')updateDecor(dt);
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gr*dt;if(p.t>p.life)particles.splice(i,1);}
  for(let i=popups.length-1;i>=0;i--){popups[i].t+=dt;if(popups[i].t>popups[i].life)popups.splice(i,1);}
  if(state==='play'){
    hintT-=dt;if(spawnWarn>0)spawnWarn-=dt;
    if(frog.inv>0)frog.inv-=dt;
    frog.hopT=Math.min(frog.hopT+dt/frog.hopDur,2);
    if(held.length&&frog.hopT>=1){const d=held[held.length-1];tryHop(d[0],d[1]);}
    updatePiece(dt);
    if(state==='play')updateCars(dt);
    processClearFlashes(dt);
    if(state==='play'&&frog.inv<=0&&(pieceHas(frog.c,frog.r)||carCovers(frog.c,frog.r)))hitFrog();
    if(state==='play'&&frog.r===0)startLevelUp();
  }else if(state==='level'){
    levelT+=dt;processClearFlashes(dt);
    if(levelT<0.9&&Math.random()<dt*40)bubble(rand(1,COLS-1),ROWS-rand(0,5));
    if(washFx)washFx.t=levelT;
    if(levelT>=1.9)finishLevel();
  }else if(state==='over'){overT+=dt;}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()*2-1)*shake*0.5,(Math.random()*2-1)*shake*0.5);
  uiPause=null;uiMute=null;
  drawBG();
  if(state==='start')drawStart();
  else{
    drawBoardScene();
    drawHUD();
    if(state==='pause')drawPause();
    if(state==='level')drawLevelBanner();
    if(state==='over')drawOver();
  }
  drawFireflies(16,26);
  ctx.restore();
  if(redFlash>0){
    const g=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.85);
    g.addColorStop(0,'rgba(255,60,40,0)');g.addColorStop(1,'rgba(255,60,40,'+(redFlash*0.4).toFixed(3)+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
}

/* ----------------------------- input ----------------------------- */
const held=[];
function dirOf(k){
  switch(k){
    case 'ArrowLeft':case 'a':case 'A':return [-1,0];
    case 'ArrowRight':case 'd':case 'D':return [1,0];
    case 'ArrowUp':case 'w':case 'W':return [0,-1];
    case 'ArrowDown':case 's':case 'S':return [0,1];
  }return null;
}
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown'||k===' ')e.preventDefault();
  audio();
  if(k==='m'||k==='M'){toggleMute();return;}
  if(state==='start'){if(k==='Enter'||k===' ')startGame();return;}
  if(state==='over'){if(overT>0.7&&(k==='Enter'||k===' '||k==='r'||k==='R'))startGame();return;}
  if(state==='pause'){if(k==='p'||k==='P'||k==='Escape'||k===' ')togglePause();return;}
  if(k==='p'||k==='P'||k==='Escape'){togglePause();return;}
  if(k==='r'||k==='R'){startGame();return;}
  const d=dirOf(k);
  if(d){if(!held.includes(d))held.push(d);if(state==='play')tryHop(d[0],d[1]);}
});
window.addEventListener('keyup',e=>{const d=dirOf(e.key);if(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1);}});
window.addEventListener('blur',()=>{if(state==='play'){state='pause';held.length=0;}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';held.length=0;}});

let pDown=null;
cv.addEventListener('pointerdown',e=>{
  audio();const x=e.clientX,y=e.clientY;
  if(state!=='start'){
    if(uiMute&&(x>=uiMute[0]&&x<=uiMute[0]+uiMute[2]&&y>=uiMute[1]&&y<=uiMute[1]+uiMute[3])){toggleMute();return;}
    if(uiPause&&(x>=uiPause[0]&&x<=uiPause[0]+uiPause[2]&&y>=uiPause[1]&&y<=uiPause[1]+uiPause[3])){
      if(state==='pause')togglePause();else if(state==='play')togglePause();return;
    }
  }
  if(state==='start'){startGame();return;}
  if(state==='over'){if(overT>0.7)startGame();return;}
  if(state==='pause'){togglePause();return;}
  pDown={x:x,y:y};
});
cv.addEventListener('pointermove',e=>{
  if(!pDown||state!=='play')return;
  const dx=e.clientX-pDown.x,dy=e.clientY-pDown.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>26){
    if(Math.abs(dx)>Math.abs(dy))tryHop(Math.sign(dx),0);else tryHop(0,Math.sign(dy));
    pDown={x:e.clientX,y:e.clientY};
  }
});
window.addEventListener('pointerup',()=>{pDown=null;});
window.addEventListener('pointercancel',()=>{pDown=null;});

/* ----------------------------- boot ----------------------------- */
resize();makeGrads();
let last=performance.now();
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  tick(dt);draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
