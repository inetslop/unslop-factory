<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Beamvault — a top-down puzzle of light</title>
<style>
  :root{
    --bg:#070b14; --panel:#0d1524; --line:#26375a; --gold:#ffc857; --cyan:#56b8ff;
    --text:#c9d6ee; --dim:#7d8db0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--text);
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  .disp{font-family:Georgia,"Palatino Linotype","Times New Roman",serif;font-variant:small-caps;letter-spacing:.14em}
  #cv{position:fixed;inset:0;display:block}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:0;left:0;right:0;height:58px;z-index:5;
    display:flex;align-items:center;gap:18px;padding:0 16px;
    background:linear-gradient(rgba(7,11,20,.94),rgba(7,11,20,.78));
    border-bottom:1px solid var(--line);
    transition:opacity .35s ease,transform .35s ease;
  }
  #hud.off{opacity:0;transform:translateY(-10px);pointer-events:none}
  .hcol{display:flex;align-items:center;gap:14px}
  .hleft{min-width:190px}
  #lvNum{color:var(--gold);font-size:1.05rem;text-shadow:0 0 12px rgba(255,200,87,.35)}
  #lvName{color:var(--dim);font-style:italic;font-size:.92rem}
  .hright{margin-left:auto}
  #pips i{
    display:inline-block;width:12px;height:12px;margin:0 5px;transform:rotate(45deg);
    border:2px solid var(--c,#888);background:rgba(120,140,180,.12);transition:all .3s ease;
  }
  #pips i.lit{background:var(--c);box-shadow:0 0 12px var(--c);animation:pipPop .45s ease}
  @keyframes pipPop{0%{transform:rotate(45deg) scale(1)}45%{transform:rotate(45deg) scale(1.7)}100%{transform:rotate(45deg) scale(1)}}
  .chip{
    width:38px;height:32px;background:#141f36;border:1px solid var(--line);color:#eaf2ff;
    font-size:1.15rem;font-family:Georgia,serif;cursor:pointer;transition:all .15s ease;line-height:1;
  }
  .chip:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(255,200,87,.3)}
  .stat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
  .stat label{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .stat span{font-size:1.05rem;font-family:Georgia,serif;color:#eaf2ff;line-height:1}
  #budget i{display:inline-block;width:9px;height:9px;margin:0 2px;transform:rotate(45deg);border:1px solid var(--gold)}
  #budget i.on{background:var(--gold);box-shadow:0 0 7px rgba(255,200,87,.6)}
  #budget i.off{border-color:#3a4b6b;opacity:.4}
  #budget .none{color:var(--dim)}
  .stat.deny span{animation:denyShake .3s ease;color:#ff5d73}
  @keyframes denyShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .hbtn{
    width:34px;height:34px;background:#141f36;border:1px solid var(--line);color:var(--text);
    font-size:1rem;cursor:pointer;transition:all .2s ease;font-family:Georgia,serif;
  }
  .hbtn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(255,200,87,.3)}
  #restartBtn:hover{transform:rotate(-180deg)}
  #muteBtn.off{opacity:.45;text-decoration:line-through}

  /* ---------- hint bar ---------- */
  #hintBar{
    position:fixed;bottom:14px;left:50%;transform:translate(-50%,12px);z-index:5;
    background:rgba(7,11,20,.88);border:1px solid var(--line);padding:7px 18px;
    font-size:.85rem;color:var(--dim);letter-spacing:.03em;border-radius:6px;
    opacity:0;pointer-events:none;transition:all .4s ease;max-width:92vw;text-align:center;
  }
  #hintBar.on{opacity:1;transform:translate(-50%,0)}
  #hint.gold{color:var(--gold);text-shadow:0 0 10px rgba(255,200,87,.4)}

  /* ---------- level flash ---------- */
  #flash{
    position:fixed;top:26%;left:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;
    font-size:clamp(1.3rem,3.4vw,2.1rem);color:#ffe3a6;text-shadow:0 0 24px rgba(255,200,87,.5),0 2px 8px rgba(0,0,0,.8);
    opacity:0;letter-spacing:.22em;white-space:nowrap;
  }
  #flash.go{animation:flashIn 1.9s ease forwards}
  @keyframes flashIn{0%{opacity:0;transform:translate(-50%,-46%)}18%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-54%)}}

  /* ---------- overlay ---------- */
  #overlay{
    position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(4,7,13,.62);transition:opacity .35s ease;padding:18px;overflow:auto;
  }
  #overlay.off{opacity:0;pointer-events:none}
  .panel{
    width:min(600px,94vw);background:linear-gradient(#111c31,#0b1322);
    border:1px solid #2c4067;padding:34px 42px 30px;text-align:center;position:relative;
    box-shadow:0 0 0 1px rgba(255,200,87,.14),0 30px 70px rgba(0,0,0,.65),inset 0 0 60px rgba(86,184,255,.05);
    animation:panelIn .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  .kicker{font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .kicker.g2{color:var(--gold)}
  h1.title,h2.title{
    font-size:clamp(2.4rem,7vw,3.9rem);font-variant:small-caps;letter-spacing:.08em;line-height:1.05;margin-bottom:6px;
    background:linear-gradient(#ffe9bb,#ffc857 48%,#b8842e);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,200,87,.3));
  }
  h2.title{font-size:clamp(1.9rem,5vw,2.7rem)}
  .rule{display:flex;align-items:center;gap:10px;margin:14px auto 16px;max-width:340px;color:var(--gold);font-size:.6rem}
  .rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#5a4a22)}
  .rule i:last-child{background:linear-gradient(90deg,#5a4a22,transparent)}
  .obj{color:var(--text);font-size:.95rem;line-height:1.5;margin-bottom:20px}
  .ctrls{text-align:left;max-width:430px;margin:0 auto 22px;display:flex;flex-direction:column;gap:7px}
  .crow{display:flex;align-items:center;gap:14px;padding:5px 10px;border-left:2px solid transparent;transition:all .18s ease}
  .crow:hover{background:rgba(86,184,255,.07);border-left-color:var(--cyan);transform:translateX(4px)}
  .keys{min-width:196px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .keys b{
    display:inline-block;background:#1a2436;border:1px solid #3a4b6b;border-bottom-width:3px;
    padding:2px 8px;font-size:.78rem;color:#eaf2ff;border-radius:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .keys .sep{color:var(--dim);font-size:.72rem;padding:0 3px}
  .cdo{font-size:.84rem;color:var(--dim)}
  .btnrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .btn{
    font-family:Georgia,serif;font-variant:small-caps;letter-spacing:.12em;font-size:1rem;cursor:pointer;
    padding:12px 28px;border-radius:4px;transition:all .16s ease;
  }
  .btn.primary{
    background:linear-gradient(#ffd98a,#f0a83c);color:#1a1206;border:1px solid #ffdf9e;
    box-shadow:0 4px 0 #7a5a1d,0 12px 26px rgba(255,200,87,.22);
  }
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 6px 0 #7a5a1d,0 18px 34px rgba(255,200,87,.35)}
  .btn.primary:active{transform:translateY(1px);box-shadow:0 2px 0 #7a5a1d}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
  .sub{font-size:.75rem;color:var(--dim);letter-spacing:.06em}
  .sub b{color:var(--text)}
  .stats{max-width:300px;margin:4px auto 20px;text-align:left}
  .srow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 2px;border-bottom:1px dashed rgba(125,141,176,.3)}
  .srow span{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .srow b{font-family:Georgia,serif;font-size:1.15rem;color:#ffe3a6}

  @media (max-width:640px){
    #lvName,.stat label{display:none}
    .hcol{gap:8px}
    .keys{min-width:150px}
    .panel{padding:26px 22px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header id="hud" class="off">
  <div class="hcol hleft">
    <span id="lvNum" class="disp">VAULT I</span>
    <span id="lvName">—</span>
  </div>
  <div class="hcol" id="pips"></div>
  <div class="hcol hright">
    <button id="slantBtn" class="chip" title="Flip slant (F)">/</button>
    <div class="stat" id="budgetStat"><label>Mirrors</label><span id="budget"></span></div>
    <div class="stat"><label>Steps</label><span id="steps">0</span></div>
    <button class="hbtn" id="helpBtn" title="Help">?</button>
    <button class="hbtn" id="restartBtn" title="Restart vault (R)">&#10227;</button>
    <button class="hbtn" id="muteBtn" title="Sound (M)">&Dagger;</button>
  </div>
</header>

<div id="hintBar"><span id="hint"></span></div>
<div id="flash"></div>
<div id="overlay" class="off"></div>

<script>
'use strict';
/* ============================== helpers ============================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){let h=(x*374761393+y*668265263)^0;h=((h^(h>>13))*1274126177);return ((h^(h>>16))>>>0)/4294967295;}
const store={
  get(k,d){try{const v=localStorage.getItem('beamvault_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('beamvault_'+k,JSON.stringify(v));}catch(e){}}
};

/* ============================== audio ============================== */
let AC=null,master=null,nbuf=null;
let muted=store.get('mute',false);
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);
  }catch(e){AC=null;}
}
function tone(f,d,type,g,slide,delay){
  if(!AC||muted)return;type=type||'sine';g=g==null?0.18:g;delay=delay||0;
  const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  v.gain.setValueAtTime(0.0001,t);
  v.gain.exponentialRampToValueAtTime(g,t+0.014);
  v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v);v.connect(master);o.start(t);o.stop(t+d+0.06);
}
function noise(d,g,fc,delay){
  if(!AC||muted)return;delay=delay||0;
  const t=AC.currentTime+delay;
  if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const ch=nbuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=nbuf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc||1000;f.Q.value=1.1;
  const v=AC.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(v);v.connect(master);s.start(t);s.stop(t+d+0.03);
}
const SFX={
  move(){tone(175,0.045,'triangle',0.05);},
  place(){tone(620,0.07,'triangle',0.16);noise(0.05,0.09,2600);},
  remove(){tone(340,0.1,'triangle',0.13,180);},
  flip(){tone(480,0.05,'square',0.06);tone(660,0.05,'square',0.05,0,0.045);},
  deny(){tone(115,0.13,'sawtooth',0.11,70);},
  prism(i){const f=[660,784,880,988][i%4];tone(f,0.5,'sine',0.2);tone(f*1.5,0.5,'sine',0.09,0,0.06);},
  door(){tone(98,0.6,'sawtooth',0.14,196);tone(392,0.8,'sine',0.1,0,0.1);noise(0.35,0.05,500,0.05);},
  level(){[523,659,784].forEach((f,i)=>tone(f,0.2,'triangle',0.17,0,i*0.09));},
  win(){[392,523,659,784,1046].forEach((f,i)=>{tone(f,0.32,'triangle',0.17,0,i*0.12);tone(f/2,0.32,'sine',0.08,0,i*0.12);});}
};

/* ============================== data ============================== */
const COLORS=[
  {main:'#ff5d73',rgb:'255,93,115', core:'#ffdde2'},
  {main:'#3fe0a8',rgb:'63,224,168', core:'#dcfff2'},
  {main:'#56b8ff',rgb:'86,184,255', core:'#e2f3ff'},
  {main:'#ffc857',rgb:'255,200,87', core:'#fff3d6'}
];
const ROMAN=['I','II','III','IV','V','VI','VII','VIII'];
const LEVELS=[
{name:'First Light',hint:'Click open floor to set a mirror — F flips its slant.',budget:2,
 walls:[[6,3],[6,4],[6,5],[6,6],[6,7]],voids:[],
 emitters:[{x:1,y:3,d:'R',c:0}],fixed:[],prisms:[{x:8,y:1,c:0}],
 start:{x:1,y:6},door:{x:10,y:6}},
{name:'The Turn',hint:'Click a standing mirror to flip its slant.',budget:0,
 walls:[[9,2],[9,3]],voids:[[3,5],[4,5],[3,6]],
 emitters:[{x:1,y:4,d:'R',c:0}],fixed:[{x:6,y:4,o:'/'}],prisms:[{x:6,y:7,c:0}],
 start:{x:1,y:1},door:{x:10,y:4}},
{name:'Twin Beams',hint:'Two beams, two crystals — a beam slips past colors it does not wake.',budget:2,
 walls:[[5,3],[5,4]],voids:[],
 emitters:[{x:1,y:1,d:'R',c:0},{x:10,y:6,d:'L',c:2}],fixed:[],prisms:[{x:4,y:6,c:0},{x:7,y:1,c:2}],
 start:{x:1,y:0},door:{x:11,y:7}},
{name:'Over the Chasm',hint:'Light flies over the chasm. You cannot.',budget:3,attract:[[4,3,'/'],[4,1,'/'],[9,1,'\\']],
 walls:[[5,2],[5,3],[5,4]],voids:[[6,3],[7,3],[6,4],[7,4]],
 emitters:[{x:1,y:3,d:'R',c:3}],fixed:[],prisms:[{x:9,y:5,c:3}],
 start:{x:1,y:7},door:{x:10,y:7}},
{name:'Three Colors',hint:'Route each color home. Crossings are safe.',budget:4,
 walls:[[2,5]],voids:[[6,5],[7,5]],
 emitters:[{x:1,y:2,d:'R',c:0},{x:1,y:6,d:'R',c:1},{x:10,y:4,d:'L',c:2}],fixed:[],
 prisms:[{x:8,y:3,c:1},{x:8,y:6,c:0},{x:3,y:4,c:2}],
 start:{x:1,y:0},door:{x:11,y:0}},
{name:'The Long Way Round',hint:'Walls have patience. So do you.',budget:3,
 walls:[[10,3],[10,4],[10,5],[10,6]],voids:[[5,3],[6,3],[5,4],[6,4]],
 emitters:[{x:1,y:7,d:'R',c:3}],fixed:[],prisms:[{x:11,y:4,c:3}],
 start:{x:1,y:0},door:{x:11,y:7}},
{name:'Twin Sigils',hint:'Cross your beams — light never collides.',budget:4,
 walls:[[8,4],[9,4]],voids:[[3,5],[4,5]],
 emitters:[{x:1,y:4,d:'R',c:0},{x:6,y:0,d:'D',c:1}],fixed:[],prisms:[{x:10,y:7,c:0},{x:2,y:7,c:1}],
 start:{x:1,y:0},door:{x:11,y:7}},
{name:'The Grand Vault',hint:'Everything you have learned, in one vault.',budget:4,
 walls:[[4,6],[4,7],[8,2],[8,3]],voids:[[5,2],[6,2]],
 emitters:[{x:1,y:1,d:'R',c:0},{x:1,y:7,d:'R',c:2}],fixed:[{x:10,y:4,o:'/'}],prisms:[{x:8,y:6,c:0},{x:3,y:2,c:2}],
 start:{x:1,y:0},door:{x:11,y:7}}
];

/* ============================== state ============================== */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,tile=40,ox=0,oy=0,vig=null;
let T=0,lastTs=0;
let state='menu';           // menu | play | clear | win | help
let lv=0,D=LEVELS[0];
let walls,voids,emitters,prisms,prismMap,fixedM,placed,doorOpen,litSet,sim;
let moves=0,elapsed=0,curO='/';
let player={x:0,y:0,sx:0,sy:0,tx:0,ty:0,t:0,moving:false,face:[1,0]};
let parts=[],shake=0,hover=null;
const mouse={x:-99,y:-99};
const totals={moves:0,time:0,mir:0};
const keys=new Set(),dirStack=[];
const DIRV={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const KEYDIR={arrowup:'U',w:'U',arrowdown:'D',s:'D',arrowleft:'L',a:'L',arrowright:'R',d:'R'};
const DIRC={R:[1,0],L:[-1,0],U:[0,-1],D:[0,1]};

/* ============================== layout ============================== */
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  layout();
  vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.34,W/2,H/2,Math.max(W,H)*0.78);
  vig.addColorStop(0,'rgba(2,4,9,0)');vig.addColorStop(1,'rgba(2,4,9,0.62)');
}
function layout(){
  const w=D?D.w||12:12,h=8;
  tile=clamp(Math.min((W-52)/w,(H-142)/h),16,72);
  ox=Math.round((W-tile*w)/2);
  oy=Math.round(58+((H-58-40)-tile*h)/2);
}
window.addEventListener('resize',resize);

/* ============================== level loading ============================== */
function loadLevel(i,attract){
  lv=i;D=LEVELS[i];
  walls=new Set(D.walls.map(p=>p[0]+','+p[1]));
  voids=new Set(D.voids.map(p=>p[0]+','+p[1]));
  emitters=D.emitters.slice();
  prisms=D.prisms.slice();
  prismMap=new Map();prisms.forEach((p,idx)=>prismMap.set(p.x+','+p.y,idx));
  fixedM=D.fixed.map(f=>({x:f.x,y:f.y,o:f.o}));
  placed=attract&&D.attract?D.attract.map(m=>({x:m[0],y:m[1],o:m[2]})):[];
  doorOpen=false;moves=0;elapsed=0;litSet=new Set();curO='/';
  player={x:D.start.x,y:D.start.y,sx:D.start.x,sy:D.start.y,tx:0,ty:0,t:0,moving:false,face:[1,0]};
  parts=[];shake=0;hover=null;
  layout();resim();updateHUD();
  if(!attract){
    setHint(D.hint,false);
    const fl=$('flash');fl.textContent='VAULT '+ROMAN[lv]+' · '+D.name.toUpperCase();
    fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  }
}

/* ============================== beam simulation ============================== */
function reflect(dx,dy,o){return o==='/'?[-dy,-dx]:[dy,dx];}
function simulate(opts){
  const mm=new Map();
  for(const m of fixedM)mm.set(m.x+','+m.y,m.o);
  for(const m of placed)mm.set(m.x+','+m.y,m.o);
  if(opts){if(opts.omit)mm.delete(opts.omit);if(opts.set)mm.set(opts.set.x+','+opts.set.y,opts.set.o);}
  const w=12,h=8,segs=[],lit=new Set();
  for(const e of emitters){
    let dx=DIRC[e.d][0],dy=DIRC[e.d][1];
    let x=e.x,y=e.y,sx=x,sy=y;
    const seen=new Set();
    for(let i=0;i<400;i++){
      const k=x+','+y+','+dx+','+dy;
      if(seen.has(k))break;seen.add(k);
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=w||ny>=h){segs.push({x1:sx,y1:sy,x2:x+dx*0.5,y2:y+dy*0.5,c:e.c});break;}
      const ck=nx+','+ny;
      if(walls.has(ck)||((nx===D.door.x)&&(ny===D.door.y))){segs.push({x1:sx,y1:sy,x2:x+dx*0.5,y2:y+dy*0.5,c:e.c});break;}
      const m=mm.get(ck);
      if(m){segs.push({x1:sx,y1:sy,x2:nx,y2:ny,c:e.c});const r=reflect(dx,dy,m.o);dx=r[0];dy=r[1];x=nx;y=ny;sx=nx;sy=ny;continue;}
      const pi=prismMap.get(ck);
      if(pi!==undefined){
        if(prisms[pi].c===e.c){segs.push({x1:sx,y1:sy,x2:nx,y2:ny,c:e.c});lit.add(pi);break;}
        x=nx;y=ny;continue;
      }
      x=nx;y=ny;
    }
  }
  return {segs,lit};
}
function resim(){
  sim=simulate(null);
  const prev=litSet;litSet=new Set(sim.lit);
  for(const idx of litSet){
    if(!prev.has(idx)){
      const p=prisms[idx];
      burst(g2p(p.x,p.y),COLORS[p.c].main,20,140);
      SFX.prism(idx);shake=Math.max(shake,0.35);
    }
  }
  updateHUD();
  if(litSet.size===prisms.length&&!doorOpen)openDoor();
}
function openDoor(){
  doorOpen=true;SFX.door();shake=0.6;
  burst(g2p(D.door.x,D.door.y),'#ffc857',34,190);

}

/* ============================== interaction ============================== */
function mirrorAt(x,y){
  for(const m of fixedM)if(m.x===x&&m.y===y)return Object.assign({fixed:true},m);
  for(const m of placed)if(m.x===x&&m.y===y)return m;
  return null;
}
function canPlace(x,y){
  const k=x+','+y;
  if(walls.has(k)||voids.has(k)||prismMap.has(k))return false;
  if(x===D.door.x&&y===D.door.y)return false;
  for(const e of emitters)if(e.x===x&&e.y===y)return false;
  if(player.x===x&&player.y===y)return false;
  return true;
}
function handleTileClick(x,y){
  const m=mirrorAt(x,y);
  if(m){
    if(m.fixed){m.o=m.o==='/'?'\\':'/';SFX.flip();resim();}
    else{placed=placed.filter(p=>!(p.x===x&&p.y===y));SFX.remove();resim();}
    return;
  }
  if(!canPlace(x,y)){SFX.deny();return;}
  if(placed.length>=D.budget){SFX.deny();flashBudget();return;}
  placed.push({x,y,o:curO});SFX.place();
  const p=g2p(x,y);for(let i=0;i<8;i++)parts.push(moteAt(p[0],p[1],'#9fb8dd',40));
  resim();
}
function flashBudget(){
  const b=$('budgetStat');b.classList.remove('deny');void b.offsetWidth;b.classList.add('deny');
}
function tileAt(mx,my){
  const gx=Math.floor((mx-ox)/tile),gy=Math.floor((my-oy)/tile);
  if(gx<0||gy<0||gx>=12||gy>=8)return null;
  return {x:gx,y:gy};
}
function tryMove(dx,dy){
  const nx=player.x+dx,ny=player.y+dy;
  if(nx<0||ny<0||nx>=12||ny>=8)return;
  const k=nx+','+ny;
  if(walls.has(k)||voids.has(k))return;
  if(mirrorAt(nx,ny))return;
  if(prismMap.has(k))return;
  if(nx===D.door.x&&ny===D.door.y&&!doorOpen){SFX.deny();shake=Math.max(shake,0.18);return;}
  player.sx=player.x;player.sy=player.y;player.tx=nx;player.ty=ny;player.t=0;player.moving=true;
  player.face=[dx,dy];SFX.move();
}

/* ============================== update ============================== */
function update(dt){
  T+=dt;
  if(state==='play'){
    elapsed+=dt;
    if(player.moving){
      player.t+=dt/0.115;
      if(player.t>=1){
        player.moving=false;player.x=player.tx;player.y=player.ty;moves++;updateHUD();
        if(player.x===D.door.x&&player.y===D.door.y&&doorOpen)doClear();
      }
    }else{
      for(let i=dirStack.length-1;i>=0;i--){
        const e=dirStack[i];
        if(keys.has(e.k)){tryMove(DIRV[e.d][0],DIRV[e.d][1]);break;}
      }
    }
  }
  // ambient motes
  if(parts.length<240&&Math.random()<dt*7){
    const x=ox+Math.random()*tile*12,y=oy+tile*8+Math.random()*20;
    parts.push({x,y,vx:(Math.random()-0.5)*6,vy:-6-Math.random()*8,life:3+Math.random()*2,max:5,size:0.8+Math.random()*1,col:'#9fb8dd',add:false,grav:0});
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.grav||0)*dt;
  }
  if(shake>0)shake=Math.max(0,shake-dt*1.7);
}

/* ============================== drawing ============================== */
function drawMirrorShape(px,py,o,fixed,alpha){
  const t=tile,pad=t*0.13;
  ctx.globalAlpha=alpha;
  const g=ctx.createLinearGradient(px,py,px,py+t);
  if(fixed){g.addColorStop(0,'#7a6238');g.addColorStop(1,'#453820');}
  else{g.addColorStop(0,'#48566f');g.addColorStop(1,'#273249');}
  ctx.fillStyle=g;ctx.fillRect(px+pad,py+pad,t-2*pad,t-2*pad);
  ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1;
  ctx.strokeRect(px+pad+0.5,py+pad+0.5,t-2*pad-1,t-2*pad-1);
  if(fixed){
    ctx.fillStyle='rgba(255,224,168,.55)';
    const r=1.8,q=pad+3.5;
    [[q,q],[t-q,q],[q,t-q],[t-q,t-q]].forEach(p=>{ctx.beginPath();ctx.arc(px+p[0],py+p[1],r,0,7);ctx.fill();});
  }
  const a=o==='/'?[[px+t*0.2,py+t*0.8],[px+t*0.8,py+t*0.2]]:[[px+t*0.2,py+t*0.2],[px+t*0.8,py+t*0.8]];
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(140,190,255,.35)';ctx.lineWidth=t*0.16;
  ctx.beginPath();ctx.moveTo(a[0][0],a[0][1]);ctx.lineTo(a[1][0],a[1][1]);ctx.stroke();
  ctx.strokeStyle='#eaf2ff';ctx.lineWidth=t*0.07;
  ctx.beginPath();ctx.moveTo(a[0][0],a[0][1]);ctx.lineTo(a[1][0],a[1][1]);ctx.stroke();
  const gp=(T*0.6+(px+py)*0.013)%1;
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(lerp(a[0][0],a[1][0],gp),lerp(a[0][1],a[1][1],gp),t*0.035,0,7);ctx.fill();
  ctx.globalAlpha=1;
}
function drawWall(px,py,x,y){
  const t=tile;
  ctx.fillStyle='#0c1425';ctx.fillRect(px,py,t,t);
  const g=ctx.createLinearGradient(px,py,px,py+t);
  g.addColorStop(0,'#3b4b70');g.addColorStop(1,'#222e49');
  ctx.fillStyle=g;ctx.fillRect(px+2,py+2,t-4,t-4);
  ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect(px+2,py+2,t-4,2);
  ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(px+2,py+t-4,t-4,2);
  if(hash(x*3,y*7)>0.8){
    ctx.save();ctx.translate(px+t/2,py+t/2);ctx.rotate(Math.PI/4);
    ctx.fillStyle='rgba(255,200,87,.16)';ctx.fillRect(-t*0.07,-t*0.07,t*0.14,t*0.14);ctx.restore();
  }
}
function drawVoid(px,py,x,y){
  const t=tile,cx=px+t/2,cy=py+t/2;
  ctx.fillStyle='#03060c';ctx.fillRect(px,py,t,t);
  const g=ctx.createRadialGradient(cx,cy,1,cx,cy,t*0.7);
  g.addColorStop(0,'rgba(86,184,255,.12)');g.addColorStop(1,'rgba(86,184,255,0)');
  ctx.fillStyle=g;ctx.fillRect(px,py,t,t);
  const a=T*0.9+hash(x,y)*6;
  ctx.strokeStyle='rgba(86,184,255,.15)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,t*0.3,a,a+1.9);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,t*0.17,-a*1.3,-a*1.3+1.6);ctx.stroke();
  ctx.strokeStyle='rgba(40,70,120,.5)';ctx.lineWidth=1;ctx.strokeRect(px+0.5,py+0.5,t-1,t-1);
}
function drawEmitter(e,i){
  const c=COLORS[e.c],p=g2p(e.x,e.y),t=tile;
  const g=ctx.createRadialGradient(p[0],p[1],1,p[0],p[1],t*0.55);
  g.addColorStop(0,'rgba('+c.rgb+',.3)');g.addColorStop(1,'rgba('+c.rgb+',0)');
  ctx.fillStyle=g;ctx.fillRect(p[0]-t*0.6,p[1]-t*0.6,t*1.2,t*1.2);
  ctx.beginPath();ctx.arc(p[0],p[1],t*0.34,0,7);
  ctx.fillStyle='#0e1626';ctx.fill();
  ctx.strokeStyle='rgba('+c.rgb+',.45)';ctx.lineWidth=1.5;ctx.stroke();
  const ang=Math.atan2(DIRC[e.d][1],DIRC[e.d][0]);
  for(let j=0;j<8;j++){
    const a=j/8*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(p[0]+Math.cos(a)*t*0.27,p[1]+Math.sin(a)*t*0.27);
    ctx.lineTo(p[0]+Math.cos(a)*t*0.31,p[1]+Math.sin(a)*t*0.31);
    ctx.strokeStyle='rgba('+c.rgb+',.5)';ctx.lineWidth=1;ctx.stroke();
  }
  const r=t*(0.12+Math.sin(T*3+i)*0.02);
  ctx.fillStyle=c.main;ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill();
  ctx.fillStyle=c.core;ctx.beginPath();ctx.arc(p[0],p[1],r*0.5,0,7);ctx.fill();
  ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(ang);
  ctx.fillStyle='rgba('+c.rgb+',.9)';
  ctx.beginPath();ctx.moveTo(t*0.44,0);ctx.lineTo(t*0.28,-t*0.11);ctx.lineTo(t*0.28,t*0.11);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawPrism(p,idx){
  const c=COLORS[p.c],lit=litSet.has(idx),pos=g2p(p.x,p.y),t=tile;
  if(lit){
    const pulse=0.32+Math.sin(T*4+idx)*0.1;
    const g=ctx.createRadialGradient(pos[0],pos[1],1,pos[0],pos[1],t*0.85);
    g.addColorStop(0,'rgba('+c.rgb+','+pulse+')');g.addColorStop(1,'rgba('+c.rgb+',0)');
    ctx.fillStyle=g;ctx.fillRect(pos[0]-t,pos[1]-t,t*2,t*2);
  }
  const s=t*0.3;
  ctx.save();ctx.translate(pos[0],pos[1]);ctx.rotate(Math.PI/4);
  if(lit){
    const g=ctx.createLinearGradient(0,-s,0,s);
    g.addColorStop(0,c.core);g.addColorStop(1,c.main);
    ctx.fillStyle=g;ctx.fillRect(-s*0.72,-s*0.72,s*1.44,s*1.44);
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.5;ctx.strokeRect(-s*0.72,-s*0.72,s*1.44,s*1.44);
  }else{
    ctx.fillStyle='rgba('+c.rgb+',.16)';ctx.fillRect(-s*0.72,-s*0.72,s*1.44,s*1.44);
    ctx.strokeStyle=c.main;ctx.lineWidth=2;ctx.strokeRect(-s*0.72,-s*0.72,s*1.44,s*1.44);
    ctx.fillStyle='rgba('+c.rgb+',.5)';ctx.fillRect(-s*0.16,-s*0.16,s*0.32,s*0.32);
  }
  ctx.restore();
  if(lit){
    ctx.save();ctx.translate(pos[0],pos[1]);ctx.rotate(T*1.1+idx);
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillRect(-t*0.03,-t*0.3,t*0.06,t*0.6);
    ctx.rotate(Math.PI/2);ctx.fillRect(-t*0.03,-t*0.3,t*0.06,t*0.6);
    ctx.globalCompositeOperation='source-over';ctx.restore();
  }
}
function drawDoor(){
  const pos=g2p(D.door.x,D.door.y),t=tile;
  if(!doorOpen){
    const g=ctx.createLinearGradient(pos[0]-t/2,pos[1]-t/2,pos[0]+t/2,pos[1]+t/2);
    g.addColorStop(0,'#3a4560');g.addColorStop(1,'#1d2740');
    ctx.fillStyle=g;ctx.fillRect(pos[0]-t*0.42,pos[1]-t*0.42,t*0.84,t*0.84);
    ctx.strokeStyle='rgba(125,141,176,.5)';ctx.lineWidth=1.5;
    ctx.strokeRect(pos[0]-t*0.42,pos[1]-t*0.42,t*0.84,t*0.84);
    const r=t*(0.13+Math.sin(T*2)*0.02);
    ctx.save();ctx.translate(pos[0],pos[1]);ctx.rotate(Math.PI/4);
    ctx.fillStyle='rgba(255,93,115,'+(0.55+Math.sin(T*2)*0.2)+')';
    ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();
  }else{
    const pulse=0.4+Math.sin(T*3.4)*0.15;
    const g=ctx.createRadialGradient(pos[0],pos[1],1,pos[0],pos[1],t*0.9);
    g.addColorStop(0,'rgba(255,200,87,'+pulse+')');g.addColorStop(1,'rgba(255,200,87,0)');
    ctx.fillStyle=g;ctx.fillRect(pos[0]-t,pos[1]-t,t*2,t*2);
    for(let j=0;j<3;j++){
      ctx.beginPath();
      ctx.arc(pos[0],pos[1],t*(0.14+j*0.13),(T*(j%2?1:-1))*1.6+j*2,(T*(j%2?1:-1))*1.6+j*2+4.2);
      ctx.strokeStyle='rgba(255,224,168,'+(0.7-j*0.18)+')';ctx.lineWidth=2;ctx.stroke();
    }
  }
}
function drawPlayer(){
  if(state==='menu')return;
  let gx,gy;
  if(player.moving){const e=player.t*player.t*(3-player.t*2);gx=lerp(player.sx,player.tx,e);gy=lerp(player.sy,player.ty,e);}
  else{gx=player.x;gy=player.y;}
  const p=g2p(gx,gy),t=tile,bob=Math.sin(T*(player.moving?7:3))*(player.moving?1.8:0.8);
  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.beginPath();ctx.ellipse(p[0],p[1]+t*0.16,t*0.24,t*0.1,0,0,7);ctx.fill();
  const ly=p[1]+bob;
  const lg=ctx.createRadialGradient(p[0]+player.face[0]*t*0.2,ly+player.face[1]*t*0.2,1,p[0],ly,t*0.55);
  lg.addColorStop(0,'rgba(255,214,138,.28)');lg.addColorStop(1,'rgba(255,214,138,0)');
  ctx.fillStyle=lg;ctx.fillRect(p[0]-t*0.6,ly-t*0.6,t*1.2,t*1.2);
  ctx.beginPath();ctx.arc(p[0],ly,t*0.29,0,7);
  ctx.fillStyle='#2e3f61';ctx.fill();
  ctx.strokeStyle='rgba(190,210,240,.55)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(p[0]+player.face[0]*t*0.05,ly+player.face[1]*t*0.05,t*0.16,0,7);
  ctx.fillStyle='#1c2942';ctx.fill();
  ctx.fillStyle='#ffe9b8';
  ctx.beginPath();ctx.arc(p[0]+player.face[0]*t*0.2,ly+player.face[1]*t*0.2,t*0.05,0,7);ctx.fill();
}
function drawBeams(segs,alphaMul,dash){
  const t=tile;
  for(const s of segs){
    const c=COLORS[s.c];
    const x1=ox+s.x1*t+t/2,y1=oy+s.y1*t+t/2,x2=ox+s.x2*t+t/2,y2=oy+s.y2*t+t/2;
    ctx.lineCap='round';
    ctx.strokeStyle='rgba('+c.rgb+','+(0.16*alphaMul)+')';ctx.lineWidth=t*0.3;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    if(alphaMul>0.5){
      ctx.strokeStyle=c.main;ctx.globalAlpha=0.85*alphaMul;ctx.lineWidth=t*0.1;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.strokeStyle=c.core;ctx.globalAlpha=0.95*alphaMul;ctx.lineWidth=t*0.045;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.globalAlpha=1;
      if(dash){
        ctx.setLineDash([t*0.22,t*0.5]);
        ctx.lineDashOffset=-((T*2.4)%1)*t*0.72;
        ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=t*0.06;
        ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
        ctx.setLineDash([]);ctx.lineDashOffset=0;
      }
    }
    const pr=t*(0.09+Math.sin(T*6+x1)*0.03);
    ctx.fillStyle='rgba('+c.rgb+',.75)';
    ctx.beginPath();ctx.arc(x2,y2,pr,0,7);ctx.fill();
  }
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1120');bg.addColorStop(1,'#05070d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0){const m=shake*shake*10;ctx.translate((Math.random()*2-1)*m,(Math.random()*2-1)*m);}
  const t=tile;
  // tiles
  for(let y=0;y<8;y++)for(let x=0;x<12;x++){
    const px=ox+x*t,py=oy+y*t,k=x+','+y,hh=hash(x,y);
    if(walls.has(k)){drawWall(px,py,x,y);continue;}
    if(voids.has(k)){drawVoid(px,py,x,y);continue;}
    const base=(x+y)&1?[15,24,42]:[18,28,48];
    ctx.fillStyle='rgb('+Math.round(base[0]+hh*6)+','+Math.round(base[1]+hh*7)+','+Math.round(base[2]+hh*9)+')';
    ctx.fillRect(px,py,t,t);
    ctx.fillStyle='rgba(0,0,0,.2)';
    ctx.fillRect(px,py+t-1,t,1);ctx.fillRect(px+t-1,py,1,t);
    for(let i=0;i<2;i++){
      const sx=px+hash(x*7+i,y*13)*t,sy=py+hash(x*11,y*5+i*3)*t;
      ctx.fillStyle='rgba(200,220,255,.05)';ctx.fillRect(sx,sy,1.6,1.6);
    }
  }
  // frame
  ctx.strokeStyle='rgba(86,184,255,.1)';ctx.lineWidth=1;
  ctx.strokeRect(ox-7.5,oy-7.5,t*12+15,t*8+15);
  ctx.strokeStyle='rgba(255,200,87,.35)';ctx.lineWidth=2;
  const fo=11,L=t*0.42;
  [[ox-fo,oy-fo,1,1],[ox+t*12+fo,oy-fo,-1,1],[ox-fo,oy+t*8+fo,1,-1],[ox+t*12+fo,oy+t*8+fo,-1,-1]].forEach(c=>{
    ctx.beginPath();ctx.moveTo(c[0]+c[2]*L,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*L);ctx.stroke();
  });
  drawDoor();
  emitters.forEach((e,i)=>drawEmitter(e,i));
  prisms.forEach((p,i)=>drawPrism(p,i));
  for(const m of fixedM)drawMirrorShape(ox+m.x*t,oy+m.y*t,m.o,true,1);
  for(const m of placed)drawMirrorShape(ox+m.x*t,oy+m.y*t,m.o,false,1);
  drawPlayer();
  if(sim)drawBeams(sim.segs,1,true);
  // hover ghost + preview
  if(state==='play'&&hover){
    const hx=hover.x,hy=hover.y,k=hx+','+hy;
    ctx.setLineDash([5,4]);ctx.strokeStyle='rgba(255,200,87,.4)';ctx.lineWidth=1.5;
    ctx.strokeRect(ox+hx*t+2,oy+hy*t+2,t-4,t-4);ctx.setLineDash([]);
    const m=mirrorAt(hx,hy);let opts=null,gO=null,bad=false;
    if(m){
      if(m.fixed){gO=m.o==='/'?'\\':'/';opts={set:{x:hx,y:hy,o:gO}};}
      else opts={omit:k};
    }else if(canPlace(hx,hy)){
      gO=curO;opts={set:{x:hx,y:hy,o:gO}};
      if(placed.length>=D.budget)bad=true;
    }
    if(opts&&!bad){
      drawBeams(simulate(opts).segs,0.5,false);
      if(gO)drawMirrorShape(ox+hx*t,oy+hy*t,gO,m&&m.fixed,0.42+Math.sin(T*5)*0.08);
    }else if(bad){
      drawMirrorShape(ox+hx*t,oy+hy*t,curO,false,0.18);
    }
  }
  // particles
  for(const p of parts){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    if(p.add)ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*(a*0.6+0.4),0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=1;
  ctx.restore();
  if(vig){ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);}
}

/* ============================== main loop ============================== */
function frame(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0);lastTs=ts;
  update(dt);draw();
  requestAnimationFrame(frame);
}
resize();
toMenu();
requestAnimationFrame(frame);
</script>
</body>
