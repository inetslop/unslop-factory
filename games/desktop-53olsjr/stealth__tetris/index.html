<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetra Blackout — Stealth Tetris</title>
<style>
  :root{
    --mono: ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace;
    --disp:'Arial Black','Avenir Next Heavy',Impact,'Segoe UI',sans-serif;
    --amber:#ffb02e; --red:#ff3b5c; --cyan:#35e0ff; --ink:#eaf6ff; --dim:#6d8aa5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#060b11;font-family:var(--mono)}
  #c{position:fixed;inset:0;z-index:1;display:block}
  body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at center,transparent 52%,rgba(2,6,10,.55));}
  .veil{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px;
    background:rgba(5,9,14,.78)}
  .veil.hide{display:none}
  .card{width:min(640px,94vw);max-height:94vh;overflow:auto;background:#0c141d;border:1px solid #22344a;
    clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));
    box-shadow:0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(140,190,255,.08);
    animation:pop .38s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}
  .hz{height:7px;background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,#10161f 14px 28px)}
  .hz-red{background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#10161f 14px 28px)}
  .body{padding:22px 26px 24px}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.34em;color:var(--amber);margin-bottom:10px}
  .kicker.red{color:var(--red)}
  h1.title{font-family:var(--disp);font-weight:900;font-size:clamp(38px,6.5vw,56px);line-height:.95;
    letter-spacing:.02em;color:var(--ink);margin:0 0 12px}
  h1.title span{color:var(--amber);text-shadow:0 0 26px rgba(255,176,46,.45)}
  h1.title.busted{color:var(--red);text-shadow:0 0 30px rgba(255,59,92,.5)}
  h1.title.overflow{color:var(--amber);text-shadow:0 0 26px rgba(255,176,46,.4)}
  p.tag{color:#9db8cd;font-size:13.5px;line-height:1.6;margin:0 0 16px;max-width:56ch}
  .cols{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-bottom:18px}
  @media(max-width:560px){.cols{grid-template-columns:1fr}}
  .ctrl-grid{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px;color:#b9d2e4;align-content:start}
  .ctrl-grid span{letter-spacing:.04em}
  kbd{font-family:var(--mono);font-weight:700;font-size:10.5px;background:#131e2a;border:1px solid #2c405a;
    border-bottom-width:2px;padding:2px 7px;border-radius:4px;color:#ffd98a;letter-spacing:.06em;white-space:nowrap}
  .brief{background:#0e1823;border:1px solid #1d2f42;padding:12px 14px}
  .brief h3{font-size:11px;letter-spacing:.28em;color:var(--amber);margin:0 0 9px;font-weight:700}
  .brief ul{margin:0;padding-left:16px}
  .brief li{font-size:12px;line-height:1.55;color:#9db8cd;margin-bottom:6px}
  .brief b{color:var(--ink);font-weight:700}
  .btn{display:block;width:100%;font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.2em;
    padding:14px;background:var(--amber);color:#171006;border:none;cursor:pointer;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    transition:transform .12s ease,filter .12s ease}
  .btn:hover{filter:brightness(1.14);transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  .hint{margin-top:10px;text-align:center;font-size:11.5px;color:var(--dim);letter-spacing:.08em}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
  @media(max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:#0e1823;border:1px solid #1d2f42;padding:10px 6px;text-align:center;position:relative}
  .stat label{display:block;font-size:9.5px;letter-spacing:.24em;color:var(--dim);margin-bottom:5px}
  .stat b{font-size:19px;color:var(--ink);font-weight:700}
  .badge{position:absolute;top:-8px;right:-6px;background:#57e389;color:#04210f;font-size:8.5px;font-weight:800;
    letter-spacing:.12em;padding:2px 6px;transform:rotate(6deg)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil" class="veil"></div>

<script>
'use strict';
/* ============================== CONSTANTS ============================== */
const COLS=10, ROWS=20, C=32;
const BW=COLS*C, BH=ROWS*C;
const RIG_H=58, M_TOP=18, M_BOT=34;
const STAGE_W=868, STAGE_H=M_TOP+RIG_H+BH+M_BOT;      // 868 x 750
const BOARD_X=(STAGE_W-BW)/2, BOARD_Y=M_TOP+RIG_H;    // 274 / 76
const GAP=18, LX=18, LW=BOARD_X-GAP-LX;               // left panel
const RX=BOARD_X+BW+GAP, RW=STAGE_W-18-RX;            // right panel
const F_MONO="'Cascadia Code',Consolas,Menlo,ui-monospace,monospace";
const PCOL=['#3fd4ff','#ffd166','#b48cff','#5ce8a4','#ff6d8a','#7aa2ff','#ffa14f'];
const TYPES=['I','O','T','S','Z','J','L'];

/* ============================== CANVAS / SCALE ============================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let DPR=1, VW=0, VH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
}
window.addEventListener('resize',resize); resize();

/* ============================== AUDIO (Web Audio, post-gesture) ============================== */
const AU={ac:null,master:null,muted:false,nbuf:null,
  ensure(){
    if(this.ac){ if(this.ac.state==='suspended') this.ac.resume().catch(()=>{}); return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ac=new AC(); this.master=this.ac.createGain(); this.master.gain.value=.45;
      this.master.connect(this.ac.destination);
      const len=Math.floor(this.ac.sampleRate*.3), b=this.ac.createBuffer(1,len,this.ac.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1; this.nbuf=b;
    }catch(e){ this.ac=null; }
  },
  tone(f,dur,type,vol,slideTo,delay){
    if(!this.ac||this.muted) return; type=type||'square'; vol=vol||.15; delay=delay||0;
    try{
      const t0=this.ac.currentTime+delay, o=this.ac.createOscillator(), g=this.ac.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t0);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
      g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
      o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+.03);
    }catch(e){}
  },
  noise(dur,vol,delay,lp){
    if(!this.ac||this.muted||!this.nbuf) return; vol=vol||.2; delay=delay||0; lp=lp||1200;
    try{
      const t0=this.ac.currentTime+delay, s=this.ac.createBufferSource(); s.buffer=this.nbuf;
      const f=this.ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp;
      const g=this.ac.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t0); s.stop(t0+dur+.03);
    }catch(e){}
  }
};
const SFX={
  move(){AU.tone(240,.045,'square',.06)},
  rotate(){AU.tone(360,.06,'triangle',.12,520)},
  hold(){AU.tone(300,.07,'sine',.14,220)},
  hard(){AU.tone(95,.1,'sine',.3,45); AU.noise(.06,.18,0,2200)},
  lock(){AU.tone(70,.09,'sine',.22,40)},
  clear(n){const base=[523,659,784,1046,1318]; const k=Math.min(n+1,5);
    for(let i=0;i<k;i++) AU.tone(base[i],.09,'triangle',.16,0,i*.055);
    if(n>=4) AU.tone(130,.32,'sawtooth',.18,60);},
  warn(){AU.tone(920,.07,'square',.1,880)},
  bust(){AU.tone(880,.9,'sawtooth',.25,140); AU.noise(.7,.3,0,900)},
  jam(){AU.tone(1400,.4,'sine',.2,260); AU.tone(200,.5,'triangle',.1,80,.05)},
  level(){AU.tone(660,.08,'triangle',.15); AU.tone(990,.12,'triangle',.15,0,.09)},
  start(){AU.tone(440,.07,'square',.12); AU.tone(660,.1,'square',.12,0,.08)}
};

/* ============================== TETROMINO DATA (SRS) ============================== */
const BASE={
  I:[[0,1],[1,1],[2,1],[3,1]], O:[[1,0],[2,0],[1,1],[2,1]],
  T:[[1,0],[0,1],[1,1],[2,1]], S:[[1,0],[2,0],[0,1],[1,1]],
  Z:[[0,0],[1,0],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]]
};
const BOX={I:4,O:3,T:3,S:3,Z:3,J:3,L:3};
const SHAPES={};
(function(){
  for(const t of TYPES){
    SHAPES[t]=[BASE[t]];
    for(let r=1;r<4;r++){
      const n=BOX[t];
      SHAPES[t][r]=SHAPES[t][r-1].map(([x,y])=>[n-1-y,x]);
    }
  }
})();
const KICK={ // y already flipped for screen coords (down = +)
  JLSTZ:{'01':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],'10':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],
    '12':[[0,0],[1,0],[1,1],[0,-2],[1,-2]],'21':[[0,0],[-1,0],[-1,-1],[0,2],[-1,2]],
    '23':[[0,0],[1,0],[1,-1],[0,2],[1,2]],'32':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    '30':[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],'03':[[0,0],[1,0],[1,-1],[0,2],[1,2]]},
  I:{'01':[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],'10':[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],
    '12':[[0,0],[-1,0],[2,0],[-1,-2],[2,1]],'21':[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],
    '23':[[0,0],[2,0],[-1,0],[2,-1],[-1,2]],'32':[[0,0],[-2,0],[1,0],[-2,1],[1,-2]],
    '30':[[0,0],[1,0],[-2,0],[1,2],[-2,-1]],'03':[[0,0],[-1,0],[2,0],[-1,-2],[2,1]]}
};

/* ============================== GAME STATE ============================== */
let state='menu', paused=false;
const G={};
function resetGame(){
  G.grid=Array.from({length:ROWS},()=>new Array(COLS).fill(0));
  G.bag=[]; G.queue=[]; for(let i=0;i<3;i++) G.queue.push(drawBag());
  G.cur=null; G.hold=null; G.canHold=true;
  G.score=0; G.lines=0; G.level=1;
  G.det=0; G.streak=0; G.jam=.5; G.jammed=0;
  G.time=0; G.camTime=Math.random()*6; rebuildCams();
  G.clearRows=[]; G.clearT=0; G.dropAcc=0; G.lockT=.5; G.resets=0; G.spawnT=0;
  G.busted=false; G.bustT=0; G.shake=0; G.warnT=0; G.reason='';
  G.parts=[]; G.floats=[];
}
resetGame();

let best=0;
try{ best=parseInt(localStorage.getItem('tb_best')||'0',10)||0; }catch(e){}
function saveBest(){ try{ localStorage.setItem('tb_best',String(best)); }catch(e){} }

function drawBag(){
  if(!G.bag.length){ G.bag=TYPES.slice();
    for(let i=G.bag.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [G.bag[i],G.bag[j]]=[G.bag[j],G.bag[i]]; } }
  return G.bag.pop();
}

/* ============================== CAMERAS / SCANNERS ============================== */
function camConfig(level){
  const n=level>=7?3 : level>=3?2 : 1;
  const w=Math.min(1.5, .55+level*.085);
  return {n,w};
}
function rebuildCams(){
  const {n,w}=camConfig(G.level); G.cams=[];
  for(let i=0;i<n;i++) G.cams.push({w, ph:i*(Math.PI*2/n)+(i? .9:0), amp:3.5+(i%2)*.45, hit:false});
}

/* ============================== COLLISION / MOVEMENT ============================== */
function collide(x,y,type,rot){
  type=type||G.cur.type; rot=rot==null?G.cur.rot:rot;
  for(const [dx,dy] of SHAPES[type][rot]){
    const cx=x+dx, cy=y+dy;
    if(cx<0||cx>=COLS||cy>=ROWS) return true;
    if(cy>=0 && G.grid[cy][cx]) return true;
  }
  return false;
}
function ghostY(){
  let gy=G.cur.y; while(!collide(G.cur.x,gy+1)) gy++; return gy;
}
function placeType(t){
  G.cur={type:t,rot:0,x:3,y:-3}; G.dropAcc=0; G.lockT=.5; G.resets=0; G.spawnT=.18;
  if(collide(3,-3,t,0)) gameOver('overflow');
}
function tryMove(dx){
  if(!G.cur||G.busted) return false;
  const nx=G.cur.x+dx;
  if(!collide(nx,G.cur.y)){ G.cur.x=nx;
    if(G.resets<15){ G.lockT=.5; G.resets++; }
    SFX.move(); return true; }
  return false;
}
function tryRotate(dir){
  if(!G.cur||G.busted) return;
  const from=G.cur.rot, to=(from+dir+4)%4;
  const table=G.cur.type==='I'?KICK.I:KICK.JLSTZ;
  for(const [kx,ky] of table[from+''+to]){
    if(!collide(G.cur.x+kx,G.cur.y+ky)){
      G.cur.rot=to; G.cur.x+=kx; G.cur.y+=ky;
      if(G.resets<15){ G.lockT=.5; G.resets++; }
      SFX.rotate(); return;
    }
  }
}
function hardDrop(){
  if(!G.cur||G.busted) return;
  let d=0; while(!collide(G.cur.x,G.cur.y+1)){ G.cur.y++; d++; }
  if(d>0){ G.score+=2*d; G.shake=Math.max(G.shake,d>6?5:3); dustAtPiece(); SFX.hard(); }
  lockPiece();
}
function holdSwap(){
  if(!G.cur||!G.canHold||G.busted) return;
  const t=G.cur.type;
  if(G.hold==null){ G.hold=t; placeType(G.queue.shift()); G.queue.push(drawBag()); }
  else { const h=G.hold; G.hold=t; placeType(h); }
  G.canHold=false; SFX.hold();
}
function spawnNext(){
  G.cur=null; G.canHold=true;
  placeType(G.queue.shift()); G.queue.push(drawBag());
}

/* ============================== LOCK / CLEARS / SCORE ============================== */
function lockPiece(){
  const cur=G.cur; G.cur=null;
  const idx=TYPES.indexOf(cur.type)+1; let topOut=false;
  for(const [dx,dy] of SHAPES[cur.type][cur.rot]){
    const cx=cur.x+dx, cy=cur.y+dy;
    if(cy<0){ topOut=true; continue; }
    G.grid[cy][cx]=idx;
    spawnSparks(BOARD_X+(cx+.5)*C, BOARD_Y+(cy+.5)*C, PCOL[idx-1], 3, .5);
  }
  SFX.lock();
  if(topOut){ gameOver('overflow'); return; }
  const full=[]; for(let r=0;r<ROWS;r++) if(G.grid[r].every(v=>v)) full.push(r);
  if(full.length) doClears(full); else spawnNext();
}
function doClears(rows){
  G.clearRows=rows; G.clearT=.26;
  const n=rows.length, base=[0,100,300,500,800][n-1]*G.level;
  const bonus=Math.min(200,Math.round(G.streak*5));
  G.score+=base+bonus; G.lines+=n; G.jam=Math.min(1,G.jam+n*.25);
  SFX.clear(n); G.shake=Math.max(G.shake,n>=3?6:3);
  for(const r of rows){
    const y=BOARD_Y+(r+.5)*C;
    for(let i=0;i<14;i++){
      const col=G.grid[r][i]?PCOL[G.grid[r][i]-1]:'#eaf6ff';
      G.parts.push({x:BOARD_X+i*C+8,y,vx:(Math.random()-.5)*260,vy:-60-Math.random()*120,
        g:420,life:.55,max:.55,size:2+Math.random()*3,c:col});
    }
  }
  addFloat(BOARD_X+BW/2, BOARD_Y+(rows[0]-.4)*C, (n===4?'TETRIS! ':'')+'+'+base, n>=3?'#ffb02e':'#eaf6ff', n>=3?22:17);
  if(bonus>0) addFloat(BOARD_X+BW/2, BOARD_Y+(rows[0]+.7)*C, 'GHOST +'+bonus, '#35e0ff', 14);
  const nl=Math.floor(G.lines/5)+1;
  if(nl>G.level){ G.level=nl; rebuildCams(); SFX.level();
    addFloat(BOARD_X+BW/2, BOARD_Y+BH*.42,'SECURITY ESCALATED','#ff3b5c',18); }
}
function collapseRows(){
  const rows=G.clearRows.slice().sort((a,b)=>a-b);
  for(const r of rows) G.grid.splice(r,1);
  while(G.grid.length<ROWS) G.grid.unshift(new Array(COLS).fill(0));
  G.clearRows=[]; spawnNext();
}

/* ============================== JAMMER / DETECTION / END ============================== */
function jammer(){
  if(!G.cur||G.busted||G.jammed>0||G.jam<.25) return;
  G.jammed=.7+G.jam*1.5; G.jam=0; SFX.jam();
  addFloat(BOARD_X+BW/2, BOARD_Y+RIG_H*.6,'SCANNERS JAMMED','#35e0ff',18);
}
function detection(dt){
  const cur=G.cur; if(!cur) return;
  let any=false;
  for(const cam of G.cams){
    const c=Math.max(0,Math.min(9,Math.round(cam.colF))); let hit=false;
    for(const [dx,dy] of SHAPES[cur.type][cur.rot]){
      if(cur.y+dy>=0 && cur.x+dx===c) hit=true;
    }
    cam.hit=hit; any=any||hit;
  }
  const grace=G.time<2.5;
  if(any&&!grace){
    G.det=Math.min(1,G.det+dt/.85); G.streak=0;
    G.warnT-=dt; if(G.warnT<=0){ SFX.warn(); G.warnT=.16; }
    G.shake=Math.max(G.shake,1.2);
  } else {
    for(const cam of G.cams) cam.hit=false;
    G.det=Math.max(0,G.det-dt/1.7); G.streak+=dt;
  }
  if(G.det>=1) triggerBust();
}
function triggerBust(){
  G.busted=true; G.bustT=0; G.shake=12; SFX.bust();
  for(let i=0;i<46;i++) G.parts.push({x:BOARD_X+BW/2,y:BOARD_Y+BH*.35,
    vx:(Math.random()-.5)*520,vy:(Math.random()-.5)*520,g:160,life:.9,max:.9,size:2+Math.random()*4,c:'#ff3b5c'});
}
function gameOver(reason){
  G.reason=reason; state='over';
  if(G.score>best){ best=G.score; saveBest(); }
  showOver();
}

/* ============================== FX HELPERS ============================== */
function addFloat(x,y,txt,c,size){ G.floats.push({x,y,txt,c,size:size||16,t:0,life:1.1}); }
function spawnSparks(x,y,c,n,pow){
  for(let i=0;i<n;i++) G.parts.push({x,y,vx:(Math.random()-.5)*90*pow,vy:-40*Math.random()*pow,
    g:300,life:.4,max:.4,size:1.5+Math.random()*2,c});
}
function dustAtPiece(){
  if(!G.cur) return; const gy=ghostY();
  for(const [dx,dy] of SHAPES[G.cur.type][G.cur.rot]){
    if(gy+dy>=0 && gy+dy<ROWS && !G.grid[gy+dy][G.cur.x+dx])
      spawnSparks(BOARD_X+(G.cur.x+dx+.5)*C, BOARD_Y+(gy+dy+1)*C, '#9db8cd', 2, .4);
  }
}

/* ============================== INPUT ============================== */
const das={L:{on:false,t:0,r:0},R:{on:false,t:0,r:0},D:{on:false,t:0,r:0}};
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space'].includes(k)) e.preventDefault();
  AU.ensure();
  if(e.repeat) return;
  if(k==='KeyM'){ AU.muted=!AU.muted; try{localStorage.setItem('tb_mute',AU.muted?'1':'0');}catch(err){} return; }
  if(state==='menu'){ if(k==='Enter'||k==='Space') newGame(); return; }
  if(state==='over'){ if(k==='Enter'||k==='KeyR'||k==='Space') newGame(); return; }
  if(k==='KeyP'){ paused=!paused; return; }
  if(paused||G.busted) return;
  switch(k){
    case 'ArrowLeft':  tryMove(-1); das.L.on=true; das.L.t=0; das.L.r=0; break;
    case 'ArrowRight': tryMove(1);  das.R.on=true; das.R.t=0; das.R.r=0; break;
    case 'ArrowDown':  das.D.on=true; das.D.t=0; das.D.r=0; break;
    case 'ArrowUp': case 'KeyX': tryRotate(1); break;
    case 'KeyZ': tryRotate(-1); break;
    case 'Space': hardDrop(); break;
    case 'KeyC': holdSwap(); break;
    case 'KeyE': jammer(); break;
    case 'KeyR': newGame(); break;
  }
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft') das.L.on=false;
  if(e.code==='ArrowRight') das.R.on=false;
  if(e.code==='ArrowDown') das.D.on=false;
});
window.addEventListener('pointerdown',()=>AU.ensure());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && state==='play' && !G.busted) paused=true;
});

/* ============================== MAIN LOOP ============================== */
function update(dt){
  tGlobal+=dt;
  // background rain
  for(const p of rain){ p.y+=p.sp*dt; if(p.y>VH+p.len){ p.y=-p.len-10; p.x=Math.random()*VW; } }
  G.shake=Math.max(0,G.shake-dt*26);

  if(state==='play'&&!paused){
    if(G.busted){
      G.bustT+=dt;
      if(G.bustT>1.15){ G.reason='busted'; state='over'; if(G.score>best){best=G.score;saveBest();} showOver(); }
    } else {
      G.time+=dt;
      if(G.jammed>0) G.jammed-=dt; else G.camTime+=dt;
      for(const cam of G.cams) cam.colF=4.5+cam.amp*Math.sin(G.camTime*cam.w+cam.ph);

      const live=(!G.clearRows.length && G.cur);
      if(live){
        // auto-run / soft-drop DAS
        for(const key of ['L','R']){
          const d=das[key]; if(!d.on) continue; d.t+=dt;
          if(d.t>.17){ d.r+=dt; while(d.r>.055){ d.r-=.055; tryMove(key==='L'?-1:1); } }
        }
        const soft=das.D.on; das.D.t+=dt;
        let iv=soft? .045 : Math.max(.06,.72*Math.pow(.85,G.level-1));
        G.dropAcc+=dt;
        while(G.dropAcc>=iv){
          G.dropAcc-=iv;
          if(!collide(G.cur.x,G.cur.y+1)){ G.cur.y++; if(soft) G.score+=1; } else break;
        }
        const grounded=collide(G.cur.x,G.cur.y+1);
        if(grounded){ G.lockT-=dt*(soft?5:1); if(G.lockT<=0) lockPiece(); }
        else G.lockT=Math.min(.5,G.lockT+dt);
        detection(dt);
      } else if(G.clearRows.length){
        G.det=Math.max(0,G.det-dt/1.7);
        G.clearT-=dt; if(G.clearT<=0) collapseRows();
      } else {
        G.det=Math.max(0,G.det-dt/1.7);
        if(!G.cur) spawnNext();
      }
    }
  } else if(state==='menu'){
    G.camTime+=dt;
    for(const cam of G.cams) cam.colF=4.5+cam.amp*Math.sin(G.camTime*cam.w+cam.ph);
  }

  // fx (always run so menu/over also feel alive)
  for(let i=G.parts.length-1;i>=0;i--){ const p=G.parts[i];
    p.life-=dt; if(p.life<=0){ G.parts.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(let i=G.floats.length-1;i>=0;i--){ const f=G.floats[i];
    f.t+=dt; f.y-=22*dt; if(f.t>f.life) G.floats.splice(i,1); }
}

/* ============================== DRAWING ============================== */
const rain=[]; for(let i=0;i<46;i++) rain.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  len:20+Math.random()*50,sp:30+Math.random()*80,a:.04+Math.random()*.07,
  c:['#35e0ff','#35e0ff','#57e389','#ffb02e'][Math.floor(Math.random()*4)]});

let tGlobal=0;
function panel(x,y,w,h,fill,edge){
  const c=10; ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x+w-c,y); ctx.lineTo(x+w,y+c); ctx.lineTo(x+w,y+h);
  ctx.lineTo(x+c,y+h); ctx.lineTo(x,y+h-c); ctx.lineTo(x,y); ctx.closePath();
  ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle=edge; ctx.lineWidth=1; ctx.stroke();
}
function cellPx(px,py,s,idx){
  const col=PCOL[idx-1];
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(px+1,py+1,s-2,s-2);
  ctx.fillStyle=col; ctx.fillRect(px+1.5,py+1.5,s-4,s-4);
  ctx.fillStyle='rgba(255,255,255,.30)'; ctx.fillRect(px+1.5,py+1.5,s-4,2);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(px+1.5,py+s-3.5,s-4,2);
  ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(px+1.5,py+1.5,2,s-4);
}
function mini(type,cx,cy,cs){
  const cells=SHAPES[type][0]; let mnx=9,mxx=0,mny=9,mxy=0;
  for(const [dx,dy] of cells){ mnx=Math.min(mnx,dx);mxx=Math.max(mxx,dx);mny=Math.min(mny,dy);mxy=Math.max(mxy,dy); }
  const w=(mxx-mnx+1)*cs, h=(mxy-mny+1)*cs, idx=TYPES.indexOf(type)+1;
  for(const [dx,dy] of cells) cellPx(cx-w/2+(dx-mnx)*cs, cy-h/2+(dy-mny)*cs, cs, idx);
}

function draw(){
  // ---- full-window ambient layer (screen space) ----
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg=ctx.createLinearGradient(0,0,0,VH);
  bg.addColorStop(0,'#0a1119'); bg.addColorStop(.6,'#0c1824'); bg.addColorStop(1,'#0a131e');
  ctx.fillStyle=bg; ctx.fillRect(0,0,VW,VH);
  ctx.strokeStyle='rgba(53,224,255,.03)'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=0;x<VW;x+=44){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,VH); }
  for(let y=0;y<VH;y+=44){ ctx.moveTo(0,y+.5); ctx.lineTo(VW,y+.5); }
  ctx.stroke();
  for(const p of rain){ ctx.globalAlpha=p.a; ctx.strokeStyle=p.c; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x,p.y+p.len); ctx.stroke(); }
  ctx.globalAlpha=1;

  // ---- stage transform (+shake) ----
  const sc=Math.min(VW/STAGE_W,VH/STAGE_H), ox=(VW-STAGE_W*sc)/2, oy=(VH-STAGE_H*sc)/2;
  const shx=(Math.random()-.5)*G.shake, shy=(Math.random()-.5)*G.shake;
  ctx.setTransform(DPR*sc,0,0,DPR*sc,DPR*(ox+shx*sc),DPR*(oy+shy*sc));

  // ---- side panels ----
  panel(LX,BOARD_Y,LW,BH,'#0d1520','#24374c');
  panel(RX,BOARD_Y,RW,BH,'#0d1520','#24374c');
  drawLeftPanel(); drawRightPanel();

  // ---- rig / rail ----
  ctx.fillStyle='#16202c'; ctx.fillRect(BOARD_X-8,26,BW+16,6);
  ctx.strokeStyle='rgba(157,184,205,.25)'; ctx.lineWidth=1;
  for(let i=0;i<=COLS*2;i++){ const x=BOARD_X-8+(BW+16)/20*i; ctx.beginPath(); ctx.moveTo(x,33); ctx.lineTo(x,37); ctx.stroke(); }
  ctx.font='700 10px '+F_MONO; try{ctx.letterSpacing='2px';}catch(e){}
  ctx.fillStyle='#6d8aa5'; ctx.textAlign='left';
  ctx.fillText('PATROL SCANNERS',BOARD_X,21);
  ctx.textAlign='right'; ctx.fillText('x'+G.cams.length+' // RAIL-07',BOARD_X+BW,21);
  try{ctx.letterSpacing='0px';}catch(e){}

  // ---- board frame + grid ----
  panel(BOARD_X-8,BOARD_Y-8,BW+16,BH+16,'#0b121c','#2a4058');
  ctx.strokeStyle='rgba(43,66,88,.35)'; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<COLS;i++){ const x=BOARD_X+i*C+.5; ctx.moveTo(x,BOARD_Y); ctx.lineTo(x,BOARD_Y+BH); }
  for(let i=1;i<ROWS;i++){ const y=BOARD_Y+i*C+.5; ctx.moveTo(BOARD_X,y); ctx.lineTo(BOARD_X+BW,y); }
  ctx.stroke();
  ctx.strokeStyle='rgba(255,176,46,.30)'; ctx.setLineDash([5,4]); ctx.beginPath();
  ctx.moveTo(BOARD_X,BOARD_Y+.5); ctx.lineTo(BOARD_X+BW,BOARD_Y+.5); ctx.stroke(); ctx.setLineDash([]);

  // ---- locked stack ----
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(G.grid[r][c]) cellPx(BOARD_X+c*C,BOARD_Y+r*C,C,G.grid[r][c]);

  // ---- ghost + active piece ----
  const cur=G.cur;
  if(cur && state==='play' && !G.busted){
    const gy=ghostY(), cells=SHAPES[cur.type][cur.rot], idx=TYPES.indexOf(cur.type)+1;
    for(const [dx,dy] of cells){ const y=gy+dy; if(y<0) continue;
      ctx.strokeStyle='rgba(234,246,255,.30)'; ctx.lineWidth=1.5;
      ctx.strokeRect(BOARD_X+(cur.x+dx)*C+2, BOARD_Y+y*C+2, C-4, C-4); }
    const a=Math.min(1,G.spawnT/.18);
    ctx.globalAlpha=a;
    ctx.shadowColor=PCOL[idx-1]; ctx.shadowBlur=12;
    for(const [dx,dy] of cells){ const y=cur.y+dy; if(y<0) continue; cellPx(BOARD_X+(cur.x+dx)*C,BOARD_Y+y*C,C,idx); }
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }

  // ---- scanner beams + pods (drawn over pieces = "light on you") ----
  const grace=state==='play'&&G.time<2.5;
  for(const cam of G.cams){
    const bx=BOARD_X+(cam.colF+.5)*C, jam=G.jammed>0, hit=cam.hit;
    const topY=62, botY=BOARD_Y+BH;
    const col=hit?'#ff3b5c':'#ffb02e';
    let al=jam? .14 : (grace? .18 : .3);
    if(hit) al*=.7+.3*Math.sin(tGlobal*60);
    const g=ctx.createLinearGradient(0,topY,0,botY);
    g.addColorStop(0,hexA(col,.55)); g.addColorStop(.25,hexA(col,al)); g.addColorStop(1,hexA(col,.03));
    ctx.fillStyle=g; ctx.beginPath();
    const jx=jam?(Math.random()-.5)*2:0;
    ctx.moveTo(bx-5+jx,topY); ctx.lineTo(bx+5+jx,topY);
    ctx.lineTo(bx+C*.42,botY); ctx.lineTo(bx-C*.42,botY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=hexA(col,jam?.15:.5); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(bx+jx,topY); ctx.lineTo(bx,botY); ctx.stroke();
    // pod
    const px=bx-17, py=42;
    ctx.fillStyle='#1a2531'; ctx.strokeStyle=hit?'#ff3b5c':'#33475c'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(px+6,py); ctx.lineTo(px+28,py); ctx.lineTo(px+34,py+6);
    ctx.lineTo(px+34,py+18); ctx.lineTo(px,py+18); ctx.lineTo(px,py+6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#0c141d'; ctx.fillRect(bx-4,py+2,8,9);
    if(!jam){ ctx.shadowColor=col; ctx.shadowBlur=hit?16:8; ctx.fillStyle=col; }
    else { ctx.fillStyle='#3a4c5e'; }
    ctx.beginPath(); ctx.arc(bx,py+7,3.6,0,7); ctx.fill(); ctx.shadowBlur=0;
    if((tGlobal*2)%1<.5){ ctx.fillStyle=jam?'#3a4c5e':'#ff3b5c'; ctx.fillRect(px+29,py+3,3,3); }
  }
  // white-hot flash on detected cells
  if(cur && state==='play'&&!G.busted){
    for(const cam of G.cams){ if(!cam.hit) continue;
      const c=Math.max(0,Math.min(9,Math.round(cam.colF)));
      for(const [dx,dy] of SHAPES[cur.type][cur.rot]){
        if(cur.y+dy>=0 && cur.x+dx===c){
          ctx.fillStyle='rgba(255,240,240,'+(.35+.25*Math.sin(tGlobal*50))+')';
          ctx.fillRect(BOARD_X+c*C,BOARD_Y+(cur.y+dy)*C,C,C);
        } } }
  }
  if(grace){ ctx.font='700 10px '+F_MONO; ctx.fillStyle='#ffb02e'; ctx.textAlign='center';
    ctx.fillText('CALIBRATING…',BOARD_X+BW/2,58); }
  if(G.jammed>0){
    ctx.font='700 10px '+F_MONO; ctx.fillStyle='#35e0ff'; ctx.textAlign='center';
    ctx.fillText('JAMMED '+G.jammed.toFixed(1)+'s',BOARD_X+BW/2,58);
    ctx.fillStyle='#0c141d'; ctx.fillRect(BOARD_X,62,BW,3);
    ctx.fillStyle='#35e0ff'; ctx.fillRect(BOARD_X,62,BW*Math.min(1,G.jammed/(.7+1.5)),3);
  }

  // ---- clear flash rows ----
  if(G.clearRows.length){
    const t=1-G.clearT/.26;
    for(const r of G.clearRows){
      ctx.fillStyle='rgba(255,255,255,'+(.85*(1-t))+')';
      ctx.fillRect(BOARD_X,BOARD_Y+r*C,BW,C);
      ctx.fillStyle='rgba(53,224,255,'+(.5*(1-t))+')';
      ctx.fillRect(BOARD_X,BOARD_Y+r*C-2,t*BW+4,2); ctx.fillRect(BOARD_X,BOARD_Y+r*C+C,BW*t,2);
    }
  }

  // ---- particles & floating text (clipped to board zone) ----
  ctx.save(); ctx.beginPath(); ctx.rect(BOARD_X-10,BOARD_Y-14,BW+20,BH+24); ctx.clip();
  for(const p of G.parts){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.c;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); }
  ctx.globalAlpha=1;
  for(const f of G.floats){ const a=1-f.t/f.life; ctx.globalAlpha=a;
    ctx.font='800 '+f.size+'px '+F_MONO; ctx.textAlign='center';
    ctx.strokeStyle='rgba(6,11,17,.8)'; ctx.lineWidth=3; ctx.strokeText(f.txt,f.x,f.y);
    ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1; ctx.restore();

  drawFooter();

  // ---- overlays: pause / busted ----
  if(state==='play'&&paused){
    ctx.fillStyle='rgba(5,9,14,.62)'; ctx.fillRect(0,0,STAGE_W,STAGE_H);
    ctx.font='900 42px '+F_MONO; ctx.fillStyle='#eaf6ff'; ctx.textAlign='center';
    ctx.fillText('P A U S E D',STAGE_W/2,STAGE_H/2-8);
    ctx.font='700 13px '+F_MONO; ctx.fillStyle='#6d8aa5';
    ctx.fillText('PRESS P TO RESUME',STAGE_W/2,STAGE_H/2+24);
  }
  if(G.busted){
    ctx.fillStyle='rgba(255,40,60,'+(.16+.1*Math.sin(tGlobal*40))+')';
    ctx.fillRect(0,0,STAGE_W,STAGE_H);
    if((tGlobal*6)%1<.6){
      ctx.font='900 52px '+F_MONO; ctx.fillStyle='#ff3b5c'; ctx.textAlign='center';
      ctx.strokeStyle='rgba(6,11,17,.9)'; ctx.lineWidth=5;
      ctx.strokeText('DETECTED',STAGE_W/2,BOARD_Y+BH*.4);
      ctx.fillText('DETECTED',STAGE_W/2,BOARD_Y+BH*.4);
    }
  }
}

function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

/* ---- HUD: left panel ---- */
function drawLeftPanel(){
  const x=LX; let y=BOARD_Y+24;
  ctx.font='700 10px '+F_MONO; try{ctx.letterSpacing='2px';}catch(e){}
  ctx.fillStyle='#6d8aa5'; ctx.textAlign='left'; ctx.fillText('CARGO HOLD',x+14,y); y+=10;
  ctx.strokeStyle='#1d2f42'; ctx.strokeRect(x+14.5,y+.5,96,72);
  ctx.fillStyle='#0a1119'; ctx.fillRect(x+15,y+1,95,71);
  if(G.hold) mini(G.hold,x+62,y+36,17);
  else { ctx.font='700 10px '+F_MONO; ctx.fillStyle='#3a4c5e'; ctx.textAlign='center'; ctx.fillText('EMPTY',x+62,y+40); }
  y+=96;
  ctx.font='700 10px '+F_MONO; ctx.fillStyle='#6d8aa5'; ctx.textAlign='left'; ctx.fillText('SCORE',x+14,y);
  ctx.font='800 30px '+F_MONO; ctx.fillStyle='#eaf6ff';
  ctx.fillText(G.score.toLocaleString('en-US'),x+14,y+32); y+=50;
  ctx.strokeStyle='#1d2f42'; ctx.beginPath(); ctx.moveTo(x+14,y-8.5); ctx.lineTo(x+LW-14,y-8.5); ctx.stroke();
  rowLabel('LEVEL',String(G.level),x,y+6); y+=26;
  rowLabel('LINES',String(G.lines),x,y+6); y+=30;
  const hot=G.streak>5;
  ctx.font='700 10px '+F_MONO; ctx.fillStyle='#6d8aa5'; ctx.fillText('GHOST STREAK',x+14,y+6);
  ctx.font='700 12px '+F_MONO; ctx.fillStyle=hot?'#35e0ff':'#9db8cd'; ctx.textAlign='right';
  ctx.fillText(G.streak.toFixed(1)+'s',x+LW-14,y+6); y+=26;
  try{ctx.letterSpacing='0px';}catch(e){}
  ctx.font='500 11px '+F_MONO; ctx.fillStyle='#4d6a85'; ctx.textAlign='left';
  ['· land between sweeps','· tetris = full jam charge','· hard drop pays +2 / cell','· E freezes the rail'].forEach((t,i)=>ctx.fillText(t,x+14,y+i*17));
}
function rowLabel(l,v,x,y){
  ctx.font='700 10px '+F_MONO; ctx.fillStyle='#6d8aa5'; ctx.textAlign='left'; ctx.fillText(l,x+14,y);
  ctx.font='700 13px '+F_MONO; ctx.fillStyle='#9db8cd'; ctx.textAlign='right'; ctx.fillText(v,x+LW-14,y);
}

/* ---- HUD: right panel ---- */
function drawRightPanel(){
  const x=RX; let y=BOARD_Y+24;
  ctx.font='700 10px '+F_MONO; try{ctx.letterSpacing='2px';}catch(e){}
  ctx.fillStyle='#6d8aa5'; ctx.textAlign='left'; ctx.fillText('EXFIL QUEUE',x+14,y); y+=10;
  for(let i=0;i<3;i++){
    const sy=y+i*62;
    ctx.strokeStyle=i===0?'#ffb02e':'#1d2f42'; ctx.lineWidth=i===0?1.5:1;
    ctx.strokeRect(x+14.5,sy+.5,96,58);
    ctx.fillStyle='#0a1119'; ctx.fillRect(x+15,sy+1,95,57);
    if(G.queue[i]) mini(G.queue[i],x+62,sy+29,16);
  }
  y+=3*62+8;
  // detection meter
  ctx.font='700 10px '+F_MONO; ctx.fillStyle=G.det>.66&&((tGlobal*4)%1<.5)?'#ff3b5c':'#6d8aa5';
  ctx.textAlign='left'; ctx.fillText('DETECTION',x+14,y);
  const mx=x+RW-52, mw=30, mh=170;
  ctx.fillStyle='#0a1119'; ctx.fillRect(mx,y,mw,mh);
  const fh=G.det*mh;
  if(fh>1){ const g=ctx.createLinearGradient(0,y+mh-fh,0,y+mh);
    g.addColorStop(0,'#ff3b5c'); g.addColorStop(1,'#7a1f33'); ctx.fillStyle=g; ctx.fillRect(mx,y+mh-fh,mw,fh); }
  if(G.det>0){ ctx.save(); ctx.beginPath(); ctx.rect(mx,y,mw,mh); ctx.clip();
    const sy=y+((tGlobal*90)%mh); ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=1;
    for(let i=-1;i<mh/8+1;i++){ ctx.beginPath(); ctx.moveTo(mx,sy+i*8); ctx.lineTo(mx+mw,sy+i*8-10); ctx.stroke(); }
    ctx.restore(); }
  ctx.strokeStyle=G.det>.66?'#ff3b5c':'#2a4058'; ctx.lineWidth=1.5; ctx.strokeRect(mx-.5,y-.5,mw+1,mh+1);
  ctx.font='700 12px '+F_MONO; ctx.fillStyle='#9db8cd'; ctx.textAlign='right';
  ctx.fillText(Math.round(G.det*100)+'%',mx-8,y+mh/2+4);
  y+=mh+16;
  // jammer bar
  const ready=G.jam>=.25;
  ctx.font='700 10px '+F_MONO; ctx.fillStyle=ready?'#35e0ff':'#6d8aa5'; ctx.textAlign='left';
  ctx.fillText('JAMMER [E]',x+14,y);
  const jw=RW-28, jy=y+7;
  ctx.fillStyle='#0a1119'; ctx.fillRect(x+14,jy,jw,13);
  if(G.jam>0){ const g=ctx.createLinearGradient(x+14,0,x+14+jw,0);
    g.addColorStop(0,'#1f8fa8'); g.addColorStop(1,'#35e0ff'); ctx.fillStyle=g;
    ctx.fillRect(x+14,jy,jw*G.jam,13); }
  if(ready&&(tGlobal*2)%1<.7){ ctx.strokeStyle='#35e0ff'; ctx.lineWidth=1; ctx.strokeRect(x+13.5,jy-.5,jw+1,14); }
  else { ctx.strokeStyle='#2a4058'; ctx.lineWidth=1; ctx.strokeRect(x+13.5,jy+.5,jw+1,13); }
  ctx.font='700 10px '+F_MONO; ctx.fillStyle=ready?'#eaf6ff':'#4d6a85'; ctx.textAlign='left';
  ctx.fillText(ready?'READY — hold for longer freeze':Math.round(G.jam*100)+'% charged',x+14,jy+28);
  y+=48;
  try{ctx.letterSpacing='0px';}catch(e){}
  ctx.font='500 11px '+F_MONO; ctx.fillStyle='#4d6a85';
  ctx.fillText('threat level: '+'▮'.repeat(Math.min(6,G.level))+'▯'.repeat(Math.max(0,6-G.level)),x+14,y);
}

function drawFooter(){
  const y=STAGE_H-26;
  ctx.font='700 10px '+F_MONO; try{ctx.letterSpacing='1.5px';}catch(e){}
  ctx.fillStyle='#4d6a85'; ctx.textAlign='left';
  ctx.fillText('SHIFT-03 // SUBLEVEL B // GRID 10x20',LX,y);
  ctx.textAlign='right';
  ctx.fillText((AU.muted?'SND OFF':'SND ON')+' [M]   BEST '+best.toLocaleString('en-US'),STAGE_W-LX,y);
  if((tGlobal*1.4)%1<.5){ ctx.fillStyle='#35e0ff'; ctx.fillRect(STAGE_W-LX-2, y-9, 7, 11); }
  try{ctx.letterSpacing='0px';}catch(e){}
}

/* ============================== DOM OVERLAYS ============================== */
const veil=document.getElementById('veil');
function showMenu(){
  state='menu'; resetGame(); paused=false;
  const ctrl=[['← →','move'],['↓','soft drop'],['SPACE','hard drop'],['X / ↑','rotate CW'],
    ['Z','rotate CCW'],['C','hold'],['E','jammer — freeze scanners'],['P / M / R','pause · mute · restart']];
  veil.innerHTML='<div class="card"><div class="hz"></div><div class="body">'+
    '<div class="kicker">SECURITY BYPASS // NIGHT SHIFT 03</div>'+
    '<h1 class="title">TETRA<span>BLACKOUT</span></h1>'+
    '<p class="tag">You are running data blocks into the server stack. Fill rows to exfiltrate them — but patrol scanners sweep the grid on the rail above, and if one catches your block mid-air, the whole sublevel goes hot.</p>'+
    '<div class="cols"><div class="ctrl-grid">'+ctrl.map(c=>'<span><kbd>'+c[0]+'</kbd></span><span>'+c[1]+'</span>').join('')+'</div>'+
    '<aside class="brief"><h3>FIELD BRIEF</h3><ul>'+
    '<li>Every line cleared charges the <b>JAMMER</b>. Press <kbd>E</kbd> to freeze the rail — bigger charge, longer freeze.</li>'+
    '<li>Hard drops are fast but loud: land between sweeps.</li>'+
    '<li>Security escalates every 5 lines. A long <b>ghost streak</b> pays bonus cash on clears.</li></ul></aside></div>'+
    '<button id="btn" class="btn">ENTER THE BUILD</button>'+
    '<div class="hint">or press <kbd>ENTER</kbd> · best run: '+best.toLocaleString('en-US')+'</div>'+
    '</div></div>';
  veil.classList.remove('hide');
  document.getElementById('btn').addEventListener('click',e=>{ AU.ensure(); e.currentTarget.blur(); newGame(); });
}
function showOver(){
  const busted=G.reason==='busted';
  const nb=G.score>=best&&G.score>0;
  veil.innerHTML='<div class="card"><div class="hz '+(busted?'hz-red':'')+'"></div><div class="body">'+
    '<div class="kicker'+(busted?' red':'')+'">INCIDENT REPORT // SUBLEVEL B</div>'+
    '<h1 class="title '+(busted?'busted':'overflow')+'">'+(busted?'BUSTED':'OVERFLOW')+'</h1>'+
    '<p class="tag">'+(busted?'A scanner locked onto your payload mid-air. Sirens, floods, the whole floor is looking for you.':'The stack breached the ceiling before the exfil finished. The grid is sealed.')+'</p>'+
    '<div class="stats">'+
    '<div class="stat"><label>SCORE</label><b>'+G.score.toLocaleString('en-US')+'</b>'+(nb?'<span class="badge">NEW BEST</span>':'')+'</div>'+
    '<div class="stat"><label>LINES</label><b>'+G.lines+'</b></div>'+
    '<div class="stat"><label>LEVEL</label><b>'+G.level+'</b></div>'+
    '<div class="stat"><label>BEST</label><b>'+best.toLocaleString('en-US')+'</b></div></div>'+
    '<button id="btn" class="btn">RUN IT BACK</button>'+
    '<div class="hint">or press <kbd>R</kbd></div>'+
    '</div></div>';
  veil.classList.remove('hide');
  document.getElementById('btn').addEventListener('click',e=>{ AU.ensure(); e.currentTarget.blur(); newGame(); });
}
function newGame(){
  AU.ensure(); resetGame(); state='play'; paused=false;
  veil.classList.add('hide'); SFX.start();
}

/* ============================== BOOT ============================== */
try{ if(localStorage.getItem('tb_mute')==='1') AU.muted=true; }catch(e){}
showMenu();
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
