<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brickstorm</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04121d}
  body{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#dff1fb;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;display:block}
  #ui{position:fixed;inset:0;z-index:2;pointer-events:none}
  .hidden{display:none!important}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    background:radial-gradient(ellipse at 50% 38%,rgba(6,17,28,.40),rgba(3,9,16,.88) 78%);animation:fadeIn .45s ease both;text-align:center}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .eyebrow{font:700 12px Consolas,Menlo,monospace;letter-spacing:.46em;color:#4cc9f0;text-shadow:0 0 14px rgba(76,201,240,.65);padding-left:.46em}
  h1.game-title{font-family:Impact,'Arial Black','Franklin Gothic Bold',sans-serif;font-weight:900;
    font-size:clamp(54px,10.5vw,112px);line-height:.92;letter-spacing:.015em;color:#fff;
    text-shadow:-4px 0 0 rgba(76,201,240,.85),4px 0 0 rgba(255,123,84,.85),0 7px 0 rgba(0,0,0,.35),0 0 38px rgba(120,215,255,.35)}
  h1.game-title span{color:#ffd166;text-shadow:-4px 0 0 rgba(255,93,93,.7),4px 0 0 rgba(63,217,123,.7),0 7px 0 rgba(0,0,0,.35),0 0 34px rgba(255,194,51,.5)}
  .tagline{color:#8fb4c9;font-size:15px;letter-spacing:.08em;margin-top:-6px}
  .panel{background:rgba(8,24,38,.8);border:1px solid #1e4a68;border-radius:12px;padding:18px 26px;max-width:min(560px,92vw);
    display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 44px rgba(0,0,0,.5)}
  .ctrl-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:13px;color:#a8c9dd}
  .kbd{font:700 12px Consolas,Menlo,monospace;background:#0e2a3d;border:1px solid #2c5878;border-bottom-width:3px;border-radius:6px;padding:4px 10px;color:#bfe6ff;box-shadow:0 2px 0 rgba(0,0,0,.4)}
  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font:700 11px Consolas,Menlo,monospace;color:#7fa3b8;letter-spacing:.06em}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:0 0 8px currentColor}
  .start-btn{pointer-events:auto;cursor:pointer;font-family:Impact,'Arial Black',sans-serif;font-size:20px;letter-spacing:.2em;color:#ffd166;
    background:rgba(255,194,51,.07);border:2px solid #ffd166;border-radius:10px;padding:13px 34px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,194,51,.3);transform:scale(1)}50%{box-shadow:0 0 28px 5px rgba(255,194,51,.26);transform:scale(1.035)}}
  .best-chip{font:700 13px Consolas,Menlo,monospace;color:#ffd166;letter-spacing:.24em}
  .fineprint{font:400 11px Consolas,Menlo,monospace;color:#4d6f85;letter-spacing:.1em}
  .over-title{font-family:Impact,'Arial Black',sans-serif;font-weight:900;font-size:clamp(46px,9vw,96px);letter-spacing:.05em;color:#ff5d5d;
    text-shadow:0 0 34px rgba(255,93,93,.55),0 6px 0 rgba(0,0,0,.4)}
  .score-line{font-family:Impact,'Arial Black',sans-serif;font-size:30px;letter-spacing:.14em;color:#dff1fb}
  .score-line b{color:#ffd166;font-family:Consolas,Menlo,monospace;font-size:32px}
  .best-line{font:700 14px Consolas,Menlo,monospace;color:#7fa3b8;letter-spacing:.2em}
  .badge{background:#ffd166;color:#241505;font:800 12px Consolas,Menlo,monospace;letter-spacing:.24em;padding:7px 16px;border-radius:999px;animation:pulse 1.2s ease-in-out infinite}
  #pauseTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Impact,'Arial Black',sans-serif;font-size:42px;
    letter-spacing:.3em;color:#fff;background:rgba(5,14,22,.78);border:1px solid #2a5674;padding:18px 34px 18px 52px;border-radius:14px;box-shadow:0 0 70px rgba(0,0,0,.65)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="screen" id="startScr">
    <div class="eyebrow">A PHYSICS BRICK-BREAKER</div>
    <h1 class="game-title">BRICK<span>STORM</span></h1>
    <p class="tagline">Smash the grid &middot; chain combos &middot; ride the storm</p>
    <div class="panel">
      <div class="ctrl-row"><span class="kbd">&#9664; &#9654;</span><span class="kbd">A / D</span><span>move paddle (or mouse)</span></div>
      <div class="ctrl-row"><span class="kbd">SPACE</span><span>launch &middot; fire lasers</span></div>
      <div class="ctrl-row"><span class="kbd">P</span><span>pause</span>&nbsp;&nbsp;<span class="kbd">R</span><span>restart</span>&nbsp;&nbsp;<span class="kbd">M</span><span>sound</span></div>
    </div>
    <div class="legend">
      <span><i style="background:#4cc9f0;color:#4cc9f0"></i>WIDE</span>
      <span><i style="background:#ffd166;color:#ffd166"></i>MULTI</span>
      <span><i style="background:#b28dff;color:#b28dff"></i>SLOW</span>
      <span><i style="background:#3fd97b;color:#3fd97b"></i>CATCH</span>
      <span><i style="background:#ff5d5d;color:#ff5d5d"></i>LASER</span>
    </div>
    <button class="start-btn" id="btnStart">PRESS SPACE TO START</button>
    <div class="best-chip" id="bestChip"></div>
    <div class="fineprint">sound begins after your first key press</div>
  </div>

  <div class="screen hidden" id="overScr">
    <h2 class="over-title">GAME OVER</h2>
    <div class="score-line">SCORE&nbsp;&nbsp;<b id="finalScore">000000</b></div>
    <div class="best-line" id="bestLine">BEST 000000</div>
    <div class="badge hidden" id="newBest">NEW BEST!</div>
    <button class="start-btn" id="btnRestart">R &middot; RESTART STORM</button>
  </div>

  <div id="pauseTag" class="hidden">PAUSED</div>
</div>

<script>
'use strict';
/* ================= helpers ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}

/* ================= dom / view ================= */
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const startScr=document.getElementById('startScr'),overScr=document.getElementById('overScr'),pauseTag=document.getElementById('pauseTag');
const elFinal=document.getElementById('finalScore'),elBestLine=document.getElementById('bestLine'),elBadge=document.getElementById('newBest'),elBestChip=document.getElementById('bestChip');
const GW=1000,GH=720;let dpr=1,scl=1,ox=0,oy=0,cw=0,chh=0;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cw=window.innerWidth;chh=window.innerHeight;
  canvas.width=cw*dpr;canvas.height=chh*dpr;canvas.style.width=cw+'px';canvas.style.height=chh+'px';
  scl=Math.min(cw/GW,chh/GH);ox=(cw-GW*scl)/2;oy=(chh-GH*scl)/2;}
window.addEventListener('resize',resize);resize();

const F={x:26,y:92,w:GW-52,h:GH-118};F.right=F.x+F.w;F.bottom=F.y+F.h;

/* ================= palette ================= */
const COL={text:'#dff1fb',dim:'#6f97ad',amber:'#ffc233',gold:'#ffd166',coral:'#ff5d5d',cyan:'#4cc9f0',mint:'#3fd97b'};
const TIERCOL={1:'#3fd97b',2:'#ffc233',3:'#ff5d5d',4:'#9db7d6'};
const POWS={W:{c:'#4cc9f0',n:'WIDE'},M:{c:'#ffd166',n:'MULTI'},S:{c:'#b28dff',n:'SLOW'},C:{c:'#3fd97b',n:'CATCH'},L:{c:'#ff5d5d',n:'LASER'}};
const DUR={wide:12,slow:8,catch:10,laser:9};

/* ================= audio ================= */
let AC=null,master=null,muted=false;
try{muted=localStorage.getItem('brickstorm.mute')==='1';}catch(e){}
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:0.45;master.connect(AC.destination);}catch(e){}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,slideTo,delay){if(!AC||muted)return;try{const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);}catch(e){}}
function sfx(name,arg){if(!AC||muted)return;switch(name){
  case 'wall':tone(150,.05,'sine',.12);break;
  case 'paddle':tone(190+Math.abs(arg)*140,.07,'triangle',.22);break;
  case 'brick':{const f=300*Math.pow(1.06,Math.min(14,arg||1));tone(f,.08,'square',.15);tone(f*2,.05,'sine',.07);}break;
  case 'power':tone(523,.09,'square',.17);tone(784,.13,'square',.17,0,.07);break;
  case 'catch':tone(660,.06,'sine',.16);break;
  case 'laser':tone(880,.09,'sawtooth',.1,220);break;
  case 'life':tone(320,.5,'sawtooth',.22,70);break;
  case 'lifeup':tone(660,.1,'square',.18);tone(990,.14,'square',.18,0,.09);break;
  case 'clear':[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.15,0,i*.09));break;
  case 'gameover':tone(400,.7,'sawtooth',.2,50);break;
  case 'launch':tone(380,.08,'triangle',.14,640);break;
  case 'ui':tone(740,.06,'sine',.12);break;}}

/* ================= persistence ================= */
function loadBest(){try{return +localStorage.getItem('brickstorm.best')||0;}catch(e){return 0;}}
function saveBest(){try{localStorage.setItem('brickstorm.best',String(G.best));}catch(e){}}
function saveMute(){try{localStorage.setItem('brickstorm.mute',muted?'1':'0');}catch(e){}}

/* ================= state ================= */
const G={mode:'menu',inMenu:true,t:0,score:0,best:loadBest(),level:1,lives:3,combo:0,shake:0,clearT:0,fireT:0,banner:null,total:0,remaining:0,nextLife:10000,flash:0,flashC:'255,255,255',paused:false};
const paddle={x:GW/2,w:116,baseW:116,h:14,vx:0,target:null,squash:0};
let balls=[],bricks=[],pows=[],shots=[],parts=[],pops=[];
const fx={wide:0,slow:0,catch:0,laser:0};
const keys={left:false,right:false};
const dust=[];for(let i=0;i<34;i++)dust.push({x:F.x+Math.random()*F.w,y:F.y+Math.random()*F.h,r:rand(.8,2),s:rand(5,16),ph:Math.random()*TAU});

/* ================= levels ================= */
const COLS=13;
function pat0(){return ['4.4.4.4.4.4.4','3333333333333','3333333333333','2222222222222','2222222222222','1111111111111'];}
function pat1(){const r=[];for(let y=0;y<8;y++){let s='';for(let x=0;x<COLS;x++)s+=(y+x)%2===0?String(1+((y*2+x)%3)):'.';r.push(s);}return r;}
function pat2(){const r=[];for(let y=0;y<7;y++){let s='';for(let x=0;x<COLS;x++){const d=Math.abs(x-6);s+=(x>=y&&x<=12-y)?(d<=2?4:d<=4?3:2):'.';}r.push(s);}return r;}
function pat3(){const set=[0,1,5,6,10,11];const r=[];for(let y=0;y<8;y++){let s='';for(let x=0;x<COLS;x++)s+=set.indexOf(x)>=0?(y<2?3:y<5?2:1):'.';r.push(s);}return r;}
function pat4(){const r=[];for(let y=0;y<8;y++){let s='';for(let x=0;x<COLS;x++){const d=Math.abs(x-6)+Math.abs(y-3);s+=d<=6?(d<=1?4:d<=3?3:d<=5?2:1):'.';}r.push(s);}return r;}
function pat5(){const r=[];for(let y=0;y<8;y++){let s='';for(let x=0;x<COLS;x++){
  if(y===0||y===7||x===0||x===12)s+='3';else if((y===3||y===4)&&(x>=5&&x<=7))s+='4';else if(x===6&&(y===1||y===2||y===5||y===6))s+='2';else s+='.';}r.push(s);}return r;}
const PATTERNS=[pat0,pat1,pat2,pat3,pat4,pat5];
const SUBS=['THE CLASSIC GRID','CHECKER DRIFT','FALLING SPIRE','TWIN PILLARS','DIAMOND CORE','THE BASTION'];

function buildLevel(pi,boost){
  const rows=PATTERNS[pi](),bw=(F.w-48-(COLS-1)*6)/COLS,bh=24,gy=7,topY=F.y+30;
  bricks=[];let total=0;
  rows.forEach((row,y)=>{for(let x=0;x<COLS;x++){const ch=row[x];if(ch&&ch!=='.'){
    const t=Math.min(5,+ch+(boost||0));
    bricks.push({x:F.x+24+x*(bw+6),y:topY+y*(bh+gy),w:bw,h:bh,hp:t,maxHp:t,seed:Math.random()*7});total++;}});
  G.total=total;G.remaining=total;
}
const baseSpeed=()=>Math.min(540,390+(G.level-1)*22);
const capSpeed =()=>Math.min(780,470+G.level*22);

/* ================= fx spawners ================= */
function sparkAt(x,y,color,n){n=n||6;for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(40,190);
  parts.push({type:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.45),max:.45,color});}}
function burstParts(x,y,color){for(let i=0;i<13;i++){const a=rand(0,TAU),s=rand(60,330);
  parts.push({type:'shard',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(.4,.8),max:.8,size:rand(3,7),rot:rand(0,TAU),spin:rand(-9,9),color});}
  sparkAt(x,y,'#ffffff',5);}
function ringAt(x,y,color){parts.push({type:'ring',x,y,r0:4,r1:52,life:.38,max:.38,color});}
function confetti(){const cols=['#ffd166','#ff5d5d','#4cc9f0','#3fd97b','#ffffff'];
  for(let i=0;i<56;i++)parts.push({type:'confetti',x:rand(F.x+20,F.right-20),y:rand(F.y,F.y+120),vx:rand(-40,40),vy:rand(10,80),life:rand(.9,1.6),max:1.6,size:rand(3,6),rot:rand(0,TAU),spin:rand(-7,7),color:cols[i%5]});}
function popText(x,y,text,color,size){pops.push({x,y,text,color,size:size||14,life:.9,max:.9});}

/* ================= gameplay ================= */
function newStuckBall(){G.combo=0;balls=[{x:paddle.x,y:F.bottom-paddle.h-9,vx:0,vy:0,r:7,sp:baseSpeed(),stuck:true,stuckT:0,attach:0,trail:[]}];}
function launch(b){const a=(-90+rand(-24,24))*Math.PI/180;b.vx=Math.cos(a)*b.sp;b.vy=Math.sin(a)*b.sp;b.stuck=false;b.stuckT=0;sfx('launch');sparkAt(b.x,b.y+6,'#fff',4);}

function collideWalls(b){
  if(b.x<b.r+F.x){b.x=b.r+F.x;b.vx=Math.abs(b.vx);sfx('wall');sparkAt(F.x+2,b.y,COL.cyan,4);}
  else if(b.x>F.right-b.r){b.x=F.right-b.r;b.vx=-Math.abs(b.vx);sfx('wall');sparkAt(F.right-2,b.y,COL.cyan,4);}
  if(b.y<b.r+F.y){b.y=b.r+F.y;b.vy=Math.abs(b.vy);sfx('wall');sparkAt(b.x,F.y+2,COL.cyan,4);}
  if(b.y-b.r>F.bottom+8){b.dead=true;sparkAt(clamp(b.x,F.x+10,F.right-10),F.bottom-6,COL.coral,10);ringAt(clamp(b.x,F.x+10,F.right-10),F.bottom-6,COL.coral);}
}
function paddleHit(b){
  const ptop=F.bottom-paddle.h;
  if(b.vy>0&&b.y+b.r>ptop&&b.y-b.r<ptop+paddle.h+8&&Math.abs(b.x-paddle.x)<paddle.w/2+b.r){
    const off=clamp((b.x-paddle.x)/(paddle.w/2),-1,1);
    if(fx.catch>G.t){b.stuck=true;b.attach=off;b.vx=0;b.vy=0;sfx('catch');ringAt(b.x,ptop,COL.mint);return;}
    const ang=off*1.05;
    b.sp=Math.min(capSpeed(),b.sp*1.035+2);
    b.vx=Math.sin(ang)*b.sp+paddle.vx*0.16;b.vy=-Math.abs(Math.cos(ang)*b.sp);
    const m=Math.hypot(b.vx,b.vy)||1;b.vx*=b.sp/m;b.vy*=b.sp/m;
    b.y=ptop-b.r;G.combo=0;paddle.squash=1;sfx('paddle',off);sparkAt(b.x,ptop,COL.gold,5);
  }
}
function brickHit(b){
  for(const br of bricks){if(br.hp<=0)continue;
    const cx=clamp(b.x,br.x,br.x+br.w),cy=clamp(b.y,br.y,br.y+br.h);
    const dx=b.x-cx,dy=b.y-cy;if(dx*dx+dy*dy>b.r*b.r)continue;
    const ox=(br.w/2)+b.r-Math.abs(b.x-(br.x+br.w/2));
    const oy=(br.h/2)+b.r-Math.abs(b.y-(br.y+br.h/2));
    if(ox<oy)b.vx=b.x<br.x+br.w/2?-Math.abs(b.vx):Math.abs(b.vx);
    else b.vy=b.y<br.y+br.h/2?-Math.abs(b.vy):Math.abs(b.vy);
    damageBrick(br);return true;}
  return false;
}
function damageBrick(br){
  if(G.mode==='clear'||G.mode==='over')return;
  br.hp--;G.combo++;sfx('brick',G.combo);
  const mult=Math.min(8,G.combo),pts=10*br.maxHp*mult;G.score+=pts;
  const cx=br.x+br.w/2,cy=br.y+br.h/2,col=TIERCOL[Math.min(4,br.maxHp)];
  if(br.hp<=0){
    burstParts(cx,cy,col);G.shake+=1.6;G.remaining--;
    if(mult>=2||Math.random()<.3)popText(cx,br.y,'+'+pts,mult>=4?COL.coral:COL.text,14+Math.min(8,mult));
    if(Math.random()<0.22)spawnPow(cx,br.y);
    if(G.remaining<=0)startClear();
  }else sparkAt(cx,cy,col,5);
}
function spawnPow(x,y){const r=Math.random();
  const type=r<.2?'W':r<.4?'M':r<.55?'S':r<.73?'C':'L';
  pows.push({x,baseX:x,y,vy:150,type,t:0,ph:Math.random()*6});}
function applyPow(p){sfx('power');ringAt(p.x,p.y,POWS[p.type].c);popText(clamp(p.x,F.x+50,F.right-50),F.bottom-42,POWS[p.type].n,POWS[p.type].c,18);
  if(p.type==='W')fx.wide=G.t+DUR.wide;else if(p.type==='S')fx.slow=G.t+DUR.slow;
  else if(p.type==='C')fx.catch=G.t+DUR.catch;else if(p.type==='L'){fx.laser=G.t+DUR.laser;G.fireT=0;}else multiBall();}
function multiBall(){let srcs=balls.filter(b=>!b.stuck);
  if(srcs.length===0){for(let i=0;i<2&&balls.length<6;i++){const a=(-90+rand(-42,42))*Math.PI/180,sp=baseSpeed();
    balls.push({x:paddle.x,y:F.bottom-paddle.h-10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:7,sp,stuck:false,trail:[]});}return;}
  for(let i=0;i<srcs.length&&i<2;i++){if(balls.length>=6)break;const s=srcs[i];
    const a=Math.atan2(s.vy,s.vx)+(i===0?-0.55:0.55);
    balls.push({x:s.x,y:s.y,vx:Math.cos(a)*s.sp,vy:Math.sin(a)*s.sp,r:7,sp:s.sp,stuck:false,trail:[]});}}
function fireLaser(){shots.push({x:paddle.x-paddle.w/2+12,y:F.bottom-paddle.h-8},{x:paddle.x+paddle.w/2-12,y:F.bottom-paddle.h-8});sfx('laser');}

function loseBall(){G.combo=0;G.lives--;G.shake+=13;G.flash=.5;G.flashC='255,93,93';
  fx.wide=fx.slow=fx.catch=fx.laser=0;sfx('life');ringAt(paddle.x,F.bottom-20,COL.coral);
  if(G.lives<=0)gameOver();else newStuckBall();}
function startClear(){if(!G.inMenu){const bonus=250+G.level*150;G.score+=bonus;}
  G.mode='clear';G.clearT=G.inMenu?1.3:2.2;
  if(!G.inMenu){G.banner={text:'STAGE CLEAR',sub:'BONUS +'+(250+G.level*150),t:2.2,life:2.2};sfx('clear');confetti();G.flash=.4;G.flashC='76,201,240';}}
function loadLevel(n){G.level=n;const pi=(n-1)%PATTERNS.length,bst=Math.min(2,Math.floor((n-1)/PATTERNS.length));
  buildLevel(pi,bst);pows=[];shots=[];fx.wide=fx.slow=fx.catch=fx.laser=0;newStuckBall();
  G.banner={text:'STAGE '+n,sub:SUBS[pi],t:1.9,life:1.9};G.mode='play';}
function startGame(){G.inMenu=false;G.score=0;G.lives=3;G.combo=0;G.nextLife=10000;G.paused=false;
  pauseTag.classList.add('hidden');startScr.classList.add('hidden');overScr.classList.add('hidden');sfx('ui');loadLevel(1);}
function gameOver(){G.mode='over';sfx('gameover');
  const nb=G.score>G.best;if(nb){G.best=G.score;saveBest();}
  elFinal.textContent=String(G.score).padStart(6,'0');
  elBestLine.textContent='BEST '+String(G.best).padStart(6,'0');
  elBadge.classList.toggle('hidden',!nb);overScr.classList.remove('hidden');}

/* ================= update ================= */
function updatePaddle(dt){
  const wantW=fx.wide>G.t?178:paddle.baseW;paddle.w+=(wantW-paddle.w)*Math.min(1,dt*10);
  let nx=paddle.x;
  if(G.mode==='play'&&paddle.target!=null)nx=paddle.target;
  else{const dir=(keys.right?1:0)-(keys.left?1:0);if(dir){paddle.target=null;nx+=dir*980*dt;}}
  if(G.inMenu&&G.mode==='menu'){const b=balls[0];
    if(b&&!b.stuck)nx=paddle.x+clamp((b.x+Math.sin(G.t*2.3)*46)-paddle.x,-600*dt,600*dt);}
  nx=clamp(nx,F.x+paddle.w/2+8,F.right-paddle.w/2-8);
  paddle.vx=dt>0?clamp((nx-paddle.x)/dt,-1400,1400):0;paddle.x=nx;
  paddle.squash=Math.max(0,paddle.squash-dt*5);
  if(fx.laser>G.t&&G.mode==='play'){G.fireT-=dt;if(G.fireT<=0){fireLaser();G.fireT=.3;}}
}
function updateBalls(dt){
  for(const b of balls){
    if(b.stuck){b.stuckT+=dt;b.x=paddle.x+clamp(b.attach,-1,1)*(paddle.w/2-14);b.y=F.bottom-paddle.h-b.r-2;
      if((G.inMenu&&b.stuckT>0.9)||(!G.inMenu&&b.stuckT>6))launch(b);continue;}
    const steps=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/(b.r*0.8))),sdt=dt/steps;
    for(let i=0;i<steps;i++){b.x+=b.vx*sdt;b.y+=b.vy*sdt;collideWalls(b);if(b.dead)break;brickHit(b);paddleHit(b);}
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>12)b.trail.shift();
  }
  const before=balls.length;balls=balls.filter(b=>!b.dead);
  if(before&&balls.length===0){if(G.mode==='play')loseBall();else newStuckBall();}
}
function updatePows(dt){for(const p of pows){p.t+=dt;p.y+=p.vy*dt;p.x=p.baseX+Math.sin(p.t*2.6+p.ph)*10;
    if(p.y>F.bottom-paddle.h-14&&p.y<F.bottom+4&&Math.abs(p.x-paddle.x)<paddle.w/2+18){applyPow(p);p.dead=true;}
    if(p.y>F.bottom+30)p.dead=true;}pows=pows.filter(p=>!p.dead);}
function updateShots(dt){for(const s of shots){s.y-=960*dt;if(s.y<F.y+4){s.dead=true;continue;}
    for(const br of bricks){if(br.hp<=0)continue;
      if(s.x>br.x&&s.x<br.x+br.w&&s.y>br.y&&s.y<br.y+br.h){damageBrick(br);sparkAt(s.x,br.y,'#bfe6ff',4);s.dead=true;break;}}}
  shots=shots.filter(s=>!s.dead);}
function updateParts(dt){for(const p of parts){p.life-=dt;
    if(p.type==='shard'||p.type==='confetti'){p.vy+=(p.type==='confetti'?240:520)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;}
    else if(p.type==='spark'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;}
    else if(p.type==='ring')p.r+=(p.r1-p.r0)*Math.min(1,dt*7);}
  parts=parts.filter(p=>p.life>0);if(parts.length>420)parts.splice(0,parts.length-420);}
function updatePops(dt){for(const p of pops){p.y-=26*dt;p.life-=dt;}pops=pops.filter(p=>p.life>0);}

function update(dt){G.t+=dt;
  G.shake*=Math.exp(-7*dt);if(G.shake<.1)G.shake=0;
  G.flash=Math.max(0,G.flash-dt*1.6);
  for(const d of dust){d.y-=d.s*dt;d.x+=Math.sin(G.t*.8+d.ph)*4*dt;if(d.y<F.y)d.y=F.bottom;}
  updatePaddle(dt);
  if(G.mode!=='over')updateBalls(dt);
  if(G.mode==='clear'){G.clearT-=dt;
    if(G.clearT<=0){if(G.inMenu){buildLevel((Math.floor(G.t*0)%1)||0,0);buildLevel(0,0);G.mode='menu';}else loadLevel(G.level+1);}}
  updatePows(dt);updateShots(dt);updateParts(dt);updatePops(dt);
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  while(G.score>=G.nextLife){G.nextLife+=10000;
    if(G.lives<6&&G.mode==='play'){G.lives++;popText(GW/2,F.y+F.h*.4,'1UP!',COL.mint,30);sfx('lifeup');}}
}

/* ================= render ================= */
function drawPanel(){rr(ctx,-12,-12,GW+24,GH+24,22);ctx.fillStyle='#0a1e2d';ctx.fill();
  ctx.strokeStyle='rgba(76,201,240,.28)';ctx.lineWidth=2;ctx.stroke();
  rr(ctx,-4,-4,GW+8,GH+8,16);ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;ctx.stroke();}
function drawFieldBG(){
  const fg=ctx.createLinearGradient(0,F.y,0,F.bottom);fg.addColorStop(0,'#0c2740');fg.addColorStop(1,'#061321');
  ctx.fillStyle=fg;ctx.fillRect(F.x,F.y,F.w,F.h);
  const px=((balls.length?balls[0].x:GW/2)-GW/2)*.04;
  ctx.strokeStyle='rgba(120,205,255,.05)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=F.x+((px%40)+40)%40;x<F.right;x+=40){ctx.moveTo(x,F.y);ctx.lineTo(x,F.bottom);}
  for(let y=F.y+40;y<F.bottom;y+=40){ctx.moveTo(F.x,y);ctx.lineTo(F.right,y);}
  ctx.stroke();
  const hz=ctx.createLinearGradient(0,F.bottom-30,0,F.bottom);hz.addColorStop(0,'rgba(255,93,93,0)');hz.addColorStop(1,'rgba(255,93,93,.16)');
  ctx.fillStyle=hz;ctx.fillRect(F.x,F.bottom-30,F.w,30);
  for(const d of dust){ctx.globalAlpha=.08+.05*Math.sin(G.t*1.4+d.ph);ctx.fillStyle='#aee2ff';
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,194,51,.3)';ctx.fillRect(F.x,F.y-3,F.w,2);
  if(G.flash>0){ctx.fillStyle='rgba('+G.flashC+','+(G.flash*.3).toFixed(3)+')';ctx.fillRect(F.x,F.y,F.w,F.h);}
}
function drawBricks(){for(const br of bricks){if(br.hp<=0)continue;
  const c=TIERCOL[Math.min(4,br.maxHp)];
  rr(ctx,br.x,br.y,br.w,br.h,4);ctx.fillStyle=c;ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(br.x+2,br.y+2,br.w-4,3);
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(br.x+2,br.y+br.h-5,br.w-4,3);
  if(br.hp<br.maxHp){ctx.strokeStyle='rgba(0,0,0,.42)';ctx.lineWidth=1.5;ctx.beginPath();
    const n=br.maxHp-br.hp;
    for(let i=0;i<=n;i++){const sx=br.x+8+((br.seed*37+i*53)%1)*(br.w-20);
      ctx.moveTo(sx,br.y+4);ctx.lineTo(sx+6,br.y+br.h/2);ctx.lineTo(sx-3,br.y+br.h-4);}
    ctx.stroke();}}}
function drawPows(){for(const p of pows){const c=POWS[p.type].c;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(p.t*3+p.ph)*.18);
  rr(ctx,-17,-11,34,22,7);ctx.fillStyle='rgba(6,16,26,.92)';ctx.shadowColor=c;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle=c;ctx.lineWidth=2;rr(ctx,-17,-11,34,22,7);ctx.stroke();
  ctx.fillStyle=c;ctx.font='700 14px Consolas,Menlo,monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.type,0,1);ctx.restore();}ctx.textBaseline='alphabetic';}
function drawShots(){for(const s of shots){ctx.fillStyle='rgba(76,201,240,.35)';ctx.fillRect(s.x-1.5,s.y+6,3,10);
  ctx.fillStyle='#d9f6ff';ctx.shadowColor=COL.cyan;ctx.shadowBlur=8;ctx.fillRect(s.x-1.5,s.y-7,3,14);ctx.shadowBlur=0;}}
function drawPaddle(){const p=paddle;
  ctx.save();ctx.translate(p.x,F.bottom);ctx.scale(1+p.squash*.14,1-p.squash*.32);
  const g=ctx.createLinearGradient(0,-p.h,0,0);g.addColorStop(0,'#fff3d6');g.addColorStop(.5,'#ffd166');g.addColorStop(1,'#e89a1f');
  rr(ctx,-p.w/2,-p.h,p.w,p.h,7);ctx.fillStyle=g;ctx.shadowColor='rgba(255,194,51,.5)';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
  rr(ctx,-p.w/2+3,-p.h+2,p.w-6,3,2);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fill();
  if(fx.catch>G.t){ctx.strokeStyle='rgba(63,217,123,'+(.5+.4*Math.sin(G.t*8)).toFixed(3)+')';ctx.lineWidth=2;rr(ctx,-p.w/2-3,-p.h-3,p.w+6,p.h+6,9);ctx.stroke();}
  if(fx.laser>G.t){for(const s of[-1,1]){const cx=s*(p.w/2-12);
    ctx.fillStyle='#0e2433';rr(ctx,cx-5,-p.h-8,10,8,2);ctx.fill();
    ctx.fillStyle=COL.cyan;ctx.fillRect(cx-2,-p.h-7,4,6);}}
  ctx.restore();}
function drawBalls(){for(const b of balls){
  const hue=clamp(205-(b.sp-380)/380*190,10,210);
  for(let i=0;i<b.trail.length;i++){const t=b.trail[i],f=i/b.trail.length;
    ctx.fillStyle='hsla('+hue.toFixed(0)+',90%,65%,'+(f*.28).toFixed(3)+')';
    ctx.beginPath();ctx.arc(t.x,t.y,b.r*f*.8,0,TAU);ctx.fill();}
  const g=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.r*2.4);
  g.addColorStop(0,'#ffffff');g.addColorStop(.35,'hsl('+hue.toFixed(0)+',95%,70%)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.4,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.75,0,TAU);ctx.fill();}}
function drawParts(){for(const p of parts){const a=clamp(p.life/p.max,0,1);
  if(p.type==='shard'||p.type==='confetti'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*(p.type==='confetti'?.6:1));ctx.restore();}
  else if(p.type==='spark'){ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,1.6+2*a,0,TAU);ctx.fill();}
  else if(p.type==='ring'){ctx.globalAlpha=a*.8;ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.stroke();}}
  ctx.globalAlpha=1;}
function drawPops(){for(const p of pops){const a=clamp(p.life/p.max,0,1);
  ctx.globalAlpha=a;ctx.font='700 '+p.size+'px Consolas,Menlo,monospace';ctx.textAlign='center';
  ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.strokeText(p.text,p.x,p.y);
  ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y);}ctx.globalAlpha=1;}
function drawChips(){let i=0;
  for(const k of['wide','laser','catch','slow']){const left=fx[k]-G.t;if(left<=0)continue;
    const y=F.bottom-26-i*24,col=k==='wide'?POWS.W.c:k==='laser'?POWS.L.c:k==='catch'?POWS.C.c:POWS.S.c;
    ctx.fillStyle='rgba(4,12,20,.6)';rr(ctx,F.x+10,y,32,18,5);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=1.5;rr(ctx,F.x+10,y,32,18,5);ctx.stroke();
    ctx.fillStyle=col;ctx.font='700 12px Consolas,Menlo,monospace';ctx.textAlign='center';
    ctx.fillText(k==='wide'?'W':k==='laser'?'L':k==='catch'?'C':'S',F.x+26,y+13);
    ctx.fillStyle=col;ctx.fillRect(F.x+13,y+15,26*clamp(left/DUR[k],0,1),2);i++;}}
function drawStuckHint(){if(G.mode!=='play')return;
  if(balls.some(b=>b.stuck)){const a=.45+.3*Math.sin(G.t*4);
    ctx.globalAlpha=a;ctx.fillStyle='#9fd8ff';ctx.font='700 12px Consolas,Menlo,monospace';ctx.textAlign='center';
    ctx.fillText('SPACE / CLICK TO LAUNCH',paddle.x,F.bottom-46);ctx.globalAlpha=1;}}
function drawBanner(){const bn=G.banner;if(!bn)return;
  const p=1-bn.t/bn.life,sc=p<.2?easeOutBack(p/.2):1,al=bn.t<.35?bn.t/.35:1;
  ctx.save();ctx.translate(GW/2,F.y+F.h*.42);ctx.scale(sc,sc);ctx.globalAlpha=al;ctx.textAlign='center';
  ctx.font='900 66px Impact,"Arial Black",sans-serif';
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(bn.text,3,7);
  ctx.shadowColor='rgba(76,201,240,.85)';ctx.shadowBlur=26;ctx.fillStyle='#fff';ctx.fillText(bn.text,0,0);ctx.shadowBlur=0;
  if(bn.sub){ctx.font='700 22px Consolas,Menlo,monospace';ctx.fillStyle='#ffd166';ctx.fillText(bn.sub,0,40);}
  ctx.restore();ctx.globalAlpha=1;}
function drawHUD(){
  const mono='Consolas,Menlo,monospace',disp='Impact,"Arial Black",sans-serif';
  ctx.textAlign='left';ctx.fillStyle=COL.dim;ctx.font='700 11px '+mono;ctx.fillText('SCORE',42,46);
  ctx.fillStyle='#fff';ctx.font='700 30px '+mono;ctx.fillText(String(G.score).padStart(6,'0'),42,74);
  ctx.fillStyle=COL.dim;ctx.font='700 11px '+mono;ctx.fillText('BEST',198,46);
  ctx.fillStyle='#ffd166';ctx.font='700 22px '+mono;ctx.fillText(String(Math.max(G.best,G.score)).padStart(6,'0'),198,71);
  ctx.textAlign='center';ctx.fillStyle='#ffc233';ctx.font='900 26px '+disp;ctx.fillText('STAGE '+G.level,GW/2,56);
  const frac=G.total?G.remaining/G.total:0;
  rr(ctx,GW/2-60,64,120,5,2.5);ctx.fillStyle='#143049';ctx.fill();
  if(frac>0){rr(ctx,GW/2-60,64,Math.max(5,120*frac),5,2.5);
    const bg=ctx.createLinearGradient(GW/2-60,0,GW/2+60,0);bg.addColorStop(0,'#4cc9f0');bg.addColorStop(1,'#3fd97b');ctx.fillStyle=bg;ctx.fill();}
  if(G.combo>=2){const s=1+.1*Math.sin(G.t*10);ctx.save();ctx.translate(GW/2+168,58);ctx.scale(s,s);
    ctx.fillStyle='#ff8a7a';ctx.font='900 24px '+disp;ctx.fillText('×'+Math.min(8,G.combo),0,10);
    ctx.fillStyle=COL.dim;ctx.font='700 10px '+mono;ctx.fillText('COMBO',0,-12);ctx.restore();}
  ctx.textAlign='right';ctx.fillStyle=COL.dim;ctx.font='700 11px '+mono;ctx.fillText('LIVES',GW-42,46);
  for(let i=0;i<G.lives;i++){ctx.fillStyle='#ffd166';ctx.shadowColor='rgba(255,194,51,.7)';ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(GW-42-i*20,64,6,0,TAU);ctx.fill();}ctx.shadowBlur=0;
  if(muted){ctx.fillStyle='rgba(255,130,130,.7)';ctx.font='700 10px '+mono;ctx.textAlign='right';ctx.fillText('MUTED · M',GW-42,GH-26);}}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const pg=ctx.createLinearGradient(0,0,0,chh);pg.addColorStop(0,'#0a1e2e');pg.addColorStop(.6,'#050f19');pg.addColorStop(1,'#02070d');
  ctx.fillStyle=pg;ctx.fillRect(0,0,cw,chh);
  const sp=36,oxo=(G.t*10)%sp,oyo=(G.t*5)%sp;
  ctx.fillStyle='rgba(96,170,214,.05)';
  for(let x=-sp+oxo;x<cw;x+=sp)for(let y=-sp+oyo;y<chh;y+=sp)ctx.fillRect(x,y,2,2);
  const shx=(Math.random()*2-1)*G.shake,shy=(Math.random()*2-1)*G.shake;
  ctx.setTransform(dpr*scl,0,0,dpr*scl,dpr*(ox+shx*scl),dpr*(oy+shy*scl));
  drawPanel();drawFieldBG();drawBricks();drawPows();drawShots();drawPaddle();drawBalls();drawParts();drawPops();drawChips();drawStuckHint();drawBanner();
  if(!G.inMenu)drawHUD();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const vg=ctx.createRadialGradient(cw/2,chh*.45,Math.min(cw,chh)*.35,cw/2,chh*.5,Math.max(cw,chh)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(1,4,8,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,cw,chh);
}

/* ================= input ================= */
function primary(){
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(G.paused){togglePause();return;}
  if(G.mode==='menu'||G.mode==='over'){startGame();return;}
  if(G.mode==='play'){let did=false;for(const b of balls)if(b.stuck){launch(b);did=true;}
    if(!did&&fx.laser>G.t&&G.fireT<=0){fireLaser();G.fireT=.3;}}}
function togglePause(){if(G.mode!=='play'&&G.mode!=='clear')return;
  G.paused=!G.paused;pauseTag.classList.toggle('hidden',!G.paused);sfx('ui');}
function restart(){if(G.mode==='menu')return;if(G.inMenu)return;startGame();}

window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k===' '||k.indexOf('Arrow')===0)e.preventDefault();
  initAudio();
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=true;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.right=true;
  else if(k===' '||k==='Enter'){if(!e.repeat)primary();}
  else if((k==='p'||k==='P'||k==='Escape')&&!e.repeat)togglePause();
  else if((k==='r'||k==='R')&&!e.repeat)restart();
  else if((k==='m'||k==='M')&&!e.repeat){muted=!muted;saveMute();if(master)master.gain.value=muted?0:0.45;}
});
window.addEventListener('keyup',e=>{const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.right=false;});
window.addEventListener('pointermove',e=>{if(G.mode==='play')paddle.target=(e.clientX-ox)/scl;});
window.addEventListener('pointerdown',e=>{initAudio();
  if(G.mode==='play')paddle.target=(e.clientX-ox)/scl;primary();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play'&&!G.paused)togglePause();});

/* ================= boot & loop ================= */
function showStart(){if(G.best>0)elBestChip.textContent='BEST  '+String(G.best).padStart(6,'0');else elBestChip.textContent='';}
buildLevel(0,0);newStuckBall();G.mode='menu';showStart();

let last=performance.now();
function frame(now){const dt=Math.min((now-last)/1000,1/30);last=now;
  if(!G.paused)update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
