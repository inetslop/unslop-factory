<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Danmaku Pong</title>
<style>
  :root{
    --display: Impact,'Haettenschweiler','Franklin Gothic Bold','Arial Black',sans-serif;
    --mono: Consolas,Menlo,'Lucida Console','DejaVu Sans Mono',monospace;
    --ink:#eaf6ff; --dim:#9fc3dd; --amber:#ffd257; --pink:#ff4fa3; --cyan:#7df3ff; --line:#35608a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#050d16;font-family:var(--mono)}
  canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:crosshair}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none;padding:16px}
  .panel{
    pointer-events:auto;width:min(580px,94vw);max-height:94vh;overflow:auto;text-align:center;color:var(--ink);
    background:linear-gradient(160deg,rgba(13,34,54,.96),rgba(7,18,32,.97));
    border:1px solid var(--line);padding:34px 30px 30px;position:relative;
    clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));
    box-shadow:0 0 60px rgba(0,0,0,.7), inset 0 0 40px rgba(20,60,100,.25);
  }
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--cyan),var(--amber) 45%,var(--pink))}
  .kanji{display:inline-block;border:1px solid var(--line);padding:3px 16px 3px 22px;font-size:14px;letter-spacing:.55em;color:var(--cyan);opacity:.9;margin-bottom:14px}
  h1{font-family:var(--display);font-weight:normal;font-size:clamp(40px,9vw,72px);line-height:.95;letter-spacing:.05em;
     text-shadow:-3px 0 rgba(53,214,255,.8),3px 0 rgba(255,79,163,.8),0 12px 30px rgba(0,0,0,.7)}
  h1 span{color:var(--amber)}
  h2{font-family:var(--display);font-weight:normal;font-size:clamp(34px,7vw,56px);letter-spacing:.06em;
     text-shadow:-3px 0 rgba(53,214,255,.8),3px 0 rgba(255,79,163,.8),0 12px 30px rgba(0,0,0,.7)}
  h2.win{color:var(--amber)} h2.lose{color:#ff7d8e}
  .tag{margin-top:10px;font-size:12px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
  .ctrl{list-style:none;margin:20px auto 0;display:inline-block;text-align:left;font-size:13px;line-height:2;color:var(--dim)}
  .ctrl b{color:var(--amber);font-weight:normal;letter-spacing:.08em}
  .rules{margin:16px auto 0;font-size:12px;line-height:1.75;color:var(--dim);max-width:42ch}
  .rules em{color:var(--cyan);font-style:normal}
  .best{margin-top:18px;font-size:11px;letter-spacing:.2em;color:var(--amber)}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 26px;margin:22px auto 0;max-width:380px}
  .stat .k{font-size:10px;letter-spacing:.25em;color:var(--dim)}
  .stat .v{font-family:var(--display);font-size:30px;color:var(--amber);text-shadow:0 0 14px rgba(255,210,87,.35)}
  .stat .v.c{color:var(--cyan);text-shadow:0 0 14px rgba(125,243,255,.35)}
  .btnrow{display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  button{
    font-family:var(--display);font-weight:normal;font-size:17px;letter-spacing:.16em;color:var(--ink);
    background:#12314a;border:1px solid #4f8ab5;padding:11px 30px 9px;cursor:pointer;
    clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  button:hover{background:#1b4a70;transform:translateY(-2px);box-shadow:0 6px 22px rgba(125,243,255,.28)}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
  button.primary{background:#7a5a14;border-color:var(--amber);color:#fff6dc}
  button.primary:hover{background:#9a7218;box-shadow:0 6px 22px rgba(255,210,87,.35)}
  .press{margin-top:18px;font-size:11px;letter-spacing:.3em;color:var(--cyan);animation:blink 1.4s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .foot{margin-top:16px;font-size:10px;letter-spacing:.18em;color:#5d87a8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>

<script>
'use strict';
/* ============================== SETUP ============================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const overlay=document.getElementById('overlay');
const TAU=Math.PI*2, PI=Math.PI;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[(Math.random()*a.length)|0];

const FIELD={w:520,h:880};
const GOAL_TARGET=7, WAVE_LEN=16;
const F_DISP="Impact,'Arial Black',sans-serif";
const F_MONO="Consolas,Menlo,monospace";
const C={aim:'#7df3ff',fan:'#ff8f5e',ring:'#c98bff',wall:'#63ffa9',wig:'#ffe45e',laser:'#ff5d6b',
         player:'#ffd257',playerCore:'#fff3c4',enemy:'#ff4fa3',enemyCore:'#ffb7dd'};
const PATTERN_NAMES=['FIRST BLOOM','AIMED RAIN','SCATTER FAN','RING CHORUS','GAP WALL','SINE SNAKE','LASER LANE','FULL CHAOS'];

let W=0,H=0,DPR=1,scale=1,offX=0,offY=0,vig=null;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=Math.max(2,W*DPR);cv.height=Math.max(2,H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  const m=Math.min(34,Math.max(10,Math.min(W,H)*0.05));
  scale=clamp(Math.min((W-m*2)/FIELD.w,(H-m*2)/FIELD.h),0.12,1.8);
  offX=(W-FIELD.w*scale)/2; offY=(H-FIELD.h*scale)/2;
  vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(2,6,12,0.55)');
}
addEventListener('resize',resize);resize();

/* ============================== STATE ============================== */
const S={mode:'menu',score:0,lives:3,wave:1,waveT:0,maxRally:0,timeScale:1,shake:0,flash:0,
         topGlow:0,serveT:0,invuln:0,fireT:1.2,won:false,best:loadBest()};
const pPaddle={x:FIELD.w/2,y:FIELD.h-58,w:96,h:14,hitT:0};
const ePaddle={x:FIELD.w/2,y:42,w:96,h:14,hitT:0};
const ball={x:FIELD.w/2,y:FIELD.h/2,vx:0,vy:0,r:8,speed:360,dir:-1,rally:0,trail:[]};
let bullets=[],lasers=[],parts=[],floats=[],emitters=[];
let usePointer=false,pointerX=FIELD.w/2,keys={l:false,r:false},timeNow=0;

function loadBest(){try{const v=JSON.parse(localStorage.getItem('danmakuPong.best'));
  return (v&&typeof v.rally==='number')?v:{rally:0,wave:0};}catch(e){return{rally:0,wave:0};}}
function saveBest(){S.best.rally=Math.max(S.best.rally,S.maxRally);S.best.wave=Math.max(S.best.wave,S.wave);
  try{localStorage.setItem('danmakuPong.best',JSON.stringify(S.best));}catch(e){}}

/* ============================== AUDIO ============================== */
let AC=null,master=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:0.16;master.connect(AC.destination);}catch(e){}
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:0.16;}
function tone(f,d,type,v,f2,when){
  if(!AC)return;type=type||'square';v=v===undefined?0.4:v;when=when||0;
  const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+d);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+0.03);
}
function noiseBurst(d,v){
  if(!AC)return;const n=AC.createBufferSource();
  const buf=AC.createBuffer(1,Math.max(1,(AC.sampleRate*d)|0),AC.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  n.buffer=buf;const g=AC.createGain();g.gain.value=v;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  n.connect(f);f.connect(g);g.connect(master);n.start();
}
let fireCount=0;
const sfx={
  hit:s=>tone(280+s*0.5,0.07,'square',0.4),
  wall:()=>tone(160,0.05,'triangle',0.35),
  goal:()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.12,'square',0.35,null,i*0.07)),
  lose:()=>{noiseBurst(0.35,0.5);tone(300,0.4,'sawtooth',0.45,60);},
  shatter:()=>tone(1400,0.05,'square',0.22,900),
  wave:()=>{tone(392,0.09,'square',0.3);tone(587.33,0.13,'square',0.3,null,0.09);},
  warn:()=>{tone(880,0.06,'sine',0.2);tone(880,0.06,'sine',0.2,null,0.14);},
  laserFire:()=>tone(95,0.5,'sawtooth',0.35,55),
  win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,0.16,'square',0.35,null,i*0.1)),
  over:()=>{noiseBurst(0.5,0.4);[392,311,262].forEach((f,i)=>tone(f,0.3,'sawtooth',0.3,f*0.8,i*0.22));},
  tick:()=>{if(++fireCount%4===0)tone(650+rand(0,200),0.03,'square',0.07);}
};

/* ============================== HELPERS ============================== */
function b(x,y,vx,vy,r,color,type){return{x,y,vx,vy,r,color,t:0,type:type||'shot',ph:0};}
function spark(x,y,color){emitters.push({x,y,t:0.45,max:0.45,color});}
function burst(x,y,n,color,sp,life){
  for(let i=0;i<n;i++){if(parts.length>420)return;
    const a=rand(0,TAU),s=rand(sp*0.3,sp);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rand(life*0.5,life),max:life,color,size:rand(1.5,4)});}
}
function addFloat(x,y,text,color,size,life,big){floats.push({x,y,text,color,size,life,t:life,big});}
function circleRect(cx,cy,r,rx,ry,rw,rh){const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh);
  const dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<=r*r;}
function foldX(x){const per=2*FIELD.w;x=((x%per)+per)%per;return x>FIELD.w?2*FIELD.w-x:x;}
function bSpeed(w){return Math.min(560,205+(w-1)*24);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============================== FLOW ============================== */
function serve(dir,delay){
  ball.x=FIELD.w/2;ball.y=FIELD.h/2;ball.vx=0;ball.vy=0;ball.dir=dir;ball.rally=0;ball.trail.length=0;
  ball.speed=Math.min(640,360+(S.wave-1)*12);S.serveT=delay===undefined?0.8:delay;
}
function resetRun(){
  S.score=0;S.lives=3;S.wave=1;S.waveT=0;S.maxRally=0;S.timeScale=1;S.invuln=0;S.shake=0;
  S.flash=0;S.topGlow=0;S.fireT=1.2;S.won=false;
  bullets.length=0;lasers.length=0;parts.length=0;floats.length=0;emitters.length=0;
  pPaddle.x=ePaddle.x=FIELD.w/2;pPaddle.hitT=ePaddle.hitT=0;
  serve(-1,1.0);
}
function beginRun(){initAudio();resetRun();S.mode='playing';hideOverlay();}
function toMenu(){resetRun();S.mode='menu';showOverlay('menu');}
function pauseGame(){S.mode='paused';showOverlay('pause');}
function endGame(won){
  S.mode='over';S.won=won;saveBest();
  burst(pPaddle.x,pPaddle.y,won?90:70,won?C.player:'#ff5d6b',420,1.4);
  if(won)burst(FIELD.w/2,120,70,C.cyan,380,1.4);
  S.shake=won?8:16;
  (won?sfx.win:sfx.over)();showOverlay('over');
}

/* ============================== PATTERNS ============================== */
function patAimed(w){const n=1+Math.min(3,((w-1)/2|0));let lx=FIELD.w/2;
  for(let i=0;i<n;i++){const x=rand(40,FIELD.w-40);lx=x;
    const tx=pPaddle.x+rand(-26,26),ty=FIELD.h-58,d=Math.hypot(tx-x,ty-y)||1,sp=bSpeed(w)*1.16;
    bullets.push(b(x,14,(tx-x)/d*sp,(ty-y)/d*sp,6,C.aim));}
  spark(lx,16,C.aim);sfx.tick();}
function patFan(w){const cx=rand(70,FIELD.w-70),n=6+Math.min(4,w),spread=1.9;
  for(let i=0;i<n;i++){const a=PI/2+lerp(-spread/2,spread/2,n>1?i/(n-1):0.5)*rand(0.95,1.05);
    const sp=bSpeed(w)*rand(0.85,1.1);bullets.push(b(cx,16,Math.cos(a)*sp,Math.sin(a)*sp,6,C.fan));}
  spark(cx,20,C.fan);sfx.tick();}
function patRing(w){const n=Math.min(18,9+w),st=rand(0,TAU),sp=bSpeed(w)*0.95;
  for(let i=0;i<n;i++){const a=st+TAU*i/n;bullets.push(b(ePaddle.x,42,Math.cos(a)*sp,Math.sin(a)*sp,6,C.ring));}
  spark(ePaddle.x,42,C.ring);sfx.tick();}
function patWall(w){const gx=rand(95,FIELD.w-95),gw=140;let g2=null;
  if(w>=6){for(let t=0;t<8;t++){const c=rand(95,FIELD.w-95);if(Math.abs(c-gx)>gw+70){g2=c;break;}}
    if(g2)spark(g2,14,C.wall);}
  for(let x=18;x<FIELD.w-10;x+=34){
    if(Math.abs(x-gx)<gw/2||(g2&&Math.abs(x-g2)<gw/2))continue;
    bullets.push(b(x,14,0,bSpeed(w)*0.72,5,C.wall));}
  spark(gx,14,C.wall);sfx.tick();}
function patWig(w){for(let i=0;i<5;i++){const bl=b(rand(60,FIELD.w-60),14+i*30,0,bSpeed(w)*0.8,6,C.wig,'wig');
    bl.ph=i*0.9;bullets.push(bl);}sfx.tick();}
function patLaser(w){for(let t=0;t<10;t++){const x=rand(60,FIELD.w-60);
    if(Math.abs(x-pPaddle.x)<100)continue;
    if(lasers.some(l=>Math.abs(l.x-x)<80))continue;
    lasers.push({x,w:34,state:'warn',t:0.9,hit:false});sfx.warn();return;}}
function spawnPattern(mode){
  const w=mode==='menu'?1:S.wave,pool=['aimed','fan'];
  if(w>=2)pool.push('ring');if(w>=3)pool.push('wall','aimed');
  if(w>=4)pool.push('wig','fan');if(w>=5)pool.push('laser');if(w>=6)pool.push('wall','ring');
  ({aimed:patAimed,fan:patFan,ring:patRing,wall:patWall,wig:patWig,laser:patLaser})[pick(pool)](w);
}

/* ============================== SIMULATION ============================== */
function updatePlayer(dt){
  if(S.mode==='menu'){ // attract AI
    const tx=ball.vy>0?ball.x:FIELD.w/2;
    pPaddle.x+=clamp(tx-pPaddle.x,-430*dt,430*dt);
  }else if(usePointer){
    pPaddle.x+=(pointerX-pPaddle.x)*Math.min(1,dt*16);
  }else{
    const v=((keys.r?1:0)-(keys.l?1:0))*640;
    pPaddle.x+=v*dt;
  }
  pPaddle.x=clamp(pPaddle.x,pPaddle.w/2+8,FIELD.w-pPaddle.w/2-8);
}
function updateEnemy(dt){
  let tx=FIELD.w/2,sp=Math.min(720,380+S.wave*26);
  if(ball.vy<0&&ball.speed>0){
    const t=(ePaddle.y-ball.y)/ball.vy;
    tx=foldX(ball.x+ball.vx*t)+Math.sin(timeNow*0.9)*10;
  }else sp*=0.45;
  ePaddle.x+=clamp(tx-ePaddle.x,-sp*dt,sp*dt);
  ePaddle.x=clamp(ePaddle.x,ePaddle.w/2+8,FIELD.w-ePaddle.w/2-8);
}
function bounce(p,up){
  const rel=clamp((ball.x-p.x)/(p.w/2),-1,1),a=rel*1.05;
  ball.speed=Math.min(980,ball.speed*1.045);
  ball.vx=Math.sin(a)*ball.speed;
  ball.vy=(up?-1:1)*Math.cos(a)*ball.speed;
  ball.y=up?p.y+p.h+ball.r+0.5:p.y-ball.r-0.5;
  p.hitT=1;ball.rally++;
  if(S.mode==='playing')S.maxRally=Math.max(S.maxRally,ball.rally);
  burst(ball.x,ball.y,8,up?C.enemyCore:C.playerCore,220,0.4);
  sfx.hit(ball.speed);
  if(up&&S.mode==='playing'&&bullets.length<420){ // enemy paddle is also an emitter
    for(let i=0;i<6;i++){const aa=PI/2+lerp(-1.1,1.1,i/5),sp=bSpeed(S.wave)*0.8;
      bullets.push(b(ball.x,p.y+p.h+4,Math.cos(aa)*sp,Math.sin(aa)*sp,5,'#ff9ecb'));}
  }
}
function playerGoal(){
  if(S.mode!=='playing'){serve(1);return;}
  S.score++;S.topGlow=1;S.shake=Math.max(S.shake,5);
  burst(FIELD.w/2,20,46,C.player,380,1.1);
  addFloat(FIELD.w/2,110,'+1 GOAL',C.player,34,1.1,true);
  if(ball.rally>=8){S.score++;addFloat(FIELD.w/2,150,'RALLY BONUS +1',C.enemy,18,1.2,false);}
  sfx.goal();
  if(S.score>=GOAL_TARGET)endGame(true);else serve(1,0.9);
}
function missBall(){
  if(S.mode!=='playing'){serve(-1);return;}
  loseLife('miss');
}
function loseLife(reason){
  if(S.mode!=='playing')return;
  S.lives--;S.invuln=2;S.shake=16;S.flash=0.55;S.timeScale=0.28;
  burst(pPaddle.x,pPaddle.y,40,'#ff5d6b',360,1);
  addFloat(pPaddle.x,pPaddle.y-40,reason==='miss'?'MISSED!':'HIT!','#ff7d8e',30,1.2,true);
  sfx.lose();
  if(S.lives<=0)endGame(false);else serve(-1,1.0);
}
function step(dt,mode){
  updatePlayer(dt);updateEnemy(dt);
  pPaddle.hitT=Math.max(0,pPaddle.hitT-dt*3);ePaddle.hitT=Math.max(0,ePaddle.hitT-dt*3);

  S.fireT-=dt;
  if(S.fireT<=0){spawnPattern(mode);const w=mode==='menu'?1:S.wave;
    S.fireT=(mode==='menu'?2.4:Math.max(0.55,2.1-(w-1)*0.17))*rand(0.85,1.15);}

  if(mode==='playing'){
    S.invuln=Math.max(0,S.invuln-dt);
    S.waveT+=dt;
    if(S.waveT>=WAVE_LEN){S.waveT=0;S.wave++;
      addFloat(FIELD.w/2,FIELD.h*0.34,'WAVE '+S.wave,C.cyan,42,1.7,true);
      const nm=S.wave<=PATTERN_NAMES.length?PATTERN_NAMES[S.wave-1]:'FULL CHAOS';
      addFloat(FIELD.w/2,FIELD.h*0.34+44,nm,'#cfe8ff',15,1.7,false);sfx.wave();}
  }

  if(S.serveT>0){S.serveT-=dt;
    if(S.serveT<=0){const a=rand(-0.55,0.55);
      ball.vx=Math.sin(a)*ball.speed;ball.vy=Math.cos(a)*ball.speed*ball.dir;}
  }else{
    const n=clamp(Math.ceil(ball.speed*dt/10),1,6);
    for(let i=0;i<n&&S.mode===mode;i++){
      const s=dt/n;ball.x+=ball.vx*s;ball.y+=ball.vy*s;
      if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx);wallFlash.l=1;sfx.wall();}
      if(ball.x+ball.r>FIELD.w){ball.x=FIELD.w-ball.r;ball.vx=-Math.abs(ball.vx);wallFlash.r=1;sfx.wall();}
      if(ball.vy>0&&circleRect(ball.x,ball.y,ball.r,pPaddle.x-pPaddle.w/2,pPaddle.y,pPaddle.w,pPaddle.h))bounce(pPaddle,true);
      if(ball.vy<0&&circleRect(ball.x,ball.y,ball.r,ePaddle.x-ePaddle.w/2,ePaddle.y,ePaddle.w,ePaddle.h))bounce(ePaddle,false);
    }
    ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>10)ball.trail.shift();
    if(ball.y+ball.r<-6)playerGoal();
    else if(ball.y-ball.r>FIELD.h+6)missBall();
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){const bl=bullets[i];bl.t+=dt;
    if(bl.type==='wig')bl.x+=Math.sin(bl.t*4.5+bl.ph)*150*dt;
    bl.x+=bl.vx*dt;bl.y+=bl.vy*dt;
    if(bl.y>FIELD.h+30||bl.y<-40||bl.x<-30||bl.x>FIELD.w+30){bullets.splice(i,1);continue;}
    if(mode==='playing'&&circleRect(bl.x,bl.y,bl.r,pPaddle.x-pPaddle.w/2,pPaddle.y,pPaddle.w,pPaddle.h)){
      bullets.splice(i,1);
      if(S.invuln>0){burst(bl.x,bl.y,7,C.cyan,200,0.35);sfx.shatter();}
      else loseLife('bullet');
    }
  }

  // lasers
  for(let i=lasers.length-1;i>=0;i--){const l=lasers[i];l.t-=dt;
    if(l.state==='warn'&&l.t<=0){l.state='fire';l.t=0.5;sfx.laserFire();}
    else if(l.state==='fire'){
      if(!l.hit&&mode==='playing'&&(pPaddle.x+pPaddle.w/2>l.x-l.w/2)&&(pPaddle.x-pPaddle.w/2<l.x+l.w/2)){
        l.hit=true;if(S.invuln>0){burst(pPaddle.x,pPaddle.y,10,C.cyan,220,0.4);sfx.shatter();}else loseLife('laser');}
      if(l.t<=0)lasers.splice(i,1);
    }
  }
  for(let i=emitters.length-1;i>=0;i--){emitters[i].t-=dt;if(emitters[i].t<=0)emitters.splice(i,1);}
}

/* ============================== BACKGROUND FX ============================== */
const glyphs=[];{const chars=['弾','幕','風','光','球'],cols=['#7df3ff','#ff4fa3','#ffd257'];
  for(let i=0;i<8;i++)glyphs.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    s:rand(30,90),v:rand(6,20),a:rand(0.03,0.07),c:pick(cols),ch:pick(chars)});}
const stars=[];for(let i=0;i<50;i++)stars.push({x:Math.random(),y:Math.random(),r:rand(0.6,1.8),a:rand(0.1,0.4),v:rand(3,10)});
function updateBG(dt){
  for(const g of glyphs){g.y-=g.v*dt;if(g.y<-120){g.y=innerHeight+120;g.x=Math.random()*innerWidth;}}
  for(const s of stars){s.y-=s.v*dt/innerHeight;if(s.y<0)s.y=1;}
}
const wallFlash={l:0,r:0};
function updateFX(dt){
  if(S.mode!=='paused'){
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t-=dt;
      if(p.t<=0){parts.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*2.4);p.vy*=Math.exp(-dt*2.4);}
    for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t-=dt;f.y-=26*dt;if(f.t<=0)floats.splice(i,1);}
  }
  S.shake=Math.max(0,S.shake-dt*34);S.flash=Math.max(0,S.flash-dt*1.5);
  S.topGlow=Math.max(0,S.topGlow-dt*1.6);
  wallFlash.l=Math.max(0,wallFlash.l-dt*2.6);wallFlash.r=Math.max(0,wallFlash.r-dt*2.6);
}

/* ============================== DRAW ============================== */
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1c2e');g.addColorStop(0.55,'#081627');g.addColorStop(1,'#050d18');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#bfe4ff';
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const gl of glyphs){ctx.globalAlpha=gl.a;ctx.fillStyle=gl.c;
    ctx.font=gl.s+'px '+F_MONO;ctx.fillText(gl.ch,gl.x,gl.y);}
  ctx.globalAlpha=1;
  const gut=(W-FIELD.w*scale)/2;
  if(gut>100){
    ctx.save();ctx.translate(26,H/2);ctx.rotate(-PI/2);
    ctx.font='26px '+F_DISP;ctx.fillStyle='rgba(125,243,255,0.10)';
    ctx.fillText('DANMAKU PONG · 弾幕ポン',0,0);ctx.restore();
    ctx.save();ctx.translate(W-26,H/2);ctx.rotate(PI/2);
    ctx.font='26px '+F_DISP;ctx.fillStyle='rgba(255,79,163,0.10)';
    ctx.fillText('DANMAKU PONG · 弾幕ポン',0,0);ctx.restore();
  }
}
function drawPaddle(p,color,core){
  const x=p.x-p.w/2,y=p.y,pulse=p.hitT;
  let a=1;if(S.mode==='playing'&&S.invuln>0&&((timeNow*18|0)%2))a=0.35;
  ctx.globalAlpha=a*(0.14+pulse*0.4);ctx.fillStyle=color;rr(x-7,y-7,p.w+14,p.h+14,9);ctx.fill();
  ctx.globalAlpha=a*(0.3+pulse*0.5);rr(x-3,y-3,p.w+6,p.h+6,6);ctx.fill();
  ctx.globalAlpha=a;ctx.fillStyle=color;rr(x,y,p.w,p.h,5);ctx.fill();
  ctx.globalAlpha=a*0.9;ctx.fillStyle=core;rr(x+p.w*0.28,y+3,p.w*0.44,p.h-6,3);ctx.fill();
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBG();
  const shx=S.shake?rand(-S.shake,S.shake):0,shy=S.shake?rand(-S.shake,S.shake):0;
  ctx.save();ctx.translate(offX+shx,offY+shy);ctx.scale(scale,scale);

  // field interior
  const ig=ctx.createLinearGradient(0,0,0,FIELD.h);
  ig.addColorStop(0,'#0e2438');ig.addColorStop(0.5,'#0a1c2e');ig.addColorStop(1,'#0d2136');
  ctx.fillStyle=ig;ctx.fillRect(0,0,FIELD.w,FIELD.h);
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=65;x<FIELD.w;x+=65){ctx.moveTo(x,0);ctx.lineTo(x,FIELD.h);}
  for(let y=65;y<FIELD.h;y+=65){ctx.moveTo(0,y);ctx.lineTo(FIELD.w,y);}
  ctx.stroke();

  // center line
  ctx.setLineDash([10,14]);ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,FIELD.h/2);ctx.lineTo(FIELD.w,FIELD.h/2);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.beginPath();ctx.arc(FIELD.w/2,FIELD.h/2,34,0,TAU);ctx.stroke();

  // goal glow (top)
  if(S.topGlow>0){const gg=ctx.createLinearGradient(0,0,0,140);
    gg.addColorStop(0,'rgba(255,210,87,'+(0.5*S.topGlow)+')');gg.addColorStop(1,'rgba(255,210,87,0)');
    ctx.fillStyle=gg;ctx.fillRect(0,0,FIELD.w,140);}

  // lasers
  for(const l of lasers){
    if(l.state==='warn'){
      ctx.fillStyle='rgba(255,93,107,'+(0.10+0.06*Math.sin(timeNow*20))+')';
      ctx.fillRect(l.x-l.w/2,0,l.w,FIELD.h);
      ctx.strokeStyle='rgba(255,93,107,0.55)';ctx.lineWidth=2;ctx.setLineDash([14,18]);
      ctx.lineDashOffset=-timeNow*260;
      ctx.beginPath();ctx.moveTo(l.x,0);ctx.lineTo(l.x,FIELD.h);ctx.stroke();ctx.setLineDash([]);
    }else{
      ctx.fillStyle='rgba(255,93,107,0.5)';ctx.fillRect(l.x-l.w/2,0,l.w,FIELD.h);
      ctx.fillStyle='rgba(255,240,240,0.85)';ctx.fillRect(l.x-l.w*0.16,0,l.w*0.32,FIELD.h);
    }
  }

  // emitter sparks
  for(const e of emitters){const k=e.t/e.max;
    ctx.save();ctx.translate(e.x,e.y);ctx.rotate(PI/4);
    ctx.globalAlpha=k;ctx.fillStyle=e.color;const s=12*(1.6-k);
    ctx.fillRect(-s/2,-s/2,s,s);ctx.restore();}
  ctx.globalAlpha=1;

  drawPaddle(ePaddle,C.enemy,C.enemyCore);
  drawPaddle(pPaddle,C.player,C.playerCore);

  // ball (additive section)
  ctx.globalCompositeOperation='lighter';
  if(S.serveT>0){
    const pr=ball.r*(1+0.3*Math.sin(timeNow*8)),prog=1-clamp(S.serveT/0.9,0,1);
    ctx.fillStyle='rgba(255,246,220,0.9)';ctx.beginPath();ctx.arc(ball.x,ball.y,pr,0,TAU);ctx.fill();
    ctx.strokeStyle=C.player;ctx.lineWidth=3;ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.arc(ball.x,ball.y,20,-PI/2,-PI/2+prog*TAU);ctx.stroke();ctx.globalAlpha=1;
  }else{
    for(let i=0;i<ball.trail.length;i++){const t=ball.trail[i],k=i/ball.trail.length;
      ctx.globalAlpha=k*0.22;ctx.fillStyle='#ffd8a0';
      ctx.beginPath();ctx.arc(t.x,t.y,ball.r*k,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,220,140,0.3)';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*2.6,0,TAU);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(255,210,87,0.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r+3,0,TAU);ctx.stroke();
  }
  // bullets
  for(const bl of bullets){
    ctx.globalAlpha=0.16;ctx.fillStyle=bl.color;
    ctx.beginPath();ctx.arc(bl.x,bl.y,bl.r*2.1,0,TAU);ctx.fill();
    ctx.globalAlpha=1;ctx.beginPath();ctx.arc(bl.x,bl.y,bl.r,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath();ctx.arc(bl.x,bl.y,bl.r*0.42,0,TAU);ctx.fill();
  }
  // particles
  for(const p of parts){ctx.globalAlpha=clamp(p.t/p.max,0,1);ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  // floats
  for(const f of floats){const k=clamp(f.t/f.life,0,1);
    ctx.globalAlpha=k<0.85?1:k/0.85;ctx.fillStyle=f.color;ctx.textAlign='center';ctx.textBaseline='middle';
    if(f.big){ctx.font=f.size+'px '+F_DISP;
      ctx.shadowColor=f.color;ctx.shadowBlur=14;ctx.fillText(f.text,f.x,f.y);ctx.shadowBlur=0;}
    else{ctx.font=f.size+'px '+F_MONO;ctx.fillText(f.text,f.x,f.y);}
  }
  ctx.globalAlpha=1;

  // wall flashes
  if(wallFlash.l>0){const wg=ctx.createLinearGradient(0,0,70,0);
    wg.addColorStop(0,'rgba(255,210,87,'+(0.5*wallFlash.l)+')');wg.addColorStop(1,'rgba(255,210,87,0)');
    ctx.fillStyle=wg;ctx.fillRect(0,0,70,FIELD.h);}
  if(wallFlash.r>0){const wg=ctx.createLinearGradient(FIELD.w,0,FIELD.w-70,0);
    wg.addColorStop(0,'rgba(255,210,87,'+(0.5*wallFlash.r)+')');wg.addColorStop(1,'rgba(255,210,87,0)');
    ctx.fillStyle=wg;ctx.fillRect(FIELD.w-70,0,70,FIELD.h);}

  // HUD
  if(S.mode==='playing'||S.mode==='paused'){
    ctx.fillStyle='rgba(4,12,20,0.55)';ctx.fillRect(0,0,FIELD.w,30);
    ctx.textBaseline='middle';
    ctx.textAlign='left';ctx.font='24px '+F_DISP;ctx.fillStyle=C.player;
    ctx.fillText(S.score,14,16);
    ctx.font='11px '+F_MONO;ctx.fillStyle='#7fa8c9';ctx.fillText('/'+GOAL_TARGET,52,16);
    // wave center
    const nm=S.wave<=PATTERN_NAMES.length?PATTERN_NAMES[S.wave-1]:'FULL CHAOS';
    ctx.textAlign='center';ctx.font='11px '+F_MONO;ctx.fillStyle='#9fd8ff';
    ctx.fillText('WAVE '+S.wave+' · '+nm,FIELD.w/2,16);
    // lives orbs
    for(let i=0;i<3;i++){const ox=FIELD.w-18-i*22,oy=15;
      if(i<S.lives){ctx.fillStyle='#ff5d7e';ctx.beginPath();ctx.arc(ox,oy,7,0,TAU);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(ox-2,oy-2,2.4,0,TAU);ctx.fill();}
      else{ctx.strokeStyle='rgba(255,93,126,0.4)';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(ox,oy,7,0,TAU);ctx.stroke();}}
    // rally counter
    if(ball.rally>=4&&S.serveT<=0){
      ctx.textAlign='center';ctx.font='12px '+F_MONO;
      ctx.globalAlpha=0.6+0.4*Math.sin(timeNow*8);ctx.fillStyle=C.player;
      ctx.fillText('RALLY ×'+ball.rally,pPaddle.x,pPaddle.y-18);ctx.globalAlpha=1;}
    if(muted){ctx.textAlign='left';ctx.font='10px '+F_MONO;ctx.globalAlpha=0.5;
      ctx.fillStyle='#9fc3dd';ctx.fillText('SOUND OFF [M]',8,FIELD.h-10);ctx.globalAlpha=1;}
  }

  // frame + corner brackets
  ctx.strokeStyle='#2f5b80';ctx.lineWidth=2;ctx.strokeRect(1,1,FIELD.w-2,FIELD.h-2);
  const br=[[0,0,1,1,C.enemy],[FIELD.w,0,-1,1,C.enemy],[0,FIELD.h,1,-1,C.player],[FIELD.w,FIELD.h,-1,-1,C.player]];
  ctx.lineWidth=3;
  for(const c of br){ctx.strokeStyle=c[4];ctx.beginPath();
    ctx.moveTo(c[0]+c[2]*22,c[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(c[0],c[1]+c[3]*22);ctx.stroke();}

  ctx.restore();

  // screen-space overlays
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(S.flash>0){ctx.fillStyle='rgba(255,60,70,'+(S.flash*0.38)+')';ctx.fillRect(0,0,W,H);}
  const dim=S.mode==='menu'?0.4:S.mode==='paused'?0.45:S.mode==='over'?0.5:0;
  if(dim){ctx.fillStyle='rgba(3,8,15,'+dim+')';ctx.fillRect(0,0,W,H);}
}

/* ============================== OVERLAYS ============================== */
function showOverlay(kind){
  let html='';
  const sndTxt=muted?'OFF':'ON';
  if(kind==='menu'){
    html='<div class="panel"><div class="kanji">弾幕</div>'+
      '<h1>DANMAKU<span>PONG</span></h1>'+
      '<p class="tag">bullet-hell ping-pong · first to '+GOAL_TARGET+' goals</p>'+
      '<ul class="ctrl"><li><b>← → / A D / mouse</b> — move paddle</li>'+
      '<li><b>P</b> pause &nbsp;·&nbsp; <b>M</b> sound &nbsp;·&nbsp; <b>R</b> restart</li></ul>'+
      '<p class="rules">Return the ball past the enemy to score. Every bullet — and every missed ball — costs one of your <em>3 lives</em>. Long rallies earn bonus goals.</p>'+
      '<div class="best">BEST RALLY '+S.best.rally+' &nbsp;·&nbsp; BEST WAVE '+S.best.wave+'</div>'+
      '<div class="btnrow"><button class="primary" data-act="start">START</button></div>'+
      '<p class="press">— PRESS ANY KEY OR CLICK —</p>'+
      '<p class="foot">SOUND '+sndTxt+' · [M]</p></div>';
  }else if(kind==='pause'){
    html='<div class="panel"><h2>PAUSED</h2>'+
      '<p class="tag">the barrage holds its breath</p>'+
      '<div class="btnrow"><button class="primary" data-act="resume">RESUME</button>'+
      '<button data-act="restart">RESTART</button><button data-act="menu">MENU</button></div>'+
      '<p class="foot">SOUND '+sndTxt+' · [M] &nbsp; [P] RESUME &nbsp; [R] RESTART</p></div>';
  }else{ // over
    const won=S.won,flawless=won&&S.lives===3;
    html='<div class="panel"><div class="kanji">'+(won?'勝利':'敗北')+'</div>'+
      '<h2 class="'+(won?'win':'lose')+'">'+(won?'VICTORY':'GAME OVER')+'</h2>'+
      '<p class="tag">'+(won?(flawless?'FLAWLESS — DANMAKU MASTER!':'DANMAKU MASTER'):'THE BARRAGE CLAIMS YOU')+'</p>'+
      '<div class="stats">'+
      '<div class="stat"><div class="k">GOALS</div><div class="v">'+S.score+'/'+GOAL_TARGET+'</div></div>'+
      '<div class="stat"><div class="k">MAX RALLY</div><div class="v c">×'+S.maxRally+'</div></div>'+
      '<div class="stat"><div class="k">WAVE REACHED</div><div class="v c">'+S.wave+'</div></div>'+
      '<div class="stat"><div class="k">BEST RALLY</div><div class="v">'+S.best.rally+'</div></div></div>'+
      '<div class="btnrow"><button class="primary" data-act="restart">PLAY AGAIN</button>'+
      '<button data-act="menu">MENU</button></div>'+
      '<p class="foot">[R] OR [SPACE] TO PLAY AGAIN &nbsp;·&nbsp; SOUND '+sndTxt+' · [M]</p></div>';
  }
  overlay.innerHTML=html;
}
function hideOverlay(){overlay.innerHTML='';}
overlay.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  const a=btn.dataset.act;
  if(a==='start'||a==='restart')beginRun();
  else if(a==='resume'){S.mode='playing';hideOverlay();}
  else if(a==='menu')toMenu();
});

/* ============================== INPUT ============================== */
addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  initAudio();
  if(k==='m'||k==='M'){toggleMute();return;}
  const low=k.toLowerCase();
  if(low==='arrowleft'||low==='a'){keys.l=true;usePointer=false;}
  if(low==='arrowright'||low==='d'){keys.r=true;usePointer=false;}
  if(S.mode==='menu'){beginRun();return;}
  if(S.mode==='over'){
    if(k==='r'||k==='R'||k===' '||k==='Enter')beginRun();
    else if(k==='Escape')toMenu();return;}
  if(S.mode==='paused'){
    if(k==='p'||k==='P'||k==='Escape'||k===' '){S.mode='playing';hideOverlay();}
    else if(k==='r'||k==='R')beginRun();return;}
  if(S.mode==='playing'){
    if(k==='p'||k==='P'||k==='Escape')pauseGame();
    else if(k==='r'||k==='R')beginRun();}
});
addEventListener('keyup',e=>{const low=e.key.toLowerCase();
  if(low==='arrowleft'||low==='a')keys.l=false;
  if(low==='arrowright'||low==='d')keys.r=false;});
addEventListener('pointermove',e=>{usePointer=true;pointerX=clamp((e.clientX-offX)/scale,0,FIELD.w);});
addEventListener('pointerdown',e=>{initAudio();
  if(S.mode==='menu'&&!e.target.closest('button'))beginRun();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.mode==='playing')pauseGame();});

/* ============================== LOOP ============================== */
showOverlay('menu');
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;timeNow=now/1000;
  updateBG(dt);
  if(S.mode==='playing'||S.mode==='menu')step(dt*S.timeScale,S.mode);
  if(S.timeScale<1)S.timeScale=Math.min(1,S.timeScale+dt*2.2);
  updateFX(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
