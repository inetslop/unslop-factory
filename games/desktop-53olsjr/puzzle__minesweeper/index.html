<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Minesweeper — Bomb Disposal Console</title>
<style>
:root{
  --bg0:#0c110a; --panel:#1b2415; --panel-edge:#39482a;
  --olive-l:#55663a; --ink:#dfe8cf; --dim:#8fa07a;
  --haz:#ffcf3f; --red:#ff5349; --green:#8fd14f;
  --cell:34px;
  --mono:"Consolas","SF Mono",Menlo,"Courier New",monospace;
  --disp:"Arial Black","Segoe UI Black",Impact,"Franklin Gothic Medium",sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--ink);font-family:var(--body);user-select:none;-webkit-user-select:none}

/* ---------- ambient background layers ---------- */
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(62% 52% at 50% 36%,rgba(143,209,79,.10),transparent 70%),
             radial-gradient(50% 40% at 85% 100%,rgba(255,83,73,.05),transparent 70%);}
.bg-grid{position:fixed;inset:-2px;pointer-events:none;z-index:0;opacity:.6;
  background-image:linear-gradient(rgba(143,209,79,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(143,209,79,.05) 1px,transparent 1px);
  background-size:46px 46px;animation:drift 70s linear infinite;}
@keyframes drift{to{background-position:46px 92px}}
.bg-sweep{position:fixed;inset:0;pointer-events:none;z-index:0;transform:translateX(-100%);
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.028) 50%,transparent 58%);
  animation:sweep 9s ease-in-out infinite;}
@keyframes sweep{55%,100%{transform:translateX(100%)}}

.radar{position:fixed;top:14px;right:16px;width:118px;height:118px;border-radius:50%;z-index:1;
  pointer-events:none;opacity:.55;border:1px solid rgba(143,209,79,.3);
  background:repeating-radial-gradient(circle at 50% 50%,rgba(143,209,79,.16) 0 1px,transparent 1px 24px),
             linear-gradient(rgba(143,209,79,.14) 1px,transparent 1px) 50% 50%/100% 100% no-repeat,
             linear-gradient(90deg,rgba(143,209,79,.14) 1px,transparent 1px) 50% 50%/100% 100% no-repeat;}
.radar i{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(143,209,79,.5),transparent 75deg);animation:spin 4.6s linear infinite;}
.radar b{position:absolute;left:64%;top:30%;width:5px;height:5px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:blip 4.6s infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,12%{opacity:1}55%{opacity:.1}100%{opacity:1}}
@media(max-width:700px){.radar{display:none}}

/* ---------- stage / top bar ---------- */
#stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;gap:10px;padding:clamp(8px,1.6vmin,16px)}
#stage.shake{animation:shake .45s}
@keyframes shake{10%{transform:translate(-6px,3px)}25%{transform:translate(5px,-4px)}40%{transform:translate(-4px,2px)}55%{transform:translate(4px,3px)}70%{transform:translate(-3px,-2px)}85%{transform:translate(2px,1px)}}

#topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);
  font-size:11px;letter-spacing:.14em;color:var(--dim);padding:2px 2px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--disp);font-size:15px;letter-spacing:.1em;color:#eef3e4;text-shadow:0 2px 0 #0a0d07}
.hstrip{width:30px;height:10px;border:1px solid #000;
  background:repeating-linear-gradient(45deg,var(--haz) 0 6px,#151b10 6px 12px)}
.tright{display:flex;gap:16px;align-items:center}
#posReadout{color:#a9bb8f;min-width:74px;text-align:right}
#statusText{color:var(--dim);transition:color .3s}
#statusText::after{content:"▍";animation:blink 1.1s steps(1) infinite;margin-left:2px}
#statusText.st-live{color:var(--haz)} #statusText.st-ok{color:var(--green)} #statusText.st-bad{color:var(--red)}
@keyframes blink{50%{opacity:0}}

/* ---------- LED console (mines / face / timer) ---------- */
#console{display:flex;justify-content:center;align-items:stretch;gap:14px;padding:10px 16px;
  background:linear-gradient(#222c19,#181f11);border:1px solid var(--panel-edge);border-radius:6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 22px rgba(0,0,0,.45);}
.led-box{position:relative;background:#080b06;border:1px solid #000;min-width:98px;padding:7px 12px 8px;
  box-shadow:inset 0 0 10px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.led-box::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.led-box label{display:block;font:600 9px/1 var(--mono);letter-spacing:.3em;color:#7d8a6b;margin-bottom:5px}
.led-box output{font:700 clamp(22px,4.2vmin,30px)/1 var(--mono);letter-spacing:.1em;color:#ff5349;
  text-shadow:0 0 8px rgba(255,83,73,.7),0 0 26px rgba(255,83,73,.35);font-variant-numeric:tabular-nums}
#faceBtn{width:60px;font-size:30px;line-height:1;cursor:pointer;border-radius:4px;color:#fff;
  background:linear-gradient(135deg,#52643a,#3b4a29);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.18),inset -2px -2px 0 rgba(0,0,0,.4),0 4px 10px rgba(0,0,0,.4);
  transition:transform .06s}
#faceBtn:hover{filter:brightness(1.12)}
#faceBtn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 rgba(0,0,0,.35),inset -2px -2px 0 rgba(255,255,255,.06)}

/* ---------- toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#tabs{display:flex;gap:6px}
.tab{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  background:transparent;border:1px solid #3a4a2b;padding:8px 13px;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--ink);border-color:rgba(255,207,63,.5)}
.tab.sel{color:var(--haz);background:#242f1b;border-color:var(--haz);box-shadow:inset 0 -2px 0 var(--haz)}
#bestTag{margin-left:auto;font:600 11px/1 var(--mono);letter-spacing:.18em;color:var(--dim)}
#bestTag em{font-style:normal;color:var(--haz)}
.tool{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--dim);background:#161d10;border:1px solid #3a4a2b;
  padding:8px 11px;cursor:pointer;touch-action:manipulation;transition:all .15s}
.tool:hover{color:var(--ink)}
.tool.on{color:#141a0e;background:var(--haz);border-color:var(--haz);box-shadow:0 0 12px rgba(255,207,63,.35)}
.tool.off{opacity:.55;text-decoration:line-through}

/* ---------- board ---------- */
#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{display:grid;border:2px solid #0b0f08;background:#141a0e;touch-action:none;
  box-shadow:0 0 0 3px #37462a,0 0 0 4px #0b0f08,0 20px 55px rgba(0,0,0,.6)}
.cell{width:var(--cell);height:var(--cell);position:relative;display:flex;align-items:center;justify-content:center}
.cell.cov{cursor:pointer;background:linear-gradient(135deg,#4d5e36,#39482a);
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.15),inset -2px -2px 0 rgba(0,0,0,.38);transition:filter .08s}
.cell.cov:hover{filter:brightness(1.18)}
.cell.cov:active{box-shadow:inset 1px 1px 4px rgba(0,0,0,.5)}
.cell.open{background:#182011;box-shadow:inset 0 0 0 1px #0d120b,inset 1px 1px 5px rgba(0,0,0,.5);cursor:default;animation:pop .16s ease-out}
.cell.open.num{cursor:pointer;font-family:var(--disp);font-weight:900;font-size:calc(var(--cell)*.5);line-height:1;text-shadow:0 2px 3px rgba(0,0,0,.6)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.n1{color:#7db9ff}.n2{color:#93e07c}.n3{color:#ff8a7d}.n4{color:#c9b6ff}
.n5{color:#ffb26b}.n6{color:#6fe3d2}.n7{color:#f1f4fa}.n8{color:#aab4bd}

.cell.flag::before{content:"";position:absolute;left:50%;bottom:15%;width:2px;height:60%;background:#e8ecf1;transform:translateX(-50%)}
.cell.flag::after{content:"";position:absolute;left:calc(50% + 1px);top:16%;width:calc(var(--cell)*.34);height:calc(var(--cell)*.27);
  background:var(--red);clip-path:polygon(0 0,100% 50%,0 100%);animation:flagIn .18s ease-out}
@keyframes flagIn{from{transform:translateY(-35%) scale(.5);opacity:0}}

.cell.mine::before{content:"";position:absolute;inset:9%;background:var(--mine) center/contain no-repeat}
.cell.exploded{background:radial-gradient(circle at 50% 45%,#ff8a7d,#b3261c 72%)!important;animation:boomCell .5s ease-out}
@keyframes boomCell{0%{filter:brightness(4)}100%{filter:brightness(1)}}
.cell.wrong{background:#2a1a16;box-shadow:inset 0 0 0 1px #0d120b}
.cell.wrong::after{content:"✕";font:900 calc(var(--cell)*.7)/1 var(--disp);color:var(--red);text-shadow:0 0 6px rgba(255,83,73,.6)}

.cell.cur{outline:2px solid var(--haz);outline-offset:-2px;z-index:1;box-shadow:0 0 12px rgba(255,207,63,.55)}
.cell.win{animation:winPulse .9s ease both}
@keyframes winPulse{0%{}40%{background:#33511f;box-shadow:inset 0 0 0 1px var(--green),0 0 10px rgba(143,209,79,.4)}100%{}}

.ring{position:fixed;width:14px;height:14px;margin:-7px;border-radius:50%;pointer-events:none;z-index:60;
  border:3px solid var(--red);box-shadow:0 0 26px rgba(255,83,73,.8),inset 0 0 14px rgba(255,83,73,.6);animation:ring .65s ease-out forwards}
@keyframes ring{to{transform:scale(9);opacity:0}}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(6,9,4,.8)}
.overlay.hidden{display:none}
.plate{position:relative;width:min(560px,94vw);max-height:94dvh;overflow-y:auto;background:#141c0e;border:1px solid #3a4a2b;
  box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.plate .hstrip{position:absolute;top:0;left:0;right:0;height:10px;border:none;
  background:repeating-linear-gradient(45deg,var(--haz) 0 12px,#151b10 12px 24px)}
.pbody{padding:30px 30px 26px}

.titleRow{display:flex;align-items:flex-end;gap:16px;margin-bottom:6px}
h1{font-family:var(--disp);font-size:clamp(32px,7vmin,52px);letter-spacing:.02em;color:#f2f5ea;line-height:.95;
  text-shadow:0 4px 0 #0a0e08,0 0 30px rgba(143,209,79,.25)}
h1 span{color:var(--haz);text-shadow:0 4px 0 #3a2f0a}
.mineSpin{width:clamp(40px,7vmin,56px);height:auto;align-self:center;background:var(--mine) center/contain no-repeat;animation:spin 14s linear infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.subtitle{font:600 10px/1.6 var(--mono);letter-spacing:.32em;color:var(--dim);margin-bottom:24px;text-transform:uppercase}

.secLabel{font:700 10px/1 var(--mono);letter-spacing:.3em;color:var(--haz);margin:20px 0 9px;display:flex;align-items:center;gap:8px}
.secLabel::after{content:"";flex:1;height:1px;background:#3a4a2b}
.mission{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;margin-bottom:7px;cursor:pointer;
  background:#192212;border:1px solid #33401f;border-left:4px solid transparent;color:var(--ink);transition:all .15s}
.mission:hover{border-color:#4a5c33;background:#1e2916;transform:translateX(3px)}
.mission.sel{border-left-color:var(--haz);background:#202b15;box-shadow:inset 0 0 0 1px rgba(255,207,63,.25)}
.mission .idx{font:700 11px/1 var(--mono);color:var(--dim)}
.mission .mname{font-family:var(--disp);font-size:14px;letter-spacing:.08em}
.mission .mspec{font:500 10px/1.3 var(--mono);color:var(--dim);margin-top:3px}
.mission .mbest{margin-left:auto;font:700 12px/1 var(--mono);color:var(--haz);letter-spacing:.06em}
.mission .mbest.none{color:#4a5838}

.ctrlGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 22px;font:500 11px/2.1 var(--mono);color:var(--dim)}
.k{display:inline-block;padding:1px 7px;margin-right:4px;border:1px solid #45543a;border-bottom-width:2px;background:#0f150c;
  color:var(--ink);font-size:10px;border-radius:3px;letter-spacing:.05em}

#deployBtn{display:block;margin:26px auto 0;font-family:var(--disp);font-size:17px;letter-spacing:.16em;color:#141a0e;
  background:var(--haz);border:none;padding:15px 44px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 6px 0 #b98f1c,0 12px 24px rgba(0,0,0,.45);transition:transform .1s,box-shadow .1s}
#deployBtn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b98f1c,0 16px 30px rgba(0,0,0,.5)}
#deployBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b98f1c}

/* result */
#result .plate{width:min(430px,94vw)}
.resWord{font-family:var(--disp);font-size:clamp(26px,5.4vmin,38px);letter-spacing:.04em;margin-top:4px;line-height:1}
.resWord.ok{color:var(--green);text-shadow:0 3px 0 #0a1406,0 0 26px rgba(143,209,79,.4)}
.resWord.bad{color:var(--red);text-shadow:0 3px 0 #180705,0 0 26px rgba(255,83,73,.45)}
.resSub{font:600 10px/1.7 var(--mono);letter-spacing:.22em;color:var(--dim);margin-top:9px;text-transform:uppercase}
.resStats{display:flex;align-items:baseline;gap:20px;margin:22px 0 4px;padding:14px 16px;background:#0f150c;border:1px solid #33401f}
.resStats .big{font:700 30px/1 var(--mono);color:#ff5349;text-shadow:0 0 10px rgba(255,83,73,.6);letter-spacing:.08em}
.resStats .lbl{font:600 9px/1.5 var(--mono);letter-spacing:.25em;color:var(--dim)}
.resStats .bestTxt{margin-left:auto;font:700 14px/1 var(--mono);color:var(--haz);letter-spacing:.08em}
#resNew{display:inline-block;margin-left:10px;padding:3px 8px;background:var(--haz);color:#141a0e;font:700 9px/1.6 var(--mono);letter-spacing:.2em;animation:pulseChip 1s ease infinite}
@keyframes pulseChip{50%{transform:scale(1.1);box-shadow:0 0 14px rgba(255,207,63,.7)}}
.resBtns{display:flex;gap:12px;margin-top:24px}
.resBtns button{flex:1;font-family:var(--disp);font-size:13px;letter-spacing:.14em;padding:13px;cursor:pointer;touch-action:manipulation;border:none;transition:transform .1s,box-shadow .1s}
#btnRetry{background:var(--haz);color:#141a0e;box-shadow:0 5px 0 #b98f1c}
#btnRetry:hover{transform:translateY(-2px)}
#btnRetry:active{transform:translateY(3px);box-shadow:0 1px 0 #b98f1c}
#btnMaps{background:#242f1b;color:var(--ink);border:1px solid #4a5c33;box-shadow:0 5px 0 #17200f}
#btnMaps:hover{transform:translateY(-2px)}
#btnMaps:active{transform:translateY(3px);box-shadow:0 1px 0 #17200f}

@media(max-width:640px){
  .brand b{font-size:13px}
  #posReadout{display:none}
  .led-box{min-width:84px}
  #bestTag{margin-left:0;width:100%;text-align:center}
  .pbody{padding:24px 20px 22px}
}
</style>
</head>
<body>
<div class="bg-glow"></div><div class="bg-grid"></div><div class="bg-sweep"></div>
<div class="radar"><i></i><b></b></div>

<main id="stage">
  <header id="topbar">
    <div class="brand"><span class="hstrip"></span><b>MINESWEEPER</b></div>
    <div class="tright"><span id="posReadout">GRID — —</span><span id="statusText">STANDBY</span></div>
  </header>

  <section id="console">
    <div class="led-box"><label>MINES</label><output id="mineCount">010</output></div>
    <button id="faceBtn" title="New game (R)">🙂</button>
    <div class="led-box"><label>TIME</label><output id="timeCount">000</output></div>
  </section>

  <section id="toolbar">
    <div id="tabs"></div>
    <span id="bestTag">BEST <em>— —</em></span>
    <button id="flagMode" class="tool">FLAG MODE</button>
    <button id="soundBtn" class="tool">SOUND ON</button>
  </section>

  <div id="boardWrap"><div id="board"></div></div>
</main>

<!-- START / MISSION SELECT -->
<div class="overlay" id="menu">
  <div class="plate"><span class="hstrip"></span>
    <div class="pbody">
      <div class="titleRow"><h1>MINE<span>SWEEPER</span></h1><span class="mineSpin"></span></div>
      <div class="subtitle">Bomb Disposal Field Console · MK-II</div>

      <div class="secLabel">MISSION SELECT</div>
      <div id="missionList"></div>

      <div class="secLabel">CONTROLS</div>
      <div class="ctrlGrid">
        <div>
          <span class="k">LMB / TAP</span> reveal<br>
          <span class="k">RMB / HOLD</span> flag<br>
          <span class="k">CLICK №</span> chord neighbors
        </div>
        <div>
          <span class="k">←↑↓→</span> aim&nbsp;&nbsp;<span class="k">ENTER</span> reveal<br>
          <span class="k">SPACE</span> flag&nbsp;&nbsp;<span class="k">F</span> flag mode<br>
          <span class="k">R</span> new map&nbsp;&nbsp;<span class="k">M</span> sound
        </div>
      </div>

      <button id="deployBtn">DEPLOY ▶</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="overlay hidden" id="result">
  <div class="plate"><span class="hstrip"></span>
    <div class="pbody">
      <div class="resWord" id="resWord">AREA SECURED</div>
      <div class="resSub" id="resSub"></div>
      <div class="resStats">
        <div><div class="lbl">TIME</div><div class="big" id="resTime">00:00</div></div>
        <div><div class="lbl">BEST</div><div class="bestTxt" id="resBest">— —<span id="resNew" style="display:none">NEW RECORD</span></div></div>
      </div>
      <div class="resBtns"><button id="btnRetry">RETRY ↻</button><button id="btnMaps">MAPS</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const root=document.documentElement;
const stage=$('stage'),board=$('board'),boardWrap=$('boardWrap'),face=$('faceBtn');
const mineCount=$('mineCount'),timeCount=$('timeCount'),statusText=$('statusText'),posReadout=$('posReadout');
const menuEl=$('menu'),resultEl=$('result'),bestTag=$('bestTag');

/* mine icon (inline SVG data-uri) */
const mineSvg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><g stroke='#e6ecf5' stroke-width='5.5' stroke-linecap='round'><line x1='20' y1='2.5' x2='20' y2='37.5'/><line x1='2.5' y1='20' x2='37.5' y2='20'/><line x1='8' y1='8' x2='32' y2='32'/><line x1='32' y1='8' x2='8' y2='32'/></g><circle cx='20' cy='20' r='9.5' fill='#e6ecf5'/><circle cx='16.8' cy='16.8' r='2.7' fill='#ffffff'/></svg>`;
root.style.setProperty('--mine',`url("data:image/svg+xml,${encodeURIComponent(mineSvg)}")`);

/* ---------- storage (safe) ---------- */
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

/* ---------- config / state ---------- */
const ORDER=['recruit','veteran','expert'];
const DIFFS={
  recruit:{name:'RECRUIT',cols:9,rows:9,mines:10},
  veteran:{name:'VETERAN',cols:16,rows:16,mines:40},
  expert:{name:'EXPERT',cols:16,rows:30,mines:99}
};
const FACES={play:'🙂',won:'😎',lost:'😵'};
let state='menu',diffKey=load('ms_diff')||'recruit';
if(!DIFFS[diffKey])diffKey='recruit';
let grid=[],firstClick=true,flags=0,revealed=0,startTs=0,timerId=null,finalTime=0,resultOpen=false;
let cur={r:-1,c:-1},kbOn=false,flagMode=false,longFired=false,suppressCtx=false,lpTimer=null;
let muted=load('ms_muted')==='1';

/* ---------- audio (Web Audio, post-gesture) ---------- */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function unlockAudio(){audio()}
function env(g,t,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function tone(f,d,type,vol,delay,fEnd){const ac=audio();if(!ac||muted)return;const t=ac.currentTime+(delay||0);
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(fEnd)o.frequency.exponentialRampToValueAtTime(Math.max(1,fEnd),t+d);
  env(g,t,d,vol);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function noiseBurst(d,vol,f0,f1){const ac=audio();if(!ac||muted)return;const t=ac.currentTime;
  const len=Math.max(1,(d*ac.sampleRate)|0),buf=ac.createBuffer(1,len,ac.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=buf;const fl=ac.createBiquadFilter();fl.type='lowpass';
  fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
  const g=ac.createGain();env(g,t,d,vol);s.connect(fl).connect(g).connect(ac.destination);s.start(t)}
const sfxReveal=c=>tone(640-(c||0)*38,.05,'square',.055,0,380);
const sfxFlag=()=>{tone(760,.06,'triangle',.15);tone(1140,.07,'triangle',.12,.05)};
const sfxUnflag=()=>tone(900,.06,'triangle',.12,0,520);
const sfxBoom=()=>{noiseBurst(.8,.9,900,50);tone(130,.7,'sine',.8,0,32);tone(60,.9,'triangle',.45,.02,28)};
const sfxWin=()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.22,i*.09));tone(1318,.32,'triangle',.16,.4)};
const sfxUi=()=>tone(1300,.035,'sine',.07);

/* ---------- helpers ---------- */
const pad3=n=>String(Math.max(0,Math.min(999,n))).padStart(3,'0');
const fmtMines=n=>n<0?'-'+String(Math.min(99,-n)).padStart(2,'0'):pad3(n);
const fmtTime=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const elapsed=()=>startTs?Math.min(999,Math.floor((Date.now()-startTs)/1000)):0;
function setStatus(txt,cls){statusText.textContent=txt;statusText.className=cls||''}
function setFace(f){face.textContent=f}
function updateBestTag(){const raw=load('ms_best_'+diffKey);bestTag.innerHTML='BEST <em>'+(raw?fmtTime(+raw):'— —')+'</em>'}
function renderMenuBests(){document.querySelectorAll('.mission').forEach(b=>{
  const raw=load('ms_best_'+b.dataset.k),el=b.querySelector('.mbest');
  el.textContent=raw?fmtTime(+raw):'—';el.classList.toggle('none',!raw)})}

/* ---------- board build / fit ---------- */
function fitBoard(){const d=DIFFS[diffKey];
  const w=boardWrap.clientWidth-20,h=boardWrap.clientHeight-20;
  let s=Math.floor(Math.min(w/d.cols,h/d.rows));s=Math.max(13,Math.min(44,s));
  root.style.setProperty('--cell',s+'px')}
function newGame(key){
  diffKey=key;state='play';firstClick=true;flags=0;revealed=0;startTs=0;finalTime=0;
  stopTimer();kbOn=false;cur={r:-1,c:-1};resultOpen=false;resultEl.classList.add('hidden');
  const d=DIFFS[key];board.innerHTML='';grid=[];
  board.style.gridTemplateColumns=`repeat(${d.cols},var(--cell))`;
  const frag=document.createDocumentFragment();
  for(let r=0;r<d.rows;r++){grid[r]=[];
    for(let c=0;c<d.cols;c++){const el=document.createElement('div');el.className='cell cov';
      el.dataset.r=r;el.dataset.c=c;frag.appendChild(el);grid[r][c]={mine:false,rev:false,flag:false,count:0}}}
  board.appendChild(frag);
  setFace(FACES.play);setStatus('STANDBY','');
  mineCount.textContent=pad3(d.mines);timeCount.textContent='000';
  store('ms_diff',key);updateBests();renderMenuBests();fitBoard();
}
function selectDiffUI(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('sel',t.dataset.k===diffKey));
  document.querySelectorAll('.mission').forEach(m=>m.classList.toggle('sel',m.dataset.k===diffKey))}

/* ---------- core logic ---------- */
function neighbors(r,c,cb){const d=DIFFS[diffKey];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;
    const nr=r+dr,nc=c+dc;if(nr>=0&&nr<d.rows&&nc>=0&&nc<d.cols)cb(nr,nc)}}
function placeMines(sr,sc){const d=DIFFS[diffKey],total=d.cols*d.rows,self=sr*d.cols+sc;
  const banned=new Set([self]);neighbors(sr,sc,(r,c)=>banned.add(r*d.cols+c));
  let pool=[];for(let i=0;i<total;i++)if(!banned.has(i))pool.push(i);
  if(pool.length<d.mines){pool=[];for(let i=0;i<total;i++)if(i!==self)pool.push(i)}
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
  const set=new Set(pool.slice(0,d.mines));
  for(let r=0;r<d.rows;r++)for(let c=0;c<d.cols;c++){grid[r][c].mine=set.has(r*d.cols+c);
    let n=0;neighbors(r,c,(nr,nc)=>{if(grid[nr][nc].mine)n++});grid[r][c].count=n}}
function openCell(r,c){const g=grid[r],el=board.children[r*DIFFS[diffKey].cols+c];
  g.rev=true;revealed++;el.classList.remove('cov','flag');el.classList.add('open');
  if(g.count>0){el.textContent=g.count;el.classList.add('num','n'+g.count)}sfxReveal(g.count)}
function reveal(r,c){if(state!=='play')return;const g=grid[r][c];if(g.rev||g.flag)return;
  if(firstClick){firstClick=false;placeMines(r,c);startTimer();setStatus('LIVE','st-live')}
  if(g.count===0){const st=[[r,c]];
    while(st.length){const[cr,cc]=st.pop(),gg=grid[cr][cc];if(gg.rev||gg.flag)continue;
      openCell(cr,cc);if(gg.count===0)neighbors(cr,cc,(nr,nc)=>{if(!grid[nr][nc].rev&&!grid[nr][nc].flag)st.push([nr,nc])})}}
  else openCell(r,c);
  checkWin()}
function chord(r,c){if(state!=='play')return;const g=grid[r][c];if(!g.rev||!g.count)return;
  let fl=0;const list=[];neighbors(r,c,(nr,nc)=>{const ng=grid[nr][nc];if(ng.flag)fl++;else if(!ng.rev)list.push([nr,nc])});
  if(fl===g.count)list.forEach(p=>{if(state==='play')reveal(p[0],p[1])})}
function toggleFlag(r,c){if(state!=='play')return;const g=grid[r][c];if(g.rev)return;
  g.flag=!g.flag;flags+=g.flag?1:-1;
  const el=board.children[r*DIFFS[diffKey].cols+c];el.classList.toggle('flag',g.flag);
  g.flag?sfxFlag():sfxUnflag();mineCount.textContent=fmtMines(DIFFS[diffKey].mines-flags)}
function checkWin(){if(state!=='play')return;const d=DIFFS[diffKey];
  if(revealed===d.cols*d.rows-d.mines)win()}

/* ---------- end states ---------- */
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function startTimer(){startTs=Date.now();timeCount.textContent='000';
  timerId=setInterval(()=>{timeCount.textContent=pad3(elapsed())},250)}
function ringAt(el){const r=el.getBoundingClientRect(),d=document.createElement('div');
  d.className='ring';d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),700)}
function lose(r,c){if(state!=='play')return;state='lost';stopTimer();finalTime=elapsed();
  setFace(FACES.lost);setStatus('DETONATED','st-bad');sfxBoom();
  const d=DIFFS[diffKey];
  for(let rr=0;rr<d.rows;rr++)for(let cc=0;cc<d.cols;cc++){const g=grid[rr][cc],el=board.children[rr*d.cols+cc];
    if(g.mine&&!g.flag)el.classList.add('mine');
    else if(!g.mine&&g.flag){el.classList.remove('flag');el.classList.add('wrong')}}
  const boomEl=board.children[r*d.cols+c];boomEl.classList.add('exploded');ringAt(boomEl);
  stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');
  setTimeout(()=>showResult(r,c),950)}
function win(){if(state!=='play')return;state='won';stopTimer();finalTime=elapsed();
  setFace(FACES.won);setStatus('AREA SECURED','st-ok');sfxWin();
  const d=DIFFS[diffKey];
  for(let r=0;r<d.rows;r++)for(let c=0;c<d.cols;c++){const g=grid[r][c];
    if(g.mine&&!g.flag){g.flag=true;flags++;board.children[r*d.cols+c].classList.add('flag')}}
  mineCount.textContent=fmtMines(0);
  const bk='ms_best_'+diffKey,raw=load(bk),prev=raw?parseInt(raw,10):null;
  let rec=false;if(prev===null||finalTime<prev){rec=true;store(bk,String(finalTime))}
  updateBestTag();renderMenuBests();
  const cr=(d.rows-1)/2,cc=(d.cols-1)/2;
  for(let r=0;r<d.rows;r++)for(let c=0;c<d.cols;c++){const el=board.children[r*d.cols+c];
    if(grid[r][c].rev){el.style.animationDelay=Math.min(750,Math.hypot(r-cr,c-cc)*26)+'ms';el.classList.add('win')}}
  setTimeout(()=>showResult(null,null),rec?1150:950)}
function showResult(er,ec){if(resultOpen)return;resultOpen=true;
  const d=DIFFS[diffKey],ok=state==='won';
  $('resWord').textContent=ok?'AREA SECURED':'DETONATED';
  $('resWord').className='resWord '+(ok?'ok':'bad');
  $('resSub').textContent=ok?`ALL ${d.mines} MINES NEUTRALIZED · ${d.cols}×${d.rows} GRID`
    :`MINE STRUCK · SECTOR ${String.fromCharCode(65+ec)}-${er+1}`;
  $('resTime').textContent=fmtTime(finalTime);
  const raw=load('ms_best_'+diffKey);
  $('resBest').firstChild.textContent=raw?fmtTime(+raw):'— —';
  $('resNew').style.display=(ok&&finalTime<=+raw)?'inline-block':'none';
  resultEl.classList.remove('hidden')}

/* ---------- input: board ---------- */
board.addEventListener('pointerdown',e=>{unlockAudio();
  const el=e.target.closest('.cell');if(!el||state!=='play')return;
  setFace('😮');
  if(e.pointerType==='touch'){longFired=false;const r=+el.dataset.r,c=+el.dataset.c;
    clearTimeout(lpTimer);lpTimer=setTimeout(()=>{longFired=true;suppressCtx=true;
      toggleFlag(r,c);if(navigator.vibrate)navigator.vibrate(30)},450)}});
window.addEventListener('pointerup',()=>{clearTimeout(lpTimer);
  if(state==='play')setFace(FACES.play)});
board.addEventListener('click',e=>{const el=e.target.closest('.cell');if(!el)return;
  if(longFired){longFired=false;return}
  if(state!=='play')return;
  const r=+el.dataset.r,c=+el.dataset.c;
  if(flagMode)toggleFlag(r,c);
  else{const g=grid[r][c];if(g.rev&&g.count)chord(r,c);else reveal(r,c)}});
board.addEventListener('contextmenu',e=>{e.preventDefault();
  if(suppressCtx){suppressCtx=false;return}
  const el=e.target.closest('.cell');if(!el||state!=='play')return;
  toggleFlag(+el.dataset.r,+el.dataset.c)});
board.addEventListener('pointermove',e=>{const el=e.target.closest('.cell');
  if(el)posReadout.textContent=`GRID ${String.fromCharCode(65+ +el.dataset.c)}-${String(+el.dataset.r+1).padStart(2,'0')}`;
  if(kbOn){kbOn=false;clearCur()}});
board.addEventListener('pointerleave',()=>{posReadout.textContent='GRID — —'});

/* ---------- input: HUD ---------- */
face.addEventListener('click',()=>{unlockAudio();sfxUi();
  if(state==='menu')deploy();else newGame(diffKey)});
function toggleSound(){muted=!muted;store('ms_muted',muted?'1':'0');
  $('soundBtn').textContent=muted?'SOUND OFF':'SOUND ON';
  $('soundBtn').classList.toggle('off',muted);if(!muted)sfxUi()}
$('soundBtn').addEventListener('click',()=>{unlockAudio();toggleSound()});
function toggleFlagMode(){flagMode=!flagMode;$('flagMode').classList.toggle('on',flagMode);sfxUi()}
$('flagMode').addEventListener('click',()=>{unlockAudio();toggleFlagMode()});

/* ---------- tabs / menu ---------- */
const tabsEl=$('tabs');
ORDER.forEach(k=>{const b=document.createElement('button');b.className='tab';b.dataset.k=k;
  b.textContent=DIFFS[k].name;
  b.addEventListener('click',()=>{unlockAudio();sfxUi();diffKey=k;selectDiffUI();updateBestTag();renderMenuBests();store('ms_diff',k);
    if(state!=='menu')newGame(k)});tabsEl.appendChild(b)});
const listEl=$('missionList');
ORDER.forEach((k,i)=>{const d=DIFFS[k],b=document.createElement('button');
  b.className='mission';b.dataset.k=k;
  b.innerHTML=`<span class="idx">0${i+1}</span><span><span class="mname">${d.name}</span>
    <div class="mspec">${d.cols}×${d.rows} GRID · ${d.mines} MINES</div></span>
    <span class="mbest none">—</span>`;
  b.addEventListener('click',()=>{unlockAudio();sfxUi();diffKey=k;selectDiffUI();updateBestTag();renderMenuBests()});
  listEl.appendChild(b)});
function cycleMission(dir){const i=ORDER.indexOf(diffKey);diffKey=ORDER[(i+dir+3)%3];selectDiffUI();updateBestTag();renderMenuBests()}
function showMenu(){state='menu';resultOpen=false;resultEl.classList.add('hidden');
  setFace(FACES.play);setStatus('STANDBY','');selectDiffUI();renderMenuBests();
  menuEl.classList.remove('hidden')}
function deploy(){unlockAudio();sfxUi();menuEl.classList.add('hidden');newGame(diffKey)}
$('deployBtn').addEventListener('click',deploy);
$('btnRetry').addEventListener('click',()=>{unlockAudio();sfxUi();newGame(diffKey)});
$('btnMaps').addEventListener('click',()=>{unlockAudio();sfxUi();showMenu()});

/* ---------- input: keyboard (window) ---------- */
function clearCur(){board.querySelectorAll('.cell.cur').forEach(e=>e.classList.remove('cur'))}
function renderCur(){clearCur();if(kbOn&&cur.r>=0){
  const d=DIFFS[diffKey];board.children[cur.r*d.cols+cur.c].classList.add('cur')}}
window.addEventListener('keydown',e=>{unlockAudio();const k=e.key;
  if(state==='menu'){
    if(k==='Enter'||k===' '){e.preventDefault();deploy()}
    else if(k==='1')selectDiffUI2(0);else if(k==='2')selectDiffUI2(1);else if(k==='3')selectDiffUI2(2);
    else if(k==='ArrowUp'){e.preventDefault();cycleMission(-1)}
    else if(k==='ArrowDown'){e.preventDefault();cycleMission(1)}
    return}
  if(k==='r'||k==='R'){newGame(diffKey);return}
  if(k==='m'||k==='M'){toggleSound();return}
  if(resultOpen){if(k==='Enter'){e.preventDefault();$('btnRetry').click()}return}
  if(state!=='play')return;
  if(k==='f'||k==='F'){toggleFlagMode();return}
  const d=DIFFS[diffKey];let moved=false;
  if(k==='ArrowLeft'){kbOn=true;if(cur.r<0){cur={r:0,c:0}}else cur.c=Math.max(0,cur.c-1);moved=true}
  else if(k==='ArrowRight'){kbOn=true;if(cur.r<0){cur={r:0,c:0}}else cur.c=Math.min(d.cols-1,cur.c+1);moved=true}
  else if(k==='ArrowUp'){kbOn=true;if(cur.r<0){cur={r:0,c:0}}else cur.r=Math.max(0,cur.r-1);moved=true}
  else if(k==='ArrowDown'){kbOn=true;if(cur.r<0){cur={r:0,c:0}}else cur.r=Math.min(d.rows-1,cur.r+1);moved=true}
  else if(k==='Enter'){if(cur.r>=0){const g=grid[cur.r][cur.c];g.rev&&g.count?chord(cur.r,cur.c):reveal(cur.r,cur.c)}}
  else if(k===' '){e.preventDefault();if(cur.r>=0)toggleFlag(cur.r,cur.c);return}
  else return;
  if(moved){e.preventDefault();renderCur()}});
function selectDiffUI2(i){diffKey=ORDER[i];selectDiffUI();updateBestTag();renderMenuBests()}

/* ---------- boot ---------- */
$('soundBtn').textContent=muted?'SOUND OFF':'SOUND ON';
$('soundBtn').classList.toggle('off',muted);
window.addEventListener('resize',()=>{fitBoard()});
newGame(diffKey);
showMenu();
})();
</script>
</body>
</html>
