<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silent Freight — Sokoban Stealth</title>
<style>
:root{
  --ink:#0d1319; --panel:#131b23; --line:#2d3e4c; --amber:#ffb454; --teal:#5fe3cf;
  --danger:#ff6257; --text:#cfe0e8; --dim:#7f95a3;
  --disp:Impact,'Haettenschweiler','Arial Narrow Bold',sans-serif;
  --mono:Consolas,Menlo,'SF Mono','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--mono);color:var(--text);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;display:block}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .3s}
#hud.off{opacity:0}
.hrow{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;gap:12px}
#lvlTag{display:flex;flex-direction:column;gap:5px}
#pips{display:flex;gap:5px}
.pip{width:10px;height:10px;background:#22303c;border:1px solid #34465a;transform:skewX(-14deg)}
.pip.on{background:var(--amber);border-color:#c78a3a;box-shadow:0 0 8px rgba(255,180,84,.55)}
#lvlName{font-family:var(--disp);font-size:21px;letter-spacing:2.5px;color:#f3ede0;text-transform:uppercase}
#rightWrap{display:flex;align-items:center;gap:12px}
#stateChip{font-size:11px;letter-spacing:2px;padding:5px 9px;border:1px solid #34465a;color:#5b7080;background:rgba(15,22,29,.7);min-width:96px;text-align:center}
#stateChip.hidden{color:#8fb7ff;border-color:#3d5f96}
#stateChip.warn{color:var(--amber);border-color:#8a6430}
#stateChip.spot{color:var(--danger);border-color:#8a352c;animation:blinkC .45s steps(2) infinite}
@keyframes blinkC{50%{opacity:.35}}
#suspBar{width:150px;height:9px;background:#1b232c;border:1px solid #2c3a46;overflow:hidden}
#suspFill{display:block;height:100%;width:0%;background:linear-gradient(90deg,#d9a441,var(--amber) 55%,var(--danger));transition:width .08s linear}
#suspBar.hot{box-shadow:0 0 12px rgba(255,90,70,.5)}
#muteBtn{pointer-events:auto;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:#9fb4c2;background:#18232d;border:1px solid #34465a;padding:5px 9px;cursor:pointer}
#muteBtn:hover{color:var(--amber);border-color:#8a6430}
#bm{position:absolute;left:18px;bottom:14px;font-size:12px;letter-spacing:1.5px;color:#93a7b4}
#keys{position:absolute;right:18px;bottom:14px;font-size:10px;letter-spacing:1px;color:#54687a;text-align:right}

/* ---------- toast ---------- */
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);text-align:center;z-index:4;pointer-events:none;opacity:0}
#toast.show{animation:toastLife 3.8s ease forwards}
@keyframes toastLife{0%{opacity:0;transform:translate(-50%,-8px)}10%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0}}
#toast .tt{font-family:var(--disp);font-size:27px;letter-spacing:3px;color:var(--amber);text-shadow:0 2px 14px rgba(255,180,84,.35)}
#toast .th{margin-top:6px;font-size:11px;letter-spacing:2.5px;color:#9fb4c2}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(8,12,17,.78);transition:opacity .3s,visibility .3s}
#overlay.off{opacity:0;visibility:hidden;pointer-events:none}
#panel{position:relative;width:min(660px,94vw);max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 34px 90px rgba(0,0,0,.65);padding:40px 40px 32px;overflow-x:hidden}
#panel::before{content:'';position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(-45deg,var(--amber) 0 12px,#1a1208 12px 24px);opacity:.9}
#panel::after{content:'';position:absolute;bottom:0;left:0;width:120px;height:3px;background:var(--amber)}
.title{font-family:var(--disp);font-size:clamp(44px,8.5vw,74px);line-height:.95;letter-spacing:2px;color:#eef4f1;text-transform:uppercase}
.title em{font-style:normal;color:var(--amber);text-shadow:0 0 26px rgba(255,180,84,.35)}
.blinkc{color:var(--amber);animation:bl .9s steps(2) infinite;font-size:.7em;vertical-align:middle}
@keyframes bl{50%{opacity:0}}
.sub{margin-top:10px;font-size:12px;letter-spacing:4px;color:var(--dim);text-transform:uppercase}
.divider{height:1px;background:#263341;margin:22px 0}
.note{display:flex;gap:12px;align-items:baseline;margin:9px 0;font-size:13px;line-height:1.5;color:#b7c9d4}
.note i{font-style:normal;font-size:16px;width:22px;text-align:center;flex:none}
.note b{color:#eef4f1;font-weight:400}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin-top:4px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;letter-spacing:1.5px;color:#9fb4c2}
kbd{font-family:var(--mono);font-size:10px;background:#1d2732;border:1px solid #384b5c;border-bottom-width:3px;padding:3px 7px;color:#dbe8ef;white-space:nowrap}
.btnrow{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--disp);font-size:18px;letter-spacing:2.5px;text-transform:uppercase;padding:14px 26px;border:none;cursor:pointer;background:var(--amber);color:#191007;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(255,180,84,.35)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:#b8cad4;border:1px solid #3a4c5c}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber);box-shadow:none}
.hintk{font-size:10px;letter-spacing:2px;color:#5d7284;margin-top:10px}
.bigstat{font-family:var(--disp);font-size:clamp(34px,6vw,52px);letter-spacing:2px;color:#f3ede0;margin-top:6px}
.bigstat.amber{color:var(--amber)}
.caughtT{color:var(--danger)!important;animation:caughtF .8s steps(3) infinite}
@keyframes caughtF{50%{text-shadow:0 0 24px rgba(255,98,87,.8)}}
.badge{display:inline-block;background:#17342c;border:1px solid #2e6b52;color:#6fe3ad;font-size:11px;letter-spacing:2px;padding:5px 10px;margin-top:12px}
.foot{margin-top:22px;font-size:10px;letter-spacing:2px;color:#4d6172;text-transform:uppercase}
.stats{display:flex;gap:26px;margin-top:14px;font-size:12px;letter-spacing:2px;color:#9fb4c2}
.stats b{display:block;font-family:var(--disp);font-size:22px;letter-spacing:1.5px;color:#eef4f1;margin-top:3px;font-weight:400}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="off">
  <div class="hrow">
    <div id="lvlTag"><div id="pips"></div><div id="lvlName"></div></div>
    <div id="rightWrap">
      <div id="stateChip">SAFE</div>
      <div id="suspBar"><i id="suspFill"></i></div>
      <button id="muteBtn" data-act="mute">SOUND ON</button>
    </div>
  </div>
  <div id="bm">TIME 00:00 · MOVES 0</div>
  <div id="keys">SHIFT SNEAK · Z UNDO · R RESTART · P PAUSE · M SOUND</div>
</div>

<div id="toast"></div>
<div id="overlay"><div id="panel"></div></div>
<noscript>Silent Freight needs JavaScript to run.</noscript>

<script>
'use strict';
/* ============================== DATA ============================== */
const TAU=Math.PI*2, RANGE=4.3, FOV=1.7, CROUCH_R=.55, DWELL=1.0;
const LEVELS=[
{name:'FIRST JOB',hint:'HOLD SHIFT TO SNEAK · SHADOWS HIDE YOU COMPLETELY',
 map:['##########','#........#','#..,,,,..#','#........#','#........#','#........#','##########'],
 pads:[[2,3]],boxes:[[3,3]],start:[1,3],
 guards:[{k:'s',x:6,y:1,base:Math.PI/2,sweep:.95,per:3.8},{k:'p',pts:[[2,5],[7,5]],sp:1.2}]},
{name:'DOUBLE CROSS',hint:'CRATES BLOCK VISION — USE THEM AS COVER',
 map:['############','#..........#','#.##....##.#','#..........#','#..........#','#...,,,,...#','#..........#','############'],
 pads:[[4,1],[7,1]],boxes:[[4,4],[7,4]],start:[10,6],
 guards:[{k:'p',pts:[[2,3],[9,3]],sp:1.7},{k:'s',x:6,y:6,base:-Math.PI/2,sweep:.9,per:3.4}]},
{name:'THE VAULT RUN',hint:'THREE CRATES · ONE SHADOW LANE · STAY IN THE DARK',
 map:['###########','#.........#','#,##...##.#','#.........#','#.........#','#..,,,,,..#','#.........#','#.,#....,.#','###########'],
 pads:[[4,1],[5,1],[6,1]],boxes:[[4,4],[5,4],[6,4]],start:[1,6],
 guards:[{k:'p',pts:[[2,3],[8,3]],sp:1.8},{k:'p',pts:[[9,2],[9,7]],sp:1.5},{k:'s',x:2,y:6,base:0,sweep:1.1,per:3.0}]}
];

/* ============================== AUDIO ============================== */
let ac=null,master=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('sf_mute')==='1'}catch(e){}
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=muted?0:.55;master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){}
}
function tone(o){if(!ac)return;const t0=ac.currentTime+(o.delay||0);
  const os=ac.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f,t0);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+o.dur);
  const g=ac.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(o.vol||.2,t0+.006);
  g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur);
  os.connect(g);g.connect(master);os.start(t0);os.stop(t0+o.dur+.05);}
function noise(o){if(!ac)return;const t0=ac.currentTime+(o.delay||0);
  const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=ac.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f||800;f.Q.value=o.q||1;
  const g=ac.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(o.vol||.2,t0+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t0+o.dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+o.dur+.05);}
const sfx={
 step:c=>noise({dur:.07,vol:c?.045:.1,f:c?320:620}),
 push(){tone({f:95,f2:52,type:'triangle',dur:.18,vol:.3});noise({dur:.15,vol:.11,f:260})},
 blocked(){tone({f:70,f2:48,type:'square',dur:.09,vol:.16});noise({dur:.06,vol:.07,f:160})},
 ding(){tone({f:740,dur:.13,vol:.22});tone({f:1108,dur:.2,vol:.17,delay:.09})},
 offpad(){tone({f:220,f2:150,type:'triangle',dur:.1,vol:.12})},
 tick:s=>tone({f:300+s*3.4,f2:(300+s*3.4)*1.3,dur:.07,vol:.13}),
 alarm(){tone({f:620,f2:170,type:'sawtooth',dur:.55,vol:.3});tone({f:930,f2:240,type:'sawtooth',dur:.55,vol:.18,delay:.06});noise({dur:.4,vol:.09,f:520})},
 clear(){[523,659,784,1046].forEach((f,i)=>tone({f,type:'triangle',dur:.24,vol:.2,delay:i*.09}))},
 heart:v=>tone({f:58,f2:38,dur:.13,vol:v}),
 click(){tone({f:880,dur:.05,vol:.1,type:'square'})},
 undo(){tone({f:420,f2:260,dur:.07,vol:.09})}
};
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.55;
  document.getElementById('muteBtn').textContent=muted?'MUTED':'SOUND ON';
  try{localStorage.setItem('sf_mute',muted?'1':'0')}catch(e){}}

/* ============================== STATE ============================== */
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=1,TILE=48,ox=0,oy=0;
let state='menu',levelIdx=0,lvl=null,grid=[],rows=0,cols=0,speck=[];
let player={x:0,y:0,fx:0,fy:0,tx:0,ty:0,moving:false,t:1,dur:.13,crouch:false,face:{x:0,y:-1},bump:null};
let boxes=[],guards=[],pads=[];
let suspicion=0,seenNow=false,lastSeer=null,minD=99,graceT=0,lastTick=0,hbT=0;
let moves=0,levelTime=0,totalTime=0,totalMoves=0,hist=[],buffer=null;
let particles=[],nowT=0,stateT=0,shake=0,newBest=false;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|s)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function cellAt(x,y){if(x<0||y<0||x>=cols||y>=rows)return '#';return grid[y][x]}
const isWall=(x,y)=>cellAt(x|0,y|0)==='#';
const isOnPad=(x,y)=>pads.some(p=>p[0]===x&&p[1]===y);
function boxAt(x,y){for(let i=0;i<boxes.length;i++)if(boxes[i].x===x&&boxes[i].y===y)return i;return -1}
function isSolid(x,y){const cx=Math.floor(x),cy=Math.floor(y);if(cx<0||cy<0||cx>=cols||cy>=rows)return true;if(grid[cy][cx]==='#')return true;return boxAt(cx,cy)>=0}
function getBest(){try{return parseFloat(localStorage.getItem('sf_best'))||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem('sf_best',String(v))}catch(e){}}

/* ============================== LEVEL MGMT ============================== */
function loadLevel(i){
  levelIdx=i;lvl=LEVELS[i];
  grid=lvl.map.map(r=>r.split(''));rows=grid.length;cols=grid[0].length;
  pads=lvl.pads.map(p=>({x:p[0],y:p[1]}));
  boxes=lvl.boxes.map(b=>({x:b[0],y:b[1],fx:b[0],fy:b[1],moving:false,t:1,pop:0,onP:false,wasOn:false}));
  boxes.forEach(b=>b.onP=b.wasOn=isOnPad(b.x,b.y));
  guards=lvl.guards.map((g,j)=>{
    if(g.k==='s')return{k:'s',x:g.x,y:g.y,pos:{x:g.x+.5,y:g.y+.5},base:g.base,sweep:g.sweep,per:g.per,seed:j*2.7,angle:g.base,spotT:0};
    return{k:'p',a:{x:g.pts[0][0]+.5,y:g.pts[0][1]+.5},b:{x:g.pts[1][0]+.5,y:g.pts[1][1]+.5},pos:{x:g.pts[0][0]+.5,y:g.pts[0][1]+.5},sp:g.sp,ph:'go',dwell:0,face:Math.atan2(g.pts[1][1]-g.pts[0][1],g.pts[1][0]-g.pts[0][0]),angle:0,sweep:.95,seed:j*2.7,spotT:0};
  });
  guards.forEach(g=>{if(g.k==='p')g.angle=g.face});
  player.x=player.y=0;player.fx=player.fy=lvl.start[0];player.tx=player.ty=lvl.start[0];
  player.x=lvl.start[0];player.y=lvl.start[1];player.moving=false;player.t=1;player.face={x:0,y:-1};player.bump=null;
  suspicion=0;seenNow=false;lastSeer=null;graceT=0;lastTick=0;moves=0;levelTime=0;hist=[];buffer=null;shake=0;particles=[];
  const rnd=mulberry(917+ i*631);speck=[];
  for(let n=0;n<cols*rows*.55;n++){const x=rnd()*cols,y=rnd()*rows;
    if(cellAt(Math.floor(x),Math.floor(y))!=='#')speck.push({x:x+rnd()*.4,y:y+rnd()*.4,r:.6+rnd()*1.2,a:.03+rnd()*.05,w:rnd()>.72});}
  document.getElementById('pips').innerHTML=LEVELS.map((_,j)=>`<i class="pip${j<=i?' on':''}"></i>`).join('');
  document.getElementById('lvlName').textContent=`LV ${i+1}/${LEVELS.length} · ${lvl.name}`;
  const t=document.getElementById('toast');
  t.innerHTML=`<div class="tt">${lvl.name}</div><div class="th">${lvl.hint}</div>`;
  t.classList.remove('show');void t.offsetWidth;t.classList.add('show');
  fit();
}

/* ============================== INPUT ============================== */
const KEYS={arrowup:[0,-1],w:[0,-1],s:[0,1],arrowdown:[0,1],a:[-1,0],d:[1,0],arrowleft:[-1,0],arrowright:[1,0]};
window.addEventListener('keydown',e=>{
  const k=e.key,low=k.length===1?k.toLowerCase():k;
  if(k==='Shift'){if(state==='playing')player.crouch=true;return}
  initAudio();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  if(low==='m'){toggleMute();return}
  switch(state){
    case 'menu':if(k==='Enter'||k===' ')startGame();break;
    case 'playing':
      if(low==='r'){sfx.click();loadLevel(levelIdx);state='playing';hideOverlay();}
      else if(low==='z')undo();
      else if(low==='p'||k==='Escape'){state='paused';showOverlay('paused');}
      else{const d=KEYS[low];if(d){if(!player.moving&&!boxesMoving())tryMove(d[0],d[1]);else buffer=d;}}
      break;
    case 'caught':if(k==='Enter'||k===' '||low==='r'){e.preventDefault();retry();}break;
    case 'clear':if(k==='Enter'||k===' '){e.preventDefault();nextLevel();}break;
    case 'final':if(k==='Enter'||k===' '){e.preventDefault();startGame();}break;
    case 'paused':
      if(low==='p'||k==='Escape'||k==='Enter'){e.preventDefault();state='playing';hideOverlay();}
      else if(low==='r'){sfx.click();loadLevel(levelIdx);state='playing';hideOverlay();}
      break;
  }
});
window.addEventListener('keyup',e=>{if(e.key==='Shift')player.crouch=false});
document.addEventListener('pointerdown',()=>initAudio());
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  initAudio();sfx.click();doAction(b.dataset.act);if(document.activeElement)document.activeElement.blur();});

function doAction(a){switch(a){
  case 'start':startGame();break;
  case 'next':nextLevel();break;
  case 'retry':retry();break;
  case 'resume':state='playing';hideOverlay();break;
  case 'restart':loadLevel(levelIdx);state='playing';hideOverlay();break;
  case 'menu':toMenu();break;
  case 'mute':toggleMute();break;}}
function startGame(){totalTime=0;totalMoves=0;levelIdx=0;loadLevel(0);state='playing';hideOverlay();}
function nextLevel(){if(levelIdx<LEVELS.length-1){loadLevel(levelIdx+1);state='playing';hideOverlay();}}
function retry(){loadLevel(levelIdx);state='playing';hideOverlay();}
function toMenu(){state='menu';showOverlay('menu');}

/* ============================== MECHANICS ============================== */
const boxesMoving=()=>boxes.some(b=>b.moving);
function startTween(o,x,y,dur){o.fx=o.x;o.fy=o.y;o.tx=x;o.ty=y;o.x=x;o.y=y;o.moving=true;o.t=0;o.dur=dur||.13}
function tryMove(dx,dy){
  if(state!=='playing'||player.moving||boxesMoving())return;
  player.face={x:dx,y:dy};
  const nx=player.x+dx,ny=player.y+dy;
  if(isWall(nx,ny)){sfx.blocked();player.bump={dx,dy,t:0};return}
  const bi=boxAt(nx,ny);
  if(bi>=0){
    const bx=nx+dx,by=ny+dy;
    if(isWall(bx,by)||boxAt(bx,by)>=0){sfx.blocked();player.bump={dx,dy,t:0};return}
    hist.push({px:player.x,py:player.y,bx0:nx,by0:ny,bx1:bx,by1:by});if(hist.length>64)hist.shift();
    startTween(player,nx,ny,player.crouch?.2:.13);
    const b=boxes[bi];b.wasOn=b.onP;startTween(b,bx,by,.14);
    sfx.push();moves++;
    addPuff(nx+dx*.5,ny+dy*.5);
  }else{startTween(player,nx,ny,player.crouch?.2:.13);sfx.step(player.crouch);moves++;}
}
function undo(){
  if(state!=='playing'||player.moving||boxesMoving())return;
  const h=hist.pop();if(!h)return;
  player.x=player.y=0;player.fx=h.px;player.fy=h.py;player.tx=h.px;player.ty=h.py;player.x=h.px;player.y=h.py;player.moving=false;player.t=1;
  const b=boxes.find(b=>b.x===h.bx1&&b.y===h.by1);
  if(b){b.x=b.y=0;b.fx=h.bx0;b.fy=h.by0;b.tx=h.bx0;b.ty=h.by0;b.x=h.bx0;b.y=h.by0;b.moving=false;b.t=1;}
  moves=Math.max(0,moves-1);sfx.undo();
}
function winCheck(){
  if(state!=='playing')return;
  if(boxes.every(b=>isOnPad(b.x,b.y))){state='clearing';stateT=0;sfx.clear();
    pads.forEach(p=>confettiBurst(p.x+.5,p.y+.5));totalTime+=levelTime;totalMoves+=moves;}
}

/* ============================== GUARDS & DETECTION ============================== */
function stepGuards(dt){
  for(const g of guards){
    if(g.k==='s'){g.angle=g.base+g.sweep*Math.sin(nowT*TAU/g.per+g.seed);continue}
    const dx=g.b.x-g.a.x,dy=g.b.y-g.a.y,len=Math.hypot(dx,dy);
    if(g.ph==='dwell'){g.dwell-=dt;const prog=1-g.dwell/DWELL;
      g.angle=g.face+g.sweep*Math.sin(prog*TAU);
      if(g.dwell<=0){const t=g.a;g.a=g.b;g.b=t;g.ph='go';g.face=Math.atan2(g.b.y-g.a.y,g.b.x-g.a.x);g.angle=g.face;}
    }else{
      const step=g.sp*dt,dist=Math.hypot(g.b.x-g.pos.x,g.b.y-g.pos.y);
      if(dist<=step){g.pos.x=g.b.x;g.pos.y=g.b.y;g.ph='dwell';g.dwell=DWELL;}
      else{g.pos.x+=dx/len*step;g.pos.y+=dy/len*step;}
      g.angle=g.face;
    }
    if(g.spotT>0)g.spotT-=dt;
  }
}
function visPos(o){if(!o.moving)return{x:o.x,y:o.y};const t=o.t*t*t*(3-2*t);return{x:lerp(o.fx,o.x,t),y:lerp(o.fy,o.y,t)}}
function losClear(a,b){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  for(let s=.1;s<d;s+=.12)if(isSolid(a.x+dx/d*s,a.y+dy/d*s))return false;return true}
function detect(dt){
  const pv=visPos(player),inSh=cellAt(Math.round(pv.x-.5),Math.round(pv.y-.5))===',';
  seenNow=false;lastSeer=null;minD=99;
  if(!inSh){
    for(const g of guards){
      const dx=pv.x-g.pos.x,dy=pv.y-g.pos.y,d=Math.hypot(dx,dy);
      if(d<.72){seenNow=true;lastSeer=g;minD=Math.min(minD,d);g.spotT=.3;continue}
      const eff=RANGE*(player.crouch?CROUCH_R:1);
      if(d>eff+.05)continue;
      if(Math.abs(angDiff(Math.atan2(dy,dx),g.angle))>FOV/2)continue;
      if(!losClear(g.pos,pv))continue;
      seenNow=true;lastSeer=g;minD=Math.min(minD,d);g.spotT=.3;
    }
  }
  if(seenNow){
    const t=clamp(1-minD/RANGE,0,1),rate=(16+72*t)*(player.crouch?.4:1);
    suspicion=clamp(suspicion+rate*dt,0,100);graceT=.35;
    const lvl2=Math.floor(suspicion/10);if(lvl2>lastTick){sfx.tick(lvl2);lastTick=lvl2;}
  }else{graceT-=dt;if(graceT<=0){suspicion=clamp(suspicion-30*dt,0,100);lastTick=Math.floor(suspicion/10)}}
  if(suspicion>55){hbT-=dt;if(hbT<=0){sfx.heart(.2+(suspicion-55)/45*.3);hbT=.9-suspicion/100*.28}}
  if(suspicion>=100)caught();
}
function caught(){
  if(state!=='playing')return;
  player.moving=false;player.t=1;boxes.forEach(b=>{b.moving=false;b.t=1});
  state='caught';stateT=0;suspicion=100;sfx.alarm();shake=1;
}

/* ============================== PARTICLES ============================== */
function addP(x,y,vx,vy,life,size,c,kind){particles.push({x,y,vx,vy,life,max:life,size,c,kind,rot:Math.random()*TAU})}
function addPuff(x,y){for(let i=0;i<6;i++){const a=Math.random()*TAU;
  addP(x,y,Math.cos(a)*.5,Math.sin(a)*.5-.2,.35+Math.random()*.15,.05+Math.random()*.04,'rgba(170,180,195,','puff')}}
function addSparkle(x,y){const a=Math.random()*TAU;addP(x+Math.cos(a)*.2,y+Math.sin(a)*.2,-.1,.15,.5,.06,'#ffd9a0','spark')}
function confettiBurst(x,y){const cs=['#ffb454','#5fe3cf','#e8f1ef'];
  for(let i=0;i<26;i++){const a=Math.random()*TAU,sp=1+Math.random()*2.4;
    addP(x,y,Math.cos(a)*sp,-Math.abs(Math.sin(a))*sp-1.5,1+Math.random()*.6,.07+Math.random()*.05,cs[i%3],'conf')}}
function updateParticles(dt){
  let dust=0;for(const p of particles)if(p.kind==='dust')dust++;
  if(dust<24&&Math.random()<dt*8&&state!=='paused'){
    addP(Math.random()*cols,Math.random()*rows,-.06-Math.random()*.1,-.03-Math.random()*.05,4+Math.random()*3,.02+Math.random()*.02,'rgba(200,220,235,','dust');}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];
    p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}
    if(p.kind==='conf')p.vy+=4.5*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*3;}
  const pv=visPos(player);
  if(state==='playing'&&cellAt(Math.round(pv.x-.5),Math.round(pv.y-.5))===','&&Math.random()<dt*5)addSparkle(pv.x,pv.y);
}

/* ============================== UPDATE ============================== */
function updatePlaying(dt){
  levelTime+=dt;
  if(player.moving){player.t+=dt/player.dur;
    if(player.t>=1){player.t=1;player.moving=false;
      if(buffer&&!boxesMoving()){const d=buffer;buffer=null;tryMove(d[0],d[1]);}}}
  for(const b of boxes){
    if(b.moving){b.t+=dt/.14;
      if(b.t>=1){b.t=1;b.moving=false;b.onP=isOnPad(b.x,b.y);
        if(b.onP&&!b.wasOn){sfx.ding();b.pop=.0001;}
        else if(!b.onP&&b.wasOn)sfx.offpad();
        b.wasOn=b.onP;winCheck();}}
    if(b.pop>0)b.pop=Math.min(.35,b.pop+dt);}
  stepGuards(dt);detect(dt);
  if(player.bump){player.bump.t+=dt;if(player.bump.t>.14)player.bump=null}
  shake=Math.max(0,shake-dt*2.2);
}
function updateWorldAlive(dt){stepGuards(dt);
  for(const b of boxes)if(b.moving)b.t=1;
  if(shake>0)shake=Math.max(0,shake-dt*2.2);}

/* ============================== RENDER ============================== */
function fit(){
  dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(lvl){TILE=Math.max(18,Math.floor(Math.min((W-36)/cols,(H-140)/rows)));
    ox=(W-cols*TILE)/2;oy=(H-rows*TILE)/2+14;}
}
window.addEventListener('resize',fit);
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function visOf(o){return visPos(o)}

function render(){
  ctx.fillStyle='#0d1319';ctx.fillRect(0,0,W,H);
  const amb=ctx.createRadialGradient(W/2,H*.25,0,W/2,H*.25,Math.max(W,H)*.8);
  amb.addColorStop(0,'rgba(90,120,150,.12)');amb.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=amb;ctx.fillRect(0,0,W,H);
  const shx=shake>0?(Math.random()*2-1)*shake*6:0,shy=shake>0?(Math.random()*2-1)*shake*6:0;
  ctx.save();ctx.translate(shx,shy);
  drawArena();drawFloor();drawShadows();drawPads();drawCones();
  for(const b of boxes)drawBox(b);
  for(const g of guards)drawGuard(g);
  drawPlayer();drawParticles();
  if(seenNow&&lastSeer){const pv=visPos(player),g=lastSeer;
    ctx.strokeStyle=`rgba(255,90,70,${.3+.2*Math.sin(nowT*14)})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ox+g.pos.x*TILE,oy+g.pos.y*TILE);ctx.lineTo(ox+pv.x*TILE,oy+pv.y*TILE);ctx.stroke();}
  ctx.restore();
  drawVignette();
}
function drawArena(){
  const m=TILE*.18;
  ctx.fillStyle='#0a0e13';ctx.fillRect(ox-m,oy-m,cols*TILE+m*2,rows*TILE+m*2);
  ctx.strokeStyle='#243140';ctx.lineWidth=2;ctx.strokeRect(ox-m+5,oy-m+5,cols*TILE+m*2-10,rows*TILE+m*2-10);
}
function drawFloor(){
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(grid[y][x]==='#')continue;
    ctx.fillStyle=(x+y)%2?'#2b3742':'#2e3a46';
    ctx.fillRect(ox+x*TILE,oy+y*TILE,TILE+1,TILE+1);
  }
  ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=1;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){if(grid[y][x]==='#')continue;
    ctx.strokeRect(ox+x*TILE+.5,oy+y*TILE+.5,TILE-1,TILE-1);}
  for(const s of speck){ctx.fillStyle=s.w?`rgba(255,255,255,${s.a})`:`rgba(0,0,0,${s.a*1.6})`;
    ctx.fillRect(ox+s.x*TILE,oy+s.y*TILE,s.r*(TILE/48),s.r*(TILE/48));}
}
function drawShadows(){
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(grid[y][x]!==',')continue;
    const px=ox+x*TILE,py=oy+y*TILE,a=.58+.06*Math.sin(nowT*1.4+x*1.7+y*2.3);
    ctx.fillStyle=`rgba(13,17,40,${a})`;rr(px+2,py+2,TILE-4,TILE-4,7);ctx.fill();
    const h=(x*73+y*151)%97;
    for(let i=0;i<2;i++){
      const sx=px+TILE*(.25+.5*((h*i*37+i*53)%89)/89),sy=py+TILE*(.25+.5*((h*i*17+i*29)%67)/67);
      ctx.fillStyle=`rgba(190,205,255,${.22+.22*Math.sin(nowT*2.4+h+i*2)})`;
      ctx.fillRect(sx,sy,1.6,1.6);}
  }
}
function drawPads(){
  pads.forEach((p,i)=>{
    const cx=ox+(p.x+.5)*TILE,cy=oy+(p.y+.5)*TILE;
    const occ=isOnPad(p.x,p.y)&&boxes.some(b=>b.x===p.x&&b.y===p.y);
    const pl=1+.08*Math.sin(nowT*2.6+i*1.7),d=TILE*.24*pl;
    const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,TILE*.85);
    gl.addColorStop(0,occ?`rgba(255,190,90,${.3+.12*Math.sin(nowT*4)})`:'rgba(255,170,60,.13)');
    gl.addColorStop(1,'rgba(255,170,60,0)');
    ctx.fillStyle=gl;ctx.fillRect(cx-TILE,cy-TILE,TILE*2,TILE*2);
    ctx.beginPath();ctx.moveTo(cx,cy-d);ctx.lineTo(cx+d,cy);ctx.lineTo(cx,cy+d);ctx.lineTo(cx-d,cy);ctx.closePath();
    ctx.fillStyle=occ?'rgba(255,190,100,.5)':'rgba(255,180,84,.12)';ctx.fill();
    ctx.strokeStyle='#ffb454';ctx.lineWidth=occ?3:2;ctx.stroke();
    ctx.fillStyle='rgba(255,217,160,.9)';ctx.beginPath();ctx.arc(cx,cy,TILE*.05,0,TAU);ctx.fill();
  });
}
function conePoly(g){
  const pts=[],N=30;
  for(let i=0;i<=N;i++){
    const a=g.angle-FOV/2+FOV*i/N,ca=Math.cos(a),sa=Math.sin(a);let t=RANGE;
    for(let s=.1;s<=RANGE;s+=.1){if(isSolid(g.pos.x+ca*s,g.pos.y+sa*s)){t=Math.max(.05,s-.08);break}}
    pts.push([g.pos.x+ca*t,g.pos.y+sa*t]);
  }return pts;
}
function drawCones(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const g of guards){
    const gx=ox+g.pos.x*TILE,gy=oy+g.pos.y*TILE;
    const fl=.85+.15*Math.sin(nowT*9+g.seed*7);
    const grd=ctx.createRadialGradient(gx,gy,0,gx,gy,RANGE*TILE);
    if(g.spotT>0){grd.addColorStop(0,`rgba(255,96,74,${.3*fl})`);grd.addColorStop(.55,'rgba(255,80,60,.14)');grd.addColorStop(1,'rgba(255,80,60,0)');}
    else{grd.addColorStop(0,`rgba(255,193,120,${.26*fl})`);grd.addColorStop(.55,'rgba(255,190,110,.13)');grd.addColorStop(1,'rgba(255,190,110,0)');}
    ctx.fillStyle=grd;ctx.beginPath();ctx.moveTo(gx,gy);
    for(const p of conePoly(g))ctx.lineTo(ox+p[0]*TILE,oy+p[1]*TILE);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawBox(b){
  const pv=visPos(b),on=isOnPad(b.x,b.y);
  const pop=b.pop>0?Math.sin((b.pop/.35)*Math.PI)*.16:0;
  const cx=ox+pv.x*TILE,cy=oy+pv.y*TILE,sz=TILE*.76*(1+pop);
  if(on){const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,TILE*.95);
    gl.addColorStop(0,'rgba(255,180,84,.3)');gl.addColorStop(1,'rgba(255,180,84,0)');
    ctx.fillStyle=gl;ctx.fillRect(cx-TILE,cy-TILE,TILE*2,TILE*2);}
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(cx,cy+sz*.5,sz*.55,sz*.18,0,0,TAU);ctx.fill();
  ctx.fillStyle=on?'#e9b366':'#c9924f';ctx.strokeStyle=on?'#a06a24':'#7a5426';ctx.lineWidth=2;
  const h=sz/2;ctx.fillRect(cx-h,cy-h,sz,sz);ctx.strokeRect(cx-h,cy-h,sz,sz);
  ctx.strokeStyle='rgba(90,60,25,.4)';ctx.lineWidth=TILE*.07;
  ctx.beginPath();ctx.moveTo(cx-h*.72,cy-h*.72);ctx.lineTo(cx+h*.72,cy+h*.72);
  ctx.moveTo(cx+h*.72,cy-h*.72);ctx.lineTo(cx-h*.72,cy+h*.72);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.strokeRect(cx-h+3,cy-h+3,sz-6,sz-6);
  ctx.fillStyle='#6b4a1f';
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(q=>{ctx.beginPath();ctx.arc(cx+q[0]*h*.72,cy+q[1]*h*.72,TILE*.03,0,TAU);ctx.fill();});
  if(b.pop>0){const pr=(b.pop/.35);ctx.strokeStyle=`rgba(255,190,100,${1-pr})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,TILE*(.4+pr*.7),0,TAU);ctx.stroke();}
}
function drawGuard(g){
  const cx=ox+g.pos.x*TILE,cy=oy+g.pos.y*TILE;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,cy+TILE*.28,TILE*.34,TILE*.14,0,0,TAU);ctx.fill();
  ctx.fillStyle='#2a3540';ctx.strokeStyle='#17202a';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,TILE*.3,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#b0512f';ctx.beginPath();ctx.arc(cx,cy,TILE*.24,0,TAU);ctx.fill();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(g.angle);
  const hot=g.spotT>0;
  ctx.fillStyle=hot?'#ff8a76':'#3c4a57';ctx.strokeStyle='#141b22';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(TILE*.05,0,TILE*.15,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle=hot?`rgba(255,90,70,${.8+.2*Math.sin(nowT*16)})`:'rgba(223,232,238,.85)';
  ctx.fillRect(TILE*.08,-TILE*.07,TILE*.12,TILE*.14);
  ctx.fillStyle='#ffe9b0';ctx.beginPath();ctx.arc(TILE*.22,0,TILE*.04,0,TAU);ctx.fill();
  ctx.restore();
  if(hot){const bob=Math.sin(nowT*10)*.03*TILE;
    ctx.font=`700 ${TILE*.55}px Impact,'Arial Narrow',sans-serif`;ctx.textAlign='center';
    ctx.fillStyle=`rgba(255,98,87,${clamp(g.spotT*4,0,1)})`;
    ctx.fillText('!',cx,cy-TILE*.5-bob);}
}
function drawPlayer(){
  const pv=visPos(player),cf=player.crouch?.8:1;
  let bx=0,by=0;
  if(player.bump){const k=Math.sin(player.bump.t/.14*Math.PI)*.09;bx+=player.bump.dx*k*TILE;by+=player.bump.dy*k*TILE;}
  const hop=player.moving?-Math.sin(Math.PI*clamp(player.t,0,1))*.07:0;
  const cx=ox+pv.x*TILE+bx,cy=oy+pv.y*TILE+by-hop*TILE,r=TILE*.29*cf;
  const inSh=cellAt(Math.round(pv.x-.5),Math.round(pv.y-.5))===',';
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,cy+TILE*.3,TILE*.3*(1-hop),TILE*.12,0,0,TAU);ctx.fill();
  ctx.save();if(inSh)ctx.globalAlpha=.6;
  const fa=Math.atan2(player.face.y,player.face.x);
  ctx.strokeStyle='#ffb454';ctx.lineWidth=TILE*.09;
  ctx.beginPath();ctx.arc(cx,cy,r*.98,fa+Math.PI-.7,fa+Math.PI+.7);ctx.stroke();
  ctx.fillStyle='#5cd6c0';ctx.strokeStyle='#1d7a6b';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();ctx.stroke();
  ctx.fillStyle='#37907f';ctx.beginPath();ctx.arc(cx,cy-r*.15,r*.8,Math.PI,TAU);ctx.closePath();ctx.fill();
  const fdx=player.face.x,fdy=player.face.y,ppx=-fdy,ppy=fdx;
  const blink=(nowT)%3.4<.12;
  ctx.fillStyle='#f4fbff';
  for(const s of[1,-1]){
    const ex=cx+(fdx*.1+ppx*.08*s)*TILE,ey=cy+(fdy*.1+ppy*.08*s)*TILE;
    if(blink){ctx.fillRect(ex-2,ey-1,4,1.5);}else{ctx.beginPath();ctx.arc(ex,ey,TILE*.045,0,TAU);ctx.fill();}}
  ctx.restore();
  if(seenNow){ctx.strokeStyle=`rgba(255,90,70,${.5+.3*Math.sin(nowT*16)})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,r+.1+Math.sin(nowT*16)*1.5,0,TAU);ctx.stroke();}
}
function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1),px=ox+p.x*TILE,py=oy+p.y*TILE;
    if(p.kind==='dust'){ctx.fillStyle=p.c+(a*.5)+')';ctx.beginPath();ctx.arc(px,py,p.size*TILE,0,TAU);ctx.fill();}
    else if(p.kind==='puff'){ctx.fillStyle=p.c+(a*.4)+')';ctx.beginPath();ctx.arc(px,py,p.size*TILE*(2-a),0,TAU);ctx.fill();}
    else if(p.kind==='spark'){ctx.strokeStyle=a;? 0:0; ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#ffd9a0';ctx.lineWidth=1.4;
      const s=p.size*TILE*1.6;ctx.beginPath();ctx.moveTo(px-s,py);ctx.lineTo(px+s,py);ctx.moveTo(px,py-s);ctx.lineTo(px,py+s);ctx.stroke();ctx.restore();}
    else if(p.kind==='conf'){ctx.save();ctx.translate(px,py);ctx.rotate(p.rot);ctx.globalAlpha=a;
      ctx.fillStyle=p.c;ctx.fillRect(-p.size*TILE,-p.size*TILE*.5,p.size*TILE*2,p.size*TILE);ctx.restore();}
  }
}
function drawVignette(){
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.34,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(suspicion>2&&(state==='playing'||state==='caught')){
    const a=.4*suspicion/100*(.75+.25*Math.sin(nowT*7));
    const rg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
    rg.addColorStop(0,'rgba(255,60,50,0)');rg.addColorStop(1,`rgba(255,60,50,${a})`);
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);}
}

 <div class="divider"></div>
 <div class="cgrid">
  <div class="crow"><span>MOVE / PUSH</span><span><kbd>W A S D</kbd> <kbd>↑←↓→</kbd></span></div>
  <div class="crow"><span>SNEAK</span><span><kbd>SHIFT hold</kbd></span></div>
  <div class="crow"><span>UNDO STEP</span><span><kbd>Z</kbd></span></div>
  <div class="crow"><span>RESTART LEVEL</span><span><kbd>R</kbd></span></div>
  <div class="crow"><span>PAUSE</span><span><kbd>P</kbd> / <kbd>ESC</kbd></span></div>
  <div class="crow"><span>SOUND</span><span><kbd>M</kbd></span></div>
 </div>
 <div class="btnrow"><button class="btn" data-act="start">Begin the Job</button></div>
 <div class="hintk">ENTER TO START · KEYBOARD REQUIRED</div>
 <div class="foot">3 levels · best clear: ${b?fmt(b):'— —'} · all sound synthesized live</div>`},
caught(){return `
 <div class="title caughtT">SPOTTED!</div>
 <div class="sub">The night shift dragged you out before dawn</div><div class="divider"></div>
 <div class="stats"><span>LEVEL TIME<b>${fmt(levelTime)}</b></span><span>MOVES<b>${moves}</b></span><span>CRATES DELIVERED<b>${boxes.filter(b=>isOnPad(b.x,b.y)).length}/${boxes.length}</b></span></div>
 <div class="btnrow"><button class="btn" data-act="retry">Try Again</button><button class="btn ghost" data-act="menu">Menu</button></div>
 <div class="hintk">ENTER OR R TO RETRY</div>`},
clear(){return `
 <div class="title amber" style="color:var(--amber)">CARGO DELIVERED</div>
 <div class="sub">Level ${levelIdx+1} — ${lvl.name}</div><div class="divider"></div>
 <div class="stats"><span>LEVEL TIME<b>${fmt(levelTime)}</b></span><span>MOVES<b>${moves}</b></span><span>SUSPICION AT FINISH<b>${Math.round(suspicion)}%</b></span></div>
 <div class="btnrow"><button class="btn" data-act="next">Next Level</button></div>
 <div class="hintk">ENTER TO CONTINUE</div>`},
final(){return `
 <div class="title">HEIST <em>COMPLETE</em></div>
 <div class="sub">Every crate on the dock. No one saw a thing.</div><div class="divider"></div>
 <div class="bigstat amber">${fmt(totalTime)}</div>
 <div class="stats"><span>TOTAL MOVES<b>${totalMoves}</b></span><span>LEVELS<b>${LEVELS.length}</b></span></div>
 ${newBest?'<div class="badge">★ NEW BEST TIME ★</div>':''}
 <div class="btnrow"><button class="btn" data-act="start">Run It Back</button><button class="btn ghost" data-act="menu">Menu</button></div>
 <div class="hintk">ENTER TO PLAY AGAIN</div>`},
paused(){return `
 <div class="title">PAUSED</div>
 <div class="sub">The warehouse waits. The guards do not.</div><div class="divider"></div>
 <div class="btnrow"><button class="btn" data-act="resume">Resume</button><button class="btn ghost" data-act="restart">Restart Level</button><button class="btn ghost" data-act="menu">Menu</button></div>
 <div class="hintk">P OR ESC TO RESUME</div>`}
};
function showOverlay(t){panel.innerHTML=tpl[t]();overlayEl.classList.remove('off');syncHud()}
function hideOverlay(){overlayEl.classList.add('off');syncHud()}

/* ============================== LOOP & BOOT ============================== */
let last=performance.now(),caughtShown=false;
function loop(ts){
  requestAnimationFrame(loop);
  let dt=(ts-last)/1000;last=ts;dt=Math.min(dt,.05);nowT+=dt;
  switch(state){
    case 'playing':updatePlaying(dt);break;
    case 'clearing':stateT+=dt;updateWorldAlive(dt);
      if(stateT>1.15){
        if(levelIdx===LEVELS.length-1){const b=getBest();newBest=(!b||totalTime<b);if(newBest)setBest(totalTime);state='final';showOverlay('final');}
        else{state='clear';showOverlay('clear');}}
      break;
    case 'caught':stateT+=dt;updateWorldAlive(dt);
      if(stateT>1&&!caughtShown){caughtShown=true;showOverlay('caught');}break;
    case 'menu':updateWorldAlive(dt);break;
    case 'clear':case 'final':updateWorldAlive(dt);break;
  }
  if(state!=='paused')updateParticles(dt);
  render();hudUpdate();
}
loadLevel(0);state='menu';showOverlay('menu');syncHud();
document.getElementById('muteBtn').textContent=muted?'MUTED':'SOUND ON';
fit();requestAnimationFrame(loop);
</script>
</body>
</html>
