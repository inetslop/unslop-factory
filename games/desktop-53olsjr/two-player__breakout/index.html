<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Duel — Two-Player Breakout</title>
<style>
  :root{
    --c1:#45e3ff; --c2:#ff5c8a;
    --disp:Impact,Haettenschweiler,"Franklin Gothic Bold","Arial Black",sans-serif;
    --mono:"Consolas","SF Mono",Menlo,"Liberation Mono",monospace;
    --body:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:
      radial-gradient(900px 520px at 10% -8%, rgba(69,227,255,.13), transparent 62%),
      radial-gradient(900px 520px at 90% 108%, rgba(255,92,138,.13), transparent 62%),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 16px),
      #0a0f1e;
    font-family:var(--body); color:#dfe9ff;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.07) 3px 4px);}
  #stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{border-radius:10px;cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,.07), 0 34px 90px rgba(0,0,0,.65), 0 0 110px rgba(80,190,255,.07);}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:rgba(5,9,18,.62);backdrop-filter:blur(3px);transition:opacity .28s ease;}
  .overlay.hidden{opacity:0;pointer-events:none}
  .cab{width:min(660px,94vw);max-height:94vh;overflow:hidden;padding:26px 34px 22px;border-radius:16px;
    background:linear-gradient(180deg, rgba(17,25,48,.94), rgba(9,14,28,.94));
    border:1px solid rgba(255,255,255,.11);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.6);
    transition:opacity .3s ease, transform .3s cubic-bezier(.2,1.3,.4,1);}
  .overlay.hidden .cab{opacity:0;transform:translateY(16px) scale(.96)}
  .brand-row{display:flex;gap:14px;justify-content:center;align-items:baseline}
  .title{font-family:var(--disp);font-size:clamp(38px,7vw,58px);letter-spacing:.03em;line-height:1;transform:skewX(-5deg)}
  .t1{color:var(--c1);text-shadow:0 0 22px rgba(69,227,255,.55), 3px 3px 0 rgba(69,227,255,.18)}
  .t2{color:var(--c2);text-shadow:0 0 22px rgba(255,92,138,.55), 3px 3px 0 rgba(255,92,138,.18)}
  .brickline{display:flex;justify-content:center;gap:5px;margin:12px 0 6px}
  .brickline i{width:30px;height:9px;border-radius:2px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .tag{text-align:center;font-size:14px;color:#9fb0d6;margin:8px 0 18px;letter-spacing:.02em}
  .cols{display:grid;grid-template-columns:1fr auto 1fr;gap:10px 16px;align-items:center}
  .ctl h3{font-family:var(--disp);font-size:19px;letter-spacing:.14em;margin:0 0 4px}
  .c1 h3{color:var(--c1)} .c2 h3{color:var(--c2)}
  .ctl .bar{height:3px;width:52px;border-radius:2px;margin-bottom:10px}
  .c1 .bar{background:linear-gradient(90deg,var(--c1),transparent)}
  .c2 .bar{background:linear-gradient(270deg,var(--c2),transparent)}
  .ctl ul{list-style:none;margin:0;padding:0}
  .ctl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;
    font-family:var(--mono);font-size:12.5px;color:#aebbd8;border-bottom:1px dashed rgba(255,255,255,.07)}
  .keys{display:flex;gap:4px}
  kbd{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:#151f38;color:#e6eeff;
    border:1px solid rgba(255,255,255,.24);border-bottom:3px solid rgba(255,255,255,.12);box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .vs{font-family:var(--disp);font-size:24px;color:#fff;opacity:.85;width:46px;height:46px;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;letter-spacing:.05em}
  .foot{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:20px}
  .hint{font-family:var(--mono);font-size:11.5px;color:#7e8fb8;letter-spacing:.14em}
  .blink{animation:blink 1.3s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .btn{font-family:var(--disp);letter-spacing:.12em;font-size:19px;padding:13px 30px;border-radius:12px;border:none;cursor:pointer;
    transition:transform .12s, box-shadow .12s, filter .12s, border-color .12s}
  .primary{background:linear-gradient(180deg,#67ecff,#22b9de);color:#052430;box-shadow:0 5px 0 #0e7f9a, 0 14px 30px rgba(69,227,255,.3)}
  .primary:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 7px 0 #0e7f9a, 0 18px 36px rgba(69,227,255,.42)}
  .primary:active{transform:translateY(2px);box-shadow:0 2px 0 #0e7f9a, 0 8px 18px rgba(69,227,255,.3)}
  .ghost{background:transparent;color:#cfe0ff;border:1px solid rgba(255,255,255,.3);box-shadow:none}
  .ghost:hover{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.06)}
  .btnrow{display:flex;gap:12px;justify-content:center;margin-top:8px}
  .k{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:7px;letter-spacing:0}
  .stats{font-family:var(--mono);font-size:11px;color:#6f7fa6;letter-spacing:.05em;text-align:center;margin:14px 0 0}
  /* win screen */
  #winTitle{font-family:var(--disp);font-size:clamp(34px,6vw,52px);letter-spacing:.05em;text-align:center;margin:0;line-height:1.05}
  .ko-tag{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.5em;color:#ff5b5b;margin-bottom:8px}
  .ws{display:grid;grid-template-columns:1fr 1.15fr 1.15fr;gap:4px 16px;font-family:var(--mono);font-size:15px;color:#dfe9ff;margin:20px auto 4px;max-width:420px}
  .ws .h{font-family:var(--disp);letter-spacing:.12em;font-size:15px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.16)}
  .ws .lbl{font-size:11px;letter-spacing:.14em;color:#8fa0c4;padding-top:9px}
  .ws .val{text-align:right;padding-top:7px}
  .ws .h.c1{color:var(--c1)} .ws .h.c2{color:var(--c2)}
  .ws .star{color:#ffd166;font-size:11px;margin-left:6px}
  @media (max-height:560px){ .cab{padding:16px 26px} .tag{margin:4px 0 10px} .foot{margin-top:12px} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <!-- START SCREEN -->
  <div class="overlay" id="menu">
    <div class="cab">
      <div class="brand-row"><span class="title t1">BRICK</span><span class="title t2">DUEL</span></div>
      <div class="brickline" id="bline"></div>
      <p class="tag">Two paddles. Two walls of brick. Last one standing wins.</p>
      <div class="cols">
        <section class="ctl c1">
          <h3>PLAYER 1</h3><div class="bar"></div>
          <ul>
            <li><span class="keys"><kbd>A</kbd><kbd>D</kbd></span><span>move paddle</span></li>
            <li><span class="keys"><kbd>W</kbd><kbd>SPACE</kbd></span><span>launch ball</span></li>
          </ul>
        </section>
        <div class="vs">VS</div>
        <section class="ctl c2">
          <h3>PLAYER 2</h3><div class="bar"></div>
          <ul>
            <li><span class="keys"><kbd>&larr;</kbd><kbd>&rarr;</kbd></span><span>move paddle</span></li>
            <li><span class="keys"><kbd>&uarr;</kbd><kbd>ENTER</kbd></span><span>launch ball</span></li>
          </ul>
        </section>
      </div>
      <div class="foot">
        <button id="btnStart" class="btn primary">START MATCH</button>
        <span class="hint blink">— OR PRESS ANY KEY —</span>
      </div>
      <p class="stats" id="menuStats"></p>
    </div>
  </div>

  <!-- PAUSE -->
  <div class="overlay hidden" id="pauseScr">
    <div class="cab" style="text-align:center">
      <h2 style="font-family:var(--disp);letter-spacing:.2em;font-size:40px;margin:8px 0 14px">PAUSED</h2>
      <p class="hint"><kbd>P</kbd> RESUME &nbsp;·&nbsp; <kbd>R</kbd> RESTART &nbsp;·&nbsp; <kbd>M</kbd> SOUND</p>
    </div>
  </div>

  <!-- WIN -->
  <div class="overlay hidden" id="winScr">
    <div class="cab">
      <div class="ko-tag">MATCH OVER</div>
      <h2 id="winTitle">PLAYER 1 WINS</h2>
      <div class="ws" id="winTable"></div>
      <div class="btnrow">
        <button id="btnRematch" class="btn primary">REMATCH<span class="k">R</span></button>
        <button id="btnMenu" class="btn ghost">MENU<span class="k">ESC</span></button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const W=1024, H=640, HALF=W/2, TOP=78, WALL=8;
const PADDLE_Y=H-46, PADDLE_H=14, BASE_W=92, ROWS=6, COLS=8;
const BALL_R=7, MAX_SPEED=640;
const DISP='Impact,Haettenschweiler,"Franklin Gothic Bold","Arial Black",sans-serif';
const MONO='"Consolas","SF Mono",Menlo,monospace';
const BRICK_COLORS=['#ffd94d','#ffb14a','#ff7d4f','#ff5263','#d94f8e','#9b5cff'];
const P_COLORS=['#45e3ff','#ff5c8a'];
const POWER={W:{col:'#7cf7c4',label:'WIDE!'}, M:{col:'#ffd166',label:'MULTI-BALL!'}, D:{col:'#c99bff',label:'DOUBLE POINTS!'}};

/* ---------- dom ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const menuEl=document.getElementById('menu'), pauseEl=document.getElementById('pauseScr'), winEl=document.getElementById('winScr');
const winTitle=document.getElementById('winTitle'), winTable=document.getElementById('winTable'), menuStats=document.getElementById('menuStats');
const bline=document.getElementById('bline');
BRICK_COLORS.concat(BRICK_COLORS).forEach((c,i)=>{const el=document.createElement('i');el.style.background=c;el.style.animationDelay=(i*0.12)+'s';bline.appendChild(el);});

/* ---------- audio (created only after first input) ---------- */
let AC=null, master=null, noiseBuf=null, muted=false;
function audio(){
  if(!AC){ try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.18; master.connect(AC.destination);
    const len=AC.sampleRate*0.5|0; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f,d,type,v,slide,delay){
  if(!AC||muted)return; type=type||'square'; v=v==null?0.5:v; delay=delay||0;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.03);
}
function noise(d,v,fq,delay){
  if(!AC||muted)return; delay=delay||0;
  const t=AC.currentTime+delay, s=AC.createBufferSource(), g=AC.createGain(), f=AC.createBiquadFilter();
  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=fq||900; f.Q.value=1;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+d+0.03);
}
const sfx={
  paddle:r=>tone(160+Math.abs(r)*95,0.07,'square',0.5),
  wall:()=>tone(120,0.045,'triangle',0.32),
  brick:row=>{tone(420+(ROWS-row)*48,0.08,'square',0.42); noise(0.06,0.22,1900);},
  power:()=>{tone(587,0.08,'square',0.38); tone(880,0.13,'square',0.38,null,0.08);},
  level:()=>{tone(784,0.1,'square',0.4); tone(1175,0.16,'square',0.4,null,0.1);},
  life:()=>{tone(210,0.4,'sawtooth',0.55,60); noise(0.3,0.35,420);},
  ko:()=>{noise(0.5,0.55,300); tone(95,0.55,'sawtooth',0.6,38);},
  launch:()=>tone(290,0.12,'sine',0.45,640),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.18,'square',0.38,null,i*0.12)),
  draw:()=>tone(330,0.35,'triangle',0.4,170),
  ui:()=>tone(700,0.05,'square',0.28)
};

/* ---------- stats (localStorage, guarded) ---------- */
const SKEY='brickDuel.v1';
function loadStats(){ try{ const s=JSON.parse(localStorage.getItem(SKEY)); if(s&&s.p1&&s.p2)return s; }catch(e){} return {p1:{w:0,l:0,best:0},p2:{w:0,l:0,best:0}}; }
let stats=loadStats();
function saveStats(){ try{ localStorage.setItem(SKEY,JSON.stringify(stats)); }catch(e){} }
function updateStatsLine(){
  const a=stats.p1,b=stats.p2,total=a.w+a.l+b.w+b.l;
  menuStats.textContent = total ? ('CAREER · P1 '+a.w+'W–'+a.l+'L (best '+a.best+')   ·   P2 '+b.w+'W–'+b.l+'L (best '+b.best+')') : 'FIRST MATCH — NO RECORDS YET';
}

/* ---------- state ---------- */
let state='menu', tGlobal=0, shake={m:0};
let particles=[], popups=[];
const amb=[]; for(let i=0;i<34;i++) amb.push({x:Math.random()*W,y:TOP+Math.random()*(H-TOP),r:1+Math.random()*1.6,s:6+Math.random()*14,ph:Math.random()*6.28});
let koTimer=0, koLoser=null, koWinner=null;

function makePlayer(s){
  return {s, x:s*HALF+HALF/2, w:BASE_W, color:P_COLORS[s], score:0, lives:3, level:1,
          bricks:[], balls:[], drops:[], wideT:0, doubleT:0, dead:false, broken:0, flash:0};
}
function patternKeep(pat,r,c){
  switch(pat){
    case 1: return (r+c)%2===0;
    case 2: { const count=Math.round(2 + r*((COLS-2)/(ROWS-1))), c0=Math.floor((COLS-count)/2); return c>=c0 && c<c0+count; }
    case 3: return !(r<=1 && c>=2 && c<=5);
    case 4: return ((Math.floor(c/2))+r)%2===0;
    default: return true;
  }
}
function buildBricks(p){
  p.bricks=[]; const m=26, topY=TOP+30, bh=20, gap=7;
  const bw=(HALF-2*m-(COLS-1)*gap)/COLS, pat=(p.level-1)%5;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!patternKeep(pat,r,c))continue;
    p.bricks.push({x:p.s*HALF+m+c*(bw+gap), y:topY+r*(bh+gap), w:bw, h:bh, row:r, alive:true, pts:(ROWS-r)*10, col:BRICK_COLORS[r]});
  }
}
function spawnStuck(p){ p.balls=[{x:p.x,y:PADDLE_Y-PADDLE_H/2-BALL_R-1,vx:0,vy:0,stuck:true,trail:[]}]; }
const startSpeed=l=>Math.min(470,330+(l-1)*22);
function launchAll(p){
  let did=false;
  for(const b of p.balls) if(b.stuck){
    const a=-Math.PI/2+(Math.random()*0.9-0.45), sp=startSpeed(p.level);
    b.vx=Math.cos(a)*sp; b.vy=Math.sin(a)*sp; b.stuck=false; did=true;
  }
  if(did) sfx.launch();
}

/* ---------- fx helpers ---------- */
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=(0.3+Math.random())*spd;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.4+Math.random()*0.45,max:0.85,size:2+Math.random()*3.5,color,g:400}); }
  if(particles.length>340) particles.splice(0,particles.length-340);
}
function popup(x,y,txt,color,size){ popups.push({x,y,txt,color,size:size||14,life:0.9,max:0.9}); if(popups.length>40)popups.shift(); }

/* ---------- match flow ---------- */
function show(el,on){ el.classList.toggle('hidden',!on); }
function demoPlayers(){ const ps=[makePlayer(0),makePlayer(1)]; buildBricks(ps[0]); buildBricks(ps[1]); return ps; }
let players=demoPlayers();

function startMatch(){
  players=[makePlayer(0),makePlayer(1)]; buildBricks(players[0]); buildBricks(players[1]);
  spawnStuck(players[0]); spawnStuck(players[1]);
  particles=[]; popups=[]; shake.m=0; koWinner=null; koLoser=null;
  show(menuEl,false); show(pauseEl,false); show(winEl,false);
  state='playing'; sfx.ui(); tone(523,0.08,'square',0.35); tone(784,0.1,'square',0.35,null,0.09);
}
function toMenu(){ players=demoPlayers(); particles=[]; popups=[]; show(menuEl,true); show(pauseEl,false); show(winEl,false); state='menu'; updateStatsLine(); sfx.ui(); }
function pauseGame(){ if(state!=='playing')return; state='paused'; show(pauseEl,true); sfx.ui(); }
function resumeGame(){ if(state!=='paused')return; state='playing'; show(pauseEl,false); sfx.ui(); }

function loseLife(p){
  p.lives--; p.flash=1; shake.m=9; sfx.life();
  burst(p.x,PADDLE_Y,'#ff5b5b',22,300); burst(p.x,PADDLE_Y,'#ffffff',8,340);
  if(p.lives<=0){ p.dead=true; doKO(p); } else spawnStuck(p);
}
function doKO(loser){
  state='ko'; koTimer=1.6; koLoser=loser; koWinner=players[1-loser.s];
  loser.balls=[]; loser.drops=[];
  for(const bk of loser.bricks) if(bk.alive){ bk.alive=false; burst(bk.x+bk.w/2,bk.y+bk.h/2,bk.col,3,160); }
  burst(loser.x,PADDLE_Y,'#ff5b5b',40,420);
  shake.m=14; sfx.ko();
}
function finishMatch(){
  state='over';
  const w=koWinner, nbs=[false,false];
  if(w){
    const wk=w.s?'p2':'p1', lk=w.s?'p1':'p2';
    stats[wk].w++; stats[lk].l++;
    for(const p of players){ const k=p.s?'p2':'p1'; nbs[p.s]=p.score>stats[k].best; if(p.score>stats[k].best)stats[k].best=p.score; }
    sfx.win();
  } else {
    for(const p of players){ const k=p.s?'p2':'p1'; nbs[p.s]=p.score>stats[k].best; if(p.score>stats[k].best)stats[k].best=p.score; }
    sfx.draw();
  }
  saveStats(); updateStatsLine(); showWin(w,nbs); show(winEl,true);
}
function showWin(w,nbs){
  const p0=players[0], p1=players[1];
  if(w){ winTitle.textContent='PLAYER '+(w.s+1)+' WINS'; winTitle.style.color=w.color; winTitle.style.textShadow='0 0 26px '+w.color+'88'; }
  else { winTitle.textContent='DEAD HEAT — DRAW'; winTitle.style.color='#ffffff'; winTitle.style.textShadow='0 0 26px rgba(255,255,255,.4)'; }
  const fmt=n=>String(n).padStart(5,'0');
  const rows=[['SCORE',fmt(p0.score)+(nbs[0]?'<span class="star">★ NEW BEST</span>':''),fmt(p1.score)+(nbs[1]?'<span class="star">★ NEW BEST</span>':'')],
              ['LEVEL REACHED','LV '+p0.level,'LV '+p1.level],
              ['BRICKS BROKEN',p0.broken,p1.broken]];
  let html='<div></div><div class="h c1">PLAYER 1</div><div class="h c2">PLAYER 2</div>';
  rows.forEach(r=>{ html+='<div class="lbl">'+r[0]+'</div><div class="val">'+r[1]+'</div><div class="val">'+r[2]+'</div>'; });
  winTable.innerHTML=html;
}

/* ---------- physics ---------- */
function collideWalls(p,b){
  const l=p.s*HALF+WALL, r=(p.s+1)*HALF-WALL;
  if(b.x<l+BALL_R){ b.x=l+BALL_R; b.vx=Math.abs(b.vx); sfx.wall(); }
  if(b.x>r-BALL_R){ b.x=r-BALL_R; b.vx=-Math.abs(b.vx); sfx.wall(); }
  if(b.y<TOP+BALL_R){ b.y=TOP+BALL_R; b.vy=Math.abs(b.vy); sfx.wall(); }
}
function collidePaddle(p,b){
  const py=PADDLE_Y-PADDLE_H/2;
  if(b.vy>0 && b.y+BALL_R>=py && b.y-BALL_R<=PADDLE_Y+PADDLE_H/2 && Math.abs(b.x-p.x)<=p.w/2+BALL_R){
    const rel=Math.max(-1,Math.min(1,(b.x-p.x)/(p.w/2)));
    const ang=rel*1.05, sp=Math.min(MAX_SPEED, Math.hypot(b.vx,b.vy)*1.035+6);
    b.vx=Math.cos(ang)*sp; b.vy=-Math.sin(ang)*sp; b.y=py-BALL_R-0.5;
    burst(b.x,py,p.color,3,140); sfx.paddle(rel);
  }
}
function destroyBrick(p,bk){
  bk.alive=false; p.broken++;
  const pts=bk.pts*(p.doubleT>0?2:1); p.score+=pts;
  popup(bk.x+bk.w/2,bk.y,'+'+pts,p.color,13);
  burst(bk.x+bk.w/2,bk.y+bk.h/2,bk.col,9,220);
  sfx.brick(bk.row);
  if(Math.random()<0.16){
    const r=Math.random(), type=r<0.4?'W':(r<0.7?'M':'D');
    p.drops.push({x:bk.x+bk.w/2,y:bk.y+bk.h/2,type,t:0});
  }
  if(!p.bricks.some(b=>b.alive)){
    p.level++; buildBricks(p);
    popup(p.s*HALF+HALF/2,H*0.42,'LEVEL '+p.level,'#ffffff',30); sfx.level();
    for(let i=0;i<14;i++) burst(p.s*HALF+60+Math.random()*(HALF-120),TOP+50,POWER.W.col,2,200);
  }
}
function collideBricks(p,b){
  for(const bk of p.bricks){ if(!bk.alive)continue;
    const cx=Math.max(bk.x,Math.min(b.x,bk.x+bk.w)), cy=Math.max(bk.y,Math.min(b.y,bk.y+bk.h));
    const dx=b.x-cx, dy=b.y-cy;
    if(dx*dx+dy*dy<=BALL_R*BALL_R){
      if(Math.abs(dx)>Math.abs(dy)) b.vx=dx>0?Math.abs(b.vx):-Math.abs(b.vx);
      else if(Math.abs(dy)>Math.abs(dx)) b.vy=dy>0?Math.abs(b.vy):-Math.abs(b.vy);
      else b.vy=-b.vy;
      destroyBrick(p,bk); return true;
    }
  }
  return false;
}
function applyDrop(p,d){
  if(d.type==='W') p.wideT=12;
  if(d.type==='D') p.doubleT=10;
  if(d.type==='M'){
    const src=p.balls.slice(0,2);
    for(const b of src) for(const off of [-0.55,0.55]){
      if(p.balls.length>=5)break;
      const a=Math.atan2(b.vy,b.vx)+off, sp=Math.hypot(b.vx,b.vy)||startSpeed(p.level);
      let vy=Math.sin(a)*sp; if(b.stuck||vy>0) vy=-Math.abs(vy)-30;
      p.balls.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy,stuck:b.stuck,trail:[]});
    }
  }
  popup(p.x,PADDLE_Y-26,POWER[d.type].label,POWER[d.type].col,17); sfx.power();
}
function updatePlayer(p,dt){
  if(p.dead)return;
  let dir=0;
  if(keys['KeyA'])dir--; if(keys['KeyD']&&p.s===0)dir++;
  if(keys['ArrowLeft']&&p.s===1)dir--; if(keys['ArrowRight'])dir+= (p.s===1)?1:0;
  if(p.s===0 && keys['ArrowLeft'])dir-=0; // keep roles strict
  p.x+=dir*520*dt;
  const targetW=p.wideT>0?BASE_W*1.55:BASE_W;
  p.w+=(targetW-p.w)*Math.min(1,dt*12);
  const minX=p.s*HALF+WALL+p.w/2+3, maxX=(p.s+1)*HALF-WALL-p.w/2-3;
  p.x=Math.max(minX,Math.min(maxX,p.x));
  p.wideT=Math.max(0,p.wideT-dt); p.doubleT=Math.max(0,p.doubleT-dt); p.flash=Math.max(0,p.flash-dt*1.6);

  // power-up drops
  for(let i=p.drops.length-1;i>=0;i--){ const d=p.drops[i]; d.y+=132*dt; d.t+=dt;
    if(d.y>H+24){ p.drops.splice(i,1); continue; }
    const cx=Math.max(p.x-p.w/2,Math.min(d.x,p.x+p.w/2)), cy=Math.max(PADDLE_Y-7,Math.min(d.y,PADDLE_Y+7));
    if((d.x-cx)**2+(d.y-cy)**2<=14*14){ applyDrop(p,d); p.drops.splice(i,1); }
  }

  // balls (sub-stepped to avoid tunneling)
  for(const b of p.balls){
    if(b.stuck){ b.x=p.x; b.y=PADDLE_Y-PADDLE_H/2-BALL_R-1; continue; }
    const sp=Math.hypot(b.vx,b.vy), n=Math.max(1,Math.ceil(sp*dt/4)), sdt=dt/n;
    for(let i=0;i<n;i++){
      b.x+=b.vx*sdt; b.y+=b.vy*sdt;
      collideWalls(p,b); collideBricks(p,b); collidePaddle(p,b);
    }
    b.trail.push({x:b.x,y:b.y}); if(b.trail.length>12)b.trail.shift();
    if(b.y-BALL_R>H+30) b.dead=true;
  }
  p.balls=p.balls.filter(b=>!b.dead);
  if(p.balls.length===0 && !p.dead) loseLife(p);
}
function update(dt){ for(const p of players) updatePlayer(p,dt); }

/* ---------- fx / ambient ---------- */
function fxUpdate(dt,freeze){
  tGlobal+=dt; shake.m=Math.max(0,shake.m-dt*30);
  for(const a of amb){ a.y-=a.s*dt; if(a.y<TOP-6){ a.y=H-4; a.x=Math.random()*W; } }
  if(freeze)return;
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(let i=popups.length-1;i>=0;i--){ const q=popups[i]; q.life-=dt; q.y-=28*dt; if(q.life<=0)popups.splice(i,1); }
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function render(){
  ctx.clearRect(0,0,W,H);
  const sx=shake.m?(Math.random()-0.5)*shake.m:0, sy=shake.m?(Math.random()-0.5)*shake.m:0;
  ctx.save(); ctx.translate(sx,sy);

  // arena base + side tints
  ctx.fillStyle='#0d1526'; ctx.fillRect(0,0,W,H);
  let g=ctx.createLinearGradient(0,0,HALF,0); g.addColorStop(0,'rgba(69,227,255,.07)'); g.addColorStop(1,'rgba(69,227,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,TOP,HALF,H-TOP);
  g=ctx.createLinearGradient(W,0,HALF,0); g.addColorStop(0,'rgba(255,92,138,.07)'); g.addColorStop(1,'rgba(255,92,138,0)');
  ctx.fillStyle=g; ctx.fillRect(HALF,TOP,HALF,H-TOP);

  // ambient dust
  for(const a of amb){ ctx.globalAlpha=0.06+0.05*Math.sin(tGlobal+a.ph); ctx.fillStyle='#a8ccff';
    ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  // faint grid
  ctx.strokeStyle='rgba(160,190,255,.045)'; ctx.lineWidth=1; ctx.beginPath();
  for(let x=WALL;x<W-WALL;x+=56){ if(Math.abs(x-HALF)<8)continue; ctx.moveTo(x,TOP); ctx.lineTo(x,H); }
  for(let y=TOP+56;y<H;y+=56){ ctx.moveTo(WALL,y); ctx.lineTo(HALF-6,y); ctx.moveTo(HALF+6,y); ctx.lineTo(W-WALL,y); }
  ctx.stroke();

  // walls & divider
  ctx.fillStyle='rgba(140,170,255,.12)'; ctx.fillRect(0,TOP,WALL,H-TOP); ctx.fillRect(W-WALL,TOP,WALL,H-TOP);
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,TOP-1); ctx.lineTo(W,TOP-1); ctx.stroke();
  g=ctx.createLinearGradient(HALF-3,0,HALF+3,0); g.addColorStop(0,'rgba(69,227,255,.85)'); g.addColorStop(1,'rgba(255,92,138,.85)');
  ctx.fillStyle=g; ctx.shadowColor='rgba(160,220,255,.5)'; ctx.shadowBlur=10; ctx.fillRect(HALF-3,TOP,6,H-TOP); ctx.shadowBlur=0;
  for(let i=0;i<3;i++){ const yy=TOP+((tGlobal*95+i*(H-TOP)/3)%(H-TOP));
    ctx.globalAlpha=.45; ctx.fillStyle=i%2?'#ff5c8a':'#45e3ff'; ctx.beginPath(); ctx.arc(HALF,yy,2.2,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  // bricks
  for(const p of players) for(const bk of p.bricks){ if(!bk.alive)continue;
    ctx.globalAlpha=.85+.15*Math.sin(tGlobal*2+bk.x*.05);
    ctx.fillStyle=bk.col; rr(bk.x,bk.y,bk.w,bk.h,4); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fillRect(bk.x+2,bk.y+2,bk.w-4,3);
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(bk.x+2,bk.y+bk.h-5,bk.w-4,3);
  }
  ctx.globalAlpha=1;

  // power-up drops
  for(const p of players) for(const d of p.drops){
    const c=POWER[d.type].col, wob=Math.sin(d.t*5)*2;
    ctx.shadowColor=c; ctx.shadowBlur=9;
    ctx.fillStyle='#0c1424'; rr(d.x-13+wob,d.y-9,26,18,9); ctx.fill();
    ctx.strokeStyle=c; ctx.lineWidth=2; rr(d.x-13+wob,d.y-9,26,18,9); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle=c; ctx.font='700 12px '+DISP; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(d.type,d.x+wob,d.y+1); ctx.textBaseline='alphabetic';
  }

  // paddles
  for(const p of players){ if(p.dead)continue;
    const y=PADDLE_Y-PADDLE_H/2;
    ctx.shadowColor=p.color; ctx.shadowBlur=16;
    g=ctx.createLinearGradient(0,y,0,y+PADDLE_H); g.addColorStop(0,'#ffffff'); g.addColorStop(.35,p.color); g.addColorStop(1,p.color);
    ctx.fillStyle=g; rr(p.x-p.w/2,y,p.w,PADDLE_H,7); ctx.fill(); ctx.shadowBlur=0;
    if(p.wideT>0){ ctx.globalAlpha=.4+.3*Math.sin(tGlobal*8); ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; rr(p.x-p.w/2-2,y-2,p.w+4,PADDLE_H+4,9); ctx.stroke(); ctx.globalAlpha=1; }
  }

  // balls + trails
  for(const p of players) for(const b of p.balls){
    for(let i=0;i<b.trail.length;i++){ const t=b.trail[i];
      ctx.globalAlpha=(i/b.trail.length)*0.22; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(t.x,t.y,BALL_R*(i/b.trail.length),0,7); ctx.fill(); }
    ctx.globalAlpha=1; ctx.shadowColor=p.color; ctx.shadowBlur=14;
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(b.x,b.y,BALL_R,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,BALL_R+1.5,0,7); ctx.stroke();
  }

  // particles & popups
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); }
  ctx.globalAlpha=1;
  for(const q of popups){ ctx.globalAlpha=Math.max(0,q.life/q.max); ctx.fillStyle=q.color;
    ctx.font='700 '+q.size+'px '+MONO; ctx.textAlign='center'; ctx.fillText(q.txt,q.x,q.y); }
  ctx.globalAlpha=1;

  drawHUD();

  // launch hints
  if(state==='playing'){
    for(const p of players){ if(!p.balls.some(b=>b.stuck)||p.dead)continue;
      ctx.globalAlpha=.45+.4*Math.sin(tGlobal*6); ctx.fillStyle=p.color;
      ctx.font='700 12px '+MONO; ctx.textAlign='center';
      ctx.fillText(p.s===0?'W / SPACE':'↑ / ENTER',p.x,PADDLE_Y-32); ctx.globalAlpha=1; }
  }

  // K.O. veil
  if(state==='ko'&&koLoser){
    const q=1-koTimer/1.6;
    ctx.fillStyle='rgba(4,6,14,'+Math.min(.55,q*2).toFixed(3)+')'; ctx.fillRect(0,0,W,H);
    const t=Math.min(1,(1.6-koTimer)/0.35), e=1+2.7*Math.pow(t-1,3)+1.7*Math.pow(t-1,2);
    ctx.save(); ctx.translate(HALF,H*0.42); ctx.scale(e,e);
    ctx.font='120px '+DISP; ctx.textAlign='center'; ctx.fillStyle='#ffffff';
    ctx.shadowColor='#ff3b3b'; ctx.shadowBlur=40; ctx.fillText('K.O.',0,0); ctx.restore();
    ctx.globalAlpha=Math.min(1,q*2); ctx.fillStyle=koLoser.color; ctx.font='700 22px '+DISP; ctx.textAlign='center';
    ctx.fillText('PLAYER '+(koLoser.s+1)+' ELIMINATED',HALF,H*0.62); ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle='rgba(8,12,24,.92)'; ctx.fillRect(0,0,W,TOP-2);
  ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.beginPath(); ctx.moveTo(0,TOP-3.5); ctx.lineTo(W,TOP-3.5); ctx.stroke();

  for(const p of players){
    const left=p.s===0, ax=left?18:W-18, al=left?'left':'right';
    ctx.textAlign=al;
    try{ctx.letterSpacing='3px';}catch(e){}
    ctx.font='700 15px '+DISP; ctx.fillStyle=p.color; ctx.fillText('PLAYER '+(p.s+1),ax,26);
    try{ctx.letterSpacing='0px';}catch(e){}
    const nw=ctx.measureText('PLAYER '+(p.s+1)).width;
    for(let i=0;i<p.lives;i++){ const ix=left?ax+nw+16+i*19:ax-nw-16-i*19-12;
      ctx.fillStyle=p.color; rr(ix,17,13,6,3); ctx.fill(); }
    const sc=String(p.score).padStart(5,'0');
    ctx.font='700 34px '+MONO; ctx.fillStyle='#ffffff'; ctx.fillText(sc,ax,64);
    const sw=ctx.measureText(sc).width;
    ctx.font='11px '+MONO; ctx.fillStyle='rgba(200,220,255,.55)';
    ctx.fillText('LV '+p.level, left?ax+sw+12:ax-sw-12, 64);

    let cy=TOP+12;
    const chips=[];
    if(p.wideT>0)chips.push(['WIDE '+Math.ceil(p.wideT)+'s',POWER.W.col]);
    if(p.doubleT>0)chips.push(['×2 PTS '+Math.ceil(p.doubleT)+'s',POWER.D.col]);
    for(const [txt,col] of chips){
      ctx.font='700 11px '+MONO; const tw=ctx.measureText(txt).width, x=p.s*HALF+12;
      ctx.fillStyle='rgba(12,20,36,.85)'; rr(x,cy,tw+16,18,9); ctx.fill();
      ctx.strokeStyle=col; ctx.lineWidth=1.5; rr(x,cy,tw+16,18,9); ctx.stroke();
      ctx.fillStyle=col; ctx.textAlign='left'; ctx.fillText(txt,x+8,cy+13); cy+=24;
    }
  }

  // VS badge
  ctx.save(); ctx.translate(HALF,30); ctx.rotate(Math.PI/4);
  ctx.fillStyle='#1a2542'; ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=1.5;
  rr(-13,-13,26,26,5); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle='#ffffff'; ctx.font='700 13px '+DISP; ctx.textAlign='center'; ctx.fillText('VS',HALF,34);

  ctx.font='10px '+MONO; ctx.fillStyle='rgba(255,255,255,.38)'; ctx.textAlign='center';
  ctx.fillText('P PAUSE   ·   M SOUND '+(muted?'OFF':'ON')+'   ·   R RESTART',HALF,TOP-7);

  // life-loss flash per side
  for(const p of players){ if(p.flash<=0)continue;
    ctx.fillStyle='rgba(255,40,60,'+(p.flash*0.22).toFixed(3)+')'; ctx.fillRect(p.s*HALF,TOP,HALF,H-TOP); }
}

/* ---------- main loop ---------- */
let tPrev=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-tPrev)/1000)||0; tPrev=now;
  if(state==='playing'){ update(dt); fxUpdate(dt,false); }
  else if(state==='ko'){ koTimer-=dt; if(koTimer<=0)finishMatch(); fxUpdate(dt,false); }
  else if(state==='paused'){ fxUpdate(dt,true); }
  else { fxUpdate(dt,false); }
  render();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const keys={};
window.addEventListener('keydown',e=>{
  audio(); const c=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c)) e.preventDefault();
  keys[c]=true;
  if(e.repeat)return;
  if(state==='menu'){ if(c!=='KeyM') startMatch(); else toggleMute(); return; }
  if(state==='over'){
    if(c==='KeyR'||c==='Space'||c==='Enter')startMatch();
    else if(c==='Escape')toMenu();
    return;
  }
  if(c==='KeyM'){ toggleMute(); return; }
  if(state==='playing'){
    if(c==='KeyP'||c==='Escape'){ pauseGame(); return; }
    if(c==='KeyR'){ startMatch(); return; }
    if(c==='KeyW'||c==='Space') launchAll(players[0]);
    if(c==='ArrowUp'||c==='Enter') launchAll(players[1]);
  } else if(state==='paused'){
    if(c==='KeyP'||c==='Escape')resumeGame();
    else if(c==='KeyR')startMatch();
  }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in keys)keys[k]=false; if(state==='playing')pauseGame(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='playing')pauseGame(); });

function toggleMute(){ muted=!muted; sfx.ui(); }
cv.addEventListener('click',()=>{ audio(); if(state==='menu')startMatch(); else if(state==='over')startMatch(); });
document.getElementById('btnStart').addEventListener('click',e=>{ audio(); e.currentTarget.blur(); startMatch(); });
document.getElementById('btnRematch').addEventListener('click',e=>{ audio(); e.currentTarget.blur(); startMatch(); });
document.getElementById('btnMenu').addEventListener('click',e=>{ audio(); e.currentTarget.blur(); toMenu(); });

/* ---------- sizing ---------- */
function fit(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  const dpr=Math.max(1,window.devicePixelRatio||1);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  cv.width=Math.round(W*s*dpr); cv.height=Math.round(H*s*dpr);
  ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
}
window.addEventListener('resize',fit);

/* ---------- go ---------- */
updateStatsLine(); fit(); requestAnimationFrame(frame);
})();
</script>
