<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ricochet Rush — Shooter Puzzle</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0e17;font-family:'Segoe UI',Arial,sans-serif}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,10,20,.78);backdrop-filter:blur(4px);z-index:5}
  #card{background:linear-gradient(160deg,#1a2136,#12162a);border:1px solid #33406b;border-radius:16px;
    padding:34px 44px;text-align:center;color:#e8ecff;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #card h1{font-size:42px;letter-spacing:3px;background:linear-gradient(90deg,#5ad0ff,#a07bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
  #card h2{font-size:30px;margin-bottom:12px;color:#ffd76b}
  #card p{color:#9aa5c8;line-height:1.55;margin:10px 0;font-size:15px}
  #card .keys{margin-top:14px;font-size:13px;color:#7f8ab0}
  #card .keys b{color:#cdd6ff;background:#232c4d;padding:2px 8px;border-radius:6px;display:inline-block;margin:3px 2px}
  button{margin-top:18px;cursor:pointer;border:none;border-radius:10px;padding:13px 34px;font-size:17px;
    font-weight:700;letter-spacing:1px;color:#0b0e17;background:linear-gradient(90deg,#5ad0ff,#a07bff);
    transition:transform .12s,box-shadow .12s}
  button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 24px rgba(90,208,255,.35)}
  .sub{margin-top:8px;font-size:13px;color:#7f8ab0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay"><div id="card"></div></div>
</div>
<script>
(function(){
"use strict";
var W=900,H=600,R=8,TR=13,SPEED=620,MAXB=5,CX=450,CY=562;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var overlay=document.getElementById('overlay'),card=document.getElementById('card');

/* ---------- audio ---------- */
var AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f,d,type,vol,slide){
  var a=audio(); if(!a)return;
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);
}
var sFire=function(){beep(300,0.18,'square',0.12,-160);};
var sBounce=function(){beep(480,0.07,'triangle',0.10);};
var sHit=function(i){beep(660+i*90,0.15,'sine',0.16,220);};
var sWin=function(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,0.25,'sine',0.14);},i*110);});};
var sLose=function(){beep(200,0.4,'sawtooth',0.12,-120);setTimeout(function(){beep(150,0.5,'sawtooth',0.12,-80);},250);};

/* ---------- levels ---------- */
var LEVELS=[
 {balls:3,walls:[],targets:[[200,150],[700,150],[450,100]]},
 {balls:4,walls:[[430,180,40,260]],targets:[[200,200],[700,200],[450,90]]},
 {balls:5,walls:[[150,250,60,250],[690,250,60,250]],targets:[[450,300],[100,140],[800,140],[450,470]]},
 {balls:5,walls:[[150,180,250,30],[500,180,250,30]],targets:[[250,95],[650,95],[450,120],[450,470]]},
 {balls:6,walls:[[370,160,20,140],[510,160,20,140],[370,160,160,20],[430,470,40,130]],
  targets:[[450,280],[120,120],[780,120],[150,480]]},
 {balls:7,walls:[[200,150,30,300],[435,150,30,300],[670,150,30,300]],
  targets:[[318,110],[552,110],[100,420],[800,420],[450,90]]}
];

/* ---------- state ---------- */
var state='menu',lvl=0,ballsLeft=0,targets=[],walls=[],ball=null;
var aim=-Math.PI/2,recoil=0,particles=[],completeAt=0,timeNow=0,best=1;
try{best=Math.max(1,parseInt(localStorage.getItem('ricochet_best')||'1',10)||1);}catch(e){}

function setLevel(i){
  lvl=i; var L=LEVELS[i];
  ballsLeft=L.balls; walls=L.walls.map(function(w){return {x:w[0],y:w[1],w:w[2],h:w[3]};});
  targets=L.targets.map(function(t){return {x:t[0],y:t[1]};});
  ball=null; particles=[]; aim=-Math.PI/2; recoil=0;
}

/* ---------- sizing ---------- */
var scale=1,ox=0,oy=0;
function resize(){
  cv.width=window.innerWidth; cv.height=window.innerHeight;
  scale=Math.min(cv.width/W,cv.height/H);
  ox=(cv.width-W*scale)/2; oy=(cv.height-H*scale)/2;
}
window.addEventListener('resize',resize); resize();

/* ---------- physics ---------- */
function stepBall(b,dt){
  var bounced=false,i,s,n=0;
  var steps=Math.max(1,Math.ceil(SPEED*dt/(R*0.5)));
  for(s=0;s<steps;s++){
    b.x+=b.vx*dt/steps; b.y+=b.vy*dt/steps;
    // edges
    if(b.x<R){b.x=R;b.vx=Math.abs(b.vx);bounced=true;}
    if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx);bounced=true;}
    if(b.y<R){b.y=R;b.vy=Math.abs(b.vy);bounced=true;}
    if(b.y>H-R){b.y=H-R;b.vy=-Math.abs(b.vy);bounced=true;}
    // walls (AABB)
    for(i=0;i<walls.length;i++){
      var w=walls[i];
      var cx=Math.max(w.x,Math.min(b.x,w.x+w.w));
      var cy=Math.max(w.y,Math.min(b.y,w.y+w.h));
      var dx=b.x-cx, dy=b.y-cy, d2=dx*dx+dy*dy;
      if(d2<R*R){
        var d=Math.sqrt(d2),nx,ny;
        if(d<0.0001){nx=0;ny=-1;b.y=w.y-R-0.5;}
        else{nx=dx/d;ny=dy/d;b.x=cx+nx*(R+0.2);b.y=cy+ny*(R+0.2);}
        var dot=b.vx*nx+b.vy*ny;
        if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;}
        bounced=true;
      }
    }
    // targets (ball pierces)
    for(i=targets.length-1;i>=0;i--){
      var t=targets[i],tdx=b.x-t.x,tdy=b.y-t.y;
      if(tdx*tdx+tdy*tdy<(R+TR)*(R+TR)){
        burst(t.x,t.y,'#ffd76b',26); targets.splice(i,1); sHit(targets.length);
      }
    }
    b.trail.push({x:b.x,y:b.y}); if(b.trail.length>14)b.trail.shift();
  }
  if(bounced){b.n++; if(sBounce)sBounce();}
  return bounced;
}

function burst(x,y,col,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=60+Math.random()*260;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+Math.random()*0.5,max:1,col:col,sz:2+Math.random()*3});
  }
}

/* ---------- trajectory preview ---------- */
function simulate(){
  if(state!=='playing'||ball||ballsLeft<=0)return null;
  var b={x:CX+Math.cos(aim)*34,y:CY+Math.sin(aim)*34,vx:Math.cos(aim)*SPEED,vy:Math.sin(aim)*SPEED,n:0,trail:[]};
  var pts=[],dt=1/120;
  for(var k=0;k<MAXB*60+40;k++){
    stepBallSilent(b,dt);
    if(k%3===0)pts.push({x:b.x,y:b.y});
    if(hitTarget(b))return {pts:pts,hit:{x:b.x,y:b.y}};
    if(b.n>MAXB)break;
  }
  return {pts:pts,hit:null};
}
function hitTarget(b){
  for(var i=0;i<targets.length;i++){
    var t=targets[i],dx=b.x-t.x,dy=b.y-t.y;
    if(dx*dx+dy*dy<(R+TR)*(R+TR))return true;
  }
  return false;
}
// silent variant for preview (no sound / target removal)
function stepBallSilent(b,dt){
  var steps=Math.max(1,Math.ceil(SPEED*dt/(R*0.5))),s,i;
  for(s=0;s<steps;s++){
    b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;
    if(b.x<R){b.x=R;b.vx=Math.abs(b.vx);b.n++;}
    if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx);b.n++;}
    if(b.y<R){b.y=R;b.vy=Math.abs(b.vy);b.n++;}
    if(b.y>H-R){b.y=H-R;b.vy=-Math.abs(b.vy);b.n++;}
    for(i=0;i<walls.length;i++){
      var w=walls[i],cx=Math.max(w.x,Math.min(b.x,w.x+w.w)),cy=Math.max(w.y,Math.min(b.y,w.y+w.h));
      var dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy;
      if(d2<R*R){
        var d=Math.sqrt(d2),nx,ny;
        if(d<0.0001){nx=0;ny=-1;b.y=w.y-R-0.5;}else{nx=dx/d;ny=dy/d;b.x=cx+nx*(R+0.2);b.y=cy+ny*(R+0.2);}
        var dot=b.vx*nx+b.vy*ny;
        if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;}
        b.n++;
      }
    }
  }
}

/* ---------- actions ---------- */
function fire(){
  if(state!=='playing'||ball||ballsLeft<=0)return;
  ball={x:CX+Math.cos(aim)*34,y:CY+Math.sin(aim)*34,vx:Math.cos(aim)*SPEED,vy:Math.sin(aim)*SPEED,n:0,trail:[]};
  ballsLeft--; recoil=1; sFire();
}

function nextLevel(){
  if(lvl+1<LEVELS.length){setLevel(lvl+1);state='playing';hideOverlay();}
  else{state='win';sWin();showWin();}
}

/* ---------- overlays ---------- */
function hideOverlay(){overlay.style.display='none';}
function show(html){card.innerHTML=html;overlay.style.display='flex';}
function showMenu(){
  state='menu';
  show('<h1>RICOCHET RUSH</h1><p>A shooter-puzzle: you have limited balls. Bounce them off walls and blocks to pop <b style="color:#ffd76b">every target</b>. Run out of balls and the run ends.</p>'+
  '<div class="keys"><b>Mouse / Touch</b> aim &nbsp; <b>Click / Space</b> fire<br><b>R</b> restart level &nbsp; <b>M</b> menu &nbsp; <b>Enter</b> confirm</div>'+
  (best>1?'<p class="sub">Best: reached level '+best+' of '+LEVELS.length+'</p>':'')+
  '<button data-a="start">START GAME</button><p class="sub">6 levels · trajectory preview shows up to 5 bounces</p>');
}
function showComplete(){
  state='complete';
  var last=lvl+1>=LEVELS.length;
  show('<h2>LEVEL '+(lvl+1)+' CLEAR!</h2><p>'+ballsLeft+' ball'+(ballsLeft===1?'':'s')+' left over.</p>'+
  '<button data-a="next">'+(last?'SEE RESULTS':'NEXT LEVEL')+'</button><p class="sub">press Enter</p>');
}
function showGameOver(){
  state='gameover'; sLose();
  show('<h2>OUT OF BALLS</h2><p>'+targets.length+' target'+(targets.length===1?'':'s')+' remaining on level '+(lvl+1)+'.</p>'+
  '<button data-a="retry">RETRY LEVEL</button><p class="sub">press R or Enter</p>');
}
function showWin(){
  show('<h2>ALL CLEAR!</h2><p>You cracked all '+LEVELS.length+' ricochet puzzles. Master of the bounce!</p>'+
  '<button data-a="again">PLAY AGAIN</button><p class="sub">press Enter</p>');
}

overlay.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return; audio();
  var a=b.getAttribute('data-a');
  if(a==='start'){setLevel(0);state='playing';hideOverlay();}
  else if(a==='next'){nextLevel();hideOverlay();}
  else if(a==='retry'){setLevel(lvl);state='playing';hideOverlay();}
  else if(a==='again'){setLevel(0);state='playing';hideOverlay();}
});

/* ---------- input ---------- */
function toLogical(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left-ox)/scale, y:(e.clientY-r.top-oy)/scale};
}
window.addEventListener('pointermove',function(e){
  if(state!=='playing')return;
  var p=toLogical(e); aim=Math.atan2(p.y-CY,p.x-CX);
});
var downPos=null;
window.addEventListener('pointerdown',function(e){
  audio(); downPos={x:e.clientX,y:e.clientY,t:Date.now()};
  if(state==='playing'){var p=toLogical(e);aim=Math.atan2(p.y-CY,p.x-CX);}
});
window.addEventListener('pointerup',function(e){
  if(!downPos)return;
  var moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y);
  downPos=null;
  if(moved<12&&state==='playing')fire();
});
window.addEventListener('keydown',function(e){
  audio();
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'){aim-=0.035;if(state==='playing')e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'){aim+=0.035;if(state==='playing')e.preventDefault();}
  else if(k===' '){if(state==='playing')fire(); e.preventDefault();}
  else if(k==='Enter'){
    if(state==='menu'){setLevel(0);state='playing';hideOverlay();}
    else if(state==='complete'){nextLevel();hideOverlay();}
    else if(state==='gameover'){setLevel(lvl);state='playing';hideOverlay();}
    else if(state==='win'){setLevel(0);state='playing';hideOverlay();}
  }
  else if(k==='r'||k==='R'){if(state!=='menu'){setLevel(lvl);state='playing';hideOverlay();}}
  else if(k==='m'||k==='M'){showMenu();}
});

/* ---------- update ---------- */
function update(dt){
  timeNow+=dt; recoil=Math.max(0,recoil-dt*4);
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i]; p.life-=dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.vx*=0.99;
  }
  if(state==='playing'&&ball){
    stepBall(ball,dt);
    if(ball.n>MAXB){burst(ball.x,ball.y,'#5ad0ff',12);ball=null;}
    if(targets.length===0&&state==='playing'){
      state='complete'; completeAt=timeNow+0.7; sWin();
      for(var c=0;c<90;c++){
        var cols=['#5ad0ff','#a07bff','#ffd76b','#7dffa8'];
        particles.push({x:Math.random()*W,y:-10-Math.random()*120,vx:(Math.random()-0.5)*160,vy:80+Math.random()*160,
          life:1.5+Math.random(),max:2,col:cols[c%4],sz:3+Math.random()*4});
      }
    }
  }
  if(state==='playing'&&!ball&&ballsLeft<=0&&targets.length>0){showGameOver();}
  if(state==='complete'&&timeNow>=completeAt){
    try{if(lvl+1>best-0){best=Math.max(best,lvl+2);localStorage.setItem('ricochet_best',String(Math.min(best,LEVELS.length)));}}catch(e){}
    showComplete();
  }
}

/* ---------- render ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#0b0e17'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);

  // field
  ctx.fillStyle='#141a2e'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2b3560'; ctx.lineWidth=4; ctx.strokeRect(2,2,W-4,H-4);
  ctx.strokeStyle='rgba(90,140,255,0.05)'; ctx.lineWidth=1;
  for(var g=90;g<W;g+=90){ctx.beginPath();ctx.moveTo(g,0);ctx.lineTo(g,H);ctx.stroke();}
  for(g=90;g<H;g+=90){ctx.beginPath();ctx.moveTo(0,g);ctx.lineTo(W,g);ctx.stroke();}

  // walls
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    ctx.fillStyle='#3a4675'; rr(w.x,w.y,w.w,w.h,6); ctx.fill();
    ctx.fillStyle='#4d5b95'; rr(w.x+3,w.y+3,Math.max(2,w.w-6),Math.max(2,w.h-6),4); ctx.fill();
  }

  // targets
  for(i=0;i<targets.length;i++){
    var t=targets[i],pu=1+Math.sin(timeNow*4+i)*0.08;
    ctx.beginPath();ctx.arc(t.x,t.y,TR*pu+5,0,7);ctx.fillStyle='rgba(255,215,107,0.15)';ctx.fill();
    ctx.beginPath();ctx.arc(t.x,t.y,TR*pu,0,7);ctx.fillStyle='#ffd76b';ctx.fill();
    ctx.beginPath();ctx.arc(t.x,t.y,TR*pu*0.55,0,7);ctx.fillStyle='#ff9d3c';ctx.fill();
    ctx.beginPath();ctx.arc(t.x-3,t.y-4,TR*0.28,0,7);ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();
  }

  // preview
  if(state==='playing'&&!ball&&ballsLeft>0){
    var sim=simulate();
    if(sim){
      for(i=0;i<sim.pts.length;i++){
        var a=1-i/sim.pts.length;
        ctx.beginPath();ctx.arc(sim.pts[i].x,sim.pts[i].y,3,0,7);
        ctx.fillStyle='rgba(255,255,255,'+(0.15+a*0.55)+')';ctx.fill();
      }
      if(sim.hit){
        ctx.beginPath();ctx.arc(sim.hit.x,sim.hit.y,TR+6+Math.sin(timeNow*8)*3,0,7);
        ctx.strokeStyle='#ffd76b';ctx.lineWidth=2;ctx.stroke();
      }
    }
  }

  // cannon
  var ang=aim, rec=recoil*10;
  ctx.save(); ctx.translate(CX,CY);
  ctx.rotate(ang);
  ctx.fillStyle='#5ad0ff'; rr(-6-rec,-9,44+rec,18,7); ctx.fill();
  ctx.fillStyle='#a07bff'; rr(-6-rec,-9,12+rec,18,6); ctx.fill();
  ctx.restore();
  ctx.beginPath();ctx.arc(CX,CY,20,0,7);ctx.fillStyle='#1e2745';ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#5ad0ff';ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,8,0,7);ctx.fillStyle='#a07bff';ctx.fill();

  // ball + trail
  if(ball){
    for(i=0;i<ball.trail.length;i++){
      var tr=ball.trail[i],ta=i/ball.trail.length;
      ctx.beginPath();ctx.arc(tr.x,tr.y,R*ta,0,7);ctx.fillStyle='rgba(90,208,255,'+(ta*0.3)+')';ctx.fill();
    }
    ctx.beginPath();ctx.arc(ball.x,ball.y,R+4,0,7);ctx.fillStyle='rgba(90,208,255,0.25)';ctx.fill();
    ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,7);ctx.fillStyle='#eafcff';ctx.fill();
    ctx.beginPath();ctx.arc(ball.x-2,ball.y-2,3,0,7);ctx.fillStyle='#fff';ctx.fill();
  }

  // particles
  for(i=0;i<particles.length;i++){
    var p=particles[i];
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col; ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }
  ctx.globalAlpha=1;

  // HUD
  if(state!=='menu'){
    ctx.textAlign='left';ctx.font='700 20px Segoe UI, Arial';
    ctx.fillStyle='#e8ecff'; ctx.fillText('LEVEL '+(lvl+1)+' / '+LEVELS.length,20,34);
    ctx.textAlign='right';
    ctx.fillStyle='#9aa5c8'; ctx.font='600 14px Segoe UI, Arial';
    ctx.fillText('TARGETS LEFT',W-20,24);
    for(i=0;i<ballsLeft;i++){
      ctx.beginPath();ctx.arc(W-20-i*24,42,8,0,7);ctx.fillStyle='#5ad0ff';ctx.fill();
    }
    if(ballsLeft===0){ctx.fillStyle='#6b7499';ctx.font='600 13px Segoe UI,Arial';ctx.fillText('— no balls —',W-20,48);}
    ctx.textAlign='left';ctx.fillStyle='#5a648c';ctx.font='600 12px Segoe UI,Arial';
    ctx.fillText('click / space to fire · R restart · M menu',20,H-14);
  }
}

/* ---------- loop ---------- */
var lastT=performance.now();
function frame(t){
  var dt=Math.min(0.033,(t-lastT)/1000); lastT=t;
  update(dt); render();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
