<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Twin Rush — Two-Player Endless</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b0e1a; }
  #wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(8,10,25,.86); color:#eaf0ff; font-family:'Segoe UI', Arial, sans-serif; text-align:center; z-index:5;
  }
  .hidden { display:none; }
  h1 { font-size:min(9vw, 64px); margin:0 0 8px; letter-spacing:2px; }
  h1 .p1 { color:#4dd2ff; } h1 .p2 { color:#ff7ad9; }
  .sub { font-size:min(3.5vw,20px); opacity:.85; margin-bottom:22px; }
  .controls { display:flex; gap:min(6vw,60px); margin-bottom:26px; flex-wrap:wrap; justify-content:center; }
  .ctl { font-size:min(3vw,17px); line-height:1.7; padding:14px 22px; border-radius:12px; background:rgba(255,255,255,.06); }
  .ctl h3 { margin:0 0 6px; font-size:min(3.4vw,20px); }
  .ctl.c1 h3 { color:#4dd2ff; } .ctl.c2 h3 { color:#ff7ad9; }
  kbd { background:#223; border:1px solid #456; border-radius:5px; padding:2px 8px; font-family:monospace; }
  .btn {
    font-size:min(4vw,22px); padding:14px 44px; border:none; border-radius:40px; cursor:pointer;
    background:linear-gradient(90deg,#4dd2ff,#ff7ad9); color:#0b0e1a; font-weight:700; letter-spacing:1px;
  }
  .btn:hover { filter:brightness(1.15); }
  .hint { margin-top:14px; font-size:min(2.8vw,15px); opacity:.6; }
  .score-big { font-size:min(7vw,44px); margin:6px 0 18px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="startScreen" class="overlay">
    <h1><span class="p1">TWIN</span> RUSH</h1>
    <div class="sub">Two players. One endless storm. Catch gems, dodge bombs!</div>
    <div class="controls">
      <div class="ctl c1"><h3>PLAYER 1 (left half)</h3><kbd>A</kbd> / <kbd>D</kbd> — move<br>Gem +5 &nbsp;•&nbsp; Star +15</div>
      <div class="ctl c2"><h3>PLAYER 2 (right half)</h3><kbd>&#8592;</kbd> / <kbd>&#8594;</kbd> — move<br>Bomb = lose a life (3 lives total)</div>
    </div>
    <button class="btn" id="startBtn">START</button>
    <div class="hint">Press ENTER to start &nbsp;•&nbsp; R to restart anytime</div>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1 style="color:#ff5470;">GAME OVER</h1>
    <div class="score-big">Score: <span id="finalScore">0</span></div>
    <div class="sub">Best: <span id="bestScore">0</span></div>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
    <div class="hint">Press ENTER or R to restart</div>
  </div>
</div>

<script>
(function(){
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');

let W = 0, H = 0;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio (created on first input) ----------
let actx = null;
function initAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type, vol){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.12, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
function sndCatch(){ beep(720, .12, 'square', .1); setTimeout(()=>beep(1080,.1,'square',.08),60); }
function sndStar(){ beep(880,.1,'triangle',.12); setTimeout(()=>beep(1320,.14,'triangle',.1),70); }
function sndHit(){ beep(140,.35,'sawtooth',.2); }

// ---------- Game state ----------
const G = {
  running:false, over:false,
  score:0, lives:3, time:0, spawnTimer:0, shake:0, flash:0,
  items:[], particles:[], stars:[]
};
function bestScore(){ try{ return parseInt(localStorage.getItem('twinRushBest')||'0',10)||0; }catch(e){ return 0; } }
function saveBest(s){ try{ localStorage.setItem('twinRushBest', String(s)); }catch(e){} }

const P1 = { x:0, w:64, h:52, speed:0.9, color:'#4dd2ff', glow:'rgba(77,210,255,', keys:{l:false,r:false} };
const P2 = { x:0, w:64, h:52, speed:0.9, color:'#ff7ad9', glow:'rgba(255,122,217,', keys:{l:false,r:false} };

function reset(){
  G.running = true; G.over = false;
  G.score = 0; G.lives = 3; G.time = 0; G.spawnTimer = 0; G.shake = 0; G.flash = 0;
  G.items.length = 0; G.particles.length = 0;
  P1.x = W*0.25 - P1.w/2; P2.x = W*0.75 - P2.w/2;
  buildStars();
}
function buildStars(){
  G.stars.length = 0;
  for(let i=0;i<70;i++) G.stars.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.6+0.4, v:Math.random()*0.4+0.15});
}

// ---------- Spawning ----------
function difficulty(){ return 1 + G.time/25; } // grows over time
function spawnItem(){
  const d = difficulty();
  const bombChance = Math.min(0.18 + G.time*0.004, 0.38);
  const starChance = 0.12;
  let type = 'gem';
  const r = Math.random();
  if(r < bombChance) type = 'bomb';
  else if(r < bombChance + starChance) type = 'star';
  const size = type==='star' ? 26 : 22;
  G.items.push({
    x: Math.random()*(W-40)+20, y: -30,
    vy: (1.6 + Math.random()*1.4) * d,
    vx: (Math.random()-0.5)*0.8*d,
    type, size, rot: Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.08
  });
}

// ---------- Particles ----------
function burst(x,y,color,n){
  for(let i=0;i<(n||14);i++){
    const a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color});
  }
}

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', function(e){
  initAudio();
  if(['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if(e.key === 'Enter'){
    if(!G.running && !G.over) startGame();
    else if(G.over) startGame();
  }
  if(e.key.toLowerCase() === 'r' && G.running){ startGame(); }
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

function startGame(){
  initAudio();
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  reset();
  beep(520,.1,'square',.1);
}
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

function endGame(){
  G.running = false; G.over = true;
  const b = bestScore();
  if(G.score > b) saveBest(G.score);
  document.getElementById('finalScore').textContent = G.score;
  document.getElementById('bestScore').textContent = Math.max(b, G.score);
  overScreen.classList.remove('hidden');
}

// ---------- Update ----------
function update(dt){
  G.time += dt/1000;
  const d = difficulty();

  // stars drift
  for(const s of G.stars){ s.y += s.v*d; if(s.y > H){ s.y=-2; s.x=Math.random()*W; } }

  // players
  function moveP(p, left, right, min, max){
    if(keys[left]) p.x -= p.speed * (6 + d);
    if(keys[right]) p.x += p.speed * (6 + d);
    p.x = Math.max(min, Math.min(max - p.w, p.x));
  }
  moveP(P1,'a','d', 8, W/2 - 8);
  moveP(P2,'arrowleft','arrowright', W/2 + 8, W - 8);

  // spawn
  G.spawnTimer -= dt;
  if(G.spawnTimer <= 0){
    spawnItem();
    if(d > 2.4 && Math.random() < 0.35) spawnItem();
    G.spawnTimer = Math.max(260, 750 - G.time*12);
  }

  // items
  const py = H - P1.h - 18;
  for(let i=G.items.length-1;i>=0;i--){
    const it = G.items[i];
    it.y += it.vy * dt/16.67;
    it.x += it.vx * dt/16.67;
    it.rot += it.vr;
    if(it.x < it.size && it.vx < 0) it.vx *= -1;
    if(it.x > W-it.size && it.vx > 0) it.vx *= -1;

    // collision with players (item bottom vs player top box)
    for(const p of [P1,P2]){
      const inHalf = (p===P1 ? it.x < W/2+it.size : it.x > W/2-it.size);
      if(inHalf &&
         it.x + it.size*0.6 > p.x && it.x - it.size*0.6 < p.x + p.w &&
         it.y + it.size > py && it.y - it.size < py + p.h){
        if(it.type === 'bomb'){
          G.lives--; G.shake = 14; G.flash = 1; sndHit();
          burst(it.x, it.y, '#ff5470', 22);
          if(G.lives <= 0){ endGame(); }
        } else {
          const pts = it.type === 'star' ? 15 : 5;
          G.score += pts;
          burst(it.x, it.y, it.type==='star' ? '#ffd94d' : '#7dff8a', 12);
          if(it.type==='star') sndStar(); else sndCatch();
        }
        G.items.splice(i,1);
        break;
      }
    }
    if(G.items[i] && it.y > H + 40) G.items.splice(i,1);
  }

  // particles
  for(let i=G.particles.length-1;i>=0;i--){
    const pt = G.particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.12; pt.life -= 0.03;
    if(pt.life <= 0) G.particles.splice(i,1);
  }

  if(G.shake > 0) G.shake *= 0.85;
  if(G.flash > 0) G.flash -= 0.06;
}

// ---------- Draw ----------
function drawPlayer(p){
  const y = H - p.h - 18;
  ctx.save();
  // glow
  const grad = ctx.createRadialGradient(p.x+p.w/2, y+p.h/2, 4, p.x+p.w/2, y+p.h/2, p.w);
  grad.addColorStop(0, p.glow + '0.35)');
  grad.addColorStop(1, p.glow + '0)');
  ctx.fillStyle = grad;
  ctx.fillRect(p.x-p.w/2, y-p.w/2, p.w*2, p.w*2);
  // body (rounded paddle)
  ctx.fillStyle = p.color;
  roundRect(p.x, y, p.w, p.h, 12); ctx.fill();
  // inner stripe
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  roundRect(p.x+6, y+p.h/2-4, p.w-12, 8, 4); ctx.fill();
  // label
  ctx.fillStyle = '#0b0e1a';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign='center';
  ctx.fillText(p===P1?'P1':'P2', p.x+p.w/2, y-8);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawItem(it){
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(it.rot);
  if(it.type === 'bomb'){
    ctx.fillStyle = '#2a2f45';
    ctx.beginPath(); ctx.arc(0,0,it.size*0.62,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ff5470'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,0,it.size*0.62,0,Math.PI*2); ctx.stroke();
    // fuse spark
    ctx.fillStyle = '#ffd94d';
    ctx.beginPath(); ctx.arc(it.size*0.45,-it.size*0.55,3.5+Math.random()*2,0,Math.PI*2); ctx.fill();
  } else if(it.type === 'star'){
    ctx.fillStyle = '#ffd94d';
    star(0,0,it.size*0.7,it.size*0.32,5); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.5; ctx.stroke();
  } else {
    ctx.fillStyle = '#7dff8a';
    diamond(0,0,it.size*0.6); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.restore();
}
function star(cx,cy,ro,ri,n){
  ctx.beginPath();
  for(let i=0;i<n*2;i++){
    const r = i%2===0?ro:ri, a = (i/(n*2))*Math.PI*2 - Math.PI/2;
    ctx[i===0?'moveTo':'lineTo'](cx+Math.cos(a)*r, cy+Math.sin(a)*r);
  }
  ctx.closePath();
}
function diamond(cx,cy,r){
  ctx.beginPath();
  ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.75,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r*0.75,cy);
  ctx.closePath();
}

function drawHUD(){
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.font = 'bold ' + Math.min(26, W*0.035) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SCORE ' + G.score, W/2, 36);
  // hearts
  for(let i=0;i<3;i++){
    const x = W/2 - 40 + i*40;
    drawHeart(x, 62, 10, i < G.lives ? '#ff5470' : 'rgba(255,84,112,.18)');
  }
  // speed indicator
  ctx.font = '13px monospace';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillText('SPEED x' + difficulty().toFixed(1), W/2, H-8);
  // center divider
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.setLineDash([10,14]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.restore();
}
function drawHeart(x,y,s,color){
  ctx.save();
  ctx.fillStyle = color;
  ctx.translate(x,y);
  ctx.beginPath();
  ctx.moveTo(0, s*0.35);
  ctx.bezierCurveTo(-s, -s*0.45, -s*0.5, -s*1.1, 0, -s*0.4);
  ctx.bezierCurveTo(s*0.5, -s*1.1, s, -s*0.45, 0, s*0.35);
  ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.save();
  if(G.shake > 0.5) ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);

  // background
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#131a33'); bg.addColorStop(1,'#0b0e1a');
  ctx.fillStyle = bg;
  ctx.fillRect(-20,-20,W+40,H+40);

  // stars
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  for(const s of G.stars){ ctx.globalAlpha = 0.3 + s.s*0.3; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  if(G.running || G.over){
    drawHUD();
    for(const it of G.items) drawItem(it);
    // particles
    for(const pt of G.particles){
      ctx.globalAlpha = Math.max(0,pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
    }
    ctx.globalAlpha = 1;
    drawPlayer(P1); drawPlayer(P2);

    if(G.flash > 0){
      ctx.fillStyle = 'rgba(255,60,90,' + (G.flash*0.3) + ')';
      ctx.fillRect(-20,-20,W+40,H+40);
    }
  }
  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(50, now - last);
  last = now;
  if(G.running) update(dt);
  draw();
  requestAnimationFrame(loop);
}
buildStars();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
