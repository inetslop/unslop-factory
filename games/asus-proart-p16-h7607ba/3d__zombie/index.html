<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOMBIE ZONE 3D</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;}
  #game{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair;}
  .overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,5,.88);color:#9f9;z-index:10;text-align:center;}
  .hidden{display:none;}
  h1{font-size:min(9vw,64px);margin:0 0 10px;color:#7cfc00;text-shadow:0 0 20px #3a5f00,3px 3px 0 #1a2f00;letter-spacing:4px;}
  .sub{color:#6a8;font-size:min(4vw,18px);margin-bottom:24px;}
  .box{border:2px solid #3a5;border-radius:8px;padding:16px 28px;background:rgba(0,20,0,.5);color:#cfc;line-height:1.9;font-size:min(3.4vw,16px);}
  .key{color:#ff6;display:inline-block;min-width:70px;text-align:right;}
  .startbtn{margin-top:28px;font-size:min(5vw,24px);color:#fff;background:#2a4;border:3px solid #7cfc00;padding:12px 40px;border-radius:6px;cursor:pointer;letter-spacing:2px;}
  .startbtn:hover{background:#3b6;}
  .big{font-size:min(8vw,52px);color:#f44;text-shadow:0 0 18px #900;margin-bottom:14px;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>ZOMBIE ZONE 3D</h1>
  <div class="sub">The horde is hungry. How long can you last?</div>
  <div class="box">
    <div><span class="key">W A S D</span> Move</div>
    <div><span class="key">Mouse / &larr; &rarr;</span> Turn (click to lock mouse)</div>
    <div><span class="key">Click / Space</span> Shoot</div>
    <div><span class="key">R</span> Reload</div>
  </div>
  <button id="startBtn" class="startbtn">ENTER THE ZONE</button>
  <div class="sub" style="margin-top:18px">Best score: <span id="bestStart">0</span></div>
</div>

<div id="overScreen" class="overlay hidden">
  <div class="big">YOU DIED</div>
  <div class="box">
    <div>Kills: <span id="finalKills" style="color:#ff6">0</span></div>
    <div>Waves survived: <span id="finalWave" style="color:#ff6">0</span></div>
    <div>Score: <span id="finalScore" style="color:#7f7">0</span></div>
    <div style="margin-top:8px;color:#8a8">Best: <span id="bestOver">0</span></div>
  </div>
  <button id="restartBtn" class="startbtn">RESPAWN (ENTER)</button>
</div>

<script>
(function(){
"use strict";

/* ---------- setup ---------- */
const canvas = document.getElementById('game');
const g = canvas.getContext('2d');
let BW=640, BH=360;           // internal render resolution
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  BH=Math.max(220,Math.min(480,Math.round(BW*h/w)));
  canvas.width=BW;canvas.height=BH;
  zbuf=new Float32Array(BW);
}
let zbuf;

/* ---------- map ---------- */
const MAP=[
"1111111111111111",
"1..............1",
"1.22..11....22.1",
"1.22..........21",
"1....1...33...21",
"1..............1",
"1.33....11.....1",
"1....22...22...1",
"1........33....1",
"1.11..........11",
"1.1..33...33...1",
"1..............1",
"1.22......11...1",
"1....11.........1".slice(0,16),
"1..............1",
"1111111111111111"];
const MW=16,MH=16;
function cell(x,y){ if(x<0||y<0||x>=MW||y>=MH)return 1; return MAP[y|0][x|0]==='.'?0:MAP[y|0][x|0]|0; }

/* ---------- audio ---------- */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(freq,dur,type,vol,slide){ const a=audio();if(!a)return; const o=a.createOscillator(),gn=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),a.currentTime+dur);
  gn.gain.setValueAtTime(vol,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+dur+.02);}
function noiseBurst(dur,vol,filt){ const a=audio();if(!a)return; const n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;
  const gn=a.createGain();gn.gain.value=vol;s.connect(f).connect(gn).connect(a.destination);s.start();}
function sfxShoot(){noiseBurst(.18,.5,2400);tone(140,.12,'square',.25,-90);}
function sfxDry(){tone(300,.06,'square',.15,-100);}
function sfxZHit(){tone(90,.15,'sawtooth',.3,40);noiseBurst(.08,.2,900);}
function sfxGroan(d){const a=audio();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),l=a.createOscillator(),lg=a.createGain();
  o.type='sawtooth';o.frequency.value=60+Math.random()*40;l.type='sine';l.frequency.value=3+Math.random()*3;lg.gain.value=15;
  l.connect(lg).connect(o.frequency);gn.gain.setValueAtTime(.0001,a.currentTime);
  gn.gain.exponentialRampToValueAtTime(.06/Math.max(1,d),a.currentTime+.1);
  gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur||.7);
  o.connect(gn).connect(a.destination);o.start();l.start();const t=dur||.7;o.stop(a.currentTime+t+.05);l.stop(a.currentTime+t+.05);}
function sfxHurt(){tone(220,.3,'sawtooth',.3,-160);}
function sfxReload(){tone(500,.08,'square',.15);setTimeout(()=>tone(700,.08,'square',.15),150);}
function sfxWave(){tone(200,.4,'triangle',.2,120);}

/* ---------- zombie sprite (procedural) ---------- */
const zCan=document.createElement('canvas');zCan.width=96;zCan.height=140;
(function(){ const c=zCan.getContext('2d');
  c.strokeStyle='#1c2b12';c.lineWidth=3;
  // legs
  c.fillStyle='#3c5a28';
  c.fillRect(30,92,14,44);c.strokeRect(30,92,14,44);
  c.fillRect(52,92,14,44);c.strokeRect(52,92,14,44);
  c.fillStyle='#241f16';c.fillRect(28,130,18,10);c.fillRect(50,130,18,10); // boots
  // torso
  c.fillStyle='#4a7031';c.fillRect(24,44,48,52);c.strokeRect(24,44,48,52);
  c.fillStyle='#5d2b1e';c.fillRect(34,56,12,10);c.fillRect(52,72,14,8); // wounds
  // arms outstretched
  c.fillStyle='#4a7031';
  c.fillRect(2,52,26,13);c.strokeRect(2,52,26,13);
  c.fillRect(68,50,26,13);c.strokeRect(68,50,26,13);
  c.fillStyle='#5f8a40';c.beginPath();c.arc(4,58,7,0,7);c.fill();c.stroke();
  c.beginPath();c.arc(92,56,7,0,7);c.fill();c.stroke();
  // head
  c.fillStyle='#6d9a4b';c.beginPath();c.arc(48,26,19,0,7);c.fill();c.stroke();
  c.fillStyle='#111';c.beginPath();c.arc(41,23,4,0,7);c.fill();c.beginPath();c.arc(56,23,4,0,7);c.fill();
  c.fillStyle='#f33';c.beginPath();c.arc(41,23,1.8,0,7);c.fill();c.beginPath();c.arc(56,23,1.8,0,7);c.fill();
  c.fillStyle='#2a0d08';c.fillRect(40,34,16,6); // mouth
})();

/* ---------- game state ---------- */
const G={state:'start',score:0,kills:0,wave:0,waveMsgT:0,best:0};
try{G.best=+localStorage.getItem('zzone_best')||0;}catch(e){}
let P,zombies,reloading,reloadT,shootCd,muzzle,gunKick,dmgFlash,time=0;

function reset(){
  P={x:8,y:8,a:0,hp:100,ammo:8,bob:0};
  zombies=[];reloading=false;reloadT=0;shootCd=0;muzzle=0;gunKick=0;dmgFlash=0;
  G.score=0;G.kills=0;G.wave=0;G.waveMsgT=0;
  nextWave();
}
function spawnZombie(){
  for(let t=0;t<80;t++){
    const x=1+Math.random()*(MW-2),y=1+Math.random()*(MH-2);
    if(cell(x,y))continue;
    const d=Math.hypot(x-P.x,y-P.y);
    if(d<7)continue;
    zombies.push({x:x+.5,y:y+.5,hp:30+(G.wave*4),sp:1.1+Math.random()*.5+G.wave*.06,atk:0,ph:Math.random()*7,dead:0,groanT:1+Math.random()*4});
    return;
  }
}
function nextWave(){
  G.wave++;G.waveMsgT=2.5;sfxWave();
  const n=3+G.wave*2;
  for(let i=0;i<n;i++)spawnZombie();
}

/* ---------- input ---------- */
const keys={};
window.addEventListener('keydown',e=>{
  audio();
  keys[e.code]=true;
  if(e.code==='Enter'){
    if(G.state==='start'||G.state==='over')startGame();
  }
  if(e.code==='KeyR'&&G.state==='play')tryReload();
  if(e.code==='Space'){e.preventDefault();if(G.state==='play')shoot();}
});
window.addEventListener('keyup',e=>keys[e.code]=false);

canvas.addEventListener('click',()=>{
  audio();
  if(G.state!=='play')return;
  canvas.requestPointerLock&&canvas.requestPointerLock();
  shoot();
});
document.addEventListener('pointerlockchange',()=>{});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===canvas)P.a+=e.movementX*.0026;
});

function startGame(){
  audio();reset();G.state='play';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('restartBtn').addEventListener('click',startGame);

function gameOver(){
  G.state='over';
  if(document.pointerLockElement)document.exitPointerLock();
  if(G.score>G.best){G.best=G.score;try{localStorage.setItem('zzone_best',G.best);}catch(e){}}
  document.getElementById('finalKills').textContent=G.kills;
  document.getElementById('finalWave').textContent=G.wave;
  document.getElementById('finalScore').textContent=G.score;
  document.getElementById('bestOver').textContent=G.best;
  document.getElementById('overScreen').classList.remove('hidden');
}

/* ---------- combat ---------- */
function tryReload(){ if(reloading||P.ammo>=8)return; reloading=true;reloadT=1.2;sfxReload(); }
function shoot(){
  if(shootCd>0)return;
  if(P.ammo<=0){sfxDry();shootCd=.3;tryReload();return;}
  P.ammo--;shootCd=.28;muzzle=.07;gunKick=1;sfxShoot();
  // hitscan
  const dx=Math.cos(P.a),dy=Math.sin(P.a);
  let wallD=castDist(P.x,P.y,dx,dy);
  let best=null,bestD=1e9;
  for(const z of zombies){
    if(z.dead>0)continue;
    const rx=z.x-P.x,ry=z.y-P.y,proj=rx*dx+ry*dy;
    if(proj<.3||proj>wallD+.2)continue;
    const perp=Math.abs(rx*dy-ry*dx);
    if(perp<.42&&proj<bestD){bestD=proj;best=z;}
  }
  if(best){
    best.hp-=34;sfxZHit();
    if(best.hp<=0){best.dead=.01;G.kills++;G.score+=100+G.wave*10;tone(60,.5,'sawtooth',.25,30);}
  }
}
function castDist(px,py,dx,dy){ // DDA wall distance along dir
  let mx=px|0,my=py|0;
  const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy);
  let sx,sy,sdx,sdy;
  if(dx<0){sx=-1;sdx=(px-mx)*ddx;}else{sx=1;sdx=(mx+1-px)*ddx;}
  if(dy<0){sy=-1;sdy=(py-my)*ddy;}else{sy=1;sdy=(my+1-py)*ddy;}
  for(let i=0;i<64;i++){
    if(sdx<sdy){mx+=sx;sdx+=ddx;}else{my+=sy;sdy+=ddy;}
    if(cell(mx,my))return sdx<sdy?sdx-ddx:sdy-ddy;
  }
  return 64;
}

/* ---------- update ---------- */
function canStand(x,y){ const r=.25;
  return !cell(x-r,y-r)&&!cell(x+r,y-r)&&!cell(x-r,y+r)&&!cell(x+r,y+r); }

function update(dt){
  time+=dt;
  if(G.state!=='play')return;

  // movement
  const sp=3.4*dt;let mx=0,my=0;
  const ca=Math.cos(P.a),sa=Math.sin(P.a);
  if(keys['KeyW']){mx+=ca;my+=sa;}
  if(keys['KeyS']){mx-=ca;my-=sa;}
  if(keys['KeyA']){mx+=sa;my-=ca;}
  if(keys['KeyD']){mx-=sa;my+=ca;}
  const ml=Math.hypot(mx,my);
  if(ml>0){mx/=ml;my/=ml;if(canStand(P.x+mx*sp,P.y))P.x+=mx*sp;if(canStand(P.x,P.y+my*sp))P.y+=my*sp;P.bob+=dt*9;}
  const turn=(keys['ArrowLeft']?-1:0)+(keys['ArrowRight']?1:0);
  P.a+=turn*2.6*dt;

  shootCd-=dt;muzzle-=dt;gunKick*=Math.pow(.001,dt);dmgFlash=Math.max(0,dmgFlash-dt*2.5);G.waveMsgT-=dt;
  if(reloading){reloadT-=dt;if(reloadT<=0){reloading=false;P.ammo=8;}}

  // zombies
  for(const z of zombies){
    if(z.dead>0){z.dead+=dt;continue;}
    const rx=P.x-z.x,ry=P.y-z.y,d=Math.hypot(rx,ry);
    z.ph+=dt*z.sp*4;
    if(d>.65){
      const vx=rx/d*z.sp*dt,vy=ry/d*z.sp*dt;
      // slide around walls + other zombies
      let ox=0,oy=0;
      for(const o of zombies){ if(o===z||o.dead>0)continue;const dx=z.x-o.x,dy=z.y-o.y,dd=Math.hypot(dx,dy);if(dd<.5&&dd>0){ox+=dx/dd*.3;oy+=dy/dd*.3;} }
      const nx=z.x+vx+ox*dt,ny=z.y+vy+oy*dt;
      if(canStand(nx,z.y))z.x=nx; else z.x+=Math.sign(ox||rx)*.1*dt*10*(canStand(z.x+.1*Math.sign(rx),z.y)?1:0);
      if(canStand(z.x,ny))z.y=ny;
    }else{
      z.atk-=dt;
      if(z.atk<=0){z.atk=.9;P.hp-=7+G.wave;dmgFlash=1;sfxHurt();}
    }
    z.groanT-=dt;
    if(z.groanT<=0&&d<12){sfxGroan(d);z.groanT=3+Math.random()*5;}
  }
  // cleanup dead
  zombies=zombies.filter(z=>!(z.dead>1.4));

  if(P.hp<=0){P.hp=0;gameOver();return;}
  if(zombies.length===0&&G.waveMsgT<=0)nextWave();
}

/* ---------- render ---------- */
function shade(col,f){return 'rgb('+(col[0]*f|0)+','+(col[1]*f|0)+','+(col[2]*f|0)+')';}
const WALLCOL={1:[86,92,80],2:[70,58,48],3:[60,64,78]};

function render(){
  g.imageSmoothingEnabled=false;
  // ceiling / floor
  let grad=g.createLinearGradient(0,0,0,BH/2);grad.addColorStop(0,'#1a2016');grad.addColorStop(1,'#050705');
  g.fillStyle=grad;g.fillRect(0,0,BW,BH/2);
  grad=g.createLinearGradient(0,BH/2,0,BH);grad.addColorStop(0,'#0a0c08');grad.addColorStop(1,'#3a3d33');
  g.fillStyle=grad;g.fillRect(0,BH/2,BW,BH/2);

  // walls
  const dirX=Math.cos(P.a),dirY=Math.sin(P.a);
  const plX=-dirY*.7,plY=dirX*.7;
  for(let x=0;x<BW;x++){
    const camX=2*x/BW-1;
    const rdx=dirX+plX*camX,rdy=dirY+plY*camX;
    let mx=P.x|0,my=P.y|0;
    const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let sx,sy,sdx,sdy,side=0;
    if(rdx<0){sx=-1;sdx=(P.x-mx)*ddx;}else{sx=1;sdx=(mx+1-P.x)*ddx;}
    if(rdy<0){sy=-1;sdy=(P.y-my)*ddy;}else{sy=1;sdy=(my+1-P.y)*ddy;}
    let hit=0;
    for(let i=0;i<64&&!hit;i++){
      if(sdx<sdy){mx+=sx;sdx+=ddx;side=0;}else{my+=sy;sdy+=ddy;side=1;}
      hit=cell(mx,my);
    }
    const dist=Math.max(.02,(side? sdy-ddy : sdx-ddx));
    zbuf[x]=dist;
    const lh=BH/dist;
    const y0=(BH-lh)/2;
    const c=WALLCOL[hit]||WALLCOL[1];
    let f=Math.max(.12,1-dist/13)*(side?.7:1);
    g.fillStyle=shade(c,f);
    g.fillRect(x,y0,1,lh);
  }

  // sprites far -> near
  const list=zombies.map(z=>({z,d:(z.x-P.x)**2+(z.y-P.y)**2})).sort((a,b)=>b.d-a.d);
  for(const it of list){
    const z=it.z;
    const rx=z.x-P.x,ry=z.y-P.y;
    const inv=1/(plX*dirY-dirX*plY);
    const tx=inv*(dirY*rx-dirX*ry), ty=inv*(-plY*rx+plX*ry);
    if(ty<=.05)continue;
    const sx=(BW/2)*(1+tx/ty);
    const h=BH/ty*.86, w=h*(zCan.width/zCan.height);
    let bob=0;
    if(z.dead>0){bob=h*z.dead*1.4;}
    else bob=Math.sin(z.ph)*h*.02;
    const x0=sx-w/2,y0=(BH-h)/2+h*.07+bob;
    const alpha=z.dead>0?Math.max(0,1-z.dead/.8):1;
    if(alpha<=0)continue;
    g.globalAlpha=alpha;
    const strip=3,sw=zCan.width/strip;
    for(let s=0;s<strip;s++){
      const dx0=Math.floor(x0+w*s/strip),dx1=Math.floor(x0+w*(s+1)/strip);
      let drawn=false;
      for(let x=Math.max(0,dx0);x<Math.min(BW,dx1);x+=2){ if(zbuf[x]>ty){drawn=true;break;} }
      if(drawn)g.drawImage(zCan,sw*s,0,sw,zCan.height,dx0,y0,dx1-dx0+1,h);
    }
    g.globalAlpha=1;
  }

  // gun
  const gx=BW/2+Math.sin(P.bob)*8, gy=BH-70+Math.abs(Math.cos(P.bob))*6+gunKick*22;
  drawGun(gx,gy);
  if(muzzle>0){
    g.fillStyle='rgba(255,230,120,.9)';
    const fr=14+Math.random()*10;
    g.beginPath();g.arc(gx,gy-8,fr,0,7);g.fill();
    g.fillStyle='rgba(255,255,255,.9)';
    g.beginPath();g.arc(gx,gy-8,fr*.45,0,7);g.fill();
  }

  // crosshair
  g.strokeStyle=reloading?'#f80':'#fff';g.lineWidth=2;
  const cx=BW/2,cy=BH/2,cl=6+gunKick*10;
  g.beginPath();g.moveTo(cx-cl,cy);g.lineTo(cx-2,cy);g.moveTo(cx+2,cy);g.lineTo(cx+cl,cy);
  g.moveTo(cx,cy-cl);g.lineTo(cx,cy-2);g.moveTo(cx,cy+2);g.lineTo(cx,cy+cl);g.stroke();

  // HUD
  g.font='bold 16px Courier New';g.textBaseline='top';
  // health bar
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(14,BH-34,170,22);
  g.fillStyle=P.hp>30?'#4c4':'#f44';
  g.fillRect(16,BH-32,166*Math.max(0,P.hp)/100,18);
  g.strokeStyle='#8a8';g.strokeRect(14.5,BH-33.5,169,21);
  g.fillStyle='#fff';g.fillText('HP '+Math.ceil(P.hp),20,BH-30);
  // ammo
  g.font='bold 20px Courier New';g.textAlign='right';
  if(reloading){g.fillStyle='#fc6';g.fillText('RELOADING...',BW-14,BH-58);}
  else{g.fillStyle=P.ammo>2?'#fff':'#f55';g.fillText(P.ammo+' / 8',BW-14,BH-58);g.font='12px Courier New';g.fillStyle='#9a9';g.fillText('[R] RELOAD',BW-14,BH-36);}
  g.textAlign='left';g.font='bold 16px Courier New';
  g.fillStyle='#7cfc00';g.fillText('WAVE '+G.wave,14,12);
  g.fillStyle='#ff6';g.fillText('SCORE '+G.score,14,32);
  g.fillStyle='#f88';g.fillText('KILLS '+G.kills,150,32);

  if(G.waveMsgT>0){
    g.globalAlpha=Math.min(1,G.waveMsgT);
    g.font='bold 34px Courier New';g.textAlign='center';
    g.fillStyle='#f44';g.fillText('WAVE '+G.wave,BW/2,BH*.28);
    g.font='14px Courier New';g.fillStyle='#ccc';g.fillText('The dead are coming...',BW/2,BH*.28+36);
    g.textAlign='left';g.globalAlpha=1;
  }
  if(dmgFlash>0){g.fillStyle='rgba(200,0,0,'+(dmgFlash*.35)+')';g.fillRect(0,0,BW,BH);}
}

function drawGun(x,y){
  g.save();g.translate(x,y);
  g.fillStyle='#2b2f33';
  g.fillRect(-16,-58,32,70);          // barrel
  g.fillStyle='#1c1f22';g.fillRect(-19,-62,38,12); // top
  g.fillStyle='#4a3320';g.fillRect(-26,6,52,42);   // grip
  g.fillStyle='#5d4428';g.fillRect(-26,6,52,10);
  g.fillStyle='#777';g.fillRect(-3,-58,6,40);       // sight line
  g.restore();
}

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render();
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize();
document.getElementById('bestStart').textContent=G.best;
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
