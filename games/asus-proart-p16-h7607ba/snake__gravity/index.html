<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Snake</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0e1a; font-family:'Segoe UI',Arial,sans-serif; }
  #wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(8,10,24,.82); color:#eaf0ff; z-index:5;
  }
  .hidden { display:none; }
  h1 {
    font-size:clamp(36px,7vw,72px); letter-spacing:.06em; margin-bottom:10px;
    background:linear-gradient(90deg,#4ef0c0,#58b6ff,#b07bff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub { font-size:clamp(14px,2vw,20px); color:#9fb3d9; margin-bottom:24px; }
  .keys {
    display:grid; grid-template-columns:auto auto; gap:6px 18px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    padding:16px 24px; border-radius:12px; margin-bottom:28px; font-size:15px;
  }
  .keys b { color:#4ef0c0; text-align:right; font-family:monospace; }
  button {
    font-size:clamp(16px,2.4vw,22px); padding:12px 36px; border:none; cursor:pointer;
    border-radius:999px; color:#081018; font-weight:700; letter-spacing:.05em;
    background:linear-gradient(90deg,#4ef0c0,#58b6ff);
    box-shadow:0 0 24px rgba(88,182,255,.45); transition:transform .12s;
  }
  button:hover { transform:scale(1.06); }
  #finalScore { font-size:clamp(20px,3vw,30px); color:#ffd76b; margin-bottom:8px; }
  #hiLine { color:#9fb3d9; margin-bottom:24px; }
  #hud {
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:10px 16px; z-index:4; pointer-events:none; color:#eaf0ff;
    font-size:clamp(13px,1.8vw,18px); text-shadow:0 2px 6px #000;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden">
    <span id="scoreTxt">Score: 0</span>
    <span id="hiTxt">Best: 0</span>
  </div>

  <div id="startScreen" class="overlay">
    <h1>GRAVITY SNAKE</h1>
    <div class="sub">Your snake is pulled by gravity. Steer the world, not the snake!</div>
    <div class="keys">
      <b>&larr; &uarr; &darr; &rarr;</b><span>Change gravity direction</span>
      <b>W A S D</b><span>Also change gravity</span>
      <b>R</b><span>Restart game</span>
    </div>
    <button id="startBtn">START</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <div id="finalScore">Score: 0</div>
    <div id="hiLine">Best: 0</div>
    <button id="restartBtn">PLAY AGAIN &nbsp;(R)</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var COLS = 20, ROWS = 20;
  var cell = 30, offX = 0, offY = 0;

  var snake, dir, food, score, best, alive, started, tickMs, lastTick, pulse;
  try { best = parseInt(localStorage.getItem('gravSnakeBest')||'0',10)||0; } catch(e){ best = 0; }

  var elScore=document.getElementById('scoreTxt'), elHi=document.getElementById('hiTxt');
  var startScreen=document.getElementById('startScreen'), overScreen=document.getElementById('overScreen');
  var finalScore=document.getElementById('finalScore'), hiLine=document.getElementById('hiLine');
  var hud=document.getElementById('hud');

  // ---------- audio ----------
  var AC=null;
  function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function beep(freq,dur,type,vol,slideTo){
    var ac=audio(); if(!ac) return;
    var o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur);
  }

  // ---------- layout ----------
  function resize(){
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    cell = Math.floor(Math.min(cv.width, cv.height)/COLS / 2)*2 || 20;
    offX = Math.floor((cv.width - COLS*cell)/2);
    offY = Math.floor((cv.height - ROWS*cell)/2);
  }
  window.addEventListener('resize', resize);

  // ---------- game ----------
  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:0,y:1}; // gravity points down at start
    score=0; alive=true; tickMs=170; pulse=0;
    spawnFood();
    updateHud();
  }
  function spawnFood(){
    var tries=0;
    do{
      food={x:(Math.random()*COLS)|0, y:(Math.random()*ROWS)|0};
      tries++;
    } while(tries<500 && snake.some(function(s){return s.x===food.x&&s.y===food.y;}));
  }
  function updateHud(){
    elScore.textContent='Score: '+score;
    elHi.textContent='Best: '+best;
  }
  function step(){
    var nx=snake[0].x+dir.x, ny=snake[0].y+dir.y;
    if(nx<0||ny<0||nx>=COLS||ny>=ROWS) return die();
    var willGrow = (nx===food.x && ny===food.y);
    for(var i=0;i<snake.length;i++){
      if((willGrow || i<snake.length-1) && snake[i].x===nx && snake[i].y===ny) return die();
    }
    snake.unshift({x:nx,y:ny});
    if(willGrow){
      score++;
      beep(520,0.09,'square',0.18,880);
      spawnFood();
      if(score%5===0 && tickMs>80) tickMs-=6;
      updateHud();
    } else {
      snake.pop();
    }
  }
  function die(){
    alive=false;
    beep(160,0.4,'sawtooth',0.22,50);
    if(score>best){ best=score; try{ localStorage.setItem('gravSnakeBest',''+best); }catch(e){} }
    finalScore.textContent='Score: '+score;
    hiLine.textContent='Best: '+best;
    setTimeout(function(){ overScreen.classList.remove('hidden'); }, 350);
  }
  function startGame(){
    audio();
    reset();
    started=true; alive=true;
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    lastTick=performance.now();
    beep(300,0.1,'triangle',0.12,600);
  }

  // ---------- input ----------
  function setDir(x,y){
    if(!started||!alive) return;
    if(dir.x===x&&dir.y===y) return;
    dir.x=x; dir.y=y;
    beep(240,0.05,'triangle',0.08);
  }
  window.addEventListener('keydown', function(e){
    var k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w'){ setDir(0,-1); e.preventDefault(); }
    else if(k==='arrowdown'||k==='s'){ setDir(0,1); e.preventDefault(); }
    else if(k==='arrowleft'||k==='a'){ setDir(-1,0); e.preventDefault(); }
    else if(k==='arrowright'||k==='d'){ setDir(1,0); e.preventDefault(); }
    else if(k==='r'){ startGame(); }
    else if(k===' '||k==='enter'){
      if(!started || !alive){ startGame(); e.preventDefault(); }
    }
  });
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // ---------- render ----------
  function draw(){
    ctx.fillStyle='#0b0e1a';
    ctx.fillRect(0,0,cv.width,cv.height);

    if(!started){ pulse+=0.05; return; }

    // board
    var bx=offX, by=offY, bw=COLS*cell, bh=ROWS*cell;
    ctx.fillStyle='rgba(255,255,255,0.03)';
    ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle='rgba(120,160,255,0.25)';
    ctx.lineWidth=2;
    ctx.strokeRect(bx,by,bw,bh);
    // grid dots
    ctx.fillStyle='rgba(140,170,255,0.10)';
    for(var gx=1;gx<COLS;gx++) for(var gy=1;gy<ROWS;gy++){
      ctx.fillRect(bx+gx*cell-1, by+gy*cell-1, 2, 2);
    }

    // food (pulsing orb)
    pulse+=0.12;
    var fx=bx+(food.x+0.5)*cell, fy=by+(food.y+0.5)*cell;
    var r=cell*0.32*(1+0.15*Math.sin(pulse));
    var grad=ctx.createRadialGradient(fx,fy,1,fx,fy,r*1.8);
    grad.addColorStop(0,'#fff2b0'); grad.addColorStop(0.4,'#ff9d3c'); grad.addColorStop(1,'rgba(255,90,40,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(fx,fy,r*1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffb347';
    ctx.beginPath(); ctx.arc(fx,fy,r,0,Math.PI*2); ctx.fill();

    // snake
    for(var i=snake.length-1;i>=0;i--){
      var s=snake[i];
      var t=i/Math.max(1,snake.length-1);
      var x=bx+s.x*cell+1.5, y=by+s.y*cell+1.5, w=cell-3;
      if(i===0){
        ctx.fillStyle='#4ef0c0';
        ctx.shadowColor='#4ef0c0'; ctx.shadowBlur=14;
      } else {
        var g2=Math.round(240-t*90), b2=Math.round(192+t*63);
        ctx.fillStyle='rgb('+Math.round(78-t*30)+','+g2+','+b2+')';
        ctx.shadowBlur=0;
      }
      roundRect(x,y,w,w, i===0?cell*0.35:cell*0.28);
    }
    ctx.shadowBlur=0;

    // eyes on head facing gravity dir
    var h=snake[0], hx=bx+(h.x+0.5)*cell, hy=by+(h.y+0.5)*cell;
    var ex=dir.x*cell*0.16, ey=dir.y*cell*0.16;
    var px=-dir.y*cell*0.18, py=dir.x*cell*0.18;
    ctx.fillStyle='#081018';
    ctx.beginPath(); ctx.arc(hx+ex+px, hy+ey+py, cell*0.09, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+ex-px, hy+ey-py, cell*0.09, 0, Math.PI*2); ctx.fill();

    // gravity indicator (corner arrow)
    var ix=bx+bw-cell*0.75, iy=by+cell*0.75;
    ctx.save();
    ctx.translate(ix,iy);
    ctx.rotate(Math.atan2(dir.y,dir.x));
    ctx.globalAlpha = alive? 0.85 : 0.3;
    ctx.strokeStyle='#ffd76b'; ctx.fillStyle='#ffd76b'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-cell*0.28,0); ctx.lineTo(cell*0.14,0); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cell*0.3,0); ctx.lineTo(cell*0.1,-cell*0.16); ctx.lineTo(cell*0.1,cell*0.16); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fill();
  }

  // ---------- loop ----------
  function loop(now){
    if(started && alive){
      while(now-lastTick>=tickMs){ lastTick+=tickMs; step(); if(!alive) break; }
    } else {
      lastTick=now;
    }
    draw();
    requestAnimationFrame(loop);
  }

  resize();
  reset(); started=false;
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
