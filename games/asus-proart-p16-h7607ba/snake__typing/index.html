<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Typer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0f1a; font-family:'Courier New', monospace; }
  #game { position:fixed; inset:0; display:block; }
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(7,10,20,.88); color:#e8f4ff; text-align:center; z-index:5; padding:20px;
  }
  .hidden { display:none !important; }
  h1 { font-size:clamp(34px,8vw,72px); letter-spacing:.15em; color:#6ef2a0; text-shadow:0 0 24px rgba(110,242,160,.55); margin-bottom:14px; }
  .sub { font-size:clamp(13px,2.4vw,18px); line-height:1.7; color:#9fb8d8; max-width:560px; margin-bottom:26px; }
  .sub b { color:#ffd166; }
  button {
    font-family:inherit; font-size:clamp(16px,3vw,22px); letter-spacing:.1em; cursor:pointer;
    padding:14px 40px; background:#123524; color:#6ef2a0; border:2px solid #6ef2a0; border-radius:8px;
    transition:all .15s;
  }
  button:hover { background:#6ef2a0; color:#0b0f1a; box-shadow:0 0 24px rgba(110,242,160,.6); }
  .big { font-size:clamp(28px,6vw,54px); color:#ff6b6b; letter-spacing:.1em; margin-bottom:16px; text-shadow:0 0 20px rgba(255,107,107,.5); }
  .score-line { font-size:clamp(16px,3vw,24px); color:#e8f4ff; margin:6px 0; }
  .score-line span { color:#ffd166; }
  #overScreen h2 { font-size:clamp(30px,6vw,56px); color:#ff6b6b; letter-spacing:.15em; margin-bottom:18px; text-shadow:0 0 24px rgba(255,107,107,.5); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>SNAKE TYPER</h1>
  <div class="sub">
    A word appears at the fruit. <b>TYPE THE WORD</b> to charge the fruit —<br>
    charged fruit is worth <b>10 pts</b> and extra growth.<br><br>
    <b>Arrows / WASD</b> — steer the snake &nbsp;·&nbsp; <b>A–Z</b> — type the word<br>
    Wrong letter costs a life. Don't hit walls or yourself!
  </div>
  <button id="startBtn">START &nbsp;(SPACE)</button>
</div>

<div id="overScreen" class="overlay hidden">
  <h2>GAME OVER</h2>
  <div class="score-line">Score: <span id="finalScore">0</span></div>
  <div class="score-line">High Score: <span id="finalHigh">0</span></div>
  <br>
  <button id="restartBtn">RESTART &nbsp;(SPACE)</button>
</div>

<script>
(function(){
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');
const finalScoreEl = document.getElementById('finalScore');
const finalHighEl = document.getElementById('finalHigh');

const COLS = 24, ROWS = 16;
let cell = 30, offX = 0, offY = 50; // HUD bar at top

function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const hudH = 56;
  cell = Math.floor(Math.min(window.innerWidth / COLS, (window.innerHeight - hudH) / ROWS));
  offX = Math.floor((window.innerWidth - cell*COLS)/2);
  offY = hudH + Math.floor((window.innerHeight - hudH - cell*ROWS)/2);
}
window.addEventListener('resize', resize);
resize();

const WORDS = ["SNAKE","APPLE","TYPING","PYTHON","CIPHER","KEYBOARD","PIXEL","GARDEN","FROST","BLAZE","COMET","DRAGON","EMERALD","FALCON","GLACIER","HARBOR","JUNGLE","KITTEN","LIGHTNING","MAPLE","NEBULA","ORCHID","PUZZLE","QUARTZ","RIVER","SILVER","THUNDER","UNICORN","VELVET","WIZARD","YARROW","ZEPHYR","COCOA","MANGO","PANDA","ROCKET","STORM","TRUFFLE","BUBBLE","CHERRY","DIAMOND","EAGLE","FIREWORK","GALAXY","HONEY","JELLY","KNIGHT","LEMON","MOONBEAM","NUTMEG","OCEAN","PEARL","RUBY","SPARKLE","TURTLE","VINE","WILLOW","ZEBRA"];

let state = 'start';
let snake, dir, dirQueue, food, word, typed, charged, score, lives, highScore=0, tickInterval, lastTick, grow, flashTimer, pulse;

try { highScore = parseInt(localStorage.getItem('snakeTyperHigh')||'0',10)||0; } catch(e){}

function saveHigh(){ try{ localStorage.setItem('snakeTyperHigh', String(highScore)); }catch(e){} }

/* ---------- Audio (created on first input) ---------- */
let actx = null;
function audio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol, delay){
  if(!actx) return;
  const t = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
const sfx = {
  eat(){ beep(520,.09,'square',.12); beep(780,.1,'square',.1,.06); },
  charged(){ [440,660,880].forEach((f,i)=>beep(f,.12,'triangle',.14,i*.07)); },
  chargeEat(){ [523,659,784,1046].forEach((f,i)=>beep(f,.12,'square',.13,i*.06)); },
  wrong(){ beep(140,.22,'sawtooth',.16); },
  over(){ [400,300,220,140].forEach((f,i)=>beep(f,.22,'sawtooth',.15,i*.16)); }
};

/* ---------- Game setup ---------- */
function pickWord(){
  let w;
  do { w = WORDS[Math.floor(Math.random()*WORDS.length)]; } while(w === word);
  return w;
}
function freeCell(){
  let c, tries=0;
  do{
    c = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
    tries++;
  } while(tries < 500 && (snake.some(s=>s.x===c.x&&s.y===c.y) || (food && food.x===c.x&&food.y===c.y)));
  return c;
}
function startGame(){
  snake = [{x:6,y:8},{x:5,y:8},{x:4,y:8}];
  dir = {x:1,y:0}; dirQueue = [];
  food = freeCell();
  word = pickWord(); typed = 0; charged = false;
  score = 0; lives = 3; grow = 0; flashTimer = 0; pulse = 0;
  tickInterval = 150; lastTick = performance.now();
  state = 'playing';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
}

function gameOver(){
  state = 'over';
  sfx.over();
  if(score > highScore){ highScore = score; saveHigh(); }
  finalScoreEl.textContent = score;
  finalHighEl.textContent = highScore;
  overScreen.classList.remove('hidden');
}

/* ---------- Input ---------- */
const DIRS = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
  W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0}
};

window.addEventListener('keydown', function(e){
  audio();
  const k = e.key;
  if(k === ' ' || k === 'Enter'){
    e.preventDefault();
    if(state !== 'playing') startGame();
    return;
  }
  if(state !== 'playing') return;

  if(DIRS[k]){
    e.preventDefault();
    const d = DIRS[k];
    const last = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
    if((d.x !== -last.x || d.y !== -last.y) && (d.x !== last.x || d.y !== last.y)){
      if(dirQueue.length < 3) dirQueue.push(d);
    }
    return;
  }

  if(/^[a-zA-Z]$/.test(k)){
    const ch = k.toLowerCase();
    if(ch === word[typed].toLowerCase()){
      typed++;
      beep(300 + typed*60, .05, 'sine', .08);
      if(typed >= word.length){
        charged = true;
        sfx.charged();
        pulse = 1;
      }
    } else {
      lives--;
      flashTimer = 1;
      sfx.wrong();
      typed = 0;
      if(lives <= 0) gameOver();
    }
  }
});

document.getElementById('startBtn').addEventListener('click', function(){ audio(); startGame(); });
document.getElementById('restartBtn').addEventListener('click', function(){ audio(); startGame(); });

/* ---------- Update ---------- */
function tick(now){
  if(dirQueue.length) dir = dirQueue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if(head.x<0 || head.y<0 || head.x>=COLS || head.y>=ROWS ||
     snake.some(s=>s.x===head.x && s.y===head.y)){
    gameOver(); return;
  }
  snake.unshift(head);

  if(head.x === food.x && head.y === food.y){
    if(charged){ score += 10; grow += 2; sfx.chargeEat(); }
    else { score += 1; grow += 1; sfx.eat(); }
    tickInterval = Math.max(62, 150 - score*3);
    food = freeCell();
    word = pickWord(); typed = 0; charged = false;
  }

  if(grow > 0) grow--;
  else snake.pop();
}

/* ---------- Render ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(now){
  const W = window.innerWidth, H = window.innerHeight;
  ctx.clearRect(0,0,W,H);

  // board bg
  ctx.fillStyle = '#101828';
  rr(offX-4, offY-4, cell*COLS+8, cell*ROWS+8, 8); ctx.fill();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if((x+y)%2===0){ ctx.fillStyle='rgba(255,255,255,.018)'; ctx.fillRect(offX+x*cell, offY+y*cell, cell, cell); }
  }

  // food
  const fx = offX + food.x*cell + cell/2, fy = offY + food.y*cell + cell/2;
  if(charged){
    const g = ctx.createRadialGradient(fx,fy,2,fx,fy,cell*1.4);
    g.addColorStop(0,'rgba(255,209,102,.85)');
    g.addColorStop(1,'rgba(255,209,102,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(fx,fy,cell*1.4,0,Math.PI*2); ctx.fill();
  }
  const bob = Math.sin(now/300)*2;
  ctx.fillStyle = charged ? '#ffd166' : '#ff5d5d';
  ctx.beginPath(); ctx.arc(fx, fy+bob, cell*0.34, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(fx, fy+bob-cell*0.3); ctx.lineTo(fx+cell*0.12, fy+bob-cell*0.5); ctx.stroke();
  ctx.fillStyle = '#6ef2a0';
  ctx.beginPath(); ctx.ellipse(fx+cell*0.18, fy+bob-cell*0.48, cell*0.13, cell*0.07, -0.5, 0, Math.PI*2); ctx.fill();

  // snake
  for(let i=snake.length-1;i>=0;i--){
    const s = snake[i];
    const t = i/snake.length;
    const rC = Math.round(110 - 60*t), gC = Math.round(242 - 130*t), bC = Math.round(160 - 90*t);
    ctx.fillStyle = `rgb(${rC},${gC},${bC})`;
    rr(offX+s.x*cell+1.5, offY+s.y*cell+1.5, cell-3, cell-3, i===0 ? 7 : 5);
    ctx.fill();
  }
  // eyes
  const h = snake[0];
  const ex = offX+h.x*cell + cell/2, ey = offY+h.y*cell + cell/2;
  const px = -dir.y, py = dir.x;
  ctx.fillStyle = '#0b0f1a';
  [[1,-1],[1,1]].forEach(function(off){
    const ox = ex + dir.x*cell*0.16 + px*off[0]*cell*0.18;
    const oy = ey + dir.y*cell*0.16 + py*off[0]*cell*0.18;
    ctx.beginPath(); ctx.arc(ox, oy, cell*0.09, 0, Math.PI*2); ctx.fill();
  });

  // HUD bar
  ctx.fillStyle = '#0d1322';
  ctx.fillRect(0,0,W,offY-8 > 56 ? offY-8 : 56);
  const hudH = Math.min(offY-8, 56);

  ctx.textBaseline = 'middle';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillStyle = '#9fb8d8';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 16, hudH/2);

  ctx.textAlign = 'right';
  let hearts = '';
  for(let i=0;i<3;i++) hearts += i < lives ? '♥' : '·';
  ctx.fillStyle = '#ff6b6b';
  ctx.font = 'bold 18px "Courier New", monospace';
  ctx.fillText(hearts, W-16, hudH/2 - 9);
  ctx.fillStyle = '#ffd166';
  ctx.font = '12px "Courier New", monospace';
  ctx.fillText('HI ' + Math.max(highScore, score), W-16, hudH/2 + 10);

  // word to type
  ctx.textAlign = 'center';
  ctx.font = 'bold 24px "Courier New", monospace';
  const cx = W/2;
  let xStart = cx - (word.length*16)/2;
  for(let i=0;i<word.length;i++){
    if(i < typed) ctx.fillStyle = '#6ef2a0';
    else if(i === typed) {
      const blink = Math.floor(now/350)%2===0;
      ctx.fillStyle = blink ? '#ffd166' : 'rgba(255,209,102,.35)';
    } else ctx.fillStyle = 'rgba(159,184,216,.4)';
    ctx.fillText(word[i], xStart + i*16, hudH/2);
  }
  if(charged){
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.fillStyle = Math.floor(now/200)%2===0 ? '#ffd166' : 'rgba(255,209,102,.4)';
    ctx.fillText('★ CHARGED — EAT IT FOR 10 PTS ★', cx, hudH - 8 < 0 ? 0 : Math.min(hudH-6, 50));
  }

  // wrong-key flash
  if(flashTimer > 0){
    ctx.fillStyle = `rgba(255,60,60,${flashTimer*0.22})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ---------- Main loop ---------- */
let lastFrame = performance.now();
function loop(now){
  const dt = now - lastFrame;
  lastFrame = now;
  if(flashTimer > 0) flashTimer = Math.max(0, flashTimer - dt/300);
  if(pulse > 0) pulse = Math.max(0, pulse - dt/600);

  if(state === 'playing'){
    if(now - lastTick >= tickInterval){
      lastTick = now;
      tick(now);
    }
  }
  draw(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
