<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Endless</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b0f1a;
    font-family: 'Courier New', monospace;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; background: #0b0f1a; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; color: #e8f5e9;
    background: rgba(8, 12, 24, 0.88);
    z-index: 5;
  }
  .hidden { display: none !important; }
  h1 {
    font-size: clamp(36px, 8vw, 72px);
    margin: 0 0 8px; letter-spacing: 4px;
    color: #4ade80; text-shadow: 0 0 24px rgba(74,222,128,.6);
  }
  .sub { font-size: clamp(13px, 2.2vw, 18px); color: #9fb3c8; margin: 6px 20px; line-height: 1.7; }
  .scoreline { font-size: clamp(18px, 3vw, 28px); color: #facc15; margin: 14px 0; }
  button {
    margin-top: 18px; padding: 12px 34px;
    font-family: inherit; font-size: clamp(16px, 2.4vw, 20px);
    letter-spacing: 2px; cursor: pointer;
    color: #0b0f1a; background: #4ade80; border: none;
    border-radius: 6px; box-shadow: 0 0 18px rgba(74,222,128,.5);
    transition: transform .08s, box-shadow .2s;
  }
  button:hover { transform: scale(1.06); box-shadow: 0 0 30px rgba(74,222,128,.8); }
  #hud {
    position: absolute; top: 10px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 16px; box-sizing: border-box;
    color: #e8f5e9; font-size: clamp(14px, 2.2vw, 20px);
    z-index: 4; pointer-events: none; text-shadow: 0 0 8px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <span id="scoreLbl">SCORE 0</span>
    <span id="speedLbl">SPEED 1</span>
    <span id="bestLbl">BEST 0</span>
  </div>

  <div id="startScreen" class="overlay">
    <h1>SNAKE ENDLESS</h1>
    <div class="sub">
      Eat food to grow. Speed increases as you eat.<br>
      Don't hit the walls or yourself!
    </div>
    <div class="sub">
      &uarr; &darr; &larr; &rarr; &nbsp;or&nbsp; W A S D — move<br>
      P — pause &nbsp;&bull;&nbsp; R — restart
    </div>
    <button id="startBtn">START GAME</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1 style="color:#f87171;text-shadow:0 0 24px rgba(248,113,113,.6)">GAME OVER</h1>
    <div class="scoreline" id="finalScore">SCORE 0</div>
    <div class="sub" id="newBest" style="color:#facc15">NEW BEST!</div>
    <button id="restartBtn">PLAY AGAIN (R)</button>
  </div>

  <div id="pauseScreen" class="overlay hidden">
    <h1 style="font-size:clamp(28px,6vw,54px)">PAUSED</h1>
    <div class="sub">Press P to resume</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('wrap');

  var startScreen = document.getElementById('startScreen');
  var overScreen  = document.getElementById('overScreen');
  var pauseScreen = document.getElementById('pauseScreen');
  var hud         = document.getElementById('hud');
  var scoreLbl    = document.getElementById('scoreLbl');
  var speedLbl    = document.getElementById('speedLbl');
  var bestLbl     = document.getElementById('bestLbl');
  var finalScore  = document.getElementById('finalScore');
  var newBestEl   = document.getElementById('newBest');

  // --- Audio (created on first user gesture) ---
  var actx = null;
  function ensureAudio(){
    if (!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (actx && actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur, type, vol){
    if (!actx) return;
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(e){}
  }
  function sfxEat(){ beep(520, .08, 'square', .1); setTimeout(function(){beep(760,.09,'square',.08);}, 55); }
  function sfxDie(){ beep(200,.25,'sawtooth',.15); setTimeout(function(){beep(120,.4,'sawtooth',.15);}, 130); }

  // --- Grid / sizing ---
  var COLS = 26, ROWS = 26;
  var cell = 20, offX = 0, offY = 0;

  function resize(){
    var w = wrap.clientWidth, h = wrap.clientHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.max(6, Math.min(Math.floor(w / COLS), Math.floor(h / ROWS)));
    offX = Math.floor((w - COLS * cell) / 2);
    offY = Math.floor((h - ROWS * cell) / 2);
    draw();
  }
  window.addEventListener('resize', resize);

  // --- State ---
  var snake, dir, nextDir, food, score, best, speedLevel;
  var state = 'menu'; // menu | play | pause | over
  var stepMs, acc, lastT, particles = [];

  try { best = parseInt(localStorage.getItem('snakeEndlessBest') || '0', 10) || 0; } catch(e){ best = 0; }

  function reset(){
    snake = [];
    var cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
    for (var i = 0; i < 3; i++) snake.push({x: cx - i, y: cy});
    dir = {x:1, y:0};
    nextDir = {x:1, y:0};
    score = 0;
    speedLevel = 1;
    stepMs = 140;
    acc = 0;
    particles = [];
    spawnFood();
    updateHud();
  }

  function spawnFood(){
    var free = [];
    for (var y = 0; y < ROWS; y++)
      for (var x = 0; x < COLS; x++){
        var onSnake = false;
        for (var i = 0; i < snake.length; i++)
          if (snake[i].x === x && snake[i].y === y) { onSnake = true; break; }
        if (!onSnake) free.push({x:x, y:y});
      }
    food = free.length ? free[Math.floor(Math.random()*free.length)] : null;
  }

  function updateHud(){
    scoreLbl.textContent = 'SCORE ' + score;
    speedLbl.textContent = 'SPEED ' + speedLevel;
    bestLbl.textContent  = 'BEST ' + Math.max(best, score);
  }

  // --- Game logic ---
  function step(){
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
    for (var i = 0; i < snake.length; i++)
      if (snake[i].x === head.x && snake[i].y === head.y) return die();

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y){
      score += 10;
      sfxEat();
      burst(food.x, food.y, '#f87171');
      // speed up
      var newLevel = 1 + Math.floor(score / 50);
      if (newLevel !== speedLevel){ speedLevel = newLevel; }
      stepMs = Math.max(60, 140 - (speedLevel - 1) * 8);
      spawnFood();
      updateHud();
    } else {
      snake.pop();
    }
  }

  function die(){
    sfxDie();
    state = 'over';
    var isBest = score > best;
    if (isBest){
      best = score;
      try { localStorage.setItem('snakeEndlessBest', String(best)); } catch(e){}
    }
    finalScore.textContent = 'SCORE ' + score;
    newBestEl.style.visibility = isBest ? 'visible' : 'hidden';
    hud.classList.add('hidden');
    overScreen.classList.remove('hidden');
  }

  // --- Particles ---
  function burst(gx, gy, color){
    var px = offX + (gx + .5) * cell, py = offY + (gy + .5) * cell;
    for (var i = 0; i < 12; i++){
      var a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 90;
      particles.push({x:px, y:py, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:.5, max:.5, c:color});
    }
  }

  // --- Rendering ---
  function draw(){
    var w = canvas.clientWidth || wrap.clientWidth;
    var h = canvas.clientHeight || wrap.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // board bg
    ctx.fillStyle = '#101827';
    ctx.fillRect(offX, offY, COLS*cell, ROWS*cell);
    // checker
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (var y = 0; y < ROWS; y++)
      for (var x = 0; x < COLS; x++)
        if ((x + y) % 2 === 0) ctx.fillRect(offX + x*cell, offY + y*cell, cell, cell);

    // border glow
    ctx.strokeStyle = 'rgba(74,222,128,.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(offX - 1, offY - 1, COLS*cell + 2, ROWS*cell + 2);

    if (!snake) return;

    // food (pulsing handled by time param)
    var t = (performance.now() % 800) / 800;
    if (food){
      var fx = offX + (food.x + .5) * cell, fy = offY + (food.y + .5) * cell;
      var r = cell * 0.32 * (1 + 0.15 * Math.sin(t * Math.PI * 2));
      ctx.save();
      ctx.shadowColor = '#f87171'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // snake
    for (var i = snake.length - 1; i >= 0; i--){
      var s = snake[i];
      var px = offX + s.x * cell, py = offY + s.y * cell;
      var head = (i === 0);
      var shade = head ? '#4ade80' : 'rgba(74,222,128,' + Math.max(0.35, 1 - i * 0.02) + ')';
      ctx.fillStyle = shade;
      if (head){ ctx.save(); ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 12; }
      roundRect(px + 1, py + 1, cell - 2, cell - 2, Math.min(6, cell * .3));
      ctx.fill();
      if (head) ctx.restore();
    }

    // eyes on head
    var hd = snake[0];
    var hx = offX + hd.x * cell + cell/2, hy = offY + hd.y * cell + cell/2;
    var ex = dir.x, ey = dir.y;
    ctx.fillStyle = '#0b0f1a';
    ctx.beginPath();
    ctx.arc(hx + ex*cell*.18 - ey*cell*.18, hy + ey*cell*.18 + ex*cell*.18, cell*.09, 0, Math.PI*2);
    ctx.arc(hx + ex*cell*.18 + ey*cell*.18, hy + ey*cell*.18 - ex*cell*.18, cell*.09, 0, Math.PI*2);
    ctx.fill();

    // particles
    for (var p = 0; p < particles.length; p++){
      var pt = particles[p];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.c;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // --- Main loop ---
  function loop(ts){
    requestAnimationFrame(loop);
    if (lastT === undefined) lastT = ts;
    var dt = Math.min(100, ts - lastT);
    lastT = ts;

    if (state === 'play'){
      acc += dt;
      while (acc >= stepMs){
        acc -= stepMs;
        step();
        if (state !== 'play') break;
      }
    }

    // particles update
    var ds = dt / 1000;
    for (var i = particles.length - 1; i >= 0; i--){
      var pt = particles[i];
      pt.life -= ds;
      if (pt.life <= 0){ particles.splice(i,1); continue; }
      pt.x += pt.vx * ds; pt.y += pt.vy * ds;
      pt.vx *= 0.96; pt.vy *= 0.96;
    }

    draw();
  }

  // --- State transitions ---
  function startGame(){
    ensureAudio();
    reset();
    state = 'play';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    beep(440, .1, 'sine', .1);
  }

  function togglePause(){
    if (state === 'play'){
      state = 'pause';
      pauseScreen.classList.remove('hidden');
    } else if (state === 'pause'){
      state = 'play';
      acc = 0;
      pauseScreen.classList.add('hidden');
    }
  }

  // --- Input ---
  var keyMap = {
    ArrowUp:{x:0,y:-1}, KeyW:{x:0,y:-1},
    ArrowDown:{x:0,y:1}, KeyS:{x:0,y:1},
    ArrowLeft:{x:-1,y:0}, KeyA:{x:-1,y:0},
    ArrowRight:{x:1,y:0}, KeyD:{x:1,y:0}
  };

  window.addEventListener('keydown', function(e){
    ensureAudio();
    var k = e.code;

    if (k === 'KeyR'){ startGame(); return; }
    if (k === 'Enter' || k === 'Space'){
      if (state === 'menu' || state === 'over'){ startGame(); e.preventDefault(); return; }
    }
    if (k === 'KeyP' || k === 'Escape'){ togglePause(); return; }

    var d = keyMap[k];
    if (d && state === 'play'){
      // no 180° reversal
      if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
      e.preventDefault();
    }
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  // touch swipe support (bonus)
  var touchStart = null;
  window.addEventListener('touchstart', function(e){
    ensureAudio();
    if (e.touches.length) touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY};
  }, {passive:true});
  window.addEventListener('touchend', function(e){
    if (!touchStart || state !== 'play') return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    var d = Math.abs(dx) > Math.abs(dy) ? {x:Math.sign(dx), y:0} : {x:0, y:Math.sign(dy)};
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }, {passive:true});

  // --- Init ---
  reset();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
