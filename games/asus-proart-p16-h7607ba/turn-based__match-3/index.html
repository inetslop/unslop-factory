<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem Clash</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#141225;font-family:'Trebuchet MS',Verdana,sans-serif;}
  #c{display:block;position:absolute;top:0;left:0;}
  #hud{position:absolute;top:0;left:0;width:100%;height:70px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:2;pointer-events:none;}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:6px 18px;color:#fff;text-align:center;min-width:90px;}
  .stat .lbl{font-size:11px;letter-spacing:2px;color:#9d97c9;text-transform:uppercase;}
  .stat .val{font-size:20px;font-weight:bold;}
  #overlay{position:absolute;inset:0;background:rgba(15,13,32,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:5;color:#fff;text-align:center;padding:20px;}
  #overlay h1{font-size:56px;margin:0 0 8px;background:linear-gradient(90deg,#ff5e7a,#ffb45e,#5ee6a0,#5ec8ff,#c05eff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;}
  #overlay p{color:#b9b3dd;font-size:16px;line-height:1.6;max-width:420px;margin:8px 0;}
  .key{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:1px 8px;font-size:13px;color:#fff;}
  #btn{margin-top:22px;font-size:20px;font-weight:bold;padding:14px 44px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(180deg,#5ee6a0,#2fb573);color:#08251a;box-shadow:0 6px 0 #1c7a4d,0 10px 24px rgba(0,0,0,.4);transition:transform .1s;}
  #btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1c7a4d;}
  #msg{position:absolute;left:50%;top:86px;transform:translateX(-50%);color:#ffe27a;font-size:22px;font-weight:bold;text-shadow:0 2px 6px rgba(0,0,0,.7);z-index:3;pointer-events:none;opacity:0;transition:opacity .4s;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="stat"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
  <div class="stat"><div class="lbl">Goal</div><div class="val" id="goal">1500</div></div>
  <div class="stat"><div class="lbl">Moves</div><div class="val" id="moves">25</div></div>
  <div class="stat"><div class="lbl">Best</div><div class="val" id="best">0</div></div>
</div>
<div id="msg"></div>
<div id="overlay">
  <h1>GEM CLASH</h1>
  <p id="ovText">Swap two adjacent gems to build lines of 3 or more.<br>Reach <b>1500 points</b> in <b>25 moves</b>. Cascades multiply your score!</p>
  <p><span class="key">Click / Tap</span> select &amp; swap gems &nbsp;·&nbsp; <span class="key">R</span> restart &nbsp;·&nbsp; <span class="key">Enter</span> start</p>
  <button id="btn">Start Game</button>
</div>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var overlay=document.getElementById('overlay'),ovText=document.getElementById('ovText');
var btn=document.getElementById('btn'),msgEl=document.getElementById('msg');
var elScore=document.getElementById('score'),elMoves=document.getElementById('moves'),elBest=document.getElementById('best');

var N=8, GOAL=1500, START_MOVES=25;
var PALETTE=[['#ff5e7a','#c92747'],['#ffb45e','#d17f1e'],['#ffe27a','#cfae2c'],['#5ee6a0','#22a86b'],['#5ec8ff','#2a7fd1']];
var board=[];         // board[r][c] = {color,x,y,scale,popping} or null
var W=0,H=0,cell=40,ox=0,oy=0;
var score=0,moves=START_MOVES,best=0,state='start',busy=false,sel=null,shakeT=0;

try{best=parseInt(localStorage.getItem('gemclash_best'))||0;}catch(e){}
elBest.textContent=best;

/* ---------- audio ---------- */
var AC=null;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f,dur,type,vol,delay){
  if(!AC)return;
  type=type||'sine';vol=vol||0.12;delay=delay||0;
  var t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
}
function sSwap(){beep(420,0.08,'triangle',0.1);}
function sPop(combo){var f=330*Math.pow(1.12,combo);beep(f,0.15,'square',0.07);beep(f*1.5,0.12,'sine',0.06,0.03);}
function sBad(){beep(180,0.2,'sawtooth',0.08);}
function sWin(){[523,659,784,1047].forEach(function(f,i){beep(f,0.25,'triangle',0.12,i*0.13);});}
function sLose(){[392,330,262,196].forEach(function(f,i){beep(f,0.3,'sawtooth',0.07,i*0.15);});}

/* ---------- layout ---------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
  cell=Math.floor(Math.min((W-24)/N,(H-96)/N));
  ox=(W-cell*N)/2; oy=80+(H-80-cell*N)/2;
}
window.addEventListener('resize',resize);resize();

function targetPos(r,c){return {x:ox+c*cell,y:oy+r*cell};}

/* ---------- board setup ---------- */
function rndColor(){return Math.floor(Math.random()*PALETTE.length);}
function makeBoard(){
  board=[];
  for(var r=0;r<N;r++){board.push([]);
    for(var c=0;c<N;c++){
      var col,tries=0;
      do{col=rndColor();tries++;}while(tries<50&&(
        (c>=2&&board[r][c-1].color===col&&board[r][c-2].color===col)||
        (r>=2&&board[r-1][c].color===col&&board[r-2][c].color===col)));
      var p=targetPos(r,c);
      board[r].push({color:col,x:p.x,y:p.y-(N)*cell*(0.5+r*0.08),scale:1,popping:false});
    }}
}

/* ---------- matching ---------- */
function gridColors(b){var g=[];for(var r=0;r<N;r++){g.push([]);for(var c=0;c<N;c++)g[r].push(b[r][c]?b[r][c].color:-1);}return g;}
function findMatches(){
  var b=board,set={},r,c;
  for(r=0;r<N;r++){var run=1;
    for(c=1;c<=N;c++){
      if(c<N&&b[r][c]&&!b[r][c].popping&&b[r][c-1]&&!b[r][c-1].popping&&b[r][c].color===b[r][c-1].color)run++;
      else{if(run>=3)for(var k=c-run;k<c;k++)set[r+','+k]=1;run=1;}}}
  for(c=0;c<N;c++){run=1;
    for(r=1;r<=N;r++){
      if(r<N&&b[r][c]&&!b[r][c].popping&&b[r-1][c]&&!b[r-1][c].popping&&b[r][c].color===b[r-1][c].color)run++;
      else{if(run>=3)for(var k2=r-run;k2<r;k2++)set[k2+','+c]=1;run=1;}}}
  return Object.keys(set);
}
function hasValidMove(){
  var g=gridColors(board),r,c;
  function okAt(r0,c0){
    var col=g[r0][c0],i;
    for(i=Math.max(0,c0-2);i<=Math.min(N-3,c0);i++)if(g[r0][i]===col&&g[r0][i+1]===col&&g[r0][i+2]===col)return true;
    for(i=Math.max(0,r0-2);i<=Math.min(N-3,r0);i++)if(g[i][c0]===col&&g[i+1][c0]===col&&g[i+2][c0]===col)return true;
    return false;
  }
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    if(c<N-1){var t=g[r][c];g[r][c]=g[r][c+1];g[r][c+1]=t;if(okAt(r,c)||okAt(r,c+1))return true;t=g[r][c];g[r][c]=g[r][c+1];g[r][c+1]=t;}
    if(r<N-1){var t2=g[r][c];g[r][c]=g[r+1][c];g[r+1][c]=t2;if(okAt(r,c)||okAt(r+1,c))return true;t2=g[r][c];g[r][c]=g[r+1][c];g[r+1][c]=t2;}
  }
  return false;
}
function shuffleBoard(){
  var colors=[],r,c,i,j,t;
  for(r=0;r<N;r++)for(c=0;c<N;c++)colors.push(board[r][c].color);
  do{
    for(i=colors.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=colors[i];colors[i]=colors[j];colors[j]=t;}
    var k=0;
    for(r=0;r<N;r++)for(c=0;c<N;c++)board[r][c].color=colors[k++];
  }while(findMatches().length||!hasValidMove());
}

/* ---------- helpers ---------- */
function sleep(ms){return new Promise(function(res){setTimeout(res,ms);});}
var msgTimer=null;
function flashMsg(txt,ms){
  msgEl.textContent=txt;msgEl.style.opacity=1;
  clearTimeout(msgTimer);
  msgTimer=setTimeout(function(){msgEl.style.opacity=0;},ms||900);
}
function updateHUD(){elScore.textContent=score;elMoves.textContent=moves;}

/* ---------- game flow ---------- */
async function trySwap(r1,c1,r2,c2){
  busy=true;sel=null;sSwap();
  var t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t;
  await sleep(220);
  if(findMatches().length===0){
    t=board[r1][c1];board[r1][c1]=board[r2][c2];board[r2][c2]=t;
    sBad();shakeT=8;await sleep(220);
  }else{
    moves--;updateHUD();
    await resolveCascades();
  }
  if(state==='playing'){
    if(score>=GOAL)endGame(true);
    else if(moves<=0)endGame(false);
    else if(!hasValidMove()){flashMsg('No moves — shuffling!');sBad();await sleep(600);shuffleBoard();}
  }
  busy=false;
}

async function resolveCascades(){
  var combo=0;
  while(true){
    var m=findMatches();
    if(m.length===0)break;
    combo++;
    for(var i=0;i<m.length;i++){var p=m[i].split(',');board[+p[0]][+p[1]].popping=true;}
    score+=m.length*10*combo;updateHUD();
    if(combo>=2)flashMsg('Combo x'+combo+'!  +'+(m.length*10*combo));else flashMsg('+'+(m.length*10*combo),500);
    sPop(combo);
    await sleep(280);
    // remove popped, gravity
    for(var r=0;r<N;r++)for(var c=0;c<N;c++){
      var cl=board[r][c];
      if(cl&&cl.scale<=0.15)board[r][c]=null;
    }
    for(c=0;c<N;c++){
      var write=N-1;
      for(r=N-1;r>=0;r--){
        if(board[r][c]){
          if(write!==r){board[write][c]=board[r][c];board[r][c]=null;}
          write--;
        }
      }
      var empties=write+1;
      for(r=write;r>=0;r--){
        var p=targetPos(r,c),col=rndColor();
        board[r][c]={color:col,x:p.x,y:oy-empties*cell+(r-write)*0, scale:1,popping:false};
        // start above the board
        board[r][c].y=oy-(empties-(r))*cell;
      }
    }
    await sleep(340);
  }
}

function endGame(won){
  state='over';
  if(score>best){best=score;try{localStorage.setItem('gemclash_best',best);}catch(e){}}
  elBest.textContent=best;
  won?sWin():sLose();
  setTimeout(function(){
    overlay.classList.remove('hidden');
    document.querySelector('#overlay h1').textContent=won?'YOU WIN!':'GAME OVER';
    ovText.innerHTML=(won?'Amazing! You smashed the goal.':'So close! You needed a little more luck.')+
      '<br>Final score: <b>'+score+'</b> &nbsp;·&nbsp; Best: <b>'+best+'</b>';
    btn.textContent='Play Again (R)';
  },650);
}

function startGame(){
  score=0;moves=START_MOVES;state='playing';busy=false;sel=null;
  makeBoard();
  if(!hasValidMove())shuffleBoard();
  updateHUD();
  overlay.classList.add('hidden');
}

/* ---------- input ---------- */
function cellFromEvent(e){
  var rect=canvas.getBoundingClientRect();
  var x=e.clientX-rect.left,y=e.clientY-rect.top;
  var c=Math.floor((x-ox)/cell),r=Math.floor((y-oy)/cell);
  if(r<0||r>=N||c<0||c>=N)return null;
  return {r:r,c:c};
}
function handlePick(rc){
  if(state!=='playing'||busy||!rc)return;
  if(!sel){sel=rc;sSwap();return;}
  if(sel.r===rc.r&&sel.c===rc.c){sel=null;return;}
  var dr=Math.abs(sel.r-rc.r),dc=Math.abs(sel.c-rc.c);
  if(dr+dc===1){var a=sel;trySwap(a.r,a.c,rc.r,rc.c);}
  else{sel=rc;sSwap();}
}
canvas.addEventListener('pointerdown',function(e){initAudio();handlePick(cellFromEvent(e));});
window.addEventListener('keydown',function(e){
  initAudio();
  var k=e.key;
  if(k==='Enter'||k===' '){
    if(state!=='playing'){e.preventDefault();startGame();}
  }
  if((k==='r'||k==='R')&&state!=='start'){startGame();}
});
btn.addEventListener('click',function(){initAudio();startGame();});

/* ---------- render loop ---------- */
function drawGem(x,y,scale,color,selGlow){
  var s=cell*scale,pad=s*0.08;
  ctx.save();
  ctx.translate(x+cell/2,y+cell/2);
  if(selGlow){ctx.shadowColor='#ffffff';ctx.shadowBlur=18;}
  var g=ctx.createLinearGradient(0,-s/2,0,s/2);
  g.addColorStop(0,PALETTE[color][0]);g.addColorStop(1,PALETTE[color][1]);
  ctx.fillStyle=g;
  roundRect(-s/2+pad,-s/2+pad,s-2*pad,s-2*pad,s*0.22);
  ctx.fill();
  // highlight
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.35)';
  roundRect(-s/2+pad+s*0.12,-s/2+pad+s*0.1,s-2*pad-s*0.24,s*0.28,s*0.14);
  ctx.fill();
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function frame(){
  // physics / animation
  var r,c,cl;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    cl=board[r]&&board[r][c];if(!cl)continue;
    if(cl.popping){cl.scale-=0.09;if(cl.scale<0)cl.scale=0;}
    var t=targetPos(r,c);
    cl.x+=(t.x-cl.x)*0.32;
    cl.y+=(t.y-cl.y)*0.32;
  }
  // background
  ctx.fillStyle='#141225';ctx.fillRect(0,0,W,H);
  var bg=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,Math.max(W,H));
  bg.addColorStop(0,'#221d42');bg.addColorStop(1,'#141225');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  if(state==='playing'||state==='over'){
    // board frame
    ctx.save();
    if(shakeT>0){shakeT--;ctx.translate((Math.random()-0.5)*shakeT,(Math.random()-0.5)*shakeT);}
    ctx.fillStyle='rgba(0,0,0,.35)';
    roundRect(ox-8,oy-8,cell*N+16,cell*N+16,14);ctx.fill();
    // checker cells
    for(r=0;r<N;r++)for(c=0;c<N;c++){
      ctx.fillStyle=(r+c)%2?'rgba(255,255,255,.035)':'rgba(255,255,255,.07)';
      roundRect(ox+c*cell+1,oy+r*cell+1,cell-2,cell-2,8);ctx.fill();
    }
    // selection
    if(sel){
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;
      roundRect(ox+sel.c*cell+2,oy+sel.r*cell+2,cell-4,cell-4,10);ctx.stroke();
    }
    for(r=0;r<N;r++)for(c=0;c<N;c++){
      cl=board[r][c];if(!cl)continue;
      var isSel=sel&&sel.r===r&&sel.c===c;
      drawGem(cl.x,cl.y,cl.scale*(isSel?1.08:1),cl.color,isSel);
    }
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
