<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top-Down Pong</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0b1020;
    font-family: 'Courier New', monospace;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5, 8, 20, 0.88); color: #eaf6ff; text-align: center;
    z-index: 10;
  }
  .hidden { display: none !important; }
  h1 {
    font-size: clamp(34px, 8vw, 72px); letter-spacing: 0.15em; margin: 0 0 8px;
    color: #7df9ff; text-shadow: 0 0 18px rgba(125,249,255,.6), 0 0 40px rgba(125,249,255,.3);
  }
  .sub { color: #9fb8d8; font-size: clamp(13px, 2.4vw, 18px); line-height: 1.7; margin-bottom: 26px; }
  .btn {
    background: transparent; color: #7df9ff; border: 2px solid #7df9ff;
    font-family: inherit; font-size: clamp(15px, 2.6vw, 20px); letter-spacing: .12em;
    padding: 12px 34px; margin: 8px; cursor: pointer; border-radius: 6px;
    transition: background .15s, transform .1s;
  }
  .btn:hover { background: rgba(125,249,255,.15); transform: scale(1.04); }
  .score-big { font-size: clamp(28px, 6vw, 54px); color: #ffd76b; margin-bottom: 10px; letter-spacing: .1em; }
  kbd {
    background: #1a2440; border: 1px solid #3a4a78; border-radius: 4px;
    padding: 1px 7px; font-size: .95em; color: #cfe6ff;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="menu" class="overlay">
    <h1>TOP-DOWN PONG</h1>
    <div class="sub">
      First to <b style="color:#ffd76b">7</b> points wins.<br><br>
      Player (bottom): <kbd>A</kbd> <kbd>D</kbd> or <kbd>&#8592;</kbd> <kbd>&#8594;</kbd><br>
      Player 2 (top): <kbd>&#8593;</kbd> <kbd>&#8597;</kbd> — in 1P mode the top paddle is CPU<br><br>
      <kbd>P</kbd> pause &nbsp; <kbd>R</kbd> restart
    </div>
    <div>
      <button class="btn" id="btn1p">1 PLAYER</button>
      <button class="btn" id="btn2p">2 PLAYERS</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <h1 id="winText">YOU WIN!</h1>
    <div class="score-big" id="finalScore">0 — 0</div>
    <button class="btn" id="btnAgain">PLAY AGAIN</button>
    <button class="btn" id="btnMenu">MENU</button>
  </div>

  <div id="pauseTag" class="overlay hidden" style="background:rgba(5,8,20,.6);">
    <h1 style="font-size:clamp(28px,6vw,54px)">PAUSED</h1>
    <div class="sub">Press <kbd>P</kbd> to resume</div>
  </div>
</div>

<script>
(function(){
"use strict";
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// ---- Audio (Web Audio API, starts after first input) ----
var audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol){
  if(!audioCtx) return;
  try {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

// ---- Game state ----
var WIN_SCORE = 7;
var state = 'menu'; // menu | play | over
var twoPlayer = false;
var paused = false;

var ball, p1, p2, score1, score2, serveTimer, serveDir, trail;

function paddleW(){ return Math.max(90, W * 0.18); }
function paddleH(){ return Math.max(14, H * 0.022); }
function ballR(){ return Math.max(8, Math.min(W,H) * 0.014); }

function resetPositions(serveTo){
  var pw = paddleW(), ph = paddleH();
  p1 = { x: W/2 - pw/2, y: H - ph - 18, w: pw, h: ph, vx: 0 };
  p2 = { x: W/2 - pw/2, y: 18,          w: pw, h: ph, vx: 0 };
  ball = { x: W/2, y: H/2, vx: 0, vy: 0 };
  trail = [];
  serveTimer = 60;
  serveDir = serveTo || (Math.random() < 0.5 ? -1 : 1);
}

function startMatch(twoP){
  twoPlayer = !!twoP;
  score1 = 0; score2 = 0;
  resetPositions(Math.random() < 0.5 ? -1 : 1);
  state = 'play';
  paused = false;
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('pauseTag').classList.add('hidden');
}

function serveBall(){
  var speed = Math.max(5.2, Math.min(W,H) * 0.011);
  var ang = (Math.random()*0.6 - 0.3); // radians off vertical
  ball.vx = speed * Math.sin(ang);
  ball.vy = serveDir * speed * Math.cos(ang);
}

function endMatch(){
  state = 'over';
  var win = document.getElementById('winText');
  var finalScore = document.getElementById('finalScore');
  if(twoPlayer){
    win.textContent = (score1 > score2) ? 'PLAYER 1 WINS!' : 'PLAYER 2 WINS!';
  } else {
    win.textContent = (score1 > score2) ? 'YOU WIN!' : 'CPU WINS!';
  }
  finalScore.textContent = score1 + ' — ' + score2;
  document.getElementById('over').classList.remove('hidden');
  beep(660, .3, 'triangle', .15);
}

// ---- Input ----
var keys = {};
window.addEventListener('keydown', function(e){
  ensureAudio();
  var k = e.key.toLowerCase();
  keys[k] = true;
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();

  if(k === 'r' && state !== 'menu'){ startMatch(twoPlayer); }
  if(k === 'p' && state === 'play'){
    paused = !paused;
    document.getElementById('pauseTag').classList.toggle('hidden', !paused);
  }
  if(k === 'enter' && (state === 'menu' || state === 'over')){
    startMatch(twoPlayer);
  }
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

document.getElementById('btn1p').addEventListener('click', function(){ ensureAudio(); startMatch(false); });
document.getElementById('btn2p').addEventListener('click', function(){ ensureAudio(); startMatch(true); });
document.getElementById('btnAgain').addEventListener('click', function(){ ensureAudio(); startMatch(twoPlayer); });
document.getElementById('btnMenu').addEventListener('click', function(){
  state = 'menu';
  document.getElementById('over').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
});

// ---- Update ----
function updatePaddle(p, leftKey, rightKey, speed){
  var v = 0;
  if(keys[leftKey]) v -= speed;
  if(keys[rightKey]) v += speed;
  p.vx = v;
  p.x += v;
  p.x = Math.max(4, Math.min(W - p.w - 4, p.x));
}

function cpuMove(p){
  var speed = Math.max(3.2, Math.min(W,H) * 0.0062);
  var target = ball.x - p.w/2;
  // only track when ball is moving toward CPU
  if(ball.vy < 0){
    var diff = target - p.x;
    var step = Math.max(-speed, Math.min(speed, diff * 0.14));
    p.vx = step;
    p.x += step;
  } else {
    // drift toward center
    var d2 = (W/2 - p.w/2) - p.x;
    p.vx = Math.max(-speed*0.5, Math.min(speed*0.5, d2 * 0.04));
    p.x += p.vx;
  }
  p.x = Math.max(4, Math.min(W - p.w - 4, p.x));
}

function update(){
  if(state !== 'play' || paused) return;

  var speed = Math.max(5.2, Math.min(W,H) * 0.013);
  updatePaddle(p1, 'a', 'd', speed);
  if(twoPlayer){
    // P2 also uses arrows (and up/down do nothing for movement — top-down means horizontal)
    updatePaddle(p2, 'arrowleft', 'arrowright', speed);
  } else {
    cpuMove(p2);
  }

  if(serveTimer > 0){
    serveTimer--;
    ball.x = W/2; ball.y = H/2;
    if(serveTimer === 0) serveBall();
    return;
  }

  var r = ballR();
  trail.push({x: ball.x, y: ball.y});
  if(trail.length > 14) trail.shift();

  ball.x += ball.vx;
  ball.y += ball.vy;

  // side walls
  if(ball.x - r < 0){ ball.x = r; ball.vx = Math.abs(ball.vx); beep(220,.06,'square',.08); }
  if(ball.x + r > W){ ball.x = W - r; ball.vx = -Math.abs(ball.vx); beep(220,.06,'square',.08); }

  // paddle collision (bottom)
  if(ball.vy > 0 &&
     ball.y + r >= p1.y && ball.y + r <= p1.y + p1.h + Math.abs(ball.vy) + 4 &&
     ball.x >= p1.x - r && ball.x <= p1.x + p1.w + r){
    ball.y = p1.y - r;
    bounceOffPaddle(p1, -1);
  }
  // paddle collision (top)
  if(ball.vy < 0 &&
     ball.y - r <= p2.y + p2.h && ball.y - r >= p2.y - Math.abs(ball.vy) - 4 &&
     ball.x >= p2.x - r && ball.x <= p2.x + p2.w + r){
    ball.y = p2.y + p2.h + r;
    bounceOffPaddle(p2, 1);
  }

  // scoring
  if(ball.y < -r*2){
    score2++; beep(140,.3,'sawtooth',.14);
    resetPositions(1);
    if(score2 >= WIN_SCORE) endMatch();
  } else if(ball.y > H + r*2){
    score1++; beep(520,.25,'triangle',.16);
    resetPositions(-1);
    if(score1 >= WIN_SCORE) endMatch();
  }
}

function bounceOffPaddle(p, dir){
  var speed = Math.hypot(ball.vx, ball.vy);
  speed = Math.min(speed * 1.045, Math.min(W,H) * 0.028); // accelerate, cap it
  // angle based on hit position (-1..1)
  var rel = (ball.x - (p.x + p.w/2)) / (p.w/2);
  rel = Math.max(-1, Math.min(1, rel));
  var maxAngle = 0.9; // ~51 degrees
  var ang = rel * maxAngle;
  ball.vx = speed * Math.sin(ang) + p.vx * 0.15;
  ball.vy = dir * speed * Math.cos(ang);
  beep(440 + Math.abs(rel)*220, .07, 'square', .12);
}

// ---- Render ----
function drawCourt(){
  // background
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1530');
  g.addColorStop(.5,'#0a0f24');
  g.addColorStop(1,'#0d1530');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // center line
  ctx.strokeStyle = 'rgba(125,249,255,.35)';
  ctx.lineWidth = 3;
  ctx.setLineDash([14, 12]);
  ctx.beginPath();
  ctx.moveTo(0, H/2); ctx.lineTo(W, H/2);
  ctx.stroke();
  ctx.setLineDash([]);

  // center circle
  ctx.strokeStyle = 'rgba(125,249,255,.2)';
  ctx.beginPath();
  ctx.arc(W/2, H/2, Math.min(W,H)*0.09, 0, Math.PI*2);
  ctx.stroke();

  // goal lines
  ctx.strokeStyle = 'rgba(125,249,255,.18)';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(W, 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, H-8); ctx.lineTo(W, H-8); ctx.stroke();
}

function drawPaddle(p, color){
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.fillStyle = color;
  var r = p.h/2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(p.x, p.y, p.w, p.h, r);
  else ctx.rect(p.x, p.y, p.w, p.h);
  ctx.fill();
  ctx.restore();
}

function drawBall(){
  var r = ballR();
  // trail
  for(var i=0;i<trail.length;i++){
    var t = (i+1)/trail.length;
    ctx.fillStyle = 'rgba(255,215,107,' + (t*0.3) + ')';
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, r*t, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.save();
  ctx.shadowColor = '#ffd76b';
  ctx.shadowBlur = 22;
  ctx.fillStyle = '#fff3d0';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawHUD(){
  var fs = Math.max(34, Math.min(W,H)*0.09);
  ctx.font = 'bold ' + fs + 'px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,140,160,.85)';
  ctx.fillText(score2, W/2, H*0.16);
  ctx.fillStyle = 'rgba(125,249,255,.9)';
  ctx.fillText(score1, W/2, H - H*0.06);

  if(serveTimer > 0){
    ctx.font = Math.max(14, fs*0.35) + 'px "Courier New", monospace';
    ctx.fillStyle = 'rgba(200,225,255,.7)';
    var msg = (twoPlayer ? (serveDir>0?'PLAYER 1 SERVES':'PLAYER 2 SERVES') : (serveDir>0?'YOU SERVE':'CPU SERVES'));
    ctx.fillText(msg, W/2, H/2 + fs*0.6);
  }
}

function render(){
  drawCourt();
  if(state === 'play' || state === 'over'){
    drawPaddle(p2, '#ff8ca0');
    drawPaddle(p1, '#7df9ff');
    if(serveTimer <= 0) drawBall();
    else {
      // waiting ball preview at center
      var r = ballR();
      ctx.save();
      ctx.globalAlpha = 0.5 + 0.4*Math.sin(Date.now()/150);
      ctx.fillStyle = '#fff3d0';
      ctx.beginPath(); ctx.arc(W/2, H/2, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    drawHUD();
  } else {
    // idle demo paddles on menu backdrop
    var t = Date.now()/1000;
    var pw = paddleW(), ph = paddleH();
    ctx.globalAlpha = .35;
    drawPaddle({x: W/2 - pw/2 + Math.sin(t)*W*0.18, y: H-ph-18, w: pw, h: ph}, '#7df9ff');
    drawPaddle({x: W/2 - pw/2 + Math.cos(t*0.8)*W*0.18, y: 18, w: pw, h: ph}, '#ff8ca0');
    ctx.globalAlpha = 1;
  }
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
})();
</script>
</body>
</html>
