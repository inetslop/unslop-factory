<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Puzzle Pong</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0e1a;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1000,H=600;
let scale=1,ox=0,oy=0;
function resize(){
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  scale=Math.min(cv.width/W,cv.height/H);
  ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;
}
window.addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let AC=null;
function initAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
}
function beep(f,d,type,v,slideTo){
  if(!AC)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+d);
    g.gain.setValueAtTime(v||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

/* ---------- state ---------- */
let state='start',paused=false;
let player,ai,ball,tiles,nextIdx,scoreP,scoreA,msg,msgT,serveTimer,spawnTimer,winCount=0,frame=0;
try{winCount=parseInt(localStorage.getItem('puzzlePongWins')||'0',10)||0;}catch(e){}

function newBall(dir){
  ball={x:W/2,y:H/2,r:9,speed:5.2,vx:dir*5.2,vy:(Math.random()*4-2)};
  serveTimer=55;
}
function resetMatch(){
  scoreP=0;scoreA=0;paused=false;
  player={x:30,w:16,h:90,y:H/2-45};
  ai={x:W-46,w:16,h:90,y:H/2-45};
  tiles=[];nextIdx=0;msg='';msgT=0;spawnTimer=0;
  newBall(Math.random()<0.5?1:-1);
  spawnTiles();
}
function spawnTiles(){
  tiles=[];nextIdx=0;
  for(let i=0;i<3;i++){
    let x,y,ok=false,tries=0;
    while(!ok&&tries<300){
      x=W*0.3+Math.random()*W*0.4;y=95+Math.random()*(H-190);
      ok=tiles.every(t=>Math.abs(t.x-x)>64||Math.abs(t.y-y)>64);
      tries++;
    }
    tiles.push({x:x,y:y,s:36,num:i+1,hit:false,cd:0});
  }
}
function showMsg(m,t){msg=m;msgT=t;}

/* ---------- input ---------- */
const keys={};
window.addEventListener('keydown',function(e){
  initAudio();
  const k=e.key;
  if(k==='ArrowUp'||k==='ArrowDown'||k===' ')e.preventDefault();
  keys[k.length===1?k.toLowerCase():k]=true;
  if(state==='start'&&(k==='Enter'||k===' ')){state='play';resetMatch();beep(600,0.12,'square',0.15,900);}
  else if((state==='play'||state==='over')&&(k==='r'||k==='R')){state='play';resetMatch();beep(600,0.12,'square',0.15,900);}
  else if(state==='over'&&(k==='Enter'||k===' ')){state='play';resetMatch();beep(600,0.12,'square',0.15,900);}
  else if((k==='p'||k==='P')&&state==='play'){paused=!paused;}
});
window.addEventListener('keyup',function(e){
  const k=e.key;
  keys[k.length===1?k.toLowerCase():k]=false;
});

/* ---------- update ---------- */
function movePlayer(){
  const sp=7.6;
  if(keys['w']||keys['ArrowUp'])player.y-=sp;
  if(keys['s']||keys['ArrowDown'])player.y+=sp;
  player.y=Math.max(0,Math.min(H-player.h,player.y));
}
function moveAI(){
  const target=(ball.vx>0?ball.y-H/2+ (Math.sin(frame*0.05)*18):H/2-ai.h/2);
  let maxSp=4.1+Math.min(2.4,(scoreA+scoreP)*0.35);
  const dy=target-ai.y;
  if(Math.abs(dy)>4)ai.y+=Math.max(-maxSp,Math.min(maxSp,dy));
  ai.y=Math.max(0,Math.min(H-ai.h,ai.y));
}
function bouncePaddle(p,side){
  const rel=(ball.y-(p.y+p.h/2))/(p.h/2);
  const a=rel*1.05; // max ~60 deg
  ball.speed=Math.min(ball.speed*1.05,13.5);
  ball.vx=Math.cos(a)*ball.speed*(side==='L'?1:-1);
  ball.vy=Math.sin(a)*ball.speed;
  if(side==='L')ball.x=p.x+p.w+ball.r+1;else ball.x=p.x-ball.r-1;
  beep(440,0.06,'square',0.12);
}
function updateBall(){
  if(serveTimer>0){serveTimer--;return;}
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);beep(300,0.05,'triangle',0.1);}
  if(ball.y+ball.r>H){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy);beep(300,0.05,'triangle',0.1);}
  // player paddle
  if(ball.vx<0&&ball.x-ball.r<=player.x+player.w&&ball.x-ball.r>player.x-14&&
     ball.y>player.y-ball.r&&ball.y<player.y+player.h+ball.r)bouncePaddle(player,'L');
  // ai paddle
  if(ball.vx>0&&ball.x+ball.r>=ai.x&&ball.x+ball.r<ai.x+ai.w+14&&
     ball.y>ai.y-ball.r&&ball.y<ai.y+ai.h+ball.r)bouncePaddle(ai,'R');

  // tiles
  for(let i=0;i<tiles.length;i++){
    const t=tiles[i];
    if(t.hit)continue;
    if(t.cd>0){t.cd--;continue;}
    const cx=Math.max(t.x-t.s/2,Math.min(ball.x,t.x+t.s/2));
    const cy=Math.max(t.y-t.s/2,Math.min(ball.y,t.y+t.s/2));
    const dx=ball.x-cx,dy=ball.y-cy;
    if(dx*dx+dy*dy<=ball.r*ball.r){
      if(t.num===nextIdx+1){
        // correct: pass through with a boost
        t.hit=true;nextIdx++;
        ball.speed=Math.min(ball.speed*1.06,13.5);
        const m=ball.speed/Math.max(0.001,Math.hypot(ball.vx,ball.vy));
        ball.vx*=m;ball.vy*=m;
        beep(520+nextIdx*140,0.1,'square',0.14,760+nextIdx*140);
        if(nextIdx>=tiles.length){
          scoreP=Math.min(scoreP+1,99);
          showMsg('SEQUENCE CLEARED  +1',80);
          spawnTimer=75;
          beep(660,0.09,'square',0.14);setTimeout(function(){beep(880,0.12,'square',0.14);},90);
        }else{
          showMsg('HIT '+t.num+'  \u2192  NEXT: '+(nextIdx+1),55);
        }
      }else{
        // wrong order: bounce back toward player
        t.cd=35;
        ball.vx=-Math.abs(ball.vx)*1.02;
        showMsg('WRONG ORDER!',55);
        beep(140,0.18,'sawtooth',0.16,70);
      }
    }
  }

  // scoring
  if(ball.x<-25){
    scoreA++;beep(200,0.25,'sawtooth',0.15,90);showMsg('AI SCORES!',60);
    newBall(-1);checkWin();
  }else if(ball.x>W+25){
    scoreP++;beep(700,0.18,'square',0.14,1000);showMsg('YOU SCORE!',60);
    newBall(1);checkWin();
  }
}
function checkWin(){
  if(scoreP>=7||scoreA>=7){
    state='over';
    if(scoreP>scoreA){
      winCount++;
      try{localStorage.setItem('puzzlePongWins',String(winCount));}catch(e){}
      beep(523,0.12,'square',0.15);setTimeout(function(){beep(659,0.12,'square',0.15);},130);
      setTimeout(function(){beep(784,0.25,'square',0.15);},260);
    }else{
      beep(300,0.2,'sawtooth',0.15,150);setTimeout(function(){beep(200,0.35,'sawtooth',0.15,80);},200);
    }
  }
}

function update(){
  if(state!=='play'||paused)return;
  frame++;
  movePlayer();moveAI();updateBall();
  if(spawnTimer>0){spawnTimer--;if(spawnTimer===0)spawnTiles();}
  if(msgT>0)msgT--;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
const tileColors=['#ffd23f','#ff8c42','#7ae582'];

function drawCourt(){
  ctx.fillStyle='#0a0e1a';ctx.fillRect(-ox/scale,-oy/scale,cv.width/scale,cv.height/scale);
  ctx.fillStyle='#101a33';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,160,255,0.35)';ctx.lineWidth=4;
  ctx.strokeRect(4,4,W-8,H-8);
  ctx.setLineDash([14,18]);ctx.strokeStyle='rgba(120,160,255,0.3)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W/2,10);ctx.lineTo(W/2,H-10);ctx.stroke();
  ctx.setLineDash([]);
}
function drawTiles(){
  for(let i=0;i<tiles.length;i++){
    const t=tiles[i];
    if(t.hit)continue;
    const isNext=(t.num===nextIdx+1);
    const pulse=isNext?1+Math.sin(frame*0.15)*0.08:1;
    const s=t.s*pulse;
    ctx.save();
    ctx.translate(t.x,t.y);
    if(isNext){ctx.shadowColor=tileColors[i];ctx.shadowBlur=22;}
    ctx.fillStyle=tileColors[i];
    rr(-s/2,-s/2,s,s,9);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#1a1408';
    ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(String(t.num),0,2);
    if(isNext){
      ctx.fillStyle='#fff';
      ctx.font='bold 12px monospace';
      ctx.fillText('NEXT',0,-s/2-12);
    }
    ctx.restore();
  }
}
function drawPaddlesAndBall(){
  ctx.save();
  ctx.shadowColor='#35e0ff';ctx.shadowBlur=16;
  ctx.fillStyle='#35e0ff';rr(player.x,player.y,player.w,player.h,8);ctx.fill();
  ctx.shadowColor='#ff4fd8';
  ctx.fillStyle='#ff4fd8';rr(ai.x,ai.y,ai.w,ai.h,8);ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.shadowColor='#ffffff';ctx.shadowBlur=18;
  ctx.fillStyle='#ffffff';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawHUD(){
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='#35e0ff';ctx.font='bold 44px monospace';
  ctx.fillText(String(scoreP),W/2-120,16);
  ctx.fillStyle='#ff4fd8';
  ctx.fillText(String(scoreA),W/2+120,16);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='13px monospace';
  ctx.fillText('YOU',W/2-120,64);ctx.fillText('AI',W/2+120,64);
  ctx.fillText('FIRST TO 7 WINS',W/2,20);
  // next chip
  if(nextIdx<tiles.length){
    const n=nextIdx+1;
    ctx.fillStyle=tileColors[n-1];
    rr(W/2-58,H-40,116,26,13);ctx.fill();
    ctx.fillStyle='#1a1408';ctx.font='bold 15px monospace';ctx.textBaseline='middle';
    ctx.fillText('NEXT: '+n,W/2,H-27);
  }
  if(msgT>0){
    ctx.globalAlpha=Math.min(1,msgT/25);
    ctx.fillStyle='#ffffff';ctx.font='bold 30px monospace';ctx.textBaseline='middle';
    ctx.fillText(msg,W/2,H/2-90);
    ctx.globalAlpha=1;
  }
}
function panel(w,h){
  ctx.fillStyle='rgba(6,10,24,0.85)';
  rr(W/2-w/2,H/2-h/2,w,h,18);ctx.fill();
  ctx.strokeStyle='rgba(120,170,255,0.5)';ctx.lineWidth=3;ctx.stroke();
}
function drawStart(){
  panel(640,380);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const g=ctx.createLinearGradient(W/2-200,0,W/2+200,0);
  g.addColorStop(0,'#35e0ff');g.addColorStop(1,'#ff4fd8');
  ctx.fillStyle=g;ctx.font='bold 64px monospace';
  ctx.fillText('PUZZLE PONG',W/2,H/2-120);
  ctx.fillStyle='#cfe0ff';ctx.font='17px monospace';
  const lines=[
    'Move paddle:  W / S  or  \u2191 / \u2193',
    '',
    'Pong rules: don\u2019t let the ball pass you.',
    'Puzzle rule: hit the numbered tiles in order',
    '1 \u2192 2 \u2192 3. A cleared sequence = +1 point for you.',
    'Hit a tile out of order and the ball bounces back!',
    '',
    'P = pause     R = restart'
  ];
  lines.forEach(function(l,i){ctx.fillText(l,W/2,H/2-40+i*26);});
  if(Math.floor(frame/30)%2===0){
    ctx.fillStyle='#ffd23f';ctx.font='bold 22px monospace';
    ctx.fillText('PRESS ENTER OR SPACE TO START',W/2,H/2+175);
  }
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='13px monospace';
  ctx.fillText('Career wins: '+winCount,W/2,H/2+205);
}
function drawOver(){
  panel(600,300);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const win=scoreP>scoreA;
  ctx.fillStyle=win?'#7ae582':'#ff5a5a';
  ctx.font='bold 54px monospace';
  ctx.fillText(win?'YOU WIN!':'AI WINS',W/2,H/2-90);
  ctx.fillStyle='#ffffff';ctx.font='bold 36px monospace';
  ctx.fillText(scoreP+'  \u2013  '+scoreA,W/2,H/2-15);
  ctx.fillStyle='#cfe0ff';ctx.font='16px monospace';
  ctx.fillText('Career wins: '+winCount,W/2,H/2+40);
  if(Math.floor(frame/30)%2===0){
    ctx.fillStyle='#ffd23f';ctx.font='bold 20px monospace';
    ctx.fillText('PRESS R OR ENTER TO PLAY AGAIN',W/2,H/2+105);
  }
}
function drawPause(){
  panel(360,140);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ffffff';ctx.font='bold 40px monospace';
  ctx.fillText('PAUSED',W/2,H/2-15);
  ctx.fillStyle='#cfe0ff';ctx.font='16px monospace';
  ctx.fillText('Press P to resume',W/2,H/2+30);
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  drawCourt();
  if(state==='start'){drawStart();return;}
  drawTiles();drawPaddlesAndBall();drawHUD();
  if(state==='over')drawOver();
  else if(paused)drawPause();
}

/* ---------- main loop ---------- */
function loop(){
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}
resetMatch();state='start';
loop();
})();
</script>
</body>
</html>
