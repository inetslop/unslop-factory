<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake Puzzle</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1220;font-family:'Segoe UI',Tahoma,Arial,sans-serif;}
  #c{display:block;width:100vw;height:100vh;}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,20,.78);color:#eaf2ff;text-align:center;z-index:5;}
  .card{background:#141c33;border:1px solid #2b3a63;border-radius:16px;padding:34px 44px;box-shadow:0 14px 48px rgba(0,0,0,.55);max-width:560px;margin:16px;}
  h1{margin:0 0 8px;font-size:46px;letter-spacing:3px;color:#7ee787;text-shadow:0 0 24px rgba(126,231,135,.35);}
  h2{margin:0 0 10px;font-size:34px;color:#ffd166;}
  p{font-size:15px;line-height:1.7;color:#aebadb;margin:8px 0;}
  .keys{display:inline-block;text-align:left;background:#0e1526;border:1px solid #2b3a63;border-radius:10px;padding:12px 20px;font-size:14px;line-height:2;color:#cdd9f5;margin:10px 0;}
  kbd{background:#22305a;border:1px solid #3b4c82;border-bottom-width:3px;border-radius:6px;padding:1px 8px;font-family:inherit;font-size:13px;color:#fff;}
  button{margin-top:14px;background:linear-gradient(180deg,#37d96a,#1fa34c);color:#04240f;border:none;border-radius:10px;padding:12px 34px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:1px;box-shadow:0 5px 0 #147a36;}
  button:hover{filter:brightness(1.1);}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #147a36;}
  .btn2{background:linear-gradient(180deg,#4a5c96,#33427a);color:#e8eeff;box-shadow:0 5px 0 #232f5c;margin-left:10px;}
  .small{font-size:12px;color:#7d8cb8;margin-top:14px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"><div class="card" id="card"></div></div>
<script>
"use strict";
/* ---------- setup ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
window.addEventListener('resize',resize);resize();

const ov=document.getElementById('ov'),card=document.getElementById('card');
function showHTML(h){card.innerHTML=h;ov.style.display='flex';}
function hideOv(){ov.style.display='none';}

/* ---------- audio ---------- */
let AC=null;
function initAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,dur,type,vol,when){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t0=AC.currentTime+(when||0);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur);}catch(e){}}
function sfx(n){if(!AC)return;
  if(n==='eat'){tone(520,.08,'square',.10);tone(790,.12,'square',.10,.06);}
  else if(n==='die'){tone(320,.2,'sawtooth',.14);tone(150,.45,'sawtooth',.14,.16);}
  else if(n==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.09));}
  else if(n==='turn'){tone(880,.03,'square',.04);}
}

/* ---------- levels ---------- */
const col=(x,a,b)=>Array.from({length:b-a+1},(_,i)=>[x,a+i]);
const row=(y,a,b)=>Array.from({length:b-a+1},(_,i)=>[a+i,y]);
const LEVELS=[
  {w:16,h:12,s:[2,6,'R'],foods:[[12,6]],walls:[],steps:30},
  {w:16,h:12,s:[1,3,'D'],foods:[[14,10]],walls:col(8,0,6),steps:35},
  {w:16,h:12,s:[8,1,'L'],foods:[[1,10],[14,10]],walls:row(6,5,10),steps:40},
  {w:16,h:12,s:[2,6,'R'],foods:[[14,1],[14,11]],walls:[...row(3,4,12),...row(8,0,11)],steps:40},
  {w:16,h:12,s:[8,6,'R'],foods:[[14,1],[14,10],[1,10],[1,1]],walls:[...col(8,2,7),[0,6],...row(6,2,5),...row(6,11,15)],steps:55},
  {w:16,h:12,s:[2,6,'R'],foods:[[8,6]],walls:[...col(5,2,9),...col(10,4,11)],steps:30},
  {w:16,h:12,s:[8,2,'D'],foods:[[4,4],[11,4],[4,8],[11,8]],walls:[...col(8,6,11),...row(6,0,7),...row(6,9,15)],steps:45},
  {w:16,h:12,s:[2,1,'R'],foods:[[14,1],[14,10],[1,10]],walls:[...col(5,2,7),...col(10,5,11)],steps:85}
];

/* ---------- state ---------- */
const DIRS={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const OPP={U:'D',D:'U',L:'R',R:'L'};
let level=0,score=0,state='menu';
let snake=[],dir='R',queue=[],foods=[],walls=[],wset=new Set(),steps=0,gw=16,gh=12;
const TICK=330;
let acc=0,lastT=0,deathReason='';

function loadLevel(i){
  const L=LEVELS[i];gw=L.w;gh=L.h;
  const[sx,sy,dd]=L.s;dir=dd;queue=[];
  const o=DIRS[OPP[dd]];
  snake=[{x:sx,y:sy},{x:sx+o[0],y:sy+o[1]},{x:sx+2*o[0],y:sy+2*o[1]}];
  foods=L.foods.map(f=>({x:f[0],y:f[1]}));
  walls=L.walls;wset=new Set(walls.map(w=>w[0]+','+w[1]));
  steps=L.steps;acc=0;
}

/* ---------- gameplay ---------- */
function setDir(d){if(state!=='play')return;if(queue.length>=3)return;const last=queue.length?queue[queue.length-1]:dir;if(d===last||d===OPP[last])return;queue.push(d);sfx('turn');}

function step(){
  if(queue.length)dir=queue.shift();
  const h=snake[0],d=DIRS[dir],nx=h.x+d[0],ny=h.y+d[1];
  steps--;
  if(nx<0||ny<0||nx>=gw||ny>=gh)return die('You hit the edge of the board');
  if(wset.has(nx+','+ny))return die('You crashed into a wall');
  const fi=foods.findIndex(f=>f.x===nx&&f.y===ny);
  const eating=fi>=0;
  for(let i=0;i<(eating?snake.length:snake.length-1);i++)
    if(snake[i].x===nx&&snake[i].y===ny)return die('You bit your own tail');
  snake.unshift({x:nx,y:ny});
  if(eating){foods.splice(fi,1);score+=50;sfx('eat');
    if(!foods.length)return levelClear();}
  else snake.pop();
  if(steps<=0&&foods.length)return die('You ran out of moves');
}

function levelClear(){
  const bonus=steps*10;score+=bonus;state='clear';sfx('win');
  showHTML('<h2>Level '+(level+1)+' Complete!</h2>'+
    '<p>Bonus for '+steps+' spare move'+(steps===1?'':'s')+': <b style="color:#ffd166">+'+bonus+'</b></p>'+
    '<p>Total score: <b>'+score+'</b></p>'+
    '<button onclick="nextLevel()">'+(level+1>=LEVELS.length?'Finish':'Next Level')+'</button>'+
    '<div class="small">or press Space</div>');
}
function nextLevel(){
  if(level+1>=LEVELS.length){state='win';sfx('win');
    showHTML('<h1>YOU WIN!</h1><p>All '+LEVELS.length+' puzzles solved.</p>'+
      '<p>Final score: <b style="color:#ffd166;font-size:22px">'+score+'</b></p>'+
      '<button onclick="newGame()">Play Again</button><div class="small">or press Space</div>');
  }else{level++;loadLevel(level);state='play';hideOv();}
}
function die(reason){deathReason=reason;state='over';sfx('die');
  showHTML('<h2>Game Over</h2><p>'+reason+'.</p>'+
    '<p>Score: <b style="color:#ffd166">'+score+'</b></p>'+
    '<button onclick="retryLevel()">Retry Level '+(level+1)+'</button>'+
    '<button class="btn2" onclick="toMenu()">Menu</button>'+
    '<div class="small">Space = retry &nbsp;·&nbsp; R = restart from level 1</div>');
}
function retryLevel(){loadLevel(level);state='play';hideOv();}
function newGame(){score=0;level=0;loadLevel(0);state='play';hideOv();}
function toMenu(){state='menu';showMenu();}

function showMenu(){
  showHTML('<h1>SNAKE PUZZLE</h1>'+
    '<p>Steer the snake to eat <b style="color:#ffb020">every pellet</b> before your move limit runs out. Walls and your own tail are deadly!</p>'+
    '<div class="keys"><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> / <kbd>W A S D</kbd> &nbsp;steer<br>'+
    '<kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>R</kbd> restart from level 1</div>'+
    '<button onclick="newGame()">Start Game</button><div class="small">or press Space</div>');
}

function primaryAction(){
  if(state==='menu'||state==='win')newGame();
  else if(state==='clear')nextLevel();
  else if(state==='over')retryLevel();
}

/* ---------- input ---------- */
window.addEventListener('keydown',e=>{
  initAudio();
  const k=e.key;
  const km={ArrowUp:'U',w:'U',W:'u',ArrowDown:'D',s:'D',S:'d',ArrowLeft:'L',a:'L',A:'l',ArrowRight:'R',d:'R',D:'r'};
  if(km[k]){e.preventDefault();setDir(km[k]);}
  else if(k===' '){e.preventDefault();primaryAction();}
  else if(k==='p'||k==='P'){
    if(state==='play'){state='pause';showHTML('<h2>Paused</h2><button onclick="togglePause()">Resume</button><div class="small">or press P</div>');}
    else if(state==='pause')togglePause();
  }
  else if(k==='r'||k==='R'){newGame();}
});
function togglePause(){if(state==='pause'){state='play';hideOv();}}
document.addEventListener('pointerdown',initAudio);

/* ---------- rendering ---------- */
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lerp(a,b,t){return a+(b-a)*t;}

function draw(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0d1220';ctx.fillRect(0,0,W,H);
  if(state==='menu')return;
  const hudH=56,pad=14;
  let cell=Math.floor(Math.min((W-pad*2)/gw,(H-hudH-pad*2)/gh));cell=Math.max(cell,8);
  const ox=(W-cell*gw)/2,oy=hudH+(H-hudH-cell*gh)/2;

  /* board bg */
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    if((x+y)%2===0){ctx.fillStyle='rgba(255,255,255,0.022)';ctx.fillRect(ox+x*cell,oy+y*cell,cell,cell);}
  }
  ctx.strokeStyle='#26314f';ctx.lineWidth=2;
  roundRect(ox-4,oy-4,gw*cell+8,gh*cell+8,10);ctx.stroke();

  /* walls */
  for(const wx of walls){
    const x=ox+wx[0]*cell,y=oy+wx[1]*cell;
    ctx.fillStyle='#2b3766';roundRect(x+1.5,y+1.5,cell-3,cell-3,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.10)';roundRect(x+3,y+3,cell-6,(cell-6)*0.35,3);ctx.fill();
  }

  /* foods */
  for(const f of foods){
    const cx=ox+f.x*cell+cell/2,cy=oy+f.y*cell+cell/2;
    const r=cell*0.28+Math.sin(t/180+f.x)*cell*0.05;
    ctx.save();ctx.shadowColor='#ffb020';ctx.shadowBlur=14;
    ctx.fillStyle='#ffb020';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();ctx.restore();
    ctx.fillStyle='#ffe6b3';ctx.beginPath();ctx.arc(cx-r*0.3,cy-r*0.35,r*0.32,0,7);ctx.fill();
  }

  /* snake */
  const n=snake.length;
  for(let i=n-1;i>=0;i--){
    const s=snake[i],f=i/(n-1||1);
    const x=ox+s.x*cell,y=oy+s.y*cell;
    ctx.fillStyle='rgb('+Math.round(lerp(126,38,f))+','+Math.round(lerp(231,150,f))+','+Math.round(lerp(135,74,f))+')';
    roundRect(x+2,y+2,cell-4,cell-4,i===0?cell*0.38:cell*0.26);ctx.fill();
  }
  /* head eyes */
  const h=snake[0],d=DIRS[dir];
  const hx=ox+h.x*cell+cell/2,hy=oy+h.y*cell+cell/2;
  const px=-d[1],py=d[0];
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(hx+d[0]*cell*0.16+px*cell*0.18,hy+d[1]*cell*0.16+py*cell*0.18,cell*0.11,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(hx+d[0]*cell*0.16-px*cell*0.18,hy+d[1]*cell*0.16-py*cell*0.18,cell*0.11,0,7);ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath();ctx.arc(hx+d[0]*cell*0.24+px*cell*0.18,hy+d[1]*cell*0.24+py*cell*0.18,cell*0.055,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(hx+d[0]*cell*0.24-px*cell*0.18,hy+d[1]*cell*0.24-py*cell*0.18,cell*0.055,0,7);ctx.fill();

  /* HUD */
  ctx.textBaseline='middle';
  ctx.font='bold 20px "Segoe UI",Arial,sans-serif';
  ctx.fillStyle='#7ee787';ctx.textAlign='left';ctx.fillText('SNAKE PUZZLE',16,hudH/2);
  ctx.fillStyle='#eaf2ff';ctx.textAlign='center';ctx.fillText('LEVEL '+(level+1)+' / '+LEVELS.length,W/2,hudH/2);
  ctx.textAlign='right';
  const low=steps<10&&state==='play';
  ctx.fillStyle=low?(Math.floor(t/300)%2?'#ff5c7a':'#ffb3c2'):'#ffd166';
  ctx.fillText('MOVES '+Math.max(0,steps),W-190,hudH/2);
  ctx.fillStyle='#aebadb';ctx.fillText('SCORE '+score,W-16,hudH/2);
}

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(t-lastT,100);lastT=t;
  if(state==='play'){acc+=dt;while(acc>=TICK&&state==='play'){acc-=TICK;step();}}
  draw(t);
}

/* ---------- go ---------- */
try{localStorage.setItem('snakePuzzle','ok');}catch(e){}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
