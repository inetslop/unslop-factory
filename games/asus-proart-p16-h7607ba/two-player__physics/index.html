<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PUSH PIT — Physics Duel</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e1a;}
  canvas{display:block;position:absolute;inset:0;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Segoe UI',Arial,sans-serif;color:#fff;text-align:center;z-index:5;
    background:rgba(8,10,24,.72);backdrop-filter:blur(3px);
  }
  .hidden{display:none;}
  h1{font-size:min(9vw,64px);margin:0 0 6px;letter-spacing:4px;}
  h1 .b{color:#4db8ff;text-shadow:0 0 18px rgba(77,184,255,.8);}
  h1 .r{color:#ff5d5d;text-shadow:0 0 18px rgba(255,93,93,.8);}
  .sub{opacity:.85;margin-bottom:26px;font-size:15px;}
  .cols{display:flex;gap:40px;margin-bottom:30px;flex-wrap:wrap;justify-content:center;}
  .card{background:rgba(255,255,255,.07);border-radius:14px;padding:16px 26px;min-width:220px;font-size:15px;line-height:1.9;}
  .card h3{margin:0 0 8px;font-size:18px;}
  .p1c{border-top:4px solid #4db8ff;} .p1c h3{color:#4db8ff;}
  .p2c{border-top:4px solid #ff5d5d;} .p2c h3{color:#ff5d5d;}
  kbd{background:#2a3050;border-radius:5px;padding:1px 8px;font-family:inherit;border:1px solid #4a5386;box-shadow:0 2px 0 #191e38;}
  button{
    font-size:20px;font-weight:bold;letter-spacing:2px;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#3b7dff,#2456c9);border:none;border-radius:12px;padding:14px 44px;
    box-shadow:0 6px 0 #16307a,0 10px 24px rgba(0,0,0,.5);transition:transform .08s;
  }
  button:hover{transform:translateY(-2px);}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #16307a;}
  #winTitle{font-size:min(8vw,54px);margin-bottom:10px;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="startScreen" class="overlay">
  <h1><span class="b">PUSH</span> <span class="r">PIT</span></h1>
  <div class="sub">A physics duel — shunt your rival off the platforms. First to <b>3 KOs</b> wins.</div>
  <div class="cols">
    <div class="card p1c">
      <h3>PLAYER 1 (Blue)</h3>
      <kbd>A</kbd> <kbd>D</kbd> move<br>
      <kbd>W</kbd> jump<br>
      <kbd>S</kbd> drop through<br>
      <kbd>E</kbd> dash
    </div>
    <div class="card p2c">
      <h3>PLAYER 2 (Red)</h3>
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move<br>
      <kbd>&uarr;</kbd> jump<br>
      <kbd>&darr;</kbd> drop through<br>
      <kbd>L</kbd> dash
    </div>
  </div>
  <button id="startBtn">START &nbsp;(Enter)</button>
  <div class="sub" style="margin-top:18px;">Press <kbd>R</kbd> anytime to restart</div>
</div>

<div id="winScreen" class="overlay hidden">
  <div id="winTitle"></div>
  <div class="sub" id="winScore"></div>
  <button id="againBtn">PLAY AGAIN &nbsp;(R)</button>
</div>

<script>
(function(){
"use strict";
const W=960,H=540;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const startScreen=document.getElementById('startScreen'),winScreen=document.getElementById('winScreen');
let scale=1,offX=0,offY=0,dpr=1;

function resize(){
  dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  scale=Math.min(innerWidth/W,innerHeight/H);
  offX=(innerWidth-W*scale)/2; offY=(innerHeight-H*scale)/2;
}
addEventListener('resize',resize); resize();

/* ---------- Audio (starts after first input) ---------- */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f0,f1,dur,type,vol){
  const a=audio(); if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(vol||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
const sJump=()=>beep(240,520,0.14,'square',0.10);
const sDash=()=>beep(700,180,0.16,'sawtooth',0.12);
const sHit =()=>{beep(160,60,0.18,'triangle',0.22);beep(900,300,0.08,'square',0.06);};
const sKO  =()=>{beep(500,60,0.55,'sawtooth',0.22);beep(250,40,0.6,'square',0.14);};
const sWin =()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,f,0.16,'square',0.12),i*130));};

/* ---------- Input ---------- */
const keys=new Set(),jp=new Set();
const HANDLED=['KeyA','KeyD','KeyW','KeyS','KeyE','KeyL','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter','KeyR'];
addEventListener('keydown',e=>{
  if(HANDLED.includes(e.code))e.preventDefault();
  audio();
  if(!keys.has(e.code))jp.add(e.code);
  keys.add(e.code);
  if(e.code==='Enter'&&state==='start')startGame();
  if((e.code==='KeyR'||(e.code==='Enter'&&state==='win')))restart();
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('mousedown',()=>audio());

/* ---------- World ---------- */
const platforms=[
  {x:270,y:430,w:420,h:110,solid:true},
  {x:60, y:350,w:170,h:16,solid:false},
  {x:730,y:350,w:170,h:16,solid:false},
  {x:390,y:255,w:180,h:16,solid:false},
];
const G=1900, R=21, WIN_SCORE=3;

function makePlayer(color,dark,x,facing){
  return {color,dark,x,y:400,vx:0,vy:0,r:R,facing,onGround:false,coyote:0,jumpBuf:0,dropT:0,dashCd:0,score:0,landSquash:0};
}
let p1,p2,particles,state='start',koTimer=0,koText='',shake=0,winGlow=0;

function resetPositions(){
  p1.x=370;p1.y=400;p1.vx=0;p1.vy=0;p1.facing=1;p1.onGround=false;p1.coyote=0;p1.jumpBuf=0;p1.dropT=0;p1.dashCd=0;
  p2.x=590;p2.y=400;p2.vx=0;p2.vy=0;p2.facing=-1;p2.onGround=false;p2.coyote=0;p2.jumpBuf=0;p2.dropT=0;p2.dashCd=0;
  particles=[];shake=0;
}
function restart(){
  p1.score=0;p2.score=0;resetPositions();state='play';
  startScreen.classList.add('hidden');winScreen.classList.add('hidden');
}
function startGame(){restart();}
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',restart);

const CTRL1={left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',dash:'KeyE'};
const CTRL2={left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',dash:'KeyL'};

/* ---------- Particles ---------- */
function spawn(x,y,n,cols,sp,life){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(0.3+Math.random())*sp;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*0.4,life:life*(0.6+Math.random()*0.7),max:life,c:cols[i%cols.length],sz:2+Math.random()*3});
  }
}

/* ---------- Physics ---------- */
function collideSolid(p,r){
  const cx=Math.max(r.x,Math.min(p.x,r.x+r.w));
  const cy=Math.max(r.y,Math.min(p.y,r.y+r.h));
  let dx=p.x-cx,dy=p.y-cy;
  const d2=dx*dx+dy*dy;
  if(d2>p.r*p.r)return false;
  let d=Math.sqrt(d2),nx,ny;
  if(d<0.0001){ // center inside: push out min axis
    const l=p.x-r.x,rt=r.x+r.w-p.x,tp=p.y-r.y,bt=r.y+r.h-p.y;
    const m=Math.min(l,rt,tp,bt);
    if(m===tp){nx=0;ny=-1;p.y=r.y-p.r;}
    else if(m===bt){nx=0;ny=1;p.y=r.y+r.h+p.r;}
    else if(m===l){nx=-1;ny=0;p.x=r.x-p.r;}
    else{nx=1;ny=0;p.x=r.x+r.w+p.r;}
  }else{
    nx=dx/d;ny=dy/d;
    p.x=cx+nx*p.r;p.y=cy+ny*p.r;
  }
  const vn=p.vx*nx+p.vy*ny;
  if(vn<0){p.vx-=vn*nx;p.vy-=vn*ny;}
  return ny<-0.5;
}

function stepPlayer(p,ctrl,dt,opp){
  // timers
  p.coyote-=dt;p.jumpBuf-=dt;p.dropT-=dt;p.dashCd-=dt;p.landSquash=Math.max(0,p.landSquash-dt*4);
  if(jp.has(ctrl.up))p.jumpBuf=0.12;

  // horizontal input
  const dir=(keys.has(ctrl.right)?1:0)-(keys.has(ctrl.left)?1:0);
  if(dir!==0)p.facing=dir;
  const target=dir*330;
  const rate=p.onGround?12:6;
  p.vx+=(target-p.vx)*Math.min(1,rate*dt);

  // jump
  if(p.jumpBuf>0&&(p.onGround||p.coyote>0)){
    p.vy=-660;p.onGround=false;p.coyote=0;p.jumpBuf=0;sJump();
    spawn(p.x,p.y+p.r,5,['#ffffff',p.color],120,0.3);
  }
  // drop through
  if(keys.has(ctrl.down)&&p.onGround){p.dropT=Math.max(p.dropT,0.22);if(p.vy>=0)p.vy=50;p.onGround=false;}

  // dash (edge triggered)
  if(jp.has(ctrl.dash)&&p.dashCd<=0){
    const d=(dir!==0)?dir:p.facing;
    p.vx=d*880;p.vy*=0.25;p.dashCd=0.9;sDash();
    spawn(p.x-d*p.r,p.y,10,[p.color,'#ffffff'],260,0.35);
  }

  // integrate
  p.vy+=G*dt; if(p.vy>1100)p.vy=1100;
  const prevY=p.y;
  p.x+=p.vx*dt; p.y+=p.vy*dt;

  // walls (soft bounce at world edges)
  if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx)*0.4;}
  if(p.x>W-p.r){p.x=W-p.r;p.vx=-Math.abs(p.vx)*0.4;}

  const wasGround=p.onGround; p.onGround=false;

  // solid platform
  for(const pl of platforms){
    if(pl.solid&&collideSolid(p,pl))p.onGround=true;
  }
  // one-way platforms
  if(p.dropT<=0){
    for(const pl of platforms){
      if(pl.solid)continue;
      const prevBottom=prevY+p.r;
      if(p.vy>=0&&prevBottom<=pl.y+8&&p.y+p.r>=pl.y&&p.x+p.r>pl.x&&p.x-p.r<pl.x+pl.w){
        p.y=pl.y-p.r;p.vy=0;p.onGround=true;
      }
    }
  }
  if(p.onGround)p.coyote=0.1;
  else if(wasGround)p.coyote=0.1;

  // landing dust
  if(p.onGround&&!wasGround&&p.vy>=0){}
  if(!wasGround&&p.onGround){p.landSquash=1;spawn(p.x,p.y+p.r,6,['#ffffff','#9aa3c8'],140,0.25);}

  // fell into the pit
  if(p.y-p.r>H+60){
    p.score===undefined;
    opp.score++;
    state='ko';koTimer=1.4;shake=14;sKO();
    koText=(opp===p2?'BLUE':'RED')+' SCORES!';
    spawn(W/2,H-40,50,[p.color,'#ffffff',p.dark],420,0.9);
  }
}

function playerPush(a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  let d=Math.hypot(dx,dy);
  const minD=a.r+b.r+1;
  if(d>=minD||d===0)return false;
  const nx=dx/d,ny=dy/d;
  const overlap=(minD-d)/2;
  a.x-=nx*overlap;a.y-=ny*overlap;b.x+=nx*overlap;b.y+=ny*overlap;
  const relN=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  let j=0;
  if(relN<0){j=-(1.05)*relN/2;}
  j=Math.max(j,150); // guaranteed pop apart
  a.vx-=nx*j;a.vy-=ny*j*0.7;b.vx+=nx*j;b.vy+=ny*j*0.7;
  if(Math.abs(relN)>180||(a.onGround&&b.onGround)){
    shake=Math.max(shake,6);sHit();winGlow=0.25;
    spawn((a.x+b.x)/2,(a.y+b.y)/2,14,['#ffffff','#ffe066',a.color,b.color],300,0.4);
  }
  return true;
}

/* ---------- Update ---------- */
function update(dt){
  if(state==='play'){
    stepPlayer(p1,CTRL1,dt,p2);
    if(state==='play')stepPlayer(p2,CTRL2,dt,p1);
    playerPush(p1,p2);playerPush(p1,p2);
  }else if(state==='ko'){
    koTimer-=dt;
    if(koTimer<=0){
      if(p1.score>=WIN_SCORE||p2.score>=WIN_SCORE){
        const w=p1.score>p2.score?1:2;
        document.getElementById('winTitle').innerHTML=w===1?'<span style="color:#4db8ff">PLAYER 1</span> WINS!':'<span style="color:#ff5d5d">PLAYER 2</span> WINS!';
        document.getElementById('winScore').textContent='Final score  '+p1.score+' — '+p2.score;
        winScreen.classList.remove('hidden');state='win';sWin();
      }else{resetPositions();state='play';}
    }
  }
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];q.life-=dt;
    if(q.life<=0){particles.splice(i,1);continue;}
    q.vy+=700*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
  }
  shake=Math.max(0,shake-dt*30);
  winGlow=Math.max(0,winGlow-dt);
}

/* ---------- Render ---------- */
function drawPlatform(pl){
  if(pl.solid){
    const g=ctx.createLinearGradient(0,pl.y,0,pl.y+pl.h);
    g.addColorStop(0,'#3a4470');g.addColorStop(1,'#20263f');
    ctx.fillStyle=g;
    roundRect(pl.x,pl.y,pl.w,pl.h,8);ctx.fill();
    ctx.fillStyle='#59d98c';roundRect(pl.x,pl.y,pl.w,6,4);ctx.fill();
  }else{
    ctx.fillStyle='#39406b';roundRect(pl.x,pl.y,pl.w,pl.h,6);ctx.fill();
    ctx.fillStyle='#7f8ac2';roundRect(pl.x,pl.y,pl.w,4,3);ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawPlayer(p){
  const sq=p.landSquash*0.25;
  ctx.save();
  ctx.translate(p.x,p.y);
  // dash cooldown ring
  if(p.dashCd>0){
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,p.r+6,-Math.PI/2,-Math.PI/2+(1-p.dashCd/0.9)*Math.PI*2);ctx.stroke();
  }else{
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,p.r+6,0,Math.PI*2);ctx.stroke();
  }
  ctx.scale(1+sq*0.5,1-sq);
  const g=ctx.createRadialGradient(-p.r*0.3,-p.r*0.4,4,0,0,p.r*1.2);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.25,p.color);g.addColorStop(1,p.dark);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
  // eyes
  const ex=p.facing*6;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ex-6,-4,5.5,0,Math.PI*2);ctx.arc(ex+7,-4,5.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#141830';
  ctx.beginPath();ctx.arc(ex-6+p.facing*2,-4,2.6,0,Math.PI*2);ctx.arc(ex+7+p.facing*2,-4,2.6,0,Math.PI*2);ctx.fill();
  // mouth
  ctx.strokeStyle='#141830';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(ex+0.5,4,4,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.restore();
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // full-window backdrop
  const bg=ctx.createLinearGradient(0,0,0,innerHeight);
  bg.addColorStop(0,'#101433');bg.addColorStop(1,'#080a18');
  ctx.fillStyle=bg;ctx.fillRect(0,0,innerWidth,innerHeight);

  ctx.save();
  ctx.translate(offX+(Math.random()-0.5)*shake*scale,offY+(Math.random()-0.5)*shake*scale);
  ctx.scale(scale,scale);

  // arena backdrop
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a2150');sky.addColorStop(0.6,'#2b2a5e');sky.addColorStop(1,'#4a2340');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<40;i++){
    const sx=(i*197)%W,sy=(i*89)%260;
    ctx.globalAlpha=0.2+((i*37)%10)/14;
    ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;
  // moon
  ctx.fillStyle='#f4e9c8';ctx.beginPath();ctx.arc(820,90,34,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(820,90,50,0,Math.PI*2);ctx.fill();
  // glowing pit below
  const pit=ctx.createLinearGradient(0,H-70,0,H+40);
  pit.addColorStop(0,'rgba(255,60,60,0)');pit.addColorStop(1,'rgba(255,80,60,.45)');
  ctx.fillStyle=pit;ctx.fillRect(0,H-70,W,120);

  platforms.forEach(drawPlatform);
  if(state!=='start'){drawPlayer(p1);drawPlayer(p2);}

  // particles
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.c;ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);
  }
  ctx.globalAlpha=1;

  // HUD
  if(state!=='start'){
    ctx.textAlign='center';
    ctx.font='bold 34px "Segoe UI",Arial,sans-serif';
    ctx.fillStyle='#4db8ff';ctx.fillText(String(p1.score),W/2-60,52);
    ctx.fillStyle='#ff5d5d';ctx.fillText(String(p2.score),W/2+60,52);
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='bold 20px Arial';
    ctx.fillText('—',W/2,48);
    ctx.font='13px Arial';ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.fillText('FIRST TO '+WIN_SCORE,W/2,70);
    ctx.textAlign='left';ctx.font='bold 14px Arial';
    ctx.fillStyle='#4db8ff';ctx.fillText('P1',W/2-96,30);
    ctx.textAlign='right';ctx.fillStyle='#ff5d5d';ctx.fillText('P2',W/2+96,30);

    if(winGlow>0){
      ctx.globalAlpha=winGlow;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    }
  }
  if(state==='ko'){
    const t=1.4-koTimer;
    const s=Math.min(1,t*5)*(1+Math.sin(t*20)*0.03*(t<0.6?1:0));
    ctx.save();ctx.translate(W/2,H/2-20);ctx.scale(s,s);
    ctx.textAlign='center';
    ctx.font='bold 72px "Segoe UI",Arial,sans-serif';
    ctx.lineWidth=8;ctx.strokeStyle='#141830';ctx.strokeText('K.O.!',0,0);
    ctx.fillStyle='#ffe066';ctx.fillText('K.O.!',0,0);
    ctx.font='bold 26px Arial';
    ctx.strokeStyle='#141830';ctx.lineWidth=5;ctx.strokeText(koText,0,48);
    ctx.fillStyle='#fff';ctx.fillText(koText,0,48);
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- Loop ---------- */
let last=performance.now();
function loop(now){
  let dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='play'||state==='ko')update(dt);
  render();
  jp.clear();
  requestAnimationFrame(loop);
}

// init so rendering works behind the start screen
p1=makePlayer('#4db8ff','#1c5fa8',370,1);
p2=makePlayer('#ff5d5d','#a82c2c',590,-1);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
