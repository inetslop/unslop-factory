<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout Gravity</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05060f;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
"use strict";

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');

// Logical playfield
var W = 840, H = 560;
var scale = 1, offX = 0, offY = 0;

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = Math.min(canvas.width / W, canvas.height / H);
  offX = (canvas.width - W * scale) / 2;
  offY = (canvas.height - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio ----------
var audioCtx = null;
function initAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type, vol){
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

// ---------- Game state ----------
var STATE_START = 0, STATE_PLAY = 1, STATE_OVER = 2, STATE_WIN = 3;
var state = STATE_START;

var paddle, balls, bricks, drops, particles;
var score, lives, level;
var gravTimer = 0;      // anti-gravity powerup timer
var wideTimer = 0;
var slowTimer = 0;
var shake = 0;
var basePaddleW = 110;

function resetGame(){
  score = 0; lives = 3; level = 1;
  gravTimer = 0; wideTimer = 0; slowTimer = 0;
  drops = []; particles = [];
  buildLevel();
  spawnBallOnPaddle();
}

function buildLevel(){
  bricks = [];
  var rows = Math.min(4 + level, 8);
  var cols = 10;
  var bw = 70, bh = 24, gap = 6;
  var totalW = cols * (bw + gap) - gap;
  var startX = (W - totalW) / 2;
  var startY = 70;
  var rowColors = ['#ff5d73','#ffb14e','#ffe14e','#9dff5d','#5dffd6','#5db8ff','#b05dff','#ff5df0'];
  for (var r = 0; r < rows; r++){
    for (var c = 0; c < cols; c++){
      var hp = 1;
      if (level >= 3 && r < 2) hp = 2;
      if (level >= 5 && r === 0) hp = 3;
      bricks.push({
        x: startX + c * (bw + gap),
        y: startY + r * (bh + gap),
        w: bw, h: bh,
        hp: hp, maxHp: hp,
        color: rowColors[r % rowColors.length]
      });
    }
  }
}

function paddleW(){ return wideTimer > 0 ? basePaddleW * 1.6 : basePaddleW; }

function makeBall(x, y, vx, vy){
  var speed = ballSpeed();
  return { x: x, y: y, vx: vx, vy: vy, r: 8, stuck: false };
}
function spawnBallOnPaddle(){
  balls = [makeBall(paddle ? paddle.x + paddle.w/2 : W/2, H - 60, 0, 0)];
  balls[0].stuck = true;
}

function ballSpeed(){ return 380 + level * 15; }

function launchBall(b){
  if (!b.stuck) return;
  b.stuck = false;
  var a = (Math.random() * 0.6 - 0.3); // slight random angle
  var s = ballSpeed();
  b.vx = Math.sin(a) * s;
  b.vy = -Math.cos(a) * s;
  beep(440, 0.08, 'square', 0.07);
}

function startGame(){
  resetGame();
  state = STATE_PLAY;
}

// ---------- Input ----------
var keys = {};
window.addEventListener('keydown', function(e){
  initAudio();
  var k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' || e.code === 'Space') e.preventDefault();

  if (state === STATE_START && (k === ' ' || k === 'enter')){ startGame(); }
  else if (state === STATE_PLAY){
    if (k === ' ' || k === 'enter'){
      for (var i = 0; i < balls.length; i++) launchBall(balls[i]);
    }
    if (k === 'r'){ resetGame(); state = STATE_PLAY; }
  }
  else if ((state === STATE_OVER || state === STATE_WIN) && (k === ' ' || k === 'enter' || k === 'r')){
    startGame();
  }
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousemove', function(e){
  var rect = canvas.getBoundingClientRect();
  var mx = (e.clientX - rect.left - offX) / scale;
  if (paddle){
    paddle.x = Math.max(0, Math.min(W - paddleW(), mx - paddle.w/2));
  }
});
canvas.addEventListener('mousedown', function(){
  initAudio();
  if (state === STATE_START){ startGame(); }
  else if (state === STATE_PLAY){
    for (var i = 0; i < balls.length; i++) launchBall(balls[i]);
  }
  else { startGame(); }
});

// ---------- Particles ----------
function burst(x, y, color, n){
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2;
    var s = 60 + Math.random() * 180;
    particles.push({ x: x, y: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 60, life: 0.5 + Math.random()*0.3, maxLife: 0.8, color: color });
  }
}

// ---------- Powerups ----------
var DROP_TYPES = [
  { id: 'G', label: 'G', color: '#9dff5d', name: 'Low Gravity' },
  { id: 'W', label: 'W', color: '#5db8ff', name: 'Wide Paddle' },
  { id: 'M', label: 'M', color: '#ffe14e', name: 'Multi Ball' },
  { id: 'L', label: '+', color: '#ff5d73', name: 'Extra Life' }
];
function spawnDrop(x, y){
  var t = DROP_TYPES[Math.floor(Math.random() * DROP_TYPES.length)];
  drops.push({ x: x, y: y, vx: (Math.random()-0.5)*60, vy: -40, type: t, r: 12 });
}
function applyDrop(d){
  var s = d.type.id;
  if (s === 'G') gravTimer = 8;
  else if (s === 'W') wideTimer = 8;
  else if (s === 'M'){
    var src = balls[0] || { x: W/2, y: H-60, vx: 100, vy: -300 };
    for (var i = 0; i < 2 && balls.length < 6; i++){
      var a = (Math.random()*0.8 - 0.4) + (i===0? 0.5 : -0.5);
      var sp = ballSpeed();
      balls.push({ x: src.x, y: src.y, vx: Math.cos(a)*sp, vy: -Math.abs(Math.sin(a)*sp), r: 8, stuck: false });
    }
  }
  else if (s === 'L'){ lives = Math.min(lives + 1, 6); }
  beep(880, 0.12, 'triangle', 0.09);
}

// ---------- Update ----------
function update(dt){
  // timers
  gravTimer = Math.max(0, gravTimer - dt);
  wideTimer = Math.max(0, wideTimer - dt);
  slowTimer = Math.max(0, slowTimer - dt);
  shake = Math.max(0, shake - dt * 30);

  var pw = paddleW();
  if (Math.abs(paddle.w - pw) > 0.5){
    var cx = paddle.x + paddle.w/2;
    paddle.w = pw;
    paddle.x = Math.max(0, Math.min(W - pw, cx - pw/2));
  }

  // paddle movement (keyboard)
  var pspeed = 560;
  if (keys['arrowleft'] || keys['a']) paddle.x -= pspeed * dt;
  if (keys['arrowright'] || keys['d']) paddle.x += pspeed * dt;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  var g = gravTimer > 0 ? 90 : 480;      // gravity
  var timeScale = slowTimer > 0 ? 0.65 : 1;

  // stuck balls follow paddle
  for (var i = 0; i < balls.length; i++){
    if (balls[i].stuck){
      balls[i].x = paddle.x + paddle.w/2;
      balls[i].y = paddle.y - balls[i].r - 2;
    }
  }

  // balls
  for (var bi = balls.length - 1; bi >= 0; bi--){
    var b = balls[bi];
    if (b.stuck) continue;
    var sdt = dt * timeScale;
    b.vy += g * sdt;
    // speed cap
    var sp = Math.hypot(b.vx, b.vy);
    var maxSp = ballSpeed() * 1.9;
    if (sp > maxSp){ b.vx *= maxSp/sp; b.vy *= maxSp/sp; }

    b.x += b.vx * sdt;
    b.y += b.vy * sdt;

    // walls
    if (b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx); beep(220,0.04,'square',0.05); }
    if (b.x + b.r > W){ b.x = W - b.r; b.vx = -Math.abs(b.vx); beep(220,0.04,'square',0.05); }
    if (b.y - b.r < 40){ b.y = 40 + b.r; b.vy = Math.abs(b.vy); beep(220,0.04,'square',0.05); }

    // paddle
    if (b.vy > 0 &&
        b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r){
      var rel = (b.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      rel = Math.max(-1, Math.min(1, rel));
      var a = rel * 1.05; // max ~60 deg
      var s = ballSpeed();
      b.vx = Math.sin(a) * s;
      b.vy = -Math.cos(a) * s;
      b.y = paddle.y - b.r - 0.5;
      beep(330, 0.06, 'square', 0.07);
    }

    // bricks
    for (var ki = bricks.length - 1; ki >= 0; ki--){
      var br = bricks[ki];
      if (b.x + b.r < br.x || b.x - b.r > br.x + br.w ||
          b.y + b.r < br.y || b.y - b.r > br.y + br.h) continue;

      // closest point
      var cxp = Math.max(br.x, Math.min(b.x, br.x + br.w));
      var cyp = Math.max(br.y, Math.min(b.y, br.y + br.h));
      var dx = b.x - cxp, dy = b.y - cyp;
      if (dx*dx + dy*dy > b.r*b.r) continue;

      // reflect on shallowest axis
      var overlapX = b.r - Math.abs(dx);
      var overlapY = b.r - Math.abs(dy);
      if (Math.abs(dx) > Math.abs(dy)){
        b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
        b.x += dx > 0 ? overlapX : -overlapX;
      } else {
        b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
        b.y += dy > 0 ? overlapY : -overlapY;
      }

      br.hp--;
      if (br.hp <= 0){
        bricks.splice(ki, 1);
        score += 10 * level;
        shake = 4;
        burst(br.x + br.w/2, br.y + br.h/2, br.color, 10);
        beep(520 + Math.random()*80, 0.07, 'square', 0.07);
        if (Math.random() < 0.16) spawnDrop(br.x + br.w/2, br.y + br.h/2);
      } else {
        score += 5;
        beep(380, 0.05, 'square', 0.05);
      }
      break; // one brick per frame per ball
    }

    // fell out
    if (b.y - b.r > H + 20){
      balls.splice(bi, 1);
      beep(140, 0.25, 'sawtooth', 0.09);
    }
  }

  // lose life
  if (balls.length === 0 && state === STATE_PLAY){
    lives--;
    if (lives <= 0){
      state = STATE_OVER;
      beep(90, 0.5, 'sawtooth', 0.1);
      saveHigh();
    } else {
      spawnBallOnPaddle();
    }
  }

  // win level
  if (bricks.length === 0 && state === STATE_PLAY){
    level++;
    score += 100 * level;
    buildLevel();
    spawnBallOnPaddle();
    beep(660, 0.15, 'triangle', 0.09);
    setTimeout(function(){ if (audioCtx) beep(880, 0.2, 'triangle', 0.09); }, 130);
  }

  // drops
  for (var di = drops.length - 1; di >= 0; di--){
    var d = drops[di];
    d.vy += g * 0.55 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (d.x < d.r){ d.x = d.r; d.vx = Math.abs(d.vx); }
    if (d.x > W - d.r){ d.x = W - d.r; d.vx = -Math.abs(d.vx); }
    // catch
    if (d.vy > 0 &&
        d.y + d.r >= paddle.y && d.y - d.r <= paddle.y + paddle.h + 6 &&
        d.x >= paddle.x - d.r && d.x <= paddle.x + paddle.w + d.r){
      applyDrop(d);
      burst(d.x, d.y, d.type.color, 12);
      drops.splice(di, 1);
      continue;
    }
    if (d.y - d.r > H) drops.splice(di, 1);
  }

  // particles
  for (var pi = particles.length - 1; pi >= 0; pi--){
    var p = particles[pi];
    p.vy += g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(pi, 1);
  }
}

// ---------- High score ----------
function loadHigh(){ try { return parseInt(localStorage.getItem('breakoutGravityHigh') || '0', 10) || 0; } catch(e){ return 0; } }
function saveHigh(){ try { if (score > loadHigh()) localStorage.setItem('breakoutGravityHigh', String(score)); } catch(e){} }

// ---------- Draw ----------
function drawBrick(br){
  var alpha = br.hp / br.maxHp;
  ctx.globalAlpha = 0.45 + 0.55 * alpha;
  ctx.fillStyle = br.color;
  roundRect(br.x, br.y, br.w, br.h, 5);
  ctx.fill();
  ctx.globalAlpha = 1;
  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  roundRect(br.x + 3, br.y + 3, br.w - 6, 6, 3);
  ctx.fill();
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBG(){
  // stars
  ctx.fillStyle = '#0a0d22';
  ctx.fillRect(0, 0, W, H);
  var t = performance.now() * 0.001;
  for (var i = 0; i < 40; i++){
    var sx = ((i * 137.5) % W);
    var sy = ((i * 91.3 + Math.sin(t*0.2 + i)*8) % (H-60)) + 50;
    var tw = 0.4 + 0.6 * Math.abs(Math.sin(t + i));
    ctx.globalAlpha = tw * 0.7;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
  // top border
  ctx.fillStyle = '#1a2050';
  ctx.fillRect(0, 0, W, 40);
  ctx.strokeStyle = '#3a4690';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 40); ctx.lineTo(W, 40); ctx.stroke();
}

function drawHUD(){
  ctx.fillStyle = 'rgba(10,13,34,0.85)';
  ctx.fillRect(0, 0, W, 40);
  ctx.font = 'bold 20px monospace';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe14e';
  ctx.fillText('SCORE ' + score, 16, 21);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#9dff5d';
  ctx.fillText('LEVEL ' + level, W/2, 21);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5d73';
  var hearts = '';
  for (var i = 0; i < lives; i++) hearts += '\u2665 ';
  ctx.fillText(hearts.trim(), W - 16, 21);

  // active powerup bars
  var bx = 16, by = H - 14;
  function bar(timer, max, color){
    if (timer <= 0) return;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(bx, by, 90, 6);
    ctx.fillStyle = color;
    ctx.fillRect(bx, by, 90 * (timer/max), 6);
    bx += 104;
  }
  bar(gravTimer, 8, '#9dff5d');
  bar(wideTimer, 8, '#5db8ff');
}

function drawCenterScreen(title, subtitle, color){
  ctx.fillStyle = 'rgba(5,6,15,0.78)';
  ctx.fillRect(0, 40, W, H - 40);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = 'bold 52px monospace';
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 24;
  ctx.fillText(title, W/2, H/2 - 70);
  ctx.shadowBlur = 0;

  ctx.font = '18px monospace';
  ctx.fillStyle = '#cfd6ff';
  var lines = subtitle.split('\n');
  for (var i = 0; i < lines.length; i++){
    ctx.fillText(lines[i], W/2, H/2 - 10 + i * 28);
  }

  var pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.004);
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + pulse*0.6) + ')';
  ctx.fillText('PRESS SPACE OR CLICK TO START', W/2, H/2 + 100);

  var hi = loadHigh();
  if (hi > 0){
    ctx.font = '16px monospace';
    ctx.fillStyle = '#ffe14e';
    ctx.fillText('HIGH SCORE: ' + hi, W/2, H/2 + 140);
  }
}

function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#05060f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  var shx = shake > 0 ? (Math.random()-0.5) * shake : 0;
  var shy = shake > 0 ? (Math.random()-0.5) * shake : 0;
  ctx.setTransform(scale, 0, 0, scale, offX + shx * scale, offY + shy * scale);

  drawBG();

  // bricks
  for (var i = 0; i < bricks.length; i++) drawBrick(bricks[i]);

  // drops
  for (var di = 0; di < drops.length; di++){
    var d = drops[di];
    ctx.fillStyle = d.type.color;
    ctx.shadowColor = d.type.color; ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#05060f';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.type.label, d.x, d.y + 1);
  }

  // paddle
  if (paddle){
    var glow = gravTimer > 0 ? '#9dff5d' : (wideTimer > 0 ? '#5db8ff' : '#ffffff');
    ctx.shadowColor = glow; ctx.shadowBlur = 16;
    var grad = ctx.createLinearGradient(0, paddle.y, 0, paddle.y + paddle.h);
    grad.addColorStop(0, '#e8ecff');
    grad.addColorStop(1, '#7a86c9');
    ctx.fillStyle = grad;
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // balls
  for (var bi = 0; bi < balls.length; bi++){
    var b = balls[bi];
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // gravity trail
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.04, b.y - b.vy * 0.04);
    ctx.stroke();
  }

  // particles
  for (var pi = 0; pi < particles.length; pi++){
    var p = particles[pi];
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  drawHUD();

  if (state === STATE_START){
    drawCenterScreen('BREAKOUT GRAVITY',
      'The ball falls — keep it alive!\n\n' +
      '\u2190 \u2192 / A D or MOUSE : move paddle\nSPACE / CLICK : launch ball\nR : restart\n\nCatch falling power-ups:\nG low gravity  W wide paddle  M multi ball  + life',
      '#5db8ff');
  } else if (state === STATE_OVER){
    drawCenterScreen('GAME OVER',
      'Final score: ' + score,
      '#ff5d73');
  }

  // stuck-ball hint
  if (state === STATE_PLAY && balls.length > 0 && balls[0].stuck){
    var pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.006);
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + pulse*0.5) + ')';
    ctx.fillText('SPACE / CLICK TO LAUNCH', W/2, H - 100);
  }

  // reset paddle reference width on init
  if (!paddle){
    paddle = { x: W/2 - basePaddleW/2, y: H - 34, w: basePaddleW, h: 14 };
  }
}

// init objects for start screen background
paddle = { x: W/2 - basePaddleW/2, y: H - 34, w: basePaddleW, h: 14 };
balls = []; bricks = []; drops = []; particles = [];
score = 0; lives = 3; level = 1;

// ---------- Loop ----------
var last = performance.now();
function loop(now){
  var dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  if (state === STATE_PLAY) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
