<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orb Storm — Match-3 Bullet Hell</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060f;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;

const COLS=8,ROWS=6;
const COLORS=['#ff4d6d','#4dc3ff','#5dff8f','#ffd94d','#c26bff'];
const GLOWS =['rgba(255,77,109,.35)','rgba(77,195,255,.35)','rgba(93,255,143,.35)','rgba(255,217,77,.35)','rgba(194,107,255,.35)'];

let L={gridX:0,gridY:0,cell:40,arena:{x:0,y:0,w:0,h:0},gridTop:0};
let stars=[];

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const cell=Math.max(24,Math.min(64,Math.floor(Math.min((W-30)/COLS,(H*0.44)/ROWS))));
  const gw=cell*COLS,gh=cell*ROWS;
  L.cell=cell;
  L.gridX=Math.floor((W-gw)/2);
  L.gridY=H-gh-14;
  L.gridTop=L.gridY;
  L.arena={x:10,y:10,w:W-20,h:L.gridY-24};
  stars=[];
  for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*(L.gridTop-10),s:Math.random()*1.6+.4,p:Math.random()*6});
  if(G){G.p.x=Math.min(Math.max(G.p.x,L.arena.x+15),L.arena.x+L.arena.w-15);
        G.p.y=Math.min(Math.max(G.p.y,L.arena.y+15),L.arena.y+L.arena.h-15);}
}
window.addEventListener('resize',resize);

/* ---------- audio ---------- */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function beep(f,d,type,v,slide){
  const a=ac();if(!a)return;type=type||'square';v=v||0.12;
  try{
    const o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,a.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
    g.gain.setValueAtTime(v,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);
  }catch(e){}
}

/* ---------- game state ---------- */
let G=null;
function getBest(){try{return +(localStorage.getItem('orbstorm_best')||0);}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem('orbstorm_best',v);}catch(e){}}

function newGame(){
  G={state:'start',score:0,best:getBest(),lives:3,wave:0,chain:0,t:0,
     grid:makeGrid(),shots:[],ebullets:[],enemies:[],particles:[],msgs:[],
     queue:[],waveDelay:1.5,msgT:0,comboFlash:0,p:{x:W/2,y:L.gridTop-60,r:9,inv:0},
     shake:0};
}

function makeGrid(){
  let g;
  for(let tries=0;tries<30;tries++){
    g=[];
    for(let r=0;r<ROWS;r++){g[r]=[];for(let c=0;c<COLS;c++){
      let v,guard=0;
      do{v=(Math.random()*5)|0;guard++;}while(guard<20&&
        ((c>=2&&g[r][c-1]===v&&g[r][c-2]===v)||(r>=2&&g[r-1][c]===v&&g[r-2][c]===v)));
      g[r][c]=v;
    }}
    if(findMatches(g).size===0&&hasValidMove(g))return g;
  }
  return g;
}

function findMatches(g){
  const s=new Set();
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){const v=g[r][c];if(v<0){c++;continue;}
    let len=1;while(c+len<COLS&&g[r][c+len]===v)len++;
    if(len>=3)for(let k=0;k<len;k++)s.add(r*COLS+c+k);
    c+=len;}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){const v=g[r][c];if(v<0){r++;continue;}
    let len=1;while(r+len<ROWS&&g[r+len][c]===v)len++;
    if(len>=3)for(let k=0;k<len;k++)s.add((r+k)*COLS+c);
    r+=len;}}
  return s;
}

function hasValidMove(g){
  const tmp=g.map(row=>row.slice());
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c+1<COLS){[tmp[r][c],tmp[r][c+1]]=[tmp[r][c+1],tmp[r][c]];
      if(findMatches(tmp).size){[tmp[r][c],tmp[r][c+1]]=[tmp[r][c+1],tmp[r][c]];return true;}
      [tmp[r][c],tmp[r][c+1]]=[tmp[r][c+1],tmp[r][c]];}
    if(r+1<ROWS){[tmp[r][c],tmp[r+1][c]]=[tmp[r+1][c],tmp[r][c]];
      if(findMatches(tmp).size){[tmp[r][c],tmp[r+1][c]]=[tmp[r+1][c],tmp[r][c]];return true;}
      [tmp[r][c],tmp[r+1][c]]=[tmp[r+1][c],tmp[r][c]];}
  }
  return false;
}

function gravityRefill(g){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--)if(g[r][c]>=0)g[write--][c]=g[r][c];
    while(write>=0)g[write--][c]=(Math.random()*5)|0;
  }
}

function shuffleGrid(){
  const vals=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)vals.push(G.grid[r][c]);
  let ok=false;
  for(let t=0;t<40&&!ok;t++){
    for(let i=vals.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[vals[i],vals[j]]=[vals[j],vals[i]];}
    let k=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)G.grid[r][c]=vals[k++];
    ok=findMatches(G.grid).size===0&&hasValidMove(G.grid);
  }
  addMsg('NO MOVES — SHUFFLING!','#ffd94d');
  beep(220,0.25,'sawtooth',0.1,-120);
}

function addMsg(t,col){G.msgs.push({t:Math.min(G.msgT+1.6,3),text:t,color:col||'#fff'});G.msgT=3;}

/* ---------- matching / shooting ---------- */
function trySwap(r1,c1,r2,c2){
  const g=G.grid;
  [g[r1][c1],g[r2][c2]]=[g[r2][c2],g[r1][c1]];
  const m=findMatches(g);
  if(m.size===0){[g[r1][c1],g[r2][c2]]=[g[r2][c2],g[r1][c1]];beep(140,0.1,'square',0.08,-60);return;}
  G.chain=0;
  beep(360,0.07,'square',0.1,120);
  doMatch(m);
}

function doMatch(cells){
  const g=G.grid;G.chain++;
  const mult=G.chain;
  G.score+=cells.size*10*mult;
  if(mult>1)G.comboFlash=0.8;
  let spawned=0;
  cells.forEach(idx=>{
    const r=(idx/COLS)|0,c=idx%COLS,v=g[r][c];
    const x=L.gridX+c*L.cell+L.cell/2,y=L.gridY+r*L.cell+L.cell/2;
    for(let i=0;i<6;i++){const a=Math.random()*6.283,sp=40+Math.random()*120;
      G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5,max:0.5,col:COLORS[v],sz:2+Math.random()*3});}
    if(spawned<8){G.shots.push({x,y,vx:(Math.random()-0.5)*60,vy:-420-Math.random()*80});spawned++;}
    g[r][c]=-1;
  });
  gravityRefill(g);
  beep(300+G.chain*90,0.12,'triangle',0.13,150);
  const next=findMatches(g);
  if(next.size)doMatch(next);
  else{
    G.chain=0;
    if(!hasValidMove(g))shuffleGrid();
  }
}

/* ---------- waves / enemies ---------- */
function startWave(n){
  G.wave=n;
  const q=[];const t0=1.2;
  const drones=2+n, rings=n>=2?Math.min(4,1+((n/2)|0)):0, weavers=n>=3?Math.min(5,n-2):0;
  let d=t0;
  for(let i=0;i<drones;i++){q.push({type:'drone',at:d});d+=1.6;}
  for(let i=0;i<rings;i++){q.push({type:'ring',at:d});d+=3;}
  for(let i=0;i<weavers;i++){q.push({type:'weaver',at:d});d+=2.2;}
  q.sort((a,b)=>a.at-b.at);G.queue=q;G.waveClock=0;
  if(n>1&&n%3===0&&G.lives<5){G.lives++;addMsg('+1 LIFE','#5dff8f');}
  addMsg('WAVE '+n,'#4dc3ff');
  beep(200,0.15,'square',0.12,100);setTimeout(()=>beep(300,0.2,'square',0.12,150),120);
}

function spawnEnemy(type){
  const a=L.arena;
  const x=a.x+60+Math.random()*(a.w-120);
  let e={type,x,y:a.y+40,t:Math.random()*10,fireT:1+Math.random(),hp:3,maxhp:3,r:16,dir:Math.random()<0.5?-1:1};
  if(type==='drone'){e.hp=e.maxhp=3;}
  else if(type==='ring'){e.y=a.y+90;e.hp=e.maxhp=5;e.r=20;e.rate=0;}
  else{e.type='weaver';e.y=a.y+70;e.hp=e.maxhp=4;e.r=14;}
  e.hp+=Math.floor(G.wave/3);e.maxhp=e.hp;
  G.enemies.push(e);
}

function fireBullet(x,y,ang,sp){G.ebullets.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:5});}

function updateEnemies(dt){
  const a=L.arena,p=G.p;
  for(let i=G.enemies.length-1;i>=0;i--){
    const e=G.enemies[i];e.t+=dt;
    if(e.type==='drone'){
      e.x=Math.min(Math.max(a.x+40,e.baseX!==undefined?e.baseX:e.x),a.x+a.w-40);
      e.x=e.startX+Math.sin(e.t*1.3)*90;
      e.y=a.y+50+Math.sin(e.t*0.7)*22;
      e.fireT-=dt;
      if(e.fireT<=0){e.fireT=Math.max(1.1,2.4-G.wave*0.08);
        const base=Math.atan2(p.y-e.y,p.x-e.x),sp=130+G.wave*6;
        for(let k=-1;k<=1;k++)fireBullet(e.x,e.y,base+k*0.28,sp);}
    }else if(e.type==='ring'){
      e.x+=e.dir*45*dt;
      if(e.x<a.x+40||e.x>a.x+a.w-40)e.dir*=-1;
      e.y=a.y+95+Math.sin(e.t)*12;
      e.fireT-=dt;
      if(e.fireT<=0){e.fireT=Math.max(1.6,2.8-G.wave*0.07);e.rate+=0.35;
        const sp=100+G.wave*5,n=12;
        for(let k=0;k<n;k++)fireBullet(e.x,e.y,e.rate+k*6.283/n,sp);}
    }else{ // weaver
      e.x+=e.dir*(140+G.wave*8)*dt;
      if(e.x<a.x+30){e.x=a.x+30;e.dir=1;}if(e.x>a.x+a.w-30){e.x=a.x+a.w-30;e.dir=-1;}
      e.y=a.y+60+Math.sin(e.t*4)*35;
      e.fireT-=dt;
      if(e.fireT<=0){e.fireT=Math.max(0.9,1.8-G.wave*0.06);
        fireBullet(e.x,e.y,Math.atan2(p.y-e.y,p.x-e.x),170+G.wave*7);}
    }
  }
}

function killEnemy(e,i){
  const val=e.type==='drone'?100:e.type==='ring'?200:150;
  G.score+=val;
  for(let k=0;k<18;k++){const a=Math.random()*6.283,sp=60+Math.random()*180;
    G.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7,max:0.7,col:'#fff',sz:2+Math.random()*3});}
  G.enemies.splice(i,1);
  beep(500,0.15,'sawtooth',0.14,-300);
  G.shake=Math.min(8,G.shake+3);
}

/* ---------- update ---------- */
const keys={};
function update(dt){
  if(G.state!=='play')return;
  G.t+=dt;
  // player move
  const p=G.p,sp=320*dt,a=L.arena;
  if(keys['arrowleft']||keys['a'])p.x-=sp;
  if(keys['arrowright']||keys['d'])p.x+=sp;
  if(keys['arrowup']||keys['w'])p.y-=sp;
  if(keys['arrowdown']||keys['s'])p.y+=sp;
  p.x=Math.min(Math.max(a.x+14,p.x),a.x+a.w-14);
  p.y=Math.min(Math.max(a.y+14,p.y),a.y+a.h-14);
  if(p.inv>0)p.inv-=dt;
  if(G.comboFlash>0)G.comboFlash-=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*20);

  // wave logic
  if(G.queue.length){
    G.waveClock+=dt;
    while(G.queue.length&&G.queue[0].at<=G.waveClock)spawnEnemy(G.queue.shift().type);
  }else if(G.enemies.length===0&&G.waveDelay>0){
    G.waveDelay-=dt;
    if(G.waveDelay<=0)startWave(G.wave+1);
  }

  updateEnemies(dt);

  // player shots (homing)
  for(let i=G.shots.length-1;i>=0;i--){
    const s=G.shots[i];
    let best=null,bd=1e9;
    for(const e of G.enemies){const d=(e.x-s.x)*(e.x-s.x)+(e.y-s.y)*(e.y-s.y);if(d<bd){bd=d;best=e;}}
    if(best){
      const cur=Math.atan2(s.vy,s.vx),want=Math.atan2(best.y-s.y,best.x-s.x);
      let diff=want-cur;while(diff>Math.PI)diff-=6.283;while(diff<-Math.PI)diff+=6.283;
      const turn=Math.max(-7*dt,Math.min(7*dt,diff));
      const mag=Math.hypot(s.vx,s.vy),na=cur+turn;
      s.vx=Math.cos(na)*mag;s.vy=Math.sin(na)*mag;
    }
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    let hit=false;
    for(let j=G.enemies.length-1;j>=0;j--){const e=G.enemies[j];
      const dx=e.x-s.x,dy=e.y-s.y;
      if(dx*dx+dy*dy<(e.r+6)*(e.r+6)){
        e.hp--;hit=true;
        for(let k=0;k<4;k++){const an=Math.random()*6.283;
          G.particles.push({x:s.x,y:s.y,vx:Math.cos(an)*90,vy:Math.sin(an)*90,life:0.25,max:0.25,col:'#fff',sz:2});}
        beep(240,0.05,'square',0.06);
        if(e.hp<=0)killEnemy(e,j);
        break;
      }}
    if(hit||s.y<-12||s.x<-12||s.x>W+12)G.shots.splice(i,1);
  }

  // enemy bullets
  for(let i=G.ebullets.length-1;i>=0;i--){
    const b=G.ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-20||b.x>W+20||b.y<-40||b.y>L.gridTop){G.ebullets.splice(i,1);continue;}
    if(p.inv<=0){
      const dx=b.x-p.x,dy=b.y-p.y;
      if(dx*dx+dy*dy<(b.r+p.r)*(b.r+p.r)){
        G.ebullets.splice(i,1);playerHit();break;
      }
    }
  }

  // particles
  for(let i=G.particles.length-1;i>=0;i--){
    const q=G.particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.96;q.vy*=0.96;
    if(q.life<=0)G.particles.splice(i,1);
  }
  G.msgT=Math.max(0,G.msgT-dt);
  for(let i=G.msgs.length-1;i>=0;i--){G.msgs[i].t-=dt;if(G.msgs[i].t<=0)G.msgs.splice(i,1);}
}

function playerHit(){
  const p=G.p;
  G.lives--;p.inv=2;G.shake=10;
  for(const b of G.ebullets)for(let k=0;k<3;k++)G.particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160,life:0.4,max:0.4,col:'#ff8fa3',sz:2});
  G.ebullets.length=0;
  beep(120,0.4,'sawtooth',0.2,-90);
  if(G.lives<=0){
    G.state='over';
    if(G.score>G.best){G.best=G.score;setBest(G.best);}
    beep(80,0.6,'sawtooth',0.2,-50);
  }
}

/* ---------- input ---------- */
let drag=null;
function cellAt(x,y){
  if(x<L.gridX||y<L.gridY)return null;
  const c=((x-L.gridX)/L.cell)|0,r=((y-L.gridY)/L.cell)|0;
  if(c<0||c>=COLS||r<0||r>=ROWS)return null;
  return {r,c};
}
function handleDown(x,y){
  ac();
  if(G.state==='start'){G.state='play';startWave(1);return;}
  if(G.state==='over'){newGame();G.state='play';startWave(1);return;}
  const cell=cellAt(x,y);
  if(cell)drag={r:cell.r,c:cell.c,hx:null,hy:null};
}
function handleMove(x,y){
  if(!drag||G.state!=='play')return;
  const cell=cellAt(x,y);if(!cell)return;
  drag.hx=x;drag.hy=y;
  const d=Math.abs(cell.r-drag.r)+Math.abs(cell.c-drag.c);
  if(d===1){trySwap(drag.r,drag.c,cell.r,cell.c);drag=null;}
}
cv.addEventListener('mousedown',e=>handleDown(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>handleMove(e.clientX,e.clientY));
window.addEventListener('mouseup',()=>{drag=null;});
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];handleDown(t.clientX,t.clientY);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];handleMove(t.clientX,t.clientY);},{passive:false});
window.addEventListener('touchend',()=>{drag=null;});

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  ac();keys[k]=true;
  if(k==='enter'){if(G.state==='start'||G.state==='over'){newGame();G.state='play';startWave(1);}}
  if((k==='r')&&(G.state==='play'||G.state==='over')){newGame();G.state='play';startWave(1);}
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

/* ---------- drawing ---------- */
function drawOrb(x,y,v,rad){
  ctx.beginPath();ctx.arc(x,y,rad*0.95,0,6.283);
  ctx.fillStyle=GLOWS[v];ctx.fill();
  const g=ctx.createRadialGradient(x-rad*0.3,y-rad*0.3,rad*0.1,x,y,rad);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.25,COLORS[v]);g.addColorStop(1,COLORS[v]);
  ctx.beginPath();ctx.arc(x,y,rad*0.72,0,6.283);ctx.fillStyle=g;ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);

  // stars
  for(const s of stars){
    const tw=0.4+0.6*Math.abs(Math.sin(G.t*1.5+s.p));
    ctx.globalAlpha=tw;ctx.fillStyle='#9fb4ff';
    ctx.fillRect(s.x,s.y,s.s,s.s);
  }
  ctx.globalAlpha=1;

  const a=L.arena,p=G.p;

  // arena border
  ctx.strokeStyle='rgba(90,120,255,0.35)';ctx.lineWidth=2;
  ctx.strokeRect(a.x,a.y,a.w,a.h);

  // grid panel
  ctx.fillStyle='rgba(10,14,34,0.85)';
  ctx.fillRect(L.gridX-6,L.gridY-6,COLS*L.cell+12,ROWS*L.cell+12);
  ctx.strokeStyle='rgba(90,120,255,0.5)';
  ctx.strokeRect(L.gridX-6,L.gridY-6,COLS*L.cell+12,ROWS*L.cell+12);
  ctx.strokeStyle='rgba(80,100,180,0.18)';ctx.lineWidth=1;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(L.gridX+c*L.cell,L.gridY);ctx.lineTo(L.gridX+c*L.cell,L.gridY+ROWS*L.cell);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(L.gridX,L.gridY+r*L.cell);ctx.lineTo(L.gridX+COLS*L.cell,L.gridY+r*L.cell);ctx.stroke();}

  // orbs
  const rad=L.cell*0.42;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const v=G.grid[r][c];if(v<0)continue;
    drawOrb(L.gridX+c*L.cell+L.cell/2,L.gridY+r*L.cell+L.cell/2,v,rad);
  }

  // drag highlight
  if(drag&&G.state==='play'){
    ctx.strokeStyle='#fff';ctx.lineWidth=3;
    ctx.strokeRect(L.gridX+drag.c*L.cell+2,L.gridY+drag.r*L.cell+2,L.cell-4,L.cell-4);
    const cell=cellAt(drag.hx||0,drag.hy||0);
    if(cell&&Math.abs(cell.r-drag.r)+Math.abs(cell.c-drag.c)===1){
      ctx.strokeStyle='rgba(255,255,255,0.6)';
      ctx.strokeRect(L.gridX+cell.c*L.cell+2,L.gridY+cell.r*L.cell+2,L.cell-4,L.cell-4);
    }
  }

  // player shots
  for(const s of G.shots){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,3,0,6.283);ctx.fill();
    ctx.strokeStyle='rgba(160,220,255,0.7)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*0.04,s.y-s.vy*0.04);ctx.stroke();
  }

  // enemies
  for(const e of G.enemies){
    const col=e.type==='drone'?'#ff6b9d':e.type==='ring'?'#c26bff':'#ffb347';
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle=col;
    if(e.type==='drone'){
      ctx.rotate(Math.sin(e.t*2)*0.3);
      ctx.beginPath();ctx.moveTo(0,-e.r);ctx.lineTo(e.r,0);ctx.lineTo(0,e.r);ctx.lineTo(-e.r,0);ctx.closePath();ctx.fill();
    }else if(e.type==='ring'){
      ctx.beginPath();ctx.arc(0,0,e.r,0,6.283);ctx.fill();
      ctx.fillStyle='#1a1030';ctx.beginPath();ctx.arc(0,0,e.r*0.55+Math.sin(e.t*4)*3,0,6.283);ctx.fill();
    }else{
      ctx.rotate(Math.PI/2*e.dir);
      ctx.beginPath();ctx.moveTo(e.r,0);ctx.lineTo(-e.r*0.7,e.r*0.7);ctx.lineTo(-e.r*0.4,0);ctx.lineTo(-e.r*0.7,-e.r*0.7);ctx.closePath();ctx.fill();
    }
    ctx.restore();
    if(e.hp<e.maxhp){
      const w=e.r*1.6;
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(e.x-w/2,e.y-e.r-9,w,4);
      ctx.fillStyle='#5dff8f';ctx.fillRect(e.x-w/2,e.y-e.r-9,w*e.hp/e.maxhp,4);
    }
  }

  // enemy bullets
  for(const b of G.ebullets){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,0,6.283);ctx.fillStyle='rgba(255,80,120,0.25)';ctx.fill();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r-1,0,6.283);ctx.fillStyle='#ff8fa3';ctx.fill();
    ctx.beginPath();ctx.arc(b.x,b.y,2,0,6.283);ctx.fillStyle='#fff';ctx.fill();
  }

  // player
  if(G.state==='play'){
    const blink=p.inv>0&&Math.floor(p.inv*12)%2===0;
    if(!blink){
      ctx.save();ctx.translate(p.x,p.y);
      ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(10,10);ctx.lineTo(0,5);ctx.lineTo(-10,10);ctx.closePath();
      ctx.fillStyle='#7ddcff';ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      ctx.beginPath();ctx.arc(0,-2,3,0,6.283);ctx.fillStyle='#fff';ctx.fill();
      // engine flame
      ctx.beginPath();ctx.moveTo(-4,10);ctx.lineTo(0,16+Math.random()*5);ctx.lineTo(4,10);ctx.closePath();
      ctx.fillStyle='rgba(255,180,80,0.8)';ctx.fill();
      ctx.restore();
    }
  }

  // particles
  for(const q of G.particles){
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.col;
    ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz);
  }
  ctx.globalAlpha=1;

  // HUD
  if(G.state!=='start'){
    ctx.textAlign='left';ctx.font='bold 18px monospace';ctx.fillStyle='#fff';
    ctx.fillText('SCORE '+G.score,20,a.y+26);
    ctx.font='13px monospace';ctx.fillStyle='rgba(160,190,255,0.8)';
    ctx.fillText('BEST '+G.best,20,a.y+44);
    ctx.textAlign='center';ctx.font='bold 18px monospace';ctx.fillStyle='#4dc3ff';
    ctx.fillText('WAVE '+Math.max(1,G.wave),W/2,a.y+26);
    if(G.waveDelay>0&&G.queue.length===0&&G.enemies.length===0){
      ctx.font='bold 26px monospace';ctx.fillStyle='#ffd94d';
      ctx.fillText('NEXT WAVE IN '+Math.ceil(G.waveDelay),W/2,a.y+58);
    }
    ctx.textAlign='right';ctx.font='18px monospace';
    for(let i=0;i<5;i++){
      ctx.fillStyle=i<G.lives?'#ff4d6d':'rgba(255,77,109,0.18)';
      ctx.fillText('♥',W-18-i*24,a.y+28);
    }
  }

  // combo flash
  if(G.comboFlash>0&&G.chain>1){
    ctx.globalAlpha=Math.min(1,G.comboFlash*2);
    ctx.textAlign='center';ctx.font='bold '+(26+G.chain*4)+'px monospace';
    ctx.fillStyle='#ffd94d';
    ctx.fillText('CHAIN x'+G.chain+'!',W/2,L.gridTop-30);
    ctx.globalAlpha=1;
  }

  // messages
  ctx.textAlign='center';ctx.font='bold 20px monospace';
  for(const m of G.msgs){
    ctx.globalAlpha=Math.min(1,m.t*1.5);
    ctx.fillStyle=m.color;
    ctx.fillText(m.text,W/2,a.y+a.h*0.35-(G.msgs.length-1)*0);
  }
  ctx.globalAlpha=1;

  // overlays
  if(G.state==='start'){
    overlay();
    ctx.textAlign='center';
    ctx.font='bold '+(Math.min(64,W*0.08))+'px monospace';
    ctx.fillStyle='#7ddcff';
    ctx.fillText('ORB STORM',W/2,H*0.3);
    ctx.font='16px monospace';ctx.fillStyle='#fff';
    ctx.fillText('MATCH-3 BULLET HELL',W/2,H*0.3+30);
    ctx.font='15px monospace';ctx.fillStyle='rgba(200,220,255,0.9)';
    const lines=[
      'MOVE SHIP .... WASD / ARROW KEYS',
      'MATCH ORBS ... DRAG BETWEEN ADJACENT CELLS',
      'MATCHED ORBS FIRE HOMING BOLTS AT ENEMIES',
      'SURVIVE THE BULLET STORM. CHAIN FOR MULTIPLIERS.',
      'R = RESTART'
    ];
    lines.forEach((s,i)=>ctx.fillText(s,W/2,H*0.48+i*26));
    if(Math.floor(G.t*2)%2===0){
      ctx.font='bold 20px monospace';ctx.fillStyle='#ffd94d';
      ctx.fillText('CLICK OR PRESS ENTER TO START',W/2,H*0.75);
    }
  }else if(G.state==='over'){
    overlay();
    ctx.textAlign='center';
    ctx.font='bold 52px monospace';ctx.fillStyle='#ff4d6d';
    ctx.fillText('GAME OVER',W/2,H*0.35);
    ctx.font='22px monospace';ctx.fillStyle='#fff';
    ctx.fillText('SCORE '+G.score,W/2,H*0.35+42);
    ctx.fillStyle='#ffd94d';
    ctx.fillText(G.score>=G.best&&G.score>0?'★ NEW BEST! ★':'BEST '+G.best,W/2,H*0.35+72);
    if(Math.floor(G.t*2)%2===0){
      ctx.font='bold 18px monospace';ctx.fillStyle='#7ddcff';
      ctx.fillText('CLICK OR PRESS R TO RESTART',W/2,H*0.62);
    }
  }
  ctx.restore();
}

function overlay(){
  ctx.fillStyle='rgba(4,6,16,0.82)';ctx.fillRect(0,0,W,H);
}

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(G.t===undefined||G.state==='start'||G.state==='over')G.t=(G.t||0)+dt; // keep star twinkle going
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
newGame();
requestAnimationFrame(loop);
})();
</script>
</body>
