<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TypeBreaker</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e1a;}
  #game{display:block;position:absolute;inset:0;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,10,24,.86);color:#eaf0ff;font-family:'Segoe UI',Arial,sans-serif;text-align:center;z-index:5;
  }
  .hidden{display:none;}
  h1{font-size:min(9vw,64px);margin:0 0 8px;letter-spacing:2px;
     background:linear-gradient(90deg,#5ee7ff,#a58bff,#ff7bd5);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:#9fb0d8;font-size:min(3.4vw,18px);margin:4px 0;}
  .controls{margin:22px 0;padding:16px 26px;border:1px solid #2a3560;border-radius:12px;background:#111631;line-height:1.9;font-size:min(3vw,16px);color:#c7d3f5;}
  .key{display:inline-block;padding:1px 9px;border:1px solid #4a5aa0;border-bottom-width:3px;border-radius:6px;background:#1b2350;color:#8fd8ff;font-family:monospace;margin:0 2px;}
  button{
    margin-top:20px;padding:14px 44px;font-size:20px;font-weight:bold;letter-spacing:1px;cursor:pointer;
    color:#0b0e1a;background:linear-gradient(90deg,#5ee7ff,#a58bff);border:none;border-radius:30px;transition:transform .12s;
  }
  button:hover{transform:scale(1.06);}
  #finalScore{font-size:min(6vw,34px);color:#ffd76b;margin-top:6px;font-weight:bold;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>TYPEBREAKER</h1>
  <div class="sub">Break the blocks by typing their words — while keeping the ball alive.</div>
  <div class="controls">
    <div><span class="key">&larr;</span><span class="key">&rarr;</span> or <b>Mouse</b> &mdash; move paddle</div>
    <div><b>Type</b> the word on a block to shatter it</div>
    <div><span class="key">Backspace</span> undo &nbsp; <span class="key">Space</span> launch ball</div>
    <div><span class="key">R</span> restart &mdash; clear all blocks for the next level!</div>
  </div>
  <button id="startBtn">START GAME</button>
  <div class="sub" style="margin-top:14px">Press <span class="key">Enter</span> to start</div>
</div>

<div id="overScreen" class="overlay hidden">
  <h1 id="overTitle">GAME OVER</h1>
  <div class="sub">Final Score</div>
  <div id="finalScore">0</div>
  <div class="sub" id="bestScore"></div>
  <button id="restartBtn">PLAY AGAIN</button>
  <div class="sub" style="margin-top:14px">Press <span class="key">R</span> or <span class="key">Enter</span></div>
</div>

<script>
(function(){
"use strict";
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
var AC=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
function tone(f,d,type,vol,slide){
  if(!AC)return;
  try{
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
var sType=function(){tone(620+Math.random()*120,0.05,'square',0.05);};
var sBreak=function(n){tone(340+n*40,0.12,'triangle',0.16,300);setTimeout(function(){tone(700+n*40,0.1,'sine',0.1,200);},50);};
var sPaddle=function(){tone(180,0.07,'square',0.1,-40);};
var sWall=function(){tone(240,0.04,'sine',0.06);};
var sMiss=function(){tone(300,0.5,'sawtooth',0.14,-240);};
var sWrong=function(){tone(120,0.15,'sawtooth',0.09,-40);};
var sLevel=function(){[440,554,659,880].forEach(function(f,i){setTimeout(function(){tone(f,0.15,'triangle',0.12);},i*110);});};

/* ---------- words ---------- */
var WORDS=["apple","brave","crane","drift","ember","frost","grape","hazel","ivory","jolly",
"knife","lemon","mango","noble","olive","peach","quilt","rapid","solar","tiger",
"umbra","vivid","whale","xenon","yacht","zesty","anchor","bamboo","castle","dynamo",
"eagle2","falcon","gemini","harbor","island","jungle","kitten","lantern","meteor","nectar",
"orchid","puzzle","quiver","rocket","silver","temple","unicorn","vortex","wizard","yonder",
"balance","circuit","diamond","eclipse","fortune","garage2","horizon","isolate","jigsaw",
"kernel","ladder","mystery","noodle","orange2","piston","quartz","rhythm","summit","tundra",
"velvet","willow","yellow","zigzag","breeze","canyon","donkey","engine","flower","guitar",
"hammer","jacket","kayak2","laptop","mirror","noodle","oxygen","planet","quince","robin"];
WORDS=WORDS.filter(function(w){return !/2$/.test(w);});

/* ---------- state ---------- */
var G={state:'menu',score:0,lives:3,level:1,combo:0,comboTimer:0,shake:0,time:0};
var bricks=[],particles=[];
var paddle={x:0,w:0,h:14,speed:520,vx:0};
var ball={x:0,y:0,r:8,vx:0,vy:0,stuck:true,speed:320};
var target=null,typeFlash=0;
var keys={left:false,right:false};

function padW(){return Math.max(90,Math.min(W*0.16,170));}
function ballBaseSpeed(){return Math.min(560,300+G.level*28);}

function pickWords(count,minLen,maxLen){
  var pool=WORDS.filter(function(w){return w.length>=minLen&&w.length<=maxLen;});
  // shuffle
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=pool[i];pool[i]=pool[j];pool[j]=t;}
  var out=[],used={};
  for(var k=0;k<count&&k<pool.length;k++){ if(!used[pool[k]]){out.push(pool[k]);used[pool[k]]=1;} }
  while(out.length<count)out.push(pool[Math.floor(Math.random()*pool.length)]);
  return out;
}

function buildLevel(){
  bricks=[];target=null;
  var rows=Math.min(4+Math.floor((G.level-1)/2),7);
  var cols=6;
  var minLen=Math.min(3+G.level,5),maxLen=Math.min(4+G.level,9);
  var words=pickWords(rows*cols,minLen,maxLen);
  var topH=70,bottomH=110;
  var areaH=H-topH-bottomH;
  var bh=Math.max(30,Math.min(46,Math.floor(areaH/rows)-8));
  var gap=6,side=(W*0.05);
  var bw=(W-side*2-gap*(cols-1))/cols;
  var wi=0;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    bricks.push({row:r,col:c,w:bw,h:bh,word:words[wi++],progress:0,alive:true,
      hue:(r*47+G.level*30)%360,flash:0});
  }
}
function brickRect(b){
  var side=W*0.05,gap=6,topH=70,bottomH=110;
  var areaH=H-topH-bottomH;
  var bh=Math.max(30,Math.min(46,Math.floor(areaH/7)-8));
  // recompute same bh as build: use stored h (built with current rows) — store layout at build time instead:
  return {x:b.lx,y:b.ly,w:b.w,h:b.h};
}
// We'll compute layout in buildLevel and store it; on resize we rebuild positions only.
function layoutBricks(){
  var rows=bricks.length?bricks[0].row+1:0,cols=bricks.length?bricks[0].col+1:0;
  if(!rows)return;
  var topH=70,bottomH=110,areaH=H-topH-bottomH;
  var bh=Math.max(30,Math.min(46,Math.floor(areaH/rows)-8));
  var gap=6,side=W*0.05,bw=(W-side*2-gap*(cols-1))/cols;
  for(var i=0;i<bricks.length;i++){var b=bricks[i];
    b.w=bw;b.h=bh;b.lx=side+b.col*(bw+gap);b.ly=topH+b.row*(bh+gap);}
}

function resetBall(){
  ball.stuck=true;ball.x=paddle.x;paddle.y=H-46;
  ball.speed=ballBaseSpeed();
}
function launchBall(){
  if(!ball.stuck)return;
  ball.stuck=false;
  var a=-Math.PI/2+(Math.random()*0.8-0.4);
  ball.vx=Math.cos(a)*ball.speed;ball.vy=Math.sin(a)*ball.speed;
  sPaddle();
}

function startGame(){
  G.state='playing';G.score=0;G.lives=3;G.level=1;G.combo=0;G.comboTimer=0;particles=[];
  paddle.w=padW();paddle.x=W/2;paddle.y=H-46;
  buildLevel();layoutBricks();resetBall();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
}
function nextLevel(){
  G.level++;sLevel();buildLevel();layoutBricks();resetBall();
}
function gameOver(win){
  G.state='gameover';
  var best=0;try{best=parseInt(localStorage.getItem('typebreaker_best')||'0',10)||0;}catch(e){}
  if(G.score>best){best=G.score;try{localStorage.setItem('typebreaker_best',String(best));}catch(e){}}
  document.getElementById('overTitle').textContent=win?'YOU WIN!':'GAME OVER';
  document.getElementById('finalScore').textContent=G.score;
  document.getElementById('bestScore').textContent='Best: '+best+'   ·   Level reached: '+G.level;
  document.getElementById('overScreen').classList.remove('hidden');
}

/* ---------- typing ---------- */
function findTarget(ch){
  for(var i=bricks.length-1;i>=0;i--){var b=bricks[i];
    if(b.alive&&b.word[0]===ch)return b;}
  return null;
}
function handleChar(ch){
  if(G.state!=='playing')return;
  var c=ch.toLowerCase();
  if(!target){ target=findTarget(c); }
  if(target){
    if(c===target.word[target.progress]){
      target.progress++;typeFlash=0.12;sType();
      if(target.progress>=target.word.length)breakBrick(target);
    }else wrongKey();
  }else{
    // no block starts with this letter — gentle feedback, no penalty
    tone(300,0.04,'sine',0.04);
  }
}
function handleBackspace(){
  if(G.state!=='playing'||!target)return;
  if(target.progress>0){target.progress--;tone(220,0.05,'sine',0.06);}
  else{target=null;}
}
function wrongKey(){
  target.progress=0;target=null;G.shake=0.3;sWrong();
}
function breakBrick(b){
  b.alive=false;if(target===b)target=null;
  G.combo=(G.comboTimer>0)?G.combo+1:1;G.comboTimer=4;
  var pts=b.word.length*10*G.combo;
  G.score+=pts;
  sBreak(G.level);
  spawnParticles(b.lx+b.w/2,b.ly+b.h/2,b.hue,26);
  for(var i=0;i<bricks.length;i++)if(bricks[i].alive)return;
  // level cleared
  setTimeout(function(){ if(G.state==='playing')nextLevel(); },450);
}
function spawnParticles(x,y,hue,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=60+Math.random()*240;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.7+Math.random()*0.5,max:1,hue:hue,size:2+Math.random()*3});
  }
}

/* ---------- input ---------- */
window.addEventListener('keydown',function(e){
  audio();
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'){keys.left=true;e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'){keys.right=true;e.preventDefault();}
  else if(k===' '){ e.preventDefault();
    if(G.state==='playing')launchBall();
    else startGame();
  }
  else if(k==='Enter'){ if(G.state!=='playing')startGame(); }
  else if(k==='r'||k==='R'){ startGame(); }
  else if(k==='Backspace'){ e.preventDefault();handleBackspace(); }
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ handleChar(k); }
});
window.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
});
canvas.addEventListener('mousemove',function(e){
  paddle.x=e.clientX;
});
canvas.addEventListener('mousedown',function(){audio();if(G.state==='playing')launchBall();});
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();paddle.x=e.touches[0].clientX;
},{passive:false});
canvas.addEventListener('touchstart',function(){audio();if(G.state==='playing')launchBall();});
document.getElementById('startBtn').addEventListener('click',function(){audio();startGame();});
document.getElementById('restartBtn').addEventListener('click',function(){audio();startGame();});

/* ---------- update ---------- */
var last=performance.now();
function update(dt){
  G.time+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  if(typeFlash>0)typeFlash=Math.max(0,typeFlash-dt);
  if(G.comboTimer>0){G.comboTimer-=dt;if(G.comboTimer<=0)G.combo=0;}

  // particles always
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;
    if(p.life<=0)particles.splice(i,1);}

  if(G.state!=='playing')return;

  // paddle
  var kv=0;
  if(keys.left)kv-=1;if(keys.right)kv+=1;
  if(kv)paddle.x+=kv*paddle.speed*dt;
  paddle.w=padW();
  paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));
  paddle.y=H-46;

  // ball
  if(ball.stuck){ball.x=paddle.x;ball.y=paddle.y-ball.r-paddle.h/2-2;}
  else{
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    // walls
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);sWall();}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);sWall();}
    if(ball.y<ball.r+40){ball.y=ball.r+40;ball.vy=Math.abs(ball.vy);sWall();}
    // paddle
    if(ball.vy>0&&ball.y+ball.r>=paddle.y-paddle.h/2&&ball.y-ball.r<=paddle.y+paddle.h/2
       &&Math.abs(ball.x-paddle.x)<=paddle.w/2+ball.r){
      ball.y=paddle.y-paddle.h/2-ball.r;
      var rel=(ball.x-paddle.x)/(paddle.w/2);rel=Math.max(-1,Math.min(1,rel));
      var a=-Math.PI/2+rel*1.05;
      ball.vx=Math.cos(a)*ball.speed;ball.vy=Math.sin(a)*ball.speed;
      sPaddle();
    }
    // bricks
    for(var b=0;b<bricks.length;b++){var br=bricks[b];
      if(!br.alive)continue;
      var cx=Math.max(br.lx,Math.min(ball.x,br.lx+br.w));
      var cy=Math.max(br.ly,Math.min(ball.y,br.ly+br.h));
      var dx=ball.x-cx,dy=ball.y-cy;
      if(dx*dx+dy*dy<=ball.r*ball.r){
        // bounce — typing still required to break it; flash as a hint
        br.flash=0.5;
        if(Math.abs(dx)>Math.abs(dy))ball.vx=(dx>0?1:-1)*Math.abs(ball.vx);
        else ball.vy=(dy>0?1:-1)*Math.abs(ball.vy);
        sWall();
        break;
      }
    }
    // lost
    if(ball.y-ball.r>H+20){
      G.lives--;sMiss();G.shake=0.5;G.combo=0;target=null;
      for(var q=bricks.length;q>=0;q--){}
      bricks.forEach(function(bb){bb.progress=0;});
      if(G.lives<=0)gameOver(false);else resetBall();
    }
  }
  // brick flashes decay
  for(var f=0;bricks.length>f;f++)if(bricks[f].flash>0)bricks[f].flash=Math.max(0,bricks[f].flash-dt*2);
}

/* ---------- draw ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // bg
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1230');g.addColorStop(1,'#0b0e1a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  if(G.shake>0){ctx.save();ctx.translate((Math.random()-0.5)*G.shake*14,(Math.random()-0.5)*G.shake*14);}

  // bricks
  for(var i=0;i<bricks.length;i++){var b=bricks[i];
    if(!b.alive)continue;
    var isT=(target===b);
    ctx.fillStyle='hsl('+b.hue+',72%,'+(isT?58:42)+'%)';
    roundRect(b.lx,b.ly,b.w,b.h,6);ctx.fill();
    if(b.flash>0){ctx.fillStyle='rgba(255,255,255,'+b.flash*0.6+')';roundRect(b.lx,b.ly,b.w,b.h,6);ctx.fill();}
    if(isT){ctx.strokeStyle='#fff';ctx.lineWidth=2;roundRect(b.lx-2,b.ly-2,b.w+4,b.h+4,7);ctx.stroke();}
    // word: typed part green
    ctx.font='bold '+Math.min(18,b.h*0.42)+'px monospace';
    ctx.textBaseline='middle';
    var fs=ctx.measureText(b.word).width;
    var fscale=Math.min(1,(b.w-14)/fs);
    if(fscale<1)ctx.font='bold '+Math.min(18,b.h*0.42)*fscale+'px monospace';
    var fullW=ctx.measureText(b.word).width;
    var px=b.lx+(b.w-fullW)/2,py=b.ly+b.h/2+1;
    ctx.textAlign='left';
    if(b.progress>0){
      ctx.fillStyle='#eaffd8';
      ctx.fillText(b.word.substring(0,b.progress),px,py);
      var typedW=ctx.measureText(b.word.substring(0,b.progress)).width;
      ctx.fillStyle='#fff';
      ctx.fillText(b.word.substring(b.progress),px+typedW,py);
    }else{
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.fillText(b.word,px,py);
    }
  }

  // particles
  for(var p=0;p<particles.length;p++){var pt=particles[p];
    ctx.globalAlpha=Math.max(0,pt.life/pt.max);
    ctx.fillStyle='hsl('+pt.hue+',85%,65%)';
    ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
  }
  ctx.globalAlpha=1;

  // paddle
  var pg=ctx.createLinearGradient(0,paddle.y-paddle.h,0,paddle.y+paddle.h);
  pg.addColorStop(0,'#7fd4ff');pg.addColorStop(1,'#3a6fd8');
  ctx.fillStyle=pg;
  roundRect(paddle.x-paddle.w/2,paddle.y-paddle.h/2,paddle.w,paddle.h,7);ctx.fill();

  // ball
  var bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r+2);
  bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#ffd76b');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();

  if(G.shake>0)ctx.restore();

  /* HUD */
  if(G.state==='playing'){
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.font='bold 22px "Segoe UI",Arial';
    ctx.fillStyle='#eaf0ff';ctx.fillText('SCORE  '+G.score,16,14);
    ctx.textAlign='center';
    ctx.fillText('LEVEL  '+G.level,W/2,14);
    if(G.combo>1){
      ctx.fillStyle='#ffd76b';
      ctx.font='bold '+(20+Math.min(8,G.combo))+'px "Segoe UI",Arial';
      ctx.fillText('×'+G.combo+' COMBO',W/2,40);
    }
    ctx.textAlign='right';ctx.font='bold 22px "Segoe UI",Arial';
    ctx.fillStyle='#ff6b8a';
    var hearts='';for(var h=0;h<G.lives;h++)hearts+='♥ ';
    ctx.fillText(hearts,W-16,14);

    // typing display at bottom
    var disp,targetWord=null;
    if(target){targetWord=target.word;}
    else{
      // show any block hint? show first alive block dimly
      for(var t=0;t<bricks.length;t++)if(bricks[t].alive){targetWord=bricks[t].word;break;}
    }
    if(targetWord){
      ctx.textAlign='center';ctx.textBaseline='middle';
      var fsz=Math.min(34,W*0.05);
      ctx.font='bold '+fsz+'px monospace';
      var tw=ctx.measureText(targetWord).width;
      var bx=W/2-tw/2,by=H-26;
      var typed=target?target.progress:0;
      if(typed>0){
        ctx.fillStyle='#8affb0';
        ctx.textAlign='left';
        ctx.fillText(targetWord.substring(0,typed),bx,by);
        var twd=ctx.measureText(targetWord.substring(0,typed)).width;
        ctx.fillStyle='#ffffff';
        ctx.fillText(targetWord.substring(typed),bx+twd,by);
      }else{
        ctx.fillStyle='rgba(255,255,255,'+(target?0.85:0.35)+')';
        ctx.textAlign='center';
        ctx.fillText(targetWord,W/2,by);
      }
      // blinking caret
      if(target&&typeFlash>0){
        var cw=ctx.measureText(targetWord.substring(0,target.progress)).width;
        ctx.fillStyle='#8affb0';
        ctx.fillRect(bx+cw+3,by-fsz*0.45,3,fsz*0.9);
      }
    }
  }
}

function loop(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
