<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golf Snake</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0c2a14; font-family:'Trebuchet MS',Verdana,sans-serif; }
  #wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud { color:#eafbe9; display:flex; gap:24px; padding:6px 14px; font-size:clamp(12px,2.2vh,18px); text-shadow:0 1px 2px #000; letter-spacing:1px; user-select:none; }
  #hud b { color:#ffd75e; }
  #stage { position:relative; flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { background:#2f8f3a; box-shadow:0 0 40px rgba(0,0,0,.6); border-radius:6px; image-rendering:auto; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(4,24,10,.82); color:#fff; text-align:center; z-index:5; padding:20px; }
  .overlay h1 { font-size:clamp(34px,8vh,72px); color:#ffd75e; letter-spacing:4px; text-shadow:0 4px 0 #6b4d00, 0 8px 20px rgba(0,0,0,.7); margin-bottom:10px; }
  .overlay h2 { font-size:clamp(22px,5vh,44px); color:#ffd75e; margin-bottom:12px; text-shadow:0 3px 8px #000; }
  .overlay p { font-size:clamp(13px,2.6vh,20px); line-height:1.7; color:#cdeed4; margin-bottom:6px; }
  .overlay .big { font-size:clamp(16px,3.4vh,26px); color:#fff; margin:10px 0 18px; }
  .btn { background:linear-gradient(#ffd75e,#e0a92c); color:#3a2b00; border:none; font-weight:bold; font-size:clamp(15px,3vh,22px); padding:12px 34px; border-radius:30px; cursor:pointer; letter-spacing:2px; box-shadow:0 5px 0 #8a6510, 0 10px 20px rgba(0,0,0,.5); font-family:inherit; }
  .btn:hover { transform:translateY(-2px); }
  .btn:active { transform:translateY(2px); box-shadow:0 2px 0 #8a6510; }
  .key { display:inline-block; background:#1d4d2a; border:1px solid #4c8f5c; border-radius:6px; padding:1px 9px; margin:0 2px; color:#fff; font-weight:bold; }
  #flash { position:absolute; top:38%; left:0; right:0; text-align:center; font-size:clamp(24px,6vh,52px); color:#ffd75e; text-shadow:0 3px 10px #000; pointer-events:none; opacity:0; transition:opacity .3s; z-index:4; font-weight:bold; letter-spacing:3px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>HOLE <b id="hHole">1</b></span>
    <span>BALLS <b id="hBalls">0/5</b></span>
    <span>TOTAL <b id="hTotal">0</b></span>
    <span>BEST <b id="hBest">0</b></span>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="flash"></div>

    <div id="startScr" class="overlay">
      <h1>&#9873; GOLF SNAKE</h1>
      <p>You're a hungry golf ball rolling across the course.</p>
      <p>Collect <b style="color:#ffd75e">5 balls</b> to sink into the next hole.</p>
      <p>Avoid the <b style="color:#7ec8ff">cup hazards</b>, sand traps, walls &amp; your own tail!</p>
      <p style="margin-top:14px"><span class="key">&#9650;</span><span class="key">&#9660;</span><span class="key">&#9664;</span><span class="key">&#9654;</span> / <span class="key">WASD</span> move &nbsp;&middot;&nbsp; <span class="key">P</span> pause</p>
      <p style="margin-top:14px"><button class="btn" id="startBtn">TEE OFF</button></p>
    </div>

    <div id="overScr" class="overlay hidden">
      <h2 id="overTitle">OUT OF BOUNDS!</h2>
      <p class="big" id="overStats"></p>
      <p id="overBest"></p>
      <p style="margin-top:14px"><button class="btn" id="againBtn">PLAY AGAIN</button></p>
    </div>

    <div id="pauseScr" class="overlay hidden">
      <h2>PAUSED</h2>
      <p>Press <span class="key">P</span> to resume</p>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var COLS=22, ROWS=15, CELL=40;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
cv.width=COLS*CELL; cv.height=ROWS*CELL;

var elHole=document.getElementById('hHole'), elBalls=document.getElementById('hBalls'),
    elTotal=document.getElementById('hTotal'), elBest=document.getElementById('hBest'),
    startScr=document.getElementById('startScr'), overScr=document.getElementById('overScr'),
    pauseScr=document.getElementById('pauseScr'), flashEl=document.getElementById('flash');

// ---------- audio ----------
var AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function beep(freq,dur,type,vol,slide){
  var a=audio(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol||0.15,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}

// ---------- state ----------
var snake, dir, dirQueue, food, holes, bunkers;
var holeNum, ballsGot, ballsNeeded=5, totalBalls, speed, lastStep, running=false, paused=false, dead=false;
var best=0;
try{ best=parseInt(localStorage.getItem('golfSnakeBest')||'0',10)||0; }catch(e){}

function randCell(avoid){
  var c, tries=0;
  do{
    c={x:(Math.random()*COLS)|0, y:(Math.random()*ROWS)|0};
    tries++;
  }while(tries<500 && avoid.some(function(a){return a.x===c.x&&a.y===c.y;}));
  return c;
}

function makeBunkers(){
  bunkers=[];
  var n=3+((Math.random()*3)|0);
  for(var i=0;i<n;i++){
    var b={x:(1+Math.random()*(COLS-2))|0, y:(1+Math.random()*(ROWS-2))|0};
    bunkers.push(b);
    if(Math.random()<0.6) bunkers.push({x:Math.min(COLS-1,b.x+1),y:b.y});
  }
}

function placeHoles(){
  holes=[];
  var n=Math.min(1+Math.floor((holeNum-1)/2),4);
  var avoid=snake.map(function(s){return s;}).concat([food]);
  // keep a safe zone around head
  for(var i=0;i<3;i++)for(var j=0;j<3;j++){
    avoid.push({x:snake[0].x+i-1,y:snake[0].y+j-1});
  }
  for(var k=0;k<n;k++) holes.push(randCell(avoid.concat(holes)));
}

function newGame(){
  snake=[{x:5,y:7},{x:4,y:7},{x:3,y:7}];
  dir={x:1,y:0}; dirQueue=[];
  holeNum=1; ballsGot=0; totalBalls=0;
  speed=150; lastStep=performance.now();
  dead=false; paused=false;
  makeBunkers();
  food=randCell(snake);
  placeHoles();
  updateHUD();
}

function nextHole(){
  holeNum++;
  ballsGot=0;
  speed=Math.max(70,150-(holeNum-1)*8);
  makeBunkers();
  food=randCell(snake.concat(holes));
  placeHoles();
  flash('HOLE '+holeNum+'!');
  beep(660,0.12,'triangle',0.18); setTimeout(function(){beep(880,0.15,'triangle',0.18);},110);
}

function flash(txt){
  flashEl.textContent=txt; flashEl.style.opacity='1';
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){flashEl.style.opacity='0';},1200);
}

function updateHUD(){
  elHole.textContent=holeNum;
  elBalls.textContent=ballsGot+'/'+ballsNeeded;
  elTotal.textContent=totalBalls;
  elBest.textContent=best;
}

// ---------- game over ----------
function gameOver(reason){
  dead=true; running=false;
  beep(200,0.4,'sawtooth',0.15,60);
  if(totalBalls>best){
    best=totalBalls;
    try{ localStorage.setItem('golfSnakeBest',''+best); }catch(e){}
  }
  document.getElementById('overTitle').textContent=reason;
  document.getElementById('overStats').innerHTML=
    'Reached <b style="color:#ffd75e">Hole '+holeNum+'</b> &middot; '+totalBalls+' ball'+(totalBalls===1?'':'s')+' collected';
  document.getElementById('overBest').textContent = totalBalls>=best ? '\u2605 New best score! \u2605' : ('Best: '+best);
  updateHUD();
  overScr.classList.remove('hidden');
}

// ---------- input ----------
var KEYMAP={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};

window.addEventListener('keydown',function(e){
  audio();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0) e.preventDefault();
  if(e.code==='KeyP' && running && !dead){ togglePause(); return; }
  if((e.code==='Enter'||e.code==='Space')){
    if(!running && !dead){ startGame(); return; }
    if(dead){ startGame(); return; }
  }
  var m=KEYMAP[e.code];
  if(m && running && !paused){
    var last = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
    if((m[0]===-last.x&&m[1]===-last.y)||(m[0]===last.x&&m[1]===last.y)) return;
    if(dirQueue.length<3) dirQueue.push({x:m[0],y:m[1]});
  }
});

function togglePause(){
  paused=!paused;
  pauseScr.classList.toggle('hidden',!paused);
  if(!paused) lastStep=performance.now();
}

function startGame(){
  audio();
  newGame();
  running=true;
  startScr.classList.add('hidden');
  overScr.classList.add('hidden');
  pauseScr.classList.add('hidden');
  beep(523,0.1,'triangle',0.15); setTimeout(function(){beep(784,0.14,'triangle',0.15);},100);
}

document.getElementById('startBtn').addEventListener('click',function(e){ e.stopPropagation(); startGame(); });
document.getElementById('againBtn').addEventListener('click',function(e){ e.stopPropagation(); startGame(); });
startScr.addEventListener('click',function(){ audio(); startGame(); });

// ---------- update ----------
function step(){
  if(dirQueue.length) dir=dirQueue.shift();
  var h={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  // wall
  if(h.x<0||h.y<0||h.x>=COLS||h.y>=ROWS){ gameOver('OUT OF BOUNDS!'); return; }
  // self
  for(var i=0;i<snake.length;i++){ if(snake[i].x===h.x&&snake[i].y===h.y){ gameOver('HIT YOURSELF!'); return; } }
  // hole hazard
  for(var j=0;j<holes.length;j++){ if(holes[j].x===h.x&&holes[j].y===h.y){ gameOver('FELL IN THE CUP!'); return; } }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    ballsGot++; totalBalls++;
    beep(880,0.08,'square',0.12,1320);
    food=randCell(snake.concat(holes));
    if(ballsGot>=ballsNeeded) nextHole();
  } else {
    snake.pop();
  }
  updateHUD();
}

// ---------- drawing ----------
function drawBall(x,y,r,shade){
  var cx=x*CELL+CELL/2, cy=y*CELL+CELL/2;
  var g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.15,cx,cy,r);
  if(shade){ g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#b8c4bd'); }
  else { g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#d9e2db'); }
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
  // dimples
  ctx.fillStyle='rgba(90,110,100,0.35)';
  for(var i=0;i<4;i++){
    var a=i*1.7+0.6;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*r*0.45, cy+Math.sin(a)*r*0.45, r*0.13, 0, 7); ctx.fill();
  }
}

function drawHole(h){
  var cx=h.x*CELL+CELL/2, cy=h.y*CELL+CELL/2;
  // cup
  ctx.fillStyle='#0a1f10';
  ctx.beginPath(); ctx.ellipse(cx,cy,CELL*0.36,CELL*0.30,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(126,200,255,0.8)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(cx,cy,CELL*0.36,CELL*0.30,0,0,7); ctx.stroke();
  // flag
  ctx.strokeStyle='#eee'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy-CELL*0.85); ctx.stroke();
  ctx.fillStyle='#ff4136';
  ctx.beginPath(); ctx.moveTo(cx,cy-CELL*0.85); ctx.lineTo(cx+CELL*0.42,cy-CELL*0.7); ctx.lineTo(cx,cy-CELL*0.55); ctx.closePath(); ctx.fill();
}

function draw(){
  // checkered fairway
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){
    ctx.fillStyle=((x+y)%2===0)?'#37994a':'#2f8b41';
    ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  }
  // mowing stripes
  ctx.fillStyle='rgba(255,255,255,0.03)';
  for(var s=0;s<COLS;s+=4) ctx.fillRect(s*CELL,0,CELL,cv.height);
  // bunkers
  ctx.fillStyle='#e8d59a';
  bunkers.forEach(function(b){
    var cx=b.x*CELL+CELL/2, cy=b.y*CELL+CELL/2;
    ctx.beginPath();
    ctx.moveTo(cx-CELL*0.4,cy);
    ctx.quadraticCurveTo(cx-CELL*0.35,cy-CELL*0.38,cx,cy-CELL*0.36);
    ctx.quadraticCurveTo(cx+CELL*0.42,cy-CELL*0.32,cx+CELL*0.4,cy);
    ctx.quadraticCurveTo(cx+CELL*0.35,cy+CELL*0.38,cx,cy+CELL*0.36);
    ctx.quadraticCurveTo(cx-CELL*0.42,cy+CELL*0.34,cx-CELL*0.4,cy);
    ctx.fill();
  });
  // border
  ctx.strokeStyle='#1c5a28'; ctx.lineWidth=4;
  ctx.strokeRect(2,2,cv.width-4,cv.height-4);

  holes.forEach(drawHole);

  // food ball with a soft shadow
  drawBall(food.x,food.y,CELL*0.32,false);

  // snake: golf balls, head has flag marker
  for(var i=snake.length-1;i>=0;i--){
    var s=snake[i];
    if(i===0){
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(s.x*CELL+CELL/2,s.y*CELL+CELL*0.68,CELL*0.3,CELL*0.12,0,0,7); ctx.fill();
      drawBall(s.x,s.y,CELL*0.36,true);
      // eyes based on direction
      var cx=s.x*CELL+CELL/2, cy=s.y*CELL+CELL/2;
      var ex=dir.x*CELL*0.12, ey=dir.y*CELL*0.12;
      ctx.fillStyle='#222';
      var ox=(dir.y!==0?CELL*0.13:0), oy=(dir.x!==0?CELL*0.13:0);
      ctx.beginPath(); ctx.arc(cx+ex-ox,cy+ey-oy,CELL*0.06,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+ex+ox,cy+ey+oy,CELL*0.06,0,7); ctx.fill();
    } else {
      var r=CELL*(0.32 - Math.min(i*0.004,0.06));
      drawBall(s.x,s.y,r,false);
    }
  }

  if(paused){ /* overlay handles it */ }
}

// ---------- loop ----------
function loop(t){
  requestAnimationFrame(loop);
  if(running && !paused){
    while(t-lastStep>=speed){ lastStep+=speed; step(); if(!running) break; }
    if(lastStep<t+speed) lastStep=Math.max(lastStep,t); // avoid spiral after tab switch
    if(document.hidden) lastStep=t;
  }
  draw();
}

// ---------- sizing ----------
function fit(){
  var stage=document.getElementById('stage');
  var w=stage.clientWidth-10, h=stage.clientHeight-10;
  var sc=Math.min(w/cv.width,h/cv.height);
  if(sc<0.2)sc=0.2;
  cv.style.width=(cv.width*sc)+'px';
  cv.style.height=(cv.height*sc)+'px';
}
window.addEventListener('resize',fit);

newGame();
running=false;
updateHUD();
fit();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
