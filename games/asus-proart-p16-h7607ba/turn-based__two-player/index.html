<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four — Two Player</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1e3a; font-family:'Segoe UI', Arial, sans-serif; }
  #game { display:block; width:100vw; height:100vh; }
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(5,14,32,0.88); color:#fff; z-index:10; padding:20px;
  }
  .hidden { display:none; }
  h1 { font-size:min(9vw,64px); letter-spacing:2px; margin-bottom:8px;
       background:linear-gradient(90deg,#ff5f5f,#ffd94d); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:min(4vw,20px); color:#9fc1ff; margin-bottom:26px; }
  .panel {
    display:flex; gap:min(8vw,60px); flex-wrap:wrap; justify-content:center;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
    border-radius:14px; padding:18px 30px; margin-bottom:28px;
  }
  .panel h3 { font-size:min(3.6vw,18px); margin-bottom:8px; }
  .p1h { color:#ff6b6b; } .p2h { color:#ffd94d; }
  .panel p { font-size:min(3.4vw,15px); color:#cfe0ff; line-height:1.7; }
  kbd {
    background:#1d3a6b; border:1px solid #4a6ea9; border-bottom-width:3px;
    border-radius:5px; padding:1px 8px; font-family:inherit; font-size:min(3vw,13px); color:#fff;
  }
  .startbtn {
    font-size:min(4.5vw,22px); padding:14px 46px; cursor:pointer; border:none;
    border-radius:10px; background:linear-gradient(180deg,#3aa0ff,#1f6fd0);
    color:#fff; font-weight:bold; letter-spacing:1px;
    box-shadow:0 5px 0 #144a8c, 0 10px 24px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  .startbtn:hover { transform:translateY(2px); box-shadow:0 3px 0 #144a8c, 0 6px 16px rgba(0,0,0,.4); }
  .hint { margin-top:16px; color:#7d9cc9; font-size:min(3.2vw,14px); }
  #winTitle { font-size:min(8vw,54px); margin-bottom:14px; }
  #winScore { font-size:min(4.5vw,24px); color:#cfe0ff; margin-bottom:26px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>CONNECT FOUR</h1>
  <div class="sub">Two-Player Turn-Based Duel</div>
  <div class="panel">
    <div>
      <h3 class="p1h">● Player One (Red)</h3>
      <p><kbd>A</kbd> / <kbd>D</kbd> — move<br><kbd>W</kbd> or <kbd>Enter</kbd> — drop</p>
    </div>
    <div>
      <h3 class="p2h">● Player Two (Yellow)</h3>
      <p><kbd>←</kbd> / <kbd>→</kbd> — move<br><kbd>↓</kbd> or <kbd>Space</kbd> — drop</p>
    </div>
  </div>
  <button id="startBtn" class="startbtn">START GAME</button>
  <div class="hint">First to line up four wins · You can also click / tap a column with the mouse</div>
</div>

<div id="endScreen" class="overlay hidden">
  <h1 id="winTitle">Player One Wins!</h1>
  <div id="winScore"></div>
  <button id="restartBtn" class="startbtn">PLAY AGAIN</button>
  <div class="hint"><kbd>R</kbd> — new round &nbsp;·&nbsp; <kbd>M</kbd> — main menu</div>
</div>

<script>
(function(){
"use strict";
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var COLS = 7, ROWS = 6;
var EMPTY = 0, P1 = 1, P2 = 2;

var board, current, scores, animPiece, winCells, gameOver, state; // state: 'menu','play','anim','over'
var colSel = [3,3]; // selected column per player (for ghost preview)
var W=0,H=0,cell=0,bx=0,by=0;

/* ---------- audio ---------- */
var actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); }
function beep(freq, dur, type, vol, when){
  if(!actx) return;
  var t = actx.currentTime + (when||0);
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function sndMove(){ beep(340,0.06,'square',0.05); }
function sndDrop(){ beep(180,0.12,'sine',0.2); beep(90,0.15,'sine',0.12,0.03); }
function sndWin(){ [523,659,784,1047].forEach(function(f,i){ beep(f,0.22,'triangle',0.16,i*0.13); }); }
function sndDraw(){ beep(220,0.3,'sawtooth',0.08); beep(180,0.4,'sawtooth',0.08,0.25); }

/* ---------- persistence ---------- */
function loadScores(){ try{ var s = JSON.parse(localStorage.getItem('c4_scores')); if(s && typeof s[0]==='number' && typeof s[1]==='number'){ scores=[s[0],s[1]]; return; } }catch(e){} scores=[0,0]; }
function saveScores(){ try{ localStorage.setItem('c4_scores', JSON.stringify(scores)); }catch(e){} }

/* ---------- layout ---------- */
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  var dpr = window.devicePixelRatio||1;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var topPad = Math.min(H*0.16, 120);
  cell = Math.floor(Math.min((W-30)/COLS, (H-topPad-40)/ROWS));
  bx = Math.floor((W - cell*COLS)/2);
  by = Math.floor(topPad + ((H-topPad-40) - cell*ROWS)/2);
}
window.addEventListener('resize', resize);

/* ---------- game logic ---------- */
function newRound(){
  board = [];
  for(var r=0;r<ROWS;r++){ board.push([EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY]); }
  current = P1; colSel=[3,3]; animPiece=null; winCells=[]; gameOver=false; state='play';
}
function startGame(){
  ensureAudio();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  newRound();
}
function topRow(c){ for(var r=0;r<ROWS;r++){ if(board[r][c]!==EMPTY) return r; } return ROWS; }
function canDrop(c){ return topRow(c) < ROWS; }

function place(col){
  if(state!=='play' || gameOver) return;
  if(!canDrop(col)) { beep(120,0.1,'square',0.06); return; }
  var r = topRow(col)-1;
  board[r][col] = current;
  animPiece = { col:col, row:r, player:current, y:-cell*0.9, vy:0, done:false };
  state='anim';
}

function checkWin(){
  var dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
    var v = board[r][c]; if(v===EMPTY) continue;
    for(var d=0;d<dirs.length;d++){
      var cells=[[r,c]];
      for(var k=1;k<4;k++){
        var nr=r+dirs[d][0]*k, nc=c+dirs[d][1]*k;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS||board[nr][nc]!==v) break;
        cells.push([nr,nc]);
      }
      if(cells.length===4) return {player:v, cells:cells};
    }
  }
  return null;
}
function isFull(){ for(var c=0;c<COLS;c++) if(board[0][c]===EMPTY) return false; return true; }

function endRound(win){
  gameOver = true; state='over';
  if(win){
    scores[win.player-1]++; saveScores();
    winCells = win.cells;
    sndWin();
    setTimeout(function(){ showEnd(win.player, true); }, 900);
  } else {
    sndDraw();
    setTimeout(showEnd(0,false), 700);
  }
}
function showEnd(player, won){
  var t = document.getElementById('winTitle');
  if(!won){ t.textContent='It\'s a Draw!'; t.style.color='#9fc1ff'; }
  else {
    t.textContent = 'Player ' + (player===P1?'One Wins!':'Two Wins!');
    t.style.color = player===P1 ? '#ff6b6b' : '#ffd94d';
  }
  document.getElementById('winScore').textContent = 'Score — Red: '+scores[0]+'   Yellow: '+scores[1];
  document.getElementById('endScreen').classList.remove('hidden');
}

/* ---------- input ---------- */
window.addEventListener('keydown', function(e){
  var k = e.key;
  if(['ArrowLeft','ArrowRight','ArrowDown',' '].indexOf(k) !== -1) e.preventDefault();
  ensureAudio();
  if(state==='menu'){ if(k==='Enter'||k===' ') startGame(); return; }
  if(state==='over'){
    if(k==='r'||k==='R') startGame();
    else if(k==='m'||k==='M'){ state='menu'; document.getElementById('endScreen').classList.add('hidden'); document.getElementById('startScreen').classList.remove('hidden'); }
    else if(k==='Enter') startGame();
    return;
  }
  if(state!=='play') return;
  var p = current, moved=false;
  if(p===P1){
    if(k==='a'||k==='A'){ if(colSel[0]>0){colSel[0]--;moved=true;} }
    else if(k==='d'||k==='D'){ if(colSel[0]<COLS-1){colSel[0]++;moved=true;} }
    else if(k==='w'||k==='W'||k==='Enter'){ place(colSel[0]); colSel[0]=3; return; }
  } else {
    if(k==='ArrowLeft'){ if(colSel[1]>0){colSel[1]--;moved=true;} }
    else if(k==='ArrowRight'){ if(colSel[1]<COLS-1){colSel[1]++;moved=true;} }
    else if(k==='ArrowDown'||k===' '){ place(colSel[1]); colSel[1]=3; return; }
  }
  if(moved) sndMove();
});

canvas.addEventListener('pointerdown', function(e){
  ensureAudio();
  if(state!=='play') return;
  var rect = canvas.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(x < bx || x >= bx+cell*COLS) return;
  var c = Math.floor((x-bx)/cell);
  if(c>=0 && c<COLS){ place(c); colSel[current-1]=3; }
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', function(){ ensureAudio(); startGame(); });

/* ---------- drawing ---------- */
function drawBoardBg(){
  // board frame
  var bw = cell*COLS, bh = cell*ROWS;
  ctx.fillStyle = '#12408a';
  roundRect(bx-12, by-12, bw+24, bh+24, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth=2; ctx.stroke();
  // holes + pieces
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
    var cx = bx + c*cell + cell/2, cy = by + r*cell + cell/2;
    if(board[r][c]!==EMPTY && !(animPiece && animPiece.col===c && animPiece.row===r)){
      drawDisc(cx, cy, board[r][c], isWinCell(r,c));
    } else {
      ctx.beginPath(); ctx.arc(cx, cy, cell*0.42, 0, Math.PI*2);
      ctx.fillStyle = '#0b1e3a'; ctx.fill();
    }
  }
}
function isWinCell(r,c){ for(var i=0;i<winCells.length;i++) if(winCells[i][0]===r&&winCells[i][1]===c) return true; return false; }

function drawDisc(cx, cy, player, glow){
  var rad = cell*0.42;
  ctx.beginPath(); ctx.arc(cx, cy+rad*0.06, rad, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill(); // shadow
  var g = ctx.createRadialGradient(cx-rad*0.35, cy-rad*0.4, rad*0.1, cx, cy, rad);
  if(player===P1){ g.addColorStop(0,'#ff8f8f'); g.addColorStop(1,'#d92b2b'); }
  else { g.addColorStop(0,'#ffe98a'); g.addColorStop(1,'#e6a800'); }
  ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2);
  ctx.fillStyle = g; ctx.fill();
  if(glow){
    var pulse = 0.5 + 0.5*Math.sin(performance.now()/180);
    ctx.lineWidth = 3 + 3*pulse;
    ctx.strokeStyle = 'rgba(255,255,255,'+(0.5+0.5*pulse)+')';
    ctx.stroke();
  } else {
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();
  }
}

function drawGhost(){
  if(state!=='play') return;
  var p = current, c = colSel[p-1];
  if(!canDrop(c)) return;
  var cx = bx + c*cell + cell/2;
  // drop line hint
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = p===P1 ? '#ff6b6b' : '#ffd94d';
  ctx.fillRect(bx+c*cell+3, by-8, cell-6, cell*ROWS);
  ctx.globalAlpha = 1;
  // ghost disc above board
  var bob = Math.sin(performance.now()/250)*4;
  drawDisc(cx, by - cell*0.75 + bob, p, false);
}

function drawHUD(){
  var name1 = 'PLAYER ONE', name2 = 'PLAYER TWO';
  ctx.textAlign='center';
  ctx.font = 'bold '+Math.max(14, cell*0.3)+'px Segoe UI, Arial';
  // P1 label
  ctx.fillStyle = current===P1 && state==='play' ? '#ff8f8f' : 'rgba(255,143,143,0.5)';
  ctx.fillText(name1 + '  —  '+scores[0], bx+cell*1.6, by-cell*1.1);
  if(current===P1 && state==='play') drawTurnArrow(bx+cell*1.6, by-cell*0.78);
  // P2 label
  ctx.fillStyle = current===P2 && state==='play' ? '#ffe98a' : 'rgba(255,233,138,0.5)';
  ctx.fillText(name2 + '  —  '+scores[1], bx+cell*(COLS-1.6), by-cell*1.1);
  if(current===P2 && state==='play') drawTurnArrow(bx+cell*(COLS-1.6), by-cell*0.78);
}
function drawTurnArrow(x,y){
  var bob = Math.sin(performance.now()/250)*3;
  ctx.beginPath();
  ctx.moveTo(x, y+bob);
  ctx.lineTo(x-9, y-10+bob);
  ctx.lineTo(x+9, y-10+bob);
  ctx.closePath();
  ctx.fillStyle = current===P1 ? '#ff8f8f' : '#ffe98a';
  ctx.fill();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- main loop ---------- */
var lastT = 0;
function frame(t){
  var dt = Math.min((t-lastT)/1000, 0.05); lastT = t;
  // physics for falling piece
  if(animPiece && !animPiece.done){
    animPiece.vy += cell*38*dt;
    animPiece.y += animPiece.vy*dt;
    var targetY = by + animPiece.row*cell + cell/2;
    if(animPiece.y >= targetY){
      animPiece.y = targetY;
      animPiece.done = true;
      sndDrop();
      state='play';
      var win = checkWin();
      if(win) endRound(win);
      else if(isFull()) endRound(null);
      else current = (current===P1)?P2:P1;
    }
  }
  // draw
  ctx.fillStyle = '#0b1e3a';
  ctx.fillRect(0,0,W,H);
  if(state!=='menu'){
    drawBoardBg();
    drawGhost();
    if(animPiece && !animPiece.done){
      var cx = bx + animPiece.col*cell + cell/2;
      drawDisc(cx, animPiece.y, animPiece.player, false);
    }
    drawHUD();
  }
  requestAnimationFrame(frame);
}

/* ---------- init ---------- */
loadScores();
state='menu';
board=[]; for(var r0=0;r0<ROWS;r0++) board.push([EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY,EMPTY]);
winCells=[]; animPiece=null; gameOver=false;
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
