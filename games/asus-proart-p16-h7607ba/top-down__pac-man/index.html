<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pac Maze</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04061a;}
  #c{display:block;}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(2,4,20,.86);color:#fff;font-family:'Courier New',monospace;text-align:center;z-index:10;}
  #overlay h1{font-size:min(13vw,64px);color:#ffe135;margin:0 0 .2em;letter-spacing:.15em;
    text-shadow:0 0 20px rgba(255,225,53,.55);}
  #overlay p{max-width:540px;line-height:1.5;color:#cfd6ff;margin:.8em 1em;}
  .ctrls{margin:14px 0 26px;color:#9fb0ff;line-height:1.8;font-size:15px;}
  .btn{font-family:inherit;font-size:20px;font-weight:bold;letter-spacing:.1em;padding:12px 36px;
    background:#ffe135;color:#111;border:none;border-radius:8px;cursor:pointer;box-shadow:0 4px 0 #b99a1f;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b99a1f;}
  #dpad{position:fixed;right:16px;bottom:16px;display:none;grid-template-columns:repeat(3,54px);
    grid-template-rows:repeat(2,54px);gap:6px;z-index:20;opacity:.85;}
  #dpad button{font-size:22px;border-radius:10px;border:1px solid #445;background:#1a2350;color:#ffe135;padding:0;}
  @media (pointer:coarse){#dpad{display:grid;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay"></div>
<div id="dpad">
  <button data-d="up" style="grid-column:2">&#9650;</button>
  <button data-d="left">&#9664;</button>
  <button data-d="down">&#9660;</button>
  <button data-d="right">&#9654;</button>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay');
const COLS=19,ROWS=19;
const MAZE=[
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.###...###.####",
"#......##=##......#",
"#......#hhh#......#",
"T......#hhh#......T",
"#......#####......#",
"#....#...#...#....#",
"#.##.#.#####.#.##.#",
"#o.#.....P.....#.o#",
"##.#.#.#####.#.#.##",
"#....#...#...#....#",
"#.######.#.######.#",
"#.................#",
"###################"];
const DIRS=[{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}];
const MODES=[['scatter',5],['chase',18],['scatter',7],['chase',20],['scatter',5],['chase',16]];
const PAC_SPEED=6,GHOST_SPEED=5.3,FRIGHT_SPEED=3.4,EYES_SPEED=10,HOUSE_SPEED=4;

let grid,pellets,score,lives,state='menu',time=0,paused=false;
let tile=40,ox=0,oy=0,wallSegs=[];
let pac,ghosts,blinky,frightTimer=0,combo=0,modeT,mi,deathT=0,readyT=0,lastCell={c:9,r:13};
let hiScore=0;try{hiScore=+localStorage.getItem('pacmaze_hi')||0}catch(e){}

/* ---------- audio ---------- */
let AC=null;
function initAudio(){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){}
}
function tone(f,dur,type,vol,f2){
  if(!AC)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t0);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(vol||.1,t0);
    g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.03);
  }catch(e){}
}
let wakaFlip=false;
const sfxWaka=()=>{wakaFlip=!wakaFlip;tone(wakaFlip?520:380,.07,'square',.05);};
const sfxPower=()=>tone(180,.5,'sawtooth',.14,420);
const sfxGhost=()=>tone(300,.35,'square',.12,950);
function sfxDeath(){
  if(!AC)return;
  try{for(let i=0;i<5;i++){const t0=AC.currentTime+i*.13;
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(620-i*95,t0);
    g.gain.setValueAtTime(.12,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.12);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+.14);}
  }catch(e){}
}

/* ---------- maze helpers ---------- */
function cellAt(c,r){c=((c%COLS)+COLS)%COLS;if(r<0||r>=ROWS)return '#';return grid[r][c];}
function pacOpen(c,r){const ch=cellAt(c,r);return ch==='.'||ch==='o'||ch==='T';}
function ghostOpen(c,r,g){const ch=cellAt(c,r);if(ch==='#')return false;if(ch==='='||ch==='h')return g.canHouse;return true;}

function loadMaze(){
  grid=MAZE.map(row=>row.split(''));
  let n=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=grid[r][c];
    if(ch==='P')grid[r][c]='.';
    if(ch==='.'||ch==='o')n++;
  }
  pellets=n;
}
function buildWalls(){
  wallSegs=[];
  const open=ch=>ch==='.'||ch==='o'||ch==='h'||ch==='T'||ch==='P';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!open(MAZE[r][c]))continue;
    const nb=(cc,rr)=>(cc<0||cc>=COLS||rr<0||rr>=ROWS)?'#':MAZE[rr][cc];
    if(nb(c+1,r)==='#')wallSegs.push([c+1,r,c+1,r+1]);
    if(nb(c-1,r)==='#')wallSegs.push([c,r,c,r+1]);
    if(nb(c,r+1)==='#')wallSegs.push([c,r+1,c+1,r+1]);
    if(nb(c,r-1)==='#')wallSegs.push([c,r,c+1,r]);
  }
}

/* ---------- actors ---------- */
function mk(name,color,x,y,mode,corner){
  return{name,color,x,y,dir:{x:-1,y:0},frightened:false,canHouse:mode!=='normal',mode,corner};
}
function resetActors(){
  pac={x:9.5,y:13.5,dir:null,wantDir:null,face:{x:-1,y:0}};
  lastCell={c:9,r:13};
  blinky=mk('blinky','#ff3b3b',9.5,6.5,'normal',{c:COLS-2,r:1});
  ghosts=[
    blinky,
    mk('pinky','#ffb8f0',8.5,8.5,'inhouse',{c:1,r:1}),
    mk('inky','#00f0f0',10.5,8.5,'inhouse',{c:COLS-2,r:ROWS-2}),
    mk('clyde','#ffb84d',9.5,8.5,'inhouse',{c:1,r:ROWS-2})
  ];
  frightTimer=0;combo=0;mi=0;modeT=MODES[0][1];
}

/* ---------- movement ---------- */
function stepEntity(e,dist){
  if(!e.dir)return;
  const n=Math.max(1,Math.ceil(dist/0.45)),d=dist/n;
  for(let i=0;i<n;i++){if(!e.dir)return;moveStep(e,d);}
}
function moveStep(e,d){
  const dx=e.dir.x,dy=e.dir.y;
  const rx=e.x+dx*d,ry=e.y+dy*d;
  let node=null;
  if(dx!==0){
    const pc=Math.floor(e.x),cx=pc+0.5;
    if(dx>0&&e.x<cx&&rx>=cx)node=[pc,Math.floor(e.y)];
    else if(dx<0&&e.x>cx&&rx<=cx)node=[pc,Math.floor(e.y)];
  }else{
    const pr=Math.floor(e.y),cy=pr+0.5;
    if(dy>0&&e.y<cy&&ry>=cy)node=[Math.floor(e.x),pr];
    else if(dy<0&&e.y>cy&&ry<=cy)node=[Math.floor(e.x),pr];
  }
  if(node){e.x=node[0]+.5;e.y=node[1]+.5;onNode(e,node[0],node[1]);}
  else{
    e.x=rx;e.y=ry;
    if(e.x<0)e.x+=COLS;else if(e.x>=COLS)e.x-=COLS;
  }
}
function onNode(e,c,r){
  if(e===pac)pacOnNode(c,r);else ghostOnNode(e,c,r);
}
function pacOnNode(c,r){
  const w=pac.wantDir;
  if(w&&pacOpen(c+w.x,r+w.y))pac.dir={x:w.x,y:w.y};
  else if(pac.dir&&!pacOpen(c+pac.dir.x,r+pac.dir.y))pac.dir=null;
}
function ghostTarget(g,c,r){
  const pc=Math.floor(((pac.x%COLS)+COLS)%COLS),pr=Math.floor(pac.y);
  const pd=pac.dir||{x:0,y:0};
  if(MODES[mi][0]==='scatter')return g.corner;
  switch(g.name){
    case 'blinky':return{c:pc,r:pr};
    case 'pinky':return{c:pc+4*pd.x,r:pr+4*pd.y};
    case 'inky':{
      const a={c:pc+2*pd.x,r:pr+2*pd.y},b=blinky;
      return{c:2*a.c-Math.floor(b.x),r:2*a.r-Math.floor(b.y)};
    }
    default:{
      const d2=(c-pc)*(c-pc)+(r-pr)*(r-pr);
      return d2>64?{c:pc,r:pr}:g.corner;
    }
  }
}
function ghostOnNode(g,c,r){
  const opts=DIRS.filter(d=>ghostOpen(c+d.x,r+d.y,g));
  if(!opts.length)return;
  let cand=opts.filter(d=>!(d.x===-g.dir.x&&d.y===-g.dir.y));
  if(!cand.length)cand=opts;
  if(g.frightened){g.dir=cand[(Math.random()*cand.length)|0];return;}
  const t=ghostTarget(g,c,r);
  let best=cand[0],bd=-1;
  for(const d of cand){
    const dc=c+d.x-t.c,dr=r+d.y-t.r,v=dc*dc+dr*dr;
    if(bd<0||v<bd){bd=v;best=d;}
  }
  g.dir=best;
}
function homing(e,t,dist){
  const dx=t.x-e.x,dy=t.y-e.y,L=Math.hypot(dx,dy);
  if(L<=dist){e.x=t.x;e.y=t.y;return true;}
  e.x+=dx/L*dist;e.y+=dy/L*dist;return false;
}

/* ---------- game flow ---------- */
function newGame(){
  loadMaze();buildWalls();
  score=0;lives=3;paused=false;
  resetActors();
  state='ready';readyT=1.6;
  hideOverlay();
}
function endGame(win){
  state=win?'win':'over';
  if(score>hiScore)hiScore=score;
  try{localStorage.setItem('pacmaze_hi',String(hiScore));}catch(e){}
  showOverlay(
    '<h1>'+(win?'YOU WIN!':'GAME OVER')+'</h1>'+
    '<p>Final score: <b style="color:#ffe135">'+score+'</b><br>Best: '+hiScore+'</p>'+
    '<button id="goBtn" class="btn">PLAY AGAIN &nbsp;(R)</button>');
  document.getElementById('goBtn').onclick=()=>{initAudio();newGame();};
}
function showMenu(){
  state='menu';paused=false;
  showOverlay(
    '<h1>PAC MAZE</h1>'+
    '<p>Eat every pellet in the maze. Power pellets turn the ghosts blue &mdash; eat them for big points! Don\'t get caught.</p>'+
    '<div class="ctrls"><b>MOVE:</b> Arrow keys / WASD<br><b>PAUSE:</b> P &nbsp;&bull;&nbsp; <b>RESTART:</b> R</div>'+
    '<button id="goBtn" class="btn">START GAME</button>');
  document.getElementById('goBtn').onclick=()=>{initAudio();newGame();};
}
function showOverlay(html){overlay.innerHTML=html;overlay.style.display='flex';}
function hideOverlay(){overlay.style.display='none';}

/* ---------- update ---------- */
function eatAt(c,r){
  const ch=grid[r][c];
  if(ch==='.'){grid[r][c]=' ';score+=10;pellets--;sfxWaka();checkWin();}
  else if(ch==='o'){grid[r][c]=' ';score+=50;pellets--;powerUp();checkWin();}
}
function checkWin(){if(pellets<=0&&state==='playing')endGame(true);}
function powerUp(){
  frightTimer=6;combo=0;sfxPower();
  for(const g of ghosts){
    if(g.mode!=='eyes'&&g.mode!=='entering'){
      g.frightened=true;
      if(g.mode==='normal'&&g.dir)g.dir={x:-g.dir.x,y:-g.dir.y};
    }
  }
}
function updateGhost(g,dt){
  switch(g.mode){
    case 'inhouse':
      if(homing(g,{x:9.5,y:8.5},HOUSE_SPEED*dt))g.mode='exiting';break;
    case 'exiting':
      if(homing(g,{x:9.5,y:6.5},HOUSE_SPEED*dt)){g.mode='normal';g.dir={x:-1,y:0};g.canHouse=false;}break;
    case 'eyes':
      if(homing(g,{x:9.5,y:7.5},EYES_SPEED*dt))g.mode='entering';break;
    case 'entering':
      if(homing(g,{x:9.5,y:8.5},EYES_SPEED*dt)){g.mode='inhouse';g.frightened=false;}break;
    default:
      stepEntity(g,(g.frightened?FRIGHT_SPEED:GHOST_SPEED)*dt);
  }
}
function update(dt){
  time+=dt;
  if(paused||state==='menu')return;
  if(state==='ready'){readyT-=dt;if(readyT<=0)state='playing';return;}
  if(state==='dying'){
    deathT-=dt;
    if(deathT<=0){
      lives--;
      if(lives<=0)endGame(false);
      else{resetActors();state='ready';readyT=1.6;}
    }
    return;
  }
  if(state!=='playing')return;

  modeT-=dt;
  if(modeT<=0){
    mi=(mi+1)%MODES.length;modeT=MODES[mi][1];
    for(const g of ghosts)if(g.mode==='normal'&&g.dir&&!g.frightened)g.dir={x:-g.dir.x,y:-g.dir.y};
  }
  if(frightTimer>0){frightTimer-=dt;if(frightTimer<=0)ghosts.forEach(g=>g.frightened=false);}

  if(pac.dir===null&&pac.wantDir&&pacOpen(Math.floor(pac.x)+pac.wantDir.x,Math.floor(pac.y)+pac.wantDir.y))
    pac.dir={x:pac.wantDir.x,y:pac.wantDir.y};
  if(pac.dir){pac.face=pac.dir;stepEntity(pac,PAC_SPEED*dt);}

  const c=Math.floor(((pac.x%COLS)+COLS)%COLS),r=Math.floor(pac.y);
  if(c!==lastCell.c||r!==lastCell.r){lastCell={c,r};eatAt(c,r);}

  for(const g of ghosts)updateGhost(g,dt);

  for(const g of ghosts){
    if(g.mode!=='normal')continue;
    const d=Math.hypot(g.x-pac.x,g.y-pac.y);
    if(d<0.55){
      if(g.frightened){
        g.frightened=false;g.mode='eyes';g.canHouse=true;
        score+=100<<combo;combo++;sfxGhost();
      }else{
        state='dying';deathT=1.4;sfxDeath();break;
      }
    }
  }
}

/* ---------- drawing ---------- */
function drawPacShape(cx,cy,face,open,scale){
  const x=ox+cx*tile,y=oy+cy*tile,r=tile*0.42*scale;
  if(r<=1)return;
  const a=Math.atan2(face.y,face.x);
  ctx.fillStyle='#ffe135';
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.arc(x,y,r,a+open,a-open,false);
  ctx.closePath();ctx.fill();
}
function drawEyesOnly(x,y,r,g){
  for(const s of[-1,1]){
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(x+s*r*0.32,y-r*0.12,r*0.3,r*0.36,0,0,7);ctx.fill();
    ctx.fillStyle='#1b2cff';
    ctx.beginPath();ctx.arc(x+s*r*0.32+g.dir.x*r*0.14,y-r*0.12+g.dir.y*r*0.14,r*0.15,0,7);ctx.fill();
  }
}
function drawGhost(g){
  const x=ox+g.x*tile,y=oy+g.y*tile,r=tile*0.42;
  if(g.mode==='eyes'){drawEyesOnly(x,y,r,g);return;}
  let body=g.color;
  if(g.frightened)body=(frightTimer<2&&Math.floor(time*6)%2===0)?'#e8ecff':'#2135d6';
  ctx.fillStyle=body;
  ctx.beginPath();
  ctx.arc(x,y,r,Math.PI,0);
  const feet=6;
  for(let i=1;i<=feet;i++){
    const fx=x+r-2*r*i/feet,fy=y+(i%2===0?r*0.7:r);
    ctx.lineTo(fx,fy);
  }
  ctx.closePath();ctx.fill();
  if(g.frightened){
    ctx.fillStyle='#ffc3b8';
    for(const s of[-1,1]){ctx.beginPath();ctx.arc(x+s*r*0.3,y-r*0.12,r*0.14,0,7);ctx.fill();}
    ctx.strokeStyle='#ffc3b8';ctx.lineWidth=Math.max(1.5,r*0.1);
    ctx.beginPath();
    for(let i=0;i<=6;i++){const mx=x-r*0.5+i*r*(1/6),my=y+r*0.3+((i%2)?-r*0.1:r*0.1);
      i?ctx.lineTo(mx,my):ctx.moveTo(mx,my);}
    ctx.stroke();
  }else{
    drawEyesOnly(x,y,r,g);
  }
}
function draw(){
  ctx.fillStyle='#04061a';ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!tile||!grid)return;

  ctx.strokeStyle='#2f5cff';ctx.lineWidth=Math.max(2,tile*0.09);ctx.lineCap='round';
  ctx.beginPath();
  for(const s of wallSegs){ctx.moveTo(ox+s[0]*tile,oy+s[1]*tile);ctx.lineTo(ox+s[2]*tile,oy+s[3]*tile);}
  ctx.stroke();
  ctx.strokeStyle='#ffb8de';ctx.lineWidth=Math.max(2,tile*0.09);
  ctx.beginPath();ctx.moveTo(ox+9*tile,oy+7.5*tile);ctx.lineTo(ox+10*tile,oy+7.5*tile);ctx.stroke();

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ch=grid[r][c];
    if(ch==='.'||ch==='o'){
      const x=ox+(c+.5)*tile,y=oy+(r+.5)*tile;
      if(ch==='.'){ctx.fillStyle='#ffd28f';ctx.beginPath();ctx.arc(x,y,tile*0.07,0,7);ctx.fill();}
      else if(Math.sin(time*10)>-0.3){ctx.fillStyle='#ffe9c9';ctx.beginPath();ctx.arc(x,y,tile*0.18,0,7);ctx.fill();}
    }
  }

  if(state!=='menu'){
    for(const g of ghosts)drawGhost(g);
    if(state==='dying'){
      const p=1-deathT/1.4;
      drawPacShape(pac.x,pac.y,pac.face,Math.min(p*Math.PI*1.2,Math.PI),1);
    }else{
      const open=pac.dir?0.1+0.35*Math.abs(Math.sin(time*14)):0.08;
      drawPacShape(pac.x,pac.y,pac.face,open,1);
    }
  }

  const fs=Math.max(13,tile*0.42);
  ctx.font='bold '+fs+'px "Courier New",monospace';
  ctx.textBaseline='bottom';ctx.textAlign='left';
  ctx.fillStyle='#fff';
  ctx.fillText('SCORE '+String(score).padStart(6,'0'),ox,oy-8);
  ctx.textAlign='center';ctx.fillStyle='#9fb0ff';
  ctx.fillText('HI '+String(Math.max(hiScore,score)).padStart(6,'0'),ox+COLS*tile/2,oy-8);
  for(let i=0;i<lives-1;i++)drawPacShape(COLS-0.7-i*0.95,-0.5,{x:-1,y:0},0.3,0.6);

  if(state==='ready'){
    ctx.fillStyle='#ffe135';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold '+(tile*0.7)+'px "Courier New",monospace';
    ctx.fillText('READY!',ox+COLS*tile/2,oy+11.6*tile);
  }
  if(paused&&(state==='playing'||state==='ready')){
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold '+(tile*0.8)+'px "Courier New",monospace';
    ctx.fillText('PAUSED',ox+COLS*tile/2,oy+ROWS*tile/2);
  }
}

/* ---------- input ---------- */
const KEYMAP={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],
              ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
function setDir(d){
  if(!pac)return;
  pac.wantDir={x:d[0],y:d[1]};
  if(pac.dir&&pac.dir.x===-d[0]&&pac.dir.y===-d[1])pac.dir={x:d[0],y:d[1]};
}
window.addEventListener('keydown',e=>{
  initAudio();
  const k=e.key;
  if(KEYMAP[k]){e.preventDefault();setDir(KEYMAP[k]);return;}
  if(k===' '||k==='Enter'){
    e.preventDefault();
    if(state==='menu'||state==='over'||state==='win')newGame();
    return;
  }
  if(k==='r'||k==='R'){newGame();return;}
  if(k==='p'||k==='P'){if(state==='playing'||state==='ready')paused=!paused;}
});
window.addEventListener('pointerdown',initAudio);
document.querySelectorAll('#dpad button').forEach(b=>{
  const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.d];
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();setDir(d);});
});

/* ---------- resize & loop ---------- */
function resize(){
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  tile=Math.max(8,Math.floor(Math.min(canvas.width/COLS,(canvas.height-64)/ROWS)));
  ox=Math.floor((canvas.width-COLS*tile)/2);
  oy=Math.max(40,Math.floor((canvas.height-ROWS*tile)/2));
}
window.addEventListener('resize',resize);

let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  update(dt);draw();
}

resize();
loadMaze();buildWalls();resetActors();score=0;lives=3;
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
