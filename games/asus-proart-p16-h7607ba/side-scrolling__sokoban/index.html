<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Push — Side-Scrolling Sokoban</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a2340;
    font-family:"Courier New",ui-monospace,monospace;}
  #c{display:block;width:100vw;height:100vh;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(10,14,30,.82);color:#fff;text-align:center;z-index:10;}
  .hidden{display:none;}
  h1{font-size:min(9vw,64px);margin:0 0 4px;letter-spacing:4px;color:#ffd166;
    text-shadow:0 4px 0 #b5651d,0 8px 24px rgba(0,0,0,.6);}
  .sub{font-size:min(3.4vw,18px);color:#9fd8ff;margin-bottom:26px;letter-spacing:2px;}
  .card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.25);
    border-radius:14px;padding:18px 30px;margin-bottom:26px;line-height:1.9;font-size:min(3vw,16px);}
  .card b{color:#ffd166;}
  button{font-family:inherit;font-size:min(4vw,20px);letter-spacing:2px;padding:12px 34px;
    border-radius:10px;border:0;cursor:pointer;background:#ffd166;color:#4a2c00;font-weight:bold;
    box-shadow:0 5px 0 #b5651d;}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #b5651d;}
  .hint{margin-top:14px;font-size:13px;color:#8fa3c8;}
  #hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:10px;align-items:center;
    color:#fff;z-index:5;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.7);font-weight:bold;}
  .chip{background:rgba(10,16,34,.65);border:1px solid rgba(255,255,255,.25);border-radius:8px;
    padding:6px 12px;font-size:min(3vw,15px);}
  #restart{pointer-events:auto;margin-left:auto;background:#ffd166;color:#4a2c00;border:0;
    border-radius:8px;padding:6px 14px;font-family:inherit;font-weight:bold;cursor:pointer;
    font-size:min(3vw,15px);box-shadow:0 3px 0 #b5651d;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <span class="chip" id="hLevel">LEVEL 1/3</span>
  <span class="chip" id="hBoxes">📦 0/1</span>
  <button id="restart">↻ R</button>
</div>

<div id="menu" class="overlay">
  <h1>SKY PUSH</h1>
  <div class="sub">a side-scrolling sokoban</div>
  <div class="card">
    <b>← →</b> / <b>A D</b> &nbsp;move<br>
    <b>↑</b> / <b>W</b> / <b>SPACE</b> &nbsp;jump<br>
    push crates onto the glowing pads — mind your footing,<br>
    crates fall if you push them off an edge!<br>
    <b>R</b> restart level &nbsp;·&nbsp; <b>ENTER</b> confirm
  </div>
  <button id="startBtn">▶ START</button>
  <div class="hint">press ENTER to begin</div>
</div>

<div id="win" class="overlay hidden">
  <h1 id="winTitle" style="font-size:min(7vw,48px)">LEVEL CLEAR!</h1>
  <div class="sub" id="winSub">nice pushing!</div>
  <button id="nextBtn">NEXT LEVEL ▶</button>
  <div class="hint">press ENTER</div>
</div>

<script>
(function(){
"use strict";
const T=48, GRAV=1150, JUMP=-575, SPEED=235;
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const $=id=>document.getElementById(id);
const menuEl=$('menu'), winEl=$('win'), hudEl=$('hud');

/* ---------------- levels ---------------- */
const LEVELS=[
[ // 1 — first push (40x9)
"....................................",
"....................................",
"....................................",
"....................................",
"....B......T........................",
"...##########...................",
"###.................................",
"###..........................P......",
"####################################"
].map(r=>r.padEnd(40,'.')),

[ // 2 — two crates, one drop (48x10)
"................................................",
"................................................",
"................................................",
"................................................",
"................................................",
"................................................",
"...............................B................",
"..................##............................",
"....B.........T.....##........#######.......T...",
"################################################"
].map(r=>r.padEnd(48,'.')),

[ // 3 — the long haul (56x12)
"........................................................",
"........................................................",
"........................................................",
"........................................................",
"........................................................",
"........................................................",
"...............................B........................",
"..........................#######.....................",
"...............B...T......#######.....................",
"..............#######..##.#######.....................",
".P..B.....T...#######..##.#######.................T....",
"########################################################"
].map(r=>r.padEnd(56,'.'))
];

/* ---------------- state ---------------- */
let grid=[], cols=0, rows=0, targets=new Set(), boxes=[], player=null;
let levelIdx=0, state='menu', time=0;
const keys={left:false,right:false,jump:false};

function loadLevel(i){
  levelIdx=i; grid=LEVELS[i]; rows=grid.length; cols=grid[0].length;
  targets=new Set(); boxes=[]; player=null;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const ch=grid[y][x];
    if(ch==='T')targets.add(x+'_'+y);
    else if(ch==='B')boxes.push({x:x*T,y:y*T,vy:0,on:false});
    else if(ch==='P')player={x:x*T+(T-34)/2,y:(y+1)*T-40,w:34,h:40,vx:0,vy:0,facing:1,grounded:false};
  }
  $('hLevel').textContent='LEVEL '+(i+1)+'/'+LEVELS.length;
  updateHud();
}

/* ---------------- audio ---------------- */
let AC=null,lastPush=0;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type,v,slide,delay){
  const a=audio(); if(!a)return;
  const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t0+d);
  g.gain.setValueAtTime(v||0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+d+0.02);
}
const sndJump=()=>tone(300,0.16,'square',0.10,280);
function sndPush(){const n=performance.now(); if(n-lastPush<120)return; lastPush=n; tone(85,0.09,'sawtooth',0.14,-30);}
function sndPlace(){tone(620,0.09,'triangle',0.14);tone(930,0.14,'triangle',0.14,0,0.08);}
function sndWin(){[523,659,784,1047].forEach((f,i)=>tone(f,0.18,'square',0.11,0,i*0.12));}

/* ---------------- physics helpers ---------------- */
function solidAt(tx,ty){
  if(tx<0||tx>=cols)return true;
  if(ty<0)return false;
  if(ty>=rows)return true;
  return grid[ty][tx]==='#';
}
function rectHitsSolid(x,y,w,h){
  const x0=Math.floor(x/T),x1=Math.floor((x+w-0.01)/T);
  const y0=Math.floor(y/T),y1=Math.floor((y+h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty))return true;
  return false;
}
function overlap(x,y,w,h,o){return x<o.x+o.w&&x+w>o.x&&y<o.y+o.h&&y+h>o.y;}

function pushBox(b,dir,dist){
  let moved=0;
  while(dist>0.001){
    const s=Math.min(2,dist); dist-=s;
    const nx=b.x+dir*s;
    if(rectHitsSolid(nx,b.y,T,T))break;
    let blocked=false;
    for(const o of boxes){
      if(o===b)continue;
      if(overlap(nx,b.y,T,T,o)){
        const om=pushBox(o,dir,s);
        if(om<s-0.5){blocked=true;break;}
      }
    }
    if(blocked)break;
    b.x=nx; moved+=s;
  }
  return moved;
}

function movePlayerX(dt){
  const p=player; let dx=p.vx*dt;
  while(Math.abs(dx)>0.001){
    const s=Math.sign(dx)*Math.min(2,Math.abs(dx)); dx-=s;
    const nx=p.x+s;
    if(rectHitsSolid(nx,p.y,p.w,p.h)){p.vx=0;break;}
    let hit=null;
    for(const b of boxes)if(overlap(nx,p.y,p.w,p.h,b)){hit=b;break;}
    if(hit){
      const aligned=Math.abs((p.y+p.h)-(hit.y+T))<16;
      if(aligned){
        const m=pushBox(hit,Math.sign(s),Math.abs(s));
        p.x+=Math.sign(s)*m;
        if(m>0)sndPush();
        if(m<Math.abs(s)-0.5)p.vx=0;
      }else{p.vx=0;break;}
    }else p.x=nx;
  }
}

function movePlayerY(dt){
  const p=player; p.grounded=false;
  let dy=p.vy*dt;
  while(Math.abs(dy)>0.001){
    const s=Math.sign(dy)*Math.min(2,Math.abs(dy)); dy-=s;
    const ny=p.y+s;
    if(rectHitsSolid(ny,p.x,p.w,p.h)){
      if(p.vy>0){p.y=Math.floor((ny+p.h-0.01)/T)*T-p.h;p.grounded=true;}
      else p.y=(Math.floor(ny/T)+1)*T;
      p.vy=0;break;
    }
    let hit=null;
    for(const b of boxes)if(overlap(ny,p.x,p.w,p.h,b)){hit=b;break;}
    if(hit){
      if(p.vy>0&&p.y+p.h<=hit.y+14){p.y=hit.y-p.h;p.grounded=true;}
      else if(p.vy<0&&p.y>=hit.y+T-14){p.y=hit.y+T;}
      p.vy=0;break;
    }else p.y=ny;
  }
}

function moveBoxY(b,dt){
  let dy=b.vy*dt;
  while(Math.abs(dy)>0.001){
    const s=Math.sign(dy)*Math.min(2,Math.abs(dy)); dy-=s;
    const ny=b.y+s;
    if(rectHitsSolid(ny,b.x,T,T)){
      b.y=Math.floor((ny+T-0.01)/T)*T-T; b.vy=0; break;
    }
    let hit=null;
    for(const o of boxes)if(o!==b&&overlap(ny,b.x,T,T,o)){hit=o;break;}
    if(hit){
      if(b.vy>0&&b.y+b.h<=hit.y+14)b.y=hit.y-T;
      else if(b.vy<0&&b.y>=hit.y+T-14)b.y=hit.y+T;
      b.vy=0;break;
    }else b.y=ny;
  }
}

function onTarget(b){
  const tx=Math.floor((b.x+T/2)/T), ty=Math.floor((b.y+T/2)/T);
  return targets.has(tx+'_'+ty)&&Math.abs((b.y+T)%T)<3;
}

function updateHud(){
  let n=0; for(const b of boxes)if(onTarget(b))n++;
  $('hBoxes').textContent='📦 '+n+'/'+boxes.length;
}

function checkWin(){
  for(const b of boxes){
    const now=onTarget(b);
    if(now&&!b.on)sndPlace();
    b.on=now;
  }
  updateHud();
  if(boxes.every(b=>b.on)){
    state='win'; sndWin();
    const last=levelIdx===LEVELS.length-1;
    $('winTitle').textContent=last?'ALL CLEAR!':'LEVEL CLEAR!';
    $('winSub').textContent=last?'you pushed every crate. amazing!':'nice pushing!';
    $('nextBtn').textContent=last?'▶ PLAY AGAIN':'NEXT LEVEL ▶';
    winEl.classList.remove('hidden');
  }
}

function update(dt){
  const p=player;
  const ax=(keys.left?-1:0)+(keys.right?1:0);
  p.vx=ax*SPEED; if(ax)p.facing=ax;
  if(keys.jump&&p.grounded){p.vy=JUMP;p.grounded=false;sndJump();}
  if(!keys.jump&&p.vy<-200)p.vy=-200;
  p.vy=Math.min(p.vy+GRAV*dt,950);
  movePlayerX(dt);
  movePlayerY(dt);
  for(const b of boxes){b.vy=Math.min(b.vy+GRAV*dt,950);moveBoxY(b,dt);}
  checkWin();
}

/* ---------------- rendering ---------------- */
function resize(){cvs.width=window.innerWidth;cvs.height=window.innerHeight;}
window.addEventListener('resize',resize); resize();

const clouds=[]; for(let i=0;i<8;i++)clouds.push({x:Math.random()*2400,y:40+Math.random()*180,s:0.6+Math.random()*1.1});

function drawCloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,7);ctx.arc(x+20*s,y-8*s,15*s,0,7);
  ctx.arc(x+40*s,y,16*s,0,7);ctx.arc(x+18*s,y+6*s,14*s,0,7);
  ctx.fill();
}

function drawHills(fac,color,amp,base){
  ctx.fillStyle=color;ctx.beginPath();
  const off=camX*fac;
  ctx.moveTo(-50,window.innerHeight+50);
  for(let x=-50;x<=window.innerWidth+50;x+=24){
    const w=x+off;
    const y=base-Math.sin(w*0.004)*amp-Math.sin(w*0.011+2)*amp*0.5;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(window.innerWidth+50,window.innerHeight+50);ctx.closePath();ctx.fill();
}

function render(){
  const W=cvs.width,H=cvs.height,p=player||{x:0,y:0,w:34,h:40};
  let camX=p.x+p.w/2-W/2;
  camX=Math.max(camX,(cols*T-W)/2);
  camX=Math.min(camX,Math.max(0,cols*T-W));
  if(cols*T<W)camX=(cols*T-W)/2;
  let camY=p.y+p.h/2-H/2;
  camY=Math.max(camY,(rows*T-H)/2);
  camY=Math.min(camY,Math.max(0,rows*T-H));
  if(rows*T<H)camY=(rows*T-H)/2;

  // sky
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#8ec9f5');g.addColorStop(0.6,'#cfe9fb');g.addColorStop(1,'#ffe9c4');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,236,150,.9)';ctx.beginPath();ctx.arc(W*0.82,90,46,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,236,150,.35)';ctx.beginPath();ctx.arc(W*0.82,90,70,0,7);ctx.fill();
  // clouds
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(const c of clouds){
    const span=W+400;
    let cx=((c.x-camX*0.35)%span+span)%span-200;
    drawCloud(cx,c.y,c.s);
  }
  drawHills(0.25,'#9db8d8',60,H*0.72);
  drawHills(0.45,'#6f93bd',45,H*0.85);

  ctx.save();ctx.translate(-camX,-camY);

  // targets
  const pulse=0.5+0.5*Math.sin(time*4);
  for(const key of targets){
    const [tx,ty]=key.split('_').map(Number);
    if(tx<camX/T-2||tx>camX/T+W/T+2)continue;
    const x=tx*T,y=ty*T;
    ctx.save();
    ctx.shadowColor='#35e0ff';ctx.shadowBlur=14+8*pulse;
    ctx.fillStyle='rgba(53,224,255,'+(0.55+0.35*pulse)+')';
    roundRect(x+6,y+T-14,T-12,10,5);ctx.fill();
    ctx.restore();
    ctx.fillStyle='#0b5c73';roundRect(x+6,y+T-14,T-12,10,5);ctx.globalAlpha=0.25;ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x+T/2,y+4);ctx.lineTo(x+T/2-6,y+14);ctx.moveTo(x+T/2,y+4);ctx.lineTo(x+T/2+6,y+14);
    ctx.moveTo(x+T/2,y+18);ctx.lineTo(x+T/2,y+10);ctx.stroke();
  }

  // solids
  const x0=Math.max(0,Math.floor(camX/T)-1),x1=Math.min(cols-1,Math.ceil((camX+W)/T)+1);
  for(let ty=0;ty<rows;ty++)for(let tx=x0;tx<=x1;tx++){
    if(grid[ty][tx]!=='#')continue;
    const x=tx*T,y=ty*T;
    const hsh=((tx*73856093)^(ty*19349663))>>>0;
    ctx.fillStyle=hsh%2?'#7a4a24':'#83512a';
    ctx.fillRect(x,y,T,T);
    if(hsh%7===0){ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(x+(hsh%30)+6,y+((hsh>>5)%30)+8,5,5);}
    if(ty===0||grid[ty-1][tx]!=='#'){
      ctx.fillStyle='#4caf50';ctx.fillRect(x,y,T,12);
      ctx.fillStyle='#6fd673';ctx.fillRect(x,y,T,5);
      ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x,y+12,T,3);
    }
  }

  // boxes
  for(const b of boxes){
    const on=b.on;
    ctx.save();
    if(on){ctx.shadowColor='#5aff8a';ctx.shadowBlur=18;}
    ctx.fillStyle=on?'#d9a04b':'#c98a3d';
    roundRect(b.x+2,b.y+2,T-4,T-4,6);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=on?'#2f9e4f':'#7c5218';ctx.lineWidth=4;
    roundRect(b.x+3,b.y+3,T-6,T-6,5);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(b.x+5,b.y+5);ctx.lineTo(b.x+T-5,b.y+T-5);
    ctx.moveTo(b.x+T-5,b.y+5);ctx.lineTo(b.x+5,b.y+T-5);
    ctx.strokeStyle='rgba(124,82,24,.55)';ctx.lineWidth=3;ctx.stroke();
    if(on){
      ctx.fillStyle='#eafff0';ctx.font='bold 20px monospace';ctx.textAlign='center';
      ctx.fillText('✓',b.x+T/2,b.y+T/2+7);
    }
  }

  // player
  if(player){
    const px=player.x,py=player.y;
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.beginPath();ctx.ellipse(px+17,(Math.floor((py+40)/T))*T-3,16,5,0,0,7);ctx.fill();
    // body
    ctx.fillStyle='#ff8c42';roundRect(px,py+10,34,30,8);ctx.fill();
    ctx.strokeStyle='#b34d0e';ctx.lineWidth=3;roundRect(px,py+10,34,30,8);ctx.stroke();
    // head
    ctx.fillStyle='#ffd9b3';ctx.beginPath();ctx.arc(px+17,py+10,12,0,7);ctx.fill();
    ctx.strokeStyle='#b34d0e';ctx.lineWidth=2.5;ctx.stroke();
    // cap
    ctx.fillStyle='#e63946';ctx.beginPath();ctx.arc(px+17,py+8,12,Math.PI,0);ctx.fill();
    ctx.fillRect(px+17+(player.facing>0?0:-16),py+5,16,4);
    // eyes
    const eo=player.facing*3;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(px+12+eo,py+9,3.4,0,7);ctx.arc(px+22+eo,py+9,3.4,0,7);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(px+12.6+eo,py+9,1.6,0,7);ctx.arc(px+22.6+eo,py+9,1.6,0,7);ctx.fill();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ---------------- input / flow ---------------- */
function startGame(){
  menuEl.classList.add('hidden');winEl.classList.add('hidden');hudEl.classList.remove('hidden');
  loadLevel(0);state='play';
}
function nextLevel(){
  winEl.classList.add('hidden');
  const n=(levelIdx+1)%LEVELS.length;
  loadLevel(n);state='play';
}

window.addEventListener('keydown',e=>{
  audio();
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=true;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.right=true;
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')keys.jump=true;
  if((k==='Enter')&&state==='menu')startGame();
  else if(k==='Enter'&&(state==='win'))nextLevel();
  else if((k==='r'||k==='R')&&state!=='menu'){loadLevel(levelIdx);state='play';winEl.classList.add('hidden');}
});
window.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.right=false;
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')keys.jump=false;
});
$('startBtn').addEventListener('click',()=>{audio();startGame();});
$('nextBtn').addEventListener('click',()=>{audio();nextLevel();});
$('restart').addEventListener('click',()=>{audio();loadLevel(levelIdx);state='play';winEl.classList.add('hidden');});

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;time+=dt;
  if(state==='play')update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
