<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tetris Match-3</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0f1e;font-family:'Segoe UI',Arial,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,24,.88);color:#fff;z-index:10;text-align:center;}
  .overlay h1{font-size:min(9vw,56px);margin:0 0 6px;background:linear-gradient(90deg,#ff5c5c,#ffe14d,#5ce66b,#4dc3ff,#c77dff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;}
  .overlay p{color:#aeb6e8;margin:4px 0;font-size:min(3.4vw,17px);}
  .controls{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 22px;margin:14px 0;line-height:1.7;font-size:min(3.2vw,15px);}
  .controls b{color:#ffe14d;}
  button{margin-top:8px;padding:12px 34px;font-size:18px;font-weight:bold;color:#0d0f1e;background:linear-gradient(180deg,#5ce66b,#37c94e);border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #1f8a30;transition:transform .08s;}
  button:hover{transform:translateY(-2px);}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #1f8a30;}
  .hidden{display:none !important;}
  #finalScore{font-size:min(6vw,30px);color:#ffe14d;font-weight:bold;margin:8px 0;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="startScreen" class="overlay">
  <h1>TETRIS MATCH-3</h1>
  <p>Falling color pairs — line up 3 or more of the same color to blast them!</p>
  <div class="controls">
    <b>&larr; &rarr;</b> Move &nbsp;&nbsp; <b>&uarr; / X</b> Rotate &nbsp;&nbsp; <b>Z</b> Rotate back<br>
    <b>&darr;</b> Soft drop &nbsp;&nbsp; <b>Space</b> Hard drop &nbsp;&nbsp; <b>P</b> Pause &nbsp;&nbsp; <b>R</b> Restart
  </div>
  <button id="startBtn">PLAY</button>
</div>

<div id="overScreen" class="overlay hidden">
  <h1>GAME OVER</h1>
  <div id="finalScore"></div>
  <p id="bestLine"></p>
  <button id="restartBtn">PLAY AGAIN</button>
</div>

<script>
(function(){
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const startScreen = document.getElementById('startScreen');
const overScreen = document.getElementById('overScreen');

const COLS = 8, ROWS = 12;
const COLORS = ['#ff5c5c','#ffb84d','#ffe14d','#5ce66b','#4dc3ff','#c77dff'];

let cell=30, bx=0, by=0, W=0, H=0;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W; cv.height = H;
  cell = Math.floor(Math.min((W-26)/COLS, (H-46)/ROWS));
  const panelW = cell*3.2;
  bx = Math.floor((W - COLS*cell - panelW)/2) + Math.max(0,(W - COLS*cell - panelW)*0);
  bx = Math.floor(Math.max(10, (W - COLS*cell - panelW)/2));
  by = Math.floor(Math.max(14, (H - ROWS*cell)/2));
}
window.addEventListener('resize', resize);
resize();

// ---------- audio ----------
let actx=null;
function initAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
function beep(freq,dur,type,vol,slide){
  if(!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), actx.currentTime+dur);
    g.gain.value=vol||0.08;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

// ---------- state ----------
let grid, piece, nextPiece, score, best=0, level, chain;
let mode='start'; // start | play | over
let sub='drop';   // drop | clear
let gravT=0, clearT=0, clearingCells=[], comboText='', comboT=0, shake=0;
let paused=false, lastTime=0;

try{ best = parseInt(localStorage.getItem('tm3_best')||'0',10)||0; }catch(e){}

function colorsForLevel(){ return Math.min(6, 4 + Math.floor((level-1)/2)); }
function makePiece(){
  const n = colorsForLevel();
  const c1 = (Math.random()*n)|0, c2 = (Math.random()*n)|0;
  return {x:2, y:-1, rot:0, c:[c1,c2]};
}
function cells(p){
  if(p.rot===0) return [{x:p.x,y:p.y},{x:p.x+1,y:p.y}];
  return [{x:p.x,y:p.y},{x:p.x,y:p.y+1}];
}
function collides(px,py,rot,c2ok){
  const list = rot===0?[{x:px,y:py},{x:px+1,y:py}]:[{x:px,y:py},{x:px,y:py+1}];
  for(const c of list){
    if(c.x<0||c.x>=COLS||c.y>=ROWS) return true;
    if(c.y>=0 && grid[c.y][c.x]!==null) return true;
  }
  return false;
}

function startGame(){
  grid = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  score=0; level=1; chain=0; gravT=0; sub='drop'; paused=false;
  piece = makePiece(); nextPiece = makePiece();
  mode='play';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
}

function gameOver(){
  mode='over';
  try{ if(score>best){ best=score; localStorage.setItem('tm3_best',''+best); } }catch(e){}
  document.getElementById('finalScore').textContent = 'Score: '+score;
  document.getElementById('bestLine').textContent = 'Best: '+best;
  overScreen.classList.remove('hidden');
  beep(200,0.4,'sawtooth',0.1,-150);
}

function findMatches(){
  const seen = Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const match = new Set();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c = grid[y][x];
    if(c===null||seen[y][x]) continue;
    const stack=[[x,y]], group=[];
    seen[y][x]=true;
    while(stack.length){
      const [cx,cy]=stack.pop(); group.push([cx,cy]);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+dx, ny=cy+dy;
        if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!seen[ny][nx]&&grid[ny][nx]===c){
          seen[ny][nx]=true; stack.push([nx,ny]);
        }
      }
    }
    if(group.length>=3) group.forEach(([gx,gy])=>match.add(gy*COLS+gx));
  }
  return match;
}

function lockPiece(){
  let topOut=false;
  for(const c of cells(piece)){
    if(c.y<0){ topOut=true; continue; }
    grid[c.y][c.x]=piece.c[cells(piece).indexOf(c)];
  }
  // fix colors properly:
  const cs = cells(piece);
  for(let i=0;i<2;i++){
    const c=cs[i];
    if(c.y>=0) grid[c.y][c.x]=piece.c[i];
  }
  beep(150,0.08,'triangle',0.1);
  if(topOut){ gameOver(); return; }
  chain=0;
  const m = findMatches();
  if(m.size>0){
    sub='clear'; clearT=0; clearingCells=[...m];
  } else {
    piece = nextPiece; nextPiece = makePiece(); gravT=0;
  }
}

function applyGravity(){
  for(let x=0;x<COLS;x++){
    let write=ROWS-1;
    for(let y=ROWS-1;y>=0;y--){
      if(grid[y][x]!==null){
        grid[write][x]=grid[y][x];
        if(write!==y) grid[y][x]=null;
        write--;
      }
    }
  }
}

function update(dt){
  if(mode!=='play'||paused) return;
  if(shake>0) shake=Math.max(0,shake-dt*40);
  if(comboT>0) comboT-=dt;

  const interval = Math.max(280, 750 - (level-1)*65);

  if(sub==='drop'){
    gravT+=dt;
    while(gravT>=interval){
      gravT-=interval;
      if(!collides(piece.x,piece.y+1,piece.rot)) piece.y++;
      else break;
    }
    if(collides(piece.x,piece.y+1,piece.rot)) lockPiece();
  } else {
    clearT+=dt;
    if(clearT>=0.45){
      chain++;
      const count = clearingCells.length;
      const pts = count*10*chain + (count-2)*5;
      score += pts;
      level = 1 + Math.floor(score/400);
      comboText = chain>1 ? ('COMBO x'+chain+'  +'+pts) : ('+'+pts);
      comboT=1.1;
      shake = 3+chain*2;
      beep(300+chain*120,0.18,'square',0.1, 200+chain*100);
      if(chain>1) setTimeout(()=>beep(450+chain*120,0.15,'square',0.09,250),90);
      for(const idx of clearingCells){
        const y=(idx/COLS)|0, x=idx%COLS;
        grid[y][x]=null;
      }
      applyGravity();
      clearingCells=[];
      const m = findMatches();
      if(m.size>0){ sub='clear'; clearT=0; clearingCells=[...m]; }
      else { sub='drop'; gravT=0; piece=nextPiece; nextPiece=makePiece(); }
    }
  }
}

// ---------- input ----------
function doMove(dx){
  if(mode!=='play'||paused||sub!=='drop') return;
  if(!collides(piece.x+dx,piece.y,piece.rot)){ piece.x+=dx; beep(220,0.04,'triangle',0.05); }
}
function doRotate(dir){
  if(mode!=='play'||paused||sub!=='drop') return;
  const r = (piece.rot+dir+2)%2;
  // wall kicks
  for(const [kx,ky] of [[0,0],[1,0],[-1,0],[0,-1],[1,-1],[-1,-1]]){
    if(!collides(piece.x+kx,piece.y+ky,r)){ piece.x+=kx; piece.y+=ky; piece.rot=r; beep(330,0.05,'triangle',0.06); return; }
  }
}
function doSoftDrop(){
  if(mode!=='play'||paused||sub!=='drop') return;
  if(!collides(piece.x,piece.y+1,piece.rot)){ piece.y++; score+=1; gravT=0; beep(180,0.03,'triangle',0.04); }
}
function doHardDrop(){
  if(mode!=='play'||paused||sub!=='drop') return;
  let d=0;
  while(!collides(piece.x,piece.y+1,piece.rot)){ piece.y++; d++; }
  score += d*2;
  beep(120,0.1,'square',0.1,-60);
  lockPiece();
}

window.addEventListener('keydown', function(e){
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  initAudio();
  if(mode==='start' && (k==='Enter'||k===' ')) { startGame(); return; }
  if(mode==='over' && (k==='Enter'||k==='r'||k==='R')) { startGame(); return; }
  if(k==='p'||k==='P'){ if(mode==='play'){ paused=!paused; beep(paused?150:400,0.08,'sine',0.06);} return; }
  if((k==='r'||k==='R') && mode==='play'){ startGame(); return; }
  switch(k){
    case 'ArrowLeft': doMove(-1); break;
    case 'ArrowRight': doMove(1); break;
    case 'ArrowDown': doSoftDrop(); break;
    case 'ArrowUp': case 'x': case 'X': doRotate(1); break;
    case 'z': case 'Z': doRotate(-1); break;
    case ' ': doHardDrop(); break;
  }
});
document.getElementById('startBtn').addEventListener('click',function(){ initAudio(); startGame(); beep(500,0.1,'sine',0.08,300); });
document.getElementById('restartBtn').addEventListener('click',function(){ initAudio(); startGame(); beep(500,0.1,'sine',0.08,300); });

// ---------- drawing ----------
function drawBall(x,y,colorIdx,r,flash){
  const cx = x+r, cy=y+r;
  const col = COLORS[colorIdx];
  const g = ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.1,cx,cy,r);
  g.addColorStop(0,'#ffffff');
  g.addColorStop(0.25,col);
  g.addColorStop(1, shade(col,-0.45));
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
  if(flash){
    const p = (clearT/0.45);
    ctx.globalAlpha = 0.35+0.4*Math.sin(p*Math.PI*3);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.globalAlpha=1;
  }
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,Math.round(r*(1+amt))));
  g=Math.max(0,Math.min(255,Math.round(g*(1+amt))));
  b=Math.max(0,Math.min(255,Math.round(b*(1+amt))));
  return 'rgb('+r+','+g+','+b+')';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // bg
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#141833'); bg.addColorStop(1,'#0a0c1a');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  if(mode==='start') return;

  const sx = shake>0 ? (Math.random()-0.5)*shake : 0;
  const sy = shake>0 ? (Math.random()-0.5)*shake : 0;
  ctx.save(); ctx.translate(sx,sy);

  // board bg
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.fillRect(bx-4,by-4,COLS*cell+8,ROWS*cell+8);
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.lineWidth=2;
  ctx.strokeRect(bx-4,by-4,COLS*cell+8,ROWS*cell+8);
  // grid lines
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.lineWidth=1;
  for(let x=1;x<COLS;x++){ ctx.beginPath(); ctx.moveTo(bx+x*cell,by); ctx.lineTo(bx+x*cell,by+ROWS*cell); ctx.stroke(); }
  for(let y=1;y<ROWS;y++){ ctx.beginPath(); ctx.moveTo(bx,by+y*cell); ctx.lineTo(bx+COLS*cell,by+y*cell); ctx.stroke(); }

  // placed balls
  const clearSet = new Set(clearingCells);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=grid[y][x];
    if(c!==null) drawBall(bx+x*cell,by+y*cell,c,cell*0.44, clearSet.has(y*COLS+x));
  }

  // current piece + ghost
  if(mode==='play' && sub==='drop'){
    let gy=piece.y;
    while(!collides(piece.x,gy+1,piece.rot)) gy++;
    const cs = cells(piece);
    for(let i=0;i<2;i++){
      const gx=bx+(cs[i].x)*cell, gyy=by+gy*cell;
      if(gy>=0){
        ctx.globalAlpha=0.18;
        ctx.beginPath(); ctx.arc(gx+cell/2,gyy+cell/2,cell*0.44,0,Math.PI*2);
        ctx.fillStyle=COLORS[piece.c[i]]; ctx.fill();
        ctx.globalAlpha=1;
      }
    }
    for(let i=0;i<2;i++){
      const c=cs[i];
      if(c.y>=0) drawBall(bx+c.x*cell,by+c.y*cell,piece.c[i],cell*0.44,false);
    }
  }

  // combo text
  if(comboT>0){
    ctx.globalAlpha = Math.min(1,comboT);
    ctx.font='bold '+Math.floor(cell*0.75)+'px Segoe UI, Arial';
    ctx.textAlign='center';
    ctx.fillStyle='#ffe14d';
    ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=4;
    const ty = by + ROWS*cell*0.42 - (1.1-comboT)*30;
    ctx.strokeText(comboText,bx+COLS*cell/2,ty);
    ctx.fillText(comboText,bx+COLS*cell/2,ty);
    ctx.globalAlpha=1;
  }

  // side panel
  const px = bx + COLS*cell + cell*0.7;
  ctx.fillStyle='#fff';
  ctx.font='bold '+Math.floor(cell*0.45)+'px Segoe UI, Arial';
  ctx.textAlign='left';
  ctx.fillText('SCORE',px,by+cell*0.5);
  ctx.font='bold '+Math.floor(cell*0.62)+'px Segoe UI, Arial';
  ctx.fillStyle='#ffe14d';
  ctx.fillText(score,px,by+cell*1.15);

  ctx.fillStyle='#fff';
  ctx.font='bold '+Math.floor(cell*0.45)+'px Segoe UI, Arial';
  ctx.fillText('BEST',px,by+cell*2.1);
  ctx.font=Math.floor(cell*0.5)+'px Segoe UI, Arial';
  ctx.fillStyle='#aeb6e8';
  ctx.fillText(Math.max(best,score),px,by+cell*2.7);

  ctx.fillStyle='#fff';
  ctx.font='bold '+Math.floor(cell*0.45)+'px Segoe UI, Arial';
  ctx.fillText('LEVEL',px,by+cell*3.6);
  ctx.font='bold '+Math.floor(cell*0.62)+'px Segoe UI, Arial';
  ctx.fillStyle='#5ce66b';
  ctx.fillText(level,px,by+cell*4.25);

  // next piece box
  const ny = by + cell*5;
  ctx.fillStyle='rgba(255,255,255,0.06)';
  ctx.fillRect(px-8,ny,cell*2.2,cell*2.2);
  ctx.strokeStyle='rgba(255,255,255,0.2)';
  ctx.strokeRect(px-8,ny,cell*2.2,cell*2.2);
  ctx.fillStyle='#aeb6e8';
  ctx.font='bold '+Math.floor(cell*0.38)+'px Segoe UI, Arial';
  ctx.fillText('NEXT',px-4,ny+cell*0.5);
  const nsize=cell*0.5;
  if(nextPiece.rot===0){
    drawBall(px+nsize*0.2, ny+nsize*1.1, nextPiece.c[0], nsize*0.42,false);
    drawBall(px+nsize*1.2, ny+nsize*1.1, nextPiece.c[1], nsize*0.42,false);
  } else {
    drawBall(px+nsize*0.7, ny+nsize*0.8, nextPiece.c[0], nsize*0.42,false);
    drawBall(px+nsize*0.7, ny+nsize*1.6, nextPiece.c[1], nsize*0.42,false);
  }

  // pause overlay
  if(paused){
    ctx.fillStyle='rgba(8,10,24,0.7)';
    ctx.fillRect(bx-4,by-4,COLS*cell+8,ROWS*cell+8);
    ctx.fillStyle='#fff';
    ctx.font='bold '+Math.floor(cell*0.9)+'px Segoe UI, Arial';
    ctx.textAlign='center';
    ctx.fillText('PAUSED',bx+COLS*cell/2,by+ROWS*cell/2);
    ctx.font=Math.floor(cell*0.45)+'px Segoe UI, Arial';
    ctx.fillStyle='#aeb6e8';
    ctx.fillText('Press P to resume',bx+COLS*cell/2,by+ROWS*cell/2+cell*0.8);
  }

  ctx.restore();
}

function loop(t){
  const dt = Math.min(50, t-lastTime);
  lastTime=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(function(t){ lastTime=t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
