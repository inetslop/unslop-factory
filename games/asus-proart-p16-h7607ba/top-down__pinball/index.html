<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top-Down Pinball</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070c;overflow:hidden;font-family:'Courier New',monospace;}
  body{display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;}
  canvas{display:block;background:#0a0f1e;border-radius:14px;box-shadow:0 0 40px rgba(0,200,255,.25), inset 0 0 60px rgba(0,0,0,.6);}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,8,18,.86);color:#cfefff;border-radius:14px;text-align:center;z-index:5;}
  .hidden{display:none;}
  h1{font-size:clamp(28px,5vw,52px);margin:0 0 6px;letter-spacing:3px;color:#4ff0ff;text-shadow:0 0 18px rgba(80,240,255,.8);}
  .sub{color:#8fb8d8;font-size:clamp(12px,1.6vw,16px);margin-bottom:22px;}
  .controls{color:#e8f6ff;font-size:clamp(13px,1.7vw,17px);line-height:1.9;margin-bottom:24px;background:rgba(20,40,70,.5);padding:14px 26px;border-radius:10px;border:1px solid rgba(80,200,255,.3);}
  .key{display:inline-block;background:#12233c;border:1px solid #2e6ea0;border-bottom-width:3px;border-radius:6px;padding:1px 9px;margin:0 3px;color:#7fe8ff;font-weight:bold;}
  button{font-family:inherit;font-size:clamp(15px,1.8vw,19px);letter-spacing:2px;background:linear-gradient(#1a4a6e,#0d2b47);color:#cfefff;border:1px solid #3fa8e0;border-radius:10px;padding:12px 34px;cursor:pointer;transition:all .15s;}
  button:hover{background:linear-gradient(#2a6ea0,#124066);box-shadow:0 0 18px rgba(80,220,255,.5);transform:translateY(-1px);}
  #finalScore{font-size:clamp(20px,3vw,30px);color:#ffd76a;margin-bottom:4px;text-shadow:0 0 12px rgba(255,200,80,.6);}
  #bestLine{color:#8fb8d8;font-size:clamp(13px,1.6vw,16px);margin-bottom:22px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="900" height="620"></canvas>

  <div id="startScreen" class="overlay">
    <h1>TOP-DOWN PINBALL</h1>
    <div class="sub">Gravity-free table &mdash; keep the ball alive!</div>
    <div class="controls">
      <span class="key">&larr;</span><span class="key">A</span> left flipper &nbsp;&nbsp;
      <span class="key">&rarr;</span><span class="key">D</span> right flipper<br>
      <span class="key">SPACE</span> nudge the ball &nbsp;&nbsp;
      <span class="key">R</span> restart<br>
      Smash bumpers for points. Avoid the 6 holes!
    </div>
    <button id="startBtn">&#9654; START GAME</button>
  </div>

  <div id="overScreen" class="overlay hidden">
    <h1 style="color:#ff7b6a;text-shadow:0 0 18px rgba(255,110,90,.7);">GAME OVER</h1>
    <div id="finalScore">SCORE: 0</div>
    <div id="bestLine">BEST: 0</div>
    <button id="againBtn">&#8635; PLAY AGAIN</button>
  </div>
</div>

<script>
(function(){
"use strict";
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;
var startScreen = document.getElementById('startScreen'), overScreen = document.getElementById('overScreen');
var finalScoreEl = document.getElementById('finalScore'), bestLineEl = document.getElementById('bestLine');

/* ---------- audio (created after first input) ---------- */
var AC = null;
function initAudio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
function beep(freq, dur, type, vol, slideTo){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), t+dur);
    g.gain.setValueAtTime(vol||0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}

/* ---------- game state ---------- */
var state = 'start'; // start | playing | over
var score = 0, balls = 3, best = 0;
try{ best = parseInt(localStorage.getItem('topdownPinballBest')||'0',10)||0; }catch(e){}

var ball = {x:W/2, y:H*0.4, vx:0, vy:0, r:13};
var invuln = 0, stuckT = 0, trail = [], popups = [];

var pockets = [
  {x:28,   y:28,   r:30}, {x:W-28, y:28,   r:30},
  {x:28,   y:H-28, r:30}, {x:W-28, y:H-28, r:30},
  {x:W/2-170, y:26,r:24},{x:W/2+170,y:26,r:24},
  {x:W/2, y:H-8,  r:26}
];
var bumpers = [
  {x:W/2,     y:H*0.36, r:36, pts:150, hitT:0, hue:190},
  {x:W*0.27,  y:H*0.30, r:27, pts:100, hitT:0, hue:310},
  {x:W*0.73,  y:H*0.30, r:27, pts:100, hitT:0, hue:310},
  {x:W*0.26,  y:H*0.64, r:22, pts:50,  hitT:0, hue:45},
  {x:W*0.74,  y:H*0.64, r:22, pts:50,  hitT:0, hue:45},
  {x:W/2-140, y:H*0.80, r:19, pts:50,  hitT:0, hue:130},
  {x:W/2+140, y:H*0.80, r:19, pts:50,  hitT:0, hue:130}
];

function mkFlipper(px, restDeg, actDeg){
  return {px:px, py:H-36, len:135, fr:15,
          a:(restDeg*Math.PI)/180, rest:(restDeg*Math.PI)/180, act:(actDeg*Math.PI)/180, omega:0};
}
var flippers = [ mkFlipper(W/2-45, 168, 204), mkFlipper(W/2+45, -168, -204) ];
var keys = {left:false, right:false};

function resetBall(){
  ball.x = W/2; ball.y = H*0.35;
  var a = Math.random()*Math.PI*2;
  ball.vx = Math.cos(a)*130; ball.vy = Math.sin(a)*130;
  invuln = 1.4; stuckT = 0; trail.length = 0;
}
function startGame(){
  score = 0; balls = 3; state = 'playing';
  resetBall(); popups.length = 0;
  bumpers.forEach(function(b){ b.hitT = 0; });
  startScreen.classList.add('hidden'); overScreen.classList.add('hidden');
}
function gameOver(){
  state = 'over';
  if(score > best){ best = score; try{ localStorage.setItem('topdownPinballBest', String(best)); }catch(e){} }
  finalScoreEl.textContent = 'SCORE: ' + score;
  bestLineEl.textContent = 'BEST: ' + best + (score>=best && score>0 ? '  \u2605 NEW RECORD!' : '');
  overScreen.classList.remove('hidden');
  beep(392,0.18,'sawtooth',0.14); setTimeout(function(){beep(311,0.2,'sawtooth',0.14);},180); setTimeout(function(){beep(233,0.5,'sawtooth',0.16,110);},380);
}

/* ---------- physics ---------- */
function flipperTip(f){ return {x:f.px + Math.cos(f.a)*f.len, y:f.py + Math.sin(f.a)*f.len}; }

function collideFlipper(f){
  var t = flipperTip(f);
  var dx = t.x-f.px, dy = t.y-f.py;
  var L2 = dx*dx+dy*dy;
  var tt = ((ball.x-f.px)*dx + (ball.y-f.py)*dy) / L2;
  tt = Math.max(0, Math.min(1, tt));
  var cx = f.px + dx*tt, cy = f.py + dy*tt;
  var nx = ball.x-cx, ny = ball.y-cy;
  var d = Math.sqrt(nx*nx+ny*ny);
  var minD = f.fr + ball.r;
  if(d >= minD) return;
  if(d < 0.0001){ nx = -Math.sin(f.a); ny = Math.cos(f.a); d = 0.0001; }
  nx/=d; ny/=d;
  ball.x = cx + nx*minD; ball.y = cy + ny*minD;
  // surface velocity of flipper at contact point
  var rx = cx-f.px, ry = cy-f.py;
  var svx = -f.omega*ry, svy = f.omega*rx;
  var rvx = ball.vx-svx, rvy = ball.vy-svy;
  var vn = rvx*nx + rvy*ny;
  if(vn < 0){
    var e = 0.45;
    ball.vx -= (1+e)*vn*nx;
    ball.vy -= (1+e)*vn*ny;
    if(Math.abs(vn) > 60) beep(240 + Math.min(300,Math.abs(vn)), 0.05, 'triangle', 0.08);
  }
}

function step(dt){
  // flippers
  for(var i=0;i<2;i++){
    var f = flippers[i];
    var target = (i===0 ? keys.left : keys.right) ? f.act : f.rest;
    var spd = 30*dt;
    var prev = f.a;
    if(f.a < target) f.a = Math.min(target, f.a + spd);
    else if(f.a > target) f.a = Math.max(target, f.a - spd);
    f.omega = (f.a - prev)/dt;
  }

  var steps = 5, sdt = dt/steps;
  for(var s=0;s<steps;s++){
    ball.x += ball.vx*sdt;
    ball.y += ball.vy*sdt;
    var fr = Math.exp(-0.4*sdt);
    ball.vx *= fr; ball.vy *= fr;

    // pockets
    if(invuln <= 0){
      for(var p=0;p<pockets.length;p++){
        var pk = pockets[p];
        var pdx = ball.x-pk.x, pdy = ball.y-pk.y;
        if(pdx*pdx+pdy*pdy < (pk.r-6)*(pk.r-6)){ loseBall(); return; }
      }
    }

    // walls
    if(ball.x < ball.r){ ball.x = ball.r; if(ball.vx<0){ball.vx=-ball.vx*0.9; beep(120,0.05,'sine',0.07);} }
    if(ball.x > W-ball.r){ ball.x = W-ball.r; if(ball.vx>0){ball.vx=-ball.vx*0.9; beep(120,0.05,'sine',0.07);} }
    if(ball.y < ball.r){ ball.y = ball.r; if(ball.vy<0){ball.vy=-ball.vy*0.9; beep(120,0.05,'sine',0.07);} }
    if(ball.y > H-ball.r){ ball.y = H-ball.r; if(ball.vy>0){ball.vy=-ball.vy*0.9; beep(120,0.05,'sine',0.07);} }

    // bumpers
    for(var b=0;b<bumpers.length;b++){
      var bu = bumpers[b];
      var bx = ball.x-bu.x, by = ball.y-bu.y;
      var bd = Math.sqrt(bx*bx+by*by);
      if(bd < bu.r + ball.r && bd > 0.001){
        bx/=bd; by/=bd;
        ball.x = bu.x + bx*(bu.r+ball.r);
        ball.y = bu.y + by*(bu.r+ball.r);
        var vn2 = ball.vx*bx + ball.vy*by;
        if(vn2 < 0){
          ball.vx -= (1+0.5)*vn2*bx;
          ball.vy -= (1+0.5)*vn2*by;
          ball.vx += bx*380;
          ball.vy += by*380;
          bu.hitT = 0.28;
          addScore(bu.pts, bu.x, bu.y - bu.r - 14);
          beep(560 + Math.random()*220, 0.09, 'square', 0.13);
        }
      }
    }

    // flippers
    for(var fl=0;fl<2;fl++) collideFlipper(flippers[fl]);

    // speed cap
    var sp = Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
    if(sp > 950){ ball.vx *= 950/sp; ball.vy *= 950/sp; }
  }

  invuln -= dt;
  bumpers.forEach(function(b){ if(b.hitT>0) b.hitT -= dt; });

  // stuck detection / auto nudge
  var spd2 = Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
  if(spd2 < 9) stuckT += dt; else stuckT = 0;
  if(stuckT > 6){
    var na = Math.random()*Math.PI*2;
    ball.vx += Math.cos(na)*340; ball.vy += Math.sin(na)*340;
    stuckT = 0;
    addPopup(ball.x, ball.y-24, 'NUDGED!', '#ffd76a');
  }

  // trail
  trail.push({x:ball.x, y:ball.y});
  if(trail.length > 16) trail.shift();
}

function loseBall(){
  balls--;
  beep(500, 0.5, 'sawtooth', 0.16, 70);
  if(balls <= 0){ gameOver(); }
  else {
    addPopup(ball.x, ball.y, 'BALL LOST!', '#ff7b6a');
    resetBall();
  }
}

function addScore(pts, x, y){ score += pts; addPopup(x, y, '+'+pts, '#7fe8ff'); }
function addPopup(x,y,txt,col){ popups.push({x:x,y:y,txt:txt,t:1.2,col:col}); }

/* ---------- rendering ---------- */
function draw(){
  ctx.clearRect(0,0,W,H);

  // table background
  var g = ctx.createRadialGradient(W/2,H/2,60, W/2,H/2,W*0.7);
  g.addColorStop(0,'#101c34'); g.addColorStop(1,'#080d1a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // decorative rings
  ctx.strokeStyle = 'rgba(60,140,220,0.10)'; ctx.lineWidth = 2;
  for(var rr=70; rr<W/2; rr+=95){ ctx.beginPath(); ctx.arc(W/2,H/2,rr,0,Math.PI*2); ctx.stroke(); }
  ctx.setLineDash([6,10]);
  ctx.strokeStyle = 'rgba(80,180,255,0.08)';
  ctx.beginPath(); ctx.moveTo(W/2,30); ctx.lineTo(W/2,H-30); ctx.stroke();
  ctx.setLineDash([]);

  // border
  ctx.strokeStyle = '#2f7fb8'; ctx.lineWidth = 5;
  ctx.shadowColor = 'rgba(60,190,255,0.6)'; ctx.shadowBlur = 14;
  roundRect(3,3,W-6,H-6,12); ctx.stroke();
  ctx.shadowBlur = 0;

  // pockets
  for(var p=0;p<pockets.length;p++){
    var pk = pockets[p];
    var pg = ctx.createRadialGradient(pk.x,pk.y,2, pk.x,pk.y,pk.r);
    pg.addColorStop(0,'#000'); pg.addColorStop(0.75,'#050608'); pg.addColorStop(1,'#1a0d12');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.arc(pk.x,pk.y,pk.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,90,80,0.7)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(pk.x,pk.y,pk.r-1,0,Math.PI*2); ctx.stroke();
  }

  // bumpers
  for(var b=0;b<bumpers.length;b++){
    var bu = bumpers[b];
    var flash = bu.hitT > 0 ? Math.min(1, bu.hitT/0.28) : 0;
    ctx.save();
    if(flash>0){ ctx.shadowColor = 'hsla('+bu.hue+',100%,70%,0.9)'; ctx.shadowBlur = 30*flash; }
    ctx.fillStyle = 'hsl('+bu.hue+','+(60+30*flash)+'%,'+(38+28*flash)+'%)';
    ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r*(1+0.12*flash),0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'hsl('+bu.hue+',90%,'+(70+20*flash)+'%)';
    ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r*0.55,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,'+(0.35+0.5*flash)+')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bu.x,bu.y,bu.r*(1+0.12*flash),0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(10,20,35,0.9)';
    ctx.font = 'bold '+(bu.r*0.62)+'px Courier New'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(bu.pts, bu.x, bu.y+1);
    ctx.restore();
  }

  // flippers
  for(var f=0;f<2;f++){
    var fl = flippers[f], t = flipperTip(fl);
    ctx.strokeStyle = '#ffb347'; ctx.lineCap='round'; ctx.lineWidth = fl.fr*2;
    ctx.shadowColor = 'rgba(255,170,60,0.55)'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(fl.px,fl.py); ctx.lineTo(t.x,t.y); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#8a4b12';
    ctx.beginPath(); ctx.arc(fl.px,fl.py,fl.fr*0.55,0,Math.PI*2); ctx.fill();
  }

  // trail
  for(var tr=0;tr<trail.length;tr++){
    var a = (tr/trail.length)*0.28;
    ctx.fillStyle = 'rgba(160,230,255,'+a+')';
    ctx.beginPath(); ctx.arc(trail[tr].x, trail[tr].y, ball.r*(tr/trail.length)*0.9, 0, Math.PI*2); ctx.fill();
  }

  // ball
  if(state === 'playing'){
    var bg = ctx.createRadialGradient(ball.x-4,ball.y-5,2, ball.x,ball.y,ball.r);
    bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.5,'#cfe8ff'); bg.addColorStop(1,'#5f9fd8');
    ctx.fillStyle = bg;
    if(invuln > 0 && Math.floor(invuln*12)%2===0) ctx.globalAlpha = 0.45;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // popups
  for(var pp=popups.length-1; pp>=0; pp--){
    var pu = popups[pp];
    ctx.globalAlpha = Math.max(0, Math.min(1, pu.t));
    ctx.fillStyle = pu.col;
    ctx.font = 'bold 20px Courier New'; ctx.textAlign='center';
    ctx.fillText(pu.txt, pu.x, pu.y - (1.2-pu.t)*40);
    ctx.globalAlpha = 1;
  }

  // HUD
  if(state !== 'start'){
    ctx.fillStyle = 'rgba(200,240,255,0.85)';
    ctx.font = 'bold 24px Courier New'; ctx.textAlign='center';
    ctx.fillText('SCORE ' + score, W/2, 34);
    ctx.font = '15px Courier New'; ctx.fillStyle = 'rgba(160,200,235,0.7)';
    var dots = ''; for(var d=0; d<balls; d++) dots += '\u25CF ';
    ctx.fillText('BALLS ' + (dots||'—'), W/2, 56);
    ctx.textAlign='left'; ctx.font='13px Courier New'; ctx.fillStyle='rgba(140,180,220,0.4)';
    ctx.fillText('BEST '+best, 14, H-14);
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- main loop ---------- */
var last = performance.now();
function frame(now){
  var dt = Math.min(0.033, (now-last)/1000);
  last = now;
  if(state === 'playing') step(dt);
  for(var i=popups.length-1;i>=0;i--){ popups[i].t -= dt*0.9; if(popups[i].t<=0) popups.splice(i,1); }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- input ---------- */
function handleKey(code, down){
  initAudio();
  if(down && (code==='Enter' || code==='Space')){
    if(state==='start'){ startGame(); return; }
  }
  if(down && code==='KeyR'){ startGame(); return; }
  if(code==='ArrowLeft'||code==='KeyA') keys.left = down;
  if(code==='ArrowRight'||code==='KeyD') keys.right = down;
  if(down && code==='Space' && state==='playing'){
    var a = Math.random()*Math.PI*2;
    ball.vx += Math.cos(a)*300; ball.vy += Math.sin(a)*300;
    stuckT = 0;
    beep(300, 0.06, 'triangle', 0.1);
    addPopup(ball.x, ball.y-24, 'NUDGE', '#9fd8ff');
  }
}
window.addEventListener('keydown', function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0) e.preventDefault();
  handleKey(e.code, true);
});
window.addEventListener('keyup', function(e){ handleKey(e.code, false); });

document.getElementById('startBtn').addEventListener('click', function(){ initAudio(); startGame(); beep(660,0.1,'square',0.12); });
document.getElementById('againBtn').addEventListener('click', function(){ initAudio(); startGame(); beep(660,0.1,'square',0.12); });
window.addEventListener('pointerdown', initAudio, {once:true});

/* ---------- resize / fit ---------- */
function fit(){
  var s = Math.min(window.innerWidth/W, window.innerHeight/H) * 0.98;
  cv.style.width = (W*s)+'px';
  cv.style.height = (H*s)+'px';
}
window.addEventListener('resize', fit);
fit();
})();
</script>
</body>
</html>
