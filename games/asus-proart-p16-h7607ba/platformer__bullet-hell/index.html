<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BULLET BLAST</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;position:absolute;left:0;top:0;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const W=1280,H=720;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0;
function resize(){
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  scale=Math.min(cv.width/W,cv.height/H);
  ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2;
}
window.addEventListener('resize',resize);resize();

// ---------- audio ----------
let AC=null;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f,d,type,vol,slide){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
}
function noiseBurst(d,vol){
  if(!AC)return;
  const n=AC.sampleRate*d,buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;
  g.gain.value=vol||0.2;s.connect(g);g.connect(AC.destination);s.start();
}
const sfx={
  shoot:()=>beep(880,0.08,'square',0.06,-500),
  jump:()=>beep(300,0.15,'sine',0.12,400),
  hit:()=>{noiseBurst(0.3,0.3);beep(120,0.3,'sawtooth',0.2,-80);},
  boom:()=>{noiseBurst(0.25,0.25);beep(200,0.2,'triangle',0.15,-160);},
  hurt:()=>{beep(140,0.35,'sawtooth',0.25,-90);noiseBurst(0.2,0.2);},
  start:()=>{beep(440,0.1,'square',0.1);setTimeout(()=>beep(660,0.1,'square',0.1),100);setTimeout(()=>beep(880,0.15,'square',0.12),200);}
};

// ---------- input ----------
const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  initAudio();
  keys[e.code]=true;
  if(state==='menu'&&(e.code==='Enter'||e.code==='Space'))startGame();
  else if(state==='over'&&(e.code==='KeyR'||e.code==='Enter'))startGame();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('mousedown',()=>{initAudio();if(state==='menu')startGame();else if(state==='over')startGame();});

// ---------- world ----------
let state='menu',player,platforms,enemies,ebullets,pbullets,particles;
let time=0,score=0,spawnTimer=2,shake=0,hiscore=0;
try{hiscore=parseInt(localStorage.getItem('bb_hiscore')||'0')||0;}catch(e){}

function makePlatforms(){
  return [
    {x:0,y:680,w:1280,h:40,vx:0,minX:0,maxX:0},
    {x:170,y:545,w:260,h:18,vx:0,minX:0,maxX:0},
    {x:850,y:545,w:260,h:18,vx:0,minX:0,maxX:0},
    {x:505,y:435,w:270,h:18,vx:0,minX:0,maxX:0},
    {x:280,y:330,w:210,h:18,vx:90,minX:60,maxX:830},
    {x:150,y:215,w:190,h:18,vx:0,minX:0,maxX:0},
    {x:940,y:215,w:190,h:18,vx:0,minX:0,maxX:0}
  ];
}
function reset(){
  player={x:W/2-16,y:600,w:32,h:44,vx:0,vy:0,onGround:false,jumps:0,facing:1,hp:3,inv:0,cool:0};
  platforms=makePlatforms();enemies=[];ebullets=[];pbullets=[];particles=[];
  time=0;score=0;spawnTimer=2.5;shake=0;
}
function startGame(){reset();state='play';sfx.start();}

// ---------- helpers ----------
const rnd=(a,b)=>a+Math.random()*(b-a);
function diff(){return Math.min(4,time/35);}
function aimAt(x,y,spd){const dx=player.x+16-x,dy=player.y+22-y;const l=Math.hypot(dx,dy)||1;return{x:dx/l*spd,y:dy/l*spd};}
function addBullet(x,y,vx,vy,r,col){if(ebullets.length<700)ebullets.push({x,y,vx,vy,r:r||6,col:col||'#ff5f8f',life:12});}
function burst(x,y,n,col,spd){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(spd*0.3,spd);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.3,0.7),max:0.7,col,r:rnd(2,5)});}}
function hurtPlayer(){
  if(player.inv>0)return;
  player.hp--;player.inv=1.6;shake=14;sfx.hurt();
  burst(player.x+16,player.y+22,24,'#ffcc44',300);
  if(player.hp<=0){burst(player.x+16,player.y+22,60,'#ff7744',450);state='over';sfx.boom();
    if(score>hiscore){hiscore=score;try{localStorage.setItem('bb_hiscore',''+hiscore);}catch(e){}}
  }
}

// ---------- enemies ----------
function spawnEnemy(){
  const r=Math.random(),d=diff();
  if(r<0.45){ // drone
    enemies.push({type:'drone',x:rnd(60,W-60),y:-30,ttx:rnd(120,W-120),tty:rnd(70,300),hp:3,r:20,fireT:rnd(0.8,1.8),t:rnd(0,9)});
  }else if(r<0.75){ // swooper
    const fromLeft=Math.random()<0.5;
    enemies.push({type:'swooper',x:fromLeft?-40:W+40,y:rnd(80,340),dir:fromLeft?1:-1,spd:rnd(120,170)+d*20,hp:2,r:16,fireT:rnd(0.5,1.2),t:0,baseY:0});
    enemies[enemies.length-1].baseY=enemies[enemies.length-1].y;
  }else{ // turret on a platform
    const p=platforms[Math.floor(rnd(1,platforms.length))];
    enemies.push({type:'turret',x:p.x+p.w/2,y:p.y-24,hp:5+Math.floor(d),r:20,fireT:0.6,ang:rnd(0,6.28),t:0});
  }
}

function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.t+=dt;
    if(e.type==='drone'){
      const dx=e.ttx-e.x,dy=e.tty-e.y,d=Math.hypot(dx,dy);
      if(d>8){const s=220*dt/d;e.x+=dx*s;e.y+=dy*s;}
      e.x+=Math.sin(e.t*2)*30*dt;
      e.fireT-=dt;
      if(e.fireT<=0&&d<700){
        e.fireT=Math.max(1.1,2.2-diff()*0.25);
        const sp=240+diff()*25;
        if(Math.random()<0.3){for(let k=0;k<8;k++){const a=k/8*Math.PI*2+e.t;addBullet(e.x,e.y,Math.cos(a)*sp,Math.sin(a)*sp,6,'#c77dff');}}
        else{for(let k=-1;k<=1;k++){const v=aimAt(e.x,e.y,sp);const a=Math.atan2(v.y,v.x)+k*0.25;addBullet(e.x,e.y,Math.cos(a)*sp,Math.sin(a)*sp,6,'#ff5f8f');}}
      }
    }else if(e.type==='swooper'){
      e.x+=e.dir*e.spd*dt;e.y=e.baseY+Math.sin(e.t*3.2)*70;
      e.fireT-=dt;
      if(e.fireT<=0&&e.x>40&&e.x<W-40){e.fireT=Math.max(0.8,1.6-diff()*0.15);const v=aimAt(e.x,e.y,310+diff()*25);addBullet(e.x,e.y,v.x,v.y,7,'#ffd166');}
      if(e.x<-70||e.x>W+70){enemies.splice(i,1);continue;}
    }else if(e.type==='turret'){
      e.fireT-=dt;
      if(e.fireT<=0){e.fireT=Math.max(0.35,0.6-diff()*0.05);
        for(let k=0;k<4;k++){const a=e.ang+k*Math.PI/2;addBullet(e.x,e.y-8,Math.cos(a)*200,Math.sin(a)*200,5,'#7ae0ff');}
        e.ang+=0.35;}
    }
    // collide with player
    const dx=e.x-(player.x+16),dy=e.y-(player.y+22);
    if(dx*dx+dy*dy<(e.r+14)*(e.r+14)){hurtPlayer();}
    if(e.hp<=0){enemies.splice(i,1);score+=e.type==='turret'?150:e.type==='drone'?100:80;burst(e.x,e.y,26,'#ffaa33',350);sfx.boom();}
  }
}

// ---------- update ----------
function update(dt){
  time+=dt;score+=Math.floor(dt*10);
  shake=Math.max(0,shake-dt*40);

  // platforms
  for(const p of platforms){if(p.vx){p.x+=p.vx*dt;if(p.x<p.minX||p.x+p.w>p.maxX)p.vx*=-1;}}

  const P=player;
  const left=keys['KeyA']||keys['ArrowLeft'],right=keys['KeyD']||keys['ArrowRight'];
  const jumpHeld=keys['KeyW']||keys['ArrowUp']||keys['Space'];
  if(left){P.vx=-340;P.facing=-1;}else if(right){P.vx=340;P.facing=1;}else P.vx=0;

  // jumping (double jump)
  if(jumpHeld&&!P.jk){
    P.jk=true;
    if(P.onGround||P.coyote>0){P.vy=-650;P.onGround=false;P.coyote=0;sfx.jump();burst(P.x+16,P.y+44,6,'#ffffff',120);}
    else if(P.jumps<1){P.jumps=1;P.vy=-600;sfx.jump();burst(P.x+16,P.y+44,10,'#8be9fd',150);}
  }
  if(!jumpHeld)P.jk=false;
  if(jumpHeld&&P.vy<0)P.vy+=2400*dt*0.35; // variable jump
  P.vy+=2000*dt;

  const prevBottom=P.y+P.h;
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  P.x=Math.max(0,Math.min(W-P.w,P.x));
  P.onGround=false;
  for(const p of platforms){
    if(P.vy>=0&&prevBottom<=p.y+6&&P.y+P.h>=p.y&&P.x+P.w>p.x+4&&P.x<p.x+p.w-4){
      P.y=p.y-P.h;P.vy=0;P.onGround=true;P.jumps=0;P.coyote=0.12;
      if(p.vx)P.x+=p.vx*dt; // carried by moving platform
    }
  }
  if(P.onGround)P.coyote=0.12;else P.coyote=Math.max(0,P.coyote-dt);
  if(P.y>H+60){hurtPlayer();if(state==='play'){P.x=W/2;P.y=100;P.vy=0;}}
  P.inv=Math.max(0,P.inv-dt);

  // shooting
  P.cool-=dt;
  if((keys['KeyJ']||keys['KeyX'])&&P.cool<=0){
    P.cool=0.16;sfx.shoot();
    pbullets.push({x:P.x+16+P.facing*22,y:P.y+20,vx:P.facing*760,life:1});
    particles.push({x:P.x+16+P.facing*24,y:P.y+20,vx:P.facing*60,vy:0,life:0.08,max:0.08,col:'#fff',r:5});
  }

  // player bullets
  for(let i=pbullets.length-1;i>=0;i--){
    const b=pbullets[i];b.x+=b.vx*dt;b.life-=dt;
    if(b.x<-20||b.x>W+20||b.life<=0){pbullets.splice(i,1);continue;}
    for(const e of enemies){
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<e.r*e.r){e.hp--;pbullets.splice(i,1);burst(b.x,b.y,5,'#ffe08a',180);beep(220,0.06,'square',0.08,-100);break;}
    }
  }

  // enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30||b.life<=0){ebullets.splice(i,1);continue;}
    const dx=b.x-(P.x+16),dy=b.y-(P.y+22);
    if(dx*dx+dy*dy<(b.r+11)*(b.r+11)){ebullets.splice(i,1);hurtPlayer();}
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;
    if(p.life<=0)particles.splice(i,1);
  }

  // spawning
  spawnTimer-=dt;
  if(spawnTimer<=0&&enemies.length<4+Math.floor(diff())){
    spawnEnemy();
    spawnTimer=Math.max(0.8,rnd(2.2,3.2)-diff()*0.4);
  }

  updateEnemies(dt);
}

// ---------- draw ----------
function drawPlatforms(){
  for(const p of platforms){
    ctx.fillStyle='#2b3a5c';ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle=p.vx?'#8be9fd':'#4f6df5';ctx.fillRect(p.x,p.y,p.w,4);
  }
}
function drawPlayer(){
  const P=player;
  if(P.inv>0&&Math.floor(time*20)%2===0)return;
  ctx.save();ctx.translate(P.x+16,P.y+22);
  // body
  ctx.fillStyle='#8be9fd';ctx.fillRect(-13,-22,26,40);
  ctx.fillStyle='#5e60ce';ctx.fillRect(-13,4,26,18);
  // visor
  ctx.fillStyle='#fff';ctx.fillRect(P.facing>0?-2:-12,-16,14,8);
  ctx.fillStyle='#0b132b';ctx.fillRect(P.facing>0?7:-9,-14,5,4);
  // gun
  ctx.fillStyle='#ffd166';ctx.fillRect(P.facing>0?10:-26,-4,16,8);
  ctx.restore();
}
function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  if(e.type==='drone'){
    ctx.fillStyle='#c77dff';ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();
    ctx.fillStyle='#240046';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
    const a=Math.atan2(player.y+22-e.y,player.x+16-e.x);
    ctx.fillStyle='#ff5f8f';ctx.beginPath();ctx.arc(Math.cos(a)*5,Math.sin(a)*5,4,0,7);ctx.fill();
  }else if(e.type==='swooper'){
    ctx.rotate(e.dir>0?0:Math.PI);
    ctx.fillStyle='#ffd166';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-14,-14);ctx.lineTo(-8,0);ctx.lineTo(-14,14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3a0ca3';ctx.beginPath();ctx.arc(4,0,5,0,7);ctx.fill();
  }else{
    ctx.fillStyle='#4361ee';ctx.fillRect(-20,-14,40,28);
    ctx.fillStyle='#7ae0ff';ctx.fillRect(-20,-14,40,5);
    const a=e.ang;
    ctx.strokeStyle='#7ae0ff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(Math.cos(a)*26,-6+Math.sin(a)*26);ctx.stroke();
  }
  // hp pips
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  // shake
  if(shake>0)ctx.translate(rnd(-shake,shake)*0.4,rnd(-shake,shake)*0.4);

  // background
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101830');g.addColorStop(1,'#0a0f1e');
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  ctx.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<40;i++){const x=(i*173.3)%W,y=(i*97.7)%H;ctx.fillRect(x,y,i%3?1:2,i%3?1:2);}

  drawPlatforms();

  // player bullets
  ctx.fillStyle='#fff';
  for(const b of pbullets){ctx.fillRect(b.x-10,b.y-2,20,4);ctx.fillStyle='rgba(139,233,253,0.6)';ctx.fillRect(b.x-14,b.y-1,8,2);ctx.fillStyle='#fff';}

  // enemy bullets
  for(const b of ebullets){
    ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.45,0,7);ctx.fill();
  }

  for(const e of enemies)drawEnemy(e);
  if(state!=='over')drawPlayer();

  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  // HUD
  if(state!=='menu'){
    ctx.font='bold 26px monospace';ctx.textAlign='left';
    ctx.fillStyle='#ff5f8f';let hs='';for(let i=0;i<3;i++)hs+=i<player.hp?'♥ ':'♡ ';
    ctx.fillText(hs,20,40);
    ctx.fillStyle='#fff';ctx.textAlign='right';ctx.fillText('SCORE '+score,W-20,40);
    ctx.fillStyle='#8be9fd';ctx.font='16px monospace';ctx.fillText('TIME '+time.toFixed(1)+'s',W-20,64);
  }

  if(state==='menu')drawMenu();
  if(state==='over')drawOver();
}
function panel(w,h){
  ctx.fillStyle='rgba(8,12,30,0.9)';
  const x=W/2-w/2,y=H/2-h/2;
  ctx.fillRect(x,y,w,h);ctx.strokeStyle='#4f6df5';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
}
function drawMenu(){
  panel(760,470);
  ctx.textAlign='center';
  ctx.font='bold 64px monospace';ctx.fillStyle='#8be9fd';ctx.fillText('BULLET BLAST',W/2,H/2-150);
  ctx.font='20px monospace';ctx.fillStyle='#fff';
  const lines=['A / D or ← →   move','W / ↑ / SPACE   jump (double jump!)','J / X   shoot','','Survive the bullet storm. Blast drones, swoopers and turrets.','Moving platforms carry you — use them to dodge!'];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,H/2-80+i*36));
  ctx.fillStyle='#ffd166';ctx.font='bold 24px monospace';
  ctx.fillText('PRESS ENTER TO START',W/2,H/2+165);
  if(hiscore>0){ctx.fillStyle='#c77dff';ctx.font='18px monospace';ctx.fillText('HIGH SCORE: '+hiscore,W/2,H/2+200);}
}
function drawOver(){
  panel(640,300);
  ctx.textAlign='center';
  ctx.font='bold 56px monospace';ctx.fillStyle='#ff5f8f';ctx.fillText('GAME OVER',W/2,H/2-70);
  ctx.font='24px monospace';ctx.fillStyle='#fff';
  ctx.fillText('SCORE '+score+'   TIME '+time.toFixed(1)+'s',W/2,H/2-10);
  ctx.fillStyle='#c77dff';ctx.font='20px monospace';ctx.fillText('HIGH SCORE: '+hiscore,W/2,H/2+30);
  ctx.fillStyle='#ffd166';ctx.font='bold 24px monospace';
  ctx.fillText('PRESS R TO RESTART',W/2,H/2+95);
}

// ---------- loop ----------
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>1/30)dt=1/30;
  if(state==='play')update(dt);
  else time+=dt; // for menu blink? keep simple
  draw();
  requestAnimationFrame(loop);
}
reset();state='menu';
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
