<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bullet Hell Pinball</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070d;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;box-shadow:0 0 40px rgba(0,220,255,.15);}
  .overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,6,13,.86);text-align:center;font-family:'Courier New',monospace;color:#cfe;}
  .hidden{display:none!important;}
  h1{font-size:min(9vw,52px);letter-spacing:4px;margin:0 0 8px;background:linear-gradient(90deg,#ff2d78,#ffd23e,#00e5ff,#b26bff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 25px rgba(255,45,120,.35);}
  .sub{color:#7fd8ff;margin-bottom:22px;letter-spacing:2px;font-size:14px;}
  .ctrl{font-size:15px;line-height:1.9;color:#9fb6d8;margin-bottom:26px;}
  .key{display:inline-block;border:1px solid #3a5a80;border-radius:4px;padding:1px 8px;background:#0c1626;color:#dff;margin:0 2px;}
  button{font-family:inherit;font-size:18px;letter-spacing:3px;padding:12px 34px;color:#fff;background:transparent;border:2px solid #ff2d78;border-radius:6px;cursor:pointer;text-shadow:0 0 8px #ff2d78;box-shadow:0 0 14px rgba(255,45,120,.4),inset 0 0 14px rgba(255,45,120,.15);}
  button:hover{background:rgba(255,45,120,.15);}
  .big{font-size:30px;color:#ffd23e;letter-spacing:3px;margin:6px 0;text-shadow:0 0 12px rgba(255,210,62,.6);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="menu" class="overlay">
  <h1>BULLET HELL PINBALL</h1>
  <div class="sub">DEFLECT THE STORM &bull; WIPE THE SWARM</div>
  <div class="ctrl">
    <span class="key">&#9664;</span>/<span class="key">A</span> left flipper &nbsp;&nbsp;
    <span class="key">&#9654;</span>/<span class="key">D</span> right flipper<br>
    hold <span class="key">SPACE</span> to charge the plunger, release to launch<br>
    smash enemy bullets with flippers &amp; bumpers &bull; shoot drones down<br>
    <span class="key">R</span> restart
  </div>
  <button id="btnStart">START GAME</button>
</div>

<div id="over" class="overlay hidden">
  <h1 style="font-size:min(8vw,42px)">GAME OVER</h1>
  <div class="big" id="finalScore">SCORE 0</div>
  <div class="sub" id="finalHi">HIGH SCORE 0</div>
  <button id="btnRestart">RESTART</button>
  <div class="ctrl" style="margin-top:18px">or press <span class="key">R</span> / <span class="key">&#9166;</span></div>
</div>

<script>
(function(){
"use strict";
var W=480,H=760;
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var s=Math.min(window.innerWidth/W,window.innerHeight/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
var AC=null;
function audio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f,d,type,vol,slideTo,delay){
  if(!AC)return;var t=AC.currentTime+(delay||0);
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(Math.max(1,f),t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+d);
  g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
}
function boom(){
  if(!AC)return;var t=AC.currentTime,d=0.35;
  var n=AC.createBufferSource(),buf=AC.createBuffer(1,Math.floor(AC.sampleRate*d),AC.sampleRate),ch=buf.getChannelData(0);
  for(var i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  n.buffer=buf;var g=AC.createGain();g.gain.value=0.28;
  var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(90,t+d);
  n.connect(f);f.connect(g);g.connect(AC.destination);n.start(t);
}
function sLaunch(){beep(180,0.3,'sawtooth',0.2,900);}
function sBumper(){beep(300+Math.random()*220,0.08,'square',0.12);}
function sFlip(){beep(110,0.05,'triangle',0.18);}
function sKillB(){beep(900,0.06,'square',0.07);}
function sEnemy(){boom();beep(650,0.4,'sawtooth',0.18,70);}
function sDrain(){beep(320,0.5,'sawtooth',0.22,55);}
function sHit(){beep(160,0.2,'square',0.2,45);}
function sWave(){beep(440,0.12,'square',0.15);beep(660,0.16,'square',0.15,undefined,0.13);}

/* ---------- geometry ---------- */
var segs=[
  {x1:30,y1:150,x2:120,y2:80},{x1:120,y1:80,x2:240,y2:60},
  {x1:240,y1:60,x2:360,y2:80},{x1:360,y1:80,x2:450,y2:150},
  {x1:30,y1:600,x2:30,y2:150},{x1:450,y1:600,x2:450,y2:150},
  {x1:30,y1:600,x2:95,y2:648},{x1:450,y1:600,x2:385,y2:648}
];
var bumpers=[
  {x:140,y:270,r:20,f:0},{x:340,y:270,r:20,f:0},{x:240,y:395,r:22,f:0},
  {x:90,y:485,r:14,f:0},{x:390,y:485,r:14,f:0}
];
var flips=[
  {px:150,py:652,len:66,fr:9,restA:0.5,actA:-0.5,a:0.5,w:0,key:'L',wasOn:false},
  {px:310,py:652,len:66,fr:9,restA:Math.PI-0.5,actA:Math.PI+0.5,a:Math.PI-0.5,w:0,key:'R',wasOn:false}
];
var G=1350;

var stars=[];for(var i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,a:Math.random()*0.5+0.15});

/* ---------- state ---------- */
var hi=0;try{hi=parseInt(localStorage.getItem('bhp_hi'))||0;}catch(e){}
var state='menu',score=0,lives=3,wave=1,t=0;
var ball={x:240,y:716,vx:0,vy:0,r:9,ready:true,dead:false,inv:0};
var bullets=[],enemies=[];
var charge=0,charging=false,respawnT=0,fireT=1.5,banner='',bannerT=0,shake=0,flashT=0;

function spawnWave(n){
  enemies=[];
  var count=n===1?1:(n===2?2:3);
  var pos=[[150,165],[310,165],[240,138]];
  for(var i=0;i<count;i++)enemies.push({bx:pos[i][0],by:pos[i][1],x:pos[i][0],y:pos[i][1],ph:Math.random()*6.28,spiral:0,sa:Math.random()*6.28,st:0,dead:false});
  banner='WAVE '+n;bannerT=2;sWave();fireT=1.2;
}
function begin(){
  audio();score=0;lives=3;wave=1;t=0;bullets=[];charge=0;charging=false;respawnT=0;shake=0;flashT=0;
  ball={x:240,y:716,vx:0,vy:0,r:9,ready:true,dead:false,inv:0};
  spawnWave(1);state='play';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
}
function gameOver(){
  state='over';
  if(score>hi){hi=score;try{localStorage.setItem('bhp_hi',String(hi));}catch(e){}}
  document.getElementById('finalScore').textContent='SCORE '+score;
  document.getElementById('finalHi').textContent='HIGH SCORE '+hi;
  document.getElementById('over').classList.remove('hidden');
}
function resetBall(){ball={x:240,y:716,vx:0,vy:0,r:9,ready:true,dead:false,inv:0};charge=0;}

/* ---------- input ---------- */
var keys={L:false,R:false};
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'||k===' ')e.preventDefault();
  audio();
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.L=true;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.R=true;
  if(k===' '||k==='Spacebar'){
    if(state==='menu')begin();
    else if(state==='over'&&!e.repeat)begin();
    else if(state==='play'&&ball.ready&&!(ball.dead))charging=true;
  }
  if((k==='r'||k==='R')&&state!=='menu')begin();
  if(k==='Enter'&&state!=='play')begin();
});
window.addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.L=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.R=false;
  if((k===' '||k==='Spacebar')&&charging&&state==='play'&&ball.ready&&!ball.dead){
    ball.vy=-(950+560*charge);ball.vx=0;ball.ready=false;charging=false;sLaunch();
  } else charging=false;
});
function touchState(ev){
  keys.L=false;keys.R=false;
  for(var i=0;i<ev.touches.length;i++){
    if(ev.touches[i].clientX<window.innerWidth/2)keys.L=true;else keys.R=true;
  }
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();audio();
  if(state!=='play'){begin();return;}
  touchState(e);
  if(ball.ready&&!ball.dead)charging=true;
},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();touchState(e);},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  if(e.touches.length===0&&charging&&state==='play'&&ball.ready&&!ball.dead){
    ball.vy=-(950+560*charge);ball.vx=0;ball.ready=false;charging=false;sLaunch();
  }
  charging=e.touches.length>0&&ball.ready&&!ball.dead;
  touchState(e);
},{passive:false});
document.getElementById('btnStart').addEventListener('click',begin);
document.getElementById('btnRestart').addEventListener('click',begin);

/* ---------- collision helpers ---------- */
function segCollide(b,e){
  for(var i=0;i<segs.length;i++){
    var s=segs[i],dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy;
    var tt=((b.x-s.x1)*dx+(b.y-s.y1)*dy)/L2;tt=Math.max(0,Math.min(1,tt));
    var cx=s.x1+tt*dx,cy=s.y1+tt*dy;
    var nx=b.x-cx,ny=b.y-cy,d2=nx*nx+ny*ny;
    if(d2<b.r*b.r&&d2>1e-6){
      var d=Math.sqrt(d2);nx/=d;ny/=d;
      b.x=cx+nx*b.r;b.y=cy+ny*b.r;
      var vn=b.vx*nx+b.vy*ny;
      if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;}
      return true;
    }
  }
  return false;
}
function flipCapsule(b){ // returns contact if within radius, else null
  for(var i=0;i<flips.length;i++){
    var f=flips[i];
    var tx=f.px+Math.cos(f.a)*f.len,ty=f.py+Math.sin(f.a)*f.len;
    var dx=tx-f.px,dy=ty-f.py,L2=dx*dx+dy*dy;
    var tt=((b.x-f.px)*dx+(b.y-f.py)*dy)/L2;tt=Math.max(0,Math.min(1,tt));
    var cx=f.px+tt*dx,cy=f.py+tt*dy;
    var nx=b.x-cx,ny=b.y-cy,d2=nx*nx+ny*ny,R=b.r+f.fr;
    if(d2<R*R&&d2>1e-6)return {f:f,cx:cx,cy:cy,nx:nx/Math.sqrt(d2),ny:ny/Math.sqrt(d2)};
  }
  return null;
}

/* ---------- bullets / enemies ---------- */
function spawnB(x,y,ang,sp,hue){
  if(bullets.length>=150)return;
  bullets.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:4,hue:hue,life:8,b:0});
}
function firePattern(){
  var live=[];for(var i=0;i<enemies.length;i++)if(!enemies[i].dead)live.push(enemies[i]);
  if(!live.length)return;
  var e=live[Math.floor(Math.random()*live.length)],r=Math.random();
  if(r<0.35){ // aimed at ball
    var n=2+Math.min(3,wave),base=Math.atan2(ball.y-e.y,ball.x-e.x);
    for(var k=0;k<n;k++)spawnB(e.x,e.y,base+(k-(n-1)/2)*0.18,150+wave*6,25);
  }else if(r<0.7){ // ring
    var n2=8+Math.min(4,wave),off=Math.random()*6.28;
    for(var k2=0;k2<n2;k2++)spawnB(e.x,e.y,k2/n2*6.283+off,105+wave*5,320);
  }else{ // downward fan
    for(var k3=-2;k3<=2;k3++)spawnB(e.x,e.y,Math.PI/2+k3*0.28,140+wave*4,190);
  }
  if(wave>=2&&Math.random()<0.12){e.spiral=2.5;e.st=0;}
}

/* ---------- update ---------- */
function update(dt){
  t+=dt;
  if(bannerT>0)bannerT-=dt;
  if(flashT>0)flashT-=dt;
  shake*=Math.max(0,1-dt*7);if(shake<0.2)shake=0;
  for(var bI=0;bI<bumpers.length;bI++)if(bumpers[bI].f>0)bumpers[bI].f=Math.max(0,bumpers[bI].f-dt*4);

  // flippers
  for(var fI=0;fI<flips.length;fI++){
    var f=flips[i=fI],on=f.key==='L'?keys.L:keys.R;
    if(on&&!f.wasOn)sFlip();
    f.wasOn=on;
    var target=on?f.actA:f.restA,sp=on?26:13,prev=f.a;
    if(f.a<target)f.a=Math.min(target,f.a+sp*dt);else f.a=Math.max(target,f.a-sp*dt);
    f.w=(f.a-prev)/Math.max(dt,0.0001);
  }

  if(state!=='play')return;

  if(charging&&ball.ready&&!ball.dead)charge=Math.min(1,charge+dt/0.9);

  if(ball.dead){respawnT-=dt;if(respawnT<=0)resetBall();}

  // ball physics
  if(!ball.ready&&!ball.dead){
    var steps=4,sdt=dt/steps;
    for(var sI=0;sI<steps;sI++){
      ball.vy+=G*sdt;
      ball.x+=ball.vx*sdt;ball.y+=ball.vy*sdt;
      segCollide(ball,0.85);
      // bumpers
      for(var bp=0;bp<bumpers.length;bp++){
        var u=bumpers[bp],dx=ball.x-u.x,dy=ball.y-u.y,R=ball.r+u.r,d2=dx*dx+dy*dy;
        if(d2<R*R&&d2>1e-6){
          var d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
          ball.x=u.x+nx*R;ball.y=u.y+ny*R;
          var vn=ball.vx*nx+ball.vy*ny;
          if(vn<0){ball.vx-=1.9*vn*nx;ball.vy-=1.9*vn*ny;}
          ball.vx+=nx*140;ball.vy+=ny*140;
          u.f=1;score+=100;sBumper();shake=Math.max(shake,2);
        }
      }
      // flippers
      var fc=flipCapsule(ball);
      if(fc){
        var Rr=ball.r+fc.f.fr;
        ball.x=fc.cx+fc.nx*Rr;ball.y=fc.cy+fc.ny*Rr;
        var rx=fc.cx-fc.f.px,ry=fc.cy-fc.f.py;
        var svx=fc.f.w*(-ry),svy=fc.f.w*rx;
        var rvx=ball.vx-svx,rvy=ball.vy-svy,vn2=rvx*fc.nx+rvy*fc.ny;
        if(vn2<0){ball.vx-=1.6*vn2*fc.nx;ball.vy-=1.6*vn2*fc.ny;}
        ball.vx*=0.995;ball.vy*=0.995;
      }
      // enemies (bounce)
      for(var eI=0;eI<enemies.length;eI++){
        var en=enemies[eI];if(en.dead)continue;
        var dx2=ball.x-en.x,dy2=ball.y-en.y,Re=ball.r+13,d2e=dx2*dx2+dy2*dy2;
        if(d2e<Re*Re&&d2e>1e-6){
          var de=Math.sqrt(d2e),nx2=dx2/de,ny2=dy2/de;
          ball.x=en.x+nx2*Re;ball.y=en.y+ny2*Re;
          var vn3=ball.vx*nx2+ball.vy*ny2;
          if(vn3<0){ball.vx-=1.9*vn3*nx2;ball.vy-=1.9*vn3*ny2;}
          ball.vx+=nx2*70;ball.vy+=ny2*70;score+=25;
        }
      }
    }
    var spd=Math.hypot(ball.vx,ball.vy);
    if(spd>1250){ball.vx*=1250/spd;ball.vy*=1250/spd;}
    if(ball.inv>0)ball.inv-=dt;
    // drain
    if(ball.y>H+20){
      lives--;sDrain();shake=8;flashT=0.4;
      if(lives>0){ball.dead=true;respawnT=1.3;}else{gameOver();}
    }
  }

  // enemies move + spiral fire
  var allDead=enemies.length>0;
  for(var e2=0;e2<enemies.length;e2++){
    var en2=enemies[e2];
    if(en2.dead){allDead=false;continue;}
    en2.y=en2.by+Math.sin(t*2.2+en2.ph)*16;
    en2.x=en2.bx+Math.sin(t*1.3+en2.ph)*10;
    if(en2.spiral>0){
      en2.spiral-=dt;en2.sa+=7*dt;en2.st-=dt;
      if(en2.st<=0){en2.st=0.08;spawnB(en2.x,en2.y,en2.sa,150,140);}
    }
  }
  if(allDead){wave++;spawnWave(wave);}

  // firing
  if(!ball.ready&&!ball.dead){
    fireT-=dt;
    if(fireT<=0){fireT=Math.max(0.45,1.5-wave*0.09);firePattern();}
  }

  // bullets
  for(var i=bullets.length-1;i>=0;i--){
    var u=bullets[i];
    u.x+=u.vx*dt;u.y+=u.vy*dt;u.life-=dt;
    var dead=u.life<=0;
    if(!dead){
      if(segCollide(u,0.9)){u.b++;if(u.b>4)dead=true;}
    }
    if(!dead){
      for(var bb=0;bb<bumpers.length;bb++){
        var bu=bumpers[bb],dx3=u.x-bu.x,dy3=u.y-bu.y,Rb=u.r+bu.r;
        if(dx3*dx3+dy3*dy3<Rb*Rb){dead=true;bu.f=1;score+=50;sKillB();break;}
      }
    }
    if(!dead){
      var fc2=flipCapsule(u);
      if(fc2){dead=true;score+=25;sKillB();}
    }
    if(!dead){
      for(var ee=0;ee<enemies.length;ee++){
        var en3=enemies[ee];if(en3.dead)continue;
        var dx4=u.x-en3.x,dy4=u.y-en3.y;
        if(dx4*dx4+dy4*dy4<(u.r+13)*(u.r+13)){
          dead=true;en3.dead=true;score+=500;sEnemy();shake=10;break;
        }
      }
    }
    if(!dead&&!ball.ready&&!ball.dead&&ball.inv<=0){
      var dx5=u.x-ball.x,dy5=u.y-ball.y;
      if(dx5*dx5+dy5*dy5<(u.r+ball.r)*(u.r+ball.r)){
        dead=true;ball.inv=1.4;
        ball.vx+=u.vx*0.45;ball.vy+=u.vy*0.45;
        score=Math.max(0,score-50);flashT=0.3;sHit();shake=Math.max(shake,4);
      }
    }
    if(dead)bullets.splice(i,1);
  }
}

/* ---------- render ---------- */
function draw(){
  ctx.save();
  // background
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1226');g.addColorStop(0.55,'#080d1c');g.addColorStop(1,'#05070f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#9fd8ff';
  for(var i=0;i<stars.length;i++){var st=stars[i];ctx.globalAlpha=st.a*(0.6+0.4*Math.sin(t*2+i));ctx.fillRect(st.x,st.y,st.r,st.r);}
  ctx.globalAlpha=1;

  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // table walls
  ctx.strokeStyle='#19e6ff';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.shadowColor='#19e6ff';ctx.shadowBlur=12;
  ctx.beginPath();
  for(var sI=0;sI<segs.length;sI++){var s=segs[sI];ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);}
  ctx.stroke();
  ctx.shadowBlur=0;

  // plunger
  ctx.fillStyle='#1c2a45';ctx.fillRect(216,738,48,16);
  ctx.strokeStyle='#3a5a80';ctx.lineWidth=2;ctx.strokeRect(216,738,48,16);
  if(charge>0){
    ctx.fillStyle='hsl('+(120-charge*120)+',90%,55%)';
    ctx.fillRect(272,748-charge*40,10,charge*40);
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(272,708,10,40);
  }

  // bumpers
  for(var bp=0;bp<bumpers.length;bp++){
    var u=bumpers[bp],fl=u.f;
    ctx.shadowColor='#ffd23e';ctx.shadowBlur=10+fl*15;
    ctx.fillStyle='rgb('+Math.round(46+fl*209)+','+Math.round(28+fl*190)+','+Math.round(70+fl*185)+')';
    ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#ffd23e';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,'+(0.5+fl*0.5)+')';
    ctx.beginPath();ctx.arc(u.x,u.y,u.r*0.45,0,6.283);ctx.fill();
  }

  // flippers
  for(var fI=0;fI<flips.length;fI++){
    var f=flips[fI],tx=f.px+Math.cos(f.a)*f.len,ty=f.py+Math.sin(f.a)*f.len;
    ctx.shadowColor='#ff2d78';ctx.shadowBlur=14;
    ctx.strokeStyle='#ff2d78';ctx.lineWidth=f.fr*2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(f.px,f.py);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffd7e8';ctx.beginPath();ctx.arc(f.px,f.py,4,0,6.283);ctx.fill();
  }

  // enemies
  for(var eI=0;eI<enemies.length;eI++){
    var en=enemies[eI];if(en.dead)continue;
    ctx.save();ctx.translate(en.x,en.y);ctx.rotate(t*2+en.ph);
    ctx.shadowColor='#b26bff';ctx.shadowBlur=16;
    var p=13+Math.sin(t*6+en.ph)*1.5;
    ctx.fillStyle='#2a1548';ctx.strokeStyle='#c88fff';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,-p);ctx.lineTo(p,0);ctx.lineTo(0,p);ctx.lineTo(-p,0);ctx.closePath();
    ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=en.spiral>0?'#7dffa8':'#fff';
    ctx.beginPath();ctx.arc(0,0,4,0,6.283);ctx.fill();
    ctx.restore();
  }

  // bullets
  for(var bI=0;bI<bullets.length;bI++){
    var u=bullets[bI];
    ctx.fillStyle='hsla('+u.hue+',100%,65%,0.25)';
    ctx.beginPath();ctx.arc(u.x,u.y,u.r*2.4,0,6.283);ctx.fill();
    ctx.shadowColor='hsl('+u.hue+',100%,65%)';ctx.shadowBlur=8;
    ctx.fillStyle='hsl('+u.hue+',100%,72%)';
    ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,6.283);ctx.fill();
    ctx.shadowBlur=0;
  }

  // ball
  if(!ball.dead){
    ctx.globalAlpha=(ball.inv>0&&Math.sin(t*40)<0)?0.35:1;
    var bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r);
    bg.addColorStop(0,'#ffffff');bg.addColorStop(0.7,'#c9d6e8');bg.addColorStop(1,'#7a8aa5');
    ctx.shadowColor='#bfe9ff';ctx.shadowBlur=12;
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,6.283);ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  // HUD strip
  ctx.restore();
  ctx.fillStyle='#0a0f1e';ctx.fillRect(0,700,W,60);
  ctx.strokeStyle='#1c2f4d';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,700);ctx.lineTo(W,700);ctx.stroke();
  ctx.font='bold 15px "Courier New",monospace';ctx.textBaseline='middle';
  ctx.fillStyle='#e8f4ff';ctx.textAlign='left';
  ctx.fillText('SCORE '+String(score).padStart(6,'0'),12,720);
  ctx.fillStyle='#7fd8ff';
  ctx.fillText('WAVE '+wave,12,746);
  ctx.textAlign='right';
  ctx.fillStyle='#ffd23e';ctx.fillText('HI '+String(Math.max(hi,score)).padStart(6,'0'),W-12,720);
  for(var li=0;li<3;li++){
    ctx.fillStyle=li<lives?'#ff2d78':'#2a3a55';
    ctx.beginPath();ctx.arc(W-64+li*18,746,6,0,6.283);ctx.fill();
  }
  if(state==='play'&&ball.ready&&!ball.dead){
    ctx.textAlign='center';ctx.fillStyle='#9fe8ff';
    ctx.font='bold 12px "Courier New",monospace';
    ctx.fillText('HOLD SPACE / TAP TO LAUNCH',240,756);
  }

  // banner
  if(bannerT>0){
    ctx.globalAlpha=Math.min(1,bannerT);
    ctx.textAlign='center';ctx.font='bold 44px "Courier New",monospace';
    ctx.shadowColor='#00e5ff';ctx.shadowBlur=20;
    ctx.fillStyle='#dffcff';ctx.fillText(banner,240,360);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }

  // hit flash
  if(flashT>0){ctx.fillStyle='rgba(255,40,60,'+(flashT*0.4)+')';ctx.fillRect(0,0,W,H);}
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(1/30,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
