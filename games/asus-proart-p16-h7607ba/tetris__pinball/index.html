<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball Tetris</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#070b14;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#0a1020;border-radius:8px;box-shadow:0 0 60px rgba(60,120,255,.25);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
// ---------- setup ----------
const W=420,H=820;
const cv=document.getElementById('c');
cv.width=W*2; cv.height=H*2;
const ctx=cv.getContext('2d');
function fit(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
window.addEventListener('resize',fit); fit();

// ---------- constants ----------
const COLS=10, ROWS=20, CELL=36;
const FX=30, FY=60;                 // field origin
const FW=COLS*CELL, FH=ROWS*CELL;   // 360 x 720
const BALL_R=9;
const G=1500;

// ---------- shapes ----------
const SHAPES=[
 {m:[[0,1],[1,1],[2,1],[3,1]], s:4, c:'#00e5ff'}, // I
 {m:[[0,0],[1,0],[0,1],[1,1]], s:2, c:'#ffd60a'}, // O
 {m:[[1,0],[0,1],[1,1],[2,1]], s:3, c:'#b967ff'}, // T
 {m:[[1,0],[2,0],[0,1],[1,1]], s:3, c:'#3ddc84'}, // S
 {m:[[0,0],[1,0],[1,1],[2,1]], s:3, c:'#ff5252'}, // Z
 {m:[[0,0],[0,1],[1,1],[2,1]], s:3, c:'#4d7cff'}, // J
 {m:[[2,0],[0,1],[1,1],[2,1]], s:3, c:'#ff9f1a'}  // L
];

// ---------- audio ----------
let AC=null;
function initAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume();
}
function beep(f,d,type,vol,slide){
  if(!AC) return;
  type=type||'square'; vol=(vol==null?0.12:vol); slide=slide||0;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+d);
}
const sBounce=v=>beep(200+Math.min(600,v*0.5),0.06,'square',0.08);
const sFlip=()=>beep(320,0.09,'triangle',0.14,180);
const sBreak=()=>beep(700,0.12,'sawtooth',0.1,-400);
const sLock=()=>beep(160,0.08,'square',0.1);
const sClear=n=>{[523,659,784,1046].slice(0,n+1).forEach((f,i)=>setTimeout(()=>beep(f,0.15,'triangle',0.12),i*60));};
const sDrop=()=>beep(90,0.1,'square',0.15,-40);
const sOver=()=>{[440,330,220,147].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'sawtooth',0.12),i*160));};
const sLaunch=()=>beep(200,0.25,'triangle',0.15,800);

// ---------- state ----------
let state='start'; // start | play | over
let paused=false;
let grid, piece, nextPiece, score, hiScore, lines, level, balls;
let fallT, lockT, flashT, ballTimer;
let lastBallSnd=0, gameMsg='';

try{ hiScore=parseInt(localStorage.getItem('pinballTetrisHi')||'0',10)||0; }catch(e){ hiScore=0; }
function saveHi(){ try{ localStorage.setItem('pinballTetrisHi',String(hiScore)); }catch(e){} }

const flippers=[
 {p:{x:210-56,y:FY+FH-40}, len:60, rest: 0.42, up:-0.55, a:0.42, w:0},   // left
 {p:{x:210+56,y:FY+FH-40}, len:60, rest: Math.PI-0.42, up:Math.PI+0.55, a:Math.PI-0.42, w:0} // right
];
const funnels=[
 {ax:FX, ay:FY+FH, bx:flippers[0].p.x-2, by:flippers[0].p.y+2},
 {ax:FX+FW, ay:FY+FH, bx:flippers[1].p.x+2, by:flippers[1].p.y+2}
];

const ball={x:350,y:700,vx:-60,vy:-650,active:false};
let particles=[], texts=[];
let comboN=0, comboT=0;

// ---------- tetris helpers ----------
function newPiece(def){ return {m:def.m.map(c=>c.slice()), s:def.s, c:def.c, x:Math.floor((COLS-def.s)/2), y:0}; }
function randomDef(){ return SHAPES[Math.floor(Math.random()*SHAPES.length)]; }
function rotCW(m,s){ return m.map(([x,y])=>[s-1-y,x]); }
function cellsOf(p,ox,oy){ ox=ox||0; oy=oy||0; return p.m.map(([x,y])=>[p.x+x+ox,p.y+y+oy]); }
function valid(p,ox,oy){
  for(const [x,y] of cellsOf(p,ox,oy)){
    if(x<0||x>=COLS||y>=ROWS) return false;
    if(y>=0 && grid[y][x]) return false;
  }
  return true;
}
function tryMove(dx,dy){
  if(valid(piece,dx,dy)){ piece.x+=dx; piece.y+=dy; return true; }
  return false;
}
function tryRotate(){
  const nm=rotCW(piece.m,piece.s);
  const kicks=[[0,0],[1,0],[-1,0],[2,0],[-2,0],[0,-1]];
  for(const [kx,ky] of kicks){
    if(valid(piece,kx,ky)){ piece.m=nm; piece.x+=kx; piece.y+=ky; sLock(); return; }
  }
}
function ghostY(){
  let gy=piece.y;
  while(valid(piece,0,gy-piece.y+1)) gy++;
  return gy;
}
function hardDrop(){
  let n=0;
  while(valid(piece,0,1)){ piece.y++; n++; }
  score+=n*2;
  sDrop();
  doLock();
}
function clearLines(){
  let n=0;
  for(let y=ROWS-1;y>=0;y--){
    if(grid[y].every(v=>v)){
      n++;
      for(let x=0;x<COLS;x++){
        spawnBurst(FX+x*CELL+CELL/2, FY+y*CELL+CELL/2, grid[y][x], 6);
        grid[y][x]=0;
      }
    }
  }
  if(n>0){
    for(let y=n;y<ROWS;y++) grid[y]=grid[y-n].slice();
    for(let y=0;y<n;y++) grid[y]=new Array(COLS).fill(0);
    const base=[0,100,300,500,800][n];
    score+=Math.round(base*(1+level*0.2));
    lines+=n; level=Math.floor(lines/8);
    flashT=0.25; sClear(n);
    texts.push({x:FX+FW/2,y:FY+FH/2,txt:n+' LINE'+(n>1?'S':'')+'!',life:1,big:true});
  }
}
function doLock(){
  let topped=false;
  for(const [x,y] of cellsOf(piece)){
    if(y<0){ topped=true; continue; }
    grid[y][x]=piece.c;
    spawnBurst(FX+x*CELL+CELL/2,FY+y*CELL+CELL/2,piece.c,3);
  }
  sLock();
  clearLines();
  if(topped){ gameOver('TOPPED OUT!'); return; }
  piece=nextPiece; nextPiece=newPiece(randomDef());
  fallT=0; lockT=0;
  if(!valid(piece,0,0)){ gameOver('TOPPED OUT!'); }
}

// ---------- ball ----------
function launchBall(){
  ball.x=FX+FW-28; ball.y=FY+FH-120;
  ball.vx=-80; ball.vy=-750;
  ball.active=true; sLaunch();
}
function loseBall(){
  ball.active=false; balls--;
  if(balls<=0){ gameOver('OUT OF BALLS!'); return; }
  ballTimer=1.2;
  beep(120,0.3,'sawtooth',0.12,-80);
}
function destroyCell(gx,gy){
  const col=grid[gy][gx]; grid[gy][gx]=0;
  if(comboT>0) comboN++; else comboN=1;
  comboT=0.6;
  const pts=10*comboN;
  score+=pts;
  const cx=FX+gx*CELL+CELL/2, cy=FY+gy*CELL+CELL/2;
  spawnBurst(cx,cy,col,8);
  texts.push({x:cx,y:cy,txt:'+'+pts+(comboN>1?' x'+comboN:''),life:0.8,big:false});
  const now=performance.now()/1000;
  if(now-lastBallSnd>0.04){ sBreak(); lastBallSnd=now; }
}
function circleSeg(px,py,r,ax,ay,bx,by){
  const abx=bx-ax, aby=by-ay;
  const t=Math.max(0,Math.min(1,((px-ax)*abx+(py-ay)*aby)/(abx*abx+aby*aby)));
  const cx=ax+abx*t, cy=ay+aby*t;
  let dx=px-cx, dy=py-cy;
  const d=Math.hypot(dx,dy);
  if(d<r){
    if(d<1e-6){dx=0;dy=-1;}
    else {dx/=d;dy/=d;}
    return {nx:dx,ny:dy,cx,cy};
  }
  return null;
}
function physSub(h){
  ball.vy+=G*h;
  const sp0=Math.hypot(ball.vx,ball.vy);
  if(sp0>950){ ball.vx*=950/sp0; ball.vy*=950/sp0; }
  ball.x+=ball.vx*h; ball.y+=ball.vy*h;

  // walls
  if(ball.x<FX+BALL_R){ ball.x=FX+BALL_R; if(ball.vx<0){ball.vx*=-0.85; wallSnd(Math.abs(ball.vx));} }
  if(ball.x>FX+FW-BALL_R){ ball.x=FX+FW-BALL_R; if(ball.vx>0){ball.vx*=-0.85; wallSnd(Math.abs(ball.vx));} }
  if(ball.y<FY+BALL_R){ ball.y=FY+BALL_R; if(ball.vy<0){ball.vy*=-0.85; wallSnd(Math.abs(ball.vy));} }

  // funnels
  for(const f of funnels){
    const hit=circleSeg(ball.x,ball.y,BALL_R,f.ax,f.ay,f.bx,f.by);
    if(hit){
      ball.x=hit.cx+hit.nx*BALL_R; ball.y=hit.cy+hit.ny*BALL_R;
      const vn=ball.vx*hit.nx+ball.vy*hit.ny;
      if(vn<0){ ball.vx-=1.8*vn*hit.nx; ball.vy-=1.8*vn*hit.ny; wallSnd(Math.abs(vn)); }
    }
  }
  // flippers (capsules)
  for(const f of flippers){
    const tx=f.p.x+Math.cos(f.a)*f.len, ty=f.p.y+Math.sin(f.a)*f.len;
    const hit=circleSeg(ball.x,ball.y,BALL_R+7,f.p.x,f.p.y,tx,ty);
    if(hit){
      ball.x=hit.cx+hit.nx*(BALL_R+7); ball.y=hit.cy+hit.ny*(BALL_R+7);
      // surface velocity at contact from angular motion
      const rx=hit.cx-f.p.x, ry=hit.cy-f.p.y;
      const vsx=-f.w*ry, vsy=f.w*rx;
      let rvx=ball.vx-vsx, rvy=ball.vy-vsy;
      const vn=rvx*hit.nx+rvy*hit.ny;
      if(vn<0){
        ball.vx += -(1.5)*vn*hit.nx;
        ball.vy += -(1.5)*vn*hit.ny;
        if(Math.abs(vn)>60) sFlip();
      }
    }
  }
  // grid cells (destroy on hit)
  const cx=Math.floor((ball.x-FX)/CELL), cy=Math.floor((ball.y-FY)/CELL);
  for(let gy=cy-1;gy<=cy+1;gy++){
    for(let gx=cx-1;gx<=cx+1;gx++){
      if(gx<0||gx>=COLS||gy<0||gy>=ROWS) continue;
      if(!grid[gy][gx]) continue;
      const rx=FX+gx*CELL, ry=FY+gy*CELL;
      const qx=Math.max(rx,Math.min(ball.x,rx+CELL));
      const qy=Math.max(ry,Math.min(ball.y,ry+CELL));
      let dx=ball.x-qx, dy=ball.y-qy;
      let d=Math.hypot(dx,dy);
      if(d<BALL_R){
        if(d<1e-4){dx=0;dy=-1;d=1;} else {dx/=d;dy/=d;}
        ball.x=qx+dx*BALL_R; ball.y=qy+dy*BALL_R;
        const vn=ball.vx*dx+ball.vy*dy;
        if(vn<0){ ball.vx-=1.5*vn*dx; ball.vy-=1.5*vn*dy; }
        destroyCell(gx,gy);
      }
    }
  }
  // drain
  if(ball.y-BALL_R>FY+FH) loseBall();
}
let lastWallSnd=0;
function wallSnd(v){
  const now=performance.now()/1000;
  if(v>150 && now-lastWallSnd>0.05){ sBounce(v); lastWallSnd=now; }
}

// ---------- particles / texts ----------
function spawnBurst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=60+Math.random()*180;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.5+Math.random()*0.4,col,size:3+Math.random()*4});
  }
}

// ---------- game flow ----------
function begin(){
  grid=new Array(ROWS); for(let y=0;y<ROWS;y++) grid[y]=new Array(COLS).fill(0);
  piece=newPiece(randomDef()); nextPiece=newPiece(randomDef());
  score=0; lines=0; level=0; balls=3;
  fallT=0; lockT=0; flashT=0; ballTimer=0.6;
  particles=[]; texts=[]; comboN=0; comboT=0;
  paused=false; state='play'; gameMsg='';
  flippers[0].a=flippers[0].rest; flippers[1].a=flippers[1].rest;
}
function gameOver(msg){
  state='over'; gameMsg=msg; sOver();
  if(score>hiScore){ hiScore=score; saveHi(); }
}

// ---------- update ----------
function update(dt){
  // flippers
  const lp=keys['a']||keys['z'], rp=keys['l']||keys['m'];
  for(const f of flippers){
    const prev=f.a;
    const target=(f===flippers[0]?lp:rp)?f.up:f.rest;
    const dir=Math.sign(target-f.a);
    f.a+=dir*Math.min(Math.abs(target-f.a),20*dt);
    f.w=(f.a-prev)/Math.max(dt,1e-4);
  }

  // timers
  if(flashT>0) flashT-=dt;
  if(comboT>0){ comboT-=dt; if(comboT<=0) comboN=0; }
  texts.forEach(t=>{t.life-=dt*1.2; t.y-=30*dt;});
  texts=texts.filter(t=>t.life>0);
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;});
  particles=particles.filter(p=>p.life>0);

  // ball respawn
  if(!ball.active){
    ballTimer-=dt;
    if(ballTimer<=0) launchBall();
  } else {
    const sp=Math.hypot(ball.vx,ball.vy);
    const n=Math.max(1,Math.min(8,Math.ceil(sp*dt/5)));
    for(let i=0;i<n;i++) physSub(dt/n);
  }

  // piece falling
  const canD=valid(piece,0,1);
  const interval=Math.max(0.12,0.75-level*0.06);
  fallT+=dt;
  if(canD){
    lockT=0;
    const iv=keys['arrowdown']?Math.min(interval,0.045):interval;
    if(fallT>=iv){ fallT=0; piece.y++; }
  } else {
    lockT+=dt;
    if(lockT>0.42) doLock();
  }
}

// ---------- drawing ----------
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawCell(x,y,col,alpha){
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=col;
  roundRect(x+2,y+2,CELL-4,CELL-4,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.28)';
  roundRect(x+5,y+5,CELL-10,(CELL-10)/2.4,4); ctx.fill();
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(2,0,0,2,0,0);
  // bg
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0c1329'); g.addColorStop(1,'#070b14');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // field frame
  ctx.strokeStyle='#2a3f6e'; ctx.lineWidth=4;
  ctx.strokeRect(FX-2,FY-2,FW+4,FH+4);
  // subtle grid
  ctx.strokeStyle='rgba(120,150,220,.07)'; ctx.lineWidth=1;
  for(let x=1;x<COLS;x++){ ctx.beginPath();ctx.moveTo(FX+x*CELL,FY);ctx.lineTo(FX+x*CELL,FY+FH);ctx.stroke(); }
  for(let y=1;y<ROWS;y++){ ctx.beginPath();ctx.moveTo(FX,FY+y*CELL);ctx.lineTo(FX+FW,FY+y*CELL);ctx.stroke(); }

  if(state==='start'){ drawStart(); return; }

  // locked cells
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++)
    if(grid[y][x]) drawCell(FX+x*CELL,FY+y*CELL,grid[y][x]);

  // ghost + active piece
  if(state==='play' && piece){
    const gy=ghostY();
    ctx.globalAlpha=0.25;
    for(const [x,y] of cellsOf(piece,0,gy-piece.y))
      if(y>=0) drawCell(FX+x*CELL,FY+y*CELL,piece.c);
    ctx.globalAlpha=1;
    for(const [x,y] of cellsOf(piece))
      if(y>=0) drawCell(FX+x*CELL,FY+y*CELL,piece.c);
  }

  // flash on line clear
  if(flashT>0){
    ctx.fillStyle='rgba(255,255,255,'+(flashT*1.4)+')';
    ctx.fillRect(FX,FY,FW,FH);
  }

  // funnels
  ctx.strokeStyle='#3b5aa0'; ctx.lineWidth=6; ctx.lineCap='round';
  for(const f of funnels){ ctx.beginPath();ctx.moveTo(f.ax,f.ay);ctx.lineTo(f.bx,f.by);ctx.stroke(); }

  // flippers
  for(const f of flippers){
    const tx=f.p.x+Math.cos(f.a)*f.len, ty=f.p.y+Math.sin(f.a)*f.len;
    ctx.strokeStyle='#f5c542'; ctx.lineWidth=14; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(f.p.x,f.p.y);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.strokeStyle='#ffe9a0'; ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(f.p.x,f.p.y);ctx.lineTo(tx,ty);ctx.stroke();
  }

  // ball
  if(ball.active){
    const bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,BALL_R);
    bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.6,'#c8d4e8'); bg.addColorStop(1,'#7a8aa5');
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.arc(ball.x,ball.y,BALL_R,0,Math.PI*2);ctx.fill();
  } else if(state==='play'){
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.font='bold 14px monospace'; ctx.textAlign='center';
    ctx.fillText('BALL INCOMING...',FX+FW/2,FY+FH-10);
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*1.6);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;

  // floating texts
  for(const t of texts){
    ctx.globalAlpha=Math.max(0,Math.min(1,t.life*1.5));
    ctx.fillStyle=t.big?'#ffe9a0':'#fff';
    ctx.font=(t.big?'bold 26px':'bold 14px')+' monospace';
    ctx.textAlign='center';
    ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;

  drawHUD();

  if(paused){
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(FX,FY,FW,FH);
    ctx.fillStyle='#fff'; ctx.font='bold 34px monospace'; ctx.textAlign='center';
    ctx.fillText('PAUSED',FX+FW/2,FY+FH/2);
    ctx.font='14px monospace'; ctx.fillText('Press P to resume',FX+FW/2,FY+FH/2+30);
  }
  if(state==='over') drawOver();
}
function drawHUD(){
  ctx.fillStyle='#9db4e8'; ctx.font='bold 12px monospace'; ctx.textAlign='left';
  ctx.fillText('SCORE',FX,26);
  ctx.fillStyle='#fff'; ctx.font='bold 20px monospace';
  ctx.fillText(String(score).padStart(7,'0'),FX,46);
  ctx.textAlign='center';
  ctx.fillStyle='#9db4e8'; ctx.font='bold 12px monospace';
  ctx.fillText('HI',W/2,26);
  ctx.fillStyle='#ffd60a'; ctx.font='bold 20px monospace';
  ctx.fillText(String(hiScore).padStart(7,'0'),W/2,46);
  ctx.textAlign='right';
  ctx.fillStyle='#9db4e8'; ctx.font='bold 12px monospace';
  ctx.fillText('BALLS',FX+FW,26);
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.arc(FX+FW-52+i*18,40,7,0,Math.PI*2);
    ctx.fillStyle=i<balls?'#ff5252':'rgba(255,255,255,.15)'; ctx.fill();
  }
  // next piece
  if(nextPiece){
    ctx.textAlign='left'; ctx.fillStyle='#9db4e8'; ctx.font='bold 10px monospace';
    ctx.fillText('NEXT',FX+FW-72,64);
    const off=FX+FW-58;
    for(const [x,y] of nextPiece.m) drawCell(off+x*14,70+y*14,nextPiece.c);
  }
  if(comboN>1){
    ctx.textAlign='center'; ctx.fillStyle='#3ddc84'; ctx.font='bold 16px monospace';
    ctx.fillText('COMBO x'+comboN,W/2,76);
  }
}
function drawStart(){
  ctx.textAlign='center';
  ctx.fillStyle='#00e5ff'; ctx.font='bold 40px monospace';
  ctx.fillText('PINBALL',W/2,190);
  ctx.fillStyle='#ffd60a'; ctx.fillText('TETRIS',W/2,238);
  // demo ball + piece art
  const bg=ctx.createRadialGradient(W/2-3,300-3,1,W/2,300,12);
  bg.addColorStop(0,'#fff');bg.addColorStop(1,'#7a8aa5');
  ctx.fillStyle=bg; ctx.beginPath();ctx.arc(W/2,300,12,0,Math.PI*2);ctx.fill();
  drawCell(W/2-96,420,'#b967ff'); drawCell(W/2-60,420,'#b967ff');
  drawCell(W/2-60,384,'#b967ff'); drawCell(W/2-60,456,'#b967ff');

  ctx.fillStyle='#cdd9f5'; ctx.font='13px monospace';
  const L=[
    '← / →  move piece      ↑ / X  rotate',
    '↓ soft drop            SPACE hard drop',
    'A or Z  left flipper   L or M  right flipper',
    'P pause                R restart',
    '',
    'Bounce the pinball into blocks to smash them.',
    'Complete lines for bonus. Don\'t drain the ball!'
  ];
  L.forEach((s,i)=>ctx.fillText(s,W/2,380+i*20));
  ctx.fillStyle='#3ddc84'; ctx.font='bold 18px monospace';
  const blink=Math.sin(performance.now()/300)>-0.3;
  if(blink) ctx.fillText('PRESS ENTER OR CLICK TO START',W/2,560);
  ctx.fillStyle='#9db4e8'; ctx.font='12px monospace';
  ctx.fillText('HI SCORE: '+hiScore,W/2,592);
}
function drawOver(){
  ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fillRect(FX,FY,FW,FH);
  ctx.textAlign='center';
  ctx.fillStyle='#ff5252'; ctx.font='bold 34px monospace';
  ctx.fillText('GAME OVER',W/2,FY+280);
  ctx.fillStyle='#fff'; ctx.font='16px monospace';
  ctx.fillText(gameMsg,W/2,FY+320);
  ctx.fillStyle='#ffd60a'; ctx.font='bold 24px monospace';
  ctx.fillText('SCORE  '+score,W/2,FY+380);
  ctx.fillStyle='#9db4e8'; ctx.font='14px monospace';
  ctx.fillText('LINES '+lines+'   LEVEL '+(level+1),W/2,FY+410);
  if(score>=hiScore&&score>0){ ctx.fillStyle='#3ddc84'; ctx.fillText('★ NEW HI SCORE ★',W/2,FY+445); }
  ctx.fillStyle='#fff'; ctx.font='bold 16px monospace';
  const blink=Math.sin(performance.now()/300)>-0.3;
  if(blink) ctx.fillText('PRESS ENTER / R OR CLICK TO RESTART',W/2,FY+500);
}

// ---------- input ----------
const keys={};
window.addEventListener('keydown',function(e){
  initAudio();
  const k=e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].indexOf(k)>=0) e.preventDefault();
  keys[k]=true;

  if(k==='enter'){
    if(state!=='play') begin();
    return;
  }
  if(state==='over' && k==='r'){ begin(); return; }
  if(state!=='play') return;

  if(k==='p'){ paused=!paused; return; }
  if(paused) return;
  if(k==='r'){ begin(); return; }

  if(!e.repeat){
    if(k==='arrowup'||k==='x') tryRotate();
    if(k===' ') hardDrop();
  }
  if(k==='arrowleft') tryMove(-1,0);
  if(k==='arrowright') tryMove(1,0);
});
window.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
cv.addEventListener('pointerdown',function(){ initAudio(); if(state!=='play') begin(); });

// ---------- loop ----------
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  let dt=Math.min(0.033,(t-last)/1000); last=t;
  if(state==='play' && !paused) update(dt);
  draw();
}
requestAnimationFrame(frame);
})();
</script>
</body>
