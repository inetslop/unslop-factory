<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Dash — Physics Endless Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1026; }
  #wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    font-family:'Segoe UI', Arial, sans-serif; color:#fff;
    background:rgba(8,10,30,.72); backdrop-filter:blur(3px); z-index:5;
  }
  .hidden { display:none; }
  h1 {
    font-size:clamp(34px,7vw,64px); letter-spacing:2px; margin-bottom:8px;
    background:linear-gradient(90deg,#ffd54a,#ff7b54,#ff4d8d);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,123,84,.25);
  }
  .sub { font-size:clamp(14px,2.2vw,20px); color:#9fb0ff; margin-bottom:26px; }
  .keys { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:30px; }
  .key {
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25);
    border-radius:10px; padding:10px 16px; font-size:14px; line-height:1.5;
  }
  .key b { display:block; font-size:15px; color:#ffd54a; }
  button {
    font-family:inherit; font-size:clamp(16px,2.4vw,22px); font-weight:700;
    padding:14px 44px; border:none; border-radius:999px; cursor:pointer;
    color:#1b1033; background:linear-gradient(90deg,#ffd54a,#ff7b54);
    box-shadow:0 6px 24px rgba(255,123,84,.45); transition:transform .12s;
  }
  button:hover { transform:scale(1.06); }
  .score-line { font-size:clamp(18px,3vw,28px); margin-bottom:6px; }
  .best-line { font-size:clamp(14px,2vw,18px); color:#9fb0ff; margin-bottom:26px; }
  .newbest { color:#ffd54a; font-weight:700; animation:pulse 1s infinite alternate; }
  @keyframes pulse { from{opacity:.6} to{opacity:1} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="overlay" id="startScreen">
    <h1>BOUNCE DASH</h1>
    <div class="sub">A physics endless runner — jump the gaps, dodge the spikes, grab the coins!</div>
    <div class="keys">
      <div class="key"><b>SPACE / ↑ / W</b>Jump &amp; Double Jump</div>
      <div class="key"><b>↓ / S</b>Fast Fall</div>
      <div class="key"><b>R</b>Restart</div>
    </div>
    <button id="startBtn">▶ START RUN</button>
  </div>

  <div class="overlay hidden" id="overScreen">
    <h1 style="font-size:clamp(28px,5vw,48px)">GAME OVER</h1>
    <div class="score-line" id="finalScore">Score: 0</div>
    <div class="best-line" id="bestLine">Best: 0</div>
    <button id="retryBtn">↻ RUN AGAIN (R)</button>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------- Canvas / scaling ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VIEW_H = 540;               // logical height
let scale = 1, viewW = 960;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(window.innerWidth  * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  scale = (canvas.height / dpr) / VIEW_H;
  viewW = window.innerWidth / scale;
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio (Web Audio, after first input) ----------
let actx = null;
function audio(){
  if(!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  return actx;
}
function beep(freq, dur, type, vol, slide){
  const a = audio(); if(!a) return;
  try{
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol || .12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + .02);
  }catch(e){}
}
const sfx = {
  jump:   () => beep(340, .18, 'square', .10, 720),
  djump:  () => beep(440, .16, 'triangle', .12, 950),
  coin:   () => { beep(880,.09,'sine',.14); setTimeout(()=>beep(1320,.12,'sine',.12), 70); },
  die:    () => beep(260, .5, 'sawtooth', .16, 50),
  land:   () => beep(150, .08, 'triangle', .08)
};

// ---------- Input ----------
const keys = {};
let jumpQueued = false;
window.addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','KeyW','KeyS'].includes(e.code)) e.preventDefault();
  audio(); // unlock on first input
  if(e.repeat) return;
  keys[e.code] = true;

  if(state === 'start' && (e.code==='Space'||e.code==='Enter')) startGame();
  else if(state === 'over' && (e.code==='KeyR'||e.code==='Space'||e.code==='Enter')) startGame();
  else if(state === 'playing'){
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') jumpQueued = true;
    if(e.code==='KeyR') startGame();
  }
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

// Touch: tap = jump
canvas.addEventListener('pointerdown', ()=>{
  audio();
  if(state==='playing') jumpQueued = true;
});

// ---------- Game state ----------
const G = 2500, JUMP_V = -860, DJUMP_V = -790, MAX_FALL = 1450;
let state = 'start';
let player, platforms, coins, spikes, particles, clouds, camX, runTime, speed, score, coinCount, deathTimer, shakeT;
let best = 0;
try { best = parseInt(localStorage.getItem('bounceDashBest')||'0',10) || 0; } catch(e){}

function rand(a,b){ return a + Math.random()*(b-a); }
function irand(a,b){ return Math.floor(rand(a,b+1)); }

function makeClouds(){
  clouds = [];
  for(let i=0;i<14;i++){
    clouds.push({ x:rand(0,2000), y:rand(30,240), s:rand(.5,1.3), v:rand(6,18) });
  }
}

function reset(){
  player = { x:120, y:VIEW_H*.7, w:34, h:38, vy:0, onGround:false, jumps:0, squash:1, tilt:0 };
  platforms = [ {x:-400, w:900, top:VIEW_H*.72} ];
  coins = []; spikes = []; particles = [];
  camX = 0; runTime = 0; speed = 340; score = 0; coinCount = 0; deathTimer = 0; shakeT = 0;
  genX = 500; lastTop = VIEW_H*.72;
  makeClouds();
}

// ---------- Level generation ----------
let genX = 0, lastTop = 0;
function difficulty(){ return Math.min(1, runTime/90); } // ramps over 90s

function genPlatform(){
  const d = difficulty();
  const gap = rand(60, 120 + 90*d);
  const w   = rand(220, 480 - 120*d);
  let top = lastTop + rand(-95, 95);
  top = Math.max(VIEW_H*.38, Math.min(VIEW_H*.82, top));

  const p = { x: genX + gap, w, top };
  platforms.push(p);

  // floating platform above wide gaps
  if(gap > 140 && Math.random() < .5){
    const fw = rand(80,130);
    platforms.push({ x: genX + gap/2 - fw/2, w: fw, top: top - rand(120,170), float:true });
  }

  // spikes (not too early, never right at the edge)
  if(runTime > 8 && Math.random() < .25 + .4*d && w > 190){
    const n = irand(1, 2 + (d*2|0));
    for(let i=0;i<n;i++){
      spikes.push({ x: p.x + rand(60, p.w-70), y: p.top, s: 26 });
    }
  }

  // coins: row above platform or arc over gap
  if(Math.random() < .75){
    if(Math.random() < .5 && w > 150){
      const n = irand(3,6);
      for(let i=0;i<n;i++) coins.push({ x: p.x + 40 + i*(w-80)/Math.max(1,n-1), y: top - 70, t:0 });
    } else if(gap > 90){
      const n = 5;
      for(let i=0;i<n;i++){
        const t = i/(n-1);
        const cx = genX + gap*t;
        const cy = Math.min(lastTop, top) - 90 - Math.sin(t*Math.PI)*70;
        coins.push({ x:cx, y:cy, t:0 });
      }
    }
  }

  lastTop = top;
  genX = p.x + p.w;
}

// ---------- Particles ----------
function puff(x,y,n,color){
  for(let i=0;i<n;i++){
    particles.push({ x, y, vx:rand(-120,120), vy:rand(-160,20), life:rand(.3,.6), max:.6, r:rand(2,5), c:color||'#ffffff' });
  }
}

// ---------- Flow ----------
const startScreen = document.getElementById('startScreen');
const overScreen  = document.getElementById('overScreen');
document.getElementById('startBtn').addEventListener('click', ()=>{ audio(); startGame(); });
document.getElementById('retryBtn').addEventListener('click', ()=>{ audio(); startGame(); });

function startGame(){
  reset();
  state = 'playing';
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
}

function gameOver(){
  if(state!=='playing') return;
  state = 'over'; deathTimer = 0;
  sfx.die(); shakeT = .5;
  puff(player.x+player.w/2, player.y+player.h/2, 26, '#ff7b54');
  const sc = Math.floor(score);
  let isBest = false;
  if(sc > best){ best = sc; isBest = true; try{ localStorage.setItem('bounceDashBest', String(best)); }catch(e){} }
  document.getElementById('finalScore').textContent = 'Score: ' + sc + (coinCount? '  ('+coinCount+' coins)' : '');
  const bl = document.getElementById('bestLine');
  bl.textContent = isBest ? '★ NEW BEST! ★' : 'Best: ' + best;
  bl.className = 'best-line' + (isBest ? ' newbest' : '');
  setTimeout(()=> overScreen.classList.remove('hidden'), 500);
}

// ---------- Update ----------
function update(dt){
  if(state === 'playing'){
    runTime += dt;
    speed = 340 + 260*difficulty() + runTime*1.2;
    score += speed*dt/10;

    const p = player;
    p.x += speed*dt;
    camX = Math.max(camX, p.x - 120);

    // jump
    if(jumpQueued){
      jumpQueued = false;
      if(p.onGround || p.jumps < 1){
        if(!p.onGround && p.jumps===0) p.jumps = 1; else { p.jumps++; }
        p.vy = (p.onGround)? JUMP_V : DJUMP_V;
        p.onGround = false;
        p.squash = .7;
        puff(p.x+p.w/2, p.y+p.h, 8, 'rgba(255,255,255,.8)');
        (p.jumps===1? sfx.jump : sfx.djump)();
      }
    }

    // gravity + fast fall
    let g = G;
    if((keys['ArrowDown']||keys['KeyS']) && !p.onGround) g = G*2.1;
    p.vy = Math.min(MAX_FALL, p.vy + g*dt);
    const prevBottom = p.y + p.h;
    p.y += p.vy*dt;

    // platform collision (land only when falling, feet crossing top)
    p.onGround = false;
    if(p.vy >= 0){
      for(const pl of platforms){
        if(p.x + p.w > pl.x + 4 && p.x < pl.x + pl.w - 4){
          const bottom = p.y + p.h;
          if(prevBottom <= pl.top + 12 && bottom >= pl.top){
            // was above before this frame
            if(p.y + p.h - p.vy*dt <= pl.top + 14 || prevBottom <= pl.top + 14){
              const impact = p.vy;
              p.y = pl.top - p.h; p.vy = 0; p.onGround = true; p.jumps = 0;
              if(impact > 500){ puff(p.x+p.w/2, p.y+p.h, 10, 'rgba(255,255,255,.7)'); sfx.land(); }
            }
          }
        }
      }
    }

    // tilt & squash cosmetics
    p.tilt = p.onGround ? 0 : Math.max(-.35, Math.min(.5, p.vy/1600));
    p.squash += ((p.onGround?1:p.vy<0?1.15:1) - p.squash)*Math.min(1,dt*12);

    // spikes
    for(const s of spikes){
      if(p.x + p.w > s.x - 8 && p.x < s.x + s.s + 4 && p.y + p.h > s.y - 20 && p.y < s.y){
        gameOver(); break;
      }
    }

    // coins
    for(let i=coins.length-1;i>=0;i--){
      const c = coins[i]; c.t += dt*5;
      if(p.x + p.w > c.x - 14 && p.x < c.x + 14 && p.y + p.h > c.y - 16 && p.y < c.y + 16){
        coins.splice(i,1); coinCount++; score += 25; sfx.coin();
        puff(c.x, c.y, 8, '#ffd54a');
      }
    }

    // fell into pit
    if(p.y > VIEW_H + 80) gameOver();

    // generate / cull
    while(genX < camX + viewW*1.6) genPlatform();
    platforms = platforms.filter(pl => pl.x + pl.w > camX - 200);
    spikes    = spikes.filter(s => s.x > camX - 100);
    coins     = coins.filter(c => c.x > camX - 100);
  }

  if(state === 'over') deathTimer += dt;

  // particles & clouds always
  for(let i=particles.length-1;i>=0;i--){
    const pt = particles[i];
    pt.life -= dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vy += 900*dt;
    if(pt.life <= 0) particles.splice(i,1);
  }
  for(const c of clouds){
    c.x -= c.v*dt;
    if(c.x < -200) { c.x = camX + viewW + rand(0,300); c.y = rand(30,240); }
  }
  if(shakeT > 0) shakeT -= dt;
}

// ---------- Render ----------
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function draw(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = window.innerWidth, H = window.innerHeight;

  // sky
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a2258'); grad.addColorStop(.55,'#3b2e7a'); grad.addColorStop(1,'#7a3f7d');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

  // stars
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for(let i=0;i<40;i++){
    const sx = ((i*173.3 + 40) - camX*.05) % (W+40);
    const px = sx < 0 ? sx + W+40 : sx;
    ctx.fillRect(px, (i*97.7)%(H*.6), 2, 2);
  }

  // shake
  let shx=0, shy=0;
  if(shakeT>0){ shx = rand(-1,1)*shakeT*14; shy = rand(-1,1)*shakeT*14; }

  ctx.save();
  ctx.scale(scale,scale);
  ctx.translate(shx - camX + (viewW - W/scale)/2 * 0 , shy);
  // center horizontally if view narrower than world width is fine — keep simple: no offset

  // parallax hills
  ctx.fillStyle = 'rgba(30,25,70,.8)';
  for(let i=-1;i<Math.ceil(viewW/300)+1;i++){
    const hx = camX*.25 + i*300;
    ctx.beginPath();
    ctx.arc(hx, VIEW_H+40, 260, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(45,32,95,.8)';
  for(let i=-1;i<Math.ceil(viewW/220)+1;i++){
    const hx = camX*.45 + i*220;
    ctx.beginPath();
    ctx.arc(hx, VIEW_H+80, 190, Math.PI, 0);
    ctx.fill();
  }

  // clouds
  for(const c of clouds){
    const cx = c.x - camX*.3 + camX; // parallax
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath();
    ctx.ellipse(cx, c.y, 60*c.s, 18*c.s, 0, 0, Math.PI*2);
    ctx.ellipse(cx+30*c.s, c.y-10*c.s, 40*c.s, 15*c.s, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // platforms
  for(const pl of platforms){
    if(pl.x > camX + viewW || pl.x + pl.w < camX) continue;
    const body = ctx.createLinearGradient(0, pl.top, 0, VIEW_H);
    if(pl.float){
      body.addColorStop(0,'#5ee6c8'); body.addColorStop(.12,'#3aa89a'); body.addColorStop(1,'#20415f');
    } else {
      body.addColorStop(0,'#6fe3b7'); body.addColorStop(.12,'#3f8f7d'); body.addColorStop(1,'#1c3550');
    }
    ctx.fillStyle = body;
    roundRect(pl.x, pl.top, pl.w, VIEW_H - pl.top + 60, 8);
    ctx.fill();
    // grass top highlight
    ctx.fillStyle = pl.float ? '#8fffe0' : '#a4ffd8';
    roundRect(pl.x+3, pl.top, pl.w-6, 7, 4);
    ctx.fill();
  }

  // spikes
  for(const s of spikes){
    if(s.x > camX + viewW || s.x < camX) continue;
    const n = Math.ceil(s.s/13);
    ctx.fillStyle = '#ff4d5e';
    for(let i=0;i<n;i++){
      const bx = s.x + i*13;
      ctx.beginPath();
      ctx.moveTo(bx, s.y);
      ctx.lineTo(bx+6.5, s.y-22);
      ctx.lineTo(bx+13, s.y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,77,94,.25)';
    ctx.fillRect(s.x, s.y-30, s.s, 3);
  }

  // coins
  for(const c of coins){
    if(c.x > camX + viewW || c.x < camX) continue;
    const bob = Math.sin(c.t)*4;
    const sq = Math.abs(Math.cos(c.t*.9));
    ctx.save();
    ctx.translate(c.x, c.y+bob);
    ctx.scale(.35+.65*sq, 1);
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff2b0';
    ctx.beginPath(); ctx.arc(-3,-3,4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // particles
  for(const pt of particles){
    ctx.globalAlpha = Math.max(0, pt.life/pt.max);
    ctx.fillStyle = pt.c;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // player
  if(state === 'playing' || (state==='over' && deathTimer < .1)){
    const p = player;
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h);
    ctx.rotate(p.tilt);
    ctx.scale(2-p.squash, p.squash);
    // shadow blob on ground
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(0, 4/p.squash, 18, 5, 0, 0, Math.PI*2); ctx.fill();

    const pg = ctx.createLinearGradient(0,-p.h,0,0);
    pg.addColorStop(0,'#ffd54a'); pg.addColorStop(1,'#ff7b54');
    ctx.fillStyle = pg;
    roundRect(-p.w/2, -p.h, p.w, p.h, 9);
    ctx.fill();
    // face
    const look = p.vy < -100 ? -3 : (p.vy > 300 ? 3 : 0);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(4,-p.h*.62, 6.5, 0, Math.PI*2); ctx.arc(14,-p.h*.62, 6.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1b1033';
    ctx.beginPath(); ctx.arc(6+look,-p.h*.62, 3, 0, Math.PI*2); ctx.arc(16+look,-p.h*.62, 3, 0, Math.PI*2); ctx.fill();
    // mouth
    ctx.strokeStyle = '#1b1033'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    if(p.vy > 400){ ctx.arc(11,-p.h*.3, 4.5, 0, Math.PI*2); }
    else { ctx.moveTo(6,-p.h*.32); ctx.quadraticCurveTo(11,-p.h*.24, 16,-p.h*.32); }
    ctx.stroke();
    // jet flames on double jump
    if(!p.onGround && p.jumps >= 1 && p.vy < -200){
      ctx.fillStyle = 'rgba(94,230,200,.85)';
      for(let i=0;i<3;i++){
        const fx = -8 + i*8;
        ctx.beginPath();
        ctx.moveTo(fx-3, 0); ctx.lineTo(fx+3, 0); ctx.lineTo(fx, 12+rand(0,8));
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  }

  ctx.restore();

  // ---- HUD ----
  if(state === 'playing' || state==='over'){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font = '700 26px "Segoe UI", Arial';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    roundRect(14, 12, 210, 46, 10); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText('SCORE ' + Math.floor(score), 28, 43);
    ctx.textAlign = 'right';
    ctx.font = '600 17px "Segoe UI", Arial';
    ctx.fillStyle = '#ffd54a';
    ctx.fillText('🪙 ' + coinCount, W-24, 32);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('BEST ' + best, W-24, 56);
    // speed bar
    const d = difficulty();
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    roundRect(W/2-80, 16, 160, 10, 5); ctx.fill();
    ctx.fillStyle = '#5ee6c8';
    roundRect(W/2-78, 18, 156*d, 6, 3); ctx.fill();
  }
}

// ---------- Loop ----------
let lastT = performance.now();
function loop(now){
  let dt = (now - lastT)/1000;
  lastT = now;
  if(dt > .05) dt = .05; // clamp
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
