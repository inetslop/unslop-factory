<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stealth Pong</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#04060a; }
  canvas { display:block; width:100vw; height:100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";

// ---------- Constants ----------
const W = 960, H = 540;
const PADDLE_W = 12, PADDLE_H = 88;
const PLAYER_X = 42, AI_X = W - 42 - PADDLE_W;
const BALL_R = 7;
const PLAYER_SPEED = 470;
const AI_SPEED = 355;
const PLAYER_VISION = 215;   // radius around player paddle where ball is seen
const AI_VISION = 245;       // radius around AI paddle where AI (and we) see it
const PING_COST = 34, PING_REGEN = 13, PING_MAX_R = 640, PING_TIME = 0.9;
const WIN_SCORE = 5;

// ---------- Canvas / scaling ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1, ox = 0, oy = 0;
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = Math.min(canvas.width / W, canvas.height / H);
  ox = (canvas.width - W * scale) / 2;
  oy = (canvas.height - H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio (Web Audio, starts after first input) ----------
let actx = null;
function audio(){
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, gain, slideTo){
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    const t = actx.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(gain || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e){}
}
const sfx = {
  paddle: () => { tone(300, 0.09, 'square', 0.14, 520); },
  wall:   () => { tone(170, 0.08, 'triangle', 0.13, 120); },
  ping:   () => { tone(880, 0.35, 'sine', 0.10, 240); },
  point:  () => { tone(520, 0.12, 'square', 0.12); setTimeout(()=>tone(780, 0.16, 'square', 0.12), 120); },
  lost:   () => { tone(300, 0.15, 'sawtooth', 0.10, 140); setTimeout(()=>tone(180, 0.28, 'sawtooth', 0.10, 80), 140); },
  win:    () => { [440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'square',0.12), i*130)); }
};

// ---------- Game state ----------
let state = 'START'; // START | PLAY | SCORE | OVER
let player, ai, ball, pings, trail;
let scoreP, scoreA, serveTimer, overMsg, energy, flashT, flashText, time = 0;

function resetBall(direction){
  ball = {
    x: W/2, y: H/2 + (Math.random()-0.5)*160,
    vx: 0, vy: 0, speed: 300, reveal: 1.4, evadeJitter: 0
  };
  const a = (Math.random()*0.7 - 0.35);
  ball.vx = Math.cos(a) * ball.speed * direction;
  ball.vy = Math.sin(a) * ball.speed;
}
function newGame(){
  player = { y: H/2, vy: 0 };
  ai     = { y: H/2, vy: 0, noise: 0, noiseT: 0 };
  pings = []; trail = [];
  scoreP = 0; scoreA = 0; energy = PING_MAX_R; // reuse as number 100? keep separate
  energy = 100; flashT = 0; flashText = '';
  resetBall(Math.random() < 0.5 ? 1 : -1);
}
newGame();

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', (e) => {
  audio();
  if (['ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;

  if (state === 'START' && (e.code === 'Enter' || e.code === 'Space')){
    newGame(); state = 'PLAY'; tone(600,0.1,'sine',0.1,900);
  } else if (state === 'OVER' && (e.code === 'Enter' || e.code === 'KeyR')){
    newGame(); state = 'PLAY'; tone(600,0.1,'sine',0.1,900);
  } else if (state === 'PLAY'){
    if (e.code === 'KeyR'){ newGame(); }
    if (e.code === 'Space' && energy >= PING_COST){
      energy -= PING_COST;
      pings.push({ x: PLAYER_X + PADDLE_W/2, y: player.y, r: 0 });
      sfx.ping();
    }
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
canvas.addEventListener('pointerdown', audio);

// ---------- Helpers ----------
function dist(ax, ay, bx, by){ const dx=ax-bx, dy=ay-by; return Math.sqrt(dx*dx+dy*dy); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function playerPaddleCenter(){ return { x: PLAYER_X + PADDLE_W/2, y: player.y }; }
function aiPaddleCenter(){ return { x: AI_X + PADDLE_W/2, y: ai.y }; }

// Ball visibility 0..1 (how visible it is on screen)
function ballVisibility(){
  let v = 0;
  const pc = playerPaddleCenter(), ac = aiPaddleCenter();
  v = Math.max(v, clamp(1 - dist(ball.x, ball.y, pc.x, pc.y) / PLAYER_VISION, 0, 1));
  v = Math.max(v, clamp(1 - dist(ball.x, ball.y, ac.x, ac.y) / AI_VISION, 0, 1));
  for (const p of pings){
    const band = Math.abs(dist(ball.x, ball.y, p.x, p.y) - p.r);
    v = Math.max(v, clamp(1 - band / 42, 0, 1) * clamp(1 - p.r / PING_MAX_R, 0, 1));
  }
  if (ball.reveal > 0) v = Math.max(v, clamp(ball.reveal / 1.2, 0, 1));
  return clamp(v, 0, 1);
}

// ---------- Update ----------
function update(dt){
  time += dt;
  flashT = Math.max(0, flashT - dt);

  if (state !== 'PLAY' && state !== 'SCORE') return;

  // Pings always animate
  for (let i = pings.length-1; i >= 0; i--){
    pings[i].r += (PING_MAX_R / PING_TIME) * dt;
    if (pings[i].r >= PING_MAX_R) pings.splice(i, 1);
  }
  // Trail fade
  for (let i = trail.length-1; i >= 0; i--){
    trail[i].life -= dt;
    if (trail[i].life <= 0) trail.splice(i, 1);
  }

  // Player movement
  let dir = 0;
  if (keys['ArrowUp'] || keys['KeyW']) dir -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) dir += 1;
  player.vy = dir * PLAYER_SPEED;
  player.y = clamp(player.y + player.vy * dt, PADDLE_H/2 + 8, H - PADDLE_H/2 - 8);

  // Energy regen
  if (state === 'PLAY') energy = Math.min(100, energy + PING_REGEN * dt);

  // AI behavior
  ai.noiseT -= dt;
  if (ai.noiseT <= 0){ ai.noise = (Math.random()-0.5) * 130; ai.noiseT = 0.45; }
  const ac = aiPaddleCenter();
  const ballKnownByAI = dist(ball.x, ball.y, ac.x, ac.y) < AI_VISION || ball.reveal > 0.2;
  let targetY;
  if (state === 'PLAY' && ballKnownByAI && ball.vx > 0){
    const ttr = Math.max(0, (ac.x - ball.x) / Math.max(60, ball.vx));
    targetY = ball.y + ball.vy * ttr * 0.85;
  } else if (state === 'PLAY' && ballKnownByAI){
    targetY = H/2;
  } else {
    targetY = H/2;
  }
  targetY += ai.noise * 0.4;
  const dyA = clamp(targetY - ai.y, -1, 1);
  ai.vy = dyA * AI_SPEED;
  ai.y = clamp(ai.y + ai.vy * dt, PADDLE_H/2 + 8, H - PADDLE_H/2 - 8);

  if (state === 'SCORE'){
    serveTimer -= dt;
    if (serveTimer <= 0){ state = 'PLAY'; }
    return;
  }

  // --- Ball physics (substepped) ---
  ball.reveal = Math.max(0, ball.reveal - dt);
  const visP = clamp(1 - dist(ball.x, ball.y, pcX(), pcY()) / PLAYER_VISION, 0, 1);
  function pcX(){ return PLAYER_X + PADDLE_W/2; }
  function pcY(){ return player.y; }

  // Stealth evasion: while unseen by the player, the ball moves erratically & slightly faster
  if (visP < 0.15){
    const a = Math.atan2(ball.vy, ball.vx);
    const na = a + (Math.random() - 0.5) * 0.16;
    let sp = Math.min(ball.speed * 1.14, 640);
    ball.vx = Math.cos(na) * sp;
    ball.vy = Math.sin(na) * sp;
  }

  const steps = Math.ceil((Math.hypot(ball.vx, ball.vy) * dt) / 5);
  for (let s = 0; s < steps; s++){
    ball.x += ball.vx * dt / steps;
    ball.y += ball.vy * dt / steps;

    // Walls
    if (ball.y - BALL_R < 4){ ball.y = 4 + BALL_R; ball.vy = Math.abs(ball.vy); sfx.wall(); }
    if (ball.y + BALL_R > H-4){ ball.y = H-4-BALL_R; ball.vy = -Math.abs(ball.vy); sfx.wall(); }

    // Player paddle
    if (ball.vx < 0 &&
        ball.x - BALL_R <= PLAYER_X + PADDLE_W && ball.x + BALL_R >= PLAYER_X &&
        ball.y >= player.y - PADDLE_H/2 - BALL_R && ball.y <= player.y + PADDLE_H/2 + BALL_R){
      const off = clamp((ball.y - player.y) / (PADDLE_H/2), -1, 1);
      const a = off * 0.95;
      ball.speed = Math.min(ball.speed + 22, 560);
      ball.vx = Math.abs(Math.cos(a) * ball.speed);
      ball.vy = Math.sin(a) * ball.speed + player.vy * 0.22;
      ball.x = PLAYER_X + PADDLE_W + BALL_R;
      ball.reveal = 1.3;
      pings.push({ x: ball.x, y: ball.y, r: 0 }); // small reveal ripple
      sfx.paddle();
    }

    // AI paddle
    if (ball.vx > 0 &&
        ball.x + BALL_R >= AI_X && ball.x - BALL_R <= AI_X + PADDLE_W &&
        ball.y >= ai.y - PADDLE_H/2 - BALL_R && ball.y <= ai.y + PADDLE_H/2 + BALL_R){
      const off = clamp((ball.y - ai.y) / (PADDLE_H/2), -1, 1);
      const a = Math.PI - off * 0.95;
      ball.speed = Math.min(ball.speed + 22, 560);
      ball.vx = Math.cos(a) * ball.speed; // negative
      ball.vy = Math.sin(a) * ball.speed * -1 + ai.vy * 0.22;
      ball.x = AI_X - BALL_R;
      ball.reveal = 1.3;
      pings.push({ x: ball.x, y: ball.y, r: 0 });
      sfx.paddle();
    }

    // Goals
    if (ball.x < -BALL_R * 2){ scoreA++; onScore(false); return; }
    if (ball.x > W + BALL_R * 2){ scoreP++; onScore(true); return; }
  }

  // Trail
  const vis = ballVisibility();
  trail.push({ x: ball.x, y: ball.y, a: vis * 0.55, life: 0.45 });
}

function onScore(playerScored){
  if (scoreP >= WIN_SCORE || scoreA >= WIN_SCORE){
    state = 'OVER';
    overMsg = scoreP > scoreA ? 'YOU OUTPLAYED THE SHADOW' : 'THE SHADOW TOOK YOU';
    if (scoreP > scoreA) sfx.win(); else sfx.lost();
    return;
  }
  state = 'SCORE';
  serveTimer = 1.3;
  flashT = 1.2;
  flashText = playerScored ? 'POINT — YOU' : 'POINT — SHADOW AI';
  if (playerScored) sfx.point(); else sfx.lost();
  resetBall(playerScored ? -1 : 1); // serve toward the one who lost? classic: loser serves — send toward scorer's side? Send away from scorer.
  ball.vx = playerScored ? -ball.speed * Math.random() * 0 : ball.vx;
}

// ---------- Drawing ----------
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#04060a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);

  // Playfield
  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.clip();

  // Grid
  ctx.strokeStyle = 'rgba(40,90,120,0.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Center line + circle
  ctx.strokeStyle = 'rgba(90,200,255,0.25)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10,12]);
  ctx.beginPath(); ctx.moveTo(W/2, 8); ctx.lineTo(W/2, H-8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI*2); ctx.stroke();

  // Goal glow zones
  let g = ctx.createLinearGradient(0,0,50,0);
  g.addColorStop(0,'rgba(80,255,180,0.14)'); g.addColorStop(1,'rgba(80,255,180,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,50,H);
  g = ctx.createLinearGradient(W,0,W-50,0);
  g.addColorStop(0,'rgba(255,70,140,0.16)'); g.addColorStop(1,'rgba(255,70,140,0)');
  ctx.fillStyle = g; ctx.fillRect(W-50,0,50,H);

  // Vision radii (subtle)
  const pc = playerPaddleCenter(), ac = aiPaddleCenter();
  ctx.strokeStyle = 'rgba(80,255,180,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(pc.x, pc.y, PLAYER_VISION, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,70,140,0.10)';
  ctx.beginPath(); ctx.arc(ac.x, ac.y, AI_VISION, 0, Math.PI*2); ctx.stroke();

  // Pings (sonar rings)
  for (const p of pings){
    const alpha = clamp(1 - p.r / PING_MAX_R, 0, 1) * 0.8;
    ctx.strokeStyle = 'rgba(120,255,230,' + alpha.toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(120,255,230,' + (alpha*0.4).toFixed(3) + ')';
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0,p.r-6), 0, Math.PI*2); ctx.stroke();
  }

  // Trail
  for (const t of trail){
    const a = t.a * clamp(t.life / 0.45, 0, 1);
    if (a < 0.01) continue;
    ctx.fillStyle = 'rgba(255,230,120,' + a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * 0.8 * (t.life/0.45), 0, Math.PI*2); ctx.fill();
  }

  // Ball
  const vis = ballVisibility();
  if (vis > 0.02 && state !== 'START'){
    const glow = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_R*3.4);
    glow.addColorStop(0, 'rgba(255,244,180,' + (0.95*vis).toFixed(3) + ')');
    glow.addColorStop(0.35, 'rgba(255,210,90,' + (0.7*vis).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(255,180,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R*3.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,252,235,' + vis.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2); ctx.fill();
  } else if (state === 'PLAY' || state === 'SCORE'){
    // faint shimmer hint: a tiny flicker dot so the field isn't fully silent
    const sh = (Math.sin(time*13) > 0.96) ? 0.12 : 0;
    if (sh > 0){
      ctx.fillStyle = 'rgba(255,240,190,' + sh + ')';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 3, 0, Math.PI*2); ctx.fill();
    }
  }

  // Paddles
  function drawPaddle(x, y, color, glow){
    ctx.shadowColor = glow; ctx.shadowBlur = 18;
    ctx.fillStyle = color;
    roundRect(x, y - PADDLE_H/2, PADDLE_W, PADDLE_H, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  drawPaddle(PLAYER_X, player.y, '#3dffc4', 'rgba(61,255,196,0.8)');
  drawPaddle(AI_X, ai.y, '#ff4d88', 'rgba(255,77,136,0.8)');

  // HUD
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px monospace';
  ctx.fillStyle = 'rgba(61,255,196,0.9)';
  ctx.fillText(scoreP, W/2 - 70, 58);
  ctx.fillStyle = 'rgba(255,77,136,0.9)';
  ctx.fillText(scoreA, W/2 + 70, 58);
  ctx.fillStyle = 'rgba(140,170,200,0.5)';
  ctx.font = '12px monospace';
  ctx.fillText('YOU', W/2 - 70, 76);
  ctx.fillText('SHADOW AI', W/2 + 70, 76);

  // Sonar energy bar
  const bw = 180;
  ctx.fillStyle = 'rgba(140,170,200,0.5)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SONAR [SPACE]', 24, H - 34);
  ctx.strokeStyle = 'rgba(120,255,230,0.5)';
  ctx.strokeRect(24, H - 26, bw, 10);
  const ef = energy / 100;
  ctx.fillStyle = ef >= PING_COST/100 ? 'rgba(120,255,230,0.85)' : 'rgba(120,255,230,0.4)';
  ctx.fillRect(26, H - 24, (bw-4)*ef, 6);

  // Controls hint
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(140,170,200,0.45)';
  ctx.font = '12px monospace';
  ctx.fillText('W/S or ↑/↓ MOVE   ·   SPACE SONAR PING   ·   R RESTART', W/2, H - 14);

  // Flash message
  if (flashT > 0 && state === 'SCORE'){
    ctx.globalAlpha = clamp(flashT / 0.4, 0, 1);
    ctx.fillStyle = flashText.indexOf('YOU') !== -1 ? '#3dffc4' : '#ff4d88';
    ctx.font = 'bold 34px monospace';
    ctx.fillText(flashText, W/2, H/2 - 90);
    ctx.globalAlpha = 1;
  }

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);

  ctx.restore();

  // Overlays
  if (state === 'START') drawStart();
  if (state === 'OVER') drawOver();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function panel(){
  ctx.fillStyle = 'rgba(4,10,16,0.82)';
  roundRect(W/2 - 340, H/2 - 170, 680, 340, 14);
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,255,230,0.4)';
  ctx.lineWidth = 2;
  roundRect(W/2 - 340, H/2 - 170, 680, 340, 14);
  ctx.stroke();
}

function drawStart(){
  panel();
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(120,255,230,0.9)'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#7dfff0';
  ctx.font = 'bold 52px monospace';
  ctx.fillText('STEALTH PONG', W/2, H/2 - 105);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(200,225,245,0.85)';
  ctx.font = '16px monospace';
  const lines = [
    'The ball is a SHADOW. It is invisible unless:',
    '',
    '  • it drifts close to your paddle (green ring)',
    '  • you fire a SONAR PING at it',
    '  • it smacks a paddle and flashes briefly',
    '',
    'When unseen, the shadow moves erratically — faster.',
    'First to ' + WIN_SCORE + ' points wins.'
  ];
  lines.forEach((l,i)=>ctx.fillText(l, W/2, H/2 - 55 + i*24));

  ctx.fillStyle = 'rgba(120,255,230,' + (0.55 + 0.45*Math.sin(time*4)).toFixed(2) + ')';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('PRESS ENTER TO DEPLOY', W/2, H/2 + 138);

  ctx.fillStyle = 'rgba(140,170,200,0.6)';
  ctx.font = '13px monospace';
  ctx.fillText('W/S or ↑/↓ move · SPACE sonar ping · R restart', W/2, H/2 + 158);
}

function drawOver(){
  panel();
  ctx.textAlign = 'center';
  const won = scoreP > scoreA;
  ctx.shadowColor = won ? 'rgba(61,255,196,0.9)' : 'rgba(255,77,136,0.9)';
  ctx.shadowBlur = 24;
  ctx.fillStyle = won ? '#3dffc4' : '#ff4d88';
  ctx.font = 'bold 40px monospace';
  ctx.fillText(won ? 'VICTORY' : 'DEFEATED', W/2, H/2 - 95);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(200,225,245,0.85)';
  ctx.font = '18px monospace';
  ctx.fillText(overMsg, W/2, H/2 - 45);
  ctx.font = 'bold 30px monospace';
  ctx.fillStyle = '#7dfff0';
  ctx.fillText(scoreP + '  :  ' + scoreA, W/2, H/2 + 5);

  ctx.fillStyle = 'rgba(120,255,230,' + (0.55 + 0.45*Math.sin(time*4)).toFixed(2) + ')';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('PRESS ENTER OR R TO PLAY AGAIN', W/2, H/2 + 80);
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
