<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scroll Pinball</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type='sine', vol=0.3) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
const PLAYFIELD_W = 3200;
const GRAVITY = 0.4;
let state = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('scrollPinballHigh') || '0'); } catch(e) {}

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 12 };
let ballActive = false;
let launchPower = 0;
let launching = false;

// Camera
let camX = 0;

// Flippers
const FLIPPER_LEN = 80;
const FLIPPER_SPEED = 0.25;
let leftFlipper = { x: PLAYFIELD_W/2 - 60, y: 0, angle: 0.5, targetAngle: 0.5, active: false };
let rightFlipper = { x: PLAYFIELD_W/2 + 60, y: 0, angle: -0.5, targetAngle: -0.5, active: false };

// Bumpers
let bumpers = [];
function initBumpers() {
    bumpers = [
        { x: 400, y: 300, r: 25, points: 100, color: '#ff4466' },
        { x: 700, y: 200, r: 30, points: 150, color: '#44aaff' },
        { x: 1000, y: 350, r: 25, points: 100, color: '#ffaa22' },
        { x: 1200, y: 180, r: 35, points: 200, color: '#44ff88' },
        { x: PLAYFIELD_W/2 - 200, y: 250, r: 28, points: 150, color: '#cc44ff' },
        { x: PLAYFIELD_W/2 + 200, y: 250, r: 28, points: 150, color: '#44ffcc' },
        { x: PLAYFIELD_W/2, y: 150, r: 32, points: 250, color: '#ffff44' },
        { x: PLAYFIELD_W - 1000, y: 300, r: 25, points: 100, color: '#ff6644' },
        { x: PLAYFIELD_W - 700, y: 180, r: 30, points: 150, color: '#66aaff' },
        { x: PLAYFIELD_W - 400, y: 350, r: 28, points: 200, color: '#ff44aa' },
        { x: 600, y: 500, r: 22, points: 75, color: '#88ff44' },
        { x: PLAYFIELD_W - 600, y: 500, r: 22, points: 75, color: '#44aaff' },
    ];
}

// Walls (line segments)
let walls = [];
function initWalls() {
    const h = H;
    walls = [
        // Top
        { x1: 0, y1: 30, x2: PLAYFIELD_W, y2: 30 },
        // Left side
        { x1: 30, y1: 30, x2: 30, y2: h - 80 },
        // Right side
        { x1: PLAYFIELD_W - 30, y1: 30, x2: PLAYFIELD_W - 30, y2: h - 80 },

        // Left funnel
        { x1: 30, y1: h - 80, x2: PLAYFIELD_W/2 - 120, y2: h - 40 },
        // Right funnel
        { x1: PLAYFIELD_W - 30, y1: h - 80, x2: PLAYFIELD_W/2 + 120, y2: h - 40 },

        // Left wall guides
        { x1: 200, y1: 400, x2: 400, y2: 550 },
        { x1: 500, y1: 380, x2: 700, y2: 520 },

        // Right wall guides
        { x1: PLAYFIELD_W - 200, y1: 400, x2: PLAYFIELD_W - 400, y2: 550 },
        { x1: PLAYFIELD_W - 500, y1: 380, x2: PLAYFIELD_W - 700, y2: 520 },

        // Center obstacles
        { x1: PLAYFIELD_W/2 - 100, y1: 400, x2: PLAYFIELD_W/2 - 50, y2: 500 },
        { x1: PLAYFIELD_W/2 + 100, y1: 400, x2: PLAYFIELD_W/2 + 50, y2: 500 },

        // Diagonal deflectors
        { x1: 800, y1: 300, x2: 900, y2: 400 },
        { x1: PLAYFIELD_W - 800, y1: 300, x2: PLAYFIELD_W - 900, y2: 400 },

        // Slingshot areas
        { x1: PLAYFIELD_W/2 - 150, y1: h - 120, x2: PLAYFIELD_W/2 - 80, y2: h - 60 },
        { x1: PLAYFIELD_W/2 + 150, y1: h - 120, x2: PLAYFIELD_W/2 + 80, y2: h - 60 },
    ];
}

// Slingshots (triangular areas that kick ball)
let slingshots = [];
function initSlingshots() {
    const h = H;
    slingshots = [
        { x: PLAYFIELD_W/2 - 130, y: h - 90, r: 40, points: 50, color: '#ff8844', cooldown: 0 },
        { x: PLAYFIELD_W/2 + 130, y: h - 90, r: 40, points: 50, color: '#44ccff', cooldown: 0 },
    ];
}

// Particles
let particles = [];
function spawnParticles(x, y, color, count=8) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 30, color });
    }
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    }
    if ((state === 'gameover' || state === 'playing') && e.code === 'KeyR') {
        startGame();
    }
    if (state === 'playing' && e.code === 'Space' && !ballActive) {
        launching = true;
        launchPower = 0;
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    score = 0;
    lives = 3;
    ballActive = false;
    launching = false;
    launchPower = 0;
    initBumpers();
    initWalls();
    initSlingshots();
    particles = [];
    resetBall();
    state = 'playing';
}

function resetBall() {
    ball.x = PLAYFIELD_W/2;
    ball.y = H - 60;
    ball.vx = 0;
    ball.vy = 0;
    camX = ball.x - W/2;
}

// Physics
function lineCircleCollision(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) return null;
    const nx = -dy/len;
    const ny = dx/len;
    const dist = (cx - x1)*nx + (cy - y1)*ny;

    if (Math.abs(dist) > r) return null;

    const t = (cx - x1)*dx/len + (cy - y1)*dy/len;
    if (t < 0 || t > len) return null;

    const closestX = x1 + t*dx/len;
    const closestY = y1 + t*dy/len;
    const ddx = cx - closestX;
    const ddy = cy - closestY;
    const d = Math.sqrt(ddx*ddx + ddy*ddy);

    if (d < r) {
        return { nx: ddx/d, ny: ddy/d, depth: r - d };
    }
    return null;
}

function circleCircleCollision(x1, y1, r1, x2, y2, r2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < r1 + r2 && dist > 0) {
        return { nx: dx/dist, ny: dy/dist, depth: r1 + r2 - dist };
    }
    return null;
}

function flipperTip(f) {
    return {
        x: f.x + Math.cos(f.angle) * FLIPPER_LEN,
        y: f.y + Math.sin(f.angle) * FLIPPER_LEN
    };
}

function update() {
    if (state !== 'playing') return;

    const h = H;
    leftFlipper.y = h - 50;
    rightFlipper.y = h - 50;

    // Flippers
    leftFlipper.targetAngle = keys['KeyZ'] || keys['ArrowLeft'] ? -0.4 : 0.5;
    rightFlipper.targetAngle = keys['KeyX'] || keys['ArrowRight'] ? 0.4 : -0.5;

    const lFAngDiff = leftFlipper.targetAngle - leftFlipper.angle;
    leftFlipper.angle += Math.sign(lFAngDiff) * Math.min(Math.abs(lFAngDiff), FLIPPER_SPEED);

    const rFAngDiff = rightFlipper.targetAngle - rightFlipper.angle;
    rightFlipper.angle += Math.sign(rFAngDiff) * Math.min(Math.abs(rFAngDiff), FLIPPER_SPEED);

    // Launch
    if (launching && !ballActive) {
        launchPower += 0.5;
        if (keys['Space']) {
            ball.vy = -launchPower * 1.2;
            ball.vx = (Math.random() - 0.5) * 2;
            ballActive = true;
            launching = false;
            playSound(200, 0.2, 'sawtooth', 0.2);
        }
    }

    if (!ballActive) {
        // Ball sitting at flipper area
        ball.x = PLAYFIELD_W/2 + Math.sin(Date.now()*0.001)*5;
        ball.y = h - 60;
        camX = ball.x - W/2;
        return;
    }

    // Gravity
    ball.vy += GRAVITY;

    // Damping
    ball.vx *= 0.999;
    ball.vy *= 0.999;

    // Move
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall collisions
    for (let wall of walls) {
        const col = lineCircleCollision(wall.x1, wall.y1, wall.x2, wall.y2, ball.x, ball.y, ball.r);
        if (col) {
            ball.x += col.nx * col.depth;
            ball.y += col.ny * col.depth;
            const dot = ball.vx * col.nx + ball.vy * col.ny;
            if (dot < 0) {
                ball.vx -= 2 * dot * col.nx;
                ball.vy -= 2 * dot * col.ny;
                ball.vx *= 0.8;
                ball.vy *= 0.8;
                if (Math.abs(dot) > 3) playSound(150, 0.05, 'square', 0.1);
            }
        }
    }

    // Bumper collisions
    for (let b of bumpers) {
        const col = circleCircleCollision(ball.x, ball.y, ball.r, b.x, b.y, b.r);
        if (col) {
            ball.x += col.nx * col.depth;
            ball.y += col.ny * col.depth;
            const dot = ball.vx * col.nx + ball.vy * col.ny;
            ball.vx -= 2 * dot * col.nx;
            ball.vy -= 2 * dot * col.ny;
            // Bumpers add energy
            ball.vx += col.nx * 8;
            ball.vy += col.ny * 8;
            score += b.points;
            spawnParticles(ball.x, ball.y, b.color, 6);
            playSound(400 + Math.random()*200, 0.1, 'square', 0.25);
        }
    }

    // Slingshot collisions
    for (let s of slingshots) {
        if (s.cooldown > 0) { s.cooldown--; continue; }
        const col = circleCircleCollision(ball.x, ball.y, ball.r, s.x, s.y, s.r);
        if (col) {
            ball.x += col.nx * col.depth;
            ball.y += col.ny * col.depth;
            ball.vx = col.nx * 15;
            ball.vy = col.ny * 15 - 5;
            score += s.points;
            s.cooldown = 10;
            spawnParticles(ball.x, ball.y, s.color, 8);
            playSound(300, 0.15, 'sawtooth', 0.2);
        }
    }

    // Flipper collisions
    const lTip = flipperTip(leftFlipper);
    let col = lineCircleCollision(leftFlipper.x, leftFlipper.y, lTip.x, lTip.y, ball.x, ball.y, ball.r);
    if (col) {
        ball.x += col.nx * col.depth;
        ball.y += col.ny * col.depth;
        const dot = ball.vx * col.nx + ball.vy * col.ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * col.nx;
            ball.vy -= 2 * dot * col.ny;
            // Add flipper energy
            const angVel = lFAngDiff * FLIPPER_SPEED * 3;
            ball.vy -= Math.abs(angVel) * 5;
            playSound(200, 0.1, 'triangle', 0.3);
        }
    }

    const rTip = flipperTip(rightFlipper);
    col = lineCircleCollision(rightFlipper.x, rightFlipper.y, rTip.x, rTip.y, ball.x, ball.y, ball.r);
    if (col) {
        ball.x += col.nx * col.depth;
        ball.y += col.ny * col.depth;
        const dot = ball.vx * col.nx + ball.vy * col.ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * col.nx;
            ball.vy -= 2 * dot * col.ny;
            const angVel = rFAngDiff * FLIPPER_SPEED * 3;
            ball.vy -= Math.abs(angVel) * 5;
            playSound(200, 0.1, 'triangle', 0.3);
        }
    }

    // Ball lost (falls below screen)
    if (ball.y > h + 50) {
        lives--;
        playSound(100, 0.5, 'sawtooth', 0.3);
        if (lives <= 0) {
            state = 'gameover';
            if (score > highScore) {
                highScore = score;
                try { localStorage.setItem('scrollPinballHigh', highScore.toString()); } catch(e) {}
            }
        } else {
            ballActive = false;
            launching = false;
            launchPower = 0;
            resetBall();
        }
    }

    // Keep ball in playfield horizontally
    if (ball.x < 30 + ball.r) { ball.x = 30 + ball.r; ball.vx = Math.abs(ball.vx) * 0.7; }
    if (ball.x > PLAYFIELD_W - 30 - ball.r) { ball.x = PLAYFIELD_W - 30 - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7; }

    // Camera
    const targetCam = ball.x - W/2;
    camX += (targetCam - camX) * 0.08;
    camX = Math.max(0, Math.min(PLAYFIELD_W - W, camX));

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // Speed limit
    const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
    if (speed > 20) {
        ball.vx *= 20/speed;
        ball.vy *= 20/speed;
    }
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    if (state === 'start') {
        drawStartScreen();
        return;
    }

    ctx.save();
    ctx.translate(-camX, 0);

    // Background grid
    ctx.strokeStyle = 'rgba(50, 60, 100, 0.3)';
    ctx.lineWidth = 1;
    const gridSize = 80;
    const startX = Math.floor(camX / gridSize) * gridSize;
    for (let x = startX; x < camX + W + gridSize; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(camX, y);
        ctx.lineTo(camX + W, y);
        ctx.stroke();
    }

    // Walls
    ctx.strokeStyle = '#4488cc';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (let wall of walls) {
        ctx.beginPath();
        ctx.moveTo(wall.x1, wall.y1);
        ctx.lineTo(wall.x2, wall.y2);
        ctx.stroke();
    }

    // Walls glow
    ctx.strokeStyle = 'rgba(68, 136, 204, 0.3)';
    ctx.lineWidth = 10;
    for (let wall of walls) {
        ctx.beginPath();
        ctx.moveTo(wall.x1, wall.y1);
        ctx.lineTo(wall.x2, wall.y2);
        ctx.stroke();
    }

    // Bumpers
    for (let b of bumpers) {
        if (b.x < camX - 50 || b.x > camX + W + 50) continue;
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, b.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fill();

        ctx.strokeStyle = b.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(b.points, b.x, b.y + 4);
    }

    // Slingshots
    for (let s of slingshots) {
        if (s.x < camX - 50 || s.x > camX + W + 50) continue;
        const active = s.cooldown <= 0;
        ctx.fillStyle = active ? s.color : 'rgba(100,100,100,0.3)';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Arrow indicating direction
        if (active) {
            ctx.fillStyle = '#fff';
            ctx.font = '14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('▲', s.x, s.y + 5);
        }
    }

    // Flippers
    const lTip = flipperTip(leftFlipper);
    const rTip = flipperTip(rightFlipper);

    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(leftFlipper.x, leftFlipper.y);
    ctx.lineTo(lTip.x, lTip.y);
    ctx.stroke();

    ctx.strokeStyle = '#ffcc00';
    ctx.beginPath();
    ctx.moveTo(rightFlipper.x, rightFlipper.y);
    ctx.lineTo(rTip.x, rTip.y);
    ctx.stroke();

    // Flipper glow
    ctx.strokeStyle = 'rgba(255, 204, 0, 0.3)';
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.moveTo(leftFlipper.x, leftFlipper.y);
    ctx.lineTo(lTip.x, lTip.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rightFlipper.x, rightFlipper.y);
    ctx.lineTo(rTip.x, rTip.y);
    ctx.stroke();

    // Ball
    if (ballActive || !launching) {
        const ballGrad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.r);
        ballGrad.addColorStop(0, '#ffffff');
        ballGrad.addColorStop(0.7, '#ccccdd');
        ballGrad.addColorStop(1, '#888899');
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();

        // Ball trail
        if (ballActive && speed > 5) {
            ctx.strokeStyle = 'rgba(200, 200, 255, 0.3)';
            ctx.lineWidth = ball.r;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(ball.x - ball.vx*2, ball.y - ball.vy*2);
            ctx.lineTo(ball.x, ball.y);
            ctx.stroke();
        }
    }

    // Launch power bar
    if (launching && !ballActive) {
        const barX = PLAYFIELD_W/2 - 30;
        const barY = H - 150;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(barX, barY, 60, 80);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(barX, barY, 60, 80);

        const pH = (launchPower / 30) * 76;
        const pColor = launchPower < 15 ? '#44ff44' : launchPower < 25 ? '#ffff44' : '#ff4444';
        ctx.fillStyle = pColor;
        ctx.fillRect(barX + 2, barY + 78 - pH, 56, pH);

        ctx.fillStyle = '#fff';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('POWER', barX + 30, barY - 8);
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // HUD
    drawHUD();

    if (state === 'gameover') {
        drawGameOver();
    }
}

function speed() {
    return Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
}

function drawHUD() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, W, 45);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 28);

    ctx.textAlign = 'center';
    ctx.fillText(`BALLS: ${'●'.repeat(lives)}${'○'.repeat(3-lives)}`, W/2, 28);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffcc44';
    ctx.fillText(`HI: ${highScore}`, W - 15, 28);

    // Position indicator
    const posPercent = (ball.x / PLAYFIELD_W * 100).toFixed(0);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Position: ${posPercent}%`, W/2, 60);

    // Progress bar showing scroll position
    const barW = 200;
    const barX = W/2 - barW/2;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(barX, 65, barW, 4);
    const dotX = barX + (camX / (PLAYFIELD_W - W)) * barW;
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(dotX - 4, 63, 8, 8);
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Decorative bumpers
    const t = Date.now() * 0.002;
    for (let i = 0; i < 8; i++) {
        const x = W/2 + Math.cos(t + i*0.8) * (150 + i*20);
        const y = H/2 + Math.sin(t + i*0.8) * (100 + i*15);
        ctx.fillStyle = `hsla(${i*45}, 80%, 60%, 0.3)`;
        ctx.beginPath();
        ctx.arc(x, y, 15 + i*2, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(60, W/10)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('SCROLL PINBALL', W/2, H/3);

    ctx.font = `${Math.min(20, W/30)}px monospace`;
    ctx.fillStyle = '#aaaacc';
    ctx.fillText('A side-scrolling pinball adventure', W/2, H/3 + 40);

    ctx.fillStyle = '#ffcc44';
    ctx.font = `bold ${Math.min(16, W/40)}px monospace`;
    const controls = [
        'Z / ←  : Left Flipper',
        'X / →  : Right Flipper',
        'SPACE  : Launch Ball (hold for power)',
        'R      : Restart'
    ];
    controls.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 + 30 + i * 28);
    });

    ctx.fillStyle = '#44ff88';
    ctx.font = `bold ${Math.min(22, W/25)}px monospace`;
    const pulse = Math.sin(Date.now()*0.005) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillText('PRESS SPACE TO START', W/2, H - 80);
    ctx.globalAlpha = 1;

    if (highScore > 0) {
        ctx.fillStyle = '#ffcc44';
        ctx.font = '16px monospace';
        ctx.fillText(`High Score: ${highScore}`, W/2, H - 45);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff4466';
    ctx.font = `bold ${Math.min(50, W/10)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/3);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(28, W/25)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, W/2, H/2 - 20);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc44';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H/2 + 20);
    }

    ctx.fillStyle = '#aaaacc';
    ctx.font = `${Math.min(18, W/35)}px monospace`;
    const pulse = Math.sin(Date.now()*0.005) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillText('Press R or SPACE to play again', W/2, H/2 + 70);
    ctx.globalAlpha = 1;
}

// Allow space to restart on game over
window.addEventListener('keydown', e => {
    if (state === 'gameover' && e.code === 'Space') {
        initAudio();
        startGame();
    }
});

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
