<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pac-Man Match</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;position:absolute;top:0;left:0;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
var W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

/* ---------- audio ---------- */
var AC=null;
function initAudio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function beep(freq,dur,type,vol,slideTo){
  if(!AC) return;
  var t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
  g.gain.setValueAtTime(vol||0.12,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t+dur+0.02);
}
var sfx={
  swap:function(){ beep(340,0.08,'square',0.08,520); },
  bad:function(){ beep(140,0.18,'sawtooth',0.1,90); },
  pop:function(c){ var f=380+c*70; beep(f,0.14,'triangle',0.14,f*1.6); setTimeout(function(){beep(f*1.5,0.12,'sine',0.1,f*2);},50); },
  over:function(){ beep(400,0.3,'square',0.12,80); setTimeout(function(){beep(300,0.4,'square',0.12,60);},250); },
  start:function(){ [440,554,659,880].forEach(function(f,i){ setTimeout(function(){beep(f,0.12,'square',0.1);},i*90); }); }
};

/* ---------- game data ---------- */
var N=8, TYPES=6;
var COLORS=['#ff3b5c','#ff7bd5','#3fdcff','#ffa02e','#ffe14a','#5b7bff'];
var NAMES=['Blinky','Pinky','Clyde','Inky','Waka','Sue'];
var MAX_MOVES=30;

var type=[], ox=[], oy=[], popT=[];   // type[y][x] (-1 empty), offsets in cells, pop scale 0..1
var screen='start';      // start | play | over
var phase='idle';        // idle | swap | revert | pop | fall
var score=0, moves=MAX_MOVES, combo=1, best=0;
try{ best=parseInt(localStorage.getItem('pacmatch_best')||'0',10)||0; }catch(e){}
var sel=null, cur={x:3,y:3}, downCell=null, downPos=null, dragDone=false;
var floats=[];           // floating texts {x,y,txt,t,big}
var time=0;

function mkArr(){ var a=[]; for(var y=0;y<N;y++){ a.push([]); for(var x=0;x<N;x++) a[y].push(0);} return a; }
function randType(){ return (Math.random()*TYPES)|0; }

function wouldMatch(x,y,t){
  if(x>=2 && type[y][x-1]===t && type[y][x-2]===t) return true;
  if(y>=2 && type[y-1][x]===t && type[y-2][x]===t) return true;
  return false;
}
function newBoard(){
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var t,tries=0;
    do{ t=randType(); tries++; }while(tries<50 && wouldMatch(x,y,t));
    type[y][x]=t; ox[y][x]=0; oy[y][x]=-(N+2+y*0.3); popT[y][x]=1;
  }
}

function findMatches(){
  var set={};
  function add(x,y){ set[x+','+y]=true; }
  for(var y=0;y<N;y++){
    var run=1;
    for(var x=1;x<=N;x++){
      if(x<N && type[y][x]===type[y][x-1] && type[y][x]>=0) run++;
      else{ if(run>=3){ for(var k=x-run;k<x;k++) add(k,y); } run=1; }
    }
  }
  for(var x=0;x<N;x++){
    var r2=1;
    for(var y2=1;y2<=N;y2++){
      if(y2<N && type[y2][x]===type[y2-1][x] && type[y2][x]>=0) r2++;
      else{ if(r2>=3){ for(var k2=y2-r2;k2<y2;k2++) add(x,k2); } r2=1; }
    }
  }
  var out=[]; for(var key in set){ var p=key.split(','); out.push([+p[0],+p[1]]); }
  return out;
}

function hasValidMove(){
  function test(x1,y1,x2,y2){
    var a=type[y1][x1]; type[y1][x1]=type[y2][x2]; type[y2][x2]=a;
    var m=findMatches().length>0;
    type[y2][x2]=type[y1][x1]; type[y1][x1]=a; // swap back (careful)
    return m;
  }
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    if(x<N-1 && test(x,y,x+1,y)) return true;
    if(y<N-1 && test(x,y,x,y+1)) return true;
  }
  return false;
}

function startGame(){
  score=0; moves=MAX_MOVES; combo=1; sel=null; floats=[];
  newBoard();
  var guard=0;
  while(!hasValidMove() && guard++<20) newBoard();
  phase='fall'; // let intro tiles drop in
  screen='play';
  sfx.start();
}

function addFloat(x,y,txt,big){ floats.push({x:x,y:y,txt:txt,t:1.4,big:!!big}); }

function doSwap(a,b){
  type[a.y][a.x] ^= type[b.y][b.x] ^ type[a.y][a.x]; // swap values... safer below
}
function swapCells(a,b){
  var t=type[a.y][a.x]; type[a.y][a.x]=type[b.y][b.x]; type[b.y][b.x]=t;
  ox[a.y][a.x]=(a.x-b.x); oy[a.y][a.x]=(a.y-b.y);
  ox[b.y][b.x]=(b.x-a.x); oy[b.y][b.x]=(b.y-a.y);
}

function attemptSwap(a,b){
  if(phase!=='idle'||screen!=='play') return;
  if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1) return;
  swapCells(a,b);
  moves--; combo=1;
  sfx.swap();
  phase='swap';
}

function startPop(cells){
  var cx=0,cy=0;
  for(var i=0;i<cells.length;i++){
    var c=cells[i];
    popT[c.y][c.x]=1;
    cx+=c.x; cy+=c.y;
  }
  score += cells.length*10*combo;
  addFloat(cx/cells.length, cy/cells.length, (cells.length*10*combo)+(combo>1?'  x'+combo:''), combo>1);
  sfx.pop(combo);
  phase='pop';
}

function applyGravity(){
  for(var x=0;x<N;x++){
    var write=N-1;
    for(var y=N-1;y>=0;y--){
      if(type[y][x]>=0){
        if(write!==y){
          type[write][x]=type[y][x]; type[y][x]=-1;
          ox[write][x]=0; oy[write][x]=-(write-y); popT[write][x]=1;
        }
        write--;
      }
    }
    var empty=write+1; // cells 0..write are empty
    for(var y2=write;y2>=0;y2--){
      type[y2][x]=randType();
      ox[y2][x]=0; oy[y2][x]=-(y2+1); popT[y2][x]=1;
    }
  }
}

function afterSettle(){
  if(moves<=0 && screen==='play'){
    screen='over';
    sfx.over();
    if(score>best){ best=score; try{ localStorage.setItem('pacmatch_best',''+best); }catch(e){} }
    return;
  }
  var guard=0;
  while(!hasValidMove() && guard++<20){ newBoard(); addFloat(N/2-0.5,N/2,'SHUFFLING!',true); phase='fall'; return; }
  phase='idle';
}

function handleTap(c){
  if(screen!=='play'||phase!=='idle') return;
  cur={x:c.x,y:c.y};
  if(!sel){ sel=c; beep(500,0.05,'sine',0.06); return; }
  if(sel.x===c.x&&sel.y===c.y){ sel=null; return; }
  if(Math.abs(sel.x-c.x)+Math.abs(sel.y-c.y)===1){ attemptSwap(sel,c); sel=null; }
  else { sel=c; beep(500,0.05,'sine',0.06); }
}

/* ---------- layout ---------- */
function layout(){
  var top=64;
  var cell=Math.floor(Math.min((W-24)/N,(H-top-24)/N));
  cell=Math.max(cell,28);
  var bw=cell*N;
  var oxp=(W-bw)/2, oyp=top+(H-top-16-bw)/2;
  return {cell:cell,bx:oxp,by:oyp};
}

/* ---------- drawing ---------- */
function drawGhost(g,cx,cy,s,color,scale){
  g.save();
  g.translate(cx,cy); g.scale(scale,scale);
  var r=s*0.38;
  g.fillStyle=color;
  g.beginPath();
  g.arc(0,-r*0.12,r,Math.PI,0);
  var bottom=r*0.95, segs=3, w=(2*r)/segs;
  g.lineTo(r,bottom);
  for(var i=0;i<segs;i++){
    g.lineTo(r-w*(i+0.5),bottom-r*0.4);
    g.lineTo(r-w*(i+1),bottom);
  }
  g.closePath(); g.fill();
  // eyes
  g.fillStyle='#fff';
  g.beginPath(); g.ellipse(-r*0.42,-r*0.18,r*0.27,r*0.34,0,0,Math.PI*2); g.fill();
  g.beginPath(); g.ellipse( r*0.42,-r*0.18,r*0.27,r*0.34,0,0,Math.PI*2); g.fill();
  g.fillStyle='#2b3bff';
  g.beginPath(); g.arc(-r*0.32,-r*0.05,r*0.14,0,Math.PI*2); g.fill();
  g.beginPath(); g.arc( r*0.52,-r*0.05,r*0.14,0,Math.PI*2); g.fill();
  g.restore();
}
function drawPower(g,cx,cy,s){
  var pulse=1+Math.sin(time*6)*0.08;
  g.save();
  g.fillStyle='rgba(255,225,74,0.25)';
  g.beginPath(); g.arc(cx,cy,s*0.3*pulse,0,Math.PI*2); g.fill();
  g.fillStyle='#ffe14a';
  g.beginPath(); g.arc(cx,cy,s*0.19*pulse,0,Math.PI*2); g.fill();
  g.restore();
}

function drawBoard(){
  var L=layout(), cell=L.cell;
  // panel
  ctx.fillStyle='#0a0a2e';
  roundRect(L.bx-8,L.by-8,cell*N+16,cell*N+16,14); ctx.fill();
  ctx.strokeStyle='#2b3bff'; ctx.lineWidth=3;
  roundRect(L.bx-8,L.by-8,cell*N+16,cell*N+16,14); ctx.stroke();
  // faint grid dots
  ctx.fillStyle='rgba(90,110,255,0.18)';
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    if(type[y][x]<0 || (popT[y][x]!==undefined && popT[y][x]<0.9)){
      ctx.beginPath(); ctx.arc(L.bx+x*cell+cell/2,L.by+y*cell+cell/2,Math.max(1.5,cell*0.04),0,Math.PI*2); ctx.fill();
    }
  }
  // selection / cursor
  if(sel){
    var pulse=0.5+0.5*Math.sin(time*8);
    ctx.strokeStyle='rgba(255,255,255,'+(0.4+0.6*pulse)+')';
    ctx.lineWidth=3;
    roundRect(L.bx+sel.x*cell+3,L.by+sel.y*cell+3,cell-6,cell-6,8); ctx.stroke();
  }
  if(screen==='play'){
    ctx.strokeStyle='rgba(255,225,74,0.35)';
    ctx.lineWidth=2;
    roundRect(L.bx+cur.x*cell+2,L.by+cur.y*cell+2,cell-4,cell-4,8); ctx.stroke();
  }
  // tiles
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var t=type[y][x];
    if(t<0) continue;
    var px=L.bx+x*cell+cell/2+ox[y][x]*cell;
    var py=L.by+y*cell+cell/2+oy[y][x]*cell;
    var sc=(popT[y][x]!==undefined&&popT[y][x]<1)?Math.max(popT[y][x],0.01):1;
    ctx.globalAlpha=sc<1?sc:1;
    if(t===4) drawPower(ctx,px,py,cell*sc);
    else drawGhost(ctx,px,py,cell,COLORS[t],sc);
    ctx.globalAlpha=1;
  }
  // floats
  for(var i=floats.length-1;i>=0;i--){
    var f=floats[i];
    ctx.globalAlpha=Math.min(1,f.t);
    ctx.fillStyle=f.big?'#ffe14a':'#fff';
    ctx.font='bold '+(f.big?Math.floor(cell*0.55):Math.floor(cell*0.38))+'px monospace';
    ctx.textAlign='center';
    ctx.fillText(f.txt,L.bx+f.x*cell+cell/2,L.by+f.y*cell+cell/2-(1.4-f.t)*40);
    ctx.globalAlpha=1;
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawHUD(){
  ctx.textAlign='left';
  ctx.font='bold '+Math.max(16,Math.floor(Math.min(W,H)*0.035))+'px monospace';
  ctx.fillStyle='#ffe14a';
  ctx.fillText('SCORE '+score,16,34);
  ctx.textAlign='right';
  ctx.fillStyle=moves<=5?'#ff3b5c':'#fff';
  ctx.fillText('MOVES '+moves,W-16,34);
  if(combo>1 && screen==='play'){
    ctx.textAlign='center';
    ctx.fillStyle='#3fdcff';
    ctx.font='bold '+Math.max(14,Math.floor(Math.min(W,H)*0.028))+'px monospace';
    ctx.fillText('COMBO x'+combo,W/2,34);
  }
}

function centerText(txt,y,size,color){
  ctx.textAlign='center';
  ctx.fillStyle=color||'#fff';
  ctx.font='bold '+size+'px monospace';
  ctx.fillText(txt,W/2,y);
}

function drawStart(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  var s=Math.min(W,H);
  // title ghosts
  for(var i=0;i<5;i++){
    var gx=W/2+(i-2)*s*0.14;
    var gy=s*0.3+Math.sin(time*3+i)*s*0.015;
    drawGhost(ctx,gx,gy,s*0.11,COLORS[i],1);
  }
  centerText('PAC-MATCH',s*0.52,s*0.09,'#ffe14a');
  centerText('Match 3+ ghosts & pellets!',s*0.60,s*0.03,'#3fdcff');
  centerText('DRAG or CLICK adjacent tiles to swap',s*0.68,s*0.026,'#fff');
  centerText('ARROWS move cursor - SPACE / ENTER select',s*0.72,s*0.026,'#fff');
  centerText(R'MAX?':'','' ,1,'transparent'); // noop guard
  centerText('You have '+MAX_MOVES+' moves. Chain combos for big points!',s*0.775,s*0.024,'#8a8aff');
  if(best>0) centerText('BEST: '+best,s*0.83,s*0.03,'#ffe14a');
  if(Math.sin(time*4)>-0.3) centerText('PRESS ENTER OR CLICK TO START',s*0.92,s*0.035,'#fff');
}

function drawOver(){
  ctx.fillStyle='rgba(0,0,10,0.78)'; ctx.fillRect(0,0,W,H);
  var s=Math.min(W,H);
  centerText('GAME OVER',s*0.34,s*0.09,'#ff3b5c');
  centerText('SCORE  '+score,s*0.48,s*0.05,'#fff');
  centerText('BEST   '+best+(score>=best&&score>0?'  NEW!':''),s*0.56,s*0.035,'#ffe14a');
  if(Math.sin(time*4)>-0.3) centerText('PRESS ENTER OR CLICK TO PLAY AGAIN',s*0.7,s*0.032,'#fff');
}

/* ---------- update ---------- */
var last=performance.now();
function update(dt){
  time+=dt;
  for(var i=floats.length-1;i>=0;i--){ floats[i].t-=dt; if(floats[i].t<=0) floats.splice(i,1); }
  if(screen!=='play') return;

  var settled=true, i,x,y;
  for(y=0;y<N;y++)for(x=0;x<N;x++){
    if(Math.abs(ox[y][x])>0.02||Math.abs(oy[y][x])>0.02) settled=false;
  }

  if(phase==='swap'||phase==='revert'){
    var k=Math.min(1,dt*14);
    for(y=0;y<N;y++)for(x=0;x<N;x++){ ox[y][x]+=(0-ox[y][x])*k; oy[y][x]+=(0-oy[y][x])*k; }
    if(settled){
      for(y=0;y<N;y++)for(x=0;x<N;x++){ ox[y][x]=0; oy[y][x]=0; }
      var m=findMatches();
      if(phase==='swap'){
        if(m.length) startPop(m);
        else{
          // revert
          for(var i2=0;i2<lastSwap.length;i2+=4){}
          swapCells(lastSwapA,lastSwapB);
          sfx.bad();
          phase='revert';
        }
      }else{
        afterSettle();
      }
    }
  }
  else if(phase==='pop'){
    var done=true;
    for(y=0;y<N;y++)for(x=0;x<N;x++){
      if(popT[y][x]!==undefined && popT[y][x]<1){
        popT[y][x]-=dt/0.26;
        if(popT[y][x]>0) done=false;
      }
    }
    if(done){
      for(y=0;y<N;y++)for(x=0;x<N;x++){
        if(popT[y][x]!==undefined && popT[y][x]<=0){ type[y][x]=-1; popT[y][x]=1; }
      }
      applyGravity();
      phase='fall';
    }
  }
  else if(phase==='fall'){
    var sp=32*dt, done2=true;
    for(y=0;y<N;y++)for(x=0;x<N;x++){
      if(oy[y][x]<0){
        oy[y][x]=Math.min(0,oy[y][x]+sp);
        if(oy[y][x]<0) done2=false;
      }
    }
    if(done2){
      for(y=0;y<N;y++)for(x=0;x<N;x++) oy[y][x]=0;
      var m2=findMatches();
      if(m2.length){ combo++; startPop(m2); }
      else afterSettle();
    }
  }
}

var lastSwapA={x:0,y:0}, lastSwapB={x:0,y:0};
// hook: attemptSwap stores swap endpoints
var _attempt=attemptSwap;
attemptSwap=function(a,b){
  if(phase!=='idle'||screen!=='play') return;
  if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)!==1) return;
  lastSwapA={x:a.x,y:a.y}; lastSwapB={x:b.x,y:b.y};
  swapCells(lastSwapA,lastSwapB);
  moves--; combo=1;
  sfx.swap();
  phase='swap';
};

/* ---------- render loop ---------- */
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  if(screen==='start'){ drawStart(); }
  else{
    // subtle maze lines background
    ctx.strokeStyle='rgba(43,59,255,0.12)'; ctx.lineWidth=1;
    var step=48;
    for(var x=(W/2)%step;x<W;x+=step){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(var y=y0=(H/2)%step;y<H;y+=step){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    drawBoard();
    drawHUD();
    if(screen==='over') drawOver();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- input ---------- */
function cellAt(px,py){
  var L=layout();
  var x=Math.floor((px-L.bx)/L.cell), y=Math.floor((py-L.by)/L.cell);
  if(x<0||y<0||x>=N||y>=N) return null;
  return {x:x,y:y};
}
function evPos(e){
  var r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

canvas.addEventListener('pointerdown',function(e){
  initAudio();
  var p=evPos(e);
  if(screen==='start'){ startGame(); return; }
  if(screen==='over'){ startGame(); return; }
  var c=cellAt(p.x,p.y);
  if(!c) return;
  downCell=c; downPos=p; dragDone=false;
});
window.addEventListener('pointermove',function(e){
  if(!downCell||dragDone||screen!=='play') return;
  var p=evPos(e), L=layout();
  var dx=p.x-downPos.x, dy=p.y-downPos.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<L.cell*0.35) return;
  dragDone=true;
  var t={x:downCell.x,y:downCell.y};
  if(Math.abs(dx)>Math.abs(dy)) t.x+=dx>0?1:-1; else t.y+=dy>0?1:-1;
  if(t.x>=0&&t.y>=0&&t.x<N&&t.y<N){ attemptSwap(downCell,t); sel=null; }
  downCell=null;
});
window.addEventListener('pointerup',function(e){
  if(screen!=='play'||!downCell||dragDone) { downCell=null; return; }
  handleTap(downCell);
  downCell=null;
});

window.addEventListener('keydown',function(e){
  initAudio();
  var k=e.key;
  if(k==='Enter'||k===' '){
    e.preventDefault();
    if(screen!=='play'){ startGame(); return; }
    handleTap({x:cur.x,y:cur.y});
    return;
  }
  if(screen!=='play') return;
  if(k==='ArrowLeft'){ cur.x=(cur.x+N-1)%N; e.preventDefault(); }
  else if(k==='ArrowRight'){ cur.x=(cur.x+1)%N; e.preventDefault(); }
  else if(k==='ArrowUp'){ cur.y=(cur.y+N-1)%N; e.preventDefault(); }
  else if(k==='ArrowDown'){ cur.y=(cur.y+1)%N; e.preventDefault(); }
  else if(k==='r'||k==='R'){ startGame(); }
});

})();
</script>
</body>
</html>
