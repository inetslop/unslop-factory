<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Flip — Top-Down Memory</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(ellipse at center, #1e6b3a 0%, #0d3d20 70%, #082413 100%);
    color:#f5eeda;
    display:flex; align-items:center; justify-content:center;
  }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:12px; text-align:center; }
  .screen.active { display:flex; }

  h1 { font-size:clamp(30px, 7vmin, 64px); letter-spacing:2px; margin-bottom:8px; color:#ffe9a8; text-shadow:0 3px 12px rgba(0,0,0,.6); }
  .sub { font-size:clamp(13px,2.4vmin,20px); opacity:.85; margin-bottom:22px; }

  .card-deco { font-size:clamp(40px,9vmin,72px); margin-bottom:18px; text-shadow:0 4px 10px rgba(0,0,0,.5); }

  .btn {
    font-family:inherit; cursor:pointer; border:none; color:#f5eeda;
    background:linear-gradient(#3b9a5e,#1f6b3d);
    border:2px solid #ffd97a; border-radius:10px;
    padding:12px 26px; font-size:clamp(14px,2.6vmin,20px); margin:6px;
    box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .1s, filter .1s;
  }
  .btn:hover { transform:translateY(-2px); filter:brightness(1.15); }
  .btn.small { padding:7px 14px; font-size:clamp(12px,2vmin,16px); }

  .controls-box {
    margin-top:20px; background:rgba(0,0,0,.35); border:1px solid rgba(255,217,122,.4);
    border-radius:12px; padding:14px 26px; font-size:clamp(12px,2.2vmin,17px); line-height:1.8; text-align:left;
  }
  .controls-box b { color:#ffd97a; }
  kbd { background:#0b2d18; border:1px solid #4c8f63; border-radius:4px; padding:1px 7px; font-family:monospace; font-size:.95em; }

  .best-line { margin-top:14px; font-size:clamp(12px,2.2vmin,16px); opacity:.9; }
  .best-line span { color:#ffd97a; }

  /* HUD */
  #screen-game { justify-content:flex-start; padding-top:10px; }
  #hud {
    display:flex; gap:18px; align-items:center; flex-wrap:wrap; justify-content:center;
    background:rgba(0,0,0,.4); border:1px solid rgba(255,217,122,.35); border-radius:12px;
    padding:8px 18px; margin-bottom:12px; font-size:clamp(13px,2.4vmin,19px);
  }
  #hud .stat b { color:#ffd97a; }

  /* Board */
  #board-wrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
  #board { display:grid; gap:var(--gap,8px); perspective:900px; }
  .card { width:var(--cell,60px); height:calc(var(--cell,60px) * 1.45); position:relative; cursor:pointer; }
  .inner {
    position:absolute; inset:0; transition:transform .45s cubic-bezier(.4,1.4,.6,1);
    transform-style:preserve-3d;
  }
  .card.flipped .inner { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:calc(var(--cell,60px) * .12); display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  .face.back {
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 6px, transparent 6px 12px),
      linear-gradient(#7a1f2b,#4d1019);
    border:2px solid #e8c987;
  }
  .face.back::after { content:'✦'; color:#e8c987; font-size:calc(var(--cell,60px)*.5); opacity:.85; }
  .face.front {
    background:linear-gradient(#fffef7,#efe8d2); border:2px solid #b9a86f;
    transform:rotateY(180deg); flex-direction:column; justify-content:space-between; padding:4% 7%;
  }
  .face.front.red { color:#c1272d; }
  .face.front.black { color:#1c1c2e; }
  .corner { font-size:calc(var(--cell,60px)*.30); font-weight:bold; line-height:.95; text-align:center; }
  .corner.bot { transform:rotate(180deg); }
  .pip { font-size:calc(var(--cell,60px)*.55); line-height:1; }
  .card.matched .face.front { box-shadow:0 0 14px 3px rgba(255,217,122,.8); border-color:#ffd97a; }
  .card.matched { cursor:default; }
  .card.sel { outline:3px solid #ffe9a8; outline-offset:2px; border-radius:calc(var(--cell,60px)*.14); z-index:2; }

  /* Win */
  #win-stats { font-size:clamp(15px,3vmin,24px); line-height:2; margin-bottom:18px; }
  #win-stats b { color:#ffd97a; }
  .newbest { color:#7dff9e !important; animation:pulse 1s infinite alternate; display:inline-block; }
  @keyframes pulse { from{opacity:.6} to{opacity:1} }

  @media (max-height:520px){ .controls-box{display:none;} }
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="screen-start" class="screen active">
  <div class="card-deco">🂠 ♠ ♥ ♦ ♣</div>
  <h1>CARD FLIP</h1>
  <div class="sub">A top-down memory duel — find every matching pair</div>
  <div id="diff-buttons"></div>
  <div class="controls-box">
    <b>Mouse:</b> click a card to flip it<br>
    <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> select &nbsp; <kbd>Enter</kbd>/<kbd>Space</kbd> flip<br>
    <kbd>R</kbd> restart round &nbsp; <kbd>M</kbd> main menu<br>
    Flip two cards — match them to clear the table!
  </div>
  <div class="best-line" id="start-best"></div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <div id="hud">
    <span class="stat">Moves: <b id="hud-moves">0</b></span>
    <span class="stat">Time: <b id="hud-time">00:00</b></span>
    <span class="stat">Pairs: <b id="hud-pairs">0/0</b></span>
    <button class="btn small" id="btn-restart">↻ Restart (R)</button>
    <button class="btn small" id="btn-menu">Menu (M)</button>
  </div>
  <div id="board-wrap"><div id="board"></div></div>
</div>

<!-- WIN SCREEN -->
<div id="screen-win" class="screen">
  <div class="card-deco">🏆</div>
  <h1>TABLE CLEARED!</h1>
  <div id="win-stats"></div>
  <button class="btn" id="btn-again">Play Again (R)</button>
  <button class="btn" id="btn-winmenu">Main Menu (M)</button>
</div>

<script>
(function(){
  'use strict';

  // ---------- Audio ----------
  var AC = null;
  function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
  function tone(freq, dur, type, vol, when){
    var a = audio(); if(!a) return;
    var t = a.currentTime + (when||0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function sFlip(){ tone(320,.12,'triangle',.18); tone(520,.1,'sine',.08,.04); }
  function sMatch(){ tone(660,.15,'sine',.2); tone(880,.25,'sine',.2,.1); }
  function sMiss(){ tone(220,.2,'sawtooth',.08); tone(180,.25,'sawtooth',.08,.1); }
  function sWin(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,.35,'triangle',.2,i*.13); }); }

  // ---------- Data ----------
  var DIFFS = [
    { key:'easy',   name:'Easy · 4×3',  cols:4, rows:3 },
    { key:'medium', name:'Medium · 6×4',cols:6, rows:4 },
    { key:'hard',   name:'Hard · 8×5',  cols:8, rows:5 }
  ];
  var SUITS = ['♠','♥','♦','♣'];
  var RANKS = ['A','K','Q','J','10','9','8','7','6','5'];

  var state = { diff:DIFFS[0], cards:[], flipped:[], lock:false, moves:0, seconds:0, timer:null, running:false, sel:0 };
  var best = {};
  try{ best = JSON.parse(localStorage.getItem('cardflip-best')||'{}'); }catch(e){ best={}; }
  function saveBest(){ try{ localStorage.setItem('cardflip-best', JSON.stringify(best)); }catch(e){} }

  // ---------- DOM ----------
  var $ = function(id){ return document.getElementById(id); };
  var screens = { start:$('screen-start'), game:$('screen-game'), win:$('screen-win') };
  var board = $('board');
  function show(name){ for(var k in screens) screens[k].classList.toggle('active', k===name); }

  // difficulty buttons
  DIFFS.forEach(function(d,i){
    var b = document.createElement('button');
    b.className='btn'; b.textContent = (i+1)+' · '+d.name;
    b.onclick = function(){ audio(); startGame(d); };
    $('diff-buttons').appendChild(b);
  });

  function fmt(s){ var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
  function bestText(k){
    if(!best[k]) return '—';
    return best[k].moves+' moves · '+fmt(best[k].time);
  }
  function refreshStartBest(){
    var parts = DIFFS.map(function(d){ return d.name.split('·')[0].trim()+': <span>'+bestText(d.key)+'</span>'; });
    $('start-best').innerHTML = '🏅 Best — '+parts.join(' &nbsp;|&nbsp; ');
  }
  refreshStartBest();

  // ---------- Game ----------
  function buildDeck(diff){
    var pairs = diff.cols*diff.rows/2, faces=[];
    for(var i=0;i<pairs;i++){
      var f = { rank:RANKS[i%10], suit:SUITS[Math.floor(i/10)%4], id:'p'+i };
      faces.push(f,f);
    }
    for(var j=faces.length-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)); var t=faces[j]; faces[j]=faces[k]; faces[k]=t; }
    return faces;
  }

  function startGame(diff){
    state.diff = diff||state.diff;
    state.cards = buildDeck(state.diff);
    state.flipped=[]; state.lock=false; state.moves=0; state.seconds=0;
    state.running=false; state.sel=0;
    if(state.timer){ clearInterval(state.timer); state.timer=null; }
    $('hud-moves').textContent='0'; $('hud-time').textContent='00:00';
    $('hud-pairs').textContent='0/'+(state.cards.length/2);

    board.innerHTML='';
    board.style.gridTemplateColumns = 'repeat('+state.diff.cols+', var(--cell))';
    state.cards.forEach(function(f,i){
      var c=document.createElement('div');
      c.className='card'; c.dataset.i=i;
      var red = (f.suit==='♥'||f.suit==='♦')?'red':'black';
      c.innerHTML =
        '<div class="inner">'+
          '<div class="face back"></div>'+
          '<div class="face front '+red+'">'+
            '<div class="corner">'+f.rank+'<br>'+f.suit+'</div>'+
            '<div class="pip">'+f.suit+'</div>'+
            '<div class="corner bot">'+f.rank+'<br>'+f.suit+'</div>'+
          '</div>'+
        '</div>';
      c.addEventListener('click', function(){ audio(); flip(i); });
      board.appendChild(c);
    });
    layout();
    markSel();
    show('game');
  }

  function layout(){
    var cols=state.diff.cols, rows=state.diff.rows;
    if(!screens.game.classList.contains('active')) return;
    var hudH = $('hud').offsetHeight + 12;
    var availW = window.innerWidth - 40;
    var availH = window.innerHeight - hudH - 30;
    var gap = Math.max(4, Math.min(10, availW/(cols*2)));
    var cell = Math.min((availW - gap*(cols-1))/cols, (availH - gap*(rows-1))/(rows*1.45));
    cell = Math.max(30, Math.floor(cell));
    board.style.setProperty('--cell', cell+'px');
    board.style.setProperty('--gap', gap+'px');
  }
  window.addEventListener('resize', layout);

  function markSel(){
    var kids=board.children;
    for(var i=0;i<kids.length;i++) kids[i].classList.toggle('sel', i===state.sel && !screens.win.classList.contains('active'));
  }

  function startTimer(){
    if(state.running) return;
    state.running=true;
    state.timer=setInterval(function(){
      state.seconds++; $('hud-time').textContent=fmt(state.seconds);
    },1000);
  }

  function flip(i){
    if(state.lock) return;
    var card = state.cards[i], el = board.children[i];
    if(!card || el.classList.contains('flipped')||el.classList.contains('matched')) return;
    markSel();
    el.classList.add('flipped');
    sFlip();
    startTimer();
    state.flipped.push(i);

    if(state.flipped.length===2){
      state.moves++; $('hud-moves').textContent=state.moves;
      var a=state.cards[state.flipped[0]], b=state.cards[state.flipped[1]];
      if(a.id===b.id){
        board.children[state.flipped[0]].classList.add('matched');
        board.children[state.flipped[1]].classList.add('matched');
        sMatch();
        state.flipped=[];
        var done = board.querySelectorAll('.matched').length/2;
        $('hud-pairs').textContent=done+'/'+(state.cards.length/2);
        if(done===state.cards.length/2) setTimeout(win, 500);
      } else {
        state.lock=true; sMiss();
        var f=state.flipped.slice();
        setTimeout(function(){
          board.children[f[0]].classList.remove('flipped');
          board.children[f[1]].classList.remove('flipped');
          state.flipped=[]; state.lock=false;
        }, 750);
      }
    }
  }

  function win(){
    if(state.timer){ clearInterval(state.timer); state.timer=null; }
    sWin();
    var d=state.diff, isBest=false;
    var old=best[d.key];
    if(!old || state.moves<old.moves || (state.moves===old.moves && state.seconds<old.time)){
      best[d.key]={ moves:state.moves, time:state.seconds }; saveBest(); isBest=true;
    }
    $('win-stats').innerHTML =
      'Difficulty: <b>'+d.name+'</b><br>'+
      'Moves: <b>'+state.moves+'</b> &nbsp;·&nbsp; Time: <b>'+fmt(state.seconds)+'</b><br>'+
      (isBest ? '<span class="newbest">★ NEW BEST! ★</span>' : 'Best: '+bestText(d.key));
    refreshStartBest();
    show('win');
  }

  // ---------- Keyboard ----------
  window.addEventListener('keydown', function(e){
    audio();
    var k=e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>=0) e.preventDefault();

    if(screens.start.classList.contains('active')){
      if(k==='1') startGame(DIFFS[0]);
      else if(k==='2') startGame(DIFFS[1]);
      else if(k==='3') startGame(DIFFS[2]);
      return;
    }
    if(screens.win.classList.contains('active')){
      if(k==='r'||k==='R'||k==='Enter'){ startGame(state.diff); }
      else if(k==='m'||k==='M'||k==='Escape'){ show('start'); refreshStartBest(); }
      return;
    }
    // game screen
    var n=state.cards.length, cols=state.diff.cols;
    if(k==='ArrowRight') state.sel=(state.sel+1)%n;
    else if(k==='ArrowLeft') state.sel=(state.sel-1+n)%n;
    else if(k==='ArrowDown'){ state.sel=(state.sel+cols)%n; }
    else if(k==='ArrowUp'){ state.sel=(state.sel-cols+n)%n; }
    else if(k==='Enter'||k===' ') flip(state.sel);
    else if(k==='r'||k==='R') startGame(state.diff);
    else if(k==='m'||k==='M'||k==='Escape'){ show('start'); refreshStartBest(); return; }
    markSel();
  });

  // ---------- Buttons ----------
  $('btn-restart').onclick=function(){ audio(); startGame(state.diff); };
  $('btn-menu').onclick=function(){ audio(); show('start'); refreshStartBest(); };
  $('btn-again').onclick=function(){ audio(); startGame(state.diff); };
  $('btn-winmenu').onclick=function(){ audio(); show('start'); refreshStartBest(); };

  // unlock audio on first pointer input too
  window.addEventListener('pointerdown', function once(){ audio(); }, {once:false});
})();
</script>
</body>
</html>
