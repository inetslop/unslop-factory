<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Breakout</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060f; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#05060f; box-shadow:0 0 60px rgba(80,120,255,.15); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
(function(){
"use strict";

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// Logical game size; canvas scales to fit window
const GW = 900, GH = 640;
let scale = 1;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  scale = Math.min(w / GW, h / GH);
  cv.width  = Math.floor(GW * scale);
  cv.height = Math.floor(GH * scale);
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio (created on first input) ----------
let AC = null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type, vol, slide){
  const ac = audio(); if(!ac) return;
  try{
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), ac.currentTime+dur);
    g.gain.setValueAtTime(vol||0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}

// ---------- Game state ----------
const STATE = { MENU:0, PLAY:1, PAUSE:2, WIN:3, LOSE:4 };
let state = STATE.MENU;

let paddle, ball, balls, blocks, particles, powerups, score, lives, level, combo;
let shake = 0;
let highScore = 0;
try{ highScore = parseInt(localStorage.getItem('neonBreakoutHi')||'0',10)||0; }catch(e){}

const BRICK_ROWS = 6, BRICK_COLS = 12;
const PADDLE_W = 110, PADDLE_H = 14;
const BALL_R = 8;
const WALL_TOP = 50; // HUD strip height

function resetLevel(lv){
  blocks = [];
  const colors = ['#ff3b6b','#ff9f1c','#ffe74c','#3ddc84','#38bdf8','#a78bfa'];
  const bw = (GW-120)/BRICK_COLS;
  for(let r=0;r<BRICK_ROWS;r++){
    for(let c=0;c<BRICK_COLS;c++){
      // pattern variation per level
      if(lv>1 && ((r+c)%5===0)) continue;
      blocks.push({
        x: 60 + c*bw, y: WALL_TOP+40 + r*26, w: bw-4, h: 20,
        hp: (lv>=3 && r<2) ? 2 : 1,
        color: colors[r % colors.length],
        alive:true
      });
    }
  }
}

function newBall(stuck){
  return { x:GW/2, y:GH-80, vx:0, vy:0, r:BALL_R, stuck:!!stuck, speed:0 };
}

function launch(){
  balls.forEach(b=>{
    if(b.stuck){
      const a = -Math.PI/2 + (Math.random()*0.6-0.3);
      b.vx = Math.cos(a)*b.speed;
      b.vy = Math.sin(a)*b.speed;
      b.stuck = false;
    }
  });
  beep(440, .08, 'triangle', .15, 200);
}

function startGame(){
  score = 0; lives = 3; level = 1; combo = 0;
  paddle = { x:GW/2-PADDLE_W/2, y:GH-40, w:PADDLE_W, h:PADDLE_H, targetW:PADDLE_W };
  resetLevel(level);
  balls = [ newBall(true) ];
  balls[0].speed = 380;
  powerups = []; particles = [];
  state = STATE.PLAY;
}

// ---------- Input ----------
const keys = {};
let mouseX = null;

window.addEventListener('keydown', e=>{
  audio();
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(k==='arrowleft'||k==='a') e.preventDefault();
  if(k==='arrowright'||k==='d') e.preventDefault();

  if(state===STATE.MENU && (k===' '||k==='enter')) startGame();
  else if(state===STATE.PLAY){
    if(k===' ') launch();
    if(k==='p') state = STATE.PAUSE;
    if(k==='r') startGame();
  } else if(state===STATE.PAUSE){
    if(k==='p'||k===' ') state = STATE.PLAY;
    if(k==='r') startGame();
  } else if((state===STATE.WIN||state===STATE.LOSE) && (k===' '||k==='enter')) startGame();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

cv.addEventListener('mousemove', e=>{
  const rect = cv.getBoundingClientRect();
  mouseX = (e.clientX - rect.left)/scale;
});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left)/scale;
}, {passive:false});
cv.addEventListener('mousedown', ()=>{ audio(); if(state===STATE.MENU) startGame(); else if(state===STATE.PLAY) launch(); });
cv.addEventListener('touchstart', e=>{ audio(); if(state===STATE.MENU) startGame(); else if(state===STATE.PLAY) launch(); }, {passive:true});

// ---------- Particles / powerups ----------
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = 60+Math.random()*220;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.5,max:.9,color,size:2+Math.random()*3});
  }
}

const PU_TYPES = [
  { id:'wide', color:'#38bdf8', label:'W' },
  { id:'multi',color:'#a78bfa', label:'*' },
  { id:'life', color:'#ff3b6b', label:'+' },
];

function dropPowerup(x,y){
  if(Math.random() > 0.22) return;
  const t = PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
  powerups.push({ x, y, vy:140, r:11, ...t });
}

function applyPowerup(pu){
  beep(700,.15,'sine',.2,300);
  if(pu.id==='wide'){
    paddle.targetW = Math.min(180, paddle.w+30);
  } else if(pu.id==='multi'){
    const src = balls.find(b=>!b.stuck) || balls[0];
    for(let i=0;i<2;i++){
      const a = -Math.PI/2 + (i? .5 : -.5);
      balls.push({ x:src.x, y:src.y, vx:Math.cos(a)*src.speed, vy:Math.sin(a)*src.speed, r:BALL_R, stuck:false, speed:src.speed });
    }
  } else if(pu.id==='life'){
    lives = Math.min(5, lives+1);
  }
}

// ---------- Update ----------
function update(dt){
  // paddle
  const ps = 620;
  if(keys['arrowleft']||keys['a']) mouseX = paddle.x + paddle.w/2 - 300;
  if(keys['arrowright']||keys['d']) mouseX = paddle.x + paddle.w/2 + 300;
  if(mouseX !== null){
    const cx = Math.max(paddle.w/2, Math.min(GW-paddle.w/2, mouseX));
    paddle.x += (cx - paddle.w/2) * Math.min(1, dt*20);
  }
  paddle.w += (paddle.targetW - paddle.w)*Math.min(1,dt*6);

  // balls
  for(let bi=balls.length-1; bi>=0; bi--){
    const b = balls[bi];
    if(b.stuck){
      b.x = paddle.x + paddle.w/2;
      b.y = paddle.y - b.r - 2;
      continue;
    }
    b.x += b.vx*dt;
    b.y += b.vy*dt;

    // walls
    if(b.x < b.r){ b.x=b.r; b.vx=Math.abs(b.vx); beep(200,.04,'square',.06); }
    if(b.x > GW-b.r){ b.x=GW-b.r; b.vx=-Math.abs(b.vx); beep(200,.04,'square',.06); }
    if(b.y < WALL_TOP+b.r){ b.y=WALL_TOP+b.r; b.vy=Math.abs(b.vy); beep(200,.04,'square',.06); }

    // paddle
    if(b.vy>0 && b.y+b.r >= paddle.y && b.y-b.r <= paddle.y+paddle.h &&
       b.x >= paddle.x-4 && b.x <= paddle.x+paddle.w+4){
      const hit = (b.x - (paddle.x+paddle.w/2)) / (paddle.w/2); // -1..1
      const ang = hit * (Math.PI*0.38);
      const sp = Math.min(620, b.speed + 4);
      b.speed = sp;
      b.vx = Math.sin(ang)*sp;
      b.vy = -Math.cos(ang)*sp;
      b.y = paddle.y - b.r - 1;
      combo = 0;
      beep(330,.06,'triangle',.12,120);
    }

    // bricks
    for(const blk of blocks){
      if(!blk.alive) continue;
      if(b.x+b.r < blk.x || b.x-b.r > blk.x+blk.w || b.y+b.r < blk.y || b.y-b.r > blk.y+blk.h) continue;
      // resolve side
      const oxL = (b.x+b.r)-blk.x, oxR = (blk.x+blk.w)-(b.x-b.r);
      const oyT = (b.y+b.r)-blk.y, oyB = (blk.y+blk.h)-(b.y-b.r);
      const m = Math.min(oxL,oxR,oyT,oyB);
      if(m===oxL){ b.vx=-Math.abs(b.vx); b.x=blk.x-b.r; }
      else if(m===oxR){ b.vx=Math.abs(b.vx); b.x=blk.x+blk.w+b.r; }
      else if(m===oyT){ b.vy=-Math.abs(b.vy); b.y=blk.y-b.r; }
      else { b.vy=Math.abs(b.vy); b.y=blk.y+blk.h+b.r; }

      blk.hp--;
      combo++;
      score += 10*combo*Math.max(1,level-1>2?2:1);
      if(blk.hp<=0){
        blk.alive=false;
        burst(blk.x+blk.w/2, blk.y+blk.h/2, blk.color, 14);
        dropPowerup(blk.x+blk.w/2, blk.y+blk.h/2);
        shake = 5;
        beep(520+combo*30,.07,'square',.1,80);
      } else {
        burst(b.x,b.y,'#ffffff',4);
        beep(260,.05,'square',.08);
      }
      break;
    }

    // fell off bottom
    if(b.y - b.r > GH){
      balls.splice(bi,1);
      if(balls.length===0) loseLife();
    }
  }

  // powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p = powerups[i];
    p.y += p.vy*dt;
    if(p.y > GH+20){ powerups.splice(i,1); continue; }
    if(p.y+p.r >= paddle.y && p.y-p.r <= paddle.y+paddle.h &&
       p.x >= paddle.x-6 && p.x <= paddle.x+paddle.w+6){
      applyPowerup(p);
      burst(p.x,p.y,p.color,10);
      powerups.splice(i,1);
    }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 400*dt;
  }

  shake = Math.max(0, shake - dt*30);

  // level cleared
  if(blocks.every(b=>!b.alive)){
    level++;
    if(level>6){ winGame(); return; }
    score += 500;
    paddle.targetW = PADDLE_W;
    resetLevel(level);
    balls = [ newBall(true) ];
    balls[0].speed = 380 + (level-1)*40;
    powerups = [];
    beep(660,.2,'sine',.2,400);
  }
}

function loseLife(){
  lives--;
  combo = 0;
  paddle.targetW = PADDLE_W;
  shake = 12;
  if(lives<=0){
    state = STATE.LOSE;
    saveHigh();
    beep(160,.5,'sawtooth',.2,-120);
  } else {
    balls = [ newBall(true) ];
    balls[0].speed = Math.min(560, balls.length? 380 : 380 + (level-1)*40);
    beep(150,.3,'sawtooth',.15,-80);
  }
}

function winGame(){
  state = STATE.WIN;
  saveHigh();
  beep(880,.4,'sine',.2,400);
}

function saveHigh(){
  if(score>highScore){
    highScore = score;
    try{ localStorage.setItem('neonBreakoutHi', String(highScore)); }catch(e){}
  }
}

// ---------- Draw ----------
function drawBlock(b){
  ctx.save();
  ctx.shadowColor = b.color;
  ctx.shadowBlur = 10;
  ctx.fillStyle = b.color;
  roundRect(b.x,b.y,b.w,b.h,4);
  ctx.fill();
  if(b.hp>1){
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,.7)';
    ctx.lineWidth=2;
    roundRect(b.x+3,b.y+3,b.w-6,b.h-6,3);
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawCenter(title, sub, extra){
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.shadowColor='#38bdf8';
  ctx.shadowBlur=25;
  ctx.font='bold 64px monospace';
  ctx.fillText(title, GW/2, GH/2-40);
  ctx.shadowBlur=0;
  ctx.font='20px monospace';
  ctx.fillStyle='#9fb4d8';
  ctx.fillText(sub, GW/2, GH/2+10);
  if(extra){
    ctx.font='16px monospace';
    ctx.fillStyle='#5f7396';
    ctx.fillText(extra, GW/2, GH/2+45);
  }
}

function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,GW,GH);

  // background grid
  ctx.strokeStyle='rgba(60,90,160,.08)';
  ctx.lineWidth=1;
  for(let x=0;x<GW;x+=45){ ctx.beginPath(); ctx.moveTo(x,WALL_TOP); ctx.lineTo(x,GH); ctx.stroke(); }
  for(let y=WALL_TOP;y<GH;y+=45){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(GW,y); ctx.stroke(); }

  if(state===STATE.MENU){
    // title screen
    drawCenter('NEON BREAKOUT','Press SPACE or ENTER to start',
      'Move: Mouse / A D / Arrows   ·   Launch: Space   ·   Pause: P   ·   Restart: R');
    ctx.fillStyle='#5f7396';
    ctx.font='16px monospace';
    ctx.textAlign='center';
    ctx.fillText('High Score: '+highScore, GW/2, GH/2+80);
    return;
  }

  // shake
  if(shake>0){
    ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  }

  // top wall
  ctx.fillStyle='#101a33';
  ctx.fillRect(0,0,GW,WALL_TOP);
  ctx.strokeStyle='rgba(80,140,255,.4)';
  ctx.beginPath(); ctx.moveTo(0,WALL_TOP); ctx.lineTo(GW,WALL_TOP); ctx.stroke();

  // HUD
  ctx.textAlign='left';
  ctx.font='bold 20px monospace';
  ctx.fillStyle='#fff';
  ctx.fillText('SCORE '+score, 16, 33);
  ctx.textAlign='center';
  ctx.fillStyle='#9fb4d8';
  ctx.fillText('LEVEL '+level+'   HI '+highScore, GW/2, 33);
  ctx.textAlign='right';
  ctx.fillStyle='#ff3b6b';
  let hearts=''; for(let i=0;i<lives;i++) hearts+='♥ ';
  ctx.fillText(hearts, GW-16, 33);

  // blocks
  for(const b of blocks) if(b.alive) drawBlock(b);

  // paddle
  const g = ctx.createLinearGradient(paddle.x,paddle.y,paddle.x+paddle.w,paddle.y);
  g.addColorStop(0,'#38bdf8'); g.addColorStop(.5,'#a78bfa'); g.addColorStop(1,'#38bdf8');
  ctx.save();
  ctx.shadowColor='#38bdf8'; ctx.shadowBlur=15;
  ctx.fillStyle=g;
  roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);
  ctx.fill();
  ctx.restore();

  // balls
  for(const b of balls){
    ctx.save();
    ctx.shadowColor='#fff'; ctx.shadowBlur=14;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
    if(b.stuck && state===STATE.PLAY){
      ctx.textAlign='center';
      ctx.font='14px monospace';
      ctx.fillStyle='#9fb4d8';
      ctx.fillText('SPACE to launch', GW/2, GH-70);
    }
  }

  // powerups
  for(const p of powerups){
    ctx.save();
    ctx.shadowColor=p.color; ctx.shadowBlur=12;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#05060f';
    ctx.font='bold 14px monospace';
    ctx.textAlign='center';
    ctx.fillText(p.label, p.x, p.y+5);
  }

  // particles
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;

  // overlays
  if(state===STATE.PAUSE) drawCenter('PAUSED','Press P or SPACE to resume','R to restart');
  else if(state===STATE.WIN) drawCenter('YOU WIN!','Score: '+score,'SPACE / ENTER to play again');
  else if(state===STATE.LOSE) drawCenter('GAME OVER','Score: '+score+'   ·   High: '+highScore,'SPACE / ENTER to try again');
}

// ---------- Loop ----------
let last = performance.now();
function loop(now){
  let dt = (now-last)/1000;
  last = now;
  if(dt>0.05) dt=0.05;
  if(state===STATE.PLAY) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
