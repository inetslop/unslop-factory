<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frogger Pac-Man</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060a}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const COLS=25,ROWS=15;
const PADS=[2,8,14,20];            // golden pads on row 0 (width 2)
const RIVER=[4,5,6,7],MEDIAN=8,STARTROW=14;
const ROCK={row:6,a:11,b:14};      // boulders: cols 11..13
let cell=0,ox=0,oy=0,W=0,Hh=0,T=0,last=0;

function resize(){W=cv.width=innerWidth;Hh=cv.height=innerHeight;
  cell=Math.min(W/COLS,Hh/ROWS);ox=(W-cell*COLS)/2;oy=(Hh-cell*ROWS)/2;}
addEventListener('resize',resize);resize();

/* ---------- audio (starts only after first input) ---------- */
let AC=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function beep(f0,f1,dur,type,vol,when){if(!AC)return;
  const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.05);}
const sEat=()=>beep(650,980,.07,'square',.12);
const sMove=()=>beep(220,320,.04,'triangle',.06);
const sDie=()=>beep(420,55,.5,'sawtooth',.22);
const sWin=()=>[440,554,659,880].forEach((f,i)=>beep(f,f,.14,'square',.14,i*.12));
const sPower=()=>{beep(240,1300,.5,'triangle',.18);beep(480,2600,.5,'sine',.1,.1);};

/* ---------- high score ---------- */
let HI=0;try{HI=parseInt(localStorage.getItem('frogman_hi')||'0',10)||0;}catch(e){}
function saveHI(){try{localStorage.setItem('frogman_hi',String(HI));}catch(e){}}

/* ---------- game state ---------- */
let S=null,keys={};
const rnd=(a,b)=>a+Math.random()*(b-a);

function makeLanes(){
  const L={},carCols=['#e74c3c','#f39c12','#9b59b6','#1abc9c','#ecf0f1'];
  for(let r=9;r<=13;r++){
    const dir=(r%2===1)?1:-1,sp=rnd(2.6,4.2)*(1+(13-r)*0.05),lanes=[];
    for(let i=0;i<3;i++){
      const truck=Math.random()<0.3;
      lanes.push({x:i*(COLS/3)+rnd(-1,1)-2,w:truck?rnd(2.4,3):rnd(1.4,1.8),dir,speed:sp*rnd(.9,1.15),
        kind:'car',truck,color:carCols[(r+i)%5],dx:0});
    }
    L[r]=lanes;
  }
  for(const r of RIVER){
    const dir=(r%2===0)?1:-1,lanes=[];
    if(r===6){for(let i=0;i<5;i++)lanes.push({x:i*6-3,w:1.0,dir,speed:rnd(.45,.7),kind:'turtle',pauseT:null,passing:false,dx:0});}
    else if(r===5){for(let i=0;i<8;i++)lanes.push({x:i*(COLS/8)-3,w:1.0,dir,speed:rnd(.4,.6),kind:'turtle',pauseT:null,passing:false,dx:0});}
    else{const n=r===4?3:4;for(let i=0;i<n;i++)lanes.push({x:i*(COLS/n)-3,w:rnd(2.8,3.6),dir,speed:rnd(1.8,2.6),kind:'log',dx:0});}
    L[r]=lanes;
  }
  return L;
}
function makePellets(){
  const P=[];
  for(let r=MEDIAN;r<=13;r++)for(let c=1;c<COLS-1;c++)if(Math.random()<0.26)P.push({x:c+0.5,y:r});
  while(P.length<25)P.push({x:Math.floor(rnd(1,COLS-1))+0.5,y:Math.floor(rnd(MEDIAN,14))});
  return P;
}
function startGame(){
  S={state:'play',score:0,lives:3,homes:0,px:COLS/2,py:STARTROW,cd:0,powerT:0,dieT:0,face:1,msg:'',msgT:0};
  S.lanes=makeLanes();S.pellets=makePellets();
}

/* ---------- helpers ---------- */
const overlap=(px,v)=>Math.abs(px-(v.x+v.w/2))<v.w/2+0.28;
function riding(){if(S.py<4||S.py>7)return false;const L=S.lanes[S.py];return L?L.some(v=>overlap(S.px,v)):false;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- update ---------- */
function die(){S.lives--;sDie();S.state='dying';S.dieT=1.1;saveHI();}
function update(dt){
  T+=dt;if(!S)return;
  if(S.state==='dying'){S.dieT-=dt;
    if(S.dieT<=0){if(S.lives>0){S.state='play';S.px=COLS/2;S.py=STARTROW;S.cd=0.4;}
      else{S.state='gameover';saveHI();}}return;}
  if(S.state!=='play')return;
  S.cd-=dt;if(S.powerT>0)S.powerT-=dt;if(S.msgT>0)S.msgT-=dt;

  // held-key movement
  let dx=0,dy=0;
  if(keys.ArrowUp||keys.KeyW)dy=-1;
  else if(keys.ArrowDown||keys.KeyS)dy=1;
  else if(keys.ArrowLeft||keys.KeyA)dx=-1;
  else if(keys.ArrowRight||keys.KeyD)dx=1;
  if((dx||dy)&&S.cd<=0){
    S.px=Math.min(COLS-0.5,Math.max(0.5,S.px+dx));
    S.py=Math.min(ROWS-1,Math.max(0,S.py+dy));
    if(dx)S.face=dx;S.cd=0.13;sMove();
  }

  // vehicles
  for(const r in S.lanes){
    for(const v of S.lanes[r]){
      let sp=v.speed,moving=true;
      if(v.kind==='turtle'&&+r===ROCK.row){
        const ov=v.x<ROCK.b&&v.x+v.w>ROCK.a;
        if(ov&&!v.passing){if(v.pauseT==null)v.pauseT=1.0;v.pauseT-=dt;
          if(v.pauseT<=0){v.passing=true;v.pauseT=null;}moving=false;}
        else if(v.passing){sp*=3;if(!ov)v.passing=false;}
      }
      v.dx=v.dir*sp*dt*(moving?1:0);v.x+=v.dx;
      if(v.x<-5)v.x=COLS+2;if(v.x>COLS+5)v.x=-2;
    }
  }

  // carried by log / turtle
  const L=S.lanes[S.py];
  if(L)for(const v of L){if(overlap(S.px,v)){S.px+=v.dx;break;}}
  S.px=Math.min(COLS-0.5,Math.max(0.5,S.px));

  // eat pellets
  for(let i=S.pellets.length-1;i>=0;i--){const p=S.pellets[i];
    if(p.y===S.py&&Math.abs(p.x-S.px)<0.62){S.pellets.splice(i,1);S.score+=10;sEat();}}
  if(S.pellets.length===0){S.score+=500;S.powerT=6;S.msg='ALL CLEAR! +500 — POWER MODE!';S.msgT=2.2;
    sPower();S.pellets=makePellets();}

  // reach a golden pad
  if(S.py===0)for(const p of PADS){
    if(S.px>=p&&S.px<=p+2){const b=500+S.homes*250;S.score+=b;S.homes++;sWin();
      S.msg='HOME! +'+b;S.msgT=1.8;S.px=COLS/2;S.py=STARTROW;S.cd=0.4;break;}}
  if(S.score>HI)HI=S.score;

  // hazards (power mode = invincible, cars turn blue)
  if(S.powerT<=0){
    for(const r in S.lanes){if(+r!==S.py)continue;
      for(const v of S.lanes[r])if(v.kind==='car'&&overlap(S.px,v)){die();return;}}
    if(S.py>=4&&S.py<=7&&!riding()&&!(S.py===ROCK.row&&S.px>=ROCK.a&&S.px<ROCK.b))die();
  }
}

/* ---------- drawing ---------- */
function drawPac(x,y,r,face,mouth,color,alpha){
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;
  ctx.translate(x,y);if(face<0)ctx.scale(-1,1);
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,0);
  ctx.arc(0,0,r,mouth,Math.PI*2-mouth);ctx.closePath();ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(r*0.25,-r*0.45,r*0.14,0,7);ctx.fill();
  ctx.restore();
}

function drawBoard(){
  const c=cell;
  for(let r=0;r<ROWS;r++){
    let col;
    if(r===0)col='#12351a';
    else if(r>=4&&r<=7)col='#0b2a4a';
    else if(r===MEDIAN||r===STARTROW)col='#3d2f16';
    else col='#1c1c22';
    ctx.fillStyle=col;ctx.fillRect(ox,oy+r*c,COLS*c,c);
  }
  // road dashes
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=Math.max(1,c*0.05);
  ctx.setLineDash([c*0.4,c*0.5]);
  for(let r=9;r<=13;r++){ctx.beginPath();ctx.moveTo(ox,oy+r*c);ctx.lineTo(ox+COLS*c,oy+r*c);ctx.stroke();}
  ctx.setLineDash([]);

  // golden pads
  for(const p of PADS){const x=ox+p*c;
    ctx.fillStyle='rgba(255,215,0,.18)';ctx.fillRect(x+3,oy+3,2*c-6,c-6);
    ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.strokeRect(x+3,oy+3,2*c-6,c-6);}

  // boulders
  for(let i=0;i<3;i++){const cx=ox+(ROCK.a+i+0.5)*c,cy=oy+(ROCK.row+0.5)*c;
    ctx.fillStyle='#8d9099';ctx.beginPath();ctx.arc(cx,cy,c*0.38,0,7);ctx.fill();
    ctx.fillStyle='#b9bcc6';ctx.beginPath();ctx.arc(cx-c*0.1,cy-c*0.12,c*0.16,0,7);ctx.fill();}

  // pellets
  ctx.fillStyle=S.powerT>0?'#8ffcff':'#ffe9b8';
  for(const p of S.pellets){ctx.beginPath();ctx.arc(ox+p.x*c,oy+(p.y+0.5)*c,c*0.07,0,7);ctx.fill();}

  // vehicles
  for(const r in S.lanes){const y=oy+r*c;
    for(const v of S.lanes[r]){const x=ox+v.x*c,w=v.w*c;
      if(v.kind==='car'){
        const blue=S.powerT>0;
        ctx.fillStyle=blue?'#3b62ff':v.color;rr(x+1,y+c*0.15,w-2,c*0.7,4);ctx.fill();
        ctx.fillStyle=blue?'#a8c0ff':'rgba(18,18,30,.85)';
        ctx.fillRect(x+w*0.14,y+c*0.28,w*0.26,c*0.3);ctx.fillRect(x+w*0.58,y+c*0.28,w*0.26,c*0.3);
        ctx.fillStyle='#fff7ae';
        ctx.fillRect(v.dir>0?x+w-3:x+1,y+c*0.2,2,c*0.15);
        ctx.fillRect(v.dir>0?x+w-3:x+1,y+c*0.65,2,c*0.15);
      }else if(v.kind==='log'){
        ctx.fillStyle='#7a4a1f';rr(x+1,y+c*0.12,w-2,c*0.76,6);ctx.fill();
        ctx.strokeStyle='#5d3714';ctx.lineWidth=Math.max(1,c*0.05);
        for(let k=1;k<3;k++){ctx.beginPath();ctx.moveTo(x+4,y+c*0.12+k*c*0.25);
          ctx.lineTo(x+w-4,y+c*0.12+k*c*0.25);ctx.stroke();}
      }else{ // turtle
        const cx=x+w/2,cy=y+c*0.5;
        ctx.fillStyle='#3fae4c';
        ctx.beginPath();ctx.arc(cx+v.dir*w*0.42,cy,c*0.16,0,7);ctx.fill(); // head
        ctx.fillStyle='#2e8b3d';ctx.beginPath();ctx.ellipse(cx,cy,w*0.42,c*0.32,0,0,7);ctx.fill();
        ctx.strokeStyle='#1f6b2c';ctx.lineWidth=Math.max(1,c*0.05);
        for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(cx,k*w*0.18,w*0.3,0,7);ctx.stroke();}
      }
    }}

  // player
  if(S.state!=='gameover'){
    const x=ox+S.px*c,y=oy+(S.py+0.5)*c;
    let color='#ffe135';
    if(S.powerT>0)color=Math.sin(T*20)>0?'#ffffff':'#7ef9ff';
    if(S.state==='dying'){
      drawPac(x,y,c*0.42,S.face,1.2,color,Math.max(0,S.dieT/1.1));
      ctx.strokeStyle='rgba(255,80,80,'+Math.max(0,S.dieT/1.1)+')';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(x,y,c*(1.6-S.dieT*0.9),0,7);ctx.stroke();
    }else{
      drawPac(x,y,c*0.42,S.face,0.18+0.3*Math.abs(Math.sin(T*9)),color,1);
    }
  }

  // HUD
  const fs=Math.round(Math.max(13,c*0.55)),hy=oy>36?oy-10:c*0.7;
  ctx.font='bold '+fs+'px "Courier New",monospace';ctx.fillStyle='#fff';
  ctx.textAlign='left';ctx.fillText('SCORE '+S.score,ox+8,hy);
  ctx.textAlign='center';ctx.fillText('HI '+HI,W/2,hy);
  for(let i=0;i<S.lives;i++)drawPac(ox+COLS*c-30-i*c*0.8,hy-5,c*0.26,1,0.5,'#ffe135',1);

  // message
  if(S.msgT>0){ctx.globalAlpha=Math.min(1,S.msgT);
    ctx.font='bold '+Math.round(c*0.9)+'px "Courier New",monospace';
    ctx.fillStyle='#ffd700';ctx.textAlign='center';
    ctx.fillText(S.msg,W/2,oy+ROWS*c*0.45);ctx.globalAlpha=1;}

  if(S.state==='gameover'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(ox,oy,COLS*c,ROWS*c);
    ctx.textAlign='center';ctx.fillStyle='#ff5252';
    ctx.font='bold '+Math.round(c*1.6)+'px "Courier New",monospace';
    ctx.fillText('GAME OVER',W/2,oy+ROWS*c*0.38);
    ctx.fillStyle='#fff';ctx.font='bold '+Math.round(c*0.9)+'px "Courier New",monospace';
    ctx.fillText('SCORE  '+S.score+'     HI  '+HI,W/2,oy+ROWS*c*0.52);
    if(Math.sin(T*5)>-0.3){ctx.fillStyle='#ffe135';
      ctx.fillText('PRESS ENTER OR R TO PLAY AGAIN',W/2,oy+ROWS*c*0.66);}
  }
}

function drawStartScreen(){
  const c=cell;
  ctx.fillStyle='#0a0f1e';ctx.fillRect(0,0,W,Hh);
  // decorative road strip with a car, log and pellets
  const y0=Hh*0.42,h=Math.min(Hh*0.14,c*3);
  ctx.fillStyle='#1c1c22';ctx.fillRect(0,y0,W,h);
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.setLineDash([20,22]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,y0+h/2);ctx.lineTo(W,y0+h/2);ctx.stroke();ctx.setLineDash([]);
  const carX=((T*120)%(W+200))-100;
  ctx.fillStyle='#e74c3c';rr(carX,y0+h*0.18,90,h*0.64,6);ctx.fill();
  ctx.fillStyle='rgba(18,18,30,.85)';ctx.fillRect(carX+14,y0+h*0.3,24,h*0.3);ctx.fillRect(carX+52,y0+h*0.3,24,h*0.3);
  ctx.fillStyle='#7a4a1f';rr(W-carX,y0+h*0.18,130,h*0.64,8);ctx.fill();
  for(let i=0;i<9;i++){ctx.fillStyle='#ffe9b8';
    ctx.beginPath();ctx.arc(30+i*(W-60)/8,y0-h*0.25,4,0,7);ctx.fill();}
  drawPac(carX+135,y0+h/2,h*0.42,1,0.4+0.35*Math.abs(Math.sin(T*8)),'#ffe135',1);

  ctx.textAlign='center';
  ctx.fillStyle='#ffd700';ctx.font='bold '+Math.round(Math.min(W*0.11,64))+'px "Courier New",monospace';
  ctx.fillText('FROGGER',W/2,Hh*0.18);
  ctx.fillStyle='#4dd9ff';ctx.fillText('PAC-MAN',W/2,Hh*0.30);

  ctx.fillStyle='#cfd6e4';ctx.font=Math.round(Math.max(13,W*0.016))+'px "Courier New",monospace';
  const ly=Hh*0.60,lg=Hh*0.055;
  ctx.fillText('ARROWS / WASD — move      R — restart      ENTER / SPACE — start',W/2,ly);
  ctx.fillStyle='#9fb0c8';
  ctx.fillText('Hop across the traffic and ride logs & turtles over the water.',W/2,ly+lg);
  ctx.fillText('Turtles stop at the boulders. Eat EVERY pellet for POWER MODE:',W/2,ly+lg*2);
  ctx.fillStyle='#7ef9ff';
  ctx.fillText('drive straight through traffic! Reach a golden pad to win points.',W/2,ly+lg*3);

  ctx.fillStyle='#fff';ctx.font='bold '+Math.round(Math.max(14,W*0.02))+'px "Courier New",monospace';
  ctx.fillText('HI SCORE  '+HI,W/2,ly+lg*4.6);
  if(Math.sin(T*5)>-0.3){ctx.fillStyle='#ffe135';
    ctx.font='bold '+Math.round(Math.max(18,W*0.026))+'px "Courier New",monospace';
    ctx.fillText('PRESS ENTER TO START',W/2,Hh*0.9);}
}

function draw(){
  ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,Hh);
  if(!S)drawStartScreen();else drawBoard();
}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  initAudio();
  const k=e.code;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(k)>=0)e.preventDefault();
  keys[k]=true;
  if((k==='Enter'||k==='Space')&&(!S||S.state==='gameover'))startGame();
  if(k==='KeyR'&&S)startGame();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('pointerdown',()=>{initAudio();if(!S||S.state==='gameover')startGame();});

/* ---------- loop ---------- */
function frame(t){const dt=Math.min(0.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
