<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Runner</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a1030;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W=0,H=0,gy=0,px=0;

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;gy=H-80;px=Math.max(110,W*0.16);}
window.addEventListener('resize',resize);resize();

/* ---------- Audio (Web Audio API, starts after first input) ---------- */
var AC=null;
function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function beep(freq,dur,type,vol,sweepTo){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(freq,t);
  if(sweepTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,sweepTo),t+dur);
  g.gain.setValueAtTime(vol||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfx(name){
  if(!AC)return;
  switch(name){
    case 'jump':beep(300,0.18,'square',0.12,650);break;
    case 'slash':beep(900,0.12,'sawtooth',0.14,200);break;
    case 'fire':beep(200,0.3,'sawtooth',0.16,900);break;
    case 'shield':beep(440,0.25,'triangle',0.18,880);setTimeout(function(){beep(660,0.25,'triangle',0.14,990);},80);break;
    case 'hit':beep(140,0.35,'sawtooth',0.22,50);break;
    case 'kill':beep(520,0.12,'square',0.14,1200);break;
    case 'block':beep(700,0.2,'triangle',0.18,300);break;
    case 'over':[440,330,220,110].forEach(function(f,i){setTimeout(function(){beep(f,0.3,'sawtooth',0.18);},i*160);});break;
    case 'start':beep(440,0.12,'square',0.14,880);break;
  }
}

/* ---------- Game state ---------- */
var state='start'; // start | play | over
var player,enemies,fireballs,particles,clouds,hillSeeds;
var speed,elapsed,spawnT,score,kills,dist,shake,cardRects=[];
var best=0;
try{best=parseInt(localStorage.getItem('cardrunner_best')||'0',10)||0;}catch(e){}

var cards=[
  {name:'SLASH',   key:'1', cd:0, maxCd:0.9, type:'slash'},
  {name:'FIREBALL',key:'2', cd:0, maxCd:1.6, type:'fire'},
  {name:'SHIELD',  key:'3', cd:0, maxCd:5.0, type:'shield'},
  {name:'JUMP',    key:'4', cd:0, maxCd:0,   type:'jump'}
];

function newClouds(){
  clouds=[];for(var i=0;i<6;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*(H*0.35),s:0.7+Math.random()*0.8});
}
function hillSeed(){return Math.floor(Math.random()*1000);}

function reset(){
  player={y:gy,vy:0,onGround:true,lives:3,shieldT:0,invuln:0,slashT:0,squash:0};
  enemies=[];fireballs=[];particles=[];cardRects=[];
  speed=230;elapsed=0;spawnT=1.2;score=0;kills=0;dist=0;shake=0;
  cards.forEach(function(c){c.cd=0;});
  newClouds();hillSeeds=[];for(var i=0;i<40;i++)hillSeeds.push(Math.random());
}
reset();

function startGame(){ensureAudio();reset();state='play';sfx('start');}
function gameOver(){
  state='over';sfx('over');
  if(score>best){best=score;try{localStorage.setItem('cardrunner_best',''+best);}catch(e){}}
}

/* ---------- Spawning & enemies ---------- */
function spawnEnemy(){
  var r=Math.random(),type;
  if(r<0.42)type='slime';else if(r<0.72)type='spike';else type='bat';
  var e={type:type,x:W+60,t:Math.random()*10};
  if(type==='slime'){e.w=44;e.h=34;e.y=gy;}
  else if(type==='spike'){e.w=48;e.h=52;e.y=gy;}
  else{e.w=46;e.h=30;e.baseY=gy-120-Math.random()*40;e.y=e.baseY;}
  enemies.push(e);
}
function enemyRect(e){
  if(e.type==='bat')return {x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h};
  return {x:e.x-e.w/2,y:e.y-e.h,w:e.w,h:e.h};
}
function burst(x,y,color,n,sp){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,v=(0.3+Math.random())*(sp||180);
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0.5+Math.random()*0.4,maxLife:0.9,color:color,size:2+Math.random()*4});
  }
}

/* ---------- Card actions ---------- */
function playerRect(){return {x:px-17,y:player.y-56,w:34,h:56};}
function playCard(i){
  if(state!=='play')return;
  var c=cards[i];if(c.cd>0)return;
  c.cd=c.maxCd;
  switch(c.type){
    case 'jump':
      if(player.onGround){player.vy=-Math.sqrt(2*1500*165);player.onGround=false;sfx('jump');burst(px,gy,'#c8b07a',6,120);}break;
    case 'slash':
      player.slashT=0.2;sfx('slash');
      enemies=enemies.filter(function(e){
        if(e.x>px-30&&e.x<px+150){burst(e.x,e.y-e.h/2,'#ffd76a',14,200);kills++;score+=15;burst(e.x,e.y-e.h/2,'#fff',6,140);sfx('kill');return false;}
        return true;
      });break;
    case 'fire':
      sfx('fire');
      fireballs.push({x:px+30,y:player.y-34,r:9});break;
    case 'shield':
      player.shieldT=2.5;sfx('shield');burst(px,player.y-30,'#7fd4ff',18,160);break;
  }
}

/* ---------- Update ---------- */
function update(dt){
  // clouds always drift
  for(var ci=0;ci<clouds.length;ci++){
    var cl=clouds[ci];cl.x-=(state==='play'?speed*0.15:20)*dt*cl.s;
    if(cl.x<-120){cl.x=W+120;cl.y=30+Math.random()*(H*0.35);}
  }
  particles=particles.filter(function(p){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;return p.life>0;});

  if(state!=='play')return;

  elapsed+=dt;
  speed=Math.min(520,230+elapsed*7);
  dist+=speed*dt;
  score+=speed*dt*0.01;
  shake=Math.max(0,shake-dt*3);

  // player physics
  if(!player.onGround){
    player.vy+=1500*dt;player.y+=player.vy*dt;
    if(player.y>=gy){player.y=gy;player.vy=0;player.onGround=true;burst(px,gy,'#c8b07a',5,100);}
  }
  player.shieldT=Math.max(0,player.shieldT-dt);
  player.invuln=Math.max(0,player.invuln-dt);
  player.slashT=Math.max(0,player.slashT-dt);
  cards.forEach(function(c){c.cd=Math.max(0,c.cd-dt);});

  // spawning
  spawnT-=dt;
  var interval=Math.max(0.65,1.6-elapsed*0.02);
  if(spawnT<=0){spawnEnemy();spawnT=interval*(0.7+Math.random()*0.6);}

  // enemies
  var pr=playerRect();
  enemies=enemies.filter(function(e){
    e.x-=speed*dt;e.t+=dt;
    if(e.type==='bat')e.y=e.baseY+Math.sin(e.t*5)*14;
    if(e.x<-70){score+=2;return false;}
    var r=enemyRect(e);
    var overlap=pr.x<r.x+r.w&&pr.x+pr.w>r.x&&pr.y<r.y+r.h&&pr.y+pr.h>r.y;
    if(overlap&&player.invuln<=0){
      if(player.shieldT>0){
        player.shieldT=0;sfx('block');burst(e.x,e.y-e.h/2,'#7fd4ff',16,180);return false;
      }else{
        player.lives--;player.invuln=1.5;shake=1;sfx('hit');
        burst(px,player.y-30,'#ff5a5a',20,220);
        if(player.lives<=0)gameOver();
        return false;
      }
    }
    return true;
  });

  // fireballs
  fireballs=fireballs.filter(function(f){
    f.x+=(speed*1.6+420)*dt;
    particles.push({x:f.x-8,y:f.y+(Math.random()*12-6),vx:-60,vy:0,life:0.25,maxLife:0.25,color:'#ff9a3c',size:3});
    for(var i=0;i<enemies.length;i++){
      var e=enemies[i],r=enemyRect(e);
      if(f.x>f.x-r.w&&f.x>r.x&&f.x<r.x+r.w&&Math.abs(f.y-(e.y-e.h/2))<r.h/2+f.r){
        burst(e.x,e.y-e.h/2,'#ff9a3c',16,200);burst(e.x,e.y-e.h/2,'#fff',8,140);
        kills++;score+=15;sfx('kill');enemies.splice(i,1);return false;
      }
    }
    return f.x<W+40;
  });
}

/* ---------- Drawing helpers ---------- */
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(t,x,y,size,color,align,weight){ctx.fillStyle=color;ctx.font=(weight||'bold')+' '+size+'px "Courier New",monospace';ctx.textAlign=align||'center';ctx.fillText(t,x,y);}

function drawBackground(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b1a52');g.addColorStop(0.55,'#6a3d8f');g.addColorStop(1,'#c96a7e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle='rgba(255,214,140,0.9)';ctx.beginPath();ctx.arc(W*0.78,H*0.24,Math.max(30,H*0.06),0,7);ctx.fill();
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.5)';
  clouds.forEach(function(c){
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,44*c.s,16*c.s,0,0,7);
    ctx.ellipse(c.x+30*c.s,c.y-8*c.s,28*c.s,13*c.s,0,0,7);
    ctx.ellipse(c.x-28*c.s,c.y-5*c.s,24*c.s,11*c.s,0,0,7);
    ctx.fill();
  });
  // hills (parallax)
  var off=dist*0.35%900;
  ctx.fillStyle='#3d2b63';
  for(var i=-1;i<W/180+2;i++){
    var hx=i*180-off,seed=hillSeeds[((i+Math.floor(off/180))%40+40)%40];
    ctx.beginPath();ctx.arc(hx,gy,90+seed*70,Math.PI,0);ctx.fill();
  }
  // ground
  ctx.fillStyle='#4a3526';ctx.fillRect(0,gy,W,H-gy);
  ctx.fillStyle='#7fae4f';ctx.fillRect(0,gy,W,10);
  ctx.fillStyle='rgba(0,0,0,0.25)';
  var goff=dist%60;
  for(var d=-1;d<W/60+2;d++)ctx.fillRect(d*60-goff,gy+26+(d%2)*14,26,5);
}

function drawPlayer(){
  if(player.invuln>0&&Math.floor(player.invuln*12)%2===0)return;
  var x=px,y=player.y;
  ctx.save();ctx.translate(x,y);
  // shield bubble
  if(player.shieldT>0){
    ctx.strokeStyle='rgba(127,212,255,'+(0.4+0.4*Math.sin(elapsed*12))+')';
    ctx.lineWidth=3;ctx.fillStyle='rgba(127,212,255,0.12)';
    ctx.beginPath();ctx.arc(0,-30,46,0,7);ctx.fill();ctx.stroke();
  }
  // legs (run cycle)
  var run=Math.sin(elapsed*14)*8;
  ctx.strokeStyle='#2b2b45';ctx.lineWidth=6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-6,-14);ctx.lineTo(-6+run,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,-14);ctx.lineTo(6-run,0);ctx.stroke();
  // body
  ctx.fillStyle='#3b5bd6';roundRect(-14,-46,28,34,7);ctx.fill();
  ctx.fillStyle='#ffd76a';ctx.fillRect(-14,-30,28,5);
  // head + helmet
  ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-54,11,0,7);ctx.fill();
  ctx.fillStyle='#aab2d0';roundRect(-12,-68,24,14,5);ctx.fill();
  ctx.fillStyle='#ff5a5a';ctx.beginPath();ctx.moveTo(-2,-68);ctx.quadraticCurveTo(10,-84,4,-68);ctx.fill();
  // sword arm
  ctx.strokeStyle='#aab2d0';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(10,-38);ctx.lineTo(24,-30);ctx.stroke();
  ctx.restore();
  // slash arc
  if(player.slashT>0){
    var p=1-player.slashT/0.2;
    ctx.strokeStyle='rgba(255,255,255,'+(1-p)+')';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(x+8,y-34,20+p*120,-1.1,1.1);ctx.stroke();
  }
}

function drawEnemy(e){
  ctx.save();ctx.translate(e.x,e.y);
  if(e.type==='slime'){
    var sq=1+Math.sin(e.t*8)*0.12;
    ctx.fillStyle='#5ecf4a';
    ctx.beginPath();ctx.ellipse(0,-e.h/2*e.sq||-17,22,e.h/2*sq,0,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.ellipse(-8,-24,6,4,0,0,7);ctx.fill();
    ctx.fillStyle='#1c3a12';
    ctx.beginPath();ctx.arc(-6,-20,3,0,7);ctx.arc(7,-20,3,0,7);ctx.fill();
  }else if(e.type==='spike'){
    ctx.fillStyle='#8b93a8';
    for(var i=0;i<3;i++){
      var sx=(i-1)*16;
      ctx.beginPath();ctx.moveTo(sx-10,0);ctx.lineTo(sx,-e.h*(i===1?1:0.75));ctx.lineTo(sx+10,0);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle='#6a7288';ctx.fillRect(-26,-4,52,4);
  }else{ // bat
    var fl=Math.sin(e.t*16)*0.6;
    ctx.fillStyle='#5b3f8f';
    ctx.beginPath();
    ctx.moveTo(-6,-15);ctx.quadraticCurveTo(-30,-15+fl*22,-24,2+fl*8);ctx.quadraticCurveTo(-14,-4,-6,-8);ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(6,-15);ctx.quadraticCurveTo(30,-15+fl*22,24,2+fl*8);ctx.quadraticCurveTo(14,-4,6,-8);ctx.closePath();ctx.fill();
    ctx.fillStyle='#7a5cbf';ctx.beginPath();ctx.ellipse(0,-14,9,12,0,0,7);ctx.fill();
    ctx.fillStyle='#ffdd44';ctx.beginPath();ctx.arc(-3,-16,2,0,7);ctx.arc(3,-16,2,0,7);ctx.fill();
  }
  ctx.restore();
}

function drawFireball(f){
  var g=ctx.createRadialGradient(f.x,f.y,1,f.x,f.y,f.r+6);
  g.addColorStop(0,'#fff');g.addColorStop(0.4,'#ffcf5a');g.addColorStop(1,'rgba(255,90,30,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r+6,0,7);ctx.fill();
}

function drawCard(i){
  var c=cards[i],n=4,gap=14,cw=Math.min(92,(W-80-gap*(n-1))/n),ch=Math.min(120,cw*1.35);
  var total=n*cw+(n-1)*gap,x0=(W-total)/2,y0=H-ch-12;
  var x=x0+i*(cw+gap);
  cardRects[i]={x:x,y:y,y2:y+ch};
  // frame
  ctx.fillStyle='#fff8e7';roundRect(x,y,cw,ch,10);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=c.cd>0?'#b9a877':'#7a5c1e';ctx.stroke();
  // header band
  ctx.save();roundRect(x,y,cw,ch,10);ctx.clip();
  var cols={slash:'#4a6cd4',fire:'#e2662b',shield:'#3aa0d8',jump:'#57a94c'};
  ctx.fillStyle=cols[c.type];ctx.fillRect(x,y,cw,22);
  txt(c.name,x+cw/2,y+16,11,'#fff');
  // icon
  var cx=x+cw/2,cy=y+ch*0.5;
  if(c.type==='slash'){
    ctx.strokeStyle='#333';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(cx-18,cy+18);ctx.lineTo(cx+16,cy-16);ctx.stroke();
    ctx.strokeStyle='#7a5c1e';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(cx-6,cy+12);ctx.lineTo(cx+8,cy-2);ctx.stroke();
  }else if(c.type==='fire'){
    ctx.fillStyle='#ff7b2e';ctx.beginPath();ctx.arc(cx,cy,16,0,7);ctx.fill();
    ctx.fillStyle='#ffd94a';ctx.beginPath();ctx.arc(cx,cy-3,9,0,7);ctx.fill();
  }else if(c.type==='shield'){
    ctx.fillStyle='#2b7fb8';
    ctx.beginPath();ctx.moveTo(cx,cy-18);ctx.lineTo(cx+15,cy-12);ctx.lineTo(cx+15,cy+4);
    ctx.quadraticCurveTo(cx+15,cy+16,cx,cy+20);ctx.quadraticCurveTo(cx-15,cy+16,cx-15,cy+4);ctx.lineTo(cx-15,cy-12);ctx.closePath();ctx.fill();
  }else{
    ctx.fillStyle='#3c7a34';
    ctx.beginPath();ctx.moveTo(cx,cy-20);ctx.lineTo(cx+16,cy+2);ctx.lineTo(cx+7,cy+2);ctx.lineTo(cx+7,cy+18);
    ctx.lineTo(cx-7,cy+18);ctx.lineTo(cx-7,cy+2);ctx.lineTo(cx-16,cy+2);ctx.closePath();ctx.fill();
  }
  // key label
  txt(c.key,x+cw/2,y+ch-8,13,'#7a5c1e');
  // cooldown overlay
  if(c.cd>0){
    var f=c.cd/c.maxCd;
    ctx.fillStyle='rgba(20,14,40,'+(0.65*f+0.15)+')';
    ctx.fillRect(x,y,cw,ch*f);
    txt(c.cd.toFixed(1),x+cw/2,y+ch/2+5,18,'#fff');
  }else{
    ctx.strokeStyle='rgba(255,215,80,0.9)';ctx.lineWidth=2;roundRect(x-2,y-2,cw+4,ch+4,12);ctx.stroke();
  }
  ctx.restore();
}

function drawHUD(){
  txt('SCORE '+Math.floor(score),16,30,20,'#fff','left');
  txt('BEST '+best,16,54,13,'rgba(255,255,255,0.7)','left');
  for(var i=0;i<3;i++){
    var hx=W-30-i*30;
    ctx.fillStyle=i<player.lives?'#ff5a6e':'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(hx,14);ctx.bezierCurveTo(hx-12,4,hx-18,16,hx,28);
    ctx.bezierCurveTo(hx+18,16,hx+12,4,hx,14);ctx.fill();
  }
}

function drawCenterPanel(title,lines,big){
  ctx.fillStyle='rgba(15,8,35,0.72)';ctx.fillRect(0,0,W,H);
  var t=title;
  txt(t,W/2,H*0.28,Math.min(56,W*0.09),'#ffd76a');
  ctx.strokeStyle='#ffd76a';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(W/2-140,H*0.28+14);ctx.lineTo(W/2+140,H*0.28+14);ctx.stroke();
  lines.forEach(function(l,i){txt(l,W/2,H*(big?0.42:0.40)+i*30,l.size||16,l.color||'#fff');});
  var pulse=0.7+0.3*Math.sin(elapsed*4);
  ctx.globalAlpha=pulse;
  txt(big?'PRESS ENTER OR CLICK TO RESTART':'PRESS ENTER OR CLICK TO START',W/2,H*0.8,18,'#9fe8ff');
  ctx.globalAlpha=1;
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*14,(Math.random()-0.5)*shake*14);
  drawBackground();
  enemies.forEach(drawEnemy);
  fireballs.forEach(drawFireball);
  // particles
  particles.forEach(function(p){
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;
  if(state!=='start')drawPlayer();

  if(state==='play'){
    drawHUD();
    cards.forEach(function(c,i){drawCard(i);});
  }else if(state==='start'){
    drawCenterPanel('CARD RUNNER',[
      {t:'',size:0},
      'Enemies scroll toward you. Play cards to survive!',
      '[1] SLASH - cuts nearby enemies',
      '[2] FIREBALL - zaps the first enemy hit',
      '[3] SHIELD - blocks one incoming hit',
      '[4] / [SPACE] JUMP - leap over ground foes'
    ],false);
  }else{
    drawCenterPanel('GAME OVER',[
      'SCORE  '+Math.floor(score),
      'ENEMIES SLAIN  '+kills,
      'BEST  '+best
    ],true);
  }
  ctx.restore();
}

/* ---------- Loop ---------- */
var last=performance.now();
function loop(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  elapsed+=state==='play'?0:dt; // pulse timer even in menus (only when not playing to avoid double count)
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Input ---------- */
window.addEventListener('keydown',function(e){
  ensureAudio();
  var k=e.key.toLowerCase();
  if(k==='enter'||k===' '){if(state!=='play'){startGame();e.preventDefault();return;}}
  if(state==='over'&&(k==='r'||k==='enter')){startGame();return;}
  if(state!=='play')return;
  if(k==='1')playCard(0);
  else if(k==='2')playCard(1);
  else if(k==='3')playCard(2);
  else if(k==='4'||k===' '||k==='arrowup'){if(k!==' ')playCard(3);else playCard(3);}
});
canvas.addEventListener('pointerdown',function(e){
  ensureAudio();
  var r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(state==='play'){
    for(var i=0;i<cardRects.length;i++){
      var cr=cardRects[i];
      if(cr&&mx>=cr.x-4&&mx<=cr.x+Math.min(92,(W-80-42)) && my>=cr.y&&my<=cr.y2){playCard(i);return;}
    }
  }else startGame();
});
})();
</script>
