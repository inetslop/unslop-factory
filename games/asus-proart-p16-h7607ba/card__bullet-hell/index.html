<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Storm — Bullet Hell</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e1a;}
  canvas{display:block;position:absolute;top:0;left:0;}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif;color:#fff;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

/* ---------- AUDIO ---------- */
let AC=null,master=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.25;master.connect(AC.destination);
  }catch(e){}
}
function tone(f,dur,type,vol,slideTo){
  if(!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(vol||0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol){
  if(!AC)return;
  const t=AC.currentTime,len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;
  g.gain.setValueAtTime(vol||0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(g);g.connect(master);s.start(t);
}
const sfx={
  shoot(){tone(880,0.06,'square',0.12,440);},
  hit(){noise(0.12,0.35);tone(220,0.1,'sawtooth',0.2,90);},
  boom(){noise(0.3,0.5);tone(110,0.3,'triangle',0.4,40);},
  hurt(){noise(0.4,0.6);tone(160,0.45,'sawtooth',0.5,50);},
  wave(){tone(440,0.12,'triangle',0.35);setTimeout(()=>tone(660,0.18,'triangle',0.35),120);},
  click(){tone(600,0.05,'square',0.2);}
};

/* ---------- INPUT ---------- */
const keys={};
window.addEventListener('keydown',e=>{
  initAudio();
  if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  keys[e.code]=true;
  if(mode==='start'&&(e.code==='Space'||e.code==='Enter'))startGame();
  else if(mode==='over'&&(e.code==='KeyR'||e.code==='Enter'))startGame();
  else if(mode==='playing'&&e.code==='KeyP')paused=!paused;
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('mousedown',()=>{initAudio();if(mode==='start'||mode==='over')startGame();});

/* ---------- GAME STATE ---------- */
let mode='start',paused=false,time=0;
let score=0,lives=3,wave=1,shake=0,flash=0;
let player,bullets,ebullets,enemies,particles,floaters,bgGlyphs;
let spawnQueue=0,spawnTimer=0,waveDelay=0;

const SUITS=['♠','♥','♦','♣'];
const RANKS=['A','2','3','J','Q','K'];
function suitColor(s){return s==='♥'||s==='♦'?'#ff4d6a':'#e8ecf7';}

function makeBg(){
  bgGlyphs=[];
  for(let i=0;i<18;i++)bgGlyphs.push({x:Math.random()*W,y:Math.random()*H,s:30+Math.random()*60,sp:8+Math.random()*20,ch:SUITS[i%4],a:0.04+Math.random()*0.05});
}
function startGame(){
  sfx.click();
  score=0;lives=3;wave=1;shake=0;flash=0;paused=false;
  player={x:W/2,y:H-100,r:9,cd:0,inv:2,spread:false,suit:0};
  bullets=[];ebullets=[];enemies=[];particles=[];floaters=[];
  spawnQueue=5;spawnTimer=0.8;waveDelay=0;
  mode='playing';
}
function nextWave(){
  wave++;sfx.wave();
  spawnQueue=4+wave*2;
  spawnTimer=1.2;
  floaters.push({x:W/2,y:H*0.35,txt:'WAVE '+wave,t:1.6,size:38});
}

/* ---------- SPAWNING ---------- */
function spawnEnemy(){
  const r=Math.random();
  const x=60+Math.random()*(W-120);
  let type='sinker';
  if(wave>=2&&r<0.35)type='weaver';
  if(wave>=3&&r>0.8)type='spinner';
  const base={x:x,y:-40,t:0,rot:Math.random()*6,suit:SUITS[Math.floor(Math.random()*4)],rank:RANKS[Math.floor(Math.random()*RANKS.length)],flashT:0};
  if(type==='sinker'){Object.assign(base,{type,hp:2+Math.floor(wave/3),y:H*0.15+Math.random()*H*0.2,vy:40+wave*6,amp:40+Math.random()*60,frq:1+Math.random(),fireT:1+Math.random()});}
  if(type==='weaver'){Object.assign(base,{type,hp:3+Math.floor(wave/2),y:H*0.18+Math.random()*H*0.25,vx:(Math.random()<0.5?-1:1)*(90+wave*8),fireT:0.4});}
  if(type==='spinner'){Object.assign(base,{type,hp:6+wave,ty:H*0.2+Math.random()*H*0.15,phase:0,spinDir:Math.random()<0.5?-1:1,fireT:1.2,angOff:0});}
  enemies.push(base);
}

/* ---------- BULLETS ---------- */
function firePlayer(){
  player.suit=(player.suit+1)%4;
  const s=SUITS[player.suit];
  if(player.spread){
    for(const a of[-0.25,0,0.25])bullets.push({x:player.x,y:player.y-14,vx:Math.sin(a)*520,vy:-Math.cos(a)*520,s:s,t:0});
  }else{
    bullets.push({x:player.x,y:player.y-14,vx:0,vy:-620,s:s,t:0});
  }
  sfx.shoot();
}
function aimBullet(x,y,spreadN,spd){
  const ang=Math.atan2(player.y-y,player.x-x);
  for(let i=0;i<spreadN;i++){
    const a=ang+(i-(spreadN-1)/2)*0.22;
    ebullets.push({x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:6,ch:i%2?'♥':'♠',t:0});
  }
}
function ringBullets(x,y,n,spd,off){
  for(let i=0;i<n;i++){
    const a=off+i/n*Math.PI*2;
    ebullets.push({x:x,y:y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:6,ch:SUITS[i%4],t:0});
  }
}

/* ---------- EFFECTS ---------- */
function burst(x,y,color,n,pow){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(0.3+Math.random())*pow;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0.4+Math.random()*0.5,life:0.9,c:color,s:2+Math.random()*3});
  }
}

/* ---------- UPDATE ---------- */
function update(dt){
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*20);
  if(flash>0)flash-=dt;
  for(const g of bgGlyphs){g.y+=g.sp*dt;if(g.y>H+80){g.y=-80;g.x=Math.random()*W;}}

  if(mode!=='playing'||paused)return;

  // player
  const p=player;
  p.inv-=dt;p.cd-=dt;
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA'])dx--;
  if(keys['ArrowRight']||keys['KeyD'])dx++;
  if(keys['ArrowUp']||keys['KeyW'])dy--;
  if(keys['ArrowDown']||keys['KeyS'])dy++;
  const len=Math.hypot(dx,dy)||1;
  p.x+=dx/len*320*dt;p.y+=dy/len*320*dt;
  p.x=Math.max(16,Math.min(W-16,p.x));p.y=Math.max(H*0.45,Math.min(H-24,p.y));
  p.spread=!!keys['ShiftLeft']||!!keys['ShiftRight'];
  if(p.cd<=0){firePlayer();p.cd=p.spread?0.28:0.13;}

  // spawning
  if(spawnQueue>0){
    spawnTimer-=dt;
    if(spawnTimer<=0){spawnEnemy();spawnQueue--;spawnTimer=Math.max(0.25,1.1-wave*0.06);}
  }else if(enemies.length===0&&ebullets.length===0){
    waveDelay+=dt;
    if(waveDelay>1)nextWave();
  }

  // bullets (player cards)
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t+=dt;
    if(b.y<-30||b.x<-20||b.x>W+20)bullets.splice(i,1);
  }

  // enemies
  const spdMul=1+wave*0.04;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.t+=dt;if(e.flashT>0)e.flashT-=dt;
    if(e.type==='sinker'){
      e.y+=e.vy*dt;e.x+=Math.sin(e.t*e.frq)*e.amp*dt;
      e.fireT-=dt;
      if(e.fireT<=0&&e.y>0){aimBullet(e.x,e.y+14,1+(wave>5?1:0),150*spdMul);e.fireT=Math.max(0.7,1.8-wave*0.1);}
    }else if(e.type==='weaver'){
      e.x+=e.vx*dt;
      if((e.vx<0&&e.x<30)||(e.vx>0&&e.x>W-30))e.vx*=-1;
      e.fireT-=dt;
      if(e.fireT<=0){aimBullet(e.x,e.y+14,3,170*spdMul);e.fireT=Math.max(0.8,2-wave*0.1);}
    }else if(e.type==='spinner'){
      if(e.y<e.ty)e.y+=90*dt;
      else{
        e.phase+=dt*e.spinDir*(1+wave*0.1);
        e.fireT-=dt;
        if(e.fireT<=0){ringBullets(e.x,e.y,8+Math.floor(wave/2),130*spdMul,e.phase);e.fireT=Math.max(0.9,1.6-wave*0.08);}
      }
    }
    // offscreen cleanup
    if(e.y>H+60||e.x<-80||e.x>W+80){enemies.splice(i,1);continue;}
    // hit by player bullets
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<24){
        e.hp--;e.flashT=0.08;bullets.splice(j,1);
        burst(b.x,b.y,'#ffd76a',4,120);
        sfx.hit();
        break;
      }
    }
    if(e.hp<=0){
      const val=e.type==='spinner'?50:e.type==='weaver'?25:10;
      score+=val;
      burst(e.x,e.y,suitColor(e.suit),e.type==='spinner'?30:16,220);
      burst(e.x,e.y,'#ffd76a',10,180);
      sfx.boom();shake=Math.min(6,shake+ (e.type==='spinner'?5:2));
      floaters.push({x:e.x,y:e.y,txt:'+'+val,t:0.9,size:18});
      enemies.splice(i,1);continue;
    }
  }

  // enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.t+=dt;
    if(b.y>H+30||b.y<-40||b.x<-30||b.x>W+30){ebullets.splice(i,1);continue;}
    if(p.inv<=0&&Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r){
      ebullets.splice(i,1);
      hurtPlayer();
    }
  }

  // particles & floaters
  for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.t-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.98;q.vy*=0.98;if(q.t<=0)particles.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t-=dt;f.y-=30*dt;if(f.t<=0)floaters.splice(i,1);}

  // enemy body collision with player
  if(p.inv<=0){
    for(const e of enemies){
      if(Math.hypot(e.x-p.x,e.y-p.y)<24+p.r){hurtPlayer();break;}
    }
  }
}
function hurtPlayer(){
  lives--;sfx.hurt();shake=8;flash=0.35;player.inv=1.6;
  burst(player.x,player.y,'#ffd76a',24,260);
  if(lives<=0){
    mode='over';
    try{localStorage.setItem('cardstorm_best',Math.max(score,+(localStorage.getItem('cardstorm_best')||0)));}catch(e){}
  }
}

/* ---------- DRAWING ---------- */
function drawCard(x,y,w,h,suit,rank,border,rot,flash){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.fillStyle=flash?'#ffffff':'#f4f1e6';
  ctx.strokeStyle=border||'#2a2f45';ctx.lineWidth=1.5;
  const r=w*0.18;
  ctx.beginPath();
  ctx.moveTo(-w/2+r,-h/2);ctx.arcTo(w/2,-h/2,w/2,h/2,r);ctx.arcTo(w/2,h/2,-w/2,h/2,r);ctx.arcTo(-w/2,h/2,-w/2,-h/2,r);ctx.arcTo(-w/2,-h/2,w/2,-h/2,r);
  ctx.closePath();ctx.fill();ctx.stroke();
  const c=suitColor(suit);
  ctx.fillStyle=c;ctx.textAlign='center';ctx.textBaseline='middle';
  if(rank){
    ctx.font='bold '+Math.floor(h*0.32)+'px Georgia';
    ctx.fillText(rank,-w/2+w*0.18,-h/2+h*0.2);
  }
  ctx.font=Math.floor(h*(rank?0.5:0.7))+'px Georgia';
  ctx.fillText(suit,0,rank?h*0.12:0);
  ctx.restore();
}

function draw(){
  // bg
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0e1a');g.addColorStop(0.6,'#141a30');g.addColorStop(1,'#1c1230');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const b of bgGlyphs){
    ctx.globalAlpha=b.a;ctx.fillStyle='#9fb4ff';
    ctx.font=b.s+'px Georgia';ctx.fillText(b.ch,b.x,b.y);
  }
  ctx.globalAlpha=1;

  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  // particles
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.t/q.life);
    ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);
  }
  ctx.globalAlpha=1;

  if(mode==='start'){drawStart();return;}

  // enemy bullets (little glowing suits)
  for(const b of ebullets){
    const c=suitColor(b.ch);
    ctx.save();ctx.translate(b.x,b.y);
    ctx.shadowColor=c;ctx.shadowBlur=10;
    ctx.fillStyle='#1a1024';ctx.beginPath();ctx.arc(0,0,b.r+2,0,7);ctx.fill();
    ctx.fillStyle=c;ctx.font=(b.r*1.9)+'px Georgia';
    ctx.fillText(b.ch,0,1);
    ctx.restore();
  }

  // player bullets: mini cards
  for(const b of bullets)drawCard(b.x,b.y,11,15,b.s,null,'#3a4266',Math.sin(b.t*20)*0.1,false);

  // enemies as face cards
  for(const e of enemies){
    const w=e.type==='spinner'?46:38,h=w*1.35;
    const wob=Math.sin(e.t*4)*0.12;
    drawCard(e.x,e.y,w,h,e.suit,e.rank,'#c23b5a',e.type==='weaver'?Math.PI+wob:wob,e.flashT>0);
  }

  // player: golden ace of spades
  if(mode==='playing'&&player.inv<=0|| (mode==='playing'&&Math.floor(time*12)%2===0)){
    if(mode==='playing'){
      ctx.save();ctx.translate(player.x,player.y);
      ctx.shadowColor='#ffd76a';ctx.shadowBlur=14;
      drawCard(0,0,22,30,'♠','A','#ffd76a',0,false);
      ctx.restore();
    }
  }

  // floaters
  for(const f of floaters){
    ctx.globalAlpha=Math.min(1,f.t);
    ctx.fillStyle='#ffe9a8';ctx.font='bold '+f.size+'px Georgia';
    ctx.fillText(f.txt,f.x,f.y);
  }
  ctx.globalAlpha=1;

  // HUD
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#fff';ctx.font='bold 20px Georgia';
  ctx.fillText('SCORE '+score,14,12);
  try{const best=+(localStorage.getItem('cardstorm_best')||0);if(best>score)ctx.fillText('',0,0);}catch(e){}
  ctx.textAlign='center';ctx.fillStyle='#9fb4ff';ctx.font='bold 18px Georgia';
  ctx.fillText('WAVE '+wave,W/2,14);
  // lives
  for(let i=0;i<lives;i++)drawCard(W-30-i*30,26,20,27,'♥',null,'#c23b5a',0,false);

  if(flash>0){ctx.fillStyle='rgba(255,60,80,'+(flash*1.4)+')';ctx.fillRect(-10,-10,W+20,H+20);}
  ctx.setTransform(1,0,0,1,0,0);

  if(paused){
    ctx.fillStyle='rgba(5,7,15,0.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 42px Georgia';
    ctx.fillText('PAUSED',W/2,H/2-10);
    ctx.font='18px Georgia';ctx.fillStyle='#9fb4ff';
    ctx.fillText('Press P to resume',W/2,H/2+30);
  }

  if(mode==='over')drawOver();
}

function drawStart(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  const y=H*0.3;
  // fanned cards behind title
  for(let i=-2;i<=2;i++){
    drawCard(W/2+i*58,y,44,60,SUITS[i+2],RANKS[Math.abs(i)],'#c23b5a',i*0.18,false);
  }
  ctx.fillStyle='#fff';ctx.font='bold 56px Georgia';
  ctx.shadowColor='#ffd76a';ctx.shadowBlur=18;
  ctx.fillText('CARD STORM',W/2,y+70);
  ctx.shadowBlur=0;
  ctx.fillStyle='#9fb4ff';ctx.font='italic 20px Georgia';
  ctx.fillText('— a bullet-hell of playing cards —',W/2,y+105);

  const cy=y+165;
  ctx.font='18px Georgia';ctx.fillStyle='#dfe6ff';
  const lines=[
    'MOVE ......... Arrow Keys / WASD',
    'FIRE ......... Auto (hold SHIFT for spread)',
    'PAUSE ........ P',
    '',
    'Survive the waves. Do not touch the enemy bullets.'
  ];
  lines.forEach((l,i)=>ctx.fillText(l,W/2,cy+i*28));

  if(Math.floor(time*2)%2===0){
    ctx.fillStyle='#ffd76a';ctx.font='bold 24px Georgia';
    ctx.fillText('PRESS  SPACE  TO  DEAL',W/2,cy+190);
  }
}
function drawOver(){
  ctx.fillStyle='rgba(5,7,15,0.65)';ctx.fillRect(-20,-20,W+40,H+40);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ff4d6a';ctx.font='bold 58px Georgia';
  ctx.fillText('BUSTED!',W/2,H*0.35);
  ctx.fillStyle='#fff';ctx.font='bold 30px Georgia';
  ctx.fillText('Final Score: '+score,W/2,H*0.47);
  let best=0;try{best=+(localStorage.getItem('cardstorm_best')||0);}catch(e){}
  if(score>=best&&score>0){ctx.fillStyle='#ffd76a';ctx.font='bold 22px Georgia';ctx.fillText('★ NEW BEST! ★',W/2,H*0.55);}
  ctx.fillStyle='#9fb4ff';ctx.font='18px Georgia';
  ctx.fillText('Reached Wave '+wave,W/2,H*0.61);
  if(Math.floor(time*2)%2===0){
    ctx.fillStyle='#ffd76a';ctx.font='bold 24px Georgia';
    ctx.fillText('PRESS  R  TO  REDEAL',W/2,H*0.72);
  }
}

/* ---------- LOOP ---------- */
makeBg();
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.05)dt=0.05;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
