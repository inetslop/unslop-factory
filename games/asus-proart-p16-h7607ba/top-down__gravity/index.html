<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Pull</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e17;}
  canvas{display:block;position:absolute;inset:0;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var FIELD_W = 1200, FIELD_H = 700;
var scale = 1, ox = 0, oy = 0, dpr = 1;

function resize(){
  dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  scale = Math.min(window.innerWidth / FIELD_W, window.innerHeight / FIELD_H);
  ox = (window.innerWidth - FIELD_W*scale)/2;
  oy = (window.innerHeight - FIELD_H*scale)/2;
}
window.addEventListener('resize', resize);
resize();

/* ---------- levels ---------- */
var LEVELS = [
 { // 1 — First Pull
   start:[140,350], goal:[1060,350],
   walls:[[420,90,40,240],[420,370,40,240],[780,90,40,240],[780,370,40,240]],
   spikes:[]
 },
 { // 2 — Spike Alley
   start:[120,120], goal:[1080,580],
   walls:[[0,260,1200,36],[0,420,1200,36]],
   spikes:[[300,350,34],[600,350,34],[900,350,34],
           [200,590,30],[480,590,30],[760,590,30]]
 },
 { // 3 — The Gauntlet
   start:[120,350], goal:[1080,350],
   walls:[[300,0,40,220],[300,480,40,220],
          [600,0,40,300],[600,400,40,300],
          [900,0,40,220],[900,480,40,220]],
   spikes:[[750,350,40],[450,120,26],[450,580,26]]
 },
 { // 4 — Orbit
   start:[120,350], goal:[1080,350],
   walls:[[480,140,240,36],[480,524,240,36],[480,176,36,348],[724,176,36,348]],
   spikes:[[600,350,55],[300,150,30],[900,550,30]]
 },
 { // 5 — Final Field
   start:[120,120], goal:[1080,580],
   walls:[[240,240,720,36],[240,424,720,36],
          [580,276,40,148]],
   spikes:[[400,180,30],[800,180,30],[400,520,30],[800,520,30],
           [600,350,42],[150,350,26],[1050,350,26]]
 }
];

/* ---------- state ---------- */
var state = 'menu';      // menu | play | dead | clear | win
var levelIdx = 0;
var ball = {x:0,y:0,vx:0,vy:0,r:11};
var energy = 100, MAX_ENERGY = 100;
var pulling = false;
var mouse = {x:600,y:350};
var trail = [];
var deaths = 0, totalDeaths = 0, startTime = 0, elapsed = 0;
var stateTimer = 0;
var stoppedTime = 0;
var bestTime = null;
try { var bt = localStorage.getItem('gravityPullBest'); if(bt) bestTime = parseFloat(bt); } catch(e){}

function loadLevel(i){
  levelIdx = i;
  deaths = 0;
  resetBall();
  state = 'play';
  startTime = performance.now();
  elapsed = 0;
}
function resetBall(){
  var L = LEVELS[levelIdx];
  ball.x = L.start[0]; ball.y = L.start[1];
  ball.vx = 0; ball.vy = 0;
  energy = MAX_ENERGY;
  trail.length = 0;
  stoppedTime = 0;
}

/* ---------- audio ---------- */
var AC = null, pullOsc = null, pullGain = null, master = null;
function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    pullOsc = AC.createOscillator(); pullOsc.type='sawtooth'; pullOsc.frequency.value=70;
    var f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=300;
    pullGain = AC.createGain(); pullGain.gain.value = 0;
    pullOsc.connect(f); f.connect(pullGain); pullGain.connect(master);
    pullOsc.start();
  } catch(e){ AC = null; }
}
function setPullSound(on, strength){
  if(!AC) return;
  try{
    var t = AC.currentTime;
    pullGain.gain.setTargetAtTime(on ? 0.10 + 0.15*strength : 0, t, on?0.05:0.12);
    if(pullOsc) pullOsc.frequency.setTargetAtTime(60 + 90*strength, t, 0.1);
  }catch(e){}
}
function blip(freq, dur, type, vol){
  if(!AC) return;
  try{
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.2, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + (dur||0.15));
    o.connect(g); g.connect(master);
    o.start(); o.stop(AC.currentTime + (dur||0.15) + 0.02);
  }catch(e){}
}
function sfxWin(){ blip(660,0.12,'sine',0.25); setTimeout(function(){blip(880,0.14,'sine',0.25);},110); setTimeout(function(){blip(1320,0.25,'sine',0.25);},220); }
function sfxDead(){ blip(220,0.25,'square',0.2); setTimeout(function(){blip(140,0.35,'square',0.2);},120); }
function sfxBounce(v){ blip(180+v*0.6, 0.07, 'triangle', Math.min(0.25, 0.05+v*0.002)); }

/* ---------- physics ---------- */
var PULL_FORCE = 780;
var DRAIN = 34;      // energy per second while pulling
var REGEN = 6;       // energy per second when not pulling
var FRICTION = 0.985;

function step(dt){
  if(state !== 'play') return;
  elapsed = (performance.now() - startTime)/1000;

  var L = LEVELS[levelIdx];
  var dxm = mouse.x - ball.x, dym = mouse.y - ball.y;
  var dist = Math.hypot(dxm,dym);

  if(pulling && energy > 0 && dist > 2){
    var f = PULL_FORCE * Math.min(1, dist/380);
    ball.vx += (dxm/dist)*f*dt;
    ball.vy += (dym/dist)*f*dt;
    energy -= DRAIN*dt;
    if(energy < 0) energy = 0;
    setPullSound(true, Math.min(1, dist/500));
  } else {
    energy += REGEN*dt;
    if(energy > MAX_ENERGY) energy = MAX_ENERGY;
    setPullSound(false, 0);
  }

  ball.vx *= Math.pow(FRICTION, dt*60);
  ball.vy *= Math.pow(FRICTION, dt*60);
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt;

  // field bounds (bounce)
  bounceBounds();

  // walls
  for(var i=0;i<L.walls.length;i++){
    var w = L.walls[i];
    collideRect(w[0],w[1],w[2],w[3]);
  }
  // spikes
  for(i=0;i<L.spikes.length;i++){
    var s = L.spikes[i];
    if(Math.hypot(ball.x-s[0], ball.y-s[1]) < ball.r + s[2]){
      die(); return;
    }
  }
  // goal
  if(Math.hypot(ball.x-L.goal[0], ball.y-L.goal[1]) < ball.r + 22){
    state = 'clear'; stateTimer = 0;
    setPullSound(false,0);
    sfxWin();
    return;
  }

  trail.push({x:ball.x,y:ball.y});
  if(trail.length > 40) trail.shift();

  // out of energy & stopped -> dead
  var speed = Math.hypot(ball.vx, ball.vy);
  if(energy <= 0.5 && !pulling && speed < 6){
    stoppedTime += dt;
    if(stoppedTime > 1.2) die();
  } else stoppedTime = 0;
}

function bounceBounds(){
  var rest = 0.55;
  if(ball.x - ball.r < 0){ ball.x = ball.r; if(ball.vx<0){ sfxBounce(Math.abs(ball.vx)); ball.vx = -ball.vx*rest;} }
  if(ball.x + ball.r > FIELD_W){ ball.x = FIELD_W-ball.r; if(ball.vx>0){ sfxBounce(ball.vx); ball.vx = -ball.vx*rest;} }
  if(ball.y - ball.r < 0){ ball.y = ball.r; if(ball.vy<0){ sfxBounce(Math.abs(ball.vy)); ball.vy = -ball.vy*rest;} }
  if(ball.y + ball.r > FIELD_H){ ball.y = FIELD_H-ball.r; if(ball.vy>0){ sfxBounce(ball.vy); ball.vy = -ball.vy*rest;} }
}

function collideRect(x,y,w,h){
  var cx = Math.max(x, Math.min(ball.x, x+w));
  var cy = Math.max(y, Math.min(ball.y, y+h));
  var dx = ball.x - cx, dy = ball.y - cy;
  var d2 = dx*dx + dy*dy;
  if(d2 >= ball.r*ball.r) return;
  var d = Math.sqrt(d2), rest = 0.55;
  if(d < 0.0001){
    // center inside rect: push out along smallest axis
    var pl = ball.x - x, pr = x+w - ball.x, pt = ball.y - y, pb = y+h - ball.y;
    var m = Math.min(pl,pr,pt,pb);
    if(m===pl){ball.x=x-ball.r; ball.vx=-Math.abs(ball.vx)*rest;}
    else if(m===pr){ball.x=x+w+ball.r; ball.vx=Math.abs(ball.vx)*rest;}
    else if(m===pt){ball.y=y-ball.r; ball.vy=-Math.abs(ball.vy)*rest;}
    else {ball.y=y+h+ball.r; ball.vy=Math.abs(ball.vy)*rest;}
    sfxBounce(120);
    return;
  }
  var nx = dx/d, ny = dy/d;
  ball.x = cx + nx*ball.r;
  ball.y = cy + ny*ball.r;
  var vn = ball.vx*nx + ball.vy*ny;
  if(vn < 0){
    sfxBounce(-vn);
    ball.vx -= (1+rest)*vn*nx;
    ball.vy -= (1+rest)*vn*ny;
  }
}

function die(){
  deaths++; totalDeaths++;
  state = 'dead'; stateTimer = 0;
  setPullSound(false,0);
  sfxDead();
}

/* ---------- input ---------- */
function fieldPos(e){
  var cx = e.clientX, cy = e.clientY;
  return { x:(cx - ox)/scale, y:(cy - oy)/scale };
}
window.addEventListener('mousemove', function(e){
  var p = fieldPos(e); mouse.x = p.x; mouse.y = p.y;
});
window.addEventListener('mousedown', function(e){
  initAudio(); if(AC && AC.state==='suspended') AC.resume();
  var p = fieldPos(e); mouse.x = p.x; mouse.y = p.y;
  if(state === 'play'){ pulling = true; }
  else handleAdvance(e.button);
});
window.addEventListener('mouseup', function(){ pulling = false; });
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  initAudio(); if(AC && AC.state==='suspended') AC.resume();
  var k = e.key.toLowerCase();
  if(k === ' '){ e.preventDefault();
    if(state === 'play') pulling = true;
    else advance();
  }
  if(k === 'r'){
    if(state === 'play' || state === 'dead'){ resetBall(); state='play'; startTime=performance.now()-elapsed*1000; }
    else if(state==='menu'||state==='win'){ totalDeaths=0; loadLevel(0); }
  }
  if(k === 'escape'){ state = 'menu'; pulling=false; setPullSound(false,0); }
  if(k === 'enter') advance();
});
window.addEventListener('keyup', function(e){
  if(e.key === ' ') pulling = false;
});

function handleAdvance(){ advance(); }
function advance(){
  if(state === 'menu'){ totalDeaths=0; loadLevel(0); }
  else if(state === 'clear'){
    if(levelIdx + 1 < LEVELS.length) loadLevel(levelIdx+1);
    else {
      state = 'win'; setPullSound(false,0);
      if(bestTime === null || elapsed < bestTime){
        bestTime = elapsed;
        try{ localStorage.setItem('gravityPullBest', String(bestTime)); }catch(err){}
      }
    }
  }
  else if(state === 'dead'){ resetBall(); state='play'; startTime = performance.now() - elapsed*1000; }
  else if(state === 'win'){ totalDeaths=0; loadLevel(0); }
}

/* ---------- drawing ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(now){
  var t = now/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#0b0e17';
  ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);

  // field
  var grad = ctx.createLinearGradient(0,0,0,FIELD_H);
  grad.addColorStop(0,'#141a2e'); grad.addColorStop(1,'#101527');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,FIELD_W,FIELD_H);

  // grid
  ctx.strokeStyle = 'rgba(90,120,200,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(var gx=0; gx<=FIELD_W; gx+=50){ ctx.moveTo(gx,0); ctx.lineTo(gx,FIELD_H); }
  for(var gy=0; gy<=FIELD_H; gy+=50){ ctx.moveTo(0,gy); ctx.lineTo(FIELD_W,gy); }
  ctx.stroke();

  var L = LEVELS[levelIdx];

  // goal
  var gp = 0.5 + 0.5*Math.sin(t*4);
  ctx.strokeStyle = 'rgba(80,255,160,'+(0.35+0.4*gp)+')';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(L.goal[0],L.goal[1], 22 + gp*8, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#2bff9e';
  ctx.shadowColor = '#2bff9e'; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(L.goal[0],L.goal[1],14,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // walls
  for(var i=0;i<L.walls.length;i++){
    var w = L.walls[i];
    ctx.fillStyle = '#3a4668';
    roundRect(w[0],w[1],w[2],w[3],6); ctx.fill();
    ctx.strokeStyle = '#5b6c9e'; ctx.lineWidth = 2; ctx.stroke();
  }

  // spikes
  for(i=0;i<L.spikes.length;i++){
    var s = L.spikes[i];
    ctx.save();
    ctx.translate(s[0],s[1]);
    ctx.rotate(t*0.6);
    ctx.fillStyle = '#ff4d5e';
    ctx.shadowColor='#ff4d5e'; ctx.shadowBlur=12;
    var n = 10, r = s[2];
    ctx.beginPath();
    for(var a=0;a<n*2;a++){
      var rr = (a%2===0)? r : r*0.62;
      var ang = a/(n*2)*Math.PI*2;
      if(a===0) ctx.moveTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
      else ctx.lineTo(Math.cos(ang)*rr, Math.sin(ang)*rr);
    }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle = '#7e1220';
    ctx.beginPath(); ctx.arc(0,0,r*0.35,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // trail
  for(i=0;i<trail.length;i++){
    var al = i/trail.length;
    ctx.fillStyle = 'rgba(120,190,255,'+(al*0.35)+')';
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, ball.r*al*0.8, 0, Math.PI*2); ctx.fill();
  }

  // pull line
  if(state==='play' && pulling && energy>0){
    var mdx = mouse.x-ball.x, mdy = mouse.y-ball.y;
    var md = Math.hypot(mdx,mdy)||1;
    ctx.setLineDash([8,8]);
    ctx.lineDashOffset = -t*60;
    ctx.strokeStyle = 'rgba(255,200,80,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke();
    ctx.setLineDash([]);
    // cursor ring
    ctx.strokeStyle = 'rgba(255,200,80,0.9)';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,10+3*Math.sin(t*10),0,Math.PI*2); ctx.stroke();
  } else if(state==='play'){
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,7,0,Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mouse.x-12,mouse.y); ctx.lineTo(mouse.x+12,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-12); ctx.lineTo(mouse.x,mouse.y+12);
    ctx.stroke();
  }

  // ball
  if(state !== 'dead' || (stateTimer % 0.3) < 0.15){
    var bg = ctx.createRadialGradient(ball.x-4,ball.y-4,2,ball.x,ball.y,ball.r);
    bg.addColorStop(0,'#eaf6ff'); bg.addColorStop(1,'#5aa9ff');
    ctx.shadowColor='#5aa9ff'; ctx.shadowBlur=15;
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // border
  ctx.strokeStyle = '#3a4668'; ctx.lineWidth = 4;
  ctx.strokeRect(0,0,FIELD_W,FIELD_H);

  /* HUD */
  if(state==='play' || state==='dead' || state==='clear'){
    ctx.fillStyle='rgba(10,14,25,0.75)';
    roundRect(16,16,250,74,10); ctx.fill();
    ctx.fillStyle='#cfe0ff';
    ctx.font='bold 18px monospace';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('LEVEL '+(levelIdx+1)+' / '+LEVELS.length, 30, 26);
    // energy bar
    var ew = 200;
    ctx.fillStyle='#222a45'; roundRect(30,54,ew,18,9); ctx.fill();
    var epct = energy/MAX_ENERGY;
    if(epct>0){
      var ec = epct>0.5 ? '#2bff9e' : (epct>0.25 ? '#ffcc33' : '#ff4d5e');
      ctx.fillStyle=ec;
      roundRect(30,54,Math.max(18,ew*epct),18,9); ctx.fill();
    }
    ctx.fillStyle='#8fa3d0'; ctx.font='11px monospace';
    ctx.fillText('PULL ENERGY', 30, 76-2);

    ctx.fillStyle='#8fa3d0'; ctx.font='13px monospace'; ctx.textAlign='right';
    ctx.fillText('time '+elapsed.toFixed(1)+'s   deaths '+deaths, FIELD_W-20, 24);
    if(bestTime!==null) ctx.fillText('best '+bestTime.toFixed(1)+'s', FIELD_W-20, 44);
  }

  /* overlays */
  if(state==='menu' || state==='clear' || state==='dead' || state==='win'){
    ctx.fillStyle='rgba(6,9,18,0.72)';
    ctx.fillRect(0,0,FIELD_W,FIELD_H);
    ctx.textAlign='center';

    if(state==='menu'){
      ctx.fillStyle='#5aa9ff';
      ctx.shadowColor='#5aa9ff'; ctx.shadowBlur=30;
      ctx.font='bold 64px monospace';
      ctx.fillText('GRAVITY PULL', FIELD_W/2, 190);
      ctx.shadowBlur=0;
      ctx.fillStyle='#cfe0ff'; ctx.font='20px monospace';
      ctx.fillText('A top-down gravity game. Hold the mouse to bend space and pull', FIELD_W/2, 300);
      ctx.fillText('the ball toward your cursor. Reach the green goal.', FIELD_W/2, 330);
      ctx.fillStyle='#8fa3d0'; ctx.font='16px monospace';
      ctx.fillText('[ HOLD LMB / SPACE ] pull ball to cursor     [ R ] restart level', FIELD_W/2, 420);
      ctx.fillText('[ ESC ] menu        Pulling drains energy — make it count.', FIELD_W/2, 450);
      blink(t); ctx.font='bold 24px monospace'; ctx.fillText('CLICK OR PRESS ENTER TO START', FIELD_W/2, 530);
      if(bestTime!==null){ ctx.fillStyle='#2bff9e'; ctx.font='16px monospace'; ctx.fillText('BEST TIME: '+bestTime.toFixed(1)+'s', FIELD_W/2, 580); }
    }
    else if(state==='clear'){
      ctx.fillStyle='#2bff9e'; ctx.shadowColor='#2bff9e'; ctx.shadowBlur=25;
      ctx.font='bold 52px monospace';
      ctx.fillText(levelIdx+1<LEVELS.length ? 'LEVEL CLEAR!' : 'ALL LEVELS COMPLETE!', FIELD_W/2, 300);
      ctx.shadowBlur=0;
      blink(t); ctx.fillStyle='#cfe0ff'; ctx.font='20px monospace';
      ctx.fillText('CLICK / ENTER to continue', FIELD_W/2, 380);
    }
    else if(state==='dead'){
      ctx.fillStyle='#ff4d5e'; ctx.shadowColor='#ff4d5e'; ctx.shadowBlur=25;
      ctx.font='bold 52px monospace';
      ctx.fillText('SPLATTED!', FIELD_W/2, 300);
      ctx.shadowBlur=0;
      blink(t); ctx.fillStyle='#cfe0ff'; ctx.font='20px monospace';
      ctx.fillText('CLICK / R to retry   [ ESC ] menu', FIELD_W/2, 380);
    }
    else if(state==='win'){
      ctx.fillStyle='#2bff9e'; ctx.shadowColor='#2bff9e'; ctx.shadowBlur=30;
      ctx.font='bold 56px monospace';
      ctx.fillText('YOU BEAT GRAVITY', FIELD_W/2, 240);
      ctx.shadowBlur=0;
      ctx.fillStyle='#cfe0ff'; ctx.font='22px monospace';
      ctx.fillText('Total time: '+elapsed.toFixed(1)+'s    Deaths: '+totalDeaths, FIELD_W/2, 320);
      if(bestTime!==null){ ctx.fillStyle='#8fa3d0'; ctx.font='16px monospace'; ctx.fillText('Best: '+bestTime.toFixed(1)+'s', FIELD_W/2, 355); }
      blink(t); ctx.fillStyle='#cfe0ff'; ctx.font='bold 22px monospace';
      ctx.fillText('CLICK / R TO PLAY AGAIN', FIELD_W/2, 440);
    }
  }
}

function blink(t){ if((t%1)<0.55) return true; ctx.globalAlpha=0.35; setTimeout(function(){ctx.globalAlpha=1;},0); }

/* ---------- main loop ---------- */
var last = performance.now();
function frame(now){
  var dt = (now - last)/1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  stateTimer += dt;
  // substep physics for stability
  var n = 3;
  for(var i=0;i<n;i++) step(dt/n);
  draw(now);
  requestAnimationFrame(frame);
}

// init ball so menu background looks nice
ball.x = LEVELS[0].start[0]; ball.y = LEVELS[0].start[1];
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
