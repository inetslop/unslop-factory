<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frogger Typing</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b1420; }
  #game { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
"use strict";

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- audio ---------- */
let AC=null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function beep(freq, dur, type, vol, slideTo){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), ac.currentTime+dur);
  g.gain.setValueAtTime(vol||0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime+dur+0.02);
}

/* ---------- words ---------- */
const WORDS = ["frog","jump","hop","leap","road","river","log","lily","pad","green","car","truck","bus","train","tires","speed","fast","slow","safe","cross","water","splash","swim","float","drift","bridge","tunnel","alley","urban","rural","bush","grass","field","meadow","pond","lake","stream","bank","shore","coast","cliff","cave","stone","brick","metal","glass","wooden","plastic","rubber","spring","summer","autumn","winter","morning","evening","midnight","dawn"];

/* ---------- state ---------- */
const ROWS = 6;            // road rows to cross (row ROWS = goal grass)
let state='start';         // start | playing | gameover
let frog, cars, level, lives, score, highScore=0, message, msgTimer, word, typed, wrongFlash, invincible, jump;

try{ highScore = parseInt(localStorage.getItem('froggerTypingHigh')||'0',10)||0; }catch(e){}

function laneSpeed(i){ return (55 + i*14) * (1 + (level-1)*0.18); }
function frogX(){ return W/2; }
function rowY(r){ // r = 0 bottom grass .. ROWS top goal
  const top = H*0.16, bottom = H*0.82;
  const step = (bottom-top)/ROWS;
  return bottom - r*step;
}

function newWord(){
  let w;
  do{ w = WORDS[Math.floor(Math.random()*WORDS.length)]; }while(w===word);
  word=w; typed=0;
}

function resetFrog(){
  frog = { row:0, y:rowY(0), scale:1 };
  jump = null;
  invincible = 1.2;
}

function startGame(){
  level=1; lives=3; score=0; message=''; msgTimer=0;
  cars=[];
  for(let i=0;i<ROWS-1;i++){
    const lane={cars:[], timer: Math.random()*0.8};
    // seed a few cars
    for(let k=0;k<3;k++) spawnCar(lane, Math.random()*W);
    cars.push(lane);
  }
  resetFrog();
  newWord();
  state='playing';
}

function spawnCar(lane, x){
  const dir = (laneIndex%2===0)?1:-1;
  lane.cars.push({ x: (x!==undefined?x:(dir>0?-60:W+60)), w: 46+Math.random()*30, color: CARCOLORS[Math.floor(Math.random()*CARCOLORS.length)] });
}
const CARCOLORS = ['#e74c3c','#f39c12','#3498db','#9b59b6','#ecf0f1','#1abc9c'];

function doHop(){
  score += 10;
  beep(300,0.25,'triangle',0.15,700);
  jump = { from: frog.row, to: frog.row+1, t:0, dur:0.38, yFrom: rowY(frog.row) };
  newWord();
}

function crash(){
  lives--;
  beep(200,0.4,'sawtooth',0.2,50);
  message = 'SPLASHED!'; msgTimer=1.2;
  resetFrog();
  if(lives<=0){
    state='gameover';
    if(score>highScore){ highScore=score; try{ localStorage.setItem('froggerTypingHigh',''+highScore); }catch(e){} }
  }
}

function levelUp(){
  score += 50;
  level++;
  beep(523,0.12,'square',0.12);
  setTimeout(()=>beep(659,0.12,'square',0.12),110);
  setTimeout(()=>beep(784,0.2,'square',0.12),220);
  message = 'LEVEL '+level+'!'; msgTimer=1.6;
  cars.forEach((lane,i)=>{ lane.cars.length=0; lane.timer=Math.random()*0.5; for(let k=0;k<3;k++) spawnCar(lane, Math.random()*W); });
  resetFrog();
}

/* ---------- input ---------- */
window.addEventListener('keydown', function(e){
  audio();
  if(state==='start' || state==='gameover'){
    if(e.key==='Enter'||e.key===' '||e.key.toLowerCase()==='r'){ startGame(); e.preventDefault(); }
    return;
  }
  if(state!=='playing') return;

  if(e.key==='Backspace'){
    if(typed>0){ typed--; beep(350,0.06,'square',0.08); }
    e.preventDefault(); return;
  }
  if(e.key.length!==1) { if(e.key==='Enter') e.preventDefault(); return; }

  const ch = e.key.toLowerCase();
  if(ch===word[typed]){
    typed++;
    beep(500+typed*60, 0.07, 'square', 0.1);
    if(typed>=word.length){
      doHop();
    }
    e.preventDefault();
  } else {
    typed=0; wrongFlash=0.25;
    beep(140,0.15,'sawtooth',0.12);
    e.preventDefault();
  }
});
cv.addEventListener('mousedown', function(){ audio(); if(state!=='playing') startGame(); });

/* ---------- update ---------- */
let lastT = performance.now();
function update(dt){
  if(wrongFlash>0) wrongFlash-=dt;
  if(msgTimer>0) msgTimer-=dt;
  if(invincible>0) invincible-=dt;

  if(state!=='playing') return;

  // cars
  for(let i=0;i<ROWS-1;i++){
    const lane=cars[i], dir=(i%2===0)?1:-1, sp=laneSpeed(i);
    for(const c of lane.cars) c.x += dir*sp*dt;
    lane.cars = lane.cars.filter(c=> c.x > -120 && c.x < W+120);
    lane.timer -= dt;
    if(lane.timer<=0){ spawnCar(lane); lane.timer = 0.9 + Math.random()*1.4 - level*0.05; if(lane.timer<0.4) lane.timer=0.4; }
  }

  // jump animation
  if(jump){
    jump.t += dt;
    const p = Math.min(1, jump.t/jump.dur);
    frog.row = jump.to;
    frog.y = jump.yFrom + (rowY(jump.to)-jump.yFrom)*p;
    frog.scale = 1 + Math.sin(p*Math.PI)*0.45;
    if(p>=1){
      const toRow = jump.to;
      jump=null; frog.scale=1; frog.y=rowY(toRow);
      if(toRow >= ROWS){ levelUp(); }
      else if(invincible<=0){
        // collision check in landing lane (toRow-1)
        const lane = cars[toRow-1];
        for(const c of lane.cars){
          if(Math.abs(c.x - frogX()) < c.w/2 + 18){ crash(); break; }
        }
      }
    }
  }
}

/* ---------- draw helpers ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawFrog(){
  const x=frogX(), y=frog.y, s=frog.scale;
  if(invincible>0 && Math.floor(invincible*12)%2===0) return;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0,14,16/s*1+2,5,0,0,Math.PI*2); ctx.fill();
  // legs
  ctx.fillStyle='#2e8b2e';
  ctx.beginPath(); ctx.ellipse(-16,8,8,5,-.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16,8,8,5,.5,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle='#3cb043';
  ctx.beginPath(); ctx.ellipse(0,2,17,13,0,0,Math.PI*2); ctx.fill();
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-8,-9,5.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8,-9,5.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-8,-10,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8,-10,2.5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawCar(c){
  ctx.save();
  ctx.translate(c.x,0);
  ctx.fillStyle='rgba(0,0,0,0.3)'; rr(-c.w/2,-15,c.w,30,8); ctx.fill();
  ctx.fillStyle=c.color; rr(-c.w/2,-13,c.w,26,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)'; rr(-c.w*0.18,-9,c.w*0.36,18,4); ctx.fill();
  ctx.fillStyle='#222'; rr(-c.w/2+3,-13,6,5,2); ctx.fill(); rr(c.w/2-9,-13,6,5,2); ctx.fill();
  ctx.restore();
}

/* ---------- draw ---------- */
function draw(){
  // background road
  const top = H*0.16 - (H*0.82-H*0.16)/ROWS;
  ctx.fillStyle='#2b3038'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#3a4048'; ctx.fillRect(0,top,W,rowY(0)-top + (rowY(0)-rowY(1))*0 );
  // road band
  ctx.fillStyle='#333a44';
  ctx.fillRect(0, rowY(ROWS-1)-(H*0.66/ROWS)*0.5, W, rowY(0)+(H*0.66/ROWS)*0.5 - (rowY(ROWS-1)-(H*0.66/ROWS)*0.5));
  // lane dashes
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=3; ctx.setLineDash([22,20]);
  for(let i=1;i<ROWS-1;i++){
    const y=rowY(i)+(rowY(i-1)-rowY(i))/2;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // top goal grass with lily pads
  ctx.fillStyle='#1f6b30'; ctx.fillRect(0,0,W,rowY(ROWS));
  for(let i=0;i<Math.ceil(W/90);i++){
    ctx.fillStyle='#2e8b45';
    ctx.beginPath(); ctx.ellipse(45+i*90, rowY(ROWS)*0.5, 26,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1f6b30';
    ctx.beginPath(); ctx.moveTo(45+i*90,rowY(ROWS)*0.5); ctx.lineTo(70+i*90,rowY(ROWS)*0.5-8); ctx.lineTo(70+i*90,rowY(ROWS)*0.5+2); ctx.closePath(); ctx.fill();
  }
  // bottom grass
  ctx.fillStyle='#1f6b30'; ctx.fillRect(0,rowY(0)+(rowY(0)-rowY(1))/2,W,H-rowY(0));

  // cars per lane
  for(let i=0;i<ROWS-1;i++){
    const y=rowY(i);
    for(const c of cars[i].cars){ ctx.save(); ctx.translate(0,y); drawCar(c); ctx.restore(); }
  }

  drawFrog();

  /* ---- HUD ---- */
  ctx.textAlign='left';
  ctx.fillStyle='#fff';
  ctx.font='bold 20px monospace';
  ctx.fillText('SCORE '+score, 14, 28);
  ctx.fillText('LEVEL '+level, 14, 52);
  ctx.fillText('HIGH '+highScore, 14, 76);
  // lives
  for(let i=0;i<3;i++){
    ctx.fillStyle = i<lives ? '#3cb043' : 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.arc(W-30-i*30, 28, 10, 0, Math.PI*2); ctx.fill();
  }

  // word prompt
  if(state==='playing'){
    const size = Math.min(46, W/(word.length+2));
    ctx.font='bold '+size+'px monospace';
    ctx.textAlign='center';
    let x0 = W/2 - (ctx.measureText(word).width)/2;
    for(let i=0;i<word.length;i++){
      const cw = ctx.measureText(word[i]).width;
      if(i<typed) ctx.fillStyle='#3cb043';
      else if(i===typed) ctx.fillStyle=(wrongFlash>0)?'#e74c3c':'#ffe066';
      else ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillText(word[i], x0+cw/2, H-18);
      x0+=cw;
    }
    ctx.font='14px monospace';
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText('type the word to hop across  •  wrong keys reset the word', W/2, H-56);
  }

  // message
  if(msgTimer>0 && state==='playing'){
    ctx.textAlign='center';
    ctx.font='bold '+Math.min(48,W*0.07)+'px monospace';
    ctx.fillStyle='#ffe066';
    ctx.fillText(message, W/2, H*0.5);
  }

  /* ---- overlays ---- */
  if(state==='start'||state==='gameover'){
    ctx.fillStyle='rgba(8,14,24,0.78)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    const title = state==='start' ? 'FROGGER TYPING' : 'GAME OVER';
    ctx.font='bold '+Math.min(56,W*0.08)+'px monospace';
    ctx.fillStyle='#3cb043';
    ctx.fillText(title, W/2, H*0.3);

    ctx.fillStyle='#fff';
    ctx.font=Math.min(20,W*0.03)+'px monospace';
    const lines = state==='start' ? [
      'Type each word to make the frog hop one lane up.',
      'Land on a car and you splash back to start!',
      '',
      'Cross all '+ROWS+' lanes to level up (cars get faster).',
      '3 lives. Backspace undoes a letter. Wrong key resets the word.'
    ] : [
      'Score: '+score+'   •   Level reached: '+level,
      'High score: '+highScore
    ];
    lines.forEach((l,i)=> ctx.fillText(l, W/2, H*0.42+i*28));

    if(state==='gameover'){
      ctx.fillStyle='#ffe066';
      ctx.font='bold '+Math.min(24,W*0.035)+'px monospace';
      ctx.fillText('Press ENTER or R to play again', W/2, H*0.75);
    } else {
      const blink = Math.floor(performance.now()/500)%2===0;
      if(blink){
        ctx.fillStyle='#ffe066';
        ctx.font='bold '+Math.min(24,W*0.035)+'px monospace';
        ctx.fillText('Press ENTER or CLICK to start', W/2, H*0.75);
      }
    }
  }
}

/* ---------- loop ---------- */
function frame(now){
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
