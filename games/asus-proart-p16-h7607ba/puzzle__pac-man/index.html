<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pac Puzzle</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05060f;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,tile=30,offX=0,offY=0,hudH=48;
let cols=15,rows=12;

const LEVELS=[
[
"###############",
"#.....#.......#",
"#.###.#.#####.#",
"#o..#...#...#o#",
"#.###.#.#.###.#",
"#...#..G..#..G#",
"#.###.E.###.#.#",
"#.###.#P#.###.#",
"#o..#...#...#o#",
"#.###.#.#.###.#",
"#.....#.......#",
"###############"
],
[
"###############",
"#....#...#....#",
"#.##.#.#.#.##.#",
"#o..#..G.#...o#",
"#.###.#.#.###.#",
"#...#...E..#...#",
"#.###.#.G.###.#",
"#...#..P..#...#",
"#.###.#.#G###.#",
"#o..#...#...#o#",
"#.##.#.#.#.##.#",
"#....#...#....#",
"###############"
],
[
"###############",
"#o.#...#...#.o#",
"#.#.###.###.#.#",
"#...#.G.#..#...#",
"###.#.G.#.#.###",
"##...#.##.#.G.#",
"#.###.#E#.###.#",
"#...#.#P#.#...#",
"#.###...#...###",
"#...#..#G.#...#",
"#.#.###.###.#.#",
"#o.#...#...#.o#",
"###############"
]
];
const GHOST_COLORS=['#ff5a75','#31e6ff','#ffd23f'];
const PAC_SPEED=5.6, GHOST_SPEED=[4.3,4.6,4.9], FRIGHT_TIME=[7,6,5];
const DIRS=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
const KEYDIR={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};

let state='start',score=0,lives=3,levelIdx=0;
let grid=[],pellets=0,exitX=-1,exitY=-1;
let pac={x:1,y:1,dir:{x:0,y:0},speed:PAC_SPEED};
let ghosts=[],fright=0,chain=0,timer=0,tGlobal=0,inputDir={x:1,y:0};
let best=0;try{best=+(localStorage.getItem('pacpuzzle_best')||0);}catch(e){}

function saveBest(){if(score>best){best=score;try{localStorage.setItem('pacpuzzle_best',best);}catch(e){}}}

function layout(){hudH=Math.max(42,H*0.08);tile=Math.floor(Math.min((W-16)/cols,(H-hudH-16)/rows));offX=(W-cols*tile)/2;offY=hudH+(H-hudH-rows*tile)/2;}
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);layout();}
addEventListener('resize',resize);

/* ---------- audio ---------- */
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,when,slideTo){if(!AC)return;try{const t0=AC.currentTime+(when||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);g.gain.setValueAtTime(vol||0.12,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.03);}catch(e){}}
let blipAlt=false;
function sfxBlip(){blipAlt=!blipAlt;tone(blipAlt?540:380,0.07,'square',0.06);}
function sfxPower(){tone(180,0.35,'sawtooth',0.12,0,90);}
function sfxEat(){tone(300,0.08,'square',0.12);tone(450,0.08,'square',0.12,0.07);tone(640,0.1,'square',0.12,0.14);}
function sfxDie(){tone(520,0.55,'sawtooth',0.16,0,55);}
function sfxWin(){[440,554,659,880].forEach(function(f,i){tone(f,0.13,'square',0.1,i*0.1);});}

/* ---------- game setup ---------- */
function loadLevel(i){
  const L=LEVELS[i];rows=L.length;cols=L[0].length;
  grid=L.map(r=>r.split(''));
  pellets=0;ghosts=[];fright=0;chain=0;exitX=-1;exitY=-1;
  pac={x:1,y:1,dir:{x:0,y:0},speed:PAC_SPEED};
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=grid[y][x];
    if(c==='.'||c==='o')pellets++;
    else if(c==='P'){pac.x=x;pac.y=y;grid[y][x]=' ';}
    else if(c==='G'){ghosts.push({x:x,y:y,sx:x,sy:y,dir:{x:0,y:-1},respawn:0,speed:GHOST_SPEED[i],color:GHOST_COLORS[ghosts.length%3]});grid[y][x]=' ';}
    else if(c==='E'){exitX=x;exitY=y;}
  }
  layout();
}
function resetGame(){score=0;lives=3;levelIdx=0;inputDir={x:1,y:0};loadLevel(0);state='ready';timer=1.6;}

/* ---------- movement ---------- */
function canGo(x,y,d){const nx=x+d.x,ny=y+d.y;if(nx<0||ny<0||nx>=cols||ny>=rows)return false;return grid[ny][nx]!=='#';}

function pacArrive(){
  const x=Math.round(pac.x),y=Math.round(pac.y);
  if(x<0||y<0||x>=cols||y>=rows)return true;
  const c=grid[y][x];
  if(c==='.'){grid[y][x]=' ';score+=10;pellets--;sfxBlip();}
  else if(c==='o'){grid[y][x]=' ';score+=50;pellets--;fright=FRIGHT_TIME[levelIdx];chain=0;sfxPower();}
  if(c==='E'&&pellets===0){state='levelup';timer=1.8;sfxWin();return false;}
  if(canGo(x,y,inputDir))pac.dir={x:inputDir.x,y:inputDir.y};
  else if(!canGo(x,y,pac.dir)){pac.dir={x:0,y:0};return false;}
  return true;
}
function ghostArrive(g){
  const x=Math.round(g.x),y=Math.round(g.y);
  let opts=[];
  for(const d of DIRS){if(d.x===-g.dir.x&&d.y===-g.dir.y)continue;if(canGo(x,y,d))opts.push(d);}
  if(!opts.length)for(const d of DIRS)if(canGo(x,y,d))opts.push(d);
  const tx=Math.round(pac.x),ty=Math.round(pac.y);
  opts.sort(function(a,b){
    const da=Math.abs(x+a.x-tx)+Math.abs(y+a.y-ty),db=Math.abs(x+b.x-tx)+Math.abs(y+b.y-ty);
    return fright>0?db-da:da-db;
  });
  if(opts.length)g.dir=opts[0];else g.dir={x:0,y:0};
  return true;
}
function advance(e,dt,arrive){
  let rem=e.speed*dt;
  while(rem>1e-9){
    let d=e.dir;
    if(!d.x&&!d.y){
      if(arrive===pacArrive&&canGo(Math.round(pac.x),Math.round(pac.y),inputDir))pac.dir={x:inputDir.x,y:inputDir.y};
      else break;
      d=e.dir;
    }
    let dc;
    if(d.x>0)dc=Math.ceil(e.x-1e-7)-e.x;
    else if(d.x<0)dc=e.x-Math.floor(e.x+1e-7);
    else if(d.y>0)dc=Math.ceil(e.y-1e-7)-e.y;
    else dc=e.y-Math.floor(e.y+1e-7);
    if(dc<1e-6){if(!arrive(e))break;dc=1;}
    const mv=Math.min(rem,dc);
    e.x+=d.x*mv;e.y+=d.y*mv;rem-=mv;
  }
}

/* ---------- update ---------- */
function update(dt){
  tGlobal+=dt;
  if(state==='ready'){timer-=dt;if(timer<=0)state='playing';return;}
  if(state==='dying'){timer-=dt;if(timer<=0){lives--;if(lives<0){state='gameover';saveBest();}else{loadLevel(levelIdx);state='ready';timer=1.2;}}return;}
  if(state==='levelup'){timer-=dt;if(timer<=0){if(levelIdx+1>=LEVELS.length){state='win';saveBest();}else{levelIdx++;loadLevel(levelIdx);state='ready';timer=1.4;}}return;}
  if(state!=='playing')return;
  if(fright>0)fright-=dt;
  for(const g of ghosts){
    if(g.respawn>0){g.respawn-=dt;if(g.respawn<=0){g.x=g.sx;g.y=g.sy;g.dir={x:0,y:-1};}continue;}
    g.speed=fright>0?3.0:GHOST_SPEED[levelIdx];
    advance(g,dt,ghostArrive);
  }
  advance(pac,dt,pacArrive);
  if(state!=='playing')return;
  for(const g of ghosts){
    if(g.respawn>0)continue;
    const dx=g.x-pac.x,dy=g.y-pac.y;
    if(dx*dx+dy*dy<0.4){
      if(fright>0){g.respawn=1.2;score+=100*Math.pow(2,chain);chain++;sfxEat();}
      else{state='dying';timer=1.5;sfxDie();return;}
    }
  }
}

/* ---------- drawing ---------- */
function isWall(x,y){return x<0||y<0||x>=cols||y>=rows||grid[y][x]==='#';}
function drawMaze(){
  ctx.fillStyle='rgba(25,35,110,0.35)';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(grid[y][x]==='#')ctx.fillRect(offX+x*tile+1,offY+y*tile+1,tile-2,tile-2);
  ctx.strokeStyle='#2f5cff';ctx.lineWidth=Math.max(2,tile*0.14);ctx.lineCap='round';
  ctx.beginPath();
  const inr=tile*0.18;
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    if(grid[y][x]!=='#')continue;
    const X=offX+x*tile,Y=offY+y*tile;
    if(!isWall(x,y-1)){ctx.moveTo(X+inr,Y+inr);ctx.lineTo(X+tile-inr,Y+inr);}
    if(!isWall(x,y+1)){ctx.moveTo(X+inr,Y+tile-inr);ctx.lineTo(X+tile-inr,Y+tile-inr);}
    if(!isWall(x-1,y)){ctx.moveTo(X+inr,Y+inr);ctx.lineTo(X+inr,Y+tile-inr);}
    if(!isWall(x+1,y)){ctx.moveTo(X+tile-inr,Y+inr);ctx.lineTo(X+tile-inr,Y+tile-inr);}
  }
  ctx.stroke();
}
function drawPellets(){
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=grid[y][x];if(c!=='.'&&c!=='o')continue;
    const px=offX+(x+0.5)*tile,py=offY+(y+0.5)*tile;
    ctx.fillStyle='#ffd97a';
    if(c==='.'){ctx.beginPath();ctx.arc(px,py,tile*0.08,0,7);ctx.fill();}
    else{const r=tile*(0.16+0.035*Math.sin(tGlobal*5));ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();}
  }
}
function drawExit(){
  if(exitX<0)return;
  const px=offX+(exitX+0.5)*tile,py=offY+(exitY+0.5)*tile,s=tile*0.32;
  const open=pellets===0;
  ctx.save();ctx.translate(px,py);
  if(open){
    const p=0.5+0.5*Math.sin(tGlobal*6);
    ctx.fillStyle='rgba(80,255,150,'+(0.35+0.4*p).toFixed(3)+')';
    ctx.beginPath();ctx.arc(0,0,s*(1+p*0.15),0,7);ctx.fill();
    ctx.strokeStyle='#5cff9d';ctx.lineWidth=Math.max(2,tile*0.08);
    ctx.strokeRect(-s*0.6,-s*0.6,s*1.2,s*1.2);
  }else{
    ctx.fillStyle='rgba(255,90,90,0.3)';ctx.fillRect(-s*0.6,-s*0.6,s*1.2,s*1.2);
    ctx.strokeStyle='#ff5a75';ctx.lineWidth=Math.max(2,tile*0.08);
    ctx.strokeRect(-s*0.6,-s*0.6,s*1.2,s*1.2);
    ctx.beginPath();ctx.moveTo(-s*0.35,0);ctx.lineTo(s*0.35,0);ctx.stroke();
  }
  ctx.restore();
}
function miniPac(x,y,r,open,base){
  ctx.fillStyle='#ffe23a';
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.arc(x,y,r,(base||0)+(open===undefined?0.5:open),(base||0)-(open===undefined?0.5:open)+Math.PI*2);
  ctx.closePath();ctx.fill();
}
function drawPac(){
  const px=offX+pac.x*tile,py=offY+pac.y*tile,r=tile*0.42;
  let base=0,open;
  if(state==='dying'){
    const p=Math.min(1,1-timer/1.5);
    base=-Math.PI/2-p*4;open=Math.min(Math.PI-0.02,p*Math.PI);
  }else{
    if(pac.dir.x||pac.dir.y)base=Math.atan2(pac.dir.y,pac.dir.x);
    open=0.12+0.3*(0.5+0.5*Math.sin(tGlobal*10));
  }
  ctx.fillStyle='#ffe23a';
  ctx.beginPath();ctx.moveTo(px,py);
  ctx.arc(px,py,r,base+open,base-open+Math.PI*2);
  ctx.closePath();ctx.fill();
}
function drawGhost(g){
  if(g.respawn>0)return;
  const px=offX+g.x*tile,py=offY+g.y*tile,r=tile*0.42;
  const fr=fright>0;
  const flash=fr&&fright<1.6&&Math.floor(tGlobal*8)%2===0;
  ctx.fillStyle=fr?(flash?'#dfe6ff':'#3a49ff'):g.color;
  ctx.beginPath();
  ctx.arc(px,py-r*0.08,r,Math.PI,0);
  const yb=py+r*0.85;
  ctx.lineTo(px+r,yb);
  for(let i=0;i<3;i++)ctx.arc(px+r-r/1.5*(i+0.5),yb,r/3,0,Math.PI,true);
  ctx.closePath();ctx.fill();
  const ex=g.dir.x*r*0.25,ey=g.dir.y*r*0.25;
  if(fr){
    ctx.fillStyle=flash?'#7a3040':'#fff';
    ctx.beginPath();ctx.arc(px-r*0.3,py-r*0.1,r*0.14,0,7);ctx.arc(px+r*0.3,py-r*0.1,r*0.14,0,7);ctx.fill();
    ctx.strokeStyle=flash?'#c8d2ff':'#ffb0c0';ctx.lineWidth=Math.max(1,tile*0.06);
    const my=py+r*0.35;
    ctx.beginPath();
    ctx.moveTo(px-r*0.5,my+r*0.12);
    ctx.lineTo(px-r*0.25,my-r*0.12);
    ctx.lineTo(px,my+r*0.12);
    ctx.lineTo(px+r*0.25,my-r*0.12);
    ctx.lineTo(px+r*0.5,my+r*0.12);
    ctx.stroke();
  }else{
    ctx.fillStyle='#fff';ctx.beginPath();
    ctx.ellipse(px-r*0.32+ex,py-r*0.18+ey,r*0.24,r*0.3,0,0,7);
    ctx.ellipse(px+r*0.32+ex,py-r*0.18+ey,r*0.24,r*0.3,0,0,7);
    ctx.fill();
    ctx.fillStyle='#2b3cff';ctx.beginPath();
    ctx.arc(px-r*0.32+ex*1.6,py-r*0.18+ey*1.6,r*0.11,0,7);
    ctx.arc(px+r*0.32+ex*1.6,py-r*0.18+ey*1.6,r*0.11,0,7);
    ctx.fill();
  }
}
function drawHUD(){
  ctx.fillStyle='#0a0e1f';ctx.fillRect(0,0,W,hudH);
  const f=Math.max(12,Math.floor(hudH*0.4));
  ctx.font='bold '+f+'px "Courier New",monospace';ctx.textBaseline='middle';
  ctx.textAlign='left';ctx.fillStyle='#ffe23a';
  ctx.fillText('SCORE '+score,16,hudH/2);
  ctx.textAlign='center';
  ctx.fillStyle=pellets===0?'#5cff9d':'#8fa3ff';
  ctx.fillText(pellets===0?'EXIT OPEN!':'DOTS LEFT: '+pellets,W*0.5,hudH/2);
  ctx.textAlign='right';ctx.fillStyle='#8fa3ff';
  ctx.fillText('LV '+(levelIdx+1)+'/'+LEVELS.length,W-16,hudH/2);
  for(let i=0;i<Math.max(0,lives);i++)miniPac(W-92-i*26,hudH/2,Math.min(11,hudH*0.19),0.4,Math.PI);
}
function bigText(txt,sub){
  const cy=offY+rows*tile/2;
  ctx.fillStyle='rgba(3,4,12,0.6)';ctx.fillRect(offX-8,cy-tile*1.15,cols*tile+16,tile*2.3);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ffe23a';ctx.font='bold '+Math.floor(tile*0.9)+'px "Courier New",monospace';
  ctx.fillText(txt,W/2,cy-(sub?tile*0.4:0));
  if(sub){ctx.fillStyle='#cfd8ff';ctx.font='bold '+Math.floor(tile*0.5)+'px "Courier New",monospace';ctx.fillText(sub,W/2,cy+tile*0.5);}
}
function blink(on){return Math.floor(tGlobal*2)%2===on;}
function overlay(title,color,sub){
  ctx.fillStyle='rgba(3,4,12,0.82)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=color;ctx.font='bold '+Math.floor(Math.min(W*0.1,64))+'px "Courier New",monospace';
  ctx.fillText(title,W/2,H*0.36);
  ctx.fillStyle='#cfd8ff';ctx.font='bold '+Math.floor(Math.min(W*0.05,28))+'px "Courier New",monospace';
  ctx.fillText(sub,W/2,H*0.48);
  if(best>0){ctx.fillStyle='#ffd97a';ctx.font='bold '+Math.floor(Math.min(W*0.035,22))+'px "Courier New",monospace';ctx.fillText('BEST: '+best,W/2,H*0.56);}
  if(blink(true)){ctx.fillStyle='#ffe23a';ctx.font='bold '+Math.floor(Math.min(W*0.045,26))+'px "Courier New",monospace';ctx.fillText('PRESS ENTER TO PLAY AGAIN',W/2,H*0.66);}
}
function drawStart(){
  ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);
  // decorative dot trail
  for(let i=0;i<12;i++){const x=W/2-11*tile+i*tile;if(x<20||x>W-20)continue;ctx.fillStyle='rgba(255,217,122,'+(0.25+0.3*Math.abs(Math.sin(tGlobal*2+i*0.5))).toFixed(3)+')';ctx.beginPath();ctx.arc(x,H*0.46,tile*0.09,0,7);ctx.fill();}
  miniPac(W/2-12*tile,H*0.46,tile*0.4,0.15+0.3*(0.5+0.5*Math.sin(tGlobal*9)),0);
  const gx=W/2+11*tile,gy=H*0.46-Math.sin(tGlobal*3)*tile*0.1;
  ctx.fillStyle='#ff5a75';ctx.beginPath();ctx.arc(gx,gy-tile*0.04,tile*0.42,Math.PI,0);ctx.lineTo(gx+tile*0.42,gy+tile*0.36);
  for(let i=0;i<3;i++)ctx.arc(gx+tile*0.42-tile/1.5*(i+0.5),gy+tile*0.36,tile*0.14,0,Math.PI,true);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(gx-tile*0.12,gy-tile*0.08,tile*0.1,0,7);ctx.arc(gx+tile*0.12,gy-tile*0.08,tile*0.1,0,7);ctx.fill();
  ctx.fillStyle='#2b3cff';ctx.beginPath();ctx.arc(gx-tile*0.15,gy-tile*0.08,tile*0.05,0,7);ctx.arc(gx+tile*0.09,gy-tile*0.08,tile*0.05,0,7);ctx.fill();

  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#ffe23a';
  ctx.font='bold '+Math.floor(Math.min(W*0.11,84))+'px "Courier New",monospace';
  ctx.fillText('PAC PUZZLE',W/2,H*0.16);
  const fs=Math.max(13,Math.floor(Math.min(W*0.026,20)));
  ctx.font='bold '+fs+'px "Courier New",monospace';
  ctx.fillStyle='#cfd8ff';
  const lines=['ARROWS / WASD .... MOVE','EAT EVERY DOT, THEN REACH THE EXIT','POWER PELLETS TURN GHOSTS BLUE - EAT THEM!','R ................ RESTART'];
  lines.forEach(function(l,i){ctx.fillText(l,W/2,H*0.58+i*fs*1.7);});
  if(best>0){ctx.fillStyle='#ffd97a';ctx.fillText('BEST SCORE: '+best,W/2,H*0.58+lines.length*fs*1.7);}
  if(blink(true)){ctx.fillStyle='#ffe23a';ctx.font='bold '+Math.floor(fs*1.4)+'px "Courier New",monospace';ctx.fillText('PRESS ENTER TO START',W/2,H*0.9);}
}
function draw(){
  ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);
  if(state==='start'){drawStart();return;}
  drawMaze();drawExit();drawPellets();
  for(const g of ghosts)drawGhost(g);
  drawPac();
  drawHUD();
  if(state==='ready')bigText('LEVEL '+(levelIdx+1),'GET READY!');
  else if(state==='levelup')bigText('LEVEL CLEAR!','NICE WORK');
  else if(state==='gameover')overlay('GAME OVER','#ff5a75','SCORE: '+score);
  else if(state==='win')overlay('YOU WIN!','#5cff9d','FINAL SCORE: '+score);
}

/* ---------- input ---------- */
addEventListener('keydown',function(e){
  audio();
  const k=e.code;
  if(KEYDIR[k]){inputDir={x:KEYDIR[k][0],y:KEYDIR[k][1]};e.preventDefault();return;}
  if(k==='KeyR'){resetGame();e.preventDefault();return;}
  if(k==='Enter'||k==='Space'){
    if(state==='start'||state==='gameover'||state==='win')resetGame();
    e.preventDefault();
  }
});
cv.addEventListener('pointerdown',function(){
  audio();
  if(state==='start'||state==='gameover'||state==='win')resetGame();
});

/* ---------- main loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  update(dt);draw();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
