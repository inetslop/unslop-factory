<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maze Runner - Platformer Maze</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#12141f;}
  #game{display:block;position:absolute;inset:0;}
  #overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,12,24,.82);color:#e8ecff;font-family:'Segoe UI',Arial,sans-serif;text-align:center;z-index:5;
  }
  #overlay.hidden{display:none;}
  #overlay h1{font-size:min(9vw,64px);margin:0 0 4px;color:#ffd760;letter-spacing:3px;
    text-shadow:0 4px 0 #b3541e,0 8px 24px rgba(0,0,0,.6);}
  #overlay .sub{font-size:min(4vw,20px);color:#8fa3d9;margin-bottom:22px;letter-spacing:6px;text-transform:uppercase;}
  #overlay p{font-size:min(3.4vw,17px);line-height:1.9;color:#c6d2f5;margin:0 0 26px;}
  #overlay .key{display:inline-block;background:#2a3358;border:1px solid #4b5b95;border-radius:6px;
    padding:2px 10px;margin:0 3px;font-family:monospace;color:#fff;box-shadow:0 2px 0 #1a2140;}
  #ovmsg{font-size:min(5vw,26px);color:#7dffb0;animation:pulse 1.1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1 id="ovTitle">MAZE RUNNER</h1>
  <div class="sub" id="ovSub">Platformer Maze</div>
  <p id="ovText">
    <span class="key">&#8592;</span><span class="key">&#8594;</span> / <span class="key">A</span><span class="key">D</span> move &nbsp;&nbsp;
    <span class="key">SPACE</span> jump &nbsp;&nbsp;<span class="key">P</span> pause<br>
    <span class="key">R</span> restart level &mdash; grab coins, stomp blobs, dodge spikes,<br>reach the glowing door!
  </p>
  <div id="ovmsg">Press ENTER or click to start</div>
</div>
<script>
(function(){
"use strict";
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
var overlay=document.getElementById('overlay'),ovTitle=document.getElementById('ovTitle'),
    ovSub=document.getElementById('ovSub'),ovText=document.getElementById('ovText'),ovMsg=document.getElementById('ovmsg');
var W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
var AC=null;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}} }
function beep(f,d,type,v,slide){
  if(!AC)return;
  try{
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
function sJump(){beep(300,0.16,'square',0.10,280);}
function sCoin(){beep(1100,0.07,'square',0.10);setTimeout(function(){beep(1650,0.12,'square',0.10);},60);}
function sStomp(){beep(180,0.14,'triangle',0.22,-90);}
function sDie(){beep(400,0.4,'sawtooth',0.14,-330);}
function sClear(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,0.18,'square',0.11);},i*110);});}
function sWin(){[523,659,784,1047,1319,1568].forEach(function(f,i){setTimeout(function(){beep(f,0.22,'square',0.11);},i*130);});}

/* ---------- levels ---------- */
var TS=32;
var LEVELS=[
[
"############################",
"#..........................#",
"#....................C.....#",
"#...................X......#",
"#..................####....#",
"#..............#####.......#",
"#..........................#",
"#...........E..............#",
"#.....###...###...###......#",
"#..........................#",
"#....................C.....#",
"#.####...###..###....#####.#",
"#P..C....S...........E.....#",
"#.............S............#",
"############################"
],
[
"##############################",
"#............................#",
"#.......C....................#",
"#........................X...#",
"#......................#####.#",
"#...................#####....#",
"#............................#",
"#.....E..............E.......#",
"#....###......###...###......#",
"#............................#",
"#........C.......C...........#",
"#.###.......###...###........#",
"#P..S..............E.........#",
"#.........S...........S......#",
"######...#####...#######...###"
],
[
"################################",
"#..............................#",
"#.......................C....#",
"#........................X...#",
"#......................####....#",
"#...................#####......#",
"#..............................#",
"#......E.............E.........#",
"#.....###....###....###........#",
"#..............................#",
"#.......C.......C..............#",
"#.###...###...###...###....###.#",
"#P.........S..........E........#",
"#......S................S......#",
"####...####...####...####...####"
]
];

/* ---------- state ---------- */
var GRAV=2000,MOVE=230,JUMPV=-700,MAXFALL=950;
var state='start',levelIdx=0,score=0,lives=5,best=0;
try{best=parseInt(localStorage.getItem('mazeRunnerBest')||'0',10)||0;}catch(e){}
var grid=[],coins=[],spikes=[],enemies=[],exitTile=null,playerStart={x:0,y:0};
var player=null,cam={x:0,y:0},time=0,stateTimer=0,shake=0;

function loadLevel(i){
  var L=LEVELS[i];grid=[];coins=[];spikes=[];enemies=[];exitTile=null;
  for(var r=0;r<L.length;r++){
    grid[r]=[];
    for(var c=0;c<L[r].length;c++){
      var ch=L[r][c];grid[r][c]=(ch==='#')?'#':'.';
      if(ch==='C')coins.push({x:c*TS+16,y:r*TS+16,taken:false});
      else if(ch==='S')spikes.push({c:c,r:r});
      else if(ch==='X')exitTile={c:c,r:r};
      else if(ch==='E')enemies.push(mkEnemy(c,r));
      else if(ch==='P'){playerStart.x=c*TS+5;playerStart.y=r*TS+4;}
    }
  }
  player={x:playerStart.x,y:playerStart.y,w:22,h:28,vx:0,vy:0,onGround:false,facing:1,coyote:0,jbuf:0};
}
function mkEnemy(c,r){return {x:c*TS+3,y:(r+1)*TS-24,w:26,h:24,dir:1,speed:52,row:r,alive:true,ph:Math.random()*6};}
function solid(c,r){
  if(r<0)return false;
  if(r>=grid.length||c<0||c>=grid[0].length)return true; // out of bounds = wall (pit bottom open handled by fall check)
  return grid[r][c]==='#';
}

function startGame(){score=0;lives=5;levelIdx=0;loadLevel(0);state='playing';hideOverlay();}
function nextLevel(){
  levelIdx++;
  if(levelIdx>=LEVELS.length){winGame();return;}
  loadLevel(levelIdx);state='playing';hideOverlay();
}
function winGame(){
  state='win';score+=lives*250;saveBest();
  showOverlay('YOU WIN!','All mazes cleared',
    'Final score: <b style="color:#ffd760">'+score+'</b><br>Best: '+best+
    (lives>0?'<br>Bonus for lives: +'+(lives*250):''),
    'Press ENTER or click to play again');
  sWin();
}
function gameOver(){
  state='gameover';saveBest();
  showOverlay('GAME OVER','The maze wins...','Score: '+score+' &nbsp;|&nbsp; Best: '+best,'Press ENTER or click to try again');
}
function saveBest(){
  if(score>best){best=score;try{localStorage.setItem('mazeRunnerBest',String(best));}catch(e){}}
}
function showOverlay(t,s,txt,msg){
  ovTitle.textContent=t;ovSub.textContent=s;ovText.innerHTML=txt;ovMsg.textContent=msg;overlay.classList.remove('hidden');
}
function hideOverlay(){overlay.classList.add('hidden');}

/* ---------- input ---------- */
var keys={};
window.addEventListener('keydown',function(e){
  initAudio();
  if(e.code==='Space'||e.key.indexOf('Arrow')===0)e.preventDefault();
  if(!keys[e.code]){
    keys[e.code]=true;
    if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&state==='playing'&&player)player.jbuf=0.12;
  }
  if(e.code==='Enter'){
    if(state==='start')startGame();
    else if(state==='clear')nextLevel();
    else if(state==='gameover'||state==='win')startGame();
    else if(state==='paused'){state='playing';hideOverlay();}
  }
  if(e.code==='KeyP'&&(state==='playing'||state==='paused')){
    if(state==='playing'){state='paused';showOverlay('PAUSED','','','Press P or ENTER to resume');}
    else{state='playing';hideOverlay();}
  }
  if(e.code==='KeyR'&&state==='playing'){loadLevel(levelIdx);score=Math.max(0,score-250);}
});
window.addEventListener('keyup',function(e){
  keys[e.code]=false;
  if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&player&&player.vy<-260)player.vy=-260;
});
canvas.addEventListener('mousedown',function(){initAudio();clickAction();});
overlay.addEventListener('mousedown',function(){initAudio();clickAction();});
function clickAction(){
  if(state==='start')startGame();
  else if(state==='clear')nextLevel();
  else if(state==='gameover'||state==='win')startGame();
  else if(state==='paused'){state='playing';hideOverlay();}
}

/* ---------- physics ---------- */
function moveEntityX(e,dx){
  e.x+=dx;
  var c1=Math.floor(e.x/TS),c2=Math.floor((e.x+e.w-0.01)/TS),
      r1=Math.floor(e.y/TS),r2=Math.floor((e.y+e.h-0.01)/TS);
  for(var r=r1;r<=r2;r++)for(var c=c1;c<=c2;c++){
    if(solid(c,r)){
      if(dx>0)e.x=c*TS-e.w; else e.x=(c+1)*TS;
      return (dx>0?-1:1);
    }
  }
  return 0;
}
function moveEntityY(e,dy){
  e.y+=dy;
  var c1=Math.floor(e.x/TS),c2=Math.floor((e.x+e.w-0.01)/TS),
      r1=Math.floor(e.y/TS),r2=Math.floor((e.y+e.h-0.01)/TS);
  for(var r=r1;r<=r2;r++)for(var c=c1;c<=c2;c++){
    if(solid(c,r)){
      if(dy>0){e.y=r*TS-e.h;return 1;} else {e.y=(r+1)*TS;return -1;}
    }
  }
  return 0;
}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function killPlayer(){
  if(state!=='playing')return;
  state='dying';stateTimer=0;shake=10;
  player.vy=-560;player.vx=(Math.random()<0.5?-1:1)*120;
  lives--;sDie();
}
function respawnOrEnd(){
  if(lives<=0){gameOver();return;}
  loadLevel(levelIdx);state='playing';
}

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*30);
  if(state==='paused'||state==='start')return;

  if(state==='dying'){
    stateTimer+=dt;
    player.vy=Math.min(player.vy+GRAV*dt,MAXFALL);
    player.x+=player.vx*dt;player.y+=player.vy*dt;
    if(stateTimer>1)respawnOrEnd();
    updateCam(dt);return;
  }
  if(state!=='playing')return;

  var p=player;
  var left=(keys.ArrowLeft||keys.KeyA),right=(keys.ArrowRight||keys.KeyD);
  var target=(right?MOVE:0)-(left?MOVE:0);
  p.vx+=(target-p.vx)*Math.min(1,dt*14);
  if(Math.abs(p.vx)<4)p.vx=0;
  if(target>0)p.facing=1;else if(target<0)p.facing=-1;

  p.vy=Math.min(p.vy+GRAV*dt,MAXFALL);
  p.coyote-=dt;p.jbuf-=dt;
  if(p.jbuf>0&&(p.onGround||p.coyote>0)){
    p.vy=JUMPV;p.jbuf=0;p.coyote=0;sJump();
  }

  var wasGround=p.onGround;
  moveEntityX(p,p.vx*dt);
  var vyHit=moveEntityY(p,p.vy*dt);
  p.onGround=(vyHit===1);
  if(!p.onGround&&wasGround)p.coyote=0.09;

  // fell into pit
  if(p.y>grid.length*TS+80){killPlayer();return;}

  // coins
  for(var i=0;i<coins.length;i++){
    var c=coins[i];
    if(!c.taken&&p.x<c.x+11&&p.x+p.w>c.x-11&&p.y<c.y+11&&p.y+p.h>c.y-11){
      c.taken=true;score+=100;sCoin();
    }
  }
  // spikes
  for(i=0;i<spikes.length;i++){
    var s=spikes[i];
    if(aabb(p,{x:s.c*TS+5,y:s.r*TS+14,w:22,h:18})){killPlayer();return;}
  }
  // enemies
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];if(!e.alive)continue;
    var nx=e.x+e.dir*e.speed*dt;
    var fx=(e.dir>0)?nx+e.w:nx,fc=Math.floor(fx/TS);
    if(solid(fc,e.row)||!solid(fc,e.row+1))e.dir*=-1;else e.x=nx;
    if(aabb(p,e)){
      if(p.vy>140&&(p.y+p.h-e.y)<15){
        e.alive=false;score+=100;p.vy=-440;sStomp();shake=5;
      }else{killPlayer();return;}
    }
  }
  // exit
  if(exitTile&&aabb(p,{x:exitTile.c*TS+2,y:exitTile.r*TS+2,w:TS-4,h:TS-4})){
    score+=500;saveBest();
    state='clear';sClear();
    var last=(levelIdx+1>=LEVELS.length);
    showOverlay(last?'FINAL DOOR!':'LEVEL '+(levelIdx+1)+' CLEAR','+500 bonus',
      'Score: <b style="color:#ffd760">'+score+'</b> &nbsp;|&nbsp; Lives: '+lives,
      last?'Press ENTER to see results':'Press ENTER for level '+(levelIdx+2));
    if(last)state='clear-final';
  }

  updateCam(dt);
}
function updateCam(dt){
  var mw=grid[0].length*TS,mh=grid.length*TS;
  var tx=player.x+player.w/2-W/2,ty=player.y+player.h/2-H/2;
  if(mw<W)tx=(mw-W)/2;else tx=Math.max(0,Math.min(tx,mw-W));
  if(mh<H)ty=(mh-H)/2;else ty=Math.max(-40,Math.min(ty,mh-H));
  cam.x+=(tx-cam.x)*Math.min(1,dt*8);
  cam.y+=(ty-cam.y)*Math.min(1,dt*8);
}

/* ---------- render ---------- */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function render(){
  // background
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#181b2e');g.addColorStop(0.6,'#232a47');g.addColorStop(1,'#101223');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // stars (parallax)
  ctx.fillStyle='rgba(255,255,255,0.35)';
  for(var i=0;i<70;i++){
    var sx=((i*173.3)-cam.x*0.25)%W;if(sx<0)sx+=W;
    var sy=((i*97.7)-cam.y*0.25)%H;if(sy<0)sy+=H;
    var tw=0.4+0.6*Math.abs(Math.sin(time*1.5+i));
    ctx.globalAlpha=0.25*tw;ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;

  if(state==='start'){return;} // overlay covers

  var ox=Math.round(-cam.x+(shake?(Math.random()-0.5)*shake:0)),
      oy=Math.round(-cam.y+(shake?(Math.random()-0.5)*shake:0));
  ctx.save();ctx.translate(ox,oy);

  var mw=grid[0].length*TS,mh=grid.length*TS;
  var c0=Math.max(0,Math.floor(-cam.x/TS)-1),c1=Math.min(grid[0].length-1,Math.ceil((W-cam.x)/TS)+1);
  var r0=Math.max(0,Math.floor(-cam.y/TS)-1),r1=Math.min(grid.length-1,Math.ceil((H-cam.y)/TS)+1);

  // tiles
  for(var r=r0;r<=r1;r++)for(var c=c0;c<=c1;c++){
    if(!solid(c,r))continue;
    var x=c*TS,y=r*TS;
    ctx.fillStyle='#46548f';ctx.fillRect(x,y,TS,TS);
    ctx.fillStyle='#39456f';ctx.fillRect(x,y+TS-6,TS,6);
    if(!solid(c,r-1)){ctx.fillStyle='#7286c9';ctx.fillRect(x,y,TS,5);}
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;
    ctx.strokeRect(x+0.5,y+0.5,TS-1,TS-1);
  }

  // exit door
  if(exitTile){
    var ex=exitTile.c*TS,ey=exitTile.r*TS,pul=0.6+0.4*Math.sin(time*4);
    ctx.save();
    ctx.shadowColor='rgba(125,255,176,'+(0.8*pul)+')';ctx.shadowBlur=22;
    ctx.fillStyle='#1e3a2c';rr(ex+4,ey-14,TS-8,TS+14,6);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='hsl('+(140+25*Math.sin(time*3))+',90%,'+(55+15*pul)+'%)';
    rr(ex+7,ey-9,TS-14,TS+4,4);ctx.fill();
    ctx.fillStyle='#fffbe8';ctx.beginPath();ctx.arc(ex+TS-12,ey+3,2.5,0,7);ctx.fill();
    ctx.restore();
  }

  // spikes
  for(var i=0;i<spikes.length;i++){
    var s=spikes[i],sx=s.c*TS,sy=s.r*TS;
    if(sx<c0*TS-TS||sx>(c1+1)*TS)continue;
    ctx.fillStyle='#9aa7cc';
    for(var k=0;k<3;k++){
      ctx.beginPath();
      ctx.moveTo(sx+2+k*10,sy+TS);ctx.lineTo(sx+7+k*10,sy+13);ctx.lineTo(sx+12+k*10,sy+TS);
      ctx.closePath();ctx.fill();
    }
  }

  // coins
  for(i=0;i<coins.length;i++){
    var cn=coins[i];if(cn.taken)continue;
    var sc=Math.abs(Math.sin(time*4+i*1.3)),bob=Math.sin(time*3+i)*2;
    ctx.save();ctx.translate(cn.x,cn.y+bob);
    ctx.shadowColor='rgba(255,215,96,0.7)';ctx.shadowBlur=10;
    ctx.fillStyle='#ffd760';
    ctx.beginPath();ctx.ellipse(0,0,Math.max(2,8*sc),9,0,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#b3541e';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,Math.max(1.5,5*sc),6,0,0,7);ctx.stroke();
    ctx.restore();
  }

  // enemies
  for(i=0;i<enemies.length;i++){
    var e=enemies[i];if(!e.alive)continue;
    var wob=Math.sin(time*10+e.ph)*2;
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle='#d94f6b';
    rr(1,4+wob*0.3,e.w,e.h-4,8);ctx.fill();
    ctx.fillStyle='#a83250';
    ctx.beginPath();ctx.ellipse(7,e.h-2+Math.abs(wob)*0.6,5,3,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(e.w-7,e.h-2-Math.abs(wob)*0.6,5,3,0,0,7);ctx.fill();
    // eyes
    var look=e.dir*3;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(8+look,12,4.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(e.w-8+look,12,4.5,0,7);ctx.fill();
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(8+look*1.6,12,2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(e.w-8+look*1.6,12,2,0,7);ctx.fill();
    ctx.strokeStyle='#5c1b30';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(4,7);ctx.lineTo(12,9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(e.w-4,7);ctx.lineTo(e.w-12,9);ctx.stroke();
    ctx.restore();
  }

  // player
  var p=player;
  if(p){
    ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);
    if(state==='dying')ctx.rotate(stateTimer*9);
    ctx.translate(-p.w/2,-p.h/2);
    ctx.shadowColor='rgba(110,231,255,0.5)';ctx.shadowBlur=8;
    ctx.fillStyle='#6ee7ff';rr(0,0,p.w,p.h,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#39b8d6';rr(0,p.h-8,p.w,8,5);ctx.fill();
    var lx=p.facing*4;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(p.w/2-5+lx,10,4.2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(p.w/2+5+lx,10,4.2,0,7);ctx.fill();
    ctx.fillStyle='#123';
    ctx.beginPath();ctx.arc(p.w/2-5+lx*1.8,10,2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(p.w/2+5+lx*1.8,10,2,0,7);ctx.fill();
    if(state==='dying'){ctx.strokeStyle='#123';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(6,17);ctx.lineTo(10,21);ctx.moveTo(10,17);ctx.lineTo(6,21);ctx.stroke();}
    else{ctx.strokeStyle='#123';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.w/2+lx*0.8,18,3,0.2,Math.PI-0.2);ctx.stroke();}
    ctx.restore();
  }
  ctx.restore();

  // HUD
  ctx.save();
  ctx.font='bold 20px "Segoe UI",Arial,sans-serif';
  ctx.textBaseline='top';
  ctx.fillStyle='rgba(10,12,24,0.55)';rr(10,10,238,74,10);ctx.fill();
  ctx.fillStyle='#ffd760';ctx.fillText('SCORE '+score,24,20);
  ctx.fillStyle='#cfd9ff';ctx.font='15px "Segoe UI",Arial,sans-serif';
  ctx.fillText('LEVEL '+(levelIdx+1)+' / '+LEVELS.length+'     BEST '+best,24,46);
  ctx.font='20px Arial';ctx.fillStyle='#ff5d7a';
  var hearts='';for(var h=0;h<Math.max(0,lives);h++)hearts+='\u2665 ';
  ctx.fillText(hearts||'-',24,62);
  ctx.restore();
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  update(dt);render();
  requestAnimationFrame(frame);
}
loadLevel(0); // pre-render a scene behind the start overlay
state='start';
showOverlay('MAZE RUNNER','Platformer Maze',
  '<span class="key">&#8592;</span><span class="key">&#8594;</span> / <span class="key">A</span><span class="key">D</span> move &nbsp;&nbsp; <span class="key">SPACE</span> jump<br>'+
  '<span class="key">P</span> pause &nbsp;&nbsp;<span class="key">R</span> restart level (−250)<br><br>'+
  'Collect coins, stomp the blobs, dodge spikes and pits,<br>and reach the glowing door on each of '+LEVELS.length+' maze levels!',
  'Press ENTER or click to start');
requestAnimationFrame(frame);
})();
