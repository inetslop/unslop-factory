<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Side-Scroll Tetris</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e1a;}
  #c{display:block;width:100vw;height:100vh;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W=48,H=18,cell=30,viewCols=15;
var grid,camCol,totalScrolled,score,bonus,state='start',piece,nextIdx,fallTimer,moveCd,lastT=0,hi=0,flashes=[],popups=[],paused=false;
try{hi=parseInt(localStorage.getItem('sctetris_hi')||'0',10)||0;}catch(e){}

var COLORS=['#000','#38bdf8','#fbbf24','#a78bfa','#34d399','#f87171','#60a5fa','#f472b6'];
var SHAPES=[
 null,
 [[0,0],[1,0],[2,0],[3,0]],           // I
 [[0,0],[1,0],[0,1],[1,1]],           // O
 [[1,0],[0,1],[1,1],[2,1]],           // T
 [[1,0],[2,0],[0,1],[1,1]],           // S
 [[0,0],[1,0],[1,1],[2,1]],           // Z
 [[0,0],[0,1],[1,1],[2,1]],           // J
 [[2,0],[0,1],[1,1],[2,1]]            // L
];

// ---------- audio ----------
var actx=null;
function beep(f,d,type,vol){
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.08,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}

// ---------- resize ----------
function resize(){
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  cell=Math.max(12,Math.floor(canvas.height/H));
  viewCols=Math.ceil(canvas.width/cell)+1;
}
window.addEventListener('resize',resize);resize();

// ---------- game setup ----------
function newGame(){
  grid=[];for(var r=0;r<H;r++)grid.push(new Uint8Array(W));
  camCol=0;totalScrolled=0;bonus=0;flashes=[];popups=[];paused=false;
  nextIdx=randPiece();spawn();fallTimer=0;moveCd=0;score=0;state='playing';
}
function randPiece(){return 1+Math.floor(Math.random()*7);}

function spawn(){
  var idx=piece?nextIdx:randPiece();
  nextIdx=randPiece();
  piece={idx:idx,cells:SHAPES[idx].map(function(c){return[c[0],c[1]];}),
         col:Math.min(W-4,(camCol|0)+viewCols-4),row:-2};
}

function collides(cells,col,row){
  for(var i=0;i<cells.length;i++){
    var c=col+cells[i][0],r=row+cells[i][1];
    if(c<0||c>=W||r>=H)return true;
    if(r>=0&&grid[r][c])return true;
  }
  return false;
}

function tryMove(dc,dr){
  var nc=piece.col+dc,nr=piece.row+dr;
  if(dc<0&&nc<(camCol|0))return false;
  if(!collides(piece.cells,nc,nr)){piece.col=nc;piece.row=nr;return true;}
  return false;
}

function rotate(){
  var t=piece.cells.map(function(c){return[-c[1],c[0]];});
  var mx=Infinity,my=Infinity;
  t.forEach(function(p){if(p[0]<mx)mx=p[0];if(p[1]<my)my=p[1];});
  t=t.map(function(p){return[p[0]-mx,p[1]-my];});
  var kicks=[0,-1,1,-2,2];
  for(var i=0;i<kicks.length;i++){
    if(!collides(t,piece.col+kicks[i],piece.row)){piece.cells=t;piece.col+=kicks[i];beep(340,0.05,'square',0.05);return;}
  }
}

function lockPiece(){
  var top=false;
  piece.cells.forEach(function(c){
    var col=piece.col+c[0],row=piece.row+c[1];
    if(row>=0){grid[row][col]=piece.idx;if(row===0)top=true;}
  });
  beep(180,0.08,'triangle',0.09);
  checkLines();
  if(top||!canSpawn())gameOver();else spawn();
}

function canSpawn(){
  var col=Math.min(W-4,(camCol|0)+viewCols-4);
  return !collides(SHAPES[nextIdx],col,0);
}

function checkLines(){
  for(var r=H-1;r>=0;r--){
    var full=true;
    for(var c=0;c<W;c++)if(!grid[r][c]){full=false;break;}
    if(full){
      grid.splice(r,1);grid.unshift(new Uint8Array(W));
      bonus+=100;
      beep(520,0.09,'square',0.08);setTimeout(function(){beep(780,0.12,'square',0.08);},80);
      flashes.push({life:0.4});
      popups.push({txt:'+100 LINE CLEAR!',x:canvas.width/2,y:(r*cell),life:1.2});
    }
  }
}

function gameOver(){
  state='over';
  var s=finalScore();
  if(s>hi){hi=s;try{localStorage.setItem('sctetris_hi',''+hi);}catch(e){}}
  beep(300,0.2,'sawtooth',0.08);setTimeout(function(){beep(200,0.25,'sawtooth',0.08);},180);
  setTimeout(function(){beep(120,0.4,'sawtooth',0.09);},380);
}

function finalScore(){return Math.floor(totalScrolled)+bonus;}

// ---------- input ----------
var keys={};
window.addEventListener('keydown',function(e){
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].indexOf(e.key)>-1)e.preventDefault();
  if(!actx)beep(0.001,0.01,'sine',0.001); // unlock audio on first input (silent)
  keys[e.key]=true;
  if(e.key==='Enter'){
    if(state==='start'||state==='over')newGame();
  }
  if((e.key==='r'||e.key==='R')&&(state!=='start')){newGame();}
  if((e.key==='p'||e.key==='P')&&state==='playing')paused=!paused;
  if(state!=='playing')return;
  if(e.key==='ArrowUp'||e.key==='x'||e.key==='X')rotate();
  if(e.key===' ')doHardDrop();
});
window.addEventListener('keyup',function(e){keys[e.key]=false;});
canvas.addEventListener('mousedown',function(){
  beep(0.001,0.01,'sine',0.001);
  if(state==='start'||state==='over')newGame();
});

function doHardDrop(){
  var d=0;
  while(tryMove(0,1))d++;
  bonus+=d;
  lockPiece();
}

// ---------- update ----------
function update(dt){
  if(state!=='playing'||paused)return;
  // scroll world left
  var speed=Math.min(6,1.4+totalScrolled*0.008);
  camCol+=speed*dt;totalScrolled+=speed*dt;
  while(camCol>=1){
    for(var r=0;r<H;r++){grid[r].copyWithin(0,1);grid[r][W-1]=0;}
    camCol-=1;
    if(piece)piece.col--;
  }
  // held-key horizontal / soft drop
  moveCd-=dt;
  if(moveCd<=0){
    var moved=false;
    if(keys['ArrowLeft']){moved=tryMove(-1,0);}
    else if(keys['ArrowRight']){moved=tryMove(1,0);}
    if(moved)moveCd=0.09;
  }
  // gravity
  var soft=keys['ArrowDown'];
  fallTimer+=(soft?dt*4:dt);
  var interval=Math.max(0.12,0.55-totalScrolled*0.001);
  if(fallTimer>=interval){
    fallTimer=0;
    if(!tryMove(0,1))lockPiece();
    else if(soft)bonus+=1;
  }
  // effects
  flashes.forEach(function(f){f.life-=dt;});
  flashes=flashes.filter(function(f){return f.life>0;});
  popups.forEach(function(p){p.life-=dt;p.y-=30*dt;});
  popups=popups.filter(function(p){return p.life>0;});
}

// ---------- drawing ----------
function drawCell(x,y,idx,size,alpha){
  var col=COLORS[idx];
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=col;
  ctx.fillRect(x+1,y+1,size-2,size-2);
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.fillRect(x+1,y+1,size-2,Math.max(2,size*0.18));
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect(x+1,y+size-1-Math.max(2,size*0.16),size-2,Math.max(2,size*0.16));
  ctx.globalAlpha=1;
}

function draw(){
  var w=canvas.width,h=canvas.height;
  // sky
  var g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#141b3d');g.addColorStop(0.6,'#253066');g.addColorStop(1,'#3b2a5e');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  // parallax clouds
  ctx.fillStyle='rgba(255,255,255,0.07)';
  var off=(totalScrolled*cell*0.3)%400;
  for(var i=-1;i<w/400+1;i++){
    var cx=i*400-off+120,cy=60+(i%2)*50;
    ctx.beginPath();ctx.ellipse(cx,cy,70,20,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+50,cy-12,45,16,0,0,7);ctx.fill();
  }
  if(state==='start'){drawStart();return;}

  // terrain
  var c0=camCol|0;
  for(var r=0;r<H;r++)for(var c=c0;c<=c0+viewCols&&c<W;c++){
    if(grid[r][c])drawCell((c-camCol)*cell,r*cell,grid[r][c],cell);
  }
  // subtle grid lines
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
  for(var r=0;r<=H;r++){ctx.beginPath();ctx.moveTo(0,r*cell);ctx.lineTo(w,r*cell);ctx.stroke();}

  // active piece + ghost
  if(piece&&state==='playing'){
    var gy=piece.row;
    while(!collides(piece.cells,piece.col,gy+1))gy++;
    piece.cells.forEach(function(cc){
      if(gy+cc[1]>=0)drawCell((piece.col+cc[0]-camCol)*cell,(gy+cc[1])*cell,piece.idx,cell,0.2);
    });
    piece.cells.forEach(function(cc){
      if(piece.row+cc[1]>=0)drawCell((piece.col+cc[0]-camCol)*cell,(piece.row+cc[1])*cell,piece.idx,cell);
    });
  }

  // flash on line clear
  flashes.forEach(function(f){
    ctx.fillStyle='rgba(255,255,255,'+(f.life*0.8)+')';ctx.fillRect(0,0,w,h);
  });

  // HUD
  ctx.textAlign='left';ctx.fillStyle='#fff';
  ctx.font='bold '+Math.max(16,cell*0.7)+'px monospace';
  ctx.fillText('SCORE '+finalScore(),14,cell*0.85);
  ctx.font=Math.max(12,cell*0.45)+'px monospace';
  ctx.fillStyle='#9fb3ff';
  ctx.fillText('SPEED x'+(Math.min(6,1.4+totalScrolled*0.008)/1.4).toFixed(1),14,cell*1.4);
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText('HI '+hi,14,cell*1.9);

  // next piece box
  var bx=w-cell*3.6,by=cell*0.4,bs=Math.max(8,cell*0.55);
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(bx,by,cell*2.6,cell*2.6);
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.strokeRect(bx,by,cell*2.6,cell*2.6);
  ctx.fillStyle='#9fb3ff';ctx.font=Math.max(10,cell*0.4)+'px monospace';
  ctx.fillText('NEXT',bx+8,by+bs*0.7);
  var nx=SHAPES[nextIdx];
  var mx2=0;nx.forEach(function(p){if(p[0]>mx2)mx2=p[0];});
  nx.forEach(function(p){ctx.fillStyle=COLORS[nextIdx];ctx.fillRect(bx+18+p[0]*bs,by+bs*1.3+p[1]*bs,bs-2,bs-2);});

  // popups
  ctx.textAlign='center';
  popups.forEach(function(p){
    ctx.fillStyle='rgba(255,255,120,'+Math.min(1,p.life)+')';
    ctx.font='bold '+Math.max(16,cell*0.7)+'px monospace';
    ctx.fillText(p.txt,p.x,p.y);
  });

  if(paused){
    overlay();ctx.fillStyle='#fff';ctx.font='bold '+(cell*1.4)+'px monospace';
    ctx.textAlign='center';ctx.fillText('PAUSED',w/2,h/2);
    ctx.font=cell*0.5+'px monospace';ctx.fillText('Press P to resume',w/2,h/2+cell);
  }
  if(state==='over'){drawOver();}
}

function overlay(){
  ctx.fillStyle='rgba(5,8,20,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawStart(){
  var w=canvas.width,h=canvas.height,cx=w/2;
  ctx.textAlign='center';
  ctx.font='bold '+Math.min(64,w*0.08)+'px monospace';
  ctx.fillStyle='#38bdf8';ctx.fillText('SIDE-SCROLL',cx,h*0.25);
  ctx.fillStyle='#fbbf24';ctx.fillText('TETRIS',cx,h*0.25+Math.min(64,w*0.08));
  ctx.font=Math.max(14,cell*0.55)+'px monospace';ctx.fillStyle='#dfe7ff';
  var lines=[
    'The world scrolls left — don\'t let the stack reach the top!',
    '',
    '\u2190 \u2192   move          \u2191 / X   rotate',
    '\u2193       soft drop     SPACE  hard drop',
    'P        pause         R      restart',
    '',
    'Fill a full row to clear it for +100',
    '',
    'HIGH SCORE: '+hi,
    '',
    'Press ENTER or CLICK to start'
  ];
  var y=h*0.42;
  lines.forEach(function(l){ctx.fillText(l,cx,y);y+=Math.max(22,cell*0.75);});
}

function drawOver(){
  overlay();
  var w=canvas.width,h=canvas.height,cx=w/2;
  ctx.textAlign='center';
  ctx.font='bold '+Math.min(56,w*0.08)+'px monospace';
  ctx.fillStyle='#f87171';ctx.fillText('GAME OVER',cx,h*0.32);
  ctx.font=Math.max(18,cell*0.8)+'px monospace';ctx.fillStyle='#fff';
  ctx.fillText('SCORE  '+finalScore(),cx,h*0.45);
  ctx.fillStyle='#9fb3ff';
  ctx.fillText('DISTANCE  '+Math.floor(totalScrolled)+'   HI SCORE  '+hi,cx,h*0.53);
  if(finalScore()>=hi&&finalScore()>0){ctx.fillStyle='#fbbf24';ctx.fillText('\u2605 NEW HIGH SCORE \u2605',cx,h*0.61);}
  ctx.fillStyle='#dfe7ff';ctx.font=Math.max(14,cell*0.55)+'px monospace';
  ctx.fillText('Press ENTER / R or CLICK to play again',cx,h*0.72);
}

// ---------- loop ----------
function loop(t){
  var dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
