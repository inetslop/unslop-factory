<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Serpent Storm</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#05060f;font-family:'Courier New',monospace;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(4,6,18,.82);color:#cfeaff;text-align:center;z-index:5;backdrop-filter:blur(2px);
  }
  .hidden{display:none;}
  h1{
    font-size:min(9vw,64px);margin:0 0 10px;letter-spacing:.12em;
    color:#7dffb0;text-shadow:0 0 18px #35e08a,0 0 40px #1f8f57;
  }
  .sub{color:#6fa9ff;font-size:min(4vw,16px);letter-spacing:.2em;margin-bottom:24px;}
  .controls{color:#9fb8d8;font-size:min(3.6vw,15px);line-height:1.9;margin-bottom:28px;}
  .controls b{color:#7dffb0;}
  button{
    font-family:inherit;font-size:min(4.5vw,20px);letter-spacing:.15em;cursor:pointer;
    background:transparent;color:#7dffb0;border:2px solid #35e08a;padding:12px 36px;border-radius:6px;
    box-shadow:0 0 14px rgba(53,224,138,.35),inset 0 0 14px rgba(53,224,138,.15);
  }
  button:hover{background:rgba(53,224,138,.15);}
  #hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;
       color:#9fe8c4;font-size:min(4vw,16px);letter-spacing:.1em;z-index:4;pointer-events:none;text-shadow:0 0 8px rgba(53,224,138,.5);}
  #over h1{color:#ff7d9e;text-shadow:0 0 18px #e0356f,0 0 40px #8f1f4a;}
  .stat{font-size:min(4vw,17px);margin:4px 0;color:#cfeaff;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <span id="score">SCORE 0</span>
    <span id="timeEl">0:00</span>
    <span id="hi">BEST 0</span>
  </div>

  <div id="start" class="overlay">
    <h1>SERPENT STORM</h1>
    <div class="sub">A SNAKE IN A BULLET HELL</div>
    <div class="controls">
      <b>WASD / ARROWS</b> — steer the serpent<br>
      Eat <b style="color:#ffd94a">◆ gold orbs</b> to grow and score<br>
      Catch <b style="color:#5ad7ff">cyan shields</b> for brief invincibility<br>
      Do not touch bullets, drones or bombs — one hit kills
    </div>
    <button id="btnStart">START RUN</button>
  </div>

  <div id="over" class="overlay hidden">
    <h1>YOU DIED</h1>
    <div class="stat" id="finalScore">SCORE 0</div>
    <div class="stat" id="finalTime">SURVIVED 0:00</div>
    <div class="stat" id="finalBest" style="color:#ffd94a"></div>
    <br>
    <button id="btnRestart">RESTART (R)</button>
  </div>
</div>

<script>
(function(){
"use strict";
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
var W=0,H=0,dpr=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);resize();

var startEl=document.getElementById('start'),overEl=document.getElementById('over'),hudEl=document.getElementById('hud');
var scoreEl=document.getElementById('score'),timeEl=document.getElementById('timeEl'),hiEl=document.getElementById('hi');

var state='start';
var keys={};
window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0)e.preventDefault();
  keys[k]=true;initAudio();
  if(k==='enter'||k==='r'){if(state==='start')startGame();else if(state==='over')startGame();}
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
window.addEventListener('mousedown',initAudio);
document.getElementById('btnStart').addEventListener('click',function(){initAudio();startGame();});
document.getElementById('btnRestart').addEventListener('click',function(){initAudio();startGame();});

/* ---------- audio ---------- */
var AC=null,master=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.25;master.connect(AC.destination);
  }catch(e){}
}
function beep(f,dur,type,vol,slide){
  if(!AC)return;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+dur);
  g.gain.setValueAtTime(vol||0.5,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+dur);
}
function noiseBurst(dur,vol){
  if(!AC)return;
  var len=AC.sampleRate*dur,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  var s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=buf;g.gain.value=vol||0.5;s.connect(g);g.connect(master);s.start();
}

/* ---------- game data ---------- */
var snake,segs,bullets,enemies,foods,particles,trail;
var score,hiscore,t,shieldTime,spawnTimer,foodTimer,shake,deathT,shootSfxCd=0;
try{hiscore=parseInt(localStorage.getItem('ss_high')||'0',10)||0;}catch(e){hiscore=0;}

function fmt(t){var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}
function hiText(){hiEl.textContent='BEST '+hiscore;}
hiText();

function startGame(){
  snake={x:W/2,y:H/2,angle:-Math.PI/2,r:9};
  segs=[];var n=8;
  for(var i=0;i<n;i++)segs.push({x:snake.x-Math.cos(snake.angle)*i*7,y:snake.y-Math.sin(snake.angle)*i*7});
  bullets=[];enemies=[];particles=[];foods=[];
  score=0;t=0;shieldTime=0;spawnTimer=1.2;foodTimer=0;shake=0;deathT=0;
  spawnFood();
  startEl.classList.add('hidden');overEl.classList.add('hidden');hudEl.classList.remove('hidden');
  state='play';hiText();
}

function spawnFood(){
  var shield=Math.random()<0.18;
  for(var tries=0;tries<40;tries++){
    var x=60+Math.random()*(W-120),y=60+Math.random()*(H-120);
    if(Math.hypot(x-snake.x,y-snake.y)>140){foods.push({x:x,y:y,shield:shield,pulse:Math.random()*6});break;}
  }
}

function spawnEnemy(){
  var side=Math.floor(Math.random()*4),x,y;
  if(side===0){x=-30;y=Math.random()*H;}
  else if(side===1){x=W+30;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=-30;}
  else{x=Math.random()*W;y=H+30;}
  var r=Math.random();var type=r<0.45?'seeker':(r<0.8?'spinner':'bomber');
  enemies.push({
    x:x,y:y,type:type,r:14,
    hp:1,life:26,fireT:1+Math.random(),spin:Math.random()*Math.PI*2,
    vx:0,vy:0,fuse:type==='bomber'?2.5+Math.random()*1.5:0,
    color:type==='seeker'?'#ff7d9e':(type==='spinner'?'#c48bff':'#ffb34a')
  });
}

function addBullet(x,y,ang,sp,color,r){
  bullets.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:r||5,color:color});
}
function aimAt(e){return Math.atan2(snake.y-e.y,snake.x-e.x);}

function boom(x,y,color,n,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=(0.3+Math.random())*(spd||160);
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5+Math.random()*0.5,max:1,color:color,size:2+Math.random()*3});
  }
}

function die(){
  if(state!=='play')return;
  state='over';deathT=0;shake=18;
  noiseBurst(0.6,0.7);beep(120,0.5,'sawtooth',0.6,-90);
  boom(snake.x,snake.y,'#7dffb0',40,260);boom(snake.x,snake.y,'#ffffff',20,180);
  if(score>hiscore){hiscore=Math.floor(score);try{localStorage.setItem('ss_high',''+hiscore);}catch(e){}}
  hiText();
  setTimeout(function(){
    document.getElementById('finalScore').textContent='SCORE '+Math.floor(score);
    document.getElementById('finalTime').textContent='SURVIVED '+fmt(t);
    document.getElementById('finalBest').textContent='BEST '+hiscore;
    overEl.classList.remove('hidden');
  },900);
}

/* ---------- update ---------- */
function update(dt){
  t+=dt;score+=dt*2;
  var diff=1+t/45;

  // steering
  var tx=0,ty=0;
  if(keys['a']||keys['arrowleft'])tx-=1;
  if(keys['d']||keys['arrowright'])tx+=1;
  if(keys['w']||keys['arrowup'])ty-=1;
  if(keys['s']||keys['arrowdown'])ty+=1;
  if(tx||ty){
    var want=Math.atan2(ty,tx),d=want-snake.angle;
    while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
    var turn=7*dt;
    snake.angle+=Math.max(-turn,Math.min(turn,d));
  }
  var sp=230;
  snake.x+=Math.cos(snake.angle)*sp*dt;
  snake.y+=Math.sin(snake.angle)*sp*dt;
  if(snake.x<snake.r){snake.x=snake.r;snake.angle=Math.PI-snake.angle;}
  if(snake.x>W-snake.r){snake.x=W-snake.r;snake.angle=Math.PI-snake.angle;}
  if(snake.y<snake.r){snake.y=snake.r;snake.angle=-snake.angle;}
  if(snake.y>H-snake.r){snake.y=H-snake.r;snake.angle=-snake.angle;}

  // body follow
  var spacing=7;
  for(var i=0;i<segs.length;i++){
    var s=segs[i],p=i===0?snake:segs[i-1];
    var dx=s.x-p.x,dy=s.y-p.y,dist=Math.hypot(dx,dy)||0.0001;
    if(dist>spacing){var mv=(dist-spacing);s.x-=dx/dist*mv;s.y-=dy/dist*mv;}
  }

  // shield
  if(shieldTime>0)shieldTime-=dt;

  // food
  for(var fi=foods.length-1;fi>=0;fi--){
    var f=foods[fi];f.pulse+=dt*5;
    if(Math.hypot(f.x-snake.x,f.y-snake.y)<snake.r+12){
      foods.splice(fi,1);
      if(f.shield){shieldTime=3.5;beep(880,0.2,'sine',0.5,400);boom(f.x,f.y,'#5ad7ff',20,180);}
      else{score+=10;beep(660,0.12,'square',0.4,300);boom(f.x,f.y,'#ffd94a',14,140);
        for(var g=0;g<3;g++)segs.push({x:snake.x,y:snake.y});}
      spawnFood();
    }
  }

  // enemy spawning
  spawnTimer-=dt;
  var maxE=Math.min(7,2+Math.floor(t/18));
  if(spawnTimer<=0&&enemies.length<maxE){spawnEnemy();spawnTimer=Math.max(0.9,2.6-t*0.03);}

  // enemies
  for(var ei=enemies.length-1;ei>=0;ei--){
    var e=enemies[ei];e.life-=dt;
    if(e.type==='seeker'){
      var a=aimAt(e),msp=55*diff;
      e.vx+=(Math.cos(a)*msp-e.vx)*dt*1.2;e.vy+=(Math.sin(a)*msp-e.vy)*dt*1.2;
      e.fireT-=dt;
      if(e.fireT<=0){
        e.fireT=Math.max(0.9,1.8-t*0.01);
        for(var b=-1;b<=1;b++)addBullet(e.x,e.y,a+b*0.22,(150+t*1.5),'#ff7d9e',5);
        beep(300,0.06,'square',0.15,-80);shootSfxCd=0.08;
      }
    }else if(e.type==='spinner'){
      e.x+=Math.sin(t*0.5+e.spin)*24*dt;e.y+=Math.cos(t*0.4+e.spin)*24*dt;
      e.fireT-=dt;
      if(e.fireT<=0){
        e.fireT=0.16;e.spin+=0.42;
        addBullet(e.x,e.y,e.spin,130+t*1.2,'#c48bff',5);
        addBullet(e.x,e.y,e.spin+Math.PI,130+t*1.2,'#c48bff',5);
      }
    }else{ // bomber
      var ab=aimAt(e),bsp=70*diff;
      e.vx+=(Math.cos(ab)*bsp-e.vx)*dt;e.vy+=(Math.sin(ab)*bsp-e.vy)*dt;
      e.x+=e.vx*dt;e.y+=e.vy*dt;
      e.fuse-=dt;
      if(e.fuse<=0){
        enemies.splice(ei,1);
        var n=18;
        for(var k=0;k<n;k++)addBullet(e.x,e.y,k/n*Math.PI*2,140+t,'#ffb34a',6);
        boom(e.x,e.y,'#ffb34a',24,200);noiseBurst(0.25,0.35);beep(90,0.3,'sawtooth',0.4,-50);
        continue;
      }
    }
    if(e.type!=='bomber'){e.x+=e.vx*dt;e.y+=e.vy*dt;}
    e.x=Math.max(-60,Math.min(W+60,e.x));e.y=Math.max(-60,Math.min(H+60,e.y));
    if(e.life<=0){enemies.splice(ei,1);continue;}
    // collision with snake
    if(Math.hypot(e.x-snake.x,e.y-snake.y)<e.r+snake.r-2){die();return;}
  }

  // bullets
  for(var bi=bullets.length-1;bi>=0;bi--){
    var bu=bullets[bi];
    bu.x+=bu.vx*dt;bu.y+=bu.vy*dt;
    if(bu.x<-30||bu.x>W+30||bu.y<-30||bu.y>H+30){bullets.splice(bi,1);continue;}
    if(shieldTime>0){
      if(Math.hypot(bu.x-snake.x,bu.y-snake.y)<26){
        bullets.splice(bi,1);boom(bu.x,bu.y,'#5ad7ff',6,120);beep(1200,0.05,'sine',0.2);continue;
      }
    }else{
      if(Math.hypot(bu.x-snake.x,bu.y-snake.y)<bu.r+snake.r-1){die();return;}
      for(var si=0;si<segs.length;si+=2){
        var sg=segs[si];
        if(Math.hypot(bu.x-sg.x,bu.y-sg.y)<bu.r+5){die();return;}
      }
    }
  }

  // particles
  for(var pi=particles.length-1;pi>=0;pi--){
    var p=particles[pi];p.life-=dt;
    if(p.life<=0){particles.splice(pi,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;
  }
  if(shake>0)shake=Math.max(0,shake-40*dt);
  scoreEl.textContent='SCORE '+Math.floor(score);
  timeEl.textContent=fmt(t);
}

/* ---------- draw ---------- */
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  // bg
  var grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  grad.addColorStop(0,'#0b1030');grad.addColorStop(1,'#04050e');
  ctx.fillStyle=grad;ctx.fillRect(-20,-20,W+40,H+40);
  // grid
  ctx.strokeStyle='rgba(80,120,255,0.06)';ctx.lineWidth=1;
  var gs=48;
  ctx.beginPath();
  for(var gx=(t*10)%gs;gx<W;gx+=gs){ctx.moveTo(gx,0);ctx.lineTo(gx,H);}
  for(var gy=(t*10)%gs;gy<H;gy+=gs){ctx.moveTo(0,gy);ctx.lineTo(W,gy);}
  ctx.stroke();

  if(state==='play'||state==='over'){
    // foods
    for(var fi=0;fi<foods.length;fi++){
      var f=foods[fi],pr=8+Math.sin(f.pulse)*2;
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.PI/4);
      ctx.shadowColor=f.shield?'#5ad7ff':'#ffd94a';ctx.shadowBlur=16;
      ctx.fillStyle=f.shield?'#5ad7ff':'#ffd94a';
      ctx.fillRect(-pr/1.4,-pr/1.4,pr*1.4,pr*1.4);
      ctx.restore();
    }

    // bullets
    for(var bi=0;bi<bullets.length;bi++){
      var bu=bullets[bi];
      ctx.shadowColor=bu.color;ctx.shadowBlur=12;
      ctx.fillStyle=bu.color;
      ctx.beginPath();ctx.arc(bu.x,bu.y,bu.r,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath();ctx.arc(bu.x,bu.y,bu.r*0.45,0,Math.PI*2);ctx.fill();
    }

    // enemies
    for(var ei=0;ei<enemies.length;ei++){
      var e=enemies[ei];
      ctx.save();ctx.translate(e.x,e.y);
      var blink=e.type==='bomber'&&e.fuse<1&&Math.sin(t*30)>0;
      ctx.shadowColor=e.color;ctx.shadowBlur=14;
      ctx.fillStyle=blink?'#fff':e.color;
      if(e.type==='seeker'){
        var a=aimAt(e);ctx.rotate(a);
        ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-5,0);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();
      }else if(e.type==='spinner'){
        ctx.rotate(t*2+e.spin);
        for(var k=0;k<3;k++){ctx.rotate(Math.PI*2/3);ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(5,4);ctx.lineTo(-5,4);ctx.closePath();ctx.fill();}
      }else{
        ctx.rotate(t*4);
        ctx.beginPath();
        for(var k=0;k<8;k++){var ang=k/8*Math.PI*2,rr=k%2?7:14;ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);}
        ctx.closePath();ctx.fill();
      }
      ctx.restore();
    }

    // snake
    if(state==='play'){
      for(var si=segs.length-1;si>=0;si--){
        var s=segs[si],fr=si/segs.length;
        var r=9-(5*fr);
        ctx.shadowColor='#35e08a';ctx.shadowBlur=8;
        ctx.fillStyle='hsl('+(140-20*fr)+',75%,'+(60-25*fr)+'%)';
        ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
      }
      // head
      ctx.shadowBlur=18;
      ctx.fillStyle='#b4ffd9';
      ctx.beginPath();ctx.arc(snake.x,snake.y,snake.r+1,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      var hx=Math.cos(snake.angle),hy=Math.sin(snake.angle);
      ctx.fillStyle='#08341f';
      ctx.beginPath();ctx.arc(snake.x+hx*4-hy*4,snake.y+hy*4+hx*4,2.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(snake.x+hx*4+hy*4,snake.y+hy*4-hx*4,2.2,0,Math.PI*2);ctx.fill();
      if(shieldTime>0){
        ctx.strokeStyle='rgba(90,215,255,'+(0.5+0.3*Math.sin(t*12))+')';
        ctx.lineWidth=3;ctx.shadowColor='#5ad7ff';ctx.shadowBlur=16;
        ctx.beginPath();ctx.arc(snake.x,snake.y,26,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
      }
    }
  }

  // particles
  for(var pi=0;pi<particles.length;pi++){
    var p=particles[pi];
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------- loop ---------- */
var last=performance.now();
function loop(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  else if(state==='over'){
    deathT+=dt;
    for(var pi=particles.length-1;pi>=0;pi--){
      var p=particles[pi];p.life-=dt;
      if(p.life<=0){particles.splice(pi,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;
    }
    if(shake>0)shake=Math.max(0,shake-30*dt);
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
