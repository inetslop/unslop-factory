<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Snake Pinball</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=400,H=620, dpr=1, scale=1, offX=0, offY=0;

function resize(){
  dpr=window.devicePixelRatio||1;
  cv.width=Math.floor(window.innerWidth*dpr);
  cv.height=Math.floor(window.innerHeight*dpr);
  cv.style.width=window.innerWidth+'px';
  cv.style.height=window.innerHeight+'px';
  scale=Math.min(cv.width/(W+30),cv.height/(H+30));
  offX=(cv.width-W*scale)/2; offY=(cv.height-H*scale)/2;
}
window.addEventListener('resize',resize); resize();

// ---------- audio ----------
var AC=null;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f,d,type,v,slide){
  if(!AC)return;
  try{
    var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||0.12,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
  }catch(e){}
}
var sBumper=function(){beep(560+Math.random()*140,0.08,'square',0.13);};
var sSling=function(){beep(300,0.07,'sawtooth',0.12);};
var sFlip=function(){beep(110,0.06,'sine',0.16);};
var sLaunch=function(){beep(200,0.25,'square',0.14,600);};
var sDrain=function(){beep(380,0.4,'sawtooth',0.16,-300);};
var sOver=function(){beep(220,0.6,'triangle',0.18,-160);};

// ---------- state ----------
var state='start'; // start | playing | gameover
var paused=false;
var score=0, lives=3, hiScore=0;
try{hiScore=parseInt(localStorage.getItem('snakePinballHi')||'0',10)||0;}catch(e){}
function saveHi(){ try{localStorage.setItem('snakePinballHi',''+hiScore);}catch(e){} }

var ball={x:379,y:582,vx:0,vy:0,r:9,inPlunger:true};
var charge=0;
var keys={left:false,right:false};
var texts=[];

// flippers (y down)
var fL={px:140,py:540,len:55,a:0.30,rest:0.30,act:-0.62,w:0};
var fR={px:260,py:540,len:55,a:Math.PI-0.30,rest:Math.PI-0.30,act:Math.PI+0.62,w:0};

// bumpers
var bumpers=[
  {x:150,y:170,r:22,flash:0},
  {x:250,y:170,r:22,flash:0},
  {x:200,y:272,r:22,flash:0}
];

// slingshots (segment + flash)
var slings=[
  {x1:55,y1:480,x2:95,y2:548,flash:0},
  {x1:305,y1:480,x2:265,y2:548,flash:0}
];

// static guide segments
var guides=[
  {x1:9,y1:460,x2:140,y2:540},   // left guide
  {x1:360,y1:460,x2:260,y2:540}, // right guide
  {x1:360,y1:215,x2:360,y2:620}  // lane divider
];

// snake
var SNK_N=11, sp=10;
var snake=[];
function resetSnake(){
  snake=[];
  for(var i=0;i<SNK_N;i++) snake.push({x:70,y:80-i*sp});
}
resetSnake();
var invuln=0;

function addText(x,y,s){ texts.push({x:x,y:y,s:s,t:50}); }

function resetBall(){
  ball.x=379; ball.y=582; ball.vx=0; ball.vy=0; ball.inPlunger=true;
}
function newGame(){
  score=0; lives=3; charge=0; invuln=120; texts=[];
  resetBall(); resetSnake();
  state='playing'; paused=false;
}

// ---------- physics helpers ----------
function segCollide(b,x1,y1,x2,y2,rest){
  var dx=x2-x1, dy=y2-y1;
  var L2=dx*dx+dy*dy;
  var t=((b.x-x1)*dx+(b.y-y1)*dy)/L2;
  t=Math.max(0,Math.min(1,t));
  var qx=x1+t*dx, qy=y1+t*dy;
  var nx=b.x-qx, ny=b.y-qy;
  var d=Math.sqrt(nx*nx+ny*ny);
  if(d>=b.r||d===0)return false;
  nx/=d; ny/=d;
  b.x=qx+nx*b.r; b.y=qy+ny*b.r;
  var vn=b.vx*nx+b.vy*ny;
  if(vn<0){ b.vx-=(1+rest)*vn*nx; b.vy-=(1+rest)*vn*ny; }
  return true;
}

function flipperTip(f){ return {x:f.px+Math.cos(f.a)*f.len, y:f.py+Math.sin(f.a)*f.len}; }

function flipperCollide(b,f){
  var t=flipperTip(f);
  var dx=t.x-f.px, dy=t.y-f.py;
  var L2=dx*dx+dy*dy;
  var p=((b.x-f.px)*dx+(b.y-f.py)*dy)/L2;
  p=Math.max(0,Math.min(1,p));
  var qx=f.px+p*dx, qy=f.py+p*dy;
  var nx=b.x-qx, ny=b.y-qy;
  var d=Math.sqrt(nx*nx+ny*ny);
  var R=b.r+6;
  if(d>=R||d===0)return false;
  nx/=d; ny/=d;
  b.x=qx+nx*R; b.y=qy+ny*R;
  // surface velocity at contact (rotation about pivot)
  var rx=qx-f.px, ry=qy-f.py;
  var svx=-f.w*ry, svy=f.w*rx;
  var rvx=b.vx-svx, rvy=b.vy-svy;
  var vn=rvx*nx+rvy*ny;
  if(vn<0){
    b.vx-=(1+0.35)*vn*nx+0; 
    b.vy-=(1+0.35)*vn*ny;
    b.vx+=svx*0.25; b.vy+=svy*0.25;
    if(-vn>0.6) sFlip();
  }
  return true;
}

function updateFlippers(){
  var targets=[{f:fL,on:keys.left},{f:fR,on:keys.right}];
  for(var i=0;i<2;i++){
    var o=targets[i], f=o.f;
    var target=o.on?f.act:f.rest;
    var sp2=0.38;
    var prev=f.a;
    if(Math.abs(target-f.a)<=sp2) f.a=target;
    else f.a+=Math.sign(target-f.a)*sp2;
    f.w=f.a-prev;
  }
}

function physicsStep(){
  ball.vy+=0.14/4*4; // gravity per full frame (applied per substep below)
}

function stepBall(){
  var b=ball, SUB=4;
  for(var s=0;s<SUB;s++){
    b.vy+=0.135/SUB*SUB; // = 0.135 per frame total? apply small per substep:
    b.vy+=0; // (gravity handled below)
  }
  // simpler: do gravity + move per substep
  for(var s2=0;s2<SUB;s2++){
    b.vy+=0.135/SUB;
    b.x+=b.vx/SUB; b.y+=b.vy/SUB;

    if(b.inPlunger){
      // confined to lane bottom
      if(b.x<369){b.x=369;b.vx=Math.abs(b.vx)*0.4;}
      if(b.x>391){b.x=391;b.vx=-Math.abs(b.vx)*0.4;}
      if(b.y>582){b.y=582; if(b.vy>0)b.vy*=-0.3;}
      if(b.y<9){b.y=9;b.vy=Math.abs(b.vy)*0.5;}
    } else {
      // walls
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*0.7;}
      if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*0.7;}
      if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*0.7;}
      // guides / divider
      for(var g=0;g<guides.length;g++){var gd=guides[g]; segCollide(b,gd.x1,gd.y1,gd.x2,gd.y2,0.55);}
    }
    // slingshots (both states)
    for(var sl=0;sl<slings.length;sl++){
      var S=slings[sl];
      if(segCollide(b,S.x1,S.y1,S.x2,S.y2,0.9)){
        var sp3=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        if(sp3<5){ b.vx*=5/sp3; b.vy*=5/sp3; }
        S.flash=12; addText((S.x1+S.x2)/2,(S.y1+S.y2)/2,'25'); score+=25; sSling();
      }
    }
    // bumpers
    for(var i=0;i<bumpers.length;i++){
      var bm=bumpers[i];
      var nx=b.x-bm.x, ny=b.y-bm.y;
      var d=Math.sqrt(nx*nx+ny*ny);
      if(d<bm.r+b.r&&d>0){
        nx/=d; ny/=d;
        b.x=bm.x+nx*(bm.r+b.r); b.y=bm.y+ny*(bm.r+b.r);
        var vn=b.vx*nx+b.vy*ny;
        if(vn<0){ b.vx-=2*vn*nx; b.vy-=2*vn*ny; }
        var sp4=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        if(sp4<4.5){ b.vx*=4.5/sp4; b.vy*=4.5/sp4; }
        bm.flash=14; score+=100; addText(bm.x,bm.y-bm.r-6,'100'); sBumper();
      }
    }
    // flippers
    flipperCollide(b,fL);
    fliperFix(fL);
    flipperCollide(b,fR);

    // clamp speed
    var sp5=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(sp5>13){ b.vx*=13/sp5; b.vy*=13/sp5; }
  }
  function fliperFix(f){}
}

function updateSnake(){
  var speed=1.5+Math.min(1.2,score/6000);
  var h=snake[0];
  var dx=ball.x-h.x, dy=ball.y-h.y;
  var d=Math.sqrt(dx*dx+dy*dy)||1;
  var tx=dx/d, ty=dy/d;
  // steer: keep a velocity dir stored on head
  if(!h.vx){h.vx=tx;h.vy=ty;}
  h.vx+=(tx-h.vx)*0.10; h.vy+=(ty-h.vy)*0.10;
  var dl=Math.sqrt(h.vx*h.vx+h.vy*h.vy)||1;
  h.vx/=dl; h.vy/=dl;
  h.x+=h.vx*speed; h.y+=h.vy*speed;
  // keep in bounds
  h.x=Math.max(16,Math.min(W-16,h.x));
  h.y=Math.max(30,Math.min(H-16,h.y));
  for(var i=1;i<SNK_N;i++){
    var p=snake[i], q=snake[i-1];
    var ex=q.x-p.x, ey=q.y-p.y;
    var el=Math.sqrt(ex*ex+ey*ey)||1;
    p.x=q.x-ex/el*sp; p.y=q.y-ey/el*sp;
  }
  // collision with ball
  if(invuln>0){invuln--;return;}
  for(var i2=0;i2<SNK_N;i2++){
    var s3=snake[i2];
    var rr=(i2===0?8:5)+ball.r-3;
    var ddx=s3.x-ball.x, ddy=s3.y-ball.y;
    if(ddx*ddx+ddy*ddy<rr*rr){
      lives--; invuln=130; sDrain();
      addText(ball.x,ball.y-20,'OUCH!');
      if(lives<=0){
        state='gameover'; sOver();
        if(score>hiScore){hiScore=score;saveHi();}
      } else {
        resetBall(); resetSnake();
      }
      return;
    }
  }
}

function drainCheck(){
  if(!ball.inPlunger && ball.y>H+25){
    lives--; sDrain();
    addText(200,400,'DRAIN!');
    if(lives<=0){
      state='gameover'; sOver();
      if(score>hiScore){hiScore=score;saveHi();}
    } else {
      resetBall(); resetSnake(); invuln=90;
    }
  }
}

// ---------- input ----------
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=true;
  if(k==='ArrowRight'||k==='d'||k==='D')keys.right=true;
  if(k===' '||k==='Spacebar'){ e.preventDefault(); initAudio();
    if(state==='start'){newGame();return;}
    if(state==='gameover'){newGame();return;}
    charging=true;
  }
  if(k==='Enter'){ initAudio();
    if(state==='start'||state==='gameover')newGame();
  }
  if(k==='p'||k==='P'){ if(state==='playing')paused=!paused; }
  if(k==='r'||k==='R'){ initAudio(); newGame(); }
  if(k.indexOf('Arrow')===0)e.preventDefault();
});
var charging=false;
window.addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=false;
  if(k==='ArrowRight'||k==='d'||k==='D')keys.right=false;
  if(k===' '||k==='Spacebar'){
    charging=false;
    if(state==='playing'&&!paused&&ball.inPlunger){
      ball.vy=-(9+charge*5.5);
      ball.inPlunger=false;
      sLaunch();
    }
    charge=0;
  }
});

// ---------- drawing ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#05060d';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,offX,offY);

  // table
  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#141a33'); grd.addColorStop(1,'#0c1024');
  rr(-8,-8,W+16,H+16,18); ctx.fillStyle=grd; ctx.fill();
  // playfield border
  ctx.strokeStyle='#3a4a8a'; ctx.lineWidth=4;
  rr(-6,-6,W+12,H+12,16); ctx.stroke();

  // lane divider
  ctx.strokeStyle='#5566aa'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(360,215); ctx.lineTo(360,H-8); ctx.stroke();
  // guides
  ctx.strokeStyle='#7a4a2a'; ctx.lineWidth=5;
  ctx.lineCap='round';
  for(var g=0;g<2;g++){var gd=guides[g];ctx.beginPath();ctx.moveTo(gd.x1,gd.y1);ctx.lineTo(gd.x2,gd.y2);ctx.stroke();}

  // slingshots
  for(var s=0;s<slings.length;s++){
    var S=slings[s];
    ctx.strokeStyle=S.flash>0?'#ffffff':'#e33';
    ctx.lineWidth=9;
    ctx.beginPath();ctx.moveTo(S.x1,S.y1);ctx.lineTo(S.x2,S.y2);ctx.stroke();
    if(S.flash>0)S.flash--;
  }

  // bumpers
  for(var i=0;i<bumpers.length;i++){
    var bm=bumpers[i];
    var f=bm.flash/14;
    ctx.beginPath(); ctx.arc(bm.x,bm.y,bm.r,0,7);
    ctx.fillStyle='rgba(255,80,60,'+(0.25+f*0.5)+')'; ctx.fill();
    ctx.beginPath(); ctx.arc(bm.x,bm.y,bm.r-6,0,7);
    ctx.fillStyle=f>0?'#fff':'#f4c030'; ctx.fill();
    ctx.beginPath(); ctx.arc(bm.x,bm.y,bm.r-12,0,7);
    ctx.fillStyle='#e05020'; ctx.fill();
    if(bm.flash>0)bm.flash--;
  }

  // flippers
  for(var fi=0;fi<2;fi++){
    var F=(fi===0)?fL:fR, t=flipperTip(F);
    ctx.strokeStyle='#ffd75e'; ctx.lineWidth=13; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(F.px,F.py);ctx.lineTo(t.x,t.y);ctx.stroke();
    ctx.strokeStyle='#c89a2e'; ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(F.px,F.py);ctx.lineTo(t.x,t.y);ctx.stroke();
  }

  // plunger
  if(ball.inPlunger){
    var ph=10+charge*30;
    ctx.fillStyle='#e33';
    ctx.fillRect(368,596-ph,24,ph);
    ctx.fillStyle='#fff';
    ctx.font='10px monospace'; ctx.textAlign='center';
    ctx.fillText('HOLD SPACE',378,612);
  }

  // snake (blink when invulnerable)
  if(!(invuln>0 && (Math.floor(invuln/5)%2===0))){
    for(var n=SNK_N-1;n>=0;n--){
      var sg=snake[n];
      var rad=(n===0)?8:(5+3*(n/SNK_N));
      ctx.beginPath(); ctx.arc(sg.x,sg.y,rad,0,7);
      if(n===0)ctx.fillStyle='#4dff6e';
      else ctx.fillStyle='rgb('+(40+n*3)+','+(190-n*8)+',80)';
      ctx.fill();
    }
    // eyes
    var hd=snake[0];
    var ea=Math.atan2(hd.vy||1,hd.vx||0);
    ctx.fillStyle='#042';
    for(var e2=-1;e2<=1;e2+=2){
      ctx.beginPath();
      ctx.arc(hd.x+Math.cos(ea+e2*0.5)*4, hd.y+Math.sin(ea+e2*0.5)*4, 2.4,0,7);
      ctx.fill();
    }
  }

  // ball
  if(state!=='start'){
    var bg=ctx.createRadialGradient(ball.x-3,ball.y-3,1,ball.x,ball.y,ball.r);
    bg.addColorStop(0,'#fff'); bg.addColorStop(1,'#9aa8cc');
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7);
    ctx.fillStyle=bg; ctx.fill();
  }

  // floating texts
  for(var tx2=texts.length-1;tx2>=0;tx2--){
    var T=texts[tx2];
    T.t--; T.y-=0.6;
    if(T.t<=0){texts.splice(tx2,1);continue;}
    ctx.globalAlpha=Math.min(1,T.t/30);
    ctx.fillStyle='#ffd75e'; ctx.font='bold 14px monospace'; ctx.textAlign='center';
    ctx.fillText(T.s,T.x,T.y);
    ctx.globalAlpha=1;
  }

  // HUD
  if(state!=='start'){
    ctx.font='bold 16px monospace'; ctx.textAlign='left';
    ctx.fillStyle='#fff'; ctx.fillText('SCORE '+score,14,26);
    ctx.textAlign='right'; ctx.fillStyle='#8fd0ff';
    ctx.fillText('HI '+hiScore,W-14,26);
    ctx.textAlign='center';
    for(var l=0;l<lives;l++){
      ctx.beginPath(); ctx.arc(W/2-20+l*20,22,5,0,7);
      ctx.fillStyle='#e33'; ctx.fill();
    }
  }

  // overlays
  function overlay(title,lines){
    ctx.fillStyle='rgba(4,6,16,0.82)';
    ctx.fillRect(-8,-8,W+16,H+16);
    ctx.textAlign='center';
    ctx.fillStyle='#4dff6e';
    ctx.font='bold 34px monospace';
    ctx.fillText(title,W/2,H/2-90);
    ctx.fillStyle='#fff'; ctx.font='14px monospace';
    for(var i=0;i<lines.length;i++)
      ctx.fillText(lines[i],W/2,H/2-40+i*22);
  }
  if(state==='start'){
    overlay('SNAKE PINBALL',[
      'Bounce the ball, score points,',
      'but avoid the hungry snake!',
      '',
      '< / A : left flipper',
      '> / D : right flipper',
      'SPACE (hold) : charge & launch',
      'P : pause    R : restart'
    ]);
    ctx.fillStyle='#ffd75e'; ctx.font='bold 16px monospace';
    if(Math.floor(Date.now()/500)%2===0)ctx.fillText('PRESS ENTER TO START',W/2,H/2+130);
  } else if(state==='gameover'){
    overlay('GAME OVER',[
      'Score: '+score,
      'Best:  '+hiScore,
      '',
      'Press ENTER to play again'
    ]);
  } else if(paused){
    ctx.fillStyle='rgba(4,6,16,0.7)'; ctx.fillRect(-8,-8,W+16,H+16);
    ctx.fillStyle='#fff'; ctx.font='bold 28px monospace'; ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,H/2);
    ctx.font='14px monospace';
    ctx.fillText('Press P to resume',W/2,H/2+30);
  }
}

// ---------- main loop ----------
function tick(){
  if(state==='playing'&&!paused){
    updateFlippers();
    stepBall();
    drainCheck();
    updateSnake();
    if(charging)charge=Math.min(1,charge+0.02);
  } else {
    // idle flipper settle on other screens
    fL.w=0;fR.w=0;
  }
  draw();
  requestAnimationFrame(tick);
}
tick();
})();
</script>
</body>
</html>
