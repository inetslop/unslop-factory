<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Asteroids Breakout</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#04050e;height:100%;}
  canvas{display:block;width:100vw;height:100vh;cursor:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var W=900,H=620;
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var scale=1,offX=0,offY=0;

function resize(){
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  scale=Math.min(cv.width/W,cv.height/H);
  offX=(cv.width-W*scale)/2;offY=(cv.height-H*scale)/2;
}
window.addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
var actx=null;
function initAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }
function beep(f,dur,type,vol,slide){
  if(!actx)return;
  dur=dur||0.08;type=type||'square';vol=vol||0.12;slide=slide||0;
  var t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfx(name){
  switch(name){
    case 'paddle':beep(240,0.07,'triangle',0.18);break;
    case 'wall':beep(160,0.05,'triangle',0.1);break;
    case 'brick':beep(420+Math.random()*160,0.09,'square',0.14,-120);break;
    case 'laser':beep(880,0.12,'sawtooth',0.08,-500);break;
    case 'boom':beep(110,0.3,'sawtooth',0.22,-70);beep(60,0.35,'square',0.15,-30);break;
    case 'deflect':beep(300,0.08,'triangle',0.14,-90);break;
    case 'lose':beep(300,0.5,'sawtooth',0.2,-240);break;
    case 'launch':beep(500,0.12,'square',0.12,300);break;
    case 'win':[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,0.18,'square',0.15);},i*140);});break;
  }
}

/* ---------- state ---------- */
var STATE='start'; // start | play | over | win
var keys={},mouseX=null;
var paddle,ball,bricks=[],asteroids=[],bullets=[],particles=[];
var score=0,lives=3,highScore=0,serve=false,spawnT=2,shootCd=0,shake=0;
try{highScore=parseInt(localStorage.getItem('ab_high')||'0',10)||0;}catch(e){}
function saveHigh(){ if(score>highScore){highScore=score;try{localStorage.setItem('ab_high',''+highScore);}catch(e){}} }

var stars=[];
(function(){for(var i=0;i<130;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,tw:Math.random()*6.28});})();

var ROWCOLS=['#ff5e7a','#ffb84d','#ffe94d','#6dfc8f','#5ecbff'];
function buildBricks(){
  bricks=[];
  var cols=10,rows=5,mL=45,gap=6,top=70,bh=22;
  var bw=(W-mL*2-gap*(cols-1))/cols;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    bricks.push({x:mL+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,row:r,
      hp:(r===0?3:(r<2?2:1)),maxHp:(r===0?3:(r<2?2:1))});
  }
}
function reset(){
  buildBricks();asteroids=[];bullets=[];particles=[];
  score=0;lives=3;serve=true;spawnT=1.5;shootCd=0;shake=0;
  paddle={x:W/2,y:H-34,w:112,h:14,vx:0};
  ball={x:paddle.x,y:paddle.y-12,r:7,vx:0,vy:0,trail:[]};
}

function newAsteroid(tier,x,y){
  tier=tier||3;
  var r=tier===3?34:(tier===2?22:13);
  if(x===undefined){x=r+Math.random()*(W-2*r);y=-r-Math.random()*60;}
  var n=9+Math.floor(Math.random()*4),pts=[];
  for(var i=0;i<n;i++)pts.push(0.72+Math.random()*0.35);
  asteroids.push({x:x,y:y,r:r,tier:tier,ang:Math.random()*6.28,
    spin:(Math.random()-0.5)*0.04,
    vx:(Math.random()-0.5)*2.2,vy:0.9+Math.random()*1.3,pts:pts});
}
function burst(x,y,col,n,spd){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.28,s=(0.4+Math.random())* (spd||2.4);
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col:col,size:1.5+Math.random()*2.5});
  }
}

/* ---------- input ---------- */
window.addEventListener('keydown',function(e){
  initAudio();
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
  if(STATE==='start'&&(e.code==='Enter'||e.code==='Space')){reset();STATE='play';}
  else if((STATE==='over'||STATE==='win')&&e.code==='KeyR'){reset();STATE='play';}
  else if(STATE==='play'){
    if(e.code==='KeyR'){reset();}
    if(serve&&(e.code==='Space'||e.code==='Enter'))launchBall();
    else if(!serve&&e.code==='Space')shoot();
  }
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
window.addEventListener('mousemove',function(e){initAudio();mouseX=e.clientX;});
cv.addEventListener('mousedown',function(e){
  initAudio();
  if(STATE==='start'){reset();STATE='play';}
  else if(STATE==='play'){ if(serve)launchBall();else shoot(); }
  else {reset();STATE='play';}
});

function launchBall(){
  serve=false;
  var a=(Math.random()-0.5)*0.6,sp=5.4;
  ball.vx=Math.sin(a)*sp;ball.vy=-Math.cos(a)*sp;
  sfx('launch');
}
function shoot(){
  if(shootCd>0)return;
  shootCd=0.28;
  bullets.push({x:paddle.x-16,y:paddle.y-10,vy:-11});
  bullets.push({x:paddle.x+16,y:paddle.y-10,vy:-11});
  sfx('laser');
}

/* ---------- collision helpers ---------- */
function circleRect(cx,cy,r,b){
  var nx=Math.max(b.x,Math.min(cx,b.x+b.w));
  var ny=Math.max(b.y,Math.min(cy,b.y+b.h));
  var dx=cx-nx,dy=cy-ny,d2=dx*dx+dy*dy;
  if(d2>r*r)return null;
  var d=Math.sqrt(d2)||0.001;
  if(d===0.001){ // center inside rect: push up
    return {nx:0,ny:-1};
  }
  return {nx:dx/d,ny:dy/d};
}

/* ---------- update ---------- */
function damageBrick(b,dmg){
  b.hp-=dmg;
  burst(ball.x||W/2,ball.y||H,'#fff',4,1.5);
  if(b.hp<=0){
    var idx=bricks.indexOf(b);if(idx>=0)bricks.splice(idx,1);
    score+= (5-b.row)*10+10;
    burst(b.x+b.w/2,b.y+b.h/2,ROWCOLS[b.row],14);
    sfx('brick');
  } else { sfx('wall'); }
}

function update(dt){
  if(STATE!=='play')return;
  shootCd-=dt;shake=Math.max(0,shake-dt*30);

  // paddle
  var pv=7.5;
  if(keys['ArrowLeft']||keys['KeyA'])paddle.x-=pv;
  if(keys['ArrowRight']||keys['KeyD'])paddle.x+=pv;
  if(mouseX!==null){
    var lx=(mouseX-offX)/scale;
    paddle.x+=(lx-paddle.x)*0.45;
  }
  paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));

  // ball
  if(serve){ball.x=paddle.x;ball.y=paddle.y-12;}
  else{
    var steps=2;
    for(var s=0;s<steps;s++){
      ball.x+=ball.vx/steps;ball.y+=ball.vy/steps;
      if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);sfx('wall');}
      if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);sfx('wall');}
      if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);sfx('wall');}

      // paddle
      var b=ball,rel=(b.x-paddle.x)/(paddle.w/2);
      if(b.vy>0&&b.y+b.r>=paddle.y&&b.y-b.r<=paddle.y+paddle.h&&Math.abs(rel)<=1.05){
        rel=Math.max(-1,Math.min(1,rel));
        var sp=Math.min(9,Math.hypot(b.vx,b.vy)+0.08),a=rel*1.05;
        b.vx=sp*Math.sin(a);b.vy=-sp*Math.cos(a);
        b.y=paddle.y-b.r-0.5;
        sfx('paddle');
      }

      // bricks
      for(var i=bricks.length-1;i>=0;i--){
        var br=bricks[i],hit=circleRect(b.x,b.y,b.r,br);
        if(hit){
          var dot=b.vx*hit.nx+b.vy*hit.ny;
          if(dot<0){b.vx-=2*dot*hit.nx;b.vy-=2*dot*hit.ny;}
          b.x+=hit.nx*0.5;b.y+=hit.ny*0.5;
          damageBrick(br,1);
          break;
        }
      }

      // asteroids (deflect)
      for(var j=0;j<asteroids.length;j++){
        var ast=asteroids[j];
        var dx=b.x-ast.x,dy=b.y-ast.y,d=Math.hypot(dx,dy),rr=ast.r+b.r;
        if(d<rr&&d>0.001){
          var nx=dx/d,ny=dy/d;
          var d2=b.vx*nx+b.vy*ny;
          if(d2<0){b.vx-=2*d2*nx;b.vy-=2*d2*ny;}
          b.x=ast.x+nx*(rr+0.5);b.y=ast.y+ny*(rr+0.5);
          ast.vx+=nx*0.4;ast.vy+=ny*0.4;
          sfx('deflect');shake=3;
        }
      }
    }
    // keep some vertical motion
    if(Math.abs(ball.vy)<1.1)ball.vy=(ball.vy<0?-1:1)*1.1;

    ball.trail.push({x:ball.x,y:ball.y});
    if(ball.trail.length>10)ball.trail.shift();

    if(ball.y>H+ball.r*2){
      lives--;sfx('lose');shake=8;
      burst(ball.x,H-10,'#ff5e7a',20);
      if(lives<=0){saveHigh();STATE='over';}
      else serve=true;
    }
  }

  // asteroid spawning
  var cap=Math.min(6,3+Math.floor((bricks.length<40?1:0)+(bricks.length<20?1:0)));
  if(bricks.length>0){
    spawnT-=dt;
    if(spawnT<=0&&asteroids.length<cap){newAsteroid(Math.random()<0.6?3:2);spawnT=2+Math.random()*2.5;}
  }

  // asteroids
  for(var k=asteroids.length-1;k>=0;k--){
    var a2=asteroids[k];
    a2.x+=a2.vx;a2.y+=a2.vy;a2.ang+=a2.spin;
    if(a2.x<a2.r){a2.x=a2.r;a2.vx=Math.abs(a2.vx);}
    if(a2.x>W-a2.r){a2.x=W-a2.r;a2.vx=-Math.abs(a2.vx);}
    if(a2.y<a2.r){a2.y=a2.r;a2.vy=Math.abs(a2.vy);}
    if(a2.y>H+a2.r*2)asteroids.splice(k,1);
  }

  // bullets
  for(var m=bullets.length-1;m>=0;m--){
    var bu=bullets[m];bu.y+=bu.vy;
    var dead=bu.y<-20;
    if(!dead)for(var n2=asteroids.length-1;n2>=0;n2--){
      var as=asteroids[n2],d3=Math.hypot(bu.x-as.x,bu.y-as.y);
      if(d3<as.r+4){
        asteroids.splice(n2,1);
        score+=as.tier*15;
        burst(as.x,as.y,'#c9b8ff',as.tier*7,3);
        sfx('boom');shake=Math.max(shake,as.tier*2);
        if(as.tier>1){
          newAsteroid(as.tier-1,as.x-10,as.y);newAsteroid(as.tier-1,as.x+10,as.y);
          asteroids[asteroids.length-1].vx=-Math.abs(asteroids[asteroids.length-1].vx)-0.5;
          asteroids[asteroids.length-2].vx=Math.abs(asteroids[asteroids.length-2].vx)+0.5;
        }
        dead=true;break;
      }
    }
    if(!dead)for(var p=bricks.length-1;p>=0;p--){
      var bk=bricks[p];
      if(bu.x>bk.x&&bu.x<bk.x+bk.w&&bu.y>bk.y&&bu.y<bk.y+bk.h){
        damageBrick(bk,1);dead=true;break;
      }
    }
    if(dead)bullets.splice(m,1);
  }

  // particles
  for(var q=particles.length-1;q>=0;q--){
    var pt=particles[q];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.05;pt.life-=dt*2;
    if(pt.life<=0)particles.splice(q,1);
  }

  // win
  if(bricks.length===0&&STATE==='play'){saveHigh();STATE='win';sfx('win');}
}

/* ---------- render ---------- */
function drawAsteroid(a){
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.ang);
  ctx.beginPath();
  for(var i=0;i<a.pts.length;i++){
    var ang=i/a.pts.length*6.283,rr=a.r*a.pts[i];
    if(i===0)ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
    else ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
  }
  ctx.closePath();
  var g=ctx.createRadialGradient(0,0,a.r*0.2,0,0,a.r);
  g.addColorStop(0,'#4a3f6b');g.addColorStop(1,'#241d3a');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#9d8cff';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#04050e';ctx.fillRect(0,0,cv.width,cv.height);
  var sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.setTransform(scale,0,0,scale,offX+sx*scale,offY+sy*scale);

  // stars
  var t=performance.now()/1000;
  for(var i=0;i<stars.length;i++){
    var st=stars[i],al=0.35+0.4*Math.sin(t*2+st.tw);
    ctx.globalAlpha=Math.max(0.1,al);
    ctx.fillStyle='#cfe0ff';
    ctx.fillRect(st.x,st.y,st.r,st.r);
  }
  ctx.globalAlpha=1;

  // bricks
  for(var b=0;b<bricks.length;b++){
    var br=bricks[b],col=ROWCOLS[br.row];
    ctx.fillStyle=col;
    if(br.hp<br.maxHp)ctx.globalAlpha=0.85;
    roundRect(br.x,br.y,br.w,br.h,4);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
    if(br.hp===br.maxHp){roundRect(br.x+1,br.y+1,br.w-2,br.h/2-2,3);ctx.stroke();}
  }

  // asteroids
  for(var a=0;a<asteroids.length;a++)drawAsteroid(asteroids[a]);

  // bullets
  ctx.fillStyle='#8dff5e';
  for(var m=0;m<bullets.length;m++){
    var bu=bullets[m];
    ctx.fillRect(bu.x-2,bu.y,4,14);
    ctx.globalAlpha=0.35;ctx.fillRect(bu.x-2,bu.y+12,4,8);ctx.globalAlpha=1;
  }

  // particles
  for(var q=0;q<particles.length;q++){
    var pt=particles[q];
    ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
  }
  ctx.globalAlpha=1;

  // ball trail + ball
  if(STATE==='play'){
    for(var tr=0;tr<ball.trail.length;tr++){
      var tt=ball.trail[tr];
      ctx.globalAlpha=(tr/ball.trail.length)*0.25;
      ctx.fillStyle='#9fd8ff';
      ctx.beginPath();ctx.arc(tt.x,tt.y,ball.r*(tr/ball.trail.length),0,6.283);ctx.fill();
    }
    ctx.globalAlpha=1;
    var bg=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,ball.r+2);
    bg.addColorStop(0,'#ffffff');bg.addColorStop(1,'#5ecbff');
    ctx.fillStyle=bg;
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,6.283);ctx.fill();

    // paddle
    var pg=ctx.createLinearGradient(0,paddle.y,0,paddle.y+paddle.h);
    pg.addColorStop(0,'#bfe3ff');pg.addColorStop(1,'#3a7bd5');
    ctx.fillStyle=pg;
    roundRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h,7);ctx.fill();
    ctx.fillStyle='rgba(141,255,94,0.9)';
    ctx.fillRect(paddle.x-20,paddle.y+3,8,8);ctx.fillRect(paddle.x+12,paddle.y+3,8,8);

    if(serve){
      ctx.fillStyle='rgba(255,255,255,'+(0.5+0.4*Math.sin(t*5))+')';
      ctx.font='16px monospace';ctx.textAlign='center';
      ctx.fillText('SPACE / CLICK TO LAUNCH',W/2,H-70);
    }
  }

  // HUD
  if(STATE!=='start'){
    ctx.fillStyle='#dfe8ff';ctx.font='bold 18px monospace';ctx.textAlign='left';
    ctx.fillText('SCORE '+score,16,26);
    ctx.textAlign='center';ctx.fillText('HI '+highScore,W/2,26);
    ctx.textAlign='right';
    ctx.fillText('LIVES '+'\u25CF'.repeat(Math.max(0,lives)),W-16,26);
  }

  // overlays
  if(STATE==='start')overlay('ASTEROIDS BREAKOUT','#9d8cff',
    ['Smash every brick. Asteroids are drifting in —','blast them with your lasers before they clog the field.',
     '','\u2190 \u2192 / MOUSE ....... move paddle','SPACE / CLICK ..... launch ball & fire lasers','R ............. restart','',
     'Press ENTER or CLICK to start']);
  if(STATE==='over')overlay('GAME OVER','#ff5e7a',
    ['Score: '+score,'High Score: '+highScore','','Press R (or click) to retry']);
  if(STATE==='win')overlay('FIELD CLEARED!','#6dfc8f',
    ['Score: '+score,'High Score: '+highScore,'All bricks destroyed — the belt is safe.','','Press R (or click) to play again']);
}

function overlay(title,col,lines){
  ctx.fillStyle='rgba(4,5,14,0.78)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=col;ctx.font='bold 52px monospace';
  ctx.shadowColor=col;ctx.shadowBlur=24;
  ctx.fillText(title,W/2,190);ctx.shadowBlur=0;
  ctx.fillStyle='#dfe8ff';ctx.font='17px monospace';
  for(var i=0;i<lines.length;i++)ctx.fillText(lines[i],W/2,255+i*30);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ---------- loop ---------- */
var last=performance.now(),acc=0,STEP=1/60;
function frame(now){
  var dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  render();
  requestAnimationFrame(frame);
}
reset();STATE='start';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
