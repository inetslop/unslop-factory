<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Dasher - Physics Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    switch(type) {
        case 'jump':
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
            break;
        case 'coin':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
            break;
        case 'hurt':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
            break;
        case 'win':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
            setTimeout(() => {
                const o2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                o2.connect(g2); g2.connect(audioCtx.destination);
                o2.type = 'sine'; o2.frequency.setValueAtTime(659, now + 0.15);
                g2.gain.setValueAtTime(0.15, now + 0.15);
                g2.gain.linearRampToValueAtTime(0, now + 0.5);
                o2.start(now + 0.15); o2.stop(now + 0.5);
            }, 150);
            break;
        case 'bounce':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(200, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
            break;
    }
}

// Game State
const STATE = { MENU: 0, PLAYING: 1, DEAD: 2, LEVEL_COMPLETE: 3, GAME_COMPLETE: 4 };
let gameState = STATE.MENU;
let level = 0;
let score = 0;
let lives = 3;
let timer = 0;
let particles = [];
let screenShake = { x: 0, y: 0, time: 0 };

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault();
    initAudio();
    if (gameState === STATE.MENU && (e.code === 'Space' || e.code === 'Enter')) startGame();
    if (gameState === STATE.DEAD && e.code === 'KeyR') respawn();
    if ((gameState === STATE.LEVEL_COMPLETE || gameState === STATE.GAME_COMPLETE) && e.code === 'KeyR') restartGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Level Data
const TILE = 32;
const levels = [
    {
        name: "Green Hills",
        map: [
            "                                                                            ",
            "                                                                            ",
            "                                                                            ",
            "         c                           c                                      ",
            "                  c                                                          ",
            "          p                    B                   m                       ",
            "   ##########       ####  ##########   ###########    #####                 ",
            "              ###                                        ##                ",
            "   s        ###        #####            #############   ##     e             ",
            "   ##########         #####                          ############          ",
            "                                                                        ###",
            "   ######                                          ########################",
            "   ######                       m                                    #######",
            "   ######           ####  #####################################       #     ",
            "   ######           ####                                        #########",
        ],
        playerStart: { x: 2, y: 8 },
    },
    {
        name: "Crystal Caverns",
        map: [
            "                                                                            ",
            "                          c                                                ",
            "                       #####                                                ",
            "         c                           B               m                    ",
            "                  c                                                          ",
            "          p                                          ##########            ",
            "   ####  ###              s    ####    ####    #######           e         ",
            "   ####  ###              s    ####    ####    #######    #####        #   ",
            "   ####  ###             ###   ####    ####    #######    #####        #   ",
            "   ##########            ###   ##############################          ###",
            "                                                                        ###",
            "   ######                       B                      m              ###",
            "   ######           c                                      c         ###",
            "   ######           c                                      c         ###",
            "   ######           ###########################################  #########",
        ],
        playerStart: { x: 2, y: 6 },
    },
    {
        name: "Sky Fortress",
        map: [
            "                                                                            ",
            "                          c   c   c                                        ",
            "                       #####     #####                                       ",
            "         c                           B               m                    ",
            "                  c                                                          ",
            "          p                                          ##########            ",
            "   ####  ###              s    ####    ####    #######           e         ",
            "   ####  ###              s    ####    ####    #######    #####        #   ",
            "   ####  ###             ###   ####    ####    #######    #####        #   ",
            "   ##########            ###   ##############################          ###",
            "                                                                        ###",
            "   ######                       B                      m              ###",
            "   ######           c                                      c         ###",
            "   ######           c                                      c         ###",
            "   ######           ###########################################  #########",
        ],
        playerStart: { x: 2, y: 6 },
    }
];

let grid = [];
let coins = [];
let enemies = [];
let movingPlatforms = [];
let exitTile = null;
let player = null;

function parseLevel(lvl) {
    const map = levels[lvl].map;
    grid = [];
    coins = [];
    enemies = [];
    movingPlatforms = [];
    exitTile = null;
    particles = [];

    for (let r = 0; r < map.length; r++) {
        grid[r] = [];
        for (let c = 0; c < map[r].length; c++) {
            const ch = map[r][c];
            if (ch === '#') grid[r][c] = 1;
            else if (ch === 's') grid[r][c] = 2; // spike
            else if (ch === 'e') { grid[r][c] = 0; exitTile = { x: c * TILE, y: r * TILE }; }
            else if (ch === 'c') coins.push({ x: c * TILE + TILE/2, y: r * TILE + TILE/2, collected: false, bob: Math.random() * Math.PI * 2 });
            else if (ch === 'B') movingPlatforms.push({ x: c * TILE, y: r * TILE, w: TILE, h: TILE, origX: c * TILE, time: Math.random() * Math.PI * 2, speed: 1.5, range: 60 });
            else if (ch === 'm') enemies.push({ x: c * TILE, y: r * TILE, w: 28, h: 28, vx: -1.5, vy: 0, dir: -1, alive: true, animTime: 0 });
            else grid[r][c] = 0;
        }
    }

    const sx = levels[lvl].playerStart.x * TILE;
    const sy = levels[lvl].playerStart.y * TILE;
    player = {
        x: sx, y: sy, w: 24, h: 32,
        vx: 0, vy: 0,
        onGround: false,
        coyoteTime: 0,
        jumpHeld: false,
        facing: 1,
        invincible: 0,
        squash: 1,
        stretch: 1
    };
}

function startGame() {
    gameState = STATE.PLAYING;
    level = 0;
    score = 0;
    lives = 3;
    timer = 0;
    parseLevel(0);
}

function restartGame() {
    gameState = STATE.MENU;
}

function respawn() {
    if (lives <= 0) { restartGame(); return; }
    parseLevel(level);
    gameState = STATE.PLAYING;
}

// Physics
const GRAVITY = 0.6;
const FRICTION = 0.85;
const ACCEL = 0.7;
const MAX_SPEED = 5;
const JUMP_FORCE = -10;
const BOUNCE_FORCE = -12;

function isSolid(tile) { return tile === 1; }
function isSpike(tile) { return tile === 2; }

function getTile(px, py) {
    const c = Math.floor(px / TILE);
    const r = Math.floor(py / TILE);
    if (r < 0 || r >= grid.length) return 1;
    if (c < 0 || c >= (grid[0] || []).length) return 1;
    return grid[r][c];
}

function isSolidAt(px, py) {
    const c = Math.floor(px / TILE);
    const r = Math.floor(py / TILE);
    if (r < 0 || r >= grid.length) return true;
    if (c < 0 || c >= (grid[0] || []).length) return true;
    return isSolid(grid[r][c]);
}

function updatePlayer(dt) {
    const p = player;

    // Input
    let moveX = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) moveX = -1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX = 1;
    const jumpKey = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];

    // Horizontal movement
    if (moveX !== 0) {
        p.vx += ACCEL * moveX;
        p.facing = moveX;
    } else {
        p.vx *= FRICTION;
        if (Math.abs(p.vx) < 0.1) p.vx = 0;
    }
    if (p.vx > MAX_SPEED) p.vx = MAX_SPEED;
    if (p.vx < -MAX_SPEED) p.vx = -MAX_SPEED;

    // Jump
    const wasOnGround = p.onGround;
    if (p.onGround) p.coyoteTime = 6;
    else if (p.coyoteTime > 0) p.coyoteTime--;

    if (jumpKey && !p.jumpHeld) {
        if (p.coyoteTime > 0) {
            p.vy = JUMP_FORCE;
            p.coyoteTime = 0;
            p.onGround = false;
            playSound('jump');
            spawnParticles(p.x + p.w/2, p.y + p.h, 5, '#fff');
        } else if (p.vy > 0) {
            // Bounce off ground
            p.vy = BOUNCE_FORCE;
            playSound('bounce');
        }
    }
    p.jumpHeld = jumpKey;

    // Variable jump height
    if (!jumpKey && p.vy < -4) {
        p.vy *= 0.8;
    }

    // Gravity
    p.vy += GRAVITY;
    if (p.vy > 15) p.vy = 15;

    // Move & Collide X
    p.x += p.vx;
    let colX = false;
    const top = p.y + 2, bot = p.y + p.h - 2;
    if (p.vx > 0) {
        if (isSolidAt(p.x + p.w, top) || isSolidAt(p.x + p.w, bot)) {
            p.x = Math.floor((p.x + p.w) / TILE) * TILE - p.w - 1;
            p.vx = 0; colX = true;
        }
    } else if (p.vx < 0) {
        if (isSolidAt(p.x, top) || isSolidAt(p.x, bot)) {
            p.x = Math.floor(p.x / TILE + 1) * TILE + 1;
            p.vx = 0; colX = true;
        }
    }

    // Move & Collide Y
    p.y += p.vy;
    let colY = false;
    const left = p.x + 2, right = p.x + p.w - 2;
    if (p.vy > 0) {
        if (isSolidAt(left, p.y + p.h) || isSolidAt(right, p.y + p.h)) {
            p.y = Math.floor((p.y + p.h) / TILE) * TILE - p.h;
            p.vy = 0;
            p.onGround = true; colY = true;
        } else {
            p.onGround = false;
        }
    } else if (p.vy < 0) {
        if (isSolidAt(left, p.y) || isSolidAt(right, p.y)) {
            p.y = Math.floor(p.y / TILE + 1) * TILE + 1;
            p.vy = 0; colY = true;
        }
    }

    // Squash & Stretch
    if (colY && wasOnGround === false) {
        p.squash = 0.7; p.stretch = 1.3;
    } else if (!wasOnGround && p.onGround) {
        p.squash = 1.3; p.stretch = 0.7;
    }
    p.squash += (1 - p.squash) * 0.2;
    p.stretch += (1 - p.stretch) * 0.2;

    // Spike check
    const cx = Math.floor((p.x + p.w/2) / TILE);
    const cy = Math.floor((p.y + p.h) / TILE);
    if (cy >= 0 && cy < grid.length && cx >= 0 && cx < (grid[0]||[]).length) {
        if (isSpike(grid[cy][cx])) {
            hurt();
        }
    }

    // Fell off map
    if (p.y > H + 100) {
        hurt();
    }

    // Coin collection
    for (let coin of coins) {
        if (!coin.collected) {
            const dx = p.x + p.w/2 - coin.x;
            const dy = p.y + p.h/2 - coin.y;
            if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
                coin.collected = true;
                score += 10;
                playSound('coin');
                spawnParticles(coin.x, coin.y, 8, '#ffd700');
            }
        }
    }

    // Exit check
    if (exitTile) {
        const dx = p.x + p.w/2 - (exitTile.x + TILE/2);
        const dy = p.y + p.h/2 - (exitTile.y + TILE/2);
        if (Math.abs(dx) < TILE && Math.abs(dy) < TILE) {
            completeLevel();
        }
    }

    // Invincibility timer
    if (p.invincible > 0) p.invincible--;
}

function hurt() {
    if (player.invincible > 0) return;
    lives--;
    playSound('hurt');
    screenShake.time = 10;
    spawnParticles(player.x + player.w/2, player.y + player.h/2, 12, '#ff4444');
    if (lives <= 0) {
        gameState = STATE.DEAD;
    } else {
        player.invincible = 60;
        // Knockback
        player.vy = -8;
        player.vx = 3;
    }
}

function updateEnemies() {
    for (let e of enemies) {
        if (!e.alive) continue;
        e.animTime += 0.1;
        e.x += e.vx;
        e.vy += GRAVITY * 0.5;
        e.y += e.vy;

        // Simple collision
        const checkX = e.dir === -1 ? e.x : e.x + e.w;
        if (isSolidAt(checkX, e.y + e.h/2)) {
            e.dir *= -1;
            e.vx = e.dir * 1.5;
        }

        // Player stomp
        const p = player;
        if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
            if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 8) {
                e.alive = false;
                p.vy = JUMP_FORCE * 0.7;
                score += 25;
                playSound('coin');
                spawnParticles(e.x + e.w/2, e.y + e.h/2, 10, '#44ff44');
            } else if (p.invincible <= 0) {
                hurt();
            }
        }
    }
}

function updateMovingPlatforms() {
    for (let mp of movingPlatforms) {
        mp.time += 0.02 * mp.speed;
        mp.x = mp.origX + Math.sin(mp.time) * mp.range;
    }
}

function completeLevel() {
    playSound('win');
    score += 50;
    level++;
    if (level >= levels.length) {
        gameState = STATE.GAME_COMPLETE;
    } else {
        gameState = STATE.LEVEL_COMPLETE;
    }
}

function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color,
            size: 3 + Math.random() * 4
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Camera
let camX = 0, camY = 0;
function updateCamera() {
    const tx = player.x - W / 2;
    const ty = player.y - H / 2 + 50;
    camX += (tx - camX) * 0.08;
    camY += (ty - camY) * 0.08;
    if (camX < 0) camX = 0;
    if (camY < 0) camY = 0;
}

// Rendering
function getLevelColors() {
    const colors = [
        { bg: '#1a2a3a', ground: '#4a7c3f', spike: '#ff6b6b', accent: '#8ecae6' },
        { bg: '#1a1a2e', ground: '#5c5c8a', spike: '#ff6b6b', accent: '#c084fc' },
        { bg: '#0f1923', ground: '#7a8b99', spike: '#ff6b6b', accent: '#ffd700' }
    ];
    return colors[level] || colors[0];
}

function draw() {
    const colors = getLevelColors();
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, W, H);

    // Screen shake
    let sx = 0, sy = 0;
    if (screenShake.time > 0) {
        screenShake.time--;
        sx = (Math.random() - 0.5) * 6;
        sy = (Math.random() - 0.5) * 6;
    }

    ctx.save();
    ctx.translate(-camX + sx, -camY + sy);

    // Draw tiles
    const startCol = Math.floor(camX / TILE) - 1;
    const endCol = Math.floor((camX + W) / TILE) + 2;
    const startRow = Math.floor(camY / TILE) - 1;
    const endRow = Math.floor((camY + H) / TILE) + 2;

    for (let r = startRow; r <= endRow; r++) {
        if (r < 0 || r >= grid.length) continue;
        for (let c = startCol; c <= endCol; c++) {
            if (c < 0 || c >= grid[r].length) continue;
            const tile = grid[r][c];
            const tx = c * TILE, ty = r * TILE;
            if (tile === 1) {
                ctx.fillStyle = colors.ground;
                ctx.fillRect(tx, ty, TILE, TILE);
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(tx, ty, TILE, 4);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.strokeRect(tx, ty, TILE, TILE);
            } else if (tile === 2) {
                // Spikes
                ctx.fillStyle = colors.spike;
                for (let s = 0; s < 4; s++) {
                    const spikeX = tx + s * 8;
                    ctx.beginPath();
                    ctx.moveTo(spikeX, ty + TILE);
                    ctx.lineTo(spikeX + 4, ty + TILE - 16);
                    ctx.lineTo(spikeX + 8, ty + TILE);
                    ctx.fill();
                }
            } else if (tile === 0) {
                // Check for exit
                if (exitTile && c * TILE === exitTile.x && r * TILE === exitTile.y) {
                    const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;
                    ctx.fillStyle = `rgba(255, 215, 0, ${pulse})`;
                    ctx.fillRect(tx, ty, TILE, TILE);
                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(tx + 4, ty + 4, TILE - 8, TILE - 8);
                }
            }
        }
    }

    // Moving platforms
    for (let mp of movingPlatforms) {
        ctx.fillStyle = colors.accent;
        ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(mp.x, mp.y, mp.w, 4);
    }

    // Coins
    for (let coin of coins) {
        if (coin.collected) continue;
        coin.bob += 0.05;
        const by = Math.sin(coin.bob) * 4;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(coin.x, coin.y + by, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff8dc';
        ctx.beginPath();
        ctx.arc(coin.x - 2, coin.y + by - 2, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Enemies
    for (let e of enemies) {
        if (!e.alive) continue;
        const bounce = Math.abs(Math.sin(e.animTime)) * 3;
        ctx.fillStyle = '#44cc44';
        ctx.fillRect(e.x + 2, e.y + 4 + bounce, e.w - 4, e.h - 4);
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x + 5, e.y + 8 + bounce, 6, 6);
        ctx.fillRect(e.x + e.w - 11, e.y + 8 + bounce, 6, 6);
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 7, e.y + 10 + bounce, 3, 3);
        ctx.fillRect(e.x + e.w - 9, e.y + 10 + bounce, 3, 3);
    }

    // Player
    if (player && (player.invincible <= 0 || Math.floor(Date.now() / 100) % 2 === 0)) {
        const px = player.x;
        const py = player.y;
        const pw = player.w * player.squash;
        const ph = player.h * player.stretch;
        const offsetX = (player.w - pw) / 2;
        const offsetY = player.h - ph;

        ctx.fillStyle = '#4a9eff';
        ctx.fillRect(px + offsetX, py + offsetY, pw, ph);
        // Eyes
        const eyeX = player.facing > 0 ? px + pw - 10 : px + 6;
        ctx.fillStyle = '#fff';
        ctx.fillRect(eyeX, py + offsetY + 8, 5, 5);
        if (player.facing > 0) ctx.fillRect(px + pw - 16, py + offsetY + 8, 5, 5);
        else ctx.fillRect(px + 2, py + offsetY + 8, 5, 5);
        // Visor line
        ctx.fillStyle = '#2a6ed6';
        ctx.fillRect(px + offsetX, py + offsetY + ph - 6, pw, 4);
    }

    // Particles
    for (let p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // HUD
    if (gameState === STATE.PLAYING) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(10, 10, 200, 80);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`Level: ${level + 1} - ${levels[level].name}`, 20, 32);
        ctx.fillText(`Score: ${score}`, 20, 54);
        ctx.fillText(`Lives: ${'❤'.repeat(Math.max(0,lives))}`, 20, 76);
    }
}

function drawMenu() {
    const colors = getLevelColors();
    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PIXEL DASHER', W/2, H/3);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('A Physics Platformer', W/2, H/3 + 35);

    // Controls
    ctx.font = '16px monospace';
    ctx.fillStyle = '#ccc';
    const controls = [
        '← → / A D  — Move',
        'SPACE / ↑  — Jump (hold for higher)',
        'Stomp enemies from above!',
        'Collect coins, reach the gold door!'
    ];
    controls.forEach((txt, i) => {
        ctx.fillText(txt, W/2, H/2 + i * 28);
    });

    // Prompt
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('PRESS SPACE TO START', W/2, H - 80);
    }
    ctx.textAlign = 'left';
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/3);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Final Score: ${score}`, W/2, H/3 + 50);
    ctx.fillText('Press R to Restart', W/2, H/3 + 90);
    ctx.textAlign = 'left';
}

function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#44ff44';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL COMPLETE!', W/2, H/3);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Score: ${score}`, W/2, H/3 + 45);
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#ffd700';
        ctx.fillText('Press R for Next Level', W/2, H/3 + 90);
    }
    ctx.textAlign = 'left';
}

function drawGameComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🏆 YOU WIN! 🏆', W/2, H/3);
    ctx.fillStyle = '#fff';
    ctx.font = '22px monospace';
    ctx.fillText(`Final Score: ${score}`, W/2, H/3 + 50);
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Press R to Play Again', W/2, H/3 + 95);
    }
    ctx.textAlign = 'left';
}

// Main Loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;

    if (gameState === STATE.MENU) {
        drawMenu();
    } else if (gameState === STATE.PLAYING) {
        timer += dt;
        updatePlayer(dt);
        updateEnemies();
        updateMovingPlatforms();
        updateParticles();
        updateCamera();
        draw();
    } else if (gameState === STATE.DEAD) {
        draw();
        drawGameOver();
    } else if (gameState === STATE.LEVEL_COMPLETE) {
        parseLevel(level);
        gameState = STATE.PLAYING;
        // Actually let's keep the state and show overlay
        gameState = STATE.LEVEL_COMPLETE;
        draw();
        drawLevelComplete();
        return;
    } else if (gameState === STATE.GAME_COMPLETE) {
        draw();
        drawGameComplete();
        return;
    }

    requestAnimationFrame(gameLoop);
}

// Handle level complete transition
function checkLevelTransition() {
    if (gameState === STATE.LEVEL_COMPLETE && (keys['KeyR'])) {
        parseLevel(level);
        gameState = STATE.PLAYING;
    }
}

// Override game loop to handle transitions
function mainLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;

    if (gameState === STATE.MENU) {
        drawMenu();
    } else if (gameState === STATE.PLAYING) {
        timer += dt * 0.016;
        updatePlayer(dt);
        updateEnemies();
        updateMovingPlatforms();
        updateParticles();
        updateCamera();
        draw();
    } else if (gameState === STATE.DEAD) {
        draw();
        drawGameOver();
    } else if (gameState === STATE.LEVEL_COMPLETE) {
        draw();
        drawLevelComplete();
    } else if (gameState === STATE.GAME_COMPLETE) {
        draw();
        drawGameComplete();
    }

    requestAnimationFrame(mainLoop);
}

// Start
parseLevel(0);
camX = player.x - W/2;
camY = player.y - H/2;
requestAnimationFrame(mainLoop);
</script>
