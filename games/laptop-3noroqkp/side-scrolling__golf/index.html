<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Sling</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'bounce') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'cup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'splash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'par') {
        const notes = [523, 659, 784];
        notes.forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.value = f;
            g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.3);
            o.start(audioCtx.currentTime + i * 0.12);
            o.stop(audioCtx.currentTime + i * 0.12 + 0.3);
        });
    }
}

// Game constants
const GRAVITY = 0.45;
const BOUNCE_DAMPING = 0.55;
const FRICTION = 0.985;
const AIR_FRICTION = 0.998;
const BALL_RADIUS = 8;
const MAX_POWER = 18;

// Game state
let gameState = 'start'; // start, playing, aiming, flying, holeComplete, gameOver
let currentHole = 0;
let totalStrokes = 0;
let holeStrokes = 0;
let ballX, ballY, velX, velY;
let ballOnGround = false;
let ballAtRest = true;
let cameraX = 0;
let cupX, cupY;
let holeCompleteTimer = 0;
let particles = [];
let clouds = [];
let time = 0;

// Holes definition
const holes = [
    {
        name: "The Meadow",
        par: 2,
        width: 1800,
        terrain: (x) => {
            let base = H * 0.7;
            base += Math.sin(x * 0.003) * 20;
            return base;
        },
        cupPos: 1650,
        waterZones: []
    },
    {
        name: "Hill Country",
        par: 3,
        width: 2200,
        terrain: (x) => {
            let base = H * 0.7;
            base += Math.sin((x - 500) * 0.004) * 80;
            base -= Math.max(0, (x - 1200) * 0.05);
            if (x > 1800) base -= (x - 1800) * 0.03;
            return base;
        },
        cupPos: 2050,
        waterZones: []
    },
    {
        name: "Lagoon Links",
        par: 3,
        width: 2400,
        terrain: (x) => {
            let base = H * 0.7;
            if (x > 900 && x < 1400) base += 30;
            else base += Math.sin(x * 0.002) * 15;
            return base;
        },
        cupPos: 2250,
        waterZones: [{ start: 950, end: 1350 }]
    },
    {
        name: "Rolling Hills",
        par: 4,
        width: 2800,
        terrain: (x) => {
            let base = H * 0.65;
            base += Math.sin(x * 0.005) * 60;
            base += Math.cos(x * 0.002) * 30;
            return base;
        },
        cupPos: 2650,
        waterZones: [{ start: 1500, end: 1700 }]
    },
    {
        name: "The Gauntlet",
        par: 4,
        width: 3200,
        terrain: (x) => {
            let base = H * 0.6;
            base += Math.sin(x * 0.004) * 50;
            if (x > 800 && x < 1200) base -= 80;
            if (x > 2000) base -= (x - 2000) * 0.04;
            return base;
        },
        cupPos: 3050,
        waterZones: [{ start: 1000, end: 1300 }, { start: 2200, end: 2500 }]
    }
];

// Clouds
function initClouds() {
    clouds = [];
    for (let i = 0; i < 8; i++) {
        clouds.push({
            x: Math.random() * W * 2,
            y: Math.random() * H * 0.25 + 20,
            w: 60 + Math.random() * 100,
            speed: 0.2 + Math.random() * 0.3
        });
    }
}

function loadHole(idx) {
    const hole = holes[idx];
    ballX = 80;
    ballY = hole.terrain(80) - BALL_RADIUS - 5;
    velX = 0;
    velY = 0;
    cupX = hole.cupPos;
    cupY = hole.terrain(hole.cupPos);
    holeStrokes = 0;
    ballAtRest = true;
    ballOnGround = false;
    cameraX = 0;
    particles = [];
}

function startGame() {
    currentHole = 0;
    totalStrokes = 0;
    loadHole(0);
    gameState = 'playing';
}

// Input
let mouseX = 0, mouseY = 0;
let mouseDown = false;
let aimStartX = 0, aimStartY = 0;

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    if (gameState === 'start') { startGame(); return; }
    if (gameState === 'gameOver') { startGame(); return; }
    if (gameState === 'holeComplete') { nextHole(); return; }
    if (gameState === 'playing' && ballAtRest) {
        mouseDown = true;
        mouseX = e.clientX;
        mouseY = e.clientY;
        aimStartX = e.clientX;
        aimStartY = e.clientY;
        gameState = 'aiming';
    }
});

canvas.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

canvas.addEventListener('mouseup', (e) => {
    if (gameState === 'aiming') {
        mouseDown = false;
        const dx = aimStartX - e.clientX;
        const dy = aimStartY - e.clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 15) {
            const power = Math.min(dist / 8, MAX_POWER);
            const angle = Math.atan2(dy, dx);
            velX = Math.cos(angle) * power;
            velY = Math.sin(angle) * power;
            ballAtRest = false;
            holeStrokes++;
            totalStrokes++;
            gameState = 'flying';
            playSound('hit');
        } else {
            gameState = 'playing';
        }
    }
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    initAudio();
    if (gameState === 'start') { startGame(); return; }
    if (gameState === 'gameOver') { startGame(); return; }
    if (gameState === 'holeComplete') { nextHole(); return; }
    if (gameState === 'playing' && ballAtRest) {
        mouseDown = true;
        mouseX = t.clientX;
        mouseY = t.clientY;
        aimStartX = t.clientX;
        aimStartY = t.clientY;
        gameState = 'aiming';
    }
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    mouseX = t.clientX;
    mouseY = t.clientY;
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (gameState === 'aiming') {
        mouseDown = false;
        const dx = aimStartX - mouseX;
        const dy = aimStartY - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 15) {
            const power = Math.min(dist / 8, MAX_POWER);
            const angle = Math.atan2(dy, dx);
            velX = Math.cos(angle) * power;
            velY = Math.sin(angle) * power;
            ballAtRest = false;
            holeStrokes++;
            totalStrokes++;
            gameState = 'flying';
            playSound('hit');
        } else {
            gameState = 'playing';
        }
    }
});

function nextHole() {
    currentHole++;
    if (currentHole >= holes.length) {
        gameState = 'gameOver';
    } else {
        loadHole(currentHole);
        gameState = 'playing';
    }
}

// Physics
function updatePhysics() {
    if (gameState !== 'flying' && gameState !== 'aiming') return;
    if (ballAtRest) return;

    const hole = holes[currentHole];
    
    velY += GRAVITY;
    velX *= AIR_FRICTION;
    ballX += velX;
    ballY += velY;

    // Ground collision
    const groundY = hole.terrain(ballX);
    if (ballY + BALL_RADIUS >= groundY) {
        ballY = groundY - BALL_RADIUS;
        if (Math.abs(velY) > 2) {
            velY *= -BOUNCE_DAMPING;
            velX *= 0.85;
            playSound('bounce');
            spawnParticles(ballX, ballY + BALL_RADIUS, 3);
        } else {
            velY = 0;
            velX *= FRICTION;
            if (Math.abs(velX) < 0.1) {
                velX = 0;
                ballAtRest = true;
                gameState = 'playing';
            }
        }
    }

    // Wall bounds
    if (ballX < BALL_RADIUS) { ballX = BALL_RADIUS; velX *= -0.5; }
    if (ballX > hole.width - BALL_RADIUS) { ballX = hole.width - BALL_RADIUS; velX *= -0.5; }

    // Water check
    if (hole.waterZones) {
        for (const w of hole.waterZones) {
            if (ballX >= w.start && ballX <= w.end) {
                const waterY = H * 0.78;
                if (ballY + BALL_RADIUS > waterY) {
                    playSound('splash');
                    spawnParticles(ballX, ballY, 10);
                    // Penalty: reset to start of hole
                    ballX = 80;
                    ballY = hole.terrain(80) - BALL_RADIUS - 5;
                    velX = 0;
                    velY = 0;
                    ballAtRest = true;
                    gameState = 'playing';
                    return;
                }
            }
        }
    }

    // Cup check
    const cupDist = Math.sqrt((ballX - cupX) ** 2 + (ballY - (cupY - 10)) ** 2);
    if (cupDist < 15 && ballAtRest === false && Math.abs(velX) < 3 && Math.abs(velY) < 3) {
        // Ball in cup!
        gameState = 'holeComplete';
        holeCompleteTimer = 0;
        velX = 0;
        velY = 0;
        ballX = cupX;
        ballY = cupY - 15;
        playSound('cup');
        playSound('par');
    }

    // Off screen bottom
    if (ballY > H + 100) {
        ballX = 80;
        ballY = hole.terrain(80) - BALL_RADIUS - 5;
        velX = 0;
        velY = 0;
        ballAtRest = true;
        gameState = 'playing';
    }

    // Camera follow
    const targetCam = ballX - W * 0.35;
    cameraX += (targetCam - cameraX) * 0.08;
    if (cameraX < 0) cameraX = 0;
    const maxCam = hole.width - W;
    if (cameraX > maxCam) cameraX = Math.max(0, maxCam);
}

function spawnParticles(x, y, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 4,
            vy: -Math.random() * 3 - 1,
            life: 30 + Math.random() * 20,
            color: `hsl(${80 + Math.random() * 40}, 60%, ${40 + Math.random() * 30}%)`
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Rendering
function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    grad.addColorStop(0, '#87CEEB');
    grad.addColorStop(0.6, '#B0E0F0');
    grad.addColorStop(1, '#E0F4FF');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H * 0.7);
}

function drawClouds() {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (const c of clouds) {
        const cx = ((c.x - cameraX * 0.3) % (W + 200)) - 100;
        ctx.beginPath();
        ctx.ellipse(cx, c.y, c.w * 0.5, c.w * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx - c.w * 0.2, c.y - 5, c.w * 0.35, c.w * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawTerrain() {
    const hole = holes[currentHole];
    const step = 4;
    
    // Ground
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let sx = 0; sx <= W; sx += step) {
        const wx = sx + cameraX;
        if (wx > hole.width) break;
        const gy = hole.terrain(wx);
        ctx.lineTo(sx, gy);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    
    const grad = ctx.createLinearGradient(0, H * 0.5, 0, H);
    grad.addColorStop(0, '#4a8c3f');
    grad.addColorStop(1, '#2d5a27');
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Top line
    ctx.beginPath();
    for (let sx = 0; sx <= W; sx += step) {
        const wx = sx + cameraX;
        if (wx > hole.width) break;
        const gy = hole.terrain(wx);
        if (sx === 0) ctx.moveTo(sx, gy);
        else ctx.lineTo(sx, gy);
    }
    ctx.strokeStyle = '#5a9c4f';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Water zones
    if (hole.waterZones) {
        for (const w of hole.waterZones) {
            const waterY = H * 0.78;
            const sx1 = Math.max(0, w.start - cameraX);
            const sx2 = Math.min(W, w.end - cameraX);
            if (sx2 > 0 && sx1 < W) {
                ctx.fillStyle = 'rgba(50, 130, 220, 0.6)';
                ctx.fillRect(sx1, waterY, sx2 - sx1, H - waterY);
                // Water surface
                ctx.beginPath();
                for (let x = sx1; x <= sx2; x += 5) {
                    const wy = waterY + Math.sin((x + cameraX + time * 2) * 0.1) * 3;
                    if (x === sx1) ctx.moveTo(x, wy);
                    else ctx.lineTo(x, wy);
                }
                ctx.strokeStyle = 'rgba(150, 200, 255, 0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }
}

function drawCup() {
    const sx = cupX - cameraX;
    const sy = cupY;
    
    // Cup hole
    ctx.beginPath();
    ctx.ellipse(sx, sy + 2, 14, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();
    
    // Flag pole
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx, sy - 60);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Flag
    const flagWave = Math.sin(time * 0.05) * 3;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 60);
    ctx.lineTo(sx + 25 + flagWave, sy - 52);
    ctx.lineTo(sx, sy - 44);
    ctx.closePath();
    ctx.fillStyle = '#e63946';
    ctx.fill();
}

function drawBall() {
    const sx = ballX - cameraX;
    const sy = ballY;
    
    // Shadow
    const hole = holes[currentHole];
    const gy = hole.terrain(ballX);
    const shadowAlpha = Math.max(0, 1 - (gy - ballY) / 200);
    ctx.beginPath();
    ctx.ellipse(sx, gy, 8, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha * 0.3})`;
    ctx.fill();
    
    // Ball
    ctx.beginPath();
    ctx.arc(sx, sy, BALL_RADIUS, 0, Math.PI * 2);
    const ballGrad = ctx.createRadialGradient(sx - 2, sy - 2, 1, sx, sy, BALL_RADIUS);
    ballGrad.addColorStop(0, '#fff');
    ballGrad.addColorStop(1, '#ccc');
    ctx.fillStyle = ballGrad;
    ctx.fill();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawAiming() {
    if (gameState !== 'aiming') return;
    
    const dx = aimStartX - mouseX;
    const dy = aimStartY - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const power = Math.min(dist / 8, MAX_POWER);
    const angle = Math.atan2(dy, dx);
    
    // Show power indicator
    ctx.beginPath();
    ctx.arc(ballX - cameraX, ballY, BALL_RADIUS + 4, 0, Math.PI * 2);
    ctx.strokeStyle = `hsl(${(180 - power / MAX_POWER * 180)}, 80%, 50%)`;
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Trajectory dots
    let px = ballX, py = ballY;
    let pvx = Math.cos(angle) * power;
    let pvy = Math.sin(angle) * power;
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    for (let i = 0; i < 30; i++) {
        pvx *= AIR_FRICTION;
        pvy += GRAVITY;
        px += pvx;
        py += pvy;
        
        const hole = holes[currentHole];
        if (py + BALL_RADIUS >= hole.terrain(px)) break;
        
        if (i % 3 === 0) {
            ctx.beginPath();
            ctx.arc(px - cameraX, py, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Direction arrow from ball
    const arrowLen = power * 3;
    const ax = ballX - cameraX + Math.cos(angle) * (BALL_RADIUS + 5);
    const ay = ballY + Math.sin(angle) * (BALL_RADIUS + 5);
    ctx.beginPath();
    ctx.moveTo(ballX - cameraX, ballY);
    ctx.lineTo(ax, ay);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawParticles() {
    for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x - cameraX, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
    }
}

function drawHUD() {
    const hole = holes[currentHole];
    
    // Hole info
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 220, 90);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`Hole ${currentHole + 1}: ${hole.name}`, 20, 35);
    ctx.font = '14px monospace';
    ctx.fillText(`Par: ${hole.par}  |  Strokes: ${holeStrokes}`, 20, 58);
    ctx.fillText(`Total: ${totalStrokes}`, 20, 80);
    
    // Instructions
    if (gameState === 'playing' && ballAtRest) {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(W / 2 - 150, H - 50, 300, 35);
        ctx.fillStyle = '#fff';
        ctx.font = '13px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Click & drag to aim (slingshot style)', W / 2, H - 28);
        ctx.textAlign = 'left';
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#1a5c3a';
    ctx.fillRect(0, 0, W, H);
    
    // Decorative ground
    ctx.fillStyle = '#2d7a4a';
    ctx.fillRect(0, H * 0.7, W, H * 0.3);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⛳ GOLF SLING', W / 2, H * 0.3);
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#cde';
    ctx.fillText('A side-scrolling golf adventure', W / 2, H * 0.4);
    
    ctx.font = '15px monospace';
    ctx.fillStyle = '#aef';
    ctx.fillText('Click & drag to aim your shot (slingshot style)', W / 2, H * 0.52);
    ctx.fillText('Drag further for more power', W / 2, H * 0.57);
    ctx.fillText('Avoid water! Get the ball in the cup.', W / 2, H * 0.62);
    ctx.fillText(`${holes.length} holes to complete`, W / 2, H * 0.67);
    
    // Blinking prompt
    if (Math.floor(time / 30) % 2 === 0) {
        ctx.font = 'bold 20px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('CLICK TO START', W / 2, H * 0.8);
    }
    ctx.textAlign = 'left';
}

function drawHoleComplete() {
    const hole = holes[currentHole];
    const label = getScoreLabel(holeStrokes, hole.par);
    
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W / 2 - 180, H / 2 - 80, 360, 160);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - 180, H / 2 - 80, 360, 160);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Hole ${currentHole + 1} Complete!`, W / 2, H / 2 - 40);
    ctx.font = 'bold 32px monospace';
    ctx.fillStyle = '#7fff7f';
    ctx.fillText(label, W / 2, H / 2 + 5);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#ccc';
    ctx.fillText(`${holeStrokes} stroke(s) - Par ${hole.par}`, W / 2, H / 2 + 40);
    ctx.fillStyle = '#fff';
    ctx.fillText('Click to continue', W / 2, H / 2 + 65);
    ctx.textAlign = 'left';
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    let totalPar = 0;
    holes.forEach(h => totalPar += h.par);
    const diff = totalStrokes - totalPar;
    let scoreLabel = '';
    if (diff <= -3) scoreLabel = '🏆 Champion!';
    else if (diff <= -1) scoreLabel = '⭐ Excellent!';
    else if (diff === 0) scoreLabel = '✅ Even Par';
    else if (diff <= 2) scoreLabel = '👍 Good Round';
    else scoreLabel = '💪 Keep Practicing!';
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Round Complete!', W / 2, H * 0.3);
    ctx.font = '24px monospace';
    ctx.fillStyle = '#7fff7f';
    ctx.fillText(scoreLabel, W / 2, H * 0.42);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#ccc';
    ctx.fillText(`Total Strokes: ${totalStrokes} (Par ${totalPar})`, W / 2, H * 0.52);
    ctx.fillText(`+${diff >= 0 ? '+' : ''}${diff}`, W / 2, H * 0.58);
    
    if (Math.floor(time / 30) % 2 === 0) {
        ctx.font = 'bold 20px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('CLICK TO PLAY AGAIN', W / 2, H * 0.75);
    }
    ctx.textAlign = 'left';
}

function getScoreLabel(strokes, par) {
    if (strokes === 1) return 'HOLE IN ONE! 🎉';
    const diff = strokes - par;
    if (diff <= -3) return 'Albatross! 🦅';
    if (diff === -2) return 'Eagle! 🦅';
    if (diff === -1) return 'Birdie! 🐦';
    if (diff === 0) return 'Par ✅';
    if (diff === 1) return 'Bogey';
    if (diff === 2) return 'Double Bogey';
    return `+${diff}`;
}

// Main loop
function update() {
    time++;
    
    // Update clouds
    for (const c of clouds) {
        c.x += c.speed;
        if (c.x - cameraX * 0.3 > W + 200) c.x = -150;
    }
    
    updatePhysics();
    updateParticles();
    
    if (gameState === 'holeComplete') {
        holeCompleteTimer++;
    }
}

function render() {
    ctx.clearRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }
    
    drawSky();
    drawClouds();
    drawTerrain();
    drawCup();
    drawBall();
    drawAiming();
    drawParticles();
    drawHUD();
    
    if (gameState === 'holeComplete') {
        drawHoleComplete();
    }
    if (gameState === 'gameOver') {
        drawGameOver();
    }
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Init
initClouds();
loadHole(0);
gameState = 'start';
gameLoop();
</script>
</body>
</html>
