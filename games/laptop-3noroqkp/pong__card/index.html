<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Cards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || webkitAudioContext)(); } catch(e) {}
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.1));
}

// Game constants
const WIN_SCORE = 5;
const CARD_NAMES = ['Rise', 'Drop', 'Surge', 'Mega', 'Jam', 'Nudge'];
const CARD_COLORS = ['#4fc3f7','#81c784','#ffb74d','#e57373','#ba68c8','#fff176'];
const CARD_ICONS = ['↑','↓','⚡','★','❄','◀'];
const CARD_DESCS = ['Move up 90px','Move down 90px','Auto-track 2.5s','Big paddle 4s','Freeze foe 2s','Nudge ball near you'];

let state = 'START'; // START, PLAYING, SCORED, GAME_OVER
let scoreL = 0, scoreR = 0;
let timeScale = 1;
let scoredTimer = 0;
let lastScorer = '';

// Paddles
let paddleL = { y: 0, h: 80, baseH: 80, speed: 350, freezeUntil: 0 };
let paddleR = { y: 0, h: 80, baseH: 80, speed: 320, freezeUntil: 0 };
const PADDLE_W = 12;
const PADDLE_X_L = 30;
const PADDLE_X_R = () => W - 30 - PADDLE_W;

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8, speed: 350 };

// Effects
let surgeL = 0; // timestamp when surge ends
let megaL = 0;
let surgeR = 0;
let megaR = 0;

// Particles
let particles = [];

// Cards
function randomCard() {
    return Math.floor(Math.random() * 6);
}
let handL = [randomCard(), randomCard(), randomCard(), randomCard()];
let handR = [randomCard(), randomCard(), randomCard()];
let aiTimer = 0;

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    initAudio();
    if (state === 'START' && (e.key === ' ' || e.key === 'Enter')) startGame();
    else if (state === 'GAME_OVER' && (e.key === 'r' || e.key === 'R')) startGame();
    else if (state === 'PLAYING') {
        if (e.key === '1') playCardL(0);
        else if (e.key === '2') playCardL(1);
        else if (e.key === '3') playCardL(2);
        else if (e.key === '4') playCardL(3);
    }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

canvas.addEventListener('click', e => {
    initAudio();
    if (state === 'START') { startGame(); return; }
    if (state === 'GAME_OVER') { startGame(); return; }
    if (state === 'PLAYING') {
        // Check card click areas
        const cardW = Math.min(100, (W - 40) / 4 - 10);
        const cardH = 60;
        const startX = (W - (cardW * 4 + 30)) / 2;
        const startY = H - cardH - 20;
        for (let i = 0; i < 4; i++) {
            const cx = startX + i * (cardW + 10);
            if (e.clientX >= cx && e.clientX <= cx + cardW && e.clientY >= startY && e.clientY <= startY + cardH) {
                playCardL(i);
                break;
            }
        }
    }
});

function startGame() {
    state = 'PLAYING';
    scoreL = 0; scoreR = 0;
    paddleL.y = H / 2 - paddleL.h / 2;
    paddleR.y = H / 2 - paddleR.h / 2;
    paddleL.h = paddleL.baseH;
    paddleR.h = paddleR.baseH;
    surgeL = 0; megaL = 0; surgeR = 0; megaR = 0;
    paddleL.freezeUntil = 0; paddleR.freezeUntil = 0;
    handL = [randomCard(), randomCard(), randomCard(), randomCard()];
    handR = [randomCard(), randomCard(), randomCard()];
    aiTimer = 2 + Math.random() * 3;
    particles = [];
    resetBall(1);
}

function resetBall(dir) {
    ball.x = W / 2;
    ball.y = H / 2;
    const angle = (Math.random() * 0.8 - 0.4);
    ball.speed = Math.max(350, 350 + (scoreL + scoreR) * 15);
    ball.vx = Math.cos(angle) * ball.speed * dir;
    ball.vy = Math.sin(angle) * ball.speed;
}

function playCardL(idx) {
    if (idx < 0 || idx >= handL.length) return;
    const card = handL[idx];
    applyCard(card, 'L');
    handL[idx] = randomCard();
    playSound(600 + card * 80, 0.12, 'triangle', 0.2);
}

function applyCard(card, side) {
    const now = performance.now();
    if (side === 'L') {
        if (card === 0) paddleL.y -= 90;
        else if (card === 1) paddleL.y += 90;
        else if (card === 2) surgeL = now + 2500;
        else if (card === 3) { megaL = now + 4000; paddleL.h = paddleL.baseH * 1.6; }
        else if (card === 4) paddleR.freezeUntil = now + 2000;
        else if (card === 5) { ball.vx *= -0.3; ball.vy += (paddleL.y - ball.y) * 0.5; const sp = Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy); ball.vx = ball.vx/sp*ball.speed; ball.vy = ball.vy/sp*ball.speed; }
    } else {
        if (card === 0) paddleR.y -= 90;
        else if (card === 1) paddleR.y += 90;
        else if (card === 2) surgeR = now + 2500;
        else if (card === 3) { megaR = now + 4000; paddleR.h = paddleR.baseH * 1.6; }
        else if (card === 4) paddleL.freezeUntil = now + 2000;
        else if (card === 5) { ball.vx *= -0.3; ball.vy += (paddleR.y - ball.y) * 0.5; const sp = Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy); ball.vx = ball.vx/sp*ball.speed; ball.vy = ball.vy/sp*ball.speed; }
    }
}

function aiPlay() {
    if (state !== 'PLAYING') return;
    // AI strategy: play card most useful
    let bestIdx = 0, bestScore = -1;
    for (let i = 0; i < handR.length; i++) {
        const c = handR[i];
        let s = 0;
        if (c === 0) s = ball.y < paddleR.y ? 3 : 0;
        else if (c === 1) s = ball.y > paddleR.y ? 3 : 0;
        else if (c === 2) s = Math.abs(ball.vx) > 200 ? 4 : 2;
        else if (c === 3) s = 2;
        else if (c === 4) s = scoreR < scoreL ? 4 : 1;
        else if (c === 5) s = ball.vx > 0 ? 3 : 1;
        if (s > bestScore) { bestScore = s; bestIdx = i; }
    }
    applyCard(handR[bestIdx], 'R');
    playSound(400, 0.1, 'square', 0.08);
    handR[bestIdx] = randomCard();
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < (count||15); i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 100 + Math.random() * 200;
        particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, color });
    }
}

function update(dt) {
    if (state !== 'PLAYING' && state !== 'SCORED') return;
    const now = performance.now();

    // Mega effect expire
    if (now > megaL) { paddleL.h = paddleL.baseH; }
    if (now > megaR) { paddleR.h = paddleR.baseH; }

    if (state === 'SCORED') {
        scoredTimer -= dt;
        if (scoredTimer <= 0) { state = 'PLAYING'; resetBall(lastScorer === 'L' ? 1 : -1); }
    } else {
        // Paddle movement
        const pLFrozen = now < paddleL.freezeUntil;
        const pRFrozen = now < paddleR.freezeUntil;

        if (!pLFrozen) {
            let vL = 0;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) vL -= paddleL.speed;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) vL += paddleL.speed;
            if (now < surgeL && !pLFrozen) {
                const target = ball.y - paddleL.h/2;
                vL = Math.sign(target - paddleL.y) * paddleL.speed * 1.3;
                if (Math.abs(target - paddleL.y) < 10) vL = 0;
            }
            paddleL.y += vL * dt;
        }

        // AI paddle
        if (!pRFrozen) {
            let vR = 0;
            const targetY = ball.y - paddleR.h/2;
            if (now < surgeR) {
                vR = Math.sign(targetY - paddleR.y) * paddleR.speed * 1.3;
            } else {
                vR = Math.sign(targetY - paddleR.y) * paddleR.speed * 0.7;
            }
            if (Math.abs(targetY - paddleR.y) < 8) vR = 0;
            paddleR.y += vR * dt;
        }

        // Clamp paddles
        paddleL.y = Math.max(0, Math.min(H - paddleL.h, paddleL.y));
        paddleR.y = Math.max(0, Math.min(H - paddleR.h, paddleR.y));

        // Ball movement
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Ball wall bounce
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playSound(440, 0.05, 'sine', 0.1); }
        if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); playSound(440, 0.05, 'sine', 0.1); }

        // Paddle collision L
        const plx = PADDLE_X_L + PADDLE_W;
        if (ball.vx < 0 && ball.x - ball.r <= plx && ball.x - ball.r >= PADDLE_X_L) {
            if (ball.y >= paddleL.y && ball.y <= paddleL.y + paddleL.h) {
                const hit = (ball.y - paddleL.y) / paddleL.h - 0.5;
                const angle = hit * 1.2;
                const sp = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy) * 1.03;
                ball.vx = Math.cos(angle) * sp;
                ball.vy = Math.sin(angle) * sp;
                ball.x = plx + ball.r;
                playSound(550, 0.08, 'triangle', 0.2);
                spawnParticles(plx, ball.y, '#4fc3f7', 6);
            }
        }

        // Paddle collision R
        const prx = W - 30 - PADDLE_W;
        if (ball.vx > 0 && ball.x + ball.r >= prx && ball.x + ball.r <= W - 30) {
            if (ball.y >= paddleR.y && ball.y <= paddleR.y + paddleR.h) {
                const hit = (ball.y - paddleR.y) / paddleR.h - 0.5;
                const angle = Math.PI - hit * 1.2;
                const sp = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy) * 1.03;
                ball.vx = Math.cos(angle) * sp;
                ball.vy = Math.sin(angle) * sp;
                ball.x = prx - ball.r;
                playSound(550, 0.08, 'triangle', 0.2);
                spawnParticles(prx, ball.y, '#e57373', 6);
            }
        }

        // Score
        if (ball.x + ball.r < 0) {
            scoreR++; lastScorer = 'R';
            playSound(200, 0.3, 'sawtooth', 0.15);
            state = 'SCORED'; scoredTimer = 1;
            if (scoreR >= WIN_SCORE) { state = 'GAME_OVER'; }
        }
        if (ball.x - ball.r > W) {
            scoreL++; lastScorer = 'L';
            playSound(200, 0.3, 'sawtooth', 0.15);
            state = 'SCORED'; scoredTimer = 1;
            if (scoreL >= WIN_SCORE) { state = 'GAME_OVER'; }
        }

        // AI timer
        aiTimer -= dt;
        if (aiTimer <= 0) {
            aiPlay();
            aiTimer = 3 + Math.random() * 3;
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawCard(x, y, w, h, idx, faceUp) {
    const c = CARD_COLORS[idx];
    ctx.save();
    // Card background
    ctx.fillStyle = faceUp ? '#1a1a2e' : '#333';
    ctx.strokeStyle = faceUp ? c : '#555';
    ctx.lineWidth = 2;
    roundRect(x, y, w, h, 8);
    ctx.fill();
    ctx.stroke();

    if (faceUp) {
        // Icon
        ctx.fillStyle = c;
        ctx.font = `bold ${h*0.35}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(CARD_ICONS[idx], x + w/2, y + h*0.4);

        // Name
        ctx.font = `bold ${Math.min(12, w*0.12)}px sans-serif`;
        ctx.fillText(CARD_NAMES[idx], x + w/2, y + h*0.7);

        // Cost indicator (small dot)
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(x + w - 8, y + 8, 3, 0, Math.PI*2);
        ctx.fill();
    } else {
        // Back pattern
        ctx.fillStyle = '#444';
        ctx.font = `${h*0.4}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('?', x + w/2, y + h*0.65);
    }
    ctx.restore();
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
}

function draw() {
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (state === 'START') {
        drawStartScreen();
        return;
    }

    // Center line
    ctx.setLineDash([10, 15]);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Center circle
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W/2, H/2, 60, 0, Math.PI*2);
    ctx.stroke();

    // Paddles
    const now = performance.now();
    // Left paddle
    ctx.fillStyle = '#4fc3f7';
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = 15;
    roundRect(PADDLE_X_L, paddleL.y, PADDLE_W, paddleL.h, 4);
    ctx.fill();

    // Right paddle
    ctx.fillStyle = '#e57373';
    ctx.shadowColor = '#e57373';
    roundRect(W - 30 - PADDLE_W, paddleR.y, PADDLE_W, paddleR.h, 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Freeze indicators
    if (now < paddleL.freezeUntil) {
        ctx.fillStyle = 'rgba(100,200,255,0.3)';
        roundRect(PADDLE_X_L - 4, paddleL.y - 4, PADDLE_W + 8, paddleL.h + 8, 6);
        ctx.fill();
    }
    if (now < paddleR.freezeUntil) {
        ctx.fillStyle = 'rgba(100,200,255,0.3)';
        roundRect(W - 34 - PADDLE_W, paddleR.y - 4, PADDLE_W + 8, paddleR.h + 8, 6);
        ctx.fill();
    }

    // Ball
    if (state === 'PLAYING' || state === 'SCORED') {
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Score
    ctx.font = `bold ${Math.min(48, W*0.06)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4fc3f7';
    ctx.fillText(scoreL, W/2 - 50, H * 0.12);
    ctx.fillStyle = '#e57373';
    ctx.fillText(scoreR, W/2 + 50, H * 0.12);

    // Win indicator text
    ctx.font = `${Math.min(14, W*0.02)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('First to ' + WIN_SCORE, W/2, H * 0.17);

    // Cards (Player hand at bottom)
    if (state === 'PLAYING' || state === 'SCORED') {
        const cardW = Math.min(100, (W - 60) / 4 - 10);
        const cardH = Math.min(65, H * 0.12);
        const startX = (W - (cardW * 4 + 30)) / 2;
        const startY = H - cardH - 15;

        for (let i = 0; i < 4; i++) {
            drawCard(startX + i * (cardW + 10), startY, cardW, cardH, handL[i], true);
            // Key hint
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText((i+1), startX + i*(cardW+10) + cardW/2, startY - 5);
        }

        // AI hand (top right, face down)
        const aiCardW = Math.min(60, W * 0.05);
        const aiCardH = Math.min(40, H * 0.07);
        for (let i = 0; i < handR.length; i++) {
            drawCard(W - 20 - (i+1)*(aiCardW+8), 15 + i*(aiCardH+6), aiCardW, aiCardH, i, false);
        }
    }

    // Scored flash
    if (state === 'SCORED') {
        ctx.fillStyle = lastScorer === 'L' ? 'rgba(79,195,247,0.1)' : 'rgba(229,115,115,0.1)';
        ctx.fillRect(0, 0, W, H);
    }

    if (state === 'GAME_OVER') {
        drawGameOver();
    }
}

function drawStartScreen() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(52, W*0.07)}px monospace`;
    ctx.fillText('PONG CARDS', W/2, H * 0.3);

    ctx.font = `${Math.min(16, W*0.025)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('A Pong game with card powers!', W/2, H * 0.4);

    ctx.font = `${Math.min(14, W*0.02)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    const lines = [
        'W/S or ↑/↓ — Move paddle',
        '1-4 — Play cards from hand',
        '',
        'Cards: Rise | Drop | Surge | Mega | Jam | Nudge',
        'First to 5 points wins!'
    ];
    lines.forEach((l, i) => {
        ctx.fillText(l, W/2, H * 0.5 + i * 24);
    });

    // Blinking prompt
    const blink = Math.sin(performance.now() * 0.003) > 0;
    if (blink) {
        ctx.fillStyle = '#4fc3f7';
        ctx.font = `bold ${Math.min(18, W*0.03)}px sans-serif`;
        ctx.fillText('Click or press SPACE to start', W/2, H * 0.78);
    }

    // Decorative cards
    for (let i = 0; i < 6; i++) {
        const cx = W/2 + (i - 2.5) * 70;
        const cy = H * 0.88;
        drawCard(cx - 25, cy, 50, 35, i, true);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    const won = scoreL >= WIN_SCORE;
    ctx.fillStyle = won ? '#4fc3f7' : '#e57373';
    ctx.font = `bold ${Math.min(40, W*0.06)}px monospace`;
    ctx.fillText(won ? 'YOU WIN!' : 'AI WINS', W/2, H * 0.35);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(24, W*0.04)}px monospace`;
    ctx.fillText(`${scoreL} — ${scoreR}`, W/2, H * 0.48);

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `${Math.min(16, W*0.025)}px sans-serif`;
    ctx.fillText('Press R to restart', W/2, H * 0.62);
}

// Game loop
let lastTime = performance.now();
function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Try/catch for any localStorage (not used but required pattern)
try { void localStorage; } catch(e) {}
</script>
</body>
</html>
