<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'coin') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'death') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'powerup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try {
    highScore = parseInt(localStorage.getItem('neonRunnerHigh') || '0');
} catch(e) {}

let speed = 5;
let baseSpeed = 5;
let frameCount = 0;
let particles = [];
let obstacles = [];
let coins = [];
let powerups = [];
let clouds = [];
let stars = [];
let mountains = [];
let cityBuildings = [];
let groundY;

// Player
const player = {
    x: 80,
    y: 0,
    vy: 0,
    w: 36,
    h: 44,
    grounded: false,
    jumps: 0,
    maxJumps: 2,
    invincible: 0,
    shield: 0,
    trail: []
};

function init() {
    groundY = H - 80;
    player.y = groundY - player.h;
    player.vy = 0;
    player.grounded = true;
    player.jumps = 0;
    player.invincible = 0;
    player.shield = 0;
    player.trail = [];
    score = 0;
    speed = baseSpeed;
    frameCount = 0;
    obstacles = [];
    coins = [];
    powerups = [];
    particles = [];
    
    // Stars
    stars = [];
    for (let i = 0; i < 80; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H * 0.5, size: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1 });
    }
    
    // Mountains (far)
    mountains = [];
    for (let i = 0; i < 8; i++) {
        mountains.push({ x: i * (W / 4), h: Math.random() * 100 + 60, w: Math.random() * 150 + 100 });
    }
    
    // City buildings (mid)
    cityBuildings = [];
    for (let i = 0; i < 12; i++) {
        cityBuildings.push({ x: i * 80, h: Math.random() * 80 + 40, w: Math.random() * 30 + 30 });
    }
    
    // Clouds
    clouds = [];
    for (let i = 0; i < 5; i++) {
        clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.2 + 20, w: Math.random() * 80 + 40, speed: 0.3 });
    }
}

function spawnObstacle() {
    const type = Math.floor(Math.random() * 4);
    if (type === 0) {
        // Ground block
        obstacles.push({ x: W + 50, y: groundY - 40, w: 30, h: 40, type: 'block' });
    } else if (type === 1) {
        // Tall spike
        obstacles.push({ x: W + 50, y: groundY - 60, w: 20, h: 60, type: 'spike' });
    } else if (type === 2) {
        // Double block
        obstacles.push({ x: W + 50, y: groundY - 30, w: 50, h: 30, type: 'wide' });
    } else if (type === 3) {
        // Flying drone
        const flyH = Math.random() * 60 + 80;
        obstacles.push({ x: W + 50, y: groundY - flyH, w: 34, h: 20, type: 'drone', bobPhase: 0 });
    }
}

function spawnCoin() {
    const count = Math.floor(Math.random() * 3) + 1;
    const baseX = W + 50;
    const baseY = groundY - Math.random() * 80 - 60;
    for (let i = 0; i < count; i++) {
        coins.push({ x: baseX + i * 30, y: baseY, r: 10, collected: false });
    }
}

function spawnPowerup() {
    const type = Math.random() < 0.5 ? 'shield' : 'slow';
    powerups.push({ x: W + 50, y: groundY - Math.random() * 60 - 80, r: 14, type });
}

function addParticle(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 1,
            color,
            size: Math.random() * 4 + 2
        });
    }
}

function update() {
    if (gameState !== 'playing') return;
    
    frameCount++;
    speed = baseSpeed + Math.floor(frameCount / 300) * 0.5;
    if (speed > 14) speed = 14;
    
    // Score
    score += speed * 0.1;
    
    // Player physics
    player.vy += 0.7;
    player.y += player.vy;
    
    if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.grounded = true;
        player.jumps = 0;
    } else {
        player.grounded = false;
    }
    
    // Trail
    player.trail.push({ x: player.x, y: player.y + player.h / 2 });
    if (player.trail.length > 12) player.trail.shift();
    
    // Invincibility timer
    if (player.invincible > 0) player.invincible--;
    if (player.shield > 0) player.shield--;
    
    // Spawn obstacles
    const spawnRate = Math.max(60 - Math.floor(speed * 2), 30);
    if (frameCount % spawnRate === 0) {
        spawnObstacle();
        if (Math.random() < 0.4) spawnCoin();
        if (frameCount % 500 < spawnRate && Math.random() < 0.15) spawnPowerup();
    }
    
    // Update obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;
        if (obs.type === 'drone') {
            obs.bobPhase += 0.05;
            obs.y += Math.sin(obs.bobPhase) * 1.5;
        }
        if (obs.x + obs.w < -50) obstacles.splice(i, 1);
    }
    
    // Update coins
    for (let i = coins.length - 1; i >= 0; i--) {
        coins[i].x -= speed;
        if (coins[i].x < -30 || coins[i].collected) coins.splice(i, 1);
    }
    
    // Update powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        powerups[i].x -= speed;
        if (powerups[i].x < -30) powerups.splice(i, 1);
    }
    
    // Collision detection
    const px = player.x + 6, py = player.y + 4;
    const pw = player.w - 12, ph = player.h - 8;
    
    // Obstacle collision
    for (let obs of obstacles) {
        if (px < obs.x + obs.w && px + pw > obs.x && py < obs.y + obs.h && py + ph > obs.y) {
            if (player.shield > 0) {
                player.shield = 0;
                addParticle(obs.x, obs.y, '#00ffff', 15);
                obstacles.splice(obstacles.indexOf(obs), 1);
                playSound('powerup');
            } else if (player.invincible === 0) {
                gameOver();
                return;
            }
        }
    }
    
    // Coin collision
    for (let coin of coins) {
        const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
        const dx = cx - coin.x, dy = cy - coin.y;
        if (Math.sqrt(dx * dx + dy * dy) < coin.r + 18) {
            coin.collected = true;
            score += 50;
            addParticle(coin.x, coin.y, '#ffdd00', 8);
            playSound('coin');
        }
    }
    
    // Powerup collision
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
        const dx = cx - p.x, dy = cy - p.y;
        if (Math.sqrt(dx * dx + dy * dy) < p.r + 18) {
            if (p.type === 'shield') {
                player.shield = 600;
                addParticle(p.x, p.y, '#00ffff', 12);
            } else {
                speed = Math.max(baseSpeed, speed - 2);
                addParticle(p.x, p.y, '#44ff88', 12);
            }
            playSound('powerup');
            powerups.splice(i, 1);
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Background scroll
    for (let s of stars) { s.x -= s.speed * speed * 0.1; if (s.x < 0) { s.x = W; s.y = Math.random() * H * 0.5; } }
    for (let m of mountains) { m.x -= speed * 0.2; if (m.x + m.w < -50) { m.x = W + 50; m.h = Math.random() * 100 + 60; } }
    for (let b of cityBuildings) { b.x -= speed * 0.4; if (b.x + b.w < -50) { b.x = W + 50; b.h = Math.random() * 80 + 40; } }
    for (let c of clouds) { c.x -= speed * 0.15; if (c.x + c.w < -50) { c.x = W + 50; c.y = Math.random() * H * 0.2 + 20; } }
}

function gameOver() {
    gameState = 'gameover';
    playSound('death');
    addParticle(player.x + player.w / 2, player.y + player.h / 2, '#ff3366', 25);
    if (score > highScore) {
        highScore = Math.floor(score);
        try { localStorage.setItem('neonRunnerHigh', highScore.toString()); } catch(e) {}
    }
}

function draw() {
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#0a0a2e');
    skyGrad.addColorStop(0.5, '#1a1a3e');
    skyGrad.addColorStop(1, '#0d0d24');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    ctx.fillStyle = '#ffffff';
    for (let s of stars) {
        ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.02 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
    
    // Mountains (far)
    ctx.fillStyle = '#1a1a4a';
    for (let m of mountains) {
        ctx.beginPath();
        ctx.moveTo(m.x, groundY);
        ctx.lineTo(m.x + m.w / 2, groundY - m.h);
        ctx.lineTo(m.x + m.w, groundY);
        ctx.fill();
    }
    
    // City buildings (mid)
    ctx.fillStyle = '#151535';
    for (let b of cityBuildings) {
        ctx.fillRect(b.x, groundY - b.h, b.w, b.h);
        // Windows
        ctx.fillStyle = '#2a2a5a';
        for (let wy = 0; wy < b.h - 10; wy += 12) {
            for (let wx = 4; wx < b.w - 4; wx += 8) {
                if (Math.sin(wx * 7 + wy * 3 + frameCount * 0.01) > 0.3) {
                    ctx.fillRect(b.x + wx, groundY - b.h + wy + 5, 4, 6);
                }
            }
        }
        ctx.fillStyle = '#151535';
    }
    
    // Clouds
    ctx.fillStyle = 'rgba(100, 100, 180, 0.15)';
    for (let c of clouds) {
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.w * 0.6, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(c.x + c.w * 0.3, c.y - 8, c.w * 0.4, 12, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Ground
    const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
    groundGrad.addColorStop(0, '#2a2a5a');
    groundGrad.addColorStop(1, '#1a1a3a');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, groundY, W, H - groundY);
    
    // Ground line (neon)
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Grid on ground
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i < W; i += 40) {
        const offset = (frameCount * speed * 0.5) % 40;
        ctx.beginPath();
        ctx.moveTo(i - offset, groundY);
        ctx.lineTo(i - offset + 20, H);
        ctx.stroke();
    }
    
    // Coins
    for (let coin of coins) {
        if (coin.collected) continue;
        ctx.save();
        ctx.shadowColor = '#ffdd00';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ffdd00';
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('$', coin.x, coin.y + 4);
        ctx.restore();
    }
    
    // Powerups
    for (let p of powerups) {
        ctx.save();
        const color = p.type === 'shield' ? '#00ffff' : '#44ff88';
        ctx.shadowColor = color;
        ctx.shadowBlur = 12;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'shield' ? 'S' : 'SLOW', p.x, p.y + 4);
        ctx.restore();
    }
    
    // Obstacles
    for (let obs of obstacles) {
        ctx.save();
        if (obs.type === 'drone') {
            ctx.shadowColor = '#ff3366';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#ff3366';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            // Propellers
            ctx.strokeStyle = '#ff6699';
            ctx.lineWidth = 2;
            const rot = frameCount * 0.5;
            ctx.beginPath();
            ctx.moveTo(obs.x + 5, obs.y - 4);
            ctx.lineTo(obs.x + 5 + Math.cos(rot) * 8, obs.y - 4);
            ctx.moveTo(obs.x + obs.w - 5, obs.y - 4);
            ctx.lineTo(obs.x + obs.w - 5 + Math.cos(rot + Math.PI) * 8, obs.y - 4);
            ctx.stroke();
        } else if (obs.type === 'spike') {
            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y + obs.h);
            ctx.lineTo(obs.x + obs.w / 2, obs.y);
            ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
            ctx.fill();
        } else {
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#cc3333';
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.strokeStyle = '#ff5555';
            ctx.lineWidth = 1;
            ctx.strokeRect(obs.x + 4, obs.y + 4, obs.w - 8, obs.h - 8);
        }
        ctx.restore();
    }
    
    // Player trail
    if (gameState === 'playing') {
        for (let i = 0; i < player.trail.length; i++) {
            const t = player.trail[i];
            const alpha = (i / player.trail.length) * 0.4;
            ctx.fillStyle = `rgba(0, 255, 204, ${alpha})`;
            ctx.fillRect(t.x + 10, t.y - 5, 16, 10);
        }
    }
    
    // Player
    if (gameState === 'playing' || gameState === 'start') {
        ctx.save();
        const px = player.x, py = player.y;
        
        if (player.shield > 0 && Math.floor(frameCount / 5) % 2 === 0) {
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(px + player.w / 2, py + player.h / 2, 30, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Body
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 8;
        ctx.fillStyle = player.invincible > 0 && Math.floor(frameCount / 4) % 2 === 0 ? 'rgba(0,255,204,0.3)' : '#00ffcc';
        ctx.fillRect(px + 6, py + 8, player.w - 12, player.h - 16);
        
        // Head
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px + player.w / 2, py + 10, 8, 0, Math.PI * 2);
        ctx.fill();
        
        // Visor
        ctx.fillStyle = '#00ccff';
        ctx.fillRect(px + player.w / 2 - 5, py + 6, 10, 4);
        
        // Legs (running animation)
        const legPhase = Math.sin(frameCount * 0.3) * (player.grounded ? 8 : 0);
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px + player.w / 2 - 5, py + player.h - 16);
        ctx.lineTo(px + player.w / 2 - 5 + legPhase * 0.5, py + player.h - 4);
        ctx.moveTo(px + player.w / 2 + 5, py + player.h - 16);
        ctx.lineTo(px + player.w / 2 + 5 - legPhase * 0.5, py + player.h - 4);
        ctx.stroke();
        
        // Jetpack flame when jumping
        if (!player.grounded) {
            const flameH = Math.random() * 10 + 8;
            ctx.fillStyle = `rgba(255, ${Math.floor(Math.random() * 100) + 150}, 0, 0.8)`;
            ctx.beginPath();
            ctx.moveTo(px + player.w / 2 - 4, py + player.h);
            ctx.lineTo(px + player.w / 2, py + player.h + flameH);
            ctx.lineTo(px + player.w / 2 + 4, py + player.h);
            ctx.fill();
        }
        
        ctx.restore();
    }
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // HUD
    if (gameState === 'playing') {
        ctx.save();
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 4;
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 35);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#88ffff';
        ctx.fillText(`HI: ${highScore}`, 20, 55);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffdd00';
        ctx.fillText(`${Math.floor(speed * 10)} km/h`, W - 20, 35);
        if (player.shield > 0) {
            ctx.textAlign = 'left';
            ctx.fillStyle = '#00ffff';
            ctx.fillText(`SHIELD: ${Math.ceil(player.shield / 60)}`, 20, 75);
        }
        ctx.restore();
    }
    
    // Start screen
    if (gameState === 'start') {
        drawStartScreen();
    }
    
    // Game over screen
    if (gameState === 'gameover') {
        drawGameOver();
    }
}

function drawStartScreen() {
    ctx.save();
    ctx.fillStyle = 'rgba(5, 5, 20, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    const pulse = Math.sin(Date.now() * 0.003) * 5;
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 20 + pulse;
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('NEON RUNNER', W / 2, H / 3);
    
    ctx.shadowBlur = 0;
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaffee';
    ctx.fillText('Endless Side-Scrolling Runner', W / 2, H / 3 + 40);
    
    // Controls box
    const bx = W / 2 - 160, by = H / 2 + 20;
    ctx.fillStyle = 'rgba(0, 255, 204, 0.05)';
    ctx.fillRect(bx, by, 320, 120);
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, 320, 120);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = '15px monospace';
    ctx.fillText('SPACE / UP / W  —  Jump', W / 2, by + 35);
    ctx.fillText('Double jump in the air!', W / 2, by + 60);
    ctx.fillText('Collect coins & powerups', W / 2, by + 85);
    ctx.fillText('Avoid obstacles to survive', W / 2, by + 110);
    
    // Start prompt
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#ffdd00';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('PRESS SPACE TO START', W / 2, H - 80);
    }
    
    if (highScore > 0) {
        ctx.fillStyle = '#88ffff';
        ctx.font = '14px monospace';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, H - 50);
    }
    
    ctx.restore();
}

function drawGameOver() {
    ctx.save();
    ctx.fillStyle = 'rgba(5, 5, 20, 0.75)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#ff3366';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 3);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px monospace';
    ctx.fillText(`Score: ${Math.floor(score)}`, W / 2, H / 3 + 50);
    
    if (Math.floor(score) >= highScore && highScore > 0) {
        ctx.fillStyle = '#ffdd00';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 3 + 85);
    } else {
        ctx.fillStyle = '#88ffff';
        ctx.font = '16px monospace';
        ctx.fillText(`Best: ${highScore}`, W / 2, H / 3 + 85);
    }
    
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('PRESS SPACE TO RESTART', W / 2, H - 70);
    }
    
    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        initAudio();
        
        if (gameState === 'start') {
            init();
            gameState = 'playing';
        } else if (gameState === 'playing') {
            if (player.jumps < player.maxJumps) {
                player.vy = -13;
                player.jumps++;
                player.grounded = false;
                playSound('jump');
                addParticle(player.x + player.w / 2, player.y + player.h, '#00ffcc', 5);
            }
        } else if (gameState === 'gameover') {
            init();
            gameState = 'playing';
        }
    }
    
    // Restart key
    if (e.code === 'KeyR' && gameState === 'gameover') {
        init();
        gameState = 'playing';
    }
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    
    if (gameState === 'start') {
        init();
        gameState = 'playing';
    } else if (gameState === 'playing') {
        if (player.jumps < player.maxJumps) {
            player.vy = -13;
            player.jumps++;
            player.grounded = false;
            playSound('jump');
            addParticle(player.x + player.w / 2, player.y + player.h, '#00ffcc', 5);
        }
    } else if (gameState === 'gameover') {
        init();
        gameState = 'playing';
    }
});

// Init and start loop
init();
gameLoop();
</script>
</body>
</html>
