<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Space Invaders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type, freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.1));
}
function sfxShoot() { playSound('square', 880, 0.08, 0.1); }
function sfxExplode() { playSound('sawtooth', 120, 0.3, 0.2); }
function sfxZombieDie() { playSound('square', 200, 0.2, 0.15); playSound('sawtooth', 80, 0.4, 0.1); }
function sfxPowerUp() { playSound('sine', 600, 0.15, 0.15); setTimeout(()=>playSound('sine', 900, 0.15, 0.15), 80); }
function sfxHit() { playSound('sawtooth', 60, 0.2, 0.3); }
function sfxWave() { playSound('sine', 440, 0.3, 0.1); setTimeout(()=>playSound('sine', 550, 0.3, 0.1), 150); }

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('zombieSI_high') || '0'); } catch(e){}
let wave = 1;
let playerX, playerY, playerW, playerH;
let bullets = [];
let zombies = [];
let zombieBullets = [];
let powerups = [];
let particles = [];
let shields = [];
let keys = {};
let shootCooldown = 0;
let powerUpTimer = 0;
let powerUpType = 0; // 0=none, 1=spread, 2=rapid
let zombieMoveTimer = 0;
let zombieDirection = 1;
let zombieSpeed = 1.5;
let frameCount = 0;

// Player
const PLAYER_SPEED = 6;

function initPlayer() {
    playerW = 40;
    playerH = 30;
    playerX = W / 2 - playerW / 2;
    playerY = H - 50;
}

function createZombieGrid() {
    zombies = [];
    const cols = 8;
    const rows = 5;
    const spacingX = Math.min(60, W / (cols + 1));
    const spacingY = 40;
    const startX = (W - (cols - 1) * spacingX) / 2;
    const startY = 80;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            zombies.push({
                x: startX + c * spacingX,
                y: startY + r * spacingY,
                w: 36, h: 32,
                row: r, col: c,
                hp: r < 1 ? 2 : 1,
                type: Math.random() < 0.2 ? 'brute' : (Math.random() < 0.15 ? 'shooter' : 'walker'),
                wobble: Math.random() * Math.PI * 2
            });
        }
    }
}

function initShields() {
    shields = [];
    const shieldW = W / 4;
    for (let i = 0; i < 4; i++) {
        shields.push({ x: i * shieldW, y: H - 120, w: shieldW - 10, h: 20, hp: 3 });
    }
}

function startWave() {
    createZombieGrid();
    initShields();
    zombieDirection = 1;
    zombieMoveTimer = 0;
    zombieSpeed = 1 + wave * 0.5;
    bullets = [];
    zombieBullets = [];
    powerups = [];
    particles = [];
    shootCooldown = 0;
    sfxWave();
}

function startGame() {
    score = 0;
    wave = 1;
    initPlayer();
    startWave();
    gameState = 'playing';
}

// Input
window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (gameState === 'start' || gameState === 'gameover') {
        initAudio();
        startGame();
    }
});
window.addEventListener('keyup', function(e) { keys[e.code] = false; });

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < (count || 8); i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 30 + Math.random() * 20,
            color: color || '#7fff7f',
            size: 3 + Math.random() * 4
        });
    }
}

function spawnBrainPowerUp(x, y) {
    powerups.push({ x: x, y: y, vy: 1.5, type: Math.random() < 0.5 ? 1 : 2, w: 24, h: 24 });
}

// Update
function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) playerX -= PLAYER_SPEED;
    if (keys['ArrowRight'] || keys['KeyD']) playerX += PLAYER_SPEED;
    playerX = Math.max(0, Math.min(W - playerW, playerX));

    // Shooting
    shootCooldown--;
    let cd = powerUpType === 2 ? 5 : 12;
    if (keys['Space'] && shootCooldown <= 0) {
        if (powerUpType === 1) {
            bullets.push({ x: playerX + playerW/2 - 4, y: playerY, vy: -8, w: 4, h: 12 });
            bullets.push({ x: playerX + playerW/2 - 12, y: playerY, vy: -7, vx: -2, w: 4, h: 12 });
            bullets.push({ x: playerX + playerW/2 + 8, y: playerY, vy: -7, vx: 2, w: 4, h: 12 });
        } else {
            bullets.push({ x: playerX + playerW/2 - 3, y: playerY, vy: -10, w: 6, h: 14 });
        }
        shootCooldown = cd;
        sfxShoot();
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y += b.vy;
        if (b.vx) b.x += b.vx;
        if (b.y < -20) bullets.splice(i, 1);
    }

    // Update zombie bullets
    for (let i = zombieBullets.length - 1; i >= 0; i--) {
        let b = zombieBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y > H + 20 || b.x < -20 || b.x > W + 20) { zombieBullets.splice(i, 1); continue; }
        // Hit player
        if (b.x + b.w > playerX && b.x < playerX + playerW && b.y + b.h > playerY && b.y < playerY + playerH) {
            zombieBullets.splice(i, 1);
            sfxHit();
            gameState = 'gameover';
            try { if (score > highScore) { highScore = score; localStorage.setItem('zombieSI_high', highScore); } } catch(e){}
        }
    }

    // Zombie movement (discrete jumps like space invaders)
    zombieMoveTimer++;
    let moveInterval = Math.max(5, 30 - wave * 2);
    if (zombieMoveTimer >= moveInterval) {
        zombieMoveTimer = 0;
        for (let z of zombies) {
            z.x += zombieDirection * 12;
        }
        // Check bounds
        let minX = Infinity, maxX = -Infinity;
        for (let z of zombies) {
            minX = Math.min(minX, z.x);
            maxX = Math.max(maxX, z.x + z.w);
        }
        if (minX < 10 || maxX > W - 10) zombieDirection *= -1;
    }

    // Zombie shooting
    if (frameCount % Math.max(20, 60 - wave * 5) === 0) {
        let shooters = zombies.filter(z => z.type === 'shooter' || Math.random() < 0.3);
        if (shooters.length > 0) {
            let shooter = shooters[Math.floor(Math.random() * shooters.length)];
            zombieBullets.push({ x: shooter.x + shooter.w/2 - 4, y: shooter.y + shooter.h, vx: (Math.random()-0.5)*2, vy: 3 + wave * 0.3, w: 8, h: 8 });
        }
    }

    // Bullet vs Zombie collision
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        for (let j = zombies.length - 1; j >= 0; j--) {
            let z = zombies[j];
            if (b.x + b.w > z.x && b.x < z.x + z.w && b.y + b.h > z.y && b.y < z.y + z.h) {
                bullets.splice(i, 1);
                z.hp--;
                if (z.hp <= 0) {
                    score += z.type === 'brute' ? 50 : (z.type === 'shooter' ? 30 : 10);
                    spawnParticles(z.x + z.w/2, z.y + z.h/2, '#7fff7f', 12);
                    sfxZombieDie();
                    if (Math.random() < 0.15) spawnBrainPowerUp(z.x + z.w/2, z.y + z.h/2);
                    zombies.splice(j, 1);
                } else {
                    sfxHit();
                }
                break;
            }
        }
    }

    // Zombies reaching bottom
    for (let i = zombies.length - 1; i >= 0; i--) {
        if (zombies[i].y + zombies[i].h > H - 60) {
            spawnParticles(zombies[i].x, zombies[i].y, '#ff4444', 15);
            sfxHit();
            gameState = 'gameover';
            try { if (score > highScore) { highScore = score; localStorage.setItem('zombieSI_high', highScore); } } catch(e){}
            return;
        }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.y += p.vy;
        if (p.y > H + 30) { powerups.splice(i, 1); continue; }
        if (p.x + p.w > playerX && p.x < playerX + playerW && p.y + p.h > playerY && p.y < playerY + playerH) {
            powerUpType = p.type;
            powerUpTimer = 300;
            sfxPowerUp();
            powerups.splice(i, 1);
        }
    }

    // Powerup timer
    if (powerUpTimer > 0) {
        powerUpTimer--;
        if (powerUpTimer <= 0) powerUpType = 0;
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Check wave clear
    if (zombies.length === 0) {
        wave++;
        startWave();
    }
}

// Draw
function drawZombie(z) {
    const x = z.x, y = z.y + Math.sin(z.wobble + frameCount * 0.1) * 2;
    ctx.save();
    
    if (z.type === 'brute') {
        // Brute - big red-ish zombie
        ctx.fillStyle = '#8b3a3a';
        ctx.fillRect(x, y, z.w, z.h);
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(x + 4, y + 4, 8, 8);
        ctx.fillRect(x + z.w - 12, y + 4, 8, 8);
        ctx.fillStyle = '#ff6666';
        ctx.fillRect(x + 10, y + 18, z.w - 20, 6);
        // Claws
        ctx.fillStyle = '#cc3333';
        ctx.fillRect(x - 4, y + 10, 5, 12);
        ctx.fillRect(x + z.w - 1, y + 10, 5, 12);
    } else if (z.type === 'shooter') {
        // Shooter - purple zombie with gun
        ctx.fillStyle = '#4a3a6b';
        ctx.fillRect(x, y, z.w, z.h);
        ctx.fillStyle = '#cc66ff';
        ctx.fillRect(x + 5, y + 4, 7, 7);
        ctx.fillRect(x + z.w - 12, y + 4, 7, 7);
        ctx.fillStyle = '#9944cc';
        ctx.fillRect(x + 8, y + 16, z.w - 16, 5);
        // Gun barrel
        ctx.fillStyle = '#6666aa';
        ctx.fillRect(x + z.w/2 - 3, y + z.h, 6, 10);
    } else {
        // Walker - classic green zombie
        ctx.fillStyle = '#3a5a2a';
        ctx.fillRect(x, y, z.w, z.h);
        ctx.fillStyle = '#7fff7f';
        ctx.fillRect(x + 5, y + 4, 8, 8);
        ctx.fillRect(x + z.w - 13, y + 4, 8, 8);
        // Mouth
        ctx.fillStyle = '#2a4a1a';
        ctx.fillRect(x + 8, y + 18, z.w - 16, 5);
        // Arms
        ctx.fillStyle = '#5a8a3a';
        ctx.fillRect(x - 3, y + 8, 4, 10);
        ctx.fillRect(x + z.w - 1, y + 8, 4, 10);
    }
    
    ctx.restore();
}

function drawPlayer() {
    // Cannon body
    ctx.fillStyle = '#445566';
    ctx.fillRect(playerX, playerY, playerW, playerH);
    // Barrel
    ctx.fillStyle = '#8899aa';
    ctx.fillRect(playerX + playerW/2 - 4, playerY - 15, 8, 15);
    // Glow
    ctx.fillStyle = powerUpType === 1 ? '#ffcc00' : (powerUpType === 2 ? '#66ccff' : '#66ff99');
    ctx.fillRect(playerX + 4, playerY + 4, playerW - 8, 6);
}

function drawShield(s) {
    if (s.hp <= 0) return;
    const alpha = s.hp / 3;
    ctx.fillStyle = `rgba(50, 120, 200, ${alpha * 0.7})`;
    ctx.fillRect(s.x + 5, s.y, s.w - 10, s.h);
    ctx.strokeStyle = `rgba(100, 180, 255, ${alpha})`;
    ctx.strokeRect(s.x + 5, s.y, s.w - 10, s.h);
}

function drawPowerUp(p) {
    // Brain jar
    ctx.fillStyle = '#ff66aa';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#ff99cc';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🧠', p.x + p.w/2, p.y + p.h - 2);
}

function drawBackground() {
    // Dark sky with stars
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137.5 + frameCount * 0.02) % W;
        const sy = (i * 97.3) % H;
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(frameCount * 0.05 + i) * 0.3})`;
        ctx.fillRect(sx, sy, 2, 2);
    }
    
    // Moon (sickly green)
    ctx.fillStyle = '#1a3a1a';
    ctx.beginPath();
    ctx.arc(W - 80, 60, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a4a2a';
    ctx.beginPath();
    ctx.arc(W - 80, 60, 25, 0, Math.PI * 2);
    ctx.fill();
}

function drawHUD() {
    ctx.fillStyle = '#7fff7f';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`WAVE: ${wave}`, 20, 50);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffcc7f';
    ctx.fillText(`HI: ${highScore}`, W - 20, 30);
    
    if (powerUpTimer > 0) {
        ctx.textAlign = 'center';
        ctx.fillStyle = powerUpType === 1 ? '#ffcc00' : '#66ccff';
        ctx.fillText(powerUpType === 1 ? 'SPREAD SHOT' : 'RAPID FIRE', W/2, 30);
    }
}

function drawStartScreen() {
    drawBackground();
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7fff7f';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('ZOMBIE', W/2, H/2 - 60);
    ctx.fillText('SPACE INVADERS', W/2, H/2 - 10);
    
    ctx.fillStyle = '#ffcc7f';
    ctx.font = '18px monospace';
    ctx.fillText('← → or A/D to move', W/2, H/2 + 50);
    ctx.fillText('SPACE to shoot', W/2, H/2 + 80);
    ctx.fillText('Collect 🧠 for power-ups!', W/2, H/2 + 110);
    
    if (highScore > 0) {
        ctx.fillStyle = '#aaa';
        ctx.font = '16px monospace';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H/2 + 150);
    }
    
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('PRESS ANY KEY TO START', W/2, H/2 + 200);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('YOU ARE DEVOURED', W/2, H/2 - 40);
    
    ctx.fillStyle = '#7fff7f';
    ctx.font = '24px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2 + 10);
    ctx.fillText(`WAVE REACHED: ${wave}`, W/2, H/2 + 45);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc7f';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H/2 + 85);
    }
    
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText('PRESS ANY KEY TO RESTART', W/2, H/2 + 140);
    }
}

function render() {
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }
    
    drawBackground();
    
    // Shields
    for (let s of shields) drawShield(s);
    
    // Zombies
    for (let z of zombies) drawZombie(z);
    
    // Player
    drawPlayer();
    
    // Bullets
    ctx.fillStyle = '#aaffaa';
    for (let b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    
    // Zombie bullets
    ctx.fillStyle = '#ff6666';
    for (let b of zombieBullets) {
        ctx.beginPath();
        ctx.arc(b.x + b.w/2, b.y + b.h/2, 5, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Powerups
    for (let p of powerups) drawPowerUp(p);
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // HUD
    drawHUD();
    
    if (gameState === 'gameover') drawGameOver();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

initPlayer();
gameLoop();
})();
</script>
</body>
</html>
