<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout Frogger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a0a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    switch(type) {
        case 'bounce':
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
            break;
        case 'brick':
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, now);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
            break;
        case 'splash':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
            break;
        case 'lose':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.5);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
            break;
        case 'win':
            osc.type = 'square';
            [523,659,784,1047].forEach((f,i) => {
                osc.frequency.setValueAtTime(f, now + i*0.15);
            });
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
            break;
        case 'car':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(350, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
            break;
    }
}

// Game state
let state = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let level = 1;

// Paddle (Frog)
let frog = { x: 0, y: 0, w: 80, h: 25, speed: 8 };

// Ball (Fly)
let ball = { x: 0, y: 0, r: 7, vx: 0, vy: 0, stuck: true };
let flyFrame = 0;

// Bricks
let bricks = [];
const BRICK_COLS = 8;
const BRICK_ROWS = 9;
let brickW, brickH, brickPadTop, brickPadLeft;

function createBricks() {
    bricks = [];
    const gameW = Math.min(W * 0.8, 700);
    const gameH = H - 120;
    brickW = (gameW - 20) / BRICK_COLS;
    brickH = Math.min(30, (gameH * 0.5) / BRICK_ROWS);
    brickPadTop = 60;
    brickPadLeft = (W - gameW) / 2 + 10;

    for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
            let type;
            if (r === 0) type = 'home';
            else if (r <= 3) type = 'car';
            else type = 'log';

            let hp = type === 'home' ? 2 : 1;
            let points = type === 'home' ? 50 : type === 'car' ? 30 : 20;

            bricks.push({
                x: brickPadLeft + c * (brickW + 4),
                y: brickPadTop + r * (brickH + 4),
                w: brickW,
                h: brickH,
                type: type,
                hp: hp,
                maxHp: hp,
                points: points,
                alive: true,
                flash: 0
            });
        }
    }
}

function resetBall() {
    ball.stuck = true;
    ball.x = frog.x + frog.w / 2;
    ball.y = frog.y - 15;
    ball.vx = 0;
    ball.vy = 0;
}

function launchBall() {
    if (!ball.stuck) return;
    ball.stuck = false;
    const angle = -Math.PI / 4 + Math.random() * Math.PI / 2 - Math.PI / 2;
    const speed = 5 + level;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
}

function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    createBricks();
    frog.x = W / 2 - frog.w / 2;
    frog.y = H - 60;
    resetBall();
}

function nextLevel() {
    level++;
    createBricks();
    resetBall();
}

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 30 + Math.random() * 20,
            color: color,
            size: 3 + Math.random() * 4
        });
    }
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'start' || state === 'gameover' || state === 'win') {
        initAudio();
        if (e.code === 'Space' || e.code === 'Enter') {
            resetGame();
            state = 'playing';
        }
    } else if (state === 'playing') {
        if (ball.stuck && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) {
            launchBall();
        }
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Update
function update() {
    if (state !== 'playing') return;

    // Frog movement
    if (keys['ArrowLeft'] || keys['KeyA']) frog.x -= frog.speed;
    if (keys['ArrowRight'] || keys['KeyD']) frog.x += frog.speed;
    frog.x = Math.max(0, Math.min(W - frog.w, frog.x));

    // Ball stuck follows frog
    if (ball.stuck) {
        ball.x = frog.x + frog.w / 2;
        ball.y = frog.y - 15;
    } else {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall bounce
        if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); playSound('bounce'); }
        if (ball.x + ball.r >= W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); playSound('bounce'); }
        if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playSound('bounce'); }

        // Frog paddle bounce
        if (ball.vy > 0 && ball.y + ball.r >= frog.y && ball.y + ball.r <= frog.y + frog.h + 10 &&
            ball.x >= frog.x && ball.x <= frog.x + frog.w) {
            let hitPos = (ball.x - frog.x) / frog.w;
            let angle = (hitPos - 0.5) * Math.PI * 0.7;
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            ball.vx = Math.sin(angle) * speed;
            ball.vy = -Math.cos(angle) * speed;
            playSound('bounce');
        }

        // Ball lost
        if (ball.y + ball.r > H) {
            lives--;
            playSound('lose');
            if (lives <= 0) {
                state = 'gameover';
            } else {
                resetBall();
            }
        }

        // Brick collision
        for (let b of bricks) {
            if (!b.alive) continue;
            if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
                ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {

                let overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
                let overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
                if (overlapX < overlapY) {
                    ball.vx = -ball.vx;
                } else {
                    ball.vy = -ball.vy;
                }

                b.hp--;
                b.flash = 5;
                if (b.hp <= 0) {
                    b.alive = false;
                    score += b.points;
                    let color = b.type === 'car' ? '#ff6633' : b.type === 'log' ? '#8B4513' : '#44ff44';
                    spawnParticles(ball.x, ball.y, color, 8);
                    if (b.type === 'log') playSound('splash');
                    else if (b.type === 'car') playSound('car');
                    else playSound('brick');

                    // Check win
                    if (bricks.every(br => !br.alive)) {
                        state = 'win';
                        playSound('win');
                    }
                } else {
                    playSound('brick');
                }
                break;
            }
        }
    }

    // Particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    flyFrame++;
}

// Draw
function drawFrog(x, y, w, h) {
    // Body
    ctx.fillStyle = '#2d8a2d';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x + w * 0.3, y + 5, 6, 0, Math.PI * 2);
    ctx.arc(x + w * 0.7, y + 5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x + w * 0.3, y + 4, 3, 0, Math.PI * 2);
    ctx.arc(x + w * 0.7, y + 4, 3, 0, Math.PI * 2);
    ctx.fill();
    // Belly stripe
    ctx.fillStyle = '#5dbb5d';
    ctx.fillRect(x + 10, y + h - 6, w - 20, 4);
}

function drawFly(x, y) {
    const wingAngle = Math.sin(flyFrame * 0.8) * 0.4;
    ctx.save();
    ctx.translate(x, y);
    // Wings
    ctx.fillStyle = 'rgba(200,230,255,0.6)';
    ctx.beginPath();
    ctx.ellipse(-5, -4, 8, 4, wingAngle, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(5, -4, 8, 4, -wingAngle, 0, Math.PI * 2);
    ctx.fill();
    // Body
    ctx.fillStyle = '#ffdd33';
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    // Stripes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-2, -4); ctx.lineTo(-2, 4);
    ctx.moveTo(2, -4); ctx.lineTo(2, 4);
    ctx.stroke();
    ctx.restore();
}

function drawBrick(b) {
    if (!b.alive) return;
    let baseColor, detailColor;
    switch (b.type) {
        case 'car':
            baseColor = b.hp < b.maxHp ? '#cc4400' : '#ff5522';
            detailColor = '#ffaa33';
            break;
        case 'log':
            baseColor = b.hp < b.maxHp ? '#5a3a1a' : '#8B5E2B';
            detailColor = '#6b4420';
            break;
        case 'home':
            baseColor = b.hp < b.maxHp ? '#228822' : '#33cc33';
            detailColor = '#88ff88';
            break;
    }

    ctx.fillStyle = baseColor;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, b.w, b.h, 4);
    ctx.fill();

    // Details by type
    if (b.type === 'car') {
        // Car shape hint
        ctx.fillStyle = detailColor;
        ctx.fillRect(b.x + b.w * 0.15, b.y + b.h * 0.3, b.w * 0.7, b.h * 0.4);
        // Windows
        ctx.fillStyle = '#aaddff';
        ctx.fillRect(b.x + b.w * 0.25, b.y + b.h * 0.35, b.w * 0.15, b.h * 0.2);
        ctx.fillRect(b.x + b.w * 0.6, b.y + b.h * 0.35, b.w * 0.15, b.h * 0.2);
    } else if (b.type === 'log') {
        // Log rings
        ctx.strokeStyle = detailColor;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x + b.w * 0.3, b.y + b.h / 2, b.h * 0.3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(b.x + b.w * 0.7, b.y + b.h / 2, b.h * 0.25, 0, Math.PI * 2);
        ctx.stroke();
    } else if (b.type === 'home') {
        // House shape
        ctx.fillStyle = detailColor;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w / 2, b.y + 3);
        ctx.lineTo(b.x + b.w - 5, b.y + b.h / 2);
        ctx.lineTo(b.x + 5, b.y + b.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(b.x + b.w * 0.35, b.y + b.h * 0.5, b.w * 0.3, b.h * 0.4);
    }

    // Flash effect
    if (b.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${b.flash * 0.1})`;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        b.flash--;
    }
}

function drawBackground() {
    // Gradient sky to ground
    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a2a4a');
    grad.addColorStop(0.5, '#0a1a2a');
    grad.addColorStop(1, '#0a2a0a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Lane labels
    const labelX = brickPadLeft - 5;
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';

    for (let r = 0; r < BRICK_ROWS; r++) {
        let y = brickPadTop + r * (brickH + 4) + brickH / 2;
        if (r === 0) {
            ctx.fillStyle = '#44ff44';
            ctx.fillText('🏠', labelX, y);
        } else if (r <= 3) {
            ctx.fillStyle = '#ff6633';
            ctx.fillText('🚗', labelX, y);
        } else {
            ctx.fillStyle = '#4488cc';
            ctx.fillText('~', labelX, y);
        }
    }
}

function drawHUD() {
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`LEVEL: ${level}`, 20, 50);

    // Lives as frogs
    for (let i = 0; i < lives; i++) {
        drawFrog(W - 80 - i * 40, 15, 30, 14);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#aaa';
    ctx.font = '12px monospace';
    if (ball.stuck) {
        ctx.fillText('Press SPACE to launch the fly!', W / 2, H - 80);
    }
}

function drawParticles() {
    for (let p of particles) {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawStartScreen() {
    ctx.fillStyle = '#0a1a0a';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#33cc33';
    ctx.font = `bold ${Math.min(48, W * 0.06)}px monospace`;
    ctx.fillText('BREAKOUT FROGGER', W / 2, H * 0.25);

    ctx.font = `${Math.min(18, W * 0.03)}px monospace`;
    ctx.fillStyle = '#aaddaa';
    const lines = [
        'A mashup of Breakout and Frogger!',
        '',
        'Guide the FROG paddle to smash bricks with a FLY ball.',
        'Clear all lanes from ROAD to HOME to win!',
        '',
        '🚗 Car bricks (red) - 1 hit, 30 pts',
        '~ Log bricks (brown) - 1 hit, 20 pts',
        '🏠 Home bricks (green) - 2 hits, 50 pts',
        '',
        'CONTROLS:',
        '← → or A/D : Move frog',
        'SPACE / ↑ / W : Launch fly',
        '',
        'Press SPACE to START!'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H * 0.35 + i * Math.min(24, H * 0.035));
    });

    // Animated frog
    const t = Date.now() * 0.003;
    drawFrog(W / 2 - 30, H * 0.8 + Math.sin(t) * 5, 60, 22);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${Math.min(48, W * 0.06)}px monospace`;
    ctx.fillText('GAME OVER', W / 2, H * 0.35);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.45);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('Press SPACE to restart', W / 2, H * 0.55);
}

function drawWin() {
    // Check if should advance level or full win
    ctx.fillStyle = 'rgba(0,0,40,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#33ff33';
    ctx.font = `bold ${Math.min(48, W * 0.06)}px monospace`;
    ctx.fillText('LEVEL COMPLETE!', W / 2, H * 0.35);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Score: ${score}`, W / 2, H * 0.45);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('Press SPACE for next level', W / 2, H * 0.55);

    // Confetti
    if (Math.random() < 0.3) {
        particles.push({
            x: Math.random() * W, y: -10,
            vx: (Math.random() - 0.5) * 3,
            vy: 2 + Math.random() * 3,
            life: 60,
            color: `hsl(${Math.random()*360},100%,60%)`,
            size: 4 + Math.random() * 4
        });
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    if (state === 'start') {
        drawStartScreen();
        return;
    }

    drawBackground();

    // Bricks
    for (let b of bricks) drawBrick(b);

    // Frog
    drawFrog(frog.x, frog.y, frog.w, frog.h);

    // Fly/Ball
    if (state === 'playing') {
        drawFly(ball.x, ball.y);
    }

    // Particles
    drawParticles();

    // HUD
    drawHUD();

    if (state === 'gameover') drawGameOver();
    if (state === 'win') drawWin();
}

// Win handling - next level on space
window.addEventListener('keydown', e => {
    if (state === 'win' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        nextLevel();
        state = 'playing';
    }
});

// Main loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

createBricks();
frog.x = W / 2 - frog.w / 2;
frog.y = H - 60;
resetBall();
gameLoop();
</script>
</body>
</html>
