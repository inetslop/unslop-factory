<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sokoban Stealth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d0d1a; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
canvas { display: block; image-rendering: pixelated; }
#ui { position: absolute; top: 10px; left: 10px; color: #7fdbff; font-size: 14px; pointer-events: none; text-shadow: 0 0 8px #7fdbff; }
#alert-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.15); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="alert-flash"></div>
<div id="ui"></div>
<script>
(function(){
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const alertFlash = document.getElementById('alert-flash');
const uiDiv = document.getElementById('ui');

let W, H, TILE, cols, rows;
let gameState = 'START'; // START, PLAYING, ALERT, CAUGHT, WIN, ALLWIN
let frame = 0;
let guardTimer = 0;
let alertTimer = 0;
let caughtTimer = 0;
let winTimer = 0;
let levelIdx = 0;

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxMove() { playTone(200, 0.05, 'square', 0.05); }
function sfxPush() { playTone(120, 0.1, 'triangle', 0.08); }
function sfxAlert() { playTone(800, 0.3, 'sawtooth', 0.12); playTone(600, 0.4, 'square', 0.08); }
function sfxCaught() { playTone(150, 0.5, 'sawtooth', 0.15); }
function sfxWin() { playTone(523, 0.15, 'square', 0.1); setTimeout(()=>playTone(659,0.15,'square',0.1),150); setTimeout(()=>playTone(784,0.3,'square',0.1),300); }
function sfxTarget() { playTone(440, 0.1, 'sine', 0.08); }

// Level definitions
// # = wall, space = floor, P = player, B = box, T = target, G = guard
// Guard patrol directions: U,D,L,R cycles
const levels = [
{
    name: "First Steps",
    map: [
        "###########",
        "#P   ..  #",
        "#  ## ###",
        "#  B  . #",
        "#  ## ###",
        "#  ...  #",
        "#####G####",
        "###########"
    ],
    guards: [{x:5,y:6,patrol:['L','R'],speed:70}]
},
{
    name: "Double Watch",
    map: [
        "#############",
        "#P   ..    #",
        "#  B## ###T#",
        "#  B  .#G #",
        "#  ## ### #",
        "#  ...  T #",
        "#####G######",
        "#############"
    ],
    guards: [{x:9,y:3,patrol:['U','D'],speed:60},{x:5,y:6,patrol:['L','R'],speed:80}]
},
{
    name: "The Gauntlet",
    map: [
        "###############",
        "#P   ..     T#",
        "#  B## ###  #",
        "#  B  .#G ###",
        "#  ## ###B. #",
        "#  ...  T G #",
        "#####G######G#",
        "###############"
    ],
    guards: [{x:9,y:3,patrol:['U','D'],speed:50},{x:12,y:5,patrol:['L','R'],speed:60},{x:5,y:6,patrol:['R','L'],speed:70}]
}
];

let grid = [];
let player = {x:0,y:0};
let boxes = [];
let targets = [];
let guards = [];
let guardDirIdx = [];

function loadLevel(idx) {
    const lvl = levels[idx];
    const mapStr = lvl.map;
    rows = mapStr.length;
    cols = Math.max(...mapStr.map(r=>r.length));
    grid = [];
    boxes = [];
    targets = [];
    guards = [];
    guardDirIdx = [];
    
    for (let r=0;r<rows;r++) {
        grid[r] = [];
        for (let c=0;c<cols;c++) {
            const ch = mapStr[r][c] || '#';
            grid[r][c] = '#';
            if (ch===' ') grid[r][c]=' ';
            if (ch==='.') grid[r][c]='.';
            if (ch==='P') { player={x:c,y:r}; grid[r][c]=' '; }
            if (ch==='B') { boxes.push({x:c,y:r}); grid[r][c]=' '; }
            if (ch==='T') { targets.push({x:c,y:r}); grid[r][c]=' '; }
        }
    }
    
    for (const g of lvl.guards) {
        guards.push({x:g.x, y:g.y, dir:0, patrolIdx:0, alertDist:0});
    }
    guardDirIdx = guards.map((_,i)=>0);
    
    guardTimer = 0;
    alertTimer = 0;
    caughtTimer = 0;
    winTimer = 0;
    gameState = 'PLAYING';
    
    sizeCanvas();
}

function sizeCanvas() {
    if (!rows) rows=8; if (!cols) cols=13;
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    TILE = Math.min(Math.floor(maxW/cols), Math.floor(maxH/rows));
    W = cols * TILE;
    H = rows * TILE;
    canvas.width = W;
    canvas.height = H;
}

window.addEventListener('resize', sizeCanvas);

function isWall(x,y) {
    if (y<0||y>=rows||x<0||x>=cols) return true;
    return grid[y][x]==='#';
}

function hasBox(x,y) {
    return boxes.some(b=>b.x===x&&b.y===y);
}

function hasGuard(x,y) {
    return guards.some(g=>g.x===x&&g.y===y);
}

function movePlayer(dx,dy) {
    const nx = player.x+dx, ny = player.y+dy;
    if (isWall(nx,ny)) return;
    if (hasGuard(nx,ny)) return;
    
    if (hasBox(nx,ny)) {
        // Try to push box
        const bx = nx+dx, by = ny+dy;
        if (isWall(bx,by) || hasBox(bx,by) || hasGuard(bx,by)) return;
        const box = boxes.find(b=>b.x===nx&&b.y===ny);
        box.x = bx; box.y = by;
        sfxPush();
        // Check if box on target
        if (targets.some(t=>t.x===bx&&t.y===by)) sfxTarget();
    } else {
        sfxMove();
    }
    
    player.x = nx; player.y = ny;
    
    // Check win
    if (boxes.every(b => targets.some(t=>t.x===b.x&&t.y===b.y))) {
        gameState = 'WIN';
        winTimer = 0;
        sfxWin();
    }
}

function guardDirVec(dir) {
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]]; // U,D,L,R
    return dirs[dir%4];
}

function moveGuard(gi, dx, dy) {
    const g = guards[gi];
    const nx = g.x+dx, ny = g.y+dy;
    if (isWall(nx,ny) || hasBox(nx,ny)) return false;
    // Don't walk onto player unless alert & adjacent
    if (nx===player.x && ny===player.y) {
        if (gameState==='ALERT') {
            g.x=nx; g.y=ny;
            gameState='CAUGHT';
            caughtTimer=0;
            sfxCaught();
            return true;
        }
        return false;
    }
    g.x = nx; g.y = ny;
    return true;
}

function updateGuards() {
    const patrolDirs = ['U','D','L','R'];
    const dirMap = {'U':[0,-1],'D':[0,1],'L':[-1,0],'R':[1,0]};
    
    for (let i=0;i<guards.length;i++) {
        const g = guards[i];
        const lvl = levels[levelIdx];
        
        if (gameState==='ALERT') {
            // Chase player: simple greedy step
            let dx = Math.sign(player.x - g.x);
            let dy = Math.sign(player.y - g.y);
            // Try to reduce Manhattan distance
            let bestDx=0, bestDy=0, bestDist=999;
            for (let tdx=-1;tdx<=1;tdx++) {
                for (let tdy=-1;tdy<=1;tdy++) {
                    if (tdx===0&&tdy===0) continue;
                    const nx=g.x+tdx, ny=g.y+tdy;
                    if (isWall(nx,ny)||hasBox(nx,ny)) continue;
                    if (nx===player.x&&ny===player.y) { bestDist=0; bestDx=tdx; bestDy=tdy; continue; }
                    const dist = Math.abs(player.x-nx)+Math.abs(player.y-ny);
                    if (dist<bestDist) { bestDist=dist; bestDx=tdx; bestDy=tdy; }
                }
            }
            if (bestDx!==0||bestDy!==0) moveGuard(i,bestDx,bestDy);
        } else {
            // Patrol
            const patrol = lvl.guards[i].patrol;
            guardDirIdx[i] = (guardDirIdx[i]+1) % patrol.length;
            const d = patrol[guardDirIdx[i]];
            const v = dirMap[d];
            if (v) moveGuard(i, v[0], v[1]);
        }
    }
    
    // Check vision
    if (gameState==='PLAYING') {
        for (let i=0;i<guards.length;i++) {
            const g = guards[i];
            const lvl = levels[levelIdx];
            const patrol = lvl.guards[i].patrol;
            const d = patrol[guardDirIdx[i]];
            const v = dirMap[d] || [0,1];
            
            // Check line of sight in facing direction (up to 5 tiles)
            for (let step=1;step<=5;step++) {
                const cx = g.x + v[0]*step;
                const cy = g.y + v[1]*step;
                if (isWall(cx,cy)) break;
                if (cx===player.x && cy===player.y) {
                    gameState='ALERT';
                    alertTimer=0;
                    sfxAlert();
                    break;
                }
            }
        }
    }
}

function update() {
    frame++;
    
    if (gameState==='PLAYING' || gameState==='ALERT') {
        const lvl = levels[levelIdx];
        const speed = Math.min(...lvl.guards.map(g=>g.speed));
        guardTimer++;
        if (guardTimer >= speed) {
            guardTimer = 0;
            updateGuards();
        }
        
        if (gameState==='ALERT') {
            alertTimer++;
            if (alertTimer > 180) { // 3 seconds of alert -> caught
                gameState='CAUGHT';
                caughtTimer=0;
                sfxCaught();
            }
        }
    }
    
    if (gameState==='CAUGHT') {
        caughtTimer++;
        if (caughtTimer > 90) loadLevel(levelIdx);
    }
    
    if (gameState==='WIN') {
        winTimer++;
        if (winTimer > 120) {
            levelIdx++;
            if (levelIdx >= levels.length) gameState = 'ALLWIN';
            else loadLevel(levelIdx);
        }
    }
}

function drawTile(x,y,type) {
    const px = x*TILE, py = y*TILE;
    switch(type) {
        case '#':
            ctx.fillStyle = '#2a2a3e';
            ctx.fillRect(px,py,TILE,TILE);
            ctx.fillStyle = '#3a3a5e';
            ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
            // Brick pattern
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            ctx.strokeRect(px+2,py+2,TILE/2-2,TILE/2-2);
            ctx.strokeRect(px+TILE/2,py+2,TILE/2-2,TILE/2-2);
            break;
        case ' ':
            ctx.fillStyle = '#16213e';
            ctx.fillRect(px,py,TILE,TILE);
            // Subtle grid
            ctx.strokeStyle = '#1a2745';
            ctx.lineWidth = 0.5;
            ctx.strokeRect(px,py,TILE,TILE);
            break;
        case '.':
            ctx.fillStyle = '#16213e';
            ctx.fillRect(px,py,TILE,TILE);
            // Target glow
            const pulse = Math.sin(frame*0.05)*0.3+0.7;
            ctx.beginPath();
            ctx.arc(px+TILE/2, py+TILE/2, TILE*0.3*pulse, 0, Math.PI*2);
            ctx.fillStyle = `rgba(46, 213, 115, ${0.3+pulse*0.3})`;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px+TILE/2, py+TILE/2, TILE*0.15, 0, Math.PI*2);
            ctx.fillStyle = `rgba(46, 213, 115, ${0.5+pulse*0.3})`;
            ctx.fill();
            break;
    }
}

function drawPlayer() {
    const px = player.x*TILE, py = player.y*TILE;
    // Body
    ctx.beginPath();
    ctx.arc(px+TILE/2, py+TILE/2, TILE*0.35, 0, Math.PI*2);
    ctx.fillStyle = '#7fdbff';
    ctx.fill();
    ctx.strokeStyle = '#00d4ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px+TILE/2-4, py+TILE/2-3, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px+TILE/2+4, py+TILE/2-3, 3, 0, Math.PI*2);
    ctx.fill();
}

function drawGuard(gi) {
    const g = guards[gi];
    const px = g.x*TILE, py = g.y*TILE;
    const isAlert = gameState==='ALERT';
    
    // Vision cone
    if (gameState!=='CAUGHT') {
        const lvl = levels[levelIdx];
        const patrol = lvl.guards[gi].patrol;
        const d = patrol[guardDirIdx[gi]%patrol.length];
        const dirMap2 = {'U':[0,-1],'D':[0,1],'L':[-1,0],'R':[1,0]};
        const v = dirMap2[d]||[0,1];
        
        ctx.save();
        ctx.globalAlpha = isAlert ? 0.4 : 0.15;
        ctx.fillStyle = isAlert ? '#ff3333' : '#ffdd44';
        ctx.beginPath();
        const cx = px+TILE/2, cy = py+TILE/2;
        // Draw cone based on direction
        const spread = 0.5;
        let a1,a2;
        if (v[0]===0&&v[1]===-1) { a1=-Math.PI/2-spread; a2=-Math.PI/2+spread; }
        else if (v[0]===0&&v[1]===1) { a1=Math.PI/2-spread; a2=Math.PI/2+spread; }
        else if (v[0]===-1&&v[1]===0) { a1=Math.PI-spread; a2=Math.PI+spread; }
        else { a1=-spread; a2=spread; }
        const len = TILE*4;
        ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,len,a1,a2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
    
    // Body
    ctx.beginPath();
    ctx.arc(px+TILE/2, py+TILE/2, TILE*0.35, 0, Math.PI*2);
    ctx.fillStyle = isAlert ? '#ff4444' : '#e94560';
    ctx.fill();
    ctx.strokeStyle = isAlert ? '#ff0000' : '#c0392b';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Hat (distinguishes from player)
    ctx.fillStyle = isAlert ? '#cc0000' : '#8e1e3a';
    ctx.fillRect(px+TILE*0.25, py+TILE*0.15, TILE*0.5, TILE*0.2);
    
    // Eyes (angry)
    ctx.fillStyle = isAlert ? '#ff0' : '#fff';
    ctx.beginPath();
    ctx.arc(px+TILE/2-4, py+TILE/2+2, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px+TILE/2+4, py+TILE/2+2, 2, 0, Math.PI*2);
    ctx.fill();
}

function drawBox(bi) {
    const b = boxes[bi];
    const px = b.x*TILE, py = b.y*TILE;
    const onTarget = targets.some(t=>t.x===b.x&&t.y===b.y);
    
    ctx.fillStyle = onTarget ? '#27ae60' : '#8B4513';
    ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
    ctx.strokeStyle = onTarget ? '#2ecc71' : '#654321';
    ctx.lineWidth = 2;
    ctx.strokeRect(px+2,py+2,TILE-4,TILE-4);
    // Cross pattern
    ctx.beginPath();
    ctx.moveTo(px+4,py+4); ctx.lineTo(px+TILE-4,py+TILE-4);
    ctx.moveTo(px+TILE-4,py+4); ctx.lineTo(px+4,py+TILE-4);
    ctx.strokeStyle = onTarget ? '#27ae60' : '#654321';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    if (onTarget) {
        const pulse = Math.sin(frame*0.1)*0.2+0.8;
        ctx.strokeStyle = `rgba(46, 204, 113, ${pulse})`;
        ctx.lineWidth = 3;
        ctx.strokeRect(px+1,py+1,TILE-2,TILE-2);
    }
}

function render() {
    ctx.clearRect(0,0,W,H);
    
    // Draw tiles
    for (let y=0;y<rows;y++) {
        for (let x=0;x<cols;x++) {
            let type = grid[y][x];
            if (type===' ') type=' ';
            drawTile(x,y,type);
        }
    }
    
    // Draw targets (on floor)
    for (const t of targets) {
        const px=t.x*TILE, py=t.y*TILE;
        const pulse = Math.sin(frame*0.05)*0.3+0.7;
        ctx.beginPath();
        ctx.arc(px+TILE/2,py+TILE/2,TILE*0.3*pulse,0,Math.PI*2);
        ctx.fillStyle=`rgba(46,213,115,${0.2+pulse*0.2})`;
        ctx.fill();
    }
    
    // Draw boxes
    for (let i=0;i<boxes.length;i++) drawBox(i);
    
    // Draw guards
    for (let i=0;i<guards.length;i++) drawGuard(i);
    
    // Draw player
    if (gameState!=='CAUGHT') drawPlayer();
    
    // Overlays
    if (gameState==='START' || gameState==='ALLWIN') {
        ctx.fillStyle = 'rgba(13,13,26,0.85)';
        ctx.fillRect(0,0,W,H);
        
        const cx=W/2, cy=H/2;
        ctx.textAlign='center';
        ctx.fillStyle='#7fdbff';
        ctx.font=`bold ${Math.min(TILE*1.5,48)}px Courier New`;
        ctx.fillText(gameState==='ALLWIN'?'YOU WIN!':'SOKOBAN STEALTH', cx, cy-TILE*2);
        
        ctx.font=`${Math.min(TILE*0.6,18)}px Courier New`;
        ctx.fillStyle='#a0d2eb';
        if (gameState==='ALLWIN') {
            ctx.fillText('All levels complete!', cx, cy-TILE);
            ctx.fillText('Press R to replay', cx, cy);
        } else {
            ctx.fillText('Push all crates to green targets.', cx, cy-TILE);
            ctx.fillText("Avoid the guards' vision cones!", cx, cy-TILE*0.5);
            ctx.fillText('', cx, cy);
            ctx.fillText('WASD / Arrows = Move', cx, cy+TILE*0.3);
            ctx.fillText('R = Restart Level', cx, cy+TILE*0.7);
            ctx.fillText('Press any key to start', cx, cy+TILE*1.3);
        }
    }
    
    if (gameState==='CAUGHT') {
        ctx.fillStyle = `rgba(255,0,0,${Math.min(caughtTimer/90*0.4, 0.4)})`;
        ctx.fillRect(0,0,W,H);
        ctx.textAlign='center';
        ctx.fillStyle='#fff';
        ctx.font=`bold ${Math.min(TILE,32)}px Courier New`;
        ctx.fillText('CAUGHT!', W/2, H/2);
    }
    
    if (gameState==='WIN') {
        ctx.fillStyle = `rgba(46,213,115,${Math.min(winTimer/60*0.3,0.3)})`;
        ctx.fillRect(0,0,W,H);
        ctx.textAlign='center';
        ctx.fillStyle='#2ecc71';
        ctx.font=`bold ${Math.min(TILE,32)}px Courier New`;
        ctx.fillText('LEVEL COMPLETE!', W/2, H/2);
    }
    
    // UI
    let uiText = '';
    if (gameState==='PLAYING' || gameState==='ALERT') {
        const boxesDone = boxes.filter(b=>targets.some(t=>t.x===b.x&&t.y===b.y)).length;
        uiText = `Level ${levelIdx+1}: ${levels[levelIdx].name}  |  Crates: ${boxesDone}/${boxes.length}`;
        if (gameState==='ALERT') {
            const remain = Math.ceil((180-alertTimer)/60);
            uiText += `  |  DANGER! ${remain}s`;
        }
    }
    uiDiv.textContent = uiText;
    uiDiv.style.color = gameState==='ALERT' ? '#ff4444' : '#7fdbff';
    
    alertFlash.style.opacity = gameState==='ALERT' ? '1' : '0';
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

window.addEventListener('keydown', function(e) {
    initAudio();
    
    if (gameState==='START') {
        loadLevel(0);
        return;
    }
    
    if (e.key==='r' || e.key==='R') {
        loadLevel(levelIdx);
        return;
    }
    
    if (gameState==='ALLWIN') {
        levelIdx = 0;
        loadLevel(0);
        return;
    }
    
    if (gameState==='CAUGHT' || gameState==='WIN') return;
    
    let dx=0, dy=0;
    switch(e.key) {
        case 'ArrowUp': case 'w': case 'W': dy=-1; break;
        case 'ArrowDown': case 's': case 'S': dy=1; break;
        case 'ArrowLeft': case 'a': case 'A': dx=-1; break;
        case 'ArrowRight': case 'd': case 'D': dx=1; break;
        default: return;
    }
    e.preventDefault();
    movePlayer(dx, dy);
});

// Init
sizeCanvas();
loadLevel(0);
gameState = 'START';
loop();
})();
</script>
</body>
</html>
