<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, duration, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
const STATE = { MENU: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3, WIN: 4 };
let gameState = STATE.MENU;
let score = { player: 0, ai: 0 };
let currentLevel = 0;
const WIN_SCORE = 3;

// Paddles
let playerPaddle = { x: 0, y: 0, w: 12, h: 80, speed: 7, targetY: 0 };
let aiPaddle = { x: 0, y: 0, w: 12, h: 80, speed: 4.5, targetY: 0 };

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8, speed: 6, active: false };

// Obstacles
let obstacles = [];
let particles = [];

// Level definitions
const levels = [
    { // Level 1 - Simple
        name: "WARM UP",
        desc: "No obstacles. Score 3 to advance!",
        scoreToWin: 3,
        ballSpeed: 5,
        aiSpeed: 3.5,
        obstacles: []
    },
    { // Level 2 - Single block
        name: "THE WALL",
        desc: "A block in the center. Find the angle!",
        scoreToWin: 3,
        ballSpeed: 6,
        aiSpeed: 4,
        obstacles: [
            { type: 'block', x: 0.5, y: 0.3, w: 20, h: H * 0.4, destructible: false }
        ]
    },
    { // Level 3 - Two blocks
        name: "SQUEEZE",
        desc: "Two walls create narrow gaps.",
        scoreToWin: 3,
        ballSpeed: 6.5,
        aiSpeed: 4.2,
        obstacles: [
            { type: 'block', x: 0.35, y: 0.1, w: 18, h: H * 0.35, destructible: false },
            { type: 'block', x: 0.65, y: 0.55, w: 18, h: H * 0.4, destructible: false }
        ]
    },
    { // Level 4 - Destructible blocks
        name: "BREAKER",
        desc: "Yellow blocks can be destroyed!",
        scoreToWin: 3,
        ballSpeed: 7,
        aiSpeed: 4.5,
        obstacles: [
            { type: 'block', x: 0.3, y: 0.2, w: 18, h: H * 0.25, destructible: true },
            { type: 'block', x: 0.5, y: 0.5, w: 18, h: H * 0.3, destructible: false },
            { type: 'block', x: 0.7, y: 0.6, w: 18, h: H * 0.35, destructible: true }
        ]
    },
    { // Level 5 - Moving block
        name: "SHIFT",
        desc: "A block moves up and down!",
        scoreToWin: 3,
        ballSpeed: 7,
        aiSpeed: 4.8,
        obstacles: [
            { type: 'moving', x: 0.5, y: 0.3, w: 18, h: H * 0.25, destructible: false, moveSpeed: 2, amplitude: H * 0.2 }
        ]
    },
    { // Level 6 - Final challenge
        name: "THE MAZE",
        desc: "Everything at once. Good luck!",
        scoreToWin: 4,
        ballSpeed: 7.5,
        aiSpeed: 5,
        obstacles: [
            { type: 'block', x: 0.3, y: 0.15, w: 16, h: H * 0.25, destructible: false },
            { type: 'moving', x: 0.55, y: 0.4, w: 16, h: H * 0.2, destructible: false, moveSpeed: 1.5, amplitude: H * 0.15 },
            { type: 'block', x: 0.75, y: 0.6, w: 16, h: H * 0.35, destructible: true }
        ]
    }
];

function setupLevel(idx) {
    const lvl = levels[idx];
    currentLevel = idx;
    score = { player: 0, ai: 0 };
    ball.speed = lvl.ballSpeed;
    aiPaddle.speed = lvl.aiSpeed;
    
    playerPaddle.x = 30;
    playerPaddle.y = H / 2 - playerPaddle.h / 2;
    aiPaddle.x = W - 42;
    aiPaddle.y = H / 2 - aiPaddle.h / 2;
    
    obstacles = [];
    for (let o of lvl.obstacles) {
        let obs = { ...o };
        obs.px = obs.x * W;
        obs.py = obs.y * H;
        obs.origY = obs.py;
        obs.phase = 0;
        obs.hp = obs.destructible ? 1 : Infinity;
        obstacles.push(obs);
    }
    
    ball.active = false;
    ball.x = W / 2;
    ball.y = H / 2;
    particles = [];
}

function serveBall() {
    ball.x = W / 2;
    ball.y = H / 2;
    const angle = (Math.random() - 0.5) * Math.PI / 3;
    const dir = Math.random() < 0.5 ? 1 : -1;
    ball.vx = Math.cos(angle) * ball.speed * dir;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.active = true;
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === STATE.MENU && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if (gameState === STATE.PLAYING && e.code === 'Space') {
        if (!ball.active) serveBall();
    } else if ((gameState === STATE.LEVEL_COMPLETE || gameState === STATE.GAME_OVER || gameState === STATE.WIN) && (e.code === 'Space' || e.code === 'Enter')) {
        nextAction();
    }
    e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    setupLevel(0);
    gameState = STATE.PLAYING;
}

function nextAction() {
    if (gameState === STATE.LEVEL_COMPLETE) {
        if (currentLevel < levels.length - 1) {
            setupLevel(currentLevel + 1);
            gameState = STATE.PLAYING;
        } else {
            gameState = STATE.WIN;
        }
    } else if (gameState === STATE.GAME_OVER) {
        setupLevel(currentLevel);
        gameState = STATE.PLAYING;
    } else if (gameState === STATE.WIN) {
        gameState = STATE.MENU;
    }
}

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            color: color || '#fff'
        });
    }
}

// Update
function update() {
    if (gameState !== STATE.PLAYING) return;
    
    // Player paddle
    if (keys['ArrowUp'] || keys['KeyW']) playerPaddle.y -= playerPaddle.speed;
    if (keys['ArrowDown'] || keys['KeyS']) playerPaddle.y += playerPaddle.speed;
    playerPaddle.y = Math.max(0, Math.min(H - playerPaddle.h, playerPaddle.y));
    
    // AI paddle
    if (ball.active) {
        let targetY = ball.y - aiPaddle.h / 2;
        // AI has some error and prediction
        const predict = ball.x > W * 0.5 ? (ball.x - aiPaddle.x) / Math.abs(ball.vx || 1) : 0;
        if (ball.vx > 0) {
            targetY += ball.vy * predict * 0.7;
        }
        targetY = Math.max(0, Math.min(H - aiPaddle.h, targetY));
        
        const diff = targetY - aiPaddle.y;
        const moveSpeed = aiPaddle.speed;
        if (Math.abs(diff) > 5) {
            aiPaddle.y += Math.sign(diff) * Math.min(Math.abs(diff), moveSpeed);
        }
        aiPaddle.y = Math.max(0, Math.min(H - aiPaddle.h, aiPaddle.y));
    }
    
    // Moving obstacles
    for (let o of obstacles) {
        if (o.type === 'moving') {
            o.phase += 0.02;
            o.py = o.origY + Math.sin(o.phase) * o.amplitude;
            o.py = Math.max(0, Math.min(H - o.h, o.py));
        }
    }
    
    // Ball
    if (!ball.active) return;
    
    ball.x += ball.vx;
    ball.y += ball.vy;
    
    // Top/bottom walls
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; playSound(440, 0.1, 'square', 0.1); }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -ball.vy; playSound(440, 0.1, 'square', 0.1); }
    
    // Player paddle collision
    if (ball.vx < 0 && ball.x - ball.r <= playerPaddle.x + playerPaddle.w && ball.x + ball.r >= playerPaddle.x &&
        ball.y >= playerPaddle.y && ball.y <= playerPaddle.y + playerPaddle.h) {
        const hitPos = (ball.y - playerPaddle.y) / playerPaddle.h;
        const angle = (hitPos - 0.5) * Math.PI * 0.7;
        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
        ball.x = playerPaddle.x + playerPaddle.w + ball.r;
        playSound(660, 0.1, 'square', 0.15);
        spawnParticles(ball.x, ball.y, '#0ff', 8);
    }
    
    // AI paddle collision
    if (ball.vx > 0 && ball.x + ball.r >= aiPaddle.x && ball.x - ball.r <= aiPaddle.x + aiPaddle.w &&
        ball.y >= aiPaddle.y && ball.y <= aiPaddle.y + aiPaddle.h) {
        const hitPos = (ball.y - aiPaddle.y) / aiPaddle.h;
        const angle = Math.PI - (hitPos - 0.5) * Math.PI * 0.7;
        ball.vx = -Math.cos((hitPos - 0.5) * Math.PI * 0.7) * ball.speed;
        ball.vy = Math.sin((hitPos - 0.5) * Math.PI * 0.7) * ball.speed;
        ball.x = aiPaddle.x - ball.r;
        playSound(330, 0.1, 'square', 0.1);
    }
    
    // Obstacle collision
    for (let o of obstacles) {
        if (o.hp <= 0) continue;
        
        const ox = o.px, oy = o.py, ow = o.w, oh = o.h;
        
        // Check collision
        const closestX = Math.max(ox, Math.min(ball.x, ox + ow));
        const closestY = Math.max(oy, Math.min(ball.y, oy + oh));
        const dx = ball.x - closestX;
        const dy = ball.y - closestY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist < ball.r) {
            if (o.destructible && o.hp <= 1) {
                o.hp = 0;
                spawnParticles(closestX, closestY, '#ff0', 20);
                playSound(200, 0.3, 'sawtooth', 0.2);
            } else if (!o.destructible) {
                // Determine bounce direction
                const fromLeft = ball.x < ox;
                const fromRight = ball.x > ox + ow;
                const fromTop = ball.y < oy;
                const fromBottom = ball.y > oy + oh;
                
                if (fromLeft || fromRight) { ball.vx = -ball.vx; }
                else if (fromTop || fromBottom) { ball.vy = -ball.vy; }
                
                // Push ball out
                ball.x += ball.vx * 2;
                ball.y += ball.vy * 2;
                
                playSound(500, 0.08, 'triangle', 0.1);
                spawnParticles(closestX, closestY, '#888', 5);
            }
        }
    }
    
    // Score detection
    if (ball.x + ball.r < 0) {
        // AI scores
        score.ai++;
        ball.active = false;
        playSound(150, 0.4, 'sawtooth', 0.2);
        spawnParticles(0, ball.y, '#f0f', 15);
        if (score.ai >= WIN_SCORE) {
            gameState = STATE.GAME_OVER;
        }
    }
    if (ball.x - ball.r > W) {
        // Player scores
        score.player++;
        ball.active = false;
        playSound(800, 0.2, 'square', 0.15);
        spawnParticles(W, ball.y, '#0ff', 15);
        if (score.player >= levels[currentLevel].scoreToWin) {
            gameState = STATE.LEVEL_COMPLETE;
            playSound(600, 0.3, 'sine', 0.2);
            setTimeout(() => playSound(800, 0.3, 'sine', 0.2), 150);
        }
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Draw
function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(30,30,60,0.5)';
    ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    
    // Center line
    ctx.strokeStyle = 'rgba(100,100,150,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
    
    if (gameState === STATE.MENU) {
        drawMenu();
        return;
    }
    
    // Obstacles
    for (let o of obstacles) {
        if (o.hp <= 0) continue;
        if (o.destructible) {
            ctx.fillStyle = '#ffcc00';
            ctx.shadowColor = '#ffcc00';
            ctx.shadowBlur = 10;
        } else {
            ctx.fillStyle = o.type === 'moving' ? '#8866ff' : '#556677';
            ctx.shadowColor = o.type === 'moving' ? '#8866ff' : '#556677';
            ctx.shadowBlur = 8;
        }
        ctx.fillRect(o.px, o.py, o.w, o.h);
        ctx.shadowBlur = 0;
        
        // Border
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(o.px, o.py, o.w, o.h);
    }
    
    // Paddles
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);
    
    ctx.shadowColor = '#ff00ff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#ff00ff';
    ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);
    ctx.shadowBlur = 0;
    
    // Ball
    if (ball.active) {
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    
    // Score
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0ff';
    ctx.fillText(score.player, W / 2 - 50, 50);
    ctx.fillStyle = '#f0f';
    ctx.fillText(score.ai, W / 2 + 50, 50);
    
    // Level name
    ctx.font = '14px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`LVL ${currentLevel + 1}: ${levels[currentLevel].name}`, W / 2, H - 20);
    
    // Serve prompt
    if (!ball.active && gameState === STATE.PLAYING) {
        ctx.font = '18px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('PRESS SPACE TO SERVE', W / 2, H / 2 + 40);
    }
    
    // Overlays
    if (gameState === STATE.LEVEL_COMPLETE) {
        drawOverlay('LEVEL COMPLETE!', levels[currentLevel].desc, 'Press SPACE for next level');
    } else if (gameState === STATE.GAME_OVER) {
        drawOverlay('GAME OVER', `You lost ${score.ai}-${score.player}`, 'Press SPACE to retry');
    } else if (gameState === STATE.WIN) {
        drawOverlay('YOU WIN!', 'All levels cleared! You are a Puzzle Pong Master!', 'Press SPACE for menu');
    }
}

function drawMenu() {
    ctx.textAlign = 'center';
    
    // Title
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 20;
    ctx.font = 'bold 64px monospace';
    ctx.fillStyle = '#0ff';
    ctx.fillText('PUZZLE PONG', W / 2, H / 3);
    ctx.shadowBlur = 0;
    
    // Subtitle
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Bounce the ball past obstacles into the AI goal', W / 2, H / 3 + 50);
    
    // Controls
    ctx.font = '16px monospace';
    ctx.fillStyle = '#888';
    const lines = [
        '↑ / W - Move up',
        '↓ / S - Move down',
        'SPACE - Serve ball',
        '',
        'Navigate the ball around obstacles',
        'to score. Yellow blocks can be broken!',
        '',
        `6 Levels of increasing difficulty`
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H / 3 + 100 + i * 24);
    });
    
    // Start prompt (blinking)
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.font = 'bold 22px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('PRESS SPACE TO START', W / 2, H - 60);
    }
}

function drawOverlay(title, subtitle, action) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.shadowColor = title.includes('WIN') || title.includes('COMPLETE') ? '#0f0' : '#f00';
    ctx.shadowBlur = 20;
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = title.includes('WIN') || title.includes('COMPLETE') ? '#0f0' : '#f44';
    ctx.fillText(title, W / 2, H / 2 - 30);
    ctx.shadowBlur = 0;
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#ccc';
    ctx.fillText(subtitle, W / 2, H / 2 + 20);
    
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.font = '16px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText(action, W / 2, H / 2 + 70);
    }
}

// Game loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

setupLevel(0);
gameLoop();
</script>
</body>
</html>
