<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top-Down Breakout</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'paddle') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === 'brick') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'wall') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
    } else if (type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(500, now + 0.1);
        osc.frequency.setValueAtTime(600, now + 0.2);
        osc.frequency.setValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
    } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let level = 1;
let highScore = 0;
try {
    highScore = parseInt(localStorage.getItem('breakoutHigh') || '0');
} catch(e) {}

// Paddle
let paddle = { x: 0, w: 120, h: 16, speed: 8 };
let mouseX = null;
let keysDown = {};

// Ball
let ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, speed: 6, stuck: true };

// Bricks
let bricks = [];
const BRICK_COLS = 10;
const BRICK_ROWS = 5;
const BRICK_COLORS = [
    ['#ff4444', '#cc2222'],
    ['#ff8844', '#cc6622'],
    ['#ffcc44', '#cc9922'],
    ['#44ff44', '#22cc22'],
    ['#4488ff', '#2266cc']
];

// Particles
let particles = [];

// Power-ups
let powerUps = [];

// Screen shake
let shake = { x: 0, y: 0, intensity: 0 };

function getBrickSize() {
    const margin = 40;
    const topOffset = 80;
    const availW = W - margin * 2;
    const bw = Math.floor(availW / BRICK_COLS);
    return { w: bw, h: Math.min(30, H * 0.035), x: margin, y: topOffset, gap: 4 };
}

function initLevel(lv) {
    bricks = [];
    const bs = getBrickSize();
    for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
            // Pattern based on level
            let alive = true;
            if (lv > 1) {
                const pattern = ((r + c + lv) % (3 + Math.min(lv - 1, 3)));
                if (pattern === 0 && r < BRICK_ROWS - 2) alive = false;
            }
            bricks.push({
                x: bs.x + c * (bs.w + bs.gap),
                y: bs.y + r * (bs.h + bs.gap),
                w: bs.w,
                h: bs.h,
                alive: alive,
                row: r,
                col: c,
                hp: lv >= 3 ? 2 : 1
            });
        }
    }
}

function resetBall() {
    ball.stuck = true;
    ball.x = W / 2;
    ball.y = H - paddle.h - ball.r - 10;
    ball.vx = 0;
    ball.vy = 0;
}

function launchBall() {
    if (ball.stuck) {
        ball.stuck = false;
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
    }
}

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    initLevel(level);
    paddle.x = W / 2 - paddle.w / 2;
    resetBall();
    particles = [];
    powerUps = [];
    gameState = 'playing';
}

function nextLevel() {
    level++;
    if (level > 5) level = 1;
    initLevel(level);
    ball.speed = 6 + level * 0.5;
    resetBall();
}

// Input
window.addEventListener('keydown', e => {
    keysDown[e.code] = true;
    if (gameState === 'start' || gameState === 'gameover' || gameState === 'win') {
        initAudio();
        startGame();
    }
    if (gameState === 'playing' && ball.stuck) {
        launchBall();
    }
});
window.addEventListener('keyup', e => { keysDown[e.code] = false; });
window.addEventListener('mousemove', e => { mouseX = e.clientX; });
window.addEventListener('click', () => {
    if (gameState === 'start' || gameState === 'gameover' || gameState === 'win') {
        initAudio();
        startGame();
    } else if (gameState === 'playing' && ball.stuck) {
        launchBall();
    }
});

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color,
            size: 2 + Math.random() * 4
        });
    }
}

function spawnPowerUp(x, y) {
    if (Math.random() < 0.15) {
        const types = ['wide', 'multi', 'slow'];
        const type = types[Math.floor(Math.random() * types.length)];
        powerUps.push({ x, y, type, vy: 2, size: 14 });
    }
}

// Update
function update() {
    if (gameState !== 'playing') return;

    // Paddle movement
    if (mouseX !== null) {
        paddle.x += (mouseX - paddle.w / 2 - paddle.x) * 0.3;
    }
    if (keysDown['ArrowLeft'] || keysDown['KeyA']) paddle.x -= paddle.speed;
    if (keysDown['ArrowRight'] || keysDown['KeyD']) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    // Ball
    if (!ball.stuck) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions
        if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); playSound('wall'); }
        if (ball.x + ball.r >= W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); playSound('wall'); }
        if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playSound('wall'); }

        // Paddle collision
        const py = H - paddle.h - 20;
        if (ball.vy > 0 && ball.y + ball.r >= py && ball.y + ball.r <= py + paddle.h + 10 &&
            ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
            ball.y = py - ball.r;
            const hitPos = (ball.x - paddle.x) / paddle.w;
            const angle = (hitPos - 0.5) * Math.PI * 0.7;
            ball.vx = Math.sin(angle) * ball.speed;
            ball.vy = -Math.cos(angle) * ball.speed;
            playSound('paddle');
        }

        // Ball lost
        if (ball.y - ball.r > H) {
            lives--;
            playSound('lose');
            shake.intensity = 10;
            if (lives <= 0) {
                gameState = 'gameover';
                try { localStorage.setItem('breakoutHigh', String(highScore)); } catch(e) {}
                highScore = Math.max(highScore, score);
            } else {
                resetBall();
            }
        }

        // Brick collisions
        for (let b of bricks) {
            if (!b.alive) continue;
            if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
                ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
                // Determine side
                const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
                const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
                if (overlapX < overlapY) {
                    ball.vx = -(ball.vx);
                } else {
                    ball.vy = -(ball.vy);
                }

                b.hp--;
                if (b.hp <= 0) {
                    b.alive = false;
                    score += (5 - b.row) * 10 + level * 5;
                    const color = BRICK_COLORS[b.row][0];
                    spawnParticles(ball.x, ball.y, color, 8);
                    playSound('brick');
                    shake.intensity = 4;
                    spawnPowerUp(b.x + b.w / 2, b.y + b.h / 2);

                    // Check win
                    if (bricks.every(br => !br.alive)) {
                        playSound('win');
                        nextLevel();
                    }
                } else {
                    playSound('wall');
                }
                break;
            }
        }
    }

    // Power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.vy;
        if (p.y > H + 20) { powerUps.splice(i, 1); continue; }
        // Collect
        const py = H - paddle.h - 20;
        if (p.y + p.size > py && p.y - p.size < py + paddle.h &&
            p.x > paddle.x - 10 && p.x < paddle.x + paddle.w + 10) {
            playSound('powerup');
            if (p.type === 'wide') paddle.w = Math.min(paddle.w + 20, W * 0.4);
            else if (p.type === 'slow') { ball.speed *= 0.85; const r = Math.atan2(ball.vy, ball.vx); ball.vx = Math.cos(r) * ball.speed; ball.vy = Math.sin(r) * ball.speed; }
            else if (p.type === 'multi') { /* extra life */ lives++; }
            powerUps.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake decay
    shake.intensity *= 0.85;
    if (shake.intensity > 0.5) {
        shake.x = (Math.random() - 0.5) * shake.intensity;
        shake.y = (Math.random() - 0.5) * shake.intensity;
    } else {
        shake.x = 0;
        shake.y = 0;
    }
}

// Render
function render() {
    ctx.save();
    ctx.translate(shake.x, shake.y);

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Grid lines (top-down effect)
    ctx.strokeStyle = 'rgba(30, 40, 80, 0.3)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    if (gameState === 'start') {
        renderStartScreen();
    } else if (gameState === 'playing' || gameState === 'gameover' || gameState === 'win') {
        renderBricks();
        renderPowerUps();
        renderPaddle();
        renderBall();
        renderParticles();
        renderHUD();

        if (gameState === 'gameover') renderGameOver();
        if (gameState === 'win') renderWin();
    }

    ctx.restore();
}

function renderStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(60, W * 0.06)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('TOP-DOWN BREAKOUT', W / 2, H * 0.3);

    ctx.font = `${Math.min(18, W * 0.02)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('Move: Mouse / ← → / A D', W / 2, H * 0.45);
    ctx.fillText('Launch: Click / Space / Any Key', W / 2, H * 0.52);
    ctx.fillText('Break all bricks to advance levels!', W / 2, H * 0.59);

    ctx.fillStyle = '#ffcc44';
    ctx.font = `bold ${Math.min(22, W * 0.025)}px monospace`;
    ctx.fillText('— PRESS ANY KEY TO START —', W / 2, H * 0.75);

    if (highScore > 0) {
        ctx.fillStyle = '#888';
        ctx.font = `${Math.min(16, W * 0.018)}px monospace`;
        ctx.fillText(`High Score: ${highScore}`, W / 2, H * 0.85);
    }

    // Decorative bricks
    for (let i = 0; i < 5; i++) {
        const bx = W / 2 - 120 + i * 55;
        const by = H * 0.15;
        ctx.fillStyle = BRICK_COLORS[i][0];
        ctx.fillRect(bx, by, 45, 22);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(bx, by, 45, 6);
    }
}

function renderBricks() {
    for (let b of bricks) {
        if (!b.alive) continue;
        const color = BRICK_COLORS[b.row];
        // Top face
        ctx.fillStyle = color[0];
        ctx.fillRect(b.x, b.y, b.w, b.h);
        // Top highlight
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(b.x, b.y, b.w, b.h * 0.3);
        // Side shadow (top-down depth)
        ctx.fillStyle = color[1];
        ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4);
        // Border
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        // HP indicator
        if (b.hp > 1) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2 + 3);
        }
    }
}

function renderPaddle() {
    const py = H - paddle.h - 20;
    // Glow
    ctx.shadowColor = '#44aaff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#4488ff';
    ctx.fillRect(paddle.x, py, paddle.w, paddle.h);
    ctx.shadowBlur = 0;
    // Top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(paddle.x, py, paddle.w, 4);
    // Center notch
    ctx.fillStyle = '#88ccff';
    ctx.fillRect(paddle.x + paddle.w / 2 - 5, py + 4, 10, paddle.h - 8);
}

function renderBall() {
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // Inner glow
    const grad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(100,180,255,0.6)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    if (ball.stuck) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('click to launch', ball.x, ball.y - 20);
    }
}

function renderParticles() {
    for (let p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.globalAlpha = alpha;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function renderPowerUps() {
    for (let p of powerUps) {
        ctx.fillStyle = p.type === 'wide' ? '#44ff44' : p.type === 'slow' ? '#ff8844' : '#ff44aa';
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        const label = p.type === 'wide' ? 'W' : p.type === 'slow' ? 'S' : '+';
        ctx.fillText(label, p.x, p.y + 4);
    }
}

function renderHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(20, W * 0.02)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVES: ${'♥'.repeat(Math.max(0, lives))}`, W - 20, 30);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#888';
    ctx.font = `${Math.min(14, W * 0.015)}px monospace`;
    ctx.fillText(`LEVEL ${level}`, W / 2, 30);
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${Math.min(50, W * 0.05)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H * 0.4);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(20, W * 0.02)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.52);
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc44';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.6);
    }
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(16, W * 0.018)}px monospace`;
    ctx.fillText('Press any key to restart', W / 2, H * 0.75);
}

function renderWin() {
    // Brief win state before next level auto-handles
}

// Main loop
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

initLevel(1);
paddle.x = W / 2 - paddle.w / 2;
resetBall();
gameLoop();
</script>
</body>
</html>
