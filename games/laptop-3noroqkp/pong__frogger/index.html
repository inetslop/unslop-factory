<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let scoreLeft = 0;
let scoreRight = 0;
const WIN_SCORE = 7;

// Paddle settings
const PADDLE_W = 14;
const PADDLE_H = 80;
let paddleLeft = { y: 0, vy: 0 };
let paddleRight = { y: 0, vy: 0 };
const PADDLE_SPEED = 6;

// Frog ball
let frog = { x: 0, y: 0, vx: 0, vy: 0, r: 10, blinkTimer: 0, blinkState: false };

// Particles
let particles = [];

// Lane animations
let laneAnim = 0;
let carPositions = [];
for (let i = 0; i < 5; i++) {
    carPositions.push({ x: Math.random() * W, speed: 1 + Math.random() * 2, dir: Math.random() > 0.5 ? 1 : -1 });
}

// Water splash particles
let splashes = [];

function resetFrog(direction) {
    frog.x = W / 2;
    frog.y = H / 2;
    const angle = (Math.random() * 0.6 - 0.3);
    const speed = 5 + Math.min(scoreLeft + scoreRight, 8) * 0.3;
    frog.vx = Math.cos(angle) * speed * direction;
    frog.vy = Math.sin(angle) * speed;
    frog.blinkTimer = 60;
    frog.blinkState = false;
}

function startGame() {
    scoreLeft = 0;
    scoreRight = 0;
    paddleLeft.y = H / 2 - PADDLE_H / 2;
    paddleRight.y = H / 2 - PADDLE_H / 2;
    resetFrog(Math.random() > 0.5 ? 1 : -1);
    particles = [];
    splashes = [];
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: color || '#4a4',
            size: 2 + Math.random() * 4
        });
    }
}

function addSplash(x, y) {
    for (let i = 0; i < 15; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
        const speed = 2 + Math.random() * 5;
        splashes.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            life: 40,
            maxLife: 40,
            size: 3 + Math.random() * 5
        });
    }
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (gameState === 'start' || gameState === 'gameover') {
        initAudio();
        startGame();
        gameState = 'playing';
        playSound(440, 0.15, 'square', 0.08);
    }
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

let mouseY = null;
window.addEventListener('mousemove', (e) => {
    initAudio();
    mouseY = e.clientY;
});

// AI
function updateAI() {
    const targetY = frog.y - PADDLE_H / 2;
    const diff = targetY - paddleRight.y;
    const aiSpeed = 3.5 + (scoreLeft + scoreRight) * 0.15;
    if (Math.abs(diff) > 5) {
        paddleRight.y += Math.sign(diff) * Math.min(aiSpeed, Math.abs(diff));
    }
    paddleRight.y = Math.max(0, Math.min(H - PADDLE_H, paddleRight.y));
}

function update() {
    if (gameState !== 'playing') return;

    laneAnim += 0.5;

    // Update cars
    for (let c of carPositions) {
        c.x += c.speed * c.dir;
        if (c.x > W + 30) c.x = -30;
        if (c.x < -30) c.x = W + 30;
    }

    // Player paddle
    if (keys['w'] || keys['W'] || keys['ArrowUp']) {
        paddleLeft.y -= PADDLE_SPEED;
    }
    if (keys['s'] || keys['S'] || keys['ArrowDown']) {
        paddleLeft.y += PADDLE_SPEED;
    }
    if (mouseY !== null) {
        const target = mouseY - PADDLE_H / 2;
        paddleLeft.y += (target - paddleLeft.y) * 0.15;
    }
    paddleLeft.y = Math.max(0, Math.min(H - PADDLE_H, paddleLeft.y));

    // AI paddle
    updateAI();

    // Frog physics
    frog.x += frog.vx;
    frog.y += frog.vy;

    // Bounce off top/bottom
    if (frog.y < frog.r) {
        frog.y = frog.r;
        frog.vy = Math.abs(frog.vy);
        playSound(300, 0.05, 'square', 0.05);
        addParticles(frog.x, frog.y, '#8f4', 3);
    }
    if (frog.y > H - frog.r) {
        frog.y = H - frog.r;
        frog.vy = -Math.abs(frog.vy);
        playSound(300, 0.05, 'square', 0.05);
        addParticles(frog.x, frog.y, '#8f4', 3);
    }

    // Paddle collision - Left
    const leftPaddleX = 20;
    if (frog.vx < 0 && frog.x - frog.r <= leftPaddleX + PADDLE_W && frog.x - frog.r >= leftPaddleX) {
        if (frog.y > paddleLeft.y && frog.y < paddleLeft.y + PADDLE_H) {
            frog.x = leftPaddleX + PADDLE_W + frog.r;
            const hitPos = (frog.y - paddleLeft.y) / PADDLE_H;
            const angle = (hitPos - 0.5) * 1.2;
            const speed = Math.sqrt(frog.vx * frog.vx + frog.vy * frog.vy) * 1.02;
            frog.vx = Math.cos(angle) * speed;
            frog.vy = Math.sin(angle) * speed;
            playSound(600, 0.08, 'square', 0.1);
            addParticles(frog.x, frog.y, '#4a4', 5);
        }
    }

    // Paddle collision - Right
    const rightPaddleX = W - 20 - PADDLE_W;
    if (frog.vx > 0 && frog.x + frog.r >= rightPaddleX && frog.x + frog.r <= rightPaddleX + PADDLE_W) {
        if (frog.y > paddleRight.y && frog.y < paddleRight.y + PADDLE_H) {
            frog.x = rightPaddleX - frog.r;
            const hitPos = (frog.y - paddleRight.y) / PADDLE_H;
            const angle = Math.PI - (hitPos - 0.5) * 1.2;
            const speed = Math.sqrt(frog.vx * frog.vx + frog.vy * frog.vy) * 1.02;
            frog.vx = Math.cos(angle) * speed;
            frog.vy = Math.sin(angle) * speed;
            playSound(600, 0.08, 'square', 0.1);
            addParticles(frog.x, frog.y, '#4a4', 5);
        }
    }

    // Score
    if (frog.x < -20) {
        scoreRight++;
        playSound(200, 0.3, 'sawtooth', 0.1);
        addSplash(frog.x + 20, frog.y);
        if (scoreRight >= WIN_SCORE) { gameState = 'gameover'; }
        else resetFrog(1);
    }
    if (frog.x > W + 20) {
        scoreLeft++;
        playSound(800, 0.3, 'square', 0.1);
        addSplash(frog.x - 20, frog.y);
        if (scoreLeft >= WIN_SCORE) gameState = 'gameover';
        else resetFrog(-1);
    }

    // Frog blink
    frog.blinkTimer--;
    if (frog.blinkTimer <= 0) {
        frog.blinkState = !frog.blinkState;
        frog.blinkTimer = frog.blinkState ? 8 : 60 + Math.random() * 40;
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Splashes
    for (let i = splashes.length - 1; i >= 0; i--) {
        const s = splashes[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.3;
        s.life--;
        if (s.life <= 0) splashes.splice(i, 1);
    }
}

function drawFrog(x, y, r) {
    // Body
    ctx.fillStyle = '#4a4';
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.2, r, 0, 0, Math.PI * 2);
    ctx.fill();

    // Lighter belly
    ctx.fillStyle = '#6d6';
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.3, r * 0.8, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    if (!frog.blinkState) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - r * 0.4, y - r * 0.5, r * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + r * 0.4, y - r * 0.5, r * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Pupils
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(x - r * 0.35, y - r * 0.5, r * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + r * 0.35, y - r * 0.5, r * 0.18, 0, Math.PI * 2);
        ctx.fill();
    } else {
        // Closed eyes
        ctx.strokeStyle = '#2a2';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - r * 0.6, y - r * 0.5);
        ctx.lineTo(x - r * 0.2, y - r * 0.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + r * 0.2, y - r * 0.5);
        ctx.lineTo(x + r * 0.6, y - r * 0.5);
        ctx.stroke();
    }

    // Legs (little bumps)
    ctx.fillStyle = '#393';
    ctx.beginPath();
    ctx.arc(x - r * 1.1, y + r * 0.4, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + r * 1.1, y + r * 0.4, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
}

function drawPaddle(x, y, isLeft) {
    // Log-like paddle
    const grad = ctx.createLinearGradient(x, y, x + PADDLE_W, y);
    grad.addColorStop(0, '#5a3a1a');
    grad.addColorStop(0.5, '#8b5e2a');
    grad.addColorStop(1, '#5a3a1a');
    ctx.fillStyle = grad;

    // Rounded rect
    const r = 7;
    ctx.beginPath();
    ctx.roundRect(x, y, PADDLE_W, PADDLE_H, r);
    ctx.fill();

    // Wood grain lines
    ctx.strokeStyle = '#4a2a10';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
        const ly = y + 15 + i * 25;
        ctx.beginPath();
        ctx.moveTo(x + 3, ly);
        ctx.lineTo(x + PADDLE_W - 3, ly + 3);
        ctx.stroke();
    }

    // Frog sitting on paddle (small)
    const fy = y + PADDLE_H / 2;
    ctx.fillStyle = '#4a4';
    ctx.beginPath();
    ctx.arc(x + PADDLE_W / 2, fy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x + PADDLE_W / 2 - 2, fy - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + PADDLE_W / 2 + 2, fy - 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawBackground() {
    // Dark road background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Draw lanes (Frogger-style)
    const laneH = H / 7;
    for (let i = 0; i < 7; i++) {
        const ly = i * laneH;

        if (i % 3 === 1 || i === 5) {
            // Water lane
            ctx.fillStyle = 'rgba(30, 80, 120, 0.4)';
            ctx.fillRect(0, ly, W, laneH);
            // Waves
            ctx.strokeStyle = 'rgba(100, 180, 255, 0.3)';
            ctx.lineWidth = 1;
            for (let w = 0; w < W / 40; w++) {
                const wx = w * 40 + (laneAnim * (i % 2 === 0 ? 1 : -1)) % 40;
                ctx.beginPath();
                ctx.moveTo(wx, ly + laneH / 2);
                ctx.quadraticCurveTo(wx + 10, ly + laneH / 2 - 5, wx + 20, ly + laneH / 2);
                ctx.stroke();
            }
        } else if (i % 3 === 0) {
            // Road lane
            ctx.fillStyle = 'rgba(60, 60, 70, 0.5)';
            ctx.fillRect(0, ly, W, laneH);
            // Dashed center line
            ctx.strokeStyle = 'rgba(255, 255, 100, 0.3)';
            ctx.lineWidth = 2;
            ctx.setLineDash([15, 15]);
            ctx.beginPath();
            ctx.moveTo(0, ly + laneH / 2);
            ctx.lineTo(W, ly + laneH / 2);
            ctx.stroke();
            ctx.setLineDash([]);
        } else {
            // Grass lane
            ctx.fillStyle = 'rgba(30, 60, 30, 0.4)';
            ctx.fillRect(0, ly, W, laneH);
            // Grass tufts
            ctx.strokeStyle = 'rgba(50, 120, 50, 0.3)';
            ctx.lineWidth = 1;
            for (let g = 0; g < W / 30; g++) {
                const gx = g * 30 + 15;
                ctx.beginPath();
                ctx.moveTo(gx, ly + laneH - 5);
                ctx.lineTo(gx - 2, ly + laneH - 12);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(gx + 3, ly + laneH - 5);
                ctx.lineTo(gx + 5, ly + laneH - 10);
                ctx.stroke();
            }
        }

        // Lane divider
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, ly);
        ctx.lineTo(W, ly);
        ctx.stroke();
    }

    // Cars in road lanes
    for (let i = 0; i < carPositions.length; i++) {
        const c = carPositions[i];
        const laneIdx = [0, 3, 6][i % 3];
        if (laneIdx === undefined) continue;
        const ly = laneIdx * laneH + laneH / 2;
        // Simple car shape
        ctx.fillStyle = i % 2 === 0 ? 'rgba(180, 50, 50, 0.6)' : 'rgba(50, 50, 180, 0.6)';
        ctx.beginPath();
        ctx.roundRect(c.x - 15, ly - 7, 30, 14, 5);
        ctx.fill();
        // Windows
        ctx.fillStyle = 'rgba(200, 230, 255, 0.4)';
        ctx.fillRect(c.x - 8, ly - 5, 6, 4);
        ctx.fillRect(c.x + 3, ly - 5, 6, 4);
    }

    // Center line (net)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawScore() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(W / 2 - 120, 5, 240, 40);
    ctx.fillStyle = '#8f4';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(scoreLeft + '  :  ' + scoreRight, W / 2, 35);

    // Labels
    ctx.font = '12px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('YOU', W / 2 - 60, 38);
    ctx.fillText('AI', W / 2 + 60, 38);
}

function drawStartScreen() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#4a4';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('FROGGER', W / 2, H / 2 - 100);
    ctx.fillStyle = '#8f4';
    ctx.fillText('PONG', W / 2, H / 2 - 50);

    // Frog icon
    drawFrog(W / 2, H / 2 + 20, 25);

    // Instructions
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '16px monospace';
    ctx.fillText('W/S or Mouse to move your paddle', W / 2, H / 2 + 80);
    ctx.fillText('Keep the frog from escaping!', W / 2, H / 2 + 105);
    ctx.fillText('First to ' + WIN_SCORE + ' crossings wins', W / 2, H / 2 + 130);

    // Blinking prompt
    if (Math.floor(Date.now() / 600) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText('PRESS ANY KEY TO START', W / 2, H / 2 + 180);
    }

    // Decorative lanes in background
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < 7; i++) {
        const ly = i * (H / 7);
        if (i % 3 === 1) {
            ctx.fillStyle = '#264';
        } else if (i % 3 === 0) {
            ctx.fillStyle = '#444';
        } else {
            ctx.fillStyle = '#242';
        }
        ctx.fillRect(0, ly, W, H / 7);
    }
    ctx.globalAlpha = 1;
}

function drawGameOver() {
    // Dim overlay
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);

    const won = scoreLeft > scoreRight;

    ctx.fillStyle = won ? '#4a4' : '#f44';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(won ? 'YOU CROSSED!' : 'SPLASHED!', W / 2, H / 2 - 60);

    ctx.fillStyle = '#fff';
    ctx.font = '32px monospace';
    ctx.fillText(scoreLeft + '  :  ' + scoreRight, W / 2, H / 2);

    // Frog reaction
    if (won) {
        drawFrog(W / 2, H / 2 + 70, 25);
        // Confetti
        for (let i = 0; i < 20; i++) {
            const cx = W / 2 + Math.cos(i * 0.3) * (60 + i * 3);
            const cy = H / 2 + 70 + Math.sin(i * 0.3) * (40 + i * 2);
            ctx.fillStyle = ['#f44', '#4af', '#ff4', '#f4f'][i % 4];
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();
        }
    } else {
        // Sad frog in water
        ctx.fillStyle = 'rgba(30, 80, 150, 0.6)';
        ctx.beginPath();
        ctx.ellipse(W / 2, H / 2 + 75, 40, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        drawFrog(W / 2, H / 2 + 65, 18);
    }

    if (Math.floor(Date.now() / 600) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText('PRESS ANY KEY TO RESTART', W / 2, H / 2 + 150);
    }
}

function draw() {
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    drawBackground();

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw splashes
    for (const s of splashes) {
        ctx.globalAlpha = s.life / s.maxLife;
        ctx.fillStyle = '#6cf';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * (s.life / s.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Paddles
    drawPaddle(20, paddleLeft.y, true);
    drawPaddle(W - 20 - PADDLE_W, paddleRight.y, false);

    // Frog ball
    drawFrog(frog.x, frog.y, frog.r);

    // Score
    drawScore();

    // Game over overlay
    if (gameState === 'gameover') {
        drawGameOver();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Init
paddleLeft.y = H / 2 - PADDLE_H / 2;
paddleRight.y = H / 2 - PADDLE_H / 2;
frog.x = W / 2;
frog.y = H / 2;
gameLoop();
</script>
</body>
</html>
