<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper Cards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: #1a1a2e; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow: hidden;
}
#game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
#start-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
}
#start-screen h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: #e94560;
    text-shadow: 0 0 20px rgba(233,69,96,0.5);
    margin-bottom: 20px;
    letter-spacing: 2px;
}
#start-screen .subtitle {
    color: #a8b2d8;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    margin-bottom: 30px;
    text-align: center;
    max-width: 500px;
    line-height: 1.6;
}
#start-screen .controls {
    color: #7f8c9b;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
    text-align: center;
    margin-bottom: 30px;
    line-height: 1.8;
}
#start-screen .controls kbd {
    background: #2a2a4a;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid #4a4a6a;
    color: #a8b2d8;
}
.btn {
    background: linear-gradient(135deg, #e94560, #c73650);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
}
.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(233,69,96,0.6);
}
#hud {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
    align-items: center;
}
.hud-item {
    background: #16213e;
    padding: 8px 16px;
    border-radius: 6px;
    color: #a8b2d8;
    font-size: clamp(0.8rem, 1.5vw, 1rem);
}
.hud-item span {
    color: #e94560;
    font-weight: bold;
}
#board {
    display: grid;
    gap: 3px;
}
.card {
    width: var(--card-size);
    height: var(--card-size);
    position: relative;
    perspective: 400px;
    cursor: pointer;
}
.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
}
.card.flipped .card-inner {
    transform: rotateY(180deg);
}
.card-face, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: calc(var(--card-size) * 0.45);
    font-weight: bold;
}
.card-face {
    background: linear-gradient(145deg, #2a2a4a, #1e1e3a);
    border: 1px solid #3a3a5a;
    color: transparent;
}
.card-face::after {
    content: '♠';
    font-size: calc(var(--card-size) * 0.4);
    color: #4a4a6a;
}
.card-back {
    transform: rotateY(180deg);
    background: #1f2d45;
    border: 1px solid #3a5a7a;
    color: #4fc3f7;
}
.card-back.mine {
    background: #4a1a2a;
    border-color: #e94560;
    color: #ff4444;
}
.card-back.zero {
    background: #1a3a2a;
    border-color: #4caf50;
    color: #4caf50;
}
.card-flagged .card-face::before {
    content: '🚩';
    font-size: calc(var(--card-size) * 0.4);
    position: absolute;
}
#status {
    margin-top: 15px;
    color: #a8b2d8;
    font-size: clamp(1rem, 2vw, 1.3rem);
    min-height: 1.5em;
    text-align: center;
}
#status.win { color: #4caf50; }
#status.lose { color: #e94560; }
.card.reveal-anim .card-inner {
    animation: popIn 0.3s ease;
}
@keyframes popIn {
    0% { transform: rotateY(180deg) scale(0.8); }
    50% { transform: rotateY(180deg) scale(1.1); }
    100% { transform: rotateY(180deg) scale(1); }
}
.card.shake .card-inner {
    animation: shake 0.4s ease;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
#restart-btn {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 0.9rem;
}
</style>
</head>
<body>
<div id="game-container">
    <div id="start-screen">
        <h1>♠ Minesweeper Cards</h1>
        <p class="subtitle">Flip cards to reveal numbers. A number shows how many mines touch it. Reveal a 0 and its safe neighbors auto-flip. Find all safe cards without hitting a mine!</p>
        <div class="controls">
            <kbd>Click</kbd> to flip a card<br>
            <kbd>Right-Click</kbd> to flag as mine<br>
            <kbd>R</kbd> to restart
        </div>
        <button class="btn" id="start-btn">Deal Cards</button>
    </div>
    <div id="hud" style="display:none;">
        <div class="hud-item">Mines: <span id="mine-count">0</span></div>
        <div class="hud-item">Time: <span id="timer">0</span>s</div>
        <div class="hud-item">Flags: <span id="flag-count">0</span></div>
    </div>
    <div id="board"></div>
    <div id="status"></div>
    <button class="btn" id="restart-btn" style="display:none;">↻ New Game</button>
</div>

<script>
(function() {
    const COLS = 10, ROWS = 8, MINES = 24;
    let grid = [];
    let gameState = 'start'; // start, playing, won, lost
    let timerInterval = null;
    let seconds = 0;
    let flagCount = 0;

    const boardEl = document.getElementById('board');
    const hudEl = document.getElementById('hud');
    const statusEl = document.getElementById('status');
    const mineEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const flagEl = document.getElementById('flag-count');
    const startScreen = document.getElementById('start-screen');
    const restartBtn = document.getElementById('restart-btn');

    // Audio
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }
    function playFlipSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.12);
    }
    function playMineSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    }
    function playWinSound() {
        if (!audioCtx) return;
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
            osc.start(audioCtx.currentTime + i * 0.1);
            osc.stop(audioCtx.currentTime + i * 0.1 + 0.3);
        });
    }

    function sizeCards() {
        const maxW = window.innerWidth - 40;
        const maxH = (window.innerHeight - 120) / ROWS;
        const size = Math.floor(Math.min((maxW - (COLS - 1) * 3) / COLS, maxH));
        document.documentElement.style.setProperty('--card-size', size + 'px');
    }

    function createGrid() {
        grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        // Place mines randomly (not on first click for fairness - we'll handle that)
        const positions = [];
        for (let r = 0; r < ROWS; r++)
            for (let c = 0; c < COLS; c++)
                positions.push([r, c]);
        // Shuffle
        for (let i = positions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [positions[i], positions[j]] = [positions[j], positions[i]];
        }
        const mineSet = new Set(positions.slice(0, MINES).map(p => p[0] * COLS + p[1]));
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = {
                    isMine: mineSet.has(r * COLS + c),
                    revealed: false,
                    flagged: false,
                    number: 0
                };
            }
        }
        // Calculate numbers
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!grid[r][c].isMine) {
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].isMine) count++;
                        }
                    }
                    grid[r][c].number = count;
                }
            }
        }
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        boardEl.style.gridTemplateColumns = `repeat(${COLS}, var(--card-size))`;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.r = r;
                card.dataset.c = c;
                card.innerHTML = `<div class="card-inner"><div class="card-face"></div><div class="card-back">${grid[r][c].isMine ? '💣' : grid[r][c].number}</div></div>`;
                const back = card.querySelector('.card-back');
                if (grid[r][c].isMine) back.classList.add('mine');
                else if (grid[r][c].number === 0) back.classList.add('zero');
                boardEl.appendChild(card);
            }
        }
    }

    function revealCard(r, c, animate = true) {
        const cell = grid[r][c];
        cell.revealed = true;
        const idx = r * COLS + c;
        const card = boardEl.children[idx];
        if (!card) return;
        card.classList.add('flipped');
        if (animate) {
            card.classList.add('reveal-anim');
            setTimeout(() => card.classList.remove('reveal-anim'), 350);
        }
    }

    function floodReveal(r, c) {
        const stack = [[r, c]];
        while (stack.length > 0) {
            const [cr, cc] = stack.pop();
            if (cr < 0 || cr >= ROWS || cc < 0 || cc >= COLS) continue;
            const cell = grid[cr][cc];
            if (cell.revealed || cell.flagged || cell.isMine) continue;
            revealCard(cr, cc);
            if (cell.number === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        stack.push([cr + dr, cc + dc]);
                    }
                }
            }
        }
    }

    function checkWin() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!grid[r][c].isMine && !grid[r][c].revealed) return false;
            }
        }
        return true;
    }

    function revealAllMines() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c].isMine) {
                    const idx = r * COLS + c;
                    const card = boardEl.children[idx];
                    card.classList.add('flipped');
                }
            }
        }
    }

    function handleFlip(r, c) {
        if (gameState !== 'playing') return;
        initAudio();
        const cell = grid[r][c];
        if (cell.flagged || cell.revealed) return;

        if (cell.isMine) {
            // Lost!
            gameState = 'lost';
            clearInterval(timerInterval);
            playMineSound();
            const idx = r * COLS + c;
            const card = boardEl.children[idx];
            card.classList.add('flipped');
            card.querySelector('.card-inner').classList.add('shake');
            revealAllMines();
            statusEl.textContent = '💥 Boom! You hit a mine!';
            statusEl.className = 'lose';
        } else {
            playFlipSound();
            floodReveal(r, c);
            if (checkWin()) {
                gameState = 'won';
                clearInterval(timerInterval);
                playWinSound();
                // Flag all mines
                for (let rr = 0; rr < ROWS; rr++) {
                    for (let cc = 0; cc < COLS; cc++) {
                        if (grid[rr][cc].isMine) {
                            const idx = rr * COLS + cc;
                            boardEl.children[idx].classList.add('flagged');
                        }
                    }
                }
                statusEl.textContent = '🎉 You cleared the board!';
                statusEl.className = 'win';
            }
        }
    }

    function handleFlag(r, c) {
        if (gameState !== 'playing') return;
        initAudio();
        const cell = grid[r][c];
        if (cell.revealed) return;
        const idx = r * COLS + c;
        const card = boardEl.children[idx];
        if (cell.flagged) {
            cell.flagged = false;
            card.classList.remove('flagged');
            flagCount--;
        } else {
            cell.flagged = true;
            card.classList.add('flagged');
            flagCount++;
        }
        flagEl.textContent = flagCount;
    }

    function startGame() {
        initAudio();
        createGrid();
        renderBoard();
        sizeCards();
        gameState = 'playing';
        seconds = 0;
        flagCount = 0;
        timerEl.textContent = '0';
        flagEl.textContent = '0';
        statusEl.textContent = '';
        statusEl.className = '';
        startScreen.style.display = 'none';
        hudEl.style.display = 'flex';
        restartBtn.style.display = 'inline-block';

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gameState === 'playing') {
                seconds++;
                timerEl.textContent = seconds;
            }
        }, 1000);
    }

    // Event listeners
    boardEl.addEventListener('click', (e) => {
        const card = e.target.closest('.card');
        if (!card) return;
        const r = parseInt(card.dataset.r);
        const c = parseInt(card.dataset.c);
        handleFlip(r, c);
    });

    boardEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const card = e.target.closest('.card');
        if (!card) return;
        const r = parseInt(card.dataset.r);
        const c = parseInt(card.dataset.c);
        handleFlag(r, c);
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
            startGame();
        }
    });

    document.getElementById('start-btn').addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    window.addEventListener('resize', sizeCards);
    sizeCards();
})();
</script>
</body>
</html>
