<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Clicker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }
#app { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* Start Screen */
#startScreen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
#startScreen h1 { font-size: clamp(2rem, 5vw, 4rem); color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 20px; }
#startScreen p { font-size: clamp(0.9rem, 2vw, 1.2rem); color: #a0c4ff; margin: 8px 0; text-align: center; max-width: 500px; line-height: 1.6; }
#startBtn { margin-top: 30px; padding: 15px 50px; font-size: 1.3rem; background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; transition: transform 0.2s, box-shadow 0.2s; }
#startBtn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,215,0,0.4); }

/* Game Layout */
#gameUI { display: none; width: 100%; height: 100%; flex-direction: row; gap: 10px; padding: 10px; }
#leftPanel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 200px; }
#rightPanel { flex: 1; max-height: 100%; overflow-y: auto; padding-right: 5px; }
#rightPanel::-webkit-scrollbar { width: 6px; }
#rightPanel::-webkit-scrollbar-track { background: #1a1a2e; }
#rightPanel::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 3px; }

/* Stats */
#stats { text-align: center; margin-bottom: 15px; }
#coinDisplay { font-size: clamp(1.5rem, 4vw, 2.5rem); color: #ffd700; font-weight: bold; }
#cpsDisplay { font-size: clamp(0.8rem, 2vw, 1rem); color: #a0c4ff; margin-top: 5px; }

/* Click Area */
#clickArea { position: relative; width: clamp(120px, 25vw, 200px); height: clamp(120px, 25vw, 200px); display: flex; align-items: center; justify-content: center; }
#clickCard { width: 90%; height: 90%; background: linear-gradient(135deg, #ffd700, #ff8c00); border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: clamp(3rem, 8vw, 5rem); user-select: none; transition: transform 0.1s; box-shadow: 0 4px 20px rgba(255,215,0,0.3); }
#clickCard:active { transform: scale(0.95); }
#clickLabel { position: absolute; bottom: -25px; font-size: 0.8rem; color: #a0c4ff; }

/* Floating text */
.float-text { position: absolute; pointer-events: none; font-weight: bold; font-size: 1.2rem; color: #ffd700; animation: floatUp 1s ease-out forwards; z-index: 50; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }

/* Shop */
#shopTitle { font-size: 1.2rem; color: #ffd700; margin-bottom: 10px; text-align: center; }
.card-item { background: linear-gradient(135deg, #16213e, #1a1a2e); border: 2px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s; display: flex; align-items: center; gap: 12px; }
.card-item:hover { transform: translateX(4px); border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.2); }
.card-item.cannot-afford { opacity: 0.5; cursor: not-allowed; }
.card-item.cannot-afford:hover { transform: none; border-color: #333; box-shadow: none; }
.card-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #ffd700, #ff8c00); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
.card-info { flex: 1; }
.card-name { font-weight: bold; font-size: 0.95rem; color: #fff; }
.card-desc { font-size: 0.75rem; color: #a0c4ff; margin-top: 2px; }
.card-cost { font-size: 0.85rem; color: #ffd700; font-weight: bold; white-space: nowrap; }
.card-level { background: #ffd700; color: #1a1a2e; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

/* Restart */
#restartBtn { position: fixed; top: 10px; right: 10px; padding: 8px 16px; background: rgba(255,255,255,0.1); border: 1px solid #ffd700; color: #ffd700; border-radius: 8px; cursor: pointer; font-size: 0.85rem; z-index: 50; transition: background 0.2s; }
#restartBtn:hover { background: rgba(255,215,0,0.2); }

/* Milestone flash */
.milestone { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.8); animation: milestoneAnim 1.5s ease-out forwards; z-index: 200; pointer-events: none; }
@keyframes milestoneAnim { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }

/* Responsive */
@media (max-width: 600px) {
  #gameUI { flex-direction: column; padding: 5px; }
  #leftPanel { min-height: 200px; }
  #rightPanel { max-height: calc(100vh - 220px); }
}
</style>
</head>
<body>
<div id="app">
  <div id="startScreen">
    <h1>🃏 Card Clicker</h1>
    <p>Click the golden card to earn coins.<br>Spend coins on power cards to boost your income.<br>The more you click, the more you earn!</p>
    <button id="startBtn">▶ Start Game</button>
  </div>

  <div id="gameUI">
    <div id="leftPanel">
      <div id="stats">
        <div id="coinDisplay">0</div>
        <div id="cpsDisplay">+0 /sec | +1 per click</div>
      </div>
      <div id="clickArea">
        <div id="clickCard">🃏</div>
        <div id="clickLabel">Click me!</div>
      </div>
    </div>
    <div id="rightPanel">
      <div id="shopTitle">🛒 Card Shop</div>
      <div id="shopList"></div>
    </div>
  </div>

  <button id="restartBtn" style="display:none;">↻ Restart</button>
</div>

<script>
(function() {
  // Audio
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  function playClickSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.1);
  }
  function playBuySound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.35);
  }

  // Game State
  let state = {
    coins: 0,
    totalClicks: 0,
    clickPower: 1,
    multipliers: [],
    cards: []
  };

  const cardDefs = [
    { id: 'auto_tap', name: 'Auto Tap', icon: '👆', desc: '+1 coin/sec per level', baseCost: 10, costMult: 1.5, type: 'passive', value: 1 },
    { id: 'golden_finger', name: 'Golden Finger', icon: '✨', desc: '+5 coins/sec per level', baseCost: 50, costMult: 1.6, type: 'passive', value: 5 },
    { id: 'coin_machine', name: 'Coin Machine', icon: '🎰', desc: '+25 coins/sec per level', baseCost: 250, costMult: 1.7, type: 'passive', value: 25 },
    { id: 'bank_branch', name: 'Bank Branch', icon: '🏦', desc: '+100 coins/sec per level', baseCost: 1000, costMult: 1.8, type: 'passive', value: 100 },
    { id: 'dragon_hoard', name: 'Dragon Hoard', icon: '🐉', desc: '+500 coins/sec per level', baseCost: 5000, costMult: 1.9, type: 'passive', value: 500 },
    { id: 'lucky_clover', name: 'Lucky Clover', icon: '🍀', desc: 'x2 click power per level', baseCost: 100, costMult: 3, type: 'click_mult', value: 2 },
    { id: 'power_ring', name: 'Power Ring', icon: '💍', desc: 'x2 ALL income per level', baseCost: 500, costMult: 4, type: 'global_mult', value: 2 },
  ];

  function getCardCost(def, level) {
    return Math.floor(def.baseCost * Math.pow(def.costMult, level));
  }

  function getCPS() {
    let cps = 0;
    for (const def of cardDefs) {
      if (def.type === 'passive') {
        const lvl = state.cards[def.id] || 0;
        cps += def.value * lvl;
      }
    }
    return Math.floor(cps * getGlobalMult());
  }

  function getClickPower() {
    let power = 1;
    for (const def of cardDefs) {
      if (def.type === 'click_mult') {
        const lvl = state.cards[def.id] || 0;
        power *= Math.pow(def.value, lvl);
      }
    }
    return Math.floor(power * getGlobalMult());
  }

  function getGlobalMult() {
    let mult = 1;
    for (const def of cardDefs) {
      if (def.type === 'global_mult') {
        const lvl = state.cards[def.id] || 0;
        mult *= Math.pow(def.value, lvl);
      }
    }
    return mult;
  }

  // DOM
  const startScreen = document.getElementById('startScreen');
  const gameUI = document.getElementById('gameUI');
  const startBtn = document.getElementById('startBtn');
  const clickCard = document.getElementById('clickCard');
  const coinDisplay = document.getElementById('coinDisplay');
  const cpsDisplay = document.getElementById('cpsDisplay');
  const shopList = document.getElementById('shopList');
  const restartBtn = document.getElementById('restartBtn');
  const clickArea = document.getElementById('clickArea');

  function formatNum(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.floor(n).toString();
  }

  function renderShop() {
    shopList.innerHTML = '';
    for (const def of cardDefs) {
      const lvl = state.cards[def.id] || 0;
      const cost = getCardCost(def, lvl);
      const canAfford = state.coins >= cost;
      const el = document.createElement('div');
      el.className = 'card-item' + (canAfford ? '' : ' cannot-afford');
      el.innerHTML = `
        <div class="card-icon">${def.icon}</div>
        <div class="card-info">
          <div class="card-name">${def.name} <span class="card-level">Lv.${lvl}</span></div>
          <div class="card-desc">${def.desc}</div>
        </div>
        <div class="card-cost">🪙 ${formatNum(cost)}</div>
      `;
      if (canAfford) {
        el.addEventListener('click', () => buyCard(def));
      }
      shopList.appendChild(el);
    }
  }

  function updateDisplay() {
    coinDisplay.textContent = '🪙 ' + formatNum(state.coins);
    cpsDisplay.textContent = `+${formatNum(getCPS())} /sec | +${formatNum(getClickPower())} per click`;
  }

  function buyCard(def) {
    const lvl = state.cards[def.id] || 0;
    const cost = getCardCost(def, lvl);
    if (state.coins >= cost) {
      state.coins -= cost;
      state.cards[def.id] = lvl + 1;
      playBuySound();
      renderShop();
      updateDisplay();
    }
  }

  function handleClick(e) {
    if (!audioCtx) initAudio();
    playClickSound();
    const power = getClickPower();
    state.coins += power;
    state.totalClicks++;

    // Float text
    const ft = document.createElement('div');
    ft.className = 'float-text';
    ft.textContent = '+' + formatNum(power);
    const rect = clickArea.getBoundingClientRect();
    ft.style.left = (e.clientX - rect.left) + 'px';
    ft.style.top = (e.clientY - rect.top - 10) + 'px';
    clickArea.appendChild(ft);
    setTimeout(() => ft.remove(), 1000);

    updateDisplay();
    renderShop();
  }

  // Game loop
  let lastTime = 0;
  let gameRunning = false;
  function gameLoop(timestamp) {
    if (!gameRunning) return;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt < 0.5) { // avoid huge jumps on tab switch
      state.coins += getCPS() * dt;
    }
    updateDisplay();
    requestAnimationFrame(gameLoop);
  }

  let shopTimer = null;
  function startShopUpdate() {
    shopTimer = setInterval(renderShop, 500);
  }

  // Milestones
  const milestones = [100, 1000, 10000, 100000, 1e6, 1e9];
  let milestoneIdx = 0;
  function checkMilestone() {
    if (milestoneIdx < milestones.length && state.coins >= milestones[milestoneIdx]) {
      const ms = document.createElement('div');
      ms.className = 'milestone';
      ms.textContent = '🎉 ' + formatNum(milestones[milestoneIdx]) + ' coins!';
      document.body.appendChild(ms);
      setTimeout(() => ms.remove(), 1500);
      milestoneIdx++;
    }
  }

  // Save/Load
  function save() {
    try {
      localStorage.setItem('cardClickerSave', JSON.stringify(state));
    } catch(e) {}
  }

  function load() {
    try {
      const s = localStorage.getItem('cardClickerSave');
      if (s) {
        const parsed = JSON.parse(s);
        state.coins = parsed.coins || 0;
        state.totalClicks = parsed.totalClicks || 0;
        state.cards = parsed.cards || {};
      }
    } catch(e) {}
  }

  // Start / Restart
  function startGame() {
    startScreen.style.display = 'none';
    gameUI.style.display = 'flex';
    restartBtn.style.display = 'block';
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
    startShopUpdate();
    renderShop();
    updateDisplay();
    setInterval(save, 5000);
    setInterval(checkMilestone, 1000);
  }

  function restart() {
    gameRunning = false;
    if (shopTimer) clearInterval(shopTimer);
    try { localStorage.removeItem('cardClickerSave'); } catch(e) {}
    state = { coins: 0, totalClicks: 0, clickPower: 1, multipliers: [], cards: {} };
    milestoneIdx = 0;
    renderShop();
    updateDisplay();
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
    startShopUpdate();
  }

  startBtn.addEventListener('click', () => {
    initAudio();
    load();
    startGame();
  });

  restartBtn.addEventListener('click', restart);

  clickCard.addEventListener('click', handleClick);

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (startScreen.style.display !== 'none') {
        initAudio();
        load();
        startGame();
      } else if (gameRunning) {
        const fakeEvent = { clientX: clickArea.getBoundingClientRect().left + 80, clientY: clickArea.getBoundingClientRect().top + 80 };
        handleClick(fakeEvent);
      }
    }
    if (e.code === 'KeyR' && gameRunning) {
      restart();
    }
  });

  // Prevent space scrolling
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') e.preventDefault();
  });

})();
</script>
</body>
</html>
