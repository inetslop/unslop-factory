<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frog Pad Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f1923; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 9, ROWS = 10;
let cellSize, offsetX, offsetY;
let gameState = 'start';
let player = {x:4, y:7};
let pads = [];
let targets = [[1,0],[3,0],[7,0]];
let walls = [[1,1],[7,1],[1,5],[7,5]];
let carLanes = [3, 6];
let cars = [];
let lives = 3;
let deadTimer = 0;
let frame = 0;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function beep(freq, dur, type, vol) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol||0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}

function initLevel() {
    player = {x:4, y:7};
    pads = [{x:2,y:2},{x:3,y:4},{x:5,y:4}];
    cars = [];
    for(let i=0;i<3;i++) cars.push({x:i*4-1, y:3, dir:1});
    for(let i=0;i<3;i++) cars.push({x:8-i*4+1, y:6, dir:-1});
}

function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w; canvas.height = h;
    cellSize = Math.floor(Math.min(w/(COLS+2), h/(ROWS+3)));
    offsetX = Math.floor((w - COLS*cellSize)/2);
    offsetY = Math.floor((h - ROWS*cellSize)/2) + cellSize;
}
window.addEventListener('resize', resize);
resize();

function isWall(x,y){ return walls.some(w=>w[0]===x&&w[1]===y); }
function getPadAt(x,y){ return pads.find(p=>p.x===x&&p.y===y); }
function isTarget(x,y){ return targets.some(t=>t[0]===x&&t[1]===y); }
function isCarLane(y){ return carLanes.includes(y); }
function carAt(x,y){ return cars.find(c=>Math.floor(c.x)===x&&c.y===y); }

function movePlayer(dx,dy) {
    const nx=player.x+dx, ny=player.y+dy;
    if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return;
    if(isWall(nx,ny)) return;
    const pad=getPadAt(nx,ny);
    if(pad){
        const px=nx+dx, py=ny+dy;
        if(px<0||px>=COLS||py<0||py>=ROWS) return;
        if(isWall(px,py)) return;
        if(getPadAt(px,py)) return;
        pad.x=px; pad.y=py;
        beep(220,0.08,'triangle');
    }
    player.x=nx; player.y=ny;
    if(isCarLane(ny)&&carAt(nx,ny)){ killPlayer(); return; }
    if(pads.every(p=>isTarget(p.x,p.y))){ gameState='win'; beep(600,0.2,'sine',0.12); beep(800,0.3,'sine',0.1); }
}

function killPlayer() {
    gameState='dead'; deadTimer=50;
    beep(100,0.4,'sawtooth');
    lives--;
}

function updateCars(){
    cars.forEach(c=>{
        c.x+=c.dir*0.25;
        if(c.dir===1&&c.x>=COLS+1) c.x=-1.5;
        if(c.dir===-1&&c.x<=-2) c.x=COLS+0.5;
    });
}

function drawFrog(px,py,s){
    ctx.fillStyle='#48bb78';
    ctx.beginPath(); ctx.arc(px+s/2,py+s/2,s*0.38,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(px+s*0.35,py+s*0.35,s*0.12,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px+s*0.65,py+s*0.35,s*0.12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath(); ctx.arc(px+s*0.37,py+s*0.37,s*0.06,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px+s*0.67,py+s*0.37,s*0.06,0,Math.PI*2); ctx.fill();
}

function draw(){
    ctx.fillStyle='#0f1923'; ctx.fillRect(0,0,canvas.width,canvas.height);
    
    if(gameState==='start'){
        const cx=canvas.width/2, cy=canvas.height/2;
        const fs=Math.min(cellSize*1.1,42);
        drawFrog(cx-cellSize*0.5,cy-cellSize*3.5,cellSize*1.2);
        ctx.fillStyle='#48bb78'; ctx.font=`bold ${fs}px monospace`; ctx.textAlign='center';
        ctx.fillText('FROG PAD PUZZLE',cx,cy-cellSize*1.8);
        ctx.fillStyle='#e2e8f0'; ctx.font=`${Math.floor(cellSize*0.4)}px monospace`;
        const lines=['Push lily pads onto yellow targets!','','←↑↓→ Arrow Keys: Move & Push','Avoid cars on the gray lanes!','You have 3 lives.','','Press SPACE to Start'];
        lines.forEach((l,i)=>ctx.fillText(l,cx,cy-cellSize+i*cellSize*0.55));
        return;
    }

    // Grid
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
        const cx=offsetX+x*cellSize, cy=offsetY+y*cellSize;
        ctx.fillStyle=isCarLane(y)?'#2d3748':((x+y)%2===0?'#1a3a2a':'#1e3b2f');
        ctx.fillRect(cx,cy,cellSize,cellSize);
    }

    // Car lane stripes
    carLanes.forEach(ry=>{
        const cy=offsetY+ry*cellSize;
        ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=2;
        for(let x=0;x<COLS;x++){
            ctx.beginPath();
            ctx.moveTo(offsetX+x*cellSize+offsetX*0,cy+cellSize/2);
            ctx.lineTo(offsetX+(x+1)*cellSize,cy+cellSize/2);
            ctx.stroke();
        }
    });

    // Targets
    targets.forEach(([tx,ty])=>{
        const cx=offsetX+tx*cellSize+cellSize/2, cy=offsetY+ty*cellSize+cellSize/2;
        const pulse=Math.sin(frame*0.08)*0.15+0.85;
        ctx.fillStyle=`rgba(246,224,94,${pulse})`;
        ctx.beginPath(); ctx.arc(cx,cy,cellSize*0.3,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='rgba(246,224,94,0.5)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cx,cy,cellSize*0.38,0,Math.PI*2); ctx.stroke();
    });

    // Walls (trees)
    walls.forEach(([wx,wy])=>{
        const cx=offsetX+wx*cellSize, cy=offsetY+wy*cellSize;
        ctx.fillStyle='#4a5568'; ctx.fillRect(cx+3,cy+3,cellSize-6,cellSize-6);
        ctx.fillStyle='#276749';
        ctx.beginPath(); ctx.arc(cx+cellSize/2,cy+cellSize/2,cellSize*0.38,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#2f855a';
        ctx.beginPath(); ctx.arc(cx+cellSize*0.4,cy+cellSize*0.4,cellSize*0.2,0,Math.PI*2); ctx.fill();
    });

    // Cars
    cars.forEach(car=>{
        const ci=Math.floor(car.x);
        if(ci<0||ci>=COLS) return;
        const cx=offsetX+ci*cellSize, cy=offsetY+car.y*cellSize;
        ctx.fillStyle='#e53e3e';
        ctx.fillRect(cx+2,cy+cellSize*0.2,cellSize-4,cellSize*0.6);
        ctx.fillStyle='#90cdf4';
        ctx.fillRect(cx+cellSize*0.15,cy+cellSize*0.28,cellSize*0.7,cellSize*0.18);
        // Wheels
        ctx.fillStyle='#1a1a2e';
        ctx.fillRect(cx+cellSize*0.1,cy+cellSize*0.65,cellSize*0.15,cellSize*0.15);
        ctx.fillRect(cx+cellSize*0.75,cy+cellSize*0.65,cellSize*0.15,cellSize*0.15);
    });

    // Pads
    pads.forEach(pad=>{
        const cx=offsetX+pad.x*cellSize+cellSize/2, cy=offsetY+pad.y*cellSize+cellSize/2;
        ctx.fillStyle='#38a169';
        ctx.beginPath(); ctx.arc(cx,cy,cellSize*0.4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#276749'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-cellSize*0.2,cy-cellSize*0.15); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+cellSize*0.18,cy-cellSize*0.22); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+cellSize*0.2,cy+cellSize*0.1); ctx.stroke();
        if(isTarget(pad.x,pad.y)){
            ctx.strokeStyle='#f6e05e'; ctx.lineWidth=3;
            ctx.beginPath(); ctx.arc(cx,cy,cellSize*0.44,0,Math.PI*2); ctx.stroke();
        }
    });

    // Player
    if(gameState!=='dead'||deadTimer%12<7){
        drawFrog(offsetX+player.x*cellSize,offsetY+player.y*cellSize,cellSize);
    }

    // HUD
    const hfs=Math.floor(cellSize*0.4);
    ctx.fillStyle='#fff'; ctx.font=`${hfs}px monospace`; ctx.textAlign='left';
    ctx.fillText(`♥ ${lives}`,offsetX,offsetY-cellSize*0.5);
    ctx.textAlign='right';
    const done=pads.filter(p=>isTarget(p.x,p.y)).length;
    ctx.fillText(`Pads: ${done}/${pads.length}`,offsetX+COLS*cellSize,offsetY-cellSize*0.5);

    // Overlays
    if(gameState==='dead'){
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#e53e3e'; ctx.font=`bold ${cellSize}px monospace`; ctx.textAlign='center';
        ctx.fillText('SPLAT!',canvas.width/2,canvas.height/2);
    }
    if(gameState==='win'){
        ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#48bb78'; ctx.font=`bold ${cellSize}px monospace`; ctx.textAlign='center';
        ctx.fillText('LEVEL COMPLETE!',canvas.width/2,canvas.height/2);
        ctx.font=`${hfs}px monospace`; ctx.fillStyle='#fff';
        ctx.fillText('Press R to play again',canvas.width/2,canvas.height/2+cellSize*1.2);
    }
    if(gameState==='gameover'){
        ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#e53e3e'; ctx.font=`bold ${cellSize}px monospace`; ctx.textAlign='center';
        ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2);
        ctx.font=`${hfs}px monospace`; ctx.fillStyle='#fff';
        ctx.fillText('Press R to restart',canvas.width/2,canvas.height/2+cellSize*1.2);
    }
}

function loop(){
    frame++;
    if(gameState==='playing'){
        updateCars();
        if(isCarLane(player.y)&&carAt(player.x,player.y)) killPlayer();
    } else if(gameState==='dead'){
        deadTimer--;
        if(deadTimer<=0){
            if(lives>0){ player.x=4; player.y=7; gameState='playing'; }
            else gameState='gameover';
        }
    }
    draw();
    requestAnimationFrame(loop);
}

function startGame(){ initLevel(); lives=3; gameState='playing'; }

window.addEventListener('keydown',e=>{
    if(!audioCtx) initAudio();
    e.preventDefault();
    if(gameState==='start'){
        if(e.code==='Space'||e.code==='Enter') startGame();
        return;
    }
    if(gameState==='win'||gameState==='gameover'){
        if(e.code==='KeyR') startGame();
        return;
    }
    if(gameState!=='playing') return;
    switch(e.code){
        case'ArrowUp': movePlayer(0,-1); break;
        case'ArrowDown': movePlayer(0,1); break;
        case'ArrowLeft': movePlayer(-1,0); break;
        case'ArrowRight': movePlayer(1,0); break;
    }
});

initLevel();
loop();
</script>
</body>
</html>
