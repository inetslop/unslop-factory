<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mine Hopper - Platformer Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, TILE, COLS, ROWS;
let gameState = 'start'; // start, playing, dead, win, gameover
let level = 1;
let lives = 3;
let score = 0;
let deathTimer = 0;
let winTimer = 0;

const GRID_COLS = 28;
const GRID_ROWS = 14;

let grid = [];
let player = { x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0, onGround: false };
let cameraX = 0;
let particles = [];
let keys = {};

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    TILE = Math.min(Math.floor(W / (GRID_COLS + 2)), Math.floor(H / (GRID_ROWS + 3)));
}
window.addEventListener('resize', resize);
resize();

function initLevel() {
    grid = [];
    for (let r = 0; r < GRID_ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < GRID_COLS; c++) {
            grid[r][c] = { type: 'air', mine: false, revealed: false, count: 0 };
        }
    }

    // Generate terrain - ground at bottom with some elevation
    let groundHeight = [];
    for (let c = 0; c < GRID_COLS; c++) {
        if (c < 3) groundHeight.push(1);
        else if (c < 6) groundHeight.push(2);
        else if (c < 9) groundHeight.push(3);
        else if (c < 12) groundHeight.push(2);
        else if (c < 15) groundHeight.push(4);
        else if (c < 18) groundHeight.push(3);
        else if (c < 21) groundHeight.push(2);
        else if (c < 24) groundHeight.push(3);
        else groundHeight.push(2);
    }

    // Add some variation based on level
    for (let c = 0; c < GRID_COLS; c++) {
        let h = groundHeight[c];
        if (level > 1 && Math.random() < 0.3) h += Math.floor(Math.random() * 2);
        // Create some gaps
        if (c > 5 && c < GRID_COLS - 4 && Math.random() < 0.15 + level * 0.03) {
            for (let r = 0; r < GRID_ROWS; r++) grid[r][c] = { type: 'air', mine: false, revealed: false, count: 0 };
            continue;
        }
        for (let r = 0; r < GRID_ROWS; r++) {
            if (r >= GRID_ROWS - h) {
                grid[r][c] = { type: 'ground', mine: false, revealed: false, count: 0 };
            } else {
                grid[r][c] = { type: 'air', mine: false, revealed: false, count: 0 };
            }
        }
    }

    // Ensure start area is safe and flat
    for (let c = 0; c < 3; c++) {
        for (let r = GRID_ROWS - 2; r < GRID_ROWS; r++) {
            grid[r][c] = { type: 'ground', mine: false, revealed: false, count: 0 };
        }
    }

    // Ensure end area has ground
    for (let c = GRID_COLS - 3; c < GRID_COLS; c++) {
        for (let r = GRID_ROWS - 2; r < GRID_ROWS; r++) {
            grid[r][c] = { type: 'ground', mine: false, revealed: false, count: 0 };
        }
    }

    // Place mines on ground tiles (not near start)
    let mineCount = Math.min(8 + level * 3, 25);
    let placed = 0;
    let attempts = 0;
    while (placed < mineCount && attempts < 500) {
        attempts++;
        let c = Math.floor(Math.random() * (GRID_COLS - 5)) + 4;
        let r = Math.floor(Math.random() * GRID_ROWS);
        if (grid[r][c].type === 'ground' && !grid[r][c].mine) {
            grid[r][c].mine = true;
            placed++;
        }
    }

    // Calculate counts for all ground tiles
    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            if (grid[r][c].type === 'ground') {
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) {
                            if (grid[nr][nc].mine) count++;
                        }
                    }
                }
                grid[r][c].count = count;
            }
        }
    }

    // Initialize player
    player.x = 1.5 * TILE;
    player.y = (GRID_ROWS - 2) * TILE;
    player.vx = 0;
    player.vy = 0;
    player.w = TILE * 0.7;
    player.h = TILE * 0.8;
    player.onGround = false;

    particles = [];
}

function startGame() {
    level = 1;
    lives = 3;
    score = 0;
    initLevel();
    gameState = 'playing';
}

function nextLevel() {
    level++;
    initLevel();
    gameState = 'playing';
}

// Audio
let audioCtx = null;
function playSound(type) {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'boom') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'flag') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }
}

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') e.preventDefault();

    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    } else if (gameState === 'playing' && e.code === 'KeyR') {
        initLevel();
    } else if ((gameState === 'dead' || gameState === 'win' || gameState === 'gameover') && (e.code === 'Space' || e.code === 'Enter')) {
        if (gameState === 'gameover') {
            startGame();
        } else if (gameState === 'win') {
            nextLevel();
        } else if (lives > 0) {
            initLevel();
            gameState = 'playing';
        } else {
            gameState = 'gameover';
        }
    }

    if (!audioCtx && (e.code === 'Space' || e.code === 'Enter')) {
        audioCtx = new (window.AudioContext || webkitAudioContext)();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 2 + Math.random() * 5;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            life: 1,
            color: color,
            size: 3 + Math.random() * 5
        });
    }
}

function update() {
    if (gameState !== 'playing') return;

    // Player physics
    const GRAVITY = 0.6;
    const JUMP_FORCE = -11;
    const MOVE_SPEED = 4;
    const FRICTION = 0.85;

    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx -= MOVE_SPEED * 0.4;
    }
    if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx += MOVE_SPEED * 0.4;
    }
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        playSound('jump');
    }

    player.vx *= FRICTION;
    player.vy += GRAVITY;

    if (player.vx > 7) player.vx = 7;
    if (player.vx < -7) player.vx = -7;
    if (player.vy > 15) player.vy = 15;

    // Move X
    player.x += player.vx;
    resolveCollisionX();

    // Move Y
    player.y += player.vy;
    player.onGround = false;
    resolveCollisionY();

    // Clamp to grid bounds
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x > (GRID_COLS - 1) * TILE) { player.x = (GRID_COLS - 1) * TILE; player.vx = 0; }

    // Fall death
    if (player.y > GRID_ROWS * TILE + TILE) {
        killPlayer();
        return;
    }

    // Check mine under player
    let pc = Math.floor((player.x + player.w / 2) / TILE);
    let pr = Math.floor((player.y + player.h - 5) / TILE);
    if (pc >= 0 && pc < GRID_COLS && pr >= 0 && pr < GRID_ROWS) {
        if (grid[pr][pc].type === 'ground' && grid[pr][pc].mine) {
            killPlayer();
            return;
        }
    }

    // Reveal tiles near player
    let revealRange = 3;
    for (let r = Math.max(0, pr - revealRange); r <= Math.min(GRID_ROWS - 1, pr + revealRange); r++) {
        for (let c = Math.max(0, pc - revealRange); c <= Math.min(GRID_COLS - 1, pc + revealRange); c++) {
            if (grid[r][c].type === 'ground' && !grid[r][c].revealed) {
                grid[r][c].revealed = true;
            }
        }
    }

    // Check win - reach the flag (rightmost columns, on ground)
    let targetC = GRID_COLS - 2;
    if (pc >= targetC && grid[pr][pc].type === 'ground') {
        score += 100 * level;
        playSound('win');
        gameState = 'win';
        winTimer = 0;
    }

    // Camera
    let targetCamX = player.x - W / 3;
    cameraX += (targetCamX - cameraX) * 0.1;
    if (cameraX < 0) cameraX = 0;
    let maxCam = GRID_COLS * TILE - W;
    if (cameraX > maxCam) cameraX = Math.max(0, maxCam);

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].vy += 0.3;
        particles[i].life -= 0.02;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function resolveCollisionX() {
    let left = Math.floor(player.x / TILE);
    let right = Math.floor((player.x + player.w - 1) / TILE);
    let top = Math.floor(player.y / TILE);
    let bottom = Math.floor((player.y + player.h - 1) / TILE);

    for (let r = top; r <= bottom; r++) {
        if (left >= 0 && left < GRID_COLS && grid[r][left].type === 'ground') {
            // Check if solid
            let tileX = left * TILE;
            if (player.x + player.w > tileX && player.vx < 0) {
                player.x = tileX + player.w;
                player.vx = 0;
            }
        }
        if (right >= 0 && right < GRID_COLS && grid[r][right].type === 'ground') {
            let tileX = right * TILE;
            if (player.x < tileX && player.vx > 0) {
                player.x = tileX - player.w;
                player.vx = 0;
            }
        }
    }
}

function resolveCollisionY() {
    let left = Math.floor(player.x / TILE);
    let right = Math.floor((player.x + player.w - 1) / TILE);
    let top = Math.floor(player.y / TILE);
    let bottom = Math.floor((player.y + player.h - 1) / TILE);

    for (let c = left; c <= right; c++) {
        if (c >= 0 && c < GRID_COLS) {
            if (top >= 0 && top < GRID_ROWS && grid[top][c].type === 'ground') {
                let tileY = top * TILE;
                if (player.y + player.h > tileY && player.vy < 0) {
                    player.y = tileY + player.h;
                    player.vy = 0;
                }
            }
            if (bottom >= 0 && bottom < GRID_ROWS && grid[bottom][c].type === 'ground') {
                let tileY = bottom * TILE;
                if (player.y < tileY && player.vy > 0) {
                    player.y = tileY - player.h;
                    player.vy = 0;
                    player.onGround = true;
                }
            }
        }
    }
}

function killPlayer() {
    playSound('boom');
    lives--;
    let px = player.x + player.w / 2;
    let py = player.y + player.h / 2;
    spawnParticles(px, py, '#ff6b35', 30);
    spawnParticles(px, py, '#ffd700', 20);
    gameState = 'dead';
    deathTimer = 0;
}

function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    // Draw grid
    let offsetC = Math.floor(cameraX / TILE);
    let startC = Math.max(0, offsetC - 1);
    let endC = Math.min(GRID_COLS, Math.ceil((cameraX + W) / TILE) + 1);

    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = startC; c < endC; c++) {
            if (c >= GRID_COLS || r >= GRID_ROWS) continue;
            let x = c * TILE - cameraX;
            let y = r * TILE;
            let tile = grid[r][c];

            if (tile.type === 'ground') {
                // Ground color
                let topExposed = (r === 0 || grid[r-1][c].type !== 'ground');
                ctx.fillStyle = topExposed ? '#5a8f3c' : '#7a6b4a';
                ctx.fillRect(x, y, TILE, TILE);

                if (topExposed) {
                    ctx.fillStyle = '#4a7a2e';
                    ctx.fillRect(x, y, TILE, 4);
                }

                // Grid lines
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.strokeRect(x, y, TILE, TILE);

                // Revealed info
                if (tile.revealed && !tile.mine) {
                    if (topExposed && tile.count > 0) {
                        ctx.fillStyle = '#fff';
                        ctx.font = `bold ${TILE * 0.5}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(tile.count, x + TILE / 2, y + TILE / 2);

                        // Color based on danger
                        if (tile.count >= 3) {
                            ctx.fillStyle = '#ff4444';
                            ctx.font = `bold ${TILE * 0.5}px monospace`;
                            ctx.fillText(tile.count, x + TILE / 2, y + TILE / 2);
                        } else if (tile.count >= 1) {
                            ctx.fillStyle = '#ffaa33';
                            ctx.font = `bold ${TILE * 0.5}px monospace`;
                            ctx.fillText(tile.count, x + TILE / 2, y + TILE / 2);
                        }
                    }
                }

                // Mine indicator (only show after death for context)
                if (tile.mine && gameState === 'dead') {
                    ctx.fillStyle = '#ff0000';
                    ctx.font = `bold ${TILE * 0.6}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💣', x + TILE / 2, y + TILE / 2);
                }
            } else {
                // Air - subtle dots
                if (tile.revealed && tile.type === 'air') {
                    // nothing special
                }
            }
        }
    }

    // Draw flag at goal
    let flagC = GRID_COLS - 2;
    let flagR = GRID_ROWS - 1;
    for (let r = GRID_ROWS - 1; r >= 0; r--) {
        if (grid[r][flagC].type === 'ground') {
            flagR = r;
            break;
        }
    }
    let fx = flagC * TILE + TILE / 2 - cameraX;
    let fy = flagR * TILE;
    ctx.fillStyle = '#333';
    ctx.fillRect(fx - 2, fy - TILE, 4, TILE);
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.moveTo(fx + 2, fy - TILE);
    ctx.lineTo(fx + TILE * 0.6, fy - TILE + TILE * 0.3);
    ctx.lineTo(fx + 2, fy - TILE + TILE * 0.6);
    ctx.fill();

    // Draw player
    if (gameState === 'playing' || gameState === 'dead') {
        let px = player.x - cameraX;
        let py = player.y;
        ctx.fillStyle = '#4ecdc4';
        ctx.fillRect(px, py, player.w, player.h);
        // Eyes
        ctx.fillStyle = '#fff';
        let eyeY = py + player.h * 0.25;
        if (player.vx > 0.5) {
            ctx.fillRect(px + player.w * 0.6, eyeY, 5, 5);
        } else if (player.vx < -0.5) {
            ctx.fillRect(px + player.w * 0.2, eyeY, 5, 5);
        } else {
            ctx.fillRect(px + player.w * 0.3, eyeY, 4, 4);
            ctx.fillRect(px + player.w * 0.6, eyeY, 4, 4);
        }
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - cameraX, p.y, p.size * p.life, p.size * p.life);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(10, 10, 250, 80);
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Level: ${level}`, 20, 35);
    ctx.fillText(`Lives: ${'❤️'.repeat(lives)}${'🖤'.repeat(Math.max(0, 3 - lives))}`, 20, 55);
    ctx.fillText(`Score: ${score}`, 20, 75);

    // Overlays
    if (gameState === 'dead') {
        deathTimer++;
        ctx.fillStyle = `rgba(180, 30, 30, ${Math.min(deathTimer / 30, 0.4)})`;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('💥 BOOM! 💥', W / 2, H / 2 - 20);
        if (lives > 0) {
            ctx.font = '20px monospace';
            ctx.fillText(`Lives remaining: ${lives}`, W / 2, H / 2 + 30);
            ctx.fillText('Press SPACE to retry', W / 2, H / 2 + 65);
        } else {
            gameState = 'gameover';
        }
    }

    if (gameState === 'win') {
        winTimer++;
        ctx.fillStyle = `rgba(30, 180, 100, ${Math.min(winTimer / 30, 0.4)})`;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🚩 LEVEL COMPLETE!', W / 2, H / 2 - 20);
        ctx.font = '20px monospace';
        ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 30);
        ctx.fillText('Press SPACE for next level', W / 2, H / 2 + 65);
    }

    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 52px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 20);
        ctx.font = '18px monospace';
        ctx.fillText('Press SPACE to play again', W / 2, H / 2 + 60);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#4ecdc4';
    ctx.font = `bold ${Math.min(W/8, 64)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('MINE HOPPER', W / 2, H / 3);

    ctx.fillStyle = '#ff6b35';
    ctx.font = `${Math.min(W/16, 24)}px monospace`;
    ctx.fillText('Platformer Minesweeper', W / 2, H / 3 + 40);

    // Instructions box
    let boxY = H / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(W / 2 - 220, boxY - 20, 440, 180);

    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    let lines = [
        '🎮 CONTROLS:',
        '← → or A/D : Move',
        'SPACE / ↑ / W : Jump',
        'R : Restart level',
        '',
        '💣 Avoid hidden mines!',
        '📊 Numbers show nearby mine count',
        '🚩 Reach the flag to win!',
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, boxY + 15 + i * 24);
    });

    // Blinking start prompt
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('Press SPACE to Start', W / 2, H - 60);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
