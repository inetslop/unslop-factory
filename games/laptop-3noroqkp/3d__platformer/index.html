<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubic Climber</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0e1a;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:#eaf2ff;z-index:5;}
  .hidden{display:none;}
  h1{font-size:clamp(34px,7vw,86px);margin:0;letter-spacing:2px;
     background:linear-gradient(#fff,#9ecbff);-webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 0 30px rgba(120,180,255,.4);}
  .sub{margin-top:6px;font-size:clamp(13px,2.2vw,20px);color:#9fb4d8;letter-spacing:1px;}
  .panel{margin-top:22px;background:rgba(10,18,40,.72);border:1px solid rgba(120,170,255,.35);
    border-radius:16px;padding:18px 26px;box-shadow:0 0 40px rgba(60,120,255,.25);}
  .keys{font-size:clamp(13px,1.9vw,17px);line-height:1.9;color:#cfe0ff;}
  kbd{background:#1b2b4d;border:1px solid #3a5aa0;border-radius:6px;padding:2px 8px;font-size:.9em;color:#dceaff;}
  button{margin-top:18px;cursor:pointer;font-size:clamp(16px,2.4vw,22px);font-weight:700;letter-spacing:1px;
    color:#0a1226;background:linear-gradient(#8fd0ff,#5aa0ff);border:none;border-radius:12px;padding:12px 30px;
    box-shadow:0 6px 0 #2f6fd0, 0 0 24px rgba(90,160,255,.5);transition:transform .08s;}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #2f6fd0;}
  #hud{position:absolute;top:14px;left:14px;color:#dff;z-index:4;font-size:clamp(13px,2vw,18px);
    text-shadow:0 0 8px rgba(0,0,0,.7);}
  #win .big{font-size:clamp(40px,9vw,110px);background:linear-gradient(#fff,#ffd76a);-webkit-background-clip:text;background-clip:text;color:transparent;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden"></div>

  <div id="start" class="overlay">
    <h1>CUBIC CLIMBER</h1>
    <div class="sub">a 3D platformer — reach the golden summit</div>
    <div class="panel">
      <div class="keys">
        Move &nbsp; <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><br>
        Jump &nbsp;&nbsp; <kbd>SPACE</kbd><br>
        Restart &nbsp; <kbd>R</kbd>
      </div>
      <button id="play">START</button>
    </div>
  </div>

  <div id="win" class="overlay hidden">
    <div class="big">YOU SUMMITED!</div>
    <div class="sub">The golden platform is yours.</div>
    <button id="again">PLAY AGAIN</button>
  </div>
</div>

<script>
(function(){
"use strict";

// ---------- Canvas / sizing ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

// ---------- Audio (Web Audio API) ----------
let AC=null;
function initAudio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){AC=null;} } if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}} }
function beep(freq,dur,type,vol){
  if(!AC) return;
  const t=AC.currentTime;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
}
function sJump(){ beep(300,0.18,'square',0.18); }
function sLand(){ beep(140,0.12,'triangle',0.16); }
function sWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'triangle',0.2),i*90)); }

// ---------- Input ----------
const keys={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(state==='start' && (k===' '||k==='enter')) startGame();
  if(state==='win' && (k==='r'||k==='enter')) startGame();
  if(state==='playing' && k==='r') startGame();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });

// ---------- 3D math ----------
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vscale(a,s){return [a[0]*s,a[1]*s,a[2]*s];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}

// camera basis
let camPos=[0,0,0], camRight=[1,0,0], camUp=[0,1,0], camFwd=[0,0,1];
const NEAR=0.1;
function setCamera(pos,target){
  camPos=pos;
  const f=norm(vsub(target,pos));
  let up=[0,1,0];
  if(Math.abs(dot(f,up))>0.99) up=[0,0,-1];
  camFwd=f;
  camRight=norm(cross(f,up));
  camUp=cross(camRight,camFwd);
}
// project world point -> {x,y,z(view depth)} or null if behind
function proj(p){
  const v=vsub(p,camPos);
  let xv=dot(v,camRight), yv=dot(v,camUp), zv=dot(v,camFwd);
  if(zv<=NEAR) return null;
  const f=(H*0.95);
  return { x: W/2 + (xv/zv)*f, y: H/2 - (yv/zv)*f, z: zv };
}

// ---------- Scene / level ----------
// cubes: {cx,cy,cz,hx,hy,hz,col:[r,g,b]}
function cube(x,y,z,hx,hy,hz,r,g,b){return {cx:x,cy:y,cz:z,hx:hx,hy:hy,hz:hz,col:[r,g,b]};}

let world=[];
function buildWorld(){
  world=[];
  // ground (start base)
  world.push(cube(0, -1.2, 4, 6, 0.8, 7, 90,150,90));
  // stepping platforms climbing upward/forward (-z)
  const P=[
    [0,   0.3, -2.5],
    [-2.4,1.1, -6.0],
    [2.2, 2.0, -9.5],
    [0,   3.0,-13.0],
    [-2.8,4.0,-16.5],
    [2.6, 5.0,-20.0],
    [0,   6.0,-23.5],
    [-2.2,7.0,-27.0],
    [2.4, 8.0,-30.5],
    [0,   9.0,-34.0],
  ];
  P.forEach((p,i)=>{ world.push(cube(p[0],p[1],p[2],1.6,0.4,1.6, 80+i*6, 150, 230)); });
  // golden summit
  world.push(cube(0, 9.0, -38.0, 2.6,0.5,2.6, 255,210,70));
}

// goal test center
const GOAL={x:0,y:9.0,z:-38.0};

// ---------- Player ----------
let player;
function resetPlayer(){
  player={ x:0,y:0,z:4, vx:0,vy:0,vz:0, hx:0.45,hy:0.8,hz:0.45, onGround:false };
}

// AABB overlap
function overlap(a,b){
  return Math.abs(a.x-b.cx) < a.hx+b.hx &&
         Math.abs(a.y-b.cy) < a.hy+b.hy &&
         Math.abs(a.z-b.cz) < a.hz+b.hz;
}

let state='start';
const hud=document.getElementById('hud');
const startEl=document.getElementById('start');
const winEl=document.getElementById('win');

function startGame(){
  initAudio();
  buildWorld(); resetPlayer();
  state='playing';
  startEl.classList.add('hidden');
  winEl.classList.add('hidden');
  hud.classList.remove('hidden');
}
document.getElementById('play').addEventListener('click',startGame);
document.getElementById('again').addEventListener('click',startGame);

// ---------- Physics step ----------
const GRAV=-20, MOVE=5.2, JUMP=8.4;
let altitude=0, lastTime=performance.now();

function step(dt){
  // input direction (world axes): W/S = -z/+z, A/D = x
  let ix=0, iz=0;
  if(keys['a']||keys['arrowleft']) ix-=1;
  if(keys['d']||keys['arrowright']) ix+=1;
  if(keys['w']||keys['arrowup']) iz-=1;
  if(keys['s']||keys['arrowdown']) iz+=1;
  const len=Math.hypot(ix,iz); if(len>0){ix/=len;iz/=len;}
  player.vx=ix*MOVE; player.vz=iz*MOVE;

  // gravity
  player.vy += GRAV*dt;
  if(player.vy<-30) player.vy=-30;

  const wasAir = !player.onGround;
  if((keys[' ']) && player.onGround){ player.vy=JUMP; player.onGround=false; sJump(); }

  // move + collide per axis (AABB)
  function tryMove(axis,amt){
    const prev={x:player.x,y:player.y,z:player.z};
    if(axis==='x') player.x+=amt; else if(axis==='y') player.y+=amt; else player.z+=amt;
    for(const b of world){
      if(overlap(player,b)){
        if(axis==='x'){ player.x = (prev.x<b.cx)? b.cx-b.hx-player.hx : b.cx+b.hx+player.hx; }
        if(axis==='z'){ player.z = (prev.z<b.cz)? b.cz-b.hz-player.hz : b.cz+b.hz+player.hz; }
        if(axis==='y'){
          if(prev.y<=b.cy){ player.y=b.cy+b.hy+player.hy; player.vy=0; player.onGround=true; }
          else { player.y=b.cy-b.hy-player.hy; player.vy=0; }
        }
      }
    }
  }
  const ognd = player.onGround;
  player.onGround=false;
  tryMove('x',player.vx*dt);
  tryMove('z',player.vz*dt);
  tryMove('y',player.vy*dt);

  if(wasAir && player.onGround){ sLand(); }

  // fall off world -> respawn
  if(player.y < -12){ resetPlayer(); }

  altitude = Math.max(altitude, player.y);

  // win check
  const dx=player.x-GOAL.x, dz=player.z-GOAL.z;
  if(Math.abs(dx)<2.6 && Math.abs(dz)<2.6 && Math.abs(player.y-9.0)<1.4){
    state='win'; sWin();
    winEl.classList.remove('hidden');
  }

  // update HUD
  hud.innerHTML = 'ALTITUDE&nbsp; <b>'+altitude.toFixed(1)+'</b> &nbsp;|&nbsp; Z '+player.z.toFixed(0);
}

// ---------- Rendering ----------
const LIGHT=norm([-0.45,1,-0.35]);
function render(){
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1638'); g.addColorStop(0.5,'#173a6e'); g.addColorStop(1,'#2f6db0');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // camera behind player looking forward (-z)
  setCamera([player.x, player.y+1.05, player.z+3.4], [player.x, player.y+0.4, player.z-1]);

  const faces=[];
  for(const c of world){
    // 8 corners in world space
    const hx=c.hx,hy=c.hy,hz=c.hz;
    const P=[
      [c.cx-hx,c.cy-hy,c.cz-hz],[c.cx+hx,c.cy-hy,c.cz-hz],
      [c.cx+hx,c.cy+hy,c.cz-hz],[c.cx-hx,c.cy+hy,c.cz-hz],
      [c.cx-hx,c.cy-hy,c.cz+hz],[c.cx+hx,c.cy-hy,c.cz+hz],
      [c.cx+hx,c.cy+hy,c.cz+hz],[c.cx-hx,c.cy+hy,c.cz+hz]
    ];
    const defs=[
      {n:[0,0,-1],idx:[0,1,2,3]},
      {n:[0,0, 1],idx:[4,5,6,7]},
      {n:[-1,0,0],idx:[0,3,7,4]},
      {n:[ 1,0,0],idx:[1,5,6,2]},
      {n:[0,-1,0],idx:[0,4,5,1]},
      {n:[0, 1,0],idx:[3,7,6,2]}
    ];
    for(const d of defs){
      // face center + cull
      const fc=[ (d.n[0])*hx + c.cx, (d.n[1])*hy + c.cy, (d.n[2])*hz + c.cz ];
      const toCam=vsub(camPos,fc);
      if(dot(d.n,toCam)<=0) continue; // backface
      const pts=d.idx.map(i=>proj(P[i]));
      if(pts.some(p=>p===null)) continue;
      if(pts.some(p=>p.z<=NEAR)) continue;
      const zavg=(pts[0].z+pts[1].z+pts[2].z+pts[3].z)/4;
      // shading
      let br=Math.max(0,dot(d.n,LIGHT));
      br=0.35+br*0.75;
      const r=Math.min(255,c.col[0]*br), gg=Math.min(255,c.col[1]*br), b=Math.min(255,c.col[2]*br);
      faces.push({pts,z:zavg,fill:'rgb('+(r|0)+','+(gg|0)+','+(b|0)+')'});
    }
  }
  // painter's algorithm (far -> near)
  faces.sort((a,b)=>b.z-a.z);
  for(const f of faces){
    ctx.beginPath();
    ctx.moveTo(f.pts[0].x,f.pts[0].y);
    for(let i=1;i<4;i++) ctx.lineTo(f.pts[i].x,f.pts[i].y);
    ctx.closePath();
    ctx.fillStyle=f.fill; ctx.fill();
    ctx.strokeStyle='rgba(0,0,20,0.35)'; ctx.lineWidth=1; ctx.stroke();
  }

  // draw player as a little cube marker on top of its position
  drawPlayer();
}

function drawPlayer(){
  const hx=player.hx,hy=player.hy,hz=player.hz,cx=player.x,cy=player.y,cz=player.z;
  const P=[
    [cx-hx,cy-hy,cz-hz],[cx+hx,cy-hy,cz-hz],
    [cx+hx,cy+hy,cz-hz],[cx-hx,cy+hy,cz-hz],
    [cx-hx,cy-hy,cz+hz],[cx+hx,cy-hy,cz+hz],
    [cx+hx,cy+hy,cz+hz],[cx-hx,cy+hy,cz+hz]
  ];
  const defs=[
    {n:[0,0,-1],idx:[0,1,2,3]},{n:[0,0,1],idx:[4,5,6,7]},
    {n:[-1,0,0],idx:[0,3,7,4]},{n:[1,0,0],idx:[1,5,6,2]},
    {n:[0,-1,0],idx:[0,4,5,1]},{n:[0,1,0],idx:[3,7,6,2]}
  ];
  for(const d of defs){
    const fc=[d.n[0]*hx+cx,d.n[1]*hy+cy,d.n[2]*hz+cz];
    if(dot(d.n,vsub(camPos,fc))<=0) continue;
    const pts=d.idx.map(i=>proj(P[i]));
    if(pts.some(p=>!p||p.z<=NEAR)) continue;
    let br=Math.max(0,dot(d.n,LIGHT)); br=0.5+br*0.6;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<4;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.closePath();
    ctx.fillStyle='rgb('+(255*br|0)+','+(90*br+30|0)+','+(60*br+20|0)+')';
    ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.5)';ctx.stroke();
  }
}

// ---------- Main loop ----------
function frame(now){
  let dt=(now-lastTime)/1000; lastTime=now;
  if(dt>0.05) dt=0.05;
  if(state==='playing') step(dt);
  if(state!=='start') render(); else { renderIdle(); }
  requestAnimationFrame(frame);
}

function renderIdle(){
  // gentle idle camera orbit over a preview world
  buildWorld(); 
  const t=performance.now()/1000;
  player={x:0,y:0,z:4,vx:0,vy:0,vz:0,hx:0.45,hy:0.8,hz:0.45,onGround:true};
  setCamera([player.x+Math.sin(t)*2.2, player.y+1.6, player.z+3.4], [player.x,player.y+0.4,player.z-1]);
  render();
}

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
