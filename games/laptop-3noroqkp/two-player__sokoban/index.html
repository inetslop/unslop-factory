<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokoban Co-op</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, offsetX, offsetY;
let gameState = 'start'; // start, playing, won, gameover
let currentLevel = 0;
let moves = 0;
let boxes = [];
let targets = [];
let walls = [];
let players = [{x:0,y:0},{x:0,y:0}];
let gridW = 0, gridH = 0;
let winTimer = 0;
let particles = [];

const LEVELS = [
[
"#########",
"#   @   #",
"#  $    #",
"#  . A  #",
"#       #",
"#########"
],
[
"##########",
"#        #",
"# $   .  #",
"# @ A    #",
"# .   $  #",
"#        #",
"##########"
],
[
"##########",
"#        #",
"#  ##    #",
"#  $ .   #",
"#  @ A   #",
"#  $     #",
"#   .    #",
"#        #",
"##########"
],
[
"###########",
"#         #",
"#  $  $   #",
"#  @  A   #",
"#   . .   #",
"#         #",
"#    $    #",
"#    .    #",
"#         #",
"###########"
],
[
"###########",
"#         #",
"#  #####  #",
"#  $   .  #",
"#  @ A    #",
"#         #",
"#  $  .   #",
"#         #",
"###########"
]
];

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    calculateLayout();
}

function calculateLayout() {
    const maxW = W * 0.85;
    const maxH = H * 0.75;
    cellSize = Math.floor(Math.min(maxW / gridW, maxH / gridH));
    if (cellSize < 20) cellSize = 20;
    offsetX = Math.floor((W - gridW * cellSize) / 2);
    offsetY = Math.floor((H - gridH * cellSize) / 2);
}

function loadLevel(idx) {
    const lvl = LEVELS[idx];
    gridH = lvl.length;
    gridW = lvl[0].length;
    walls = [];
    targets = [];
    boxes = [];
    players = [{x:0,y:0},{x:0,y:0}];
    moves = 0;

    for (let r = 0; r < gridH; r++) {
        for (let c = 0; c < lvl[r].length; c++) {
            const ch = lvl[r][c];
            if (ch === '#') walls.push({x:c, y:r});
            if (ch === '.') targets.push({x:c, y:r});
            if (ch === '$') boxes.push({x:c, y:r});
            if (ch === '@') players[0] = {x:c, y:r};
            if (ch === 'A') players[1] = {x:c, y:r};
        }
    }
    calculateLayout();
}

function isWall(x, y) {
    return walls.some(w => w.x === x && w.y === y);
}

function hasBoxAt(x, y) {
    return boxes.findIndex(b => b.x === x && b.y === y);
}

function hasPlayerAt(x, y, idx) {
    for (let i = 0; i < 2; i++) {
        if (i !== idx && players[i].x === x && players[i].y === y) return true;
    }
    return false;
}

function isTargetAt(x, y) {
    return targets.some(t => t.x === x && t.y === y);
}

function tryMove(playerIdx, dx, dy) {
    const p = players[playerIdx];
    const nx = p.x + dx;
    const ny = p.y + dy;

    // Can't walk into wall or other player
    if (isWall(nx, ny)) return;
    if (hasPlayerAt(nx, ny, playerIdx)) return;

    const boxIdx = hasBoxAt(nx, ny);
    if (boxIdx !== -1) {
        // Try to push box
        const bx = nx + dx;
        const by = ny + dy;
        // Can't push into wall, another box, or a player
        if (isWall(bx, by)) return;
        if (hasBoxAt(bx, by) !== -1) return;
        if (players[0].x === bx && players[0].y === by) return;
        if (players[1].x === bx && players[1].y === by) return;
        // Push the box
        boxes[boxIdx].x = bx;
        boxes[boxIdx].y = by;
    }

    p.x = nx;
    p.y = ny;
    moves++;
    playMoveSound();
    checkWin();
}

function checkWin() {
    const allOnTargets = boxes.every(b => isTargetAt(b.x, b.y));
    if (allOnTargets) {
        gameState = 'won';
        winTimer = 0;
        spawnWinParticles();
        playWinSound();
    }
}

function isSolved() {
    return boxes.every(b => isTargetAt(b.x, b.y));
}

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playMoveSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 220;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function playPushSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.value = 150;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function playWinSound() {
    if (!audioCtx) return;
    const notes = [262, 330, 392, 523];
    notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.3);
        osc.start(audioCtx.currentTime + i * 0.12);
        osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
    });
}

function playStartSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

// Particles
function spawnWinParticles() {
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: W/2 + (Math.random()-0.5)*cellSize*gridW,
            y: H/2 + (Math.random()-0.5)*cellSize*gridH,
            vx: (Math.random()-0.5)*4,
            vy: (Math.random()-0.5)*4 - 2,
            life: 1,
            color: `hsl(${Math.random()*360}, 80%, 60%)`
        });
    }
}

function updateParticles() {
    for (let i = particles.length-1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].vy += 0.1;
        particles[i].life -= 0.015;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

// Rendering
function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    drawGrid();
    drawTargets();
    drawBoxes();
    drawPlayers();
    drawHUD();

    if (gameState === 'won') {
        updateParticles();
        drawParticles();
        drawWinScreen();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#e94560';
    ctx.font = `bold ${Math.min(W*0.08, 64)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('SOKOBAN CO-OP', W/2, H*0.2);

    // Subtitle
    ctx.fillStyle = '#a8b2d8';
    ctx.font = `${Math.min(W*0.03, 24)}px 'Segoe UI', sans-serif`;
    ctx.fillText('A Two-Player Puzzle Game', W/2, H*0.28);

    // Instructions
    const lineH = Math.min(H*0.05, 36);
    let y = H * 0.4;
    ctx.fillStyle = '#ccd6f6';
    ctx.font = `${Math.min(W*0.022, 18)}px 'Segoe UI', sans-serif`;

    const lines = [
        '🎮 Two players work together to push all boxes onto targets!',
        '',
        'Player 1 (Blue):  W / A / S / D',
        'Player 2 (Red):   ↑ / ↓ / ← / →',
        '',
        'Rules:',
        '• Push boxes onto green targets to win',
        '• You can push but NOT pull boxes',
        '• Boxes can\'t be pushed into walls or other boxes',
        '• Players can\'t walk through each other',
        '',
        'Press ENTER to Start!'
    ];

    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, y + i * lineH);
    });

    // Decorative boxes
    const boxSize = Math.min(W*0.04, 40);
    for (let i = 0; i < 5; i++) {
        const bx = W/2 - 100 + i * 50;
        const by = H * 0.85;
        ctx.fillStyle = '#e9c46a';
        ctx.fillRect(bx - boxSize/2, by - boxSize/2, boxSize, boxSize);
        ctx.strokeStyle = '#f4a261';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx - boxSize/2, by - boxSize/2, boxSize, boxSize);
    }
}

function drawGrid() {
    for (let r = 0; r < gridH; r++) {
        for (let c = 0; c < gridW; c++) {
            const x = offsetX + c * cellSize;
            const y = offsetY + r * cellSize;

            if (isWall(c, r)) {
                // Wall block with 3D effect
                ctx.fillStyle = '#2d3a5c';
                ctx.fillRect(x, y, cellSize, cellSize);
                ctx.fillStyle = '#415a8b';
                ctx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
                ctx.fillStyle = '#34497a';
                ctx.fillRect(x + 4, y + 4, cellSize - 8, cellSize - 8);
            } else {
                // Floor
                ctx.fillStyle = (r + c) % 2 === 0 ? '#1f2d50' : '#24335a';
                ctx.fillRect(x, y, cellSize, cellSize);
            }
        }
    }
}

function drawTargets() {
    targets.forEach(t => {
        const x = offsetX + t.x * cellSize + cellSize/2;
        const y = offsetY + t.y * cellSize + cellSize/2;
        const r = cellSize * 0.3;

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(46, 213, 115, 0.3)';
        ctx.fill();
        ctx.strokeStyle = '#2ed973';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Inner dot
        ctx.beginPath();
        ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(46, 213, 115, 0.5)';
        ctx.fill();
    });
}

function drawBoxes() {
    boxes.forEach(b => {
        const x = offsetX + b.x * cellSize;
        const y = offsetY + b.y * cellSize;
        const onTarget = isTargetAt(b.x, b.y);

        // Box body
        ctx.fillStyle = onTarget ? '#52b788' : '#e9c46a';
        ctx.fillRect(x + 3, y + 3, cellSize - 6, cellSize - 6);

        // Box border
        ctx.strokeStyle = onTarget ? '#38a169' : '#f4a261';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 3, y + 3, cellSize - 6, cellSize - 6);

        // Cross pattern
        ctx.strokeStyle = onTarget ? 'rgba(56,161,105,0.6)' : 'rgba(244,162,97,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 3, y + 3);
        ctx.lineTo(x + cellSize - 3, y + cellSize - 3);
        ctx.moveTo(x + cellSize - 3, y + 3);
        ctx.lineTo(x + 3, y + cellSize - 3);
        ctx.stroke();

        // Glow if on target
        if (onTarget) {
            ctx.beginPath();
            ctx.arc(x + cellSize/2, y + cellSize/2, cellSize * 0.45, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(46,213,115,0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    });
}

function drawPlayers() {
    const colors = [
        {fill: '#6c9bf5', stroke: '#4a90d9', label: '1'},
        {fill: '#f56c6c', stroke: '#d94a4a', label: '2'}
    ];

    players.forEach((p, i) => {
        const x = offsetX + p.x * cellSize;
        const y = offsetY + p.y * cellSize;
        const cx = x + cellSize/2;
        const cy = y + cellSize/2;
        const r = cellSize * 0.38;

        // Shadow
        ctx.beginPath();
        ctx.ellipse(cx, y + cellSize - 4, r*0.7, r*0.3, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fill();

        // Body
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = colors[i].fill;
        ctx.fill();
        ctx.strokeStyle = colors[i].stroke;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Label
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.floor(r)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(colors[i].label, cx, cy + 1);
    });
}

function drawHUD() {
    // Level and moves
    ctx.fillStyle = '#ccd6f6';
    ctx.font = `${Math.min(W*0.025, 20)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`Level ${currentLevel + 1} / ${LEVELS.length}`, 15, 15);

    const solvedCount = boxes.filter(b => isTargetAt(b.x, b.y)).length;
    ctx.fillText(`Boxes: ${solvedCount}/${boxes.length}`, 15, 40);
    ctx.fillText(`Moves: ${moves}`, 15, 65);

    // Controls reminder
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8892b0';
    const fs = Math.min(W*0.018, 14);
    ctx.font = `${fs}px 'Segoe UI', sans-serif`;
    ctx.fillText('P1: WASD   P2: Arrows', W - 15, 15);
    ctx.fillText('R: Restart', W - 15, 15 + fs * 1.4);

    // Level name
    const names = ['First Push', 'Sides', 'The Block', 'Triple Threat', 'The Maze'];
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a8b2d8';
    ctx.font = `${Math.min(W*0.02, 16)}px 'Segoe UI', sans-serif`;
    ctx.fillText(`— ${names[currentLevel]} —`, W/2, 15);
}

function drawWinScreen() {
    winTimer += 0.02;
    const alpha = Math.min(winTimer, 1);

    ctx.fillStyle = `rgba(26, 26, 46, ${alpha * 0.7})`;
    ctx.fillRect(0, 0, W, H);

    if (alpha >= 1) {
        ctx.fillStyle = '#2ed973';
        ctx.font = `bold ${Math.min(W*0.06, 48)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (currentLevel < LEVELS.length - 1) {
            ctx.fillText('LEVEL COMPLETE!', W/2, H * 0.35);
            ctx.fillStyle = '#ccd6f6';
            ctx.font = `${Math.min(W*0.03, 24)}px 'Segoe UI', sans-serif`;
            ctx.fillText(`Solved in ${moves} moves`, W/2, H * 0.45);
            ctx.fillText('Press ENTER for next level', W/2, H * 0.55);
        } else {
            ctx.fillText('YOU BEAT ALL LEVELS!', W/2, H * 0.35);
            ctx.fillStyle = '#e9c46a';
            ctx.font = `${Math.min(W*0.035, 28)}px 'Segoe UI', sans-serif`;
            ctx.fillText('🏆 Cooperative Victory! 🏆', W/2, H * 0.45);
            ctx.fillStyle = '#ccd6f6';
            ctx.font = `${Math.min(W*0.03, 24)}px 'Segoe UI', sans-serif`;
            ctx.fillText(`Total: ${moves} moves`, W/2, H * 0.53);
            ctx.fillText('Press ENTER to play again', W/2, H * 0.61);
        }
    }
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// Input
window.addEventListener('keydown', (e) => {
    if (!audioCtx) initAudio();

    if (gameState === 'start') {
        if (e.key === 'Enter' || e.key === ' ') {
            gameState = 'playing';
            loadLevel(currentLevel);
            playStartSound();
        }
        return;
    }

    if (gameState === 'won') {
        if (e.key === 'Enter' || e.key === ' ') {
            if (currentLevel < LEVELS.length - 1) {
                currentLevel++;
                loadLevel(currentLevel);
            } else {
                currentLevel = 0;
                loadLevel(currentLevel);
            }
            gameState = 'playing';
            particles = [];
        }
        return;
    }

    if (gameState === 'playing') {
        // Player 1: WASD
        switch(e.key) {
            case 'w': case 'W': tryMove(0, 0, -1); break;
            case 'a': case 'A': tryMove(0, -1, 0); break;
            case 's': case 'S': tryMove(0, 0, 1); break;
            case 'd': case 'D': tryMove(0, 1, 0); break;
        }

        // Player 2: Arrow keys
        switch(e.key) {
            case 'ArrowUp': e.preventDefault(); tryMove(1, 0, -1); break;
            case 'ArrowDown': e.preventDefault(); tryMove(1, 0, 1); break;
            case 'ArrowLeft': e.preventDefault(); tryMove(1, -1, 0); break;
            case 'ArrowRight': e.preventDefault(); tryMove(1, 1, 0); break;
        }

        // Restart
        if (e.key === 'r' || e.key === 'R') {
            loadLevel(currentLevel);
        }
    }
});

// Game loop
function gameLoop() {
    draw();
    requestAnimationFrame(gameLoop);
}

// Init
window.addEventListener('resize', resize);
resize();
loadLevel(0);
gameState = 'start';
gameLoop();
</script>
</body>
</html>
