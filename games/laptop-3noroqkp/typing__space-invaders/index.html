<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Space Invaders Typing</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; width: 100vw; height: 100vh; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Words pool
const WORDS = [
    "ALPHA","BETA","GAMMA","DELTA","NOVA","COMET","ASTRO","ORBIT",
    "PULSE","QUANTUM","VECTOR","PHOTON","NEBULA","COSMIC","STARDUST",
    "GRAVITY","PLASMA","IONIC","FLUX","ZENITH","MERIDIAN","SOLAR",
    "LUNAR","TITAN","ORION","VEGA","LYRA","DRACO","PISCES","LEO"
];

// Game state
let state = 'START'; // START, PLAYING, GAME_OVER
let score = 0;
let lives = 3;
let level = 1;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('sit_high') || '0'); } catch(e) {}

// Typing
let targetWord = '';
let typedChars = '';
let typeFlash = 0;
let shakeX = 0;

// Invaders
let invaders = [];
let invaderDir = 1;
let invaderSpeed = 1;
let invaderDescendTimer = 0;
let particles = [];
let shootTimer = 0;
let shootFlash = 0;

function getWords() {
    const pool = WORDS.slice();
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool;
}

function initLevel(lvl) {
    invaders = [];
    const cols = Math.min(5 + Math.floor(lvl / 2), 7);
    const rows = 4 + Math.min(Math.floor(lvl / 3), 3);
    const cellW = W / (cols + 1);
    const cellH = 60;
    const startY = 80;
    const words = getWords();
    let idx = 0;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            invaders.push({
                x: cellW * (c + 1) - 20,
                y: startY + r * cellH,
                word: words[idx % words.length],
                alive: true,
                frame: Math.floor(Math.random() * 2),
                col: c,
                row: r
            });
            idx++;
        }
    }
    invaderDir = 1;
    invaderSpeed = 0.5 + lvl * 0.3;
    invaderDescendTimer = 0;
    setTarget();
}

function getLowestAlive() {
    let lowest = null;
    for (let i = 0; i < invaders.length; i++) {
        if (invaders[i].alive) {
            if (!lowest || invaders[i].y > lowest.y) lowest = invaders[i];
        }
    }
    return lowest;
}

function setTarget() {
    const low = getLowestAlive();
    if (low) {
        targetWord = low.word;
        typedChars = '';
    }
}

function startGame() {
    initAudio();
    score = 0;
    lives = 3;
    level = 1;
    state = 'PLAYING';
    particles = [];
    initLevel(1);
}

function gameOver() {
    state = 'GAME_OVER';
    try {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('sit_high', String(highScore));
        }
    } catch(e) {}
}

// Input
let keysDown = {};
window.addEventListener('keydown', (e) => {
    keysDown[e.key] = true;
    if (state === 'START') {
        if (e.key === ' ' || e.key === 'Enter') startGame();
        return;
    }
    if (state === 'GAME_OVER') {
        if (e.key === ' ' || e.key === 'r' || e.key === 'R') startGame();
        return;
    }
    if (state !== 'PLAYING') return;

    if (e.key.length === 1 && e.key !== ' ') {
        const ch = e.key.toUpperCase();
        if (ch >= 'A' && ch <= 'Z') {
            initAudio();
            typedChars += ch;
            typeFlash = 0.1;
            if (typedChars === targetWord) {
                // Hit!
                const low = getLowestAlive();
                if (low) {
                    low.alive = false;
                    score += targetWord.length * 10 * level;
                    shootFlash = 0.3;
                    playSound(880, 0.15, 'square', 0.15);
                    playSound(1200, 0.1, 'sawtooth', 0.08);
                    spawnExplosion(low.x, low.y);
                }
                typedChars = '';
                const remaining = invaders.filter(iv => iv.alive);
                if (remaining.length === 0) {
                    level++;
                    initLevel(level);
                } else {
                    setTarget();
                }
            } else if (!targetWord.startsWith(typedChars)) {
                // Wrong - flash and reset
                typedChars = '';
                typeFlash = 0.3;
                shakeX = 5;
                playSound(120, 0.1, 'sawtooth', 0.1);
            }
        }
    }
    if (e.key === 'Backspace') {
        typedChars = typedChars.slice(0, -1);
    }
});

window.addEventListener('keyup', (e) => {
    keysDown[e.key] = false;
});

// Particles
function spawnExplosion(x, y) {
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: `hsl(${120 + Math.random() * 60}, 100%, ${50 + Math.random() * 30}%)`
        });
    }
}

// Draw pixel invader
function drawInvader(x, y, frame, scale) {
    const s = scale || 4;
    ctx.fillStyle = '#0f0';
    // Simple alien shape - two frames for animation
    if (frame === 0) {
        // Frame 1
        const pattern = [
            "  0110  ",
            " 011110 ",
            "1101011 ",
            "1 111 1 ",
            "1111111 ",
            "1 111 1 ",
            "1 1 1 1 ",
            " 1     1 "
        ];
        drawPattern(pattern, x, y, s);
    } else {
        // Frame 2
        const pattern = [
            "  0110  ",
            " 011110 ",
            "1101011 ",
            "1 111 1 ",
            "1111111 ",
            " 1 11 1 ",
            " 1 11 1 ",
            "    1    "
        ];
        drawPattern(pattern, x, y, s);
    }
}

function drawPattern(rows, cx, cy, s) {
    const w = rows[0].length * s;
    const h = rows.length * s;
    for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < rows[r].length; c++) {
            if (rows[r][c] === '1') {
                ctx.fillRect(cx - w/2 + c * s, cy - h/2 + r * s, s, s);
            }
        }
    }
}

// Draw ship (player)
function drawShip(x, y, scale) {
    const s = scale || 4;
    ctx.fillStyle = '#0ff';
    const pattern = [
        "    1    ",
        "    1    ",
        "  11111  ",
        "111111111",
        "111111111"
    ];
    const w = pattern[0].length * s;
    for (let r = 0; r < pattern.length; r++) {
        for (let c = 0; c < pattern[r].length; c++) {
            if (pattern[r][c] === '1') {
                ctx.fillRect(x - w/2 + c * s, y + r * s, s, s);
            }
        }
    }
}

// Stars background
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            speed: 0.2 + Math.random() * 0.5,
            size: Math.random() * 2 + 0.5
        });
    }
}
initStars();

function drawStars(dt) {
    ctx.fillStyle = '#fff';
    for (let s of stars) {
        s.y += s.speed * dt * 60;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.globalAlpha = 0.3 + s.size * 0.2;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
}

// Main loop
let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    drawStars(dt);

    if (state === 'START') {
        drawStartScreen();
    } else if (state === 'PLAYING') {
        updatePlaying(dt);
        drawPlaying();
    } else if (state === 'GAME_OVER') {
        drawGameOver();
    }

    requestAnimationFrame(gameLoop);
}

function updatePlaying(dt) {
    // Move invaders
    invaderDescendTimer += dt;
    const speed = invaderSpeed * (1 + level * 0.2);

    for (let inv of invaders) {
        if (!inv.alive) continue;
        inv.x += invaderDir * speed * dt * 60;
        inv.frame = Math.floor(time / 500) % 2;
    }

    // Bounce at edges
    const aliveInv = invaders.filter(i => i.alive);
    if (aliveInv.length > 0) {
        const minX = Math.min(...aliveInv.map(i => i.x));
        const maxX = Math.max(...aliveInv.map(i => i.x));
        if (minX < 30 && invaderDir === -1) {
            invaderDir = 1;
            for (let inv of invaders) if (inv.alive) inv.y += 20;
        }
        if (maxX > W - 30 && invaderDir === 1) {
            invaderDir = -1;
            for (let inv of invaders) if (inv.alive) inv.y += 20;
        }
    }

    // Check if invader reached bottom
    const shipY = H - 80;
    for (let inv of invaders) {
        if (inv.alive && inv.y > shipY - 30) {
            lives--;
            if (lives <= 0) {
                gameOver();
                return;
            }
            playSound(60, 0.4, 'sawtooth', 0.2);
        }
    }

    // Particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
    }
    particles = particles.filter(p => p.life > 0);

    // Decay effects
    if (typeFlash > 0) typeFlash -= dt * 3;
    if (shakeX > 0) shakeX -= dt * 30;
    if (shootFlash > 0) shootFlash -= dt * 4;
}

function drawStartScreen() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0f0';
    ctx.font = `bold ${Math.min(W/10, 60)}px monospace`;
    ctx.fillText('SPACE INVADERS', W/2, H * 0.25);

    ctx.font = `${Math.min(W/20, 24)}px monospace`;
    ctx.fillStyle = '#0ff';
    ctx.fillText('TYPING EDITION', W/2, H * 0.33);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W/25, 18)}px monospace`;
    const lines = [
        'Type the word shown at the bottom to destroy invaders.',
        '',
        'Controls:',
        '  Type letters to shoot the target invader',
        '  Backspace to correct mistakes',
        '',
        'If invaders reach your ship, you lose a life!',
        '',
        `High Score: ${highScore}`,
        '',
        '',
        'Press SPACE or ENTER to start'
    ];
    const startY = H * 0.42;
    for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], W/2, startY + i * Math.min(H/30, 28));
    }

    // Animated invader on start screen
    const frame = Math.floor(time / 400) % 2;
    drawInvader(W/2 - 150, H * 0.6, frame, 6);
    drawShip(W/2 + 150, H * 0.55, 6);
}

function drawPlaying() {
    const sx = shakeX > 0 ? (Math.random() - 0.5) * shakeX : 0;
    ctx.save();
    ctx.translate(sx, 0);

    // Draw invaders
    for (let inv of invaders) {
        if (!inv.alive) continue;
        drawInvader(inv.x, inv.y, inv.frame, 4);
        // Word on invader
        const isTarget = inv.word === targetWord && getLowestAlive() === inv;
        ctx.fillStyle = isTarget ? '#ff0' : 'rgba(255,255,255,0.3)';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(inv.word, inv.x, inv.y + 24);
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Ship
    const shipY = H - 80;
    drawShip(W/2, shipY, 5);

    // Shoot flash line
    if (shootFlash > 0) {
        ctx.strokeStyle = `rgba(0,255,255,${shootFlash * 3})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W/2, shipY);
        ctx.lineTo(W/2, 0);
        ctx.stroke();
    }

    // Target word display at bottom
    const displayY = H - 35;
    ctx.fillStyle = '#0f0';
    ctx.font = `bold ${Math.min(W/20, 28)}px monospace`;
    ctx.textAlign = 'center';

    const fullWord = targetWord;
    const typedPart = typedChars;
    const remaining = fullWord.substring(typedChars.length);

    // Draw typed part in bright color
    let totalWidth = ctx.measureText(fullWord).width;
    const startX = W/2 - totalWidth/2;

    ctx.fillStyle = typeFlash > 0 ? '#f00' : '#0f0';
    ctx.font = `bold ${Math.min(W/20, 28)}px monospace`;

    // Simple display: typed + remaining
    const typedStr = typedChars;
    const remStr = fullWord.substring(typedChars.length);

    ctx.fillStyle = typeFlash > 0 ? '#f44' : '#0f0';
    ctx.textAlign = 'left';
    ctx.fillText(typedStr, startX, displayY);
    ctx.fillStyle = '#888';
    const typedW = ctx.measureText(typedStr).width;
    ctx.fillText(remStr, startX + typedW, displayY);

    // Cursor blink
    if (Math.floor(time / 500) % 2 === 0) {
        const cursorX = startX + typedW;
        ctx.fillStyle = '#0f0';
        ctx.fillRect(cursorX + 4, displayY - 22, 3, 26);
    }

    // HUD
    ctx.textAlign = 'left';
    ctx.fillStyle = '#0ff';
    ctx.font = `${Math.min(W/40, 16)}px monospace`;
    ctx.fillText(`SCORE: ${score}`, 15, 25);
    ctx.fillText(`LEVEL: ${level}`, 15, 45);

    // Lives as small ships
    for (let i = 0; i < lives; i++) {
        drawShip(W - 60 + i * 35, 15, 2);
    }

    ctx.restore();
}

function drawGameOver() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f00';
    ctx.font = `bold ${Math.min(W/8, 50)}px monospace`;
    ctx.fillText('GAME OVER', W/2, H * 0.3);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W/18, 24)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, W/2, H * 0.42);
    ctx.fillText(`High Score: ${highScore}`, W/2, H * 0.5);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = `bold ${Math.min(W/18, 24)}px monospace`;
        ctx.fillText('NEW HIGH SCORE!', W/2, H * 0.58);
    }

    ctx.fillStyle = '#0f0';
    ctx.font = `${Math.min(W/22, 18)}px monospace`;
    if (Math.floor(time / 600) % 2 === 0) {
        ctx.fillText('Press SPACE or R to restart', W/2, H * 0.7);
    }

    // Draw some dead invaders
    const frame = Math.floor(time / 400) % 2;
    for (let i = 0; i < 3; i++) {
        ctx.globalAlpha = 0.3;
        drawInvader(W/2 - 100 + i * 100, H * 0.85, frame, 4);
    }
    ctx.globalAlpha = 1;
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
