<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bullet Hell Frogger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cellW, cellH, cols = 10, rows = 14;
let scale = 1;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellW = W / cols;
    cellH = H / rows;
    scale = Math.min(cellW, cellH);
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, type, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxMove() { playSound(440, 'square', 0.08, 0.1); }
function sfxDie() { playSound(150, 'sawtooth', 0.4, 0.3); playSound(100, 'square', 0.5, 0.2); }
function sfxGoal() { playSound(880, 'sine', 0.2, 0.2); setTimeout(() => playSound(1100, 'sine', 0.3, 0.2), 100); }
function sfxShoot() { playSound(200 + Math.random()*200, 'triangle', 0.05, 0.05); }

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let level = 1;
let frog = { col: 4, row: 13 };
let bullets = [];
let particles = [];
let goals = [0, 2, 4, 6, 8].map(c => ({ col: c, active: true }));
let laneTimers = [];
let lastTime = 0;
let shakeTimer = 0;

// Lane definitions
// Type: 'sweep' (horizontal fast), 'slow' (horizontal slow), 'rain' (vertical), 'spiral', 'safe'
const lanes = [
    { type: 'goal' },       // row 0
    { type: 'rain', speed: 1.2, dir: 1 },  // row 1
    { type: 'rain', speed: 0.8, dir: 1 },  // row 2
    { type: 'safe' },      // row 3
    { type: 'sweep', speed: 4, dir: 1 },   // row 4
    { type: 'sweep', speed: 3, dir: -1 },  // row 5
    { type: 'sweep', speed: 5, dir: 1 },   // row 6
    { type: 'safe' },      // row 7
    { type: 'slow', speed: 2, dir: -1 },   // row 8
    { type: 'slow', speed: 1.5, dir: 1 },  // row 9
    { type: 'spiral', speed: 3, dir: 1 },  // row 10
    { type: 'safe' },      // row 11
    { type: 'sweep', speed: 2.5, dir: -1 },// row 12
    { type: 'start' }       // row 13
];

function initLanes() {
    laneTimers = lanes.map((l, i) => ({ timer: Math.random() * 2, offset: Math.random() * cols }));
}

function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    frog = { col: 4, row: 13 };
    bullets = [];
    particles = [];
    goals = [0, 2, 4, 6, 8].map(c => ({ col: c, active: true }));
    initLanes();
}

function startGame() {
    resetGame();
    gameState = 'playing';
}

function nextLevel() {
    level++;
    frog = { col: 4, row: 13 };
    goals = [0, 2, 4, 6, 8].map(c => ({ col: c, active: true }));
    // Increase difficulty
    lanes.forEach((l, i) => {
        if (l.speed !== undefined) l.speed += level * 0.3;
    });
}

function frogPixel() {
    return { x: frog.col * cellW + cellW / 2, y: frog.row * cellH + cellH / 2 };
}

function spawnBullet(x, y, vx, vy, r) {
    bullets.push({ x, y, vx, vy, r: r || scale * 0.25 });
}

function update(dt) {
    if (gameState !== 'playing') return;

    const speedMult = 1 + (level - 1) * 0.15;

    // Update lane bullets
    for (let i = 0; i < lanes.length; i++) {
        const lane = lanes[i];
        const lt = laneTimers[i];
        if (!lane.speed) continue;

        lt.timer += dt * speedMult;

        const rowY = i * cellH;

        if (lane.type === 'sweep' || lane.type === 'slow') {
            const interval = lane.type === 'sweep' ? 1.5 : 2.5;
            if (lt.timer >= interval) {
                lt.timer = 0;
                let bx = lane.dir === 1 ? -cellW : W + cellW;
                let by = rowY + Math.random() * cellH;
                spawnBullet(bx, by, lane.dir * lane.speed * cellW * speedMult, 0, scale * 0.2);
                // Spawn a few extra for bullet-hell feel at higher levels
                if (level > 1) {
                    let by2 = rowY + Math.random() * cellH;
                    spawnBullet(bx - lane.dir * cellW * 0.8, by2, lane.dir * lane.speed * cellW * speedMult * 0.9, 0, scale * 0.15);
                }
            }
        } else if (lane.type === 'rain') {
            const interval = 1.2 / lane.speed;
            if (lt.timer >= interval) {
                lt.timer = 0;
                let bx = Math.random() * W;
                spawnBullet(bx, rowY - cellH * 0.5, 0, lane.speed * cellH * speedMult, scale * 0.18);
            }
        } else if (lane.type === 'spiral') {
            const interval = 0.4;
            if (lt.timer >= interval) {
                lt.timer = 0;
                let cx = W / 2;
                let cy = rowY + cellH / 2;
                let angle = lt.offset * Math.PI / 180 + level * 0.5;
                let speed = lane.speed * cellW * speedMult * 0.6;
                spawnBullet(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed * 0.3, scale * 0.14);
                lt.offset += 25;
            }
        }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        if (b.x < -cellW * 2 || b.x > W + cellW * 2 || b.y < -cellH * 2 || b.y > H + cellH * 2) {
            bullets.splice(i, 1);
        }
    }

    // Collision detection
    const fp = frogPixel();
    const frogR = scale * 0.3;
    for (const b of bullets) {
        const dx = fp.x - b.x;
        const dy = fp.y - b.y;
        if (dx * dx + dy * dy < (frogR + b.r) * (frogR + b.r)) {
            die();
            break;
        }
    }

    // Check goal
    if (gameState === 'playing' && frog.row === 0) {
        const goal = goals.find(g => g.col === frog.col && g.active);
        if (goal) {
            sfxGoal();
            score += 10 * level;
            goal.active = false;
            particles.push(...createExplosion(fp.x, fp.y, '#4f4', 20));
            // Check if all goals reached
            if (goals.every(g => !g.active)) {
                nextLevel();
            } else {
                frog.col = Math.floor(cols / 2);
                frog.row = 13;
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake
    shakeTimer = Math.max(0, shakeTimer - dt);
}

function die() {
    sfxDie();
    lives--;
    const fp = frogPixel();
    particles.push(...createExplosion(fp.x, fp.y, '#4f4', 30));
    shakeTimer = 0.3;
    if (lives <= 0) {
        gameState = 'gameover';
        try { localStorage.setItem('bf_highscore', Math.max(score, parseInt(localStorage.getItem('bf_highscore')||'0'))); } catch(e){}
    } else {
        frog.col = 4;
        frog.row = 13;
    }
}

function createExplosion(x, y, color, count) {
    const parts = [];
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 200;
        parts.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 0.5+Math.random()*0.5, color, r: 2+Math.random()*4 });
    }
    return parts;
}

function draw() {
    ctx.save();
    if (shakeTimer > 0) {
        const s = shakeTimer * 10;
        ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-20, -20, W+40, H+40);

    // Draw lane backgrounds
    for (let i = 0; i < rows; i++) {
        const y = i * cellH;
        if (i === 0) {
            ctx.fillStyle = 'rgba(34,139,34,0.15)';
            ctx.fillRect(0, y, W, cellH);
        } else if (lanes[i].type === 'safe') {
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fillRect(0, y, W, cellH);
        } else if (lanes[i].type === 'rain') {
            ctx.fillStyle = 'rgba(0,100,200,0.08)';
            ctx.fillRect(0, y, W, cellH);
        } else if (lanes[i].type === 'sweep') {
            ctx.fillStyle = 'rgba(255,50,50,0.05)';
            ctx.fillRect(0, y, W, cellH);
        } else if (lanes[i].type === 'spiral') {
            ctx.fillStyle = 'rgba(150,0,255,0.05)';
            ctx.fillRect(0, y, W, cellH);
        } else if (lanes[i].type === 'slow') {
            ctx.fillStyle = 'rgba(255,165,0,0.04)';
            ctx.fillRect(0, y, W, cellH);
        }

        // Lane dividers
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.beginPath();
        ctx.moveTo(0, y + cellH);
        ctx.lineTo(W, y + cellH);
        ctx.stroke();
    }

    // Draw goals
    for (const g of goals) {
        if (!g.active) continue;
        const x = g.col * cellW + cellW/2;
        const y = 0 * cellH + cellH/2;
        ctx.fillStyle = '#2d8a2d';
        ctx.beginPath();
        ctx.ellipse(x, y, cellW*0.35, cellH*0.3, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#4f4';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Lily pad detail
        ctx.fillStyle = '#1a5c1a';
        ctx.beginPath();
        ctx.ellipse(x, y, cellW*0.2, cellH*0.15, 0, 0, Math.PI*2);
        ctx.fill();
    }

    // Draw bullets
    for (const b of bullets) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        let color;
        if (b.vy > 0 && Math.abs(b.vx) < 10) color = '#4af'; // rain
        else if (Math.abs(b.vx) > Math.abs(b.vy)) color = '#f44'; // sweep
        else color = '#c4f'; // spiral
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.3, color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI*2);
        ctx.fill();
    }

    // Draw frog
    if (gameState === 'playing' || gameState === 'start') {
        const fp = frogPixel();
        // Glow
        ctx.shadowColor = '#4f4';
        ctx.shadowBlur = 10;
        // Body
        ctx.fillStyle = '#3a9c3a';
        ctx.beginPath();
        ctx.ellipse(fp.x, fp.y + scale*0.05, scale*0.28, scale*0.22, 0, 0, Math.PI*2);
        ctx.fill();
        // Head
        ctx.fillStyle = '#4ab84a';
        ctx.beginPath();
        ctx.arc(fp.x, fp.y - scale*0.12, scale*0.15, 0, Math.PI*2);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(fp.x - scale*0.07, fp.y - scale*0.16, scale*0.05, 0, Math.PI*2);
        ctx.arc(fp.x + scale*0.07, fp.y - scale*0.16, scale*0.05, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(fp.x - scale*0.07, fp.y - scale*0.16, scale*0.025, 0, Math.PI*2);
        ctx.arc(fp.x + scale*0.07, fp.y - scale*0.16, scale*0.025, 0, Math.PI*2);
        ctx.fill();
        // Legs
        ctx.strokeStyle = '#3a9c3a';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(fp.x - scale*0.2, fp.y + scale*0.15);
        ctx.lineTo(fp.x - scale*0.3, fp.y + scale*0.25);
        ctx.moveTo(fp.x + scale*0.2, fp.y + scale*0.15);
        ctx.lineTo(fp.x + scale*0.3, fp.y + scale*0.25);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 1);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (p.life), 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // HUD
    if (gameState === 'playing') {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(14, scale*0.3)}px monospace`;
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 15, 25);
        ctx.fillText(`LEVEL: ${level}`, 15, 25 + Math.max(18, scale*0.35));
        // Lives as frogs
        for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#4f4';
            ctx.beginPath();
            ctx.arc(W - 30 - i*30, 25, 8, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // Start screen
    if (gameState === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#4f4';
        ctx.font = `bold ${Math.min(W*0.08, 60)}px monospace`;
        ctx.fillText('BULLET HELL', W/2, H*0.3);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(W*0.06, 45)}px monospace`;
        ctx.fillText('FROGGER', W/2, H*0.3 + Math.min(W*0.06, 45));

        ctx.font = `${Math.max(14, scale*0.25)}px monospace`;
        ctx.fillStyle = '#aaa';
        ctx.fillText('Arrow Keys / WASD to move', W/2, H*0.5);
        ctx.fillText('Reach the lily pads at the top!', W/2, H*0.5 + Math.max(20, scale*0.3));
        ctx.fillText('Dodge the bullets. Don\'t get hit.', W/2, H*0.5 + Math.max(40, scale*0.6));

        ctx.fillStyle = '#ff0';
        ctx.font = `bold ${Math.max(16, scale*0.3)}px monospace`;
        const blink = Math.sin(Date.now()*0.005) > 0;
        if (blink) ctx.fillText('PRESS ENTER TO START', W/2, H*0.72);

        try {
            const hs = parseInt(localStorage.getItem('bf_highscore')||'0');
            if (hs > 0) {
                ctx.fillStyle = '#ff0';
                ctx.font = `${Math.max(14, scale*0.2)}px monospace`;
                ctx.fillText(`HIGH SCORE: ${hs}`, W/2, H*0.82);
            }
        } catch(e){}
    }

    // Game over screen
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f44';
        ctx.font = `bold ${Math.min(W*0.08, 55)}px monospace`;
        ctx.fillText('GAME OVER', W/2, H*0.35);

        ctx.fillStyle = '#fff';
        ctx.font = `${Math.max(16, scale*0.3)}px monospace`;
        ctx.fillText(`Final Score: ${score}`, W/2, H*0.48);
        ctx.fillText(`Level Reached: ${level}`, W/2, H*0.55);

        try {
            const hs = parseInt(localStorage.getItem('bf_highscore')||'0');
            ctx.fillStyle = '#ff0';
            ctx.font = `${Math.max(14, scale*0.2)}px monospace`;
            ctx.fillText(`HIGH SCORE: ${hs}`, W/2, H*0.65);
        } catch(e){}

        ctx.fillStyle = '#fff';
        const blink = Math.sin(Date.now()*0.005) > 0;
        if (blink) {
            ctx.font = `bold ${Math.max(16, scale*0.28)}px monospace`;
            ctx.fillText('PRESS ENTER TO RESTART', W/2, H*0.78);
        }
    }

    ctx.restore();
}

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', (e) => {
    if (gameState === 'start' && e.key === 'Enter') {
        initAudio();
        startGame();
        return;
    }
    if (gameState === 'gameover' && e.key === 'Enter') {
        startGame();
        return;
    }
    if (gameState !== 'playing') return;

    let moved = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        if (frog.row > 0) { frog.row--; moved = true; }
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        if (frog.row < rows - 1) { frog.row++; moved = true; }
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (frog.col > 0) { frog.col--; moved = true; }
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (frog.col < cols - 1) { frog.col++; moved = true; }
    }
    if (moved) sfxMove();
});

// Prevent scrolling with arrows
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});

initLanes();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
