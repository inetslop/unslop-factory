<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Cargo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, scale;
function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    scale = Math.min(W / 900, H / 700);
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    else if (type === 'explode') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
    else if (type === 'push') { osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
    else if (type === 'place') { osc.type = 'sine'; osc.frequency.setValueAtTime(523, audioCtx.currentTime); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
    else if (type === 'lose') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8); osc.start(); osc.stop(audioCtx.currentTime + 0.8); }
    else if (type === 'win') { osc.type = 'sine'; osc.frequency.setValueAtTime(523, audioCtx.currentTime); osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15); osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
}

// Game state
let gameState = 'start'; // start, playing, won, lost
let score = 0;
let lives = 3;
let level = 0;
let frame = 0;

const COLS = 12, ROWS = 9;
let cellW, cellH, offsetX, offsetY;

function calcGrid() {
    const maxW = W * 0.85;
    const maxH = H * 0.75;
    cellW = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
    cellH = cellW;
    offsetX = Math.floor((W - cellW * COLS) / 2);
    offsetY = Math.floor((H - cellH * ROWS) / 2) + 10;
}

const levels = [
    {
        map: [
            "............",
            "..A....B...C",
            ".#.#..#.#.#.",
            ".....P.....",
            ".#.#..#.#.#.",
            "..A....B...C",
            "............",
            "............",
            "............"
        ],
        player: {x: 5, y: 3},
        boxes: [{x:2,y:1},{x:6,y:1},{x:10,y:1}],
        targets: [{x:2,y:5},{x:6,y:5},{x:10,y:5}],
        walls: []
    },
    {
        map: [
            "............",
            "..A..B..C..",
            ".#.#.##.#.#.",
            "...P......",
            ".#.#.##.#.#.",
            "..A..B..C..",
            "............",
            "............",
            "..........."
        ],
        player: {x: 3, y: 3},
        boxes: [{x:3,y:1},{x:6,y:1},{x:9,y:1}],
        targets: [{x:3,y:5},{x:6,y:5},{x:9,y:5}],
        walls: []
    },
    {
        map: [
            "............",
            ".A..B..C..D.",
            "..#..##..#..",
            "...P.......",
            "..#..##..#..",
            ".A..B..C..D.",
            "............",
            "............",
            "..........."
        ],
        player: {x: 3, y: 3},
        boxes: [{x:2,y:1},{x:5,y:1},{x:8,y:1},{x:10,y:1}],
        targets: [{x:2,y:5},{x:5,y:5},{x:8,y:5},{x:10,y:5}],
        walls: []
    }
];

// Parse walls from map
function parseLevel(idx) {
    const data = levels[idx];
    const walls = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (data.map[r] && data.map[r][c] === '#') walls.push({x: c, y: r});
        }
    }
    return { player: {...data.player}, boxes: data.boxes.map(b => ({...b})), targets: data.targets.map(t => ({...t})), walls };
}

let player, boxes, targets, walls;
let bullets = [];
let aliens = [];
let alienTimer = 0;
let alienInterval = 180;
let alienSpeed = 1.2;
let particles = [];
let stars = [];
let shakeTimer = 0;

// Generate stars
function genStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 + 0.1 });
    }
}

function startGame() {
    score = 0; lives = 3; level = 0;
    loadLevel();
    gameState = 'playing';
}

function loadLevel() {
    const data = parseLevel(level);
    player = data.player;
    boxes = data.boxes;
    targets = data.targets;
    walls = data.walls;
    bullets = [];
    aliens = [];
    alienTimer = 0;
    calcGrid();
    genStars();
}

function spawnAlien() {
    const type = Math.floor(Math.random() * 3);
    const x = offsetX + cellW * (Math.floor(Math.random() * COLS) + 0.5);
    aliens.push({ x, y: offsetY - 40, vx: (Math.random() - 0.5) * 2, vy: alienSpeed * scale, type, hp: 1, w: cellW * 0.7, h: cellH * 0.6 });
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 30 + Math.random() * 20, color, size: Math.random() * 4 + 2 });
    }
}

function isWall(x, y) { return walls.some(w => w.x === x && w.y === y); }
function isBoxAt(x, y) { return boxes.findIndex(b => b.x === x && b.y === y); }
function isTargetAt(x, y) { return targets.findIndex(t => t.x === x && t.y === y); }

function tryMove(dx, dy) {
    const nx = player.x + dx, ny = player.y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
    if (isWall(nx, ny)) return;
    const boxIdx = isBoxAt(nx, ny);
    if (boxIdx !== -1) {
        const bx = boxes[boxIdx].x + dx, by = boxes[boxIdx].y + dy;
        if (isWall(bx, by)) return;
        if (isBoxAt(bx, by)) return;
        boxes[boxIdx].x = bx; boxes[boxIdx].y = by;
        playSound('push');
        const ti = isTargetAt(bx, by);
        if (ti !== -1) { playSound('place'); score += 50; }
    } else {
        player.x = nx; player.y = ny;
    }
}

function shoot() {
    const px = offsetX + cellW * (player.x + 0.5);
    const py = offsetY + cellH * player.y;
    bullets.push({ x: px, y: py, vy: -8 * scale });
    playSound('shoot');
}

function checkWin() {
    return boxes.every(b => isTargetAt(b.x, b.y) !== -1);
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) { initAudio(); startGame(); }
    if (gameState === 'won' && e.code === 'Enter') { level++; if (level >= levels.length) { level = 0; } loadLevel(); gameState = 'playing'; }
    if (gameState === 'lost' && e.code === 'Enter') { startGame(); }
    if (gameState === 'playing') {
        if (e.code === 'Space') shoot();
        if (e.code === 'KeyR') loadLevel();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Drawing
function drawStar(x, y, size) {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, size * scale * 0.5, 0, Math.PI * 2);
    ctx.fill();
}

function drawAlien(x, y, type, w, h) {
    const colors = ['#ff4444', '#44ff44', '#ffaa00'];
    ctx.fillStyle = colors[type];
    // Body
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h*0.6, w*0.4, h*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    // Head
    ctx.beginPath();
    ctx.arc(x + w/2, y + h*0.3, w*0.25, 0, Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + w*0.35, y + h*0.3, w*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w*0.65, y + h*0.3, w*0.08, 0, Math.PI*2); ctx.fill();
    // Legs
    ctx.strokeStyle = colors[type];
    ctx.lineWidth = 2 * scale;
    for (let i = -1; i <= 1; i += 2) {
        ctx.beginPath();
        ctx.moveTo(x + w/2 + i*w*0.2, y + h*0.8);
        ctx.lineTo(x + w/2 + i*w*0.35, y + h);
        ctx.stroke();
    }
}

function drawPlayer(x, y) {
    const px = offsetX + cellW * player.x;
    const py = offsetY + cellH * player.y;
    // Ship body
    ctx.fillStyle = '#44aaff';
    ctx.beginPath();
    ctx.moveTo(px + cellW*0.5, py + cellH*0.1);
    ctx.lineTo(px + cellW*0.2, py + cellH*0.9);
    ctx.lineTo(px + cellW*0.8, py + cellH*0.9);
    ctx.closePath();
    ctx.fill();
    // Cockpit
    ctx.fillStyle = '#aaddff';
    ctx.beginPath();
    ctx.arc(px + cellW*0.5, py + cellH*0.4, cellW*0.12, 0, Math.PI*2);
    ctx.fill();
    // Engine glow
    ctx.fillStyle = `rgba(255,150,0,${0.5 + Math.sin(frame*0.2)*0.3})`;
    ctx.beginPath();
    ctx.arc(px + cellW*0.5, py + cellH*0.95, cellW*0.1, 0, Math.PI*2);
    ctx.fill();
}

function drawBox(x, y, onTarget) {
    const bx = offsetX + cellW * x;
    const by = offsetY + cellH * y;
    ctx.fillStyle = onTarget ? '#44ff88' : '#ffaa00';
    ctx.fillRect(bx + 3*scale, by + 3*scale, cellW - 6*scale, cellH - 6*scale);
    ctx.strokeStyle = onTarget ? '#22cc66' : '#cc7700';
    ctx.lineWidth = 2 * scale;
    ctx.strokeRect(bx + 3*scale, by + 3*scale, cellW - 6*scale, cellH - 6*scale);
    // Cross pattern
    ctx.strokeStyle = onTarget ? '#88ffbb' : '#ffcc44';
    ctx.beginPath();
    ctx.moveTo(bx + 8*scale, by + 8*scale); ctx.lineTo(bx + cellW - 8*scale, by + cellH - 8*scale);
    ctx.moveTo(bx + cellW - 8*scale, by + 8*scale); ctx.lineTo(bx + 8*scale, by + cellH - 8*scale);
    ctx.stroke();
}

function drawTarget(x, y) {
    const tx = offsetX + cellW * x;
    const ty = offsetY + cellH * y;
    ctx.strokeStyle = `rgba(0,255,150,${0.5 + Math.sin(frame*0.1)*0.3})`;
    ctx.lineWidth = 2 * scale;
    ctx.setLineDash([4*scale, 4*scale]);
    ctx.strokeRect(tx + 2*scale, ty + 2*scale, cellW - 4*scale, cellH - 4*scale);
    ctx.setLineDash([]);
}

function drawWall(x, y) {
    const wx = offsetX + cellW * x;
    const wy = offsetY + cellH * y;
    ctx.fillStyle = '#334455';
    ctx.fillRect(wx, wy, cellW, cellH);
    ctx.strokeStyle = '#556677';
    ctx.lineWidth = 1;
    ctx.strokeRect(wx, wy, cellW, cellH);
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(14*scale)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`LEVEL: ${level + 1}/${levels.length}`, 20, 55);
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(W - 40 - i * 30, 30, 10*scale, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    // Stars
    stars.forEach(s => { s.y += s.sp; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } drawStar(s.x, s.y, s.s); });

    ctx.fillStyle = '#44aaff';
    ctx.font = `bold ${Math.floor(48*scale)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('COSMIC CARGO', W/2, H*0.25);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(16*scale)}px monospace`;
    ctx.fillText('Push cargo crates onto docking pads while defending against alien invaders!', W/2, H*0.38);
    ctx.fillText('', W/2, H*0.45);
    ctx.fillStyle = '#aaddff';
    ctx.font = `${Math.floor(14*scale)}px monospace`;
    ctx.fillText('ARROWS / WASD - Move & Push', W/2, H*0.52);
    ctx.fillText('SPACE - Shoot Aliens', W/2, H*0.57);
    ctx.fillText('R - Restart Level', W/2, H*0.62);
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(frame*0.1)*0.5})`;
    ctx.font = `${Math.floor(18*scale)}px monospace`;
    ctx.fillText('PRESS ENTER TO START', W/2, H*0.78);
}

function drawEndScreen(won) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    if (won) {
        ctx.fillStyle = '#44ff88';
        ctx.font = `bold ${Math.floor(42*scale)}px monospace`;
        ctx.fillText('LEVEL COMPLETE!', W/2, H*0.35);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.floor(18*scale)}px monospace`;
        ctx.fillText(`Score: ${score}`, W/2, H*0.45);
        ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(frame*0.1)*0.5})`;
        ctx.font = `${Math.floor(16*scale)}px monospace`;
        ctx.fillText('PRESS ENTER FOR NEXT LEVEL', W/2, H*0.6);
    } else {
        ctx.fillStyle = '#ff4444';
        ctx.font = `bold ${Math.floor(42*scale)}px monospace`;
        ctx.fillText('GAME OVER', W/2, H*0.35);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.floor(18*scale)}px monospace`;
        ctx.fillText(`Final Score: ${score}`, W/2, H*0.45);
        ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(frame*0.1)*0.5})`;
        ctx.font = `${Math.floor(16*scale)}px monospace`;
        ctx.fillText('PRESS ENTER TO RESTART', W/2, H*0.6);
    }
}

function update() {
    if (gameState !== 'playing') return;
    frame++;

    // Player movement (grid)
    if (keys['ArrowUp'] || keys['KeyW']) { tryMove(0, -1); keys['ArrowUp']=false; keys['KeyW']=false; }
    if (keys['ArrowDown'] || keys['KeyS']) { tryMove(0, 1); keys['ArrowDown']=false; keys['KeyS']=false; }
    if (keys['ArrowLeft'] || keys['KeyA']) { tryMove(-1, 0); keys['ArrowLeft']=false; keys['KeyA']=false; }
    if (keys['ArrowRight'] || keys['KeyD']) { tryMove(1, 0); keys['ArrowRight']=false; keys['KeyD']=false; }

    // Spawn aliens
    alienTimer++;
    const interval = Math.max(80, alienInterval - level * 30);
    if (alienTimer >= interval) { alienTimer = 0; spawnAlien(); }

    // Update aliens
    for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        a.x += a.vx * scale;
        a.y += a.vy * scale;
        if (a.x < offsetX) a.vx = Math.abs(a.vx);
        if (a.x > offsetX + cellW * COLS - a.w) a.vx = -Math.abs(a.vx);

        // Check if alien reaches player row
        const playerScreenY = offsetY + cellH * ROWS;
        if (a.y > playerScreenY) {
            aliens.splice(i, 1);
            lives--;
            shakeTimer = 20;
            playSound('lose');
            if (lives <= 0) gameState = 'lost';
            continue;
        }

        // Check collision with player
        const px = offsetX + cellW * player.x, py = offsetY + cellH * player.y;
        if (a.x < px + cellW && a.x + a.w > px && a.y < py + cellH && a.y + a.h > py) {
            aliens.splice(i, 1);
            lives--;
            shakeTimer = 20;
            playSound('lose');
            spawnParticles(a.x + a.w/2, a.y + a.h/2, '#ff4444', 15);
            if (lives <= 0) gameState = 'lost';
        }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < 0) { bullets.splice(i, 1); continue; }
        // Check hit aliens
        for (let j = aliens.length - 1; j >= 0; j--) {
            const a = aliens[j];
            if (b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
                bullets.splice(i, 1);
                a.hp--;
                if (a.hp <= 0) {
                    aliens.splice(j, 1);
                    score += 25;
                    playSound('explode');
                    spawnParticles(a.x + a.w/2, a.y + a.h/2, '#ffaa44', 12);
                }
                break;
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * scale;
        p.y += p.vy * scale;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake decay
    if (shakeTimer > 0) shakeTimer--;

    // Check win
    if (checkWin()) {
        gameState = 'won';
        score += 100;
        playSound('win');
    }
}

function render() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'start') { drawStartScreen(); return; }

    // Stars
    stars.forEach(s => { s.y += s.sp * scale; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } drawStar(s.x, s.y, s.s); });

    ctx.save();
    if (shakeTimer > 0) {
        const sx = (Math.random()-0.5)*8*scale;
        const sy = (Math.random()-0.5)*8*scale;
        ctx.translate(sx, sy);
    }

    // Draw grid area subtle
    ctx.strokeStyle = 'rgba(40,60,100,0.3)';
    ctx.lineWidth = 1;
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath(); ctx.moveTo(offsetX, offsetY + r*cellH); ctx.lineTo(offsetX + COLS*cellW, offsetY + r*cellH); ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath(); ctx.moveTo(offsetX + c*cellW, offsetY); ctx.lineTo(offsetX + c*cellW, offsetY + ROWS*cellH); ctx.stroke();
    }

    // Targets
    targets.forEach(t => drawTarget(t.x, t.y));

    // Walls
    walls.forEach(w => drawWall(w.x, w.y));

    // Boxes
    boxes.forEach(b => { const onT = isTargetAt(b.x, b.y) !== -1; drawBox(b.x, b.y, onT); });

    // Player
    drawPlayer();

    // Aliens
    aliens.forEach(a => drawAlien(a.x, a.y, a.type, a.w, a.h));

    // Bullets
    ctx.fillStyle = '#fff';
    bullets.forEach(b => {
        ctx.fillRect(b.x - 2*scale, b.y - 8*scale, 4*scale, 10*scale);
        ctx.fillStyle = `rgba(100,200,255,0.6)`;
        ctx.fillRect(b.x - 4*scale, b.y - 6*scale, 8*scale, 4*scale);
        ctx.fillStyle = '#fff';
    });

    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size * scale, p.size * scale);
        ctx.globalAlpha = 1;
    });

    ctx.restore();

    // HUD
    drawHUD();

    if (gameState === 'won') drawEndScreen(true);
    if (gameState === 'lost') drawEndScreen(false);
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

genStars();
calcGrid();
loop();
</script>
</body>
</html>
