<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pac-Man Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a2e; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, gridOffsetX, gridOffsetY;
const COLS = 12, ROWS = 12;
const GHOST_COUNT = 20, PELLETS = 8;

let state = 'start'; // start, playing, won, lost
let pacMan = { x: 5, y: 5 };
let grid = [];
let ghosts = [];
let pellets = [];
let revealed = new Set();
let score = 0;
let pelletsCollected = 0;
let totalPellets = PELLETS;
let mouthAngle = 0;
let animFrame = 0;
let gameOverTimer = 0;
let particles = [];
let msgAlpha = 0;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellSize = Math.floor(Math.min(W, H) * 0.85 / COLS);
    gridOffsetX = Math.floor((W - cellSize * COLS) / 2);
    gridOffsetY = Math.floor((H - cellSize * ROWS) / 2) + 20;
}
window.addEventListener('resize', resize);
resize();

function initGame() {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    ghosts = [];
    pellets = [];
    revealed = new Set();
    score = 0;
    pelletsCollected = 0;
    pacMan = { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) };
    particles = [];
    gameOverTimer = 0;

    // Place ghosts and pellets (not on start position)
    let cells = [];
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            if (!(x === pacMan.x && y === pacMan.y)) {
                cells.push({ x, y });
            }
        }
    }
    // Shuffle
    for (let i = cells.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cells[i], cells[j]] = [cells[j], cells[i]];
    }

    ghosts = cells.slice(0, GHOST_COUNT);
    pellets = cells.slice(GHOST_COUNT, GHOST_COUNT + PELLETS);

    // Build grid
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            let isGhost = ghosts.some(g => g.x === x && g.y === y);
            let isPellet = pellets.some(p => p.x === x && p.y === y);
            grid[y][x] = { isGhost, isPellet };
        }
    }

    // Reveal start position
    revealCell(pacMan.x, pacMan.y);
}

function countAdjacentGhosts(x, y) {
    let count = 0;
    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            let nx = x + dx, ny = y + dy;
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                if (grid[ny][nx].isGhost) count++;
            }
        }
    }
    return count;
}

function revealCell(x, y) {
    const key = x + ',' + y;
    if (revealed.has(key)) return false;
    revealed.add(key);

    let isPellet = grid[y][x].isPellet;
    if (isPellet) {
        pelletsCollected++;
        score += 100;
        spawnParticles(x, y, '#4fc3f7');
    }
    return true;
}

function spawnParticles(gx, gy, color) {
    const cx = gridOffsetX + gx * cellSize + cellSize / 2;
    const cy = gridOffsetY + gy * cellSize + cellSize / 2;
    for (let i = 0; i < 8; i++) {
        const angle = (Math.PI * 2 / 8) * i;
        particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * (cellSize * 0.3),
            vy: Math.sin(angle) * (cellSize * 0.3),
            life: 1, color
        });
    }
}

function movePacMan(dx, dy) {
    if (state !== 'playing') return;
    let nx = pacMan.x + dx;
    let ny = pacMan.y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

    pacMan.x = nx;
    pacMan.y = ny;

    const wasNew = revealCell(nx, ny);
    if (wasNew) score += 10;

    if (grid[ny][nx].isGhost) {
        state = 'lost';
        gameOverTimer = 0;
        // Reveal all ghosts
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (grid[y][x].isGhost) revealed.add(x + ',' + y);
            }
        }
    } else if (pelletsCollected >= totalPellets) {
        state = 'won';
        score += 500;
    }
}

function getNumberColor(n) {
    const colors = ['#fff', '#4fc3f7', '#69f0ae', '#ef5350', '#ab47bc', '#ffca28', '#26c6da', '#ec407a'];
    return colors[n] || '#fff';
}

function drawGrid() {
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            const px = gridOffsetX + x * cellSize;
            const py = gridOffsetY + y * cellSize;
            const key = x + ',' + y;
            const isRevealed = revealed.has(key);

            // Cell background
            if (isRevealed) {
                ctx.fillStyle = 'rgba(20, 20, 60, 0.9)';
            } else {
                ctx.fillStyle = 'rgba(30, 30, 80, 0.7)';
            }
            ctx.fillRect(px + 1, py + 1, cellSize - 2, cellSize - 2);

            // Cell border (maze-like)
            ctx.strokeStyle = 'rgba(41, 121, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 1, py + 1, cellSize - 2, cellSize - 2);

            if (isRevealed) {
                const isGhost = grid[y][x].isGhost;
                const isPellet = grid[y][x].isPellet && state !== 'won';

                if (isGhost && state === 'lost') {
                    drawGhost(px, py);
                } else if (isGhost) {
                    // Show ghost only on game over
                    drawGhost(px, py);
                } else if (isPellet && state === 'won') {
                    drawPellet(px, py);
                }

                const count = countAdjacentGhosts(x, y);
                if (count > 0) {
                    ctx.fillStyle = getNumberColor(count);
                    ctx.font = `bold ${cellSize * 0.45}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(count, px + cellSize / 2, py + cellSize / 2);
                }
            }
        }
    }
}

function drawGhost(px, py) {
    const cx = px + cellSize / 2;
    const cy = py + cellSize / 2;
    const r = cellSize * 0.35;

    // Ghost body
    ctx.fillStyle = '#ff1744';
    ctx.beginPath();
    ctx.arc(cx, cy - r * 0.2, r, Math.PI, 0);
    ctx.lineTo(cx + r, cy + r * 0.8);
    // Wavy bottom
    const waves = 3;
    for (let i = 0; i < waves; i++) {
        const wx = cx + r - (i + 1) * (2 * r / waves);
        const wy = cy + r * 0.8 - (i % 2 === 0 ? r * 0.2 : 0);
        ctx.lineTo(wx, wy);
    }
    ctx.closePath();
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.25, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.3, cy - r * 0.3, r * 0.25, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(cx - r * 0.25, cy - r * 0.3, r * 0.12, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.25, cy - r * 0.3, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
}

function drawPellet(px, py) {
    const cx = px + cellSize / 2;
    const cy = py + cellSize / 2;
    const r = cellSize * 0.15;
    ctx.fillStyle = '#4fc3f7';
    ctx.shadowColor = '#4fc3f7';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawPacMan() {
    const px = gridOffsetX + pacMan.x * cellSize;
    const py = gridOffsetY + pacMan.y * cellSize;
    const cx = px + cellSize / 2;
    const cy = py + cellSize / 2;
    const r = cellSize * 0.4;

    mouthAngle = Math.abs(Math.sin(animFrame * 0.1)) * 0.8;

    ctx.fillStyle = '#ffeb3b';
    ctx.shadowColor = '#ffeb3b';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(cx, cy, r, mouthAngle, Math.PI * 2 - mouthAngle);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, cellSize * 0.1 * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    const hudY = gridOffsetY - 30;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(18, cellSize * 0.4)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, gridOffsetX, hudY);

    const pelletText = `Pellets: ${pelletsCollected}/${totalPellets}`;
    ctx.textAlign = 'right';
    ctx.fillText(pelletText, gridOffsetX + cellSize * COLS, hudY);

    // Pellet progress dots
    const dotStartX = gridOffsetX + (cellSize * COLS) / 2 - (totalPellets * 14) / 2;
    for (let i = 0; i < totalPellets; i++) {
        ctx.fillStyle = i < pelletsCollected ? '#4fc3f7' : 'rgba(79, 195, 247, 0.3)';
        ctx.beginPath();
        ctx.arc(dotStartX + i * 14 + 5, hudY - 5, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a2e';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;

    // Title
    ctx.fillStyle = '#ffeb3b';
    ctx.font = `bold ${Math.min(48, W * 0.06)}px monospace`;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ffeb3b';
    ctx.shadowBlur = 15;
    ctx.fillText('PAC-MAN', cx, cy - 80);
    ctx.fillStyle = '#4fc3f7';
    ctx.shadowColor = '#4fc3f7';
    ctx.fillText('MINESWEEPER', cx, cy - 40);
    ctx.shadowBlur = 0;

    // Instructions
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = `${Math.min(16, W * 0.02)}px monospace`;
    const lines = [
        'Navigate Pac-Man through the maze.',
        '',
        '⚠ Ghosts are hidden in cells - step on one and you lose!',
        '● Find all Power Pellets to win.',
        'Numbers show how many adjacent ghosts are nearby.',
        '',
        'Controls: Arrow Keys / WASD to move',
        'R = Restart'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, cx, cy + 20 + i * 24);
    });

    // Blinking prompt
    if (Math.floor(animFrame / 30) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(20, W * 0.025)}px monospace`;
        ctx.fillText('Press any key to start', cx, cy + 220);
    }

    // Draw decorative Pac-Man
    const dr = 30;
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath();
    ctx.arc(cx - 150, cy - 60, dr, mouthAngle, Math.PI * 2 - mouthAngle);
    ctx.lineTo(cx - 150, cy - 60);
    ctx.closePath();
    ctx.fill();

    // Decorative ghost
    const gx = cx + 150, gy = cy - 60;
    ctx.fillStyle = '#ff1744';
    ctx.beginPath();
    ctx.arc(gx, gy - 8, dr * 0.9, Math.PI, 0);
    ctx.lineTo(gx + dr * 0.9, gy + 25);
    ctx.lineTo(gx + dr * 0.6, gy + 18);
    ctx.lineTo(gx + dr * 0.3, gy + 25);
    ctx.lineTo(gx - dr * 0.3, gy + 18);
    ctx.lineTo(gx - dr * 0.9, gy + 25);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(gx - 8, gy - 12, 6, 0, Math.PI * 2);
    ctx.arc(gx + 8, gy - 12, 6, 0, Math.PI * 2);
    ctx.fill();
}

function drawEndScreen(won) {
    gameOverTimer++;
    const alpha = Math.min(1, gameOverTimer / 30);

    ctx.fillStyle = `rgba(10, 10, 46, ${alpha * 0.7})`;
    ctx.fillRect(0, 0, W, H);

    if (gameOverTimer < 20) return;

    const cx = W / 2;
    const cy = H / 2;

    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';

    if (won) {
        ctx.fillStyle = '#69f0ae';
        ctx.font = `bold ${Math.min(42, W * 0.05)}px monospace`;
        ctx.shadowColor = '#69f0ae';
        ctx.shadowBlur = 15;
        ctx.fillText('YOU WIN!', cx, cy - 30);
    } else {
        ctx.fillStyle = '#ff1744';
        ctx.font = `bold ${Math.min(42, W * 0.05)}px monospace`;
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 15;
        ctx.fillText('GOT EATEN!', cx, cy - 30);
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(20, W * 0.025)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, cx, cy + 15);
    ctx.fillText(`Pellets: ${pelletsCollected}/${totalPellets}`, cx, cy + 45);

    if (Math.floor(gameOverTimer / 30) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = `${Math.min(16, W * 0.02)}px monospace`;
        ctx.fillText('Press R or any key to play again', cx, cy + 90);
    }
    ctx.globalAlpha = 1;
}

function draw() {
    animFrame++;
    ctx.clearRect(0, 0, W, H);

    if (state === 'start') {
        drawStartScreen();
        return;
    }

    // Background
    ctx.fillStyle = '#0a0a2e';
    ctx.fillRect(0, 0, W, H);

    // Draw maze border glow
    ctx.strokeStyle = 'rgba(41, 121, 255, 0.5)';
    ctx.lineWidth = 3;
    ctx.strokeRect(gridOffsetX - 4, gridOffsetY - 4, cellSize * COLS + 8, cellSize * ROWS + 8);

    drawGrid();
    drawPacMan();
    drawParticles();
    drawHUD();

    if (state === 'won') drawEndScreen(true);
    if (state === 'lost') drawEndScreen(false);
}

function loop() {
    draw();
    requestAnimationFrame(loop);
}

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playTone(freq, duration, type = 'square', volume = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playMove() { playTone(440, 0.05, 'square', 0.05); }
function playPellet() { playTone(880, 0.15, 'sine', 0.15); setTimeout(() => playTone(1200, 0.15, 'sine', 0.1), 80); }
function playLose() { playTone(200, 0.4, 'sawtooth', 0.15); setTimeout(() => playTone(150, 0.5, 'sawtooth', 0.12), 200); }
function playWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'sine', 0.12), i * 120)); }

window.addEventListener('keydown', (e) => {
    initAudio();

    if (state === 'start') {
        state = 'playing';
        initGame();
        return;
    }

    if (state === 'won' || state === 'lost') {
        if (gameOverTimer > 30) {
            state = 'playing';
            initGame();
        }
        return;
    }

    let dx = 0, dy = 0;
    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': dy = -1; break;
        case 'ArrowDown': case 's': case 'S': dy = 1; break;
        case 'ArrowLeft': case 'a': case 'A': dx = -1; break;
        case 'ArrowRight': case 'd': case 'D': dx = 1; break;
        case 'r': case 'R': state = 'playing'; initGame(); return;
        default: return;
    }

    if (dx || dy) {
        e.preventDefault();
        movePacMan(dx, dy);
        playMove();
        const key = pacMan.x + ',' + pacMan.y;
        if (revealed.has(key)) {
            if (grid[pacMan.y][pacMan.x].isPellet) playPellet();
        }
        if (state === 'lost') playLose();
        if (state === 'won') playWin();
    }
});

// Touch support - tap left/right half to move, swipe
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
    initAudio();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;

    if (state === 'start') { state = 'playing'; initGame(); return; }
    if ((state === 'won' || state === 'lost') && gameOverTimer > 30) { state = 'playing'; initGame(); return; }
});
canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (state !== 'playing') return;
    if (Math.abs(dx) > Math.abs(dy)) {
        movePacMan(dx > 0 ? 1 : -1, 0);
    } else {
        movePacMan(0, dy > 0 ? 1 : -1);
    }
});

// localStorage for high score
function getHighScore() {
    try { return parseInt(localStorage.getItem('pacMinesweeperHigh') || '0'); } catch (e) { return 0; }
}
function setHighScore(s) {
    try { if (s > getHighScore()) localStorage.setItem('pacMinesweeperHigh', s); } catch (e) {}
}

// Override end screen to save score
const origDrawEnd = drawEndScreen;
drawEndScreen = function(won) {
    gameOverTimer++;
    const alpha = Math.min(1, gameOverTimer / 30);
    ctx.fillStyle = `rgba(10, 10, 46, ${alpha * 0.7})`;
    ctx.fillRect(0, 0, W, H);
    if (gameOverTimer < 20) return;

    const cx = W / 2, cy = H / 2;
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';

    if (won) {
        ctx.fillStyle = '#69f0ae';
        ctx.font = `bold ${Math.min(42, W * 0.05)}px monospace`;
        ctx.shadowColor = '#69f0ae';
        ctx.shadowBlur = 15;
        ctx.fillText('YOU WIN!', cx, cy - 30);
    } else {
        ctx.fillStyle = '#ff1744';
        ctx.font = `bold ${Math.min(42, W * 0.05)}px monospace`;
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 15;
        ctx.fillText('GOT EATEN!', cx, cy - 30);
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(20, W * 0.025)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, cx, cy + 15);
    ctx.fillText(`Pellets: ${pelletsCollected}/${totalPellets}`, cx, cy + 45);

    const hs = getHighScore();
    if (score > hs) { setHighScore(score); }
    ctx.fillStyle = 'rgba(255,235,59,0.7)';
    ctx.font = `${Math.min(14, W * 0.018)}px monospace`;
    ctx.fillText(`High Score: ${Math.max(hs, score)}`, cx, cy + 75);

    if (Math.floor(gameOverTimer / 30) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = `${Math.min(16, W * 0.02)}px monospace`;
        ctx.fillText('Press R or any key to play again', cx, cy + 110);
    }
    ctx.globalAlpha = 1;
};

initGame();
state = 'start';
loop();
</script>
</body>
</html>
