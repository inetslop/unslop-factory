<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function hitSound() { playSound(220, 0.15, 'square', 0.2); }
function bounceSound() { playSound(440, 0.1, 'triangle', 0.15); }
function scoreSound() { playSound(880, 0.3, 'sine', 0.2); }
function loseSound() { playSound(110, 0.4, 'sawtooth', 0.2); }
function destroySound() { playSound(600, 0.25, 'square', 0.15); }

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let aiScore = 0;
let lives = 3;
let frameCount = 0;

// Stars background
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.3 + 0.1,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}
initStars();

// Paddles
let playerPaddle = { x: 40, y: 0, w: 12, h: 100, vy: 0 };
let aiPaddle = { x: 0, y: 0, w: 12, h: 100, vy: 0, targetY: 0 };

// Asteroids
let asteroids = [];
let particles = [];
let floatTexts = [];

function createAsteroid(x, y, size, speed) {
    const angle = Math.random() * Math.PI * 2;
    const spd = speed || (3 + Math.random() * 3);
    return {
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        radius: size || 12 + Math.random() * 8,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.1,
        hits: 0,
        maxHits: 4,
        vertices: generateAsteroidShape(size || 12 + Math.random() * 8)
    };
}

function generateAsteroidShape(r) {
    const verts = [];
    const numVerts = 7 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numVerts; i++) {
        const angle = (i / numVerts) * Math.PI * 2;
        const dist = r * (0.75 + Math.random() * 0.35);
        verts.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist });
    }
    return verts;
}

function spawnAsteroid() {
    const side = Math.random() < 0.5 ? 0 : 1;
    const x = side === 0 ? W * 0.2 + Math.random() * (W * 0.3) : W * 0.5 + Math.random() * (W * 0.3);
    const y = H * 0.15 + Math.random() * (H * 0.7);
    asteroids.push(createAsteroid(x, y));
}

function resetGame() {
    score = 0;
    aiScore = 0;
    lives = 3;
    asteroids = [];
    particles = [];
    floatTexts = [];
    playerPaddle.y = H / 2 - playerPaddle.h / 2;
    aiPaddle.y = H / 2 - aiPaddle.h / 2;
    for (let i = 0; i < 3; i++) spawnAsteroid();
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        gameState = 'playing';
        resetGame();
    }
    if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
        gameState = 'playing';
        resetGame();
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color: color,
            size: Math.random() * 4 + 1
        });
    }
}

function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
}

// Update
function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Player paddle
    const pSpeed = 8;
    if (keys['KeyW'] || keys['ArrowUp']) playerPaddle.vy = -pSpeed;
    else if (keys['KeyS'] || keys['ArrowDown']) playerPaddle.vy = pSpeed;
    else playerPaddle.vy = 0;
    playerPaddle.y += playerPaddle.vy;
    playerPaddle.y = Math.max(0, Math.min(H - playerPaddle.h, playerPaddle.y));

    // AI paddle
    let targetAsteroid = null;
    let minDist = Infinity;
    for (const a of asteroids) {
        if (a.vx > 0) {
            const dist = Math.abs(a.x - aiPaddle.x);
            if (dist < minDist) { minDist = dist; targetAsteroid = a; }
        }
    }
    if (targetAsteroid) {
        const predictedY = targetAsteroid.y + targetAsteroid.vy * ((aiPaddle.x - targetAsteroid.x) / (targetAsteroid.vx || 1));
        aiPaddle.targetY = Math.max(0, Math.min(H - aiPaddle.h, predictedY)) + (Math.random() - 0.5) * 30;
    } else {
        aiPaddle.targetY = H / 2;
    }
    const aiSpeed = 4.5;
    const diff = aiPaddle.targetY - aiPaddle.y;
    aiPaddle.vy = Math.sign(diff) * Math.min(aiSpeed, Math.abs(diff));
    aiPaddle.y += aiPaddle.vy;
    aiPaddle.y = Math.max(0, Math.min(H - aiPaddle.h, aiPaddle.y));

    // Asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx;
        a.y += a.vy;
        a.rotation += a.rotSpeed;

        // Bounce off top/bottom
        if (a.y - a.radius < 0) { a.y = a.radius; a.vy = Math.abs(a.vy); bounceSound(); }
        if (a.y + a.radius > H) { a.y = H - a.radius; a.vy = -Math.abs(a.vy); bounceSound(); }

        // Player paddle collision
        const px = playerPaddle.x + playerPaddle.w;
        if (a.vx < 0 && a.x - a.radius < px && a.x - a.radius > playerPaddle.x - 10) {
            if (a.y > playerPaddle.y && a.y < playerPaddle.y + playerPaddle.h) {
                const hitPos = (a.y - playerPaddle.y) / playerPaddle.h;
                const angle = (hitPos - 0.5) * Math.PI * 0.7;
                const spd = Math.sqrt(a.vx * a.vx + a.vy * a.vy) * 1.05;
                a.vx = Math.cos(angle) * spd;
                a.vy = Math.sin(angle) * spd;
                a.x = px + a.radius;
                a.hits++;
                hitSound();
                spawnParticles(a.x, a.y, '#4af', 8);
                if (a.hits >= a.maxHits) {
                    destroyAsteroid(i);
                    continue;
                }
            }
        }

        // AI paddle collision
        const ax = aiPaddle.x - aiPaddle.w;
        if (a.vx > 0 && a.x + a.radius > ax && a.x + a.radius < aiPaddle.x + 10) {
            if (a.y > aiPaddle.y && a.y < aiPaddle.y + aiPaddle.h) {
                const hitPos = (a.y - aiPaddle.y) / aiPaddle.h;
                const angle = Math.PI - (hitPos - 0.5) * Math.PI * 0.7;
                const spd = Math.sqrt(a.vx * a.vx + a.vy * a.vy) * 1.05;
                a.vx = Math.cos(angle) * spd;
                a.vy = Math.sin(angle) * spd;
                a.x = ax - a.radius;
                a.hits++;
                hitSound();
                spawnParticles(a.x, a.y, '#f4a', 8);
                if (a.hits >= a.maxHits) {
                    destroyAsteroid(i);
                    continue;
                }
            }
        }

        // Score / Lose life
        if (a.x + a.radius < -10) {
            // Past player goal - lose life
            lives--;
            loseSound();
            addFloatText(W * 0.2, H / 2, 'MISS!', '#f44');
            asteroids.splice(i, 1);
            spawnParticles(0, a.y, '#f44', 15);
            if (lives <= 0) {
                gameState = 'gameover';
            } else {
                // Respawn after delay
                setTimeout(() => { if (gameState === 'playing') spawnAsteroid(); }, 800);
            }
        }
        if (a.x - a.radius > W + 10) {
            // Past AI goal - player scores
            score++;
            scoreSound();
            addFloatText(W * 0.8, H / 2, 'SCORE!', '#4f4');
            asteroids.splice(i, 1);
            spawnParticles(W, a.y, '#4f4', 15);
            setTimeout(() => { if (gameState === 'playing') spawnAsteroid(); }, 600);
        }

        // Speed cap
        const maxSpd = 12;
        const spd = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
        if (spd > maxSpd) {
            a.vx = (a.vx / spd) * maxSpd;
            a.vy = (a.vy / spd) * maxSpd;
        }
    }

    // Maintain minimum asteroids
    if (asteroids.length < 3 && frameCount % 120 === 0) {
        spawnAsteroid();
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Float texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const t = floatTexts[i];
        t.y += t.vy;
        t.life -= 0.02;
        if (t.life <= 0) floatTexts.splice(i, 1);
    }

    // Stars twinkle
    for (const s of stars) {
        s.twinkle += 0.03;
    }
}

function destroyAsteroid(index) {
    const a = asteroids[index];
    spawnParticles(a.x, a.y, '#fa4', 20);
    addFloatText(a.x, a.y, 'DESTROYED!', '#fa4');
    destroySound();
    // Split into smaller ones
    if (a.radius > 10) {
        const r = a.radius * 0.6;
        for (let j = 0; j < 2; j++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = 4 + Math.random() * 3;
            asteroids.push({
                x: a.x + Math.cos(angle) * r,
                y: a.y + Math.sin(angle) * r,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                radius: r,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.15,
                hits: 0,
                maxHits: 3,
                vertices: generateAsteroidShape(r)
            });
        }
    }
    asteroids.splice(index, 1);
}

// Render
function render() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
        const alpha = 0.3 + Math.sin(s.twinkle) * 0.4;
        ctx.fillStyle = `rgba(200,220,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    if (gameState === 'start') {
        renderStartScreen();
        return;
    }

    // Center line
    ctx.strokeStyle = 'rgba(100,150,255,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 15]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Goal lines
    ctx.strokeStyle = 'rgba(255,80,80,0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(10, H);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(80,255,80,0.4)';
    ctx.beginPath();
    ctx.moveTo(W - 10, 0);
    ctx.lineTo(W - 10, H);
    ctx.stroke();

    // Player paddle
    ctx.shadowColor = '#4af';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#4af';
    ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);
    ctx.shadowBlur = 0;

    // AI paddle
    ctx.shadowColor = '#f4a';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#f4a';
    ctx.fillRect(aiPaddle.x - aiPaddle.w + W - W, aiPaddle.y, aiPaddle.w, aiPaddle.h);
    // Actually position AI paddle on right
    const aiX = W - aiPaddle.w - 30;
    ctx.fillStyle = '#f4a';
    ctx.fillRect(aiX, aiPaddle.y, aiPaddle.w, aiPaddle.h);
    ctx.shadowBlur = 0;

    // Asteroids
    for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rotation);
        ctx.beginPath();
        ctx.moveTo(a.vertices[0].x, a.vertices[0].y);
        for (let i = 1; i < a.vertices.length; i++) {
            ctx.lineTo(a.vertices[i].x, a.vertices[i].y);
        }
        ctx.closePath();
        ctx.shadowColor = '#fa4';
        ctx.shadowBlur = 8;
        ctx.fillStyle = `rgba(255,${140 + Math.floor(a.hits * 20)},40,0.7)`;
        ctx.fill();
        ctx.strokeStyle = '#fa4';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Damage indicator
        if (a.hits > 0) {
            ctx.restore();
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${a.maxHits - a.hits}`, 0, 4);
        }
        ctx.restore();
    }

    // Particles
    for (const p of particles) {
        ctx.fillStyle = `rgba(${p.color === '#4af' ? '68,170,255' : p.color === '#f4a' ? '255,68,170' : p.color === '#fa4' ? '255,170,68' : '255,80,80'},${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }

    // Float texts
    for (const t of floatTexts) {
        ctx.fillStyle = `rgba(${t.color === '#f44' ? '255,68,68' : t.color === '#4f4' ? '68,255,68' : '255,170,68'},${t.life})`;
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${score}`, W / 2 - 60, 40);
    ctx.fillText(`${aiScore}`, W / 2 + 60, 40);

    // Lives
    ctx.font = '18px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#f44';
    let livesStr = '';
    for (let i = 0; i < lives; i++) livesStr += '● ';
    ctx.fillText('LIVES: ' + livesStr, 20, H - 20);

    // Asteroid count
    ctx.fillStyle = '#fa4';
    ctx.fillText(`ASTEROIDS: ${asteroids.length}`, 20, H - 50);

    if (gameState === 'gameover') {
        renderGameOver();
    }
}

function renderStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#4af';
    ctx.shadowBlur = 20;
    ctx.fillText('PONG ASTEROIDS', W / 2, H / 3);
    ctx.shadowBlur = 0;

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aac';
    ctx.fillText('Deflect asteroids away from your goal!', W / 2, H / 3 + 50);
    ctx.fillText('Hit them enough to destroy them.', W / 2, H / 3 + 75);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#889';
    ctx.fillText('[W/S] or [↑/↓] - Move Paddle', W / 2, H / 2 + 30);
    ctx.fillText('Press SPACE to Start', W / 2, H / 2 + 70);

    // Animated asteroid decoration
    const t = Date.now() * 0.001;
    ctx.save();
    ctx.translate(W / 2, H / 2 + 140);
    ctx.rotate(t);
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2;
        const r = 30 + Math.sin(i * 2.5) * 8;
        if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
        else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
    }
    ctx.closePath();
    ctx.strokeStyle = '#fa4';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 3 + 50);

    ctx.fillStyle = '#889';
    ctx.font = '18px monospace';
    ctx.fillText('Press SPACE or R to Restart', W / 2, H / 2 + 40);
}

// LocalStorage best score
let bestScore = 0;
try {
    bestScore = parseInt(localStorage.getItem('pongAsteroidsBest')) || 0;
} catch(e) {}

function saveBest() {
    if (score > bestScore) {
        bestScore = score;
        try { localStorage.setItem('pongAsteroidsBest', bestScore); } catch(e) {}
    }
}

// Game loop
let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;

    if (gameState === 'playing') update();
    render();

    if (gameState === 'gameover' && frameCount % 1 === 0) {
        saveBest();
    }

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
