<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Clicker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    overflow: hidden; 
    background: #0a0a1a; 
    font-family: 'Segoe UI', sans-serif;
    width: 100vw; height: 100vh;
    user-select: none;
}
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
#ui {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column; align-items: center;
}
#startScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,10,26,0.95); z-index: 100;
}
#startScreen h1 {
    font-size: clamp(2rem, 6vw, 4rem); color: #fff; text-shadow: 0 0 30px #00ffaa, 0 0 60px #00ffaa;
    margin-bottom: 20px; letter-spacing: 4px;
}
#startScreen p { color: #aaa; font-size: clamp(0.9rem, 2vw, 1.2rem); margin: 8px 0; }
#startScreen .controls { 
    margin-top: 30px; padding: 20px; border: 1px solid #333; border-radius: 12px;
    background: rgba(255,255,255,0.03); max-width: 400px; text-align: center;
}
#startBtn {
    margin-top: 30px; padding: 16px 50px; font-size: 1.3rem; background: linear-gradient(135deg, #00ffaa, #00aaff);
    border: none; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}
#startBtn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0,255,170,0.5); }
#gameUI { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; }
#topBar {
    display: flex; justify-content: space-between; width: 100%; padding: 12px 20px;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); z-index: 10;
}
#energyDisplay { color: #fff; font-size: clamp(1rem, 3vw, 1.5rem); font-weight: bold; }
#epsDisplay { color: #00ffaa; font-size: clamp(0.8rem, 2vw, 1rem); }
#clickPowerDisplay { color: #ffaa00; font-size: clamp(0.8rem, 2vw, 1rem); }
#mainArea { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; position: relative; }
#clickOrb {
    width: clamp(140px, 25vmin, 220px); height: clamp(140px, 25vmin, 220px);
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, #44ffcc, #0066aa, #001133);
    box-shadow: 0 0 40px rgba(0,255,170,0.4), inset 0 0 30px rgba(255,255,255,0.1);
    cursor: pointer; pointer-events: auto; display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s; border: 2px solid rgba(0,255,170,0.3);
}
#clickOrb:hover { transform: scale(1.03); }
#clickOrb:active { transform: scale(0.95); }
#orbText { color: rgba(255,255,255,0.8); font-size: clamp(0.7rem, 1.5vmin, 1rem); text-align: center; pointer-events: none; }
#bottomBar {
    width: 100%; padding: 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    display: flex; gap: 8px; overflow-x: auto; z-index: 10; scrollbar-width: thin;
}
#bottomBar::-webkit-scrollbar { height: 4px; }
#bottomBar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.shopItem {
    pointer-events: auto; padding: 10px 14px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;
    cursor: pointer; min-width: 140px; transition: all 0.2s; flex-shrink: 0;
}
.shopItem:hover { background: rgba(255,255,255,0.1); border-color: rgba(0,255,170,0.4); }
.shopItem.cant-afford { opacity: 0.5; cursor: not-allowed; }
.shopItem .name { font-size: clamp(0.7rem, 1.5vmin, 0.9rem); font-weight: bold; margin-bottom: 4px; }
.shopItem .cost { font-size: clamp(0.6rem, 1.2vmin, 0.8rem); color: #ffaa00; }
.shopItem .level { font-size: clamp(0.6rem, 1.2vmin, 0.8rem); color: #00ffaa; }
#stats { position: fixed; top: 50px; right: 10px; color: #aaa; font-size: 0.75rem; text-align: right; pointer-events: none; z-index: 5; }
.floatText {
    position: absolute; color: #fff; font-weight: bold; pointer-events: none;
    animation: floatUp 1s ease-out forwards; text-shadow: 0 0 10px rgba(0,255,170,0.8);
}
@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
}
#milestone {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-size: clamp(1.2rem, 4vw, 2rem); text-shadow: 0 0 20px #00ffaa;
    pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 50;
}
#restartBtn {
    position: fixed; bottom: 10px; right: 10px; padding: 8px 16px; background: rgba(255,50,50,0.3);
    border: 1px solid rgba(255,50,50,0.5); color: #ff6666; border-radius: 6px; cursor: pointer;
    pointer-events: auto; font-size: 0.8rem; z-index: 20; display: none;
}
#restartBtn:hover { background: rgba(255,50,50,0.5); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
    <div id="startScreen">
        <h1>ENDLESS CLICKER</h1>
        <p>Click the orb. Buy upgrades. Go infinite.</p>
        <p style="color:#666; font-size:0.85rem;">There is no end. Only your limits.</p>
        <div class="controls">
            <p>🖱️ Click the orb to earn Energy</p>
            <p>⚡ Buy upgrades from the shop below</p>
            <p>🔢 Stack multipliers for exponential growth</p>
            <p style="margin-top:12px; color:#666;">Keys: [R] Restart | [1-5] Buy upgrades</p>
        </div>
        <button id="startBtn">START CLICKING</button>
    </div>
    <div id="gameUI">
        <div id="topBar">
            <div id="energyDisplay">⚡ 0</div>
            <div id="epsDisplay">0/s</div>
            <div id="clickPowerDisplay">+1/click</div>
        </div>
        <div id="mainArea">
            <div id="clickOrb"><span id="orbText">CLICK<br>ME</span></div>
        </div>
        <div id="bottomBar"></div>
    </div>
</div>
<div id="stats"></div>
<div id="milestone"></div>
<button id="restartBtn">↻ RESTART [R]</button>

<script>
(function(){
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'click') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800 + Math.random()*400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'buy') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'milestone') {
        osc.type = 'sine'; 
        [523,659,784].forEach((f,i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine'; o.frequency.setValueAtTime(f, audioCtx.currentTime + i*0.1);
            g.gain.setValueAtTime(0.15, audioCtx.currentTime + i*0.1);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.1 + 0.3);
            o.start(audioCtx.currentTime + i*0.1); o.stop(audioCtx.currentTime + i*0.1 + 0.3);
        });
    }
}

// Game State
let energy = 0, totalClicks = 0, totalEnergy = 0;
let clickPower = 1, eps = 0, multiplier = 1, critChance = 0, critMult = 2;
let combo = 0, lastClickTime = 0, maxCombo = 0;
let gameStarted = false, lastTime = 0;
let shakeAmount = 0;

const upgrades = [
    { name: 'Click Power', desc: '+1/click', level: 0, baseCost: 10, costMult: 1.5, type: 'click' },
    { name: 'Auto Gen', desc: '+1/s', level: 0, baseCost: 50, costMult: 1.6, type: 'auto' },
    { name: 'Multiplier', desc: 'x1.5 all', level: 0, baseCost: 200, costMult: 2.0, type: 'multi' },
    { name: 'Crit Chance', desc: '+5% crit', level: 0, baseCost: 500, costMult: 2.5, type: 'crit' },
    { name: 'Crit Power', desc: 'x1 per lv', level: 0, baseCost: 1000, costMult: 3.0, type: 'critpwr' }
];

function getUpgradeCost(u) { return Math.floor(u.baseCost * Math.pow(u.costMult, u.level)); }

function recalc() {
    eps = upgrades[1].level * 1 * multiplier;
    clickPower = (1 + upgrades[0].level) * multiplier;
    critChance = upgrades[3].level * 0.05;
    critMult = 2 + upgrades[4].level;
    if (upgrades[2].level > 0) {
        const m = Math.pow(1.5, upgrades[2].level);
        eps *= m; clickPower *= m;
    }
}

// Particles
let particles = [];
function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
            x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
            life: 1, decay: 0.02 + Math.random()*0.03, size: 3+Math.random()*4, color: color || '#00ffaa'
        });
    }
}

// Floating texts
let floats = [];
function spawnFloat(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'floatText';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color || '#fff';
    el.style.fontSize = Math.min(24, 12 + Math.log10(Math.abs(parseFloat(text)||1)) * 3) + 'px';
    document.getElementById('mainArea').appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

// Background stars
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
        stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, sp: Math.random()*0.3+0.1 });
    }
}
initStars();

function drawBackground(time) {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    const progress = Math.min(totalEnergy / 100000, 1);
    const hue = 170 - progress * 60;
    stars.forEach(s => {
        s.y += s.sp;
        if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
        ctx.fillStyle = `hsla(${hue}, 80%, 70%, ${0.3 + Math.sin(time*0.001+s.x)*0.2})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill();
    });
}

function drawParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.1;
        p.life -= p.decay;
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function formatNum(n) {
    if (n < 1000) return Math.floor(n).toString();
    const suffixes = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','De'];
    const tier = Math.floor(Math.log10(n)/3);
    if (tier >= suffixes.length) return n.toExponential(2);
    return (n / Math.pow(10, tier*3)).toFixed(1) + suffixes[tier-1];
}

// Shop UI
const bottomBar = document.getElementById('bottomBar');
function buildShop() {
    bottomBar.innerHTML = '';
    upgrades.forEach((u, i) => {
        const div = document.createElement('div');
        div.className = 'shopItem';
        div.id = 'shop_' + i;
        div.innerHTML = `<div class="name">${i+1}. ${u.name}</div><div class="cost">⚡ ${formatNum(getUpgradeCost(u))}</div><div class="level">Lv.${u.level}</div>`;
        div.onclick = () => buyUpgrade(i);
        bottomBar.appendChild(div);
    });
}

function updateShop() {
    upgrades.forEach((u, i) => {
        const el = document.getElementById('shop_' + i);
        if (!el) return;
        const cost = getUpgradeCost(u);
        el.querySelector('.cost').textContent = '⚡ ' + formatNum(cost);
        el.querySelector('.level').textContent = 'Lv.' + u.level;
        el.classList.toggle('cant-afford', energy < cost);
    });
}

function buyUpgrade(i) {
    const u = upgrades[i];
    const cost = getUpgradeCost(u);
    if (energy >= cost) {
        energy -= cost;
        u.level++;
        recalc();
        playSound('buy');
        updateShop();
        spawnParticles(W/2, H/2, 15, '#ffaa00');
    }
}

// Click handler
const orb = document.getElementById('clickOrb');
orb.addEventListener('pointerdown', (e) => {
    if (!gameStarted) return;
    initAudio();
    const now = performance.now();
    if (now - lastClickTime < 250) combo++; else combo = 0;
    maxCombo = Math.max(maxCombo, combo);
    lastClickTime = now;

    let gain = clickPower * (1 + combo * 0.05);
    let isCrit = false;
    if (Math.random() < critChance) {
        gain *= critMult;
        isCrit = true;
        shakeAmount = 8;
    }
    energy += gain;
    totalEnergy += gain;
    totalClicks++;

    const r = orb.getBoundingClientRect();
    const cx = e.clientX || (r.left + r.width/2);
    const cy = e.clientY || (r.top + r.height/2);
    
    spawnParticles(cx, cy, isCrit ? 20 : 8, isCrit ? '#ff4444' : '#00ffaa');
    spawnFloat(cx - 20, cy - 20, '+' + formatNum(gain), isCrit ? '#ff6666' : '#fff');
    
    if (isCrit) {
        const el = document.createElement('div');
        el.className = 'floatText';
        el.textContent = 'CRIT!';
        el.style.left = (cx - 30) + 'px';
        el.style.top = (cy - 50) + 'px';
        el.style.color = '#ff4444';
        el.style.fontSize = '20px';
        document.getElementById('mainArea').appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    playSound('click');
    updateShop();
});

// Milestones
let nextMilestone = 100;
const milestones = [100, 500, 2500, 10000, 50000, 100000, 500000, 1e6, 1e7, 1e8, 1e9, 1e10];
function checkMilestone() {
    if (totalEnergy >= nextMilestone) {
        const idx = milestones.indexOf(nextMilestone);
        if (idx < milestones.length - 1) nextMilestone = milestones[idx+1];
        const el = document.getElementById('milestone');
        el.textContent = '✦ ' + formatNum(totalEnergy) + ' Energy ✦';
        el.style.opacity = '1';
        playSound('milestone');
        setTimeout(() => { el.style.opacity = '0'; }, 2000);
    }
}

// Game loop
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;

    if (gameStarted) {
        energy += eps * dt;
        totalEnergy += eps * dt;
        checkMilestone();
    }

    // Shake
    let sx = 0, sy = 0;
    if (shakeAmount > 0) {
        sx = (Math.random()-0.5) * shakeAmount;
        sy = (Math.random()-0.5) * shakeAmount;
        shakeAmount *= 0.85;
        if (shakeAmount < 0.5) shakeAmount = 0;
    }

    ctx.save();
    ctx.translate(sx, sy);
    drawBackground(time);
    drawParticles();
    ctx.restore();

    if (gameStarted) {
        document.getElementById('energyDisplay').textContent = '⚡ ' + formatNum(energy);
        document.getElementById('epsDisplay').textContent = formatNum(eps) + '/s';
        document.getElementById('clickPowerDisplay').textContent = '+' + formatNum(clickPower) + '/click';
        
        // Orb glow based on eps
        const glow = Math.min(40 + eps * 2, 120);
        orb.style.boxShadow = `0 0 ${glow}px rgba(0,255,170,${Math.min(0.3+eps*0.01, 0.8)}), inset 0 0 30px rgba(255,255,255,0.1)`;
        
        // Stats
        document.getElementById('stats').innerHTML = 
            `Clicks: ${totalClicks}<br>Max Combo: ${maxCombo}<br>Total: ${formatNum(totalEnergy)}`;
    }

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// Start
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', () => {
    initAudio();
    gameStarted = true;
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameUI').style.display = 'flex';
    document.getElementById('restartBtn').style.display = 'block';
    buildShop();
    recalc();
});

// Restart
function restart() {
    energy = 0; totalClicks = 0; totalEnergy = 0;
    clickPower = 1; eps = 0; multiplier = 1; critChance = 0; critMult = 2;
    combo = 0; maxCombo = 0; nextMilestone = 100;
    upgrades.forEach(u => u.level = 0);
    recalc();
    buildShop();
    updateShop();
}

document.getElementById('restartBtn').addEventListener('click', restart);

// Keyboard
window.addEventListener('keydown', (e) => {
    if (!gameStarted) return;
    if (e.key === 'r' || e.key === 'R') restart();
    const num = parseInt(e.key);
    if (num >= 1 && num <= 5) buyUpgrade(num - 1);
});

// Save/Load
function save() {
    try {
        const data = { energy, totalEnergy, totalClicks, maxCombo, upgrades: upgrades.map(u=>u.level), nextMilestone };
        localStorage.setItem('endlessClicker', JSON.stringify(data));
    } catch(e){}
}
function load() {
    try {
        const raw = localStorage.getItem('endlessClicker');
        if (raw) {
            const d = JSON.parse(raw);
            energy = d.energy||0; totalEnergy = d.totalEnergy||0;
            totalClicks = d.totalClicks||0; maxCombo = d.maxCombo||0; nextMilestone = d.nextMilestone||100;
            if (d.upgrades) d.upgrades.forEach((l,i)=>{ upgrades[i].level = l; });
            recalc();
        }
    } catch(e){}
}
load();

setInterval(save, 5000);
})();
</script>
</body>
</html>
