<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'hurt') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('zombieRunnerHigh') || '0'); } catch(e) {}

const GROUND_Y_RATIO = 0.82;
let groundY;

// Player
let player = {};
function resetPlayer() {
    player = {
        x: 200, y: 0, vx: 0, vy: 0, w: 36, h: 52,
        onGround: false, facing: 1, hp: 100, maxHp: 100,
        shootCooldown: 0, invincible: 0, runFrame: 0
    };
    player.y = groundY - player.h;
}

// Camera
let camX = 0;

// Entities
let bullets = [];
let zombies = [];
let particles = [];
let bloodParticles = [];
let floatingTexts = [];

// Spawn
let spawnTimer = 0;
let difficulty = 1;
let gameTime = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) {
        initAudio();
        startGame();
    } else if (gameState === 'gameover' && (e.code === 'Enter' || e.code === 'KeyR')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    gameState = 'playing';
    score = 0;
    difficulty = 1;
    gameTime = 0;
    spawnTimer = 0;
    bullets = [];
    zombies = [];
    particles = [];
    bloodParticles = [];
    floatingTexts = [];
    camX = 0;
    groundY = H * GROUND_Y_RATIO;
    resetPlayer();
}

// Zombie types
function createZombie(type) {
    const z = {
        x: camX + W + 50 + Math.random() * 200,
        y: groundY - 48,
        vx: 0, vy: 0, w: 34, h: 48,
        hp: 1, maxHp: 1, speed: 1, type: type || 'walker',
        hitFlash: 0, lungeTimer: 0
    };
    if (type === 'runner') {
        z.speed = 2.5; z.hp = z.maxHp = 1; z.w = 30; z.h = 44;
        z.y = groundY - z.h;
    } else if (type === 'tank') {
        z.speed = 0.6; z.hp = z.maxHp = 5; z.w = 44; z.h = 56;
        z.y = groundY - z.h;
    } else if (type === 'spitter') {
        z.speed = 1.2; z.hp = z.maxHp = 2; z.w = 32; z.h = 48;
        z.y = groundY - z.h; z.spitTimer = 120 + Math.random() * 60;
    }
    return z;
}

function spawnZombie() {
    const r = Math.random();
    let type = 'walker';
    if (r < 0.15 * difficulty) type = 'tank';
    else if (r < 0.4 * difficulty + 0.2) type = 'runner';
    else if (r < 0.55 * difficulty + 0.3) type = 'spitter';
    zombies.push(createZombie(type));
}

// Particles
function spawnParticles(x, y, color, count, spread) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y, vx: (Math.random() - 0.5) * spread, vy: (Math.random() - 0.8) * spread,
            life: 30 + Math.random() * 20, maxLife: 50, color, size: 2 + Math.random() * 4
        });
    }
}

function spawnBlood(x, y) {
    for (let i = 0; i < 8; i++) {
        bloodParticles.push({
            x, y, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 5,
            life: 20 + Math.random() * 15, maxLife: 35, size: 3 + Math.random() * 4
        });
    }
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 60 });
}

// Update
function update(dt) {
    if (gameState !== 'playing') return;
    
    gameTime += dt / 60;
    difficulty = 1 + gameTime / 30;

    // Player input
    const moveSpeed = 5;
    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -moveSpeed;
        player.facing = -1;
        player.runFrame += dt * 0.2;
    } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = moveSpeed;
        player.facing = 1;
        player.runFrame += dt * 0.2;
    } else {
        player.vx *= 0.8;
        player.runFrame = 0;
    }

    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
        player.vy = -14;
        player.onGround = false;
        playSound('jump');
    }

    // Shoot
    if (player.shootCooldown > 0) player.shootCooldown -= dt;
    if ((keys['KeyF'] || keys['KeyJ']) && player.shootCooldown <= 0) {
        player.shootCooldown = 12;
        const bx = player.x + (player.facing === 1 ? player.w : 0);
        const by = player.y + 20;
        bullets.push({ x: bx, y: by, vx: player.facing * 14, vy: 0, life: 60 });
        playSound('shoot');
        spawnParticles(bx, by, '#ffcc00', 3, 3);
    }

    // Physics
    player.vy += 0.7;
    player.x += player.vx;
    player.y += player.vy;

    if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }

    // Keep player in view
    if (player.x < camX + 50) player.x = camX + 50;
    if (player.x > camX + W - 100) player.x = camX + W - 100;

    // Camera follows player
    const targetCam = player.x - W * 0.3;
    camX += (targetCam - camX) * 0.08;
    if (camX < 0) camX = 0;

    // Invincibility
    if (player.invincible > 0) player.invincible -= dt;

    // Spawn zombies
    spawnTimer -= dt;
    const spawnRate = Math.max(30, 90 - difficulty * 12);
    if (spawnTimer <= 0) {
        spawnZombie();
        if (difficulty > 2 && Math.random() < 0.3) spawnZombie();
        if (difficulty > 4 && Math.random() < 0.3) spawnZombie();
        spawnTimer = spawnRate;
    }

    // Update zombies
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        if (z.hitFlash > 0) z.hitFlash -= dt;
        
        z.vx = -z.speed * (1 + difficulty * 0.1);
        z.x += z.vx;

        // Spitter shoots
        if (z.type === 'spitter') {
            z.spitTimer -= dt;
            if (z.spitTimer <= 0 && Math.abs(z.x - player.x) < 400) {
                const angle = Math.atan2(player.y + player.h/2 - (z.y + z.h/2), player.x - z.x);
                bullets.push({ x: z.x + z.w, y: z.y + 20, vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6, enemy: true, life: 90 });
                z.spitTimer = 150 + Math.random() * 60;
                playSound('hit');
            }
        }

        // Remove if too far left
        if (z.x < camX - 200) {
            zombies.splice(i, 1);
            continue;
        }

        // Collision with player
        if (player.invincible <= 0 && rectsOverlap(player, z)) {
            player.hp -= 20;
            player.invincible = 45;
            playSound('hurt');
            spawnBlood(player.x + player.w/2, player.y + player.h/2);
            if (player.hp <= 0) {
                gameState = 'gameover';
                playSound('die');
                try { 
                    if (score > highScore) { highScore = score; localStorage.setItem('zombieRunnerHigh', String(highScore)); }
                } catch(e) {}
            }
        }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life -= dt;
        if (b.life <= 0) { bullets.splice(i, 1); continue; }

        // Enemy bullet hitting player
        if (b.enemy) {
            if (player.invincible <= 0 && rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, {x:b.x-5,y:b.y-5,w:10,h:10})) {
                player.hp -= 10;
                player.invincible = 30;
                playSound('hurt');
                bullets.splice(i, 1);
                if (player.hp <= 0) {
                    gameState = 'gameover';
                    playSound('die');
                    try { 
                        if (score > highScore) { highScore = score; localStorage.setItem('zombieRunnerHigh', String(highScore)); }
                    } catch(e) {}
                }
            }
            continue;
        }

        // Player bullet hitting zombie
        for (let j = zombies.length - 1; j >= 0; j--) {
            const z = zombies[j];
            if (rectsOverlap({x:b.x-4,y:b.y-4,w:8,h:8}, z)) {
                z.hp--;
                z.hitFlash = 6;
                bullets.splice(i, 1);
                playSound('hit');
                spawnBlood(z.x + z.w/2, z.y + z.h/2);
                if (z.hp <= 0) {
                    const pts = z.type === 'tank' ? 50 : z.type === 'runner' ? 30 : 10;
                    score += pts;
                    addFloatingText(z.x + z.w/2, z.y, '+' + pts, '#ffcc00');
                    spawnParticles(z.x + z.w/2, z.y + z.h/2, '#4a7', 8, 5);
                    zombies.splice(j, 1);
                }
                break;
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.2;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        const p = bloodParticles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.3;
        p.life -= dt;
        if (p.life <= 0) bloodParticles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.y -= 1;
        t.life -= dt;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }

    // Score over time
    if (Math.floor(gameTime * 10) !== Math.floor((gameTime + dt/60) * 10)) {
        score += 1;
    }
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Draw
function draw() {
    groundY = H * GROUND_Y_RATIO;
    
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, '#1a1a2e');
    skyGrad.addColorStop(1, '#3d2b4f');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 50; i++) {
        const sx = ((i * 137 + 53) % W);
        const sy = ((i * 97 + 31) % (groundY - 80));
        const size = (i % 3 === 0) ? 2 : 1;
        ctx.globalAlpha = 0.4 + (Math.sin(gameTime * 2 + i) + 1) * 0.3;
        ctx.fillRect(sx, sy, size, size);
    }
    ctx.globalAlpha = 1;

    // Moon
    ctx.fillStyle = '#e8dcc8';
    ctx.beginPath();
    ctx.arc(W * 0.8, H * 0.12, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(W * 0.8 + 12, H * 0.12 - 8, 28, 0, Math.PI * 2);
    ctx.fill();

    // Background buildings (parallax)
    drawBuildings();

    // Ground
    ctx.fillStyle = '#3d3d1e';
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = '#4a4a2a';
    for (let i = 0; i < W / 40 + 1; i++) {
        const gx = (i * 40 - camX * 0.5 % 40);
        ctx.fillRect(gx, groundY, 38, 3);
    }

    // Draw zombies
    for (const z of zombies) {
        drawZombie(z);
    }

    // Draw player
    if (gameState === 'playing' || gameState === 'gameover') {
        drawPlayer();
    }

    // Draw bullets
    for (const b of bullets) {
        if (b.enemy) {
            ctx.fillStyle = '#66ff66';
            ctx.beginPath();
            ctx.arc(b.x - camX, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(b.x - camX - 4, b.y - 2, 10, 4);
        }
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camX, p.y, p.size, p.size);
    }
    for (const p of bloodParticles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = '#cc2200';
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Floating texts
    for (const t of floatingTexts) {
        ctx.globalAlpha = t.life / 60;
        ctx.fillStyle = t.color;
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x - camX, t.y);
    }
    ctx.globalAlpha = 1;

    // HUD
    if (gameState === 'playing') {
        drawHUD();
    }

    // Start screen
    if (gameState === 'start') {
        drawStartScreen();
    }

    // Game over
    if (gameState === 'gameover') {
        drawGameOver();
    }
}

function drawBuildings() {
    const parallax = camX * 0.3;
    ctx.fillStyle = '#2a2a3e';
    for (let i = 0; i < 12; i++) {
        const bx = ((i * 180 + 40) - parallax % (180 * 12));
        const bh = 80 + (i * 67 % 120);
        ctx.fillRect(bx, groundY - bh, 80, bh);
        // Windows
        ctx.fillStyle = '#554422';
        for (let wy = 0; wy < bh - 20; wy += 25) {
            for (let wx = 10; wx < 70; wx += 25) {
                if ((i + wx + wy) % 3 !== 0) {
                    ctx.fillRect(bx + wx, groundY - bh + 10 + wy, 12, 14);
                }
            }
        }
        ctx.fillStyle = '#2a2a3e';
    }
}

function drawPlayer() {
    const px = player.x - camX;
    const py = player.y;
    
    if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;

    // Body
    ctx.fillStyle = '#3366cc';
    ctx.fillRect(px + 8, py + 16, 20, 24);
    
    // Head
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(px + 10, py, 16, 16);
    
    // Eyes
    ctx.fillStyle = '#000';
    if (player.facing === 1) {
        ctx.fillRect(px + 20, py + 5, 3, 3);
    } else {
        ctx.fillRect(px + 13, py + 5, 3, 3);
    }
    
    // Legs animation
    const legOffset = Math.sin(player.runFrame * 0.3) * (Math.abs(player.vx) > 1 ? 6 : 0);
    ctx.fillStyle = '#2244aa';
    ctx.fillRect(px + 8, py + 40, 8, 12 + legOffset * 0.5);
    ctx.fillRect(px + 20, py + 40, 8, 12 - legOffset * 0.5);

    // Gun
    ctx.fillStyle = '#666';
    if (player.facing === 1) {
        ctx.fillRect(px + 28, py + 22, 14, 5);
    } else {
        ctx.fillRect(px - 4, py + 22, 14, 5);
    }
}

function drawZombie(z) {
    const zx = z.x - camX;
    const zy = z.y;
    
    let bodyColor = '#4a7a3a';
    if (z.type === 'tank') bodyColor = '#2a5a4a';
    if (z.type === 'runner') bodyColor = '#6a9a4a';
    if (z.hitFlash > 0) bodyColor = '#ffffff';

    // Body
    ctx.fillStyle = bodyColor;
    ctx.fillRect(zx + 4, zy + 14, z.w - 8, z.h - 26);
    
    // Head
    ctx.fillStyle = '#5a8a4a';
    if (z.hitFlash > 0) ctx.fillStyle = '#fff';
    ctx.fillRect(zx + 6, zy, z.w - 12, 14);
    
    // Eyes (red)
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(zx + 8, zy + 4, 4, 4);
    ctx.fillRect(zx + z.w - 14, zy + 4, 4, 4);
    
    // Arms (reaching forward)
    ctx.fillStyle = bodyColor;
    if (z.hitFlash > 0) ctx.fillStyle = '#fff';
    const armBob = Math.sin(gameTime * 5 + z.x) * 3;
    ctx.fillRect(zx - 10, zy + 20 + armBob, 12, 6);
    ctx.fillRect(zx - 8, zy + 30 - armBob, 12, 6);

    // Legs
    const legAnim = Math.sin(gameTime * 4 + z.x * 0.1) * 4;
    ctx.fillRect(zx + 6, zy + z.h - 12, 8, 12 + legAnim * 0.3);
    ctx.fillRect(zx + z.w - 14, zy + z.h - 12, 8, 12 - legAnim * 0.3);

    // HP bar for tanks
    if (z.maxHp > 1) {
        ctx.fillStyle = '#333';
        ctx.fillRect(zx, zy - 10, z.w, 5);
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(zx, zy - 10, z.w * (z.hp / z.maxHp), 5);
    }
}

function drawHUD() {
    // Health bar
    ctx.fillStyle = '#333';
    ctx.fillRect(20, 20, 200, 24);
    const hpRatio = player.hp / player.maxHp;
    const hpColor = hpRatio > 0.5 ? '#44cc44' : hpRatio > 0.25 ? '#ffcc00' : '#ff4444';
    ctx.fillStyle = hpColor;
    ctx.fillRect(20, 20, 200 * hpRatio, 24);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, 200, 24);
    
    // HP text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('HP', 75, 36);

    // Score
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffcc00';
    ctx.fillText('SCORE: ' + score, W - 20, 38);

    // High score
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('HI: ' + Math.max(highScore, score), W - 20, 58);

    // Wave/difficulty indicator
    ctx.textAlign = 'left';
    ctx.font = '14px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('WAVE: ' + Math.floor(difficulty), 20, 60);
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#4a7a3a';
    ctx.font = 'bold 60px monospace';
    ctx.fillText('ZOMBIE RUNNER', W/2, H * 0.25);

    ctx.fillStyle = '#ffcc00';
    ctx.font = '20px monospace';
    ctx.fillText('Survive the undead horde!', W/2, H * 0.35);

    ctx.fillStyle = '#ccc';
    ctx.font = '16px monospace';
    const lines = [
        'A / D or ← → : Move',
        'W / ↑ / SPACE : Jump',
        'F or J : Shoot',
        '',
        'Don\'t let zombies touch you!',
        'Kill zombies to score points.',
        ''
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H * 0.45 + i * 28);
    });

    // Blinking prompt
    if (Math.floor(gameTime * 2) % 2 === 0 || gameTime < 3) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('PRESS ENTER TO START', W/2, H * 0.85);
    }

    if (highScore > 0) {
        ctx.fillStyle = '#888';
        ctx.font = '16px monospace';
        ctx.fillText('HIGH SCORE: ' + highScore, W/2, H * 0.92);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff3333';
    ctx.font = 'bold 50px monospace';
    ctx.fillText('YOU DIED', W/2, H * 0.3);

    ctx.fillStyle = '#ffcc00';
    ctx.font = '24px monospace';
    ctx.fillText('Score: ' + score, W/2, H * 0.45);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff8800';
        ctx.font = '20px monospace';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H * 0.53);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    ctx.fillText('High Score: ' + Math.max(highScore, score), W/2, H * 0.62);

    if (Math.floor(gameTime * 2) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('PRESS ENTER OR R TO RESTART', W/2, H * 0.8);
    }
}

// Main loop
let lastTime = 0;
let gameTime = 0;

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;

    if (gameState === 'playing') {
        update(dt);
    } else {
        gameTime += dt / 60;
    }

    draw();
    requestAnimationFrame(gameLoop);
}

groundY = H * GROUND_Y_RATIO;
resetPlayer();
requestAnimationFrame(gameLoop);
</script>
