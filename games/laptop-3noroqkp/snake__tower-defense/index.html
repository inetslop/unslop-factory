<!DOCTYPE html>
<html>
<head>
<title>Tower Snake Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace}
canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

let W,H,cellSize,cols,rows;
let game={state:'start',coins:150,wave:0,lives:20,score:0,snakes:[],towers:[],projectiles:[],particles:[],selectedTower:0,towerTimer:0};
let lastTime=0;

const TOWER_TYPES=[
{name:'Basic',cost:50,damage:15,range:2.5,fireRate:1,color:'#4fc3f7',icon:'▲'},
{name:'Rapid',cost:100,damage:8,range:2,fireRate:3,color:'#ff9800',icon:'◆'},
{name:'Cannon',cost:150,damage:35,range:3.2,fireRate:0.45,color:'#e91e63',icon:'●'}
];

const PATH_CELLS=[
[0,2],[1,2],[2,2],[3,2],[4,2],
[4,3],[4,4],[4,5],
[3,5],[2,5],[1,5],
[1,6],[1,7],[1,8],
[2,8],[3,8],[4,8],[5,8],[6,8],
[6,7],[6,6],[6,5],[6,4],[6,3],
[7,3],[8,3],[9,3],[10,3],
[10,4],[10,5],[10,6],[10,7],
[11,7],[12,7],[13,7],[14,7]
];

const WAYPOINTS=[];
function initWaypoints(){
WAYPOINTS.length=0;
PATH_CELLS.forEach((c,i)=>{
if(i===0||i===PATH_CELLS.length-1){WAYPOINTS.push(c);}
else{
let prev=PATH_CELLS[i-1];
let next=PATH_CELLS[i+1]||null;
let cur=PATH_CELLS[i];
if(!next||(cur[0]!==prev[0])!==(next?next[0]!==cur[0]:true)||(cur[1]!==prev[1])!==(next?next[1]!==cur[1]:true)){
WAYPOINTS.push(c);
}}});
}

function resize(){
W=window.innerWidth;H=window.innerHeight;
canvas.width=W;canvas.height=H;
let topBar=60;
cellSize=Math.floor(Math.min((W-20)/(cols||15),(H-topBar-20)/(rows||10)));
cellSize=Math.min(cellSize,70);
}

function initGrid(){
cols=15;rows=10;
resize();
initWaypoints();
}

function cellCenter(c){return{x:c[0]*cellSize+cellSize/2+10,y:c[1]*cellSize+cellSize/2+70};}

function isPathCell(x,y){return PATH_CELLS.some(c=>c[0]===x&&c[1]===y);}
function hasTower(x,y){return game.towers.some(t=>t.gx===x&&t.gy===y);}

function spawnSnake(hpMult,spd){
let wp=WAYPOINTS.map(w=>cellCenter(w));
let snake={
head:{x:wp[0].x-20,y:wp[0].y,hp:50*hpMult,maxHp:50*hpMult,speed:spd*(1+Math.random()*0.3)},
body:[],
waypoints:wp,
wpIndex:0,
alive:true,
dead:false,
bodyFade:0,
size:cellSize*0.35
};
for(let i=0;i<8;i++)snake.body.push({x:snake.head.x,y:snake.head.y});
game.snakes.push(snake);
}

function updateSnakes(dt){
for(let s of game.snakes){
if(!s.alive)continue;
let wp=s.waypoints[s.wpIndex];
let dx=wp.x-s.head.x,dy=wp.y-s.head.y;
let dist=Math.sqrt(dx*dx+dy*dy);
if(dist<3){s.wpIndex++;if(s.wpIndex>=s.waypoints.length){s.alive=false;s.dead=true;game.lives--;continue;}}
else{let sp=s.head.speed*dt;s.head.x+=dx/dist*sp;s.head.y+=dy/dist*sp;}
// body follow
for(let i=0;i<s.body.length;i++){
let target=i===0?s.head:s.body[i-1];
let bdx=target.x-s.body[i].x,bdy=target.y-s.body[i].y;
let bd=Math.sqrt(bdx*bdx+bdy*bdy);
if(bd>2){let sp=s.head.speed*dt;s.body[i].x+=bdx/bd*sp;s.body[i].y+=bdy/bd*sp;}
}
if(s.head.hp<=0&&!s.dead){s.alive=false;s.dead=true;game.coins+=15+Math.floor(game.wave*2);game.score+=10;}
}
game.snakes=game.snakes.filter(s=>{
if(!s.alive&&s.dead){
if(s.bodyFade<1){s.bodyFade+=dt*0.5;return s.bodyFade<1;}
return false;
}
return true;
});
}

function updateTowers(dt){
for(let t of game.towers){
t.cooldown-=dt;
if(t.cooldown>0)continue;
let best=null,bestDist=Infinity;
let tr={x:t.gx*cellSize+cellSize/2+10,y:t.gy*cellSize+cellSize/2+70};
for(let s of game.snakes){
if(!s.alive||s.dead)continue;
let dx=s.head.x-tr.x,dy=s.head.y-tr.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d<t.range*cellSize&&d<bestDist){best=s;bestDist=d;}
}
if(best){
t.cooldown=1/t.fireRate;
let bx=tr.x,by=tr.y;
let dx=best.head.x-bx,dy=best.head.y-by;
let d=Math.sqrt(dx*dx+dy*dy);
game.projectiles.push({x:bx,y:by,vx:dx/d*300,vy:dy/d*300,damage:t.damage,target:best,color:TOWER_TYPES[t.type].color,splash:t.type===2});
}
}
}

function updateProjectiles(dt){
for(let p of game.projectiles){
p.x+=p.vx*dt;p.y+=p.vy*dt;
let hit=false;
for(let s of game.snakes){
if(!s.alive||s.dead)continue;
let dx=p.x-s.head.x,dy=p.y-s.head.y;
if(Math.sqrt(dx*dx+dy*dy)<cellSize*0.35){
s.head.hp-=p.damage;hit=true;
if(p.splash){for(let s2 of game.snakes){if(s2===s||!s2.alive)continue;let dx2=p.x-s2.head.x,dy2=p.y-s2.head.y;if(Math.sqrt(dx2*dx2+dy2*dy2)<cellSize*0.6)s2.head.hp-=p.damage*0.5;}}
game.particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*100,vy:(Math.random()-0.5)*100,life:0.4,color:p.color,size:3});
break;
}
}
if(hit)p.dead=true;
if(p.x<-20||p.x>W+20||p.y<-20||p.y>H+20)p.dead=true;
}
game.projectiles=game.projectiles.filter(p=>!p.dead);
}

function updateParticles(dt){
for(let p of game.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
game.particles=game.particles.filter(p=>p.life>0);
}

let waveTimer=0;let snakesToSpawn=0;let spawnInterval=1.5;let hpMult=1;let spd=60;

function startWave(){
game.wave++;
snakesToSpawn=3+game.wave*2;
hpMult=1+(game.wave-1)*0.4;
spd=60+game.wave*8;
spawnInterval=Math.max(0.5,1.5-game.wave*0.1);
waveTimer=0;
}

function updateWaves(dt){
if(snakesToSpawn>0){
waveTimer+=dt;
if(waveTimer>=spawnInterval){waveTimer=0;snakesToSpawn--;spawnSnake(hpMult,spd);}
}else{
if(game.snakes.length===0&&game.state==='playing'){
game.coins+=25+game.wave*5;
setTimeout(()=>{if(game.state==='playing')startWave();},2000);
}
}
}

function draw(){
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
let ox=10,oy=70;

// Draw grid
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
let px=ox+x*cellSize,py=oy+y*cellSize;
if(isPathCell(x,y)){ctx.fillStyle='#5d4037';}
else{ctx.fillStyle=(x+y)%2===0?'#2e7d32':'#1b5e20';}
ctx.fillRect(px,py,cellSize-1,cellSize-1);
}

// Draw path direction arrows
ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2;
for(let i=0;i<PATH_CELLS.length-1;i++){
let a=cellCenter(PATH_CELLS[i]),b=cellCenter(PATH_CELLS[i+1]);
ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}

// Draw towers
for(let t of game.towers){
let cx=t.gx*cellSize+cellSize/2+ox,cy=t.gy*cellSize+cellSize/2+oy;
ctx.fillStyle=TOWER_TYPES[t.type].color;
ctx.beginPath();
if(t.type===0){ctx.moveTo(cx,cy-cellSize*0.3);ctx.lineTo(cx-cellSize*0.25,cy+cellSize*0.2);ctx.lineTo(cx+cellSize*0.25,cy+cellSize*0.2);ctx.closePath();}
else if(t.type===1){ctx.moveTo(cx,cy-cellSize*0.3);ctx.lineTo(cx+cellSize*0.25,cy);ctx.lineTo(cx,cy+cellSize*0.25);ctx.lineTo(cx-cellSize*0.25,cy);ctx.closePath();}
else{ctx.arc(cx,cy,cellSize*0.28,0,Math.PI*2);}
ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
}

// Draw range for selected tower type on hover
if(game.hoverCell){let hx=game.hoverCell[0],hy=game.hoverCell[1];let cx=hx*cellSize+cellSize/2+ox,cy=hy*cellSize+cellSize/2+oy;ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,TOWER_TYPES[game.selectedTower].range*cellSize,0,Math.PI*2);ctx.stroke();}

// Draw snakes
for(let s of game.snakes){
if(!s.alive&&s.dead){continue;}
let alpha=s.dead?1-s.bodyFade:1;
ctx.globalAlpha=alpha;
// body
for(let i=s.body.length-1;i>=0;i--){
let b=s.body[i];
let sz=s.size*(1-i*0.05);
ctx.fillStyle=`hsl(${120+i*3},${60-i*2}%,${45-i*2}%)`;
ctx.beginPath();ctx.arc(b.x,b.y,sz,0,Math.PI*2);ctx.fill();
}
// head
let hx=s.head.x,hy=s.head.y;
ctx.fillStyle='#f44336';
ctx.beginPath();ctx.arc(hx,hy,s.size*1.1,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(hx-3,hy-3,3,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(hx+3,hy-3,3,0,Math.PI*2);ctx.fill();
// HP bar
let bw=cellSize*0.7,bh=6;
ctx.fillStyle='#333';ctx.fillRect(hx-bw/2,hy-s.size*1.5,bw,bh);
ctx.fillStyle=s.head.hp/s.head.maxHp>0.5?'#4caf50':'#f44336';
ctx.fillRect(hx-bw/2,hy-s.size*1.5,bw*(s.head.hp/s.head.maxHp),bh);
ctx.globalAlpha=1;
}

// Draw projectiles
for(let p of game.projectiles){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();}

// Draw particles
for(let p of game.particles){ctx.globalAlpha=p.life/0.4;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size,p.y-p.size,p.size*2,p.size*2);}
ctx.globalAlpha=1;

// UI Top bar
ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,oy);
ctx.fillStyle='#fff';ctx.font='bold 14px monospace';
ctx.fillText(`💰 ${game.coins}`,20,25);
ctx.fillText(`❤️ ${game.lives}`,140,25);
ctx.fillText(`🌊 Wave ${game.wave}`,260,25);
ctx.fillText(`⭐ ${game.score}`,400,25);

// Tower selection
let tx=500;
for(let i=0;i<TOWER_TYPES.length;i++){
let sel=i===game.selectedTower;
ctx.fillStyle=sel?'rgba(255,255,255,0.2)':'rgba(0,0,0,0.3)';
ctx.fillRect(tx-4,8,120,44);
ctx.fillStyle=TOWER_TYPES[i].color;
ctx.font='bold 12px monospace';
ctx.fillText(`${TOWER_TYPES[i].icon} ${TOWER_TYPES[i].name}`,tx+5,22);
ctx.fillStyle='#aaa';ctx.font='11px monospace';
ctx.fillText(`$${TOWER_TYPES[i].cost} | DMG:${TOWER_TYPES[i].damage} | RNG:${TOWER_TYPES[i].range}`,tx+5,38);
tx+=130;
}

// Hover highlight
if(game.hoverCell&&game.state==='playing'){
let[hx,hy]=game.hoverCell;
if(!isPathCell(hx,hy)&&!hasTower(hx,hy)){
ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;
ctx.strokeRect(ox+hx*cellSize,oy+hy*cellSize,cellSize-1,cellSize-1);
}
}

// Start/End screens
if(game.state==='start'){
ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#4fc3f7';ctx.font='bold 36px monospace';ctx.textAlign='center';
ctx.fillText('🐍 TOWER SNAKE DEFENSE',W/2,H/2-80);
ctx.fillStyle='#fff';ctx.font='16px monospace';
ctx.fillText('Snakes slither along the path toward your base!',W/2,H/2-30);
ctx.fillText('Place towers on grass cells to stop them.',W/2,H/2);
ctx.fillText('',W/2,H/2+20);
ctx.fillText('[1][2][3] - Select tower type',W/2,H/2+50);
ctx.fillText('[Click] - Place selected tower',W/2,H/2+75);
ctx.fillText('[Q] - Sell tower (50% refund)',W/2,H/2+100);
ctx.fillText('',W/2,H/2+120);
ctx.fillStyle='#4caf50';ctx.font='bold 20px monospace';
ctx.fillText('Press [SPACE] to Start!',W/2,H/2+170);
ctx.textAlign='left';
}

if(game.state==='gameover'){
ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#f44336';ctx.font='bold 36px monospace';ctx.textAlign='center';
ctx.fillText('GAME OVER',W/2,H/2-40);
ctx.fillStyle='#fff';ctx.font='20px monospace';
ctx.fillText(`Final Score: ${game.score} | Waves Survived: ${game.wave}`,W/2,H/2+10);
ctx.fillStyle='#4caf50';ctx.font='bold 18px monospace';
ctx.fillText('Press [R] to Restart',W/2,H/2+60);
ctx.textAlign='left';
}

// Wave incoming text
if(game.state==='playing'&&snakesToSpawn===0&&game.snakes.length===0){
ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='16px monospace';ctx.textAlign='center';
ctx.fillText('Next wave incoming...',W/2,H-30);
ctx.textAlign='left';
}
}

function update(dt){
if(game.state!=='playing')return;
updateWaves(dt);
updateSnakes(dt);
updateTowers(dt);
updateProjectiles(dt);
updateParticles(dt);
if(game.lives<=0)game.state='gameover';
}

function loop(time){
let dt=Math.min((time-lastTime)/1000,0.05);lastTime=time;
update(dt);
draw();
requestAnimationFrame(loop);
}

function placeTower(gx,gy){
if(isPathCell(gx,gy)||hasTower(gx,gy))return;
let cost=TOWER_TYPES[game.selectedTower].cost;
if(game.coins<cost)return;
game.coins-=cost;
game.towers.push({gx,gy,type:game.selectedTower,cooldown:0,...TOWER_TYPES[game.selectedTower]});
}

function sellTower(gx,gy){
let idx=game.towers.findIndex(t=>t.gx===gx&&t.gy===gy);
if(idx>=0){game.coins+=Math.floor(TOWER_TYPES[game.towers[idx].type].cost*0.5);game.towers.splice(idx,1);}
}

function resetGame(){
game={state:'playing',coins:150,wave:0,lives:20,score:0,snakes:[],towers:[],projectiles:[],particles:[],selectedTower:0,towerTimer:0};
snakesToSpawn=0;waveTimer=0;
startWave();
}

let gameHoverCell=null;

canvas.addEventListener('mousemove',e=>{
let r=canvas.getBoundingClientRect();
let mx=e.clientX-r.left,my=e.clientY-r.top;
let gx=Math.floor((mx-10)/cellSize),gy=Math.floor((my-70)/cellSize);
game.hoverCell=(gx>=0&&gx<cols&&gy>=0&&gy<rows)?[gx,gy]:null;
});

canvas.addEventListener('click',e=>{
if(game.state!=='playing')return;
let r=canvas.getBoundingClientRect();
let mx=e.clientX-r.left,my=e.clientY-r.top;
let gx=Math.floor((mx-10)/cellSize),gy=Math.floor((my-70)/cellSize);
if(gx>=0&&gx<cols&&gy>=0&&gy<rows){placeTower(gx,gy);}
});

window.addEventListener('keydown',e=>{
if(e.key===' '||e.code==='Space'){
if(game.state==='start')resetGame();
else if(game.state==='gameover')resetGame();
}
if(e.key==='1'||e.key==='2'||e.key==='3')game.selectedTower=parseInt(e.key)-1;
if(e.key==='q'||e.key==='Q'){if(game.hoverCell)sellTower(game.hoverCell[0],game.hoverCell[1]);}
if(e.key==='r'||e.key==='R')resetGame();
});

window.addEventListener('resize',()=>{resize();});

initGrid();
lastTime=performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
