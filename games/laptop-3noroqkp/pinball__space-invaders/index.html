<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pinball Space Invaders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; width: 100vw; height: 100vh; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let level = 1;
let frameCount = 0;

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };
let ballLaunched = false;
let ballInPlay = false;

// Flippers
const flipperLength = 70;
const flipperWidth = 14;
let leftFlipper = { angle: 0.4, targetAngle: 0.4, activeAngle: -0.6 };
let rightFlipper = { angle: Math.PI - 0.4, targetAngle: Math.PI - 0.4, activeAngle: Math.PI + 0.6 };

// Bumpers
let bumpers = [];

// Invaders
let invaders = [];
const invaderRows = 5;
const invaderCols = 10;
let invaderW = 24;
let invaderH = 20;
let invaderSpacingX = 36;
let invaderSpacingY = 32;

// Particles
let particles = [];

// Stars background
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1 });
    }
}

function initLevel() {
    ballLaunched = false;
    ballInPlay = false;
    ball.x = W / 2;
    ball.y = H - 60;
    ball.vx = 0;
    ball.vy = 0;

    // Bumpers
    bumpers = [
        { x: W * 0.3, y: H * 0.45, r: 22 },
        { x: W * 0.7, y: H * 0.45, r: 22 },
        { x: W * 0.5, y: H * 0.35, r: 18 }
    ];

    // Invaders
    invaders = [];
    const startX = (W - (invaderCols * invaderSpacingX)) / 2;
    const startY = 60;
    for (let r = 0; r < invaderRows; r++) {
        for (let c = 0; c < invaderCols; c++) {
            invaders.push({
                x: startX + c * invaderSpacingX,
                y: startY + r * invaderSpacingY,
                w: invaderW,
                h: invaderH,
                alive: true,
                row: r,
                col: c,
                animFrame: 0
            });
        }
    }
}

function launchBall() {
    if (!ballLaunched) {
        ballLaunched = true;
        ballInPlay = true;
        ball.vy = -8;
        ball.vx = (Math.random() - 0.5) * 3;
        playSound(200, 0.1, 'sine', 0.15);
    }
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (gameState === 'start' && e.code === 'Space') {
        gameState = 'playing';
        score = 0;
        lives = 3;
        level = 1;
        initLevel();
    } else if (gameState === 'gameover' && e.code === 'Space') {
        gameState = 'start';
    } else if (gameState === 'win' && e.code === 'Space') {
        gameState = 'start';
    } else if (gameState === 'playing' && e.code === 'Space') {
        launchBall();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Update
function update() {
    frameCount++;

    // Flippers
    const leftActive = keys['ArrowLeft'] || keys['KeyA'];
    const rightActive = keys['ArrowRight'] || keys['KeyD'];
    leftFlipper.angle = leftActive ? leftFlipper.activeAngle : 0.4;
    rightFlipper.angle = rightActive ? rightFlipper.activeAngle : Math.PI - 0.4;

    if (!ballInPlay) return;

    // Gravity
    ball.vy += 0.35;

    // Move ball
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall collisions (simplified pinball table shape)
    const wallL = 20;
    const wallR = W - 20;
    const wallT = 10;

    if (ball.x - ball.r < wallL) { ball.x = wallL + ball.r; ball.vx = Math.abs(ball.vx) * 0.8; playSound(300, 0.05, 'square', 0.05); }
    if (ball.x + ball.r > wallR) { ball.x = wallR - ball.r; ball.vx = -Math.abs(ball.vx) * 0.8; playSound(300, 0.05, 'square', 0.05); }
    if (ball.y - ball.r < wallT) { ball.y = wallT + ball.r; ball.vy = Math.abs(ball.vy) * 0.8; playSound(300, 0.05, 'square', 0.05); }

    // Bumper collisions
    for (let b of bumpers) {
        let dx = ball.x - b.x;
        let dy = ball.y - b.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < ball.r + b.r) {
            let nx = dx / dist;
            let ny = dy / dist;
            ball.x = b.x + nx * (ball.r + b.r);
            ball.y = b.y + ny * (ball.r + b.r);
            let dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            ball.vx *= 1.1;
            ball.vy *= 1.1;
            playSound(500, 0.1, 'sine', 0.2);
            spawnParticles(b.x + nx * b.r, b.y + ny * b.r, '#ff0');
        }
    }

    // Flipper collisions
    collideFlipper(leftFlipper, true);
    collideFlipper(rightFlipper, false);

    // Invader collisions
    for (let inv of invaders) {
        if (!inv.alive) continue;
        if (rectCircleCollision(inv.x - inv.w/2, inv.y - inv.h/2, inv.w, inv.h, ball.x, ball.y, ball.r)) {
            inv.alive = false;
            score += (inv.row + 1) * 10;
            playSound(800 - inv.row * 100, 0.15, 'square', 0.2);
            spawnParticles(inv.x, inv.y, '#0f0');
            // Bounce ball slightly
            ball.vy = -Math.abs(ball.vy) * 0.7;
            break; // one at a time
        }
    }

    // Check if all invaders dead
    if (invaders.every(i => !i.alive)) {
        level++;
        gameState = 'win';
        playSound(600, 0.3, 'sine', 0.2);
        setTimeout(() => playSound(800, 0.3, 'sine', 0.2), 150);
        setTimeout(() => playSound(1000, 0.4, 'sine', 0.2), 300);
        return;
    }

    // Ball lost (falls below)
    if (ball.y > H + 50) {
        lives--;
        ballInPlay = false;
        ballLaunched = false;
        playSound(100, 0.3, 'sawtooth', 0.2);
        if (lives <= 0) {
            gameState = 'gameover';
        } else {
            ball.x = W / 2;
            ball.y = H - 60;
            ball.vx = 0;
            ball.vy = 0;
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Animate invaders
    for (let inv of invaders) {
        if (inv.alive) inv.animFrame = Math.floor(frameCount / 30) % 2;
    }
}

function collideFlipper(flipper, isLeft) {
    let baseX = isLeft ? W * 0.2 : W * 0.8;
    let baseY = H - 40;

    // Tip position
    let tipX = baseX + Math.cos(flipper.angle) * flipperLength;
    let tipY = baseY + Math.sin(flipper.angle) * flipperLength;

    // Line segment to circle collision
    let dx = tipX - baseX;
    let dy = tipY - baseY;
    let len2 = dx * dx + dy * dy;
    if (len2 === 0) return;

    let t = ((ball.x - baseX) * dx + (ball.y - baseY) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    let closestX = baseX + t * dx;
    let closestY = baseY + t * dy;

    let ddx = ball.x - closestX;
    let ddy = ball.y - closestY;
    let dist = Math.sqrt(ddx * ddx + ddy * ddy);

    if (dist < ball.r + flipperWidth / 2) {
        let nx = ddx / dist || 0;
        let ny = ddy / dist || 0;
        ball.x = closestX + nx * (ball.r + flipperWidth / 2);
        ball.y = closestY + ny * (ball.r + flipperWidth / 2);

        // Add flipper velocity boost
        let flipSpeed = isLeft ? -1 : 1;
        if ((isLeft && keys['ArrowLeft']) || (!isLeft && keys['ArrowRight'])) {
            ball.vy = -12;
            ball.vx += (isLeft ? -3 : 3);
            playSound(400, 0.05, 'sine', 0.15);
        }

        let dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
        }
    }
}

function rectCircleCollision(rx, ry, rw, rh, cx, cy, cr) {
    let closestX = Math.max(rx, Math.min(cx, rx + rw));
    let closestY = Math.max(ry, Math.min(cy, ry + rh));
    let dx = cx - closestX;
    let dy = cy - closestY;
    return (dx * dx + dy * dy) < cr * cr;
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 3 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 20, color });
    }
}

// Draw
function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#fff';
    for (let s of stars) {
        ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.02 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    // Walls
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(20, 10, W - 40, H - 70);

    // Bumpers
    for (let b of bumpers) {
        let grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, '#ff6600');
        grad.addColorStop(1, '#ff3300');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Invaders
    for (let inv of invaders) {
        if (!inv.alive) continue;
        drawInvader(inv);
    }

    // Flippers
    drawFlipper(leftFlipper, true);
    drawFlipper(rightFlipper, false);

    // Ball
    if (ballInPlay || !ballLaunched) {
        let grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.r);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(1, '#88ccff');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 20;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 30, H - 20);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVES: ${'❤'.repeat(lives)}`, W - 30, H - 20);

    if (!ballLaunched && gameState === 'playing') {
        ctx.fillStyle = '#ff0';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PRESS SPACE TO LAUNCH', W / 2, H - 90);
    }

    if (gameState === 'gameover') {
        drawOverlay('GAME OVER', `Final Score: ${score}`);
    }
    if (gameState === 'win') {
        drawOverlay('LEVEL CLEAR!', `Score: ${score} - Press SPACE`);
    }
}

function drawInvader(inv) {
    let x = inv.x;
    let y = inv.y;
    let w = inv.w;
    let h = inv.h;
    let f = inv.animFrame;

    // Color based on row
    let colors = ['#00ff88', '#00ffcc', '#44ffff', '#88ffff', '#ffffff'];
    ctx.fillStyle = colors[inv.row] || '#fff';

    // Simple invader shape
    if (f === 0) {
        // Frame 1 - wide
        ctx.fillRect(x - w/2 + 2, y - h/2, 4, 6);
        ctx.fillRect(x + w/2 - 6, y - h/2, 4, 6);
        ctx.fillRect(x - w/2, y - h/2 + 6, w, 4);
        ctx.fillRect(x - w/2 + 2, y - h/2 + 10, 4, 4);
        ctx.fillRect(x + w/2 - 6, y - h/2 + 10, 4, 4);
    } else {
        // Frame 2 - narrow
        ctx.fillRect(x - w/2 + 4, y - h/2, 4, 6);
        ctx.fillRect(x + w/2 - 8, y - h/2, 4, 6);
        ctx.fillRect(x - w/2 + 2, y - h/2 + 6, w - 4, 4);
        ctx.fillRect(x - w/2 + 2, y - h/2 + 10, 4, 4);
        ctx.fillRect(x + w/2 - 6, y - h/2 + 10, 4, 4);
    }
}

function drawFlipper(flipper, isLeft) {
    let baseX = isLeft ? W * 0.2 : W * 0.8;
    let baseY = H - 40;
    let tipX = baseX + Math.cos(flipper.angle) * flipperLength;
    let tipY = baseY + Math.sin(flipper.angle) * flipperLength;

    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = flipperWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(baseX, baseY);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();

    // Base joint
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(baseX, baseY, 8, 0, Math.PI * 2);
    ctx.fill();
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PINBALL', W/2, H/3 - 20);
    ctx.fillStyle = '#0f8';
    ctx.fillText('SPACE INVADERS', W/2, H/3 + 30);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('← → or A D : Flippers', W/2, H/2 + 20);
    ctx.fillText('SPACE : Launch Ball', W/2, H/2 + 50);
    ctx.fillText('Clear all invaders to win!', W/2, H/2 + 90);

    ctx.fillStyle = '#ff0';
    ctx.font = '18px monospace';
    let blink = Math.sin(frameCount * 0.08) > 0;
    if (blink) ctx.fillText('PRESS SPACE TO START', W/2, H * 0.75);
}

function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(title, W/2, H/2 - 20);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(subtitle, W/2, H/2 + 30);
}

// Game loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initStars();
initLevel();
gameLoop();
</script>
</body>
</html>
