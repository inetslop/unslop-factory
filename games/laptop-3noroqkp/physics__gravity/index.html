<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Flip</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, type, duration, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function sfxFlip() { playSound(300, 'sine', 0.15, 0.2); }
function sfxCoin() { playSound(800, 'square', 0.1, 0.15); setTimeout(() => playSound(1200, 'square', 0.15, 0.15), 50); }
function sfxDie() { playSound(150, 'sawtooth', 0.4, 0.3); }
function sfxWin() { playSound(600, 'sine', 0.1, 0.2); setTimeout(() => playSound(800, 'sine', 0.1, 0.2), 100); setTimeout(() => playSound(1000, 'sine', 0.3, 0.2), 200); }
function sfxBounce() { playSound(200, 'triangle', 0.05, 0.1); }

// Game State
const STATE = { MENU: 0, PLAYING: 1, DEAD: 2, WIN: 3, GAMEOVER: 4 };
let gameState = STATE.MENU;
let score = 0;
let totalCoins = 0;
let collectedCoins = 0;
let levelIndex = 0;
let particles = [];
let screenShake = 0;
let deathTimer = 0;
let winTimer = 0;

// Player
const player = { x: 0, y: 0, vx: 0, vy: 0, size: 24, rot: 0, gravityDir: 1 };

// Level definitions
const levels = [
    {
        platforms: [[0, 580, 900, 60], [700, 380, 200, 20], [400, 280, 150, 20], [100, 180, 120, 20]],
        spikes: [[200, 620, 80, 20], [500, 620, 60, 20]],
        coins: [[475, 250], [750, 350], [150, 150], [300, 580]],
        portal: { x: 820, y: 600 },
        start: { x: 50, y: 540 }
    },
    {
        platforms: [[0, 580, 400, 60], [500, 580, 400, 60], [200, 400, 100, 20], [500, 300, 200, 20], [700, 150, 150, 20], [0, 100, 150, 20]],
        spikes: [[400, 620, 100, 20], [300, 620, 80, 20]],
        coins: [[250, 370], [550, 270], [750, 120], [50, 70], [150, 550], [600, 550]],
        portal: { x: 820, y: 110 },
        start: { x: 50, y: 540 }
    },
    {
        platforms: [[0, 600, 900, 50], [100, 450, 80, 20], [300, 350, 80, 20], [500, 250, 80, 20], [700, 350, 80, 20], [100, 150, 200, 20]],
        spikes: [[400, 630, 100, 20], [600, 630, 100, 20], [200, 480, 60, 20]],
        coins: [[140, 420], [340, 320], [540, 220], [740, 320], [200, 120], [50, 570], [800, 570]],
        portal: { x: 200, y: 110 },
        start: { x: 50, y: 560 }
    },
    {
        platforms: [[0, 580, 200, 60], [300, 480, 150, 20], [550, 380, 150, 20], [750, 280, 150, 20], [400, 180, 200, 20], [0, 50, 200, 20], [600, 50, 300, 20]],
        spikes: [[200, 620, 100, 20], [450, 510, 80, 20], [700, 410, 60, 20]],
        coins: [[350, 450], [600, 350], [800, 250], [450, 150], [100, 20], [700, 20], [50, 550]],
        portal: { x: 750, y: 10 },
        start: { x: 50, y: 540 }
    },
    {
        platforms: [[0, 600, 900, 40], [50, 480, 80, 15], [200, 380, 80, 15], [350, 280, 80, 15], [500, 180, 80, 15], [650, 280, 80, 15], [750, 400, 100, 15], [100, 100, 300, 15], [500, 50, 400, 15]],
        spikes: [[300, 620, 150, 20], [550, 620, 100, 20], [150, 410, 40, 15], [420, 310, 40, 15]],
        coins: [[90, 450], [240, 350], [390, 250], [540, 150], [690, 250], [800, 370], [200, 70], [700, 20], [450, 580]],
        portal: { x: 830, y: 10 },
        start: { x: 50, y: 560 }
    }
];

function loadLevel(idx) {
    const lvl = levels[idx];
    player.x = lvl.start.x;
    player.y = lvl.start.y;
    player.vx = 0;
    player.vy = 0;
    player.rot = 0;
    player.gravityDir = 1;
    collectedCoins = 0;
    totalCoins = lvl.coins.length;
    particles = [];
}

function startGame() {
    initAudio();
    levelIndex = 0;
    score = 0;
    loadLevel(0);
    gameState = STATE.PLAYING;
}

function nextLevel() {
    levelIndex++;
    if (levelIndex >= levels.length) {
        gameState = STATE.GAMEOVER;
        return;
    }
    loadLevel(levelIndex);
    gameState = STATE.PLAYING;
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (gameState === STATE.MENU && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === STATE.PLAYING) {
        if ((e.code === 'ArrowUp' || e.code === 'KeyW') && player.gravityDir === 1) {
            player.gravityDir = -1;
            sfxFlip();
            spawnParticles(player.x, player.y, 5, '#4fc3f7');
        } else if ((e.code === 'ArrowDown' || e.code === 'KeyS') && player.gravityDir === -1) {
            player.gravityDir = 1;
            sfxFlip();
            spawnParticles(player.x, player.y, 5, '#4fc3f7');
        }
        if (e.code === 'KeyR') loadLevel(levelIndex);
    }
    else if (gameState === STATE.DEAD) {
        if (e.code === 'Space' || e.code === 'Enter') {
            deathTimer = 0;
            loadLevel(levelIndex);
            gameState = STATE.PLAYING;
        }
    }
    else if (gameState === STATE.WIN) {
        if (e.code === 'Space' || e.code === 'Enter') nextLevel();
    }
    else if (gameState === STATE.GAMEOVER) {
        if (e.code === 'KeyR') startGame();
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + player.size / 2, y: y + player.size / 2,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            life: 1, color: color || '#ff9800'
        });
    }
}

function update(dt) {
    if (gameState !== STATE.PLAYING && gameState !== STATE.DEAD) return;

    if (gameState === STATE.DEAD) {
        deathTimer += dt;
        if (deathTimer > 1.5) { loadLevel(levelIndex); gameState = STATE.PLAYING; }
        updateParticles(dt);
        return;
    }

    const gravity = 1200 * player.gravityDir;
    const friction = 0.85;
    const maxSpeed = 400;

    // Input acceleration
    let accel = 600;
    if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= accel * dt;
    if (keys['ArrowRight'] || keys['KeyD']) player.vx += accel * dt;

    // Gravity
    player.vy += gravity * dt;
    player.vy = Math.max(Math.min(player.vy, maxSpeed), -maxSpeed);
    player.vx = Math.max(Math.min(player.vx, maxSpeed), -maxSpeed);

    // Damping
    if (!keys['ArrowLeft'] && !keys['KeyA'] && !keys['ArrowRight'] && !keys['KeyD']) {
        player.vx *= (1 - 2 * dt);
    }

    // Move & Collide
    const lvl = levels[levelIndex];
    const half = player.size / 2;

    // X movement
    player.x += player.vx * dt;
    for (const p of lvl.platforms) {
        if (player.x + player.size > p[0] && player.x < p[0] + p[2] &&
            player.y + player.size > p[1] && player.y < p[1] + p[3]) {
            if (player.vx > 0) player.x = p[0] - player.size;
            else if (player.vx < 0) player.x = p[0] + p[2];
            player.vx *= -0.3;
        }
    }

    // Y movement
    player.y += player.vy * dt;
    for (const p of lvl.platforms) {
        if (player.x + player.size > p[0] && player.x < p[0] + p[2] &&
            player.y + player.size > p[1] && player.y < p[1] + p[3]) {
            if (player.vy * player.gravityDir > 0) {
                player.y = player.gravityDir === 1 ? p[1] - player.size : p[1] + p[3];
                player.vy = 0;
                sfxBounce();
            } else {
                player.y = player.gravityDir === 1 ? p[1] - player.size : p[1] + p[3];
                player.vy = 0;
            }
        }
    }

    // World bounds
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x > W - player.size) { player.x = W - player.size; player.vx = 0; }
    if (player.y < -50 || player.y > H + 50) { killPlayer(); return; }

    // Spikes
    for (const s of lvl.spikes) {
        if (player.x + player.size > s[0] && player.x < s[0] + s[2] &&
            player.y + player.size > s[1] && player.y < s[1] + s[3]) {
            killPlayer(); return;
        }
    }

    // Coins
    lvl.coins = lvl.coins.filter(c => {
        const dx = (player.x + half) - c[0];
        const dy = (player.y + half) - c[1];
        if (Math.sqrt(dx * dx + dy * dy) < 25) {
            score += 10;
            collectedCoins++;
            sfxCoin();
            spawnParticles(c[0], c[1], 8, '#ffd700');
            return false;
        }
        return true;
    });

    // Portal
    const portal = lvl.portal;
    const pdx = (player.x + half) - portal.x;
    const pdy = (player.y + half) - portal.y;
    if (Math.sqrt(pdx * pdx + pdy * pdy) < 30) {
        sfxWin();
        score += 50;
        gameState = STATE.WIN;
        winTimer = 0;
        spawnParticles(portal.x, portal.y, 20, '#76ff03');
    }

    // Rotation
    player.rot += player.vx * dt * 0.05;

    updateParticles(dt);
}

function killPlayer() {
    sfxDie();
    screenShake = 10;
    spawnParticles(player.x + player.size / 2, player.y + player.size / 2, 15, '#ff5252');
    gameState = STATE.DEAD;
    deathTimer = 0;
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 300 * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function render() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    if (gameState === STATE.MENU) {
        renderMenu();
        return;
    }

    // Screen shake
    let sx = 0, sy = 0;
    if (screenShake > 0) {
        sx = (Math.random() - 0.5) * screenShake;
        sy = (Math.random() - 0.5) * screenShake;
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.save();
    ctx.translate(sx, sy);

    const lvl = levels[levelIndex];

    // Platforms
    for (const p of lvl.platforms) {
        ctx.fillStyle = '#3a3a5c';
        ctx.fillRect(p[0], p[1], p[2], p[3]);
        ctx.fillStyle = '#4a4a7c';
        ctx.fillRect(p[0], p[1], p[2], 4);
    }

    // Spikes
    for (const s of lvl.spikes) {
        ctx.fillStyle = '#ff5252';
        const spikeW = 15;
        const count = Math.floor(s[2] / spikeW);
        for (let i = 0; i < count; i++) {
            const bx = s[0] + i * spikeW;
            const by = s[3] > 0 ? s[1] : s[1] + s[3];
            ctx.beginPath();
            if (s[3] === 20 || s[3] === 15) {
                // Point up or down based on position
                ctx.moveTo(bx, by);
                ctx.lineTo(bx + spikeW / 2, by - (s[1] < H / 2 ? 15 : -15));
                ctx.lineTo(bx + spikeW, by);
            } else {
                ctx.moveTo(bx, by);
                ctx.lineTo(bx + spikeW / 2, by + 15);
                ctx.lineTo(bx + spikeW, by);
            }
            ctx.fill();
        }
    }

    // Coins
    const time = performance.now() / 1000;
    for (const c of lvl.coins) {
        const bob = Math.sin(time * 3 + c[0] * 0.1) * 4;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(c[0], c[1] + bob, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffecb3';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Portal
    const portal = lvl.portal;
    const pulse = 1 + Math.sin(time * 4) * 0.15;
    ctx.strokeStyle = '#76ff03';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(portal.x, portal.y, 20 * pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(118, 255, 3, 0.2)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(portal.x, portal.y, 12 * pulse, 0, Math.PI * 2);
    ctx.stroke();

    // Player
    if (gameState !== STATE.DEAD || deathTimer < 0.5) {
        ctx.save();
        ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
        ctx.rotate(player.rot);
        const g = player.size;
        // Body
        ctx.fillStyle = '#4fc3f7';
        ctx.fillRect(-g / 2, -g / 2, g, g);
        ctx.strokeStyle = '#81d4fa';
        ctx.lineWidth = 2;
        ctx.strokeRect(-g / 2, -g / 2, g, g);
        // Eyes
        ctx.fillStyle = '#fff';
        const eyeOff = player.gravityDir === 1 ? 4 : -4;
        ctx.beginPath();
        ctx.arc(-5, eyeOff, 3, 0, Math.PI * 2);
        ctx.arc(5, eyeOff, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${levelIndex + 1}/${levels.length}`, 20, 30);
    ctx.fillText(`Score: ${score}`, 20, 55);
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`Coins: ${collectedCoins}/${totalCoins}`, 20, 80);

    // Overlays
    if (gameState === STATE.WIN) {
        winTimer += 1/60;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#76ff03';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL COMPLETE!', W / 2, H / 2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 20);
        ctx.fillText('Press SPACE for next level', W / 2, H / 2 + 60);
    }

    if (gameState === STATE.GAMEOVER) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#76ff03';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('YOU WIN!', W / 2, H / 2 - 50);
        ctx.fillStyle = '#fff';
        ctx.font = '28px monospace';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 10);
        ctx.font = '20px monospace';
        ctx.fillText('Press R to play again', W / 2, H / 2 + 60);
    }

    if (gameState === STATE.DEAD) {
        ctx.fillStyle = `rgba(255,0,0,${Math.min(0.3, deathTimer)})`;
        ctx.fillRect(0, 0, W, H);
    }
}

function renderMenu() {
    const time = performance.now() / 1000;

    // Animated background
    for (let i = 0; i < 20; i++) {
        const x = ((i * 97 + time * 30) % W);
        const y = ((i * 53 + time * 20) % H);
        ctx.fillStyle = `rgba(79, 195, 247, ${0.1 + Math.sin(time + i) * 0.05})`;
        ctx.fillRect(x, y, 4, 4);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#4fc3f7';
    ctx.font = 'bold 64px monospace';
    const bounce = Math.sin(time * 2) * 5;
    ctx.fillText('GRAVITY', W / 2, H / 2 - 80 + bounce);
    ctx.fillStyle = '#76ff03';
    ctx.fillText('FLIP', W / 2, H / 2 - 20 + bounce);

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('← → or A D : Move', W / 2, H / 2 + 50);
    ctx.fillText('↑/W or ↓/S : Flip Gravity', W / 2, H / 2 + 80);
    ctx.fillText('R : Restart Level', W / 2, H / 2 + 110);
    ctx.fillStyle = '#ffd700';
    ctx.fillText('Collect coins & reach the portal!', W / 2, H / 2 + 150);

    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(time * 3) * 0.5})`;
    ctx.font = 'bold 24px monospace';
    ctx.fillText('Press SPACE to Start', W / 2, H / 2 + 210);

    // Gravity indicator animation
    const gIcon = Math.sin(time * 2) * 10;
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(W / 2 - 15, H / 2 + 250 + gIcon, 30, 30);
    ctx.strokeStyle = '#81d4fa';
    ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - 15, H / 2 + 250 + gIcon, 30, 30);

    // Arrow showing gravity direction
    const arrowDir = Math.sin(time * 2) > 0 ? 1 : -1;
    ctx.strokeStyle = '#76ff03';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W / 2, H / 2 + 250 + gIcon + (arrowDir === 1 ? 40 : -40));
    ctx.lineTo(W / 2, H / 2 + 250 + gIcon + (arrowDir === 1 ? 60 : -60));
    ctx.stroke();
    // Arrowhead
    const ay = H / 2 + 250 + gIcon + (arrowDir === 1 ? 60 : -60);
    ctx.beginPath();
    ctx.moveTo(W / 2, ay);
    ctx.lineTo(W / 2 - 8, ay - arrowDir * 12);
    ctx.lineTo(W / 2 + 8, ay - arrowDir * 12);
    ctx.closePath();
    ctx.fillStyle = '#76ff03';
    ctx.fill();
}

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
