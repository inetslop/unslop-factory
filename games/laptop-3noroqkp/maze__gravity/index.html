<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Gravity</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; width: 100%; height: 100%; }
#ui {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
display: flex; flex-direction: column; align-items: center; justify-content: center;
pointer-events: none; color: #fff;
}
#ui.active { pointer-events: all; }
.panel {
background: rgba(10,10,30,0.95); border: 2px solid #4a9eff; border-radius: 12px;
padding: 30px 50px; text-align: center; box-shadow: 0 0 30px rgba(74,158,255,0.3);
}
h1 { font-size: 2.5em; color: #4a9eff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(74,158,255,0.5); }
.controls { font-size: 0.95em; color: #aac; line-height: 1.8; margin: 15px 0; }
.btn {
display: inline-block; padding: 12px 35px; margin-top: 15px; background: #4a9eff;
color: #fff; border: none; border-radius: 6px; font-size: 1.1em; cursor: pointer;
transition: all 0.2s;
}
.btn:hover { background: #6ab0ff; transform: scale(1.05); }
#hud {
position: absolute; top: 10px; left: 10px; color: #aac; font-size: 14px;
pointer-events: none; text-shadow: 0 0 5px rgba(0,0,0,0.8);
}
#hud span { display: block; margin: 3px 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" class="active">
<div class="panel" id="startPanel">
<h1>MAZE GRAVITY</h1>
<p style="color:#aac;margin-bottom:10px;">Navigate the ball through the maze using gravity and kicks!</p>
<div class="controls">
<strong>WASD / Arrow Keys</strong> — Kick the ball<br>
Gravity pulls down. Time your kicks to reach the <span style="color:#ff6b6b;">exit</span>!<br>
Fewer kicks = better score.
</div>
<button class="btn" id="startBtn">START GAME</button>
</div>
<div class="panel" id="endPanel" style="display:none;">
<h1 id="endTitle">LEVEL COMPLETE!</h1>
<p id="endStats" style="color:#aac;margin:10px 0;"></p>
<button class="btn" id="nextBtn">NEXT LEVEL</button>
</div>
<div class="panel" id="gameOverPanel" style="display:none;">
<h1 style="color:#ff6b6b;">STUCK!</h1>
<p style="color:#aac;margin:10px 0;">You used too many kicks.</p>
<button class="btn" id="retryBtn">RETRY</button>
</div>
</div>
<div id="hud" style="display:none;">
<span id="levelInfo">Level 1</span>
<span id="kickInfo">Kicks: 0 / 30</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const startPanel = document.getElementById('startPanel');
const endPanel = document.getElementById('endPanel');
const gameOverPanel = document.getElementById('gameOverPanel');
const hud = document.getElementById('hud');
const levelInfo = document.getElementById('levelInfo');
const kickInfo = document.getElementById('kickInfo');

let W, H, scale;
let audioCtx = null;
let gameRunning = false;
let currentLevel = 1;
let kicksUsed = 0;
let maxKicks = 30;
let totalKicks = 0;
let particles = [];
let shakeTime = 0;
let shakeIntensity = 0;

// Ball physics
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 12 };
const GRAVITY = 0.35;
const FRICTION = 0.985;
const BOUNCE = 0.6;
const KICK_FORCE = 7;
const MAX_SPEED = 14;

let maze = [];
let mazeCols = 12, mazeRows = 12;
let cellSize = 40;
let mazeOffsetX = 0, mazeOffsetY = 0;
let exitPos = { x: 0, y: 0 };
let entrancePos = { x: 0, y: 0 };

function resize() {
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
scale = Math.min(W, H) / 600;
computeLayout();
}
window.addEventListener('resize', resize);

function computeLayout() {
const maxMazeW = W * 0.85;
const maxMazeH = H * 0.75;
cellSize = Math.min(Math.floor(maxMazeW / mazeCols), Math.floor(maxMazeH / (mazeRows + 2)));
cellSize = Math.max(cellSize, 20);
ball.r = cellSize * 0.3;
const totalW = mazeCols * cellSize;
const totalH = (mazeRows + 2) * cellSize;
mazeOffsetX = (W - totalW) / 2;
mazeOffsetY = (H - totalH) / 2 + 10;
}

function generateMaze(cols, rows) {
// Recursive backtracker
let grid = [];
for (let r = 0; r < rows; r++) {
grid[r] = [];
for (let c = 0; c < cols; c++) {
grid[r][c] = { top: true, right: true, bottom: true, left: true, visited: false };
}
}
const stack = [];
let cr = 0, cc = 0;
grid[cr][cc].visited = true;
stack.push([cr, cc]);

while (stack.length > 0) {
const [r, c] = stack[stack.length - 1];
const neighbors = [];
if (r > 0 && !grid[r-1][c].visited) neighbors.push([r-1, c, 'top']);
if (r < rows-1 && !grid[r+1][c].visited) neighbors.push([r+1, c, 'bottom']);
if (c > 0 && !grid[r][c-1].visited) neighbors.push([r, c-1, 'left']);
if (c < cols-1 && !grid[r][c+1].visited) neighbors.push([r, c+1, 'right']);

if (neighbors.length === 0) { stack.pop(); continue; }

const [nr, nc, dir] = neighbors[Math.floor(Math.random() * neighbors.length)];
if (dir === 'top') { grid[r][c].top = false; grid[nr][nc].bottom = false; }
else if (dir === 'bottom') { grid[r][c].bottom = false; grid[nr][nc].top = false; }
else if (dir === 'left') { grid[r][c].left = false; grid[nr][nc].right = false; }
else if (dir === 'right') { grid[r][c].right = false; grid[nr][nc].left = false; }

grid[nr][nc].visited = true;
stack.push([nr, nc]);
}

// Remove some extra walls to create loops (makes it more interesting)
const extraRemovals = Math.floor(cols * rows * 0.12);
for (let i = 0; i < extraRemovals; i++) {
const r = Math.floor(Math.random() * (rows - 1));
const c = Math.floor(Math.random() * cols);
if (Math.random() < 0.5) { grid[r][c].bottom = false; grid[r+1][c].top = false; }
else { const c2 = Math.floor(Math.random() * (cols - 1)); grid[r][c2].right = false; grid[r][c2+1].left = false; }
}

return grid;
}

function startLevel(lvl) {
currentLevel = lvl;
maxKicks = 25 + Math.floor(lvl * 3);
kicksUsed = 0;
particles = [];

const targetCols = Math.min(10 + Math.floor((lvl-1)*1.5), 20);
const targetRows = Math.min(10 + Math.floor((lvl-1)*1.2), 18);
mazeCols = targetCols;
mazeRows = targetRows;

computeLayout();
maze = generateMaze(mazeCols, mazeRows);

// Entrance at top-left area, exit at bottom-right area
entrancePos = { col: Math.floor(Math.random() * 3), row: 0 };
exitPos = { col: mazeCols - 1 - Math.floor(Math.random() * 3), row: mazeRows - 1 };

// Make sure entrance top is open and exit bottom is open
maze[entrancePos.row][entrancePos.col].top = false;
maze[exitPos.row][exitPos.col].bottom = false;

ball.x = mazeOffsetX + (entrancePos.col + 0.5) * cellSize;
ball.y = mazeOffsetY + (entrancePos.row + 0.5) * cellSize;
ball.vx = 0; ball.vy = 0;

levelInfo.textContent = `Level ${currentLevel}`;
kickInfo.textContent = `Kicks: 0 / ${maxKicks}`;
hud.style.display = 'block';
ui.classList.add('active');
startPanel.style.display = '';
endPanel.style.display = 'none';
gameOverPanel.style.display = 'none';

setTimeout(() => { ui.classList.remove('active'); }, 200);
}

function getWallAt(px, py) {
const col = Math.floor((px - mazeOffsetX) / cellSize);
const row = Math.floor((py - mazeOffsetY) / cellSize);
if (col < 0 || col >= mazeCols || row < 0 || row >= mazeRows) return null;
return maze[row][col];
}

function isWall(px, py) {
const col = Math.floor((px - mazeOffsetX) / cellSize);
const row = Math.floor((py - mazeOffsetY) / cellSize);
if (col < 0 || col >= mazeCols || row < 0 || row >= mazeRows) return true;
return false;
}

function circleHitsWall(px, py, r) {
// Check if point is inside maze area
if (px < mazeOffsetX - r || px > mazeOffsetX + mazeCols * cellSize + r ||
    py < mazeOffsetY - r || py > mazeOffsetY + (mazeRows+2) * cellSize + r) return true;

const col = Math.floor((px - mazeOffsetX) / cellSize);
const row = Math.floor((py - mazeOffsetY) / cellSize);

// Check bounds
if (col < 0 || col >= mazeCols || row < 0 || row >= mazeRows) {
// Allow ball to go slightly outside at entrance/exit
if (row === -1 && col === entrancePos.col) return false;
if (row === mazeRows && col === exitPos.col) return false;
return true;
}

const cell = maze[row][col];
const localX = px - (mazeOffsetX + col * cellSize);
const localY = py - (mazeOffsetY + row * cellSize);

// Check top wall
if (cell.top && localY < r) return true;
// Check bottom wall
if (cell.bottom && localY > cellSize - r) return true;
// Check left wall
if (cell.left && localX < r) return true;
// Check right wall
if (cell.right && localX > cellSize - r) return true;

return false;
}

function resolveCollision() {
const col = Math.floor((ball.x - mazeOffsetX) / cellSize);
const row = Math.floor((ball.y - mazeOffsetY) / cellSize);

// Check multiple cells the ball might overlap
for (let dr = -1; dr <= 1; dr++) {
for (let dc = -1; dc <= 1; dc++) {
const cr = row + dr, cc = col + dc;
if (cr < 0 || cr >= mazeRows || cc < 0 || cc >= mazeCols) continue;
const cell = maze[cr][cc];
const cellX = mazeOffsetX + cc * cellSize;
const cellY = mazeOffsetY + cr * cellSize;

// Top wall
if (cell.top) {
const wallY = cellY;
const dx = ball.x - (cellX + 0.5 * cellSize);
const dy = ball.y - wallY;
if (dy < ball.r && Math.abs(dx) < cellSize * 0.48) {
ball.y = wallY + ball.r;
if (ball.vy < 0) { ball.vy *= -BOUNCE; playBounce(); }
}
}
// Bottom wall
if (cell.bottom) {
const wallY = cellY + cellSize;
const dx = ball.x - (cellX + 0.5 * cellSize);
const dy = ball.y - wallY;
if (dy > -ball.r && Math.abs(dx) < cellSize * 0.48) {
ball.y = wallY - ball.r;
if (ball.vy > 0) { ball.vy *= -BOUNCE; playBounce(); }
}
}
// Left wall
if (cell.left) {
const wallX = cellX;
const dx = ball.x - wallX;
const dy = ball.y - (cellY + 0.5 * cellSize);
if (dx < ball.r && Math.abs(dy) < cellSize * 0.48) {
ball.x = wallX + ball.r;
if (ball.vx < 0) { ball.vx *= -BOUNCE; playBounce(); }
}
}
// Right wall
if (cell.right) {
const wallX = cellX + cellSize;
const dx = ball.x - wallX;
const dy = ball.y - (cellY + 0.5 * cellSize);
if (dx > -ball.r && Math.abs(dy) < cellSize * 0.48) {
ball.x = wallX - ball.r;
if (ball.vx > 0) { ball.vx *= -BOUNCE; playBounce(); }
}
}
}
}

function checkExit() {
const exitPX = mazeOffsetX + (exitPos.col + 0.5) * cellSize;
const exitPY = mazeOffsetY + (exitPos.row + 0.5) * cellSize;
const dx = ball.x - exitPX;
const dy = ball.y - exitPY;
return Math.sqrt(dx*dx + dy*dy) < cellSize * 0.45;
}

function spawnParticles(x, y, color, count) {
for (let i = 0; i < count; i++) {
const angle = Math.random() * Math.PI * 2;
const speed = 1 + Math.random() * 3;
particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 1, life: 1, color, size: 2 + Math.random()*3 });
}
}

function updateParticles() {
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx; p.y += p.vy;
p.vy += 0.15;
p.life -= 0.025;
if (p.life <= 0) particles.splice(i, 1);
}
}

function kick(dirx, diry) {
if (!gameRunning) return;
if (kicksUsed >= maxKicks) { endGame(false); return; }
ball.vx += dirx * KICK_FORCE;
ball.vy += diry * KICK_FORCE;
kicksUsed++;
kickInfo.textContent = `Kicks: ${kicksUsed} / ${maxKicks}`;
spawnParticles(ball.x, ball.y, '#4a9eff', 8);
playKick();

if (kicksUsed >= maxKicks && !checkExit()) {
setTimeout(() => { if (!checkExit()) endGame(false); }, 1500);
}
}

function update() {
if (!gameRunning) return;

ball.vy += GRAVITY;
ball.vx *= FRICTION;
ball.vy *= FRICTION;

const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
if (speed > MAX_SPEED) {
ball.vx = (ball.vx / speed) * MAX_SPEED;
ball.vy = (ball.vy / speed) * MAX_SPEED;
}

ball.x += ball.vx;
ball.y += ball.vy;

resolveCollision();

// Keep ball in bounds
const minX = mazeOffsetX + ball.r;
const maxX = mazeOffsetX + mazeCols * cellSize - ball.r;
const minY = mazeOffsetY + ball.r;
const maxY = mazeOffsetY + (mazeRows) * cellSize - ball.r;

if (ball.x < minX) { ball.x = minX; ball.vx *= -BOUNCE; }
if (ball.x > maxX) { ball.x = maxX; ball.vx *= -BOUNCE; }
if (ball.y < minY) { ball.y = minY; ball.vy *= -BOUNCE; }
if (ball.y > maxY) { ball.y = maxY; ball.vy *= -BOUNCE; }

updateParticles();

if (checkExit()) { endGame(true); }

shakeTime -= 0.05;
}

function drawMaze() {
const mx = mazeOffsetX, my = mazeOffsetY;

// Background
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);

// Maze background
ctx.fillStyle = '#12122a';
ctx.fillRect(mx - 5, my - 5, mazeCols * cellSize + 10, mazeRows * cellSize + 10);

// Draw walls
ctx.strokeStyle = '#4a9eff';
ctx.lineWidth = Math.max(2, cellSize * 0.08);
ctx.lineCap = 'round';

for (let r = 0; r < mazeRows; r++) {
for (let c = 0; c < mazeCols; c++) {
const x = mx + c * cellSize;
const y = my + r * cellSize;
const cell = maze[r][c];

if (cell.top) {
ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + cellSize, y); ctx.stroke();
}
if (cell.left) {
ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + cellSize); ctx.stroke();
}
if (c === mazeCols - 1 && cell.right) {
ctx.beginPath(); ctx.moveTo(x + cellSize, y); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke();
}
if (r === mazeRows - 1 && cell.bottom) {
ctx.beginPath(); ctx.moveTo(x, y + cellSize); ctx.lineTo(x + cellSize, y + cellSize); ctx.stroke();
}
}
}

// Entrance marker
const entX = mx + (entrancePos.col + 0.5) * cellSize;
const entY = my - 5;
ctx.fillStyle = '#4aff8a';
ctx.beginPath();
ctx.moveTo(entX - 10, entY); ctx.lineTo(entX + 10, entY); ctx.lineTo(entX, entY + 12);
ctx.fill();

// Exit marker (pulsing)
const exX = mx + (exitPos.col + 0.5) * cellSize;
const exY = my + (exitPos.row + 0.5) * cellSize;
const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.005);
ctx.fillStyle = `rgba(255,107,107,${pulse})`;
ctx.beginPath(); ctx.arc(exX, exY, cellSize * 0.35, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#fff';
ctx.font = `${cellSize * 0.4}px sans-serif`;
ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.fillText('EXIT', exX, exY);
}

function drawBall() {
// Glow
const glow = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 2.5);
glow.addColorStop(0, 'rgba(74,158,255,0.4)');
glow.addColorStop(1, 'rgba(74,158,255,0)');
ctx.fillStyle = glow;
ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 2.5, 0, Math.PI*2); ctx.fill();

// Ball body
const grad = ctx.createRadialGradient(ball.x - ball.r*0.3, ball.y - ball.r*0.3, 0, ball.x, ball.y, ball.r);
grad.addColorStop(0, '#8accff');
grad.addColorStop(1, '#2a6aff');
ctx.fillStyle = grad;
ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();

// Highlight
ctx.fillStyle = 'rgba(255,255,255,0.5)';
ctx.beginPath(); ctx.arc(ball.x - ball.r*0.25, ball.y - ball.r*0.25, ball.r*0.35, 0, Math.PI*2); ctx.fill();
}

function drawParticles() {
for (const p of particles) {
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
}
ctx.globalAlpha = 1;
}

function draw() {
ctx.save();
if (shakeTime > 0) {
const sx = (Math.random()-0.5) * shakeIntensity * shakeTime;
const sy = (Math.random()-0.5) * shakeIntensity * shakeTime;
ctx.translate(sx, sy);
}

drawMaze();
drawBall();
drawParticles();

ctx.restore();
}

function render() {
update();
draw();
requestAnimationFrame(render);
}

// Audio
function initAudio() {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playKick() {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
osc.connect(gain).connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

function playBounce() {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'triangle';
osc.frequency.setValueAtTime(150, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
osc.connect(gain).connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime + 0.08);
}

function playWin() {
if (!audioCtx) return;
const notes = [523, 659, 784, 1047];
notes.forEach((f, i) => {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.value = f;
gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i*0.1);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i*0.1 + 0.3);
osc.connect(gain).connect(audioCtx.destination);
osc.start(audioCtx.currentTime + i*0.1);
osc.stop(audioCtx.currentTime + i*0.1 + 0.3);
});
}

function playLose() {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
osc.connect(gain).connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function endGame(won) {
gameRunning = false;
hud.style.display = 'none';
ui.classList.add('active');

if (won) {
playWin();
spawnParticles(ball.x, ball.y, '#4aff8a', 30);
spawnParticles(ball.x, ball.y, '#ff6b6b', 20);
endPanel.style.display = '';
startPanel.style.display = 'none';
gameOverPanel.style.display = 'none';
totalKicks += kicksUsed;
document.getElementById('endTitle').textContent = `LEVEL ${currentLevel} COMPLETE!`;
document.getElementById('endStats').innerHTML = `Kicks used: <strong>${kicksUsed}</strong> / ${maxKicks}<br>Total kicks: ${totalKicks}`;
document.getElementById('nextBtn').textContent = 'NEXT LEVEL';
} else {
playLose();
shakeTime = 1; shakeIntensity = 5;
gameOverPanel.style.display = '';
startPanel.style.display = 'none';
endPanel.style.display = 'none';
}
}

function startGame() {
initAudio();
totalKicks = 0;
startLevel(1);
gameRunning = true;
ui.classList.remove('active');
hud.style.display = 'block';
}

// Input
window.addEventListener('keydown', (e) => {
if (!gameRunning) return;
const k = e.key.toLowerCase();
if (k === 'w' || k === 'arrowup') kick(0, -1);
else if (k === 's' || k === 'arrowdown') kick(0, 1);
else if (k === 'a' || k === 'arrowleft') kick(-1, 0);
else if (k === 'd' || k === 'arrowright') kick(1, 0);
});

// Buttons
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('nextBtn').addEventListener('click', () => {
initAudio();
gameRunning = true;
startLevel(currentLevel + 1);
ui.classList.remove('active');
hud.style.display = 'block';
});
document.getElementById('retryBtn').addEventListener('click', () => {
initAudio();
gameRunning = true;
startLevel(currentLevel);
ui.classList.remove('active');
hud.style.display = 'block';
});

// Init
resize();
render();
</script>
</body>
</html>
