    W = window.innerWidth;

window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'land') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'boost') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'check') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

// Game State
let gameState = 'start'; // start, playing, levelComplete, gameOver, victory
let keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; if(gameState === 'start') startGame(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Particles
let particles = [];
function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed;
        particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - 2, life: 1, color, size: Math.random() * 4 + 2 });
    }
}

// Screen shake
let shake = { x: 0, y: 0, intensity: 0 };
function addShake(intensity) { shake.intensity = Math.max(shake.intensity, intensity); }

let currentLevel = 0;
let levelData = null;
let player, rival, camera, timer, bestTimes, levelTime, checkpointIndex, finished;

function loadBest() {
    try { return JSON.parse(localStorage.getItem('raceRunnerBest') || '{}'); } catch(e) { return {}; }
}
function saveBest(time, lvl) {
    try {
        const b = loadBest();
        if (!b[lvl] || time < b[lvl]) { b[lvl] = time; localStorage.setItem('raceRunnerBest', JSON.stringify(b)); }
    } catch(e) {}
}

function startGame() {
    initAudio();
    gameState = 'playing';
    loadLevel(0);
}

function loadLevel(idx) {
    currentLevel = idx;
    levelData = levels[idx];
    player = { x: 50, y: 350, vx: 0, vy: 0, w: 24, h: 32, grounded: false, boosting: 0, dead: false, deathTimer: 0 };
    rival = { x: 80, y: 350, vx: 0, vy: 0, w: 24, h: 32, grounded: false, finished: false };
    camera = { x: 0 };
    timer = 0;
    levelTime = 0;
    checkpointIndex = 0;
    finished = false;
    particles = [];
}

function restart() {
    loadLevel(currentLevel);
    gameState = 'playing';
}

function nextLevel() {
    if (currentLevel < levels.length - 1) {
        currentLevel++;
        loadLevel(currentLevel);
        gameState = 'playing';
    } else {
        gameState = 'victory';
    }
}

// Physics constants
const GRAVITY = 0.6;
const JUMP_FORCE = -12;
const MOVE_SPEED = 5;
const BOOST_SPEED = 8;
const FRICTION = 0.85;

function updatePlayer() {
    if (player.dead) {
        player.deathTimer--;
        if (player.deathTimer <= 0) {
            spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 20, 5);
            addShake(8);
            playSound('hit');
            // Respawn at last checkpoint
            let rx = 50, ry = 350;
            if (checkpointIndex > 0) {
                const cp = levelData.checkpoints[checkpointIndex - 1];
                rx = cp.x + 20; ry = 350;
            }
            player.x = rx; player.y = ry; player.vx = 0; player.vy = 0;
            player.dead = false;
        }
        return;
    }

    if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= MOVE_SPEED * 0.3;
    if (keys['ArrowRight'] || keys['KeyD']) player.vx += MOVE_SPEED * 0.3;
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = JUMP_FORCE;
        player.grounded = false;
        playSound('jump');
    }

    const speedMult = player.boosting > 0 ? BOOST_SPEED / MOVE_SPEED : 1;
    player.vx *= FRICTION;
    player.vx = Math.max(-MOVE_SPEED * speedMult, Math.min(MOVE_SPEED * speedMult, player.vx));
    if (player.boosting > 0) {
        if (keys['ArrowRight'] || keys['KeyD']) player.vx = BOOST_SPEED;
        else if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -BOOST_SPEED;
        player.boosting--;
        if (Math.random() < 0.5) spawnParticles(player.x + player.w/2, player.y + player.h, '#44ff88', 1, 2);
    }

    player.vy += GRAVITY;
    player.vy = Math.min(player.vy, 15);
    player.x += player.vx;
    player.y += player.vy;
    player.grounded = false;

    // Platform collision
    for (const p of levelData.platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            if (player.vy >= 0 && player.y + player.h >= p.y && player.y + player.h <= p.y + 20) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
        }
    }

    // Pit check
    for (const pit of levelData.pits) {
        if (player.x + player.w > pit.x && player.x < pit.x + pit.w && player.y + player.h >= 400) {
            killPlayer();
        }
    }

    // Spike check
    for (const s of levelData.spikes) {
        if (player.x + player.w - 5 > s.x && player.x + 5 < s.x + 30 && player.y + player.h > s.y && player.y + player.h <= s.y + 20) {
            killPlayer();
        }
    }

    // Boost collection
    for (let i = 0; i < levelData.boosts.length; i++) {
        const b = levelData.boosts[i];
        if (player.x + player.w > b.x && player.x < b.x + 30 && player.y + player.h > b.y && player.y < b.y + 30) {
            player.boosting = 120;
            playSound('boost');
            spawnParticles(b.x + 15, b.y + 15, '#44ff88', 10, 4);
            levelData.boosts.splice(i, 1);
        }
    }

    // Checkpoint
    if (checkpointIndex < levelData.checkpoints.length) {
        const cp = levelData.checkpoints[checkpointIndex];
        if (player.x > cp.x) {
            checkpointIndex++;
            playSound('check');
            spawnParticles(cp.x + 15, 380, '#ffdd44', 15, 3);
        }
    }

    // Finish line
    if (player.x > levelData.length - 50 && !finished) {
        finished = true;
        levelTime = timer;
        saveBest(levelTime, currentLevel);
        playSound('win');
        setTimeout(() => { gameState = 'levelComplete'; }, 1000);
    }

    // Bounds
    if (player.x < 0) player.x = 0;
}

function killPlayer() {
    if (player.dead) return;
    player.dead = true;
    player.deathTimer = 30;
    addShake(5);
}

function updateRival() {
    if (rival.finished) return;
    rival.vx = levelData.rivalSpeed;
    rival.vy += GRAVITY;
    rival.x += rival.vx;
    rival.y += rival.vy;
    rival.grounded = false;

    for (const p of levelData.platforms) {
        if (rival.x + rival.w > p.x && rival.x < p.x + p.w) {
            if (rival.vy >= 0 && rival.y + rival.h >= p.y && rival.y + rival.h <= p.y + 20) {
                // Auto jump for gaps
                const nextPlat = findNextPlatform(p);
                if (nextPlat && nextPlat.x - (p.x + p.w) > 30 && nextPlat.y < p.y - 20) {
                    rival.vy = JUMP_FORCE * 0.9;
                } else {
                    rival.y = p.y - rival.h;
                    rival.vy = 0;
                    rival.grounded = true;
                }
            }
        }
    }

    // Rival auto-jump for pits
    for (const pit of levelData.pits) {
        if (rival.x + rival.w > pit.x - 40 && rival.x < pit.x && rival.grounded) {
            rival.vy = JUMP_FORCE * 0.85;
        }
    }

    // Rival falls in pits sometimes (gives player a chance)
    for (const pit of levelData.pits) {
        if (rival.x + rival.w > pit.x && rival.x < pit.x + pit.w && rival.y + rival.h >= 405) {
            rival.y = -100; // Reset rival behind player
            rival.x = Math.max(player.x - 200, 0);
        }
    }

    if (rival.x > levelData.length - 50) rival.finished = true;
}

function findNextPlatform(current) {
    for (const p of levelData.platforms) {
        if (p.x > current.x + current.w && p.y < 420) return p;
    }
    return null;
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function updateShake() {
    shake.intensity *= 0.85;
    if (shake.intensity < 0.5) { shake.x = 0; shake.y = 0; shake.intensity = 0; }
    else {
        shake.x = (Math.random() - 0.5) * shake.intensity;
        shake.y = (Math.random() - 0.5) * shake.intensity;
    }
}

// Rendering
function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    if (currentLevel === 0) {
        grad.addColorStop(0, '#1a1a3e');
        grad.addColorStop(1, '#4a2c82');
    } else if (currentLevel === 1) {
        grad.addColorStop(0, '#0f0c29');
        grad.addColorStop(1, '#302b63');
    } else {
        grad.addColorStop(0, '#1a0000');
        grad.addColorStop(1, '#4a1a00');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars / decorative elements
    const parallax = camera.x * 0.2;
    for (let i = 0; i < 50; i++) {
        const sx = ((i * 137 + 50) % (W + 200)) - parallax % (W + 200);
        const sy = (i * 97) % (H * 0.6);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 3) * 0.2})`;
        ctx.fillRect(sx, sy, 2, 2);
    }

    // Mountains parallax
    const mParallax = camera.x * 0.4;
    ctx.fillStyle = currentLevel === 2 ? '#2a0800' : '#1a1a3e';
    for (let i = 0; i < 10; i++) {
        const mx = ((i * 400) - mParallax) % (W + 400) - 200;
        const mh = 80 + (i * 37) % 120;
        ctx.beginPath();
        ctx.moveTo(mx, H);
        ctx.lineTo(mx + 200, H - mh);
        ctx.lineTo(mx + 400, H);
        ctx.fill();
    }
}

function drawPlatforms() {
    for (const p of levelData.platforms) {
        const px = p.x - camera.x;
        if (px > W + 50 || px + p.w < -50) continue;
        const grad = ctx.createLinearGradient(px, p.y, px, p.y + 20);
        if (currentLevel === 2) {
            grad.addColorStop(0, '#ff6633');
            grad.addColorStop(1, '#993300');
        } else {
            grad.addColorStop(0, '#555577');
            grad.addColorStop(1, '#333355');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(px, p.y, p.w, 20);
        ctx.fillStyle = currentLevel === 2 ? '#ff9966' : '#7777aa';
        ctx.fillRect(px, p.y, p.w, 4);
    }
}

function drawSpikes() {
    for (const s of levelData.spikes) {
        const sx = s.x - camera.x;
        if (sx > W + 50 || sx < -50) continue;
        ctx.fillStyle = currentLevel === 2 ? '#ff3333' : '#cc3333';
        for (let i = 0; i < 3; i++) {
            const bx = sx + i * 10;
            ctx.beginPath();
            ctx.moveTo(bx, s.y + 20);
            ctx.lineTo(bx + 5, s.y);
            ctx.lineTo(bx + 10, s.y + 20);
            ctx.fill();
        }
    }
}

function drawBoosts() {
    for (const b of levelData.boosts) {
        const bx = b.x - camera.x;
        if (bx > W + 50 || bx < -50) continue;
        const pulse = Math.sin(Date.now() * 0.005) * 3;
        ctx.fillStyle = '#44ff88';
        ctx.beginPath();
        ctx.arc(bx + 15, b.y + 15 + pulse, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('>>', bx + 15, b.y + 20 + pulse);
    }
}

function drawCheckpoints() {
    for (let i = 0; i < levelData.checkpoints.length; i++) {
        const cp = levelData.checkpoints[i];
        const cx = cp.x - camera.x;
        if (cx > W + 50 || cx < -50) continue;
        const active = i === checkpointIndex;
        ctx.fillStyle = active ? '#ffdd44' : (i < checkpointIndex ? '#88ff44' : '#666666');
        ctx.fillRect(cx, 320, 4, 80);
        ctx.beginPath();
        ctx.moveTo(cx + 4, 320);
        ctx.lineTo(cx + 30, 335);
        ctx.lineTo(cx + 4, 350);
        ctx.fill();
    }
}

function drawPlayer() {
    if (player.dead && player.deathTimer % 6 < 3) return;
    const px = player.x - camera.x;
    const py = player.y;

    // Body
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(px, py + 8, player.w, player.h - 8);
    // Head
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(px + 4, py, player.w - 8, 12);
    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(px + 6, py + 3, 5, 5);
    ctx.fillRect(px + 15, py + 3, 5, 5);
    ctx.fillStyle = '#000000';
    ctx.fillRect(px + 8, py + 4, 3, 3);
    ctx.fillRect(px + 17, py + 4, 3, 3);

    // Legs animation
    const legFrame = Math.abs(Math.sin(Date.now() * 0.02)) * (Math.abs(player.vx) > 1 ? 6 : 0);
    ctx.fillStyle = '#2255aa';
    ctx.fillRect(px + 2, py + player.h - 8, 8, 8);
    ctx.fillRect(px + player.w - 10, py + player.h - 8 - legFrame, 8, 8 + legFrame);

    // Boost trail
    if (player.boosting > 0) {
        ctx.fillStyle = `rgba(68, 255, 136, ${player.boosting / 200})`;
        ctx.fillRect(px - 10, py + 10, 10, player.h - 10);
    }
}

function drawRival() {
    if (rival.finished) return;
    const rx = rival.x - camera.x;
    const ry = rival.y;
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(rx, ry + 8, rival.w, rival.h - 8);
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(rx + 4, ry, rival.w - 8, 12);
    ctx.fillStyle = '#000000';
    ctx.fillRect(rx + 6, ry + 3, 5, 5);
    ctx.fillRect(rx + 15, ry + 3, 5, 5);
    ctx.fillStyle = '#aa2222';
    ctx.fillRect(rx + 2, ry + rival.h - 8, 8, 8);
    ctx.fillRect(rx + rival.w - 10, ry + rival.h - 8, 8, 8);

    // "RIVAL" label
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RIVAL', rx + rival.w/2, ry - 5);
}

function drawFinishLine() {
    const fx = levelData.length - 50 - camera.x;
    if (fx > W + 50) return;
    for (let i = 0; i < 8; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#000000';
        ctx.fillRect(fx, 340 + i * 10, 8, 10);
    }
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('FINISH', fx + 4, 335);
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Timer
    const t = timer / 60;
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(W/2 - 80, 10, 160, 40);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`TIME: ${t.toFixed(1)}s`, W/2, 38);

    // Level name
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(10, 10, 200, 35);
    ctx.fillStyle = '#ffdd44';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`LVL ${currentLevel + 1}: ${levelData.name}`, 20, 33);

    // Best time
    const best = loadBest();
    if (best[currentLevel]) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(W - 180, 10, 170, 25);
        ctx.fillStyle = '#88ff88';
        ctx.font = '12px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`BEST: ${best[currentLevel].toFixed(1)}s`, W - 20, 27);
    }

    // Progress bar
    const progress = player.x / levelData.length;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W/2 - 100, H - 35, 200, 12);
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(W/2 - 100, H - 35, 200 * Math.min(1, progress), 12);
    // Rival marker
    const rProg = rival.x / levelData.length;
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(W/2 - 100 + 200 * Math.min(1, rProg) - 3, H - 38, 6, 18);
    // Player marker
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(W/2 - 100 + 200 * Math.min(1, progress) - 3, H - 38, 6, 18);

    // Boost indicator
    if (player.boosting > 0) {
        ctx.fillStyle = 'rgba(68,255,136,0.3)';
        ctx.fillRect(W/2 - 50, H - 60, 100 * (player.boosting / 120), 8);
        ctx.strokeStyle = '#44ff88';
        ctx.strokeRect(W/2 - 50, H - 60, 100, 8);
    }

    // Checkpoint flash
    if (checkpointIndex > 0 && timer < 120) {
        ctx.fillStyle = `rgba(255, 221, 68, ${1 - timer / 120})`;
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CHECKPOINT!', W/2, H/2);
    }

    // Finish flash
    if (finished) {
        ctx.fillStyle = `rgba(255, 255, 255, 0.3)`;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FINISH!', W/2, H/2);
    }
}

function drawStartScreen() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1a3e');
    grad.addColorStop(1, '#4a2c82');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Animated background particles
    for (let i = 0; i < 30; i++) {
        const x = ((i * 137 + Date.now() * 0.05) % (W + 40)) - 20;
        const y = (i * 97) % H;
        ctx.fillStyle = `rgba(68, 170, 255, ${0.3 + (i % 3) * 0.2})`;
        ctx.fillRect(x, y, 3, 3);
    }

    // Title
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 64px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RACE RUNNER', W/2, H/3);

    // Subtitle
    ctx.fillStyle = '#ffdd44';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('~ RACING PLATFORMER ~', W/2, H/3 + 40);

    // Instructions
    ctx.fillStyle = '#aaccff';
    ctx.font = '16px monospace';
    const lines = [
        'OUTRUN YOUR RIVAL THROUGH EACH STAGE',
        '',
        '← → / A D - MOVE',
        'SPACE / ↑ / W - JUMP',
        '',
        'AVOID SPIKES & PITS',
        'COLLECT >> FOR SPEED BOOSTS',
        'REACH CHECKPOINTS TO PROGRESS',
        '',
        'BEAT YOUR BEST TIME ON EACH LEVEL!'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H/3 + 90 + i * 24);
    });

    // Start prompt
    const pulse = Math.sin(Date.now() * 0.005) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
    ctx.font = 'bold 24px monospace';
    ctx.fillText('PRESS ANY KEY TO RACE', W/2, H - 60);

    // Character preview
    ctx.fillStyle = '#44aaff';
    ctx.fillRect(W/2 - 130, H - 140, 24, 32);
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(W/2 - 126, H - 148, 16, 12);

    ctx.fillStyle = '#ff4444';
    ctx.fillRect(W/2 + 106, H - 140, 24, 32);
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(W/2 + 110, H - 148, 16, 12);

    ctx.fillStyle = '#ffffff';
    ctx.font = '10px monospace';
    ctx.fillText('YOU', W/2 - 118, H - 105);
    ctx.fillText('RIVAL', W/2 + 118, H - 105);
}

function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#44ff88';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('STAGE CLEAR!', W/2, H/3);

    ctx.fillStyle = '#ffffff';
    ctx.font = '24px monospace';
    ctx.fillText(`TIME: ${levelTime.toFixed(1)}s`, W/2, H/3 + 50);

    const best = loadBest();
    if (best[currentLevel]) {
        ctx.fillStyle = '#88ff88';
        ctx.fillText(`BEST: ${best[currentLevel].toFixed(1)}s`, W/2, H/3 + 90);
    }

    // Rival result
    ctx.fillStyle = rival.finished ? '#ff4444' : '#44ff88';
    ctx.font = '20px monospace';
    ctx.fillText(rival.finished ? 'RIVAL FINISHED FIRST - TRY FASTER!' : 'YOU OUTRAN YOUR RIVAL!', W/2, H/3 + 130);

    const pulse = Math.sin(Date.now() * 0.005) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
    ctx.font = 'bold 20px monospace';
    ctx.fillText('PRESS ANY KEY FOR NEXT STAGE', W/2, H - 60);

    // Listen for next
    if (keys['Space'] || keys['Enter']) {
        setTimeout(nextLevel, 500);
        gameState = 'transition';
    }
}

function drawVictory() {
    ctx.fillStyle = '#1a1a3e';
    ctx.fillRect(0, 0, W, H);

    // Confetti
    for (let i = 0; i < 50; i++) {
        const x = ((i * 137 + Date.now() * 0.1) % (W + 40)) - 20;
        const y = ((i * 97 + Date.now() * 0.05) % (H + 40)) - 20;
        ctx.fillStyle = `hsl(${(i * 30) % 360}, 100%, 60%)`;
        ctx.fillRect(x, y, 6, 6);
    }

    ctx.fillStyle = '#ffdd44';
    ctx.font = 'bold 56px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('VICTORY!', W/2, H/3);

    ctx.fillStyle = '#ffffff';
    ctx.font = '24px monospace';
    ctx.fillText('YOU CONQUERED ALL STAGES!', W/2, H/3 + 60);

    ctx.fillStyle = '#aaccff';
    ctx.font = '18px monospace';
    const b = loadBest();
    let total = 0;
    for (let i = 0; i < levels.length; i++) { if (b[i]) total += b[i]; }
    if (total > 0) ctx.fillText(`TOTAL BEST: ${total.toFixed(1)}s`, W/2, H/3 + 110);

    const pulse = Math.sin(Date.now() * 0.005) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
    ctx.font = 'bold 20px monospace';
    ctx.fillText('PRESS R TO RACE AGAIN', W/2, H - 60);

    if (keys['KeyR']) {
        loadLevel(0);
        gameState = 'playing';
    }
}

function update() {
    if (gameState !== 'playing') return;
    timer++;
    updatePlayer();
    updateRival();
    updateParticles();
    updateShake();

    // Camera follow
    const targetCamX = player.x - W * 0.35;
    camera.x += (targetCamX - camera.x) * 0.1;
    if (camera.x < 0) camera.x = 0;
}

function render() {
    ctx.save();
    ctx.translate(shake.x, shake.y);

    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'playing' || gameState === 'transition') {
        drawBackground();
        drawPlatforms();
        drawSpikes();
        drawBoosts();
        drawCheckpoints();
        drawFinishLine();
        drawRival();
        drawPlayer();
        drawParticles();
        drawHUD();
    } else if (gameState === 'levelComplete') {
        drawBackground();
        drawPlatforms();
        drawSpikes();
        drawBoosts();
        drawPlayer();
        drawLevelComplete();
    } else if (gameState === 'victory') {
        drawVictory();
    }

    ctx.restore();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

// Handle state transitions via key
window.addEventListener('keydown', e => {
    if (gameState === 'levelComplete' && (e.code === 'Space' || e.code === 'Enter')) {
        nextLevel();
    }
});

gameLoop();
</script>
</body>
</html>
