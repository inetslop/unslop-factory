<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe Flow - Turn-Based Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}
#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 10px;
}
h1 {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  color: #4fc3f7;
  text-shadow: 0 0 20px rgba(79,195,247,0.5);
  margin-bottom: 4px;
}
.info-bar {
  display: flex;
  gap: 24px;
  font-size: clamp(0.8rem, 2vw, 1.1rem);
  color: #b0bec5;
}
.info-bar span {
  background: rgba(255,255,255,0.05);
  padding: 4px 12px;
  border-radius: 6px;
}
#canvas-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}
canvas {
  cursor: pointer;
  border-radius: 8px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.btn-row {
  display: flex;
  gap: 10px;
}
button {
  background: linear-gradient(135deg, #4fc3f7, #29b6f6);
  color: #0d1b2a;
  border: none;
  padding: 10px 20px;
  font-size: clamp(0.8rem, 1.8vw, 1rem);
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(79,195,247,0.4);
}
button:active { transform: translateY(0); }
#msg {
  font-size: clamp(0.9rem, 2vw, 1.2rem);
  min-height: 1.5em;
  color: #ffab40;
  text-align: center;
}
#start-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #1a1a2e;
  z-index: 10;
}
#start-screen h1 { font-size: clamp(2rem, 5vw, 3.5rem); }
#start-screen .subtitle {
  color: #90a4ae;
  margin-bottom: 20px;
  font-size: clamp(0.9rem, 2vw, 1.1rem);
}
#start-screen .controls {
  background: rgba(255,255,255,0.05);
  padding: 16px 24px;
  border-radius: 12px;
  margin-bottom: 24px;
  text-align: left;
  line-height: 1.8;
  font-size: clamp(0.8rem, 1.8vw, 1rem);
}
#start-screen .controls kbd {
  background: rgba(255,255,255,0.1);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: monospace;
}
.hidden { display: none !important; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.pulse { animation: pulse 1s infinite; }
</style>
</head>
<body>
<div id="start-screen">
  <h1>⚙️ Pipe Flow</h1>
  <p class="subtitle">A turn-based rotation puzzle</p>
  <div class="controls">
    <strong>Goal:</strong> Rotate pipes to connect all tiles to the water source.<br><br>
    <kbd>Click / Tap</kbd> a tile to rotate it 90° clockwise<br>
    <kbd>R</kbd> — Restart level<br>
    <kbd>N</kbd> — Next level (after solving)<br>
    <kbd>M</kbd> — Toggle mute
  </div>
  <button id="btn-start">▶ Play</button>
</div>

<div id="game-container" class="hidden">
  <h1>⚙️ Pipe Flow</h1>
  <div class="info-bar">
    <span>Level: <b id="hud-level">1</b></span>
    <span>Moves: <b id="hud-moves">0</b></span>
    <span>Best: <b id="hud-best">—</b></span>
  </div>
  <div id="canvas-wrap"><canvas id="board"></canvas></div>
  <p id="msg"></p>
  <div class="btn-row">
    <button id="btn-restart">↺ Restart (R)</button>
    <button id="btn-next" class="hidden">Next Level (N)</button>
  </div>
</div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
let tileSize, cols, rows;
let grid = []; // grid[r][c] = { connections: bitmask, rotation: 0 }
let sourceR, sourceC;
let moves = 0;
let level = 1;
let solved = false;
let audioCtx = null;
let muted = false;

const DIRS = [
  [-1,0], // N
  [0,1],  // E
  [1,0],  // S
  [0,-1]  // W
];
const OPP = [2,3,0,1]; // opposite direction index

function rotMask(m){ return ((m << 1) | (m >> 3)) & 7; }
// Rotate bitmask right by 90°: N(1)->E(2)->S(4)->W(8)... wait let me use bits properly.
// Bit 0=N, bit 1=E, bit 2=S, bit 3=W
function rotateMask(m){ return ((m << 1) | (m >> 3)) & 15; }

function playTone(freq, dur, type, vol){
  if(!audioCtx || muted) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur||0.1));
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+(dur||0.1));
}

function initAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
}

function playClick(){ playTone(440, 0.08, 'triangle', 0.12); }
function playWin(){
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'sine',0.2), i*120));
}

function getGridSize(lv){
  if(lv<=1) return {c:4,r:4};
  if(lv===2) return {c:5,r:5};
  if(lv===3) return {c:6,r:5};
  if(lv===4) return {c:6,r:6};
  return {c:Math.min(7,4+lv-1), r:Math.min(7,4+lv-1)};
}

function generatePuzzle(c,r){
  // Generate spanning tree using randomized DFS
  const visited = Array.from({length:r},()=>Array(c).fill(false));
  const edges = []; // [r,c] -> set of connected dirs (bitmask)
  const conn = Array.from({length:r},()=>Array.from({length:c},()=>0));

  function dfs(cr,cc){
    visited[cr][cc]=true;
    let shuffled=[0,1,2,3].sort(()=>Math.random()-0.5);
    for(const d of shuffled){
      const nr=cr+DIRS[d][0], nc=cc+DIRS[d][1];
      if(nr>=0&&nr<r&&nc>=0&&nc<c&&!visited[nr][nc]){
        conn[cr][cc] |= (1<<d);
        conn[nr][nc] |= (1<<OPP[d]);
        edges.push([cr,cc,d]);
        dfs(nr,nc);
      }
    }
  }

  // Start from a random corner or edge cell
  const startR = Math.floor(Math.random()*r);
  const startC = Math.floor(Math.random()*c);
  sourceR = startR; sourceC = startC;
  dfs(startR, startC);

  // Build grid with solution rotations = 0 (since we generated them directly)
  const solGrid = [];
  for(let i=0;i<r;i++){
    solGrid[i]=[];
    for(let j=0;j<c;j++){
      solGrid[i][j] = { connections: conn[i][j], rotation: 0 };
    }
  }

  // Shuffle rotations (1-3 extra rotations per tile, at least ensure not all solved)
  const shuffled = [];
  for(let i=0;i<r;i++){
    shuffled[i]=[];
    for(let j=0;j<c;j++){
      let extra = Math.floor(Math.random()*4);
      // Ensure it's not the solution (at least some tiles are wrong)
      if(extra===0 && Math.random()<0.5) extra = 1+Math.floor(Math.random()*3);
      shuffled[i][j] = {
        connections: rotateMaskN(solGrid[i][j].connections, extra),
        rotation: extra
      };
    }
  }

  // Make sure puzzle isn't already solved
  if(isSolved(shuffled, c, r)){
    // Rotate a random non-source tile
    let tr = Math.floor(Math.random()*r), tc = Math.floor(Math.random()*c);
    if(tr===startR&&tc===startC){tr=(tr+1)%r;tc=(tc+1)%c;}
    shuffled[tr][tc].rotation = (shuffled[tr][tc].rotation + 1) % 4;
    shuffled[tr][tc].connections = rotateMaskN(solGrid[tr][tc].connections, shuffled[tr][tc].rotation);
  }

  return shuffled;
}

function rotateMaskN(m, times){
  for(let i=0;i<times;i++) m = rotateMask(m);
  return m;
}

function isSolved(g, c, r){
  // BFS from source
  const visited = Array.from({length:r},()=>Array(c).fill(false));
  const queue = [[sourceR, sourceC]];
  visited[sourceR][sourceC]=true;
  while(queue.length){
    const [cr,cc]=queue.shift();
    for(let d=0;d<4;d++){
      if(!(g[cr][cc].connections & (1<<d))) continue;
      const nr=cr+DIRS[d][0], nc=cc+DIRS[d][1];
      if(nr<0||nr>=r||nc<0||nc>=c) continue;
      if(visited[nr][nc]) continue;
      // Check neighbor connects back
      if(g[nr][nc].connections & (1<<OPP[d])){
        visited[nr][nc]=true;
        queue.push([nr,nc]);
      }
    }
  }
  let count=0;
  for(let i=0;i<r;i++)for(let j=0;j<c;j++)if(visited[i][j])count++;
  return count === r*c;
}

function getWater(g, c, r){
  const visited = Array.from({length:r},()=>Array(c).fill(false));
  const queue = [[sourceR, sourceC]];
  visited[sourceR][sourceC]=true;
  while(queue.length){
    const [cr,cc]=queue.shift();
    for(let d=0;d<4;d++){
      if(!(g[cr][cc].connections & (1<<d))) continue;
      const nr=cr+DIRS[d][0], nc=cc+DIRS[d][1];
      if(nr<0||nr>=r||nc<0||nc>=c) continue;
      if(visited[nr][nc]) continue;
      if(g[nr][nc].connections & (1<<OPP[d])){
        visited[nr][nc]=true;
        queue.push([nr,nc]);
      }
    }
  }
  return visited;
}

function resize(){
  const maxW = Math.min(window.innerWidth - 40, 500);
  const maxH = window.innerHeight - 200;
  tileSize = Math.floor(Math.min(maxW / cols, maxH / rows));
  tileSize = Math.max(tileSize, 36);
  canvas.width = cols * tileSize;
  canvas.height = rows * tileSize;
  draw();
}

function draw(){
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0,0,w,h);

  const water = solved ? null : getWater(grid, cols, rows);
  if(!water) for(let i=0;i<rows;i++)for(let j=0;j<cols;j++) water[i][j]=true;

  // Draw grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*tileSize,0);ctx.lineTo(i*tileSize,h);ctx.stroke();}
  for(let j=0;j<=rows;j++){ctx.beginPath();ctx.moveTo(0,j*tileSize);ctx.lineTo(w,j*tileSize);ctx.stroke();}

  // Draw tiles
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x = c*tileSize, y = r*tileSize;
      const hasWater = water[r][c];
      const isSource = (r===sourceR && c===sourceC);

      // Tile background
      ctx.fillStyle = isSource ? '#1b5e20' : 'rgba(255,255,255,0.03)';
      ctx.fillRect(x+1,y+1,tileSize-2,tileSize-2);

      if(isSource){
        // Draw source icon
        ctx.fillStyle = '#4caf50';
        ctx.font = `bold ${tileSize*0.5}px sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('⛲', x+tileSize/2, y+tileSize/2);
      }

      // Draw pipe connections
      const conn = grid[r][c].connections;
      const pipeColor = hasWater ? '#4fc3f7' : '#546e7a';
      const pipeW = Math.max(tileSize*0.18, 6);

      ctx.strokeStyle = pipeColor;
      ctx.lineWidth = pipeW;
      ctx.lineCap = 'round';
      ctx.shadowColor = hasWater ? 'rgba(79,195,247,0.4)' : 'transparent';
      ctx.shadowBlur = hasWater ? 8 : 0;

      const cx = x + tileSize/2, cy = y + tileSize/2;
      const half = tileSize/2;

      // Draw each direction connection as a line from center to edge
      for(let d=0;d<4;d++){
        if(conn & (1<<d)){
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          const dir = DIRS[d];
          ctx.lineTo(cx + dir[0]*half, cy + dir[1]*half);
          ctx.stroke();
        }
      }

      // Center dot
      if(conn > 0){
        ctx.beginPath();
        ctx.arc(cx, cy, pipeW*0.6, 0, Math.PI*2);
        ctx.fillStyle = pipeColor;
        ctx.fill();
      }

      ctx.shadowBlur = 0;
    }
  }

  // Highlight source border
  if(sourceR !== undefined){
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 3;
    ctx.strokeRect(sourceC*tileSize+2, sourceR*tileSize+2, tileSize-4, tileSize-4);
  }
}

function startLevel(lv){
  level = lv;
  const {c,r} = getGridSize(lv);
  cols=c; rows=r;
  grid = generatePuzzle(c,r);
  moves = 0;
  solved = false;
  document.getElementById('hud-level').textContent = lv;
  document.getElementById('hud-moves').textContent = '0';
  updateBest();
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('msg').textContent = '';
  resize();
}

function updateBest(){
  try{
    const key = 'pipeflow_best_'+level;
    const best = localStorage.getItem(key);
    document.getElementById('hud-best').textContent = best ? best : '—';
  }catch(e){
    document.getElementById('hud-best').textContent = '—';
  }
}

function saveBest(){
  try{
    const key = 'pipeflow_best_'+level;
    const prev = localStorage.getItem(key);
    if(!prev || moves < parseInt(prev)){
      localStorage.setItem(key, moves);
    }
    document.getElementById('hud-best').textContent = moves;
  }catch(e){}
}

function onTileClick(mx, my){
  if(solved) return;
  const c = Math.floor(mx / tileSize);
  const r = Math.floor(my / tileSize);
  if(r<0||r>=rows||c<0||c>=cols) return;

  grid[r][c].rotation = (grid[r][c].rotation + 1) % 4;
  grid[r][c].connections = rotateMask(grid[r][c].connections);
  moves++;
  document.getElementById('hud-moves').textContent = moves;
  playClick();

  if(isSolved(grid, cols, rows)){
    solved = true;
    saveBest();
    document.getElementById('msg').textContent = '🎉 Solved in ' + moves + ' moves!';
    document.getElementById('btn-next').classList.remove('hidden');
    playWin();
  }

  draw();
}

function getCanvasPos(e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  return {x, y};
}

canvas.addEventListener('click', (e)=>{
  initAudio();
  const p = getCanvasPos(e);
  onTileClick(p.x, p.y);
});

canvas.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  initAudio();
  const t = e.touches[0];
  const p = getCanvasPos(t);
  onTileClick(p.x, p.y);
});

document.getElementById('btn-restart').addEventListener('click', ()=>{ startLevel(level); });
document.getElementById('btn-next').addEventListener('click', ()=>{ startLevel(level+1); });

window.addEventListener('keydown', (e)=>{
  if(e.key==='r'||e.key==='R'){ startLevel(level); }
  if(e.key==='n'||e.key==='N'){ if(solved) startLevel(level+1); }
  if(e.key==='m'||e.key==='M'){ muted=!muted; }
});

document.getElementById('btn-start').addEventListener('click', ()=>{
  initAudio();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-container').classList.remove('hidden');
  startLevel(1);
});

window.addEventListener('resize', resize);

// Initial draw placeholder
cols=4; rows=4; tileSize=60;
canvas.width=240; canvas.height=240;
ctx.fillStyle='#16213e'; ctx.fillRect(0,0,240,240);

})();
</script>
</body>
</html>
