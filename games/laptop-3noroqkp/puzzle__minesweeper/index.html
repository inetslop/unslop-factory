<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #e0e0e0;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}
#container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 16px;
}
h1 {
  font-size: 2rem;
  color: #ffd700;
  text-shadow: 0 0 10px rgba(255,215,0,0.3);
  letter-spacing: 4px;
  text-transform: uppercase;
}
#top-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  background: #16213e;
  padding: 8px 16px;
  border-radius: 8px;
  border: 2px solid #0f3460;
}
.counter {
  font-size: 1.5rem;
  font-weight: bold;
  color: #ff6b6b;
  min-width: 70px;
  text-align: center;
  background: #0a0a1a;
  padding: 4px 8px;
  border-radius: 4px;
  font-family: monospace;
}
#reset-btn {
  font-size: 2rem;
  cursor: pointer;
  background: none;
  border: none;
  filter: grayscale(0);
  transition: transform 0.1s;
}
#reset-btn:hover { transform: scale(1.2); }
#board {
  display: grid;
  gap: 3px;
  padding: 6px;
  background: #16213e;
  border-radius: 8px;
  border: 2px solid #0f3460;
}
.cell {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
  transition: background 0.1s;
}
.cell.hidden {
  background: #533483;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.1), inset -2px -2px 0 rgba(0,0,0,0.3);
}
.cell.hidden:hover { background: #6a4c9c; }
.cell.revealed {
  background: #1f2d55;
  box-shadow: inset 1px 1px 0 rgba(0,0,0,0.4);
}
.cell.mine { background: #ff6b6b !important; }
.cell.flagged { background: #ffd70033; }
.n1 { color: #64b5f6; } .n2 { color: #81c784; } .n3 { color: #e57373; }
.n4 { color: #9575cd; } .n5 { color: #ff8a65; } .n6 { color: #4dd0e1; }
.n7 { color: #f06292; } .n8 { color: #a1887f; }
#status {
  font-size: 1.1rem;
  min-height: 1.5em;
  text-align: center;
}
.win { color: #4dd0e1 !important; }
.lose { color: #ff6b6b !important; }
#start-screen {
  position: fixed;
  inset: 0;
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  z-index: 100;
}
#start-screen h1 { font-size: 3rem; }
.instructions {
  text-align: center;
  line-height: 1.8;
  color: #b0bec5;
  max-width: 400px;
}
.start-btn {
  padding: 12px 32px;
  font-size: 1.2rem;
  background: #ffd700;
  color: #1a1a2e;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  transition: transform 0.1s, box-shadow 0.1s;
}
.start-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,215,0,0.4); }
@media (max-width: 500px) {
  .cell { width: 30px; height: 30px; font-size: 0.85rem; }
  h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div id="start-screen">
  <h1>Minesweeper</h1>
  <div class="instructions">
    <p>Find all mines on the grid without clicking them.</p>
    <p><strong>Left Click</strong> – Reveal cell</p>
    <p><strong>Right Click</strong> – Place / Remove Flag</p>
    <p>Numbers indicate how many adjacent cells contain mines.</p>
    <p>Reveal all safe cells to win!</p>
  </div>
  <button class="start-btn" id="start-btn">Start Game</button>
</div>

<div id="container">
  <h1>Minesweeper</h1>
  <div id="top-bar">
    <div class="counter" id="mine-counter">010</div>
    <button id="reset-btn">😊</button>
    <div class="counter" id="timer">000</div>
  </div>
  <div id="board"></div>
  <div id="status"></div>
</div>

<script>
const ROWS = 9, COLS = 9, MINES = 10;
let grid = [], flags = [], revealed = [], minesPlaced = false;
let flagsCount = 0, safeRevealed = 0, timerInterval = null, seconds = 0;
let gameOver = false, audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.value = vol || 0.1;
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function sfxClick() { playTone(800, 0.05, 'square', 0.05); }
function sfxFlag() { playTone(400, 0.08, 'triangle', 0.08); }
function sfxBoom() {
  playTone(100, 0.5, 'sawtooth', 0.3);
  playTone(60, 0.7, 'square', 0.2);
}
function sfxWin() {
  [523, 659, 784, 1047].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.3, 'sine', 0.1), i * 120);
  });
}

function createBoard() {
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell hidden';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', onLeftClick);
      cell.addEventListener('contextmenu', onRightClick);
      boardEl.appendChild(cell);
    }
  }
}

function resetGame() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  flags = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  revealed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  minesPlaced = false;
  flagsCount = 0; safeRevealed = 0; seconds = 0; gameOver = false;
  clearInterval(timerInterval);
  document.getElementById('timer').textContent = '000';
  updateMineCounter();
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = '';
  createBoard();
}

function placeMines(safeR, safeC) {
  const safeZone = new Set();
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      const nr = safeR + dr, nc = safeC + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) safeZone.add(nr * COLS + nc);
    }
  let placed = 0;
  while (placed < MINES) {
    const r = Math.floor(Math.random() * ROWS);
    const c = Math.floor(Math.random() * COLS);
    if (grid[r][c] === -1 || safeZone.has(r * COLS + c)) continue;
    grid[r][c] = -1; placed++;
  }
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] === -1) continue;
      let count = 0;
      forNeighbors(r, c, (nr, nc) => { if (grid[nr][nc] === -1) count++; });
      grid[r][c] = count;
    }
}

function forNeighbors(r, c, fn) {
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) fn(nr, nc);
    }
}

function onLeftClick(e) {
  if (gameOver) return;
  initAudio();
  const r = +this.dataset.r, c = +this.dataset.c;
  if (flags[r][c]) return;
  if (revealed[r][c]) return;

  if (!minesPlaced) {
    placeMines(r, c);
    minesPlaced = true;
    startTimer();
  }

  revealCell(r, c);
}

function onRightClick(e) {
  e.preventDefault();
  if (gameOver || !minesPlaced) return;
  const r = +this.dataset.r, c = +this.dataset.c;
  if (revealed[r][c]) return;
  flags[r][c] = !flags[r][c];
  flagsCount += flags[r][c] ? 1 : -1;
  updateMineCounter();
  renderCell(r, c);
  sfxFlag();
}

function revealCell(r, c) {
  if (revealed[r][c] || flags[r][c]) return;
  revealed[r][c] = true;

  if (grid[r][c] === -1) {
    loseGame(r, c);
    return;
  }

  safeRevealed++;
  renderCell(r, c);
  sfxClick();

  if (grid[r][c] === 0) {
    const queue = [[r, c]];
    while (queue.length) {
      const [cr, cc] = queue.shift();
      forNeighbors(cr, cc, (nr, nc) => {
        if (!revealed[nr][nc] && !flags[nr][nc] && grid[nr][nc] !== -1) {
          revealed[nr][nc] = true;
          safeRevealed++;
          renderCell(nr, nc);
          if (grid[nr][nc] === 0) queue.push([nr, nc]);
        }
      });
    }
  }

  checkWin();
}

function loseGame(r, c) {
  gameOver = true;
  clearInterval(timerInterval);
  sfxBoom();
  for (let i = 0; i < ROWS; i++)
    for (let j = 0; j < COLS; j++) {
      if (grid[i][j] === -1) renderCell(i, j);
    }
  const cellEl = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (cellEl) cellEl.classList.add('mine');
  document.getElementById('status').textContent = '💥 Boom! Game Over.';
  document.getElementById('status').className = 'lose';
  document.getElementById('reset-btn').textContent = '😵';
}

function checkWin() {
  const totalSafe = ROWS * COLS - MINES;
  if (safeRevealed >= totalSafe) {
    gameOver = true;
    clearInterval(timerInterval);
    sfxWin();
    for (let i = 0; i < ROWS; i++)
      for (let j = 0; j < COLS; j++) {
        if (!revealed[i][j] && grid[i][j] === -1) renderCell(i, j);
      }
    document.getElementById('status').textContent = '🎉 You Win! All clear!';
    document.getElementById('status').className = 'win';
    document.getElementById('reset-btn').textContent = '😎';
  }
}

function renderCell(r, c) {
  const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if (!el) return;
  el.className = 'cell';
  if (revealed[r][c]) {
    el.classList.add('revealed');
    if (grid[r][c] === -1) {
      el.textContent = '💣';
      el.classList.add('mine');
    } else if (grid[r][c] > 0) {
      el.textContent = grid[r][c];
      el.classList.add('n' + grid[r][c]);
    }
  } else {
    if (flags[r][c]) {
      el.classList.add('flagged');
      el.textContent = '🚩';
    }
  }
}

function updateMineCounter() {
  const remaining = MINES - flagsCount;
  document.getElementById('mine-counter').textContent = String(Math.max(0, remaining)).padStart(3, '0');
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    if (seconds > 999) seconds = 999;
    document.getElementById('timer').textContent = String(seconds).padStart(3, '0');
  }, 1000);
}

document.getElementById('reset-btn').addEventListener('click', resetGame);
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  resetGame();
});

window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    if (document.getElementById('start-screen').style.display !== 'none') {
      document.getElementById('start-btn').click();
    } else {
      resetGame();
    }
  }
});

resetGame();
</script>
</body>
</html>
