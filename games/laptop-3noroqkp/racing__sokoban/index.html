<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racing Sokoban</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    switch(type) {
        case 'move':
            osc.type = 'sine'; osc.frequency.value = 220;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1); break;
        case 'push':
            osc.type = 'square'; osc.frequency.value = 150;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15); break;
        case 'place':
            osc.type = 'sine'; osc.frequency.value = 440;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3); break;
        case 'win':
            osc.type = 'sine'; osc.frequency.value = 523;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5); break;
        case 'lose':
            osc.type = 'sawtooth'; osc.frequency.value = 100;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5); break;
        case 'tick':
            osc.type = 'sine'; osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05); break;
    }
}

// Game State
const STATE = { MENU: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3, WIN: 4 };
let gameState = STATE.MENU;
let currentLevel = 0;
let timer = 0;
let lastTick = 0;
let totalScore = 0;
let levelScore = 0;
let particles = [];
let speedLines = [];
let animFrame = 0;

// Level definitions
const levels = [
    { name: "QUALIFYING", time: 120, grid: [
        "########",
        "#     #",
        "# $ .#",
        "# @  #",
        "# $ .#",
        "#    #",
        "########"
    ]},
    { name: "PIT LANE", time: 90, grid: [
        "##########",
        "#   ##   #",
        "# $  ..# #",
        "# @ ##$# #",
        "# $  ..# #",
        "#   ##   #",
        "##########"
    ]},
    { name: "TURN 1", time: 75, grid: [
        "###########",
        "#    #   #",
        "# $  .  #",
        "# @$ #  #",
        "# $  .  #",
        "#    #   #",
        "###########"
    ]},
    { name: "APEX", time: 60, grid: [
        "############",
        "#         #",
        "# ##$##..# ",
        "# # @$#   #",
        "# #$# ##  #",
        "# ##$##   #",
        "#         #",
        "############"
    ]},
    { name: "CHECKERED FLAG", time: 45, grid: [
        "#############",
        "#         #",
        "# $ ##$## #",
        "# @ #$#..# ",
        "# $ ##$## #",
        "#  ..#  # #",
        "#         #",
        "#############"
    ]}
];

let playerX = 0, playerY = 0;
let boxes = [];
let targets = [];
let walls = new Set();
let gridW = 0, gridH = 0;
let completedBoxes = 0;

function parseLevel(idx) {
    const g = levels[idx].grid;
    gridH = g.length;
    gridW = Math.max(...g.map(r => r.length));
    playerX = 0; playerY = 0;
    boxes = [];
    targets = [];
    walls = new Set();
    completedBoxes = 0;

    for (let y = 0; y < gridH; y++) {
        for (let x = 0; x < gridW; x++) {
            const ch = g[y][x] || ' ';
            if (ch === '#') walls.add(x + ',' + y);
            if (ch === '@') { playerX = x; playerY = y; }
            if (ch === '$') boxes.push({x, y});
            if (ch === '.') targets.push({x, y});
        }
    }
    timer = levels[idx].time;
}

function isWall(x, y) { return walls.has(x + ',' + y); }
function hasBox(x, y) { return boxes.some(b => b.x === x && b.y === y); }
function boxOnTarget(x, y) { return targets.some(t => t.x === x && t.y === y) && hasBox(x, y); }

function checkWin() {
    return boxes.every(b => targets.some(t => t.x === b.x && t.y === b.y));
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x * cellSize + cellSize/2,
            y: y * cellSize + cellSize/2,
            vx: (Math.random()-0.5)*3,
            vy: (Math.random()-0.5)*3,
            life: 1,
            color: color
        });
    }
}

let cellSize = 40;
function calcCellSize() {
    const padX = 80, padY = 120;
    cellSize = Math.min(
        (canvas.width - padX) / gridW,
        (canvas.height - padY) / gridH
    );
    cellSize = Math.floor(Math.min(cellSize, 64));
}

function offsetX() { return (canvas.width - gridW * cellSize) / 2; }
function offsetY() { return (canvas.height - gridH * cellSize) / 2 + 30; }

let lastDir = {x:0, y:0};

function move(dx, dy) {
    if (gameState !== STATE.PLAYING) return;
    initAudio();
    const nx = playerX + dx, ny = playerY + dy;
    if (isWall(nx, ny)) { playSound('move'); return; }
    if (hasBox(nx, ny)) {
        const bx = nx + dx, by = ny + dy;
        if (isWall(bx, by) || hasBox(bx, by)) { playSound('move'); return; }
        const box = boxes.find(b => b.x === nx && b.y === ny);
        box.x = bx; box.y = by;
        addParticles(bx, by, '#ffaa00', 5);
        if (targets.some(t => t.x === bx && t.y === by)) {
            playSound('place');
            addParticles(bx, by, '#00ff88', 10);
        } else {
            playSound('push');
        }
    } else {
        playSound('move');
    }
    playerX = nx; playerY = ny;
    lastDir = {x: dx, y: dy};
    if (checkWin()) {
        levelScore = Math.floor(timer * 10);
        totalScore += levelScore;
        gameState = STATE.LEVEL_COMPLETE;
        playSound('win');
        for (let i = 0; i < 30; i++) addParticles(Math.floor(gridW/2), Math.floor(gridH/2), ['#ff0','0ff','f0f'][i%3], 1);
    }
}

function startGame() {
    currentLevel = 0;
    totalScore = 0;
    parseLevel(0);
    gameState = STATE.PLAYING;
    calcCellSize();
}

function nextLevel() {
    currentLevel++;
    if (currentLevel >= levels.length) {
        gameState = STATE.WIN;
    } else {
        parseLevel(currentLevel);
        gameState = STATE.PLAYING;
        calcCellSize();
    }
}

// Input
window.addEventListener('keydown', e => {
    initAudio();
    if (gameState === STATE.MENU) {
        if (e.key === ' ' || e.key === 'Enter') startGame();
        return;
    }
    if (gameState === STATE.PLAYING) {
        switch(e.key) {
            case 'ArrowUp': case 'w': case 'W': move(0,-1); break;
            case 'ArrowDown': case 's': case 'S': move(0,1); break;
            case 'ArrowLeft': case 'a': case 'A': move(-1,0); break;
            case 'ArrowRight': case 'd': case 'D': move(1,0); break;
            case 'r': case 'R': parseLevel(currentLevel); calcCellSize(); break;
        }
    }
    if (gameState === STATE.LEVEL_COMPLETE) {
        if (e.key === ' ' || e.key === 'Enter') nextLevel();
    }
    if (gameState === STATE.GAME_OVER || gameState === STATE.WIN) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R') startGame();
    }
});

// Speed lines
function updateSpeedLines() {
    if (Math.random() < 0.3) {
        speedLines.push({
            x: Math.random() * canvas.width,
            y: -10,
            len: 20 + Math.random() * 40,
            speed: 5 + Math.random() * 5,
            alpha: 0.3 + Math.random() * 0.3
        });
    }
    for (let i = speedLines.length - 1; i >= 0; i--) {
        speedLines[i].y += speedLines[i].speed;
        if (speedLines[i].y > canvas.height + 50) speedLines.splice(i, 1);
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life -= 0.03;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

// Rendering
function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines
    ctx.strokeStyle = 'rgba(30, 40, 80, 0.3)';
    ctx.lineWidth = 1;
    const gs = cellSize;
    const ox = offsetX(), oy = offsetY();
    for (let x = 0; x <= gridW; x++) {
        ctx.beginPath();
        ctx.moveTo(ox + x*gs, oy);
        ctx.lineTo(ox + x*gs, oy + gridH*gs);
        ctx.stroke();
    }
    for (let y = 0; y <= gridH; y++) {
        ctx.beginPath();
        ctx.moveTo(ox, oy + y*gs);
        ctx.lineTo(ox + gridW*gs, oy + y*gs);
        ctx.stroke();
    }

    // Speed lines
    for (const sl of speedLines) {
        ctx.strokeStyle = `rgba(100, 150, 255, ${sl.alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sl.x, sl.y);
        ctx.lineTo(sl.x, sl.y + sl.len);
        ctx.stroke();
    }
}

function drawWalls() {
    const ox = offsetX(), oy = offsetY();
    for (const w of walls) {
        const [x, y] = w.split(',').map(Number);
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(ox + x*cellSize, oy + y*cellSize, cellSize, cellSize);
        // Wall border glow
        ctx.strokeStyle = 'rgba(80, 80, 160, 0.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(ox + x*cellSize+1, oy + y*cellSize+1, cellSize-2, cellSize-2);
        // Inner detail
        ctx.fillStyle = 'rgba(40, 40, 80, 0.5)';
        const s = cellSize * 0.3;
        ctx.fillRect(ox + x*cellSize + cellSize/2 - s/2, oy + y*cellSize + cellSize/2 - s/2, s, s);
    }
}

function drawTargets() {
    const ox = offsetX(), oy = offsetY();
    const pulse = 0.5 + 0.5 * Math.sin(animFrame * 0.05);
    for (const t of targets) {
        const cx = ox + t.x*cellSize + cellSize/2;
        const cy = oy + t.y*cellSize + cellSize/2;
        // Glow
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize*0.35, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0, 255, 136, ${0.15 + pulse * 0.1})`;
        ctx.fill();
        // Ring
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize*0.3, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(0, 255, 136, ${0.5 + pulse * 0.3})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        // Center dot
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize*0.1, 0, Math.PI*2);
        ctx.fillStyle = '#00ff88';
        ctx.fill();
    }
}

function drawBoxes() {
    const ox = offsetX(), oy = offsetY();
    for (const b of boxes) {
        const bx = ox + b.x * cellSize;
        const by = oy + b.y * cellSize;
        const onT = targets.some(t => t.x === b.x && t.y === b.y);
        
        // Box body
        ctx.fillStyle = onT ? '#00cc66' : '#ff8800';
        ctx.fillRect(bx + 4, by + 4, cellSize - 8, cellSize - 8);
        // Border
        ctx.strokeStyle = onT ? '#00ff88' : '#ffaa00';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx + 4, by + 4, cellSize - 8, cellSize - 8);
        // Label
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${cellSize * 0.35}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(onT ? 'OK' : 'F', bx + cellSize/2, by + cellSize/2);
        
        if (onT) {
            // Glow effect
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;
            ctx.strokeStyle = 'rgba(0,255,136,0.5)';
            ctx.strokeRect(bx + 2, by + 2, cellSize - 4, cellSize - 4);
            ctx.shadowBlur = 0;
        }
    }
}

function drawPlayer() {
    const ox = offsetX(), oy = offsetY();
    const px = ox + playerX * cellSize + cellSize/2;
    const py = oy + playerY * cellSize + cellSize/2;
    const s = cellSize * 0.35;

    ctx.save();
    ctx.translate(px, py);
    
    // Car body (triangle pointing in direction)
    let angle = 0;
    if (lastDir.x === 1) angle = 0;
    else if (lastDir.x === -1) angle = Math.PI;
    else if (lastDir.y === 1) angle = Math.PI/2;
    else if (lastDir.y === -1) angle = -Math.PI/2;
    
    ctx.rotate(angle);
    
    // Glow
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 8;
    
    ctx.beginPath();
    ctx.moveTo(s, 0);
    ctx.lineTo(-s*0.7, -s*0.6);
    ctx.lineTo(-s*0.4, 0);
    ctx.lineTo(-s*0.7, s*0.6);
    ctx.closePath();
    ctx.fillStyle = '#00ffff';
    ctx.fill();
    
    // Inner detail
    ctx.beginPath();
    ctx.moveTo(s*0.5, 0);
    ctx.lineTo(-s*0.3, -s*0.3);
    ctx.lineTo(-s*0.1, 0);
    ctx.lineTo(-s*0.3, s*0.3);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    
    ctx.shadowBlur = 0;
    ctx.restore();
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    const level = levels[currentLevel];
    
    // Level name
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(level.name, canvas.width/2, 30);
    
    // Timer
    const t = Math.max(0, timer);
    const tStr = `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
    ctx.font = 'bold 32px monospace';
    if (t < 15) {
        ctx.fillStyle = '#ff3333';
        const flash = Math.sin(animFrame * 0.2) > 0 ? 1 : 0.5;
        ctx.globalAlpha = flash;
    } else {
        ctx.fillStyle = t < 30 ? '#ffaa00' : '#00ff88';
    }
    ctx.fillText(tStr, canvas.width/2, 65);
    ctx.globalAlpha = 1;
    
    // Score
    ctx.font = '14px monospace';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${totalScore}`, 15, 25);
    ctx.fillText(`LEVEL: ${currentLevel + 1}/${levels.length}`, 15, 45);
    
    // Boxes remaining
    const placed = boxes.filter(b => targets.some(t => t.x===b.x && t.y===b.y)).length;
    ctx.fillStyle = '#00ff88';
    ctx.textAlign = 'right';
    ctx.fillText(`${placed}/${boxes.length} FUELED`, canvas.width - 15, 25);
    
    // Controls hint
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ARROWS/WASD: MOVE | R: RESET LEVEL', canvas.width/2, canvas.height - 15);
}

function drawMenu() {
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Speed lines in background
    for (const sl of speedLines) {
        ctx.strokeStyle = `rgba(100, 150, 255, ${sl.alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sl.x, sl.y);
        ctx.lineTo(sl.x, sl.y + sl.len);
        ctx.stroke();
    }
    
    // Title
    const pulse = 0.8 + 0.2 * Math.sin(animFrame * 0.05);
    ctx.save();
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = `rgba(0, 255, 255, ${pulse})`;
    ctx.font = `bold ${Math.min(canvas.width * 0.08, 64)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('RACING', canvas.width/2, canvas.height * 0.3);
    ctx.fillStyle = `rgba(255, 170, 0, ${pulse})`;
    ctx.shadowColor = '#ffaa00';
    ctx.fillText('SOKOBAN', canvas.width/2, canvas.height * 0.3 + Math.min(canvas.width * 0.08, 64));
    ctx.restore();
    
    // Subtitle
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('Push fuel tanks to charging stations before time runs out!', canvas.width/2, canvas.height * 0.45);
    
    // Controls
    ctx.fillStyle = '#888';
    ctx.font = '14px monospace';
    const cy = canvas.height * 0.55;
    ctx.fillText('↑↓←→ / WASD — Move & Push', canvas.width/2, cy);
    ctx.fillText('R — Reset Level', canvas.width/2, cy + 25);
    ctx.fillText('Complete all 5 stages to win!', canvas.width/2, cy + 50);
    
    // Start prompt
    const blink = Math.sin(animFrame * 0.1) > 0;
    if (blink) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('PRESS SPACE TO START', canvas.width/2, canvas.height * 0.75);
    }
}

function drawLevelComplete() {
    drawGame();
    
    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#00ff88';
    ctx.font = `bold ${Math.min(canvas.width*0.06, 48)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('STAGE CLEAR!', canvas.width/2, canvas.height * 0.35);
    
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Time Bonus: +${levelScore}`, canvas.width/2, canvas.height * 0.45);
    ctx.fillText(`Total Score: ${totalScore}`, canvas.width/2, canvas.height * 0.52);
    
    if (currentLevel < levels.length - 1) {
        const blink = Math.sin(animFrame * 0.1) > 0;
        if (blink) {
            ctx.fillStyle = '#ffaa00';
            ctx.font = '18px monospace';
            ctx.fillText('PRESS SPACE FOR NEXT STAGE', canvas.width/2, canvas.height * 0.65);
        }
    }
}

function drawGameOver() {
    drawGame();
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#ff3333';
    ctx.font = `bold ${Math.min(canvas.width*0.06, 48)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('TIME UP!', canvas.width/2, canvas.height * 0.35);
    
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Final Score: ${totalScore}`, canvas.width/2, canvas.height * 0.45);
    
    const blink = Math.sin(animFrame * 0.1) > 0;
    if (blink) {
        ctx.fillStyle = '#ffaa00';
        ctx.font = '18px monospace';
        ctx.fillText('PRESS SPACE TO RESTART', canvas.width/2, canvas.height * 0.6);
    }
}

function drawWin() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Checkered flag pattern
    const cs = Math.min(canvas.width, canvas.height) / 20;
    for (let y = 0; y < Math.ceil(canvas.height/cs); y++) {
        for (let x = 0; x < Math.ceil(canvas.width/cs); x++) {
            if ((x+y) % 2 === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.fillRect(x*cs, y*cs, cs, cs);
            }
        }
    }
    
    // Trophy / text
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#ffaa00';
    ctx.font = `bold ${Math.min(canvas.width*0.07, 64)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('🏁 RACE COMPLETE!', canvas.width/2, canvas.height * 0.3);
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${totalScore}`, canvas.width/2, canvas.height * 0.45);
    ctx.fillText('All fuel tanks delivered!', canvas.width/2, canvas.height * 0.53);
    
    const blink = Math.sin(animFrame * 0.1) > 0;
    if (blink) {
        ctx.fillStyle = '#00ff88';
        ctx.font = '18px monospace';
        ctx.fillText('PRESS SPACE TO RACE AGAIN', canvas.width/2, canvas.height * 0.7);
    }
}

function drawGame() {
    drawBackground();
    drawWalls();
    drawTargets();
    drawBoxes();
    drawPlayer();
    drawParticles();
    drawHUD();
}

function gameLoop(timestamp) {
    animFrame++;
    
    if (gameState === STATE.PLAYING) {
        const now = Date.now() / 1000;
        timer -= (now - lastTick);
        lastTick = now;
        
        // Tick sound for last 10 seconds
        if (timer < 10 && timer > 0) {
            const sec = Math.ceil(timer);
            if (Math.floor(timer) !== Math.floor(timer + 0.016)) {
                playSound('tick');
            }
        }
        
        if (timer <= 0) {
            timer = 0;
            gameState = STATE.GAME_OVER;
            playSound('lose');
        }
    } else {
        lastTick = Date.now() / 1000;
    }
    
    updateSpeedLines();
    updateParticles();
    
    switch(gameState) {
        case STATE.MENU: drawMenu(); break;
        case STATE.PLAYING: drawGame(); break;
        case STATE.LEVEL_COMPLETE: drawLevelComplete(); break;
        case STATE.GAME_OVER: drawGameOver(); break;
        case STATE.WIN: drawWin(); break;
    }
    
    requestAnimationFrame(gameLoop);
}

// Init
for (let i = 0; i < 15; i++) {
    speedLines.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        len: 20 + Math.random() * 40,
        speed: 3 + Math.random() * 4,
        alpha: 0.2 + Math.random() * 0.2
    });
}

lastTick = Date.now() / 1000;
requestAnimationFrame(gameLoop);
</script>
