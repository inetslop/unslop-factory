<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TURN DANMAKU</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Courier New', monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#startScreen, #gameOverScreen {
position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
text-align: center; color: #fff; z-index: 10;
}
#startScreen h1 { font-size: clamp(2rem, 5vw, 3.5rem); color: #ff3366; text-shadow: 0 0 20px #ff3366, 0 0 40px #ff3366; margin-bottom: 20px; letter-spacing: 4px; }
#startScreen p, #gameOverScreen p { font-size: clamp(0.8rem, 1.5vw, 1rem); color: #aab; line-height: 1.8; }
#startScreen .key { color: #66ffcc; background: #1a1a2e; padding: 2px 8px; border-radius: 3px; border: 1px solid #66ffcc44; }
.btn { pointer-events: auto; display: inline-block; margin-top: 20px; padding: 12px 32px; background: transparent; border: 2px solid #ff3366; color: #ff3366; font-family: inherit; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; }
.btn:hover { background: #ff3366; color: #fff; box-shadow: 0 0 20px #ff336688; }
#gameOverScreen { display: none; }
#gameOverScreen h1 { font-size: clamp(2rem, 5vw, 3rem); color: #ff3366; text-shadow: 0 0 20px #ff3366; margin-bottom: 15px; }
#hud { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); color: #aab; font-size: clamp(0.7rem, 1.2vw, 0.9rem); display: none; text-align: center; }
#hud .hp { color: #ff6688; }
#hud .score { color: #66ffcc; }
#hud .wave { color: #ffaa33; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="startScreen">
<h1>TURN DANMAKU</h1>
<p>A turn-based bullet-hell. Survive the waves.</p>
<p><span class="key">↑↓←→</span> or <span class="key">WASD</span> — Move one cell<br>
<span class="key">SPACE</span> — Attack adjacent enemy (1 dmg)<br>
<span class="key">R</span> — Restart</p>
<p style="margin-top:12px;color:#667">Each turn you act, then enemies fire, then bullets advance.<br>Dodge or destroy. Don't get hit.</p>
<button class="btn" id="startBtn">START</button>
</div>
<div id="gameOverScreen">
<h1>GAME OVER</h1>
<p id="finalStats"></p>
<button class="btn" id="restartBtn">RESTART</button>
</div>
<div id="hud"><span class="hp">HP: <span id="hpVal">3</span></span> &nbsp; <span class="score">SCORE: <span id="scoreVal">0</span></span> &nbsp; <span class="wave">WAVE: <span id="waveVal">1</span></span></div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cellSize;
const COLS = 15, ROWS = 11;

function resize() {
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
cellSize = Math.min((W - 40) / COLS, (H - 80) / ROWS);
}
window.addEventListener('resize', resize);
resize();

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type='square', vol=0.15) {
if (!audioCtx) return;
const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
}

let state = 'start'; // start, playing, over
let player, enemies, bullets, turn, score, wave, animQueue;
const DIRS = [{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}];

function initGame() {
player = { x: Math.floor(COLS/2), y: Math.floor(ROWS/2), hp: 3, maxHp: 5 };
enemies = []; bullets = []; turn = 1; score = 0; wave = 1; animQueue = [];
spawnWave();
}

function spawnWave() {
const w = wave;
const count = Math.min(2 + w, 8);
const types = ['spinner', 'aimbot', 'cross', 'wall'];
for (let i = 0; i < count; i++) {
let ex, ey, tries = 0;
do { ex = Math.floor(Math.random() * COLS); ey = Math.floor(Math.random() * ROWS); tries++; }
while (Math.abs(ex - player.x) + Math.abs(ey - player.y) < 3 && tries < 50);
const type = types[Math.floor(Math.random() * Math.min(types.length, 1 + w))];
enemies.push({ x: ex, y: ey, type, hp: type === 'wall' ? 3 : 2, maxHp: type === 'wall' ? 3 : 2, fireTimer: Math.floor(Math.random() * 2) });
}
}

function playerMove(dx, dy) {
if (state !== 'playing') return;
const nx = player.x + dx, ny = player.y + dy;
if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
player.x = nx; player.y = ny;
playSound(220, 0.05, 'sine', 0.1);
endPlayerTurn();
}

function playerAttack() {
if (state !== 'playing') return;
let hit = false;
for (const e of enemies) {
if (Math.abs(e.x - player.x) + Math.abs(e.y - player.y) === 1) {
e.hp--; hit = true; playSound(440, 0.1, 'sawtooth', 0.2);
animQueue.push({ type: 'hit', x: e.x, y: e.y, t: 0 });
if (e.hp <= 0) { enemies.splice(enemies.indexOf(e), 1); score += 10; playSound(880, 0.2, 'square', 0.15); }
break;
}
}
endPlayerTurn();
}

function endPlayerTurn() {
enemyTurn();
bulletMove();
checkCollisions();
turn++;
score += 1;
if (enemies.length === 0) { wave++; setTimeout(spawnWave, 500); }
if (player.hp <= 0) gameOver();
}

function enemyTurn() {
for (const e of enemies) {
e.fireTimer++;
const interval = e.type === 'aimbot' ? 2 : e.type === 'cross' ? 3 : 2;
if (e.fireTimer >= interval) {
e.fireTimer = 0;
fireEnemy(e);
playSound(150, 0.08, 'sawtooth', 0.08);
}
}
}

function fireEnemy(e) {
const dirs4 = [{x:0,y:-1},{x:1,y:0},{x:0,y:1},{x:-1,y:0}];
const dirs8 = [...dirs4, {x:1,y:-1},{x:1,y:1},{x:-1,y:1},{x:-1,y:-1}];
switch (e.type) {
case 'spinner':
for (const d of dirs4) bullets.push({ x: e.x + d.x, y: e.y + d.y, dx: d.x, dy: d.y, color: '#ff3366' });
break;
case 'cross':
for (const d of dirs8) bullets.push({ x: e.x + d.x, y: e.y + d.y, dx: d.x, dy: d.y, color: '#ffaa33' });
break;
case 'aimbot': {
let dx = player.x - e.x, dy = player.y - e.y;
const dist = Math.max(Math.abs(dx), Math.abs(dy));
if (dist > 0) { dx /= dist; dy /= dist; }
bullets.push({ x: e.x + Math.round(dx), y: e.y + Math.round(dy), dx: Math.round(dx * 1.5), dy: Math.round(dy * 1.5), color: '#ff3366' });
// Add a secondary aimed shot
const angle = Math.atan2(dy, dx);
for (let i = -1; i <= 1; i += 2) {
const sa = angle + i * 0.4;
bullets.push({ x: e.x + Math.round(Math.cos(sa)), y: e.y + Math.round(Math.sin(sa)), dx: Math.round(Math.cos(sa) * 1.5), dy: Math.round(Math.sin(sa) * 1.5), color: '#ff6644' });
}
break;
}
case 'wall': {
const dir = player.x > e.x ? 1 : -1;
for (let r = 0; r < ROWS; r++) bullets.push({ x: e.x, y: r, dx: dir, dy: 0, color: '#cc44ff' });
break;
}
}
}

function bulletMove() {
const newBullets = [];
for (const b of bullets) {
const nx = b.x + b.dx, ny = b.y + b.dy;
if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
// Check if bullet hits an enemy
let hitEnemy = false;
for (const e of enemies) { if (e.x === nx && e.y === ny) { hitEnemy = true; break; } }
if (!hitEnemy) newBullets.push({ x: nx, y: ny, dx: b.dx, dy: b.dy, color: b.color });
}
bullets = newBullets;
}

function checkCollisions() {
for (let i = bullets.length - 1; i >= 0; i--) {
const b = bullets[i];
if (b.x === player.x && b.y === player.y) {
player.hp--;
animQueue.push({ type: 'dmg', x: player.x, y: player.y, t: 0 });
playSound(100, 0.3, 'sawtooth', 0.3);
bullets.splice(i, 1);
} else {
for (const e of enemies) {
if (b.x === e.x && b.y === e.y) { e.hp--; bullets.splice(i, 1); break; }
}
}
}
// Remove dead enemies
enemies = enemies.filter(e => e.hp > 0);
}

function gameOver() {
state = 'over';
document.getElementById('hud').style.display = 'none';
document.getElementById('gameOverScreen').style.display = 'block';
document.getElementById('finalStats').innerHTML = `Score: <span style="color:#66ffcc">${score}</span><br>Wave reached: <span style="color:#ffaa33">${wave}</span><br>Turns survived: ${turn - 1}`;
}

function startGame() {
initAudio();
state = 'playing';
initGame();
document.getElementById('startScreen').style.display = 'none';
document.getElementById('gameOverScreen').style.display = 'none';
document.getElementById('hud').style.display = 'block';
updateHUD();
}

function updateHUD() {
document.getElementById('hpVal').textContent = player.hp;
document.getElementById('scoreVal').textContent = score;
document.getElementById('waveVal').textContent = wave;
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

window.addEventListener('keydown', (e) => {
if (state === 'playing') {
switch (e.key) {
case 'ArrowUp': case 'w': case 'W': e.preventDefault(); playerMove(0, -1); break;
case 'ArrowDown': case 's': case 'S': e.preventDefault(); playerMove(0, 1); break;
case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); playerMove(-1, 0); break;
case 'ArrowRight': case 'd': case 'D': e.preventDefault(); playerMove(1, 0); break;
case ' ': e.preventDefault(); playerAttack(); break;
}
updateHUD();
} else if (state === 'over' && e.key === 'r') { startGame(); }
if (e.key === 'r' && state === 'start') startGame();
});

// Rendering
let frameCount = 0;
const enemyColors = { spinner: '#ff6644', aimbot: '#ff3366', cross: '#ffaa33', wall: '#cc44ff' };
const enemyShapes = { spinner: 'diamond', aimbot: 'triangle', cross: 'star', wall: 'square' };

function drawGrid() {
const ox = (W - COLS * cellSize) / 2, oy = (H - ROWS * cellSize) / 2 + 10;
ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 1;
for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(ox + c * cellSize, oy); ctx.lineTo(ox + c * cellSize, oy + ROWS * cellSize); ctx.stroke(); }
for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(ox, oy + r * cellSize); ctx.lineTo(ox + COLS * cellSize, oy + r * cellSize); ctx.stroke(); }
return { ox, oy };
}

function drawPlayer({ ox, oy }) {
const px = ox + player.x * cellSize + cellSize / 2;
const py = oy + player.y * cellSize + cellSize / 2;
const pulse = Math.sin(frameCount * 0.1) * 2;
ctx.save();
ctx.shadowColor = '#66ffcc'; ctx.shadowBlur = 15 + pulse;
ctx.fillStyle = '#66ffcc';
ctx.beginPath();
ctx.moveTo(px, py - cellSize * 0.3);
ctx.lineTo(px + cellSize * 0.25, py + cellSize * 0.25);
ctx.lineTo(px - cellSize * 0.25, py + cellSize * 0.25);
ctx.closePath(); ctx.fill();
ctx.restore();
// HP bar
const bw = cellSize * 0.7;
ctx.fillStyle = '#333'; ctx.fillRect(px - bw/2, py + cellSize * 0.3, bw, 4);
ctx.fillStyle = player.hp > 1 ? '#66ffcc' : '#ff3366';
ctx.fillRect(px - bw/2, py + cellSize * 0.3, bw * (player.hp / player.maxHp), 4);
}

function drawEnemies({ ox, oy }) {
for (const e of enemies) {
const ex = ox + e.x * cellSize + cellSize / 2;
const ey = oy + e.y * cellSize + cellSize / 2;
ctx.save();
ctx.shadowColor = enemyColors[e.type]; ctx.shadowBlur = 10;
ctx.fillStyle = enemyColors[e.type];
if (e.type === 'spinner') {
ctx.beginPath();
ctx.moveTo(ex, ey - cellSize*0.3); ctx.lineTo(ex + cellSize*0.25, ey);
ctx.lineTo(ex, ey + cellSize*0.3); ctx.lineTo(ex - cellSize*0.25, ey);
ctx.closePath(); ctx.fill();
} else if (e.type === 'aimbot') {
ctx.beginPath();
const angle = Math.atan2(player.y - e.y, player.x - e.x);
for (let i = 0; i < 3; i++) { const a = angle + i * 2.094; ctx.lineTo(ex + Math.cos(a) * cellSize*0.3, ey + Math.sin(a) * cellSize*0.3); }
ctx.closePath(); ctx.fill();
} else if (e.type === 'cross') {
drawStar(ex, ey, cellSize*0.15, cellSize*0.3, 5);
} else {
ctx.fillRect(ex - cellSize*0.25, ey - cellSize*0.25, cellSize*0.5, cellSize*0.5);
}
ctx.restore();
// HP pips
for (let i = 0; i < e.hp; i++) { ctx.fillStyle = enemyColors[e.type]; ctx.fillRect(ex - e.hp * 3 + i * 6, ey + cellSize * 0.32, 4, 4); }
}
}

function drawStar(cx, cy, r1, r2, n) {
ctx.beginPath();
for (let i = 0; i < n * 2; i++) {
const r = i % 2 === 0 ? r2 : r1;
const a = (i * Math.PI) / n - Math.PI / 2;
if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
}
ctx.closePath(); ctx.fill();
}

function drawBullets({ ox, oy }) {
for (const b of bullets) {
const bx = ox + b.x * cellSize + cellSize / 2;
const by = oy + b.y * cellSize + cellSize / 2;
ctx.save();
ctx.shadowColor = b.color; ctx.shadowBlur = 8;
ctx.fillStyle = b.color;
ctx.beginPath(); ctx.arc(bx, by, cellSize * 0.15, 0, Math.PI * 2); ctx.fill();
// Trail
ctx.globalAlpha = 0.4;
const tx = bx - b.dx * cellSize * 0.3, ty = by - b.dy * cellSize * 0.3;
ctx.beginPath(); ctx.arc(tx, ty, cellSize * 0.08, 0, Math.PI * 2); ctx.fill();
ctx.restore();
}
}

function drawAnims({ ox, oy }) {
for (let i = animQueue.length - 1; i >= 0; i--) {
const a = animQueue[i];
a.t++;
if (a.t > 20) { animQueue.splice(i, 1); continue; }
const ax = ox + a.x * cellSize + cellSize / 2;
const ay = oy + a.y * cellSize + cellSize / 2;
const progress = a.t / 20;
ctx.save(); ctx.globalAlpha = 1 - progress;
if (a.type === 'dmg') {
ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 3;
ctx.beginPath(); ctx.arc(ax, ay, cellSize * 0.4 * progress, 0, Math.PI * 2); ctx.stroke();
} else if (a.type === 'hit') {
ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
ctx.beginPath(); ctx.arc(ax, ay, cellSize * 0.3 * progress, 0, Math.PI * 2); ctx.stroke();
}
ctx.restore();
}
}

function render() {
requestAnimationFrame(render);
frameCount++;
ctx.fillStyle = '#0a0a12'; ctx.fillRect(0, 0, W, H);
if (state !== 'playing') return;
const { ox, oy } = drawGrid();
drawBullets({ ox, oy });
drawEnemies({ ox, oy });
drawPlayer({ ox, oy });
drawAnims({ ox, oy });
// Turn indicator
ctx.fillStyle = '#aab'; ctx.font = `${Math.min(14, cellSize * 0.3)}px monospace`;
ctx.textAlign = 'center';
ctx.fillText(`Turn ${turn}`, W / 2, H - 15);
}

render();
</script>
</body>
</html>
