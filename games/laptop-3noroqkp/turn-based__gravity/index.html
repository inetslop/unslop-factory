<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Shift</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, scale;
function resize() {
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
scale = Math.min(W, H) / 800;
}
window.addEventListener('resize', resize);
resize();

const GRID_SIZE = 7;
const COLORS = ['#ff4466','#44aaff','#44ff88','#ffcc44','#cc66ff'];
const COLOR_NAMES = ['red','blue','green','yellow','purple'];
const TARGET_SCORES = [100, 250, 500, 900, 1400, 2000, 3000, 4500, 6500, 9000];
const MOVES_PER_LEVEL = 25;

let state = 'start'; // start, playing, animating, levelComplete, gameOver
let grid = [];
let score = 0;
let targetScore = 100;
let movesLeft = MOVES_PER_LEVEL;
let level = 1;
let combo = 0;
let particles = [];
let animQueue = [];
let shakeTimer = 0;
let shakeIntensity = 0;
let floatTexts = [];

function initGrid() {
grid = [];
for (let r = 0; r < GRID_SIZE; r++) {
grid[r] = [];
for (let c = 0; c < GRID_SIZE; c++) {
grid[r][c] = Math.floor(Math.random() * COLORS.length);
}
}
// Remove initial matches
while (findMatches().length > 0) {
clearMatches(false);
refill();
}
}

function findMatches() {
let matched = new Set();
// Horizontal
for (let r = 0; r < GRID_SIZE; r++) {
for (let c = 0; c < GRID_SIZE - 2; c++) {
if (grid[r][c] !== -1 && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
matched.add(r + ',' + c); matched.add(r + ',' + (c+1)); matched.add(r + ',' + (c+2));
}
}
}
// Vertical
for (let c = 0; c < GRID_SIZE; c++) {
for (let r = 0; r < GRID_SIZE - 2; r++) {
if (grid[r][c] !== -1 && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
matched.add(r + ',' + c); matched.add((r+1) + ',' + c); matched.add((r+2) + ',' + c);
}
}
}
let arr = [];
matched.forEach(v => { let [r,c] = v.split(','); arr.push({r:+r, c:+c}); });
return arr;
}

function clearMatches(animate) {
let matches = findMatches();
if (matches.length === 0) return 0;
combo++;
let pts = matches.length * 10 * combo;
score += pts;
if (animate) {
floatTexts.push({ x: W/2, y: H/2 - 50*scale, text: '+' + pts + (combo > 1 ? ' x' + combo : ''), life: 60, maxLife: 60 });
}
matches.forEach(m => {
let cellSize = getCellSize();
let x = getGridX() + m.c * cellSize + cellSize/2;
let y = getGridY() + m.r * cellSize + cellSize/2;
for (let i = 0; i < 6; i++) {
particles.push({
x: x, y: y,
vx: (Math.random()-0.5)*4*scale, vy: (Math.random()-0.5)*4*scale - 2*scale,
life: 30 + Math.random()*20, maxLife: 50,
color: COLORS[grid[m.r][m.c]], size: (4+Math.random()*4)*scale
});
}
grid[m.r][m.c] = -1;
});
if (animate) { shakeTimer = 8; shakeIntensity = 3 * scale; }
return matches.length;
}

function refill() {
for (let c = 0; c < GRID_SIZE; c++) {
// Collect non-empty from bottom up
let blocks = [];
for (let r = GRID_SIZE - 1; r >= 0; r--) {
if (grid[r][c] !== -1) blocks.push(grid[r][c]);
}
while (blocks.length < GRID_SIZE) {
blocks.push(Math.floor(Math.random() * COLORS.length));
}
for (let r = GRID_SIZE - 1; r >= 0; r--) {
grid[r][c] = blocks[GRID_SIZE - 1 - r];
}
}
}

function shiftGrid(dir) {
// dir: 'up','down','left','right'
if (dir === 'down') {
for (let c = 0; c < GRID_SIZE; c++) {
let blocks = [];
for (let r = 0; r < GRID_SIZE; r++) if (grid[r][c] !== -1) blocks.push(grid[r][c]);
for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = (r >= GRID_SIZE - blocks.length) ? blocks[r - (GRID_SIZE - blocks.length)] : -1;
}
} else if (dir === 'up') {
for (let c = 0; c < GRID_SIZE; c++) {
let blocks = [];
for (let r = GRID_SIZE-1; r >= 0; r--) if (grid[r][c] !== -1) blocks.push(grid[r][c]);
for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = (r < blocks.length) ? blocks[r] : -1;
}
} else if (dir === 'right') {
for (let r = 0; r < GRID_SIZE; r++) {
let blocks = [];
for (let c = 0; c < GRID_SIZE; c++) if (grid[r][c] !== -1) blocks.push(grid[r][c]);
for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = (c >= GRID_SIZE - blocks.length) ? blocks[c - (GRID_SIZE - blocks.length)] : -1;
}
} else if (dir === 'left') {
for (let r = 0; r < GRID_SIZE; r++) {
let blocks = [];
for (let c = 0; c < GRID_SIZE; c++) if (grid[r][c] !== -1) blocks.push(grid[r][c]);
for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = (c < blocks.length) ? blocks[c] : -1;
}
}
}

function getCellSize() { return Math.min(W, H) * 0.065; }
function getGridX() { return (W - GRID_SIZE * getCellSize()) / 2; }
function getGridY() { return (H - GRID_SIZE * getCellSize()) / 2 + 30 * scale; }

let animFrame = 0;
let animPhase = 'none'; // shift, cascade
let animDir = '';
let shiftProgress = 0;
let displayGrid = [];

function startLevel() {
initGrid();
movesLeft = MOVES_PER_LEVEL;
combo = 0;
state = 'playing';
}

function doTurn(dir) {
if (state !== 'playing') return;
shiftGrid(dir);
animDir = dir;
animPhase = 'cascade';
shiftProgress = 0;
displayGrid = grid.map(row => row.slice());
combo = 0;
movesLeft--;
setTimeout(cascade, 150);
}

function cascade() {
let cleared = clearMatches(true);
if (cleared > 0) {
refill();
// Check for more matches after refill
setTimeout(() => {
let more = clearMatches(true);
if (more > 0) {
refill();
cascade();
} else {
checkEnd();
}
}, 250);
} else {
checkEnd();
}
combo = 0;
}

function checkEnd() {
if (score >= targetScore) {
state = 'levelComplete';
setTimeout(() => { level++; targetScore = TARGET_SCORES[Math.min(level, TARGET_SCORES.length)-1]; startLevel(); }, 2500);
} else if (movesLeft <= 0) {
state = 'gameOver';
} else {
state = 'playing';
}
}

function drawGrid() {
let cellSize = getCellSize();
let gx = getGridX();
let gy = getGridY();

// Grid background
ctx.fillStyle = 'rgba(20,20,40,0.8)';
ctx.fillRect(gx - 8*scale, gy - 8*scale, GRID_SIZE * cellSize + 16*scale, GRID_SIZE * cellSize + 16*scale);
ctx.strokeStyle = 'rgba(100,100,200,0.3)';
ctx.lineWidth = 2;
ctx.strokeRect(gx - 8*scale, gy - 8*scale, GRID_SIZE * cellSize + 16*scale, GRID_SIZE * cellSize + 16*scale);

for (let r = 0; r < GRID_SIZE; r++) {
for (let c = 0; c < GRID_SIZE; c++) {
let x = gx + c * cellSize;
let y = gy + r * cellSize;
// Cell border
ctx.strokeStyle = 'rgba(80,80,140,0.2)';
ctx.lineWidth = 1;
ctx.strokeRect(x, y, cellSize, cellSize);

if (grid[r][c] !== -1) {
let color = COLORS[grid[r][c]];
let pad = 3 * scale;
// Glow
ctx.shadowColor = color;
ctx.shadowBlur = 8 * scale;
ctx.fillStyle = color;
roundRect(ctx, x + pad, y + pad, cellSize - pad*2, cellSize - pad*2, 6*scale);
ctx.fill();
ctx.shadowBlur = 0;
// Highlight
ctx.fillStyle = 'rgba(255,255,255,0.3)';
roundRect(ctx, x + pad + 4*scale, y + pad + 4*scale, cellSize - pad*2 - 12*scale, (cellSize - pad*2)*0.3, 4*scale);
ctx.fill();
}
}
}

// Particles
for (let i = particles.length - 1; i >= 0; i--) {
let p = particles[i];
p.x += p.vx; p.y += p.vy; p.vy += 0.3 * scale;
p.life--;
if (p.life <= 0) { particles.splice(i, 1); continue; }
let alpha = p.life / p.maxLife;
ctx.globalAlpha = alpha;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
ctx.fill();
ctx.globalAlpha = 1;
}

// Float texts
for (let i = floatTexts.length - 1; i >= 0; i--) {
let ft = floatTexts[i];
ft.y -= 1.5 * scale;
ft.life--;
if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
let alpha = ft.life / ft.maxLife;
ctx.globalAlpha = alpha;
ctx.fillStyle = '#fff';
ctx.font = `bold ${24*scale}px 'Segoe UI', sans-serif`;
ctx.textAlign = 'center';
ctx.fillText(ft.text, ft.x, ft.y);
ctx.globalAlpha = 1;
}
}

function roundRect(ctx, x, y, w, h, r) {
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.lineTo(x + w - r, y);
ctx.quadraticCurveTo(x + w, y, x + w, y + r);
ctx.lineTo(x + w, y + h - r);
ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
ctx.lineTo(x + r, y + h);
ctx.quadraticCurveTo(x, y + h, x, y + h - r);
ctx.lineTo(x, y + r);
ctx.quadraticCurveTo(x, y, x + r, y);
ctx.closePath();
}

function drawUI() {
// Score
ctx.fillStyle = '#fff';
ctx.font = `bold ${20*scale}px 'Segoe UI', sans-serif`;
ctx.textAlign = 'left';
let gx = getGridX();
let gy = getGridY();
ctx.fillText('Score: ' + score, gx, gy - 30*scale);
ctx.fillStyle = '#88aaff';
ctx.fillText('Target: ' + targetScore, gx + 160*scale, gy - 30*scale);

// Moves
ctx.fillStyle = movesLeft <= 5 ? '#ff4466' : '#fff';
ctx.textAlign = 'right';
ctx.fillText('Moves: ' + movesLeft, getGridX() + GRID_SIZE * getCellSize(), gy - 30*scale);

// Level
ctx.fillStyle = '#aaddff';
ctx.textAlign = 'center';
ctx.font = `${16*scale}px 'Segoe UI', sans-serif`;
ctx.fillText('Level ' + level, W/2, gy - 30*scale);

// Progress bar
let barW = GRID_SIZE * getCellSize() * 0.8;
let barX = (W - barW)/2;
let barY = gy + GRID_SIZE * getCellSize() + 25*scale;
ctx.fillStyle = 'rgba(40,40,80,0.8)';
roundRect(ctx, barX, barY, barW, 12*scale, 6*scale);
ctx.fill();
let progress = Math.min(score / targetScore, 1);
ctx.fillStyle = progress >= 1 ? '#44ff88' : '#44aaff';
roundRect(ctx, barX, barY, barW * progress, 12*scale, 6*scale);
ctx.fill();

// Direction buttons (visual indicators)
let btnY = gy + GRID_SIZE * getCellSize() + 50*scale;
let btnSize = 30 * scale;
let dirs = ['↑','↓','←','→'];
let labels = ['Up (W)','Down (S)','Left (A)','Right (D)'];
for (let i = 0; i < 4; i++) {
let bx = W/2 + (i - 1.5) * 80 * scale;
ctx.fillStyle = 'rgba(60,60,120,0.6)';
roundRect(ctx, bx - btnSize/2, btnY - btnSize/2, btnSize, btnSize, 6*scale);
ctx.fill();
ctx.fillStyle = '#fff';
ctx.font = `bold ${18*scale}px 'Segoe UI', sans-serif`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(dirs[i], bx, btnY);
ctx.font = `${10*scale}px 'Segoe UI', sans-serif`;
ctx.fillStyle = '#aaa';
ctx.fillText(labels[i], bx, btnY + btnSize/2 + 12*scale);
}
ctx.textBaseline = 'alphabetic';
}

function drawStartScreen() {
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#fff';
ctx.font = `bold ${48*scale}px 'Segoe UI', sans-serif`;
ctx.textAlign = 'center';
ctx.fillText('GRAVITY SHIFT', W/2, H/3);

ctx.font = `${18*scale}px 'Segoe UI', sans-serif`;
ctx.fillStyle = '#aabbdd';
let lines = [
'Use arrow keys or WASD to set gravity direction.',
'All blocks slide in that direction.',
'Match 3+ same-colored blocks in a row to clear them!',
'Reach the target score before you run out of moves.',
'',
'↑ / W  - Gravity Up',
'↓ / S  - Gravity Down',
'← / A  - Gravity Left',
'→ / D  - Gravity Right'
];
lines.forEach((l, i) => { ctx.fillText(l, W/2, H/3 + 50*scale + i * 28*scale); });

// Animated blocks on start screen
let t = Date.now() / 1000;
for (let i = 0; i < 12; i++) {
let bx = (Math.sin(t * 0.7 + i * 1.3) * 0.35 + 0.5) * W;
let by = (Math.cos(t * 0.5 + i * 0.9) * 0.3 + 0.5) * H;
ctx.fillStyle = COLORS[i % COLORS.length];
ctx.globalAlpha = 0.4;
roundRect(ctx, bx - 10*scale, by - 10*scale, 20*scale, 20*scale, 5*scale);
ctx.fill();
ctx.globalAlpha = 1;
}

ctx.fillStyle = '#ffcc44';
ctx.font = `bold ${22*scale}px 'Segoe UI', sans-serif`;
let pulse = 0.7 + Math.sin(t * 3) * 0.3;
ctx.globalAlpha = pulse;
ctx.fillText('Press any key to start', W/2, H - 80*scale);
ctx.globalAlpha = 1;
}

function drawLevelComplete() {
drawGrid();
drawUI();
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#44ff88';
ctx.font = `bold ${42*scale}px 'Segoe UI', sans-serif`;
ctx.textAlign = 'center';
ctx.fillText('LEVEL COMPLETE!', W/2, H/2 - 30*scale);
ctx.fillStyle = '#fff';
ctx.font = `${22*scale}px 'Segoe UI', sans-serif`;
ctx.fillText('Score: ' + score, W/2, H/2 + 20*scale);
}

function drawGameOver() {
drawGrid();
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#ff4466';
ctx.font = `bold ${42*scale}px 'Segoe UI', sans-serif`;
ctx.textAlign = 'center';
ctx.fillText('GAME OVER', W/2, H/2 - 30*scale);
ctx.fillStyle = '#fff';
ctx.font = `${22*scale}px 'Segoe UI', sans-serif`;
ctx.fillText('Final Score: ' + score, W/2, H/2 + 20*scale);
ctx.fillText('Level Reached: ' + level, W/2, H/2 + 55*scale);
ctx.fillStyle = '#ffcc44';
ctx.font = `bold ${18*scale}px 'Segoe UI', sans-serif`;
let pulse = 0.7 + Math.sin(Date.now()/300) * 0.3;
ctx.globalAlpha = pulse;
ctx.fillText('Press R to restart', W/2, H/2 + 110*scale);
ctx.globalAlpha = 1;
}

function draw() {
ctx.clearRect(0, 0, W, H);

// Background
let grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
grad.addColorStop(0, '#14142a');
grad.addColorStop(1, '#0a0a1a');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, W, H);

if (state === 'start') {
drawStartScreen();
return;
}

// Shake
if (shakeTimer > 0) {
shakeTimer--;
let sx = (Math.random()-0.5) * shakeIntensity * 2;
let sy = (Math.random()-0.5) * shakeIntensity * 2;
ctx.save();
ctx.translate(sx, sy);
}

if (state === 'levelComplete') { drawLevelComplete(); if(shakeTimer>0) ctx.restore(); return; }
if (state === 'gameOver') { drawGameOver(); if(shakeTimer>0) ctx.restore(); return; }

drawGrid();
drawUI();
if (shakeTimer > 0) ctx.restore();
}

function loop() {
draw();
requestAnimationFrame(loop);
}
loop();

window.addEventListener('keydown', function(e) {
if (state === 'start') {
score = 0; level = 1; targetScore = TARGET_SCORES[0];
initGrid(); startLevel();
return;
}
if (state === 'gameOver' && (e.key === 'r' || e.key === 'R')) {
score = 0; level = 1; targetScore = TARGET_SCORES[0];
particles = []; floatTexts = [];
initGrid(); startLevel();
return;
}
if (state !== 'playing') return;

let dir = '';
if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dir = 'up';
else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dir = 'down';
else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dir = 'left';
else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dir = 'right';

if (dir) {
e.preventDefault();
doTurn(dir);
}
});

// Touch/click support
canvas.addEventListener('click', function(e) {
if (state === 'start') {
score = 0; level = 1; targetScore = TARGET_SCORES[0];
initGrid(); startLevel();
return;
}
if (state === 'gameOver') {
score = 0; level = 1; targetScore = TARGET_SCORES[0];
particles = []; floatTexts = [];
initGrid(); startLevel();
return;
}
if (state !== 'playing') return;

let cx = e.clientX / W;
let cy = e.clientY / H;
// Top area = up, bottom = down, left = left, right = right
if (cy < 0.3) doTurn('up');
else if (cy > 0.7) doTurn('down');
else if (cx < 0.5) doTurn('left');
else doTurn('right');
});

})();
</script>
</body>
</html>
