<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MineScroll - Side-Scrolling Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #0a0a1a; 
  overflow: hidden; 
  width: 100vw; 
  height: 100vh; 
  display: flex; 
  align-items: center; 
  justify-content: center;
  font-family: 'Courier New', monospace;
}
canvas { 
  display: block; 
  image-rendering: pixelated;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  if (type === 'step') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(330, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'explode') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.6);
  } else if (type === 'flag') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'win') {
    const notes = [262, 330, 392, 523];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.3);
      o.start(audioCtx.currentTime + i * 0.12);
      o.stop(audioCtx.currentTime + i * 0.12 + 0.3);
    });
  }
}

// Game constants
const ROWS = 5;
const LEVEL_WIDTHS = [25, 30, 35, 40, 50];
const MINE_DENSITIES = [0.25, 0.3, 0.3, 0.35, 0.4];

let gameState = 'menu'; // menu, playing, dead, levelComplete, gameComplete
let level = 0;
let grid = [];
let playerX = 0, playerY = 2;
let cameraX = 0;
let targetCameraX = 0;
let particles = [];
let shakeTime = 0;
let shakeIntensity = 0;
let levelTimer = 0;
let bestLevel = 0;

try {
  const saved = localStorage.getItem('minescroll_best');
  if (saved) bestLevel = parseInt(saved);
} catch(e) {}

function generateLevel(lvl) {
  const cols = LEVEL_WIDTHS[lvl];
  const density = MINE_DENSITIES[lvl];
  grid = [];
  
  for (let y = 0; y < ROWS; y++) {
    grid[y] = [];
    for (let x = 0; x < cols; x++) {
      grid[y][x] = {
        mine: Math.random() < density,
        revealed: false,
        flagged: false,
        number: 0
      };
    }
  }
  
  // Calculate numbers
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < cols; x++) {
      if (!grid[y][x].mine) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const ny = y + dy, nx = x + dx;
            if (ny >= 0 && ny < ROWS && nx >= 0 && nx < cols && grid[ny][nx].mine) n++;
          }
        }
        grid[y][x].number = n;
      }
    }
  }
  
  // Ensure start area is safe (first 2 columns, middle rows)
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < 3; x++) {
      grid[y][x].mine = false;
    }
  }
  
  // Recalculate numbers after clearing start area
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < cols; x++) {
      if (!grid[y][x].mine) {
        let n = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const ny = y + dy, nx = x + dx;
            if (ny >= 0 && ny < ROWS && nx >= 0 && nx < cols && grid[ny][nx].mine) n++;
          }
        }
        grid[y][x].number = n;
      }
    }
  }
  
  playerX = 1;
  playerY = 2;
  cameraX = 0;
  targetCameraX = 0;
  
  // Reveal start cell
  grid[playerY][playerX].revealed = true;
}

function getCellSize() {
  return Math.min(Math.floor((H - 100) / ROWS), 64);
}

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      color,
      size: 2 + Math.random() * 4
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size * p.life, p.size * p.life);
  }
  ctx.globalAlpha = 1;
}

function getNumberColor(n) {
  const colors = ['#000', '#4fc3f7', '#69f0ae', '#ff5252', '#ffd740', '#e040fb', '#ff9800', '#fff'];
  return colors[n] || '#fff';
}

function draw() {
  const cellSize = getCellSize();
  
  // Screen shake
  let sx = 0, sy = 0;
  if (shakeTime > 0) {
    sx = (Math.random() - 0.5) * shakeIntensity;
    sy = (Math.random() - 0.5) * shakeIntensity;
  }
  
  ctx.save();
  ctx.translate(sx, sy);
  
  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0d1b2a');
  grad.addColorStop(1, '#1b2838');
  ctx.fillStyle = grad;
  ctx.fillRect(-10, -10, W + 20, H + 20);
  
  // Stars in background
  const starSeed = 12345;
  for (let i = 0; i < 50; i++) {
    const sx2 = ((i * 7919 + starSeed) % W) - cameraX * 0.1 % W;
    const sy2 = (i * 3167 + 42) % (H * 0.4);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 3) * 0.2})`;
    ctx.fillRect(((sx2 % W) + W) % W, sy2, 1.5, 1.5);
  }
  
  if (gameState === 'menu') {
    drawMenu();
  } else {
    drawGame(cellSize);
  }
  
  ctx.restore();
}

function drawMenu() {
  const cx = W / 2;
  const cy = H / 2;
  
  // Title
  ctx.fillStyle = '#ff5252';
  ctx.font = `bold ${Math.min(60, W/12)}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.fillText('⚡ MINE SCROLL ⚡', cx, cy - 80);
  
  ctx.fillStyle = '#4fc3f7';
  ctx.font = `${Math.min(16, W/30)}px 'Courier New'`;
  ctx.fillText('A side-scrolling minesweeper adventure', cx, cy - 45);
  
  ctx.fillStyle = '#e0e0e0';
  ctx.font = `${Math.min(14, W/35)}px 'Courier New'`;
  const lines = [
    '← → ↑ ↓ / WASD : Move through the grid',
    'SPACE : Flag / Unflag current cell',
    '',
    'Reveal all safe cells to clear each level!',
    'Step on a mine and it\'s game over.',
    '',
    `Best Level: ${bestLevel + 1}`
  ];
  lines.forEach((line, i) => {
    ctx.fillText(line, cx, cy + i * 24);
  });
  
  // Blinking prompt
  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillStyle = '#69f0ae';
    ctx.font = `bold ${Math.min(18, W/30)}px 'Courier New'`;
    ctx.fillText('Press ENTER to Start', cx, cy + lines.length * 24 + 20);
  }
}

function drawGame(cellSize) {
  const cols = LEVEL_WIDTHS[level];
  const topOffset = (H - ROWS * cellSize) / 2;
  
  // Draw grid
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < cols; x++) {
      const px = x * cellSize - cameraX;
      const py = topOffset + y * cellSize;
      
      if (px > -cellSize && px < W) {
        const cell = grid[y][x];
        
        // Cell background
        if (cell.revealed) {
          ctx.fillStyle = cell.mine ? '#ff1744' : (cell.number === 0 ? '#263238' : '#37474f');
        } else {
          ctx.fillStyle = '#1a237e';
        }
        
        // Flag override
        if (cell.flagged) {
          ctx.fillStyle = '#ff6f00';
        }
        
        ctx.fillRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
        
        // Cell border
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.strokeRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
        
        // Content
        if (cell.revealed && !cell.mine) {
          if (cell.number > 0) {
            ctx.fillStyle = getNumberColor(cell.number);
            ctx.font = `bold ${cellSize * 0.5}px 'Courier New'`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(cell.number, px + cellSize/2, py + cellSize/2);
          }
        } else if (cell.revealed && cell.mine) {
          // Draw mine
          ctx.fillStyle = '#fff';
          ctx.font = `${cellSize * 0.5}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('💣', px + cellSize/2, py + cellSize/2);
        } else if (cell.flagged) {
          ctx.fillStyle = '#fff';
          ctx.font = `${cellSize * 0.45}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🚩', px + cellSize/2, py + cellSize/2);
        } else {
          // Unrevealed - subtle glow
          const glow = 0.3 + Math.sin(Date.now() / 1000 + x * 0.5) * 0.1;
          ctx.fillStyle = `rgba(100, 120, 255, ${glow})`;
          ctx.fillRect(px + cellSize*0.3, py + cellSize*0.3, cellSize*0.4, cellSize*0.4);
        }
      }
    }
  }
  
  // Draw player
  const px = playerX * cellSize - cameraX;
  const py = topOffset + playerY * cellSize;
  
  // Player glow
  ctx.fillStyle = 'rgba(105, 240, 174, 0.3)';
  ctx.beginPath();
  ctx.arc(px + cellSize/2, py + cellSize/2, cellSize * 0.4, 0, Math.PI * 2);
  ctx.fill();
  
  // Player body
  ctx.fillStyle = '#69f0ae';
  ctx.font = `${cellSize * 0.5}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🧑', px + cellSize/2, py + cellSize/2);
  
  // Particles
  drawParticles();
  
  // HUD
  const safeCells = grid.flat().filter(c => !c.mine).length;
  const visitedSafe = grid.flat().filter(c => c.revealed && !c.mine).length;
  const progress = visitedSafe / safeCells;
  
  // Progress bar
  const barW = Math.min(300, W * 0.5);
  const barX = (W - barW) / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(barX - 5, 10, barW + 10, 30);
  ctx.fillStyle = '#263238';
  ctx.fillRect(barX, 15, barW, 20);
  ctx.fillStyle = progress >= 1 ? '#69f0ae' : '#4fc3f7';
  ctx.fillRect(barX, 15, barW * progress, 20);
  
  ctx.fillStyle = '#fff';
  ctx.font = '12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(`Level ${level + 1} | Progress: ${Math.floor(progress * 100)}%`, W/2, 28);
  
  // Timer
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e0e0e0';
  ctx.font = '14px Courier New';
  ctx.fillText(`⏱ ${Math.floor(levelTimer / 1000)}s`, W - 80, H - 20);
  
  // Level complete overlay
  if (gameState === 'levelComplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#69f0ae';
    ctx.font = `bold ${Math.min(48, W/12)}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL COMPLETE!', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(16, W/35)}px Courier New`;
    ctx.fillText('Press ENTER for next level', W/2, H/2 + 20);
  }
  
  if (gameState === 'dead') {
    ctx.fillStyle = 'rgba(255, 23, 68, 0.4)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff1744';
    ctx.font = `bold ${Math.min(48, W/12)}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.fillText('💥 BOOM! 💥', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(16, W/35)}px Courier New`;
    ctx.fillText('Press ENTER to restart', W/2, H/2 + 20);
  }
  
  if (gameState === 'gameComplete') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd740';
    ctx.font = `bold ${Math.min(42, W/12)}px 'Courier New'`;
    ctx.textAlign = 'center';
    ctx.fillText('🏆 ALL LEVELS CLEARED! 🏆', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(16, W/35)}px Courier New`;
    ctx.fillText('Press ENTER to play again', W/2, H/2 + 20);
  }
}

let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  
  if (gameState === 'playing') {
    levelTimer += dt * 1000;
    
    // Camera follow
    const cellSize = getCellSize();
    targetCameraX = playerX * cellSize - W / 2 + cellSize / 2;
    targetCameraX = Math.max(0, targetCameraX);
    const maxCam = LEVEL_WIDTHS[level] * cellSize - W;
    targetCameraX = Math.min(targetCameraX, Math.max(0, maxCam));
    cameraX += (targetCameraX - cameraX) * 5 * dt;
    
    // Shake decay
    if (shakeTime > 0) {
      shakeTime -= dt;
      shakeIntensity *= 0.9;
    }
    
    updateParticles(dt);
  }
  
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  level = 0;
  generateLevel(0);
  gameState = 'playing';
  levelTimer = 0;
  particles = [];
}

function nextLevel() {
  level++;
  if (level >= LEVEL_WIDTHS.length) {
    gameState = 'gameComplete';
    return;
  }
  generateLevel(level);
  gameState = 'playing';
  levelTimer = 0;
}

function checkLevelComplete() {
  const safeCells = grid.flat().filter(c => !c.mine).length;
  const visitedSafe = grid.flat().filter(c => c.revealed && !c.mine).length;
  
  if (visitedSafe >= safeCells) {
    gameState = 'levelComplete';
    playSound('win');
    if (level + 1 > bestLevel) {
      bestLevel = level + 1;
      try { localStorage.setItem('minescroll_best', bestLevel); } catch(e) {}
    }
  }
}

function movePlayer(dx, dy) {
  const nx = playerX + dx;
  const ny = playerY + dy;
  const cols = LEVEL_WIDTHS[level];
  
  if (nx < 0 || nx >= cols || ny < 0 || ny >= ROWS) return;
  
  const cell = grid[ny][nx];
  
  if (!cell.revealed && !cell.mine) {
    cell.revealed = true;
    playSound('step');
    playerX = nx;
    playerY = ny;
    checkLevelComplete();
  } else if (cell.revealed && !cell.mine) {
    // Already revealed safe cell - can move onto it
    playerX = nx;
    playerY = ny;
    playSound('step');
  } else if (!cell.revealed && cell.mine) {
    // HIT A MINE!
    cell.revealed = true;
    gameState = 'dead';
    shakeTime = 0.5;
    shakeIntensity = 15;
    playSound('explode');
    
    const cellSize = getCellSize();
    const topOffset = (H - ROWS * cellSize) / 2;
    const ex = nx * cellSize - cameraX + cellSize/2;
    const ey = topOffset + ny * cellSize + cellSize/2;
    addParticles(ex, ey, '#ff5252', 30);
    addParticles(ex, ey, '#ffd740', 20);
    addParticles(ex, ey, '#fff', 15);
  }
}

function toggleFlag() {
  const cell = grid[playerY][playerX];
  if (!cell.mine) {
    cell.flagged = !cell.flagged;
    playSound('flag');
  }
}

document.addEventListener('keydown', (e) => {
  initAudio();
  
  if (gameState === 'menu') {
    if (e.key === 'Enter' || e.key === ' ') {
      startGame();
    }
    return;
  }
  
  if (gameState === 'dead' || gameState === 'levelComplete' || gameState === 'gameComplete') {
    if (e.key === 'Enter' || e.key === ' ') {
      if (gameState === 'dead') startGame();
      else nextLevel();
    }
    return;
  }
  
  if (gameState !== 'playing') return;
  
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': movePlayer(0, -1); break;
    case 'ArrowDown': case 's': case 'S': movePlayer(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': movePlayer(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': movePlayer(1, 0); break;
    case ' ': e.preventDefault(); toggleFlag(); break;
  }
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
