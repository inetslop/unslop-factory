<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zombie Highway</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'splat') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'combo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    }
}

// Game State
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('zombieHighwayHS')) || 0; } catch(e) {}
let combo = 0;
let maxCombo = 0;
let speed = 4;
let health = 100;
let shakeTimer = 0;
let shakeIntensity = 0;

// Road
const ROAD_WIDTH_RATIO = 0.6;
let roadX, roadW, laneW;
function calcRoad() {
    roadW = W * ROAD_WIDTH_RATIO;
    roadX = (W - roadW) / 2;
    laneW = roadW / 3;
}

// Car
let car = { x: 0, y: 0, w: 50, h: 80, vx: 0 };
function resetCar() {
    calcRoad();
    car.w = Math.min(50, laneW * 0.6);
    car.h = car.w * 1.6;
    car.x = W / 2 - car.w / 2;
    car.y = H - car.h - 40;
    car.vx = 0;
}

// Zombies
let zombies = [];
let particles = [];
let splats = [];
let roadLines = [];

function spawnZombie() {
    const lane = Math.floor(Math.random() * 3);
    const isFast = Math.random() < 0.3 + speed * 0.02;
    const z = {
        x: roadX + lane * laneW + (Math.random() - 0.5) * laneW * 0.4,
        y: -60 - Math.random() * 100,
        w: 35 + Math.random() * 15,
        h: 35 + Math.random() * 15,
        speed: isFast ? (speed * 0.8 + Math.random() * 2) : (speed * 0.3 + Math.random()),
        isFast: isFast,
        wobble: Math.random() * Math.PI * 2,
        hit: false,
        armAngle: Math.random() * Math.PI * 2
    };
    zombies.push(z);
}

function spawnParticle(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 5;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 2,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            size: 3 + Math.random() * 6,
            color: color
        });
    }
}

function addSplat(x, y) {
    const s = { x: x, y: y, size: 20 + Math.random() * 20, alpha: 1 };
    splats.push(s);
    if (splats.length > 50) splats.shift();
}

function initRoadLines() {
    roadLines = [];
    for (let i = 0; i < H / 40 + 2; i++) {
        roadLines.push({ y: i * 40 });
    }
}

function resetGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    speed = 4;
    health = 100;
    zombies = [];
    particles = [];
    splats = [];
    shakeTimer = 0;
    resetCar();
    initRoadLines();
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (gameState === 'start' && (e.key === 'Enter' || e.key === ' ')) {
        initAudio();
        resetGame();
        gameState = 'playing';
    } else if (gameState === 'gameover' && (e.key === 'Enter' || e.key === ' ' || e.key === 'r')) {
        resetGame();
        gameState = 'playing';
    }
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// Mouse/Touch for mobile
canvas.addEventListener('touchstart', () => {
    if (gameState === 'start') { initAudio(); resetGame(); gameState = 'playing'; }
    else if (gameState === 'gameover') { resetGame(); gameState = 'playing'; }
});
let touchX = null;
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    touchX = t.clientX;
});
canvas.addEventListener('touchend', () => { touchX = null; });

// Update
let spawnTimer = 0;
function update(dt) {
    if (gameState !== 'playing') return;

    speed += dt * 0.3;
    score += speed * dt * 10;

    // Combo decay
    combo = Math.max(0, combo - dt * 0.5);

    // Car movement
    const moveSpeed = 8;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) car.vx -= moveSpeed * dt * 60;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) car.vx += moveSpeed * dt * 60;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) car.y -= 300 * dt;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) car.y += 300 * dt;

    // Touch control
    if (touchX !== null) {
        const targetX = touchX - car.w / 2;
        car.vx += (targetX - car.x) * 0.1;
    }

    car.vx *= 0.85;
    car.x += car.vx * dt * 60;
    car.y = Math.max(40, Math.min(H - car.h - 20, car.y));
    // Clamp to road
    car.x = Math.max(roadX + 10, Math.min(roadX + roadW - car.w - 10, car.x));

    // Spawn zombies
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
        spawnZombie();
        spawnTimer = Math.max(0.3, 1.5 - speed * 0.08);
    }

    // Update road lines
    for (let i = 0; i < roadLines.length; i++) {
        roadLines[i].y += speed * dt * 60;
        if (roadLines[i].y > H + 40) roadLines[i].y -= (H / 40 + 2) * 40;
    }

    // Update splats
    for (let i = splats.length - 1; i >= 0; i--) {
        splats[i].y += speed * dt * 60;
        splats[i].alpha -= dt * 0.3;
        if (splats[i].y > H + 50 || splats[i].alpha <= 0) splats.splice(i, 1);
    }

    // Update zombies
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        z.y += z.speed * dt * 60;
        z.wobble += dt * 5;
        z.armAngle += dt * 3;

        // Collision with car
        if (!z.hit && rectCollide(car, z)) {
            if (z.isFast) {
                health -= 20;
                shakeTimer = 0.3;
                shakeIntensity = 8;
                playSound('hit');
                combo = 0;
                spawnParticle(z.x + z.w/2, z.y + z.h/2, '#ff4444', 15);
                addSplat(z.x + z.w/2, z.y + z.h/2);
                zombies.splice(i, 1);
            } else {
                z.hit = true;
                combo += 1;
                maxCombo = Math.max(maxCombo, combo);
                score += 50 * (1 + Math.floor(combo / 5));
                playSound('splat');
                if (combo > 0 && combo % 5 === 0) playSound('combo');
                spawnParticle(z.x + z.w/2, z.y + z.h/2, '#44ff44', 12);
                addSplat(z.x + z.w/2, z.y + z.h/2);
                zombies.splice(i, 1);
            }
            continue;
        }

        // Remove if off screen
        if (z.y > H + 80) {
            if (!z.hit && !z.isFast) {
                // Missed a slow zombie - small penalty
                combo = Math.max(0, combo - 2);
            }
            zombies.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.vy += 5 * dt * 60;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake
    if (shakeTimer > 0) shakeTimer -= dt;

    // Game over
    if (health <= 0) {
        gameState = 'gameover';
        playSound('gameover');
        try {
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('zombieHighwayHS', highScore.toString());
            }
        } catch(e) {}
    }
}

function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Draw
function draw() {
    ctx.save();

    // Screen shake
    if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity * shakeTimer * 3;
        const sy = (Math.random() - 0.5) * shakeIntensity * shakeTimer * 3;
        ctx.translate(sx, sy);
    }

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Side terrain
    ctx.fillStyle = '#2d5a27';
    ctx.fillRect(0, 0, roadX, H);
    ctx.fillRect(roadX + roadW, 0, W - roadX - roadW, H);

    // Trees on sides
    const treeOffset = (Date.now() * speed * 0.5) % 200;
    ctx.fillStyle = '#1a3d1a';
    for (let y = -200 + treeOffset; y < H + 100; y += 120) {
        drawTree(roadX * 0.3, y);
        drawTree(roadX + roadW + roadX * 0.5, y + 60);
    }

    // Road
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(roadX, 0, roadW, H);

    // Road edges
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(roadX - 4, 0, 4, H);
    ctx.fillRect(roadX + roadW, 0, 4, H);

    // Lane lines
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);
    for (let l = 1; l < 3; l++) {
        const lx = roadX + l * laneW;
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, H);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    // Center dashes (animated)
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    for (let l = 1; l < 3; l++) {
        const lx = roadX + l * laneW;
        for (let line of roadLines) {
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fillRect(lx - 1, line.y, 2, 20);
        }
    }

    // Splats
    for (let s of splats) {
        ctx.globalAlpha = s.alpha * 0.5;
        ctx.fillStyle = '#3d8b3d';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(s.x + 10, s.y - 5, s.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Zombies
    for (let z of zombies) {
        const wobbleX = Math.sin(z.wobble) * 3;
        drawZombie(z.x + wobbleX, z.y, z.w, z.h, z.isFast, z.armAngle);
    }

    // Car
    drawCar(car.x, car.y, car.w, car.h);

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Speed lines
    if (speed > 8) {
        const alpha = Math.min(0.3, (speed - 8) * 0.05);
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
            const lx = roadX + Math.random() * roadW;
            const ly = Math.random() * H;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + 30 + speed);
            ctx.stroke();
        }
    }

    // HUD
    if (gameState === 'playing') {
        drawHUD();
    }

    ctx.restore();

    // Overlays
    if (gameState === 'start') drawStartScreen();
    else if (gameState === 'gameover') drawGameOver();
}

function drawTree(x, y) {
    ctx.fillStyle = '#1a3d1a';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 15, y + 40);
    ctx.lineTo(x + 15, y + 40);
    ctx.fill();
    ctx.fillStyle = '#2d5a27';
    ctx.fillRect(x - 3, y + 40, 6, 15);
}

function drawZombie(x, y, w, h, isFast, armAngle) {
    // Body
    ctx.fillStyle = isFast ? '#8b4513' : '#556b2f';
    ctx.fillRect(x + w * 0.25, y + h * 0.3, w * 0.5, h * 0.5);

    // Head
    ctx.fillStyle = isFast ? '#a0522d' : '#6b8e23';
    ctx.beginPath();
    ctx.arc(x + w / 2, y + h * 0.2, w * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = isFast ? '#ff0000' : '#ffff00';
    ctx.beginPath();
    ctx.arc(x + w * 0.4, y + h * 0.15, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w * 0.6, y + h * 0.15, 3, 0, Math.PI * 2);
    ctx.fill();

    // Arms (wobbling)
    const armSwing = Math.sin(armAngle) * 0.4;
    ctx.strokeStyle = isFast ? '#a0522d' : '#6b8e23';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.1, y + h * 0.4);
    ctx.lineTo(x - w * 0.2 + armSwing * 10, y + h * 0.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + w * 0.9, y + h * 0.4);
    ctx.lineTo(x + w * 1.2 - armSwing * 10, y + h * 0.2);
    ctx.stroke();

    // Legs (shuffling)
    const legSwing = Math.sin(armAngle * 2) * 5;
    ctx.strokeStyle = isFast ? '#8b4513' : '#556b2f';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + w * 0.35, y + h * 0.8);
    ctx.lineTo(x + w * 0.35 + legSwing, y + h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + w * 0.65, y + h * 0.8);
    ctx.lineTo(x + w * 0.65 - legSwing, y + h);
    ctx.stroke();

    // Fast zombie indicator
    if (isFast) {
        ctx.fillStyle = 'rgba(255,0,0,0.3)';
        ctx.beginPath();
        ctx.arc(x + w/2, y + h*0.2, w * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawCar(x, y, w, h) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + 5, y + 5, w, h);

    // Body
    const grad = ctx.createLinearGradient(x, y, x + w, y);
    grad.addColorStop(0, '#cc2222');
    grad.addColorStop(0.5, '#ff4444');
    grad.addColorStop(1, '#cc2222');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y + h * 0.15, w, h * 0.7);

    // Windshield
    ctx.fillStyle = '#87ceeb';
    ctx.fillRect(x + w * 0.15, y + h * 0.2, w * 0.7, h * 0.2);

    // Roof
    ctx.fillStyle = '#992222';
    ctx.fillRect(x + w * 0.1, y + h * 0.45, w * 0.8, h * 0.3);

    // Wheels
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 3, y + h * 0.1, 6, h * 0.15);
    ctx.fillRect(x + w - 3, y + h * 0.1, 6, h * 0.15);
    ctx.fillRect(x - 3, y + h * 0.7, 6, h * 0.15);
    ctx.fillRect(x + w - 3, y + h * 0.7, 6, h * 0.15);

    // Headlights
    ctx.fillStyle = '#ffff88';
    ctx.fillRect(x + 2, y + h * 0.05, w * 0.25, 5);
    ctx.fillRect(x + w - w * 0.27, y + h * 0.05, w * 0.25, 5);

    // Taillights
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(x + 2, y + h - 8, w * 0.2, 5);
    ctx.fillRect(x + w - w * 0.22, y + h - 8, w * 0.2, 5);

    // Exhaust
    ctx.fillStyle = 'rgba(150,150,150,0.4)';
    const exY = y + h;
    for (let i = 0; i < 3; i++) {
        const ey = exY + Math.random() * 10;
        ctx.beginPath();
        ctx.arc(x + w * 0.2, ey, 3 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawHUD() {
    // Score
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W/2 - 120, 10, 240, 70);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SCORE: ' + Math.floor(score), W/2, 35);

    // Speed
    ctx.font = '16px monospace';
    ctx.fillStyle = '#88ff88';
    ctx.fillText('SPEED: ' + speed.toFixed(1) + ' km/h', W/2, 55);

    // Combo
    if (combo > 1) {
        ctx.fillStyle = '#ffff00';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('COMBO x' + Math.floor(combo), W/2, 75);
    }

    // Health bar
    const hbW = 150;
    const hbX = W / 2 - hbW / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(hbX - 5, H - 45, hbW + 10, 30);
    ctx.fillStyle = '#333';
    ctx.fillRect(hbX, H - 38, hbW, 16);
    const hpColor = health > 50 ? '#44ff44' : health > 25 ? '#ffff44' : '#ff4444';
    ctx.fillStyle = hpColor;
    ctx.fillRect(hbX, H - 38, hbW * (health / 100), 16);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(hbX, H - 38, hbW, 16);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText('HEALTH', W/2, H - 20);

    // High score
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('HI: ' + Math.floor(highScore), 15, H - 20);
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#44ff44';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('ZOMBIE HIGHWAY', W/2, H * 0.25);

    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    ctx.fillText('Race through the zombie apocalypse!', W/2, H * 0.35);

    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    const lines = [
        '← → or A/D : Steer',
        '↑ ↓ or W/S : Speed control',
        '',
        'Run over SLOW zombies for points',
        'AVOID fast (red) zombies - they damage you!',
        'Chain kills for COMBO multipliers!',
        '',
        'Speed increases over time. Survive!'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H * 0.42 + i * 25);
    });

    ctx.fillStyle = '#ffff00';
    ctx.font = 'bold 22px monospace';
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillText('PRESS ENTER TO START', W/2, H * 0.85);
    ctx.globalAlpha = 1;

    if (highScore > 0) {
        ctx.fillStyle = '#88ff88';
        ctx.font = '16px monospace';
        ctx.fillText('HIGH SCORE: ' + Math.floor(highScore), W/2, H * 0.92);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(50,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('WASTED', W/2, H * 0.3);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText('FINAL SCORE: ' + Math.floor(score), W/2, H * 0.42);
    ctx.fillText('MAX COMBO: x' + Math.floor(maxCombo), W/2, H * 0.5);

    if (Math.floor(score) >= highScore && highScore > 0) {
        ctx.fillStyle = '#ffff00';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H * 0.58);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('Best: ' + Math.floor(highScore), W/2, H * 0.65);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillText('PRESS ENTER / R TO RESTART', W/2, H * 0.8);
    ctx.globalAlpha = 1;
}

// Main loop
let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    calcRoad();
    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

resetGame();
requestAnimationFrame(gameLoop);
</script>
