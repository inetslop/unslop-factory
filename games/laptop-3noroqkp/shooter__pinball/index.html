<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(function() {
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
switch(type) {
case 'shoot':
osc.type = 'square'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
osc.start(); osc.stop(audioCtx.currentTime + 0.15); break;
case 'bounce':
osc.type = 'sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
osc.start(); osc.stop(audioCtx.currentTime + 0.1); break;
case 'hit':
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.2);
gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
osc.start(); osc.stop(audioCtx.currentTime + 0.25); break;
case 'destroy':
osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
osc.start(); osc.stop(audioCtx.currentTime + 0.35); break;
case 'lose':
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
osc.start(); osc.stop(audioCtx.currentTime + 0.4); break;
}
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('pinballShooterHS')) || 0; } catch(e) {}
let balls = [];
let targets = [];
let particles = [];
let cannonAngle = -Math.PI / 2;
let mouseX = W / 2, mouseY = H / 4;
let lastTime = 0;
let gameTimer = 0;
const GAME_DURATION = 60;

const GRAVITY = 500;
const BALL_RADIUS = 8;
const BOUNCE_DAMPING = 0.85;
const CANNON_LEN = 40;
const TARGET_RADIUS = 25;

function spawnTargets() {
targets = [];
const count = Math.min(3 + Math.floor(score / 100), 8);
for (let i = 0; i < count; i++) {
let x, y, attempts = 0;
do {
x = 60 + Math.random() * (W - 120);
y = 60 + Math.random() * (H * 0.5);
attempts++;
} while (targets.some(t => Math.hypot(t.x - x, t.y - y) < TARGET_RADIUS * 2.5) && attempts < 50);
targets.push({ x, y, r: TARGET_RADIUS, hp: 3, maxHp: 3, pulse: Math.random() * Math.PI * 2 });
}
}

function resetGame() {
score = 0;
balls = [];
particles = [];
gameTimer = GAME_DURATION;
spawnTargets();
gameState = 'playing';
}

function shoot() {
if (gameState !== 'playing') return;
const cx = W / 2;
const cy = H - 30;
const speed = 700;
balls.push({
x: cx + Math.cos(cannonAngle) * CANNON_LEN,
y: cy + Math.sin(cannonAngle) * CANNON_LEN,
vx: Math.cos(cannonAngle) * speed,
vy: Math.sin(cannonAngle) * speed,
r: BALL_RADIUS,
trail: []
});
playSound('shoot');
}

function spawnParticles(x, y, color, count) {
for (let i = 0; i < count; i++) {
const angle = Math.random() * Math.PI * 2;
const speed = 50 + Math.random() * 200;
particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, color, r: 3 + Math.random() * 4 });
}
}

function update(dt) {
if (gameState !== 'playing') return;
gameTimer -= dt;
if (gameTimer <= 0) {
gameState = 'gameover';
if (score > highScore) {
highScore = score;
try { localStorage.setItem('pinballShooterHS', highScore); } catch(e) {}
}
return;
}

// Update cannon angle
const cx = W / 2, cy = H - 30;
cannonAngle = Math.atan2(mouseY - cy, mouseX - cx);
if (cannonAngle > 0) cannonAngle = (cannonAngle < Math.PI/2) ? Math.min(cannonAngle, -0.1) : Math.max(cannonAngle, Math.PI + 0.1);
cannonAngle = Math.max(-Math.PI + 0.3, Math.min(-0.3, cannonAngle));

// Update balls
for (let i = balls.length - 1; i >= 0; i--) {
const b = balls[i];
b.vy += GRAVITY * dt;
b.x += b.vx * dt;
b.y += b.vy * dt;
b.trail.push({x: b.x, y: b.y});
if (b.trail.length > 12) b.trail.shift();

// Wall bounces
let bounced = false;
if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) * BOUNCE_DAMPING; bounced = true; }
if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * BOUNCE_DAMPING; bounced = true; }
if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) * BOUNCE_DAMPING; bounced = true; }

// Target collision
for (let j = targets.length - 1; j >= 0; j--) {
const t = targets[j];
const dx = b.x - t.x, dy = b.y - t.y;
const dist = Math.hypot(dx, dy);
if (dist < b.r + t.r) {
t.hp--;
score += 10 * t.maxHp;
playSound('hit');
spawnParticles(t.x, t.y, '#ff6644', 8);
// Bounce ball off target
const nx = dx / dist, ny = dy / dist;
const dot = b.vx * nx + b.vy * ny;
b.vx -= 2 * dot * nx * BOUNCE_DAMPING;
b.vy -= 2 * dot * ny * BOUNCE_DAMPING;
b.x = t.x + nx * (b.r + t.r + 1);
b.y = t.y + ny * (b.r + t.r + 1);

if (t.hp <= 0) {
score += 50;
playSound('destroy');
spawnParticles(t.x, t.y, '#ffaa00', 20);
targets.splice(j, 1);
// Check if all targets destroyed
if (targets.length === 0) {
spawnTargets();
score += 100;
}
}
bounced = true;
}
}

if (bounced) playSound('bounce');

// Ball falls off screen
if (b.y - b.r > H + 50) {
playSound('lose');
balls.splice(i, 1);
}
}

// Update particles
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx * dt;
p.y += p.vy * dt;
p.vy += GRAVITY * 0.3 * dt;
p.life -= dt * 2;
if (p.life <= 0) particles.splice(i, 1);
}

// Target pulse
for (const t of targets) t.pulse += dt * 3;
}

function draw() {
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);

// Grid background
ctx.strokeStyle = 'rgba(50, 60, 100, 0.3)';
ctx.lineWidth = 1;
for (let x = 0; x < W; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
for (let y = 0; y < H; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

if (gameState === 'playing' || gameState === 'gameover') {
// Draw targets
for (const t of targets) {
const pulse = 1 + Math.sin(t.pulse) * 0.05;
const r = t.r * pulse;
ctx.beginPath();
ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
const hpRatio = t.hp / t.maxHp;
ctx.fillStyle = `rgba(255, ${Math.floor(100 + 155 * (1 - hpRatio))}, 50, 0.6)`;
ctx.fill();
ctx.strokeStyle = '#ff6644';
ctx.lineWidth = 3;
ctx.stroke();

// HP bar
const bw = r * 2;
ctx.fillStyle = 'rgba(0,0,0,0.5)';
ctx.fillRect(t.x - bw/2, t.y + r + 8, bw, 6);
ctx.fillStyle = '#44ff88';
ctx.fillRect(t.x - bw/2, t.y + r + 8, bw * hpRatio, 6);

// Inner circle
ctx.beginPath();
ctx.arc(t.x, t.y, r * 0.5, 0, Math.PI * 2);
ctx.fillStyle = 'rgba(255, 100, 50, 0.4)';
ctx.fill();
}

// Draw balls and trails
for (const b of balls) {
for (let i = 0; i < b.trail.length; i++) {
const tr = b.trail[i];
const alpha = (i / b.trail.length) * 0.5;
ctx.beginPath();
ctx.arc(tr.x, tr.y, b.r * (i / b.trail.length), 0, Math.PI * 2);
ctx.fillStyle = `rgba(100, 180, 255, ${alpha})`;
ctx.fill();
}
ctx.beginPath();
ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
ctx.fillStyle = '#66ccff';
ctx.fill();
ctx.strokeStyle = '#ffffff';
ctx.lineWidth = 2;
ctx.stroke();
}

// Draw particles
for (const p of particles) {
ctx.beginPath();
ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
ctx.fillStyle = p.color + Math.floor(p.life * 255).toString(16).padStart(2, '0');
ctx.fill();
}

// Draw cannon
const cx = W / 2, cy = H - 30;
ctx.save();
ctx.translate(cx, cy);
ctx.rotate(cannonAngle + Math.PI / 2);
// Cannon body
ctx.fillStyle = '#4488ff';
ctx.fillRect(-6, -CANNON_LEN, 12, CANNON_LEN);
ctx.fillStyle = '#66aaff';
ctx.fillRect(-4, -CANNON_LEN, 8, CANNON_LEN * 0.3);
// Cannon base
ctx.beginPath();
ctx.arc(0, 0, 18, 0, Math.PI * 2);
ctx.fillStyle = '#3366cc';
ctx.fill();
ctx.strokeStyle = '#66aaff';
ctx.lineWidth = 2;
ctx.stroke();
ctx.restore();

// HUD
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 20px monospace';
ctx.textAlign = 'left';
ctx.fillText(`SCORE: ${score}`, 20, 35);
ctx.textAlign = 'right';
const timeLeft = Math.max(0, Math.ceil(gameTimer));
ctx.fillStyle = timeLeft < 10 ? '#ff4444' : '#ffffff';
ctx.fillText(`TIME: ${timeLeft}s`, W - 20, 35);
ctx.textAlign = 'center';
ctx.fillStyle = '#888';
ctx.font = '14px monospace';
ctx.fillText(`HIGH: ${highScore}`, W / 2, 35);
}

if (gameState === 'start') {
// Title
ctx.fillStyle = '#66ccff';
ctx.font = 'bold 48px monospace';
ctx.textAlign = 'center';
ctx.fillText('PINBALL SHOOTER', W / 2, H / 3);

ctx.fillStyle = '#ffffff';
ctx.font = '18px monospace';
ctx.fillText('Aim with mouse. Click to shoot!', W / 2, H / 3 + 60);
ctx.fillText('Destroy all targets before time runs out.', W / 2, H / 3 + 90);
ctx.fillText('', W / 2, H / 3 + 120);
ctx.fillStyle = '#88ccff';
ctx.fillText('[ SPACE or CLICK to START ]', W / 2, H / 3 + 160);
ctx.fillStyle = '#666';
ctx.font = '14px monospace';
ctx.fillText(`High Score: ${highScore}`, W / 2, H / 3 + 200);
}

if (gameState === 'gameover') {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#ff6644';
ctx.font = 'bold 42px monospace';
ctx.textAlign = 'center';
ctx.fillText('TIME UP!', W / 2, H / 3);
ctx.fillStyle = '#ffffff';
ctx.font = '24px monospace';
ctx.fillText(`Final Score: ${score}`, W / 2, H / 3 + 50);
if (score >= highScore && score > 0) {
ctx.fillStyle = '#ffaa00';
ctx.fillText('NEW HIGH SCORE!', W / 2, H / 3 + 90);
}
ctx.fillStyle = '#88ccff';
ctx.font = '18px monospace';
ctx.fillText('[ SPACE or CLICK to RESTART ]', W / 2, H / 3 + 140);
}
}

function gameLoop(timestamp) {
const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
lastTime = timestamp;
update(dt);
draw();
requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener('click', (e) => {
initAudio();
if (gameState === 'start' || gameState === 'gameover') {
resetGame();
} else if (gameState === 'playing') {
shoot();
}
});
window.addEventListener('keydown', (e) => {
initAudio();
if (e.code === 'Space') {
e.preventDefault();
if (gameState === 'start' || gameState === 'gameover') {
resetGame();
} else if (gameState === 'playing') {
shoot();
}
}
});

requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
