<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    switch(type) {
        case 'shoot':
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
            break;
        case 'explode':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
            break;
        case 'enemyShoot':
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
            break;
        case 'playerHit':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.6);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
            break;
        case 'wave':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(400, now + 0.1);
            osc.frequency.setValueAtTime(500, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
            break;
    }
}

// Game State
let gameState = 'start'; // start, playing, gameover, waveTransition
let score = 0;
let lives = 3;
let wave = 1;
let frameCount = 0;
let waveTimer = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Player
let player = { x: 0, y: 0, w: 30, h: 30, speed: 5, cooldown: 0 };
let bullets = [];
let enemyBullets = [];
let asteroids = [];
let invaders = [];
let particles = [];
let stars = [];
let invaderDir = 1;
let invaderMoveTimer = 0;
let invaderShootTimer = 0;

// Stars background
function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 + 0.1 });
    }
}

function startGame() {
    initAudio();
    score = 0; lives = 3; wave = 1; frameCount = 0;
    player.x = W / 2; player.y = H - 60; player.cooldown = 0;
    bullets = []; enemyBullets = []; asteroids = []; particles = [];
    invaderDir = 1; invaderMoveTimer = 0; invaderShootTimer = 0;
    initStars();
    spawnWave();
    gameState = 'playing';
}

function spawnWave() {
    invaders = [];
    const cols = Math.min(8 + wave, 12);
    const rows = Math.min(4 + Math.floor(wave / 2), 7);
    const spacingX = Math.max(50, W / (cols + 2));
    const startX = (W - (cols - 1) * spacingX) / 2;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            invaders.push({
                x: startX + c * spacingX,
                y: 60 + r * 45,
                w: 28, h: 28,
                type: r % 3 === 0 ? 0 : (r % 3 === 1 ? 1 : 2),
                alive: true,
                flash: 0
            });
        }
    }
    // Spawn some asteroids
    for (let i = 0; i < 2 + wave; i++) {
        spawnAsteroid();
    }
}

function spawnAsteroid() {
    const size = Math.random() * 25 + 15;
    const x = Math.random() * (W - size * 2) + size;
    const y = -size * 2;
    const verts = [];
    const nv = Math.floor(Math.random() * 4) + 6;
    for (let i = 0; i < nv; i++) {
        const a = (i / nv) * Math.PI * 2;
        const r = size * (0.7 + Math.random() * 0.3);
        verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    asteroids.push({
        x, y, size,
        vx: (Math.random() - 0.5) * 2,
        vy: Math.random() * 1 + 0.5 + wave * 0.2,
        rot: Math.random() * Math.PI * 2,
        rotSpd: (Math.random() - 0.5) * 0.05,
        verts,
        hp: Math.ceil(size / 15)
    });
}

function explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: color || '#fff',
            size: Math.random() * 3 + 1
        });
    }
}

function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    // Shoot
    if ((keys['Space'] || keys['KeyW']) && player.cooldown <= 0) {
        bullets.push({ x: player.x, y: player.y - 20, vy: -10, life: 60 });
        playSound('shoot');
        player.cooldown = 8;
    }
    if (player.cooldown > 0) player.cooldown--;

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy;
        bullets[i].life--;
        if (bullets[i].y < -10 || bullets[i].life <= 0) bullets.splice(i, 1);
    }

    // Enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].y += enemyBullets[i].vy;
        if (enemyBullets[i].y > H + 10) enemyBullets.splice(i, 1);
    }

    // Asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx;
        a.y += a.vy;
        a.rot += a.rotSpd;
        if (a.x < a.size) { a.x = a.size; a.vx *= -1; }
        if (a.x > W - a.size) { a.x = W - a.size; a.vx *= -1; }
        if (a.y > H + a.size * 2) { asteroids.splice(i, 1); continue; }

        // Bullet hit asteroid
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            if (dx * dx + dy * dy < (a.size + 5) * (a.size + 5)) {
                bullets.splice(j, 1);
                a.hp--;
                if (a.hp <= 0) {
                    explode(a.x, a.y, '#8B7355', 12);
                    score += Math.ceil(50 / a.size * 10);
                    playSound('explode');
                    asteroids.splice(i, 1);
                } else {
                    explode(b.x, b.y, '#8B7355', 4);
                }
                break;
            }
        }

        // Asteroid hits player
        if (gameState === 'playing') {
            const dx = a.x - player.x, dy = a.y - player.y;
            if (dx * dx + dy * dy < (a.size + 15) * (a.size + 15)) {
                hitPlayer();
            }
        }
    }

    // Invaders movement
    invaderMoveTimer++;
    const moveSpeed = Math.max(2, 6 - wave);
    if (invaderMoveTimer > moveSpeed) {
        let minDx = Infinity, maxDx = -Infinity;
        for (const inv of invaders) {
            if (!inv.alive) continue;
            minDx = Math.min(minDx, inv.x);
            maxDx = Math.max(maxDx, inv.x);
        }
        if (minDx < 30 && invaderDir > 0) invaderDir = -1;
        else if (maxDx > W - 30 && invaderDir < 0) invaderDir = 1;
        for (const inv of invaders) {
            if (!inv.alive) continue;
            inv.x += invaderDir * 2;
        }
        // Occasionally move down
        if (Math.random() < 0.02 + wave * 0.005) {
            for (const inv of invaders) {
                if (!inv.alive) continue;
                inv.y += 12;
            }
        }
        invaderMoveTimer = 0;
    }

    // Invaders shoot
    invaderShootTimer++;
    const shootInterval = Math.max(30, 60 - wave * 5);
    if (invaderShootTimer > shootInterval) {
        const aliveInvaders = invaders.filter(v => v.alive);
        if (aliveInvaders.length > 0) {
            const shooter = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
            enemyBullets.push({ x: shooter.x, y: shooter.y + 15, vy: 3 + wave * 0.3 });
            playSound('enemyShoot');
        }
        invaderShootTimer = 0;
    }

    // Invaders hit player check
    for (const inv of invaders) {
        if (!inv.alive) continue;
        const dx = inv.x - player.x, dy = inv.y - player.y;
        if (Math.abs(dx) < 25 && Math.abs(dy) < 25) { hitPlayer(); break; }
    }

    // Bullet vs Invader
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        for (const inv of invaders) {
            if (!inv.alive) continue;
            if (Math.abs(b.x - inv.x) < 20 && Math.abs(b.y - inv.y) < 20) {
                bullets.splice(i, 1);
                inv.alive = false;
                inv.flash = 10;
                score += 20 + wave * 5;
                explode(inv.x, inv.y, '#0f0', 8);
                playSound('explode');
                break;
            }
        }
    }

    // Enemy bullet vs player
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        if (Math.abs(b.x - player.x) < 20 && Math.abs(b.y - player.y) < 20) {
            enemyBullets.splice(i, 1);
            hitPlayer();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Check wave clear
    const aliveCount = invaders.filter(v => v.alive).length;
    if (aliveCount === 0) {
        gameState = 'waveTransition';
        waveTimer = 90;
        playSound('wave');
    }

    // Stars
    for (const s of stars) {
        s.y += s.sp;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
}

function hitPlayer() {
    lives--;
    explode(player.x, player.y, '#ff4444', 20);
    playSound('playerHit');
    if (lives <= 0) {
        gameState = 'gameover';
    } else {
        player.x = W / 2;
        player.y = H - 60;
    }
}

function updateWaveTransition() {
    waveTimer--;
    if (waveTimer <= 0) {
        wave++;
        spawnWave();
        gameState = 'playing';
    }
}

// Drawing
function drawShip(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-12, 14);
    ctx.lineTo(-5, 10);
    ctx.lineTo(0, 14);
    ctx.lineTo(5, 10);
    ctx.lineTo(12, 14);
    ctx.closePath();
    ctx.fillStyle = '#4af';
    ctx.fill();
    ctx.strokeStyle = '#8df';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Engine glow
    if (frameCount % 4 < 2) {
        ctx.beginPath();
        ctx.moveTo(-4, 14);
        ctx.lineTo(0, 22 + Math.random() * 4);
        ctx.lineTo(4, 14);
        ctx.fillStyle = '#fa0';
        ctx.fill();
    }
    ctx.restore();
}

function drawInvader(inv) {
    if (!inv.alive) return;
    ctx.save();
    ctx.translate(inv.x, inv.y);
    const colors = ['#0f0', '#f0f', '#ff0'];
    const c = colors[inv.type];
    ctx.fillStyle = c;
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.5;

    if (inv.type === 0) {
        // Squid type
        ctx.beginPath();
        ctx.rect(-12, -4, 6, 6);
        ctx.rect(6, -4, 6, 6);
        ctx.fill();
        ctx.fillRect(-8, -10, 16, 8);
        ctx.fillRect(-12, 4, 24, 4);
        // Legs
        for (let i = -1; i <= 1; i += 2) {
            ctx.beginPath();
            ctx.moveTo(i * 8, 8);
            ctx.lineTo(i * 10, 12);
            ctx.stroke();
        }
    } else if (inv.type === 1) {
        // Crab type
        ctx.fillRect(-12, -6, 24, 12);
        ctx.fillRect(-8, -12, 16, 6);
        ctx.fillRect(-14, 0, 4, 8);
        ctx.fillRect(10, 0, 4, 8);
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, -4, 4, 3);
        ctx.fillRect(2, -4, 4, 3);
    } else {
        // Octopus type
        ctx.fillRect(-10, -8, 20, 10);
        ctx.fillRect(-14, 2, 28, 6);
        ctx.fillRect(-12, 8, 5, 4);
        ctx.fillRect(7, 8, 5, 4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-5, -5, 3, 3);
        ctx.fillRect(3, -5, 3, 3);
    }
    ctx.restore();
}

function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    for (let i = 0; i < a.verts.length; i++) {
        if (i === 0) ctx.moveTo(a.verts[i].x, a.verts[i].y);
        else ctx.lineTo(a.verts[i].x, a.verts[i].y);
    }
    ctx.closePath();
    ctx.fillStyle = '#5a4a3a';
    ctx.fill();
    ctx.strokeStyle = '#8B7355';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Craters
    ctx.beginPath();
    ctx.arc(-a.size * 0.2, -a.size * 0.1, a.size * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = '#3a2a1a';
    ctx.fill();
    ctx.restore();
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#fff';
    for (const s of stars) {
        ctx.globalAlpha = 0.3 + s.s * 0.2;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    if (gameState === 'gameover') {
        drawGameOver();
        return;
    }

    // Draw entities
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    for (const a of asteroids) drawAsteroid(a);
    for (const inv of invaders) drawInvader(inv);

    // Bullets
    ctx.fillStyle = '#ff0';
    for (const b of bullets) {
        ctx.fillRect(b.x - 2, b.y - 8, 4, 10);
    }
    // Enemy bullets
    ctx.fillStyle = '#f44';
    for (const b of enemyBullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Player
    if (gameState === 'playing') drawShip(player.x, player.y);

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`WAVE: ${wave}`, 20, 55);
    // Lives
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#4af';
        ctx.beginPath();
        ctx.moveTo(W - 40 + i * 30, 25);
        ctx.lineTo(W - 48 + i * 30, 40);
        ctx.lineTo(W - 40 + i * 30, 35);
        ctx.lineTo(W - 32 + i * 30, 40);
        ctx.closePath();
        ctx.fill();
    }

    // Wave transition
    if (gameState === 'waveTransition') {
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`WAVE ${wave} CLEARED!`, W / 2, H / 2);
        ctx.font = '20px monospace';
        ctx.fillText(`Next: Wave ${wave + 1}`, W / 2, H / 2 + 50);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE INVADERS', W / 2, H / 3 - 20);
    ctx.fillText('ASTEROIDS', W / 2, H / 3 + 30);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('← → or A/D : Move', W / 2, H / 2 + 20);
    ctx.fillText('SPACE or W : Shoot', W / 2, H / 2 + 50);
    ctx.fillText('Destroy invaders and asteroids!', W / 2, H / 2 + 90);

    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 24px monospace';
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillText('PRESS SPACE TO START', W / 2, H * 0.75);
    }

    // Decorative
    ctx.font = '14px monospace';
    ctx.fillStyle = '#666';
    ctx.textAlign = 'center';
    ctx.fillText('A hybrid arcade shooter — survive the waves!', W / 2, H * 0.85);
}

function drawGameOver() {
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 2);
    ctx.fillText(`WAVES SURVIVED: ${wave}`, W / 2, H / 2 + 40);

    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 20px monospace';
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillText('PRESS SPACE TO RESTART', W / 2, H * 0.7);
    }
}

// Main loop
function loop() {
    update();
    if (gameState === 'waveTransition') updateWaveTransition();
    draw();
    requestAnimationFrame(loop);
}

initStars();
loop();
</script>
</body>
</html>
