<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Rush - Typing Racing Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    width: 100vw; height: 100vh; overflow: hidden; 
    background: #1a1a2e; font-family: 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
}
canvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playBeep(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function playTypeSound() { playBeep(800 + Math.random()*200, 0.05, 'square', 0.05); }
function playWordComplete() { playBeep(600, 0.1, 'sine', 0.15); setTimeout(()=>playBeep(900,0.1,'sine',0.12),80); setTimeout(()=>playBeep(1200,0.15,'sine',0.1),160); }
function playError() { playBeep(150, 0.2, 'sawtooth', 0.12); }
function playFinish() { for(let i=0;i<5;i++) setTimeout(()=>playBeep(400+i*200,0.15,'square',0.1),i*100); }
function playEngine() { if(!audioCtx)return; const osc=audioCtx.createOscillator();const g=audioCtx.createGain();osc.type='sawtooth';osc.frequency.value=80+game.speed*2;g.gain.value=0.02;osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+0.05); }

// Word bank
const WORDS = [
    "the","run","fast","race","type","speed","zoom","dash","sprint","boost",
    "accelerate","turbo","rocket","blaze","thunder","lightning","falcon","comet",
    "velocity","momentum","propulsion","drift","overtake","checkmate","victory",
    "champion","glory","triumph","pursuit","velocity","circuit","gridlock",
    "nitrous","octane","cylinder","ignition","combustion","turbine","dynamo",
    "kinetic","magnetic","electronic","plasma","quantum","cosmic","stellar",
    "nebula","galaxy","supernova","graviton","photon","electron","proton"
];

// Game state
let game = {
    state: 'start', // start, countdown, racing, finished
    playerX: 0, // distance in pixels
    speed: 0,
    currentWord: '',
    typed: 0,
    wordsTyped: 0,
    totalWords: 25,
    aiCars: [],
    finishDist: 8000,
    countdown: 3,
    countdownTimer: 0,
    lastTime: 0,
    particles: [],
    shakeTime: 0,
    result: '',
    playerLane: 1,
    laneCount: 4,
    mistakeStreak: 0
};

function getWordsForRace() {
    const shuffled = [...WORDS].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, game.totalWords + 5);
}

function startGame() {
    initAudio();
    game.state = 'countdown';
    game.countdown = 3;
    game.countdownTimer = 0;
    game.playerX = 0;
    game.speed = 0;
    game.typed = 0;
    game.wordsTyped = 0;
    game.mistakeStreak = 0;
    game.particles = [];
    game.shakeTime = 0;
    game.result = '';
    
    const words = getWordsForRace();
    game.currentWord = words[0];
    game.words = words;
    game.wordIndex = 0;
    
    // AI cars
    game.aiCars = [];
    for (let i = 0; i < 3; i++) {
        const lane = [0, 2, 3][i];
        game.aiCars.push({
            x: 0,
            lane: lane,
            speed: 40 + Math.random() * 30,
            baseSpeed: 50 + Math.random() * 40,
            color: ['#e74c3c','#f39c12','#9b59b6'][i],
            name: ['REDS','AMBER','VIOLET'][i],
            wobble: Math.random() * Math.PI * 2
        });
    }
}

function handleKey(e) {
    if (game.state === 'start') {
        startGame();
        return;
    }
    if (game.state === 'finished') {
        if (e.key === ' ' || e.key === 'Enter') startGame();
        return;
    }
    if (game.state !== 'racing') return;
    
    if (e.key === ' ') {
        // Space - advance word
        if (game.typed >= game.currentWord.length) {
            completeWord();
        }
        return;
    }
    
    const ch = e.key.toLowerCase();
    if (!ch || ch.length !== 1) return;
    
    if (ch === game.currentWord[game.typed]) {
        game.typed++;
        playTypeSound();
        game.speed = Math.min(game.speed + 8, 60);
        addParticle('type');
        
        if (game.typed >= game.currentWord.length) {
            // Word complete - big boost!
            setTimeout(completeWord, 100);
        }
    } else {
        playError();
        game.mistakeStreak++;
        game.speed = Math.max(game.speed - 15, -20);
        game.shakeTime = 0.2;
        if (game.mistakeStreak >= 3) {
            game.mistakeStreak = 0;
            // Extra penalty
            game.speed = Math.max(game.speed - 10, -30);
        }
    }
}

function completeWord() {
    if (game.typed < game.currentWord.length) return;
    playWordComplete();
    game.wordsTyped++;
    game.wordIndex++;
    game.typed = 0;
    game.speed += 25;
    
    // Particle burst
    for (let i = 0; i < 8; i++) {
        game.particles.push({
            x: W * 0.3, y: H * 0.5 + (game.playerLane - 1.5) * (H/laneCount),
            vx: (Math.random()-0.5)*200, vy: (Math.random()-0.5)*200,
            life: 0.5, color: '#4fc3f7', size: 4
        });
    }
    
    if (game.wordIndex < game.words.length) {
        game.currentWord = game.words[game.wordIndex];
    } else {
        // All words done - keep going at current speed to finish
        game.currentWord = '';
    }
}

function addParticle(type) {
    const y = H * 0.5 + (game.playerLane - 1.5) * (H / laneCount);
    game.particles.push({
        x: W * 0.25, y: y,
        vx: -Math.random()*100-50, vy: (Math.random()-0.5)*30,
        life: 0.4, color: type === 'type' ? '#69f0ae' : '#ffeb3b',
        size: 3 + Math.random()*3
    });
}

window.addEventListener('keydown', handleKey);

function update(dt) {
    if (game.state === 'countdown') {
        game.countdownTimer += dt;
        if (game.countdownTimer >= 1) {
            game.countdownTimer = 0;
            game.countdown--;
            playBeep(game.countdown > 0 ? 440 : 880, 0.2, 'square', 0.15);
            if (game.countdown <= 0) {
                game.state = 'racing';
            }
        }
        return;
    }
    
    if (game.state !== 'racing') return;
    
    // Friction
    game.speed *= 0.92;
    if (game.speed < 0) game.speed *= 0.95;
    
    // Move player
    game.playerX += game.speed * dt;
    
    // Update AI
    const t = performance.now() / 1000;
    for (let car of game.aiCars) {
        car.wobble += dt * 3;
        const wobbleSpeed = Math.sin(car.wobble) * 15;
        const effectiveSpeed = car.baseSpeed + wobbleSpeed;
        car.x += effectiveSpeed * dt;
    }
    
    // Check finish
    if (game.playerX >= game.finishDist) {
        game.state = 'finished';
        game.result = 'YOU WIN! 🏆';
        playFinish();
        return;
    }
    for (let car of game.aiCars) {
        if (car.x >= game.finishDist) {
            game.state = 'finished';
            game.result = `DEFEATED BY ${car.name}`;
            playBeep(200, 0.5, 'sawtooth', 0.15);
            return;
        }
    }
    
    // Update particles
    for (let p of game.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
    }
    game.particles = game.particles.filter(p => p.life > 0);
    
    // Shake decay
    if (game.shakeTime > 0) game.shakeTime -= dt;
}

function drawCar(x, y, color, isPlayer, speed) {
    ctx.save();
    ctx.translate(x, y);
    
    // Car body
    const cw = 40, ch = 22;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-cw/2, -ch/2, cw, ch, 5);
    ctx.fill();
    
    // Windshield
    ctx.fillStyle = 'rgba(173,216,230,0.7)';
    ctx.fillRect(cw/2 - 14, -ch/2 + 4, 8, ch - 8);
    
    // Wheels
    ctx.fillStyle = '#222';
    ctx.fillRect(-cw/2 + 2, -ch/2 - 3, 10, 5);
    ctx.fillRect(cw/2 - 12, -ch/2 - 3, 10, 5);
    ctx.fillRect(-cw/2 + 2, ch/2 - 2, 10, 5);
    ctx.fillRect(cw/2 - 12, ch/2 - 2, 10, 5);
    
    // Speed lines for player
    if (isPlayer && speed > 10) {
        ctx.strokeStyle = 'rgba(105,240,174,0.5)';
        ctx.lineWidth = 2;
        for (let i = 0; i < Math.min(speed/10, 5); i++) {
            const ly = -ch/2 + (i+1) * (ch/(Math.min(speed/10,5)+1));
            ctx.beginPath();
            ctx.moveTo(-cw/2 - 10 - i*5, ly);
            ctx.lineTo(-cw/2 - 20 - i*8, ly);
            ctx.stroke();
        }
    }
    
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    // Shake
    let shakeX = 0, shakeY = 0;
    if (game.shakeTime > 0) {
        shakeX = (Math.random()-0.5) * 8;
        shakeY = (Math.random()-0.5) * 8;
    }
    
    ctx.save();
    ctx.translate(shakeX, shakeY);
    
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f0c29');
    grad.addColorStop(0.5, '#1a1a3e');
    grad.addColorStop(1, '#0f0c29');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    if (game.state === 'start') {
        drawStartScreen();
        ctx.restore();
        return;
    }
    
    const laneHeight = H / laneCount;
    const roadTop = H * 0.3;
    const roadBottom = H * 0.75;
    const roadHeight = roadBottom - roadTop;
    const actualLaneH = roadHeight / laneCount;
    
    // Draw road
    ctx.fillStyle = '#2d2d2d';
    ctx.fillRect(0, roadTop, W, roadHeight);
    
    // Road edges
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, roadTop - 4, W, 4);
    ctx.fillRect(0, roadBottom, W, 4);
    
    // Lane lines
    const scrollOffset = (game.playerX * 2) % 60;
    for (let i = 1; i < laneCount; i++) {
        const ly = roadTop + i * actualLaneH;
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([30, 30]);
        ctx.lineDashOffset = -scrollOffset;
        ctx.beginPath();
        ctx.moveTo(0, ly);
        ctx.lineTo(W, ly);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    
    // Finish line
    const finishX = W * 0.25 + (game.finishDist - game.playerX) * 0.1;
    if (finishX < W && finishX > -50) {
        for (let i = 0; i < Math.ceil(roadHeight/16); i++) {
            for (let j = 0; j < 4; j++) {
                ctx.fillStyle = ((i+j) % 2) ? '#fff' : '#000';
                ctx.fillRect(finishX, roadTop + i*16, 16, 16);
            }
        }
    }
    
    // Draw AI cars
    for (let car of game.aiCars) {
        const relX = W * 0.25 + (car.x - game.playerX) * 0.1;
        if (relX > -60 && relX < W + 60) {
            const cy = roadTop + (car.lane + 0.5) * actualLaneH;
            drawCar(relX, cy, car.color, false, car.speed);
            // Name
            ctx.fillStyle = '#fff';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(car.name, relX, cy - actualLaneH/2 + 14);
        }
    }
    
    // Draw player car
    const px = W * 0.25;
    const py = roadTop + (game.playerLane + 0.5) * actualLaneH;
    drawCar(px, py, '#4fc3f7', true, game.speed);
    
    // Particles
    for (let p of game.particles) {
        ctx.globalAlpha = p.life / 0.5;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // HUD
    drawHUD(roadTop, roadBottom, actualLaneH);
    
    if (game.state === 'countdown') {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(W,H)*0.2}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const num = game.countdown > 0 ? game.countdown : 'GO!';
        ctx.fillText(num, W/2, H*0.5);
    }
    
    if (game.state === 'finished') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = game.result.includes('WIN') ? '#4fc3f7' : '#e74c3c';
        ctx.font = `bold ${Math.min(W,H)*0.08}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(game.result, W/2, H*0.4);
        
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(W,H)*0.035}px monospace`;
        ctx.fillText(`Words: ${game.wordsTyped}  |  Distance: ${Math.round(game.playerX)}m`, W/2, H*0.52);
        ctx.fillStyle = '#aaa';
        ctx.font = `${Math.min(W,H)*0.03}px monospace`;
        ctx.fillText('Press SPACE to race again', W/2, H*0.62);
    }
    
    ctx.restore();
}

function drawHUD(roadTop, roadBottom, laneH) {
    // Word display
    const wordY = roadBottom + 40;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(W*0.2, wordY - 15, W*0.6, 35);
    
    if (game.currentWord) {
        const typedPart = game.currentWord.substring(0, game.typed);
        const remaining = game.currentWord.substring(game.typed);
        
        ctx.font = `bold ${Math.min(H*0.045, 28)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const totalWidth = ctx.measureText(game.currentWord).width;
        const typedWidth = ctx.measureText(typedPart).width;
        const startX = W/2 - totalWidth/2;
        
        ctx.fillStyle = '#69f0ae';
        ctx.textAlign = 'left';
        ctx.fillText(typedPart, startX, wordY + 2);
        ctx.fillStyle = '#fff';
        ctx.fillText(remaining, startX + typedWidth, wordY + 2);
    } else {
        ctx.fillStyle = '#4fc3f7';
        ctx.font = `bold ${Math.min(H*0.04, 24)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('HOLD YOUR SPEED! →', W/2, wordY + 2);
    }
    
    // Progress bar
    const progY = H * 0.15;
    const progW = W * 0.7;
    const progX = W * 0.15;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(progX - 4, progY - 4, progW + 8, 24);
    
    // Player progress
    const pProg = Math.min(game.playerX / game.finishDist, 1);
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(progX, progY, progW * pProg, 16);
    
    // AI progress markers
    for (let car of game.aiCars) {
        const aProg = Math.min(car.x / game.finishDist, 1);
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.arc(progX + progW * aProg, progY + 8, 6, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Player marker
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(progX + progW * pProg, progY + 8, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Finish flag on progress
    ctx.font = '12px monospace';
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'right';
    ctx.fillText('🏁', progX + progW + 20, progY + 14);
    
    // Speed indicator
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W*0.7, H*0.22, W*0.25, 30);
    ctx.fillStyle = game.speed > 0 ? '#69f0ae' : (game.speed < 0 ? '#e74c3c' : '#666');
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    const spdText = `SPD: ${Math.abs(Math.round(game.speed))}`;
    ctx.fillText(spdText, W*0.72, H*0.22 + 20);
    
    // Speed bar
    const spdBarW = W * 0.18;
    const spdFill = Math.min(Math.abs(game.speed) / 60, 1);
    ctx.fillStyle = '#333';
    ctx.fillRect(W*0.72, H*0.22 + 8, spdBarW, 14);
    ctx.fillStyle = game.speed > 0 ? '#69f0ae' : '#e74c3c';
    ctx.fillRect(W*0.72, H*0.22 + 8, spdBarW * spdFill, 14);
    
    // Word counter
    ctx.fillStyle = '#aaa';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Word: ${game.wordsTyped}/${game.totalWords}`, W*0.15, H*0.08);
}

function drawStartScreen() {
    // Title
    const titleSize = Math.min(W * 0.12, 72);
    ctx.fillStyle = '#4fc3f7';
    ctx.font = `bold ${titleSize}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TYPE RUSH', W/2, H * 0.25);
    
    // Subtitle
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W*0.03, 18)}px monospace`;
    ctx.fillText('~ Typing Racing Game ~', W/2, H * 0.35);
    
    // Controls box
    const boxW = Math.min(W * 0.7, 500);
    const boxH = Math.min(H * 0.4, 250);
    const boxX = W/2 - boxW/2;
    const boxY = H * 0.42;
    
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, 10);
    ctx.fill();
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    const lines = [
        ['⌨️', 'Type the displayed words to accelerate'],
        ['✓', 'Correct keys boost your speed'],
        ['✗', 'Wrong keys slow you down!'],
        [' ', 'SPACE completes a word for bonus boost'],
        ['', 'Race 3 AI opponents to the finish line'],
        ['', `First to ${game.finishDist}m wins!`]
    ];
    
    ctx.font = `${Math.min(W*0.025, 16)}px monospace`;
    ctx.textAlign = 'left';
    const lineH = boxH / (lines.length + 1);
    for (let i = 0; i < lines.length; i++) {
        const [icon, text] = lines[i];
        if (icon) {
            ctx.fillStyle = '#4fc3f7';
            ctx.fillText(icon, boxX + 20, boxY + lineH * (i+1));
        }
        ctx.fillStyle = '#ddd';
        ctx.fillText(text, boxX + 55, boxY + lineH * (i+1));
    }
    
    // Press any key
    const pulse = Math.sin(performance.now() / 400) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = `bold ${Math.min(W*0.035, 24)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('PRESS ANY KEY TO RACE', W/2, H * 0.9);
    
    // Decorative cars
    const t = performance.now() / 1000;
    for (let i = 0; i < 3; i++) {
        const cx = W * 0.2 + i * W * 0.3;
        const cy = H * 0.82 + Math.sin(t*2 + i) * 5;
        drawCar(cx, cy, ['#e74c3c','#f39c12','#9b59b6'][i], false, 0);
    }
}

let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
