<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rush Endless</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
let engineOsc = null;
let engineGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try { localStorage.setItem('rushendless', '1'); } catch(e) {}
}

function startEngine() {
  if (!audioCtx) return;
  stopEngine();
  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 55;
  engineGain.gain.value = 0.03;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 200;
  engineOsc.connect(filter);
  filter.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();
}

function stopEngine() {
  if (engineOsc) { try { engineOsc.stop(); } catch(e){} }
  if (engineGain) { engineGain = null; }
  engineOsc = null;
}

function updateEngine(speed) {
  if (!engineOsc || !engineGain) return;
  const freq = 40 + speed * 0.8;
  const vol = 0.02 + speed * 0.0003;
  engineOsc.frequency.value = freq;
  engineGain.gain.value = Math.min(vol, 0.06);
}

function playCrash() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = 80;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 400;
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);

  const noise = audioCtx.createBufferSource();
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  noise.buffer = buf;
  const nGain = audioCtx.createGain();
  nGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  nGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  noise.connect(nGain);
  nGain.connect(audioCtx.destination);
  noise.start();
}

function playLaneChange() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 300;
  osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

// Game State
const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.START;
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('rushEndlessHS') || '0'); } catch(e) {}

// Game variables
let playerLane = 1; // 0, 1, 2
let playerX = 0;
let targetX = 0;
let speed = 0;
let baseSpeed = 3;
let maxSpeed = 14;
let roadOffset = 0;
let enemies = [];
let particles = [];
let shakeTimer = 0;
let shakeIntensity = 0;
let spawnTimer = 0;
let elapsed = 0;
let lastTime = 0;

const LANES = [0, 1, 2];
const ROAD_RATIO = 0.55; // road width as fraction of screen

function getRoadX() { return W * (0.5 - ROAD_RATIO / 2); }
function getRoadW() { return W * ROAD_RATIO; }
function getLaneCenter(lane) {
  const rw = getRoadW();
  const laneW = rw / 3;
  return getRoadX() + laneW * lane + laneW / 2;
}

function resetGame() {
  playerLane = 1;
  playerX = getLaneCenter(1);
  targetX = getLaneCenter(1);
  speed = baseSpeed;
  score = 0;
  roadOffset = 0;
  enemies = [];
  particles = [];
  spawnTimer = 0;
  elapsed = 0;
  shakeTimer = 0;
}

function getCarW() { return Math.min(getRoadW() / 3 * 0.55, 60); }
function getCarH() { return getCarW() * 1.6; }

function spawnEnemy() {
  // Don't block all 3 lanes - ensure at least one lane is free
  const occupied = enemies.filter(e => e.y < H * 0.25).map(e => e.lane);
  const available = [0, 1, 2].filter(l => !occupied.includes(l));
  if (available.length <= 1) return; // safety: don't spawn if it would block all

  const lane = available[Math.floor(Math.random() * available.length)];
  const carW = getCarW();
  const colors = ['#ff4444', '#ff8800', '#ffcc00', '#44ff44', '#44ccff', '#cc44ff'];
  enemies.push({
    lane: lane,
    x: getLaneCenter(lane),
    y: -getCarH() - 20,
    color: colors[Math.floor(Math.random() * colors.length)],
    w: carW,
    h: getCarH(),
    speedMod: 0.7 + Math.random() * 0.3
  });
}

function spawnParticles(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 6;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: 3 + Math.random() * 5,
      color: `hsl(${Math.floor(Math.random() * 60)}, 100%, ${50 + Math.random() * 30}%)`
    });
  }
}

function checkCollision(e) {
  const pw = getCarW();
  const ph = getCarH();
  const px = playerX;
  const py = H - ph - 20;
  const ex = e.x;
  const ey = e.y;

  if (Math.abs(px - ex) < (pw + e.w) * 0.4 && Math.abs(py - ey) < (ph + e.h) * 0.35) {
    return true;
  }
  return false;
}

function drawCar(x, y, w, h, color, isPlayer) {
  const r = w * 0.15;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h/2, w, h, r);
  ctx.fill();

  // Windshield
  ctx.fillStyle = isPlayer ? 'rgba(100,200,255,0.6)' : 'rgba(30,30,50,0.7)';
  ctx.fillRect(x - w * 0.3, y - h * 0.35, w * 0.6, h * 0.2);

  // Taillights / headlights
  if (isPlayer) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillRect(x - w * 0.4, y - h/2 + 3, w * 0.15, 4);
    ctx.fillRect(x + w * 0.25, y - h/2 + 3, w * 0.15, 4);
  } else {
    ctx.fillStyle = 'rgba(255,50,50,0.8)';
    ctx.fillRect(x - w * 0.4, y + h/2 - 7, w * 0.15, 4);
    ctx.fillRect(x + w * 0.25, y + h/2 - 7, w * 0.15, 4);
  }

  // Center stripe for player
  if (isPlayer) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(x - w * 0.08, y - h * 0.2, w * 0.16, h * 0.4);
  }
}

function drawRoad() {
  const rx = getRoadX();
  const rw = getRoadW();

  // Shoulders
  ctx.fillStyle = '#1a3320';
  ctx.fillRect(0, 0, W, H);

  // Road surface
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#2a2a3e');
  grad.addColorStop(1, '#3a3a4e');
  ctx.fillStyle = grad;
  ctx.fillRect(rx, 0, rw, H);

  // Road edges
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(rx + 2, 0);
  ctx.lineTo(rx + 2, H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rx + rw - 2, 0);
  ctx.lineTo(rx + rw - 2, H);
  ctx.stroke();

  // Lane dividers (dashed)
  const dashLen = 40;
  const gapLen = 30;
  const totalCycle = dashLen + gapLen;
  const offset = roadOffset % totalCycle;

  for (let l = 1; l <= 2; l++) {
    const lx = rx + rw / 3 * l;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    ctx.setLineDash([dashLen, gapLen]);
    ctx.lineDashOffset = -offset;
    ctx.beginPath();
    ctx.moveTo(lx, 0);
    ctx.lineTo(lx, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Rumble strips on edges
  const rumbleCycle = 30;
  const rumbleOffset = roadOffset % (rumbleCycle * 2);
  for (let side = 0; side < 2; side++) {
    const ex = side === 0 ? rx - 10 : rx + rw;
    for (let y = -rumbleOffset; y < H + rumbleCycle * 2; y += rumbleCycle) {
      ctx.fillStyle = `rgba(255, ${side === 0 ? 80 : 80}, 80, 0.4)`;
      ctx.fillRect(ex, y, 10, rumbleCycle);
    }
  }
}

function drawSpeedLines() {
  if (speed < 6) return;
  const alpha = Math.min((speed - 6) / 10, 0.3);
  ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const len = speed * 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + len);
    ctx.stroke();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W/2 - 120, 10, 240, 50);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`SCORE: ${Math.floor(score)}`, W/2, 35);
  ctx.font = '14px monospace';
  ctx.fillStyle = `hsl(${(speed / maxSpeed) * 120}, 80%, 60%)`;
  ctx.fillText(`SPEED: ${Math.floor(speed * 10)} km/h`, W/2, 52);

  if (highScore > 0) {
    ctx.font = '12px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`BEST: ${Math.floor(highScore)}`, W/2, H - 15);
  }
}

function drawStartScreen() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // Animated background lines
  const t = Date.now() * 0.001;
  ctx.strokeStyle = 'rgba(0,200,255,0.1)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 20; i++) {
    const y = ((t * 100 + i * 60) % H);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#00e5ff';
  ctx.font = `bold ${Math.min(W * 0.12, 72)}px monospace`;
  ctx.fillText('RUSH', W/2, H * 0.3);
  ctx.fillStyle = '#ff4466';
  ctx.font = `bold ${Math.min(W * 0.08, 48)}px monospace`;
  ctx.fillText('ENDLESS', W/2, H * 0.4);

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = `${Math.min(W * 0.035, 18)}px monospace`;
  ctx.fillText('← → or A/D to change lanes', W/2, H * 0.55);
  ctx.fillText('Dodge traffic. Survive. Go fast.', W/2, H * 0.62);

  const pulse = 0.5 + Math.sin(t * 3) * 0.5;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = `bold ${Math.min(W * 0.04, 24)}px monospace`;
  ctx.fillText('PRESS SPACE TO START', W/2, H * 0.78);

  if (highScore > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `${Math.min(W * 0.03, 16)}px monospace`;
    ctx.fillText(`HIGH SCORE: ${Math.floor(highScore)}`, W/2, H * 0.88);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff4466';
  ctx.font = `bold ${Math.min(W * 0.1, 60)}px monospace`;
  ctx.fillText('WRECKED', W/2, H * 0.3);

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(W * 0.05, 28)}px monospace`;
  ctx.fillText(`SCORE: ${Math.floor(score)}`, W/2, H * 0.45);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#ffcc00';
    ctx.font = `bold ${Math.min(W * 0.04, 22)}px monospace`;
    ctx.fillText('★ NEW HIGH SCORE ★', W/2, H * 0.53);
  } else if (highScore > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `${Math.min(W * 0.035, 18)}px monospace`;
    ctx.fillText(`BEST: ${Math.floor(highScore)}`, W/2, H * 0.53);
  }

  const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = `bold ${Math.min(W * 0.04, 22)}px monospace`;
  ctx.fillText('PRESS SPACE TO RESTART', W/2, H * 0.7);
}

function update(dt) {
  if (state !== STATE.PLAYING) return;

  elapsed += dt;
  const speedRamp = Math.min(elapsed / 60, 1); // ramp over 60 seconds
  speed = baseSpeed + speedRamp * (maxSpeed - baseSpeed);
  updateEngine(speed);

  roadOffset += speed * dt * 30;
  score += speed * dt * 5;

  // Player movement
  const laneW = getRoadW() / 3;
  targetX = getLaneCenter(playerLane);
  playerX += (targetX - playerX) * Math.min(dt * 12, 1);

  // Spawn enemies
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const interval = Math.max(0.4, 1.5 - speed * 0.08);
    spawnTimer = interval + Math.random() * 0.3;
    spawnEnemy();
    // Sometimes spawn two
    if (speed > 6 && Math.random() < 0.3) {
      setTimeout(() => { if (state === STATE.PLAYING) spawnEnemy(); }, 100);
    }
  }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += speed * dt * 30 * e.speedMod;
    if (e.y > H + 100) {
      enemies.splice(i, 1);
      continue;
    }
    if (checkCollision(e)) {
      // Crash!
      state = STATE.GAMEOVER;
      playCrash();
      stopEngine();
      shakeTimer = 0.5;
      shakeIntensity = 12;
      spawnParticles(playerX, H - getCarH() - 20, 40);
      if (score > highScore) {
        highScore = Math.floor(score);
        try { localStorage.setItem('rushEndlessHS', String(highScore)); } catch(e2) {}
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Shake
  if (shakeTimer > 0) shakeTimer -= dt;
}

function render() {
  ctx.save();

  // Screen shake
  if (shakeTimer > 0) {
    const s = shakeIntensity * (shakeTimer / 0.5);
    ctx.translate(
      (Math.random() - 0.5) * s,
      (Math.random() - 0.5) * s
    );
  }

  if (state === STATE.START) {
    drawStartScreen();
    ctx.restore();
    return;
  }

  // Background
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(0, 0, W, H);

  drawRoad();
  drawSpeedLines();

  // Draw enemies
  for (const e of enemies) {
    drawCar(e.x, e.y, e.w, e.h, e.color, false);
  }

  // Draw player
  const py = H - getCarH() - 20;
  if (state === STATE.PLAYING) {
    drawCar(playerX, py, getCarW(), getCarH(), '#00e5ff', true);
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  drawHUD();

  if (state === STATE.GAMEOVER) {
    drawGameOver();
  }

  ctx.restore();
}

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    if (state === STATE.START || state === STATE.GAMEOVER) {
      initAudio();
      resetGame();
      state = STATE.PLAYING;
      startEngine();
    }
  }

  if (state !== STATE.PLAYING) return;

  if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && playerLane > 0) {
    playerLane--;
    playLaneChange();
  } else if ((e.code === 'ArrowRight' || e.code === 'KeyD') && playerLane < 2) {
    playerLane++;
    playLaneChange();
  }
});

// Touch / click for mobile
let touchStartX = null;
canvas.addEventListener('touchstart', (e) => {
  initAudio();
  if (state === STATE.START || state === STATE.GAMEOVER) {
    resetGame();
    state = STATE.PLAYING;
    startEngine();
  }
  touchStartX = e.touches[0].clientX;
});

canvas.addEventListener('touchend', (e) => {
  if (state !== STATE.PLAYING || touchStartX === null) return;
  const endX = e.changedTouches[0].clientX;
  const dx = endX - touchStartX;
  if (Math.abs(dx) > 30) {
    if (dx < 0 && playerLane > 0) { playerLane--; playLaneChange(); }
    else if (dx > 0 && playerLane < 2) { playerLane++; playLaneChange(); }
  }
});

// Polyfill for roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r];
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
  };
}

// Init
resetGame();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
