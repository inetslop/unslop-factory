<!DOCTYPE html>
<html>
<head>
<title>Rune Depths</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function playSuccess() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.4, 0.2), i * 100));
}
function playFail() {
    playTone(200, 0.5, 0.3);
    setTimeout(() => playTone(150, 0.6, 0.3), 200);
}

// Game State
const STATE = { START: 0, PLAYING: 1, PUZZLE: 2, WIN: 3 };
let gameState = STATE.START;
let score = 0;
let timeStart = 0;
let timeEnd = 0;

// Player
const player = { x: 100, y: 0, vy: 0, radius: 14, grounded: false, trail: [] };
const GRAVITY = 0.6;
const JUMP_VEL = -12;
const MOVE_SPEED = 5;

// Level
let platforms = [];
let gates = [];
let crystals = [];
let particles = [];
let cameraX = 0;
let solvedGates = 0;
const TOTAL_GATES = 8;

function generateLevel() {
    platforms = [];
    gates = [];
    crystals = [];
    particles = [];
    
    // Ground segments with gaps
    let x = 0;
    while (x < 6000) {
        const w = 200 + Math.random() * 300;
        platforms.push({ x: x, y: H - 60, w: w, h: 60 });
        x += w + (Math.random() > 0.7 ? 80 : 40);
    }
    
    // Floating platforms
    for (let i = 0; i < 25; i++) {
        const px = Math.random() * 5500;
        const py = H - 150 - Math.random() * 200;
        const pw = 80 + Math.random() * 120;
        platforms.push({ x: px, y: py, w: pw, h: 20 });
    }
    
    // Rune Gates
    for (let i = 0; i < TOTAL_GATES; i++) {
        const gx = 700 + i * 700;
        gates.push({ x: gx, y: H - 140, radius: 35, solved: false, pulse: Math.random() * Math.PI * 2 });
    }
    
    // Decorative crystals
    for (let i = 0; i < 60; i++) {
        crystals.push({
            x: Math.random() * 6000,
            y: 50 + Math.random() * (H - 150),
            size: 3 + Math.random() * 8,
            hue: [180, 270, 45, 120][Math.floor(Math.random() * 4)],
            phase: Math.random() * Math.PI * 2
        });
    }
    
    player.x = 100;
    player.y = H - 60 - player.radius;
    player.vy = 0;
    player.trail = [];
    solvedGates = 0;
    cameraX = 0;
}

// Puzzle System
const puzzle = {
    active: false,
    gateIndex: 0,
    type: 0, // 0=simon, 1=match
    sequence: [],
    inputSeq: [],
    displayTimer: 0,
    displayIdx: 0,
    phase: 'show', // show, input, success, fail
    lights: [false, false, false, false],
    lightTimers: [0, 0, 0, 0],
    targetValue: 0,
    attempt: 0,
    maxAttempts: 3
};

function startPuzzle(gateIdx) {
    initAudio();
    puzzle.active = true;
    puzzle.gateIndex = gateIdx;
    gameState = STATE.PUZZLE;
    
    const difficulty = Math.min(8, 3 + gateIdx);
    if (gateIdx < 4) {
        puzzle.type = 0; // Simon
        puzzle.sequence = [];
        for (let i = 0; i < difficulty; i++) {
            puzzle.sequence.push(Math.floor(Math.random() * 4));
        }
    } else {
        puzzle.type = 1; // Match
        puzzle.targetValue = Math.floor(Math.random() * 10);
    }
    
    puzzle.inputSeq = [];
    puzzle.phase = 'show';
    puzzle.displayIdx = 0;
    puzzle.displayTimer = 60;
    puzzle.lights = [false, false, false, false];
    puzzle.lightTimers = [0, 0, 0, 0];
    puzzle.attempt = 0;
}

function updatePuzzle() {
    if (!puzzle.active) return;
    
    if (puzzle.type === 0) { // Simon
        if (puzzle.phase === 'show') {
            puzzle.displayTimer--;
            if (puzzle.displayTimer <= 0) {
                if (puzzle.displayIdx < puzzle.sequence.length) {
                    const idx = puzzle.sequence[puzzle.displayIdx];
                    puzzle.lights[idx] = true;
                    playTone(200 + idx * 150, 0.3, 0.3);
                    puzzle.lightTimers[idx] = 30;
                    puzzle.displayIdx++;
                    puzzle.displayTimer = 40;
                } else {
                    puzzle.phase = 'input';
                }
            }
        } else if (puzzle.phase === 'input') {
            // wait for input
        } else if (puzzle.phase === 'success' || puzzle.phase === 'fail') {
            puzzle.displayTimer--;
            if (puzzle.displayTimer <= 0) {
                if (puzzle.phase === 'success') {
                    gates[puzzle.gateIndex].solved = true;
                    solvedGates++;
                    playSuccess();
                    if (solvedGates >= TOTAL_GATES) {
                        gameState = STATE.WIN;
                        timeEnd = Date.now();
                    } else {
                        puzzle.active = false;
                        gameState = STATE.PLAYING;
                    }
                } else {
                    startPuzzle(puzzle.gateIndex);
                }
            }
        }
    } else { // Match
        if (puzzle.phase === 'show') {
            puzzle.displayTimer--;
            if (puzzle.displayTimer <= 0) {
                puzzle.phase = 'input';
            }
        } else if (puzzle.phase === 'success' || puzzle.phase === 'fail') {
            puzzle.displayTimer--;
            if (puzzle.displayTimer <= 0) {
                if (puzzle.phase === 'success') {
                    gates[puzzle.gateIndex].solved = true;
                    solvedGates++;
                    playSuccess();
                    if (solvedGates >= TOTAL_GATES) {
                        gameState = STATE.WIN;
                        timeEnd = Date.now();
                    } else {
                        puzzle.active = false;
                        gameState = STATE.PLAYING;
                    }
                } else {
                    startPuzzle(puzzle.gateIndex);
                }
            }
        }
    }
    
    // Update light timers
    for (let i = 0; i < 4; i++) {
        if (puzzle.lightTimers[i] > 0) puzzle.lightTimers[i]--;
        if (puzzle.lightTimers[i] <= 0) puzzle.lights[i] = false;
    }
}

function puzzleInput(idx) {
    if (!puzzle.active || gameState !== STATE.PUZZLE) return;
    
    puzzle.lights[idx] = true;
    puzzle.lightTimers[idx] = 20;
    playTone(200 + idx * 150, 0.25, 0.3);
    
    if (puzzle.type === 0) { // Simon
        if (puzzle.phase !== 'input') return;
        puzzle.inputSeq.push(idx);
        
        const cur = puzzle.inputSeq.length - 1;
        if (idx !== puzzle.sequence[cur]) {
            puzzle.phase = 'fail';
            puzzle.displayTimer = 90;
            playFail();
            puzzle.attempt++;
            return;
        }
        if (puzzle.inputSeq.length === puzzle.sequence.length) {
            puzzle.phase = 'success';
            puzzle.displayTimer = 60;
        }
    } else { // Match
        if (puzzle.phase !== 'input') return;
        // Check if correct: the answer is always key matching targetValue % 4 + 1... 
        // Actually let's make it: press the button whose index+1 matches (targetValue % 4)
        const correct = idx === puzzle.targetValue % 4;
        if (correct) {
            puzzle.phase = 'success';
            puzzle.displayTimer = 60;
        } else {
            puzzle.phase = 'fail';
            puzzle.displayTimer = 90;
            playFail();
            puzzle.attempt++;
        }
    }
}

// Input
const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    
    if (gameState === STATE.START) {
        initAudio();
        startGame();
        return;
    }
    
    if (gameState === STATE.PUZZLE && puzzle.active) {
        if (puzzle.type === 0) {
            if (e.key === '1') puzzleInput(0);
            else if (e.key === '2') puzzleInput(1);
            else if (e.key === '3') puzzleInput(2);
            else if (e.key === '4') puzzleInput(3);
        } else {
            if (e.key >= '1' && e.key <= '9') {
                const val = parseInt(e.key);
                // Show a 4x grid of numbers, press the one matching target
                // Simplified: buttons 1-4 each show a number, press the one matching target
                puzzleInput(val % 4);
            }
        }
    }
    
    if (gameState === STATE.WIN && e.code === 'Space') {
        gameState = STATE.START;
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function startGame() {
    generateLevel();
    gameState = STATE.PLAYING;
    timeStart = Date.now();
}

// Update
let frameCount = 0;
function update() {
    frameCount++;
    
    if (gameState === STATE.PUZZLE) {
        updatePuzzle();
        return;
    }
    
    if (gameState !== STATE.PLAYING) return;
    
    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= MOVE_SPEED;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += MOVE_SPEED;
    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = JUMP_VEL;
        player.grounded = false;
    }
    
    player.vy += GRAVITY;
    player.y += player.vy;
    player.x = Math.max(player.radius, player.x);
    
    // Trail
    if (frameCount % 2 === 0) {
        player.trail.push({ x: player.x, y: player.y, life: 30 });
        if (player.trail.length > 20) player.trail.shift();
    }
    for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].life--;
        if (player.trail[i].life <= 0) player.trail.splice(i, 1);
    }
    
    // Collision with platforms
    player.grounded = false;
    for (const p of platforms) {
        if (player.x + player.radius > p.x && player.x - player.radius < p.x + p.w) {
            if (player.y + player.radius > p.y && player.y + player.radius < p.y + p.h && player.vy >= 0) {
                player.y = p.y - player.radius;
                player.vy = 0;
                player.grounded = true;
            }
        }
    }
    
    // Fall off screen - reset to nearest safe spot
    if (player.y > H + 100) {
        player.y = H - 200;
        player.vy = 0;
        // Find nearest platform
        let bestP = null, bestDist = Infinity;
        for (const p of platforms) {
            const d = Math.abs(p.x + p.w / 2 - player.x);
            if (d < bestDist) { bestDist = d; bestP = p; }
        }
        if (bestP) {
            player.x = bestP.x + bestP.w / 2;
            player.y = bestP.y - player.radius;
        }
    }
    
    // Check gate proximity
    for (let i = 0; i < gates.length; i++) {
        const g = gates[i];
        if (!g.solved) {
            const dx = player.x - g.x;
            const dy = player.y - g.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 60 && (keys['KeyE'] || keys['KeyF'])) {
                startPuzzle(i);
                break;
            }
        }
    }
    
    // Camera
    cameraX = player.x - W * 0.35;
    cameraX = Math.max(0, cameraX);
    
    // Particles
    if (frameCount % 5 === 0) {
        particles.push({
            x: player.x + (Math.random() - 0.5) * 20,
            y: player.y + (Math.random() - 0.5) * 20,
            vx: (Math.random() - 0.5) * 1,
            vy: -Math.random() * 2,
            life: 40,
            hue: 180 + Math.random() * 60
        });
    }
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Render
function drawBackground() {
    // Dark gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Parallax layer 1 - far crystals
    ctx.save();
    ctx.translate(-cameraX * 0.2, 0);
    for (let i = 0; i < 30; i++) {
        const x = i * 200 + ((i * 73) % 100);
        const y = H - 80 - ((i * 37) % (H - 150));
        ctx.fillStyle = `hsla(${(i * 40) % 360}, 50%, 20%, 0.3)`;
        ctx.beginPath();
        ctx.arc(x, y, 8 + (i % 5), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
    
    // Parallax layer 2 - mid structures
    ctx.save();
    ctx.translate(-cameraX * 0.5, 0);
    for (let i = 0; i < 20; i++) {
        const x = i * 300 + ((i * 137) % 150);
        const y = H - 40;
        ctx.fillStyle = `hsla(260, 30%, 15%, 0.5)`;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 20, y - 60 - (i % 3) * 40);
        ctx.lineTo(x + 40, y);
        ctx.fill();
    }
    ctx.restore();
}

function drawWorld() {
    ctx.save();
    ctx.translate(-cameraX, 0);
    
    // Platforms
    for (const p of platforms) {
        if (p.x + p.w < cameraX - 50 || p.x > cameraX + W + 50) continue;
        
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        grad.addColorStop(0, '#2a1a3e');
        grad.addColorStop(1, '#1a0a2e');
        ctx.fillStyle = grad;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        
        // Top edge glow
        ctx.strokeStyle = 'rgba(100, 200, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.w, p.y);
        ctx.stroke();
        
        // Crystal accents on edges
        if (p.w > 100) {
            for (let cx = p.x + 20; cx < p.x + p.w - 20; cx += 50) {
                const h = 3 + Math.sin(cx * 0.1 + frameCount * 0.02) * 2;
                ctx.fillStyle = `hsla(${(cx * 3) % 360}, 70%, 60%, 0.6)`;
                ctx.beginPath();
                ctx.moveTo(cx, p.y);
                ctx.lineTo(cx - h, p.y + h * 2);
                ctx.lineTo(cx + h, p.y + h * 2);
                ctx.fill();
            }
        }
    }
    
    // Decorative crystals
    for (const c of crystals) {
        if (c.x < cameraX - 50 || c.x > cameraX + W + 50) continue;
        const glow = 0.3 + Math.sin(frameCount * 0.03 + c.phase) * 0.2;
        ctx.fillStyle = `hsla(${c.hue}, 80%, 60%, ${glow})`;
        ctx.shadowColor = `hsl(${c.hue}, 80%, 60%)`;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y - c.size);
        ctx.lineTo(c.x - c.size * 0.5, c.y + c.size * 0.5);
        ctx.lineTo(c.x + c.size * 0.5, c.y + c.size * 0.5);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Gates
    for (let i = 0; i < gates.length; i++) {
        const g = gates[i];
        if (g.x < cameraX - 100 || g.x > cameraX + W + 100) continue;
        
        const pulse = Math.sin(frameCount * 0.05 + g.pulse) * 0.3 + 0.7;
        
        if (!g.solved) {
            // Glowing ring
            ctx.strokeStyle = `rgba(255, 100, 255, ${pulse})`;
            ctx.lineWidth = 4;
            ctx.shadowColor = 'rgba(255, 100, 255, 0.8)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Inner rune symbols
            for (let j = 0; j < 4; j++) {
                const angle = (j / 4) * Math.PI * 2 + frameCount * 0.01;
                const rx = g.x + Math.cos(angle) * g.radius * 0.5;
                const ry = g.y + Math.sin(angle) * g.radius * 0.5;
                ctx.fillStyle = `rgba(255, 200, 100, ${pulse * 0.8})`;
                ctx.beginPath();
                ctx.arc(rx, ry, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // "E" prompt when close
            const dx = player.x - g.x;
            const dy = player.y - g.y;
            if (Math.sqrt(dx * dx + dy * dy) < 60) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('[E] Solve', g.x, g.y - g.radius - 15);
            }
            
            ctx.shadowBlur = 0;
        } else {
            // Solved gate - dim green ring
            ctx.strokeStyle = 'rgba(100, 255, 150, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(g.x, g.y, g.radius * 0.8, 0, Math.PI * 2);
            ctx.stroke();
            
            // Checkmark
            ctx.strokeStyle = 'rgba(100, 255, 150, 0.7)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(g.x - 8, g.y);
            ctx.lineTo(g.x - 2, g.y + 8);
            ctx.lineTo(g.x + 10, g.y - 8);
            ctx.stroke();
        }
    }
    
    // Particles
    for (const p of particles) {
        const alpha = p.life / 40;
        ctx.fillStyle = `hsla(${p.hue}, 80%, 70%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2 + alpha * 3, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Player trail
    for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const alpha = t.life / 30;
        ctx.fillStyle = `rgba(100, 220, 255, ${alpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, player.radius * alpha * 0.7, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Player
    const pGlow = 0.7 + Math.sin(frameCount * 0.1) * 0.3;
    ctx.shadowColor = 'rgba(100, 220, 255, 0.9)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = `rgba(150, 240, 255, ${pGlow})`;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Inner core
    ctx.fillStyle = `rgba(255, 255, 255, ${pGlow * 0.8})`;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.restore();
}

function drawPuzzle() {
    if (!puzzle.active) return;
    
    // Dark overlay
    ctx.fillStyle = 'rgba(5, 5, 20, 0.85)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    
    if (puzzle.type === 0) {
        ctx.fillText('RUNE SEAL - Memory Sequence', cx, cy - 120);
        ctx.font = '16px monospace';
        ctx.fillStyle = '#aaa';
        
        if (puzzle.phase === 'show') {
            ctx.fillText('Watch the sequence...', cx, cy - 90);
        } else if (puzzle.phase === 'input') {
            ctx.fillText(`Repeat! (${puzzle.inputSeq.length}/${puzzle.sequence.length})`, cx, cy - 90);
        } else if (puzzle.phase === 'success') {
            ctx.fillStyle = '#6f6';
            ctx.font = '28px monospace';
            ctx.fillText('✓ SOLVED!', cx, cy - 90);
        } else if (puzzle.phase === 'fail') {
            ctx.fillStyle = '#f66';
            ctx.font = '28px monospace';
            ctx.fillText('✗ WRONG', cx, cy - 90);
        }
        
        // Simon buttons
        const btnSize = Math.min(100, W / 5);
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd93d', '#a78bfa'];
        const names = ['1', '2', '3', '4'];
        
        for (let i = 0; i < 4; i++) {
            const bx = cx + (i - 1.5) * (btnSize + 20);
            const by = cy;
            const lit = puzzle.lights[i];
            
            ctx.fillStyle = lit ? colors[i] : 'rgba(60, 60, 80, 0.8)';
            if (lit) {
                ctx.shadowColor = colors[i];
                ctx.shadowBlur = 25;
            }
            ctx.beginPath();
            ctx.roundRect(bx - btnSize / 2, by - btnSize / 2, btnSize, btnSize, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = lit ? '#fff' : 'rgba(255,255,255,0.5)';
            ctx.font = `bold ${btnSize * 0.4}px monospace`;
            ctx.fillText(names[i], bx, by + 10);
        }
    } else {
        // Match puzzle - show 4 numbers, find which matches target
        ctx.fillText('HARMONIC MATCH', cx, cy - 120);
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ffd93d';
        ctx.fillText(`Find the crystal showing: ${puzzle.targetValue}`, cx, cy - 90);
        
        const btnSize = Math.min(90, W / 5);
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd93d', '#a78bfa'];
        // Generate values for buttons (stable per puzzle)
        const seed = puzzle.gateIndex * 100 + frameCount * 0; 
        const vals = [
            (puzzle.targetValue % 4 === 0 ? puzzle.targetValue : (puzzle.targetValue + 1) % 10),
            (puzzle.targetValue + 3) % 10,
            (puzzle.targetValue + 7) % 10,
            (puzzle.targetValue + 5) % 10
        ];
        // Make sure one of them IS the target
        vals[puzzle.targetValue % 4] = puzzle.targetValue;
        
        for (let i = 0; i < 4; i++) {
            const bx = cx + (i - 1.5) * (btnSize + 20);
            const by = cy;
            const lit = puzzle.lights[i];
            
            ctx.fillStyle = lit ? colors[i] : 'rgba(60, 60, 80, 0.8)';
            if (lit) { ctx.shadowColor = colors[i]; ctx.shadowBlur = 25; }
            ctx.beginPath();
            ctx.roundRect(bx - btnSize / 2, by - btnSize / 2, btnSize, btnSize, 10);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = lit ? '#fff' : 'rgba(255,255,255,0.7)';
            ctx.font = `bold ${btnSize * 0.35}px monospace`;
            ctx.fillText(vals[i].toString(), bx, by + 12);
            
            // Key label below
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '12px monospace';
            ctx.fillText(`[${i + 1}]`, bx, by + btnSize / 2 + 18);
        }
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Animated background particles
    for (let i = 0; i < 50; i++) {
        const x = ((i * 137 + frameCount * 0.3) % W);
        const y = ((i * 251 + frameCount * 0.1) % H);
        ctx.fillStyle = `hsla(${(i * 60) % 360}, 70%, 60%, 0.3)`;
        ctx.beginPath();
        ctx.arc(x, y, 2 + (i % 4), 0, Math.PI * 2);
        ctx.fill();
    }
    
    const cx = W / 2;
    const cy = H / 2;
    
    // Title
    ctx.shadowColor = 'rgba(100, 220, 255, 0.8)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(60, W / 10)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('RUNE DEPTHS', cx, cy - 80);
    ctx.shadowBlur = 0;
    
    ctx.font = `${Math.min(18, W / 40)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('A Puzzle Side-Scroller', cx, cy - 45);
    
    ctx.font = `${Math.min(16, W / 45)}px monospace`;
    ctx.fillStyle = '#8ac';
    const lines = [
        '← → or A/D: Move',
        '↑ / W / Space: Jump',
        'E or F: Interact with Rune Gates',
        '',
        'Solve memory & matching puzzles to progress!',
        `${TOTAL_GATES} gates await...`
    ];
    lines.forEach((l, i) => {
        ctx.fillText(l, cx, cy + 10 + i * 28);
    });
    
    // Blinking prompt
    if (Math.floor(frameCount / 40) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(22, W / 35)}px monospace`;
        ctx.fillText('Press any key to begin', cx, cy + 180);
    }
}

function drawWinScreen() {
    ctx.fillStyle = 'rgba(5, 5, 20, 0.9)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    // Celebration particles
    for (let i = 0; i < 40; i++) {
        const angle = (i / 40) * Math.PI * 2 + frameCount * 0.01;
        const r = 100 + Math.sin(frameCount * 0.03 + i) * 50;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r * 0.6;
        ctx.fillStyle = `hsla(${(i * 20 + frameCount) % 360}, 80%, 60%, 0.7)`;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.shadowColor = 'rgba(100, 255, 150, 0.8)';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#6f6';
    ctx.font = `bold ${Math.min(48, W / 10)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('ALL RUNES SOLVED!', cx, cy - 40);
    ctx.shadowBlur = 0;
    
    const elapsed = ((timeEnd - timeStart) / 1000).toFixed(1);
    ctx.font = `${Math.min(20, W / 40)}px monospace`;
    ctx.fillStyle = '#fff';
    ctx.fillText(`Time: ${elapsed}s`, cx, cy + 20);
    
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(18, W / 45)}px monospace`;
    if (Math.floor(frameCount / 40) % 2 === 0) {
        ctx.fillText('Press SPACE to play again', cx, cy + 70);
    }
}

function drawHUD() {
    if (gameState !== STATE.PLAYING && gameState !== STATE.PUZZLE) return;
    
    ctx.fillStyle = 'rgba(10, 10, 30, 0.7)';
    ctx.fillRect(0, 0, W, 40);
    
    ctx.fillStyle = '#8ac';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Gates: ${solvedGates}/${TOTAL_GATES}`, 15, 26);
    
    // Progress bar
    const barW = 150;
    ctx.strokeStyle = 'rgba(100, 220, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(200, 14, barW, 16);
    ctx.fillStyle = 'rgba(100, 220, 255, 0.4)';
    ctx.fillRect(202, 16, (solvedGates / TOTAL_GATES) * (barW - 4), 12);
    
    // Player position indicator
    const progress = player.x / 6000;
    ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`Depth: ${Math.floor(progress * 100)}%`, W - 15, 26);
}

// Main loop
function render() {
    if (gameState === STATE.START) {
        drawStartScreen();
    } else if (gameState === STATE.WIN) {
        drawBackground();
        drawWorld();
        drawWinScreen();
    } else {
        drawBackground();
        drawWorld();
        drawHUD();
        if (gameState === STATE.PUZZLE && puzzle.active) {
            drawPuzzle();
        }
    }
    
    requestAnimationFrame(render);
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

generateLevel();
gameLoop();
</script>
</body>
</html>
