<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Clicker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0a0a; font-family: 'Courier New', monospace; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type, freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq || 200;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.1));
}
function sfxHit() { playSound('square', 150, 0.08, 0.2); }
function sfxKill() { playSound('sawtooth', 80, 0.3, 0.3); playSound('square', 60, 0.4, 0.2); }
function sfxHurt() { playSound('sawtooth', 100, 0.5, 0.4); }
function sfxWave() { playSound('triangle', 300, 0.3, 0.2); setTimeout(() => playSound('triangle', 400, 0.3, 0.2), 150); }
function sfxClick() { playSound('sine', 800, 0.05, 0.1); }

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('zombieClickerHigh') || '0'); } catch(e) {}
let health = 100;
let wave = 0;
let combo = 0;
let comboTimer = 0;
let shakeTime = 0;
let shakeMag = 0;
let lastKillTime = 0;

let zombies = [];
let particles = [];
let floatTexts = [];
let spawnTimer = 0;
let spawnInterval = 2000;
let waveTimer = 0;
let waveDuration = 15000;
let waveZombieCount = 0;
let bgPulses = [];

function startGame() {
    initAudio();
    state = 'playing';
    score = 0;
    health = 100;
    wave = 0;
    combo = 0;
    comboTimer = 0;
    zombies = [];
    particles = [];
    floatTexts = [];
    spawnTimer = 0;
    spawnInterval = 2000;
    waveTimer = 0;
    waveZombieCount = 0;
    nextWave();
}

function nextWave() {
    wave++;
    sfxWave();
    spawnInterval = Math.max(400, 2000 - (wave - 1) * 150);
    waveDuration = 10000 + wave * 2000;
    waveZombieCount = 0;
}

function spawnZombie() {
    const types = ['normal', 'fast', 'tank'];
    let type = 'normal';
    if (wave >= 2 && Math.random() < 0.3) type = 'fast';
    if (wave >= 3 && Math.random() < 0.25) type = 'tank';

    const baseSize = 40 + wave * 2;
    let z;
    if (type === 'normal') {
        z = { x: W + 30, y: Math.random() * (H - 100) + 50, hp: 3 + Math.floor(wave / 2), maxHp: 3 + Math.floor(wave / 2), speed: (1 + wave * 0.3) * (0.8 + Math.random() * 0.4), size: baseSize, type: 'normal', hitFlash: 0, wobble: Math.random() * Math.PI * 2 };
    } else if (type === 'fast') {
        z = { x: W + 30, y: Math.random() * (H - 100) + 50, hp: 2 + Math.floor(wave / 3), maxHp: 2 + Math.floor(wave / 3), speed: (2.5 + wave * 0.4) * (0.8 + Math.random() * 0.4), size: baseSize * 0.7, type: 'fast', hitFlash: 0, wobble: Math.random() * Math.PI * 2 };
    } else {
        z = { x: W + 30, y: Math.random() * (H - 100) + 50, hp: 6 + wave, maxHp: 6 + wave, speed: (0.5 + wave * 0.2) * (0.8 + Math.random() * 0.4), size: baseSize * 1.4, type: 'tank', hitFlash: 0, wobble: Math.random() * Math.PI * 2 };
    }
    zombies.push(z);
    waveZombieCount++;
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, life: 1, decay: 0.02 + Math.random() * 0.03, size: 2 + Math.random() * 4, color });
    }
}

function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 1, vy: -2 });
}

function hitZombie(z, idx) {
    z.hp--;
    z.hitFlash = 5;
    sfxHit();
    shakeTime = 3;
    shakeMag = 4;
    spawnParticles(z.x, z.y, '#4a7', 5);
    
    if (z.hp <= 0) {
        combo++;
        comboTimer = 120;
        const points = Math.floor((10 + wave * 5) * (1 + combo * 0.2));
        score += points;
        addFloatText(z.x, z.y - 20, '+' + points, '#ff0');
        if (combo > 1) addFloatText(z.x, z.y - 40, 'x' + combo + ' COMBO!', '#f80');
        sfxKill();
        spawnParticles(z.x, z.y, '#2a6', 15);
        spawnParticles(z.x, z.y, '#a22', 8);
        zombies.splice(idx, 1);
    }
}

function update(dt) {
    if (state !== 'playing') return;

    // Combo timer
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;

    // Wave timer
    waveTimer += dt;
    if (waveZombieCount >= 10 + wave * 3 || waveTimer > waveDuration) {
        nextWave();
    }

    // Spawn zombies
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnZombie();
    }

    // Update zombies
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        z.x -= z.speed * dt / 16;
        z.wobble += dt * 0.005;
        if (z.hitFlash > 0) z.hitFlash--;

        if (z.x < -z.size) {
            health -= z.type === 'tank' ? 15 : z.type === 'fast' ? 8 : 10;
            sfxHurt();
            shakeTime = 10;
            shakeMag = 8;
            addFloatText(30, z.y, '-HP', '#f00');
            zombies.splice(i, 1);
            if (health <= 0) {
                health = 0;
                state = 'gameover';
                try {
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('zombieClickerHigh', String(highScore));
                    }
                } catch(e) {}
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update float texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const f = floatTexts[i];
        f.y += f.vy;
        f.life -= 0.02;
        if (f.life <= 0) floatTexts.splice(i, 1);
    }

    // Shake
    if (shakeTime > 0) shakeTime--;
}

function drawZombie(z) {
    const s = z.size;
    const bob = Math.sin(z.wobble) * 4;
    const x = z.x;
    const y = z.y + bob;
    
    ctx.save();
    ctx.translate(x, y);

    // Body
    const bodyColor = z.type === 'tank' ? '#2a4a2a' : z.type === 'fast' ? '#5a7a3a' : '#3a6a3a';
    if (z.hitFlash > 0) {
        ctx.fillStyle = '#fff';
    } else {
        ctx.fillStyle = bodyColor;
    }
    
    // Legs
    const legSwing = Math.sin(z.wobble * 2) * 5;
    ctx.fillRect(-s * 0.3 + legSwing, s * 0.4, s * 0.2, s * 0.4);
    ctx.fillRect(s * 0.1 - legSwing, s * 0.4, s * 0.2, s * 0.4);

    // Torso
    ctx.beginPath();
    ctx.roundRect(-s * 0.35, -s * 0.2, s * 0.7, s * 0.6, 4);
    ctx.fill();

    // Arms (reaching forward)
    const armAngle = Math.sin(z.wobble * 1.5) * 0.3;
    ctx.save();
    ctx.rotate(armAngle);
    ctx.fillRect(-s * 0.55, -s * 0.1, s * 0.3, s * 0.12);
    ctx.restore();
    ctx.save();
    ctx.rotate(-armAngle * 0.7);
    ctx.fillRect(-s * 0.6, s * 0.15, s * 0.35, s * 0.12);
    ctx.restore();

    // Head
    const headColor = z.hitFlash > 0 ? '#fff' : (z.type === 'tank' ? '#4a6a3a' : '#5a8a4a');
    ctx.fillStyle = headColor;
    ctx.beginPath();
    ctx.arc(-s * 0.1, -s * 0.45, s * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    if (z.hitFlash <= 0) {
        ctx.fillStyle = z.type === 'fast' ? '#ff0' : '#f00';
        ctx.beginPath();
        ctx.arc(-s * 0.2, -s * 0.5, s * 0.06, 0, Math.PI * 2);
        ctx.arc(-s * 0.0, -s * 0.5, s * 0.06, 0, Math.PI * 2);
        ctx.fill();
    }

    // Mouth
    if (z.hitFlash <= 0) {
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-s * 0.1, -s * 0.35, s * 0.1, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }

    // HP bar
    if (z.hp < z.maxHp) {
        const bw = s * 0.8;
        ctx.fillStyle = '#300';
        ctx.fillRect(-bw / 2, -s * 0.75, bw, 5);
        ctx.fillStyle = z.type === 'tank' ? '#f44' : '#0f0';
        ctx.fillRect(-bw / 2, -s * 0.75, bw * (z.hp / z.maxHp), 5);
    }

    ctx.restore();
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeMag;
        const sy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(sx, sy);
    }

    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a15');
    grad.addColorStop(1, '#1a0a0a');
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Ground
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-20, H - 30, W + 40, 50);
    ctx.fillStyle = '#2a2a2a';
    for (let i = 0; i < W / 40; i++) {
        ctx.fillRect(i * 40, H - 30, 38, 2);
    }

    // Danger zone (left edge)
    const dangerGrad = ctx.createLinearGradient(0, 0, 60, 0);
    dangerGrad.addColorStop(0, 'rgba(255,0,0,0.15)');
    dangerGrad.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = dangerGrad;
    ctx.fillRect(0, 0, 60, H);

    if (state === 'playing' || state === 'gameover') {
        // Draw zombies
        for (const z of zombies) drawZombie(z);

        // Particles
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        // Float texts
        for (const f of floatTexts) {
            ctx.globalAlpha = f.life;
            ctx.fillStyle = f.color;
            ctx.font = 'bold 18px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1;

        // HUD
        // Health bar
        ctx.fillStyle = '#300';
        ctx.fillRect(20, 20, 200, 24);
        const hColor = health > 50 ? '#0c0' : health > 25 ? '#ff0' : '#f00';
        ctx.fillStyle = hColor;
        ctx.fillRect(20, 20, 200 * (health / 100), 24);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, 200, 24);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText('HP: ' + health + '%', 80, 36);

        // Score
        ctx.fillStyle = '#ff0';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'right';
        ctx.fillText('SCORE: ' + score, W - 20, 38);

        // Wave
        ctx.fillStyle = '#fff';
        ctx.font = '16px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('WAVE ' + wave, W / 2, 35);

        // Combo
        if (combo > 1) {
            ctx.fillStyle = '#f80';
            ctx.font = 'bold 20px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('COMBO x' + combo, W / 2, 65);
        }
    }

    // Start screen
    if (state === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#4a7a3a';
        ctx.font = 'bold 60px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('ZOMBIE', W / 2, H / 2 - 80);
        ctx.fillStyle = '#f44';
        ctx.fillText('CLICKER', W / 2, H / 2 - 20);

        ctx.fillStyle = '#aaa';
        ctx.font = '18px Courier New';
        ctx.fillText('Click zombies to kill them before they reach you!', W / 2, H / 2 + 40);
        ctx.fillText('Each zombie takes multiple hits.', W / 2, H / 2 + 70);
        ctx.fillText('Build combos for bonus points!', W / 2, H / 2 + 100);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Courier New';
        const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
        ctx.globalAlpha = pulse;
        ctx.fillText('[ CLICK TO START ]', W / 2, H / 2 + 170);
        ctx.globalAlpha = 1;

        if (highScore > 0) {
            ctx.fillStyle = '#ff0';
            ctx.font = '16px Courier New';
            ctx.fillText('HIGH SCORE: ' + highScore, W / 2, H / 2 + 220);
        }
    }

    // Game over screen
    if (state === 'gameover') {
        ctx.fillStyle = 'rgba(20,0,0,0.85)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#f44';
        ctx.font = 'bold 50px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('YOU GOT BITTEN', W / 2, H / 2 - 60);

        ctx.fillStyle = '#fff';
        ctx.font = '28px Courier New';
        ctx.fillText('SCORE: ' + score, W / 2, H / 2);
        ctx.fillText('WAVE: ' + wave, W / 2, H / 2 + 40);

        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 20px Courier New';
            ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 85);
        } else {
            ctx.fillStyle = '#aaa';
            ctx.font = '16px Courier New';
            ctx.fillText('HIGH SCORE: ' + highScore, W / 2, H / 2 + 85);
        }

        const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Courier New';
        ctx.fillText('[ CLICK TO RESTART ]', W / 2, H / 2 + 150);
        ctx.globalAlpha = 1;
    }

    ctx.restore();
}

let lastTime = 0;
function loop(time) {
    const dt = Math.min(time - lastTime, 50);
    lastTime = time;
    
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Input
canvas.addEventListener('click', function(e) {
    initAudio();
    if (state === 'start') {
        sfxClick();
        startGame();
        return;
    }
    if (state === 'gameover') {
        sfxClick();
        startGame();
        return;
    }
    if (state === 'playing') {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // Find closest zombie to click
        let bestIdx = -1;
        let bestDist = Infinity;
        for (let i = 0; i < zombies.length; i++) {
            const z = zombies[i];
            const dx = mx - z.x;
            const dy = my - z.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < z.size * 1.2 && dist < bestDist) {
                bestDist = dist;
                bestIdx = i;
            }
        }

        if (bestIdx >= 0) {
            hitZombie(zombies[bestIdx], bestIdx);
        } else {
            // Miss - small penalty to combo
            spawnParticles(mx, my, '#555', 3);
        }
    }
});

// Also support keyboard restart
window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter') {
        initAudio();
        if (state !== 'playing') startGame();
    }
});
})();
</script>
</body>
</html>
