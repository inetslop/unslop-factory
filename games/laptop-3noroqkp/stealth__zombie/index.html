<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Stealth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game state
let gameState = 'start'; // start, playing, won, lost
let player, zombies, walls, exit, particles, time = 0;
const keys = {};

window.addEventListener('keydown', e => { keys[e.code] = true; if (gameState === 'start') startGame(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(freq, duration, type = 'sine', volume = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playAlertSound() { playSound(200, 0.3, 'sawtooth', 0.15); }
function playCaughtSound() { playSound(80, 0.8, 'sawtooth', 0.3); }
function playWinSound() { playSound(440, 0.2, 'sine', 0.2); setTimeout(() => playSound(660, 0.3, 'sine', 0.2), 150); }

// Level design
function createLevel() {
    const scale = Math.min(W / 900, H / 700);
    const ox = (W - 900 * scale) / 2;
    const oy = (H - 700 * scale) / 2;

    walls = [
        // Outer boundaries
        { x: ox, y: oy, w: 900 * scale, h: 20 },
        { x: ox, y: oy + 700 * scale - 20, w: 900 * scale, h: 20 },
        { x: ox, y: oy, w: 20, h: 700 * scale },
        { x: ox + 900 * scale - 20, y: oy, w: 20, h: 700 * scale },
        // Inner walls
        { x: ox + 200 * scale, y: oy + 150 * scale, w: 20, h: 200 * scale },
        { x: ox + 400 * scale, y: oy + 80 * scale, w: 200 * scale, h: 20 },
        { x: ox + 600 * scale, y: oy + 150 * scale, w: 20, h: 250 * scale },
        { x: ox + 150 * scale, y: oy + 400 * scale, w: 250 * scale, h: 20 },
        { x: ox + 500 * scale, y: oy + 350 * scale, w: 20, h: 180 * scale },
        { x: ox + 700 * scale, y: oy + 450 * scale, w: 20, h: 200 * scale },
        { x: ox + 300 * scale, y: oy + 520 * scale, w: 180 * scale, h: 20 },
    ];

    player = {
        x: ox + 60, y: oy + 620, r: 12 * scale, speed: 3.5 * scale, crouchSpeed: 1.5 * scale,
        crouching: false, angle: 0
    };

    exit = { x: ox + 820 * scale, y: oy + 50 * scale, r: 30 * scale };

    zombies = [
        { x: ox + 350 * scale, y: oy + 250 * scale, r: 14 * scale, angle: 0, speed: 1.2 * scale,
          state: 'patrol', patrolPoints: [{x: ox+350*scale, y:oy+250*scale}, {x:ox+350*scale, y:oy+100*scale}],
          visionRange: 180 * scale, visionAngle: Math.PI / 3, alertTimer: 0, chaseSpeed: 2.2 * scale },
        { x: ox + 650 * scale, y: oy + 300 * scale, r: 14 * scale, angle: Math.PI, speed: 1.0 * scale,
          state: 'patrol', patrolPoints: [{x: ox+650*scale, y:oy+300*scale}, {x:ox+650*scale, y:oy+450*scale}],
          visionRange: 200 * scale, visionAngle: Math.PI / 3.5, alertTimer: 0, chaseSpeed: 2.5 * scale },
        { x: ox + 200 * scale, y: oy + 550 * scale, r: 14 * scale, angle: -Math.PI/2, speed: 1.3 * scale,
          state: 'patrol', patrolPoints: [{x:ox+200*scale,y:oy+550*scale}, {x:ox+500*scale,y:oy+550*scale}],
          visionRange: 160 * scale, visionAngle: Math.PI / 3, alertTimer: 0, chaseSpeed: 2.0 * scale },
        { x: ox + 750 * scale, y: oy + 600 * scale, r: 14 * scale, angle: -Math.PI/4, speed: 1.1 * scale,
          state: 'patrol', patrolPoints: [{x:ox+750*scale,y:oy+600*scale}, {x:ox+750*scale,y:oy+450*scale}],
          visionRange: 170 * scale, visionAngle: Math.PI / 3, alertTimer: 0, chaseSpeed: 2.3 * scale },
        { x: ox + 550 * scale, y: oy + 600 * scale, r: 14 * scale, angle: Math.PI/2, speed: 1.4 * scale,
          state: 'patrol', patrolPoints: [{x:ox+550*scale,y:oy+600*scale}, {x:ox+350*scale,y:oy+600*scale}],
          visionRange: 150 * scale, visionAngle: Math.PI / 3.5, alertTimer: 0, chaseSpeed: 2.6 * scale },
    ];

    particles = [];
}

function startGame() {
    initAudio();
    createLevel();
    gameState = 'playing';
}

// Line of sight check
function hasLineOfSight(x1, y1, x2, y2) {
    const steps = 30;
    for (let i = 1; i < steps; i++) {
        const t = i / steps;
        const px = x1 + (x2 - x1) * t;
        const py = y1 + (y2 - y1) * t;
        for (const w of walls) {
            if (px > w.x && px < w.x + w.w && py > w.y && py < w.y + w.h) return false;
        }
    }
    return true;
}

function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
    const dx = cx - Math.max(rx, Math.min(cx, rx + rw));
    const dy = cy - Math.max(ry, Math.min(cy, ry + rh));
    return dx * dx + dy * dy < r * r;
}

function moveWithCollision(entity) {
    const origX = entity.x, origY = entity.y;
    entity.x += entity.vx || 0;
    for (const w of walls) {
        if (circleRectCollide(entity.x, entity.y, entity.r, w.x, w.y, w.w, w.h)) { entity.x -= entity.vx || 0; break; }
    }
    entity.y += entity.vy || 0;
    for (const w of walls) {
        if (circleRectCollide(entity.x, entity.y, entity.r, w.x, w.y, w.w, w.h)) { entity.y -= entity.vy || 0; break; }
    }
}

function update() {
    if (gameState !== 'playing') return;
    time++;

    // Player movement
    player.crouching = !!keys['ShiftLeft'] || !!keys['ShiftRight'];
    const spd = player.crouching ? player.crouchSpeed : player.speed;
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy = -1;
    if (keys['KeyS'] || keys['ArrowDown']) dy = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx = -1;
    if (keys['KeyD'] || keys['ArrowRight']) dx = 1;
    if (dx || dy) {
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len; dy /= len;
        player.angle = Math.atan2(dy, dx);
        player.vx = dx * spd;
        player.vy = dy * spd;
    } else {
        player.vx = 0; player.vy = 0;
    }
    moveWithCollision(player);

    // Check win
    const exd = player.x - exit.x, eyd = player.y - exit.y;
    if (Math.sqrt(exd * exd + eyd * eyd) < exit.r + player.r) {
        gameState = 'won';
        playWinSound();
    }

    // Zombie AI
    for (const z of zombies) {
        const pdx = player.x - z.x;
        const pdy = player.y - z.y;
        const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
        const detectionRange = player.crouching ? z.visionRange * 0.5 : z.visionRange;

        let canSee = false;
        if (pdist < detectionRange) {
            const angleToPlayer = Math.atan2(pdy, pdx);
            let diff = angleToPlayer - z.angle;
            while (diff > Math.PI) diff -= 2 * Math.PI;
            while (diff < -Math.PI) diff += 2 * Math.PI;
            if (Math.abs(diff) < z.visionAngle / 2) {
                canSee = hasLineOfSight(z.x, z.y, player.x, player.y);
            }
        }

        if (canSee && z.state !== 'chase') {
            z.state = 'alert';
            z.alertTimer = 60;
            playAlertSound();
        }

        if (z.state === 'patrol') {
            const target = z.patrolPoints[z.patrolPoints.length - 1];
            const tx = target.x - z.x, ty = target.y - z.y;
            const td = Math.sqrt(tx * tx + ty * ty);
            if (td < 5) {
                // Switch to other point
                const idx = z.patrolPoints.indexOf(target);
                target2: {
                    let nextIdx = (idx + 1) % z.patrolPoints.length;
                    z.angle = Math.atan2(z.patrolPoints[nextIdx].y - z.x, z.patrolPoints[nextIdx].x - z.y);
                    break target2;
                }
            } else {
                z.angle = Math.atan2(ty, tx);
                z.x += Math.cos(z.angle) * z.speed;
                z.y += Math.sin(z.angle) * z.speed;
                moveWithCollision(z);
            }
        } else if (z.state === 'alert') {
            z.alertTimer--;
            z.angle = Math.atan2(pdy, pdx);
            if (z.alertTimer <= 0 || !canSee) z.state = 'chase';
        } else if (z.state === 'chase') {
            // Chase player
            const tx = player.x - z.x, ty = player.y - z.y;
            const td = Math.sqrt(tx * tx + ty * ty);
            if (td > 1) {
                z.angle = Math.atan2(ty, tx);
                z.x += Math.cos(z.angle) * z.chaseSpeed;
                z.y += Math.sin(z.angle) * z.chaseSpeed;
                moveWithCollision(z);
            }

            // Check catch
            if (pdist < z.r + player.r + 2) {
                gameState = 'lost';
                playCaughtSound();
                for (let i = 0; i < 20; i++) {
                    const a = Math.random() * Math.PI * 2;
                    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 60, color: '#4a0' });
                }
            }

            // Lose sight -> return to patrol
            if (!canSee && pdist > detectionRange * 1.2) {
                z.state = 'patrol';
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function render() {
    ctx.fillStyle = '#0a0e12';
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'start') {
        renderStartScreen();
        return;
    }

    // Draw floor
    const scale = Math.min(W / 900, H / 700);
    const ox = (W - 900 * scale) / 2;
    const oy = (H - 700 * scale) / 2;

    ctx.fillStyle = '#1a1f24';
    ctx.fillRect(ox, oy, 900 * scale, 700 * scale);

    // Floor grid
    ctx.strokeStyle = '#222830';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 900; i += 60) {
        ctx.beginPath(); ctx.moveTo(ox + i * scale, oy); ctx.lineTo(ox + i * scale, oy + 700 * scale); ctx.stroke();
    }
    for (let i = 0; i <= 700; i += 60) {
        ctx.beginPath(); ctx.moveTo(ox, oy + i * scale); ctx.lineTo(ox + 900 * scale, oy + i * scale); ctx.stroke();
    }

    // Walls
    for (const w of walls) {
        ctx.fillStyle = '#3a4550';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#2a3540';
        ctx.strokeRect(w.x, w.y, w.w, w.h);
    }

    // Exit zone
    const pulse = Math.sin(time * 0.05) * 0.3 + 0.7;
    ctx.beginPath();
    ctx.arc(exit.x, exit.y, exit.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(80, 255, 120, ${pulse * 0.3})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(80, 255, 120, ${pulse})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#4f8';
    ctx.font = `${14 * scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', exit.x, exit.y + 5);

    // Zombie vision cones
    for (const z of zombies) {
        const range = player.crouching ? z.visionRange * 0.5 : z.visionRange;
        const alpha = z.state === 'chase' ? 0.25 : 0.12;
        ctx.beginPath();
        ctx.moveTo(z.x, z.y);
        ctx.arc(z.x, z.y, range, z.angle - z.visionAngle / 2, z.angle + z.visionAngle / 2);
        ctx.closePath();
        ctx.fillStyle = z.state === 'chase' ? `rgba(255, 60, 60, ${alpha})` : `rgba(100, 255, 100, ${alpha})`;
        ctx.fill();
    }

    // Zombies
    for (const z of zombies) {
        ctx.beginPath();
        ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2);
        ctx.fillStyle = z.state === 'chase' ? '#c44' : z.state === 'alert' ? '#da4' : '#5a8';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Eyes / direction
        const ex = z.x + Math.cos(z.angle) * z.r * 0.6;
        const ey = z.y + Math.sin(z.angle) * z.r * 0.6;
        ctx.beginPath();
        ctx.arc(ex, ey, 3, 0, Math.PI * 2);
        ctx.fillStyle = z.state === 'chase' ? '#f44' : '#ff8';
        ctx.fill();

        // Alert indicator
        if (z.state === 'alert') {
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('!', z.x, z.y - z.r - 8);
        } else if (z.state === 'chase') {
            ctx.fillStyle = '#f44';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('!!', z.x, z.y - z.r - 8);
        }
    }

    // Player
    if (gameState === 'playing') {
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
        ctx.fillStyle = player.crouching ? '#4ac' : '#8df';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Direction
        const px = player.x + Math.cos(player.angle) * player.r * 0.6;
        const py = player.y + Math.sin(player.angle) * player.r * 0.6;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();

        // Crouch indicator
        if (player.crouching) {
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    // Particles
    for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 60;
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Darkness overlay with light around player
    if (gameState === 'playing') {
        const grad = ctx.createRadialGradient(player.x, player.y, 50 * scale, player.x, player.y, 250 * scale);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.85)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Extra darkness at edges
        const edgeGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
        edgeGrad.addColorStop(0, 'rgba(0,0,0,0)');
        edgeGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = edgeGrad;
        ctx.fillRect(0, 0, W, H);
    }

    // HUD
    if (gameState === 'playing') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, 10, 220, 80);
        ctx.strokeStyle = '#456';
        ctx.strokeRect(10, 10, 220, 80);
        ctx.fillStyle = '#cde';
        ctx.font = '13px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('ZOMBIE STEALTH', 20, 30);
        ctx.fillText(`Mode: ${player.crouching ? '[CROUCHED]' : '[STANDING]'}`, 20, 50);
        const anyChase = zombies.some(z => z.state === 'chase');
        ctx.fillStyle = anyChase ? '#f44' : '#4f8';
        ctx.fillText(anyChase ? '!! DETECTED !!' : 'Stealth OK', 20, 75);

        // Controls hint
        ctx.fillStyle = 'rgba(200,220,240,0.5)';
        ctx.font = '11px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('WASD: Move | SHIFT: Crouch | Reach the EXIT', W - 15, H - 15);
    }

    // End screens
    if (gameState === 'won' || gameState === 'lost') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        if (gameState === 'won') {
            ctx.fillStyle = '#4f8';
            ctx.font = 'bold 48px monospace';
            ctx.fillText('ESCAPED!', W/2, H/2 - 30);
        } else {
            ctx.fillStyle = '#f44';
            ctx.font = 'bold 48px monospace';
            ctx.fillText('CAUGHT!', W/2, H/2 - 30);
        }
        ctx.fillStyle = '#aac';
        ctx.font = '20px monospace';
        ctx.fillText('Press any key to restart', W/2, H/2 + 30);

        if (gameState === 'won' || gameState === 'lost') {
            // Allow restart on keypress
            for (const k in keys) {
                if (keys[k]) { startGame(); break; }
            }
        }
    }
}

function renderStartScreen() {
    ctx.fillStyle = '#0a0e12';
    ctx.fillRect(0, 0, W, H);

    // Title
    const pulse = Math.sin(Date.now() * 0.003) * 5;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4f8';
    ctx.font = `bold ${Math.min(60, W/12)}px monospace`;
    ctx.fillText('ZOMBIE STEALTH', W/2, H/3 + pulse);

    ctx.fillStyle = '#7a9';
    ctx.font = `${Math.min(18, W/40)}px monospace`;
    ctx.fillText('Navigate the dark facility and reach the EXIT.', W/2, H/3 + 50);
    ctx.fillText('Avoid zombie vision cones. Crouch to be harder to spot.', W/2, H/3 + 80);

    ctx.fillStyle = '#abc';
    ctx.font = `${Math.min(16, W/45)}px monospace`;
    ctx.fillText('WASD / Arrow Keys — Move', W/2, H/2 + 20);
    ctx.fillText('SHIFT — Crouch (slower, less visible)', W/2, H/2 + 45);

    ctx.fillStyle = `rgba(100, 255, 150, ${Math.sin(Date.now()*0.005)*0.3+0.7})`;
    ctx.font = `bold ${Math.min(22, W/30)}px monospace`;
    ctx.fillText('[ PRESS ANY KEY TO START ]', W/2, H * 0.75);

    // Decorative zombies
    const t = Date.now() * 0.001;
    for (let i = 0; i < 5; i++) {
        const zx = W/2 + Math.cos(t + i * 1.3) * (80 + i * 20);
        const zy = H * 0.65 + Math.sin(t * 0.7 + i) * 20;
        ctx.beginPath();
        ctx.arc(zx, zy, 8, 0, Math.PI*2);
        ctx.fillStyle = '#3a5';
        ctx.fill();
    }
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

createLevel();
gameLoop();
</script>
</body>
</html>
