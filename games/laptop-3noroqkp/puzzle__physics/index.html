<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function playBounce() { playSound(200 + Math.random()*100, 0.1, 'sine', 0.15); }
function playLock() { playSound(600, 0.3, 'triangle', 0.3); setTimeout(()=>playSound(800,0.3,'triangle',0.25),80); }
function playWin() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playSound(f,0.4,'triangle',0.3),i*100)); }

// Game State
const GRAVITY = 0.4;
const RESTITUTION = 0.75;
const FRICTION = 0.998;
const DRAG_POWER = 0.15;
const LOCK_TIME = 30;

let state = 'start'; // start, playing, won, levelComplete
let currentLevel = 0;
let balls = [];
let targets = [];
let obstacles = [];
let dragBall = null;
let dragStart = null;
let mousePos = null;
let lockCounters = {};
let particles = [];
let time = 0;

const COLORS = [
    { main: '#ff6b6b', light: '#ffa3a3' },
    { main: '#4ecdc4', light: '#7eeee9' },
    { main: '#ffd93d', light: '#ffe680' },
    { main: '#a855f7', light: '#c084fc' },
    { main: '#fb923c', light: '#fdc28e' }
];

function createLevels() {
    const levels = [];
    
    // Level 1: Simple - one ball, one target
    levels.push({
        balls: [{ x: 0.3, y: 0.5, r: 0.03, color: 0 }],
        targets: [{ x: 0.7, y: 0.8, w: 0.12, h: 0.08, color: 0 }],
        obstacles: []
    });
    
    // Level 2: Two balls, two targets
    levels.push({
        balls: [
            { x: 0.25, y: 0.4, r: 0.03, color: 0 },
            { x: 0.75, y: 0.4, r: 0.03, color: 1 }
        ],
        targets: [
            { x: 0.2, y: 0.82, w: 0.12, h: 0.08, color: 0 },
            { x: 0.7, y: 0.82, w: 0.12, h: 0.08, color: 1 }
        ],
        obstacles: []
    });
    
    // Level 3: Obstacles
    levels.push({
        balls: [
            { x: 0.2, y: 0.3, r: 0.03, color: 0 },
            { x: 0.8, y: 0.3, r: 0.03, color: 1 }
        ],
        targets: [
            { x: 0.7, y: 0.82, w: 0.12, h: 0.08, color: 0 },
            { x: 0.2, y: 0.82, w: 0.12, h: 0.08, color: 1 }
        ],
        obstacles: [
            { x: 0.4, y: 0.5, w: 0.2, h: 0.06 }
        ]
    });
    
    // Level 4: Three balls
    levels.push({
        balls: [
            { x: 0.2, y: 0.3, r: 0.028, color: 0 },
            { x: 0.5, y: 0.2, r: 0.028, color: 1 },
            { x: 0.8, y: 0.3, r: 0.028, color: 2 }
        ],
        targets: [
            { x: 0.15, y: 0.82, w: 0.11, h: 0.07, color: 0 },
            { x: 0.45, y: 0.82, w: 0.11, h: 0.07, color: 1 },
            { x: 0.75, y: 0.82, w: 0.11, h: 0.07, color: 2 }
        ],
        obstacles: [
            { x: 0.3, y: 0.6, w: 0.12, h: 0.05 },
            { x: 0.65, y: 0.6, w: 0.12, h: 0.05 }
        ]
    });
    
    // Level 5: Complex
    levels.push({
        balls: [
            { x: 0.15, y: 0.25, r: 0.026, color: 0 },
            { x: 0.5, y: 0.15, r: 0.026, color: 1 },
            { x: 0.85, y: 0.25, r: 0.026, color: 2 }
        ],
        targets: [
            { x: 0.7, y: 0.82, w: 0.1, h: 0.07, color: 0 },
            { x: 0.45, y: 0.82, w: 0.1, h: 0.07, color: 1 },
            { x: 0.2, y: 0.82, w: 0.1, h: 0.07, color: 2 }
        ],
        obstacles: [
            { x: 0.35, y: 0.45, w: 0.3, h: 0.05 },
            { x: 0.2, y: 0.65, w: 0.15, h: 0.05 },
            { x: 0.65, y: 0.65, w: 0.15, h: 0.05 }
        ]
    });
    
    // Level 6: Final challenge
    levels.push({
        balls: [
            { x: 0.15, y: 0.2, r: 0.024, color: 0 },
            { x: 0.35, y: 0.3, r: 0.024, color: 1 },
            { x: 0.65, y: 0.3, r: 0.024, color: 2 },
            { x: 0.85, y: 0.2, r: 0.024, color: 3 }
        ],
        targets: [
            { x: 0.12, y: 0.82, w: 0.1, h: 0.065, color: 0 },
            { x: 0.37, y: 0.82, w: 0.1, h: 0.065, color: 1 },
            { x: 0.62, y: 0.82, w: 0.1, h: 0.065, color: 2 },
            { x: 0.87, y: 0.82, w: 0.1, h: 0.065, color: 3 }
        ],
        obstacles: [
            { x: 0.4, y: 0.5, w: 0.2, h: 0.04 },
            { x: 0.15, y: 0.6, w: 0.1, h: 0.04 },
            { x: 0.75, y: 0.6, w: 0.1, h: 0.04 }
        ]
    });
    
    return levels;
}

const LEVELS = createLevels();

function loadLevel(idx) {
    const lv = LEVELS[idx];
    balls = lv.balls.map((b, i) => ({
        x: b.x * W,
        y: b.y * H,
        r: b.r * Math.min(W, H),
        vx: 0, vy: 0,
        color: b.color,
        locked: false,
        id: i
    }));
    targets = lv.targets.map(t => ({
        x: (t.x - t.w/2) * W,
        y: (t.y - t.h/2) * H,
        w: t.w * W,
        h: t.h * H,
        cx: t.x * W,
        cy: t.y * H,
        color: t.color,
        filled: false
    }));
    obstacles = lv.obstacles.map(o => ({
        x: (o.x - o.w/2) * W,
        y: (o.y - o.h/2) * H,
        w: o.w * W,
        h: o.h * H
    }));
    lockCounters = {};
    particles = [];
    state = 'playing';
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 40 + Math.random() * 20,
            maxLife: 60,
            color,
            r: 2 + Math.random() * 3
        });
    }
}

function updatePhysics() {
    if (state !== 'playing') return;
    
    for (let ball of balls) {
        if (ball.locked) continue;
        
        // Gravity
        ball.vy += GRAVITY;
        
        // Friction
        ball.vx *= FRICTION;
        ball.vy *= FRICTION;
        
        // Move
        ball.x += ball.vx;
        ball.y += ball.vy;
        
        // Wall collisions
        if (ball.x - ball.r < 0) {
            ball.x = ball.r;
            ball.vx = Math.abs(ball.vx) * RESTITUTION;
            if (Math.abs(ball.vx) > 1) playBounce();
        }
        if (ball.x + ball.r > W) {
            ball.x = W - ball.r;
            ball.vx = -Math.abs(ball.vx) * RESTITUTION;
            if (Math.abs(ball.vx) > 1) playBounce();
        }
        if (ball.y - ball.r < 0) {
            ball.y = ball.r;
            ball.vy = Math.abs(ball.vy) * RESTITUTION;
            if (Math.abs(ball.vy) > 1) playBounce();
        }
        if (ball.y + ball.r > H) {
            ball.y = H - ball.r;
            ball.vy = -Math.abs(ball.vy) * RESTITUTION;
            if (Math.abs(ball.vy) > 1) playBounce();
        }
        
        // Obstacle collisions
        for (let obs of obstacles) {
            const closestX = Math.max(obs.x, Math.min(ball.x, obs.x + obs.w));
            const closestY = Math.max(obs.y, Math.min(ball.y, obs.y + obs.h));
            const dx = ball.x - closestX;
            const dy = ball.y - closestY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < ball.r) {
                const nx = dx / (dist || 1);
                const ny = dy / (dist || 1);
                const overlap = ball.r - dist;
                ball.x += nx * overlap;
                ball.y += ny * overlap;
                const dot = ball.vx * nx + ball.vy * ny;
                ball.vx -= 2 * dot * nx * RESTITUTION;
                ball.vy -= 2 * dot * ny * RESTITUTION;
                if (Math.abs(dot) > 1.5) playBounce();
            }
        }
        
        // Target check
        for (let i = 0; i < targets.length; i++) {
            const t = targets[i];
            if (t.filled) continue;
            if (ball.color === t.color) {
                const inTarget = ball.x > t.cx - t.w*0.35 && ball.x < t.cx + t.w*0.35 &&
                                ball.y > t.cy - t.h*0.6 && ball.y < t.cy + t.h*0.6;
                if (inTarget) {
                    const key = ball.id;
                    lockCounters[key] = (lockCounters[key] || 0) + 1;
                    if (lockCounters[key] >= LOCK_TIME) {
                        ball.locked = true;
                        ball.vx = 0;
                        ball.vy = 0;
                        t.filled = true;
                        spawnParticles(ball.x, ball.y, COLORS[ball.color].main, 15);
                        playLock();
                    }
                } else {
                    lockCounters[ball.id] = 0;
                }
            }
        }
    }
    
    // Ball-ball collisions
    for (let i = 0; i < balls.length; i++) {
        for (let j = i+1; j < balls.length; j++) {
            const a = balls[i], b = balls[j];
            if (a.locked && b.locked) continue;
            
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const minDist = a.r + b.r;
            
            if (dist < minDist && dist > 0) {
                const nx = dx / dist;
                const ny = dy / dist;
                const overlap = minDist - dist;
                
                if (!a.locked && !b.locked) {
                    a.x -= nx * overlap * 0.5;
                    a.y -= ny * overlap * 0.5;
                    b.x += nx * overlap * 0.5;
                    b.y += ny * overlap * 0.5;
                } else if (!a.locked) {
                    a.x -= nx * overlap;
                    a.y -= ny * overlap;
                } else if (!b.locked) {
                    b.x += nx * overlap;
                    b.y += ny * overlap;
                }
                
                const dvx = a.vx - b.vx;
                const dvy = a.vy - b.vy;
                const dot = dvx * nx + dvy * ny;
                
                if (dot > 0) {
                    const ma = a.locked ? 100 : 1;
                    const mb = b.locked ? 100 : 1;
                    const totalMass = ma + mb;
                    
                    if (!a.locked) {
                        a.vx -= (2 * dot * mb / totalMass) * nx * RESTITUTION;
                        a.vy -= (2 * dot * mb / totalMass) * ny * RESTITUTION;
                    }
                    if (!b.locked) {
                        b.vx += (2 * dot * ma / totalMass) * nx * RESTITUTION;
                        b.vy += (2 * dot * ma / totalMass) * ny * RESTITUTION;
                    }
                    
                    if (Math.abs(dot) > 1) playBounce();
                }
            }
        }
    }
    
    // Check win
    if (targets.every(t => t.filled)) {
        state = 'won';
        playWin();
        for (let ball of balls) {
            spawnParticles(ball.x, ball.y, COLORS[ball.color].main, 10);
        }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1a2e');
    grad.addColorStop(1, '#16213e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    
    if (state === 'start') {
        drawStartScreen();
        return;
    }
    
    // Draw targets
    for (let t of targets) {
        const c = COLORS[t.color];
        ctx.strokeStyle = t.filled ? c.light : c.main;
        ctx.lineWidth = 3;
        ctx.setLineDash(t.filled ? [] : [8, 6]);
        ctx.strokeRect(t.x, t.y, t.w, t.h);
        ctx.setLineDash([]);
        
        if (!t.filled) {
            ctx.fillStyle = c.main + '20';
            ctx.fillRect(t.x, t.y, t.w, t.h);
            
            // Pulse effect
            const pulse = Math.sin(time * 0.05) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = c.main;
            ctx.font = `bold ${Math.min(t.w, t.h) * 0.6}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('●', t.cx, t.cy);
            ctx.globalAlpha = 1;
        } else {
            ctx.fillStyle = c.main + '30';
            ctx.fillRect(t.x, t.y, t.w, t.h);
            ctx.fillStyle = c.light;
            ctx.font = `bold ${Math.min(t.w, t.h) * 0.5}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✓', t.cx, t.cy);
        }
    }
    
    // Draw obstacles
    for (let o of obstacles) {
        const og = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
        og.addColorStop(0, '#4a5568');
        og.addColorStop(1, '#2d3748');
        ctx.fillStyle = og;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#718096';
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.w, o.h);
    }
    
    // Draw drag line
    if (dragBall && dragStart) {
        const dx = dragStart.x - mousePos.x;
        const dy = dragStart.y - mousePos.y;
        
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(dragBall.x, dragBall.y);
        ctx.lineTo(mousePos.x, mousePos.y);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Power indicator
        const power = Math.sqrt(dx*dx + dy*dy) / 10;
        const maxPower = 25;
        const ratio = Math.min(power / maxPower, 1);
        
        ctx.fillStyle = `hsl(${(1-ratio)*120}, 80%, 50%)`;
        ctx.beginPath();
        ctx.arc(dragBall.x, dragBall.y - dragBall.r - 15, 6, 0, Math.PI*2);
        ctx.fill();
        
        // Trajectory dots
        const tvx = dx * DRAG_POWER;
        const tvy = dy * DRAG_POWER;
        let px = dragBall.x, py = dragBall.y, pvx = tvx, pvy = tvy;
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        for (let i = 0; i < 12; i++) {
            pvy += GRAVITY;
            px += pvx;
            py += pvy;
            ctx.beginPath();
            ctx.arc(px, py, 3 - i*0.2, 0, Math.PI*2);
            ctx.fill();
        }
    }
    
    // Draw balls
    for (let ball of balls) {
        const c = COLORS[ball.color];
        
        if (ball.locked) {
            ctx.globalAlpha = 0.6;
        }
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(ball.x, ball.y + ball.r*0.8, ball.r*0.7, ball.r*0.25, 0, 0, Math.PI*2);
        ctx.fill();
        
        // Ball body
        const bGrad = ctx.createRadialGradient(ball.x - ball.r*0.3, ball.y - ball.r*0.3, 0, ball.x, ball.y, ball.r);
        bGrad.addColorStop(0, c.light);
        bGrad.addColorStop(1, c.main);
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
        
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(ball.x - ball.r*0.25, ball.y - ball.r*0.25, ball.r*0.3, 0, Math.PI*2);
        ctx.fill();
        
        // Lock indicator
        if (ball.locked) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r + 4, 0, Math.PI*2);
            ctx.stroke();
        }
        
        // Lock progress ring
        if (lockCounters[ball.id] && !ball.locked) {
            const ratio = lockCounters[ball.id] / LOCK_TIME;
            ctx.strokeStyle = c.light;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r + 6, -Math.PI/2, -Math.PI/2 + ratio * Math.PI*2);
            ctx.stroke();
        }
        
        ctx.globalAlpha = 1;
    }
    
    // Draw particles
    for (let p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Level indicator
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${currentLevel + 1} / ${LEVELS.length}`, 15, 25);
    
    // Controls hint
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Drag balls to launch • R: Restart', W/2, H - 15);
    
    // Won overlay
    if (state === 'won') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(W*0.06, 48)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Level Complete!', W/2, H/2 - 30);
        
        ctx.font = `${Math.min(W*0.03, 20)}px sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillText(currentLevel + 1 >= LEVELS.length ? '🎉 All levels complete! Press R to replay.' : 'Press N for next level or R to replay.', W/2, H/2 + 20);
    }
}

function drawStartScreen() {
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(W*0.08, 64)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚙️ Physics Puzzle', W/2, H*0.3);
    
    // Subtitle
    ctx.font = `${Math.min(W*0.025, 18)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Launch balls into their matching targets!', W/2, H*0.42);
    
    // Instructions
    const instructions = [
        '🎯 Drag a ball and release to launch it (slingshot style)',
        '⚡ Gravity and collisions are always active',
        '🔒 Hold a ball in its target zone to lock it in place',
        '🏆 Get all balls into their matching targets to win!',
        '',
        'Controls:',
        '• Mouse/Touch: Click & drag balls to aim',
        '• R: Restart level',
        '• N: Next level (after winning)'
    ];
    
    ctx.font = `${Math.min(W*0.02, 15)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    instructions.forEach((line, i) => {
        ctx.fillText(line, W/2, H*0.52 + i * 28);
    });
    
    // Start button
    const btnW = Math.min(W*0.35, 250);
    const btnH = 50;
    const btnX = W/2 - btnW/2;
    const btnY = H*0.82;
    
    ctx.fillStyle = '#4ecdc4';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    
    ctx.fillStyle = '#1a1a2e';
    ctx.font = `bold 20px sans-serif`;
    ctx.fillText('START', W/2, btnY + btnH/2);
}

function handleInput(e) {
    initAudio();
    
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    
    if (state === 'start') {
        // Check start button area
        const btnW = Math.min(W*0.35, 250);
        const btnH = 50;
        const btnX = W/2 - btnW/2;
        const btnY = H*0.82;
        if (x >= btnX && x <= btnX+btnW && y >= btnY && y <= btnY+btnH) {
            loadLevel(0);
        }
    } else if (state === 'playing') {
        // Find ball to drag
        for (let ball of balls) {
            if (ball.locked) continue;
            const dx = x - ball.x;
            const dy = y - ball.y;
            if (dx*dx + dy*dy < (ball.r+10)*(ball.r+10)) {
                dragBall = ball;
                dragStart = { x, y };
                mousePos = { x, y };
                return;
            }
        }
    } else if (state === 'won') {
        // Allow click anywhere to advance
    }
}

function release(e) {
    if (!dragBall) return;
    
    const rect = canvas.getBoundingClientRect();
    const x = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches && e.touches.length > 0 ? 
        (e.touches[0] ? e.touches[0].clientX : e.changedTouches[0].clientX) : e.clientX) - rect.left;
    const fy = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY) - rect.top;
    
    const dx = dragStart.x - x;
    const dy = dragStart.y - y;
    
    // Apply force with cap
    let tvx = dx * DRAG_POWER;
    let tvy = dy * DRAG_POWER;
    const mag = Math.sqrt(tvx*tvx + tvy*tvy);
    const maxSpeed = 25;
    if (mag > maxSpeed) {
        tvx = tvx / mag * maxSpeed;
        tvy = tvy / mag * maxSpeed;
    }
    
    dragBall.vx += tvx;
    dragBall.vy += tvy;
    
    playSound(300 + Math.random()*200, 0.15, 'sine', 0.2);
    
    dragBall = null;
    dragStart = null;
    mousePos = null;
}

// Mouse events
canvas.addEventListener('mousedown', (e) => { if(!audioCtx) initAudio(); handleInput(e); });
canvas.addEventListener('mousemove', (e) => {
    if (dragBall) {
        const rect = canvas.getBoundingClientRect();
        mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
});
canvas.addEventListener('mouseup', release);

// Touch events
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); handleInput(e); }, { passive: false });
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (dragBall && e.touches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        mousePos = { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
}, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); release(e); }, { passive: false });

// Keyboard
window.addEventListener('keydown', (e) => {
    if (!audioCtx) initAudio();
    
    if (e.key === 'r' || e.key === 'R') {
        loadLevel(currentLevel);
    }
    if (e.key === 'n' || e.key === 'N') {
        if (state === 'won') {
            currentLevel = (currentLevel + 1) % LEVELS.length;
            loadLevel(currentLevel);
        }
    }
    if (e.key === 'Enter' || e.key === ' ') {
        if (state === 'start') {
            loadLevel(0);
        } else if (state === 'won') {
            currentLevel = (currentLevel + 1) % LEVELS.length;
            loadLevel(currentLevel);
        }
    }
});

// Game loop
function gameLoop() {
    time++;
    updatePhysics();
    updateParticles();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
