<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; font-family: monospace; }
canvas { display: block; }
#ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, gridW, gridH, offsetX, offsetY;
let gameState = 'start'; // start, playing, animating, won, lost
let currentLevel = 0;
let path = [];
let pacPos = {x:0,y:0};
let pellets = [];
let collectedPellets = new Set();
let ghosts = [];
let walls = [];
let animFrame = 0;
let animPacPath = [];
let animGhostFrames = [];
let isDrawing = false;
let startPacPos = {x:0,y:0};
let score = 0;
let totalScore = 0;
let message = '';
let particles = [];

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    
    const maxGridW = Math.floor(W / 50);
    const maxGridH = Math.floor(H / 50);
    gridW = Math.min(12, maxGridW - 2);
    gridH = Math.min(12, maxGridH - 2);
    
    cellSize = Math.min(Math.floor((W - 40) / gridW), Math.floor((H - 120) / gridH));
    offsetX = Math.floor((W - gridW * cellSize) / 2);
    offsetY = Math.floor((H - gridH * cellSize) / 2) + 30;
}
window.addEventListener('resize', resize);
resize();

const levels = [
    {
        pac: {x:1, y:6},
        walls: [],
        pellets: [{x:8,y:6},{x:9,y:6},{x:10,y:6},{x:10,y:5},{x:10,y:4},{x:9,y:4},{x:8,y:4}],
        ghosts: [{path:[{x:6,y:6},{x:7,y:6},{x:8,y:6},{x:9,y:6},{x:9,y:5},{x:9,y:4},{x:8,y:4},{x:7,y:4},{x:6,y:4}], speed:1, color:'#ff0000'}]
    },
    {
        pac: {x:1, y:6},
        walls: [{x:5,y:3},{x:5,y:4},{x:5,y:5},{x:5,y:7},{x:5,y:8}],
        pellets: [{x:9,y:2},{x:10,y:2},{x:10,y:3},{x:10,y:4},{x:9,y:4},{x:8,y:4},{x:6,y:2},{x:7,y:2}],
        ghosts: [
            {path:[{x:6,y:6},{x:7,y:6},{x:8,y:6},{x:9,y:6},{x:10,y:6},{x:10,y:5},{x:10,y:4},{x:9,y:4},{x:8,y:4},{x:7,y:4},{x:6,y:4}], speed:1, color:'#ff0000'},
            {path:[{x:3,y:2},{x:4,y:2},{x:5,y:2},{x:6,y:2},{x:6,y:3},{x:6,y:4},{x:6,y:5},{x:6,y:6}], speed:1, color:'#00ff00'}
        ]
    },
    {
        pac: {x:1, y:1},
        walls: [{x:4,y:4},{x:4,y:5},{x:4,y:6},{x:7,y:3},{x:7,y:4},{x:7,y:5},{x:7,y:6}],
        pellets: [{x:9,y:1},{x:10,y:1},{x:10,y:2},{x:10,y:3},{x:9,y:3},{x:8,y:3},{x:3,y:8},{x:4,y:8},{x:5,y:8},{x:6,y:8}],
        ghosts: [
            {path:[{x:5,y:2},{x:6,y:2},{x:7,y:2},{x:8,y:2},{x:9,y:2},{x:10,y:2},{x:10,y:3},{x:10,y:4},{x:10,y:5},{x:9,y:5},{x:8,y:5}], speed:1, color:'#ff0000'},
            {path:[{x:2,y:6},{x:3,y:6},{x:4,y:7},{x:5,y:8},{x:6,y:8},{x:7,y:8},{x:8,y:8},{x:9,y:8}], speed:1, color:'#00ff00'},
            {path:[{x:9,y:9},{x:9,y:10},{x:10,y:10},{x:10,y:9},{x:10,y:8},{x:9,y:8}], speed:1, color:'#ffff00'}
        ]
    },
    {
        pac: {x:1, y:6},
        walls: [{x:3,y:2},{x:3,y:3},{x:3,y:4},{x:7,y:5},{x:7,y:6},{x:7,y:7},{x:9,y:3}],
        pellets: [{x:10,y:1},{x:10,y:2},{x:10,y:3},{x:10,y:4},{x:9,y:5},{x:8,y:5},{x:5,y:9},{x:6,y:9},{x:7,y:9}],
        ghosts: [
            {path:[{x:2,y:2},{x:3,y:3},{x:4,y:4},{x:5,y:5},{x:6,y:5},{x:7,y:5},{x:8,y:5},{x:9,y:5},{x:10,y:5}], speed:1, color:'#ff0000'},
            {path:[{x:4,y:9},{x:5,y:9},{x:6,y:9},{x:7,y:9},{x:8,y:9},{x:9,y:9},{x:10,y:9},{x:10,y:8}], speed:1, color:'#00ff00'},
            {path:[{x:5,y:1},{x:6,y:1},{x:7,y:1},{x:8,y:1},{x:9,y:1},{x:10,y:1},{x:10,y:2}], speed:1, color:'#ffff00'}
        ]
    },
    {
        pac: {x:1, y:6},
        walls: [{x:3,y:3},{x:4,y:5},{x:5,y:3},{x:6,y:7},{x:7,y:5},{x:8,y:3},{x:9,y:7}],
        pellets: [{x:10,y:2},{x:10,y:4},{x:10,y:6},{x:10,y:8},{x:9,y:1},{x:9,y:5},{x:9,y:9},{x:2,y:2}],
        ghosts: [
            {path:[{x:2,y:2},{x:3,y:3},{x:4,y:4},{x:5,y:5},{x:6,y:6},{x:7,y:7},{x:8,y:8},{x:9,y:9}], speed:1, color:'#ff0000'},
            {path:[{x:2,y:10},{x:3,y:10},{x:4,y:10},{x:5,y:10},{x:6,y:10},{x:7,y:10},{x:8,y:10},{x:9,y:10}], speed:1, color:'#00ff00'},
            {path:[{x:10,y:1},{x:10,y:2},{x:10,y:3},{x:10,y:4},{x:10,y:5},{x:10,y:6},{x:10,y:7},{x:10,y:8}], speed:1, color:'#ffff00'}
        ]
    }
];

function loadLevel(idx) {
    if (idx >= levels.length) idx = 0;
    currentLevel = idx;
    const lvl = levels[idx];
    pacPos = {...lvl.pac};
    startPacPos = {...lvl.pac};
    path = [];
    pellets = lvl.pellets.map(p => ({...p}));
    collectedPellets = new Set();
    ghosts = lvl.ghosts.map(g => ({...g, currentFrame: 0}));
    gameState = 'playing';
    animPacPath = [];
    particles = [];
    score = 0;
    message = '';
}

function getGhostPos(ghost, frame) {
    const idx = frame % ghost.path.length;
    return ghost.path[idx];
}

function isWall(x, y) {
    return walls.some(w => w.x === x && y === y);
}

function validCell(x, y) {
    if (x < 0 || x >= gridW || y < 0 || y >= gridH) return false;
    if (isWall(x, y)) return false;
    return true;
}

function getCellFromMouse(mx, my) {
    const gx = Math.floor((mx - offsetX) / cellSize);
    const gy = Math.floor((my - offsetY) / cellSize);
    if (gx >= 0 && gx < gridW && gy >= 0 && gy < gridH) return {x: gx, y: gy};
    return null;
}

function canExtend(from, to) {
    const dx = Math.abs(to.x - from.x);
    const dy = Math.abs(to.y - from.y);
    if (dx + dy !== 1) return false;
    if (!validCell(to.x, to.y)) return false;
    return true;
}

function isPathClear(x, y) {
    // Check no ghost will be at this position when pac arrives
    const stepIndex = path.findIndex(p => p.x === x && p.y === y);
    if (stepIndex === -1) return true;
    for (const ghost of ghosts) {
        if (ghost.path.some(gp => gp.x === x && gp.y === y)) return false;
    }
    return true;
}

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    if (gameState === 'start') {
        loadLevel(0);
        return;
    }
    
    if (gameState === 'won' || gameState === 'lost') {
        loadLevel(currentLevel + 1);
        return;
    }
    
    if (gameState !== 'playing') return;
    
    const cell = getCellFromMouse(mx, my);
    if (!cell) return;
    
    if (path.length === 0) {
        path = [{...startPacPos}];
        isDrawing = true;
    } else {
        const last = path[path.length - 1];
        if (canExtend(last, cell) && !path.some(p => p.x === cell.x && p.y === cell.y)) {
            path.push({...cell});
            isDrawing = true;
        }
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing || gameState !== 'playing') return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const cell = getCellFromMouse(mx, my);
    if (!cell) return;
    const last = path[path.length - 1];
    if (canExtend(last, cell) && !path.some(p => p.x === cell.x && p.y === cell.y)) {
        path.push({...cell});
    }
});

canvas.addEventListener('mouseup', () => { isDrawing = false; });
canvas.addEventListener('mouseleave', () => { isDrawing = false; });

window.addEventListener('keydown', (e) => {
    if (gameState === 'start') {
        loadLevel(0);
        return;
    }
    if (e.code === 'Space' || e.code === 'Enter') {
        if (gameState === 'playing' && path.length > 0) {
            startAnimation();
        } else if (gameState === 'won' || gameState === 'lost') {
            loadLevel(currentLevel + 1);
        }
    }
    if (e.code === 'KeyR') {
        loadLevel(currentLevel);
    }
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = touch.clientX - rect.left;
    const my = touch.clientY - rect.top;
    
    if (gameState === 'start') { loadLevel(0); return; }
    if (gameState === 'won' || gameState === 'lost') { loadLevel(currentLevel + 1); return; }
    if (gameState !== 'playing') return;
    
    const cell = getCellFromMouse(mx, my);
    if (!cell) return;
    if (path.length === 0) {
        path = [{...startPacPos}];
        isDrawing = true;
    } else {
        const last = path[path.length - 1];
        if (canExtend(last, cell) && !path.some(p => p.x === cell.x && p.y === cell.y)) {
            path.push({...cell});
            isDrawing = true;
        }
    }
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isDrawing || gameState !== 'playing') return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = touch.clientX - rect.left;
    const my = touch.clientY - rect.top;
    const cell = getCellFromMouse(mx, my);
    if (!cell) return;
    const last = path[path.length - 1];
    if (canExtend(last, cell) && !path.some(p => p.x === cell.x && p.y === cell.y)) {
        path.push({...cell});
    }
});

canvas.addEventListener('touchend', () => { isDrawing = false; });

function startAnimation() {
    gameState = 'animating';
    animPacPath = [...path];
    animFrame = 0;
    collectedPellets.clear();
    score = 0;
}

function updateAnimation() {
    if (gameState !== 'animating') return;
    
    const stepMs = 400;
    const elapsed = performance.now();
    const frame = Math.floor(elapsed / stepMs);
    
    if (frame >= animPacPath.length) {
        // Check win
        if (collectedPellets.size === pellets.length) {
            gameState = 'won';
        } else {
            gameState = 'lost';
            message = 'Missing pellets! Press Space for next level.';
        }
        return;
    }
    
    const pacX = animPacPath[frame].x;
    const pacY = animPacPath[frame].y;
    
    // Check collision with ghosts
    for (const ghost of ghosts) {
        const gFrame = frame % ghost.path.length;
        const gp = getGhostPos(ghost, gFrame);
        if (gp.x === pacX && gp.y === pacY) {
            gameState = 'lost';
            message = 'Caught by ghost! Press Space for next level.';
            spawnParticles(pacX, pacY, '#ffff00');
            return;
        }
    }
    
    // Collect pellets
    pellets.forEach((p, i) => {
        if (p.x === pacX && p.y === pacY) {
            collectedPellets.add(i);
            score++;
            spawnParticles(pacX, pacY, '#00ffff');
        }
    });
    
    animFrame = frame;
}

function spawnParticles(gx, gy, color) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: offsetX + gx * cellSize + cellSize/2,
            y: offsetY + gy * cellSize + cellSize/2,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1,
            color
        });
    }
}

function updateParticles() {
    particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        return p.life > 0;
    });
}

function drawGrid() {
    ctx.fillStyle = '#111';
    ctx.fillRect(offsetX - 2, offsetY - 2, gridW * cellSize + 4, gridH * cellSize + 4);
    
    for (let x = 0; x < gridW; x++) {
        for (let y = 0; y < gridH; y++) {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.strokeRect(offsetX + x * cellSize, offsetY + y * cellSize, cellSize, cellSize);
        }
    }
}

function drawWalls() {
    for (const w of walls) {
        ctx.fillStyle = '#4444ff';
        const pad = 2;
        ctx.fillRect(offsetX + w.x * cellSize + pad, offsetY + w.y * cellSize + pad, cellSize - pad*2, cellSize - pad*2);
        ctx.strokeStyle = '#6666ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(offsetX + w.x * cellSize + pad, offsetY + w.y * cellSize + pad, cellSize - pad*2, cellSize - pad*2);
    }
}

function drawPellets() {
    pellets.forEach((p, i) => {
        if (collectedPellets.has(i)) return;
        ctx.fillStyle = '#ffff00';
        const r = cellSize * 0.15;
        ctx.beginPath();
        ctx.arc(offsetX + p.x * cellSize + cellSize/2, offsetY + p.y * cellSize + cellSize/2, r, 0, Math.PI*2);
        ctx.fill();
    });
}

function drawPath() {
    if (path.length <= 1) return;
    
    for (let i = 1; i < path.length; i++) {
        const p = path[i];
        ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
        ctx.fillRect(offsetX + p.x * cellSize + 2, offsetY + p.y * cellSize + 2, cellSize - 4, cellSize - 4);
        
        // Draw connection line
        if (i > 1) {
            const prev = path[i-1];
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(offsetX + prev.x * cellSize + cellSize/2, offsetY + prev.y * cellSize + cellSize/2);
            ctx.lineTo(offsetX + p.x * cellSize + cellSize/2, offsetY + p.y * cellSize + cellSize/2);
            ctx.stroke();
        }
    }
    
    // Step numbers
    for (let i = 0; i < path.length; i++) {
        const p = path[i];
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = `${Math.max(8, cellSize * 0.3)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (i > 0) {
            ctx.fillText(i, offsetX + p.x * cellSize + cellSize/2, offsetY + p.y * cellSize + cellSize/2);
        }
    }
}

function drawGhosts(time) {
    const t = time / 1000;
    const ghostFrame = Math.floor(t * 60 / 60); // one step per second
    
    ghosts.forEach((ghost, gi) => {
        const pos = getGhostPos(ghost, ghostFrame);
        const gx = offsetX + pos.x * cellSize + cellSize/2;
        const gy = offsetY + pos.y * cellSize + cellSize/2;
        const r = cellSize * 0.35;
        
        // Ghost body
        ctx.fillStyle = ghost.color;
        ctx.beginPath();
        ctx.arc(gx, gy - r*0.2, r, Math.PI, 0);
        ctx.lineTo(gx + r, gy + r*0.8);
        ctx.quadraticCurveTo(gx + r*0.5, gy + r*0.6, gx, gy + r*0.8);
        ctx.quadraticCurveTo(gx - r*0.5, gy + r*0.6, gx - r, gy + r*0.8);
        ctx.closePath();
        ctx.fill();
        
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(gx - r*0.3, gy - r*0.2, r*0.25, 0, Math.PI*2);
        ctx.arc(gx + r*0.3, gy - r*0.2, r*0.25, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#00f';
        ctx.beginPath();
        ctx.arc(gx - r*0.25, gy - r*0.15, r*0.12, 0, Math.PI*2);
        ctx.arc(gx + r*0.35, gy - r*0.15, r*0.12, 0, Math.PI*2);
        ctx.fill();
        
        // Show ghost path as faint dots
        ghost.path.forEach((gp, gi2) => {
            if (gi2 !== ghostFrame % ghost.path.length) {
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.arc(offsetX + gp.x * cellSize + cellSize/2, offsetY + gp.y * cellSize + cellSize/2, 3, 0, Math.PI*2);
                ctx.fill();
            }
        });
    });
}

function drawPac(time) {
    let px, py;
    if (gameState === 'animating') {
        const f = animFrame;
        if (f < animPacPath.length) {
            px = animPacPath[f].x;
            py = animPacPath[f].y;
        } else {
            px = animPacPath[animPacPath.length-1].x;
            py = animPacPath[animPacPath.length-1].y;
        }
    } else {
        px = startPacPos.x;
        py = startPacPos.y;
    }
    
    const cx = offsetX + px * cellSize + cellSize/2;
    const cy = offsetY + py * cellSize + cellSize/2;
    const r = cellSize * 0.38;
    
    const mouthAngle = gameState === 'animating' ? Math.abs(Math.sin(time * 0.01)) * 0.4 : 0.3;
    
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(cx, cy, r, mouthAngle - Math.PI/2 + 0.3, -mouthAngle + Math.PI/2 - 0.3);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();
    
    // Glow
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.1, 0, Math.PI*2);
    ctx.fillStyle = '#ff8800';
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawUI() {
    // Top bar
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${currentLevel + 1}`, offsetX, offsetY - 15);
    
    const remaining = pellets.length - collectedPellets.size;
    ctx.fillText(`Pellets: ${remaining > 0 ? remaining : 0} left`, offsetX + 120, offsetY - 15);
    
    if (gameState === 'playing') {
        ctx.fillStyle = '#888';
        ctx.textAlign = 'right';
        ctx.fillText(`Path: ${path.length > 0 ? path.length - 1 : 0} steps | [SPACE] GO | [R] Reset`, offsetX + gridW * cellSize, offsetY - 15);
    }
    
    if (gameState === 'won') {
        ctx.fillStyle = '#0f0';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('★ LEVEL COMPLETE! ★', W/2, H/2 - 20);
        ctx.font = '16px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Press SPACE for next level', W/2, H/2 + 15);
    }
    
    if (gameState === 'lost') {
        ctx.fillStyle = '#f00';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('✖ GAME OVER ✖', W/2, H/2 - 20);
        ctx.font = '16px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText(message, W/2, H/2 + 15);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    const titleY = H * 0.2;
    ctx.fillStyle = '#ffff00';
    ctx.font = `bold ${Math.min(48, W*0.06)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('PAC-MAN PUZZLE', W/2, titleY);
    
    // Pac-Man icon
    const pacR = Math.min(30, W * 0.04);
    const pacX = W/2;
    const pacY = H * 0.35;
    const mouth = Math.abs(Math.sin(performance.now() * 0.005)) * 0.5;
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(pacX, pacY, pacR, mouth - 0.3, -mouth + 0.3);
    ctx.lineTo(pacX, pacY);
    ctx.closePath();
    ctx.fill();
    
    // Instructions
    const lines = [
        'How to Play:',
        '',
        '1. Click & drag from Pac-Man to draw a path',
        '2. Press SPACE to send Pac-Man along your path',
        '3. Collect ALL yellow pellets before ghosts catch you!',
        '',
        '• Ghosts patrol in fixed loops (shown as faint dots)',
        '• Blue walls block movement',
        '• You must plan a route that avoids ghost positions',
        '',
        '[R] to reset level | [SPACE] to start/go'
    ];
    
    ctx.fillStyle = '#ccc';
    ctx.font = `${Math.min(16, W*0.02)}px monospace`;
    lines.forEach((line, i) => {
        if (i === 0) ctx.fillStyle = '#0ff';
        else ctx.fillStyle = '#aaa';
        ctx.fillText(line, W/2, H * 0.45 + i * 28);
    });
    
    // Blinking prompt
    if (Math.floor(performance.now() / 800) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText('Click or press SPACE to start', W/2, H * 0.9);
    }
}

function render(time) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
    } else {
        drawGrid();
        drawWalls();
        drawPellets();
        drawPath();
        drawGhosts(time);
        drawPac(time);
        drawParticles();
        drawUI();
    }
}

let lastTime = 0;
function gameLoop(time) {
    updateAnimation();
    updateParticles();
    render(time);
    requestAnimationFrame(gameLoop);
}

loadLevel(0);
gameState = 'start';
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
