<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, scale;
const LW = 960, LH = 640;

function resize() {
    const r = Math.min(window.innerWidth / LW, window.innerHeight / LH);
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    scale = Math.min(canvas.width / LW, canvas.height / LH);
    W = canvas.width; H = canvas.height;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}

// Game state
let state = 'START'; // START, PLAYING, GAME_OVER
let money = 200;
let lives = 20;
let wave = 0;
let enemies = [];
let towers = [];
let projectiles = [];
let particles = [];
let grid = [];
let selectedTower = 0; // 0=none,1=basic,2=rapid,3=cannon
let placingTower = false;
let mouseX = 0, mouseY = 0;
let waveTimer = 0;
let waveActive = false;
let enemiesToSpawn = 0;
let spawnTimer = 0;
let totalKills = 0;

const CELL = 32;
const COLS = Math.floor(LW / CELL);
const ROWS = Math.floor(LH / CELL);

// Path waypoints in logical coords
const pathPoints = [
    {x: -40, y: 160},
    {x: 160, y: 160},
    {x: 160, y: 480},
    {x: 480, y: 480},
    {x: 480, y: 160},
    {x: 720, y: 160},
    {x: 720, y: 480},
    {x: 1000, y: 480}
];

function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
            grid[r][c] = false; // true = blocked by path
        }
    }
    // Block cells near path
    for (let i = 0; i < pathPoints.length - 1; i++) {
        const a = pathPoints[i], b = pathPoints[i+1];
        const dist = Math.hypot(b.x - a.x, b.y - a.y);
        const steps = Math.ceil(dist / (CELL * 0.4));
        for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            const px = a.x + (b.x - a.x) * t;
            const py = a.y + (b.y - a.y) * t;
            // Block cells within radius
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cx = c * CELL + CELL/2;
                    const cy = r * CELL + CELL/2;
                    if (Math.hypot(px - cx, py - cy) < CELL * 0.8) {
                        grid[r][c] = true;
                    }
                }
            }
        }
    }
}

// Tower types
const TOWER_TYPES = [
    null,
    { name: 'Basic', cost: 50, range: 120, damage: 15, fireRate: 60, color: '#4a90d9', splash: 0 },
    { name: 'Rapid', cost: 80, range: 90, damage: 8, fireRate: 25, color: '#e67e22', splash: 0 },
    { name: 'Cannon', cost: 120, range: 140, damage: 35, fireRate: 90, color: '#c0392b', splash: 40 }
];

// Enemy types per wave
function getEnemyType(w) {
    const types = ['normal', 'fast', 'tank'];
    if (w % 5 === 0) return 'boss';
    if (w <= 2) return 'normal';
    const idx = w % 3;
    return types[idx];
}

function getEnemyStats(type, waveNum) {
    const base = { normal: {hp: 50, speed: 1.2, reward: 10}, fast: {hp: 30, speed: 2.2, reward: 12}, tank: {hp: 150, speed: 0.7, reward: 20}, boss: {hp: 500 + waveNum * 50, speed: 0.5, reward: 100} };
    const s = base[type];
    const hpScale = 1 + (waveNum - 1) * 0.15;
    return { hp: Math.floor(s.hp * hpScale), maxHp: Math.floor(s.hp * hpScale), speed: s.speed, reward: s.reward, type };
}

function startWave() {
    wave++;
    waveActive = true;
    enemiesToSpawn = 5 + wave * 2;
    if (wave % 5 === 0) enemiesToSpawn += 2;
    spawnTimer = 0;
}

function spawnEnemy() {
    const type = getEnemyType(wave);
    const stats = getEnemyStats(type, wave);
    const e = {
        x: pathPoints[0].x, y: pathPoints[0].y,
        hp: stats.hp, maxHp: stats.maxHp,
        speed: stats.speed, reward: stats.reward,
        type: type, waypointIdx: 1, progress: 0
    };
    enemies.push(e);
}

function updateEnemy(e) {
    if (e.waypointIdx >= pathPoints.length) {
        lives--;
        e.dead = true;
        playSound(100, 0.3, 'sawtooth', 0.15);
        return;
    }
    const target = pathPoints[e.waypointIdx];
    const dx = target.x - e.x, dy = target.y - e.y;
    const dist = Math.hypot(dx, dy);
    const move = e.speed * 2;
    if (dist <= move) {
        e.x = target.x; e.y = target.y;
        e.waypointIdx++;
    } else {
        e.x += (dx / dist) * move;
        e.y += (dy / dist) * move;
    }
}

function updateTower(t) {
    t.cooldown--;
    if (t.cooldown > 0) return;
    // Find target
    let best = null, bestDist = Infinity;
    for (const e of enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - t.x, e.y - t.y);
        if (d <= t.range && d < bestDist) { best = e; bestDist = d; }
    }
    if (best) {
        t.cooldown = t.fireRate;
        t.angle = Math.atan2(best.y - t.y, best.x - t.x);
        const p = { x: t.x, y: t.y, tx: best.x, ty: best.y, target: best, damage: t.damage, splash: t.splash, speed: 5, color: t.color };
        projectiles.push(p);
        playSound(t.type === 3 ? 80 : 400, 0.1, 'square', 0.05);
    }
}

function updateProjectile(p) {
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < p.speed * 2) {
        // Hit
        hitEnemy(p.target, p.damage);
        if (p.splash > 0) {
            for (const e of enemies) {
                if (e.dead || e === p.target) continue;
                if (Math.hypot(e.x - p.tx, e.y - p.ty) < p.splash) {
                    hitEnemy(e, Math.floor(p.damage * 0.5));
                }
            }
        }
        // Particles
        for (let i = 0; i < 4; i++) {
            particles.push({ x: p.tx, y: p.ty, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 15, color: p.color });
        }
        p.dead = true;
        playSound(200, 0.05, 'triangle', 0.04);
    } else {
        p.x += (dx / dist) * p.speed;
        p.y += (dy / dist) * p.speed;
        // Update target position
        if (p.target && !p.target.dead) {
            p.tx = p.target.x; p.ty = p.target.y;
        }
    }
}

function hitEnemy(e, dmg) {
    e.hp -= dmg;
    if (e.hp <= 0 && !e.dead) {
        e.dead = true;
        money += e.reward;
        totalKills++;
        for (let i = 0; i < 6; i++) {
            particles.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, life: 20, color: '#ff0' });
        }
        playSound(300, 0.15, 'sine', 0.08);
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function update() {
    if (state !== 'PLAYING') return;

    // Spawn enemies
    if (waveActive) {
        spawnTimer++;
        const interval = Math.max(20, 50 - wave * 2);
        if (spawnTimer >= interval && enemiesToSpawn > 0) {
            spawnEnemy();
            enemiesToSpawn--;
            spawnTimer = 0;
        }
        if (enemiesToSpawn <= 0 && enemies.length === 0) {
            waveActive = false;
            money += 25 + wave * 5; // Wave bonus
            waveTimer = 180; // 3 second pause between waves
        }
    } else {
        waveTimer--;
        if (waveTimer <= 0) startWave();
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        updateEnemy(e);
        if (e.dead) enemies.splice(i, 1);
    }

    // Update towers
    for (const t of towers) updateTower(t);

    // Update projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        updateProjectile(p);
        if (p.dead) projectiles.splice(i, 1);
    }

    updateParticles();

    if (lives <= 0) state = 'GAME_OVER';
}

// Drawing
function drawPath() {
    ctx.strokeStyle = '#5a4a3a';
    ctx.lineWidth = CELL * 1.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
    ctx.stroke();

    // Path border
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = CELL * 1.3;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Path center line
    ctx.strokeStyle = '#7a6a5a';
    ctx.lineWidth = CELL * 0.8;
    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
    ctx.stroke();
}

function drawGrid() {
    if (!placingTower) return;
    const gx = Math.floor(mouseX / CELL);
    const gy = Math.floor(mouseY / CELL);
    // Highlight all valid cells faintly
    ctx.globalAlpha = 0.1;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (!grid[r][c]) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
            }
        }
    }
    ctx.globalAlpha = 1;

    // Highlight selected cell
    if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
        const valid = !grid[gy][gx] && !towers.some(t => t.gx === gx && t.gy === gy);
        ctx.fillStyle = valid ? 'rgba(100,255,100,0.3)' : 'rgba(255,100,100,0.3)';
        ctx.fillRect(gx * CELL, gy * CELL, CELL, CELL);
        if (valid && selectedTower > 0) {
            const tt = TOWER_TYPES[selectedTower];
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(gx * CELL + CELL/2, gy * CELL + CELL/2, tt.range, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
}

function drawTowers() {
    for (const t of towers) {
        const tt = TOWER_TYPES[t.type];
        // Base
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(t.x, t.y, CELL * 0.45, 0, Math.PI * 2);
        ctx.fill();
        // Top
        ctx.fillStyle = tt.color;
        ctx.beginPath();
        ctx.arc(t.x, t.y, CELL * 0.35, 0, Math.PI * 2);
        ctx.fill();
        // Barrel
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(t.x, t.y);
        ctx.lineTo(t.x + Math.cos(t.angle) * 16, t.y + Math.sin(t.angle) * 16);
        ctx.stroke();
    }
}

function drawEnemies() {
    for (const e of enemies) {
        if (e.dead) continue;
        const size = e.type === 'boss' ? 14 : e.type === 'tank' ? 12 : 8;
        // Body
        let color = '#ff6b6b';
        if (e.type === 'fast') color = '#feca57';
        if (e.type === 'tank') color = '#a29bfe';
        if (e.type === 'boss') color = '#fd79a8';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, size, 0, Math.PI * 2);
        ctx.fill();
        // HP bar
        const bw = size * 2;
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x - bw/2, e.y - size - 8, bw, 4);
        ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#2ecc71' : e.hp / e.maxHp > 0.25 ? '#f39c12' : '#e74c3c';
        ctx.fillRect(e.x - bw/2, e.y - size - 8, bw * (e.hp / e.maxHp), 4);
    }
}

function drawProjectiles() {
    for (const p of projectiles) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life / 20;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    const barH = 50;
    ctx.fillStyle = 'rgba(20,20,40,0.9)';
    ctx.fillRect(0, 0, W, barH * scale);
    ctx.scale(scale, scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    // Money
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('$' + money, 20, 32);
    // Lives
    ctx.fillStyle = '#e74c3c';
    ctx.fillText('♥ ' + lives, 150, 32);
    // Wave
    ctx.fillStyle = '#ecf0f1';
    ctx.fillText('Wave: ' + wave, 280, 32);
    // Kills
    ctx.fillStyle = '#bdc3c7';
    ctx.font = '14px monospace';
    ctx.fillText('Kills: ' + totalKills, 420, 32);

    // Tower buttons
    const btnY = LH - 55;
    const btnH = 45;
    ctx.fillStyle = 'rgba(20,20,40,0.9)';
    ctx.fillRect(0, btnY, LW, btnH + 10);

    for (let i = 1; i <= 3; i++) {
        const tt = TOWER_TYPES[i];
        const bx = 20 + (i-1) * 180;
        const selected = selectedTower === i;
        ctx.fillStyle = selected ? tt.color : 'rgba(255,255,255,0.1)';
        ctx.fillRect(bx, btnY + 5, 170, btnH - 10);
        ctx.strokeStyle = tt.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, btnY + 5, 170, btnH - 10);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px monospace';
        ctx.fillText(tt.name, bx + 10, btnY + 22);
        ctx.fillStyle = money >= tt.cost ? '#2ecc71' : '#e74c3c';
        ctx.font = '12px monospace';
        ctx.fillText('$' + tt.cost + '  DMG:' + tt.damage + '  SPD:' + (60/tt.fireRate).toFixed(1) + '/s', bx + 10, btnY + 38);
    }

    // Sell hint
    ctx.fillStyle = '#95a5a6';
    ctx.font = '12px monospace';
    ctx.fillText('Right-click tower to sell (50% back)', 570, btnY + 30);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function drawStart() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    const cx = W/2, cy = H/2;

    ctx.fillStyle = '#ecf0f1';
    ctx.font = 'bold ' + Math.min(W/8, 60) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('TOWER DEFENSE', cx, cy - 60);

    ctx.font = Math.min(W/20, 20) + 'px monospace';
    ctx.fillStyle = '#bdc3c7';
    const lines = [
        'Defend the path from enemies!',
        '',
        'Click a tower type below, then click the map to place.',
        'Right-click a tower to sell it for 50%.',
        'Enemies follow the path. Don\'t let them reach the end!',
        '',
        '1 - Basic Tower ($50)',
        '2 - Rapid Tower ($80)',
        '3 - Cannon Tower ($120) [Splash damage]',
        '',
        'Press SPACE or click to start!'
    ];
    const startY = cy - 20;
    lines.forEach((l, i) => {
        ctx.fillText(l, cx, startY + i * 28);
    });

    ctx.textAlign = 'left';
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    const cx = W/2, cy = H/2;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold ' + Math.min(W/10, 50) + 'px monospace';
    ctx.fillText('GAME OVER', cx, cy - 30);
    ctx.fillStyle = '#ecf0f1';
    ctx.font = Math.min(W/25, 22) + 'px monospace';
    ctx.fillText('Waves survived: ' + wave, cx, cy + 20);
    ctx.fillText('Total kills: ' + totalKills, cx, cy + 55);
    ctx.fillStyle = '#f1c40f';
    ctx.fillText('Press R to restart', cx, cy + 100);
    ctx.textAlign = 'left';
}

function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);

    if (state === 'START') { drawStart(); return; }

    // Scale game area
    const offX = (W - LW * scale) / 2;
    const offY = (H - LH * scale) / 2;
    ctx.save();
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);

    // Background
    ctx.fillStyle = '#2d5a27';
    ctx.fillRect(0, 0, LW, LH);

    // Subtle grid pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, LH); ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(LW, r * CELL); ctx.stroke();
    }

    drawPath();
    drawGrid();
    drawTowers();
    drawEnemies();
    drawProjectiles();
    drawParticles();
    drawHUD();

    ctx.restore();

    if (state === 'GAME_OVER') drawGameOver();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function resetGame() {
    money = 200; lives = 20; wave = 0; totalKills = 0;
    enemies = []; towers = []; projectiles = []; particles = [];
    selectedTower = 0; placingTower = false;
    waveActive = false; waveTimer = 120;
    state = 'PLAYING';
}

// Input
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left - (W - LW * scale) / 2) / scale;
    mouseY = (e.clientY - rect.top - (H - LH * scale) / 2) / scale;
});

canvas.addEventListener('click', (e) => {
    initAudio();
    if (state === 'START') { resetGame(); return; }
    if (state === 'GAME_OVER') { resetGame(); return; }
    if (state !== 'PLAYING') return;

    // Check tower buttons
    const btnY = LH - 55;
    if (mouseY > btnY && mouseY < btnY + 45) {
        for (let i = 1; i <= 3; i++) {
            const bx = 20 + (i-1) * 180;
            if (mouseX >= bx && mouseX <= bx + 170) {
                selectedTower = selectedTower === i ? 0 : i;
                placingTower = selectedTower > 0;
                playSound(500, 0.05, 'sine', 0.05);
                return;
            }
        }
    }

    // Place tower
    if (placingTower && selectedTower > 0) {
        const gx = Math.floor(mouseX / CELL);
        const gy = Math.floor(mouseY / CELL);
        if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
            if (!grid[gy][gx] && !towers.some(t => t.gx === gx && t.gy === gy)) {
                const tt = TOWER_TYPES[selectedTower];
                if (money >= tt.cost) {
                    money -= tt.cost;
                    towers.push({
                        x: gx * CELL + CELL/2, y: gy * CELL + CELL/2,
                        gx, gy, type: selectedTower,
                        range: tt.range, damage: tt.damage, fireRate: tt.fireRate,
                        color: tt.color, splash: tt.splash,
                        cooldown: 0, angle: 0
                    });
                    playSound(600, 0.1, 'sine', 0.1);
                }
            }
        }
    }
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (state !== 'PLAYING') return;
    // Sell tower
    const gx = Math.floor(mouseX / CELL);
    const gy = Math.floor(mouseY / CELL);
    const idx = towers.findIndex(t => t.gx === gx && t.gy === gy);
    if (idx >= 0) {
        const tt = TOWER_TYPES[towers[idx].type];
        money += Math.floor(tt.cost * 0.5);
        towers.splice(idx, 1);
        playSound(200, 0.1, 'sine', 0.08);
    }
});

window.addEventListener('keydown', (e) => {
    initAudio();
    if (state === 'START' && (e.code === 'Space' || e.code === 'Enter')) { resetGame(); return; }
    if (state === 'GAME_OVER' && e.code === 'KeyR') { resetGame(); return; }
    if (state !== 'PLAYING') return;
    if (e.code === 'Digit1') { selectedTower = 1; placingTower = true; }
    if (e.code === 'Digit2') { selectedTower = 2; placingTower = true; }
    if (e.code === 'Digit3') { selectedTower = 3; placingTower = true; }
    if (e.code === 'Escape') { selectedTower = 0; placingTower = false; }
});

// Init
initGrid();
gameLoop();
</script>
</body>
</html>
