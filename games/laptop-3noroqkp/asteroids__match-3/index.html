<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids Match-3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a1a; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: monospace;
        }
        canvas { 
            display: block; 
            max-width: 100vw; 
            max-height: 100vh; 
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, gridX, gridY, gridSize = 8;
let stars = [];
let gameStarted = false;
let score = 0;
let combo = 0;
let maxCombo = 0;
let moves = 0;
let particles = [];
let shakeTime = 0;
let shakeIntensity = 0;

const TYPES = [
    { name: 'Iron', color: '#ff6b35', glow: '#ff9a5c' },
    { name: 'Crystal', color: '#4ecdc4', glow: '#7efff7' },
    { name: 'Plasma', color: '#c77dff', glow: '#e0a0ff' },
    { name: 'Solar', color: '#ffd93d', glow: '#ffe97d' },
    { name: 'Void', color: '#6b7280', glow: '#9ca3af' },
    { name: 'Nova', color: '#ff4d6d', glow: '#ff8fa3' }
];

let grid = [];
let animating = false;
let selectedCell = null;
let swapAnim = null;
let fallingTiles = [];
let matchedCells = [];
let spawnQueue = [];
let gameLoopId = null;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellSize = Math.min(W, H) * 0.85 / gridSize;
    gridX = (W - cellSize * gridSize) / 2;
    gridY = (H - cellSize * gridSize) / 2 - 20;
}

function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() *H,
            r: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.3 + 0.1,
            twinkle: Math.random() * Math.PI * 2
        });
    }
}

function initGrid() {
    grid = [];
    for (let r = 0; r < gridSize; r++) {
        grid[r] = [];
        for (let c = 0; c < gridSize; c++) {
            let type;
            do { type = Math.floor(Math.random() * TYPES.length); } 
            while (wouldMatch(r, c, type));
            grid[r][c] = { type: type, x: c * cellSize, y: r * cellSize, scale: 1, alpha: 1 };
        }
    }
}

function wouldMatch(r, c, type) {
    if (c >= 2 && grid[r][c-1] && grid[r][c-2] && grid[r][c-1].type === type && grid[r][c-2].type === type) return true;
    if (r >= 2 && grid[r-1][c] && grid[r-2][c] && grid[r-1][c].type === type && grid[r-2][c].type === type) return true;
    return false;
}

function getCellAt(mx, my) {
    let c = Math.floor((mx - gridX) / cellSize);
    let r = Math.floor((my - gridY) / cellSize);
    if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) return { r, c };
    return null;
}

function areAdjacent(a, b) {
    return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
}

function findMatches() {
    let matches = new Set();
    // Horizontal
    for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize - 2; c++) {
            if (grid[r][c] && grid[r][c+1] && grid[r][c+2]) {
                let t = grid[r][c].type;
                if (grid[r][c+1].type === t && grid[r][c+2].type === t) {
                    matches.add(r + ',' + c);
                    matches.add(r + ',' + (c+1));
                    matches.add(r + ',' + (c+2));
                    let cc = c + 3;
                    while (cc < gridSize && grid[r][cc] && grid[r][cc].type === t) {
                        matches.add(r + ',' + cc);
                        cc++;
                    }
                }
            }
        }
    }
    // Vertical
    for (let c = 0; c < gridSize; c++) {
        for (let r = 0; r < gridSize - 2; r++) {
            if (grid[r][c] && grid[r+1][c] && grid[r+2][c]) {
                let t = grid[r][c].type;
                if (grid[r+1][c].type === t && grid[r+2][c].type === t) {
                    matches.add(r + ',' + c);
                    matches.add((r+1) + ',' + c);
                    matches.add((r+2) + ',' + c);
                    let rr = r + 3;
                    while (rr < gridSize && grid[rr][c] && grid[rr][c].type === t) {
                        matches.add(rr + ',' + c);
                        rr++;
                    }
                }
            }
        }
    }
    return Array.from(matches).map(s => s.split(',').map(Number));
}

function startMatchSequence() {
    animating = true;
    let matches = findMatches();
    if (matches.length > 0) {
        combo++;
        maxCombo = Math.max(maxCombo, combo);
        score += matches.length * 10 * combo;
        shakeTime = 0.2;
        shakeIntensity = matches.length > 5 ? 4 : 2;
        
        for (let [r, c] of matches) {
            let tile = grid[r][c];
            spawnExplosion(gridX + c * cellSize + cellSize/2, gridY + r * cellSize + cellSize/2, TYPES[tile.type].color);
            grid[r][c] = null;
        }
        
        setTimeout(() => {
            applyGravity();
            fillGrid();
            setTimeout(() => {
                startMatchSequence();
            }, 300);
        }, 250);
    } else {
        combo = 0;
        animating = false;
        moves++;
    }
}

function applyGravity() {
    for (let c = 0; c < gridSize; c++) {
        let writeRow = gridSize - 1;
        for (let r = gridSize - 1; r >= 0; r--) {
            if (grid[r][c]) {
                grid[writeRow][c] = grid[r][c];
                if (writeRow !== r) grid[r][c] = null;
                writeRow--;
            }
        }
    }
}

function fillGrid() {
    for (let c = 0; c < gridSize; c++) {
        for (let r = 0; r < gridSize; r++) {
            if (!grid[r][c]) {
                grid[r][c] = { 
                    type: Math.floor(Math.random() * TYPES.length), 
                    x: c * cellSize, 
                    y: -(gridSize - r) * cellSize, 
                    scale: 1, 
                    alpha: 1, 
                    targetY: r * cellSize
                };
            } else {
                grid[r][c].targetY = r * cellSize;
            }
        }
    }
}

function spawnExplosion(x, y, color) {
    for (let i = 0; i < 12; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 4 + 2;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            r: Math.random() * 4 + 2,
            color: color
        });
    }
}

function playSound(freq, duration) {
    try {
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
        setTimeout(() => { audioCtx.close(); }, 500);
    } catch(e) {}
}

function handleInput() {
    if (!gameStarted) gameStarted = true;
}

canvas.addEventListener('click', (e) => {
    if (!gameStarted) { 
        gameStarted = true; 
        playSound(440, 0.15); 
        return; 
    }
    handleInput();
    if (animating || swapAnim) return;
    
    let rect = canvas.getBoundingClientRect();
    let mx = e.clientX - rect.left;
    let my = e.clientY - rect.top;
    let cell = getCellAt(mx, my);
    if (!cell) { selectedCell = null; return; }
    
    if (selectedCell) {
        if (areAdjacent(selectedCell, cell)) {
            doSwap(selectedCell, cell);
            selectedCell = null;
        } else {
            selectedCell = cell;
        }
    } else {
        selectedCell = cell;
    }
});

let dragStart = null;
canvas.addEventListener('mousedown', (e) => {
    let rect = canvas.getBoundingClientRect();
    dragStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
});
canvas.addEventListener('mouseup', (e) => {
    if (!dragStart || !gameStarted || animating || swapAnim) return;
    let rect = canvas.getBoundingClientRect();
    let dx = e.clientX - rect.left - dragStart.x;
    let dy = e.clientY - rect.top - dragStart.y;
    let cell = getCellAt(dragStart.x, dragStart.y);
    if (cell && Math.abs(dx) > 15 || Math.abs(dy) > 15) {
        let dirR = 0, dirC = 0;
        if (Math.abs(dx) > Math.abs(dy)) dirC = dx > 0 ? 1 : -1;
        else dirR = dy > 0 ? 1 : -1;
        let target = { r: cell.r + dirR, c: cell.c + dirC };
        if (target.r >= 0 && target.r < gridSize && target.c >= 0 && target.c < gridSize) {
            doSwap(cell, target);
            selectedCell = null;
        }
    }
    dragStart = null;
});

function doSwap(a, b) {
    swapAnim = { a: a, b: b, t: 0 };
    playSound(330, 0.1);
}

function startGame() {
    score = 0;
    combo = 0;
    maxCombo = 0;
    moves = 0;
    particles = [];
    selectedCell = null;
    swapAnim = null;
    animating = false;
    initGrid();
}

function drawAsteroid(x, y, size, type, scale) {
    let t = TYPES[type];
    ctx.save();
    ctx.translate(x + size/2, y + size/2);
    ctx.scale(scale, scale);
    
    // Glow
    ctx.shadowColor = t.glow;
    ctx.shadowBlur = 8;
    
    // Main body - rocky circle
    let r = size * 0.38;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
        let angle = (i / 12) * Math.PI * 2;
        let rr = r + Math.sin(angle * 3 + type) * r * 0.15 + Math.cos(angle * 5 + type * 2) * r * 0.1;
        if (i === 0) ctx.moveTo(Math.cos(angle) * rr, Math.sin(angle) * rr);
        else ctx.lineTo(Math.cos(angle) * rr, Math.sin(angle) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = t.color;
    ctx.fill();
    
    // Inner detail
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
        let angle = (i / 8) * Math.PI * 2 + type;
        let rr = r * 0.5 + Math.sin(angle * 4 + type * 3) * r * 0.1;
        if (i === 0) ctx.moveTo(Math.cos(angle) * rr, Math.sin(angle) * rr);
        else ctx.lineTo(Math.cos(angle) * rr, Math.sin(angle) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = t.glow;
    ctx.globalAlpha = 0.4;
    ctx.fill();
    
    // Crater dots
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 3; i++) {
        let cx = Math.cos(i * 2.1 + type) * r * 0.4;
        let cy = Math.sin(i * 2.1 + type) * r * 0.4;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.15, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
    }
    
    ctx.restore();
}

function draw() {
    let time = performance.now() / 1000;
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    for (let s of stars) {
        let twinkle = Math.sin(time * 2 + s.twinkle) * 0.5 + 0.5;
        ctx.globalAlpha = 0.3 + twinkle * 0.7;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    if (!gameStarted) {
        drawStartScreen(time);
        requestAnimationFrame(draw);
        return;
    }
    
    // Shake
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
        shakeTime -= 1/60;
        sx = (Math.random() - 0.5) * shakeIntensity * 2;
        sy = (Math.random() - 0.5) * shakeIntensity * 2;
    }
    
    ctx.save();
    ctx.translate(sx, sy);
    
    // Grid background
    ctx.fillStyle = 'rgba(30, 30, 60, 0.5)';
    ctx.strokeStyle = 'rgba(100, 100, 200, 0.3)';
    ctx.lineWidth = 1;
    for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
            let x = gridX + c * cellSize;
            let y = gridY + r * cellSize;
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.strokeRect(x, y, cellSize, cellSize);
        }
    }
    
    // Tiles
    for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
            let tile = grid[r] && grid[r][c];
            if (!tile) continue;
            
            let tx = gridX + tile.x;
            let ty = gridY + tile.y;
            
            // Animate falling
            if (tile.targetY !== undefined && Math.abs(tile.y - tile.targetY) > 1) {
                tile.y += (tile.targetY - tile.y) * 0.15;
                if (Math.abs(tile.y - tile.targetY) < 1) tile.y = tile.targetY;
            }
            
            drawAsteroid(tx, ty, cellSize, tile.type, tile.scale || 1);
        }
    }
    
    // Swap animation
    if (swapAnim) {
        swapAnim.t += 0.08;
        let t = swapAnim.t;
        if (t >= 1) {
            let a = swapAnim.a, b = swapAnim.b;
            let tmp = grid[a.r][a.c];
            grid[a.r][a.c] = grid[b.r][b.c];
            grid[b.r][b.c] = tmp;
            if (grid[a.r][a.c]) { grid[a.r][a.c].x = a.c * cellSize; grid[a.r][a.c].y = a.r * cellSize; }
            if (grid[b.r][b.c]) { grid[b.r][b.c].x = b.c * cellSize; grid[b.r][b.c].y = b.r * cellSize; }
            swapAnim = null;
            startMatchSequence();
        } else {
            let ease = t < 0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
            let a = swapAnim.a, b = swapAnim.b;
            let ta = grid[a.r][a.c], tb = grid[b.r][b.c];
            if (ta) { ta.x = a.c * cellSize + (b.c - a.c) * ease * cellSize / cellSize * 0; }
        }
    }
    
    // Selection highlight
    if (selectedCell && !animating) {
        let x = gridX + selectedCell.c * cellSize;
        let y = gridY + selectedCell.r * cellSize;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#4ecdc4';
        ctx.shadowBlur = 10;
        ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
        ctx.shadowBlur = 0;
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(24, W/30)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, gridX, gridY - 15);
    ctx.textAlign = 'right';
    ctx.fillText(`Moves: ${moves}  Combo: x${combo || 1}`, gridX + gridSize * cellSize, gridY - 15);
    
    // Type legend
    let legendY = gridY + gridSize * cellSize + 20;
    let legendSpacing = W / TYPES.length;
    ctx.font = `${Math.min(12, W/60)}px monospace`;
    ctx.textAlign = 'center';
    for (let i = 0; i < TYPES.length; i++) {
        let lx = gridX + legendSpacing * i + legendSpacing / 2;
        drawAsteroid(lx - 15, legendY - 5, 30, i, 0.7);
        ctx.fillStyle = TYPES[i].color;
        ctx.fillText(TYPES[i].name, lx, legendY + 28);
    }
    
    ctx.restore();
    requestAnimationFrame(draw);
}

function drawStartScreen(time) {
    let titleSize = Math.min(48, W / 15);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${titleSize}px monospace`;
    
    let pulse = Math.sin(time * 2) * 0.3 + 0.7;
    ctx.shadowColor = '#4ecdc4';
    ctx.shadowBlur = 20 * pulse;
    ctx.fillText('ASTEROIDS', W/2, H/2 - 60);
    ctx.font = `bold ${titleSize * 0.6}px monospace`;
    ctx.fillText('MATCH-3', W/2, H/2 - 10);
    
    ctx.shadowBlur = 0;
    ctx.font = `${Math.min(18, W/40)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('Swap adjacent asteroids to match 3 or more', W/2, H/2 + 50);
    ctx.fillText('Click to select, click adjacent to swap (or drag)', W/2, H/2 + 80);
    
    ctx.fillStyle = `rgba(78, 205, 196, ${pulse})`;
    ctx.font = `bold ${Math.min(24, W/30)}px monospace`;
    ctx.fillText('>>> CLICK TO START <<<', W/2, H/2 + 150);
    
    // Decorative asteroids
    for (let i = 0; i < 6; i++) {
        let angle = time * 0.5 + i * Math.PI / 3;
        let ax = W/2 + Math.cos(angle) * (W * 0.3);
        let ay = H/2 + Math.sin(angle) * (H * 0.3);
        drawAsteroid(ax - 15, ay - 15, 30, i % TYPES.length, 0.6);
    }
}

window.addEventListener('resize', () => { resize(); initStars(); });
resize();
initStars();
startGame();
requestAnimationFrame(draw);
</script>
</body>
</html>
