<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Player Golf</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function hitSound() { playSound(220, 0.15, 'square', 0.4); }
function bounceSound() { playSound(150, 0.1, 'triangle', 0.3); }
function holeSound() { playSound(600, 0.5, 'sine', 0.5); setTimeout(() => playSound(800, 0.4, 'sine', 0.4), 100); }

// Game state
let gameState = 'start'; // start, playing, won
let currentPlayer = 1;
let scores = { 1: 0, 2: 0 };
let holeDone = { 1: false, 2: false };
let winner = 0;

const FRICTION = 0.985;
const BOUNCE_DAMPING = 0.7;
const HOLE_RADIUS = 20;
const BALL_RADIUS = 10;
const MAX_POWER = 15;

let balls = [];
let obstacles = [];
let holePos = { x: 0, y: 0 };
let aiming = false;
let aimStart = { x: 0, y: 0 };
let aimEnd = { x: 0, y: 0 };
let particles = [];

function resetCourse() {
    const cx = W / 2;
    const cy = H / 2;
    holePos = { x: cx + (Math.random() - 0.5) * W * 0.3, y: cy + (Math.random() - 0.5) * H * 0.3 };
    
    balls = [
        { x: cx - W * 0.25, y: cy - H * 0.15, vx: 0, vy: 0, player: 1, inHole: false },
        { x: cx + W * 0.25, y: cy + H * 0.15, vx: 0, vy: 0, player: 2, inHole: false }
    ];
    
    obstacles = [];
    // Random obstacles
    const numObs = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < numObs; i++) {
        let ox, oy, ow, oh;
        let valid = false;
        for (let attempt = 0; attempt < 50 && !valid; attempt++) {
            ow = 40 + Math.random() * 100;
            oh = 20 + Math.random() * 60;
            ox = 80 + Math.random() * (W - 160);
            oy = 80 + Math.random() * (H - 160);
            valid = true;
            // Check not overlapping hole
            const hDist = Math.hypot(holePos.x - (ox + ow/2), holePos.y - (oy + oh/2));
            if (hDist < HOLE_RADIUS + 60) valid = false;
            // Check not overlapping balls
            for (let b of balls) {
                const bDist = Math.hypot(b.x - (ox + ow/2), b.y - (oy + oh/2));
                if (bDist < BALL_RADIUS + 50) valid = false;
            }
        }
        if (valid) obstacles.push({ x: ox, y: oy, w: ow, h: oh });
    }
    
    scores = { 1: 0, 2: 0 };
    holeDone = { 1: false, 2: false };
    currentPlayer = 1;
    particles = [];
}

function startGame() {
    initAudio();
    resetCourse();
    gameState = 'playing';
}

// Input
let mouseDown = false;
let mouseX = 0, mouseY = 0;

function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x, y };
}

function onMouseDown(e) {
    e.preventDefault();
    initAudio();
    const pos = getMousePos(e);
    mouseX = pos.x; mouseY = pos.y;
    
    if (gameState === 'start' || gameState === 'won') {
        startGame();
        return;
    }
    
    if (gameState !== 'playing') return;
    
    const ball = balls.find(b => b.player === currentPlayer && !b.inHole);
    if (!ball) return;
    
    const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
    if (dist < 40) {
        aiming = true;
        aimStart = { x: ball.x, y: ball.y };
        aimEnd = { x: pos.x, y: pos.y };
    }
}

function onMouseMove(e) {
    e.preventDefault();
    const pos = getMousePos(e);
    mouseX = pos.x; mouseY = pos.y;
    if (aiming) {
        aimEnd = { x: pos.x, y: pos.y };
    }
}

function onMouseUp(e) {
    e.preventDefault();
    if (gameState !== 'playing' || !aiming) return;
    
    const ball = balls.find(b => b.player === currentPlayer && !b.inHole);
    if (!ball) { aiming = false; return; }
    
    const dx = aimStart.x - aimEnd.x;
    const dy = aimStart.y - aimEnd.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 10) {
        const power = Math.min(dist / 15, MAX_POWER);
        const angle = Math.atan2(dy, dx);
        ball.vx = Math.cos(angle) * power;
        ball.vy = Math.sin(angle) * power;
        scores[currentPlayer]++;
        hitSound();
    }
    
    aiming = false;
}

canvas.addEventListener('mousedown', onMouseDown);
canvas.addEventListener('mousemove', onMouseMove);
canvas.addEventListener('mouseup', onMouseUp);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; onMouseDown({ preventDefault:()=>{}, clientX: t.clientX, clientY: t.clientY }); }, {passive:false});
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0]; onMouseMove({ preventDefault:()=>{}, clientX: t.clientX, clientY: t.clientY }); }, {passive:false});
canvas.addEventListener('touchend', (e) => { e.preventDefault(); onMouseUp({ preventDefault:()=>{} }); });

window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
        startGame();
    }
    if (e.key === ' ' && (gameState === 'start' || gameState === 'won')) {
        startGame();
    }
});

// Physics
function update() {
    if (gameState !== 'playing') return;
    
    let anyMoving = false;
    
    for (let ball of balls) {
        if (ball.inHole) continue;
        
        if (Math.abs(ball.vx) > 0.1 || Math.abs(ball.vy) > 0.1) {
            anyMoving = true;
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= FRICTION;
            ball.vy *= FRICTION;
            
            if (Math.abs(ball.vx) < 0.1 && Math.abs(ball.vy) < 0.1) {
                ball.vx = 0;
                ball.vy = 0;
            }
            
            // Wall collisions
            if (ball.x - BALL_RADIUS < 5) { ball.x = 5 + BALL_RADIUS; ball.vx = -ball.vx * BOUNCE_DAMPING; bounceSound(); }
            if (ball.x + BALL_RADIUS > W - 5) { ball.x = W - 5 - BALL_RADIUS; ball.vx = -ball.vx * BOUNCE_DAMPING; bounceSound(); }
            if (ball.y - BALL_RADIUS < 5) { ball.y = 5 + BALL_RADIUS; ball.vy = -ball.vy * BOUNCE_DAMPING; bounceSound(); }
            if (ball.y + BALL_RADIUS > H - 5) { ball.y = H - 5 - BALL_RADIUS; ball.vy = -ball.vy * BOUNCE_DAMPING; bounceSound(); }
            
            // Obstacle collisions
            for (let obs of obstacles) {
                if (ball.x + BALL_RADIUS > obs.x && ball.x - BALL_RADIUS < obs.x + obs.w &&
                    ball.y + BALL_RADIUS > obs.y && ball.y - BALL_RADIUS < obs.y + obs.h) {
                    // Find closest edge
                    const left = Math.abs(ball.x - obs.x);
                    const right = Math.abs((obs.x + obs.w) - ball.x);
                    const top = Math.abs(ball.y - obs.y);
                    const bottom = Math.abs((obs.y + obs.h) - ball.y);
                    
                    const min = Math.min(left, right, top, bottom);
                    if (min === left) { ball.x = obs.x - BALL_RADIUS; ball.vx = -Math.abs(ball.vx) * BOUNCE_DAMPING; bounceSound(); }
                    else if (min === right) { ball.x = obs.x + obs.w + BALL_RADIUS; ball.vx = Math.abs(ball.vx) * BOUNCE_DAMPING; bounceSound(); }
                    else if (min === top) { ball.y = obs.y - BALL_RADIUS; ball.vy = -Math.abs(ball.vy) * BOUNCE_DAMPING; bounceSound(); }
                    else { ball.y = obs.y + obs.h + BALL_RADIUS; ball.vy = Math.abs(ball.vy) * BOUNCE_DAMPING; bounceSound(); }
                }
            }
            
            // Hole check
            const hDist = Math.hypot(ball.x - holePos.x, ball.y - holePos.y);
            if (hDist < HOLE_RADIUS && Math.hypot(ball.vx, ball.vy) < 8) {
                ball.inHole = true;
                ball.vx = 0;
                ball.vy = 0;
                holeDone[ball.player] = true;
                holeSound();
                spawnParticles(holePos.x, holePos.y, ball.player === 1 ? '#4fc3f7' : '#ef5350');
                
                if (holeDone[1] && holeDone[2]) {
                    gameState = 'won';
                    if (scores[1] < scores[2]) winner = 1;
                    else if (scores[2] < scores[1]) winner = 2;
                    else winner = 0; // tie
                }
            }
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life -= 1;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 30 + Math.random()*20, color });
    }
}

// Rendering
function draw() {
    // Background - green course
    ctx.fillStyle = '#2d6a4f';
    ctx.fillRect(0, 0, W, H);
    
    // Course texture
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i < W; i += 40) {
        for (let j = 0; j < H; j += 40) {
            if ((i + j) % 80 === 0) ctx.fillRect(i, j, 20, 20);
        }
    }
    
    // Border
    ctx.strokeStyle = '#1b4332';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, W - 10, H - 10);
    
    // Obstacles
    for (let obs of obstacles) {
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
        // Texture lines
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.lineWidth = 1;
        for (let ly = obs.y + 10; ly < obs.y + obs.h; ly += 10) {
            ctx.beginPath();
            ctx.moveTo(obs.x, ly);
            ctx.lineTo(obs.x + obs.w, ly);
            ctx.stroke();
        }
    }
    
    // Hole
    ctx.beginPath();
    ctx.arc(holePos.x, holePos.y, HOLE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a1a';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Hole flag
    ctx.beginPath();
    ctx.moveTo(holePos.x, holePos.y - HOLE_RADIUS);
    ctx.lineTo(holePos.x, holePos.y - HOLE_RADIUS - 30);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(holePos.x, holePos.y - HOLE_RADIUS - 30);
    ctx.lineTo(holePos.x + 15, holePos.y - HOLE_RADIUS - 22);
    ctx.lineTo(holePos.x, holePos.y - HOLE_RADIUS - 14);
    ctx.fillStyle = '#ff5722';
    ctx.fill();
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Balls
    for (let ball of balls) {
        if (ball.inHole) continue;
        
        const color = ball.player === 1 ? '#4fc3f7' : '#ef5350';
        const glowColor = ball.player === 1 ? 'rgba(79,195,247,0.3)' : 'rgba(239,83,80,0.3)';
        
        // Glow for current player's ball
        if (ball.player === currentPlayer && gameState === 'playing' && !holeDone[ball.player]) {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS + 6, 0, Math.PI * 2);
            ctx.fillStyle = glowColor;
            ctx.fill();
        }
        
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Player number on ball
        ctx.fillStyle = color;
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ball.player, ball.x, ball.y);
    }
    
    // Aiming
    if (aiming) {
        const dx = aimStart.x - aimEnd.x;
        const dy = aimStart.y - aimEnd.y;
        const dist = Math.hypot(dx, dy);
        const power = Math.min(dist / 15, MAX_POWER);
        
        // Direction line
        ctx.beginPath();
        ctx.moveTo(aimStart.x, aimStart.y);
        ctx.lineTo(aimStart.x + dx, aimStart.y + dy);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        // Power indicator
        const powerPct = Math.round((power / MAX_POWER) * 100);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(aimStart.x - 30, aimStart.y - 35, 60, 20);
        ctx.fillStyle = powerPct > 80 ? '#f44336' : powerPct > 50 ? '#ff9800' : '#4caf50';
        ctx.fillRect(aimStart.x - 28, aimStart.y - 33, (powerPct / 100) * 56, 16);
        ctx.fillStyle = '#fff';
        ctx.font = '11px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(powerPct + '%', aimStart.x, aimStart.y - 24);
        
        // Arrow head
        const angle = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.moveTo(aimStart.x + dx, aimStart.y + dy);
        ctx.lineTo(aimStart.x + dx - Math.cos(angle - 0.4) * 12, aimStart.y + dy - Math.sin(angle - 0.4) * 12);
        ctx.lineTo(aimStart.x + dx - Math.cos(angle + 0.4) * 12, aimStart.y + dy - Math.sin(angle + 0.4) * 12);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fill();
    }
    
    // UI
    drawUI();
}

function drawUI() {
    if (gameState === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⛳ Two Player Golf', W/2, H/2 - 60);
        
        ctx.font = '20px Arial';
        ctx.fillStyle = '#a5d6a7';
        ctx.fillText('Player 1 (Blue) vs Player 2 (Red)', W/2, H/2 - 10);
        ctx.fillStyle = '#ccc';
        ctx.font = '16px Arial';
        ctx.fillText('Click and drag from your ball to aim', W/2, H/2 + 30);
        ctx.fillText('Drag distance = power (opposite direction)', W/2, H/2 + 55);
        ctx.fillText('Get both balls in the hole - fewest strokes wins!', W/2, H/2 + 80);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText('Click or Press SPACE to Start', W/2, H/2 + 130);
        
        ctx.font = '14px Arial';
        ctx.fillStyle = '#999';
        ctx.fillText('Press R to restart at any time', W/2, H/2 + 170);
    }
    
    if (gameState === 'won') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        
        let msg;
        if (winner === 0) msg = "🏆 IT'S A TIE!";
        else msg = `🏆 Player ${winner} WINS!`;
        ctx.fillText(msg, W/2, H/2 - 40);
        
        ctx.font = '24px Arial';
        ctx.fillStyle = '#4fc3f7';
        ctx.fillText(`Player 1: ${scores[1]} strokes`, W/2 - 150, H/2 + 20);
        ctx.fillStyle = '#ef5350';
        ctx.fillText(`Player 2: ${scores[2]} strokes`, W/2 + 150, H/2 + 20);
        
        ctx.fillStyle = '#fff';
        ctx.font = '20px Arial';
        ctx.fillText('Click to Play Again (or press R)', W/2, H/2 + 70);
    }
    
    if (gameState === 'playing') {
        // Score panel
        const panelW = 280;
        const panelH = 50;
        const panelX = (W - panelW) / 2;
        
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(panelX, 10, panelW, panelH);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(panelX, 10, panelW, panelH);
        
        // P1
        ctx.fillStyle = holeDone[1] ? '#4caf50' : '#4fc3f7';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'left';
        let p1text = `P1: ${scores[1]} stroke${scores[1]!==1?'s':''}`;
        if (holeDone[1]) p1text += ' ✓';
        ctx.fillText(p1text, panelX + 15, 40);
        
        // P2
        ctx.fillStyle = holeDone[2] ? '#4caf50' : '#ef5350';
        ctx.textAlign = 'right';
        let p2text = `P2: ${scores[2]} stroke${scores[2]!==1?'s':''}`;
        if (holeDone[2]) p2text += ' ✓';
        ctx.fillText(p2text, panelX + panelW - 15, 40);
        
        // Turn indicator
        if (!holeDone[currentPlayer]) {
            const turnColor = currentPlayer === 1 ? '#4fc3f7' : '#ef5350';
            ctx.fillStyle = turnColor;
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`P${currentPlayer}'s Turn`, W/2, panelY + 68);
        } else if (!holeDone[1] || !holeDone[2]) {
            const nextP = holeDone[1] ? 2 : 1;
            const turnColor = nextP === 1 ? '#4fc3f7' : '#ef5350';
            ctx.fillStyle = turnColor;
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`P${nextP}'s Turn`, W/2, 68);
        }
    }
}

let panelY = 0; // dummy to avoid error

        const ball1 = balls[0];

        // Update curPlayer based on hole status
        if (holeDone[1] && !holeDone[2]) curPlayer = 2;

function drawUI_main() {
    // Replace draw with main rendering that uses curPlayer
    ctx.clearRect(0, 0, W, H);
    
    // Background
    ctx.fillStyle = '#2d6a4f';
    ctx.fillRect(0, 0, W, H);
    
    // Course texture dots
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (let i = 0; i < W * H / 2000; i++) {
        const tx = Math.random() * W;
        const ty = Math.random() * H;
        ctx.fillRect(tx, ty, 2, 2);
    }
    
    // Border
    ctx.strokeStyle = '#1b4332';
    ctx.lineWidth = 10;
    ctx.strokeRect(5, 5, W - 10, H - 10);
    
    // Obstacles
    for (let obs of obstacles) {
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }
    
    // Hole
    ctx.beginPath();
    ctx.arc(holePos.x, holePos.y, HOLE_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Flag
    ctx.beginPath();
    ctx.moveTo(holePos.x, holePos.y - HOLE_RADIUS);
    ctx.lineTo(holePos.x, holePos.y - HOLE_RADIUS - 25);
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(holePos.x, holePos.y - HOLE_RADIUS - 25);
    ctx.lineTo(holePos.x + 14, holePos.y - HOLE_RADIUS - 18);
    ctx.lineTo(holePos.x, holePos.y - HOLE_RADIUS - 11);
    ctx.fillStyle = '#ff5722';
    ctx.fill();
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 50);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Balls
    for (let ball of balls) {
        if (ball.inHole) continue;
        
        const color = ball.player === 1 ? '#4fc3f7' : '#ef5350';
        
        if (ball.player === curPlayer && gameState === 'playing') {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS + 5, 0, Math.PI * 2);
            ctx.fillStyle = ball.player === 1 ? 'rgba(79,195,247,0.3)' : 'rgba(239,83,80,0.3)';
            ctx.fill();
        }
        
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.fillStyle = color;
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ball.player, ball.x, ball.y);
    }
    
    // Aiming
    if (aiming) {
        const dx = aimStart.x - aimEnd.x;
        const dy = aimStart.y - aimEnd.y;
        const dist = Math.hypot(dx, dy);
        const power = Math.min(dist / 15, MAX_POWER);
        
        ctx.beginPath();
        ctx.moveTo(aimStart.x, aimStart.y);
        ctx.lineTo(aimStart.x + dx, aimStart.y + dy);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        const powerPct = Math.round((power / MAX_POWER) * 100);
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(aimStart.x - 30, aimStart.y + 20, 60, 18);
        ctx.fillStyle = powerPct > 80 ? '#f44336' : powerPct > 50 ? '#ff9800' : '#4caf50';
        ctx.fillRect(aimStart.x - 28, aimStart.y + 22, (powerPct / 100) * 56, 14);
        ctx.fillStyle = '#fff';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(powerPct + '%', aimStart.x, aimStart.y + 32);
        
        const angle = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.moveTo(aimStart.x + dx, aimStart.y + dy);
        ctx.lineTo(aimStart.x + dx - Math.cos(angle - 0.4) * 12, aimStart.y + dy - Math.sin(angle - 0.4) * 12);
        ctx.lineTo(aimStart.x + dx - Math.cos(angle + 0.4) * 12, aimStart.y + dy - Math.sin(angle + 0.4) * 12);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fill();
    }
    
    // Overlays and UI
    if (gameState === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⛳ Two Player Golf', W/2, H/2 - 70);
        
        ctx.font = '18px Arial';
        ctx.fillStyle = '#a5d6a7';
        ctx.fillText('Player 1 (Blue) vs Player 2 (Red)', W/2, H/2 - 30);
        
        ctx.fillStyle = '#ccc';
        ctx.font = '15px Arial';
        ctx.fillText('Click & drag from your ball to aim (pull back to shoot)', W/2, H/2 + 10);
        ctx.fillText('Drag distance sets power. Fewest strokes wins!', W/2, H/2 + 35);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Arial';
        const pulse = Math.sin(Date.now() / 400) * 0.3 + 0.7;
        ctx.globalAlpha = pulse;
        ctx.fillText('Click to Start', W/2, H/2 + 85);
        ctx.globalAlpha = 1;
        
        ctx.font = '13px Arial';
        ctx.fillStyle = '#888';
        ctx.fillText('Press R to restart', W/2, H/2 + 120);
    }
    
    if (gameState === 'won') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 44px Arial';
        ctx.textAlign = 'center';
        if (winner === 0) ctx.fillText("🏆 It's a Tie!", W/2, H/2 - 40);
        else ctx.fillText(`🏆 Player ${winner} Wins!`, W/2, H/2 - 40);
        
        ctx.font = '22px Arial';
        ctx.fillStyle = '#4fc3f7';
        ctx.fillText(`P1: ${scores[1]} stroke${scores[1]!==1?'s':''}`, W/2 - 130, H/2 + 15);
        ctx.fillStyle = '#ef5350';
        ctx.fillText(`P2: ${scores[2]} stroke${scores[2]!==1?'s':''}`, W/2 + 130, H/2 + 15);
        
        ctx.fillStyle = '#fff';
        ctx.font = '18px Arial';
        const pulse = Math.sin(Date.now() / 400) * 0.3 + 0.7;
        ctx.globalAlpha = pulse;
        ctx.fillText('Click to Play Again', W/2, H/2 + 65);
        ctx.globalAlpha = 1;
    }
    
    // Score panel during play
    if (gameState === 'playing') {
        const pw = 300;
        const px = (W - pw) / 2;
        
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.beginPath();
        ctx.roundRect(px, 8, pw, 42, 8);
        ctx.fill();
        
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'left';
        ctx.fillStyle = holeDone[1] ? '#4caf50' : '#4fc3f7';
        let t1 = `P1: ${scores[1]}`;
        if (holeDone[1]) t1 += ' ✓';
        ctx.fillText(t1, px + 12, 35);
        
        ctx.textAlign = 'right';
        ctx.fillStyle = holeDone[2] ? '#4caf50' : '#ef5350';
        let t2 = `${scores[2]} P2`;
        if (holeDone[2]) t2 += ' ✓';
        ctx.fillText(t2, px + pw - 12, 35);
        
        // Turn indicator
        if (!holeDone[curPlayer]) {
            const tc = curPlayer === 1 ? '#4fc3f7' : '#ef5350';
            ctx.fillStyle = tc;
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`▶ P${curPlayer} to hit`, W/2, 65);
        }
    }
}

// Polyfill roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.arcTo(x + w, y, x + w, y + r, r);
        this.lineTo(x + w, y + h - r);
        this.arcTo(x + w, y + h, x + w - r, y + h, r);
        this.lineTo(x + r, y + h);
        this.arcTo(x, y + h, x, y + h - r, r);
        this.lineTo(x, y + r);
        this.arcTo(x, y, x + r, y, r);
        this.closePath();
    };
}

// Patch mouse up to use curPlayer
const _savedOnMouseUp = onMouseUp;
function handleMouseUp(e) {
    e.preventDefault();
    if (gameState !== 'playing' || !aiming) return;
    
    const ball = balls.find(b => b.player === curPlayer && !b.inHole);
    if (!ball) { aiming = false; return; }
    
    const dx = aimStart.x - aimEnd.x;
    const dy = aimStart.y - aimEnd.y;
    const dist = Math.hypot(dx, dy);
    
    if (dist > 10) {
        const power = Math.min(dist / 15, MAX_POWER);
        const angle = Math.atan2(dy, dx);
        ball.vx = Math.cos(angle) * power;
        ball.vy = Math.sin(angle) * power;
        scores[curPlayer]++;
        hitSound();
    }
    
    aiming = false;
}

// Override event listeners
canvas.removeEventListener('mousedown', onMouseDown);
canvas.removeEventListener('mouseup', onMouseUp);
canvas.addEventListener('mousedown', (e) => {
    e.preventDefault();
    initAudio();
    const pos = getMousePos(e);
    mouseX = pos.x; mouseY = pos.y;
    
    if (gameState === 'start' || gameState === 'won') {
        startGame();
        return;
    }
    if (gameState !== 'playing') return;
    
    const ball = balls.find(b => b.player === curPlayer && !b.inHole);
    if (!ball) return;
    
    const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
    if (dist < 45) {
        aiming = true;
        aimStart = { x: ball.x, y: ball.y };
        aimEnd = { x: pos.x, y: pos.y };
    }
});
canvas.addEventListener('mousemove', (e) => {
    e.preventDefault();
    const pos = getMousePos(e);
    mouseX = pos.x; mouseY = pos.y;
    if (aiming) aimEnd = { x: pos.x, y: pos.y };
});
canvas.addEventListener('mouseup', handleMouseUp);

// Touch
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    const t = e.touches[0];
    const pos = getMousePos({ clientX: t.clientX, clientY: t.clientY });
    
    if (gameState === 'start' || gameState === 'won') { startGame(); return; }
    if (gameState !== 'playing') return;
    
    const ball = balls.find(b => b.player === curPlayer && !b.inHole);
    if (!ball) return;
    const dist = Math.hypot(pos.x - ball.x, pos.y - ball.y);
    if (dist < 45) {
        aiming = true;
        aimStart = { x: ball.x, y: ball.y };
        aimEnd = { x: pos.x, y: pos.y };
    }
}, {passive:false});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const pos = getMousePos({ clientX: t.clientX, clientY: t.clientY });
    if (aiming) aimEnd = { x: pos.x, y: pos.y };
}, {passive:false});

canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleMouseUp({ preventDefault:()=>{} }); }, {passive:false});

// Switch turn after ball stops
let lastStrokes = 0;
function checkTurnSwitch() {
    const totalStrokes = scores[1] + scores[2];
    if (totalStrokes > lastStrokes) {
        lastStrokes = totalStrokes;
        // Only switch if both balls are stopped and not in hole situation
        const b1 = balls[0], b2 = balls[1];
        const allStopped = (Math.abs(b1.vx) < 0.1 && Math.abs(b1.vy) < 0.1 || b1.inHole) &&
                          (Math.abs(b2.vx) < 0.1 && Math.abs(b2.vy) < 0.1 || b2.inHole);
        if (allStopped && !holeDone[1] && !holeDone[2]) {
            curPlayer = curPlayer === 1 ? 2 : 1;
        } else if (!holeDone[1] && holeDone[2]) {
            curPlayer = 1;
        } else if (holeDone[1] && !holeDone[2]) {
            curPlayer = 2;
        }
    }
}

// Final game loop
function finalLoop() {
    if (gameState === 'playing') {
        update();
        checkTurnSwitch();
        
        // Win check
        if (holeDone[1] && holeDone[2]) {
            gameState = 'won';
            if (scores[1] < scores[2]) winner = 1;
            else if (scores[2] < scores[1]) winner = 2;
            else winner = 0;
        }
    }
    
    drawUI_main();
    requestAnimationFrame(finalLoop);
}

// Init
resize();
resetCourse();
curPlayer = 1;
lastStrokes = 0;
requestAnimationFrame(finalLoop);
</script>
