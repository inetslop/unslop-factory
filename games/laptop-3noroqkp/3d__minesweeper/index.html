<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }

#startScreen {
  position: absolute; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
#startScreen h1 {
  font-size: clamp(2rem, 6vw, 4rem); color: #e94560;
  text-shadow: 0 4px 8px rgba(0,0,0,0.5), 0 0 20px rgba(233,69,96,0.3);
  margin-bottom: 20px; letter-spacing: 2px;
}
#startScreen .subtitle { color: #a0a0c0; font-size: clamp(0.9rem, 2vw, 1.2rem); margin-bottom: 30px; }
#startScreen .controls {
  color: #8888aa; font-size: clamp(0.8rem, 1.5vw, 1rem); line-height: 1.8;
  text-align: center; margin-bottom: 30px;
}
.difficulty-btns { display: flex; gap: 12px; margin-bottom: 24px; }
.difficulty-btns button {
  padding: 10px 20px; border: 2px solid #e94560; background: transparent;
  color: #e94560; font-size: 1rem; cursor: pointer; border-radius: 6px;
  transition: all 0.3s;
}
.difficulty-btns button:hover, .difficulty-btns button.selected {
  background: #e94560; color: #fff; transform: scale(1.05);
}
#startBtn {
  padding: 14px 40px; font-size: 1.3rem; border: none; border-radius: 8px;
  background: linear-gradient(135deg, #e94560, #c2304a); color: #fff;
  cursor: pointer; box-shadow: 0 6px 20px rgba(233,69,96,0.4);
  transition: transform 0.2s;
}
#startBtn:hover { transform: scale(1.05); }

#gameContainer {
  position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
}
#hud {
  display: flex; gap: 20px; align-items: center; padding: 12px 24px;
  background: linear-gradient(180deg, #16213e, #1a1a2e);
  border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.hud-item { color: #fff; font-size: clamp(1rem, 2vw, 1.3rem); font-weight: bold; }
.hud-item span { color: #e94560; }
#restartBtn {
  padding: 8px 20px; background: linear-gradient(135deg, #e94560, #c2304a);
  border: none; color: #fff; border-radius: 6px; cursor: pointer; font-size: 1rem;
}

#boardWrapper {
  flex: 1; display: flex; align-items: center; justify-content: center;
  perspective: 900px; width: 100%; height: calc(100% - 60px);
  overflow: hidden;
}
#board {
  transform-style: preserve-3d;
  transform: rotateX(28deg) translateY(40px);
  display: grid; gap: 2px; padding: 12px;
  background: rgba(0,0,0,0.3); border-radius: 12px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.3);
}

.cell {
  position: relative; width: var(--cell-size); height: var(--cell-size);
  transform-style: preserve-3d; transition: transform 0.3s ease;
}
.cell .top {
  position: absolute; inset: 0; border-radius: 4px;
  background: linear-gradient(135deg, #4a90d9, #2b6cb0);
  box-shadow: 0 4px 0 #1a4a8a, 0 6px 0 #0f3060, inset 0 1px 0 rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; font-size: calc(var(--cell-size) * 0.45);
  color: #fff; cursor: pointer; user-select: none;
  backface-visibility: hidden; transition: all 0.2s;
}
.cell .top:hover { background: linear-gradient(135deg, #5ba0e9, #3b7cc0); }

.cell.revealed .top {
  background: rgba(40, 60, 90, 0.6); box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
  transform: translateZ(-8px) scale(0.92);
}
.cell.revealed .top:hover { background: rgba(40, 60, 90, 0.6); }
.cell.mine-hit .top { background: #e94560 !important; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5) !important; }
.cell.mine-revealed .top { background: #ff6b6b; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); }
.cell.flagged .top::after {
  content: '🚩'; font-size: calc(var(--cell-size) * 0.55); position: absolute;
}
.cell .num-1 { color: #64ffda; } .cell .num-2 { color: #80deea; }
.cell .num-3 { color: #ff8a65; } .cell .num-4 { color: #ce93d8; }
.cell .num-5 { color: #ef5350; } .cell .num-6 { color: #66bb6a; }
.cell .num-7 { color: #fff176; } .cell .num-8 { color: #ffab91; }

#message {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: clamp(2rem, 5vw, 3.5rem); font-weight: bold; z-index: 50;
  text-shadow: 0 4px 10px rgba(0,0,0,0.6); pointer-events: none; opacity: 0;
  transition: opacity 0.5s;
}
#message.show { opacity: 1; }
#message.win { color: #66bb6a; }
#message.lose { color: #e94560; }

@keyframes shake {
  0%, 100% { transform: rotateX(28deg) translateY(40px); }
  10% { transform: rotateX(28deg) translateY(40px) translateX(-5px); }
  30% { transform: rotateX(28deg) translateY(40px) translateX(5px); }
  50% { transform: rotateX(28deg) translateY(40px) translateX(-3px); }
  70% { transform: rotateX(28deg) translateY(40px) translateX(3px); }
}
#board.shake { animation: shake 0.5s; }

@keyframes pulse-cell {
  0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); }
}
.cell.pulse .top { animation: pulse-cell 0.3s; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>MINESWEEPER 3D</h1>
  <p class="subtitle">Classic logic in a new dimension</p>
  <div class="difficulty-btns">
    <button data-diff="easy" onclick="selectDiff(this)">Easy 9×9</button>
    <button data-diff="medium" class="selected" onclick="selectDiff(this)">Medium 16×16</button>
    <button data-diff="hard" onclick="selectDiff(this)">Hard 16×24</button>
  </div>
  <p class="controls">Left Click: Reveal Cell<br>Right Click: Place Flag<br>Keys: R to Restart</p>
  <button id="startBtn" onclick="startGame()">START GAME</button>
</div>

<div id="gameContainer">
  <div id="hud">
    <div class="hud-item">⏱ <span id="timer">0</span></div>
    <div class="hud-item">💣 <span id="mineCount">0</span></div>
    <button id="restartBtn" onclick="resetGame()">↻ Restart</button>
  </div>
  <div id="boardWrapper">
    <div id="board"></div>
  </div>
</div>

<div id="message"></div>

<script>
let audioCtx = null;
let grid = [], rows, cols, totalMines, flagsPlaced, revealedCount, minesRemaining;
let gameActive = false, timerInterval = null, timeElapsed = 0, firstClick = true;
let diffRows, diffCols, diffMines;

const DIFFS = { easy: [9,9,10], medium: [16,16,40], hard: [16,24,99] };

function selectDiff(btn) {
  document.querySelectorAll('.difficulty-btns button').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'click') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'flag') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'boom') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
    osc.start(); osc.stop(audioCtx.currentTime + 0.7);
  } else if (type === 'win') {
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine'; o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.12);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.3);
      o.start(audioCtx.currentTime + i * 0.12); o.stop(audioCtx.currentTime + i * 0.12 + 0.3);
    });
  }
}

function startGame() {
  initAudio();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'flex';
  
  const sel = document.querySelector('.difficulty-btns button.selected');
  const diff = sel.dataset.diff;
  [diffRows, diffCols, totalMines] = DIFFS[diff];
  resetGame();
}

function resetGame() {
  gameActive = true; firstClick = true; timeElapsed = 0; flagsPlaced = 0; revealedCount = 0;
  minesRemaining = totalMines;
  document.getElementById('timer').textContent = '0';
  document.getElementById('mineCount').textContent = totalMines;
  document.getElementById('message').className = '';
  
  clearInterval(timerInterval);
  timerInterval = setInterval(() => { if (gameActive) { timeElapsed++; document.getElementById('timer').textContent = timeElapsed; } }, 1000);
  
  grid = Array.from({ length: rows * cols }, () => ({ mine: false, revealed: false, flagged: false, value: 0 }));
  buildBoard();
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
  board.style.setProperty('--cell-size', calcCellSize());
  
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r; cell.dataset.c = c;
      const top = document.createElement('div');
      top.className = 'top';
      cell.appendChild(top);
      
      cell.addEventListener('click', (e) => handleClick(r, c, e));
      cell.addEventListener('contextmenu', (e) => { e.preventDefault(); handleFlag(r, c); });
      
      board.appendChild(cell);
    }
  }
}

function calcCellSize() {
  const wrapper = document.getElementById('boardWrapper');
  const w = wrapper.clientWidth - 60;
  const h = wrapper.clientHeight - 80;
  const sizeW = (w / cols) - 4;
  const sizeH = (h / (rows * 1.2)) - 4;
  return Math.max(20, Math.min(sizeW, sizeH, 50)).toFixed(0) + 'px';
}

function placeMines(safeR, safeC) {
  const safe = new Set();
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const nr = safeR + dr, nc = safeC + dc;
    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) safe.add(nr * cols + nc);
  }
  
  let placed = 0;
  while (placed < totalMines) {
    const idx = Math.floor(Math.random() * rows * cols);
    if (!safe.has(idx) && !grid[idx].mine) {
      grid[idx].mine = true; placed++;
    }
  }
  
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    let count = 0;
    getNeighbors(r, c).forEach(([nr, nc]) => { if (grid[nr * cols + nc].mine) count++; });
    grid[r * cols + c].value = count;
  }
}

function getNeighbors(r, c) {
  const n = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (dr === 0 && dc === 0) continue;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) n.push([nr, nc]);
  }
  return n;
}

function handleClick(r, c) {
  if (!gameActive) return;
  const idx = r * cols + c;
  const cell = grid[idx];
  
  if (cell.flagged) return;
  
  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    grid[r * cols + c].mine = false;
  }
  
  if (cell.revealed) return;
  
  if (cell.mine) {
    loseGame(r, c); return;
  }
  
  revealCell(r, c);
  checkWin();
}

function revealCell(r, c) {
  const idx = r * cols + c;
  const cell = grid[idx];
  if (cell.revealed || cell.flagged) return;
  
  cell.revealed = true; revealedCount++;
  playSound('click');
  
  const el = getCellEl(r, c);
  el.classList.add('revealed');
  
  if (cell.value > 0) {
    el.firstChild.textContent = cell.value;
    el.firstChild.className = 'top num-' + cell.value;
  } else {
    el.firstChild.textContent = '';
    setTimeout(() => {
      getNeighbors(r, c).forEach(([nr, nc]) => {
        const n = grid[nr * cols + nc];
        if (!n.revealed && !n.flagged) revealCell(nr, nc);
      });
    }, 30);
  }
}

function handleFlag(r, c) {
  if (!gameActive) return;
  const idx = r * cols + c;
  const cell = grid[idx];
  if (cell.revealed) return;
  
  playSound('flag');
  cell.flagged = !cell.flagged;
  flagsPlaced += cell.flagged ? 1 : -1;
  minesRemaining = totalMines - flagsPlaced;
  document.getElementById('mineCount').textContent = Math.max(0, minesRemaining);
  
  const el = getCellEl(r, c);
  el.classList.toggle('flagged', cell.flagged);
}

function loseGame(hitR, hitC) {
  gameActive = false; clearInterval(timerInterval);
  playSound('boom');
  
  const board = document.getElementById('board');
  board.classList.add('shake');
  setTimeout(() => board.classList.remove('shake'), 500);
  
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const idx = r * cols + c;
    if (grid[idx].mine) {
      grid[idx].revealed = true;
      const el = getCellEl(r, c);
      el.classList.add('revealed', 'mine-revealed');
      el.firstChild.textContent = '💣';
    }
  }
  
  const hitEl = getCellEl(hitR, hitC);
  hitEl.classList.add('mine-hit');
  hitEl.firstChild.textContent = '💥';
  
  showMessage('💀 BOOM!', 'lose');
}

function checkWin() {
  if (revealedCount === rows * cols - totalMines) {
    gameActive = false; clearInterval(timerInterval);
    playSound('win');
    
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      if (!grid[idx].revealed && grid[idx].mine) {
        grid[idx].flagged = true;
        flagsPlaced++;
        const el = getCellEl(r, c);
        el.classList.add('flagged');
      }
    }
    document.getElementById('mineCount').textContent = '0';
    showMessage('🏆 YOU WIN!', 'win');
  }
}

function getCellEl(r, c) {
  return document.getElementById('board').children[r * cols + c];
}

function showMessage(text, cls) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'show ' + cls;
  setTimeout(() => { msg.className = ''; }, 3000);
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    if (document.getElementById('gameContainer').style.display === 'flex') resetGame();
  }
});

window.addEventListener('resize', () => {
  if (document.getElementById('gameContainer').style.display === 'flex') {
    document.getElementById('board').style.setProperty('--cell-size', calcCellSize());
  }
});

// Initialize sizes when game starts
function startGameWithSize() {
  const sel = document.querySelector('.difficulty-btns button.selected');
  const diff = sel.dataset.diff;
  [diffRows, diffCols, totalMines] = DIFFS[diff];
  rows = diffRows; cols = diffCols;
  startGame();
}

// Override startGame to set dimensions
const origStart = startGame;
window.startGame = function() {
  initAudio();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameContainer').style.display = 'flex';
  
  const sel = document.querySelector('.difficulty-btns button.selected');
  const diff = sel.dataset.diff;
  [rows, cols, totalMines] = DIFFS[diff];
  resetGame();
};

window.resetGame = resetGame;
</script>
</body>
</html>
