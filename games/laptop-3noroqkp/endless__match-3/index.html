<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Cascade - Match 3 Endless</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let W, H, cellSize, boardX, boardY, gridSize = 8;
    let score = 0;
    let combo = 0;
    let bestScore = 0;
    let gameState = 'start'; // start, playing, animating
    let selected = null;
    let swapAnim = null;
    let particles = [];
    let floatTexts = [];
    let shakeTime = 0;
    let shakeIntensity = 0;

    const GEM_TYPES = 6;
    const GEM_COLORS = [
        { main: '#ff4757', light: '#ff6b81', dark: '#c0392b' },
        { main: '#2ed573', light: '#7bed9f', dark: '#27ae60' },
        { main: '#1e90ff', light: '#54a9ff', dark: '#2980b9' },
        { main: '#ffa502', light: '#ffc048', dark: '#e67e22' },
        { main: '#a29bfe', light: '#c3beff', dark: '#6c5ce7' },
        { main: '#fd79a8', light: '#fab1c9', dark: '#e84393' }
    ];

    let board = [];
    let fallingGems = [];
    let removingGems = [];
    let newGems = [];
    let animTimer = 0;
    let cascadeDepth = 0;

    function resize() {
        const aspect = 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        cellSize = Math.floor(Math.min(W, H) * 0.85 / gridSize);
        boardX = Math.floor((W - cellSize * gridSize) / 2);
        boardY = Math.floor((H - cellSize * gridSize) / 2) + 30;
    }

    window.addEventListener('resize', resize);
    resize();

    function initBoard() {
        board = [];
        for (let r = 0; r < gridSize; r++) {
            board[r] = [];
            for (let c = 0; c < gridSize; c++) {
                let type;
                do {
                    type = Math.floor(Math.random() * GEM_TYPES);
                } while (wouldMatch(r, c, type));
                board[r][c] = type;
            }
        }
    }

    function wouldMatch(r, c, type) {
        if (c >= 2 && board[r][c-1] === type && board[r][c-2] === type) return true;
        if (r >= 2 && board[r-1][c] === type && board[r-2][c] === type) return true;
        return false;
    }

    function findMatches() {
        let matches = new Set();
        // Horizontal
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize - 2; c++) {
                if (board[r][c] !== -1 && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                    matches.add(r + ',' + c);
                    matches.add(r + ',' + (c+1));
                    matches.add(r + ',' + (c+2));
                }
            }
        }
        // Vertical
        for (let c = 0; c < gridSize; c++) {
            for (let r = 0; r < gridSize - 2; r++) {
                if (board[r][c] !== -1 && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                    matches.add(r + ',' + c);
                    matches.add((r+1) + ',' + c);
                    matches.add((r+2) + ',' + c);
                }
            }
        }
        return Array.from(matches).map(s => s.split(',').map(Number));
    }

    function startRemoval(matchedCells) {
        removingGems = matchedCells.map(([r, c]) => ({ r, c, type: board[r][c], scale: 1, alpha: 1 }));
        for (let [r, c] of matchedCells) {
            board[r][c] = -1;
            spawnParticles(boardX + c * cellSize + cellSize/2, boardY + r * cellSize + cellSize/2, GEM_COLORS[board[r][c]] || GEM_COLORS[0]);
        }
    }

    function applyGravity() {
        fallingGems = [];
        for (let c = 0; c < gridSize; c++) {
            let writeRow = gridSize - 1;
            for (let r = gridSize - 1; r >= 0; r--) {
                if (board[r][c] !== -1) {
                    if (r !== writeRow) {
                        board[writeRow][c] = board[r][c];
                        board[r][c] = -1;
                        fallingGems.push({ c, fromRow: r, toRow: writeRow, type: board[writeRow][c], progress: 0 });
                    }
                    writeRow--;
                }
            }
            // Fill top with new gems
            for (let r = writeRow; r >= 0; r--) {
                let type = Math.floor(Math.random() * GEM_TYPES);
                board[r][c] = type;
                fallingGems.push({ c, fromRow: r - (writeRow + 1), toRow: r, type, progress: 0 });
            }
        }
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 6; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                life: 1,
                color: color.main,
                size: 3 + Math.random() * 4
            });
        }
    }

    function addFloatText(x, y, text, color) {
        floatTexts.push({ x, y, text, color: color || '#fff', life: 1, vy: -2 });
    }

    function startGame() {
        score = 0;
        combo = 0;
        cascadeDepth = 0;
        selected = null;
        swapAnim = null;
        particles = [];
        floatTexts = [];
        shakeTime = 0;
        initBoard();
        gameState = 'playing';
    }

    function handleInput(row, col) {
        if (gameState !== 'playing') return;
        if (row < 0 || row >= gridSize || col < 0 || col >= gridSize) return;

        if (!selected) {
            selected = { r: row, c: col };
        } else {
            const dr = Math.abs(row - selected.r);
            const dc = Math.abs(col - selected.c);
            if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                // Swap
                performSwap(selected.r, selected.c, row, col);
            } else {
                selected = { r: row, c: col };
            }
        }
    }

    function performSwap(r1, c1, r2, c2) {
        gameState = 'animating';
        swapAnim = { r1, c1, r2, c2, progress: 0 };
        selected = null;
    }

    function update(dt) {
        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Float texts
        for (let i = floatTexts.length - 1; i >= 0; i--) {
            const f = floatTexts[i];
            f.y += f.vy;
            f.life -= dt * 1.5;
            if (f.life <= 0) floatTexts.splice(i, 1);
        }

        // Shake
        if (shakeTime > 0) shakeTime -= dt;

        if (gameState === 'animating') {
            updateAnimation(dt);
        }
    }

    function updateAnimation(dt) {
        if (swapAnim) {
            swapAnim.progress += dt * 8;
            if (swapAnim.progress >= 1) {
                const { r1, c1, r2, c2 } = swapAnim;
                board[r1][c1] = board[r2][c2];
                board[r2][c2] = -1;
                board[r1][c1] = -1;
                board[r2][c2] = board[r1][c1];
                // Redo properly
                const tmp = board[r1][c1];
                board[r1][c1] = board[r2][c2];
                board[r2][c2] = tmp;
                swapAnim = null;
                cascadeDepth = 0;
                checkAndResolve();
            }
        } else if (removingGems.length > 0) {
            for (let g of removingGems) {
                g.scale -= dt * 5;
                g.alpha -= dt * 4;
                if (g.scale < 0.1) g.scale = 0.1;
                if (g.alpha < 0) g.alpha = 0;
            }
            if (removingGems[0].alpha <= 0) {
                removingGems = [];
                applyGravity();
            }
        } else if (fallingGems.length > 0) {
            for (let g of fallingGems) {
                g.progress += dt * 6;
                if (g.progress > 1) g.progress = 1;
            }
            if (fallingGems.every(g => g.progress >= 1)) {
                fallingGems = [];
                checkAndResolve();
            }
        } else {
            gameState = 'playing';
        }
    }

    function checkAndResolve() {
        const matches = findMatches();
        if (matches.length > 0) {
            cascadeDepth++;
            combo = cascadeDepth;
            const points = matches.length * 10 * cascadeDepth;
            score += points;
            if (score > bestScore) bestScore = score;

            const cx = boardX + cellSize / 2;
            const cy = boardY + cellSize / 2;
            addFloatText(cx, cy - 20, '+' + points, cascadeDepth > 1 ? '#ffd700' : '#fff');
            if (cascadeDepth > 1) {
                addFloatText(cx, cy + 10, 'x' + cascadeDepth, '#ff6b6b');
                shakeTime = 0.2;
                shakeIntensity = cascadeDepth * 2;
            }

            startRemoval(matches);
        } else {
            if (cascadeDepth > 0) {
                cascadeDepth = 0;
                combo = 0;
            }
        }
    }

    function drawGem(x, y, type, scale, alpha) {
        const color = GEM_COLORS[type % GEM_TYPES];
        const s = cellSize * 0.4 * (scale || 1);
        ctx.save();
        ctx.globalAlpha = alpha !== undefined ? alpha : 1;
        ctx.translate(x + cellSize/2, y + cellSize/2);

        // Glow
        ctx.shadowColor = color.main;
        ctx.shadowBlur = 8 * (scale || 1);

        // Diamond shape
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.7, 0);
        ctx.lineTo(0, s);
        ctx.lineTo(-s * 0.7, 0);
        ctx.closePath();
        ctx.fillStyle = color.main;
        ctx.fill();

        // Inner highlight
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.6);
        ctx.lineTo(s * 0.4, 0);
        ctx.lineTo(0, s * 0.2);
        ctx.lineTo(-s * 0.4, 0);
        ctx.closePath();
        ctx.fillStyle = color.light;
        ctx.globalAlpha = (alpha !== undefined ? alpha : 1) * 0.5;
        ctx.fill();

        // Top facet
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.35, -s * 0.3);
        ctx.lineTo(-s * 0.35, -s * 0.3);
        ctx.closePath();
        ctx.fillStyle = color.light;
        ctx.globalAlpha = (alpha !== undefined ? alpha : 1) * 0.7;
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);

        // Background gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#16213e');
        bgGrad.addColorStop(1, '#0f3460');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Shake
        let sx = 0, sy = 0;
        if (shakeTime > 0) {
            sx = (Math.random() - 0.5) * shakeIntensity;
            sy = (Math.random() - 0.5) * shakeIntensity;
        }

        ctx.save();
        ctx.translate(sx, sy);

        if (gameState === 'start') {
            drawStartScreen();
        } else {
            drawBoard();
            drawHUD();
        }

        // Particles
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Float texts
        for (const f of floatTexts) {
            ctx.globalAlpha = f.life;
            ctx.font = `bold ${Math.floor(cellSize * 0.4)}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillStyle = f.color;
            ctx.fillText(f.text, f.x, f.y);
        }
        ctx.globalAlpha = 1;

        ctx.restore();
    }

    function drawStartScreen() {
        ctx.textAlign = 'center';

        // Title
        ctx.font = `bold ${Math.min(W*0.08, 60)}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20;
        ctx.fillText('GEM CASCADE', W/2, H * 0.3);
        ctx.shadowBlur = 0;

        // Subtitle
        ctx.font = `${Math.min(W*0.04, 24)}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = '#a8d8ea';
        ctx.fillText('Match 3 Endless', W/2, H * 0.37);

        // Instructions
        ctx.font = `${Math.min(W*0.03, 18)}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = '#ccc';
        const lines = [
            'Click / Tap a gem to select it',
            'Click an adjacent gem to swap',
            'Match 3+ in a row or column to score',
            'Chain cascades for bonus multipliers!'
        ];
        lines.forEach((line, i) => {
            ctx.fillText(line, W/2, H * 0.48 + i * 28);
        });

        // Best score
        if (bestScore > 0) {
            ctx.font = `bold ${Math.min(W*0.035, 22)}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = '#ffd700';
            ctx.fillText('Best: ' + bestScore, W/2, H * 0.68);
        }

        // Start prompt
        const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
        ctx.globalAlpha = pulse;
        ctx.font = `bold ${Math.min(W*0.04, 28)}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.fillText('Click to Start', W/2, H * 0.8);
        ctx.globalAlpha = 1;

        // Decorative gems
        const t = Date.now() * 0.001;
        for (let i = 0; i < 6; i++) {
            const gx = W/2 + Math.cos(t + i * Math.PI/3) * W * 0.25;
            const gy = H * 0.15 + Math.sin(t * 1.5 + i * Math.PI/3) * 20;
            drawGem(gx - cellSize*0.4, gy - cellSize*0.4, i, 0.7);
        }
    }

    function drawBoard() {
        // Board background
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 2;
        roundRect(boardX - 5, boardY - 5, cellSize * gridSize + 10, cellSize * gridSize + 10, 10);
        ctx.fill();
        ctx.stroke();

        // Grid lines
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= gridSize; i++) {
            ctx.beginPath();
            ctx.moveTo(boardX + i * cellSize, boardY);
            ctx.lineTo(boardX + i * cellSize, boardY + gridSize * cellSize);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(boardX, boardY + i * cellSize);
            ctx.lineTo(boardX + gridSize * cellSize, boardY + i * cellSize);
            ctx.stroke();
        }

        // Draw gems
        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                if (board[r][c] === -1) continue;

                let x = boardX + c * cellSize;
                let y = boardY + r * cellSize;
                let scale = 1;
                let alpha = 1;

                // Swap animation
                if (swapAnim) {
                    const p = Math.min(swapAnim.progress, 1);
                    const ease = p < 0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
                    if ((r === swapAnim.r1 && c === swapAnim.c1)) {
                        x += (swapAnim.c2 - swapAnim.c1) * cellSize * ease;
                        y += (swapAnim.r2 - swapAnim.r1) * cellSize * ease;
                    } else if ((r === swapAnim.r2 && c === swapAnim.c2)) {
                        x += (swapAnim.c1 - swapAnim.c2) * cellSize * ease;
                        y += (swapAnim.r1 - swapAnim.r2) * cellSize * ease;
                    }
                }

                // Selected highlight
                if (selected && selected.r === r && selected.c === c) {
                    ctx.save();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.shadowColor = '#fff';
                    ctx.shadowBlur = 10;
                    ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
                    ctx.restore();
                    scale = 1.1;
                }

                drawGem(x, y, board[r][c], scale, alpha);
            }
        }

        // Falling gems (drawn on top)
        for (const g of fallingGems) {
            const fromY = boardY + g.fromRow * cellSize;
            const toY = boardY + g.toRow * cellSize;
            const easeP = 1 - Math.pow(1 - g.progress, 3);
            const y = fromY + (toY - fromY) * easeP;
            drawGem(boardX + g.c * cellSize, y, g.type, 1, 1);
        }

        // Removing gems
        for (const g of removingGems) {
            drawGem(boardX + g.c * cellSize, boardY + g.r * cellSize, g.type, g.scale, g.alpha);
        }
    }

    function drawHUD() {
        ctx.textAlign = 'left';
        ctx.font = `bold ${Math.min(W*0.04, 28)}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.fillText('Score: ' + score, boardX, boardY - 15);

        ctx.textAlign = 'right';
        if (bestScore > 0) {
            ctx.font = `${Math.min(W*0.03, 20)}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = '#ffd700';
            ctx.fillText('Best: ' + bestScore, boardX + gridSize * cellSize, boardY - 15);
        }

        if (combo > 1) {
            ctx.textAlign = 'center';
            ctx.font = `bold ${Math.min(W*0.035, 24)}px 'Segoe UI', sans-serif`;
            ctx.fillStyle = '#ff6b6b';
            ctx.fillText('COMBO x' + combo, W/2, boardY - 15);
        }
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // Audio
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSwapSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playMatchSound(comboLevel) {
        if (!audioCtx) return;
        const baseFreq = 300 + comboLevel * 80;
        for (let i = 0; i < 3; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq + i * 100, audioCtx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.05);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + i * 0.05 + 0.15);
            osc.start(audioCtx.currentTime + i * 0.05);
            osc.stop(audioCtx.currentTime + i * 0.05 + 0.15);
        }
    }

    // Input
    function getCellFromPoint(px, py) {
        const c = Math.floor((px - boardX) / cellSize);
        const r = Math.floor((py - boardY) / cellSize);
        if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) return { r, c };
        return null;
    }

    canvas.addEventListener('click', function(e) {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        if (gameState === 'start') {
            startGame();
            return;
        }

        if (gameState === 'playing') {
            const cell = getCellFromPoint(px, py);
            if (cell) {
                handleInput(cell.r, cell.c);
                if (swapAnim) playSwapSound();
            }
        }
    });

    // Keyboard restart
    window.addEventListener('keydown', function(e) {
        if (e.key === 'r' || e.key === 'R') {
            startGame();
        }
        if (e.key === 'Escape') {
            gameState = 'start';
        }
    });

    // Touch support
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        initAudio();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const px = touch.clientX - rect.left;
        const py = touch.clientY - rect.top;

        if (gameState === 'start') {
            startGame();
            return;
        }

        if (gameState === 'playing') {
            const cell = getCellFromPoint(px, py);
            if (cell) {
                handleInput(cell.r, cell.c);
                if (swapAnim) playSwapSound();
            }
        }
    });

    // Track match sounds
    let lastCascadeDepth = 0;
    const origStartRemoval = startRemoval;
    startRemoval = function(matchedCells) {
        origStartRemoval(matchedCells);
        playMatchSound(cascadeDepth);
    };

    // Main loop
    let lastTime = 0;
    function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    // Try/catch for localStorage
    try {
        const saved = localStorage.getItem('gemCascadeBest');
        if (saved) bestScore = parseInt(saved) || 0;
    } catch(e) {}

    function saveBest() {
        try {
            localStorage.setItem('gemCascadeBest', bestScore.toString());
        } catch(e) {}
    }

    // Override score update to save
    const origScoreSetter = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(Object.create(null)), 'score');
    setInterval(saveBest, 3000);

    initBoard();
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
