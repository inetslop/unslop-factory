<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower Duel - 2P Tower Defense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
#ui-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
pointer-events: none; z-index: 10;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, CELL, COLS, ROWS;
let gameState = 'start'; // start, playing, won, lost
let animTime = 0;
let lastTime = 0;

// Audio
let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(freq, dur, type='square', vol=0.1){
if(!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type; osc.frequency.value = freq;
gain.gain.setValueAtTime(vol, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// Game state
let players = [];
let enemies = [];
let projectiles = [];
let particles = [];
let baseHP = 20;
let wave = 0;
let maxWaves = 10;
let spawnTimer = 0;
let spawnInterval = 60;
let enemiesInWave = 0;
let enemiesSpawned = 0;
let path = [];
let grid = [];

function resize(){
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
CELL = Math.floor(Math.min(W/24, H/16));
COLS = Math.floor(W / CELL);
ROWS = Math.floor(H / CELL);
buildPath();
}

function buildPath(){
path = [];
const midY = Math.floor(ROWS/2);
// Snake path: enter left, go right, down, go left, down, go right to exit
let waypoints = [
{x: -1, y: midY},
{x: COLS*0.3, y: midY},
{x: COLS*0.3, y: Math.floor(ROWS*0.75)},
{x: COLS*0.65, y: Math.floor(ROWS*0.75)},
{x: COLS*0.65, y: Math.floor(ROWS*0.25)},
{x: COLS+1, y: Math.floor(ROWS*0.25)}
];
path = waypoints;
// Mark path cells
for(let i=0;i<COLS;i++) for(let j=0;j<ROWS;j++) grid[i][j] = 0;
markPathCells();
}

function markPathCells(){
for(let i=0;i<path.length-1;i++){
let ax = Math.floor(path[i].x), ay = path[i].y;
let bx = Math.floor(path[i+1].x), by = path[i+1].y;
let dx = Math.sign(bx-ax), dy = Math.sign(by-ay);
let cx=ax, cy=ay;
while(cx!==bx||cy!==by){
if(cx>=0&&cx<COLS&&cy>=0&&cy<ROWS) grid[cx][cy]=1;
cx+=dx; cy+=dy;
}
if(bx>=0&&bx<COLS&&by>=0&&by<ROWS) grid[bx][by]=1;
}
}

function initGame(){
baseHP = 20; wave = 0; spawnTimer = 0;
enemies = []; projectiles = []; particles = [];
enemiesInWave = 0; enemiesSpawned = 0;
grid = Array.from({length:COLS},()=>Array(ROWS).fill(0));
buildPath();

players = [
{name:'P1', color:'#4fc3f7', cursor:{x:2,y:2}, gold:150, kills:0, towers:[]},
{name:'P2', color:'#ff8a65', cursor:{x:COLS-3,y:ROWS-3}, gold:150, kills:0, towers:[]}
];
gameState = 'playing';
}

function spawnEnemy(){
let hp = 3 + wave * 2;
let speed = 0.8 + wave * 0.1;
let e = {
x: path[0].x * CELL, y: path[0].y * CELL,
pathIdx: 0, hp: hp, maxHp: hp, speed: speed,
reward: 10 + wave * 2, dead: false
};
enemies.push(e);
}

function update(dt){
if(gameState !== 'playing') return;

// Spawn enemies
let currentWaveEnemies = 5 + wave * 3;
if(wave === 0 || enemiesSpawned >= enemiesInWave && enemies.length === 0){
if(enemies.length === 0 && (wave === 0 || enemiesSpawned >= enemiesInWave)){
wave++;
enemiesInWave = 5 + wave * 3;
enemiesSpawned = 0;
spawnInterval = Math.max(20, 60 - wave * 4);
}
}

if(enemiesSpawned < enemiesInWave){
spawnTimer += dt;
if(spawnTimer >= spawnInterval){
spawnTimer = 0;
spawnEnemy();
enemiesSpawned++;
}
}

// Win condition
if(wave > maxWaves && enemies.length === 0 && enemiesSpawned >= enemiesInWave){
gameState = 'won';
return;
}

// Update enemies
for(let e of enemies){
let target = path[e.pathIdx];
if(!target){ e.dead = true; continue; }
let tx = target.x * CELL, ty = target.y * CELL;
let dx = tx - e.x, dy = ty - e.y;
let dist = Math.sqrt(dx*dx+dy*dy);
if(dist < 4){
e.pathIdx++;
if(e.pathIdx >= path.length){
// Reached end
baseHP--;
e.dead = true;
playSound(100, 0.3, 'sawtooth', 0.2);
spawnParticles(W-20, ty, '#ff4444', 8);
if(baseHP <= 0){ gameState = 'lost'; }
}
} else {
e.x += (dx/dist) * e.speed * dt * 0.1;
e.y += (dy/dist) * e.speed * dt * 0.1;
}
}
enemies = enemies.filter(e=>!e.dead);

// Update towers
for(let p of players){
for(let t of p.towers){
t.cooldown -= dt;
if(t.cooldown <= 0){
let target = null, bestDist = 999999;
for(let e of enemies){
let dx = e.x - t.x*CELL, dy = e.y - t.y*CELL;
let d = Math.sqrt(dx*dx+dy*dy);
if(d < t.range && d < bestDist){ bestDist = d; target = e; }
}
if(target){
t.cooldown = t.fireRate;
let dx = target.x - t.x*CELL, dy = target.y - t.y*CELL;
let dist = Math.sqrt(dx*dx+dy*dy);
projectiles.push({x: t.x*CELL, y: t.y*CELL, tx: target.x, ty: target.y, speed: 8, dmg: t.dmg, owner: p, life: 60});
playSound(800, 0.05, 'square', 0.05);
}
}
}
}

// Update projectiles
for(let p of projectiles){
p.life--;
let dx = p.tx - p.x, dy = p.ty - p.y;
let dist = Math.sqrt(dx*dx+dy*dy);
if(dist < 10){
// Hit!
let hitEnemy = false;
for(let e of enemies){
let ex = e.x - p.tx, ey = e.y - p.ty;
if(Math.sqrt(ex*ex+ey*ey) < CELL*0.6){
e.hp -= p.dmg;
hitEnemy = true;
if(e.hp <= 0 && !e.dead){
e.dead = true;
p.owner.gold += e.reward;
p.owner.kills++;
spawnParticles(e.x, e.y, '#ffd700', 12);
playSound(400, 0.15, 'triangle', 0.15);
}
break;
}
}
if(!hitEnemy) spawnParticles(p.tx, p.ty, '#888', 3);
p.dead = true;
} else {
p.x += (dx/dist) * p.speed;
p.y += (dy/dist) * p.speed;
}
}
projectiles = projectiles.filter(p=>!p.dead && p.life>0);

// Update particles
for(let p of particles){
p.x += p.vx; p.y += p.vy;
p.vy += 0.3; p.life--;
}
particles = particles.filter(p=>p.life>0);

enemies = enemies.filter(e=>!e.dead);
}

function spawnParticles(x, y, color, count){
for(let i=0;i<count;i++){
let angle = Math.random()*Math.PI*2;
let speed = 1+Math.random()*3;
particles.push({x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed-2, life: 30+Math.random()*20, color});
}
}

function draw(){
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0,0,W,H);

// Draw grid
for(let i=0;i<COLS;i++) for(let j=0;j<ROWS;j++){
let x=i*CELL, y=j*CELL;
if(grid[i]&&grid[i][j]===1){
ctx.fillStyle = '#2d2d44';
ctx.fillRect(x,y,CELL,CELL);
} else {
ctx.fillStyle = (i+j)%2===0 ? '#16213e' : '#1a1a2e';
ctx.fillRect(x,y,CELL,CELL);
}
}

// Draw path lines
ctx.strokeStyle = '#4a4a6a';
ctx.lineWidth = 2;
ctx.beginPath();
for(let i=0;i<path.length;i++){
let px = path[i].x*CELL, py = path[i].y*CELL;
if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
}
ctx.stroke();

// Draw base (end of path)
let endX = path[path.length-1].x*CELL, endY = path[path.length-1].y*CELL;
ctx.fillStyle = '#ff4444';
ctx.beginPath();
ctx.arc(endX, endY, CELL*0.4, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = '#fff';
ctx.font = 'bold 14px monospace';
ctx.textAlign = 'center';
ctx.fillText('BASE', endX, endY+5);

// Draw towers
for(let p of players){
for(let t of p.towers){
let x = t.x*CELL, y = t.y*CELL;
ctx.fillStyle = p.color;
ctx.fillRect(x+2, y+2, CELL-4, CELL-4);
ctx.strokeStyle = '#fff';
ctx.lineWidth = 2;
ctx.strokeRect(x+2, y+2, CELL-4, CELL-4);
// Range indicator (subtle)
ctx.globalAlpha = 0.1;
ctx.beginPath();
ctx.arc(x+CELL/2, y+CELL/2, t.range, 0, Math.PI*2);
ctx.fillStyle = p.color;
ctx.fill();
ctx.globalAlpha = 1;
// Level indicator
ctx.fillStyle = '#fff';
ctx.font = 'bold 10px monospace';
ctx.textAlign = 'center';
ctx.fillText('L'+t.level, x+CELL/2, y+CELL/2+4);
}
}

// Draw cursors
for(let p of players){
let cx = p.cursor.x*CELL, cy = p.cursor.y*CELL;
ctx.strokeStyle = p.color;
ctx.lineWidth = 3;
ctx.strokeRect(cx+1, cy+1, CELL-2, CELL-2);
ctx.fillStyle = p.color;
ctx.globalAlpha = 0.3;
ctx.fillRect(cx+1, cy+1, CELL-2, CELL-2);
ctx.globalAlpha = 1;
}

// Draw enemies
for(let e of enemies){
let hpRatio = e.hp / e.maxHp;
ctx.fillStyle = '#ff5252';
ctx.beginPath();
ctx.arc(e.x, e.y, CELL*0.35, 0, Math.PI*2);
ctx.fill();
// HP bar
ctx.fillStyle = '#333';
ctx.fillRect(e.x-15, e.y-CELL*0.5, 30, 6);
ctx.fillStyle = hpRatio>0.5?'#4caf50':'#ff9800';
ctx.fillRect(e.x-15, e.y-CELL*0.5, 30*hpRatio, 6);
}

// Draw projectiles
for(let p of projectiles){
ctx.fillStyle = p.owner.color;
ctx.beginPath();
ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
ctx.fill();
}

// Draw particles
for(let p of particles){
ctx.fillStyle = p.color;
ctx.globalAlpha = p.life/50;
ctx.fillRect(p.x-2, p.y-2, 4, 4);
}
ctx.globalAlpha = 1;

// HUD
drawHUD();
}

function drawHUD(){
// Top bar
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0,0,W,50);

// Base HP
ctx.fillStyle = '#fff';
ctx.font = 'bold 16px monospace';
ctx.textAlign = 'left';
ctx.fillText('BASE HP: ' + baseHP, 10, 30);
ctx.fillStyle = baseHP>10?'#4caf50':'#ff4444';
ctx.fillRect(120, 18, 100, 16);
ctx.fillStyle = '#fff';
ctx.fillRect(120, 18, 100*(baseHP/20), 16);

// Wave
ctx.fillStyle = '#fff';
ctx.textAlign = 'center';
ctx.fillText('Wave: ' + wave + '/' + maxWaves, W/2, 30);

// Player info
for(let i=0;i<players.length;i++){
let p = players[i];
let x = i===0 ? 250 : W-250;
ctx.fillStyle = p.color;
ctx.textAlign = 'center';
ctx.fillText(p.name + ' Gold: $' + p.gold, x, 18);
ctx.fillText('Kills: ' + p.kills, x, 36);
}

// Controls hint (small)
ctx.fillStyle = '#666';
ctx.font = '11px monospace';
ctx.textAlign = 'left';
ctx.fillText('P1: WASD+Q/E | P2: Arrows+,/.', W/2-120, H-10);
}

function drawStartScreen(){
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0,0,W,H);

let cx = W/2, cy = H/2;
ctx.fillStyle = '#fff';
ctx.font = 'bold 48px monospace';
ctx.textAlign = 'center';
ctx.fillText('TOWER DUEL', cx, cy-100);
ctx.font = '20px monospace';
ctx.fillStyle = '#aaa';
ctx.fillText('Two-Player Tower Defense', cx, cy-60);

ctx.font = '16px monospace';
ctx.fillStyle = '#4fc3f7';
ctx.fillText('PLAYER 1 (Blue)', cx-150, cy-20);
ctx.fillText('Move: W A S D', cx-150, cy);
ctx.fillText('Place Tower: Q ($50)', cx-150, cy+20);
ctx.fillText('Sell Tower: E (ref $30)', cx-150, cy+40);

ctx.fillStyle = '#ff8a65';
ctx.fillText('PLAYER 2 (Orange)', cx+150, cy-20);
ctx.fillText('Move: Arrow Keys', cx+150, cy);
ctx.fillText('Place Tower: , (comma)', cx+150, cy+20);
ctx.fillText('Sell Tower: . (period)', cx+150, cy+40);

ctx.fillStyle = '#fff';
ctx.font = '18px monospace';
ctx.fillText('Defend the base! Survive ' + maxWaves + ' waves.', cx, cy+90);
ctx.fillText('Most kills wins!', cx, cy+115);

let pulse = Math.sin(animTime*3)*0.5+0.5;
ctx.globalAlpha = 0.5+pulse*0.5;
ctx.font = '24px monospace';
ctx.fillText('Press SPACE to Start', cx, cy+170);
ctx.globalAlpha = 1;
}

function drawEndScreen(won){
draw(); // Draw game state behind
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0,0,W,H);

let cx = W/2, cy = H/2;
ctx.fillStyle = won?'#4caf50':'#ff4444';
ctx.font = 'bold 48px monospace';
ctx.textAlign = 'center';
ctx.fillText(won?'VICTORY!':'DEFEAT!', cx, cy-60);

let p1 = players[0], p2 = players[1];
ctx.fillStyle = '#fff';
ctx.font = '24px monospace';
ctx.fillText(p1.name + ': ' + p1.kills + ' kills', cx-150, cy);
ctx.fillText(p2.name + ': ' + p2.kills + ' kills', cx+150, cy);

let winner = p1.kills > p2.kills ? p1.name : (p2.kills > p1.kills ? p2.name : 'DRAW');
ctx.fillStyle = '#ffd700';
ctx.font = 'bold 28px monospace';
ctx.fillText(winner === 'DRAW' ? "IT'S A TIE!" : winner + ' WINS!', cx, cy+50);

let pulse = Math.sin(animTime*3)*0.5+0.5;
ctx.globalAlpha = 0.5+pulse*0.5;
ctx.fillStyle = '#fff';
ctx.font = '20px monospace';
ctx.fillText('Press SPACE to Restart', cx, cy+120);
ctx.globalAlpha = 1;
}

// Input
let keys = {};
window.addEventListener('keydown', function(e){
if(gameState === 'start'){
initAudio();
initGame();
return;
}
if(gameState === 'won' || gameState === 'lost'){
initAudio();
initGame();
return;
}
keys[e.key] = true;

// P1 controls
if(e.key === 'q' || e.key === 'Q') placeTower(0);
if(e.key === 'e' || e.key === 'E') sellTower(0);

// P2 controls
if(e.key === ',') placeTower(1);
if(e.key === '.') sellTower(1);
});
window.addEventListener('keyup', function(e){ keys[e.key] = false; });

function placeTower(pi){
let p = players[pi];
let cx = p.cursor.x, cy = p.cursor.y;
if(cx<0||cx>=COLS||cy<0||cy>=ROWS) return;
if(grid[cx][cy]===1) return; // Can't build on path
// Check if already have a tower here
for(let pl of players){
for(let t of pl.towers){
if(t.x===cx && t.y===cy){ playSound(200,0.1,'sawtooth',0.1); return; }
}
}
if(p.gold < 50){ playSound(150,0.2,'sawtooth',0.1); return; }
p.gold -= 50;
let tower = {x:cx, y:cy, level:1, range:CELL*3, fireRate:60, cooldown:0, dmg:2};
p.towers.push(tower);
playSound(600,0.1,'triangle',0.1);
spawnParticles(cx*CELL+CELL/2, cy*CELL+CELL/2, p.color, 6);
}

function sellTower(pi){
let p = players[pi];
let cx = p.cursor.x, cy = p.cursor.y;
for(let i=0;i<p.towers.length;i++){
if(p.towers[i].x===cx && p.towers[i].y===cy){
p.gold += 30;
p.towers.splice(i,1);
playSound(300,0.1,'triangle',0.1);
return;
}
}
}

function handleInput(dt){
if(gameState !== 'playing') return;
let spd = 8; // cells per second at 60fps

// P1: WASD
let p1 = players[0];
if(keys['a']||keys['A']) p1.cursor.x = Math.max(0, p1.cursor.x - spd*dt*0.06);
if(keys['d']||keys['D']) p1.cursor.x = Math.min(COLS-1, p1.cursor.x + spd*dt*0.06);
if(keys['w']||keys['W']) p1.cursor.y = Math.max(0, p1.cursor.y - spd*dt*0.06);
if(keys['s']||keys['S']) p1.cursor.y = Math.min(ROWS-1, p1.cursor.y + spd*dt*0.06);

// P2: Arrows
let p2 = players[1];
if(keys['ArrowLeft']) p2.cursor.x = Math.max(0, p2.cursor.x - spd*dt*0.06);
if(keys['ArrowRight']) p2.cursor.x = Math.min(COLS-1, p2.cursor.x + spd*dt*0.06);
if(keys['ArrowUp']) p2.cursor.y = Math.max(0, p2.cursor.y - spd*dt*0.06);
if(keys['ArrowDown']) p2.cursor.y = Math.min(ROWS-1, p2.cursor.y + spd*dt*0.06);

p1.cursor.x = Math.round(p1.cursor.x);
p1.cursor.y = Math.round(p1.cursor.y);
p2.cursor.x = Math.round(p2.cursor.x);
p2.cursor.y = Math.round(p2.cursor.y);
}

function gameLoop(timestamp){
let dt = Math.min(timestamp - lastTime, 50);
lastTime = timestamp;
animTime += dt * 0.001;

if(gameState === 'playing'){
handleInput(dt);
update(dt);
draw();
} else if(gameState === 'start'){
drawStartScreen();
} else if(gameState === 'won'){
drawEndScreen(true);
} else if(gameState === 'lost'){
drawEndScreen(false);
}

requestAnimationFrame(gameLoop);
}

window.addEventListener('resize', resize);
resize();
grid = Array.from({length:COLS},()=>Array(ROWS).fill(0));
buildPath();
requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
