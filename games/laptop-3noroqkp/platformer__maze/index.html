<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Runner - Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'coin') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'spike') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'fall') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }
}

// Game constants
const CELL = 40;
const GRAVITY = 0.7;
const JUMP_FORCE = -12;
const MOVE_SPEED = 5;
const FRICTION = 0.8;

// Game states
let gameState = 'start'; // start, playing, levelComplete, gameOver, win
let score = 0;
let totalGems = 0;
let collectedGems = 0;
let lives = 3;
let currentLevel = 0;
let deathTimer = 0;
let levelTimer = 0;

// Levels (1=wall, 0=floor, G=gem, S=spike, E=exit, P=player start)
const levels = [
    [
        "################################",
        "#P......G...#.......#.....G..#",
        "#....#####...#..####.#.####...#",
        "#..........S...........G......#",
        "#.####.#####..####.##..###.#####",
        "#.................#..............",
        "#..GGG..#####....#..######..####",
        "#....#.....#...S.#............#",
        "####.#.###..#..#..#.############",
        "#......#.......................E#",
        "#.####.#############.##########.#",
        "#.................................#",
        "################################"
    ],
    [
        "#####################################",
        "#P...#....G....#.....#.....G......#",
        "#..S..#..####..#..S..#..####..####.#",
        "#......#.......#.......#...........#",
        "#.####.#######..######.#############",
        "#.................#................#",
        "#..GGG..#####....#..######..#######",
        "#...#.....#...S..#...............E#",
        "#..#..###.#..#...#..###############",
        "#......#..........#.................#",
        "#.####.###########.##################",
        "#.................................  #",
        "#####################################"
    ],
    [
        "########################################",
        "#P....G..#.....S.......#....G........E#",
        "#..#####.#..#####..####.#..#####..#####",
        "#..#...#.#.....#......#.#.........#...#",
        "#..#.###.#####..######.#.#########.###.",
        "#..#...........#.......#..............#",
        "##..G.G.G..####.#..S....###############",
        "#......#........#......................#",
        "#.####.##########.#####################",
        "#.................................      #",
        "########################################"
    ]
];

// Parse level
let grid = [];
let gems = [];
let spikes = [];
let exitPos = {x:0,y:0};
let playerStart = {x:0,y:0};

function loadLevel(idx) {
    const lvl = levels[idx];
    grid = [];
    gems = [];
    spikes = [];
    
    for (let r = 0; r < lvl.length; r++) {
        grid[r] = [];
        for (let c = 0; c < lvl[r].length; c++) {
            const ch = lvl[r][c];
            if (ch === '#') {
                grid[r][c] = 1;
            } else if (ch === 'G') {
                grid[r][c] = 0;
                gems.push({x: c*CELL + CELL/2, y: r*CELL + CELL/2, collected: false});
            } else if (ch === 'S') {
                grid[r][c] = 0;
                spikes.push({x: c*CELL, y: r*CELL + CELL - 10});
            } else if (ch === 'E') {
                grid[r][c] = 0;
                exitPos = {x: c*CELL, y: r*CELL};
            } else if (ch === 'P') {
                grid[r][c] = 0;
                playerStart = {x: c*CELL + CELL/2, y: r*CELL + CELL/2};
            } else {
                grid[r][c] = 0;
            }
        }
    }
    
    totalGems = gems.length;
    collectedGems = 0;
    player.x = playerStart.x;
    player.y = playerStart.y;
    player.vx = 0;
    player.vy = 0;
}

// Player
let player = {x: 0, y: 0, vx: 0, vy: 0, w: 28, h: 34, onGround: false, facing: 1};

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start') {
        initAudio();
        startGame();
    } else if (gameState === 'gameOver' || gameState === 'win') {
        if (e.code === 'KeyR') startGame();
    } else if (gameState === 'levelComplete') {
        // auto advance
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    currentLevel = 0;
    loadLevel(0);
}

// Collision
function isWall(x, y) {
    const c = Math.floor(x / CELL);
    const r = Math.floor(y / CELL);
    if (r < 0 || r >= grid.length || c < 0 || c >= (grid[0]||[]).length) return true;
    return grid[r] && grid[r][c] === 1;
}

function rectIntersectWall(rx, ry, rw, rh) {
    // Check corners and edges
    const points = [
        [rx, ry], [rx+rw, ry], [rx, ry+rh], [rx+rw, ry+rh],
        [rx+rw/2, ry], [rx+rw/2, ry+rh],
        [rx, ry+rh/2], [rx+rw, ry+rh/2]
    ];
    for (const [px, py] of points) {
        if (isWall(px, py)) return true;
    }
    return false;
}

function movePlayer() {
    // Horizontal
    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -MOVE_SPEED;
        player.facing = -1;
    } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = MOVE_SPEED;
        player.facing = 1;
    } else {
        player.vx *= FRICTION;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
    }
    
    // Jump
    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        playSound('jump');
    }
    
    // Gravity
    player.vy += GRAVITY;
    if (player.vy > 15) player.vy = 15;
    
    // Move X
    let newX = player.x + player.vx;
    if (!rectIntersectWall(newX - player.w/2, player.y - player.h/2, player.w, player.h)) {
        player.x = newX;
    } else {
        // Snap to wall
        const step = Math.sign(player.vx);
        while (!rectIntersectWall(player.x + step * 0.5 - player.w/2, player.y - player.h/2, player.w, player.h)) {
            player.x += step * 0.5;
        }
        player.vx = 0;
    }
    
    // Move Y
    let newY = player.y + player.vy;
    if (!rectIntersectWall(player.x - player.w/2, newY - player.h/2, player.w, player.h)) {
        player.y = newY;
        player.onGround = false;
    } else {
        const step = Math.sign(player.vy);
        while (!rectIntersectWall(player.x - player.w/2, player.y + step * 0.5 - player.h/2, player.w, player.h)) {
            player.y += step * 0.5;
        }
        if (player.vy > 0) player.onGround = true;
        player.vy = 0;
    }
    
    // Check fall off bottom
    if (player.y > grid.length * CELL + 50) {
        killPlayer();
    }
}

function killPlayer() {
    lives--;
    playSound('spike');
    if (lives <= 0) {
        gameState = 'gameOver';
    } else {
        loadLevel(currentLevel);
    }
}

function checkCollisions() {
    // Gems
    for (let g of gems) {
        if (!g.collected) {
            const dx = player.x - g.x;
            const dy = player.y - g.y;
            if (Math.abs(dx) < 25 && Math.abs(dy) < 25) {
                g.collected = true;
                collectedGems++;
                score += 100;
                playSound('coin');
            }
        }
    }
    
    // Spikes
    for (let s of spikes) {
        const px = player.x - player.w/2;
        const py = player.y - player.h/2;
        if (px < s.x + CELL && px + player.w > s.x && 
            py + player.h > s.y && py < s.y + 10) {
            killPlayer();
            return;
        }
    }
    
    // Exit
    const ex = exitPos.x, ey = exitPos.y;
    if (Math.abs(player.x - (ex + CELL/2)) < 30 && Math.abs(player.y - (ey + CELL/2)) < 30) {
        score += collectedGems * 50;
        if (currentLevel >= levels.length - 1) {
            gameState = 'win';
            playSound('win');
        } else {
            gameState = 'levelComplete';
            levelTimer = 60;
            playSound('win');
        }
    }
}

// Camera
let camX = 0, camY = 0;
function updateCamera() {
    const targetX = player.x - W/2;
    const targetY = player.y - H/2;
    camX += (targetX - camX) * 0.1;
    camY += (targetY - camY) * 0.1;
    
    // Clamp
    const mw = grid[0].length * CELL;
    const mh = grid.length * CELL;
    if (camX < 0) camX = 0;
    if (camX > mw - W) camX = Math.max(0, mw - W);
    if (camY < 0) camY = 0;
    if (camY > mh - H) camY = Math.max(0, mh - H);
}

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 30 + Math.random() * 20,
            color: color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Drawing
function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f0c29');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    const starSeed = 42;
    for (let i = 0; i < 50; i++) {
        const sx = ((i * 137 + starSeed * 31) % 1000) / 1000 * W;
        const sy = ((i * 251 + starSeed * 97) % 1000) / 1000 * H * 0.6;
        const ss = (i % 3) + 1;
        ctx.fillStyle = `rgba(255,255,255,${0.3 + (i%5)*0.1})`;
        ctx.fillRect(sx, sy, ss, ss);
    }
}

function drawMaze() {
    const startC = Math.floor(camX / CELL);
    const endC = Math.ceil((camX + W) / CELL);
    const startR = Math.floor(camY / CELL);
    const endR = Math.ceil((camY + H) / CELL);
    
    for (let r = startR; r <= endR && r < grid.length; r++) {
        for (let c = startC; c <= endC && c < (grid[r]||[]).length; c++) {
            if (grid[r] && grid[r][c] === 1) {
                const x = c * CELL - camX;
                const y = r * CELL - camY;
                
                // Wall block
                ctx.fillStyle = '#4a4a6a';
                ctx.fillRect(x, y, CELL, CELL);
                
                // Top highlight
                ctx.fillStyle = '#5c5c8a';
                ctx.fillRect(x, y, CELL, 4);
                
                // Side shading
                ctx.fillStyle = '#3a3a5a';
                ctx.fillRect(x + CELL - 4, y, 4, CELL);
                ctx.fillRect(x, y + CELL - 4, CELL, 4);
                
                // Border
                ctx.strokeStyle = '#2a2a4a';
                ctx.lineWidth = 1;
                ctx.strokeRect(x+0.5, y+0.5, CELL-1, CELL-1);
            }
        }
    }
}

function drawGems() {
    const time = Date.now() * 0.003;
    for (let g of gems) {
        if (!g.collected) {
            const x = g.x - camX;
            const y = g.y - camY + Math.sin(time + g.x * 0.1) * 5;
            
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(x, y - 8);
            ctx.lineTo(x + 7, y);
            ctx.lineTo(x, y + 8);
            ctx.lineTo(x - 7, y);
            ctx.closePath();
            ctx.fill();
            
            // Glow
            ctx.fillStyle = 'rgba(255,215,0,0.3)';
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

function drawSpikes() {
    for (let s of spikes) {
        const x = s.x - camX;
        const y = s.y - camY;
        
        ctx.fillStyle = '#ff4444';
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(x + i*10, y + 10);
            ctx.lineTo(x + i*10 + 5, y - 5);
            ctx.lineTo(x + i*10 + 10, y + 10);
            ctx.closePath();
            ctx.fill();
        }
        
        // Base
        ctx.fillStyle = '#cc2222';
        ctx.fillRect(x, y + 8, CELL, 4);
    }
}

function drawExit() {
    const x = exitPos.x - camX;
    const y = exitPos.y - camY;
    const time = Date.now() * 0.005;
    
    // Door frame
    ctx.fillStyle = '#2a2a4a';
    ctx.fillRect(x + 4, y + 2, CELL - 8, CELL - 4);
    
    // Door
    ctx.fillStyle = `hsl(${140 + Math.sin(time)*30}, 70%, 50%)`;
    ctx.fillRect(x + 8, y + 6, CELL - 16, CELL - 12);
    
    // Glow
    ctx.fillStyle = `rgba(100,255,100,${0.2 + Math.sin(time)*0.1})`;
    ctx.beginPath();
    ctx.arc(x + CELL/2, y + CELL/2, 20, 0, Math.PI*2);
    ctx.fill();
}

function drawPlayer() {
    const x = player.x - camX;
    const y = player.y - camY;
    
    // Body
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(x - player.w/2, y - player.h/2 + 10, player.w, player.h - 10);
    
    // Head
    ctx.fillStyle = '#ffcc80';
    ctx.beginPath();
    ctx.arc(x, y - player.h/2 + 8, 10, 0, Math.PI*2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#333';
    const eyeOffset = player.facing * 3;
    ctx.fillRect(x + eyeOffset - 4, y - player.h/2 + 5, 3, 3);
    ctx.fillRect(x + eyeOffset + 2, y - player.h/2 + 5, 3, 3);
    
    // Legs animation
    const legAnim = Math.abs(player.vx) > 0.5 ? Math.sin(Date.now() * 0.015) * 4 : 0;
    ctx.fillStyle = '#3949ab';
    ctx.fillRect(x - 8, y + player.h/2 - 10, 6, 8 + legAnim);
    ctx.fillRect(x + 2, y + player.h/2 - 10, 6, 8 - legAnim);
}

function drawParticles() {
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 50;
        ctx.fillRect(p.x - camX - 2, p.y - camY - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Score
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 250, 80);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`Score: ${score}`, 20, 35);
    ctx.fillText(`Gems: ${collectedGems}/${totalGems}`, 20, 55);
    
    // Lives
    ctx.fillStyle = '#ff4444';
    for (let i = 0; i < lives; i++) {
        ctx.beginPath();
        ctx.arc(30 + i * 25, 75, 8, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Level
    ctx.fillStyle = '#aaa';
    ctx.fillText(`Level ${currentLevel + 1}/${levels.length}`, 160, 75);
}

function drawStartScreen() {
    drawBackground();
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MAZE RUNNER', W/2, H/3 - 20);
    
    ctx.font = '20px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Navigate the maze. Collect gems. Find the exit!', W/2, H/3 + 30);
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('Controls: A/D or Arrows to Move | W/Up/Space to Jump', W/2, H/3 + 70);
    ctx.fillText('R to Restart after Game Over', W/2, H/3 + 100);
    
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = 'bold 24px monospace';
    ctx.fillText('Press any key to start', W/2, H/2 + 40);
    
    ctx.textAlign = 'left';
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/3);
    
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${score}`, W/2, H/3 + 50);
    
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = '20px monospace';
    ctx.fillText('Press R to Restart', W/2, H/2 + 40);
    ctx.textAlign = 'left';
}

function drawWin() {
    ctx.fillStyle = 'rgba(0,50,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#4cff4c';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('YOU WIN!', W/2, H/3);
    
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${score}`, W/2, H/3 + 50);
    
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = '20px monospace';
    ctx.fillText('Press R to Play Again', W/2, H/2 + 40);
    ctx.textAlign = 'left';
}

function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,50,0.5)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#4fc3f7';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Level ${currentLevel + 1} Complete!`, W/2, H/2 - 20);
    
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Next level loading...', W/2, H/2 + 20);
    ctx.textAlign = 'left';
}

// Main loop
function update() {
    if (gameState === 'playing') {
        movePlayer();
        checkCollisions();
        updateCamera();
        updateParticles();
        
        // Gem pickup particles
        for (let g of gems) {
            if (!g.collected) continue;
        }
    } else if (gameState === 'levelComplete') {
        levelTimer--;
        if (levelTimer <= 0) {
            currentLevel++;
            loadLevel(currentLevel);
            gameState = 'playing';
            particles = [];
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'gameOver') {
        drawBackground();
        drawMaze();
        drawGems();
        drawSpikes();
        drawExit();
        drawPlayer();
        drawGameOver();
    } else if (gameState === 'win') {
        drawBackground();
        drawMaze();
        drawGems();
        drawSpikes();
        drawExit();
        drawPlayer();
        drawWin();
    } else {
        drawBackground();
        drawMaze();
        drawGems();
        drawSpikes();
        drawExit();
        drawPlayer();
        drawParticles();
        drawHUD();
        
        if (gameState === 'levelComplete') {
            drawLevelComplete();
        }
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Init
loadLevel(0);
player.x = playerStart.x;
player.y = playerStart.y;
camX = player.x - W/2;
camY = player.y - H/2;
gameLoop();
</script>
</body>
</html>
