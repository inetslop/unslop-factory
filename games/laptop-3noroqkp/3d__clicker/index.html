<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clicker 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    background: #0a0a1a; 
    overflow: hidden; 
    width: 100vw; 
    height: 100vh; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
}
canvas { 
    display: block; 
    cursor: crosshair;
}
#ui {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
}
#score {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 48px;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(100,200,255,0.8);
}
#combo {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #ff6644;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(255,100,50,0.9);
}
#wave {
    position: absolute;
    top: 20px;
    right: 30px;
    color: #88ffcc;
    font-size: 22px;
}
#overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,20,0.9);
    pointer-events: all;
}
#overlay h1 {
    color: #6cf;
    font-size: 64px;
    text-shadow: 0 0 30px rgba(100,200,255,0.6);
    margin-bottom: 20px;
}
#overlay p {
    color: #aaccf;
    font-size: 18px;
    margin: 8px 0;
}
#overlay button {
    margin-top: 30px;
    padding: 15px 50px;
    font-size: 24px;
    background: linear-gradient(135deg, #2266cc, #44aaff);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}
#overlay button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(68,170,255,0.5);
}
.hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
    <div id="score" class="hidden">0</div>
    <div id="combo" class="hidden"></div>
    <div id="wave" class="hidden"></div>
</div>
<div id="overlay">
    <h1>CLICKER 3D</h1>
    <p>Click cubes to shatter them!</p>
    <p>Chain clicks for combo multipliers</p>
    <p>Drag to rotate the scene</p>
    <p>Keys: R = restart, Space = pause</p>
    <button id="btn">START</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playBreak(combo) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    const base = 200 + combo * 30;
    osc.frequency.setValueAtTime(base, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(base * 1.5, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}
function playWave() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}

// Game state
let gameState = 'menu'; // menu, playing, paused, gameover
let score = 0;
let combo = 0;
let maxCombo = 0;
let lastClickTime = 0;
let wave = 1;
let cubes = [];
let particles = [];
let shakeX = 0, shakeY = 0;
let shakeTime = 0;
let rotX = 0.5, rotY = 0.8;
let isDragging = false;
let lastMouseX = 0, lastMouseY = 0;
let waveTimer = 0;
let cubesLeft = 0;

const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const waveEl = document.getElementById('wave');
const overlayEl = document.getElementById('overlay');
const btnEl = document.getElementById('btn');

function spawnWave() {
    cubes = [];
    const size = 3 + Math.floor(wave / 2);
    const maxCubes = 40 + wave * 15;
    let count = 0;
    for (let x = -size; x <= size && count < maxCubes; x++) {
        for (let y = -size; y <= size && count < maxCubes; y++) {
            for (let z = -size; z <= size && count < maxCubes; z++) {
                if (Math.random() < 0.6) {
                    const hue = (wave * 30 + Math.random() * 40) % 360;
                    cubes.push({
                        x, y, z,
                        size: 0.9,
                        hp: 1,
                        scale: 1,
                        alpha: 1,
                        hue,
                        broken: false,
                        breakAnim: 0
                    });
                }
                count++;
            }
        }
    }
    cubesLeft = cubes.length;
    waveEl.textContent = 'WAVE ' + wave;
    playWave();
}

function startGame() {
    initAudio();
    score = 0;
    combo = 0;
    maxCombo = 0;
    wave = 1;
    particles = [];
    gameState = 'playing';
    overlayEl.classList.add('hidden');
    scoreEl.classList.remove('hidden');
    comboEl.classList.remove('hidden');
    waveEl.classList.remove('hidden');
    updateScore();
    spawnWave();
}

function updateScore() {
    scoreEl.textContent = score;
    if (combo > 1) {
        comboEl.textContent = 'x' + combo + ' COMBO!';
    } else {
        comboEl.textContent = '';
    }
}

// 3D math
const FOCAL = 500;
function project(px, py, pz) {
    // Rotate
    let cx = Math.cos(rotX), sx = Math.sin(rotX);
    let cy = Math.cos(rotY), sy = Math.sin(rotY);
    // Rotate Y
    let x1 = px * cy - pz * sy;
    let z1 = px * sy + pz * cy;
    // Rotate X
    let y2 = py * cx - z1 * sx;
    let z2 = py * sx + z1 * cx;
    
    let scale = FOCAL / (FOCAL + z2 * 8);
    let sx2 = W / 2 + x1 * scale * 40 + shakeX;
    let sy2 = H / 2 + y2 * scale * 40 + shakeY;
    return { x: sx2, y: sy2, z: z2, scale };
}

function drawCube(cube) {
    if (cube.broken && cube.breakAnim <= 0) return;
    
    const s = cube.size * cube.scale;
    const verts = [
        [-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],
        [-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]
    ];
    
    // Transform and project
    const projected = [];
    for (let v of verts) {
        const p = project(cube.x + v[0], cube.y + v[1], cube.z + v[2]);
        projected.push(p);
    }
    
    const faces = [
        [0,1,2,3], // back
        [4,5,6,7], // front
        [0,4,7,3], // left
        [1,5,6,2], // right
        [3,2,6,7], // top
        [0,1,5,4]  // bottom
    ];
    
    const faceNormals = [[0,0,-1],[0,0,1],[-1,0,0],[1,0,0],[0,1,0],[0,-1,0]];
    
    let minZ = Infinity;
    for (let p of projected) if (p.z < minZ) minZ = p.z;
    
    const alpha = cube.broken ? cube.breakAnim : 1;
    const lightDir = { x: -0.5, y: -0.7, z: 0.6 };
    
    for (let f = 0; f < faces.length; f++) {
        const idx = faces[f];
        const pts = idx.map(i => projected[i]);
        
        // Simple depth check
        let faceZ = 0;
        for (let p of pts) faceZ += p.z;
        faceZ /= 4;
        
        if (faceZ > minZ + 1) continue; // back face cull (approximate)
        
        const n = faceNormals[f];
        let light = Math.max(0, n.x * lightDir.x + n.y * lightDir.y + n.z * lightDir.z);
        light = 0.3 + light * 0.7;
        
        const h = cube.hue;
        const l = 25 + light * 35;
        ctx.fillStyle = `hsla(${h}, 70%, ${l}%, ${alpha})`;
        ctx.strokeStyle = `hsla(${h}, 80%, ${l + 20}%, ${alpha * 0.8})`;
        ctx.lineWidth = 1;
        
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }
}

function spawnParticles(x, y, z, hue) {
    for (let i = 0; i < 12; i++) {
        const speed = 2 + Math.random() * 4;
        const angle = Math.random() * Math.PI * 2;
        const elev = (Math.random() - 0.5) * Math.PI;
        particles.push({
            x, y, z,
            vx: Math.cos(angle) * Math.cos(elev) * speed,
            vy: Math.sin(elev) * speed,
            vz: Math.sin(angle) * Math.cos(elev) * speed,
            life: 1,
            hue: hue + Math.random() * 30 - 15,
            size: 0.2 + Math.random() * 0.3
        });
    }
}

function drawParticles() {
    for (let p of particles) {
        const proj = project(p.x + p.vx * 0.02, p.y + p.vy * 0.02, p.z + p.vz * 0.02);
        const s = p.size * proj.scale * 15;
        ctx.fillStyle = `hsla(${p.hue}, 90%, 60%, ${p.life})`;
        ctx.beginPath();
        ctx.arc(proj.x, proj.y, Math.max(1, s), 0, Math.PI * 2);
        ctx.fill();
    }
}

function handleClick(mx, my) {
    if (gameState !== 'playing') return;
    
    // Find closest cube to click
    let bestCube = null;
    let bestDist = Infinity;
    
    for (let cube of cubes) {
        if (cube.broken) continue;
        const p = project(cube.x, cube.y, cube.z);
        const dx = mx - p.x;
        const dy = my - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const hitRadius = 20 * p.scale;
        
        if (dist < hitRadius && p.z < bestDist) {
            bestCube = cube;
            bestDist = p.z;
        }
    }
    
    if (bestCube) {
        const now = performance.now();
        if (now - lastClickTime < 800) {
            combo++;
            maxCombo = Math.max(maxCombo, combo);
        } else {
            combo = 1;
        }
        lastClickTime = now;
        
        bestCube.broken = true;
        bestCube.breakAnim = 1;
        cubesLeft--;
        
        const points = 10 * combo;
        score += points;
        updateScore();
        
        spawnParticles(bestCube.x, bestCube.y, bestCube.z, bestCube.hue);
        playBreak(combo);
        
        // Screen shake
        shakeTime = 0.15;
        const shakeMag = Math.min(5, combo * 0.5);
        shakeX = (Math.random() - 0.5) * shakeMag * 2;
        shakeY = (Math.random() - 0.5) * shakeMag * 2;
        
        if (cubesLeft <= 0) {
            wave++;
            setTimeout(() => { if (gameState === 'playing') spawnWave(); }, 1500);
        }
    }
}

// Input
canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});
window.addEventListener('mousemove', (e) => {
    if (isDragging && gameState === 'playing') {
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        rotY += dx * 0.01;
        rotX += dy * 0.01;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    }
});
window.addEventListener('mouseup', (e) => {
    if (isDragging && gameState === 'playing') {
        const dx = Math.abs(e.clientX - lastMouseX);
        const dy = Math.abs(e.clientY - lastMouseY);
        if (dx < 5 && dy < 5) {
            handleClick(e.clientX, e.clientY);
        }
    }
    isDragging = false;
});

canvas.addEventListener('click', (e) => {
    if (!isDragging) {
        // Already handled in mouseup for drag distinction
    }
});

// Use a click handler that doesn't conflict with drag
let clickTimer = null;
canvas.addEventListener('mousedown', () => {
    isDragging = true;
});
window.addEventListener('mouseup', (e) => {
    const wasDrag = isDragging;
    isDragging = false;
    if (wasDrag && gameState === 'playing') {
        // Check if it was actually a click (small movement)
        // We track this with lastMouseX/Y vs current
    }
});

// Simpler: just use click event
canvas.addEventListener('click', (e) => {
    handleClick(e.clientX, e.clientY);
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'playing') gameState = 'paused';
        else if (gameState === 'paused') gameState = 'playing';
    }
    if (e.code === 'KeyR') {
        startGame();
    }
});

btnEl.addEventListener('click', () => {
    btnEl.textContent = '';
    overlayEl.innerHTML = '<h1>CLICKER 3D</h1><p>Click cubes to shatter them!</p><p>Chain clicks for combo multipliers</p><p>Drag to rotate the scene</p><p>Keys: R = restart, Space = pause</p>' + (gameState === 'paused' ? '' : '<button id="btn">START</button>');
    if (gameState === 'menu') {
        startGame();
    } else {
        gameState = 'playing';
        overlayEl.classList.add('hidden');
    }
});

// Re-bind button after innerHTML change
function bindBtn() {
    const b = document.getElementById('btn');
    if (b) {
        b.addEventListener('click', () => {
            if (gameState === 'menu' || gameState === 'paused') {
                if (gameState === 'menu') startGame();
                else { gameState = 'playing'; overlayEl.classList.add('hidden'); }
            }
        });
    }
}

// Game loop
let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    
    // Update
    if (gameState === 'playing') {
        rotY += dt * 0.3;
        
        // Shake decay
        shakeTime -= dt;
        if (shakeTime <= 0) {
            shakeX *= 0.8;
            shakeY *= 0.8;
        }
        
        // Update break animations
        for (let cube of cubes) {
            if (cube.broken && cube.breakAnim > 0) {
                cube.breakAnim -= dt * 3;
                cube.scale = 1 + (1 - cube.breakAnim) * 0.5;
            }
        }
        
        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= dt * 2;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }
    }
    
    // Render
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Draw grid floor hint
    if (gameState === 'playing' || gameState === 'paused') {
        // Sort cubes by depth
        const sorted = cubes.filter(c => !c.broken || c.breakAnim > 0).sort((a, b) => {
            const pa = project(a.x, a.y, a.z);
            const pb = project(b.x, b.y, b.z);
            return pa.z - pb.z;
        });
        
        for (let cube of sorted) {
            drawCube(cube);
        }
        
        drawParticles();
    }
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// Initial state
scoreEl.classList.add('hidden');
comboEl.classList.add('hidden');
waveEl.classList.add('hidden');
</script>
</body>
</html>
