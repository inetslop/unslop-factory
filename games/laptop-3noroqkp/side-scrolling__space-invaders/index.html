<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side-Scroll Space Invaders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        osc.start(); osc.stop(audioCtx.currentTime + 1);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let wave = 1;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('sssi_high') || '0'); } catch(e) {}

// Stars
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, speed: Math.random() * 2 + 0.5, size: Math.random() * 2 + 0.5 });
    }
}

// Player
let player = { x: 80, y: 0, w: 50, h: 30, cooldown: 0, powerLevel: 1, powerTimer: 0 };
function resetPlayer() {
    player.x = 80;
    player.y = H / 2 - 15;
    player.cooldown = 0;
    player.powerLevel = 1;
    player.powerTimer = 0;
}

// Bullets
let bullets = [];
// Enemy bullets
let enemyBullets = [];
// Invaders
let invaders = [];
// Particles
let particles = [];
// Power-ups
let powerups = [];
// Shield blocks
let shields = [];

function initShields() {
    shields = [];
    for (let i = 0; i < 6; i++) {
        let sy = 40 + i * ((H - 120) / 5);
        shields.push({ x: W * 0.15, y: sy, w: 30, h: 20, hp: 3 });
    }
}

function spawnWave(w) {
    invaders = [];
    let count = Math.min(5 + w * 2, 25);
    let cols = Math.min(4 + Math.floor(w / 3), 8);
    let rows = Math.ceil(count / cols);
    let spacingX = 60;
    let spacingY = 45;
    let startX = W + 100;
    let startY = H / 2 - (rows * spacingY) / 2;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (invaders.length >= count) break;
            let type = Math.random() < 0.3 ? 'tank' : (Math.random() < 0.2 ? 'boss' : 'basic');
            invaders.push({
                x: startX + c * spacingX,
                y: startY + r * spacingY,
                w: type === 'boss' ? 45 : 35,
                h: type === 'boss' ? 40 : 28,
                type: type,
                hp: type === 'boss' ? 3 : (type === 'tank' ? 2 : 1),
                shootTimer: Math.random() * 200 + 100,
                wobble: Math.random() * Math.PI * 2,
                alive: true
            });
        }
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 30 + Math.random() * 20, color, size: Math.random() * 4 + 1 });
    }
}

function spawnPowerup(x, y) {
    let type = Math.random() < 0.5 ? 'power' : (Math.random() < 0.5 ? 'shield' : 'life');
    powerups.push({ x, y, type, w: 20, h: 20, vy: -1 });
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    wave = 1;
    bullets = [];
    enemyBullets = [];
    invaders = [];
    particles = [];
    powerups = [];
    resetPlayer();
    initShields();
    spawnWave(1);
}

function drawShip(x, y, w, h) {
    ctx.fillStyle = '#0ff';
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    // Body
    ctx.beginPath();
    ctx.moveTo(x + w, y + h / 2);
    ctx.lineTo(x + w * 0.3, y);
    ctx.lineTo(x, y + h * 0.2);
    ctx.lineTo(x, y + h * 0.8);
    ctx.lineTo(x + w * 0.3, y + h);
    ctx.closePath();
    ctx.fill();
    // Cockpit
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x + w * 0.6, y + h / 2, 5, 0, Math.PI * 2);
    ctx.fill();
    // Engine glow
    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.ellipse(x + 5, y + h / 2, 8, 4, 0, 0, Math.PI * 2);
    ctx.fill();
}

function drawInvader(inv) {
    let colors = { basic: '#f44', tank: '#fa0', boss: '#f0f' };
    let c = colors[inv.type] || '#f44';
    ctx.fillStyle = c;
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    if (inv.type === 'basic') {
        // Classic invader shape
        let cx = inv.x + inv.w / 2, cy = inv.y + inv.h / 2;
        ctx.beginPath();
        ctx.rect(cx - 8, cy - 10, 16, 8);
        ctx.fill();
        ctx.fillRect(cx - 12, cy - 4, 24, 8);
        ctx.fill();
        ctx.fillRect(cx - 6, cy + 4, 12, 6);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(cx - 5, cy - 7, 4, 3);
        ctx.fillRect(cx + 2, cy - 7, 4, 3);
    } else if (inv.type === 'tank') {
        let cx = inv.x + inv.w / 2, cy = inv.y + inv.h / 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx - 5, cy - 3, 3, 0, Math.PI * 2);
        ctx.arc(cx + 5, cy - 3, 3, 0, Math.PI * 2);
        ctx.fill();
    } else { // boss
        let cx = inv.x + inv.w / 2, cy = inv.y + inv.h / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 18);
        ctx.lineTo(cx - 20, cy + 15);
        ctx.lineTo(cx + 20, cy + 15);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawBullet(x, y) {
    ctx.fillStyle = '#ff0';
    ctx.fillRect(x, y - 2, 14, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 10, y - 1, 6, 2);
}

function drawEnemyBullet(x, y) {
    ctx.fillStyle = '#f55';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawShield(s) {
    let alpha = s.hp / 3;
    ctx.fillStyle = `rgba(0, 200, 150, ${alpha * 0.6})`;
    ctx.strokeStyle = `rgba(0, 255, 200, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(s.x - s.w / 2, s.y - s.h / 2, s.w, s.h, 4);
    ctx.fill();
    ctx.stroke();
}

function drawPowerup(p) {
    let colors = { power: '#0f0', shield: '#0af', life: '#f0f' };
    ctx.fillStyle = colors[p.type];
    ctx.strokeStyle = colors[p.type];
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let label = p.type === 'power' ? 'P' : p.type === 'shield' ? 'S' : '+';
    ctx.fillText(label, p.x, p.y);
}

function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    // Stars
    for (let s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${s.size / 3})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`WAVE: ${wave}`, 20, 55);
    // Lives
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#0ff';
        let lx = W - 40 - i * 35;
        let ly = 20;
        ctx.beginPath();
        ctx.moveTo(lx + 15, ly);
        ctx.lineTo(lx, ly + 12);
        ctx.lineTo(lx + 15, ly + 8);
        ctx.lineTo(lx + 30, ly + 12);
        ctx.closePath();
        ctx.fill();
    }
    // Power level
    if (player.powerLevel > 1) {
        ctx.fillStyle = '#0f0';
        ctx.fillText(`PWR x${player.powerLevel}`, 20, 80);
    }
}

function drawStartScreen() {
    drawBackground();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('SIDE-SCROLL', W / 2, H / 3);
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#0ff';
    ctx.fillText('SPACE INVADERS', W / 2, H / 3 + 50);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('W/S or ↑/↓ - Move Ship', W / 2, H / 2 + 40);
    ctx.fillText('A/D or ←/→ - Nudge Position', W / 2, H / 2 + 70);
    ctx.fillText('SPACE - Shoot', W / 2, H / 2 + 100);
    ctx.fillText('R - Restart (on game over)', W / 2, H / 2 + 130);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px monospace';
    let blink = Math.floor(Date.now() / 500) % 2;
    if (blink) ctx.fillText('PRESS SPACE TO START', W / 2, H * 0.8);

    if (highScore > 0) {
        ctx.font = '16px monospace';
        ctx.fillStyle = '#fa0';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, H * 0.9);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = '28px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 2 - 20);
    ctx.fillText(`WAVE REACHED: ${wave}`, W / 2, H / 2 + 20);

    if (score > highScore) {
        ctx.fillStyle = '#fa0';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 60);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '20px monospace';
    let blink = Math.floor(Date.now() / 500) % 2;
    if (blink) ctx.fillText('PRESS SPACE OR R TO RESTART', W / 2, H * 0.8);
}

// Game loop
let lastTime = 0;
let waveTimer = 0;
let shakeTimer = 0;

function update(dt) {
    // Stars
    for (let s of stars) {
        s.x -= s.speed;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    }

    if (gameState !== 'playing') return;

    // Player movement
    let speed = 5;
    if (keys['KeyW'] || keys['ArrowUp']) player.y -= speed;
    if (keys['KeyS'] || keys['ArrowDown']) player.y += speed;
    if (keys['KeyA'] || keys['ArrowLeft']) player.x -= speed * 0.5;
    if (keys['KeyD'] || keys['ArrowRight']) player.x += speed * 0.5;
    player.x = Math.max(10, Math.min(W * 0.4, player.x));
    player.y = Math.max(10, Math.min(H - 40, player.y));

    // Shooting
    if (player.cooldown > 0) player.cooldown -= dt;
    if (keys['Space'] && player.cooldown <= 0) {
        let count = player.powerLevel;
        for (let i = 0; i < count; i++) {
            bullets.push({ x: player.x + 50, y: player.y + player.h / 2 - (count - 1) * 8 + i * 8, vx: 12, vy: 0 });
        }
        player.cooldown = 150;
        playSound('shoot');
    }

    // Power timer
    if (player.powerTimer > 0) {
        player.powerTimer -= dt;
        if (player.powerTimer <= 0) player.powerLevel = 1;
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].vx * (dt / 16);
        if (bullets[i].x > W + 20) bullets.splice(i, 1);
    }

    // Enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].x += enemyBullets[i].vx * (dt / 16);
        enemyBullets[i].y += enemyBullets[i].vy * (dt / 16);
        if (enemyBullets[i].x < -20 || enemyBullets[i].y < -20 || enemyBullets[i].y > H + 20) {
            enemyBullets.splice(i, 1);
        }
    }

    // Invaders
    let invaderSpeed = (1 + wave * 0.3) * 0.8;
    for (let inv of invaders) {
        if (!inv.alive) continue;
        inv.x -= invaderSpeed * (dt / 16);
        inv.wobble += dt * 0.003;
        inv.y += Math.sin(inv.wobble) * 0.5;

        // Shooting
        inv.shootTimer -= dt;
        if (inv.shootTimer <= 0 && inv.x < W - 50) {
            let angle = Math.atan2(player.y + player.h / 2 - (inv.y + inv.h / 2), player.x - (inv.x + inv.w));
            enemyBullets.push({ x: inv.x, y: inv.y + inv.h / 2, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 3 });
            inv.shootTimer = 2000 + Math.random() * 2000;
        }

        // Off screen left - wraps to right
        if (inv.x < -60) {
            inv.x = W + 50;
            inv.y = Math.random() * (H - 100) + 50;
        }
    }

    // Bullet-Invader collision
    for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = invaders.length - 1; j >= 0; j--) {
            let inv = invaders[j];
            if (!inv.alive) continue;
            if (bullets[i].x > inv.x && bullets[i].x < inv.x + inv.w &&
                bullets[i].y > inv.y && bullets[i].y < inv.y + inv.h) {
                inv.hp--;
                bullets.splice(i, 1);
                if (inv.hp <= 0) {
                    inv.alive = false;
                    let pts = inv.type === 'boss' ? 50 : inv.type === 'tank' ? 30 : 10;
                    score += pts;
                    spawnParticles(inv.x + inv.w / 2, inv.y + inv.h / 2, '#f44', 15);
                    playSound('explosion');
                    if (Math.random() < 0.15) spawnPowerup(inv.x, inv.y);
                    // Remove dead invaders periodically
                } else {
                    playSound('hit');
                }
                break;
            }
        }
    }

    // Clean up dead invaders
    invaders = invaders.filter(inv => inv.alive);

    // Enemy bullet-Player collision
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let b = enemyBullets[i];
        if (b.x > player.x && b.x < player.x + player.w &&
            b.y > player.y && b.y < player.y + player.h) {
            enemyBullets.splice(i, 1);
            lives--;
            shakeTimer = 200;
            playSound('hit');
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#0ff', 20);
            if (lives <= 0) {
                gameState = 'gameover';
                playSound('gameover');
                try { if (score > highScore) { highScore = score; localStorage.setItem('sssi_high', highScore); } } catch(e) {}
            }
        }
    }

    // Invader-Player collision
    for (let inv of invaders) {
        if (!inv.alive) continue;
        if (player.x < inv.x + inv.w && player.x + player.w > inv.x &&
            player.y < inv.y + inv.h && player.y + player.h > inv.y) {
            lives--;
            shakeTimer = 200;
            playSound('hit');
            spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#0ff', 20);
            if (lives <= 0) {
                gameState = 'gameover';
                playSound('gameover');
                try { if (score > highScore) { highScore = score; localStorage.setItem('sssi_high', highScore); } } catch(e) {}
            }
        }
    }

    // Shield collision with enemy bullets/invaders
    for (let i = shields.length - 1; i >= 0; i--) {
        let s = shields[i];
        for (let j = enemyBullets.length - 1; j >= 0; j--) {
            let b = enemyBullets[j];
            if (b.x > s.x - s.w/2 && b.x < s.x + s.w/2 && b.y > s.y - s.h/2 && b.y < s.y + s.h/2) {
                enemyBullets.splice(j, 1);
                s.hp--;
                if (s.hp <= 0) shields.splice(i, 1);
                break;
            }
        }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.x -= 1.5 * (dt / 16);
        if (p.x < -20) { powerups.splice(i, 1); continue; }
        if (player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y < p.y + p.h && player.y + player.h > p.y) {
            if (p.type === 'power') { player.powerLevel = Math.min(3, player.powerLevel + 1); player.powerTimer = 15000; }
            else if (p.type === 'shield') { initShields(); }
            else if (p.type === 'life') { lives++; }
            playSound('powerup');
            powerups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * (dt / 16);
        p.y += p.vy * (dt / 16);
        p.life -= dt / 16;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Wave progression
    if (invaders.length === 0) {
        wave++;
        spawnWave(wave);
        playSound('explosion');
    }

    // Shake
    if (shakeTimer > 0) shakeTimer -= dt;
}

function render() {
    let sx = 0, sy = 0;
    if (shakeTimer > 0) {
        sx = (Math.random() - 0.5) * 6;
        sy = (Math.random() - 0.5) * 6;
    }
    ctx.save();
    ctx.translate(sx, sy);

    drawBackground();

    if (gameState === 'start') {
        drawStartScreen();
        ctx.restore();
        return;
    }

    // Shields
    for (let s of shields) drawShield(s);

    // Invaders
    for (let inv of invaders) if (inv.alive) drawInvader(inv);

    // Bullets
    for (let b of bullets) drawBullet(b.x, b.y);
    for (let b of enemyBullets) drawEnemyBullet(b.x, b.y);

    // Player
    if (gameState === 'playing') {
        drawShip(player.x, player.y, player.w, player.h);
    }

    // Powerups
    for (let p of powerups) drawPowerup(p);

    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.min(1, p.life / 20);
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
    }

    // HUD
    if (gameState === 'playing') drawHUD();

    if (gameState === 'gameover') drawGameOver();

    ctx.restore();
}

function gameLoop(timestamp) {
    let dt = Math.min(timestamp - lastTime, 50);
    lastTime = timestamp;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

initStars();
resetPlayer();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
