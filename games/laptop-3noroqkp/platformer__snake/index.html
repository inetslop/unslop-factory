<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('snakePlatHigh') || '0'); } catch(e) {}

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    if (gameState === 'gameover' && (e.code === 'KeyR' || e.code === 'Enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Game objects
let snake, platforms, foods, particles, camY, deathTimer;

const GRAVITY = 0.6;
const JUMP_VEL = -12;
const MOVE_SPEED = 5;
const SEGMENT_RADIUS = 12;
const FOOD_RADIUS = 8;

function createPlatforms() {
    const plats = [];
    // Ground
    plats.push({ x: 0, y: H - 40, w: W, h: 40 });
    
    // Generate platforms going up
    let y = H - 120;
    let count = 0;
    while (y > -300) {
        const numAtLevel = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < numAtLevel; i++) {
            const pw = 100 + Math.random() * 150;
            const px = Math.random() * (W - pw);
            plats.push({ x: px, y: y, w: pw, h: 20 });
        }
        y -= 80 + Math.random() * 40;
        count++;
    }
    return plats;
}

function createFood(plats) {
    const foods = [];
    for (let i = 0; i < plats.length; i++) {
        if (Math.random() < 0.6) {
            const p = plats[i];
            foods.push({
                x: p.x + Math.random() * (p.w - 20) + 10,
                y: p.y - FOOD_RADIUS - 5,
                radius: FOOD_RADIUS,
                bob: Math.random() * Math.PI * 2
            });
        }
    }
    return foods;
}

function startGame() {
    initAudio();
    platforms = createPlatforms();
    foods = createFood(platforms);
    
    const groundY = H - 40 - SEGMENT_RADIUS;
    snake = {
        head: { x: W / 2, y: groundY },
        vx: 0, vy: 0,
        segments: [],
        grounded: false,
        coyoteTime: 0,
        jumpPressed: false
    };
    
    // Initialize segments
    for (let i = 0; i < 5; i++) {
        snake.segments.push({ x: W / 2 - i * 18, y: groundY });
    }
    
    score = 0;
    particles = [];
    camY = 0;
    deathTimer = 0;
    gameState = 'playing';
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: color || '#4f4',
            size: 3 + Math.random() * 4
        });
    }
}

function update() {
    if (gameState !== 'playing') return;
    
    const head = snake.head;
    
    // Horizontal movement
    if (keys['ArrowLeft'] || keys['KeyA']) {
        head.vx = -MOVE_SPEED;
    } else if (keys['ArrowRight'] || keys['KeyD']) {
        head.vx = MOVE_SPEED;
    } else {
        head.vx *= 0.8;
        if (Math.abs(head.vx) < 0.5) head.vx = 0;
    }
    
    // Jumping with coyote time
    if (snake.grounded) snake.coyoteTime = 6;
    else snake.coyoteTime--;
    
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && !snake.jumpPressed) {
        if (snake.coyoteTime > 0) {
            head.vy = JUMP_VEL;
            snake.grounded = false;
            snake.coyoteTime = 0;
            snake.jumpPressed = true;
            playSound(300, 0.15, 'square', 0.08);
        }
    }
    if (!keys['Space'] && !keys['ArrowUp'] && !keys['KeyW']) {
        snake.jumpPressed = false;
        // Variable jump height
        if (head.vy < -4) head.vy *= 0.85;
    }
    
    // Gravity
    head.vy += GRAVITY;
    if (head.vy > 15) head.vy = 15;
    
    // Move head
    head.x += head.vx;
    head.y += head.vy;
    
    // Clamp horizontal
    if (head.x < SEGMENT_RADIUS) { head.x = SEGMENT_RADIUS; head.vx = 0; }
    if (head.x > W - SEGMENT_RADIUS) { head.x = W - SEGMENT_RADIUS; head.vx = 0; }
    
    // Platform collision for head
    snake.grounded = false;
    for (const p of platforms) {
        // Top collision (landing)
        if (head.vy > 0 &&
            head.x + SEGMENT_RADIUS * 0.7 > p.x &&
            head.x - SEGMENT_RADIUS * 0.7 < p.x + p.w &&
            head.y + SEGMENT_RADIUS >= p.y &&
            head.y - SEGMENT_RADIUS <= p.y + 15) {
            head.y = p.y - SEGMENT_RADIUS;
            head.vy = 0;
            snake.grounded = true;
        }
        // Side collisions
        if (head.x + SEGMENT_RADIUS > p.x && head.x - SEGMENT_RADIUS < p.x + p.w) {
            if (head.y + SEGMENT_RADIUS > p.y + 5 && head.y - SEGMENT_RADIUS < p.y + p.h) {
                if (head.vx > 0) head.x = p.x - SEGMENT_RADIUS;
                else if (head.vx < 0) head.x = p.x + p.w + SEGMENT_RADIUS;
                head.vx = 0;
            }
        }
        // Bottom collision (hitting head from below)
        if (head.vy < 0 &&
            head.y - SEGMENT_RADIUS <= p.y + p.h &&
            head.y - SEGMENT_RADIUS >= p.y + p.h - 15 &&
            head.x + SEGMENT_RADIUS * 0.7 > p.x &&
            head.x - SEGMENT_RADIUS * 0.7 < p.x + p.w) {
            head.vy = 0;
        }
    }
    
    // Fall off screen
    if (head.y > H + 100) {
        triggerDeath();
        return;
    }
    
    // Update body segments (follow the head with delay)
    for (let i = 0; i < snake.segments.length; i++) {
        const seg = snake.segments[i];
        const target = (i === 0) ? head : snake.segments[i - 1];
        const dx = target.x - seg.x;
        const dy = target.y - seg.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const spacing = SEGMENT_RADIUS * 1.6;
        if (dist > spacing) {
            const t = (dist - spacing) / dist;
            seg.x += dx * t;
            seg.y += dy * t;
        }
    }
    
    // Self-collision check (skip first few segments near head)
    for (let i = 3; i < snake.segments.length; i++) {
        const seg = snake.segments[i];
        const dx = head.x - seg.x;
        const dy = head.y - seg.y;
        if (dx * dx + dy * dy < (SEGMENT_RADIUS * 1.4) * (SEGMENT_RADIUS * 1.4)) {
            triggerDeath();
            return;
        }
    }
    
    // Food collection
    for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        const dx = head.x - f.x;
        const dy = head.y - f.y;
        if (dx * dx + dy * dy < (SEGMENT_RADIUS + FOOD_RADIUS) * (SEGMENT_RADIUS + FOOD_RADIUS)) {
            // Eat food
            score++;
            spawnParticles(f.x, f.y, '#4f4', 12);
            playSound(500, 0.1, 'square', 0.1);
            playSound(700, 0.15, 'square', 0.08);
            
            // Grow snake
            const lastSeg = snake.segments[snake.segments.length - 1];
            snake.segments.push({ x: lastSeg.x, y: lastSeg.y });
            
            foods.splice(i, 1);
        }
    }
    
    // Respawn food if too few
    if (foods.length < 3) {
        const p = platforms[Math.floor(Math.random() * platforms.length)];
        foods.push({
            x: p.x + Math.random() * (p.w - 20) + 10,
            y: p.y - FOOD_RADIUS - 5,
            radius: FOOD_RADIUS,
            bob: Math.random() * Math.PI * 2
        });
    }
    
    // Camera follows head
    const targetCamY = Math.max(0, H / 3 - head.y);
    camY += (targetCamY - camY) * 0.08;
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function triggerDeath() {
    gameState = 'gameover';
    deathTimer = 0;
    spawnParticles(snake.head.x, snake.head.y, '#f44', 20);
    playSound(150, 0.3, 'sawtooth', 0.15);
    try { 
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakePlatHigh', String(highScore));
        }
    } catch(e) {}
}

function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    // Background stars/grid
    ctx.save();
    ctx.translate(0, camY);
    
    // Subtle grid
    ctx.strokeStyle = 'rgba(100,100,180,0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H + 400); ctx.stroke();
    }
    for (let y = -300; y < H + 400; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    
    // Platforms
    for (const p of platforms) {
        const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        grad.addColorStop(0, '#5c5c8a');
        grad.addColorStop(1, '#3a3a5c');
        ctx.fillStyle = grad;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(p.x, p.y, p.w, 3);
    }
    
    // Food
    const time = Date.now() * 0.003;
    for (const f of foods) {
        const bobY = Math.sin(time + f.bob) * 3;
        ctx.fillStyle = '#4f4';
        ctx.beginPath();
        ctx.arc(f.x, f.y + bobY, f.radius, 0, Math.PI * 2);
        ctx.fill();
        // Glow
        ctx.fillStyle = 'rgba(68,255,68,0.2)';
        ctx.beginPath();
        ctx.arc(f.x, f.y + bobY, f.radius + 4, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Particles
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = `rgba(68,255,68,${alpha})`;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    
    // Snake body (draw from tail to head)
    if (snake) {
        for (let i = snake.segments.length - 1; i >= 0; i--) {
            const seg = snake.segments[i];
            const t = i / snake.segments.length;
            const r = Math.floor(60 + t * 40);
            const g = Math.floor(200 - t * 80);
            const b = Math.floor(60 + t * 20);
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            const rSize = SEGMENT_RADIUS * (1 - t * 0.3);
            ctx.beginPath();
            ctx.arc(seg.x, seg.y, rSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Segment outline
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        // Head
        const head = snake.head;
        ctx.fillStyle = '#4f4';
        ctx.beginPath();
        ctx.arc(head.x, head.y, SEGMENT_RADIUS + 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Eyes
        const eyeDir = head.vx >= 0 ? 1 : -1;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(head.x + eyeDir * 4 - 3, head.y - 3, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(head.x + eyeDir * 4 + 3, head.y - 3, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath();
        ctx.arc(head.x + eyeDir * 5 - 3, head.y - 3, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(head.x + eyeDir * 5 + 3, head.y - 3, 2, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
    
    // UI
    if (gameState === 'playing') {
        drawHUD();
    } else if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'gameover') {
        deathTimer++;
        drawGameOver();
    }
}

function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 180, 60);
    ctx.fillStyle = '#4f4';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 20, 35);
    ctx.fillStyle = '#aaa';
    ctx.font = '14px monospace';
    ctx.fillText(`Best: ${highScore}`, 20, 60);
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4f4';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('SNAKE PLATFORMER', W/2, H/2 - 80);
    
    ctx.fillStyle = '#ccc';
    ctx.font = '18px monospace';
    ctx.fillText('Navigate your snake across platforms!', W/2, H/2 - 30);
    ctx.fillText('Eat food to grow. Don\'t hit yourself!', W/2, H/2 + 10);
    
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText('← → / A D  —  Move', W/2, H/2 + 60);
    ctx.fillText('Space / ↑ / W  —  Jump', W/2, H/2 + 85);
    
    if (highScore > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = '16px monospace';
        ctx.fillText(`High Score: ${highScore}`, W/2, H/2 + 125);
    }
    
    const pulse = Math.sin(Date.now() * 0.004) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(68,255,68,${pulse})`;
    ctx.font = 'bold 22px monospace';
    ctx.fillText('Press SPACE or ENTER to Start', W/2, H/2 + 170);
}

function drawGameOver() {
    ctx.fillStyle = `rgba(0,0,0,${Math.min(deathTimer / 30, 0.6)})`;
    ctx.fillRect(0, 0, W, H);
    
    if (deathTimer > 20) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f44';
        ctx.font = 'bold 48px monospace';
        ctx.fillText('GAME OVER', W/2, H/2 - 40);
        
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Score: ${score}`, W/2, H/2 + 10);
        
        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#ff0';
            ctx.font = '20px monospace';
            ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 50);
        }
        
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Press R or ENTER to Restart', W/2, H/2 + 95);
    }
}

// Main loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
