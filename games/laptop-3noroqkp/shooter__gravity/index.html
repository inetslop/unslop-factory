<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'combo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let combo = 0;
let maxCombo = 0;
let lives = 5;
let level = 1;
let frameCount = 0;
let particles = [];
let bullets = [];
let targets = [];
let obstacles = [];
let muzzleFlash = 0;
let shakeTime = 0;
let shakeIntensity = 0;
let floatingTexts = [];

const GRAVITY = 0.35;
const BULLET_SPEED = 12;
const CANNON_X_RATIO = 0.08;
const CANNON_Y_RATIO = 0.85;

let mouseX = W / 2;
let mouseY = H / 2;
let cannonAngle = -Math.PI / 4;

// Star background
let stars = [];
function genStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, size: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1 });
    }
}
genStars();

function spawnTarget() {
    const side = Math.random();
    let tx, ty;
    if (side < 0.4) {
        tx = W * 0.55 + Math.random() * W * 0.35;
        ty = H * 0.15 + Math.random() * H * 0.6;
    } else if (side < 0.7) {
        tx = W * 0.35 + Math.random() * W * 0.5;
        ty = H * 0.1 + Math.random() * H * 0.4;
    } else {
        tx = W * 0.2 + Math.random() * W * 0.6;
        ty = H * 0.7 + Math.random() * H * 0.2;
    }
    const type = Math.random() < 0.15 ? 'bonus' : (Math.random() < 0.3 ? 'moving' : 'static');
    const t = {
        x: tx, y: ty,
        radius: 18 + Math.random() * 10,
        type: type,
        hp: type === 'bonus' ? 2 : 1,
        maxHp: type === 'bonus' ? 2 : 1,
        vx: type === 'moving' ? (Math.random() < 0.5 ? -1 : 1) * (1 + Math.random()) : 0,
        vy: 0,
        phase: Math.random() * Math.PI * 2,
        points: type === 'bonus' ? 50 : 20 + level * 5
    };
    targets.push(t);
}

function spawnObstacle() {
    const ox = W * 0.3 + Math.random() * W * 0.4;
    const oy = H * 0.3 + Math.random() * H * 0.4;
    const ow = 20 + Math.random() * 40;
    const oh = 100 + Math.random() * 150;
    obstacles.push({ x: ox, y: oy, w: ow, h: oh, hp: 3, maxHp: 3 });
}

function startGame() {
    gameState = 'playing';
    score = 0;
    combo = 0;
    maxCombo = 0;
    lives = 5;
    level = 1;
    frameCount = 0;
    particles = [];
    bullets = [];
    targets = [];
    obstacles = [];
    floatingTexts = [];
    for (let i = 0; i < 3; i++) spawnTarget();
    for (let i = 0; i < 2; i++) spawnObstacle();
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 60, vy: -2 });
}

function shoot() {
    if (gameState !== 'playing') return;
    initAudio();
    const cx = W * CANNON_X_RATIO;
    const cy = H * CANNON_Y_RATIO;
    const speed = BULLET_SPEED;
    bullets.push({
        x: cx + Math.cos(cannonAngle) * 35,
        y: cy + Math.sin(cannonAngle) * 35,
        vx: Math.cos(cannonAngle) * speed,
        vy: Math.sin(cannonAngle) * speed,
        trail: []
    });
    muzzleFlash = 8;
    shakeTime = 5;
    shakeIntensity = 3;
    playSound('shoot');
}

function checkBulletCollision(b) {
    // Check targets
    for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        const dx = b.x - t.x;
        const dy = b.y - t.y;
        if (Math.sqrt(dx * dx + dy * dy) < t.radius + 6) {
            t.hp--;
            addParticles(t.x, t.y, '#ff6644', 15);
            playSound('hit');
            if (t.hp <= 0) {
                combo++;
                const points = Math.floor(t.points * (1 + combo * 0.2));
                score += points;
                maxCombo = Math.max(maxCombo, combo);
                addFloatingText(t.x, t.y - 20, `+${points}`, '#ffdd44');
                if (combo > 1) {
                    addFloatingText(t.x, t.y - 40, `COMBO x${combo}!`, '#ff88ff');
                    playSound('combo');
                }
                targets.splice(i, 1);
            } else {
                addFloatingText(t.x, t.y - 20, 'HIT', '#ffffff');
            }
            return true;
        }
    }
    // Check obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        if (b.x > o.x - o.w/2 && b.x < o.x + o.w/2 && b.y > o.y - o.h/2 && b.y < o.y + o.h/2) {
            o.hp--;
            addParticles(b.x, b.y, '#8888ff', 10);
            playSound('explosion');
            if (o.hp <= 0) {
                addFloatingText(o.x, o.y - 20, 'DESTROYED!', '#66aaff');
                obstacles.splice(i, 1);
                score += 30;
            }
            return true;
        }
    }
    return false;
}

function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Spawn targets periodically
    const spawnRate = Math.max(120 - level * 5, 40);
    if (frameCount % spawnRate === 0 && targets.length < 3 + level) {
        spawnTarget();
    }

    // Level up
    if (score > level * 200) {
        level++;
        addFloatingText(W/2, H/2 - 50, `LEVEL ${level}!`, '#44ff88');
        if (level % 2 === 0) spawnObstacle();
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 15) b.trail.shift();
        b.vy += GRAVITY;
        b.x += b.vx;
        b.y += b.vy;

        if (checkBulletCollision(b)) {
            bullets.splice(i, 1);
            continue;
        }

        // Out of bounds
        if (b.x < -50 || b.x > W + 50 || b.y > H + 50 || b.y < -200) {
            bullets.splice(i, 1);
            combo = 0;
            lives--;
            if (lives <= 0) {
                gameState = 'gameover';
                playSound('explosion');
            }
        }
    }

    // Update targets
    for (let t of targets) {
        if (t.type === 'moving') {
            t.x += t.vx;
            t.phase += 0.03;
            t.y += Math.sin(t.phase) * 0.5;
            if (t.x < 100 || t.x > W - 50) t.vx *= -1;
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    // Muzzle flash decay
    if (muzzleFlash > 0) muzzleFlash--;
    if (shakeTime > 0) shakeTime--;
}

function drawCannon() {
    const cx = W * CANNON_X_RATIO;
    const cy = H * CANNON_Y_RATIO;

    // Base
    ctx.save();
    ctx.translate(cx, cy);

    // Barrel
    ctx.save();
    ctx.rotate(cannonAngle);
    const grad = ctx.createLinearGradient(0, -8, 0, 8);
    grad.addColorStop(0, '#556677');
    grad.addColorStop(0.5, '#99aabb');
    grad.addColorStop(1, '#334455');
    ctx.fillStyle = grad;
    ctx.fillRect(0, -8, 40, 16);
    // Muzzle flash
    if (muzzleFlash > 0) {
        ctx.fillStyle = `rgba(255, 200, 50, ${muzzleFlash / 8})`;
        ctx.beginPath();
        ctx.arc(42, 0, 12 * (muzzleFlash / 8), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Body
    ctx.fillStyle = '#445566';
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#667788';
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawTrajectoryPreview() {
    const cx = W * CANNON_X_RATIO;
    const cy = H * CANNON_Y_RATIO;
    let px = cx + Math.cos(cannonAngle) * 35;
    let py = cy + Math.sin(cannonAngle) * 35;
    let pvx = Math.cos(cannonAngle) * BULLET_SPEED;
    let pvy = Math.sin(cannonAngle) * BULLET_SPEED;

    ctx.fillStyle = 'rgba(255, 255, 100, 0.4)';
    for (let i = 0; i < 30; i++) {
        pvy += GRAVITY;
        px += pvx;
        py += pvy;
        if (i % 3 === 0) {
            ctx.beginPath();
            ctx.arc(px, py, 2, 0, Math.PI * 2);
            ctx.fill();
        }
        if (py > H || px > W || px < 0) break;
    }
}

function draw() {
    ctx.save();
    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }

    // Background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0a0a2a');
    bgGrad.addColorStop(1, '#1a1a3a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Stars
    for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(frameCount * 0.02 + s.x) * 0.3})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    // Ground
    ctx.fillStyle = '#1a2a4a';
    ctx.fillRect(0, H - 30, W, 30);
    ctx.fillStyle = '#2a3a5a';
    ctx.fillRect(0, H - 30, W, 4);

    if (gameState === 'playing') {
        // Trajectory preview
        drawTrajectoryPreview();

        // Obstacles
        for (const o of obstacles) {
            const alpha = o.hp / o.maxHp;
            ctx.fillStyle = `rgba(100, 130, 200, ${alpha})`;
            ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
            ctx.strokeStyle = '#6688cc';
            ctx.lineWidth = 2;
            ctx.strokeRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
            // Crack lines
            if (o.hp < o.maxHp) {
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.moveTo(o.x - o.w/4, o.y - o.h/4);
                ctx.lineTo(o.x + o.w/4, o.y + o.h/6);
                ctx.stroke();
            }
        }

        // Targets
        for (const t of targets) {
            const pulse = 1 + Math.sin(frameCount * 0.08 + t.phase) * 0.1;
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.radius * pulse, 0, Math.PI * 2);
            if (t.type === 'bonus') {
                const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.radius);
                g.addColorStop(0, '#ffff88');
                g.addColorStop(1, '#ff8844');
                ctx.fillStyle = g;
            } else {
                const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.radius);
                g.addColorStop(0, '#ff6644');
                g.addColorStop(1, '#cc3322');
                ctx.fillStyle = g;
            }
            ctx.fill();
            ctx.strokeStyle = t.type === 'bonus' ? '#ffffaa' : '#ff8866';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Inner ring
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.radius * 0.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Bullseye
            ctx.beginPath();
            ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
        }

        // Bullets
        for (const b of bullets) {
            // Trail
            for (let i = 0; i < b.trail.length; i++) {
                const alpha = i / b.trail.length * 0.5;
                ctx.fillStyle = `rgba(255, 200, 50, ${alpha})`;
                ctx.beginPath();
                ctx.arc(b.trail[i].x, b.trail[i].y, 3 * (i / b.trail.length), 0, Math.PI * 2);
                ctx.fill();
            }
            // Bullet
            ctx.fillStyle = '#ffdd44';
            ctx.beginPath();
            ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(b.x - 1, b.y - 1, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Cannon
        drawCannon();

        // Particles
        for (const p of particles) {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba').replace('#', '');
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Floating texts
        for (const ft of floatingTexts) {
            ctx.globalAlpha = ft.life / 60;
            ctx.fillStyle = ft.color;
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.globalAlpha = 1;
        }

        // HUD
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 35);
        ctx.font = '18px monospace';
        ctx.fillText(`LEVEL: ${level}`, 20, 60);
        ctx.fillText(`COMBO: x${combo}`, 20, 85);

        // Lives as hearts
        for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            const hx = W - 40 - i * 30;
            const hy = 30;
            ctx.moveTo(hx, hy + 5);
            ctx.lineTo(hx - 7, hy - 2);
            ctx.lineTo(hx - 7, hy + 2);
            ctx.lineTo(hx, hy + 8);
            ctx.lineTo(hx + 7, hy + 2);
            ctx.lineTo(hx + 7, hy - 2);
            ctx.closePath();
            ctx.fill();
        }

        // Power bar
        const powerBarW = 150;
        ctx.fillStyle = '#333';
        ctx.fillRect(W/2 - powerBarW/2, H - 25, powerBarW, 12);
        ctx.fillStyle = '#44ff88';
        ctx.fillRect(W/2 - powerBarW/2, H - 25, powerBarW * (lives / 5), 12);
        ctx.strokeStyle = '#666';
        ctx.strokeRect(W/2 - powerBarW/2, H - 25, powerBarW, 12);
    }

    ctx.restore();

    // Start screen
    if (gameState === 'start') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffdd44';
        ctx.font = 'bold 52px monospace';
        ctx.fillText('GRAVITY SHOOTER', W/2, H * 0.3);

        ctx.fillStyle = '#aaccff';
        ctx.font = '20px monospace';
        ctx.fillText('Your shots are affected by gravity!', W/2, H * 0.42);
        ctx.fillText('Aim your cannon to destroy targets.', W/2, H * 0.5);
        ctx.fillText('Watch the dotted arc for trajectory.', W/2, H * 0.56);

        ctx.fillStyle = '#888';
        ctx.font = '16px monospace';
        ctx.fillText('MOUSE - Aim cannon', W/2, H * 0.67);
        ctx.fillText('CLICK - Fire bullet', W/2, H * 0.72);
        ctx.fillText('Hit targets before you run out of lives!', W/2, H * 0.77);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px monospace';
        const blink = Math.sin(frameCount * 0.05) > 0;
        if (blink) ctx.fillText('[ CLICK TO START ]', W/2, H * 0.88);
    }

    // Game over screen
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px monospace';
        ctx.fillText('GAME OVER', W/2, H * 0.3);

        ctx.fillStyle = '#ffffff';
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W/2, H * 0.42);
        ctx.fillText(`Level Reached: ${level}`, W/2, H * 0.5);
        ctx.fillText(`Max Combo: x${maxCombo}`, W/2, H * 0.56);

        ctx.fillStyle = '#ffdd44';
        ctx.font = 'bold 26px monospace';
        const blink = Math.sin(frameCount * 0.05) > 0;
        if (blink) ctx.fillText('[ CLICK TO RESTART ]', W/2, H * 0.75);
    }
}

function gameLoop() {
    frameCount++;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    const cx = W * CANNON_X_RATIO;
    const cy = H * CANNON_Y_RATIO;
    cannonAngle = Math.atan2(mouseY - cy, mouseX - cx);
    // Clamp angle
    if (cannonAngle > 0.3) cannonAngle = 0.3;
    if (cannonAngle < -Math.PI / 2) cannonAngle = -Math.PI / 2;
});

window.addEventListener('click', (e) => {
    initAudio();
    if (gameState === 'start' || gameState === 'gameover') {
        startGame();
    } else if (gameState === 'playing') {
        shoot();
    }
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && gameState === 'playing') {
        e.preventDefault();
        shoot();
    }
    if (e.code === 'Enter') {
        if (gameState === 'start' || gameState === 'gameover') startGame();
    }
});

// Touch support
window.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    mouseX = touch.clientX;
    mouseY = touch.clientY;
    const cx = W * CANNON_X_RATIO;
    const cy = H * CANNON_Y_RATIO;
    cannonAngle = Math.atan2(mouseY - cy, mouseX - cx);
});

window.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    const touch = e.touches[0];
    mouseX = touch.clientX;
    mouseY = touch.clientY;
    if (gameState === 'start' || gameState === 'gameover') {
        startGame();
    } else if (gameState === 'playing') {
        shoot();
    }
});

// Save high score
function saveHighScore() {
    try {
        const prev = parseInt(localStorage.getItem('gravityShooterHigh')) || 0;
        if (score > prev) localStorage.setItem('gravityShooterHigh', score);
    } catch(e) {}
}

const _origGameOverCheck = gameState;
setInterval(() => {
    if (gameState === 'gameover' && _origGameOverCheck !== 'gameover') saveHighScore();
}, 500);

gameLoop();
</script>
</body>
</html>
