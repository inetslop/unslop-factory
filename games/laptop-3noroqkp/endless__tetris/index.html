<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Tetris</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
#gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = volume || 0.1;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (duration || 0.1));
}
function playDrop() { playSound(200, 0.05, 'square', 0.08); }
function playRotate() { playSound(400, 0.05, 'sine', 0.06); }
function playClear(lines) {
    const notes = [400, 500, 600, 700];
    for (let i = 0; i < Math.min(lines, 4); i++) {
        setTimeout(() => playSound(notes[i], 0.15, 'sine', 0.12), i * 50);
    }
}
function playTetris() {
    for (let i = 0; i < 5; i++) {
        setTimeout(() => playSound(300 + i * 100, 0.2, 'sine', 0.15), i * 60);
    }
}
function playGameOver() {
    for (let i = 0; i < 4; i++) {
        setTimeout(() => playSound(300 - i * 50, 0.3, 'sawtooth', 0.1), i * 150);
    }
}
function playLevelUp() {
    for (let i = 0; i < 6; i++) {
        setTimeout(() => playSound(400 + i * 80, 0.12, 'sine', 0.1), i * 70);
    }
}

// Game Constants
const COLS = 10, ROWS = 20;
const PIECES = [
    [[0,0],[1,0],[2,0],[3,0]], // I
    [[0,0],[1,0],[0,1],[1,1]], // O
    [[1,0],[0,1],[1,1],[2,1]], // T
    [[1,0],[1,1],[0,1],[2,1]], // S
    [[0,0],[1,0],[1,-1],[2,-1]], // Z
    [[0,0],[0,1],[1,1],[2,1]], // J
    [[2,0],[0,1],[1,1],[2,1]]  // L
];
const COLORS = [
    ['#00d4ff', '#0088aa'], // I - cyan
    ['#ffd700', '#cc9900'], // O - yellow
    ['#9b59b6', '#6c3483'], // T - purple
    ['#2ecc71', '#1a9c50'], // S - green
    ['#e74c3c', '#c0392b'], // Z - red
    ['#3498db', '#2471a3'], // J - blue
    ['#f39c12', '#d68910']  // L - orange
];

// SRS Wall Kick data
const KICKS = {
    '0>1': [[-1,0],[-1,-1],[1,0],[-1,2]],
    '1>0': [[1,0],[1,1],[-1,0],[1,-2]],
    '1>2': [[1,0],[1,1],[-1,0],[1,-2]],
    '2>1': [[-1,0],[-1,-1],[1,0],[-1,2]],
    '2>3': [[-1,0],[-1,1],[1,0],[-1,-2]],
    '3>2': [[1,0],[1,-1],[-1,0],[1,2]],
    '3>0': [[1,0],[1,-1],[-1,0],[1,2]],
    '0>3': [[-1,0],[-1,1],[1,0],[-1,-2]]
};

// Game State
let state = 'start'; // start, playing, paused, gameover
let board = [];
let currentPiece = null;
let nextPieces = [];
let holdPiece = null;
let canHold = true;
let score = 0;
let linesCleared = 0;
let level = 1;
let highScore = 0;
let comboCount = 0;
let lastClearTime = 0;
let particles = [];
let floatingTexts = [];
let dropAnimation = 0;
let clearAnimation = 0;
let clearingRows = [];
let speedMs = 800;
let lastTime = 0;
let dropCounter = 0;
let shakeX = 0, shakeY = 0;
let bgStars = [];

try {
    highScore = parseInt(localStorage.getItem('endlessTetrisHigh') || '0') || 0;
} catch(e) { highScore = 0; }

// Initialize stars for background
function initStars() {
    bgStars = [];
    for (let i = 0; i < 80; i++) {
        bgStars.push({
            x: Math.random(),
            y: Math.random(),
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.0002 + 0.0001,
            brightness: Math.random() * 0.5 + 0.3
        });
    }
}
initStars();

// Board functions
function createBoard() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
        board.push(new Array(COLS).fill(null));
    }
}

function getBag() {
    let bag = [0,1,2,3,4,5,6];
    for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    return bag;
}

function getPiece(type) {
    let cells = PIECES[type].map(c => [...c]);
    return { type, rotation: 0, cells };
}

function rotateCells(cells, rot) {
    let result = cells.map(([x, y]) => {
        switch(rot % 4) {
            case 1: return [y, -x];
            case 2: return [-x, -y];
            case 3: return [-y, x];
            default: return [x, y];
        }
    });
    // Normalize to positive
    let minX = Math.min(...result.map(c => c[0]));
    let minY = Math.min(...result.map(c => c[1]));
    if (minX < 0) result.forEach(c => c[0] -= minX);
    if (minY < 0) result.forEach(c => c[1] -= minY);
    return result;
}

function getRotatedCells(piece, targetRot) {
    let cells = PIECES[piece.type].map(c => [...c]);
    for (let i = 0; i < (targetRot % 4); i++) {
        cells = cells.map(([x, y]) => [y, -x]);
    }
    let minX = Math.min(...cells.map(c => c[0]));
    let minY = Math.min(...cells.map(c => c[1]));
    return cells.map(([x,y]) => [x - minX, y - minY]);
}

function canPlace(piece, ox, oy) {
    for (let [cx, cy] of piece.cells) {
        let bx = ox + cx;
        let by = oy + cy;
        if (bx < 0 || bx >= COLS || by >= ROWS) return false;
        if (by >= 0 && board[by][bx]) return false;
    }
    return true;
}

function getGhostY(piece, ox) {
    let y = oy_of_piece;
    while (canPlace(piece, ox, y + 1)) y++;
    return y;
}

let oy_of_piece = 0;

function placePiece() {
    for (let [cx, cy] of currentPiece.cells) {
        let bx = currentPiece.x + cx;
        let by = currentPiece.y + cy;
        if (by >= 0 && by < ROWS && bx >= 0 && bx < COLS) {
            board[by][bx] = currentPiece.type;
        }
    }
}

function checkLines() {
    let lines = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== null)) {
            lines++;
            clearingRows.push(r);
        }
    }
    return lines;
}

function clearLines() {
    for (let i = 0; i < clearingRows.length; i++) {
        let r = clearingRows[i];
        for (let c = 0; c < COLS; c++) {
            if (board[r][c] !== null) {
                spawnClearParticles(c, r, board[r][c]);
            }
        }
    }
    for (let i = 0; i < clearingRows.length; i++) {
        let r = clearingRows[i];
        board.splice(r, 1);
        board.unshift(new Array(COLS).fill(null));
    }
    // Recalculate remaining rows to clear
    let remaining = [];
    for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== null)) remaining.push(r);
    }
    return remaining.length;
}

function spawnClearParticles(col, row, type) {
    const px = getBoardX() + (col + 0.5) * getCellSize();
    const py = getBoardY() + (row + 0.5) * getCellSize();
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: px, y: py,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 3,
            life: 1,
            color: COLORS[type][0],
            size: Math.random() * 4 + 2
        });
    }
}

function addFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, life: 1, color: color || '#fff' });
}

// Scoring
function scoreForClear(lines) {
    const base = [0, 100, 300, 500, 800];
    let pts = base[lines] * level;
    if (comboCount > 0) {
        pts += 50 * comboCount * level;
        addFloatingText('COMBO x' + comboCount, W/2, H/2 - 50, '#ff6');
    }
    return pts;
}

function getSpeed() {
    const base = 800;
    const decay = Math.pow(0.88, level - 1);
    return Math.max(base * decay, 50);
}

// Game flow
let bag = [];
function getNextPiece() {
    if (bag.length === 0) bag = getBag();
    return bag.pop();
}

function spawnPiece() {
    currentPiece = getPiece(getNextPiece());
    currentPiece.x = Math.floor(COLS / 2) - 1;
    currentPiece.y = -getRotatedCells(currentPiece, 0).length > 0 ? -1 : 0;
    // Center the piece
    let cells = currentPiece.cells;
    let maxX = Math.max(...cells.map(c => c[0]));
    currentPiece.x = Math.floor((COLS - 1 - maxX) / 2);
    currentPiece.y = 0;
    while (currentPiece.y > -5 && !canPlace(currentPiece, currentPiece.x, currentPiece.y)) {
        currentPiece.y--;
    }
    if (!canPlace(currentPiece, currentPiece.x, currentPiece.y)) {
        gameOver();
        return;
    }
}

function tryMove(dx, dy) {
    let nx = currentPiece.x + dx;
    let ny = currentPiece.y + dy;
    if (canPlace(currentPiece, nx, ny)) {
        currentPiece.x = nx;
        currentPiece.y = ny;
        return true;
    }
    return false;
}

function tryRotate(dir) {
    let targetRot = (currentPiece.rotation + dir + 4) % 4;
    let key = currentPiece.rotation + '>' + targetRot;
    let kicks = KICKS[key] || [[0,0]];
    for (let [dx, dy] of kicks) {
        if (canPlace(currentPiece, currentPiece.x + dx, currentPiece.y - dy)) {
            currentPiece.x += dx;
            currentPiece.y -= dy;
            currentPiece.rotation = targetRot;
            currentPiece.cells = getRotatedCells({type: currentPiece.type, cells: PIECES[currentPiece.type].map(c=>[...c])}, targetRot);
            playRotate();
            return;
        }
    }
}

function hardDrop() {
    let dist = 0;
    while (canPlace(currentPiece, currentPiece.x, currentPiece.y + 1)) {
        currentPiece.y++;
        dist++;
    }
    score += dist * 2;
    dropAnimation = 1;
    playDrop();
    lockPiece();
}

function softDrop() {
    if (tryMove(0, 1)) {
        score += 1;
    } else {
        lockPiece();
    }
}

function holdSwap() {
    if (!canHold) return;
    canHold = false;
    let tmp = holdPiece;
    holdPiece = currentPiece.type;
    currentPiece = getPiece(tmp !== null ? tmp : getNextPiece());
    let cells = currentPiece.cells;
    let maxX = Math.max(...cells.map(c => c[0]));
    currentPiece.x = Math.floor((COLS - 1 - maxX) / 2);
    currentPiece.y = 0;
    while (currentPiece.y > -5 && !canPlace(currentPiece, currentPiece.x, currentPiece.y)) {
        currentPiece.y--;
    }
    if (!canPlace(currentPiece, currentPiece.x, currentPiece.y)) {
        gameOver();
    }
}

function lockPiece() {
    placePiece();
    canHold = true;
    let lines = checkLines();
    if (lines > 0) {
        clearAnimation = 1;
        comboCount++;
        lastClearTime = Date.now();
        let pts = scoreForClear(lines);
        score += pts;
        addFloatingText('+' + pts, W/2, H/2 - 80, lines >= 4 ? '#f0f' : '#ff0');
        if (lines >= 4) {
            playTetris();
            addFloatingText('TETRIS!', W/2, H/2 - 120, '#f0f');
        } else {
            playClear(lines);
        }
        linesCleared += lines;
        let newLevel = Math.floor(linesCleared / 10) + 1;
        if (newLevel > level) {
            level = newLevel;
            addFloatingText('LEVEL ' + level, W/2, H/2 - 150, '#0ff');
            playLevelUp();
        }
        speedMs = getSpeed();
    } else {
        comboCount = 0;
    }
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('endlessTetrisHigh', highScore.toString()); } catch(e) {}
    }
    spawnPiece();
}

function gameOver() {
    state = 'gameover';
    playGameOver();
    shakeX = 10; shakeY = 10;
}

function startGame() {
    createBoard();
    score = 0;
    linesCleared = 0;
    level = 1;
    comboCount = 0;
    bag = [];
    nextPieces = [getNextPiece(), getNextPiece(), getNextPiece()];
    holdPiece = null;
    canHold = true;
    particles = [];
    floatingTexts = [];
    speedMs = getSpeed();
    state = 'playing';
    spawnPiece();
}

// Rendering
function getCellSize() {
    return Math.min((W * 0.6) / COLS, (H * 0.75) / ROWS);
}
function getBoardX() {
    return (W - COLS * getCellSize()) / 2;
}
function getBoardY() {
    return (H - ROWS * getCellSize()) / 2 + H * 0.02;
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of bgStars) {
        s.y += s.speed * 16;
        if (s.y > 1) { s.y = 0; s.x = Math.random(); }
        ctx.fillStyle = `rgba(255,255,255,${s.brightness})`;
        ctx.fillRect(s.x * W, s.y * H, s.size, s.size);
    }
}

function drawCell(x, y, type, alpha) {
    const cs = getCellSize();
    const bx = getBoardX() + x * cs;
    const by = getBoardY() + y * cs;
    const color = COLORS[type];
    ctx.globalAlpha = alpha || 1;

    // Main face
    ctx.fillStyle = color[0];
    ctx.fillRect(bx + 1, by + 1, cs - 2, cs - 2);

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(bx + 2, by + 2, cs - 4, (cs - 4) * 0.3);

    // Shadow
    ctx.fillStyle = color[1];
    ctx.fillRect(bx + cs - 6, by + cs - 6, cs - 8, cs - 8);

    // Border glow
    ctx.strokeStyle = color[0];
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 1, by + 1, cs - 2, cs - 2);

    ctx.globalAlpha = 1;
}

function drawBoard() {
    const cs = getCellSize();
    const bx = getBoardX();
    const by = getBoardY();

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(bx, by + r * cs);
        ctx.lineTo(bx + COLS * cs, by + r * cs);
        ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(bx + c * cs, by);
        ctx.lineTo(bx + c * cs, by + ROWS * cs);
        ctx.stroke();
    }

    // Placed cells
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (board[r][c] !== null) {
                drawCell(c, r, board[r][c], 1);
            }
        }
    }

    // Clearing animation
    if (clearAnimation > 0) {
        for (let r of clearingRows) {
            const alpha = 1 - clearAnimation;
            ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
            ctx.fillRect(bx, by + r * cs, COLS * cs, cs);
        }
    }

    // Ghost piece
    if (currentPiece && state === 'playing') {
        let ghostY = getGhostY(currentPiece, currentPiece.x);
        for (let [cx, cy] of currentPiece.cells) {
            let gx = currentPiece.x + cx;
            let gy = ghostY + cy;
            if (gy >= 0 && gy < ROWS) {
                ctx.globalAlpha = 0.25;
                const gcs = cs;
                const gbx = bx + gx * gcs;
                const gby = by + gy * gcs;
                ctx.strokeStyle = COLORS[currentPiece.type][0];
                ctx.lineWidth = 2;
                ctx.strokeRect(gbx + 2, gby + 2, gcs - 4, gcs - 4);
                ctx.globalAlpha = 1;
            }
        }
    }

    // Current piece
    if (currentPiece && state === 'playing') {
        for (let [cx, cy] of currentPiece.cells) {
            let px = currentPiece.x + cx;
            let py = currentPiece.y + cy;
            if (py >= 0 && py < ROWS && px >= 0 && px < COLS) {
                drawCell(px, py, currentPiece.type, 1);
            }
        }
    }
}

function drawParticles() {
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
    for (let ft of floatingTexts) {
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.font = `bold ${Math.min(36, W * 0.04)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    const cs = getCellSize();
    const boardX = getBoardX();
    const boardY = getBoardY();

    // Score panel (left side)
    if (W > 600) {
        const panelX = boardX - 180;
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(panelX, boardY, 160, cs * 4);

        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(16, W*0.02)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText('SCORE', panelX + 10, boardY + 30);
        ctx.font = `${Math.min(24, W*0.03)}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = '#0ff';
        ctx.fillText(score.toString(), panelX + 10, boardY + 60);

        ctx.font = `bold ${Math.min(14, W*0.02)}px 'Segoe UI', sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.fillText('LEVEL', panelX + 10, boardY + 95);
        ctx.fillStyle = '#f0f';
        ctx.fillText(level.toString(), panelX + 10, boardY + 120);

        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(14, W*0.02)}px 'Segoe UI', sans-serif`;
        ctx.fillText('LINES', panelX + 10, boardY + 150);
        ctx.fillStyle = '#0f0';
        ctx.fillText(linesCleared.toString(), panelX + 10, boardY + 172);

        // Hold piece
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(panelX, boardY + cs * 4 + 20, 160, cs * 2.5);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(14, W*0.02)}px 'Segoe UI', sans-serif`;
        ctx.fillText('HOLD', panelX + 10, boardY + cs * 4 + 45);

        if (holdPiece !== null) {
            let hs = cs * 0.5;
            let hx = panelX + 30;
            let hy = boardY + cs * 4 + 60;
            let cells = PIECES[holdPiece];
            for (let [cx, cy] of cells) {
                ctx.fillStyle = COLORS[holdPiece][0];
                ctx.globalAlpha = canHold ? 1 : 0.4;
                ctx.fillRect(hx + cx * hs, hy + cy * hs, hs - 2, hs - 2);
            }
            ctx.globalAlpha = 1;
        }
    }

    // Next pieces (right side)
    if (W > 600) {
        const panelX = boardX + COLS * cs + 20;
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(panelX, boardY, 160, cs * 5);

        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(14, W*0.02)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText('NEXT', panelX + 10, boardY + 30);

        for (let i = 0; i < 3; i++) {
            if (nextPieces[i] !== undefined) {
                let ns = cs * 0.4;
                let nx = panelX + 20;
                let ny = boardY + 50 + i * cs * 1.2;
                let cells = PIECES[nextPieces[i]];
                let maxX = Math.max(...cells.map(c => c[0]));
                let maxYP = Math.max(...cells.map(c => c[1]));
                let offX = -(maxX / 2);
                for (let [cx, cy] of cells) {
                    ctx.fillStyle = COLORS[nextPieces[i]][0];
                    ctx.fillRect(nx + (cx + offX) * ns, ny + (cy - maxYP/2) * ns, ns - 2, ns - 2);
                }
            }
        }
    }

    // High score at top
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `${Math.min(14, W*0.018)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('HIGH: ' + highScore, W/2, 30);

    // Speed indicator
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = `${Math.min(12, W*0.015)}px 'Segoe UI', sans-serif`;
    ctx.fillText('SPEED: ' + Math.round(1000/speedMs * 10) + '%', W/2, 50);
}

function drawStartScreen() {
    drawBackground();
    const cx = W / 2;
    const cy = H / 2;

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(64, W * 0.08)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('ENDLESS TETRIS', cx, cy - 100);

    // Glow effect
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#0ff';
    ctx.font = `bold ${Math.min(64, W * 0.08)}px 'Segoe UI', sans-serif`;
    ctx.fillText('ENDLESS TETRIS', cx, cy - 100);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = `${Math.min(18, W * 0.025)}px 'Segoe UI', sans-serif`;
    ctx.fillText('The speed never stops. How long can you last?', cx, cy - 50);

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `${Math.min(16, W * 0.02)}px 'Segoe UI', sans-serif`;
    const lines = [
        '← → : Move',
        '↑ / C : Rotate CW',
        'Z : Rotate CCW',
        '↓ : Soft Drop',
        'SPACE : Hard Drop',
        'C : Hold (Swap)',
        'P : Pause'
    ];
    // Actually let me fix: C is rotate, let me use different keys
    const controls = [
        '← → : Move    ↑/X : Rotate CW',
        'Z : Rotate CCW    ↓ : Soft Drop',
        'SPACE : Hard Drop    C : Hold',
        'P : Pause    R : Restart'
    ];
    for (let i = 0; i < controls.length; i++) {
        ctx.fillText(controls[i], cx, cy + 10 + i * 28);
    }

    // High score
    if (highScore > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = `${Math.min(20, W * 0.025)}px 'Segoe UI', sans-serif`;
        ctx.fillText('HIGH SCORE: ' + highScore, cx, cy + 140);
    }

    // Blinking "Press Enter"
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(24, W * 0.03)}px 'Segoe UI', sans-serif`;
        ctx.fillText('PRESS ENTER TO START', cx, cy + 200);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;

    ctx.fillStyle = '#f44';
    ctx.font = `bold ${Math.min(48, W * 0.06)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', cx, cy - 60);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(24, W * 0.03)}px 'Segoe UI', sans-serif`;
    ctx.fillText('Score: ' + score, cx, cy - 10);
    ctx.fillText('Lines: ' + linesCleared, cx, cy + 30);
    ctx.fillText('Level: ' + level, cx, cy + 70);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = `bold ${Math.min(28, W * 0.035)}px 'Segoe UI', sans-serif`;
        ctx.fillText('NEW HIGH SCORE!', cx, cy + 120);
    }

    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(20, W * 0.025)}px 'Segoe UI', sans-serif`;
        ctx.fillText('Press R or ENTER to Restart', cx, cy + 180);
    }
}

function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(48, W * 0.05)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = `${Math.min(18, W * 0.025)}px 'Segoe UI', sans-serif`;
    ctx.fillText('Press P to resume', W/2, H/2 + 40);
}

// Update
function update(dt) {
    if (state !== 'playing') return;

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= dt * 50;
        ft.life -= dt * 1.5;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    // Clear animation
    if (clearAnimation > 0) {
        clearAnimation -= dt * 4;
        if (clearAnimation <= 0) {
            clearAnimation = 0;
            clearingRows = [];
        }
    }

    // Drop animation
    if (dropAnimation > 0) dropAnimation -= dt * 8;

    // Shake
    if (shakeX > 0 || shakeY > 0) {
        shakeX = Math.max(0, shakeX - dt * 30);
        shakeY = Math.max(0, shakeY - dt * 30);
    }

    // Gravity
    dropCounter += dt * 1000;
    if (dropCounter >= speedMs) {
        dropCounter = 0;
        if (!tryMove(0, 1)) {
            lockPiece();
        }
    }
}

function render() {
    ctx.save();
    if (shakeX > 0 || shakeY > 0) {
        ctx.translate((Math.random()-0.5)*shakeX, (Math.random()-0.5)*shakeY);
    }

    drawBackground();

    if (state === 'start') {
        drawStartScreen();
    } else {
        drawBoard();
        drawParticles();
        drawFloatingTexts();
        drawHUD();

        if (state === 'paused') drawPause();
        if (state === 'gameover') drawGameOver();
    }

    ctx.restore();
}

// Game Loop
function gameLoop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.016;
    lastTime = timestamp;

    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', (e) => {
    initAudio();

    if (state === 'start') {
        if (e.key === 'Enter' || e.key === ' ') {
            startGame();
        }
        return;
    }

    if (state === 'gameover') {
        if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
            startGame();
        }
        return;
    }

    if (state === 'paused') {
        if (e.key === 'p' || e.key === 'P') {
            state = 'playing';
        }
        return;
    }

    if (state !== 'playing') return;

    switch(e.key) {
        case 'ArrowLeft':
            e.preventDefault();
            if (tryMove(-1, 0)) playSound(300, 0.02, 'sine', 0.03);
            break;
        case 'ArrowRight':
            e.preventDefault();
            if (tryMove(1, 0)) playSound(300, 0.02, 'sine', 0.03);
            break;
        case 'ArrowUp':
        case 'x':
        case 'X':
            e.preventDefault();
            tryRotate(1);
            break;
        case 'z':
        case 'Z':
            e.preventDefault();
            tryRotate(-1);
            break;
        case 'ArrowDown':
            e.preventDefault();
            if (tryMove(0, 1)) {
                score += 1;
            } else {
                lockPiece();
            }
            break;
        case ' ':
            e.preventDefault();
            hardDrop();
            break;
        case 'c':
        case 'C':
            e.preventDefault();
            holdSwap();
            break;
        case 'p':
        case 'P':
            state = 'paused';
            break;
        case 'r':
        case 'R':
            startGame();
            break;
    }
});

// Prevent scrolling
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
    }
});

// Start
createBoard();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
