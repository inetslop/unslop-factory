<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogger Racing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #1a1a2e; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let W, H;
    let audioCtx = null;

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game constants
    const LANES = 5;
    const FROG_R = 18;

    let gameState = 'start'; // start, playing, gameover
    let frogLane = 2;
    let frogX, frogY;
    let laneWidth, laneHeight;
    let speed = 0;
    let maxSpeed = 300;
    let distance = 0;
    let totalDistance = 5000;
    let cars = [];
    let particles = [];
    let score = 0;
    let nearMissCount = 0;
    let time = 0;
    let lastTime = 0;
    let gameStartTime = 0;
    let bestScore = 0;

    try {
        bestScore = parseInt(localStorage.getItem('froggerRacingBest') || '0');
    } catch(e) {}

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'hop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'nearmiss') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'finish') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
            gain2.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc2.start(audioCtx.currentTime + 0.15);
            osc2.stop(audioCtx.currentTime + 0.6);
        }

        osc.onended = () => { };
    }

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startGame() {
        gameState = 'playing';
        frogLane = 2;
        laneWidth = W / LANES;
        laneHeight = H * 0.95;
        frogX = (frogLane + 0.5) * laneWidth;
        frogY = H - 60;
        speed = 100;
        distance = 0;
        cars = [];
        particles = [];
        score = 0;
        nearMissCount = 0;
        time = 0;
        gameStartTime = performance.now();
    }

    function spawnCar() {
        const lane = Math.floor(Math.random() * LANES);
        const carWidth = laneWidth * 0.6;
        const carHeight = 35 + Math.random() * 20;
        const carSpeed = (Math.random() > 0.5 ? 1 : -1) * (80 + Math.random() * 120);
        let x = carSpeed > 0 ? -carWidth : W + carWidth;

        cars.push({
            lane: lane,
            x: x,
            y: -50 - Math.random() * 200,
            width: carWidth,
            height: carHeight,
            speed: carSpeed,
            passed: false,
            color: ['#e74c3c', '#3498db', '#f39c12', '#9b59b6', '#1abc9c'][Math.floor(Math.random() * 5)]
        });
    }

    function addParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 200,
                vy: (Math.random() - 0.5) * 200 - 50,
                life: 1,
                color: color,
                size: 3 + Math.random() * 5
            });
        }
    }

    function update(dt) {
        if (gameState !== 'playing') return;

        time += dt;
        speed = 100 + (time / 60) * 50;
        if (speed > maxSpeed) speed = maxSpeed;

        distance += speed * dt;
        score = Math.floor(distance);

        // Spawn cars
        const spawnRate = 0.8 - (time / 120) * 0.3;
        if (Math.random() < (dt / Math.max(spawnRate, 0.3)) * LANES * 0.4) {
            spawnCar();
        }

        // Update cars
        for (let i = cars.length - 1; i >= 0; i--) {
            const car = cars[i];
            car.y += speed * dt;
            car.x += car.speed * dt;

            if (car.y > H + 100 || car.x < -200 || car.x > W + 200) {
                cars.splice(i, 1);
                continue;
            }

            // Check collision
            const frogLeft = frogX - FROG_R;
            const frogRight = frogX + FROG_R;
            const frogTop = frogY - FROG_R;
            const frogBottom = frogY + FROG_R;

            const carLeft = car.x - car.width / 2;
            const carRight = car.x + car.width / 2;
            const carTop = car.y - car.height / 2;
            const carBottom = car.y + car.height / 2;

            if (frogLeft < carRight && frogRight > carLeft && frogTop < carBottom && frogBottom > carTop) {
                // Crash!
                gameState = 'gameover';
                playSound('crash');
                addParticles(frogX, frogY, '#4caf50', 20);
                if (score > bestScore) {
                    bestScore = score;
                    try { localStorage.setItem('froggerRacingBest', bestScore.toString()); } catch(e) {}
                }
            } else if (!car.passed && car.y > frogY + FROG_R) {
                car.passed = true;
                const gap = Math.abs(frogX - car.x);
                if (gap < laneWidth * 0.8) {
                    nearMissCount++;
                    score += 50;
                    playSound('nearmiss');
                    addParticles(frogX, frogY, '#ffeb3b', 5);
                }
            }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Check finish
        if (distance >= totalDistance) {
            gameState = 'finished';
            playSound('finish');
            const finalScore = score + nearMissCount * 100 + Math.floor((60 - (performance.now() - gameStartTime) / 1000)) * 10;
            if (finalScore > bestScore) {
                bestScore = finalScore;
                try { localStorage.setItem('froggerRacingBest', bestScore.toString()); } catch(e) {}
            }
            score = Math.max(score, finalScore);
        }

        // Smooth frog X movement
        const targetX = (frogLane + 0.5) * laneWidth;
        frogX += (targetX - frogX) * 12 * dt;
    }

    function drawRoad() {
        const roadLeft = laneWidth * 0.3;
        const roadRight = W - laneWidth * 0.3;

        // Road background
        ctx.fillStyle = '#2d2d2d';
        ctx.fillRect(roadLeft, 0, roadRight - roadLeft, H);

        // Lane lines
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.setLineDash([20, 15]);
        const dashOffset = (time * speed) % 35;
        for (let i = 1; i < LANES; i++) {
            const x = roadLeft + i * laneWidth;
            ctx.beginPath();
            ctx.setLineDash([20, 15]);
            ctx.lineDashOffset = -dashOffset;
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
        }
        ctx.setLineDash([]);

        // Road edges
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(roadLeft, 0);
        ctx.lineTo(roadLeft, H);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(roadRight, 0);
        ctx.lineTo(roadRight, H);
        ctx.stroke();

        // Grass/shoulders
        ctx.fillStyle = '#1b5e20';
        ctx.fillRect(0, 0, roadLeft, H);
        ctx.fillRect(roadRight, 0, W - roadRight, H);

        // Shoulder details
        ctx.fillStyle = '#2e7d32';
        for (let y = 0; y < H; y += 40) {
            const offset = ((time * speed) % 40);
            const yy = (y + offset) % H;
            ctx.fillRect(0, yy, roadLeft * 0.3, 8);
            ctx.fillRect(roadRight + roadRight * 0.7, yy, W - roadRight, 8);
        }
    }

    function drawCar(car) {
        const x = car.x - car.width / 2;
        const y = car.y - car.height / 2;

        // Car body
        ctx.fillStyle = car.color;
        ctx.beginPath();
        ctx.roundRect(x, y, car.width, car.height, 8);
        ctx.fill();

        // Car top (windshield)
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x + 4, y + 4, car.width - 8, car.height * 0.3);

        // Taillights
        ctx.fillStyle = '#ff1744';
        ctx.fillRect(x + 2, y + car.height - 6, 6, 4);
        ctx.fillRect(x + car.width - 8, y + car.height - 6, 6, 4);

        // Headlights
        ctx.fillStyle = '#fff9c4';
        ctx.fillRect(x + 2, y + 2, 6, 3);
        ctx.fillRect(x + car.width - 8, y + 2, 6, 3);
    }

    function drawFrog() {
        const x = frogX;
        const y = frogY;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(x, y + 12, FROG_R * 0.8, FROG_R * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.arc(x, y, FROG_R, 0, Math.PI * 2);
        ctx.fill();

        // Belly
        ctx.fillStyle = '#a5d6a7';
        ctx.beginPath();
        ctx.arc(x, y + 4, FROG_R * 0.6, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x - 8, y - 10, 7, 0, Math.PI * 2);
        ctx.arc(x + 8, y - 10, 7, 0, Math.PI * 2);
        ctx.fill();

        // Pupils
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(x - 8, y - 10, 3, 0, Math.PI * 2);
        ctx.arc(x + 8, y - 10, 3, 0, Math.PI * 2);
        ctx.fill();

        // Mouth
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y + 4, 8, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // Legs (little bumps)
        ctx.fillStyle = '#388e3c';
        ctx.beginPath();
        ctx.ellipse(x - FROG_R + 2, y + 10, 6, 4, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + FROG_R - 2, y + 10, 6, 4, 0.3, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawHUD() {
        // Distance progress bar
        const barW = W * 0.5;
        const barH = 12;
        const barX = (W - barW) / 2;
        const barY = 10;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.roundRect(barX - 5, barY - 5, barW + 10, barH + 10, 8);
        ctx.fill();

        ctx.fillStyle = '#424242';
        ctx.fillRect(barX, barY, barW, barH);

        const progress = Math.min(distance / totalDistance, 1);
        const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
        grad.addColorStop(0, '#4caf50');
        grad.addColorStop(1, '#8bc34a');
        ctx.fillStyle = grad;
        ctx.fillRect(barX, barY, barW * progress, barH);

        // Frog icon on progress bar
        const frogBarX = barX + barW * progress - 8;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(frogBarX, barY + barH / 2, 5, 0, Math.PI * 2);
        ctx.fill();

        // Score
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCORE: ' + score, 15, H - 20);

        // Near misses
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffeb3b';
        ctx.fillText('NEAR MISSES: ' + nearMissCount, W - 15, H - 20);

        // Speed
        ctx.textAlign = 'center';
        ctx.fillStyle = '#90caf9';
        ctx.font = '14px monospace';
        ctx.fillText(Math.floor(speed) + ' km/h', W / 2, H - 20);

        // Finish line marker on progress bar
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('FINISH', barX + barW + 40, barY + barH - 2);
    }

    function drawStartScreen() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);

        // Title
        ctx.fillStyle = '#4caf50';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FROGGER RACING', W / 2, H * 0.2);

        // Frog on start screen
        const frogScreenX = W / 2;
        const frogScreenY = H * 0.35;
        ctx.fillStyle = '#4caf50';
        ctx.beginPath();
        ctx.arc(frogScreenX, frogScreenY, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#a5d6a7';
        ctx.beginPath();
        ctx.arc(frogScreenX, frogScreenY + 6, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(frogScreenX - 12, frogScreenY - 14, 9, 0, Math.PI * 2);
        ctx.arc(frogScreenX + 12, frogScreenY - 14, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.arc(frogScreenX - 12, frogScreenY - 14, 4, 0, Math.PI * 2);
        ctx.arc(frogScreenX + 12, frogScreenY - 14, 4, 0, Math.PI * 2);
        ctx.fill();

        // Instructions
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText('← → or A/D to change lanes', W / 2, H * 0.52);
        ctx.fillText('Dodge traffic & reach the finish!', W / 2, H * 0.57);
        ctx.fillText('Near misses = bonus points', W / 2, H * 0.62);

        // Best score
        if (bestScore > 0) {
            ctx.fillStyle = '#ffeb3b';
            ctx.font = '16px monospace';
            ctx.fillText('BEST: ' + bestScore, W / 2, H * 0.7);
        }

        // Start prompt
        const blink = Math.sin(performance.now() / 400) > 0;
        if (blink) {
            ctx.fillStyle = '#69f0ae';
            ctx.font = 'bold 22px monospace';
            ctx.fillText('PRESS SPACE TO RACE', W / 2, H * 0.82);
        }

        // Controls box
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(W / 2 - 200, H * 0.48, 400, 90);
    }

    function drawGameOver() {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 42px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('WRECKED!', W / 2, H * 0.35);

        ctx.fillStyle = '#fff';
        ctx.font = '22px monospace';
        ctx.fillText('Score: ' + score, W / 2, H * 0.45);
        ctx.fillText('Distance: ' + Math.floor(distance) + 'm', W / 2, H * 0.52);
        ctx.fillText('Near Misses: ' + nearMissCount, W / 2, H * 0.59);

        if (score >= bestScore && score > 0) {
            ctx.fillStyle = '#ffeb3b';
            ctx.font = 'bold 20px monospace';
            ctx.fillText('★ NEW BEST! ★', W / 2, H * 0.68);
        }

        const blink = Math.sin(performance.now() / 400) > 0;
        if (blink) {
            ctx.fillStyle = '#69f0ae';
            ctx.font = 'bold 18px monospace';
            ctx.fillText('PRESS SPACE TO RESTART', W / 2, H * 0.8);
        }
    }

    function drawFinished() {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#4caf50';
        ctx.font = 'bold 38px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🏁 FINISH! 🏁', W / 2, H * 0.3);

        ctx.fillStyle = '#fff';
        ctx.font = '22px monospace';
        ctx.fillText('Final Score: ' + score, W / 2, H * 0.42);
        ctx.fillText('Near Miss Bonus: +' + (nearMissCount * 100), W / 2, H * 0.5);

        if (score >= bestScore && score > 0) {
            ctx.fillStyle = '#ffeb3b';
            ctx.font = 'bold 20px monospace';
            ctx.fillText('★ NEW BEST! ★', W / 2, H * 0.6);
        }

        const blink = Math.sin(performance.now() / 400) > 0;
        if (blink) {
            ctx.fillStyle = '#69f0ae';
            ctx.font = 'bold 18px monospace';
            ctx.fillText('PRESS SPACE TO RACE AGAIN', W / 2, H * 0.75);
        }
    }

    function draw() {
        if (gameState === 'start') {
            drawStartScreen();
            return;
        }

        // Draw game world
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);

        drawRoad();

        // Draw cars
        for (const car of cars) {
            drawCar(car);
        }

        // Draw particles
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Draw frog
        if (gameState === 'playing') {
            drawFrog();
        }

        // HUD
        drawHUD();

        // Overlays
        if (gameState === 'gameover') drawGameOver();
        if (gameState === 'finished') drawFinished();
    }

    function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    // Input
    window.addEventListener('keydown', function(e) {
        if (!audioCtx) initAudio();

        if (gameState === 'start' || gameState === 'gameover' || gameState === 'finished') {
            if (e.code === 'Space' || e.code === 'Enter') {
                startGame();
            }
            return;
        }

        if (gameState !== 'playing') return;

        if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && frogLane > 0) {
            frogLane--;
            playSound('hop');
        } else if ((e.code === 'ArrowRight' || e.code === 'KeyD') && frogLane < LANES - 1) {
            frogLane++;
            playSound('hop');
        }

        e.preventDefault();
    });

    // Touch controls
    let touchStartX = null;
    canvas.addEventListener('touchstart', function(e) {
        initAudio();
        if (gameState === 'start' || gameState === 'gameover' || gameState === 'finished') {
            startGame();
            return;
        }
        touchStartX = e.touches[0].clientX;
    });

    canvas.addEventListener('touchend', function(e) {
        if (touchStartX !== null && gameState === 'playing') {
            const endX = e.changedTouches[0].clientX;
            const dx = endX - touchStartX;
            if (dx < -30 && frogLane > 0) {
                frogLane--;
                playSound('hop');
            } else if (dx > 30 && frogLane < LANES - 1) {
                frogLane++;
                playSound('hop');
            }
        }
        touchStartX = null;
    });

    // Click to start
    canvas.addEventListener('click', function() {
        initAudio();
        if (gameState === 'start' || gameState === 'gameover' || gameState === 'finished') {
            startGame();
        }
    });

    // Init
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
