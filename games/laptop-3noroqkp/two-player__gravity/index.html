<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Duel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game state
let gameState = 'start'; // start, playing, gameover
let score1 = 0, score2 = 0;
let timeLeft = 60;
let lastTime = 0;
let particles = [];
let balls = [];
let stars = [];

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playTone(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playScore() {
    playTone(880, 0.2, 'sine', 0.2);
    setTimeout(() => playTone(1100, 0.3, 'sine', 0.15), 80);
}

function playBounce() {
    playTone(200 + Math.random() * 100, 0.08, 'triangle', 0.05);
}

// Stars background
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.3 + 0.1
        });
    }
}

// Players
const p1 = { x: 0, y: 0, radius: 25, color: '#4fc3f7', glowColor: 'rgba(79,195,247,', name: 'P1' };
const p2 = { x: 0, y: 0, radius: 25, color: '#ff7043', glowColor: 'rgba(255,112,67,', name: 'P2' };

function initPlayers() {
    p1.x = W * 0.2;
    p1.y = H / 2;
    p2.x = W * 0.8;
    p2.y = H / 2;
}

// Balls
function createBall() {
    const x = W * 0.3 + Math.random() * W * 0.4;
    const y = H * 0.2 + Math.random() * H * 0.6;
    return {
        x, y,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        radius: 8 + Math.random() * 4,
        hue: Math.random() * 60 + 20 // warm colors
    };
}

function initBalls() {
    balls = [];
    for (let i = 0; i < 5; i++) {
        balls.push(createBall());
    }
}

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color,
            size: Math.random() * 4 + 2
        });
    }
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start') {
        initAudio();
        startGame();
    } else if (gameState === 'gameover' && e.code === 'Space') {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    gameState = 'playing';
    score1 = 0;
    score2 = 0;
    timeLeft = 60;
    initPlayers();
    initBalls();
    particles = [];
}

// Goal zones
function getGoalZones() {
    const gw = 30, gh = 80;
    return {
        p1: { x: 0, y: H/2 - gh/2, w: gw, h: gh }, // left edge (P2 scores here)
        p2: { x: W - gw, y: H/2 - gh/2, w: gw, h: gh } // right edge (P1 scores here)
    };
}

// Update
function update(dt) {
    if (gameState !== 'playing') return;

    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        gameState = 'gameover';
        return;
    }

    // Move players - constrained to their half
    const speed = 4;
    if (keys['KeyW']) p1.y -= speed;
    if (keys['KeyS']) p1.y += speed;
    if (keys['KeyA']) p1.x -= speed;
    if (keys['KeyD']) p1.x += speed;
    p1.x = Math.max(p1.radius, Math.min(W * 0.45, p1.x));
    p1.y = Math.max(p1.radius, Math.min(H - p1.radius, p1.y));

    if (keys['ArrowUp']) p2.y -= speed;
    if (keys['ArrowDown']) p2.y += speed;
    if (keys['ArrowLeft']) p2.x -= speed;
    if (keys['ArrowRight']) p2.x += speed;
    p2.x = Math.max(W * 0.55, Math.min(W - p2.radius, p2.x));
    p2.y = Math.max(p2.radius, Math.min(H - p2.radius, p2.y));

    // Update balls
    const goals = getGoalZones();
    for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];

        // Gravity from P1
        let dx1 = p1.x - b.x, dy1 = p1.y - b.y;
        let dist1 = Math.sqrt(dx1*dx1 + dy1*dy1) + 1;
        let force1 = 800 / (dist1 * dist1);
        b.vx += (dx1 / dist1) * force1 * dt;
        b.vy += (dy1 / dist1) * force1 * dt;

        // Gravity from P2
        let dx2 = p2.x - b.x, dy2 = p2.y - b.y;
        let dist2 = Math.sqrt(dx2*dx2 + dy2*dy2) + 1;
        let force2 = 800 / (dist2 * dist2);
        b.vx += (dx2 / dist2) * force2 * dt;
        b.vy += (dy2 / dist2) * force2 * dt;

        // Damping
        b.vx *= 0.995;
        b.vy *= 0.995;

        // Speed limit
        const spd = Math.sqrt(b.vx*b.vx + b.vy*b.vy);
        if (spd > 8) {
            b.vx = (b.vx / spd) * 8;
            b.vy = (b.vy / spd) * 8;
        }

        // Move
        b.x += b.vx;
        b.y += b.vy;

        // Wall bounce
        if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -0.8; playBounce(); }
        if (b.x + b.radius > W) { b.x = W - b.radius; b.vx *= -0.8; playBounce(); }
        if (b.y - b.radius < 0) { b.y = b.radius; b.vy *= -0.8; playBounce(); }
        if (b.y + b.radius > H) { b.y = H - b.radius; b.vy *= -0.8; playBounce(); }

        // Check goal zones
        const g1 = goals.p1, g2 = goals.p2;
        if (b.x < g1.w && b.y > g1.y && b.y < g1.y + g1.h) {
            // P2 scores!
            score2++;
            playScore();
            spawnParticles(b.x, b.y, p2.color, 20);
            balls.splice(i, 1);
            setTimeout(() => { if (gameState === 'playing') balls.push(createBall()); }, 1500);
        } else if (b.x > W - g2.w && b.y > g2.y && b.y < g2.y + g2.h) {
            // P1 scores!
            score1++;
            playScore();
            spawnParticles(b.x, b.y, p1.color, 20);
            balls.splice(i, 1);
            setTimeout(() => { if (gameState === 'playing') balls.push(createBall()); }, 1500);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Stars drift
    for (const s of stars) {
        s.x -= s.speed;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    }
}

// Render
function drawStars() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size * 0.2})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawGoalZones() {
    const goals = getGoalZones();
    // P1 goal (left) - P2 scores here
    ctx.fillStyle = 'rgba(255,112,67,0.3)';
    ctx.fillRect(goals.p1.x, goals.p1.y, goals.p1.w, goals.p1.h);
    ctx.strokeStyle = 'rgba(255,112,67,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(goals.p1.x, goals.p1.y, goals.p1.w, goals.p1.h);

    // P2 goal (right) - P1 scores here
    ctx.fillStyle = 'rgba(79,195,247,0.3)';
    ctx.fillRect(goals.p2.x, goals.p2.y, goals.p2.w, goals.p2.h);
    ctx.strokeStyle = 'rgba(79,195,247,0.7)';
    ctx.strokeRect(goals.p2.x, goals.p2.y, goals.p2.w, goals.p2.h);

    // Labels
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff7043';
    ctx.fillText('P2', goals.p1.x + goals.p1.w/2, goals.p1.y - 8);
    ctx.fillStyle = '#4fc3f7';
    ctx.fillText('P1', goals.p2.x + goals.p2.w/2, goals.p2.y - 8);
}

function drawGravityWell(p) {
    // Glow
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
    grad.addColorStop(0, p.glowColor + '0.4)');
    grad.addColorStop(1, p.glowColor + '0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
    ctx.fill();

    // Core
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    // Inner glow
    const inner = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
    inner.addColorStop(0, 'rgba(255,255,255,0.6)');
    inner.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();

    // Ring
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius + 8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Label
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(p.name, p.x, p.y + 5);
}

function drawBall(b) {
    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 2);
    grad.addColorStop(0, `hsla(${b.hue}, 100%, 70%, 0.8)`);
    grad.addColorStop(1, `hsla(${b.hue}, 100%, 50%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius * 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `hsl(${b.hue}, 100%, 75%)`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(b.x - b.radius*0.3, b.y - b.radius*0.3, b.radius*0.4, 0, Math.PI * 2);
    ctx.fill();
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Score
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4fc3f7';
    ctx.fillText(score1, W * 0.25, 50);
    ctx.fillStyle = '#ff7043';
    ctx.fillText(score2, W * 0.75, 50);

    // Timer
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = timeLeft < 10 ? '#ff5252' : '#fff';
    const t = Math.ceil(timeLeft);
    ctx.fillText(t, W / 2, 50);

    // Divider line (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 8]);
    ctx.beginPath();
    ctx.moveTo(W/2, 60);
    ctx.lineTo(W/2, H - 20);
    ctx.stroke();
    ctx.setLineDash([]);

    // Goal labels at top
    ctx.font = '14px monospace';
    ctx.fillStyle = '#4fc3f7';
    ctx.fillText('P1 GOAL →', W * 0.85, H/2 + 60);
    ctx.fillStyle = '#ff7043';
    ctx.fillText('← P2 GOAL', W * 0.15, H/2 + 60);
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size * 0.2})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.textAlign = 'center';
    ctx.font = 'bold 52px monospace';
    const titleGrad = ctx.createLinearGradient(W/2 - 150, 0, W/2 + 150, 0);
    titleGrad.addColorStop(0, '#4fc3f7');
    titleGrad.addColorStop(1, '#ff7043');
    ctx.fillStyle = titleGrad;
    ctx.fillText('GRAVITY DUEL', W/2, H * 0.25);

    ctx.font = '20px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Pull orbs to your side! Push them into the enemy goal!', W/2, H * 0.38);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#4fc3f7';
    ctx.fillText('PLAYER 1 (Left):  W A S D', W/2 - 150, H * 0.52);
    ctx.fillStyle = '#ff7043';
    ctx.fillText('PLAYER 2 (Right):  ↑ ← ↓ →', W/2 + 150, H * 0.52);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('Your gravity well attracts nearby orbs.', W/2, H * 0.63);
    ctx.fillText('Score by pushing orbs into the opponent\'s goal zone.', W/2, H * 0.67);
    ctx.fillText('First to score most in 60 seconds wins!', W/2, H * 0.71);

    // Blinking prompt
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.font = 'bold 24px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('— PRESS ANY KEY TO START —', W/2, H * 0.85);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(10,10,26,0.85)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    let winner;
    if (score1 > score2) winner = 'PLAYER 1 WINS!';
    else if (score2 > score1) winner = 'PLAYER 2 WINS!';
    else winner = "IT'S A TIE!";

    ctx.font = 'bold 48px monospace';
    const wc = score1 > score2 ? '#4fc3f7' : score2 > score1 ? '#ff7043' : '#fff';
    ctx.fillStyle = wc;
    ctx.fillText(winner, W/2, H * 0.35);

    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#4fc3f7';
    ctx.fillText(score1, W * 0.4, H * 0.5);
    ctx.fillStyle = '#888';
    ctx.font = '28px monospace';
    ctx.fillText('—', W/2, H * 0.5);
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#ff7043';
    ctx.fillText(score2, W * 0.6, H * 0.5);

    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.font = '22px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('PRESS SPACE TO RESTART', W/2, H * 0.7);
    }
}

function render() {
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    drawStars();
    drawGoalZones();

    // Draw gravity influence lines
    for (const b of balls) {
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
    }

    for (const b of balls) drawBall(b);
    drawGravityWell(p1);
    drawGravityWell(p2);
    drawParticles();
    drawHUD();

    if (gameState === 'gameover') {
        drawGameOver();
    }
}

// Main loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

initStars();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
