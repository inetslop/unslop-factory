<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Storm - Endless Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch(type) {
        case 'shoot':
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
        case 'explosion':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
        case 'hit':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
        case 'powerup':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            break;
        case 'gameover':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
            break;
    }
}

// Game State
let state = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('voidStormHigh') || '0'); } catch(e) {}
let multiplier = 1;
let lives = 3;
let wave = 1;
let waveTimer = 0;
let spawnInterval = 60;
let gameSpeed = 1;

// Player
let player = { x: 0, y: 0, w: 30, h: 40, speed: 5, shootCooldown: 0, invincible: 0, shield: 0, powerLevel: 1 };
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];
let powerups = [];
let shakeTimer = 0;
let shakeIntensity = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) startGame();
    initAudio();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Stars
function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, speed: 0.5 + Math.random() * 2, size: Math.random() * 2 + 0.5 });
    }
}

function startGame() {
    state = 'playing';
    score = 0;
    multiplier = 1;
    lives = 3;
    wave = 1;
    waveTimer = 0;
    spawnInterval = 60;
    gameSpeed = 1;
    player.x = W / 2;
    player.y = H - 80;
    player.invincible = 0;
    player.shield = 0;
    player.powerLevel = 1;
    player.shootCooldown = 0;
    bullets = [];
    enemies = [];
    particles = [];
    powerups = [];
    shakeTimer = 0;
    initStars();
}

// Spawn enemy
function spawnEnemy() {
    const types = ['basic', 'fast', 'tank', 'shooter', 'splitter'];
    let type = 'basic';
    const r = Math.random();
    if (wave >= 2 && r > 0.7) type = 'fast';
    if (wave >= 3 && r > 0.85) type = 'tank';
    if (wave >= 4 && r > 0.9) type = 'shooter';
    if (wave >= 5 && r > 0.95) type = 'splitter';

    const e = { x: Math.random() * (W - 60) + 30, y: -40, w: 30, h: 30, hp: 1, speed: 2, type, score: 10 };
    
    switch(type) {
        case 'basic': e.w = 30; e.h = 30; e.hp = 1; e.speed = 2; e.score = 10; break;
        case 'fast': e.w = 24; e.h = 24; e.hp = 1; e.speed = 4 + Math.random() * 2; e.score = 25; break;
        case 'tank': e.w = 45; e.h = 45; e.hp = 3 + wave; e.speed = 1; e.score = 50; break;
        case 'shooter': e.w = 35; e.h = 35; e.hp = 2; e.speed = 1.5; e.score = 40; e.shootTimer = 60 + Math.random() * 60; break;
        case 'splitter': e.w = 40; e.h = 40; e.hp = 2; e.speed = 1.8; e.score = 35; break;
    }
    
    e.maxHp = e.hp;
    enemies.push(e);
}

function spawnEnemyBullet(x, y) {
    const angle = Math.atan2(player.y - y, player.x - x) + (Math.random() - 0.5) * 0.5;
    bullets.push({ x, y, vx: Math.cos(angle) * 4, vy: Math.sin(angle) * 4, w: 8, h: 8, enemy: true, life: 200 });
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 30 + Math.random() * 30, color, size: Math.random() * 4 + 2 });
    }
}

function spawnPowerup(x, y) {
    const types = ['spread', 'shield', 'speed', 'heal'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ x, y, w: 20, h: 20, vy: 1.5, type });
}

function shoot() {
    if (player.shootCooldown > 0) return;
    player.shootCooldown = 8;
    
    const bx = player.x;
    const by = player.y - 20;
    
    if (player.powerLevel === 1) {
        bullets.push({ x: bx, y: by, vx: 0, vy: -10, w: 4, h: 14, enemy: false });
    } else if (player.powerLevel === 2) {
        bullets.push({ x: bx - 8, y: by, vx: 0, vy: -10, w: 4, h: 14, enemy: false });
        bullets.push({ x: bx + 8, y: by, vx: 0, vy: -10, w: 4, h: 14, enemy: false });
    } else {
        bullets.push({ x: bx - 10, y: by, vx: -1, vy: -10, w: 4, h: 14, enemy: false });
        bullets.push({ x: bx, y: by, vx: 0, vy: -10, w: 4, h: 14, enemy: false });
        bullets.push({ x: bx + 10, y: by, vx: 1, vy: -10, w: 4, h: 14, enemy: false });
    }
    playSound('shoot');
}

function update() {
    if (state !== 'playing') return;
    
    // Wave system
    waveTimer++;
    if (waveTimer >= 600) {
        wave++;
        waveTimer = 0;
        spawnInterval = Math.max(20, 60 - wave * 3);
        gameSpeed = 1 + wave * 0.1;
    }
    
    // Spawn enemies
    if (waveTimer % Math.floor(spawnInterval) === 0) {
        const count = Math.min(1 + Math.floor(wave / 2), 4);
        for (let i = 0; i < count; i++) spawnEnemy();
    }
    
    // Player movement
    let dx = 0, dy = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) dx = -1;
    if (keys['KeyD'] || keys['ArrowRight']) dx = 1;
    if (keys['KeyW'] || keys['ArrowUp']) dy = -1;
    if (keys['KeyS'] || keys['ArrowDown']) dy = 1;
    
    const spd = player.speed + (player.shield > 0 ? 2 : 0);
    player.x += dx * spd;
    player.y += dy * spd;
    player.x = Math.max(20, Math.min(W - 20, player.x));
    player.y = Math.max(20, Math.min(H - 30, player.y));
    
    if (player.shootCooldown > 0) player.shootCooldown--;
    if (keys['Space']) shoot();
    
    if (player.invincible > 0) player.invincible--;
    if (player.shield > 0) player.shield--;
    
    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.life !== undefined) { b.life--; if (b.life <= 0) { bullets.splice(i, 1); continue; } }
        if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) { bullets.splice(i, 1); }
    }
    
    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed * gameSpeed;
        
        if (e.type === 'shooter') {
            e.shootTimer--;
            if (e.shootTimer <= 0) {
                spawnEnemyBullet(e.x, e.y + e.h);
                e.shootTimer = 90 + Math.random() * 60;
            }
        }
        
        // Remove if off screen
        if (e.y > H + 50) { enemies.splice(i, 1); continue; }
    }
    
    // Bullet-enemy collision
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (b.enemy) continue;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.abs(b.x - e.x) < (b.w + e.w) / 2 && Math.abs(b.y - e.y) < (b.h + e.h) / 2) {
                bullets.splice(i, 1);
                e.hp--;
                spawnParticles(e.x, e.y, '#ff6600', 5);
                
                if (e.hp <= 0) {
                    score += Math.floor(e.score * multiplier);
                    spawnParticles(e.x, e.y, getEnemyColor(e.type), 15);
                    playSound('explosion');
                    
                    if (e.type === 'splitter') {
                        for (let k = -1; k <= 1; k += 2) {
                            enemies.push({ x: e.x + k * 20, y: e.y, w: 20, h: 20, hp: 1, speed: 3, type: 'fast', maxHp: 1, score: 5 });
                        }
                    }
                    
                    if (Math.random() < 0.08) spawnPowerup(e.x, e.y);
                    enemies.splice(j, 1);
                }
                break;
            }
        }
    }
    
    // Enemy bullet vs player
    if (player.invincible <= 0) {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            if (!b.enemy) continue;
            if (Math.abs(b.x - player.x) < 20 && Math.abs(b.y - player.y) < 25) {
                bullets.splice(i, 1);
                hitPlayer();
            }
        }
    }
    
    // Enemy-player collision
    if (player.invincible <= 0) {
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.abs(e.x - player.x) < (e.w + 30) / 2 && Math.abs(e.y - player.y) < (e.h + 40) / 2) {
                hitPlayer();
                break;
            }
        }
    }
    
    // Update powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        if (p.y > H + 30) { powerups.splice(i, 1); continue; }
        
        if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - player.y) < 25) {
            playSound('powerup');
            switch(p.type) {
                case 'spread': player.powerLevel = Math.min(3, player.powerLevel + 1); break;
                case 'shield': player.shield = 600; break;
                case 'speed': player.speed += 1; if (player.speed > 8) player.speed = 8; break;
                case 'heal': lives = Math.min(5, lives + 1); break;
            }
            powerups.splice(i, 1);
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Stars
    for (const s of stars) {
        s.y += s.speed * gameSpeed;
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }
    
    // Shake
    if (shakeTimer > 0) shakeTimer--;
    
    // Multiplier decay
    if (waveTimer % 180 === 0) {
        multiplier = Math.max(1, multiplier - 0.5);
    }
}

function hitPlayer() {
    if (player.shield > 0) {
        player.shield = 0;
        spawnParticles(player.x, player.y, '#00ffff', 20);
        playSound('hit');
        shakeTimer = 10;
        shakeIntensity = 5;
        return;
    }
    
    lives--;
    player.invincible = 90;
    spawnParticles(player.x, player.y, '#ff3333', 20);
    playSound('hit');
    shakeTimer = 15;
    shakeIntensity = 8;
    
    if (lives <= 0) {
        state = 'gameover';
        playSound('gameover');
        try {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('voidStormHigh', highScore);
            }
        } catch(e) {}
    }
}

function getEnemyColor(type) {
    switch(type) {
        case 'basic': return '#ff4444';
        case 'fast': return '#ffaa00';
        case 'tank': return '#8844ff';
        case 'shooter': return '#44ff88';
        case 'splitter': return '#ff44ff';
        default: return '#ffffff';
    }
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    
    // Stars
    ctx.fillStyle = '#ffffff';
    for (const s of stars) {
        ctx.globalAlpha = 0.3 + s.size * 0.2;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
    
    if (state === 'start') {
        drawStartScreen();
        ctx.restore();
        return;
    }
    
    // Powerups
    for (const p of powerups) {
        const colors = { spread: '#ffff00', shield: '#00ffff', speed: '#ff8800', heal: '#ff4488' };
        ctx.fillStyle = colors[p.type];
        ctx.shadowColor = colors[p.type];
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        const labels = { spread: 'S', shield: 'D', speed: 'F', heal: '+' };
        ctx.fillText(labels[p.type], p.x, p.y + 4);
    }
    
    // Enemies
    for (const e of enemies) {
        const color = getEnemyColor(e.type);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        
        if (e.type === 'tank') {
            drawHexagon(e.x, e.y, e.w / 2);
        } else if (e.type === 'splitter') {
            drawDiamond(e.x, e.y, e.w / 2);
        } else {
            ctx.beginPath();
            ctx.moveTo(e.x, e.y + e.h / 2);
            ctx.lineTo(e.x - e.w / 2, e.y - e.h / 2);
            ctx.lineTo(e.x + e.w / 2, e.y - e.h / 2);
            ctx.closePath();
            ctx.fill();
        }
        ctx.shadowBlur = 0;
        
        // HP bar for tanks
        if (e.type === 'tank') {
            const ratio = e.hp / e.maxHp;
            ctx.fillStyle = '#333';
            ctx.fillRect(e.x - 20, e.y - e.h/2 - 10, 40, 5);
            ctx.fillStyle = ratio > 0.5 ? '#4f4' : '#f44';
            ctx.fillRect(e.x - 20, e.y - e.h/2 - 10, 40 * ratio, 5);
        }
    }
    
    // Bullets
    for (const b of bullets) {
        if (b.enemy) {
            ctx.fillStyle = '#ff6666';
            ctx.shadowColor = '#ff3333';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#44ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 8;
            ctx.fillRect(b.x - 2, b.y - 7, 4, 14);
        }
        ctx.shadowBlur = 0;
    }
    
    // Player
    if (state === 'playing' && player.invincible <= 0 || state === 'playing' && Math.floor(player.invincible / 5) % 2 === 0) {
        drawPlayer();
    }
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / 60;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // HUD
    if (state === 'playing') {
        drawHUD();
    }
    
    if (state === 'gameover') {
        drawGameOver();
    }
    
    ctx.restore();
}

function drawPlayer() {
    const px = player.x, py = player.y;
    
    // Shield effect
    if (player.shield > 0) {
        ctx.strokeStyle = `rgba(0,255,255,${0.3 + Math.sin(Date.now()*0.1)*0.2})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, 30, 0, Math.PI * 2);
        ctx.stroke();
    }
    
    // Ship body
    ctx.fillStyle = '#44ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(px, py - 20);
    ctx.lineTo(px - 15, py + 15);
    ctx.lineTo(px - 8, py + 10);
    ctx.lineTo(px, py + 15);
    ctx.lineTo(px + 8, py + 10);
    ctx.lineTo(px + 15, py + 15);
    ctx.closePath();
    ctx.fill();
    
    // Engine glow
    const flicker = Math.random() * 5;
    ctx.fillStyle = '#ff8800';
    ctx.shadowColor = '#ff4400';
    ctx.beginPath();
    ctx.moveTo(px - 5, py + 15);
    ctx.lineTo(px, py + 25 + flicker);
    ctx.lineTo(px + 5, py + 15);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawHexagon(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const hx = x + Math.cos(a) * r;
        const hy = y + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.fill();
}

function drawDiamond(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r, y);
    ctx.lineTo(x, y + r);
    ctx.lineTo(x - r, y);
    ctx.closePath();
    ctx.fill();
}

function drawHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 200, 80);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.fillText(`WAVE: ${wave}`, 20, 55);
    ctx.fillText(`MULTIPLIER: x${multiplier.toFixed(1)}`, 20, 75);
    
    // Lives
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(W - 30 - i * 30, 30, 10, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Power level
    ctx.fillStyle = '#ffff00';
    ctx.font = '12px monospace';
    ctx.fillText(`PWR: ${player.powerLevel}`, W - 60, 55);
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    
    ctx.font = 'bold 48px monospace';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 20;
    ctx.fillText('VOID STORM', W/2, H/2 - 100);
    ctx.shadowBlur = 0;
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('An Endless Shooter', W/2, H/2 - 60);
    
    ctx.font = '16px monospace';
    ctx.fillStyle = '#ccc';
    const lines = [
        'WASD / Arrow Keys - Move',
        'SPACE - Shoot',
        '',
        'Destroy enemies. Survive the void.',
        'Collect power-ups to grow stronger.',
        '',
        `HIGH SCORE: ${highScore}`
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 - 10 + i * 28);
    });
    
    const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#00ffff';
    ctx.fillText('PRESS SPACE TO START', W/2, H - 80);
    ctx.globalAlpha = 1;
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W/2, H/2 - 60);
    ctx.shadowBlur = 0;
    
    ctx.font = '24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${score}`, W/2, H/2 - 10);
    ctx.fillText(`WAVE REACHED: ${wave}`, W/2, H/2 + 30);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffff00';
        ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 70);
    }
    
    const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = '20px monospace';
    ctx.fillStyle = '#00ffff';
    ctx.fillText('PRESS SPACE TO RESTART', W/2, H - 60);
    ctx.globalAlpha = 1;
}

// Game loop
let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;
    
    update();
    draw();
    
    requestAnimationFrame(gameLoop);
}

initStars();
requestAnimationFrame(gameLoop);
</script>
</body>
