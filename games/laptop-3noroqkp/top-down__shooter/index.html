<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena Storm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type, freq, duration, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.value = freq || 440;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.1));
    osc.start();
    osc.stop(audioCtx.currentTime + (duration || 0.1));
}

function playShoot() { playSound('square', 800, 0.08, 0.08); }
function playHit() { playSound('sawtooth', 200, 0.15, 0.12); }
function playExplosion() { playSound('sawtooth', 80, 0.3, 0.15); }
function playPlayerHit() { playSound('square', 150, 0.2, 0.2); }

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('arenaStormHigh') || '0'); } catch(e) {}
let wave = 0;
let enemies = [];
let bullets = [];
let particles = [];
let pickups = [];
let spawnTimer = 0;
let spawnInterval = 60;
let frameCount = 0;

const keys = {};
let mouseX = W / 2, mouseY = H / 2;
let mouseDown = false;

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) startGame();
    if (gameState === 'gameover' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyR')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', e => { mouseDown = true; initAudio(); });
canvas.addEventListener('mouseup', e => { mouseDown = false; });
canvas.addEventListener('click', () => { initAudio(); });

// Player
const player = {
    x: 0, y: 0, radius: 14, angle: 0, speed: 5,
    hp: 100, maxHp: 100, fireRate: 8, fireTimer: 0,
    invincible: 0, shield: 0
};

function startGame() {
    gameState = 'playing';
    score = 0;
    wave = 1;
    enemies = [];
    bullets = [];
    particles = [];
    pickups = [];
    spawnTimer = 0;
    spawnInterval = 80;
    player.x = W / 2;
    player.y = H / 2;
    player.hp = 100;
    player.maxHp = 100;
    player.invincible = 60;
    player.shield = 0;
    frameCount = 0;
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = -20; y = Math.random() * H; }
    else if (side === 1) { x = W + 20; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = -20; }
    else { x = Math.random() * W; y = H + 20; }

    const type = Math.random();
    let enemy;
    if (type < 0.5) {
        enemy = { x, y, radius: 16, hp: 3, maxHp: 3, speed: 1.5 + wave * 0.1, angle: 0, type: 'basic', color: '#ff4444' };
    } else if (type <  0.8) {
        enemy = { x, y, radius: 12, hp: 2, maxHp: 2, speed: 3 + wave * 0.15, angle: 0, type: 'fast', color: '#ffaa00' };
    } else {
        enemy = { x, y, radius: 24, hp: 8, maxHp: 8, speed: 0.8 + wave * 0.05, angle: 0, type: 'tank', color: '#aa44ff' };
    }
    enemies.push(enemy);
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20, maxLife: 50, color, radius: 2 + Math.random() * 3
        });
    }
}

function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Wave progression
    const waveDuration = 600;
    if (frameCount % waveDuration === 0) {
        wave++;
        spawnInterval = Math.max(20, 80 - wave * 3);
    }

    // Spawn enemies
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        const count = 1 + Math.floor(wave / 3);
        for (let i = 0; i < count; i++) spawnEnemy();
    }

    // Player movement
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (dx !== 0 || dy !== 0) {
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len; dy /= len;
        player.x += dx * player.speed;
        player.y += dy * player.speed;
    }
    player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

    // Player angle
    player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

    // Shooting
    if (mouseDown && player.fireTimer <= 0) {
        player.fireTimer = player.fireRate;
        const bx = player.x + Math.cos(player.angle) * player.radius;
        const by = player.y + Math.sin(player.angle) * player.radius;
        bullets.push({ x: bx, y: by, vx: Math.cos(player.angle) * 10, vy: Math.sin(player.angle) * 10, radius: 4, life: 80 });
        playShoot();
    }
    if (player.fireTimer > 0) player.fireTimer--;

    // Invincibility timer
    if (player.invincible > 0) player.invincible--;

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
            bullets.splice(i, 1);
            continue;
        }
        // Hit enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const ddx = b.x - e.x, ddy = b.y - e.y;
            if (ddx * ddx + ddy * ddy < (b.radius + e.radius) * (b.radius + e.radius)) {
                e.hp--;
                addParticles(e.x, e.y, e.color, 5);
                playHit();
                bullets.splice(i, 1);
                if (e.hp <= 0) {
                    score += e.type === 'tank' ? 50 : e.type === 'fast' ? 25 : 10;
                    addParticles(e.x, e.y, e.color, 15);
                    playExplosion();
                    // Drop pickup chance
                    if (Math.random() < 0.15) {
                        pickups.push({ x: e.x, y: e.y, type: Math.random() < 0.6 ? 'hp' : 'shield', radius: 10, life: 300 });
                    }
                    enemies.splice(j, 1);
                }
                break;
            }
        }
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.angle = angle;
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // Enemy collision with player
        const ddx = player.x - e.x, ddy = player.y - e.y;
        const dist = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dist < player.radius + e.radius && player.invincible <= 0) {
            const dmg = e.type === 'tank' ? 25 : e.type === 'fast' ? 10 : 15;
            player.hp -= dmg;
            player.invincible = 30;
            playPlayerHit();
            addParticles(player.x, player.y, '#ffffff', 8);
            if (player.hp <= 0) {
                gameOver();
                return;
            }
        }

        // Enemy separation
        for (let j = i - 1; j >= 0; j--) {
            const e2 = enemies[j];
            const sdx = e.x - e2.x, sdy = e.y - e2.y;
            const sd = Math.sqrt(sdx * sdx + sdy * sdy);
            const minDist = e.radius + e2.radius;
            if (sd < minDist && sd > 0) {
                const push = (minDist - sd) * 0.3;
                e.x += (sdx / sd) * push;
                e.y += (sdy / sd) * push;
            }
        }
    }

    // Update pickups
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.life--;
        if (p.life <= 0) { pickups.splice(i, 1); continue; }
        const ddx = player.x - p.x, ddy = player.y - p.y;
        const dist = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dist < player.radius + p.radius + 10) {
            if (p.type === 'hp') player.hp = Math.min(player.maxHp, player.hp + 25);
            else player.shield = Math.min(50, player.shield + 20);
            addParticles(p.x, p.y, '#44ff88', 8);
            pickups.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function gameOver() {
    gameState = 'gameover';
    addParticles(player.x, player.y, '#4488ff', 30);
    playExplosion();
    try {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('arenaStormHigh', highScore.toString());
        }
    } catch(e) {}
}

function draw() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    // Grid background
    ctx.strokeStyle = 'rgba(30, 40, 60, 0.5)';
    ctx.lineWidth = 1;
    const gridSize = 60;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    // Pickups
    for (const p of pickups) {
        ctx.fillStyle = p.type === 'hp' ? '#44ff88' : '#44aaff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * (0.8 + 0.2 * Math.sin(frameCount * 0.1)), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'hp' ? '+' : 'S', p.x, p.y + 4);
    }

    // Particles
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bullets
    for (const b of bullets) {
        ctx.fillStyle = '#ffff44';
        ctx.shadowColor = '#ffff44';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Enemies
    for (const e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.angle);
        ctx.fillStyle = e.color;
        if (e.type === 'basic') {
            drawEnemyShape(e.radius, 4);
        } else if (e.type === 'fast') {
            drawEnemyShape(e.radius, 3);
        } else {
            drawEnemyShape(e.radius, 6);
        }
        ctx.restore();

        // HP bar for damaged enemies
        if (e.hp < e.maxHp) {
            const bw = e.radius * 2;
            ctx.fillStyle = '#333';
            ctx.fillRect(e.x - bw/2, e.y - e.radius - 10, bw, 4);
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(e.x - bw/2, e.y - e.radius - 10, bw * (e.hp / e.maxHp), 4);
        }
    }

    // Player
    if (player.invincible > 0 && frameCount % 4 < 2) {
        ctx.globalAlpha = 0.5;
    } else {
        ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    ctx.fillStyle = '#4488ff';
    ctx.beginPath();
    ctx.moveTo(player.radius, 0);
    ctx.lineTo(-player.radius * 0.7, -player.radius * 0.6);
    ctx.lineTo(-player.radius * 0.3, 0);
    ctx.lineTo(-player.radius * 0.7, player.radius * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#88bbff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;

    // Shield visual
    if (player.shield > 0) {
        ctx.strokeStyle = `rgba(68, 170, 255, ${player.shield / 80})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2);
        ctx.stroke();
    }

    // UI
    drawUI();

    if (gameState === 'gameover') {
        drawGameOver();
    }
}

function drawEnemyShape(radius, sides) {
    ctx.beginPath();
    for (let i = 0; i < sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        const px = Math.cos(a) * radius;
        const py = Math.sin(a) * radius;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
}

function drawUI() {
    // HP bar
    const barW = 200, barH = 16;
    const bx = W / 2 - barW / 2, by = 15;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, barW, barH);
    const hpPct = Math.max(0, player.hp / player.maxHp);
    ctx.fillStyle = hpPct > 0.5 ? '#44ff88' : hpPct > 0.25 ? '#ffaa00' : '#ff4444';
    ctx.fillRect(bx, by, barW * hpPct, barH);

    // Score & Wave
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`WAVE: ${wave}`, 20, 52);
    ctx.textAlign = 'right';
    ctx.font = '14px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(`HI: ${highScore}`, W - 20, 30);
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('ARENA STORM', W / 2, H / 2 - 80);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('WASD / Arrows — Move', W / 2, H / 2 - 20);
    ctx.fillText('Mouse — Aim', W / 2, H / 2 + 10);
    ctx.fillText('Hold Click — Shoot', W / 2, H / 2 + 40);

    ctx.fillStyle = '#44ff88';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('Press ENTER or SPACE to start', W / 2, H / 2 + 100);

    if (highScore > 0) {
        ctx.fillStyle = '#888';
        ctx.font = '14px monospace';
        ctx.fillText(`High Score: ${highScore}`, W / 2, H / 2 + 140);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 40);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 10);
    ctx.fillText(`Wave: ${wave}`, W / 2, H / 2 + 45);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffaa00';
        ctx.font = '18px monospace';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 85);
    }

    ctx.fillStyle = '#44ff88';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('Press ENTER / SPACE / R to restart', W / 2, H / 2 + 130);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
