<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.1));
}

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('tetrisShooterHigh') || '0'); } catch(e) {}

let player = { x: 0, y: 0, w: 40, h: 20, angle: -Math.PI/2 };
let bullets = [];
let tetrominoes = [];
let particles = [];
let stack = [];
let stars = [];
let shakeTime = 0;
let shakeMag = 0;
let spawnTimer = 0;
let difficulty = 1;
let combo = 0;
let lastComboTime = 0;
let flashAlpha = 0;

const TETROMINO_SHAPES = [
    [[0,0],[1,0],[2,0],[3,0]], // I
    [[0,0],[1,0],[0,1],[1,1]], // O
    [[1,0],[0,1],[1,1],[2,1]], // T
    [[0,0],[1,0],[1,1],[2,1]], // S
    [[1,0],[0,1],[1,1],[2,0]], // Z  -- wait that's not right
    [[0,0],[0,1],[0,2],[1,1]], // L
    [[1,0],[1,1],[1,2],[0,1]], // J
];

const COLORS = ['#ff4466','#ffaa22','#cc66ff','#44ff88','#ff66aa','#ffcc44','#44aaff'];
const BLOCK_SIZE = 20;

function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
        stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*2+0.5, sp: Math.random()*0.3+0.1 });
    }
}

function resetGame() {
    player.x = W/2;
    player.y = H - 60;
    player.angle = -Math.PI/2;
    bullets = [];
    tetrominoes = [];
    particles = [];
    stack = [];
    score = 0;
    difficulty = 1;
    combo = 0;
    spawnTimer = 0;
    shakeTime = 0;
    flashAlpha = 0;
}

function spawnTetromino() {
    const shapeIdx = Math.floor(Math.random() * TETROMINO_SHAPES.length);
    const shape = TETROMINO_SHAPES[shapeIdx];
    const colorIdx = Math.floor(Math.random() * COLORS.length);
    const x = Math.random() * (W - 100) + 50;
    const y = -80;
    const speed = (1.2 + difficulty * 0.3) * (Math.random() * 0.5 + 0.7);
    const rot = Math.random() < 0.3 ? (Math.random()-0.5)*0.8 : 0;
    const t = {
        x, y, color: COLORS[colorIdx], blocks: shape.map(b => ({...b})),
        speed, rot, rotSpeed: rot > 0 ? 0.01 : -0.01,
        hp: 1 + Math.floor(difficulty / 2), maxHp: 1 + Math.floor(difficulty/2),
        size: BLOCK_SIZE
    };
    tetrominoes.push(t);
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            decay: 0.02 + Math.random()*0.03,
            color,
            size: Math.random() * 4 + 2
        });
    }
}

function getBlockWorldPos(t, block) {
    const cx = t.x + (block[0] - 1) * t.size;
    const cy = t.y + (block[1] - 0.5) * t.size;
    const cosR = Math.cos(t.rot);
    const sinR = Math.sin(t.rot);
    return { x: cx, y: cy };
}

function shoot() {
    initAudio();
    const speed = 8;
    bullets.push({
        x: player.x,
        y: player.y - 10,
        vx: Math.cos(player.angle) * speed,
        vy: Math.sin(player.angle) * speed,
        life: 1
    });
    playSound(800 + Math.random()*200, 0.08, 'square', 0.1);
}

function update(dt) {
    if (state !== 'playing') return;

    difficulty = 1 + score / 500;
    
    // Spawn tetrominoes
    spawnTimer += dt;
    const spawnInterval = Math.max(60, 120 - difficulty * 8);
    if (spawnTimer > spawnInterval) {
        spawnTetromino();
        spawnTimer = 0;
    }

    // Update tetrominoes
    for (let i = tetrominoes.length - 1; i >= 0; i--) {
        const t = tetrominoes[i];
        t.y += t.speed;
        t.rot += t.rotSpeed;

        // Check if reached bottom / stack
        let maxBlockY = 0;
        for (const b of t.blocks) {
            const wy = t.y + (b[1] - 0.5) * t.size;
            if (wy > maxBlockY) maxBlockY = wy;
        }
        
        const stackHeight = getStackHeight();
        const floorY = H - 20 - stackHeight;
        
        if (maxBlockY >= floorY) {
            // Add to stack
            addStackBlocks(t);
            tetrominoes.splice(i, 1);
            shakeTime = 0.2;
            shakeMag = 3;
            playSound(150, 0.2, 'sawtooth', 0.2);
            
            // Game over check
            if (stackHeight > H * 0.7) {
                gameOver();
                return;
            }
        }

        // Off screen
        if (t.y > H + 100) tetrominoes.splice(i, 1);
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life -= dt * 0.5;
        
        if (b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20 || b.life <= 0) {
            bullets.splice(i, 1);
            continue;
        }

        // Collision with tetrominoes
        for (let j = tetrominoes.length - 1; j >= 0; j--) {
            const t = tetrominoes[j];
            let hit = false;
            for (const block of t.blocks) {
                const bx = t.x + (block[0] - 1) * t.size;
                const by = t.y + (block[1] - 0.5) * t.size;
                const dist = Math.hypot(b.x - bx, b.y - by);
                if (dist < t.size * 0.7) {
                    hit = true;
                    break;
                }
            }
            if (hit) {
                t.hp--;
                bullets.splice(i, 1);
                if (t.hp <= 0) {
                    // Destroy tetromino
                    const pts = Math.floor(10 * difficulty);
                    score += pts;
                    combo++;
                    lastComboTime = Date.now();
                    if (combo > 3) score += combo * 2;
                    
                    for (const block of t.blocks) {
                        const bx = t.x + (block[0] - 1) * t.size;
                        const by = t.y + (block[1] - 0.5) * t.size;
                        spawnParticles(bx, by, t.color, 8);
                    }
                    
                    tetrominoes.splice(j, 1);
                    shakeTime = 0.15;
                    shakeMag = 4;
                    playSound(400 + Math.random()*300, 0.15, 'square', 0.15);
                    flashAlpha = 0.1;
                } else {
                    for (const block of t.blocks) {
                        const bx = t.x + (block[0] - 1) * t.size;
                        const by = t.y + (block[1] - 0.5) * t.size;
                        spawnParticles(bx, by, t.color, 3);
                    }
                    playSound(200, 0.08, 'triangle', 0.1);
                }
                break;
            }
        }
    }

    // Combo decay
    if (Date.now() - lastComboTime > 2000) combo = 0;

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake decay
    if (shakeTime > 0) shakeTime -= dt;
    if (flashAlpha > 0) flashAlpha -= dt * 2;

    // Update stars
    for (const s of stars) {
        s.y += s.sp;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
}

function getStackHeight() {
    return stack.length * BLOCK_SIZE * 0.3;
}

function addStackBlocks(t) {
    stack.push({ x: t.x, y: H - 20, color: t.color });
    if (stack.length > 50) stack.shift();
}

function gameOver() {
    state = 'gameover';
    try {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('tetrisShooterHigh', highScore.toString());
        }
    } catch(e) {}
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random()-0.5) * shakeMag;
        const sy = (Math.random()-0.5) * shakeMag;
        ctx.translate(sx, sy);
    }

    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(1, '#1a0a2a');
    ctx.fillStyle = grad;
    ctx.fillRect(-10, -10, W+20, H+20);

    // Stars
    ctx.fillStyle = '#ffffff';
    for (const s of stars) {
        ctx.globalAlpha = 0.5 + Math.sin(Date.now()*0.001 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    if (state === 'start') {
        drawStartScreen();
    } else if (state === 'playing' || state === 'gameover') {
        // Draw stack area (bottom)
        const stackH = getStackHeight();
        if (stackH > 0) {
            ctx.fillStyle = 'rgba(255, 80, 80, 0.3)';
            ctx.fillRect(0, H - stackH - 10, W, stackH + 10);
            
            // Danger line
            if (stackH > H * 0.4) {
                ctx.fillStyle = `rgba(255, 0, 0, ${0.3 + Math.sin(Date.now()*0.005)*0.2})`;
                ctx.fillRect(0, H - stackH - 10, W, 3);
            }
        }

        // Draw tetrominoes
        for (const t of tetrominoes) {
            ctx.save();
            ctx.translate(t.x, t.y);
            ctx.rotate(t.rot);
            
            const alpha = t.hp < t.maxHp ? 0.6 : 1;
            ctx.globalAlpha = alpha;
            
            for (const block of t.blocks) {
                const bx = (block[0] - 1) * t.size;
                const by = (block[1] - 0.5) * t.size;
                
                // Block face
                ctx.fillStyle = t.color;
                ctx.fillRect(bx - t.size/2 + 2, by - t.size/2 + 2, t.size - 4, t.size - 4);
                
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(bx - t.size/2 + 4, by - t.size/2 + 4, t.size - 8, 4);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(bx - t.size/2 + 2, by + t.size/2 - 6, t.size - 4, 3);
            }
            
            // HP bar for armored
            if (t.maxHp > 1) {
                ctx.globalAlpha = 0.8;
                const barW = 30;
                const bx = 0;
                const by = -t.size * 1.5;
                ctx.fillStyle = '#333';
                ctx.fillRect(bx - barW/2, by, barW, 4);
                ctx.fillStyle = t.color;
                ctx.fillRect(bx - barW/2, by, barW * (t.hp / t.maxHp), 4);
            }
            
            ctx.restore();
        }

        // Draw bullets
        for (const b of bullets) {
            ctx.fillStyle = '#ffff88';
            ctx.shadowColor = '#ffff44';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Draw particles
        for (const p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        // Draw player
        drawPlayer();

        // HUD
        ctx.font = 'bold 18px monospace';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 30);
        ctx.fillText(`HI: ${highScore}`, 20, 55);
        
        if (combo > 2) {
            ctx.fillStyle = '#ffaa44';
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px monospace';
            ctx.fillText(`COMBO x${combo}!`, W/2, 60);
        }

        // Difficulty indicator
        ctx.fillStyle = '#888';
        ctx.font = '12px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`LVL ${Math.floor(difficulty)}`, W - 20, 30);

        // Danger meter
        const dangerPct = Math.min(1, getStackHeight() / (H * 0.7));
        ctx.fillStyle = '#333';
        ctx.fillRect(W - 100, H - 40, 80, 8);
        ctx.fillStyle = dangerPct > 0.7 ? '#ff4444' : dangerPct > 0.4 ? '#ffaa44' : '#44ff88';
        ctx.fillRect(W - 100, H - 40, 80 * dangerPct, 8);
        ctx.fillStyle = '#aaa';
        ctx.font = '10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('STACK', W - 20, H - 45);

        // Game over overlay
        if (state === 'gameover') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);
            
            ctx.textAlign = 'center';
            ctx.font = 'bold 48px monospace';
            ctx.fillStyle = '#ff4466';
            ctx.fillText('GAME OVER', W/2, H/2 - 40);
            
            ctx.font = '24px monospace';
            ctx.fillStyle = '#fff';
            ctx.fillText(`Score: ${score}`, W/2, H/2 + 10);
            ctx.fillText(`Best: ${highScore}`, W/2, H/2 + 45);
            
            ctx.font = '18px monospace';
            ctx.fillStyle = '#aaa';
            ctx.fillText('Press SPACE to restart', W/2, H/2 + 90);
        }
    }

    // Flash effect
    if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
        ctx.fillRect(-10, -10, W+20, H+20);
    }

    ctx.restore();
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle + Math.PI/2);
    
    // Ship body
    ctx.fillStyle = '#44aaff';
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(-12, 10);
    ctx.lineTo(-5, 6);
    ctx.lineTo(0, 10);
    ctx.lineTo(5, 6);
    ctx.lineTo(12, 10);
    ctx.closePath();
    ctx.fill();
    
    // Glow
    ctx.shadowColor = '#44aaff';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#88ccff';
    ctx.beginPath();
    ctx.arc(0, -5, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Engine flame
    const flameLen = 8 + Math.random() * 6;
    ctx.fillStyle = `rgba(255, ${150+Math.random()*100}, 0, 0.8)`;
    ctx.beginPath();
    ctx.moveTo(-4, 10);
    ctx.lineTo(0, 10 + flameLen);
    ctx.lineTo(4, 10);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
}

function drawStartScreen() {
    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px monospace';
    ctx.fillStyle = '#ff4466';
    ctx.fillText('TETRIS', W/2, H/3);
    ctx.fillStyle = '#44aaff';
    ctx.fillText('SHOOTER', W/2, H/3 + 55);
    
    // Decorative tetrominoes
    const demoColors = ['#ff4466','#ffaa22','#cc66ff','#44ff88'];
    for (let i = 0; i < 4; i++) {
        const dx = W/2 - 90 + i * 60;
        const dy = H/3 + 100;
        ctx.fillStyle = demoColors[i];
        ctx.fillRect(dx-8, dy-8, 16, 16);
        ctx.fillRect(dx+8, dy-8, 16, 16);
        if (i < 2) ctx.fillRect(dx+16, dy+8, 16, 16);
        else ctx.fillRect(dx-8, dy+8, 16, 16);
    }
    
    // Controls
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    const lines = [
        'A/D or ←/→ : Move',
        'MOUSE : Aim',
        'CLICK / SPACE : Shoot',
        '',
        'Destroy falling tetrominoes!',
        'Don\'t let them stack up!'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 + 60 + i * 24);
    });
    
    // Start prompt
    const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('PRESS SPACE TO START', W/2, H - 80);
    ctx.globalAlpha = 1;
    
    // High score
    if (highScore > 0) {
        ctx.font = '14px monospace';
        ctx.fillStyle = '#ffaa44';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H - 50);
    }
}

// Input
let keys = {};
let mouseX = W/2, mouseY = H/2;
let mouseDown = false;
let shootCooldown = 0;

window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    initAudio();
    
    if (state === 'start' && e.code === 'Space') {
        state = 'playing';
        resetGame();
        initStars();
    } else if (state === 'gameover' && e.code === 'Space') {
        state = 'playing';
        resetGame();
    }
    
    if (state === 'playing' && e.code === 'Space') mouseDown = true;
});

window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.code === 'Space') mouseDown = false;
});

canvas.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    if (state === 'start') {
        state = 'playing';
        resetGame();
        initStars();
    } else if (state === 'gameover') {
        state = 'playing';
        resetGame();
    }
    mouseDown = true;
});

canvas.addEventListener('mouseup', () => { mouseDown = false; });

// Game loop
let lastTime = 0;
initStars();
resetGame();

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;
    
    if (state === 'playing') {
        // Player movement
        const speed = 5 * dt;
        if (keys['KeyA'] || keys['ArrowLeft']) player.x -= speed;
        if (keys['KeyD'] || keys['ArrowRight']) player.x += speed;
        player.x = Math.max(20, Math.min(W-20, player.x));
        
        // Aim
        const dx = mouseX - player.x;
        const dy = mouseY - player.y;
        player.angle = Math.atan2(dy, dx);
        
        // Shoot
        shootCooldown -= dt;
        if (mouseDown && shootCooldown <= 0) {
            shoot();
            shootCooldown = 8;
        }
        
        update(dt);
    } else {
        // Animate stars on start/gameover
        for (const s of stars) {
            s.y += s.sp * dt;
            if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        }
    }
    
    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
