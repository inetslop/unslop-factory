<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball Maze</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game State
let state = 'MENU'; // MENU, PLAYING, GAME_OVER
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('pinballMazeHigh') || '0'); } catch(e) {}
let balls = 3;
let frameCount = 0;

// Ball
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };
let plungerAngle = -Math.PI / 2;
let plungerPower = 0;
let launching = false;
let launched = false;

// Paddle
const paddle = { x: 0, w: 100, h: 14, y: 0 };

// Walls (maze)
let walls = [];
let bumpers = [];
let target = null;

function setupMaze() {
    const mw = Math.min(W * 0.6, 500);
    const mh = H * 0.7;
    const mx = (W - mw) / 2;
    const my = 40;

    walls = [
        // Outer boundaries of maze area
        { x: mx, y: my, w: mw, h: 8 },           // top
        { x: mx, y: my + mh, w: mw, h: 8 },     // bottom (above paddle)
        { x: mx, y: my, w: 8, h: mh },         // left
        { x: mx + mw - 8, y: my, w: 8, h: mh },// right

        // Inner maze walls
        { x: mx + mw * 0.2, y: my + mh * 0.15, w: 8, h: mh * 0.3 },
        { x: mx + mw * 0.45, y: my + mh * 0.25, w: mw * 0.3, h: 8 },
        { x: mx + mw * 0.7, y: my + mh * 0.1, w: 8, h: mh * 0.35 },
        { x: mx + mw * 0.15, y: my + mh * 0.5, w: mw * 0.25, h: 8 },
        { x: mx + mw * 0.55, y: my + mh * 0.55, w: 8, h: mh * 0.3 },
        { x: mx + mw * 0.3, y: my + mh * 0.7, w: mw * 0.2, h: 8 },
        { x: mx + mw * 0.75, y: my + mh * 0.65, w: mw * 0.2, h: 8 },
        { x: mx + mw * 0.4, y: my + mh * 0.85, w: 8, h: mh * 0.12 },
    ];

    bumpers = [
        { x: mx + mw * 0.35, y: my + mh * 0.35, r: 15, baseAngle: 0 },
        { x: mx + mw * 0.6, y: my + mh * 0.4, r: 15, baseAngle: Math.PI / 4 },
        { x: mx + mw * 0.25, y: my + mh * 0.65, r: 15, baseAngle: Math.PI / 2 },
        { x: mx + mw * 0.8, y: my + mh * 0.45, r: 15, baseAngle: -Math.PI / 4 },
        { x: mx + mw * 0.5, y: my + mh * 0.78, r: 12, baseAngle: Math.PI },
    ];

    target = { x: mx + mw * 0.5, y: my + mh * 0.12, r: 20 };

    // Plunger start position
    ball.x = mx + 30;
    ball.y = my + mh - 30;
    ball.vx = 0;
    ball.vy = 0;

    paddle.x = mx + mw / 2 - paddle.w / 2;
    paddle.y = my + mh + 20;
    plungerAngle = -Math.PI / 2;
    launched = false;
}

function startGame() {
    score = 0;
    balls = 3;
    setupMaze();
    state = 'PLAYING';
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state === 'MENU' && e.code === 'Space') { initAudio(); startGame(); }
    else if (state === 'GAME_OVER' && e.code === 'Space') { startGame(); }
    else if (state === 'PLAYING' && !launched) {
        if (e.code === 'Space') { launching = true; plungerPower = 0; }
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

let mouseX = W / 2;
window.addEventListener('mousemove', (e) => { mouseX = e.clientX; });
window.addEventListener('click', (e) => {
    initAudio();
    if (state === 'MENU' || state === 'GAME_OVER') startGame();
});

// Physics constants
const GRAVITY = 0.35;
const FRICTION = 0.999;
const BOUNCE = 0.82;
const BUMP_FORCE = 7;
const MAX_SPEED = 14;

function updateBall() {
    if (!launched) return;

    const substeps = 4;
    const dt = 1 / substeps;

    for (let s = 0; s < substeps; s++) {
        ball.vy += GRAVITY * dt;
        ball.vx *= FRICTION;
        ball.vy *= FRICTION;

        let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        if (speed > MAX_SPEED) {
            ball.vx = (ball.vx / speed) * MAX_SPEED;
            ball.vy = (ball.vy / speed) * MAX_SPEED;
        }

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Wall collisions
        for (let w of walls) {
            collideWall(w);
        }

        // Bumper collisions
        for (let b of bumpers) {
            let dx = ball.x - b.x;
            let dy = ball.y - b.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ball.r + b.r) {
                let nx = dx / dist;
                let ny = dy / dist;
                ball.x = b.x + nx * (ball.r + b.r + 1);
                ball.y = b.y + ny * (ball.r + b.r + 1);
                ball.vx = nx * BUMP_FORCE;
                ball.vy = ny * BUMP_FORCE;
                score += 50;
                b.baseAngle += Math.PI / 4;
                playSound(200 + Math.random() * 300, 0.15, 'square', 0.2);
            }
        }

        // Target (goal)
        if (target) {
            let dx = ball.x - target.x;
            let dy = ball.y - target.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ball.r + target.r) {
                score += 500;
                playSound(800, 0.3, 'sine', 0.4);
                setTimeout(() => playSound(1200, 0.3, 'sine', 0.3), 100);
                target = null;
                // New target appears after delay
                setTimeout(() => {
                    const mw = Math.min(W * 0.6, 500);
                    const mh = H * 0.7;
                    const mx = (W - mw) / 2;
                    const my = 40;
                    target = { x: mx + mw * (0.2 + Math.random() * 0.6), y: my + mh * (0.15 + Math.random() * 0.7), r: 20 };
                }, 1500);
            }
        }

        // Paddle collision
        if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h) {
            if (ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
                ball.y = paddle.y - ball.r;
                ball.vy = -Math.abs(ball.vy) * BOUNCE - 2;
                playSound(150, 0.1, 'triangle', 0.2);
            }
        }

        // Ball lost (falls below paddle area)
        if (ball.y > H + 50) {
            loseBall();
        }
    }
}

function collideWall(w) {
    let cx = Math.max(w.x, Math.min(ball.x, w.x + w.w));
    let cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
    let dx = ball.x - cx;
    let dy = ball.y - cy;
    let dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < ball.r) {
        let nx = dx / (dist || 1);
        let ny = dy / (dist || 1);
        ball.x = cx + nx * (ball.r + 0.5);
        ball.y = cy + ny * (ball.r + 0.5);
        let dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            ball.vx *= BOUNCE;
            ball.vy *= BOUNCE;
            playSound(100 + Math.random() * 50, 0.08, 'sine', 0.15);
        }
    }
}

function loseBall() {
    balls--;
    playSound(80, 0.4, 'sawtooth', 0.3);
    if (balls <= 0) {
        state = 'GAME_OVER';
        try {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('pinballMazeHigh', highScore.toString());
            }
        } catch(e) {}
    } else {
        setupMaze();
    }
}

function updatePaddle() {
    if (state !== 'PLAYING') return;
    paddle.x += (mouseX - paddle.x - paddle.w / 2) * 0.15;
    const mw = Math.min(W * 0.6, 500);
    const mx = (W - mw) / 2;
    paddle.x = Math.max(mx, Math.min(paddle.x, mx + mw - paddle.w));
}

function updatePlunger() {
    if (!launched && state === 'PLAYING') {
        if (keys['ArrowLeft'] || keys['KeyA']) plungerAngle += 0.02;
        if (keys['ArrowRight'] || keys['KeyD']) plungerAngle -= 0.02;
        plungerAngle = Math.max(-Math.PI * 0.8, Math.min(-Math.PI * 0.2, plungerAngle));

        if (launching && plungerPower < 1) {
            plungerPower += 0.015;
        } else if (launching && plungerPower >= 1) {
            launching = false;
        }

        if (keys['Space'] && !launching && plungerPower === 0) {
            // auto-launch with full power on space release handled below
        }
    }
}

// Actually, let me simplify: hold space to charge, release to launch
let spaceDown = false;
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') spaceDown = true;
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
        spaceDown = false;
        if (state === 'PLAYING' && !launched && plungerPower > 0) {
            // Launch!
            ball.vx = Math.cos(plungerAngle) * plungerPower * 15;
            ball.vy = Math.sin(plungerAngle) * plungerPower * 15;
            launched = true;
            playSound(300, 0.2, 'sine', 0.3);
            plungerPower = 0;
        }
    }
});

// Particles
let particles = [];
function spawnParticles(x, y, color) {
    for (let i = 0; i < 6; i++) {
        let a = Math.random() * Math.PI * 2;
        let s = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, color });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Trail
let trail = [];

function render() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    if (state === 'MENU') {
        drawMenu();
    } else if (state === 'PLAYING' || state === 'GAME_OVER') {
        drawGame();
    }

    updateParticles();
}

function drawMenu() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PINBALL MAZE', W / 2, H * 0.3);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Navigate the maze. Hit bumpers for points.', W / 2, H * 0.42);
    ctx.fillText('Reach the glowing target for 500 points!', W / 2, H * 0.48);
    ctx.fillText('', W / 2, H * 0.54);
    ctx.fillText('Controls:', W / 2, H * 0.6);
    ctx.fillText('\u2190 \u2192 : Aim plunger', W / 2, H * 0.65);
    ctx.fillText('HOLD SPACE: Charge | RELEASE: Launch', W / 2, H * 0.7);
    ctx.fillText('MOUSE: Move paddle to catch ball', W / 2, H * 0.75);

    ctx.fillStyle = '#4af';
    ctx.font = '22px monospace';
    if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillText('CLICK or PRESS SPACE TO START', W / 2, H * 0.85);
    }

    if (highScore > 0) {
        ctx.fillStyle = '#fa4';
        ctx.font = '16px monospace';
        ctx.fillText('High Score: ' + highScore, W / 2, H * 0.92);
    }
}

function drawGame() {
    const mw = Math.min(W * 0.6, 500);
    const mh = H * 0.7;
    const mx = (W - mw) / 2;
    const my = 40;

    // Maze background
    ctx.fillStyle = '#111128';
    ctx.fillRect(mx, my, mw, mh);

    // Walls
    ctx.fillStyle = '#3355aa';
    for (let w of walls) {
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = '#4466cc';
        ctx.fillRect(w.x + 1, w.y + 1, Math.max(0, w.w - 2), Math.max(0, w.h - 2));
        ctx.fillStyle = '#3355aa';
    }

    // Bumpers
    for (let b of bumpers) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = '#e44';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r - 5, 0, Math.PI * 2);
        ctx.fillStyle = '#fa6';
        ctx.fill();
    }

    // Target
    if (target) {
        let pulse = 1 + Math.sin(frameCount * 0.1) * 0.2;
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.r * pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 255, 150, 0.3)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.r * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = '#0f9';
        ctx.fill();
    }

    // Paddle
    ctx.fillStyle = '#4af';
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.fillStyle = '#8cf';
    ctx.fillRect(paddle.x + 2, paddle.y + 2, paddle.w - 4, paddle.h - 4);

    // Plunger / Ball at start
    if (!launched) {
        // Aim line
        let lineLen = 60;
        let ex = ball.x + Math.cos(plungerAngle) * lineLen;
        let ey = ball.y + Math.sin(plungerAngle) * lineLen;
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = 'rgba(255,255,0,0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Power bar
        if (plungerPower > 0) {
            let pw = plungerPower * 80;
            ctx.fillStyle = 'rgba(255,100,0,0.6)';
            ctx.fillRect(ball.x - 40, ball.y + 20, pw, 6);
        }
    }

    // Ball trail
    if (launched) {
        trail.push({ x: ball.x, y: ball.y });
        if (trail.length > 15) trail.shift();
        for (let i = 0; i < trail.length; i++) {
            let a = i / trail.length * 0.4;
            ctx.beginPath();
            ctx.arc(trail[i].x, trail[i].y, ball.r * (i / trail.length), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(100, 180, 255, ${a})`;
            ctx.fill();
        }
    }

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    let grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#4af');
    ctx.fillStyle = grad;
    ctx.fill();

    // Particles
    for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.life / 6, 0, Math.PI * 2);
        ctx.fillStyle = p.color || '#ff0';
        ctx.globalAlpha = p.life / 30;
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 20, 30);
    ctx.textAlign = 'right';
    let ballsStr = '';
    for (let i = 0; i < balls; i++) ballsStr += '\u25CF ';
    ctx.fillText(ballsStr, W - 20, 30);

    if (state === 'GAME_OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 42px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H * 0.35);
        ctx.font = '24px monospace';
        ctx.fillText('Final Score: ' + score, W / 2, H * 0.45);
        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#fa4';
            ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.52);
        }
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        if (Math.floor(frameCount / 30) % 2 === 0) {
            ctx.fillText('PRESS SPACE TO RESTART', W / 2, H * 0.65);
        }
    }
}

function gameLoop() {
    frameCount++;
    if (state === 'PLAYING') {
        updatePlunger();
        updatePaddle();
        updateBall();

        // Auto-charge when space held
        if (!launched && spaceDown) {
            plungerPower = Math.min(1, plungerPower + 0.02);
        }
    }
    render();
    requestAnimationFrame(gameLoop);
}

setupMaze();
gameLoop();
</script>
</body>
</html>
