<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maze Defense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f1a; font-family: 'Segoe UI', sans-serif; }
#gameCanvas { display: block; margin: auto; }
.overlay {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
display: flex; flex-direction: column; align-items: center; justify-content: center;
background: rgba(15,15,26,0.95); z-index: 10; color: #e0e0ff;
}
.overlay h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-bottom: 1rem; text-shadow: 0 0 20px #6a5acd; }
.overlay p { font-size: clamp(0.9rem, 2vw, 1.2rem); margin: 0.4rem 0; color: #aaa; }
.overlay .btn {
margin-top: 1.5rem; padding: 0.8rem 2rem; font-size: 1.2rem; background: #6a5acd;
color: #fff; border: none; border-radius: 8px; cursor: pointer; transition: background 0.2s;
}
.overlay .btn:hover { background: #7d6fe8; }
#hud {
position: absolute; top: 0; left: 0; width: 100%; padding: 8px 16px;
display: flex; align-items: center; gap: 20px; z-index: 5;
background: rgba(15,15,26,0.8); color: #e0e0ff; font-size: clamp(0.8rem, 1.5vw, 1rem);
}
#hud .stat { display: flex; align-items: center; gap: 6px; }
#towerBtns { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 10px; }
.tower-btn {
padding: 8px 14px; border: 2px solid #6a5acd; background: rgba(30,30,50,0.9); color: #e0e0ff;
border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
}
.tower-btn.active { background: #6a5acd; }
.tower-btn:hover { border-color: #aaa; }
#waveBtn {
position: absolute; bottom: 12px; right: 16px; z-index: 5; padding: 10px 20px;
background: #2e7d32; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
}
#waveBtn:hover { background: #43a047; }
#speedBtn {
position: absolute; bottom: 12px; right: 16px; z-index: 5; padding: 8px 12px;
background: rgba(30,30,50,0.9); color: #aaa; border: 1px solid #555; border-radius: 6px; font-size: 0.9rem; cursor: pointer;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud" style="display:none">
<span class="stat">💰 <span id="money">150</span></span>
<span class="stat">❤️ <span id="lives">20</span></span>
<span class="stat">🌊 Wave <span id="wave">0</span>/∞</span>
<span class="stat">⚔️ <span id="score">0</span></span>
</div>
<div id="towerBtns" style="display:none">
<button class="tower-btn active" id="btn1">Turret (50)</button>
<button class="tower-btn" id="btn2">Sniper (100)</button>
</div>
<button id="waveBtn" style="display:none">▶ Start Wave</button>
<div id="startScreen" class="overlay">
<h1>🏰 MAZE DEFENSE</h1>
<p>Enemies march through the maze toward your base.</p>
<p>Place towers on open cells to stop them!</p>
<p><b>1</b> = Turret &nbsp; <b>2</b> = Sniper &nbsp; <b>R</b> = New Maze</p>
<p>Click a cell to place. Right-click to sell.</p>
<button class="btn" id="startBtn">START GAME</button>
</div>
<div id="gameOverScreen" class="overlay" style="display:none">
<h1>💀 GAME OVER</h1>
<p>You survived <span id="finalWave">0</span> waves.</p>
<p>Score: <span id="finalScore">0</span></p>
<button class="btn" id="restartBtn">RESTART</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, cellSize, gridW, gridH, offsetX, offsetY;

gridW = 21; gridH = 15;

function resize() {
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
cellSize = Math.floor(Math.min((W - 40) / gridW, (H - 120) / gridH));
offsetX = Math.floor((W - cellSize * gridW) / 2);
offsetY = Math.floor((H - cellSize * gridH) / 2) + 20;
}
window.addEventListener('resize', resize);
resize();

let gameState = 'start'; // start, building, wave, gameover
let money = 150, lives = 20, score = 0, waveNum = 0;
let selectedTower = 0; // 0 = turret, 1 = sniper
let speedMult = 1;
let lastTime = 0;

// Maze: grid of cells, each has walls [top, right, bottom, left]
let mazeWalls = [];
let path = []; // array of {x,y}
let pathSet = new Set();
let towers = [];
let enemies = [];
let projectiles = [];
let particles = [];
let spawnTimer = 0;
let enemiesToSpawn = 0;
let waveActive = false;

function key(x, y) { return x + ',' + y; }

function generateMaze() {
mazeWalls = Array.from({length: gridH}, () => Array.from({length: gridW}, () => [true, true, true, true]));
let visited = Array.from({length: gridH}, () => Array(gridW).fill(false));
let stack = [[0, 0]];
visited[0][0] = true;

while (stack.length > 0) {
let [cx, cy] = stack[stack.length - 1];
let neighbors = [];
if (cy > 0 && !visited[cy-1][cx]) neighbors.push([cx, cy-1, 0, 2]);
if (cx < gridW-1 && !visited[cy][cx+1]) neighbors.push([cx+1, cy, 1, 3]);
if (cy < gridH-1 && !visited[cy+1][cx]) neighbors.push([cx, cy+1, 2, 0]);
if (cx > 0 && !visited[cy][cx-1]) neighbors.push([cx-1, cy, 3, 1]);

if (neighbors.length === 0) { stack.pop(); continue; }

let [nx, ny, dir, oppDir] = neighbors[Math.floor(Math.random() * neighbors.length)];
mazeWalls[cy][cx][dir] = false;
mazeWalls[ny][nx][oppDir] = false;
visited[ny][nx] = true;
stack.push([nx, ny]);
}
}

function findPath() {
// BFS from (0, 7) to (20, 7) - actually let's use middle row
let startR = Math.floor(gridH / 2);
let endR = Math.floor(gridH / 2);
let queue = [[0, startR]];
let cameFrom = {};
let visited = Array.from({length: gridH}, () => Array(gridW).fill(false));
visited[startR][0] = true;
cameFrom[key(0, startR)] = null;

while (queue.length > 0) {
let [cx, cy] = queue.shift();
if (cx === gridW - 1 && cy === endR) break;

let dirs = [[0,-1],[1,0],[0,1],[-1,0]]; // top,right,bottom,left
for (let d = 0; d < 4; d++) {
let nx = cx + dirs[d][0], ny = cy + dirs[d][1];
if (nx < 0 || nx >= gridW || ny < 0 || ny >= gridH) continue;
if (mazeWalls[cy][cx][d]) continue;
if (visited[ny][nx]) continue;
visited[ny][nx] = true;
cameFrom[key(nx, ny)] = key(cx, cy);
queue.push([nx, ny]);
}
}

// Reconstruct path
let endKey = key(gridW - 1, endR);
if (!cameFrom.hasOwnProperty(endKey)) return null;
let p = [];
let cur = endKey;
while (cur !== null) {
let [x, y] = cur.split(',').map(Number);
p.push({x, y});
cur = cameFrom[cur];
}
p.reverse();
return p;
}

function newMaze() {
generateMaze();
path = findPath();
if (!path) return newMaze();
pathSet = new Set(path.map(c => key(c.x, c.y)));
towers = [];
enemies = [];
projectiles = [];
particles = [];
}

function startWave() {
waveNum++;
waveActive = true;
enemiesToSpawn = 3 + waveNum * 2;
spawnTimer = 0;
gameState = 'wave';
document.getElementById('waveBtn').style.display = 'none';
}

function spawnEnemy() {
let hp = 30 + waveNum * 15;
let speed = 1.2 + waveNum * 0.1;
enemies.push({
pathIdx: 0, x: path[0].x, y: path[0].y,
px: (path[0].x + 0.5) * cellSize + offsetX, py: (path[0].y + 0.5) * cellSize + offsetY,
hp, maxHp: hp, speed, reward: 20 + waveNum * 3
});
}

function update(dt) {
if (gameState !== 'wave') return;
let sdt = dt * speedMult;

// Spawn enemies
if (enemiesToSpawn > 0) {
spawnTimer -= sdt;
if (spawnTimer <= 0) {
spawnEnemy();
enemiesToSpawn--;
spawnTimer = Math.max(0.8, 2 - waveNum * 0.1);
}
}

// Move enemies
for (let e of enemies) {
let targetX = path[Math.min(e.pathIdx + 1, path.length - 1)].x;
let targetY = path[Math.min(e.pathIdx + 1, path.length - 1)].y;
if (e.pathIdx >= path.length - 1) {
lives--;
e.hp = 0;
continue;
}
let tx = (targetX + 0.5) * cellSize + offsetX;
let ty = (targetY + 0.5) * cellSize + offsetY;
let dx = tx - e.px, dy = ty - e.py;
let dist = Math.sqrt(dx*dx + dy*dy);
let move = e.speed * cellSize * sdt;
if (dist <= move) {
e.px = tx; e.py = ty; e.pathIdx++;
} else {
e.px += (dx/dist) * move;
e.py += (dy/dist) * move;
}
}

// Remove dead enemies, grant money
enemies = enemies.filter(e => {
if (e.hp <= 0) {
money += e.reward;
score += e.reward;
for (let i = 0; i < 6; i++) particles.push({x: e.px, y: e.py, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 0.5, color: '#ff6'});
return false;
}
return true;
});

// Tower shooting
for (let t of towers) {
t.cooldown -= sdt;
if (t.cooldown > 0) continue;
let best = null, bestDist = Infinity;
for (let e of enemies) {
let dx = e.px - t.px, dy = e.py - t.py;
let d = Math.sqrt(dx*dx + dy*dy);
if (d <= t.range && d < bestDist) { best = e; bestDist = d; }
}
if (best) {
t.cooldown = t.rate;
projectiles.push({x: t.px, y: t.py, tx: best, speed: 300, dmg: t.dmg, color: t.color});
}
}

// Move projectiles
for (let p of projectiles) {
let target = p.tx;
if (!enemies.includes(target)) { p.dead = true; continue; }
let dx = target.px - p.x, dy = target.py - p.y;
let dist = Math.sqrt(dx*dx+dy*dy);
let move = p.speed * sdt;
if (dist <= move) {
target.hp -= p.dmg;
p.dead = true;
for (let i = 0; i < 3; i++) particles.push({x: target.px, y: target.py, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: 0.3, color: p.color});
} else {
p.x += (dx/dist)*move;
p.y += (dy/dist)*move;
}
}
projectiles = projectiles.filter(p => !p.dead);

// Particles
for (let pt of particles) {
pt.x += pt.vx * sdt * 30;
pt.y += pt.vy * sdt * 30;
pt.life -= sdt;
}
particles = particles.filter(p => p.life > 0);

// Wave complete?
if (enemiesToSpawn === 0 && enemies.length === 0) {
waveActive = false;
gameState = 'building';
document.getElementById('waveBtn').style.display = '';
money += 30 + waveNum * 10; // wave bonus
}

// Game over check
if (lives <= 0) {
gameState = 'gameover';
document.getElementById('finalWave').textContent = waveNum;
document.getElementById('finalScore').textContent = score;
document.getElementById('gameOverScreen').style.display = '';
document.getElementById('hud').style.display = 'none';
document.getElementById('towerBtns').style.display = 'none';
}
}

function draw() {
ctx.fillStyle = '#0f0f1a';
ctx.fillRect(0, 0, W, H);

if (gameState === 'start' || gameState === 'gameover') return;

// Draw maze cells and walls
for (let y = 0; y < gridH; y++) {
for (let x = 0; x < gridW; x++) {
let px = offsetX + x * cellSize, py = offsetY + y * cellSize;
// Cell background
if (pathSet.has(key(x, y))) {
ctx.fillStyle = '#1a2a3a';
} else {
ctx.fillStyle = '#151520';
}
ctx.fillRect(px, py, cellSize, cellSize);

// Walls
let w = 3;
if (mazeWalls[y][x][0]) { ctx.fillStyle = '#4a4a6a'; ctx.fillRect(px - w/2, py - w/2, cellSize + w, w); }
if (mazeWalls[y][x][1]) { ctx.fillStyle = '#4a4a6a'; ctx.fillRect(px + cellSize - w/2, py - w/2, w, cellSize + w); }
if (mazeWalls[y][x][2] && y < gridH-1) { ctx.fillStyle = '#4a4a6a'; ctx.fillRect(px - w/2, py + cellSize - w/2, cellSize + w, w); }
if (mazeWalls[y][x][3] && x > 0) { ctx.fillStyle = '#4a4a6a'; ctx.fillRect(px - w/2, py - w/2, w, cellSize + w); }

// Path glow
if (pathSet.has(key(x, y))) {
ctx.fillStyle = 'rgba(100,150,255,0.08)';
ctx.fillRect(px+2, py+2, cellSize-4, cellSize-4);
}
}
}

// Draw path direction hints (subtle dots)
ctx.fillStyle = 'rgba(100,150,255,0.3)';
for (let i = 0; i < path.length; i += 3) {
let c = path[i];
ctx.beginPath();
ctx.arc(offsetX + (c.x+0.5)*cellSize, offsetY + (c.y+0.5)*cellSize, 3, 0, Math.PI*2);
ctx.fill();
}

// Start/End markers
let sp = path[0], ep = path[path.length-1];
ctx.fillStyle = '#4caf50';
ctx.beginPath(); ctx.arc(offsetX+(sp.x+0.5)*cellSize, offsetY+(sp.y+0.5)*cellSize, cellSize*0.35, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#f44336';
ctx.beginPath(); ctx.arc(offsetX+(ep.x+0.5)*cellSize, offsetY+(ep.y+0.5)*cellSize, cellSize*0.35, 0, Math.PI*2); ctx.fill();

// Towers
for (let t of towers) {
let px = offsetX + t.gx * cellSize, py = offsetY + t.gy * cellSize;
ctx.fillStyle = t.color;
ctx.fillRect(px + cellSize*0.15, py + cellSize*0.15, cellSize*0.7, cellSize*0.7);
// Range circle (faint)
if (t === hoveredTower) {
ctx.strokeStyle = 'rgba(255,255,255,0.2)';
ctx.beginPath(); ctx.arc(t.px, t.py, t.range, 0, Math.PI*2); ctx.stroke();
}
// Level indicator
if (t.level > 1) {
ctx.fillStyle = '#fff';
ctx.font = '10px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('★'.repeat(t.level-1), px + cellSize/2, py + cellSize - 4);
}
}

// Enemies
for (let e of enemies) {
let r = cellSize * 0.3;
ctx.fillStyle = '#ff5252';
ctx.beginPath(); ctx.arc(e.px, e.py, r, 0, Math.PI*2); ctx.fill();
// HP bar
let bw = r * 2, bh = 4;
ctx.fillStyle = '#333';
ctx.fillRect(e.px - bw/2, e.py - r - 8, bw, bh);
ctx.fillStyle = '#4caf50';
ctx.fillRect(e.px - bw/2, e.py - r - 8, bw * (e.hp / e.maxHp), bh);
}

// Projectiles
for (let p of projectiles) {
ctx.fillStyle = p.color;
ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
}

// Particles
for (let pt of particles) {
ctx.globalAlpha = pt.life * 2;
ctx.fillStyle = pt.color;
ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
}
ctx.globalAlpha = 1;

// Hover highlight
if (hoverCell && gameState === 'building') {
let hx = offsetX + hoverCell.x * cellSize, hy = offsetY + hoverCell.y * cellSize;
let canPlace = !pathSet.has(key(hoverCell.x, hoverCell.y)) && !towers.find(t => t.gx===hoverCell.x && t.gy===hoverCell.y);
ctx.strokeStyle = canPlace ? 'rgba(100,255,100,0.6)' : 'rgba(255,100,100,0.6)';
ctx.lineWidth = 2;
ctx.strokeRect(hx+2, hy+2, cellSize-4, cellSize-4);
}

// Update HUD
document.getElementById('money').textContent = money;
document.getElementById('lives').textContent = lives;
document.getElementById('wave').textContent = waveNum;
document.getElementById('score').textContent = score;
}

let hoverCell = null, hoveredTower = null;

canvas.addEventListener('mousemove', (e) => {
let rect = canvas.getBoundingClientRect();
let mx = e.clientX - rect.left, my = e.clientY - rect.top;
let gx = Math.floor((mx - offsetX) / cellSize);
let gy = Math.floor((my - offsetY) / cellSize);
if (gx >= 0 && gx < gridW && gy >= 0 && gy < gridH) {
hoverCell = {x: gx, y: gy};
} else { hoverCell = null; }
hoveredTower = towers.find(t => t.gx === gx && t.gy === gy) || null;
});

canvas.addEventListener('click', (e) => {
if (gameState !== 'building') return;
if (!hoverCell) return;
let {x, y} = hoverCell;
let cost = selectedTower === 0 ? 50 : 100;
if (pathSet.has(key(x, y))) return;
if (towers.find(t => t.gx===x && t.gy===y)) return;
if (money < cost) return;

money -= cost;
let tower = {
gx: x, gy: y, px: offsetX + (x+0.5)*cellSize, py: offsetY + (y+0.5)*cellSize,
range: selectedTower === 0 ? cellSize * 2.5 : cellSize * 4,
dmg: selectedTower === 0 ? 15 : 40,
rate: selectedTower === 0 ? 0.6 : 1.2,
cooldown: 0, level: 1,
color: selectedTower === 0 ? '#6a5acd' : '#e91e63',
type: selectedTower
};
towers.push(tower);
});

canvas.addEventListener('contextmenu', (e) => {
e.preventDefault();
if (!hoverCell || gameState !== 'building') return;
let idx = towers.findIndex(t => t.gx===hoverCell.x && t.gy===hoverCell.y);
if (idx >= 0) {
money += Math.floor((selectedTower === 0 ? 50 : 100) * 0.6);
towers.splice(idx, 1);
}
});

window.addEventListener('keydown', (e) => {
if (e.key === '1') { selectedTower = 0; document.getElementById('btn1').classList.add('active'); document.getElementById('btn2').classList.remove('active'); }
if (e.key === '2') { selectedTower = 1; document.getElementById('btn2').classList.add('active'); document.getElementById('btn1').classList.remove('active'); }
if ((e.key === 'r' || e.key === 'R') && gameState === 'building') { newMaze(); }
});

document.getElementById('btn1').addEventListener('click', () => { selectedTower = 0; document.getElementById('btn1').classList.add('active'); document.getElementById('btn2').classList.remove('active'); });
document.getElementById('btn2').addEventListener('click', () => { selectedTower = 1; document.getElementById('btn2').classList.add('active'); document.getElementById('btn1').classList.remove('active'); });

document.getElementById('waveBtn').addEventListener('click', startWave);

function startGame() {
money = 150; lives = 20; score = 0; waveNum = 0;
newMaze();
gameState = 'building';
document.getElementById('startScreen').style.display = 'none';
document.getElementById('gameOverScreen').style.display = 'none';
document.getElementById('hud').style.display = '';
document.getElementById('towerBtns').style.display = '';
document.getElementById('waveBtn').style.display = '';
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

let audioCtx = null;
function playSound(freq, dur) {
if (!audioCtx) return;
let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();
osc.connect(gain); gain.connect(audioCtx.destination);
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
osc.start(); osc.stop(audioCtx.currentTime + dur);
}

window.addEventListener('click', () => { if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)(); }, {once: true});

canvas.addEventListener('click', () => { playSound(440, 0.1); });

function gameLoop(timestamp) {
let dt = Math.min((timestamp - lastTime) / 1000, 0.1);
lastTime = timestamp;
update(dt);
draw();
requestAnimationFrame(gameLoop);
}
newMaze();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
