<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout Golf</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a4d2e; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
let gameState = 'start'; // start, playing, ballInPlay, gameOver, win
let score = 0;
let lives = 3;
let level = 1;
let balls = [];
let bricks = [];
let particles = [];
let powerUps = [];
let keys = {};

const BALL_RADIUS = 8;
const PADDLE_HEIGHT = 20;

let paddle = { x: 0, w: 100, speed: 8 };

function createBall() {
    return { x: paddle.x + paddle.w / 2, y: H - 40, vx: 0, vy: 0, active: false };
}

paddle.x = W / 2 - 50;
balls = [createBall()];

const BRICK_TYPES = [
    { color: '#8B7D3C', name: 'sand', hp: 1, points: 10 },
    { color: '#4A90D9', name: 'water', hp: 2, points: 20 },
    { color: '#2E8B57', name: 'tree', hp: 3, points: 30 },
    { color: '#8B4513', name: 'fence', hp: 4, points: 40 }
];

function generateLevel(lvl) {
    bricks = [];
    const rows = Math.min(3 + lvl, 7);
    const cols = Math.min(6 + lvl, 12);
    const brickW = Math.floor((W - 40) / cols);
    const brickH = 30;
    const startY = 60;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let typeIdx;
            if (lvl === 1) typeIdx = 0;
            else if (lvl === 2) typeIdx = Math.floor(Math.random() * 2);
            else if (lvl === 3) typeIdx = Math.floor(Math.random() * 3);
            else typeIdx = Math.floor(Math.random() * 4);

            // Pattern for level 1
            if (lvl === 1 && r % 2 === 0 && c % 3 === 0) continue;

            bricks.push({
                x: 20 + c * brickW,
                y: startY + r * (brickH + 5),
                w: brickW - 4,
                h: brickH,
                type: BRICK_TYPES[typeIdx],
                hp: BRICK_TYPES[typeIdx].hp,
                maxHp: BRICK_TYPES[typeIdx].hp
            });
        }
    }
}

function resetBall() {
    balls = [createBall()];
    gameState = 'ballInPlay';
}

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    generateLevel(level);
    resetBall();
}

function nextLevel() {
    level++;
    if (level > 5) {
        gameState = 'win';
        return;
    }
    generateLevel(level);
    resetBall();
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 30 + Math.random() * 20,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}

function spawnPowerUp(x, y) {
    if (Math.random() < 0.15) {
        const types = ['life', 'wider', 'slow'];
        powerUps.push({ x: x, y: y, vy: 2, type: types[Math.floor(Math.random() * types.length)] });
    }
}

// Input
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    initAudio();

    if (gameState === 'start' || gameState === 'gameOver' || gameState === 'win') {
        if (e.code === 'Space' || e.code === 'Enter') {
            startGame();
        }
    } else if (gameState === 'ballInPlay') {
        if (e.code === 'Space') {
            const ball = balls[0];
            ball.active = true;
            ball.vx = (Math.random() - 0.5) * 4;
            ball.vy = -8;
            playSound(440, 0.1, 'sine', 0.2);
        }
    }

    if (e.code === 'KeyR' && gameState === 'gameOver') {
        startGame();
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Touch support
canvas.addEventListener('touchstart', (e) => {
    initAudio();
    if (gameState === 'start' || gameState === 'gameOver' || gameState === 'win') {
        startGame();
    } else if (gameState === 'ballInPlay') {
        const ball = balls[0];
        ball.active = true;
        ball.vx = (Math.random() - 0.5) * 4;
        ball.vy = -8;
        playSound(440, 0.1, 'sine', 0.2);
    }
});

let touchX = null;
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
        touchX = e.touches[0].clientX;
    }
});
canvas.addEventListener('touchend', () => { touchX = null; });

// Update
function update() {
    if (gameState !== 'ballInPlay' && gameState !== 'playing') return;

    // Paddle movement
    if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed;
    if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed;
    if (touchX !== null) paddle.x = touchX - paddle.w / 2;

    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    const ball = balls[0];

    if (!ball.active) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = H - 40;
        return;
    }

    // Ball movement
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall collisions
    if (ball.x - BALL_RADIUS < 0) { ball.x = BALL_RADIUS; ball.vx = Math.abs(ball.vx); playSound(220, 0.05, 'square', 0.1); }
    if (ball.x + BALL_RADIUS > W) { ball.x = W - BALL_RADIUS; ball.vx = -Math.abs(ball.vx); playSound(220, 0.05, 'square', 0.1); }
    if (ball.y - BALL_RADIUS < 0) { ball.y = BALL_RADIUS; ball.vy = Math.abs(ball.vy); playSound(220, 0.05, 'square', 0.1); }

    // Paddle collision
    if (ball.vy > 0 && ball.y + BALL_RADIUS >= H - 40 && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
        ball.y = H - 40 - BALL_RADIUS;
        const hitPos = (ball.x - paddle.x) / paddle.w;
        const angle = (hitPos - 0.5) * Math.PI * 0.7;
        const speed = 10;
        ball.vx = Math.sin(angle) * speed;
        ball.vy = -Math.cos(angle) * speed;
        playSound(330, 0.08, 'sine', 0.2);
    }

    // Ball lost
    if (ball.y + BALL_RADIUS > H) {
        lives--;
        playSound(150, 0.3, 'sawtooth', 0.15);
        if (lives <= 0) {
            gameState = 'gameOver';
        } else {
            resetBall();
        }
        return;
    }

    // Brick collisions
    for (let i = bricks.length - 1; i >= 0; i--) {
        const b = bricks[i];
        if (ball.x + BALL_RADIUS > b.x && ball.x - BALL_RADIUS < b.x + b.w &&
            ball.y + BALL_RADIUS > b.y && ball.y - BALL_RADIUS < b.y + b.h) {

            // Determine side
            const overlapX = Math.min(ball.x + BALL_RADIUS - b.x, b.x + b.w - (ball.x - BALL_RADIUS));
            const overlapY = Math.min(ball.y + BALL_RADIUS - b.y, b.y + b.h - (ball.y - BALL_RADIUS));

            if (overlapX < overlapY) {
                ball.vx = -ball.vx;
            } else {
                ball.vy = -ball.vy;
            }

            b.hp--;
            playSound(500, 0.1, 'square', 0.15);

            if (b.hp <= 0) {
                score += b.type.points;
                spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.type.color, 8);
                spawnPowerUp(b.x + b.w / 2, b.y + b.h / 2);
                bricks.splice(i, 1);
            }

            // Check level complete
            if (bricks.length === 0) {
                nextLevel();
                return;
            }
            break;
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const pu = powerUps[i];
        pu.y += pu.vy;
        if (pu.y > H) { powerUps.splice(i, 1); continue; }

        // Collect
        if (pu.x >= paddle.x && pu.x <= paddle.x + paddle.w && pu.y >= H - 50) {
            if (pu.type === 'life') lives = Math.min(lives + 1, 5);
            else if (pu.type === 'wider') paddle.w = Math.min(paddle.w + 20, 160);
            else if (pu.type === 'slow') { ball.vx *= 0.8; ball.vy *= 0.8; }
            playSound(660, 0.15, 'sine', 0.2);
            powerUps.splice(i, 1);
        }
    }

    // Speed cap
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (speed > 14) {
        ball.vx = (ball.vx / speed) * 14;
        ball.vy = (ball.vy / speed) * 14;
    }
}

// Draw
function draw() {
    // Background - golf course green
    ctx.fillStyle = '#2d6b3f';
    ctx.fillRect(0, 0, W, H);

    // Grass stripes
    for (let i = 0; i < H; i += 80) {
        ctx.fillStyle = (Math.floor(i / 80) % 2 === 0) ? '#3a7d4a' : '#2d6b3f';
        ctx.fillRect(0, i, W, 80);
    }

    // Top border
    ctx.fillStyle = '#1a4d2e';
    ctx.fillRect(0, 0, W, 50);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`HOLE: ${level}`, 20, 30);
    ctx.fillText(`SCORE: ${score}`, 150, 30);
    ctx.fillText(`BALLS: ${lives}`, 300, 30);

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    // Bricks
    for (const b of bricks) {
        const alpha = b.hp / b.maxHp;
        ctx.fillStyle = b.type.color;
        ctx.globalAlpha = 0.5 + alpha * 0.5;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Brick detail
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        // Type icon
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        const icons = { sand: '⏳', water: '💧', tree: '🌲', fence: '🏗' };
        ctx.fillText(icons[b.type.name] || '', b.x + b.w / 2, b.y + b.h / 2 + 4);

        // HP bar
        if (b.maxHp > 1) {
            ctx.fillStyle = '#333';
            ctx.fillRect(b.x + 2, b.y + b.h - 5, b.w - 4, 3);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(b.x + 2, b.y + b.h - 5, (b.w - 4) * (b.hp / b.maxHp), 3);
        }
    }

    // Power-ups
    for (const pu of powerUps) {
        ctx.fillStyle = pu.type === 'life' ? '#ff6b6b' : pu.type === 'wider' ? '#ffd93d' : '#6bcb77';
        ctx.beginPath();
        ctx.arc(pu.x, pu.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        const labels = { life: '+', wider: 'W', slow: 'S' };
        ctx.fillText(labels[pu.type], pu.x, pu.y + 4);
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Paddle (golf club)
    const px = paddle.x;
    const py = H - 40;
    // Club head
    ctx.fillStyle = '#c0c0c0';
    ctx.beginPath();
    ctx.roundRect(px, py, paddle.w, PADDLE_HEIGHT, 5);
    ctx.fill();
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Club face detail
    ctx.fillStyle = '#a0a0a0';
    ctx.fillRect(px + 5, py + 3, paddle.w - 10, PADDLE_HEIGHT - 6);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🏌️', px + paddle.w / 2, py + PADDLE_HEIGHT / 2 + 4);

    // Ball (golf ball)
    const ball = balls[0];
    if (ball.active || gameState === 'ballInPlay') {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Dimple dots
        ctx.fillStyle = '#ddd';
        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2;
            ctx.fillRect(ball.x + Math.cos(a) * 4 - 1, ball.y + Math.sin(a) * 4 - 1, 2, 2);
        }

        if (!ball.active) {
            ctx.fillStyle = '#fff';
            ctx.font = '14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Press SPACE to tee off!', W / 2, H - 70);
        }
    }

    if (gameState === 'gameOver') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('TWO PUTTS!', W / 2, H / 2 - 40);
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 10);
        ctx.font = '18px monospace';
        ctx.fillText('Press SPACE or R to play again', W / 2, H / 2 + 60);
    }

    if (gameState === 'win') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 HOLES IN ONE! 🏆', W / 2, H / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 10);
        ctx.font = '18px monospace';
        ctx.fillText('Press SPACE to play again', W / 2, H / 2 + 60);
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⛳ BREAKOUT GOLF', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText('Clear all golf hazards to advance the hole!', W / 2, H / 3 + 50);

    ctx.font = '16px monospace';
    ctx.fillText('← → or A/D : Move club', W / 2, H / 2 + 10);
    ctx.fillText('SPACE : Tee off / Launch ball', W / 2, H / 2 + 40);
    ctx.fillText('R : Restart (on game over)', W / 2, H / 2 + 70);

    ctx.fillStyle = '#8f8';
    ctx.font = '16px monospace';
    ctx.fillText('Hazards: ⏳ Sand(1) | 💧 Water(2) | 🌲 Tree(3) | 🏗 Fence(4)', W / 2, H / 2 + 110);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    const blink = Math.floor(Date.now() / 500) % 2;
    if (blink) ctx.fillText('Press SPACE to Start', W / 2, H * 3 / 4);
}

// Game loop
let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

generateLevel(1);
resetBall();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
