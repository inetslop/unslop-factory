<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Frogger 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, scale;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    scale = Math.min(W / 800, H / 900);
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxJump() { playSound(400, 0.08, 'square', 0.08); }
function sfxDie() { playSound(150, 0.4, 'sawtooth', 0.15); playSound(100, 0.6, 'square', 0.1); }
function sfxHome() { playSound(600, 0.1, 'square', 0.1); setTimeout(()=>playSound(800,0.1,'square',0.1),100); setTimeout(()=>playSound(1200,0.2,'square',0.12),200); }
function sfxSplash() { playSound(200, 0.3, 'sine', 0.1); }

// Game constants
const COLS = 13, ROWS = 13;
const CELL = 60;
const FROG_SPEED = 40;
const CAR_SPEEDS = [1.2, 1.5, 1.8];
const LOG_SPEEDS = [0.8, 1.0, 1.2];

// Row types: 0=home, 1=grass, 2=cars, 3=river, 4=start
const ROW_TYPES = [0, 1, 1, 1, 2, 2, 2, 3, 3, 3, 1, 1, 1];

// Game state
let gameState = 'start'; // start, playing, dead, win, gameover
let frog = { col: 6, row: 12, moving: false, moveProgress: 0, fromCol: 6, fromRow: 12, toCol: 6, toRow: 12 };
let score = 0;
let lives = 3;
let cars = [];
let logs = [];
let particles = [];
let time = 0;
let deadTimer = 0;
let homeFlash = 0;

function initLevel() {
    cars = [];
    for (let r = 4; r <= 6; r++) {
        const count = r === 5 ? 3 : 2;
        for (let i = 0; i < count; i++) {
            const c = Math.floor(Math.random() * COLS);
            const dir = r % 2 === 0 ? 1 : -1;
            cars.push({ col: c, row: r, dir: dir, speed: CAR_SPEEDS[r - 4], size: r === 5 ? 2 : 1 });
        }
    }
    logs = [];
    for (let r = 7; r <= 9; r++) {
        const count = 3;
        for (let i = 0; i < count; i++) {
            const c = Math.floor(Math.random() * COLS) - 1;
            const dir = r % 2 === 1 ? 1 : -1;
            const len = 2 + Math.floor(Math.random() * 2);
            logs.push({ col: c, row: r, dir: dir, speed: LOG_SPEEDS[r - 7], len: len });
        }
    }
}

function resetGame() {
    frog = { col: 6, row: 12, moving: false, moveProgress: 0, fromCol: 6, fromRow: 12, toCol: 6, toRow: 12 };
    score = 0;
    lives = 3;
    particles = [];
    deadTimer = 0;
    homeFlash = 0;
    initLevel();
}

function startGame() {
    initAudio();
    resetGame();
    gameState = 'playing';
}

// Input
document.addEventListener('keydown', function(e) {
    if (gameState === 'start' || gameState === 'gameover') {
        if (e.key === 'Enter' || e.key === ' ') startGame();
        return;
    }
    if (gameState !== 'playing') return;
    if (frog.moving) return;

    let dx = 0, dy = 0;
    if (e.key === 'ArrowLeft' || e.key === 'a') dx = -1;
    else if (e.key === 'ArrowRight' || e.key === 'd') dx = 1;
    else if (e.key === 'ArrowUp' || e.key === 'w') dy = -1;
    else if (e.key === 'ArrowDown' || e.key === 's') dy = 1;
    else return;

    e.preventDefault();
    const nc = frog.col + dx, nr = frog.row + dy;
    if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) return;

    sfxJump();
    frog.moving = true;
    frog.moveProgress = 0;
    frog.fromCol = frog.col;
    frog.fromRow = frog.row;
    frog.toCol = nc;
    frog.toRow = nr;
});

// 3D Projection
const CAM_DIST = 12;
const CAM_HEIGHT = 8;
const FOV = 600;

function project(wx, wy, wz) {
    // World: x=right, y=up, z=into screen (away from camera)
    const cx = wx - 0; // center x
    const cy = -(wy - CAM_HEIGHT);
    const cz = wz + CAM_DIST;

    if (cz <= 0.1) return null;

    const sx = W / 2 + (cx * FOV) / cz;
    const sy = H * 0.55 + (cy * FOV) / cz;
    const s = FOV / cz;
    return { x: sx, y: sy, s: s };
}

function worldToScreen(col, row, height) {
    const wx = (col - COLS / 2) * CELL;
    const wz = (row - ROWS / 2) * CELL;
    const wy = height || 0;
    return project(wx, wy, wz);
}

function draw3DCube(x1, y1, z1, x2, y2, z2, h, color, topColor) {
    // Draw a 3D box from world coords (x1,y1,z1) to (x2,y2,z2) with height h
    const pts = [
        project(x1, 0, z1), project(x2, 0, z2),
        project(x2, 0, z1), project(x1, 0, z2),
        project(x1, h, z1), project(x2, h, z2),
        project(x2, h, z1), project(x1, h, z2)
    ];
    if (pts.some(p => !p)) return;

    // Bottom face
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.lineTo(pts[3].x, pts[3].y);
    ctx.closePath();
    ctx.fill();

    // Front face (z1 side)
    ctx.fillStyle = shadeColor(color, -20);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[4].x, pts[4].y);
    ctx.lineTo(pts[5].x, pts[5].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.closePath();
    ctx.fill();

    // Right face (x2 side)
    ctx.fillStyle = shadeColor(color, -35);
    ctx.beginPath();
    ctx.moveTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[5].x, pts[5].y);
    ctx.lineTo(pts[6].x, pts[6].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.closePath();
    ctx.fill();

    // Top face
    ctx.fillStyle = topColor || shadeColor(color, 15);
    ctx.beginPath();
    ctx.moveTo(pts[4].x, pts[4].y);
    ctx.lineTo(pts[5].x, pts[5].y);
    ctx.lineTo(pts[6].x, pts[6].y);
    ctx.lineTo(pts[7].x, pts[7].y);
    ctx.closePath();
    ctx.fill();
}

function shadeColor(hex, amt) {
    let r = parseInt(hex.slice(1,3), 16);
    let g = parseInt(hex.slice(3,5), 16);
    let b = parseInt(hex.slice(5,7), 16);
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
}

function drawGrid() {
    // Draw grid cells
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x1 = (c - COLS / 2) * CELL;
            const z1 = (r - ROWS / 2) * CELL;
            const x2 = x1 + CELL;
            const z2 = z1 + CELL;

            let color, topColor;
            const rt = ROW_TYPES[r];
            if (rt === 0) {
                color = '#1a3a1a'; topColor = '#2a5a2a';
                // Home holes
                if (c % 3 === 1) {
                    const p = worldToScreen(c + 0.5, r + 0.5, 0);
                    if (p) {
                        ctx.fillStyle = '#0a1a0a';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, CELL * scale * 0.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#4aff4a';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
            } else if (rt === 1) {
                color = '#1a4a1a'; topColor = '#2a6a2a';
            } else if (rt === 2) {
                color = '#3a3a4a'; topColor = '#4a4a5a';
            } else { // river
                const wave = Math.sin(time * 2 + c * 0.5 + r) * 10;
                color = `rgb(${20+wave},${60+wave*0.5},${120+wave})`;
                topColor = `rgb(${30+wave},${80+wave*0.5},${160+wave})`;
            }

            draw3DCube(x1, z1, x2, z2, 2, color, topColor);
        }
    }
}

function drawLog(log) {
    const r = log.row;
    const x1 = (log.col - COLS / 2) * CELL;
    const z1 = (r - ROWS / 2) * CELL;
    const x2 = x1 + log.len * CELL;
    const z2 = z1 + CELL * 0.85;

    draw3DCube(x1, z1, x2, z2, 12, '#6a4a2a', '#8a6a3a');

    // Log ends (circles)
    const p1 = worldToScreen(log.col + 0.05, r + 0.5, 6);
    if (p1) {
        ctx.fillStyle = '#9a7a4a';
        ctx.beginPath();
        ctx.arc(p1.x - CELL*scale*0.15, p1.y, CELL * scale * 0.2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawCar(car) {
    const r = car.row;
    const x1 = (car.col - COLS / 2) * CELL;
    const z1 = (r - ROWS / 2) * CELL;
    const x2 = x1 + car.size * CELL * 0.85;
    const z2 = z1 + CELL * 0.7;

    let color = '#ff4a4a';
    if (car.row === 4) color = '#ffaa3a';
    if (car.row === 6) color = '#4a9aff';

    draw3DCube(x1, z1, x2, z2, 18, color, shadeColor(color, 20));

    // Windshield
    const p = worldToScreen(car.col + car.size * 0.3, r + 0.35, 14);
    if (p) {
        ctx.fillStyle = '#aaddff';
        ctx.fillRect(p.x - CELL*scale*0.12, p.y, CELL*scale*0.24, CELL*scale*0.15);
    }
}

function drawFrog() {
    let fc, fr;
    if (frog.moving) {
        const t = frog.moveProgress;
        fc = frog.fromCol + (frog.toCol - frog.fromCol) * t;
        fr = frog.fromRow + (frog.toRow - frog.fromRow) * t;
        // Hop arc
        const h = Math.sin(t * Math.PI) * 20;
        return drawFrogAt(fc, fr, h);
    }
    drawFrogAt(frog.col, frog.row, 0);
}

function drawFrogAt(col, row, height) {
    const x1 = (col - COLS / 2) * CELL + CELL * 0.15;
    const z1 = (row - ROWS / 2) * CELL + CELL * 0.15;
    const x2 = x1 + CELL * 0.7;
    const z2 = z1 + CELL * 0.7;

    draw3DCube(x1, z1, x2, z2, 14, '#2aff4a', '#4aff6a');

    // Eyes
    const p = worldToScreen(col + 0.3, row + 0.3, 18);
    if (p) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x - 5*scale, p.y, 4*scale, 0, Math.PI*2);
        ctx.arc(p.x + 5*scale, p.y, 4*scale, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(p.x - 5*scale, p.y, 2*scale, 0, Math.PI*2);
        ctx.arc(p.x + 5*scale, p.y, 2*scale, 0, Math.PI*2);
        ctx.fill();
    }

    // Glow
    const gp = worldToScreen(col + 0.5, row + 0.5, 7);
    if (gp) {
        const grad = ctx.createRadialGradient(gp.x, gp.y, 0, gp.x, gp.y, CELL*scale*0.6);
        grad.addColorStop(0, 'rgba(50,255,100,0.3)');
        grad.addColorStop(1, 'rgba(50,255,100,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(gp.x, gp.y, CELL*scale*0.6, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        const sp = worldToScreen(p.col, p.row, p.h);
        if (!sp) continue;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, p.size * sp.s / 600, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function spawnDeathParticles() {
    for (let i = 0; i < 20; i++) {
        particles.push({
            col: frog.col + 0.5, row: frog.row + 0.5,
            h: Math.random() * 20,
            vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, vz: Math.random()*4,
            life: 1, color: `hsl(${100+Math.random()*60},100%,60%)`,
            size: 3+Math.random()*4
        });
    }
}

function spawnHomeParticles() {
    for (let i = 0; i < 25; i++) {
        particles.push({
            col: frog.col + 0.5, row: frog.row + 0.5,
            h: Math.random() * 30,
            vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, vz: Math.random()*6,
            life: 1, color: `hsl(${80+Math.random()*80},100%,70%)`,
            size: 3+Math.random()*5
        });
    }
}

function update(dt) {
    if (gameState !== 'playing' && gameState !== 'dead') return;

    time += dt;

    // Move frog
    if (frog.moving) {
        frog.moveProgress += dt * (FROG_SPEED / 1);
        if (frog.moveProgress >= 1) {
            frog.moveProgress = 0;
            frog.col = frog.toCol;
            frog.row = frog.toRow;
            frog.moving = false;

            // Check home
            if (frog.row === 0 && frog.col % 3 === 1) {
                score += 50;
                sfxHome();
                spawnHomeParticles();
                homeFlash = 1;
                resetFrog();
                return;
            }
        }
    }

    // Move cars
    for (const car of cars) {
        car.col += car.dir * car.speed * dt;
        if (car.col > COLS + 1) car.col = -car.size * 0.5;
        if (car.col < -2) car.col = COLS + 1;
    }

    // Move logs
    for (const log of logs) {
        log.col += log.dir * log.speed * dt;
        if (log.col > COLS) log.col = -log.len;
        if (log.col < -log.len - 1) log.col = COLS + 0.5;
    }

    // Check collisions (only when not moving)
    if (!frog.moving && gameState === 'playing') {
        const rt = ROW_TYPES[frog.row];
        if (rt === 2) {
            for (const car of cars) {
                if (car.row === frog.row) {
                    if (Math.abs(car.col - frog.col) < 0.7) {
                        killFrog();
                        return;
                    }
                }
            }
        } else if (rt === 3) {
            let onLog = false;
            for (const log of logs) {
                if (log.row === frog.row && frog.col >= log.col && frog.col < log.col + log.len) {
                    onLog = true;
                    // Ride with log - move frog
                    frog.col += log.dir * log.speed * dt * 0.5;
                    break;
                }
            }
            if (!onLog) {
                sfxSplash();
                killFrog();
                return;
            }
        }

        // Score for reaching rows
        if (frog.row < ROWS - 1 && rt !== 0) {
            const newRowScore = (ROWS - 1 - frog.row) * 5;
            if (newRowScore > score % 1) { /* simplified */ }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.h += p.vz * dt;
        p.col += p.vx * dt * 0.3;
        p.row += p.vy * dt * 0.3;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Death state
    if (gameState === 'dead') {
        deadTimer += dt;
        if (deadTimer > 1.5) {
            if (lives <= 0) {
                gameState = 'gameover';
            } else {
                resetFrog();
                gameState = 'playing';
            }
        }
    }

    // Home flash
    if (homeFlash > 0) homeFlash -= dt * 2;
}

function killFrog() {
    sfxDie();
    spawnDeathParticles();
    lives--;
    gameState = 'dead';
    deadTimer = 0;
}

function resetFrog() {
    frog.col = 6;
    frog.row = 12;
    frog.moving = false;
    frog.moveProgress = 0;
}

function render() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Background gradient
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0a0a2a');
    bgGrad.addColorStop(1, '#1a0a2a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + 50) % W;
        const sy = ((i * 251 + 30) % (H * 0.4));
        const tw = Math.sin(time * 2 + i) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255,255,255,${tw * 0.6})`;
        ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    // Draw game world
    drawGrid();

    // Sort and draw objects back to front
    const drawables = [];

    for (const log of logs) {
        drawables.push({ type: 'log', obj: log, z: log.row });
    }
    for (const car of cars) {
        drawables.push({ type: 'car', obj: car, z: car.row });
    }

    if (gameState === 'playing' || gameState === 'dead') {
        drawables.push({ type: 'frog', obj: frog, z: frog.row + 0.1 });
    }

    drawables.sort((a, b) => a.z - b.z);

    for (const d of drawables) {
        if (d.type === 'log') drawLog(d.obj);
        else if (d.type === 'car') drawCar(d.obj);
        else if (d.type === 'frog') drawFrog();
    }

    drawParticles();

    // Home flash
    if (homeFlash > 0) {
        ctx.fillStyle = `rgba(100,255,100,${homeFlash * 0.3})`;
        ctx.fillRect(0, 0, W, H);
    }

    // UI
    ctx.textAlign = 'left';
    ctx.font = `bold ${Math.floor(20*scale)}px monospace`;
    ctx.fillStyle = '#4aff4a';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.fillStyle = '#ff4a4a';
    ctx.fillText(`LIVES: ${'♥'.repeat(Math.max(0,lives))}`, 20, 65);

    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'gameover') {
        drawGameOver();
    } else if (gameState === 'dead') {
        ctx.textAlign = 'center';
        ctx.font = `bold ${Math.floor(30*scale)}px monospace`;
        ctx.fillStyle = '#ff4a4a';
        ctx.fillText('SPLAT!', W/2, H * 0.5);
    }
}

function drawStartScreen() {
    ctx.textAlign = 'center';
    const fs = Math.floor(48*scale);
    ctx.font = `bold ${fs}px monospace`;
    ctx.fillStyle = '#4aff4a';
    ctx.shadowColor = '#4aff4a';
    ctx.shadowBlur = 20;
    ctx.fillText('FROGGER 3D', W/2, H * 0.35);
    ctx.shadowBlur = 0;

    ctx.font = `${Math.floor(18*scale)}px monospace`;
    ctx.fillStyle = '#aaffaa';
    ctx.fillText('Guide the frog to safety! Avoid cars and water.', W/2, H * 0.45);
    ctx.fillText('Ride logs across the river. Reach the holes at the top!', W/2, H * 0.5);

    ctx.font = `${Math.floor(16*scale)}px monospace`;
    ctx.fillStyle = '#88ff88';
    ctx.fillText('Controls: Arrow Keys / WASD to move', W/2, H * 0.6);
    ctx.fillText('Press ENTER or SPACE to start', W/2, H * 0.68);

    const pulse = Math.sin(time * 3) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(100,255,100,${pulse})`;
    ctx.font = `bold ${Math.floor(22*scale)}px monospace`;
    ctx.fillText('▶ START GAME ◀', W/2, H * 0.78);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    const fs = Math.floor(42*scale);
    ctx.font = `bold ${fs}px monospace`;
    ctx.fillStyle = '#ff4a4a';
    ctx.shadowColor = '#ff4a4a';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W/2, H * 0.35);
    ctx.shadowBlur = 0;

    ctx.font = `${Math.floor(24*scale)}px monospace`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Final Score: ${score}`, W/2, H * 0.48);

    const pulse = Math.sin(time * 3) * 0.5 + 0.5;
    ctx.font = `${Math.floor(18*scale)}px monospace`;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.fillText('Press ENTER to play again', W/2, H * 0.6);
}

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
