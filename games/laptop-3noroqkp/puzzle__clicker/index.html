<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function playClick() { playTone(440, 0.1, 'sine', 0.2); }
function playToggle() { playTone(330, 0.08, 'triangle', 0.15); }
function playComplete() {
    playTone(523, 0.3, 'sine', 0.2);
    setTimeout(() => playTone(659, 0.3, 'sine', 0.2), 100);
    setTimeout(() => playTone(784, 0.5, 'sine', 0.25), 200);
}
function playFail() { playTone(200, 0.3, 'sawtooth', 0.1); }

// Game State
const STATE = { MENU: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3 };
let gameState = STATE.MENU;
let grid = [];
let gridSize = 3;
let level = 1;
let score = 0;
let combo = 0;
let maxCombo = 0;
let clicksUsed = 0;
let optimalClicks = 0;
let lastClickTime = 0;
let particles = [];
let ripples = [];
let screenShake = 0;
let shakeX = 0, shakeY = 0;
let animatingCells = {};
let time = 0;
let dt = 0;
let lastTime = performance.now();
let bestScore = 0;

try { bestScore = parseInt(localStorage.getItem('clickPuzzleBest')) || 0; } catch(e) {}

function saveScore(s) {
    try { localStorage.setItem('clickPuzzleBest', s); } catch(e) {}
}

// Grid functions
function createGrid(size, puzzleClicks) {
    grid = Array.from({length: size}, () => Array(size).fill(0));
    gridSize = size;
    optimalClicks = 0;
    
    // Generate solvable puzzle by applying random clicks to all-off state
    for (let i = 0; i < puzzleClicks; i++) {
        let r = Math.floor(Math.random() * size);
        let c = Math.floor(Math.random() * size);
        applyToggle(r, c);
        optimalClicks++;
    }
    
    // Make sure not all off (already solved)
    if (grid.every(row => row.every(v => v === 0))) {
        grid[0][0] = 1;
        optimalClicks = 1;
    }
}

function applyToggle(r, c) {
    const dirs = [[0,0],[0,1],[0,-1],[1,0],[-1,0]];
    for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
            grid[nr][nc] ^= 1;
        }
    }
}

function isSolved() {
    return grid.every(row => row.every(v => v === 0));
}

function countOn() {
    let n = 0;
    for (let r = 0; r < gridSize; r++)
        for (let c = 0; c < gridSize; c++)
            if (grid[r][c]) n++;
    return n;
}

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            size: 2 + Math.random() * 4,
            color
        });
    }
}

function spawnRipple(x, y) {
    ripples.push({ x, y, radius: 0, maxRadius: 30, life: 1 });
}

// Level setup
function startLevel(lvl) {
    level = lvl;
    const size = Math.min(3 + Math.floor((lvl-1)/2), 7);
    const clicks = Math.min(2 + lvl, 8);
    createGrid(size, clicks);
    clicksUsed = 0;
    combo = 0;
    maxCombo = 0;
    optimalClicks = Math.max(optimalClicks, 1);
    gameState = STATE.PLAYING;
}

function getCellSize() {
    const pad = 40;
    return Math.min((W - pad*2) / gridSize, (H - 160 - pad*2) / gridSize, 80);
}

function getGridOrigin() {
    const cs = getCellSize();
    return { x: (W - cs * gridSize) / 2, y: 80 };
}

// Input
let mouseDown = false;
canvas.addEventListener('mousedown', e => {
    initAudio();
    mouseDown = true;
    handleClick(e.clientX, e.clientY);
});
canvas.addEventListener('touchstart', e => {
    initAudio();
    e.preventDefault();
    const t = e.touches[0];
    handleClick(t.clientX, t.clientY);
});

function handleClick(mx, my) {
    if (gameState === STATE.MENU) {
        startLevel(1);
        score = 0;
        playComplete();
        return;
    }
    if (gameState === STATE.LEVEL_COMPLETE) {
        startLevel(level + 1);
        return;
    }
    if (gameState === STATE.GAME_OVER) {
        gameState = STATE.MENU;
        score = 0;
        return;
    }
    if (gameState !== STATE.PLAYING) return;

    const origin = getGridOrigin();
    const cs = getCellSize();
    
    const c = Math.floor((mx - origin.x) / cs);
    const r = Math.floor((my - origin.y) / cs);
    
    if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
        // Toggle
        applyToggle(r, c);
        clicksUsed++;
        
        // Combo
        const now = performance.now();
        if (now - lastClickTime < 800) {
            combo++;
        } else {
            combo = 0;
        }
        maxCombo = Math.max(maxCombo, combo);
        lastClickTime = now;
        
        // Score
        const points = 10 * (1 + combo * 0.5);
        score += Math.floor(points);
        
        // Effects
        const cellX = origin.x + (c + 0.5) * cs;
        const cellY = origin.y + (r + 0.5) * cs;
        spawnParticles(cellX, cellY, grid[r][c] ? '#ff6b6b' : '#4ecdc4', 8);
        spawnRipple(cellX, cellY);
        
        // Animate affected cells
        const dirs = [[0,0],[0,1],[0,-1],[1,0],[-1,0]];
        for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
                animatingCells[nr * gridSize + nc] = 1;
            }
        }
        
        playToggle();
        
        // Check solved
        if (isSolved()) {
            const efficiency = Math.max(1, optimalClicks);
            const bonus = Math.floor((efficiency / Math.max(clicksUsed, 1)) * 50);
            score += bonus;
            screenShake = 8;
            playComplete();
            
            // Big particle burst
            for (let i = 0; i < 30; i++) {
                const px = origin.x + Math.random() * cs * gridSize;
                const py = origin.y + Math.random() * cs * gridSize;
                spawnParticles(px, py, ['#4ecdc4','#ffe66d','#ff6b6b','#a78bfa'][Math.floor(Math.random()*4)], 3);
            }
            
            setTimeout(() => { gameState = STATE.LEVEL_COMPLETE; }, 500);
        } else if (countOn() > gridSize * gridSize * 0.7) {
            // Too many on - hint of trouble
            playFail();
        }
    }
}

// Update
function update(dt) {
    time += dt;
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
        const r = ripples[i];
        r.radius += 3;
        r.life -= 0.05;
        if (r.life <= 0) ripples.splice(i, 1);
    }
    
    // Cell animations
    for (const key in animatingCells) {
        animatingCells[key] -= dt * 4;
        if (animatingCells[key] <= 0) delete animatingCells[key];
    }
    
    // Screen shake decay
    if (screenShake > 0) {
        screenShake *= 0.85;
        if (screenShake < 0.1) screenShake = 0;
        shakeX = (Math.random() - 0.5) * screenShake;
        shakeY = (Math.random() - 0.5) * screenShake;
    } else {
        shakeX = 0; shakeY = 0;
    }
}

// Draw
function draw() {
    ctx.save();
    ctx.translate(shakeX, shakeY);
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    
    // Subtle grid background pattern
    ctx.strokeStyle = 'rgba(78, 205, 196, 0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    
    if (gameState === STATE.MENU || gameState === STATE.GAME_OVER) {
        drawMenu();
    } else {
        drawGame();
    }
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Ripples
    for (const r of ripples) {
        ctx.globalAlpha = r.life * 0.5;
        ctx.strokeStyle = '#4ecdc4';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    
    ctx.restore();
}

function drawMenu() {
    // Title
    const pulse = 1 + Math.sin(time * 2) * 0.05;
    ctx.save();
    ctx.translate(W/2, H/3);
    ctx.scale(pulse, pulse);
    
    ctx.font = `bold ${Math.min(64, W*0.08)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText('CLICK PUZZLE', 0, 0);
    
    ctx.restore();
    
    // Subtitle
    ctx.font = `${Math.min(18, W*0.03)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a78bfa';
    ctx.fillText('Turn off ALL lights to win!', W/2, H/3 + 50);
    
    ctx.font = `${Math.min(14, W*0.025)}px monospace`;
    ctx.fillStyle = '#666';
    ctx.fillText('Click a cell to toggle it and its neighbors', W/2, H/3 + 80);
    ctx.fillText('(up, down, left, right)', W/2, H/2 - 10);
    
    if (bestScore > 0) {
        ctx.fillStyle = '#ffe66d';
        ctx.font = `${Math.min(16, W*0.025)}px monospace`;
        ctx.fillText(`Best: ${bestScore}`, W/2, H/2 + 30);
    }
    
    // Start prompt
    const blink = Math.sin(time * 3) > 0;
    if (blink) {
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(20, W*0.03)}px monospace`;
        ctx.fillText('Click to Start', W/2, H * 0.7);
    }
    
    // Instructions
    ctx.font = `${Math.min(13, W*0.02)}px monospace`;
    ctx.fillStyle = '#555';
    const instructions = [
        '• Each level: turn all cells OFF',
        '• Clicking toggles the cell + 4 neighbors',
        '• Faster clicks = combo multiplier',
        '• Fewer clicks than optimal = bonus points'
    ];
    instructions.forEach((txt, i) => {
        ctx.fillText(txt, W/2, H * 0.8 + i * 22);
    });
}

function drawGame() {
    const origin = getGridOrigin();
    const cs = getCellSize();
    
    // Level & Score HUD
    ctx.font = `bold ${Math.min(20, W*0.03)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText(`Level ${level}`, 20, 35);
    
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe66d';
    ctx.fillText(`Score: ${score}`, W - 20, 35);
    
    // Combo
    if (combo > 1) {
        ctx.textAlign = 'center';
        ctx.fillStyle = combo > 5 ? '#ff6b6b' : '#a78bfa';
        ctx.font = `bold ${Math.min(24, W*0.035)}px monospace`;
        const comboScale = 1 + Math.sin(time * 8) * 0.1;
        ctx.save();
        ctx.translate(W/2, 35);
        ctx.scale(comboScale, comboScale);
        ctx.fillText(`x${combo} COMBO`, 0, 0);
        ctx.restore();
    }
    
    // Clicks used
    ctx.textAlign = 'center';
    ctx.font = `${Math.min(14, W*0.02)}px monospace`;
    ctx.fillStyle = '#888';
    ctx.fillText(`Clicks: ${clicksUsed} / Optimal: ~${optimalClicks}`, W/2, 60);
    
    // Draw grid cells
    for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
            const x = origin.x + c * cs;
            const y = origin.y + r * cs;
            const pad = 3;
            
            // Cell animation scale
            const key = r * gridSize + c;
            let scale = 1;
            if (animatingCells[key]) {
                scale = 1 + animatingCells[key] * 0.15;
            }
            
            const cx = x + cs/2, cy = y + cs/2;
            const size = (cs - pad*2) * scale / 2;
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            ctx.translate(-cx, -cy);
            
            // Cell background
            const isOn = grid[r][c] === 1;
            
            if (isOn) {
                // Lit cell - glowing
                const glow = 0.6 + Math.sin(time * 3 + r * 0.5 + c * 0.7) * 0.15;
                ctx.fillStyle = `rgba(255, 107, 107, ${glow})`;
                drawRoundRect(x + pad, y + pad, cs - pad*2, cs - pad*2, 6);
                ctx.fill();
                
                // Inner glow
                const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, cs/2);
                grd.addColorStop(0, 'rgba(255, 180, 100, 0.3)');
                grd.addColorStop(1, 'rgba(255, 107, 107, 0)');
                ctx.fillStyle = grd;
                drawRoundRect(x + pad, y + pad, cs - pad*2, cs - pad*2, 6);
                ctx.fill();
                
                // Icon
                ctx.font = `bold ${cs * 0.4}px monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillText('●', cx, cy);
            } else {
                // Off cell
                ctx.fillStyle = 'rgba(78, 205, 196, 0.08)';
                drawRoundRect(x + pad, y + pad, cs - pad*2, cs - pad*2, 6);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(78, 205, 196, 0.2)';
                ctx.lineWidth = 1;
                drawRoundRect(x + pad, y + pad, cs - pad*2, cs - pad*2, 6);
                ctx.stroke();
            }
            
            ctx.restore();
        }
    }
    
    // Grid border
    ctx.strokeStyle = 'rgba(78, 205, 196, 0.3)';
    ctx.lineWidth = 2;
    drawRoundRect(origin.x - 4, origin.y - 4, cs * gridSize + 8, cs * gridSize + 8, 10);
    ctx.stroke();
    
    // Level complete overlay
    if (gameState === STATE.LEVEL_COMPLETE) {
        ctx.fillStyle = 'rgba(10, 10, 26, 0.7)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.textAlign = 'center';
        ctx.font = `bold ${Math.min(48, W*0.07)}px monospace`;
        ctx.fillStyle = '#4ecdc4';
        ctx.fillText('LEVEL COMPLETE!', W/2, H/3);
        
        ctx.font = `${Math.min(20, W*0.03)}px monospace`;
        ctx.fillStyle = '#ffe66d';
        ctx.fillText(`Score: ${score}`, W/2, H/3 + 50);
        ctx.fillStyle = '#a78bfa';
        ctx.fillText(`Max Combo: x${maxCombo}`, W/2, H/3 + 80);
        ctx.fillText(`Efficiency: ${Math.floor((optimalClicks / Math.max(clicksUsed,1)) * 100)}%`, W/2, H/3 + 110);
        
        const blink = Math.sin(time * 3) > 0;
        if (blink) {
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.min(18, W*0.025)}px monospace`;
            ctx.fillText('Click for Next Level', W/2, H * 0.7);
        }
    }
}

function drawRoundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// Game loop
function gameLoop(now) {
    dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// Keyboard for restart
window.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') {
        initAudio();
        score = 0;
        startLevel(1);
    }
    if (e.key === ' ' || e.key === 'Enter') {
        initAudio();
        if (gameState === STATE.MENU) {
            startLevel(1);
            score = 0;
        } else if (gameState === STATE.LEVEL_COMPLETE) {
            startLevel(level + 1);
        } else if (gameState === STATE.GAME_OVER) {
            gameState = STATE.MENU;
        }
    }
});

// Check for game over (too many clicks without solving - just a soft limit)
function checkGameOver() {
    if (gameState === STATE.PLAYING && clicksUsed > optimalClicks * 5 + 10) {
        // Soft game over - show hint
        playFail();
    }
}

setInterval(checkGameOver, 2000);
</script>
</body>
</html>
