<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pinball Gravity</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
canvas { display: block; cursor: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, SCALE;
function resize() {
    const aspect = 3/5;
    if (window.innerWidth / window.innerHeight > aspect) {
        H = window.innerHeight;
        W = H * aspect;
    } else {
        W = window.innerWidth;
        H = W / aspect;
    }
    canvas.width = W;
    canvas.height = H;
    SCALE = Math.min(W, H) / 400;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
let balls = 3;
let combo = 1;
let frameCount = 0;

try {
    highScore = parseInt(localStorage.getItem('pinballGravityHS') || '0');
} catch(e) { highScore = 0; }

// Particles
let particles = [];
let popups = [];

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 30+Math.random()*20, color, maxLife: 50 });
    }
}

function addPopup(x, y, text, color) {
    popups.push({ x, y, text, color, life: 60 });
}

// Ball
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8, active: false, launched: false };
const GRAVITY = 0.35;
const BOUNCE_DAMPING = 0.75;

// Playfield dimensions (in game units, scaled by SCALE)
function getField() {
    const fw = 280 * SCALE;
    const fh = 460 * SCALE;
    const fx = (W - fw) / 2;
    const fy = (H - fh) / 2 + 10 * SCALE;
    return { x: fx, y: fy, w: fw, h: fh };
}

// Flippers
function createFlippers() {
    const f = getField();
    const flipperY = f.y + f.h - 50 * SCALE;
    const leftFlipper = {
        pivotX: f.x + 40 * SCALE,
        pivotY: flipperY,
        length: 65 * SCALE,
        restAngle: 0.35,
        activeAngle: -0.5,
        angle: 0.35,
        angularVel: 0,
        side: 'left'
    };
    const rightFlipper = {
        pivotX: f.x + f.w - 40 * SCALE,
        pivotY: flipperY,
        length: 65 * SCALE,
        restAngle: Math.PI - 0.35,
        activeAngle: Math.PI + 0.5,
        angle: Math.PI - 0.35,
        angularVel: 0,
        side: 'right'
    };
    return [leftFlipper, rightFlipper];
}

let flippers = createFlippers();

// Bumpers
function createBumpers() {
    const f = getField();
    return [
        { x: f.x + 70 * SCALE, y: f.y + 80 * SCALE, r: 22 * SCALE, score: 50 },
        { x: f.x + f.w/2, y: f.y + 130 * SCALE, r: 22 * SCALE, score: 50 },
        { x: f.x + f.w - 70 * SCALE, y: f.y + 80 * SCALE, r: 22 * SCALE, score: 50 },
    ];
}

let bumpers = createBumpers();

// Walls (line segments)
function createWalls() {
    const f = getField();
    const walls = [
        // Left wall
        { x1: f.x, y1: f.y, x2: f.x, y2: f.y + f.h - 30*SCALE },
        // Right wall
        { x1: f.x + f.w, y1: f.y, x2: f.x + f.w, y2: f.y + f.h - 30*SCALE },
        // Top wall
        { x1: f.x, y1: f.y, x2: f.x + f.w, y2: f.y },
        // Bottom left guide
        { x1: f.x, y1: f.y + f.h - 30*SCALE, x2: f.x + 30*SCALE, y2: f.y + f.h - 5*SCALE },
        // Bottom right guide
        { x1: f.x + f.w, y1: f.y + f.h - 30*SCALE, x2: f.x + f.w - 30*SCALE, y2: f.y + f.h - 5*SCALE },
        // Middle guides
        { x1: f.x + 80*SCALE, y1: f.y + 200*SCALE, x2: f.x + 140*SCALE, y2: f.y + 250*SCALE },
        { x1: f.x + f.w - 80*SCALE, y1: f.y + 200*SCALE, x2: f.x + f.w/2 + 60*SCALE, y2: f.y + 250*SCALE },
        // Slanted top guides
        { x1: f.x, y1: f.y + 50*SCALE, x2: f.x + 40*SCALE, y2: f.y },
        { x1: f.x + f.w, y1: f.y + 50*SCALE, x2: f.x + f.w - 40*SCALE, y2: f.y },
    ];
    return walls;
}

let walls = createWalls();

// Plunger
const plunger = { x: 0, y: 0, angle: 0 };
function updatePlunger() {
    const f = getField();
    plunger.x = f.x + f.w - 15 * SCALE;
    plunger.y = f.y + f.h - 30 * SCALE;
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'start' || state === 'gameover') {
        initAudio();
        if (e.code === 'Space' || e.code === 'Enter') startGame();
    }
    if (e.code === 'KeyR' && (state === 'playing' || state === 'gameover')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Game functions
function startGame() {
    state = 'playing';
    score = 0;
    balls = 3;
    combo = 1;
    particles = [];
    popups = [];
    flippers = createFlippers();
    bumpers = createBumpers();
    walls = createWalls();
    updatePlunger();
    resetBall();
}

function resetBall() {
    const f = getField();
    ball.x = plunger.x;
    ball.y = plunger.y - 20 * SCALE;
    ball.vx = 0;
    ball.vy = 0;
    ball.active = true;
    ball.launched = false;
}

function launchBall() {
    if (ball.launched) return;
    ball.launched = true;
    ball.vy = -18 * SCALE / 400;
    ball.vx = -0.5 * SCALE / 400;
    playSound(200, 0.2, 'square', 0.2);
}

function loseBall() {
    balls--;
    combo = 1;
    if (balls <= 0) {
        state = 'gameover';
        if (score > highScore) {
            highScore = score;
            try { localStorage.setItem('pinballGravityHS', highScore.toString()); } catch(e) {}
        }
    } else {
        setTimeout(resetBall, 1000);
    }
    ball.active = false;
}

// Physics
function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    if (len2 === 0) return { dist: Math.hypot(px-x1, py-y1), cx: x1, cy: y1, nx: 0, ny: -1 };
    let t = ((px - x1)*dx + (py - y1)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx;
    const cy = y1 + t * dy;
    const dist = Math.hypot(px - cx, py - cy);
    let nx = px - cx, ny = py - cy;
    const nl = Math.hypot(nx, ny) || 1;
    return { dist, cx, cy, nx: nx/nl, ny: ny/nl };
}

function updateBall() {
    if (!ball.active || !ball.launched) return;

    // Gravity
    ball.vy += GRAVITY * SCALE / 400;

    // Move
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Damping
    ball.vx *= 0.998;
    ball.vy *= 0.998;

    const f = getField();

    // Wall collisions
    for (const w of walls) {
        const hit = distToSegment(ball.x, ball.y, w.x1, w.y1, w.x2, w.y2);
        if (hit.dist < ball.r) {
            const overlap = ball.r - hit.dist;
            ball.x += hit.nx * overlap;
            ball.y += hit.ny * overlap;
            const dot = ball.vx * hit.nx + ball.vy * hit.ny;
            if (dot < 0) {
                ball.vx -= 2 * dot * hit.nx * BOUNCE_DAMPING;
                ball.vy -= 2 * dot * hit.ny * BOUNCE_DAMPING;
                playSound(300 + Math.random()*100, 0.1, 'triangle', 0.15);
            }
        }
    }

    // Bumper collisions
    for (const b of bumpers) {
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < ball.r + b.r) {
            const nx = dx / (dist || 1);
            const ny = dy / (dist || 1);
            const overlap = ball.r + b.r - dist;
            ball.x += nx * overlap;
            ball.y += ny * overlap;
            ball.vx = nx * 8 * SCALE / 400;
            ball.vy = ny * 8 * SCALE / 400;
            score += b.score * combo;
            addParticles(ball.x, ball.y, '#ff6600', 15);
            addPopup(b.x, b.y - b.r, `+${b.score * combo}`, '#ff6600');
            playSound(400 + Math.random()*200, 0.15, 'square', 0.25);
            combo = Math.min(combo + 0.5, 5);
        }
    }

    // Flipper collisions
    for (const fl of flippers) {
        const tipX = fl.pivotX + Math.cos(fl.angle) * fl.length;
        const tipY = fl.pivotY + Math.sin(fl.angle) * fl.length;
        const hit = distToSegment(ball.x, ball.y, fl.pivotX, fl.pivotY, tipX, tipY);
        if (hit.dist < ball.r + 5 * SCALE / 400) {
            const overlap = ball.r + 5*SCALE/400 - hit.dist;
            ball.x += hit.nx * overlap;
            ball.y += hit.ny * overlap;
            
            // Add flipper impulse
            const t = ((ball.x - fl.pivotX) * (tipX - fl.pivotX) + (ball.y - fl.pivotY) * (tipY - fl.pivotY)) / (fl.length * fl.length);
            const contactSpeed = fl.angularVel * fl.length * t;
            
            ball.vx += hit.nx * 2 * Math.abs(fl.angularVel) * fl.length * 0.5 + hit.nx * 3 * SCALE/400;
            ball.vy += hit.ny * 2 * Math.abs(fl.angularVel) * fl.length * 0.5 - 8 * SCALE/400;
            
            if (Math.abs(fl.angularVel) > 0.1) {
                addParticles(ball.x, ball.y, '#00ffff', 10);
                playSound(500, 0.2, 'sawtooth', 0.3);
            }
        }
    }

    // Check if ball fell off bottom
    if (ball.y > f.y + f.h + 20 * SCALE) {
        loseBall();
    }

    // Speed cap
    const maxSpeed = 15 * SCALE / 400;
    const speed = Math.hypot(ball.vx, ball.vy);
    if (speed > maxSpeed) {
        ball.vx *= maxSpeed / speed;
        ball.vy *= maxSpeed / speed;
    }
}

function updateFlippers() {
    for (const fl of flippers) {
        let target = fl.restAngle;
        if (fl.side === 'left' && (keys['ArrowLeft'] || keys['KeyA'])) target = fl.activeAngle;
        if (fl.side === 'right' && (keys['ArrowRight'] || keys['KeyD'])) target = fl.activeAngle;

        const diff = target - fl.angle;
        const speed = 0.25 * SCALE / 400;
        if (Math.abs(diff) > 0.01) {
            fl.angularVel = Math.sign(diff) * speed;
            fl.angle += fl.angularVel;
        } else {
            fl.angularVel = 0;
            fl.angle = target;
        }
    }
}

// Rendering
function drawGlow(x, y, r, color, blur) {
    ctx.shadowBlur = blur || 15;
    ctx.shadowColor = color;
}

function draw() {
    const f = getField();
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Playfield
    ctx.fillStyle = '#111128';
    ctx.fillRect(f.x, f.y, f.w, f.h);

    // Grid lines
    ctx.strokeStyle = 'rgba(30,30,80,0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < f.w; i += 20*SCALE/400) {
        ctx.beginPath();
        ctx.moveTo(f.x + i, f.y);
        ctx.lineTo(f.x + i, f.y + f.h);
        ctx.stroke();
    }
    for (let i = 0; i < f.h; i += 20*SCALE/400) {
        ctx.beginPath();
        ctx.moveTo(f.x, f.y + i);
        ctx.lineTo(f.x + f.w, f.y + i);
        ctx.stroke();
    }

    // Walls
    ctx.strokeStyle = '#4488ff';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#4488ff';
    for (const w of walls) {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.stroke();
    }

    // Bumpers
    for (const b of bumpers) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, '#ff4400');
        grad.addColorStop(0.7, '#ff6600');
        grad.addColorStop(1, '#cc3300');
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff6600';
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fill();
        
        // Inner ring
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.6, 0, Math.PI*2);
        ctx.stroke();
    }

    // Flippers
    for (const fl of flippers) {
        const tipX = fl.pivotX + Math.cos(fl.angle) * fl.length;
        const tipY = fl.pivotY + Math.sin(fl.angle) * fl.length;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffff';
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 8 * SCALE / 400;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(fl.pivotX, fl.pivotY);
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
        
        // Pivot dot
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(fl.pivotX, fl.pivotY, 5*SCALE/400, 0, Math.PI*2);
        ctx.fill();
    }

    // Plunger
    if (ball.active && !ball.launched) {
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff00ff';
        const pLen = 20 * SCALE / 400 + Math.sin(frameCount * 0.1) * 5 * SCALE / 400;
        ctx.beginPath();
        ctx.moveTo(plunger.x, plunger.y);
        ctx.lineTo(plunger.x, plunger.y - pLen);
        ctx.stroke();
    }

    // Ball
    if (ball.active) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ffffff';
        const bGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.r);
        bGrad.addColorStop(0, '#ffffff');
        bGrad.addColorStop(0.5, '#cccccc');
        bGrad.addColorStop(1, '#888888');
        ctx.fillStyle = bGrad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
    }

    // Particles
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * SCALE/400, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Popups
    ctx.font = `bold ${16*SCALE/400}px monospace`;
    ctx.textAlign = 'center';
    for (const p of popups) {
        const alpha = p.life / 60;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.x, p.y - (60 - p.life) * 0.5);
    }
    ctx.globalAlpha = 1;

    // Score
    ctx.shadowBlur = 0;
    ctx.font = `bold ${20*SCALE/400}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`SCORE: ${score}`, f.x + 10, f.y + 25);
    ctx.font = `${14*SCALE/400}px monospace`;
    ctx.fillStyle = '#8888ff';
    ctx.fillText(`BALLS: ${balls}  COMBO: x${combo.toFixed(1)}`, f.x + 10, f.y + 45);
    
    // High score
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffaa00';
    ctx.font = `${12*SCALE/400}px monospace`;
    ctx.fillText(`HI: ${highScore}`, f.x + f.w - 10, f.y + 25);

    ctx.shadowBlur = 0;

    // Start screen
    if (state === 'start') {
        drawOverlay();
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${36*SCALE/400}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('PINBALL', W/2, H/2 - 40);
        ctx.fillStyle = '#ff6600';
        ctx.font = `bold ${28*SCALE/400}px monospace`;
        ctx.fillText('GRAVITY', W/2, H/2);
        
        ctx.fillStyle = '#aaaaaa';
        ctx.font = `${14*SCALE/400}px monospace`;
        ctx.fillText('← → / A D : Flippers', W/2, H/2 + 50);
        ctx.fillText('SPACE : Launch Ball', W/2, H/2 + 75);
        ctx.fillText('R : Restart', W/2, H/2 + 100);
        ctx.fillStyle = '#66ff66';
        ctx.font = `${16*SCALE/400}px monospace`;
        ctx.fillText('Press SPACE to Start', W/2, H/2 + 150);
    }

    // Game over
    if (state === 'gameover') {
        drawOverlay();
        ctx.fillStyle = '#ff4444';
        ctx.font = `bold ${32*SCALE/400}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H/2 - 30);
        ctx.fillStyle = '#ffffff';
        ctx.font = `${20*SCALE/400}px monospace`;
        ctx.fillText(`Final Score: ${score}`, W/2, H/2 + 10);
        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#ffaa00';
            ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 40);
        }
        ctx.fillStyle = '#66ff66';
        ctx.font = `${14*SCALE/400}px monospace`;
        ctx.fillText('Press SPACE or R to Play Again', W/2, H/2 + 80);
    }
}

function drawOverlay() {
    ctx.fillStyle = 'rgba(5,5,20,0.85)';
    ctx.fillRect(0, 0, W, H);
}

function update() {
    frameCount++;

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update popups
    for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].life--;
        if (popups[i].life <= 0) popups.splice(i, 1);
    }

    if (state === 'playing') {
        updateFlippers();
        
        if (!ball.launched && (keys['Space'])) {
            launchBall();
        }

        if (ball.active) {
            updateBall();
        }

        // Combo decay
        combo = Math.max(1, combo - 0.005);
    }
}

// Main loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

updatePlunger();
resetBall();
gameLoop();
</script>
</body>
</html>
