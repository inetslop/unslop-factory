<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Maze Runner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0f0f23; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playTone(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function playMove() { playTone(220, 0.08, 'square', 0.05); }
function playWin() {
    playTone(440, 0.15, 'sine', 0.15);
    setTimeout(() => playTone(550, 0.15, 'sine', 0.15), 100);
    setTimeout(() => playTone(660, 0.2, 'sine', 0.15), 200);
    setTimeout(() => playTone(880, 0.3, 'sine', 0.2), 300);
}

// Maze generation
const MAZE_COLS = 21;
const MAZE_ROWS = 21;
let maze = [];
let player = { x: 0, y: 0, px: 0, py: 0 };
let goal = { x: 0, y: 0 };
let gameState = 'start'; // start, playing, won
let startTime = 0;
let endTime = 0;
let bestTime = null;

try {
    const saved = localStorage.getItem('mazeRunnerBest');
    if (saved) bestTime = parseFloat(saved);
} catch(e) {}

function generateMaze() {
    maze = [];
    for (let y = 0; y < MAZE_ROWS; y++) {
        maze[y] = [];
        for (let x = 0; x < MAZE_COLS; x++) {
            maze[y][x] = { walls: [true, true, true, true], visited: false }; // top, right, bottom, left
        }
    }

    const stack = [];
    let cx = 0, cy = 0;
    maze[cy][cx].visited = true;
    stack.push({ x: cx, y: cy });

    while (stack.length > 0) {
        const neighbors = [];
        const dirs = [[0,-1],[1,0],[0,1],[-1,0]]; // top, right, bottom, left indices: 0,1,2,3
        const wallIdx = [0, 1, 2, 3];
        const opposite = [2, 3, 0, 1];

        for (let i = 0; i < 4; i++) {
            const nx = cx + dirs[i][0];
            const ny = cy + dirs[i][1];
            if (nx >= 0 && nx < MAZE_COLS && ny >= 0 && ny < MAZE_ROWS) {
                if (!maze[ny][nx].visited) {
                    neighbors.push({ x: nx, y: ny, dir: i });
                }
            }
        }

        if (neighbors.length > 0) {
            const next = neighbors[Math.floor(Math.random() * neighbors.length)];
            maze[cy][cx].walls[next.dir] = false;
            maze[next.y][next.x].walls[opposite[next.dir]] = false;
            maze[next.y][next.x].visited = true;
            stack.push({ x: cx, y: cy });
            cx = next.x;
            cy = next.y;
        } else {
            const top = stack.pop();
            cx = top.x;
            cy = top.y;
        }
    }

    // Remove some extra walls for loops (makes it less frustrating)
    for (let i = 0; i < 15; i++) {
        const rx = Math.floor(Math.random() * (MAZE_COLS - 2)) + 1;
        const ry = Math.floor(Math.random() * (MAZE_ROWS - 2)) + 1;
        if (Math.random() > 0.5) {
            maze[ry][rx].walls[1] = false;
            maze[ry][rx + 1].walls[3] = false;
        } else {
            maze[ry][rx].walls[2] = false;
            maze[ry + 1][rx].walls[0] = false;
        }
    }
}

function startGame() {
    generateMaze();
    player.x = 0;
    player.y = 0;
    player.px = 0;
    player.py = 0;
    goal.x = MAZE_COLS - 1;
    goal.y = MAZE_ROWS - 1;
    gameState = 'playing';
    startTime = performance.now();
}

// Input
const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (gameState === 'start' || gameState === 'won') {
        initAudio();
        startGame();
    } else if (gameState === 'playing') {
        handleMove(e.key);
    }
});
window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

function handleMove(key) {
    const dirMap = {
        'ArrowUp': [0, -1], 'w': [0, -1], 'W': [0, -1],
        'ArrowDown': [0, 1], 's': [0, 1], 'S': [0, 1],
        'ArrowLeft': [-1, 0], 'a': [-1, 0], 'A': [-1, 0],
        'ArrowRight': [1, 0], 'd': [1, 0], 'D': [1, 0]
    };
    const dir = dirMap[key];
    if (!dir) return;

    const nx = player.x + dir[0];
    const ny = player.y + dir[1];

    let wallIdx = 0;
    if (dir[0] === 0 && dir[1] === -1) wallIdx = 0;
    else if (dir[0] === 1 && dir[1] === 0) wallIdx = 1;
    else if (dir[0] === 0 && dir[1] === 1) wallIdx = 2;
    else if (dir[0] === -1 && dir[1] === 0) wallIdx = 3;

    if (nx >= 0 && nx < MAZE_COLS && ny >= 0 && ny < MAZE_ROWS && !maze[player.y][player.x].walls[wallIdx]) {
        player.x = nx;
        player.y = ny;
        playMove();
        if (player.x === goal.x && player.y === goal.y) {
            gameState = 'won';
            endTime = performance.now();
            const elapsed = (endTime - startTime) / 1000;
            playWin();
            try {
                if (!bestTime || elapsed < bestTime) {
                    bestTime = elapsed;
                    localStorage.setItem('mazeRunnerBest', bestTime.toString());
                }
            } catch(e) {}
        }
    }
}

// Rendering
const CELL_SIZE = 48;
const WALL_THICKNESS = 4;

function lerp(a, b, t) { return a + (b - a) * t; }

let lastTime = performance.now();
let playerLerpX = 0, playerLerpY = 0;

function update(dt) {
    if (gameState === 'playing' || gameState === 'won') {
        const speed = 8;
        playerLerpX = lerp(playerLerpX, player.x * CELL_SIZE, Math.min(speed * dt, 1));
        playerLerpY = lerp(playerLerpY, player.y * CELL_SIZE, Math.min(speed * dt, 1));
    }
}

function draw() {
    ctx.fillStyle = '#0f0f23';
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    const camX = playerLerpX + CELL_SIZE / 2 - W / 2;
    const camY = playerLerpY + CELL_SIZE / 2 - H / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    // Determine visible range
    const startX = Math.max(0, Math.floor(camX / CELL_SIZE) - 1);
    const startY = Math.max(0, Math.floor(camY / CELL_SIZE) - 1);
    const endX = Math.min(MAZE_COLS, Math.ceil((camX + W) / CELL_SIZE) + 1);
    const endY = Math.min(MAZE_ROWS, Math.ceil((camY + H) / CELL_SIZE) + 1);

    // Draw floor
    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            if (x >= 0 && x < MAZE_COLS && y >= 0 && y < MAZE_ROWS) {
                ctx.fillStyle = '#1a1a3e';
                ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                // Subtle grid
                ctx.strokeStyle = '#252550';
                ctx.lineWidth = 1;
                ctx.strokeRect(x * CELL_SIZE + 0.5, y * CELL_SIZE + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);
            }
        }
    }

    // Draw goal
    const pulse = Math.sin(performance.now() / 300) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 215, 0, ${pulse})`;
    ctx.beginPath();
    ctx.arc(goal.x * CELL_SIZE + CELL_SIZE / 2, goal.y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE * 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Goal glow
    ctx.fillStyle = `rgba(255, 215, 0, ${pulse * 0.3})`;
    ctx.beginPath();
    ctx.arc(goal.x * CELL_SIZE + CELL_SIZE / 2, goal.y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Draw walls
    ctx.strokeStyle = '#6c63ff';
    ctx.lineWidth = WALL_THICKNESS;
    ctx.lineCap = 'round';

    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            if (x < 0 || x >= MAZE_COLS || y < 0 || y >= MAZE_ROWS) continue;
            const px = x * CELL_SIZE;
            const py = y * CELL_SIZE;
            const walls = maze[y][x].walls;

            // Top wall
            if (walls[0]) {
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px + CELL_SIZE, py);
                ctx.stroke();
            }
            // Left wall
            if (walls[3]) {
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px, py + CELL_SIZE);
                ctx.stroke();
            }
            // Right wall (only draw if right neighbor exists)
            if (walls[1] && x < MAZE_COLS - 1) {
                ctx.beginPath();
                ctx.moveTo(px + CELL_SIZE, py);
                ctx.lineTo(px + CELL_SIZE, py + CELL_SIZE);
                ctx.stroke();
            }
            // Bottom wall (only draw if bottom neighbor exists)
            if (walls[2] && y < MAZE_ROWS - 1) {
                ctx.beginPath();
                ctx.moveTo(px, py + CELL_SIZE);
                ctx.lineTo(px + CELL_SIZE, py + CELL_SIZE);
                ctx.stroke();
            }
        }
    }

    // Draw player
    const ppx = playerLerpX + CELL_SIZE / 2;
    const ppy = playerLerpY + CELL_SIZE / 2;

    // Player glow
    ctx.fillStyle = 'rgba(0, 255, 200, 0.15)';
    ctx.beginPath();
    ctx.arc(ppx, ppy, CELL_SIZE * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Player body
    const playerPulse = Math.sin(performance.now() / 200) * 2;
    ctx.fillStyle = '#00ffc8';
    ctx.beginPath();
    ctx.arc(ppx, ppy, CELL_SIZE * 0.3 + playerPulse * 0.5, 0, Math.PI * 2);
    ctx.fill();

    // Player inner
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ppx, ppy, CELL_SIZE * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // HUD
    drawHUD();

    // Minimap
    drawMinimap();

    if (gameState === 'won') {
        drawWinScreen();
    }
}

function drawStartScreen() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#6c63ff';
    ctx.font = `bold ${Math.min(W * 0.08, 64)}px monospace`;
    ctx.fillText('MAZE RUNNER', W / 2, H * 0.3);

    ctx.fillStyle = '#aaaadd';
    ctx.font = `${Math.min(W * 0.03, 24)}px monospace`;
    ctx.fillText('Find your way to the golden goal!', W / 2, H * 0.45);
    ctx.fillText('', W / 2, H * 0.5);

    ctx.fillStyle = '#8888cc';
    ctx.font = `${Math.min(W * 0.025, 20)}px monospace`;
    ctx.fillText('Arrow Keys / WASD to move', W / 2, H * 0.58);

    if (bestTime) {
        ctx.fillStyle = '#ffdb4d';
        ctx.font = `${Math.min(W * 0.025, 20)}px monospace`;
        ctx.fillText(`Best Time: ${bestTime.toFixed(2)}s`, W / 2, H * 0.68);
    }

    const blink = Math.sin(performance.now() / 400) > 0;
    if (blink) {
        ctx.fillStyle = '#ffffff';
        ctx.font = `${Math.min(W * 0.03, 26)}px monospace`;
        ctx.fillText('Press any key to start', W / 2, H * 0.8);
    }

    // Decorative maze preview
    const prevSize = Math.min(W * 0.15, 120);
    const prevX = W / 2 - prevSize / 2;
    const prevY = H * 0.85;
    ctx.strokeStyle = '#3d3d6b';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 5; j++) {
            const cx2 = prevX + i * (prevSize / 5);
            const cy2 = prevY + j * (prevSize / 5);
            ctx.strokeRect(cx2, cy2, prevSize / 5, prevSize / 5);
        }
    }
}

function drawHUD() {
    if (gameState === 'playing') {
        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#aaaadd';
        ctx.font = '16px monospace';
        ctx.fillText(`Time: ${elapsed}s`, 15, 30);

        if (bestTime) {
            ctx.fillStyle = '#ffdb4d';
            ctx.fillText(`Best: ${bestTime.toFixed(2)}s`, 15, 52);
        }
    }
}

function drawMinimap() {
    const mmSize = Math.min(W * 0.12, 100);
    const mmX = W - mmSize - 15;
    const mmY = 15;
    const cellW = mmSize / MAZE_COLS;
    const cellH = mmSize / MAZE_ROWS;

    ctx.fillStyle = 'rgba(15, 15, 35, 0.8)';
    ctx.fillRect(mmX - 3, mmY - 3, mmSize + 6, mmSize + 6);
    ctx.strokeStyle = '#4a4a7a';
    ctx.lineWidth = 1;
    ctx.strokeRect(mmX - 3, mmY - 3, mmSize + 6, mmSize + 6);

    // Walls on minimap
    ctx.strokeStyle = 'rgba(108, 99, 255, 0.5)';
    ctx.lineWidth = 0.5;
    for (let y = 0; y < MAZE_ROWS; y++) {
        for (let x = 0; x < MAZE_COLS; x++) {
            const wx = mmX + x * cellW;
            const wy = mmY + y * cellH;
            const walls = maze[y][x].walls;
            if (walls[0]) {
                ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + cellW, wy); ctx.stroke();
            }
            if (walls[3]) {
                ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx, wy + cellH); ctx.stroke();
            }
        }
    }

    // Player on minimap
    ctx.fillStyle = '#00ffc8';
    ctx.beginPath();
    ctx.arc(mmX + (player.x + 0.5) * cellW, mmY + (player.y + 0.5) * cellH, 3, 0, Math.PI * 2);
    ctx.fill();

    // Goal on minimap
    ctx.fillStyle = '#ffdb4d';
    ctx.beginPath();
    ctx.arc(mmX + (goal.x + 0.5) * cellW, mmY + (goal.y + 0.5) * cellH, 3, 0, Math.PI * 2);
    ctx.fill();
}

function drawWinScreen() {
    const elapsed = ((endTime - startTime) / 1000).toFixed(2);
    ctx.fillStyle = 'rgba(15, 15, 35, 0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffdb4d';
    ctx.font = `bold ${Math.min(W * 0.06, 48)}px monospace`;
    ctx.fillText('MAZE COMPLETE!', W / 2, H * 0.35);

    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.min(W * 0.035, 28)}px monospace`;
    ctx.fillText(`Time: ${elapsed}s`, W / 2, H * 0.48);

    if (bestTime && Math.abs(elapsed - bestTime) < 0.01) {
        ctx.fillStyle = '#ffdb4d';
        ctx.font = `${Math.min(W * 0.03, 22)}px monospace`;
        ctx.fillText('New Best Time!', W / 2, H * 0.56);
    }

    const blink = Math.sin(performance.now() / 400) > 0;
    if (blink) {
        ctx.fillStyle = '#aaaadd';
        ctx.font = `${Math.min(W * 0.03, 22)}px monospace`;
        ctx.fillText('Press any key to play again', W / 2, H * 0.7);
    }
}

// Game loop
let lastFrame = performance.now();
function gameLoop(now) {
    const dt = Math.min((now - lastFrame) / 1000, 0.05);
    lastFrame = now;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

playerLerpX = 0;
playerLerpY = 0;
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
