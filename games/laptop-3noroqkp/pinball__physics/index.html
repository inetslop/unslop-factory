<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pinball</title>
<style>
* { margin: 0; padding: 0; }
body { background: #0a0a1a; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, scale, offsetX, offsetY;
const TW = 400, TH = 650; // table logical size

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    scale = Math.min(W / TW, H / TH);
    offsetX = (W - TW * scale) / 2;
    offsetY = (H - TH * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let ballsLeft = 3;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('pinball_high') || '0'); } catch(e) {}

// Ball
const BALL_R = 8;
let ball = { x: 0, y: 0, vx: 0, vy: 0 };
let ballActive = false;
let launching = false;
let launchPower = 0;

// Flippers
let leftFlipper = {
    pivotX: 120, pivotY: 610, length: 80,
    angle: 0.5, targetAngle: 0.5, restAngle: 0.5, activeAngle: -0.4, angularVel: 0
};
let rightFlipper = {
    pivotX: 280, pivotY: 610, length: 80,
    angle: -0.5, targetAngle: -0.5, restAngle: -0.5, activeAngle: 0.4, angularVel: 0
};

let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    }
    if (gameState === 'gameover' && (e.code === 'KeyR' || e.code === 'Enter')) {
        startGame();
    }
    if (gameState === 'playing' && e.code === 'Space') {
        launching = true;
    }
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space' && gameState === 'playing') {
        launchBall();
    }
});

// Walls (line segments in logical coords)
let walls = [];
function buildWalls() {
    walls = [
        // Top arc approximated with segments
        {x1: 20, y1: 40, x2: 80, y2: 10},
        {x1: 80, y1: 10, x2: 160, y2: 5},
        {x1: 160, y1: 5, x2: 240, y2: 5},
        {x1: 240, y1: 5, x2: 320, y2: 10},
        {x1: 320, y1: 10, x2: 380, y2: 40},
        // Left wall
        {x1: 20, y1: 40, x2: 20, y2: 580},
        // Bottom left angle to flipper
        {x1: 20, y1: 580, x2: 70, y2: 630},
        // Left flipper rest support
        {x1: 70, y1: 630, x2: 90, y2: 640},
        // Right side (launch track inner wall)
        {x1: 380, y1: 40, x2: 380, y2: 580},
        // Bottom right angle to flipper
        {x1: 380, y1: 580, x2: 330, y2: 630},
        // Right flipper rest support
        {x1: 310, y1: 640, x2: 330, y2: 630},
        // Gap between flippers (center bottom)
        {x1: 90, y1: 640, x2: 115, y2: 650},
        {x1: 285, y1: 650, x2: 310, y2: 640},
        // Deflector walls (angled)
        {x1: 60, y1: 200, x2: 130, y2: 260},
        {x1: 340, y1: 200, x2: 270, y2: 260},
        // Middle kickers
        {x1: 100, y1: 450, x2: 160, y2: 430},
        {x1: 240, y1: 430, x2: 300, y2: 450},
        // Bottom center deflector
        {x1: 170, y1: 640, x2: 230, y2: 640},
    ];
}

// Bumpers (circles)
let bumpers = [
    {x: 150, y: 340, r: 25},
    {x: 250, y: 340, r: 25},
    {x: 200, y: 400, r: 25},
];

function startGame() {
    gameState = 'playing';
    score = 0;
    ballsLeft = 3;
    resetBall();
}

function resetBall() {
    ball.x = 370;
    ball.y = 580;
    ball.vx = 0;
    ball.vy = 0;
    ballActive = false;
    launchPower = 0;
}

function launchBall() {
    launching = false;
    if (!ballActive) {
        ball.vy = -Math.max(8, launchPower * 0.15);
        ball.vx = -1;
        ballActive = true;
        playSound(200, 0.1, 'square', 0.2);
    }
}

function loseBall() {
    ballsLeft--;
    playSound(100, 0.5, 'sawtooth', 0.3);
    if (ballsLeft <= 0) {
        gameState = 'gameover';
        try { localStorage.setItem('pinball_high', String(highScore)); } catch(e) {}
    } else {
        resetBall();
    }
}

function addScore(pts) {
    score += pts;
    if (score > highScore) highScore = score;
}

// Physics
const GRAVITY = 0.35;
const DAMPING = 0.99;
const BOUNCE = 0.7;

function update() {
    if (gameState !== 'playing') return;

    // Flippers
    let leftPressed = keys['ArrowLeft'] || keys['KeyA'];
    let rightPressed = keys['ArrowRight'] || keys['KeyD'];

    if (leftPressed) {
        leftFlipper.angle += (leftFlipper.activeAngle - leftFlipper.angle) * 0.4;
        leftFlipper.angularVel = (leftFlipper.activeAngle - leftFlipper.angle) * 0.4;
    } else {
        let diff = leftFlipper.restAngle - leftFlipper.angle;
        leftFlipper.angle += diff * 0.25;
        leftFlipper.angularVel = diff * 0.25;
    }

    if (rightPressed) {
        rightFlipper.angle += (rightFlipper.activeAngle - rightFlipper.angle) * 0.4;
        rightFlipper.angularVel = (rightFlipper.activeAngle - rightFlipper.angle) * 0.4;
    } else {
        let diff = rightFlipper.restAngle - rightFlipper.angle;
        rightFlipper.angle += diff * 0.25;
        rightFlipper.angularVel = diff * 0.25;
    }

    if (!ballActive) {
        if (launching) launchPower = Math.min(launchPower + 2, 100);
        return;
    }

    // Gravity
    ball.vy += GRAVITY;
    ball.vx *= DAMPING;
    ball.vy *= DAMPING;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall collisions
    for (let w of walls) {
        collideWall(w);
    }

    // Bumper collisions
    for (let b of bumpers) {
        let dx = ball.x - b.x;
        let dy = ball.y - b.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        let minDist = BALL_R + b.r;
        if (dist < minDist) {
            let nx = dx / dist, ny = dy / dist;
            ball.x = b.x + nx * (minDist + 1);
            ball.y = b.y + ny * (minDist + 1);
            let dot = ball.vx * nx + ball.vy * ny;
            if (dot < 0) {
                ball.vx -= 2 * dot * nx;
                ball.vy -= 2 * dot * ny;
                ball.vx *= BOUNCE;
                ball.vy *= BOUNCE;
                // Extra bump force
                ball.vx += nx * 3;
                ball.vy += ny * 3;
                addScore(50);
                playSound(400, 0.15, 'square', 0.25);
            }
        }
    }

    // Flipper collisions
    collideFlipper(leftFlipper);
    collideFlipper(rightFlipper);

    // Side walls (hard bounds)
    if (ball.x < BALL_R + 10) { ball.x = BALL_R + 10; ball.vx = Math.abs(ball.vx) * BOUNCE; }
    if (ball.x > TW - BALL_R - 10) { ball.x = TW - BALL_R - 10; ball.vx = -Math.abs(ball.vx) * BOUNCE; }
    if (ball.y < BALL_R + 5) { ball.y = BALL_R + 5; ball.vy = Math.abs(ball.vy) * BOUNCE; }

    // Ball lost
    if (ball.y > TH + 20) {
        loseBall();
    }
}

function collideWall(w) {
    let dx = w.x2 - w.x1, dy = w.y2 - w.y1;
    let len2 = dx * dx + dy * dy;
    if (len2 === 0) return;
    let t = Math.max(0, Math.min(1, ((ball.x - w.x1) * dx + (ball.y - w.y1) * dy) / len2));
    let cx = w.x1 + t * dx, cy = w.y1 + t * dy;
    let ex = ball.x - cx, ey = ball.y - cy;
    let dist = Math.sqrt(ex * ex + ey * ey);
    if (dist < BALL_R) {
        let nx = ex / (dist || 1), ny = ey / (dist || 1);
        ball.x = cx + nx * (BALL_R + 0.5);
        ball.y = cy + ny * (BALL_R + 0.5);
        let dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            ball.vx *= BOUNCE;
            ball.vy *= BOUNCE;
            playSound(300, 0.08, 'sine', 0.15);
        }
    }
}

function collideFlipper(f) {
    let tipX = f.pivotX + Math.cos(f.angle) * f.length;
    let tipY = f.pivotY + Math.sin(f.angle) * f.length;
    let dx = tipX - f.pivotX, dy = tipY - f.pivotY;
    let len2 = dx * dx + dy * dy;
    if (len2 === 0) return;
    let t = Math.max(0, Math.min(1, ((ball.x - f.pivotX) * dx + (ball.y - f.pivotY) * dy) / len2));
    let cx = f.pivotX + t * dx, cy = f.pivotY + t * dy;
    let ex = ball.x - cx, ey = ball.y - cy;
    let dist = Math.sqrt(ex * ex + ey * ey);
    let effectiveR = BALL_R + 5; // flipper thickness
    if (dist < effectiveR) {
        let nx = ex / (dist || 1), ny = ey / (dist || 1);
        ball.x = cx + nx * (effectiveR + 0.5);
        ball.y = cy + ny * (effectiveR + 0.5);
        let dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            ball.vx *= BOUNCE;
            ball.vy *= BOUNCE;
            // Add flipper velocity contribution
            let contactDist = t * f.length;
            let kickPower = f.angularVel * contactDist * 0.8;
            ball.vy -= kickPower * nx;
            ball.vx += kickPower * ny;
            playSound(500, 0.1, 'square', 0.2);
        }
    }
}

// Rendering
function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    // Table background
    ctx.fillStyle = '#12122a';
    ctx.fillRect(0, 0, TW, TH);

    // Glow effect for walls
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 8;
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    for (let w of walls) {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.stroke();
    }

    // Bumpers
    for (let b of bumpers) {
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#ff2222';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffaaaa';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Inner circle
        ctx.fillStyle = '#ff6666';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // Flippers
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 10;
    ctx.strokeStyle = '#ffdd44';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';

    let lTipX = leftFlipper.pivotX + Math.cos(leftFlipper.angle) * leftFlipper.length;
    let lTipY = leftFlipper.pivotY + Math.sin(leftFlipper.angle) * leftFlipper.length;
    ctx.beginPath();
    ctx.moveTo(leftFlipper.pivotX, leftFlipper.pivotY);
    ctx.lineTo(lTipX, lTipY);
    ctx.stroke();

    let rTipX = rightFlipper.pivotX + Math.cos(rightFlipper.angle) * rightFlipper.length;
    let rTipY = rightFlipper.pivotY + Math.sin(rightFlipper.angle) * rightFlipper.length;
    ctx.beginPath();
    ctx.moveTo(rightFlipper.pivotX, rightFlipper.pivotY);
    ctx.lineTo(rTipX, rTipY);
    ctx.stroke();

    // Pivot dots
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(leftFlipper.pivotX, leftFlipper.pivotY, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(rightFlipper.pivotX, rightFlipper.pivotY, 5, 0, Math.PI * 2);
    ctx.fill();

    // Ball
    if (ballActive || !ballActive) {
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fill();
        // Ball highlight
        ctx.fillStyle = '#ccccff';
        ctx.beginPath();
        ctx.arc(ball.x - 2, ball.y - 2, BALL_R * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Launch power bar
    if (!ballActive && launching) {
        let barH = launchPower * 1.5;
        ctx.shadowColor = '#ff8800';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ff8800';
        ctx.fillRect(360, 620 - barH, 12, barH);
        ctx.strokeStyle = '#ffaa44';
        ctx.lineWidth = 1;
        ctx.strokeRect(360, 620 - 150, 12, 150);
    }

    // Score
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE: ' + score, 30, 75);
    ctx.font = '14px monospace';
    ctx.fillText('BALLS: ' + ballsLeft, 30, 95);
    ctx.fillStyle = '#88ff88';
    ctx.font = '12px monospace';
    ctx.fillText('HIGH: ' + highScore, 30, 115);

    // Launch hint
    if (!ballActive) {
        ctx.fillStyle = '#ffaa44';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('HOLD SPACE TO LAUNCH', TW / 2, TH - 20);
    }

    ctx.restore();

    // Start screen
    if (gameState === 'start') {
        drawStartScreen();
    }
    if (gameState === 'gameover') {
        drawGameOver();
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(5, 5, 20, 0.85)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('PINBALL', W / 2, H / 2 - 60);

    ctx.shadowBlur = 5;
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    let lines = [
        'LEFT ARROW / A  -  Left Flipper',
        'RIGHT ARROW / D  -  Right Flipper',
        'SPACE (hold)  -  Launch Ball',
        '',
        'Press SPACE or ENTER to Start'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H / 2 + i * 30);
    });

    ctx.fillStyle = '#88ff88';
    ctx.font = '14px monospace';
    ctx.fillText('HIGH SCORE: ' + highScore, W / 2, H / 2 + 170);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(5, 5, 20, 0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 36px monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);

    ctx.shadowBlur = 5;
    ctx.fillStyle = '#ffffff';
    ctx.font = '18px monospace';
    ctx.fillText('Final Score: ' + score, W / 2, H / 2 + 20);
    ctx.fillStyle = '#88ff88';
    ctx.fillText('High Score: ' + highScore, W / 2, H / 2 + 50);

    ctx.fillStyle = '#ffff88';
    ctx.font = '14px monospace';
    ctx.fillText('Press R or ENTER to Play Again', W / 2, H / 2 + 100);
}

// Game loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

buildWalls();
resetBall();
loop();
</script>
</body>
</html>
