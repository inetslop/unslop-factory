<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Gems - Match-3 Stealth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
canvas { display: block; }
#ui-overlay {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, SCALE;
function resize() {
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;
SCALE = Math.min(W, H) / 600;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playTone(freq, dur, vol, type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type || 'sine';
osc.frequency.value = freq;
gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + dur);
}
function sfxMatch() { playTone(440, 0.15, 0.12, 'sine'); playTone(660, 0.1, 0.08, 'triangle'); }
function sfxSwap() { playTone(330, 0.08, 0.06, 'sine'); }
function sfxAlert() { playTone(200, 0.3, 0.15, 'sawtooth'); }
function sfxCaught() { playTone(150, 0.5, 0.2, 'sawtooth'); playTone(100, 0.7, 0.15, 'square'); }
function sfxCollect() { playTone(880, 0.1, 0.1); playTone(1100, 0.15, 0.08, 'triangle'); }
function sfxWin() { playTone(523, 0.15, 0.1); playTone(659, 0.15, 0.1); playTone(784, 0.2, 0.12); }

// Game constants
const GRID = 8;
const COLORS = ['#ff4466', '#44aaff', '#44ff88', '#ffcc33', '#cc66ff'];
const COLOR_NAMES = ['red', 'blue', 'green', 'gold', 'violet'];
const STAR_CHANCE = 0.12;

let gameState = 'start'; // start, playing, caught, levelComplete, gameOver
let grid = [];
let selected = null;
let swapping = false;
let guards = [];
let noisePulses = [];
let alertness = 0;
let alertDecayTimer = 0;
let score = 0;
let level = 1;
let starsCollected = 0;
let starsNeeded = 5;
let particles = [];
let shakeTime = 0;
let shakeIntensity = 0;
let guardSpeeds = [40, -35];
let caughtTimer = 0;
let winTimer = 0;
let lastTime = 0;

function cellSize() { return Math.min(W, H) * 0.85 / GRID; }
function gridOffset() { return ((W - cellSize() * GRID) / 2); }

function initLevel(lv) {
grid = [];
for (let r = 0; r < GRID; r++) {
grid[r] = [];
for (let c = 0; c < GRID; c++) {
let col = Math.floor(Math.random() * COLORS.length);
let star = Math.random() < STAR_CHANCE;
grid[r][c] = { color: col, star: star, falling: false, vy: 0, yOff: 0, alpha: 1 };
}
}
// Remove initial matches
for (let r = 0; r < GRID; r++) {
for (let c = 0; c < GRID; c++) {
if (c >= 2 && grid[r][c].color === grid[r][c-1].color && grid[r][c].color === grid[r][c-2].color) {
grid[r][c].color = (grid[r][c].color + 1) % COLORS.length;
}
if (r >= 2 && grid[r][c].color === grid[r-1][c].color && grid[r][c].color === grid[r-2][c].color) {
grid[r][c].color = (grid[r][c].color + 1) % COLORS.length;
}
}
}

// Initialize guards based on level
guards = [];
let numGuards = Math.min(2 + Math.floor(lv / 2), 5);
for (let i = 0; i < numGuards; i++) {
let path = generatePath(i, numGuands);
guards.push({ x: path[0].x, y: path[0].y, path: path, pathIdx: 0, pathDir: 1, speed: (1.5 + lv * 0.3) * (i % 2 === 0 ? 1 : -1), visible: true });
}

noisePulses = [];
alertness = 0;
alertDecayTimer = 0;
starsCollected = 0;
starsNeeded = Math.min(5 + lv, 10);
particles = [];
selected = null;
}

function generatePath(idx, total) {
let path = [];
let side = idx % 4; // top, right, bottom, left
let segLen = GRID;
if (side === 0) { for (let i = 0; i < segLen; i++) path.push({ x: i, y: 0 }); }
else if (side === 1) { for (let i = 0; i < segLen; i++) path.push({ x: GRID-1, y: i }); }
else if (side === 2) { for (let i = 0; i < segLen; i++) path.push({ x: segLen - 1 - i, y: GRID-1 }); }
else { for (let i = 0; i < segLen; i++) path.push({ x: 0, y: GRID-1 - i }); }
// Add a second segment going inward
if (side <= 1) { for (let i = 1; i < Math.floor(segLen/2); i++) path.push({ x: side === 0 ? i : GRID-1, y: side === 0 ? 0 : i }); }
else { for (let i = 1; i < Math.floor(segLen/2); i++) path.push({ x: side === 2 ? segLen - 1 - i : 0, y: side === 2 ? GRID-1 : i }); }
return path;
}

function findMatches() {
let matches = [];
// Horizontal
for (let r = 0; r < GRID; r++) {
for (let c = 0; c < GRID - 2; c++) {
if (grid[r][c].color === grid[r][c+1].color && grid[r][c].color === grid[r][c+2].color) {
let m = [[r,c],[r,c+1],[r,c+2]];
let extra = 0;
while (c + 3 + extra < GRID && grid[r][c+3+extra].color === grid[r][c].color) { m.push([r, c+3+extra]); extra++; }
matches.push(m);
c += 2 + extra;
}
}
}
// Vertical
for (let c = 0; c < GRID; c++) {
for (let r = 0; r < GRID - 2; r++) {
if (grid[r][c].color === grid[r+1][c].color && grid[r][c].color === grid[r+2][c].color) {
let m = [[r,c],[r+1,c],[r+2,c]];
let extra = 0;
while (r + 3 + extra < GRID && grid[r+3+extra][c].color === grid[r][c].color) { m.push([r+3+extra, c]); extra++; }
matches.push(m);
r += 2 + extra;
}
}
}
return matches;
}

function processMatches() {
let matches = findMatches();
if (matches.length === 0) return false;

for (let match of matches) {
let hasStar = false;
for (let [r, c] of match) {
if (grid[r][c].star && grid[r][c].alpha > 0.5) { hasStar = true; starsCollected++; }
}
let pts = match.length * 10;
if (hasStar) pts += 50;
score += pts;

// Spawn particles
let cr = cellSize(); let ox = gridOffset();
for (let [r, c] of match) {
let px = ox + c * cr + cr/2;
let py = ox + r * cr + cr/2;
for (let i = 0; i < 5; i++) {
particles.push({ x: px, y: py, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3 - 1, life: 1, color: COLORS[grid[r][c].color], size: cr * 0.15 });
}
grid[r][c].alpha = 0;
}

// Noise pulse from match center
let avgR = 0, avgC = 0;
for (let [r, c] of match) { avgR += r; avgC += c; }
avgR /= match.length; avgC /= match.length;
noisePulses.push({ x: avgC, y: avgR, radius: 0, maxRadius: 2.5 + level * 0.3 });

sfxMatch();
if (hasStar) sfxCollect();
}

// Remove matched gems and apply gravity
for (let r = GRID-1; r >= 0; r--) {
for (let c = 0; c < GRID; c++) {
if (grid[r][c].alpha <= 0) grid[r][c] = null;
}
}
applyGravity();
return true;
}

function applyGravity() {
for (let c = 0; c < GRID; c++) {
let writeRow = GRID - 1;
for (let r = GRID - 1; r >= 0; r--) {
if (grid[r][c]) {
if (writeRow !== r) {
grid[writeRow][c] = grid[r][c];
grid[r][c] = null;
}
writeRow--;
}
}
// Fill top
for (let r = writeRow; r >= 0; r--) {
grid[r][c] = { color: Math.floor(Math.random() * COLORS.length), star: Math.random() < STAR_CHANCE, falling: true, vy: 0, yOff: -(writeRow - r + 1) * cellSize(), alpha: 1 };
}
}
}

function updateGuards(dt) {
for (let g of guards) {
let nextIdx = g.pathIdx + g.speed * dt;
if (nextIdx >= g.path.length || nextIdx < 0) {
g.speed = -g.speed;
nextIdx = Math.max(0, Math.min(g.path.length - 1, nextIdx));
}
g.pathIdx = nextIdx;
let p0 = g.path[Math.floor(nextIdx)] || g.path[0];
let p1 = g.path[Math.ceil(nextIdx)] || g.path[g.path.length-1];
let t = nextIdx - Math.floor(nextIdx);
g.x = p0.x + (p1.x - p0.x) * t;
g.y = p0.y + (p1.y - p0.y) * t;
}
}

function checkNoise() {
for (let pulse of noisePulses) {
pulse.radius += 2.5 * (1/60);
if (pulse.radius >= pulse.maxRadius) continue;
for (let g of guards) {
let dx = g.x - pulse.x;
let dy = g.y - pulse.y;
let dist = Math.sqrt(dx*dx + dy*dy);
if (dist <= pulse.radius && !pulse.hitGuard[g._id || 0]) {
if (!pulse.hits) pulse.hits = {};
let gid = guards.indexOf(g);
if (!pulse.hits[gid]) {
pulse.hits[gid] = true;
alertness = Math.min(3, alertness + 1);
sfxAlert();
shakeTime = 0.3;
shakeIntensity = 5;
}
}
}
}
noisePulses = noisePulses.filter(p => p.radius < p.maxRadius);
}

function updateParticles(dt) {
for (let p of particles) {
p.x += p.vx;
p.y += p.vy;
p.vy += 0.1;
p.life -= dt * 2;
}
particles = particles.filter(p => p.life > 0);
}

function drawGem(x, y, size, colorIdx, alpha, isStar, selected) {
let s = size * 0.75;
let cx = x + size/2;
let cy = y + size/2;
ctx.save();
ctx.globalAlpha = alpha;

if (selected) {
ctx.shadowColor = '#fff';
ctx.shadowBlur = 10;
}

ctx.fillStyle = COLORS[colorIdx];
ctx.beginPath();
// Diamond shape
ctx.moveTo(cx, cy - s/2);
ctx.lineTo(cx + s/2, cy);
ctx.lineTo(cx, cy + s/2);
ctx.lineTo(cx - s/2, cy);
ctx.closePath();
ctx.fill();

// Inner highlight
ctx.fillStyle = 'rgba(255,255,255,0.3)';
ctx.beginPath();
ctx.moveTo(cx, cy - s/4);
ctx.lineTo(cx + s/4, cy);
ctx.lineTo(cx, cy + s/4);
ctx.lineTo(cx - s/4, cy);
ctx.closePath();
ctx.fill();

// Star indicator
if (isStar) {
ctx.fillStyle = '#fff';
ctx.font = `${s * 0.5}px monospace`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('✦', cx, cy);
}

ctx.restore();
}

function drawGuard(g) {
let cr = cellSize();
let ox = gridOffset();
let gx = ox + g.x * cr + cr/2;
let gy = ox + g.y * cr + cr/2;

// Guard body
ctx.fillStyle = '#ff3333';
ctx.beginPath();
ctx.arc(gx, gy, cr * 0.3, 0, Math.PI * 2);
ctx.fill();

// Eye (direction)
let angle = 0;
if (g.pathIdx + g.speed > g.pathIdx) {
let p0 = g.path[Math.floor(g.pathIdx)];
let p1 = g.path[Math.ceil(g.pathIdx)] || p0;
angle = Math.atan2(p1.y - p0.y, p1.x - p0.x);
}

ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(gx + Math.cos(angle) * cr * 0.15, gy + Math.sin(angle) * cr * 0.15, cr * 0.08, 0, Math.PI * 2);
ctx.fill();

// Vision cone (subtle)
ctx.save();
ctx.globalAlpha = 0.1;
ctx.fillStyle = '#ff3333';
ctx.beginPath();
ctx.moveTo(gx, gy);
let coneLen = cr * 1.5;
let spread = 0.6;
ctx.arc(gx, gy, coneLen, angle - spread, angle + spread);
ctx.closePath();
ctx.fill();
ctx.restore();
}

function drawNoisePulse(pulse) {
let cr = cellSize();
let ox = gridOffset();
let px = ox + pulse.x * cr + cr/2;
let py = ox + pulse.y * cr + cr/2;
let r = pulse.radius * cr;
ctx.save();
ctx.globalAlpha = 0.3 * (1 - pulse.radius / pulse.maxRadius);
ctx.strokeStyle = '#ffcc33';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(px, py, r, 0, Math.PI * 2);
ctx.stroke();
ctx.restore();
}

function drawHUD() {
let fontSize = Math.max(14, 16 * SCALE);
ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
ctx.textAlign = 'left';
ctx.fillStyle = '#fff';

// Score
ctx.fillText(`SCORE: ${score}`, gridOffset(), gridOffset() - 30);

// Level
ctx.fillText(`LEVEL: ${level}`, gridOffset(), gridOffset() - 55);

// Stars collected
let starX = W/2;
ctx.textAlign = 'center';
ctx.fillStyle = starsCollected >= starsNeeded ? '#44ff88' : '#ffcc33';
ctx.fillText(`✦ ${starsCollected}/${starsNeeded}`, starX, gridOffset() - 30);

// Alertness bar
let barW = 150 * SCALE;
let barH = 20 * SCALE;
let barX = W - barW - gridOffset();
let barY = gridOffset() - 40;
ctx.fillStyle = '#333';
ctx.fillRect(barX, barY, barW, barH);
let alertPct = alertness / 3;
let alertColor = alertPct < 0.5 ? '#44ff88' : alertPct < 1 ? '#ffcc33' : '#ff3333';
ctx.fillStyle = alertColor;
ctx.fillRect(barX, barY, barW * alertPct, barH);
ctx.strokeStyle = '#666';
ctx.strokeRect(barX, barY, barW, barH);
ctx.font = `${fontSize * 0.7}px 'Courier New', monospace`;
ctx.fillStyle = '#fff';
ctx.textAlign = 'center';
ctx.fillText('ALERT', barX + barW/2, barY - 5);

// Controls hint
ctx.font = `${fontSize * 0.6}px 'Courier New', monospace`;
ctx.fillStyle = '#666';
ctx.textAlign = 'right';
ctx.fillText('CLICK: select | CLICK adj: swap', W - gridOffset(), H - 20);
}

function drawStartScreen() {
ctx.fillStyle = '#0a0a12';
ctx.fillRect(0, 0, W, H);

let cx = W/2, cy = H/2;
let fs = Math.max(24, 36 * SCALE);

ctx.textAlign = 'center';
ctx.fillStyle = '#ffcc33';
ctx.font = `bold ${fs}px 'Courier New', monospace`;
ctx.fillText('SHADOW GEMS', cx, cy - 80);

ctx.fillStyle = '#aaa';
ctx.font = `${fs * 0.5}px 'Courier New', monospace`;
ctx.fillText('~ MATCH-3 STEALTH ~', cx, cy - 40);

let lines = [
'Match gems to create NOISE pulses.',
'Guards patrol the board edges.',
'If noise reaches a guard, ALERTNESS rises.',
'At max alertness you are CAUGHT.',
'',
'Collect ✦ STAR GEMS to complete levels!',
'',
'CONTROLS:',
'Click/tap a gem, then click adjacent to swap',
'Arrow keys + Enter also work',
'R = Restart level'
];
let startY = cy + 10;
for (let i = 0; i < lines.length; i++) {
ctx.fillText(lines[i], cx, startY + i * fs * 0.55);
}

ctx.fillStyle = '#44ff88';
ctx.font = `bold ${fs * 0.6}px 'Courier New', monospace`;
let blink = Math.sin(Date.now() / 500) > 0;
if (blink) ctx.fillText('[ CLICK TO START ]', cx, cy + 200);
}

function drawCaughtScreen() {
ctx.fillStyle = 'rgba(180, 0, 0, 0.7)';
ctx.fillRect(0, 0, W, H);
let cx = W/2, cy = H/2;
ctx.textAlign = 'center';
ctx.fillStyle = '#fff';
ctx.font = `bold ${40 * SCALE}px 'Courier New', monospace`;
ctx.fillText('DETECTED!', cx, cy - 30);
ctx.font = `${20 * SCALE}px 'Courier New', monospace`;
ctx.fillText(`Score: ${score}`, cx, cy + 20);
ctx.fillStyle = '#aaa';
ctx.fillText('[ R to retry | CLICK for new game ]', cx, cy + 60);
}

function drawLevelComplete() {
ctx.fillStyle = 'rgba(0, 80, 40, 0.7)';
ctx.fillRect(0, 0, W, H);
let cx = W/2, cy = H/2;
ctx.textAlign = 'center';
ctx.fillStyle = '#44ff88';
ctx.font = `bold ${36 * SCALE}px 'Courier New', monospace`;
ctx.fillText('LEVEL CLEARED!', cx, cy - 30);
ctx.fillStyle = '#fff';
ctx.font = `${20 * SCALE}px 'Courier New', monospace`;
ctx.fillText(`Score: ${score}`, cx, cy + 15);
ctx.fillText(`Next level incoming...`, cx, cy + 50);
}

function drawGameOver() {
ctx.fillStyle = '#0a0a12';
ctx.fillRect(0, 0, W, H);
let cx = W/2, cy = H/2;
ctx.textAlign = 'center';
ctx.fillStyle = '#ff4466';
ctx.font = `bold ${36 * SCALE}px 'Courier New', monospace`;
ctx.fillText('GAME OVER', cx, cy - 50);
ctx.fillStyle = '#fff';
ctx.font = `${22 * SCALE}px 'Courier New', monospace`;
ctx.fillText(`Final Score: ${score}`, cx, cy);
ctx.fillText(`Level Reached: ${level}`, cx, cy + 35);
ctx.fillStyle = '#aaa';
ctx.fillText('[ CLICK to play again ]', cx, cy + 80);
}

let inputCooldown = 0;
function handleInput(e) {
initAudio();
let now = performance.now();
if (inputCooldown > now) return;
inputCooldown = now + 200;

if (gameState === 'start') {
gameState = 'playing';
initLevel(1);
score = 0;
level = 1;
return;
}

if (gameState === 'caught' || gameState === 'gameOver') {
gameState = 'playing';
initLevel(level);
alertness = 0;
return;
}

if (gameState === 'levelComplete') return;

if (gameState !== 'playing') return;

let mx, my;
if (e.type === 'keydown') {
// Handle arrow keys for selection
let key = e.key;
if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(key)) {
if (!selected) {
selected = { r: 0, c: 0 };
} else if (key === 'Enter') {
trySwap(selected);
} else {
let nr = selected.r, nc = selected.c;
if (key === 'ArrowUp') nr--;
if (key === 'ArrowDown') nr++;
if (key === 'ArrowLeft') nc--;
if (key === 'ArrowRight') nc++;
if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID) {
selected = { r: nr, c: nc };
}
}
return;
}
if (e.key === 'r' || e.key === 'R') {
initLevel(level);
alertness = 0;
return;
}
return;
}

// Mouse/touch
let rect = canvas.getBoundingClientRect();
mx = e.clientX ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
my = e.clientY ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

let cr = cellSize();
let ox = gridOffset();
let gc = Math.floor((mx - ox) / cr);
let gr = Math.floor((my - ox) / cr);

if (gc < 0 || gc >= GRID || gr < 0 || gr >= GRID) { selected = null; return; }

if (!selected) {
selected = { r: gr, c: gc };
} else {
let dr = Math.abs(gr - selected.r);
let dc = Math.abs(gc - selected.c);
if (dr + dc === 1) {
trySwap(selected);
selected = null;
} else if (gr === selected.r && gc === selected.c) {
selected = null;
} else {
selected = { r: gr, c: gc };
}
}
}

function trySwap(sel) {
let r2 = sel.r, c2 = sel.c;
if (r2 < 0 || r2 >= GRID || c2 < 0 || c2 >= GRID) return;
// Already handled by selection logic - this is for Enter key
sfxSwap();
}

function handleKey(e) {
if (e.key === 'r' || e.key === 'R') {
initLevel(level);
alertness = 0;
}
}

window.addEventListener('click', handleInput);
window.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput({ type: 'touch', touches: e.touches }); }, { passive: false });
window.addEventListener('keydown', (e) => { initAudio(); handleInput(e); handleKey(e); });

let lastMatchCheck = 0;
function gameLoop(timestamp) {
let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
lastTime = timestamp;

if (gameState === 'start') {
drawStartScreen();
requestAnimationFrame(gameLoop);
return;
}

if (gameState === 'caught') {
caughtTimer += dt;
if (caughtTimer > 2) { gameState = 'gameOver'; }
else drawCaughtScreen();
requestAnimationFrame(gameLoop);
return;
}

if (gameState === 'levelComplete') {
winTimer += dt;
if (winTimer > 2.5) {
level++;
initLevel(level);
gameState = 'playing';
winTimer = 0;
}
else drawLevelComplete();
requestAnimationFrame(gameLoop);
return;
}

if (gameState === 'gameOver') {
drawGameOver();
requestAnimationFrame(gameLoop);
return;
}

// Update
updateGuards(dt);
checkNoise();
updateParticles(dt);

// Alertness decay
alertDecayTimer += dt;
if (alertDecayTimer > 4) {
alertDecayTimer = 0;
if (alertness > 0) alertness--;
}

// Check caught
if (alertness >= 3) {
gameState = 'caught';
caughtTimer = 0;
sfxCaught();
shakeTime = 1;
shakeIntensity = 10;
}

// Check level complete
if (starsCollected >= starsNeeded) {
gameState = 'levelComplete';
winTimer = 0;
sfxWin();
}

// Update falling gems
for (let r = 0; r < GRID; r++) {
for (let c = 0; c < GRID; c++) {
if (grid[r][c] && grid[r][c].falling) {
grid[r][c].yOff += cellSize() * dt * 8;
if (grid[r][c].yOff >= 0) { grid[r][c].yOff = 0; grid[r][c].falling = false; }
}
}
}

// Check for cascading matches (with delay)
lastMatchCheck += dt;
if (lastMatchCheck > 0.3) {
let hadMatches = processMatches();
lastMatchCheck = 0;
}

// Draw
ctx.fillStyle = '#0a0a12';
ctx.fillRect(0, 0, W, H);

// Shake
let sx = 0, sy = 0;
if (shakeTime > 0) {
shakeTime -= dt;
sx = (Math.random() - 0.5) * shakeIntensity;
sy = (Math.random() - 0.5) * shakeIntensity;
}

ctx.save();
ctx.translate(sx, sy);

// Draw grid background
let cr = cellSize();
let ox = gridOffset();
for (let r = 0; r < GRID; r++) {
for (let c = 0; c < GRID; c++) {
ctx.fillStyle = (r + c) % 2 === 0 ? '#1a1a2e' : '#16213e';
ctx.fillRect(ox + c * cr, ox + r * cr, cr, cr);
}
}

// Grid border
ctx.strokeStyle = '#333';
ctx.lineWidth = 2;
ctx.strokeRect(ox, ox, cr * GRID, cr * GRID);

// Draw gems
for (let r = 0; r < GRID; r++) {
for (let c = 0; c < GRID; c++) {
if (!grid[r][c]) continue;
let gem = grid[r][c];
let gx = ox + c * cr;
let gy = ox + r * cr + gem.yOff;
let alpha = gem.alpha;
let isSel = selected && selected.r === r && selected.c === c;
drawGem(gx, gy, cr, gem.color, alpha, gem.star, isSel);
}
}

// Draw noise pulses
for (let p of noisePulses) drawNoisePulse(p);

// Draw guards
for (let g of guards) drawGuard(g);

// Draw particles
for (let p of particles) {
ctx.save();
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
ctx.restore();
}

ctx.restore();

// HUD
drawHUD();

requestAnimationFrame(gameLoop);
}

initLevel(1);
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
