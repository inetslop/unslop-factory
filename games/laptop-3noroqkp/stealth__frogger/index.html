<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frogger Stealth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, CELL;
let gameRunning = false;
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let frogX = 6, frogY = 18;
let frogCrouching = false;
let detectionMeter = 0;
let detectionActive = false;
let lilyPads = [];
let filledPads = 0;
let animFrame = 0;
let lastTime = 0;
let audioCtx = null;

const COLS = 13;
const TOTAL_ROWS = 20;
const ROAD_START = 14;
const ROAD_END = 19;
const RIVER_START = 8;
const RIVER_END = 13;
const SAFE_ROWS = [7, 13];

let cars = [];
let logs = [];
let turtles = [];
let particles = [];

function resize() {
    const aspect = COLS / TOTAL_ROWS;
    let w = window.innerWidth;
    let h = window.innerHeight;
    if (w / h > aspect) { w = h * aspect; }
    else { h = w / aspect; }
    W = Math.floor(w);
    H = Math.floor(h);
    canvas.width = W;
    canvas.height = H;
    CELL = W / COLS;
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'move') {
        osc.type = 'square';
        osc.frequency.value = 220;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.08);
    } else if (type === 'splash') {
        osc.type = 'sawtooth';
        osc.frequency.value = 150;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'caught') {
        osc.type = 'sawtooth';
        osc.frequency.value = 100;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'win') {
        osc.type = 'square';
        osc.frequency.value = 440;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'lily') {
        osc.type = 'sine';
        osc.frequency.value = 660;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'warn') {
        osc.type = 'triangle';
        osc.frequency.value = 80;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
    }
}

function initGame() {
    frogX = 6;
    frogY = 19;
    score = 0;
    lives = 3;
    detectionMeter = 0;
    filledPads = 0;
    particles = [];
    
    lilyPads = [0, 2, 4, 6, 8].map(x => ({x: x, filled: false}));
    
    // Init cars
    cars = [];
    for (let row = ROAD_START; row <= ROAD_END; row++) {
        const numCars = 1 + Math.floor(Math.random() * 2);
        const speed = (0.5 + Math.random() * 0.8) * (row < ROAD_START + 3 ? 1 : -1);
        const dir = Math.random() > 0.5 ? 1 : -1;
        const spacing = COLS / numCars;
        for (let i = 0; i < numCars; i++) {
            cars.push({
                row: row,
                x: i * spacing + Math.random() * 2,
                speed: speed * dir,
                size: Math.random() > 0.5 ? 1 : 1.5,
                color: `hsl(${Math.floor(Math.random()*360)}, 70%, 45%)`
            });
        }
    }
    
    // Init logs
    logs = [];
    for (let row = RIVER_START; row <= RIVER_END; row++) {
        const numLogs = 2 + Math.floor(Math.random() * 2);
        const speed = (0.3 + Math.random() * 0.5) * (Math.random() > 0.5 ? 1 : -1);
        for (let i = 0; i < numLogs; i++) {
            logs.push({
                row: row,
                x: i * (COLS / numLogs) + Math.random(),
                speed: speed,
                length: 2 + Math.floor(Math.random() * 3)
            });
        }
    }
    
    // Init turtles
    turtles = [];
    for (let i = 0; i < 5; i++) {
        turtles.push({
            row: RIVER_START + Math.floor(Math.random() * (RIVER_END - RIVER_START + 1)),
            x: Math.random() * COLS,
            y: RIVER_START + Math.floor(Math.random() * (RIVER_END - RIVER_START + 1)),
            vx: (Math.random() - 0.5) * 0.8,
            vy: (Math.random() - 0.5) * 0.4,
            jumpTimer: 0
        });
    }
}

function isOnLog(row, x) {
    for (let log of logs) {
        if (log.row === row && x >= Math.floor(log.x) && x < Math.floor(log.x + log.length)) {
            return log;
        }
    }
    return null;
}

function isOnTurtle(row, x) {
    for (let t of turtles) {
        if (Math.abs(t.row - row) < 0.5 && Math.abs(t.x - x) < 0.8) {
            return t;
        }
    }
    return null;
}

function moveFrog(dx, dy) {
    initAudio();
    const nx = frogX + dx;
    const ny = frogY + dy;
    
    if (nx < 0 || nx >= COLS) return;
    
    // Road area - can't go below row 19
    if (ny > ROAD_END) return;
    
    // Safe rows - always passable
    if (SAFE_ROWS.includes(ny)) { frogX = nx; frogY = ny; playSound('move'); return; }
    
    // Road area
    if (ny >= ROAD_START) {
        // Check car collision
        for (let car of cars) {
            if (car.row === ny && Math.abs(car.x - nx) < 0.8) {
                die();
                return;
            }
        }
        frogX = nx;
        frogY = ny;
        playSound('move');
        return;
    }
    
    // River area
    if (ny >= RIVER_START && ny <= RIVER_END) {
        const log = isOnLog(ny, nx);
        if (!log) { die(); return; }
        frogX = nx;
        frogY = ny;
        playSound('move');
        return;
    }
    
    // Top area (lily pads and safe row)
    if (ny === 0 || ny === 1) {
        frogX = nx;
        frogY = ny;
        playSound('move');
        checkLilyPads();
        return;
    }
}

function checkLilyPads() {
    if (frogY === 0) {
        for (let pad of lilyPads) {
            if (pad.x === frogX && !pad.filled) {
                pad.filled = true;
                filledPads++;
                score += 100;
                playSound('lily');
                spawnParticles(frogX, 0, '#4fff4f');
                if (filledPads >= 5) {
                    gameState = 'win';
                    playSound('win');
                }
            }
        }
    }
}

function die() {
    lives--;
    detectionMeter = 0;
    playSound('splash');
    spawnParticles(frogX, frogY, '#ff4444');
    if (lives <= 0) {
        gameState = 'gameover';
    } else {
        frogX = 6;
        frogY = 19;
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x * CELL + CELL/2,
            y: y * CELL + CELL/2,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3,
            life: 1,
            color: color
        });
    }
}

function update(dt) {
    if (gameState !== 'playing') return;
    
    // Update cars
    for (let car of cars) {
        car.x += car.speed * dt;
        if (car.x > COLS + 2) car.x = -2;
        if (car.x < -2) car.x = COLS + 2;
    }
    
    // Update logs
    for (let log of logs) {
        log.x += log.speed * dt;
        if (log.x > COLS + 1) log.x = -log.length - 0.5;
        if (log.x < -log.length - 0.5) log.x = COLS + 0.5;
    }
    
    // Move frog with current log/turtle
    const curLog = isOnLog(frogY, frogX);
    if (curLog) {
        frogX += curLog.speed * dt;
        if (frogX < 0 || frogX >= COLS) { die(); return; }
    }
    const curTurtle = isOnTurtle(frogY, frogX);
    if (curTurtle && !curLog) {
        frogX += curTurtle.vx * dt;
    }
    
    // Update turtles
    for (let t of turtles) {
        t.x += t.vx * dt;
        t.y += t.vy * dt;
        t.jumpTimer -= dt;
        if (t.jumpTimer <= 0) {
            t.vx = (Math.random() - 0.5) * 1.2;
            t.vy = (Math.random() - 0.5) * 0.6;
            t.jumpTimer = 2 + Math.random() * 3;
        }
        if (t.x < 0 || t.x >= COLS) { t.vx *= -1; t.x = Math.max(0, Math.min(COLS-1, t.x)); }
        if (t.y < RIVER_START || t.y > RIVER_END) { t.vy *= -1; t.y = Math.max(RIVER_START, Math.min(RIVER_END, t.y)); }
    }
    
    // Stealth detection
    detectionActive = false;
    let closestDist = 999;
    
    for (let car of cars) {
        if (car.row === frogY) {
            const dist = Math.abs(car.x - frogX);
            const detectRange = frogCrouching ? 1.2 : 2.5;
            if (dist < detectRange) {
                detectionActive = true;
                closestDist = Math.min(closestDist, dist);
            }
        } else if (car.row === frogY - 1 || car.row === frogY + 1) {
            const dist = Math.abs(car.x - frogX);
            const detectRange = frogCrouching ? 0.8 : 1.5;
            if (dist < detectRange) {
                detectionActive = true;
                closestDist = Math.min(closestDist, dist);
            }
        }
    }
    
    if (detectionActive) {
        const rate = (1 - closestDist / 3) * (frogCrouching ? 0.6 : 1.2);
        detectionMeter += rate * dt;
        if (detectionMeter >= 1) {
            die();
            return;
        }
    } else {
        detectionMeter = Math.max(0, detectionMeter - 0.8 * dt);
    }
    
    // Update particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2;
    }
    particles = particles.filter(p => p.life > 0);
}

function draw() {
    ctx.fillStyle = '#0f1a0f';
    ctx.fillRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }
    
    // Draw rows
    for (let row = 0; row < TOTAL_ROWS; row++) {
        const y = row * CELL;
        
        if (row <= 1) {
            ctx.fillStyle = '#1a2a1a';
            ctx.fillRect(0, y, W, CELL);
        } else if (row >= ROAD_START) {
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, y, W, CELL);
            // Road lines
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 1;
            for (let i = 0.5; i < COLS; i += 2) {
                ctx.beginPath();
                ctx.moveTo(i * CELL, y + CELL/2);
                ctx.lineTo((i+1) * CELL, y + CELL/2);
                ctx.stroke();
            }
        } else if (row >= RIVER_START) {
            ctx.fillStyle = '#0a1a2a';
            ctx.fillRect(0, y, W, CELL);
            // Water ripples
            ctx.strokeStyle = '#1a3a4a';
            ctx.lineWidth = 1;
            for (let i = 0; i < COLS * 2; i += 3) {
                const wx = (i * CELL/2 + animFrame * 0.5) % W;
                ctx.beginPath();
                ctx.arc(wx, y + CELL/2, CELL/4, 0, Math.PI);
                ctx.stroke();
            }
        } else {
            ctx.fillStyle = '#1a3a1a';
            ctx.fillRect(0, y, W, CELL);
        }
    }
    
    // Draw lily pads
    for (let pad of lilyPads) {
        const x = pad.x * CELL;
        const y = 0;
        if (pad.filled) {
            ctx.fillStyle = '#2a5a2a';
            ctx.beginPath();
            ctx.arc(x + CELL/2, CELL/2, CELL*0.4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#4fff4f';
            ctx.font = `${CELL * 0.5}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText('✓', x + CELL/2, y + CELL*0.65);
        } else {
            ctx.strokeStyle = '#4a8a4a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x + CELL/2, CELL/2, CELL*0.35, 0, Math.PI*2);
            ctx.stroke();
        }
    }
    
    // Draw logs
    for (let log of logs) {
        const x = log.x * CELL;
        const y = log.row * CELL;
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(x, y + CELL*0.2, log.length * CELL, CELL*0.6);
        ctx.fillStyle = '#7a5a3a';
        ctx.fillRect(x + 2, y + CELL*0.25, log.length * CELL - 4, CELL*0.15);
    }
    
    // Draw turtles
    for (let t of turtles) {
        const x = t.x * CELL;
        const y = t.y * CELL;
        ctx.fillStyle = '#3a6a3a';
        ctx.beginPath();
        ctx.arc(x + CELL/2, y + CELL/2, CELL*0.35, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#2a4a2a';
        ctx.fillRect(x + CELL*0.3, y + CELL*0.3, CELL*0.4, CELL*0.4);
    }
    
    // Draw cars
    for (let car of cars) {
        const x = car.x * CELL;
        const y = car.row * CELL;
        const w = car.size * CELL * 0.9;
        const h = CELL * 0.7;
        
        ctx.fillStyle = car.color;
        ctx.fillRect(x, y + (CELL - h)/2, w, h);
        // Headlights
        const hlDir = car.speed > 0 ? 1 : -1;
        const hlX = hlDir > 0 ? x + w : x;
        ctx.fillStyle = 'rgba(255, 255, 150, 0.3)';
        ctx.beginPath();
        ctx.moveTo(hlX, y + CELL*0.3);
        ctx.lineTo(hlX + hlDir * CELL*0.5, y + CELL*0.2);
        ctx.lineTo(hlX + hlDir * CELL*0.5, y + CELL*0.8);
        ctx.lineTo(hlX, y + CELL*0.7);
        ctx.fill();
        
        // Detection glow
        if (car.row === frogY || car.row === frogY - 1 || car.row === frogY + 1) {
            const dist = Math.abs(car.x - frogX);
            const range = frogCrouching ? 1.2 : 2.5;
            if (dist < range) {
                ctx.strokeStyle = `rgba(255, 0, 0, ${0.3 * (1 - dist/range)})`;
                ctx.lineWidth = 2;
                ctx.strokeRect(x - 2, y, w + 4, CELL);
            }
        }
    }
    
    // Draw frog
    const fx = frogX * CELL;
    const fy = frogY * CELL;
    const fSize = frogCrouching ? 0.6 : 0.8;
    
    ctx.fillStyle = detectionMeter > 0.5 ? `rgb(${100 + Math.floor(detectionMeter*155)}, 255, 50)` : '#4fff4f';
    
    // Body
    ctx.beginPath();
    ctx.arc(fx + CELL/2, fy + CELL/2, CELL * fSize * 0.4, 0, Math.PI*2);
    ctx.fill();
    
    // Eyes
    if (!frogCrouching) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(fx + CELL*0.35, fy + CELL*0.3, CELL*0.12, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fx + CELL*0.65, fy + CELL*0.3, CELL*0.12, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(fx + CELL*0.35, fy + CELL*0.32, CELL*0.06, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fx + CELL*0.65, fy + CELL*0.32, CELL*0.06, 0, Math.PI*2);
        ctx.fill();
    } else {
        // Crouching - just eyes peeking
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(fx + CELL*0.4, fy + CELL*0.35, CELL*0.08, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fx + CELL*0.6, fy + CELL*0.35, CELL*0.08, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Legs
    if (!frogCrouching) {
        ctx.fillStyle = '#2a9a2a';
        const legAnim = (animFrame % 10 < 5) ? 2 : -2;
        ctx.fillRect(fx + CELL*0.1, fy + CELL*0.6 + legAnim, CELL*0.15, CELL*0.2);
        ctx.fillRect(fx + CELL*0.75, fy + CELL*0.6 - legAnim, CELL*0.15, CELL*0.2);
    }
    
    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
    
    // UI
    drawUI();
    
    if (gameState === 'gameover') drawGameOver();
    if (gameState === 'win') drawWin();
}

function drawUI() {
    // Detection meter
    const meterW = W * 0.4;
    const meterX = (W - meterW) / 2;
    const meterY = 5;
    
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(meterX, meterY, meterW, 16);
    ctx.strokeStyle = detectionMeter > 0.5 ? '#ff4444' : '#444';
    ctx.lineWidth = 2;
    ctx.strokeRect(meterX, meterY, meterW, 16);
    
    if (detectionMeter > 0) {
        const grad = ctx.createLinearGradient(meterX, 0, meterX + meterW * detectionMeter, 0);
        grad.addColorStop(0, '#ff8800');
        grad.addColorStop(1, '#ff0000');
        ctx.fillStyle = grad;
        ctx.fillRect(meterX + 2, meterY + 2, (meterW - 4) * detectionMeter, 12);
    }
    
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('DETECTION', W/2, meterY + 12);
    
    // Score & Lives
    ctx.fillStyle = '#4fff4f';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 10, 20);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVES: ${'♥'.repeat(lives)}`, W - 10, 20);
    
    // Lily pads progress
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4a8a4a';
    ctx.font = '11px monospace';
    ctx.fillText(`PADS: ${filledPads}/5`, W/2, H - 8);
    
    // Crouch indicator
    if (frogCrouching) {
        ctx.fillStyle = '#ffaa00';
        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('[CROUCHING]', 10, H - 8);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a1a0a';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.fillStyle = '#4fff4f';
    ctx.font = `bold ${Math.min(W*0.08, 48)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('FROGGER STEALTH', W/2, H*0.2);
    
    // Subtitle
    ctx.fillStyle = '#ffaa00';
    ctx.font = `${Math.min(W*0.035, 18)}px monospace`;
    ctx.fillText('Cross the road. Sneak past cars.', W/2, H*0.28);
    
    // Instructions
    ctx.fillStyle = '#aaffaa';
    ctx.font = `${Math.min(W*0.028, 15)}px monospace`;
    const lines = [
        '↑↓←→  Move',
        'SHIFT  Crouch (harder to detect, slower)',
        '',
        'Avoid cars on the road!',
        'Cross the river on logs & turtles.',
        'Reach all 5 lily pads to win.',
        '',
        'If the detection meter fills up,',
        'a car spots you and you lose a life!'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H*0.38 + i * Math.min(H*0.045, 28));
    });
    
    // Start prompt
    const pulse = Math.sin(animFrame * 0.1) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(79, 255, 79, ${0.5 + pulse * 0.5})`;
    ctx.font = `bold ${Math.min(W*0.04, 24)}px monospace`;
    ctx.fillText('PRESS ENTER TO START', W/2, H*0.85);
    
    // Draw a frog
    const fs = Math.min(W*0.06, 40);
    ctx.fillStyle = '#4fff4f';
    ctx.beginPath();
    ctx.arc(W/2, H*0.93, fs/2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(W/2 - fs*0.2, H*0.93 - fs*0.15, fs*0.12, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W/2 + fs*0.2, H*0.93 - fs*0.15, fs*0.12, 0, Math.PI*2);
    ctx.fill();
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${Math.min(W*0.08, 48)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('SPOTTED!', W/2, H*0.35);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W*0.04, 24)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, W/2, H*0.45);
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(W*0.03, 16)}px monospace`;
    ctx.fillText('Press R to restart', W/2, H*0.6);
}

function drawWin() {
    ctx.fillStyle = 'rgba(0,20,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4fff4f';
    ctx.font = `bold ${Math.min(W*0.08, 48)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('HOPPED HOME!', W/2, H*0.35);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W*0.04, 24)}px monospace`;
    ctx.fillText(`Score: ${score}`, W/2, H*0.45);
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(W*0.03, 16)}px monospace`;
    ctx.fillText('Press R to play again', W/2, H*0.6);
}

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    animFrame += dt * 60;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', (e) => {
    if (gameState === 'start') {
        if (e.key === 'Enter' || e.key === ' ') {
            initAudio();
            gameState = 'playing';
            initGame();
        }
        return;
    }
    
    if (gameState === 'gameover' || gameState === 'win') {
        if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
            gameState = 'playing';
            initGame();
        }
        return;
    }
    
    if (gameState !== 'playing') return;
    
    frogCrouching = e.shiftKey;
    
    const speed = frogCrouching ? 0 : 1; // We handle movement on keydown, not continuous
    
    switch(e.key) {
        case 'ArrowUp': e.preventDefault(); moveFrog(0, -1); break;
        case 'ArrowDown': e.preventDefault(); moveFrog(0, 1); break;
        case 'ArrowLeft': e.preventDefault(); moveFrog(-1, 0); break;
        case 'ArrowRight': e.preventDefault(); moveFrog(1, 0); break;
    }
});

window.addEventListener('keyup', (e) => {
    frogCrouching = false;
});

// Prevent scrolling
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
    }
});

window.addEventListener('resize', resize);

// Init
resize();
initGame();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
