<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asteroids Racing</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function playEngine() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 80;
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}
function playCrash() {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    gain.gain.value = 0.3;
    src.buffer = buffer;
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();
}
function playCheckpoint() {
    if (!audioCtx) return;
    playTone(440, 0.15, 'sine', 0.2);
    setTimeout(() => playTone(660, 0.15, 'sine', 0.2), 80);
}
function playPowerup() {
    if (!audioCtx) return;
    playTone(880, 0.1, 'sine', 0.15);
    setTimeout(() => playTone(1100, 0.1, 'sine', 0.15), 60);
}

// Game State
let state = 'start'; // start, playing, finished, gameover
let ship = {};
let asteroids = [];
let gates = [];
let stars = [];
let particles = [];
let powerups = [];
let currentGate = 0;
let totalGates = 15;
let raceTime = 0;
let bestTime = null;
let health = 3;
let shieldTimer = 0;
let boostTimer = 0;
let shakeTimer = 0;
let engineSoundTimer = 0;

try {
    const saved = localStorage.getItem('asteroidsRacingBest');
    if (saved) bestTime = parseFloat(saved);
} catch(e) {}

const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if ((state === 'finished' || state === 'gameover') && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function generateStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push({
            x: Math.random() * W * 3,
            y: Math.random() * H * 3,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.5 + 0.2
        });
    }
}

function generateAsteroids() {
    asteroids = [];
    for (let i = 0; i < 40; i++) {
        const pts = [];
        const n = Math.floor(Math.random() * 4) + 5;
        const baseR = Math.random() * 25 + 15;
        for (let j = 0; j < n; j++) {
            const a = (j / n) * Math.PI * 2;
            const r = baseR + (Math.random() - 0.5) * 15;
            pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
        }
        asteroids.push({
            x: Math.random() * W * 2 - W * 0.5,
            y: Math.random() * H * 2 - H * 0.5,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.03,
            points: pts,
            size: baseR
        });
    }
}

function generateGates() {
    gates = [];
    for (let i = 0; i < totalGates; i++) {
        const t = i / totalGates;
        const angle = t * Math.PI * 2.5;
        const radius = 800 + Math.sin(t * Math.PI * 3) * 400;
        const cx = W / 2 + Math.cos(angle) * radius * 1.5;
        const cy = H / 2 + Math.sin(angle) * radius;
        gates.push({
            x: cx, y: cy,
            w: 60, h: 100,
            angle: angle + Math.PI / 4,
            passed: false
        });
    }
}

function generatePowerups() {
    powerups = [];
    for (let i = 0; i < 5; i++) {
        powerups.push({
            x: Math.random() * W * 2 - W * 0.5,
            y: Math.random() * H * 2 - H * 0.5,
            type: Math.random() > 0.5 ? 'boost' : 'shield',
            collected: false
        });
    }
}

function startGame() {
    state = 'playing';
    ship = {
        x: W / 2, y: H / 2 + 300,
        vx: 0, vy: 0,
        angle: -Math.PI / 2,
        radius: 14
    };
    currentGate = 0;
    raceTime = 0;
    health = 3;
    shieldTimer = 0;
    boostTimer = 0;
    particles = [];
    generateStars();
    generateAsteroids();
    generateGates();
    generatePowerups();
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 4 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: 1, decay: Math.random() * 0.03 + 0.02,
            color: color
        });
    }
}

function getCameraX() { return ship.x - W / 2; }
function getCameraY() { return ship.y - H / 2; }

function update(dt) {
    if (state !== 'playing') return;
    
    raceTime += dt;
    
    // Ship controls
    const thrustPower = boostTimer > 0 ? 0.7 : 0.45;
    if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= 0.06;
    if (keys['ArrowRight'] || keys['KeyD']) ship.angle += 0.06;
    if (keys['ArrowUp'] || keys['KeyW']) {
        ship.vx += Math.cos(ship.angle) * thrustPower;
        ship.vy += Math.sin(ship.angle) * thrustPower;
        engineSoundTimer -= dt;
        if (engineSoundTimer <= 0) { playEngine(); engineSoundTimer = 0.15; }
    }
    
    // Friction
    const friction = 0.98;
    ship.vx *= friction;
    ship.vy *= friction;
    
    // Speed cap
    const maxSpeed = boostTimer > 0 ? 12 : 8;
    const spd = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
    if (spd > maxSpeed) {
        ship.vx = (ship.vx / spd) * maxSpeed;
        ship.vy = (ship.vy / spd) * maxSpeed;
    }
    
    ship.x += ship.vx;
    ship.y += ship.vy;
    
    // Boost timer
    if (boostTimer > 0) boostTimer -= dt;
    if (shieldTimer > 0) shieldTimer -= dt;
    if (shakeTimer > 0) shakeTimer -= dt;
    
    // Engine particles
    if ((keys['ArrowUp'] || keys['KeyW']) && Math.random() > 0.5) {
        const ex = ship.x - Math.cos(ship.angle) * 18;
        const ey = ship.y - Math.sin(ship.angle) * 18;
        particles.push({
            x: ex, y: ey,
            vx: -Math.cos(ship.angle) * (Math.random() * 2 + 1),
            vy: -Math.sin(ship.angle) * (Math.random() * 2 + 1),
            life: 1, decay: 0.05,
            color: boostTimer > 0 ? '#0ff' : '#f80'
        });
    }
    
    // Update asteroids
    for (let a of asteroids) {
        a.x += a.vx;
        a.y += a.vy;
        a.rot += a.rotSpeed;
        // Wrap around loosely
        if (a.x < -200) a.x = W * 2 + 100;
        if (a.x > W * 2 + 200) a.x = -100;
        if (a.y < -200) a.y = H * 2 + 100;
        if (a.y > H * 2 + 200) a.y = -100;
    }
    
    // Collision with asteroids
    for (let a of asteroids) {
        const dx = ship.x - a.x;
        const dy = ship.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < a.size * 0.7 + ship.radius) {
            if (shieldTimer > 0) {
                playCrash();
                shakeTimer = 0.3;
                spawnParticles(ship.x, ship.y, '#0ff', 15);
                // Bounce
                const nx = dx / dist, ny = dy / dist;
                ship.vx = nx * 8;
                ship.vy = ny * 8;
            } else {
                health--;
                playCrash();
                shakeTimer = 0.5;
                spawnParticles(ship.x, ship.y, '#f44', 25);
                const nx = dx / dist, ny = dy / dist;
                ship.vx = nx * 6;
                ship.vy = ny * 6;
                if (health <= 0) {
                    state = 'gameover';
                    spawnParticles(ship.x, ship.y, '#ff0', 40);
                    return;
                }
            }
        }
    }
    
    // Gate check
    const gate = gates[currentGate];
    if (gate && !gate.passed) {
        const dx = ship.x - gate.x;
        const dy = ship.y - gate.y;
        if (Math.abs(dx) < gate.w / 2 + 20 && Math.abs(dy) < gate.h / 2 + 20) {
            gate.passed = true;
            currentGate++;
            playCheckpoint();
            spawnParticles(gate.x, gate.y, '#0f0', 10);
            if (currentGate >= totalGates) {
                state = 'finished';
                try {
                    const prev = localStorage.getItem('asteroidsRacingBest');
                    if (!prev || raceTime < parseFloat(prev)) {
                        localStorage.setItem('asteroidsRacingBest', raceTime.toString());
                        bestTime = raceTime;
                    }
                } catch(e) {}
            }
        }
    }
    
    // Powerup collection
    for (let p of powerups) {
        if (p.collected) continue;
        const dx = ship.x - p.x;
        const dy = ship.y - p.y;
        if (Math.sqrt(dx * dx + dy * dy) < 25) {
            p.collected = true;
            playPowerup();
            spawnParticles(p.x, p.y, p.type === 'boost' ? '#0ff' : '#f0f', 10);
            if (p.type === 'boost') boostTimer = 3;
            else shieldTimer = 5;
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawShip() {
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle + Math.PI / 2);
    
    // Shield glow
    if (shieldTimer > 0) {
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 255, 255, ${0.3 + Math.sin(Date.now() * 0.01) * 0.2})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }
    
    // Ship body
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-12, 14);
    ctx.lineTo(-6, 10);
    ctx.lineTo(0, 14);
    ctx.lineTo(6, 10);
    ctx.lineTo(12, 14);
    ctx.closePath();
    ctx.fillStyle = boostTimer > 0 ? '#0ff' : '#fff';
    ctx.fill();
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Cockpit
    ctx.beginPath();
    ctx.arc(0, -5, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#4af';
    ctx.fill();
    
    ctx.restore();
}

function draw() {
    const camX = getCameraX();
    const camY = getCameraY();
    let shakeX = 0, shakeY = 0;
    if (shakeTimer > 0) {
        shakeX = (Math.random() - 0.5) * 8;
        shakeY = (Math.random() - 0.5) * 8;
    }
    
    ctx.save();
    ctx.translate(shakeX, shakeY);
    
    // Background
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000005');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Stars (parallax)
    for (let s of stars) {
        let sx = ((s.x - camX * s.speed * 0.3) % (W * 3) + W * 3) % (W * 3) - W;
        let sy = ((s.y - camY * s.speed * 0.3) % (H * 3) + H * 3) % (H * 3) - H;
        if (sx > -10 && sx < W + 10 && sy > -10 && sy < H + 10) {
            ctx.fillStyle = `rgba(255,255,255,${s.size * 0.3})`;
            ctx.fillRect(sx, sy, s.size, s.size);
        }
    }
    
    // Apply camera
    ctx.save();
    ctx.translate(-camX + shakeX, -camY + shakeY);
    
    // Gates
    for (let i = 0; i < gates.length; i++) {
        const g = gates[i];
        if (g.passed) continue;
        
        const isNext = i === currentGate;
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.rotate(g.angle);
        
        if (isNext) {
            // Glow effect for next gate
            ctx.shadowColor = '#0f0';
            ctx.shadowBlur = 20;
            ctx.strokeStyle = `rgba(0, 255, 0, ${0.7 + Math.sin(Date.now() * 0.005) * 0.3})`;
            ctx.lineWidth = 4;
        } else {
            ctx.strokeStyle = 'rgba(100, 100, 100, 0.4)';
            ctx.lineWidth = 2;
        }
        
        // Gate shape
        ctx.beginPath();
        ctx.moveTo(-g.w/2, -g.h/2);
        ctx.lineTo(-g.w/2, g.h/2);
        ctx.moveTo(g.w/2, -g.h/2);
        ctx.lineTo(g.w/2, g.h/2);
        ctx.stroke();
        
        // Top bar
        if (isNext) {
            ctx.beginPath();
            ctx.moveTo(-g.w/2, -g.h/2);
            ctx.lineTo(g.w/2, -g.h/2);
            ctx.stroke();
        }
        
        ctx.restore();
        
        // Number
        if (isNext) {
            ctx.fillStyle = '#0f0';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${i + 1}/${totalGates}`, g.x, g.y - g.h/2 - 15);
        }
    }
    
    // Powerups
    for (let p of powerups) {
        if (p.collected) continue;
        ctx.save();
        ctx.translate(p.x, p.y);
        const pulse = Math.sin(Date.now() * 0.005) * 3;
        ctx.beginPath();
        ctx.arc(0, 0, 12 + pulse * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = p.type === 'boost' ? 'rgba(0, 255, 255, 0.6)' : 'rgba(255, 0, 255, 0.6)';
        ctx.fill();
        ctx.strokeStyle = p.type === 'boost' ? '#0ff' : '#f0f';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.fillStyle = p.type === 'boost' ? '#0ff' : '#f0f';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'boost' ? 'B' : 'S', 0, 5);
        ctx.restore();
    }
    
    // Asteroids
    for (let a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.beginPath();
        ctx.moveTo(a.points[0].x, a.points[0].y);
        for (let i = 1; i < a.points.length; i++) {
            ctx.lineTo(a.points[i].x, a.points[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = '#3a3a3a';
        ctx.fill();
        ctx.strokeStyle = '#666';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Craters
        ctx.beginPath();
        ctx.arc(a.size * 0.2, -a.size * 0.1, a.size * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#2a2a2a';
        ctx.fill();
        
        ctx.restore();
    }
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        ctx.globalAlpha = 1;
    }
    
    // Ship
    if (state === 'playing' || state === 'finished') {
        drawShip();
    }
    
    ctx.restore();
    ctx.restore();
    
    // HUD
    if (state === 'playing') {
        // Health
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(30 + i * 25, 30, 10, 0, Math.PI * 2);
            if (i < health) {
                ctx.fillStyle = '#f44';
                ctx.fill();
            } else {
                ctx.strokeStyle = '#f44';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        
        // Timer
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(raceTime.toFixed(2) + 's', W - 20, 35);
        
        // Gate progress
        ctx.font = '14px monospace';
        ctx.fillStyle = '#8f8';
        ctx.textAlign = 'left';
        ctx.fillText(`Gate: ${currentGate}/${totalGates}`, 20, H - 30);
        
        // Speed
        const spd = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
        ctx.fillStyle = '#ff8';
        ctx.fillText(`Speed: ${(spd * 10).toFixed(0)}`, 20, H - 50);
        
        // Boost/Shield indicators
        if (boostTimer > 0) {
            ctx.fillStyle = '#0ff';
            ctx.fillText(`BOOST ${boostTimer.toFixed(1)}s`, 20, H - 70);
        }
        if (shieldTimer > 0) {
            ctx.fillStyle = '#f0f';
            ctx.fillText(`SHIELD ${shieldTimer.toFixed(1)}s`, 20, H - (boostTimer > 0 ? 90 : 70));
        }
        
        // Best time
        if (bestTime) {
            ctx.fillStyle = '#888';
            ctx.font = '12px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`Best: ${bestTime.toFixed(2)}s`, W - 20, 55);
        }
    }
    
    // Start screen
    if (state === 'start') {
        drawStartScreen();
    }
    
    // Finished
    if (state === 'finished') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('RACE COMPLETE!', W/2, H/2 - 60);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Time: ${raceTime.toFixed(2)}s`, W/2, H/2);
        if (bestTime && raceTime <= bestTime) {
            ctx.fillStyle = '#ff0';
            ctx.fillText('NEW RECORD!', W/2, H/2 + 40);
        } else if (bestTime) {
            ctx.fillStyle = '#888';
            ctx.font = '16px monospace';
            ctx.fillText(`Best: ${bestTime.toFixed(2)}s`, W/2, H/2 + 40);
        }
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Press SPACE or R to race again', W/2, H/2 + 90);
    }
    
    // Game over
    if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f44';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('SHIP DESTROYED', W/2, H/2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText(`Survived: ${raceTime.toFixed(2)}s | Gate: ${currentGate}/${totalGates}`, W/2, H/2 + 20);
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Press SPACE or R to try again', W/2, H/2 + 70);
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ASTEROIDS', W/2, H/2 - 100);
    ctx.fillStyle = '#f80';
    ctx.font = 'bold 36px monospace';
    ctx.fillText('RACING', W/2, H/2 - 55);
    
    // Instructions
    ctx.fillStyle = '#ccc';
    ctx.font = '16px monospace';
    const lines = [
        '',
        'Controls:',
        '  Arrow Keys / WASD - Steer & Thrust',
        '  UP / W - Thrust forward',
        '  LEFT/RIGHT or A/D - Rotate',
        '',
        'Objective:',
        '  Pass through all gates in order!',
        '  Dodge asteroids to survive.',
        '  Collect power-ups: B=Boost, S=Shield',
        '',
        `Gates: ${totalGates}`,
        bestTime ? `Best Time: ${bestTime.toFixed(2)}s` : ''
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 + i * 24);
    });
    
    // Prompt
    ctx.fillStyle = `rgba(255, 255, 0, ${0.5 + Math.sin(Date.now() * 0.003) * 0.5})`;
    ctx.font = 'bold 20px monospace';
    ctx.fillText('PRESS SPACE TO RACE', W/2, H - 60);
}

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

generateStars();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
