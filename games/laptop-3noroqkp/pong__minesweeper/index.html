<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game constants
const GRID_COLS = 8;
const GRID_ROWS = 10;
const PADDLE_WIDTH = 120;
const BALL_RADIUS = 10;
const MINES_PER_WAVE = 5;

let gameState = 'START'; // START, PLAYING, GAME_OVER
let score = 0;
let highScore = 0;
let lives = 3;
let paddleX = 0;
let ballX = 0, ballY = 0, ballVX = 0, ballVY = 0;
let mines = [];
let particles = [];
let shakeTime = 0;
let shakeIntensity = 0;
let gridCols, gridRows;
let cellW, cellH;
let lastTime = 0;

try { highScore = parseInt(localStorage.getItem('pongMinesweeperHigh') || '0'); } catch(e) {}

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'bounce') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'lose') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'reveal') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
}

function getGridDims() {
    gridCols = GRID_COLS;
    gridRows = GRID_ROWS;
    cellW = W / gridCols;
    cellH = (H - 80) / gridRows;
}

function spawnBall() {
    ballX = W / 2;
    ballY = H * 0.3;
    let angle = Math.random() * Math.PI - Math.PI/2; // Upward-ish
    let speed = 4 + score * 0.15;
    if (speed > 9) speed = 9;
    ballVX = Math.cos(angle) * speed;
    ballVY = -Math.abs(Math.sin(angle)) * speed;
}

function placeMines() {
    mines = [];
    const totalMines = MINES_PER_WAVE + Math.floor(score / 3);
    const maxMines = Math.min(totalMines, gridCols * gridRows - 5);
    
    for (let i = 0; i < maxMines; i++) {
        let col, row, attempts = 0;
        do {
            col = Math.floor(Math.random() * gridCols);
            row = Math.floor(Math.random() * gridRows);
            attempts++;
        } while (mines.some(m => m.col === col && m.row === row) && attempts < 100);
        
        // Don't place mines in the bottom 2 rows (paddle area) or top row
        if (row >= gridRows - 2 || row === 0) {
            row = Math.floor(Math.random() * (gridRows - 3)) + 1;
        }
        
        mines.push({ col, row, revealed: false, exploding: false, explodeTimer: 0 });
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    paddleX = W / 2 - PADDLE_WIDTH / 2;
    getGridDims();
    placeMines();
    spawnBall();
    particles = [];
    shakeTime = 0;
}

function addExplosion(x, y) {
    for (let i = 0; i < 30; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 2 + Math.random() * 6;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: `hsl(${Math.random() * 40}, 100%, ${50 + Math.random() * 30}%)`
        });
    }
    shakeTime = 0.3;
    shakeIntensity = 8;
}

function addBounceParticles(x, y) {
    for (let i = 0; i < 8; i++) {
        let angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI;
        let speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: `hsl(${180 + Math.random() * 60}, 100%, 70%)`
        });
    }
}

function checkMineCollision() {
    const col = Math.floor(ballX / cellW);
    const row = Math.floor((ballY - (H - 80)) / cellH);
    
    for (let mine of mines) {
        // Check if ball is in the same cell as mine
        if (col === mine.col && row === mine.row) {
            return mine;
        }
    }
    return null;
}

function checkMineReveal() {
    const col = Math.floor(ballX / cellW);
    const row = Math.floor((ballY - (H - 80)) / cellH);
    
    let revealedAny = false;
    for (let mine of mines) {
        if (!mine.revealed) {
            // Reveal if within 2 cells
            if (Math.abs(mine.col - col) <= 1 && Math.abs(mine.row - row) <= 1) {
                mine.revealed = true;
                revealedAny = true;
            }
        }
    }
    if (revealedAny) playSound('reveal');
}

function update(dt) {
    if (gameState !== 'PLAYING') return;
    
    // Paddle movement
    const paddleSpeed = 500;
    if (keys['ArrowLeft'] || keys['a']) paddleX -= paddleSpeed * dt;
    if (keys['ArrowRight'] || keys['d']) paddleX += paddleSpeed * dt;
    paddleX = Math.max(0, Math.min(W - PADDLE_WIDTH, paddleX));
    
    // Ball movement
    ballX += ballVX;
    ballY += ballVY;
    
    // Wall bounces
    if (ballX <= BALL_RADIUS) { ballX = BALL_RADIUS; ballVX = Math.abs(ballVX); playSound('bounce'); }
    if (ballX >= W - BALL_RADIUS) { ballX = W - BALL_RADIUS; ballVX = -Math.abs(ballVX); playSound('bounce'); }
    if (ballY <= BALL_RADIUS) { ballY = BALL_RADIUS; ballVY = Math.abs(ballVY); playSound('bounce'); }
    
    // Paddle bounce
    const paddleTop = H - 60;
    if (ballVY > 0 && ballY + BALL_RADIUS >= paddleTop && 
        ballX >= paddleX && ballX <= paddleX + PADDLE_WIDTH) {
        ballY = paddleTop - BALL_RADIUS;
        // Angle based on where it hits the paddle
        const hitPos = (ballX - paddleX) / PADDLE_WIDTH;
        const angle = (hitPos - 0.5) * Math.PI * 0.7;
        let speed = Math.sqrt(ballVX * ballVX + ballVY * ballVY);
        speed = Math.min(speed * 1.02, 10);
        ballVX = Math.sin(angle) * speed;
        ballVY = -Math.cos(angle) * speed;
        score++;
        addBounceParticles(ballX, paddleTop);
        playSound('bounce');
        
        // Increase difficulty
        if (score % 5 === 0) {
            placeMines();
        }
    }
    
    // Ball falls off bottom
    if (ballY > H + BALL_RADIUS) {
        lives--;
        playSound('lose');
        addExplosion(ballX, H);
        if (lives <= 0) {
            gameState = 'GAME_OVER';
            if (score > highScore) {
                highScore = score;
                try { localStorage.setItem('pongMinesweeperHigh', highScore.toString()); } catch(e) {}
            }
        } else {
            spawnBall();
        }
    }
    
    // Mine collision
    const hitMine = checkMineCollision();
    if (hitMine && !hitMine.exploding) {
        hitMine.exploding = true;
        hitMine.explodeTimer = 0.5;
        addExplosion(ballX, ballY);
        playSound('explosion');
        lives--;
        if (lives <= 0) {
            gameState = 'GAME_OVER';
            if (score > highScore) {
                highScore = score;
                try { localStorage.setItem('pongMinesweeperHigh', highScore.toString()); } catch(e) {}
            }
        } else {
            spawnBall();
        }
    }
    
    // Mine reveal check
    checkMineReveal();
    
    // Update exploding mines
    for (let mine of mines) {
        if (mine.exploding) {
            mine.explodeTimer -= dt;
            if (mine.explodeTimer <= 0) mine.exploding = false;
        }
    }
    
    // Particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 5 * dt;
        p.life -= dt * 2;
    }
    particles = particles.filter(p => p.life > 0);
    
    // Shake
    if (shakeTime > 0) shakeTime -= dt;
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity * (shakeTime / 0.3);
        const sy = (Math.random() - 0.5) * shakeIntensity * (shakeTime / 0.3);
        ctx.translate(sx, sy);
    }
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    
    if (gameState === 'START') {
        drawStartScreen();
        ctx.restore();
        return;
    }
    
    // Grid
    getGridDims();
    ctx.strokeStyle = 'rgba(50, 80, 120, 0.3)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= gridCols; c++) {
        ctx.beginPath();
        ctx.moveTo(c * cellW, H - 80);
        ctx.lineTo(c * cellW, H - 80 + gridRows * cellH);
        ctx.stroke();
    }
    for (let r = 0; r <= gridRows; r++) {
        ctx.beginPath();
        ctx.moveTo(0, H - 80 + r * cellH);
        ctx.lineTo(W, H - 80 + r * cellH);
        ctx.stroke();
    }
    
    // Mines
    for (let mine of mines) {
        const mx = mine.col * cellW + cellW / 2;
        const my = (H - 80) + mine.row * cellH + cellH / 2;
        
        if (mine.exploding) {
            // Explosion flash
            ctx.fillStyle = `rgba(255, 100, 0, ${mine.explodeTimer * 2})`;
            ctx.beginPath();
            ctx.arc(mx, my, cellW * 0.6, 0, Math.PI * 2);
            ctx.fill();
        } else if (mine.revealed) {
            // Revealed mine - skull/mine icon
            ctx.fillStyle = '#ff4444';
            ctx.font = `bold ${Math.min(cellW, cellH) * 0.5}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💣', mx, my);
            
            // Glow
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 10;
            ctx.fillStyle = 'rgba(255, 68, 68, 0.3)';
            ctx.fillRect(mine.col * cellW + 5, (H - 80) + mine.row * cellH + 5, cellW - 10, cellH - 10);
            ctx.shadowBlur = 0;
        } else {
            // Hidden mine - question mark
            ctx.fillStyle = 'rgba(100, 140, 200, 0.4)';
            ctx.font = `${Math.min(cellW, cellH) * 0.5}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', mx, my);
        }
    }
    
    // Paddle
    const paddleTop = H - 60;
    ctx.fillStyle = '#44ff88';
    ctx.shadowColor = '#44ff88';
    ctx.shadowBlur = 15;
    ctx.fillRect(paddleX, paddleTop, PADDLE_WIDTH, 12);
    ctx.shadowBlur = 0;
    
    // Ball
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(ballX, ballY, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // HUD
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.textAlign = 'right';
    ctx.fillText(`BEST: ${highScore}`, W - 20, 30);
    
    // Lives as hearts
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    let livesStr = '';
    for (let i = 0; i < lives; i++) livesStr += '❤️';
    ctx.fillText(livesStr, W / 2, 30);
    
    // Game Over overlay
    if (gameState === 'GAME_OVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 10);
        ctx.fillText(`Best: ${highScore}`, W / 2, H / 2 + 45);
        
        ctx.fillStyle = '#44ff88';
        ctx.font = '20px monospace';
        ctx.fillText('Press SPACE to restart', W / 2, H / 2 + 100);
    }
    
    ctx.restore();
}

function drawStartScreen() {
    // Title
    ctx.fillStyle = '#44ff88';
    ctx.font = 'bold 56px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PONG', W / 2, H / 3);
    ctx.fillStyle = '#ff4444';
    ctx.fillText('MINESWEEPER', W / 2, H / 3 + 60);
    
    // Instructions
    ctx.fillStyle = '#aaccff';
    ctx.font = '18px monospace';
    const lines = [
        '⬅️ ➡️ or A/D — Move paddle',
        '',
        'Bounce the ball off your paddle to score.',
        'Avoid the 💣 mines hidden in the grid!',',
        'Mines reveal as you get close...',
        '',
        'If the ball falls off screen OR hits a mine,',
        'you lose a life. 3 lives total.',
        '',
        `Best: ${highScore}`,
        '',
        '',
        'Press SPACE to start!'
    ];
    
    let y = H / 2 + 20;
    for (let line of lines) {
        ctx.fillText(line, W / 2, y);
        y += 28;
    }
}

let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    initAudio();
    
    if (gameState === 'START' && e.key === ' ') {
        gameState = 'PLAYING';
        resetGame();
    } else if (gameState === 'GAME_OVER' && e.key === ' ') {
        gameState = 'PLAYING';
        resetGame();
    }
    
    // Prevent scrolling with arrow keys
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
        e.preventDefault();
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

// Touch controls
canvas.addEventListener('touchstart', (e) => {
    initAudio();
    if (gameState === 'START' || gameState === 'GAME_OVER') {
        gameState = 'PLAYING';
        resetGame();
    }
    e.preventDefault();
});

canvas.addEventListener('touchmove', (e) => {
    const touch = e.touches[0];
    paddleX = touch.clientX - PADDLE_WIDTH / 2;
    paddleX = Math.max(0, Math.min(W - PADDLE_WIDTH, paddleX));
    e.preventDefault();
});

let lastTs = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTs) / 1000, 0.05);
    lastTs = timestamp;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

getGridDims();
resetGame();
gameState = 'START';
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
