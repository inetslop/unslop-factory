<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Defense Cards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e1a; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
#gameCanvas { flex: 1; width: 100%; display: block; }
#hand { height: 140px; background: #121830; border-top: 2px solid #2a3a5c; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; }
.card { width: 100px; height: 110px; background: linear-gradient(135deg, #1e2a4a, #162040); border: 2px solid #3a5a8c; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding: 8px; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; user-select: none; }
.card:hover { transform: translateY(-8px); border-color: #6a9aff; box-shadow: 0 -4px 20px rgba(106,154,255,0.3); }
.card.selected { border-color: #ffcc00; box-shadow: 0 0 20px rgba(255,204,0,0.4); transform: translateY(-12px); }
.card.disabled { opacity: 0.4; pointer-events: none; }
.card-icon { font-size: 32px; margin-bottom: 4px; }
.card-name { font-size: 11px; font-weight: bold; text-align: center; color: #aaccff; }
.card-cost { font-size: 12px; color: #ffd700; margin-top: auto; }
#hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; background: rgba(10,14,26,0.9); padding: 8px 24px; border-radius: 10px; border: 1px solid #2a3a5c; z-index: 10; }
.hud-item { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: bold; }
#startScreen, #endScreen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,14,26,0.95); z-index: 100; }
#endScreen { display: none; }
h1 { font-size: 48px; color: #6a9aff; text-shadow: 0 0 30px rgba(106,154,255,0.5); margin-bottom: 20px; }
.subtitle { font-size: 16px; color: #8899bb; margin-bottom: 30px; text-align: center; line-height: 1.6; }
.btn { padding: 14px 40px; font-size: 18px; background: linear-gradient(135deg, #2a4a8c, #1a3060); border: 2px solid #4a7aff; border-radius: 8px; color: #fff; cursor: pointer; transition: all 0.2s; }
.btn:hover { background: linear-gradient(135deg, #3a5aac, #2a4070); box-shadow: 0 0 20px rgba(74,122,255,0.4); transform: scale(1.05); }
#endText { font-size: 36px; margin-bottom: 10px; }
#waveBanner { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 42px; color: #ffcc00; text-shadow: 0 0 30px rgba(255,204,0,0.6); z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hand"></div>
<div id="hud">
<div class="hud-item">💰 <span id="goldDisplay">0</span></div>
<div class="hud-item">❤️ <span id="hpDisplay">0</span></div>
<div class="hud-item">🌊 Wave <span id="waveDisplay">0</span></div>
<div class="hud-item">⚔️ <span id="enemiesLeft">0</span></div>
</div>
<div id="startScreen">
<h1>⚔️ Tower Defense Cards</h1>
<p class="subtitle">Play cards to place towers and defend your base!<br>Click a card, then click a slot on the map.<br>Survive all 10 waves to win!</p>
<button class="btn" id="startBtn">Start Game</button>
</div>
<div id="endScreen">
<h1 id="endText"></h1>
<p class="subtitle" id="endSub"></p>
<button class="btn" id="restartBtn">Play Again</button>
</div>
<div id="waveBanner"></div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const handH = 140;
  W = window.innerWidth;
  H = window.innerHeight - handH;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game State
let gold = 50, baseHP = 100, maxHP = 100, wave = 0, totalWaves = 10;
let enemies = [], towers = [], projectiles = [], particles = [];
let hand = [], selectedCard = null, selectedSlot = null;
let gameRunning = false, animFrame = null;
let pathPoints = [], towerSlots = [];
let enemySpeed = 1.2, lastTime = 0;

// Path definition (normalized 0-1)
const pathNorm = [
  {x: -0.05, y: 0.3}, {x: 0.15, y: 0.3}, {x: 0.15, y: 0.7},
  {x: 0.45, y: 0.7}, {x: 0.45, y: 0.2}, {x: 0.75, y: 0.2},
  {x: 0.75, y: 0.6}, {x: 1.05, y: 0.6}
];

function buildPath() {
  pathPoints = pathNorm.map(p => ({x: p.x * W, y: p.y * H}));
  towerSlots = [
    {x: 0.28, y: 0.3}, {x: 0.28, y: 0.7},
    {x: 0.45, y: 0.45}, {x: 0.62, y: 0.2},
    {x: 0.62, y: 0.6}, {x: 0.85, y: 0.4},
    {x: 0.15, y: 0.5}, {x: 0.75, y: 0.4}
  ].map(p => ({x: p.x * W, y: p.y * H, tower: null}));
}

// Card definitions
const cardDefs = [
  {id:'arrow', name:'Arrow Tower', icon:'🏹', cost:10, type:'tower', dmg:8, range:120, rate:500, color:'#4a9eff'},
  {id:'cannon', name:'Cannon Tower', icon:'💣', cost:20, type:'tower', dmg:25, range:100, rate:1200, color:'#ff6a4a', splash:40},
  {id:'ice', name:'Ice Tower', icon:'❄️', cost:15, type:'tower', dmg:3, range:130, rate:800, color:'#6adfff', slow:true},
  {id:'lightning', name:'Storm Tower', icon:'⚡', cost:30, type:'tower', dmg:40, range:150, rate:1500, color:'#ffd700'},
  {id:'upgrade', name:'Upgrade', icon:'🔧', cost:15, type:'upgrade'},
  {id:'repair', name:'Repair', icon:'❤️', cost:10, type:'instant'},
  {id:'gold', name:'Gold Mine', icon:'💰', cost:5, type:'instant'},
];

function drawCard() {
  const weights = [3,2,2,1,2,1,2];
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<weights.length;i++){ r-=weights[i]; if(r<=0) return {...cardDefs[i]}; }
  return {...cardDefs[0]};
}

function drawHand() {
  while(hand.length < 5) hand.push(drawCard());
}

function renderHand() {
  const handEl = document.getElementById('hand');
  handEl.innerHTML = '';
  hand.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'card' + (gold < c.cost ? ' disabled' : '') + (selectedCard === i ? ' selected' : '');
    div.innerHTML = `<div class="card-icon">${c.icon}</div><div class="card-name">${c.name}</div><div class="card-cost">💰 ${c.cost}</div>`;
    div.onclick = () => {
      if(gold < c.cost) return;
      if(selectedCard === i) selectedCard = null;
      else selectedCard = i;
      renderHand();
    };
    handEl.appendChild(div);
  });
}

function updateHUD() {
  document.getElementById('goldDisplay').textContent = gold;
  document.getElementById('hpDisplay').textContent = baseHP;
  document.getElementById('waveDisplay').textContent = wave + '/' + totalWaves;
  document.getElementById('enemiesLeft').textContent = enemies.length;
}

function showWaveBanner(text) {
  const el = document.getElementById('waveBanner');
  el.textContent = text;
  el.style.opacity = '1';
  setTimeout(()=>{ el.style.opacity='0'; }, 1500);
}

function spawnEnemy(hp, speed, size) {
  enemies.push({x: pathPoints[0].x, y: pathPoints[0].y, targetIdx: 1, hp, maxHp: hp, speed: speed || enemySpeed, size: size||12, slow: 1});
}

function startWave() {
  wave++;
  showWaveBanner(`Wave ${wave}`);
  const count = 3 + wave * 2;
  const hp = 20 + wave * 15;
  const spd = 1 + wave * 0.1;
  for(let i=0;i<count;i++){
    setTimeout(()=>{ if(gameRunning) spawnEnemy(hp, spd, 10+wave); }, i*800);
  }
}

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function updateEnemies(dt) {
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.targetIdx >= pathPoints.length){
      baseHP -= 5;
      particles.push({x:e.x,y:e.y,r:20,color:'#ff4444',life:30});
      enemies.splice(i,1);
      continue;
    }
    const target = pathPoints[e.targetIdx];
    const d = dist(e, target);
    if(d < 5){ e.targetIdx++; continue; }
    const sp = e.speed * (e.slow < 1 ? 0.5 : 1);
    const angle = Math.atan2(target.y - e.y, target.x - e.x);
    e.x += Math.cos(angle) * sp;
    e.y += Math.sin(angle) * sp;
  }
}

function updateTowers(dt) {
  towerSlots.forEach(slot => {
    if(!slot.tower) return;
    const t = slot.tower;
    t.cooldown -= dt;
    if(t.cooldown > 0) return;
    // Find target
    let best = null, bestDist = Infinity;
    enemies.forEach(e => {
      const d = dist(slot, e);
      if(d < t.range && d < bestDist){ best = e; bestDist = d; }
    });
    if(best){
      t.cooldown = t.rate;
      projectiles.push({x:slot.x,y:slot.y,target:best,dmg:t.dmg,splash:t.splash||0,slow:t.slow,color:t.color,speed:8});
    }
  });
}

function updateProjectiles(dt) {
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    if(!enemies.includes(p.target)){ projectiles.splice(i,1); continue; }
    const d = dist(p, p.target);
    if(d < 15){
      // Hit
      if(p.splash){
        enemies.forEach(e=>{ if(dist(p,e) < p.splash) hitEnemy(e, p.dmg*0.7, p.slow); });
      } else {
        hitEnemy(p.target, p.dmg, p.slow);
      }
      particles.push({x:p.x,y:p.y,r:12,color:p.color,life:20});
      projectiles.splice(i,1);
    } else {
      const angle = Math.atan2(p.target.y-p.y, p.target.x-p.x);
      p.x += Math.cos(angle)*p.speed;
      p.y += Math.sin(angle)*p.speed;
    }
  }
}

function hitEnemy(e, dmg, slow){
  e.hp -= dmg;
  if(slow) e.slow = 0.5;
  else e.slow = 1;
  if(e.hp <= 0){
    const idx = enemies.indexOf(e);
    if(idx >= 0){ gold += 3 + wave; enemies.splice(idx,1); }
    particles.push({x:e.x,y:e.y,r:15,color:'#ffcc00',life:25});
  }
}

function updateParticles(dt) {
  for(let i=particles.length-1;i>=0;i--){
    particles[i].r += 1;
    particles[i].life--;
    if(particles[i].life <= 0) particles.splice(i,1);
  }
}

function draw() {
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0,0,W,H);
  
  // Draw path
  ctx.strokeStyle = '#2a3a5c';
  ctx.lineWidth = 40;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
  for(let i=1;i<pathPoints.length;i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
  ctx.stroke();
  
  ctx.strokeStyle = '#1a2a4c';
  ctx.lineWidth = 32;
  ctx.beginPath();
  ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
  for(let i=1;i<pathPoints.length;i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
  ctx.stroke();
  
  // Path direction arrows
  ctx.fillStyle = '#3a5a8c';
  for(let i=0;i<pathPoints.length-1;i++){
    const a=pathPoints[i], b=pathPoints[i+1];
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    ctx.save();ctx.translate(mx,my);ctx.rotate(ang);
    ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-6);ctx.lineTo(-5,6);ctx.fill();
    ctx.restore();
  }
  
  // Draw slots
  towerSlots.forEach(slot => {
    if(!slot.tower){
      ctx.strokeStyle = selectedCard !== null ? '#ffcc00' : '#3a5a8c';
      ctx.lineWidth = 2;
      ctx.setLineDash([5,5]);
      ctx.beginPath();
      ctx.arc(slot.x, slot.y, 20, 0, Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      const t = slot.tower;
      ctx.fillStyle = t.color;
      ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.arc(slot.x,slot.y,t.range,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, 18, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(slot.x, slot.y, 18, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#0a0e1a'; ctx.font = '16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.icon, slot.x, slot.y);
    }
  });
  
  // Draw enemies
  enemies.forEach(e => {
    ctx.fillStyle = e.slow < 1 ? '#6adfff' : '#ff4444';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI*2); ctx.fill();
    // HP bar
    const bw = e.size*2;
    ctx.fillStyle = '#333';
    ctx.fillRect(e.x-bw/2, e.y-e.size-10, bw, 5);
    ctx.fillStyle = '#4aff4a';
    ctx.fillRect(e.x-bw/2, e.y-e.size-10, bw*(e.hp/e.maxHp), 5);
  });
  
  // Draw projectiles
  projectiles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
  });
  
  // Draw particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life/30;
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  });
  
  // Base indicator
  const last = pathPoints[pathPoints.length-1];
  ctx.fillStyle = baseHP > 50 ? '#4aff4a' : baseHP > 25 ? '#ffcc00' : '#ff4444';
  ctx.font = '28px sans-serif'; ctx.textAlign='center';
  ctx.fillText('🏰', last.x-10, last.y+5);
}

function gameLoop(time) {
  if(!gameRunning) return;
  const dt = Math.min(time - lastTime, 50);
  lastTime = time;
  
  updateEnemies(dt);
  updateTowers(dt);
  updateProjectiles(dt);
  updateParticles(dt);
  draw();
  
  if(enemies.length === 0 && wave < totalWaves){
    setTimeout(()=>{ if(gameRunning) startWave(); }, 2000);
  } else if(enemies.length === 0 && wave >= totalWaves){
    endGame(true);
  }
  
  if(baseHP <= 0) endGame(false);
  
  animFrame = requestAnimationFrame(gameLoop);
}

function startGame(){
  gold = 50; baseHP = 100; maxHP = 100; wave = 0;
  enemies = []; towers = []; projectiles = []; particles = [];
  hand = []; drawHand();
  selectedCard = null;
  buildPath();
  towerSlots.forEach(s=>s.tower=null);
  gameRunning = true;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('endScreen').style.display='none';
  renderHand();
  updateHUD();
  lastTime = performance.now();
  startWave();
  animFrame = requestAnimationFrame(gameLoop);
}

function endGame(won){
  gameRunning = false;
  cancelAnimationFrame(animFrame);
  document.getElementById('endText').textContent = won ? '🎉 Victory!' : '💀 Defeat!';
  document.getElementById('endSub').textContent = won ? `You survived all ${totalWaves} waves!` : `You made it to wave ${wave}.`;
  document.getElementById('endScreen').style.display='flex';
}

function placeTower(slot, cardDef){
  slot.tower = {dmg:cardDef.dmg, range:cardDef.range, rate:cardDef.rate, color:cardDef.color, icon:cardDef.icon, splash:cardDef.splash, slow:cardDef.slow, cooldown:0};
}

canvas.addEventListener('click', (e) => {
  if(!gameRunning || selectedCard === null) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  
  const card = hand[selectedCard];
  
  if(card.type === 'tower'){
    for(let s of towerSlots){
      if(!s.tower && dist({x:mx,y:my}, s) < 30){
        gold -= card.cost;
        placeTower(s, card);
        hand.splice(selectedCard, 1);
        selectedCard = null;
        renderHand(); updateHUD();
        return;
      }
    }
  } else if(card.type === 'upgrade'){
    for(let s of towerSlots){
      if(s.tower && dist({x:mx,y:my}, s) < 30){
        gold -= card.cost;
        s.tower.dmg = Math.round(s.tower.dmg * 1.5);
        s.tower.range += 20;
        hand.splice(selectedCard, 1);
        selectedCard = null;
        renderHand(); updateHUD();
        return;
      }
    }
  } else if(card.type === 'instant'){
    gold -= card.cost;
    if(card.id === 'repair') baseHP = Math.min(maxHP, baseHP + 25);
    if(card.id === 'gold') gold += 15;
    hand.splice(selectedCard, 1);
    selectedCard = null;
    renderHand(); updateHUD();
    return;
  }
});

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

// Keyboard shortcut: R to restart
window.addEventListener('keydown', (e) => {
  if(e.key === 'r' || e.key === 'R') startGame();
});
</script>
</body>
</html>
