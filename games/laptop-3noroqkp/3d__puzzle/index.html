<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Slide Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0f0f1a; font-family: 'Segoe UI', Tahoma, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game constants
const N = 4;
const TILE_H = 0.35;
const GAP = 0.08;

// State
let grid = [];
let animating = false;
let moves = 0;
let startTime = 0;
let won = false;
let gameState = 'start'; // 'start', 'playing', 'won'
let animQueue = [];
let particles = [];
let audioCtx = null;

// Audio
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSlideSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(200, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.2);
}

function playWinSound() {
  if (!audioCtx) return;
  const notes = [262, 330, 392, 523];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.15);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.4);
    osc.start(audioCtx.currentTime + i * 0.15);
    osc.stop(audioCtx.currentTime + i * 0.15 + 0.4);
  });
}

function playClickSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.15);
}

// 3D Camera
const cam = {
  x: 0, y: 4.5, z: -6.5,
  fov: 500
};

function project(x, y, z) {
  // Translate to camera space
  let dx = x - cam.x;
  let dy = y - cam.y;
  let dz = z - cam.z;
  // Perspective divide
  let scale = cam.fov / (cam.fov + dz);
  let sx = W / 2 + dx * scale * (W / 8);
  let sy = H / 2 - dy * scale * (W / 8) + (H * 0.15);
  return { x: sx, y: sy, z: dz, scale: scale };
}

// Tile colors
function getTileColor(val) {
  const hue = (val * 360 / N / N) % 360;
  return `hsl(${hue}, 70%, 50%)`;
}

function getTileColorLight(val) {
  const hue = (val * 360 / N / N) % 360;
  return `hsl(${hue}, 70%, 65%)`;
}

function getTileColorDark(val) {
  const hue = (val * 360 / N / N) % 360;
  return `hsl(${hue}, 70%, 35%)`;
}

// Grid setup
function initGrid() {
  let tiles = [];
  for (let i = 1; i < N * N; i++) tiles.push(i);
  tiles.push(0); // empty
  grid = [tiles.slice(0, N), tiles.slice(N, N*2), tiles.slice(N*2, N*3), tiles.slice(N*3)];
}

function shuffleGrid() {
  initGrid();
  // Do many random valid moves to ensure solvability
  let emptyPos = findEmpty();
  for (let i = 0; i < 500; i++) {
    let dirs = getMoves(emptyPos);
    let dir = dirs[Math.floor(Math.random() * dirs.length)];
    swapTiles(emptyPos, dir);
    emptyPos = dir;
  }
  // Check not already solved
  if (isSolved()) shuffleGrid();
}

function findEmpty() {
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++)
      if (grid[i][j] === 0) return { r: i, c: j };
  return null;
}

function getMoves(pos) {
  let moves = [];
  if (pos.r > 0) moves.push({ r: pos.r - 1, c: pos.c });
  if (pos.r < N-1) moves.push({ r: pos.r + 1, c: pos.c });
  if (pos.c > 0) moves.push({ r: pos.r, c: pos.c - 1 });
  if (pos.c < N-1) moves.push({ r: pos.r, c: pos.c + 1 });
  return moves;
}

function swapTiles(a, b) {
  let tmp = grid[a.r][a.c];
  grid[a.r][a.c] = grid[b.r][b.c];
  grid[b.r][b.c] = tmp;
}

function isSolved() {
  let val = 1;
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++) {
      if (i === N-1 && j === N-1) {
        if (grid[i][j] !== 0) return false;
      } else {
        if (grid[i][j] !== val) return false;
        val++;
      }
    }
  return true;
}

// Rendering
let time = 0;
function render() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);
  
  // Background gradient
  let bgGrad = ctx.createRadialGradient(W/2, H*0.3, 0, W/2, H*0.3, W*0.7);
  bgGrad.addColorStop(0, '#1a1a3e');
  bgGrad.addColorStop(1, '#0f0f1a');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  if (gameState === 'start') {
    drawStartScreen();
  } else {
    drawBoard();
    drawHUD();
    if (won) drawWinScreen();
    drawParticles();
  }
  
  time += 0.016;
  requestAnimationFrame(render);
}

function drawStartScreen() {
  // Title
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  let t = Math.sin(time * 2) * 5;
  ctx.font = `bold ${Math.min(W*0.06, 64)}px 'Segoe UI'`;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#4a9eff';
  ctx.shadowBlur = 20;
  ctx.fillText('3D SLIDE PUZZLE', W/2, H*0.3 + t);
  
  ctx.shadowBlur = 0;
  ctx.font = `${Math.min(W*0.025, 24)}px 'Segoe UI'`;
  ctx.fillStyle = '#aab';
  ctx.fillText('Arrange the tiles in order from 1 to 15', W/2, H*0.45);
  ctx.fillText('Click a tile next to the empty space to slide it', W/2, H*0.52);
  
  // Animated cube preview
  drawPreviewCube();
  
  // Start button
  let btnW = Math.min(W * 0.3, 250);
  let btnH = 55;
  let btnX = W/2 - btnW/2;
  let btnY = H*0.7;
  
  ctx.fillStyle = 'rgba(74, 158, 255, 0.2)';
  ctx.strokeStyle = '#4a9eff';
  ctx.lineWidth = 2;
  roundRect(ctx, btnX, btnY, btnW, btnH, 12);
  ctx.fill();
  ctx.stroke();
  
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(W*0.03, 26)}px 'Segoe UI'`;
  ctx.fillText('START GAME', W/2, btnY + btnH/2);
  
  // Controls
  ctx.font = `${Math.min(W*0.018, 16)}px 'Segoe UI'`;
  ctx.fillStyle = '#667';
  ctx.fillText('Click tiles to move • R to restart', W/2, H*0.88);
  
  ctx.restore();
}

function drawPreviewCube() {
  let cx = W/2;
  let cy = H * 0.62;
  let size = Math.min(W, H) * 0.08;
  let rot = time * 1.5;
  
  let corners = [];
  for (let i = 0; i < 8; i++) {
    let x = (i & 1 ? 1 : -1) * size;
    let y = (i & 2 ? 1 : -1) * size;
    let z = (i & 4 ? 1 : -1) * size;
    // Rotate
    let rx = x * Math.cos(rot) - z * Math.sin(rot);
    let rz = x * Math.sin(rot) + z * Math.cos(rot);
    let ry = y * Math.cos(rot*0.7) - rz * Math.sin(rot*0.7);
    corners.push({ x: cx + rx, y: cy + ry });
  }
  
  // Draw edges
  ctx.strokeStyle = 'rgba(74, 158, 255, 0.6)';
  ctx.lineWidth = 2;
  const edges = [[0,1],[0,2],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7],[4,7]];
  edges.forEach(e => {
    ctx.beginPath();
    ctx.moveTo(corners[e[0]].x, corners[e[0]].y);
    ctx.lineTo(corners[e[1]].x, corners[e[1]].y);
    ctx.stroke();
  });
}

function drawBoard() {
  // Draw board base
  let basePoints = [
    project(-N*0.5 - 0.2, -TILE_H, -N*0.5 - 0.2),
    project(N*0.5 + 0.2, -TILE_H, -N*0.5 - 0.2),
    project(N*0.5 + 0.2, -TILE_H, N*0.5 + 0.2),
    project(-N*0.5 - 0.2, -TILE_H, N*0.5 + 0.2)
  ];
  
  ctx.beginPath();
  ctx.moveTo(basePoints[0].x, basePoints[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(basePoints[i].x, basePoints[i].y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(30, 30, 60, 0.8)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(100, 140, 255, 0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Draw tiles (sorted by depth - back to front)
  let tiles = [];
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      if (grid[i][j] !== 0) {
        tiles.push({ r: i, c: j, val: grid[i][j] });
      }
    }
  }
  
  // Sort by z (back to front) - in our view, larger z is closer
  // Our board: x goes right, z goes "into screen" from camera at z=-6.5
  // So tiles with larger z are farther away -> draw them first
  tiles.sort((a, b) => {
    let za = (a.c - N/2 + 0.5);
    let zb = (b.c - N/2 + 0.5);
    return zb - za; // Farther (larger z from cam) first... 
    // Actually camera is at z=-6.5, so tiles with smaller z are closer
    // Let's sort by row: lower rows (smaller r) are farther in our projection
    return a.r - b.r;
  });
  
  // Redo sort properly - we want to draw back tiles first
  // In our projection, higher z values are farther from camera (camera at z=-6.5)
  // Row index maps to z: row 0 is farthest, row N-1 is closest
  tiles.sort((a, b) => a.r - b.r);
  
  for (let tile of tiles) {
    drawTile(tile.r, tile.c, tile.val);
  }
}

function tileWorldPos(r, c) {
  let x = (c - N/2 + 0.5) * 1.0;
  let z = (r - N/2 + 0.5) * 1.0;
  return { x, y: 0, z };
}

function drawTile(r, c, val) {
  let pos = tileWorldPos(r, c);
  let s = 0.46; // half-size of tile top face
  
  // 8 corners of the box
  let corners3d = [
    { x: pos.x - s, y: 0, z: pos.z - s },
    { x: pos.x + s, y: 0, z: pos.z - s },
    { x: pos.x + s, y: 0, z: pos.z + s },
    { x: pos.x - s, y: 0, z: pos.z + s },
    { x: pos.x - s, y: TILE_H, z: pos.z - s },
    { x: pos.x + s, y: TILE_H, z: pos.z - s },
    { x: pos.x + s, y: TILE_H, z: pos.z + s },
    { x: pos.x - s, y: TILE_H, z: pos.z + s }
  ];
  
  let p = corners3d.map(p => project(p.x, p.y, p.z));
  
  // Top face (4,5,6,7)
  ctx.beginPath();
  ctx.moveTo(p[4].x, p[4].y);
  ctx.lineTo(p[5].x, p[5].y);
  ctx.lineTo(p[6].x, p[6].y);
  ctx.lineTo(p[7].x, p[7].y);
  ctx.closePath();
  ctx.fillStyle = getTileColorLight(val);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();
  
  // Front face (2,3,7,6) - visible if facing camera
  ctx.beginPath();
  ctx.moveTo(p[2].x, p[2].y);
  ctx.lineTo(p[3].x, p[3].y);
  ctx.lineTo(p[7].x, p[7].y);
  ctx.lineTo(p[6].x, p[6].y);
  ctx.closePath();
  ctx.fillStyle = getTileColor(val);
  ctx.fill();
  
  // Right face (1,2,6,5)
  ctx.beginPath();
  ctx.moveTo(p[1].x, p[1].y);
  ctx.lineTo(p[2].x, p[2].y);
  ctx.lineTo(p[6].x, p[6].y);
  ctx.lineTo(p[5].x, p[5].y);
  ctx.closePath();
  ctx.fillStyle = getTileColorDark(val);
  ctx.fill();
  
  // Number on top face
  let cx = (p[4].x + p[5].x + p[6].x + p[7].x) / 4;
  let cy = (p[4].y + p[5].y + p[6].y + p[7].y) / 4;
  let fontSize = Math.min(p[5].x - p[4].x, p[6].y - p[4].y) * 0.5;
  
  ctx.font = `bold ${Math.max(fontSize, 12)}px 'Segoe UI'`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 3;
  ctx.fillText(val.toString(), cx, cy);
  ctx.shadowBlur = 0;
}

function drawHUD() {
  if (gameState !== 'playing' && gameState !== 'won') return;
  
  let elapsed = won ? (endTime - startTime) : ((Date.now() - startTime) / 1000);
  let mins = Math.floor(elapsed / 60);
  let secs = Math.floor(elapsed % 60);
  let timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
  
  ctx.font = `bold ${Math.min(W*0.025, 24)}px 'Segoe UI'`;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText(`Moves: ${moves}`, 20, 35);
  ctx.fillText(`Time: ${timeStr}`, 20, 65);
  
  // Restart hint
  ctx.textAlign = 'right';
  ctx.font = `${Math.min(W*0.018, 16)}px 'Segoe UI'`;
  ctx.fillStyle = '#667';
  ctx.fillText('Press R to restart', W - 20, 35);
}

function drawWinScreen() {
  let elapsed = (endTime - startTime) / 1000;
  let mins = Math.floor(elapsed / 60);
  let secs = Math.floor(elapsed % 60);
  
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Overlay
  ctx.fillStyle = 'rgba(15, 15, 26, 0.7)';
  ctx.fillRect(0, 0, W, H);
  
  ctx.font = `bold ${Math.min(W*0.05, 52)}px 'Segoe UI'`;
  ctx.fillStyle = '#4eff9e';
  ctx.shadowColor = '#4eff9e';
  ctx.shadowBlur = 20;
  ctx.fillText('PUZZLE SOLVED!', W/2, H*0.35);
  
  ctx.shadowBlur = 0;
  ctx.font = `${Math.min(W*0.025, 24)}px 'Segoe UI'`;
  ctx.fillStyle = '#fff';
  ctx.fillText(`Time: ${mins}:${secs.toString().padStart(2,'0')}  |  Moves: ${moves}`, W/2, H*0.48);
  
  // Play again button
  let btnW = Math.min(W * 0.3, 250);
  let btnH = 50;
  let btnX = W/2 - btnW/2;
  let btnY = H*0.6;
  
  ctx.fillStyle = 'rgba(78, 255, 158, 0.15)';
  ctx.strokeStyle = '#4eff9e';
  ctx.lineWidth = 2;
  roundRect(ctx, btnX, btnY, btnW, btnH, 12);
  ctx.fill();
  ctx.stroke();
  
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(W*0.028, 24)}px 'Segoe UI'`;
  ctx.fillText('PLAY AGAIN', W/2, btnY + btnH/2);
  
  ctx.restore();
}

function drawParticles() {
  for (let p of particles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 80%, 60%, ${p.alpha})`;
    ctx.fill();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function spawnParticles() {
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: W/2 + (Math.random() - 0.5) * W * 0.5,
      y: H/2 + (Math.random() - 0.5) * H * 0.3,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4 - 2,
      r: Math.random() * 6 + 2,
      hue: Math.random() * 360,
      alpha: 1
    });
  }
}

function updateParticles() {
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.alpha -= 0.015;
  }
  particles = particles.filter(p => p.alpha > 0);
}

// Input handling
let endTime = 0;

function startGame() {
  initAudio();
  gameState = 'playing';
  won = false;
  moves = 0;
  startTime = Date.now();
  animating = false;
  particles = [];
  shuffleGrid();
}

function handleClick(mx, my) {
  if (gameState === 'start') {
    // Check start button
    let btnW = Math.min(W * 0.3, 250);
    let btnH = 55;
    let btnX = W/2 - btnW/2;
    let btnY = H*0.7;
    if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
      playClickSound();
      startGame();
    }
    return;
  }
  
  if (gameState === 'won') {
    let btnW = Math.min(W * 0.3, 250);
    let btnH = 50;
    let btnX = W/2 - btnW/2;
    let btnY = H*0.6;
    if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
      playClickSound();
      startGame();
    }
    return;
  }
  
  if (gameState !== 'playing' || animating) return;
  
  // Find clicked tile
  let emptyPos = findEmpty();
  
  // Check all tiles adjacent to empty
  let adjMoves = getMoves(emptyPos);
  
  for (let m of adjMoves) {
    let pos = tileWorldPos(m.r, m.c);
    let s = 0.46;
    
    // Project top face corners
    let tl = project(pos.x - s, TILE_H, pos.z - s);
    let tr = project(pos.x + s, TILE_H, pos.z - s);
    let br = project(pos.x + s, TILE_H, pos.z + s);
    let bl = project(pos.x - s, TILE_H, pos.z + s);
    
    if (pointInQuad(mx, my, tl, tr, br, bl)) {
      // Move this tile to empty position
      playSlideSound();
      swapTiles(emptyPos, m);
      moves++;
      
      // Check win
      if (isSolved()) {
        won = true;
        gameState = 'won';
        endTime = Date.now();
        spawnParticles();
        playWinSound();
      }
      return;
    }
  }
}

function pointInQuad(px, py, a, b, c, d) {
  // Check if point is inside quadrilateral using cross product / winding
  function sign(o1, o2, o3) {
    return (o2.x - o1.x) * (o3.y - o1.y) - (o3.x - o1.x) * (o2.y - o1.y);
  }
  let d1 = sign(a, b, {x:px, y:py});
  let d2 = sign(b, c, {x:px, y:py});
  let d3 = sign(c, d, {x:px, y:py});
  let d4 = sign(d, a, {x:px, y:py});
  let hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0) || (d4 < 0);
  let hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0) || (d4 > 0);
  return !(hasNeg && hasPos);
}

// Event listeners
canvas.addEventListener('click', (e) => {
  let rect = canvas.getBoundingClientRect();
  let mx = e.clientX - rect.left;
  let my = e.clientY - rect.top;
  handleClick(mx, my);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    if (gameState === 'playing' || gameState === 'won') {
      playClickSound();
      startGame();
    }
  }
  if (e.key === 'Enter' || e.key === ' ') {
    if (gameState === 'start') {
      initAudio();
      playClickSound();
      startGame();
    } else if (gameState === 'won') {
      playClickSound();
      startGame();
    }
  }
});

// Main loop with particle update
function gameLoop() {
  updateParticles();
  requestAnimationFrame(gameLoop);
}

// Start
initGrid();
render();
gameLoop();
</script>
</body>
</html>
