<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('pinballSnakeHigh') || '0'); } catch(e) {}

let snakeHead = { x: 0, y: 0, vx: 0, vy: 0 };
let body = [];
let bumpers = [];
let foods = [];
let particles = [];
let flippers = { left: false, right: false };
let flipperAnim = { left: 0, right: 0 };
let launchTimer = 0;
let launched = false;
let frameCount = 0;

const BODY_MAX = 30;
const FOOD_SIZE = 8;
const BUMP_RADIUS = 25;
const FLIPPER_LEN = 70;
const BALL_R = 10;

function initGame() {
    score = 0;
    lives = 3;
    resetBall();
    state = 'playing';
}

function resetBall() {
    snakeHead.x = W / 2;
    snakeHead.y = H - 60;
    snakeHead.vx = (Math.random() - 0.5) * 4;
    snakeHead.vy = -8;
    body = [];
    launched = true;
}

function initBumpers() {
    bumpers = [
        { x: W * 0.3, y: H * 0.25, r: BUMP_RADIUS },
        { x: W * 0.7, y: H * 0.25, r: BUMP_RADIUS },
        { x: W * 0.5, y: H * 0.4, r: BUMP_RADIUS },
        { x: W * 0.2, y: H * 0.5, r: BUMP_RADIUS - 5 },
        { x: W * 0.8, y: H * 0.5, r: BUMP_RADIUS - 5 }
    ];
}

function initFoods() {
    foods = [];
    for (let i = 0; i < 3; i++) spawnFood();
}

function spawnFood() {
    let fx, fy, attempts = 0;
    do {
        fx = 40 + Math.random() * (W - 80);
        fy = 40 + Math.random() * (H * 0.6);
        attempts++;
    } while (attempts < 50 && foods.some(f => Math.hypot(f.x - fx, f.y - fy) < 40));
    foods.push({ x: fx, y: fy, pulse: 0 });
}

function getFlipperLeft() {
    const baseX = W * 0.15;
    const baseY = H - 20;
    const angle = flippers.left ? -Math.PI / 3 : Math.PI / 6;
    return { x: baseX, y: baseY, angle, len: FLIPPER_LEN };
}

function getFlipperRight() {
    const baseX = W * 0.85;
    const baseY = H - 20;
    const angle = flippers.right ? Math.PI / 3 : -Math.PI / 6;
    return { x: baseX, y: baseY, angle, len: FLIPPER_LEN };
}

function distToSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    let t = ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy;
    return { dist: Math.hypot(px - cx, py - cy), nx: (px - cx) / Math.hypot(px - cx, py - cy) || 1, ny: (py - cy) / Math.hypot(px - cx, py - cy) || -1 };
}

function addParticle(x, y, color) {
    for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 2 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, color });
    }
}

function update() {
    if (state !== 'playing') return;
    
    frameCount++;
    
    // Flipper animation
    flipperAnim.left += (flippers.left ? 1 : -1) * 0.2;
    flipperAnim.right += (flippers.right ? 1 : -1) * 0.2;
    flipperAnim.left = Math.max(0, Math.min(1, flipperAnim.left));
    flipperAnim.right = Math.max(0, Math.min(1, flipperAnim.right));
    
    // Move snake head
    snakeHead.x += snakeHead.vx;
    snakeHead.y += snakeHead.vy;
    
    // Wall bounces
    if (snakeHead.x < BALL_R) { snakeHead.x = BALL_R; snakeHead.vx = Math.abs(snakeHead.vx); }
    if (snakeHead.x > W - BALL_R) { snakeHead.x = W - BALL_R; snakeHead.vx = -Math.abs(snakeHead.vx); }
    if (snakeHead.y < BALL_R) { snakeHead.y = BALL_R; snakeHead.vy = Math.abs(snakeHead.vy); }
    
    // Bumper collisions
    for (let b of bumpers) {
        const dx = snakeHead.x - b.x;
        const dy = snakeHead.y - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < BALL_R + b.r) {
            const nx = dx / dist, ny = dy / dist;
            snakeHead.x = b.x + nx * (BALL_R + b.r + 1);
            snakeHead.y = b.y + ny * (BALL_R + b.r + 1);
            const dot = snakeHead.vx * nx + snakeHead.vy * ny;
            snakeHead.vx -= 2.5 * dot * nx;
            snakeHead.vy -= 2.5 * dot * ny;
            // Speed boost
            const speed = Math.hypot(snakeHead.vx, snakeHead.vy);
            if (speed < 10) {
                snakeHead.vx *= 10 / speed;
                snakeHead.vy *= 10 / speed;
            }
            score += 50;
            addParticle(b.x, b.y, '#ff6600');
        }
    }
    
    // Flipper collisions
    const fl = getFlipperLeft();
    const flx2 = fl.x + Math.cos(fl.angle) * fl.len;
    const fly2 = fl.y + Math.sin(fl.angle) * fl.len;
    let hitLeft = false;
    if (flippers.left) {
        const d = distToSegment(snakeHead.x, snakeHead.y, fl.x, fl.y, flx2, fly2);
        if (d.dist < BALL_R + 6) {
            snakeHead.vx = Math.abs(snakeHead.vx) * 0.5 + 3;
            snakeHead.vy = -(8 + Math.random() * 4);
            hitLeft = true;
            addParticle(snakeHead.x, snakeHead.y, '#00ff88');
        }
    }
    
    const fr = getFlipperRight();
    const frx2 = fr.x + Math.cos(fr.angle) * fr.len;
    const fry2 = fr.y + Math.sin(fr.angle) * fr.len;
    if (flippers.right) {
        const d = distToSegment(snakeHead.x, snakeHead.y, fr.x, fr.y, frx2, fry2);
        if (d.dist < BALL_R + 6) {
            snakeHead.vx = -Math.abs(snakeHead.vx) * 0.5 - 3;
            snakeHead.vy = -(8 + Math.random() * 4);
            addParticle(snakeHead.x, snakeHead.y, '#00ff88');
        }
    }
    
    // Food collection
    for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        f.pulse += 0.1;
        if (Math.hypot(snakeHead.x - f.x, snakeHead.y - f.y) < BALL_R + FOOD_SIZE) {
            score += 10;
            addParticle(f.x, f.y, '#ffcc00');
            foods.splice(i, 1);
            spawnFood();
        }
    }
    
    // Drain (ball falls below)
    if (snakeHead.y > H + BALL_R) {
        lives--;
        if (lives <= 0) {
            state = 'gameover';
            try { localStorage.setItem('pinballSnakeHigh', String(highScore)); } catch(e) {}
        } else {
            resetBall();
        }
    }
    
    // Body trail
    body.unshift({ x: snakeHead.x, y: snakeHead.y });
    if (body.length > BODY_MAX) body.pop();
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Speed limit
    const spd = Math.hypot(snakeHead.vx, snakeHead.vy);
    if (spd > 12) {
        snakeHead.vx *= 12 / spd;
        snakeHead.vy *= 12 / spd;
    }
    if (spd < 3) {
        const a = Math.random() * Math.PI * 2;
        snakeHead.vx += Math.cos(a) * 0.5;
        snakeHead.vy += Math.sin(a) * 0.5 - 0.5;
    }
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Grid background
    ctx.strokeStyle = 'rgba(40, 60, 120, 0.3)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    
    if (state === 'start') {
        drawStartScreen();
        return;
    }
    
    // Draw bumpers
    for (let b of bumpers) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, '#ff6633');
        grad.addColorStop(0.7, '#cc3300');
        grad.addColorStop(1, '#882200');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ff9966';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Inner ring
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,200,150,0.5)';
        ctx.stroke();
    }
    
    // Draw foods
    for (let f of foods) {
        const s = FOOD_SIZE + Math.sin(f.pulse) * 2;
        const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, s);
        grad.addColorStop(0, '#ffff88');
        grad.addColorStop(1, '#ffaa00');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(f.x, f.y, s, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Draw particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Draw body (snake segments)
    for (let i = body.length - 1; i >= 0; i--) {
        const seg = body[i];
        const t = i / body.length;
        const r = Math.max(3, BALL_R * (1 - t * 0.6));
        const hue = 120 + t * 60;
        ctx.fillStyle = `hsl(${hue}, 80%, ${40 + (1-t) * 20}%)`;
        ctx.beginPath();
        ctx.arc(seg.x, seg.y, r, 0, Math.PI * 2);
        ctx.fill();
        
        // Pattern on body
        if (i % 3 === 0 && i > 5) {
            ctx.fillStyle = `hsl(${hue}, 60%, ${25}%)`;
            ctx.beginPath();
            ctx.arc(seg.x, seg.y, r * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    // Draw snake head (the pinball)
    const grad = ctx.createRadialGradient(snakeHead.x - 3, snakeHead.y - 3, 0, snakeHead.x, snakeHead.y, BALL_R);
    grad.addColorStop(0, '#88ff88');
    grad.addColorStop(1, '#22aa44');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(snakeHead.x, snakeHead.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#aaffaa';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Eyes on head
    const lookX = snakeHead.vx / spd() * 3;
    const lookY = snakeHead.vy / spd() * 3;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(snakeHead.x + lookX - 3, snakeHead.y + lookY - 2, 3, 0, Math.PI * 2);
    ctx.arc(snakeHead.x + lookX + 3, snakeHead.y + lookY - 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(snakeHead.x + lookX - 3, snakeHead.y + lookY - 2, 1.5, 0, Math.PI * 2);
    ctx.arc(snakeHead.x + lookX + 3, snakeHead.y + lookY - 2, 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Draw flippers
    drawFlipper('left');
    drawFlipper('right');
    
    // Bottom danger zone
    ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
    ctx.fillRect(0, H - 15, W, 15);
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.textAlign = 'right';
    ctx.fillText(`BALLS: ${'🎱'.repeat(lives) || ''}`, W - 20, 35);
    ctx.fillStyle = '#888';
    ctx.font = '14px monospace';
    ctx.fillText(`HIGH: ${Math.max(highScore, score)}`, W - 20, 55);
    
    if (state === 'gameover') {
        drawGameOver();
    }
}

function spd() { return Math.hypot(snakeHead.vx, snakeHead.vy) || 1; }

function drawFlipper(side) {
    const f = side === 'left' ? getFlipperLeft() : getFlipperRight();
    const x2 = f.x + Math.cos(f.angle) * f.len;
    const y2 = f.y + Math.sin(f.angle) * f.len;
    
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    
    ctx.strokeStyle = '#88ffee';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    const grad = ctx.createLinearGradient(W/2 - 150, 0, W/2 + 150, 0);
    grad.addColorStop(0, '#00ff88');
    grad.addColorStop(1, '#00aaff');
    ctx.fillStyle = grad;
    ctx.fillText('PINBALL SNAKE', W / 2, H * 0.25);
    
    // Snake icon
    for (let i = 0; i < 8; i++) {
        const sx = W/2 - 60 + i * 17;
        const sy = H * 0.35 + Math.sin(i * 0.7) * 10;
        ctx.fillStyle = `hsl(${120 + i*10}, 80%, ${40+i*3}%)`;
        ctx.beginPath();
        ctx.arc(sx, sy, 12 - i, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaddff';
    ctx.fillText('Guide your snake with the flippers!', W / 2, H * 0.45);
    ctx.fillText('Bounce off bumpers to score points.', W / 2, H * 0.5);
    ctx.fillText('Collect food pellets to grow.', W / 2, H * 0.55);
    ctx.fillText("Don't let your snake drain out the bottom!", W / 2, H * 0.6);
    
    ctx.fillStyle = '#888';
    ctx.font = '16px monospace';
    ctx.fillText('[A] or [←]  =  Left Flipper', W / 2, H * 0.7);
    ctx.fillText('[D] or [→]  =  Right Flipper', W / 2, H * 0.75);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px monospace';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('PRESS SPACE TO START', W / 2, H * 0.88);
    
    if (highScore > 0) {
        ctx.font = '14px monospace';
        ctx.fillStyle = '#ffcc00';
        ctx.fillText(`High Score: ${highScore}`, W / 2, H * 0.93);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px monospace';
    ctx.fillStyle = '#ff4444';
    ctx.fillText('GAME OVER', W / 2, H * 0.35);
    
    ctx.font = '24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.45);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.fillText('★ NEW HIGH SCORE! ★', W / 2, H * 0.52);
    }
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaddff';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('Press SPACE to play again', W / 2, H * 0.65);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playBounce(freq, dur) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

function playScore() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function playDrain() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 200;
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

// Input
window.addEventListener('keydown', (e) => {
    if (!audioCtx) initAudio();
    
    if (state === 'start' && e.code === 'Space') {
        initGame();
        return;
    }
    if (state === 'gameover' && e.code === 'Space') {
        state = 'playing';
        initGame();
        return;
    }
    
    if (state === 'playing') {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') flippers.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') flippers.right = true;
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') flippers.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') flippers.right = false;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    if (!audioCtx) initAudio();
    if (state === 'start' || state === 'gameover') {
        initGame();
        return;
    }
    e.preventDefault();
    for (let t of e.touches) {
        if (t.clientX < W / 2) flippers.left = true;
        else flippers.right = true;
    }
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    flippers.left = false;
    flippers.right = false;
});

// Init
initBumpers();
initFoods();
gameLoop();
</script>
</body>
</html>
