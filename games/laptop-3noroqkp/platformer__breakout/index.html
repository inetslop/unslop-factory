<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platformer Breakout</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, type, duration, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function sfxBounce() { playSound(220, 'square', 0.1, 0.2); }
function sfxBlock() { playSound(440, 'triangle', 0.15, 0.3); }
function sfxBreak() { playSound(660, 'sawtooth', 0.2, 0.25); }
function sfxLose() { playSound(110, 'sawtooth', 0.5, 0.4); }
function sfxWin() { playSound(880, 'triangle', 0.3, 0.3); setTimeout(() => playSound(1100, 'triangle', 0.4, 0.3), 150); }

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let level = 1;
let particles = [];
let shakeTime = 0;
let shakeIntensity = 0;

// Player
const player = {
    x: 0, y: 0, w: 40, h: 50,
    vx: 0, vy: 0,
    speed: 6, jumpPower: -13,
    onGround: false,
    facing: 1,
    squash: 1,
    eyeBlink: 0
};

// Ball
const ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, speed: 6 };

// Blocks
let blocks = [];
const BLOCK_COLS = 10;
const BLOCK_ROWS = 5;
const BLOCK_PAD = 4;

function createBlocks() {
    blocks = [];
    const marginX = Math.max(20, W * 0.08);
    const blockW = (W - marginX * 2) / BLOCK_COLS;
    const blockH = Math.min(30, H * 0.04);
    const startY = Math.max(50, H * 0.06);
    
    for (let r = 0; r < BLOCK_ROWS; r++) {
        for (let c = 0; c < BLOCK_COLS; c++) {
            blocks.push({
                x: marginX + c * blockW,
                y: startY + r * (blockH + BLOCK_PAD),
                w: blockW - BLOCK_PAD,
                h: blockH,
                alive: true,
                hp: r < 2 ? 2 : 1,
                maxHp: r < 2 ? 2 : 1,
                color: getBlockColor(r, c),
                crackAlpha: 0
            });
        }
    }
}

function getBlockColor(row, col) {
    const palette = [
        ['#ff4444', '#cc2222'],
        ['#ff8833', '#cc6611'],
        ['#ffdd33', '#cc9911'],
        ['#44ff88', '#22cc55'],
        ['#44aaff', '#2277cc']
    ];
    const rowColors = [[0,1],[1,2],[2,3],[3,4],[4,0]];
    const [hi, lo] = palette[row % 5];
    return hi;
}

function resetBall() {
    ball.x = W / 2;
    ball.y = H * 0.75;
    const angle = -Math.PI / 4 + (Math.random() - 0.5) * 0.5;
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
}

function resetPlayer() {
    player.x = W / 2 - player.w / 2;
    player.y = H - player.h - 10;
    player.vx = 0;
    player.vy = 0;
    player.onGround = true;
}

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    ball.speed = 6;
    particles = [];
    createBlocks();
    resetPlayer();
    resetBall();
    gameState = 'playing';
}

function nextLevel() {
    level++;
    ball.speed = Math.min(10, 5 + level);
    blocks.forEach(b => { b.alive = true; b.hp = b.maxHp; b.crackAlpha = 0; });
    resetBall();
    particles = [];
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if ((gameState === 'gameover' || gameState === 'win') && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
        initAudio();
        startGame();
    }
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            size: 3 + Math.random() * 4,
            color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Update
function update() {
    if (gameState !== 'playing') return;
    
    // Player movement
    let moveX = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) { moveX = -player.speed; player.facing = -1; }
    if (keys['ArrowRight'] || keys['KeyD']) { moveX = player.speed; player.facing = 1; }
    
    player.vx = moveX;
    player.vy += 0.7; // gravity
    
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
        player.squash = 1.3;
        sfxBounce();
    }
    
    player.x += player.vx;
    player.y += player.vy;
    
    // Ground collision
    const groundY = H - 10;
    if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
        player.squash = Math.max(player.squash, 0.7);
    } else {
        player.onGround = false;
    }
    
    // Walls
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;
    
    // Squash animation
    player.squash += (1 - player.squash) * 0.2;
    player.eyeBlink = (player.eyeBlink + 0.05) % (Math.PI * 2);
    
    // Ball physics
    ball.x += ball.vx;
    ball.y += ball.vy;
    
    // Ball wall collisions
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sfxBounce(); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sfxBounce(); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); sfxBounce(); }
    
    // Ball-player collision
    if (rectCircleCollision(player.x, player.y, player.w, player.h, ball.x, ball.y, ball.r)) {
        // Determine bounce direction based on where ball hits player
        const relX = ball.x - (player.x + player.w / 2);
        const relY = ball.y - (player.y + player.h / 2);
        
        if (relY < 0) {
            // Ball above player - bounce up
            const angle = Math.atan2(relX, -relY);
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            ball.vx = Math.sin(angle) * speed;
            ball.vy = -Math.cos(angle) * speed;
        } else if (relY > 0 && relX !== 0) {
            // Ball below player - bounce down and out
            const angle = Math.atan2(relX, relY);
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            ball.vx = Math.sin(angle) * speed;
            ball.vy = Math.cos(angle) * speed;
        } else {
            // Side hit
            ball.vx = relX > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
            ball.vy = -Math.abs(ball.vy);
        }
        
        sfxBounce();
    }
    
    // Ball-block collisions
    for (let b of blocks) {
        if (!b.alive) continue;
        if (rectCircleCollision(b.x, b.y, b.w, b.h, ball.x, ball.y, ball.r)) {
            b.hp--;
            if (b.hp <= 0) {
                b.alive = false;
                score += 10 * level;
                sfxBreak();
                spawnParticles(ball.x, ball.y, b.color, 8);
                shakeTime = 5;
                shakeIntensity = 3;
            } else {
                b.crackAlpha = 1;
                sfxBlock();
            }
            
            // Bounce ball
            const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
            const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
            
            if (overlapX < overlapY) {
                ball.vx = -ball.vx;
                ball.x += ball.vx > 0 ? -ball.r : ball.r;
            } else {
                ball.vy = -ball.vy;
                ball.y += ball.vy > 0 ? -ball.r : ball.r;
            }
            
            break;
        }
    }
    
    // Ball falls below
    if (ball.y - ball.r > H) {
        lives--;
        sfxLose();
        shakeTime = 15;
        shakeIntensity = 6;
        if (lives <= 0) {
            gameState = 'gameover';
        } else {
            resetBall();
            resetPlayer();
        }
    }
    
    // Check win
    const remaining = blocks.filter(b => b.alive).length;
    if (remaining === 0) {
        sfxWin();
        score += 100 * level;
        if (level >= 3) {
            gameState = 'win';
        } else {
            nextLevel();
        }
    }
    
    // Update particles
    updateParticles();
    
    // Shake decay
    if (shakeTime > 0) shakeTime--;
}

function rectCircleCollision(rx, ry, rw, rh, cx, cy, cr) {
    const dx = cx - Math.max(rx, Math.min(cx, rx + rw));
    const dy = cy - Math.max(ry, Math.min(cy, ry + rh));
    return dx * dx + dy * dy < cr * cr;
}

// Render
function render() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }
    
    // Background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#1a1a3e');
    bgGrad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-10, -10, W + 20, H + 20);
    
    // Stars
    for (let i = 0; i < 30; i++) {
        const sx = ((i * 137.5) % W);
        const sy = ((i * 97.3) % (H * 0.5));
        const brightness = 0.3 + 0.3 * Math.sin(Date.now() * 0.001 + i);
        ctx.fillStyle = `rgba(255,255,255,${brightness})`;
        ctx.fillRect(sx, sy, 2, 2);
    }
    
    if (gameState === 'start') {
        renderStartScreen();
    } else {
        // Ground
        ctx.fillStyle = '#2a2a4a';
        ctx.fillRect(0, H - 10, W, 10);
        ctx.fillStyle = '#3a3a6a';
        ctx.fillRect(0, H - 10, W, 3);
        
        // Blocks
        for (let b of blocks) {
            if (!b.alive) continue;
            const alpha = b.hp < b.maxHp ? 0.7 : 1;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.w, b.h);
            
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 3);
            
            // Crack effect
            if (b.hp < b.maxHp && b.alive) {
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(b.x + b.w * 0.3, b.y);
                ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.4);
                ctx.lineTo(b.x + b.w * 0.7, b.y + b.h * 0.6);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }
        
        // Ball
        const ballGrad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r);
        ballGrad.addColorStop(0, '#ffffff');
        ballGrad.addColorStop(0.5, '#ffdd44');
        ballGrad.addColorStop(1, '#ff8800');
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        
        // Ball glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffaa00';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Player
        renderPlayer();
        
        // Particles
        for (let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size * p.life, p.size * p.life);
        }
        ctx.globalAlpha = 1;
        
        // HUD
        renderHUD();
        
        if (gameState === 'gameover') renderGameOver();
        if (gameState === 'win') renderWin();
    }
    
    ctx.restore();
}

function renderPlayer() {
    const px = player.x;
    const py = player.y;
    const pw = player.w;
    const ph = player.h;
    const squashX = 1 / player.squash;
    const squashY = player.squash;
    
    ctx.save();
    ctx.translate(px + pw / 2, py + ph);
    ctx.scale(squashX, squashY);
    ctx.translate(-(px + pw / 2), -(py + ph));
    
    // Body
    const bodyGrad = ctx.createLinearGradient(px, py, px, py + ph);
    bodyGrad.addColorStop(0, '#4488ff');
    bodyGrad.addColorStop(1, '#2255cc');
    ctx.fillStyle = bodyGrad;
    
    // Rounded rect body
    const r = 8;
    ctx.beginPath();
    ctx.moveTo(px + r, py);
    ctx.lineTo(px + pw - r, py);
    ctx.quadraticCurveTo(px + pw, py, px + pw, py + r);
    ctx.lineTo(px + pw, py + ph - r);
    ctx.quadraticCurveTo(px + pw, py + ph, px + pw - r, py + ph);
    ctx.lineTo(px + r, py + ph);
    ctx.quadraticCurveTo(px, py + ph, px, py + ph - r);
    ctx.lineTo(px, py + r);
    ctx.quadraticCurveTo(px, py, px + r, py);
    ctx.closePath();
    ctx.fill();
    
    // Face
    const eyeY = py + 15;
    const blinkScale = (player.eyeBlink > Math.PI * 0.9 && player.eyeBlink < Math.PI) ? 0.2 : 1;
    
    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(px + pw * 0.3, eyeY, 6, 0, Math.PI * 2);
    ctx.arc(px + pw * 0.7, eyeY, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupils
    ctx.fillStyle = '#111';
    const pupilOffX = player.facing * 2;
    ctx.beginPath();
    ctx.arc(px + pw * 0.3 + pupilOffX, eyeY + 1, 3, 0, Math.PI * 2);
    ctx.arc(px + pw * 0.7 + pupilOffX, eyeY + 1, 3, 0, Math.PI * 2);
    ctx.fill();
    
    // Mouth (smile)
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px + pw / 2, py + 28, 8, 0.2, Math.PI - 0.2);
    ctx.stroke();
    
    // Antenna
    ctx.strokeStyle = '#ffdd44';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px + pw / 2, py);
    ctx.lineTo(px + pw / 2, py - 10);
    ctx.stroke();
    ctx.fillStyle = '#ffdd44';
    ctx.beginPath();
    ctx.arc(px + pw / 2, py - 12, 3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function renderHUD() {
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 30);
    ctx.fillText(`LEVEL: ${level}`, 15, 52);
    
    // Lives as hearts
    for (let i = 0; i < lives; i++) {
        drawHeart(W - 40 - i * 30, 20, 10);
    }
}

function drawHeart(x, y, size) {
    ctx.fillStyle = '#ff4466';
    ctx.beginPath();
    ctx.moveTo(x, y + size / 4);
    ctx.quadraticCurveTo(x - size / 2, y - size / 2, x, y + size / 4);
    ctx.quadraticCurveTo(x + size / 2, y - size / 2, x, y + size / 4);
    ctx.fill();
    
    // Better heart
    ctx.beginPath();
    const s = size;
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y - s * 0.3, x - s * 0.8, y + s * 0.1, x, y + s * 0.6);
    ctx.bezierCurveTo(x + s * 0.8, y + s * 0.1, x + s * 0.5, y - s * 0.3, x, y + s * 0.3);
    ctx.fill();
}

function renderStartScreen() {
    ctx.textAlign = 'center';
    
    // Title
    ctx.font = 'bold 48px monospace';
    const titleGrad = ctx.createLinearGradient(W/2 - 150, 0, W/2 + 150, 0);
    titleGrad.addColorStop(0, '#ff4444');
    titleGrad.addColorStop(0.5, '#ffdd33');
    titleGrad.addColorStop(1, '#44aaff');
    ctx.fillStyle = titleGrad;
    ctx.fillText('PLATFORMER', W / 2, H * 0.25);
    ctx.fillText('BREAKOUT', W / 2, H * 0.25 + 55);
    
    // Instructions
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaaacc';
    ctx.fillText('Move: ← → or A D', W / 2, H * 0.45);
    ctx.fillText('Jump: SPACE / W / ↑', W / 2, H * 0.45 + 30);
    ctx.fillText('Hit the ball to break all blocks!', W / 2, H * 0.45 + 70);
    ctx.fillText('Don\'t let it fall below you!', W / 2, H * 0.45 + 100);
    
    // Start prompt
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('Press SPACE or ENTER to Start', W / 2, H * 0.75);
    ctx.globalAlpha = 1;
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#ff4444';
    ctx.fillText('GAME OVER', W / 2, H * 0.35);
    
    ctx.font = '24px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.5);
    
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
    ctx.globalAlpha = pulse;
    ctx.font = '20px monospace';
    ctx.fillText('Press SPACE to Restart', W / 2, H * 0.65);
    ctx.globalAlpha = 1;
}

function renderWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    const winGrad = ctx.createLinearGradient(W/2 - 150, 0, W/2 + 150, 0);
    winGrad.addColorStop(0, '#ffdd33');
    winGrad.addColorStop(1, '#44ff88');
    ctx.fillStyle = winGrad;
    ctx.fillText('YOU WIN!', W / 2, H * 0.35);
    
    ctx.font = '24px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.5);
    
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.004);
    ctx.globalAlpha = pulse;
    ctx.font = '20px monospace';
    ctx.fillText('Press SPACE to Play Again', W / 2, H * 0.65);
    ctx.globalAlpha = 1;
}

// Main loop
function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

createBlocks();
resetPlayer();
gameLoop();
</script>
</body>
</html>
