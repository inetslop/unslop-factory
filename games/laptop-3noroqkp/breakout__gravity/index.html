<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout Gravity</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let state = 'start'; // start, playing, ballLaunched, gameOver, win
let score = 0;
let lives = 3;
let level = 1;
let particles = [];
let debris = [];
let blocks = [];
let time = 0;

// Paddle
const paddle = { w: 120, h: 18, y: 0, x: 0, speed: 8 };

// Ball
const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0, gravity: 0.35, maxSpeed: 12 };

// Input
let mouseX = W / 2;
let keys = {};
let mouseDown = false;

window.addEventListener('mousemove', e => { mouseX = e.clientX; });
window.addEventListener('mousedown', e => {
    initAudio();
    mouseDown = true;
    if (state === 'start') startGame();
    else if (state === 'ballLaunched' || state === 'playing') launchBall();
    else if (state === 'gameOver' || state === 'win') restart();
});
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if ((state === 'ballLaunched' || state === 'playing') && (e.code === 'Space' || e.code === 'Enter')) launchBall();
    else if ((state === 'gameOver' || state === 'win') && (e.code === 'KeyR' || e.code === 'Space' || e.code === 'Enter')) restart();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    particles = [];
    debris = [];
    state = 'ballLaunched';
    resetLevel();
}

function restart() {
    score = 0;
    lives = 3;
    level = 1;
    particles = [];
    debris = [];
    state = 'ballLaunched';
    resetLevel();
}

function resetLevel() {
    paddle.y = H - 50;
    paddle.x = W / 2 - paddle.w / 2;
    ball.x = W / 2;
    ball.y = paddle.y - ball.r - 5;
    ball.vx = 0;
    ball.vy = 0;
    generateBlocks();
}

function launchBall() {
    if (state === 'ballLaunched') {
        state = 'playing';
        ball.vx = (Math.random() - 0.5) * 4;
        ball.vy = -8;
        playSound(440, 0.1, 'sine', 0.1);
    }
}

function generateBlocks() {
    blocks = [];
    const rows = Math.min(3 + level, 7);
    const cols = Math.min(6 + level, 12);
    const bw = Math.min(70, (W - 80) / cols);
    const bh = 28;
    const startX = (W - cols * (bw + 5)) / 2;
    const startY = 60;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let hp = 1;
            if (level > 2 && (r + c) % 3 === 0) hp = 2;
            blocks.push({
                x: startX + c * (bw + 5),
                y: startY + r * (bh + 5),
                w: bw,
                h: bh,
                hp: hp,
                maxHp: hp,
                color: getBlockColor(r, rows)
            });
        }
    }
}

function getBlockColor(row, totalRows) {
    const hue = 180 + (row / Math.max(totalRows - 1, 1)) * 120;
    return `hsl(${hue}, 70%, 50%)`;
}

function update() {
    if (state === 'start') return;

    // Paddle movement
    if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed;
    if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(W - paddle.w, mouseX - paddle.w / 2));
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    if (state === 'ballLaunched') {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 5;
        return;
    }

    if (state !== 'playing') return;

    // Ball physics with gravity
    ball.vy += ball.gravity;
    ball.vx *= 0.999; // slight air resistance
    ball.vy = Math.max(-ball.maxSpeed, Math.min(ball.maxSpeed, ball.vy));
    ball.vx = Math.max(-ball.maxSpeed, Math.min(ball.maxSpeed, ball.vx));

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall collisions
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); playSound(300, 0.05, 'square', 0.1); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); playSound(300, 0.05, 'square', 0.1); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playSound(300, 0.05, 'square', 0.1); }

    // Paddle collision
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        ball.y = paddle.y - ball.r;
        // Angle based on where it hits the paddle
        const hitPos = (ball.x - paddle.x) / paddle.w - 0.5;
        ball.vx = hitPos * 10;
        ball.vy = -Math.abs(8 + Math.random() * 2);
        playSound(600, 0.05, 'sine', 0.15);
    }

    // Block collisions
    for (let i = blocks.length - 1; i >= 0; i--) {
        const b = blocks[i];
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {

            // Determine bounce direction
            const overlapL = ball.x + ball.r - b.x;
            const overlapR = b.x + b.w - (ball.x - ball.r);
            const overlapT = ball.y + ball.r - b.y;
            const overlapB = b.y + b.h - (ball.y - ball.r);
            const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);

            if (minOverlap === overlapT || minOverlap === overlapB) {
                ball.vy = -ball.vy;
            } else {
                ball.vx = -ball.vx;
            }

            b.hp--;
            playSound(800 + Math.random() * 200, 0.1, 'square', 0.12);

            if (b.hp <= 0) {
                blocks.splice(i, 1);
                score += 10 * level;
                spawnDebris(b);
                spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color, 8);
            } else {
                playSound(500, 0.05, 'triangle', 0.1);
            }

            break; // one block per frame
        }
    }

    // Ball lost
    if (ball.y - ball.r > H) {
        lives--;
        playSound(200, 0.3, 'sawtooth', 0.2);
        if (lives <= 0) {
            state = 'gameOver';
        } else {
            state = 'ballLaunched';
        }
    }

    // Check win
    if (blocks.length === 0) {
        level++;
        if (level > 5) {
            state = 'win';
        } else {
            resetLevel();
            state = 'ballLaunched';
        }
    }

    // Update debris
    for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i];
        d.vy += 0.4;
        d.x += d.vx;
        d.y += d.vy;
        d.rot += d.rotSpeed;
        d.alpha -= 0.015;
        if (d.alpha <= 0 || d.y > H + 50) debris.splice(i, 1);
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function spawnDebris(block) {
    for (let i = 0; i < 4; i++) {
        debris.push({
            x: block.x + Math.random() * block.w,
            y: block.y + Math.random() * block.h,
            w: 8 + Math.random() * 12,
            h: 6 + Math.random() * 8,
            vx: (Math.random() - 0.5) * 4,
            vy: -2 - Math.random() * 3,
            rot: 0,
            rotSpeed: (Math.random() - 0.5) * 0.3,
            alpha: 1,
            color: block.color
        });
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 1,
            color: color
        });
    }
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars background
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137.5 + time * 0.02) % W;
        const sy = (i * 97.3) % H;
        ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 3) * 0.15})`;
        ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    if (state === 'start') {
        drawStartScreen();
        return;
    }

    // Draw debris
    for (const d of debris) {
        ctx.save();
        ctx.globalAlpha = d.alpha;
        ctx.translate(d.x + d.w / 2, d.y + d.h / 2);
        ctx.rotate(d.rot);
        ctx.fillStyle = d.color;
        ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
        ctx.restore();
    }

    // Draw blocks
    for (const b of blocks) {
        ctx.fillStyle = b.color;
        ctx.globalAlpha = b.hp / b.maxHp;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        if (b.maxHp > 1 && b.hp < b.maxHp) {
            ctx.strokeStyle = 'rgba(255,100,100,0.5)';
            ctx.beginPath();
            ctx.moveTo(b.x + 5, b.y + 5);
            ctx.lineTo(b.x + b.w - 5, b.y + b.h - 5);
            ctx.moveTo(b.x + b.w - 5, b.y + 5);
            ctx.lineTo(b.x + 5, b.y + b.h - 5);
            ctx.stroke();
        }
    }

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Draw paddle
    const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    grad.addColorStop(0, '#4fc3f7');
    grad.addColorStop(1, '#0288d1');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.stroke();

    // Draw ball
    if (state === 'playing' || state === 'ballLaunched') {
        const ballGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
        ballGrad.addColorStop(0, '#fff');
        ballGrad.addColorStop(1, '#ff6f00');
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();

        // Gravity indicator (subtle trail)
        if (state === 'playing') {
            ctx.strokeStyle = 'rgba(255,150,0,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            const gAngle = Math.atan2(ball.vy + ball.gravity * 5, ball.vx);
            ctx.lineTo(ball.x + Math.cos(gAngle) * 20, ball.y + Math.sin(gAngle) * 20);
            ctx.stroke();
        }
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL: ${level}`, W / 2, 30);
    ctx.textAlign = 'right';

    // Lives as hearts
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#ff4444';
        ctx.font = '16px monospace';
        ctx.fillText('♥', W - 20 - i * 25, 30);
    }

    if (state === 'gameOver') drawGameOver();
    if (state === 'win') drawWin();
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('BREAKOUT', W / 2, H / 3);
    ctx.fillStyle = '#ff6f00';
    ctx.font = 'bold 36px monospace';
    ctx.fillText('GRAVITY', W / 2, H / 3 + 50);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '16px monospace';
    ctx.fillText('The ball is affected by gravity!', W / 2, H / 2 + 20);
    ctx.fillText('Angle your shots to break all blocks.', W / 2, H / 2 + 45);

    ctx.font = '14px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('MOUSE / ← → to move paddle', W / 2, H / 2 + 90);
    ctx.fillText('CLICK / SPACE to launch ball', W / 2, H / 2 + 115);
    ctx.fillText('R to restart after game over', W / 2, H / 2 + 140);

    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(time * 3) * 0.3})`;
    ctx.font = 'bold 20px monospace';
    ctx.fillText('CLICK TO START', W / 2, H * 0.78);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 30);
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(time * 3) * 0.3})`;
    ctx.font = '18px monospace';
    ctx.fillText('CLICK / SPACE to restart', W / 2, H / 2 + 70);
}

function drawWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4fc3f7';
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px monospace';
    ctx.fillText('YOU WIN!', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 30);
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(time * 3) * 0.3})`;
    ctx.font = '18px monospace';
    ctx.fillText('CLICK / SPACE to play again', W / 2, H / 2 + 70);
}

function loop() {
    time += 0.016;
    update();
    draw();
    requestAnimationFrame(loop);
}

// Polyfill roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'number') r = [r];
        const radii = Array.isArray(r) ? r : [0];
        const rad = radii[0] || 0;
        this.moveTo(x + rad, y);
        this.lineTo(x + w - rad, y);
        this.arcTo(x + w, y, x + w, y + h, rad);
        this.lineTo(x + w, y + h - rad);
        this.arcTo(x + w, y + h, x + w - rad, y + h, rad);
        this.lineTo(x + rad, y + h);
        this.arcTo(x, y + h, x, y + h, rad);
        this.lineTo(x, y + rad);
        this.arcTo(x, y, x + w, y, rad);
        this.closePath();
    };
}

loop();
})();
</script>
</body>
</html>
