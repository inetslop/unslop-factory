<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pac-Man 2P</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Maze: # wall, . pellet, o power pellet, space empty corridor, G ghost house
const MAZE_RAW = [
"#################",
"#o...#...#...#o.#",
"#.##.###.###.##.#",
"#................#",
"#.##.###.###.##.#",
"#o...#...#...#o.#",
"#..#.....G......#",
"#####.#####.#####",
"#..#.....G......#",
"#o...#...#...#o.#",
"#.##.###.###.##.#",
"#................#",
"#.##.###.###.##.#",
"#o...#...#...#o.#",
"#################"
];

const ROWS = MAZE_RAW.length;
const COLS = MAZE_RAW[0].length;

let maze, pellets, powerPellets, totalPellets;
let players, ghosts, gameState, scores, lives, frightenedTimer, frightDuration, animFrame, lastTime, audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, dur, type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function initGame() {
  maze = [];
  pellets = {};
  powerPellets = {};
  totalPellets = 0;
  
  for (let r = 0; r < ROWS; r++) {
    maze[r] = [];
    for (let c = 0; c < COLS; c++) {
      const ch = MAZE_RAW[r][c];
      if (ch === '#') { maze[r][c] = 1; }
      else if (ch === '.') { maze[r][c] = 0; pellets[r + ',' + c] = true; totalPellets++; }
      else if (ch === 'o') { maze[r][c] = 2; powerPellets[r + ',' + c] = true; totalPellets++; }
      else { maze[r][c] = 3; }
    }
  }
  
  // Player start positions (bottom area)
  players = [
    { row: 10, col: 5, dir: 'up', nextDir: 'up', moving: true, lives: 3 },
    { row: 10, col: 11, dir: 'up', nextDir: 'up', moving: true, lives: 3 }
  ];
  
  // Ghost start positions (center)
  ghosts = [
    { row: 6, col: 8, dir: 'right', speed: 0.7 },
    { row: 8, col: 8, dir: 'left', speed: 0.7 }
  ];
  
  scores = [0, 0];
  lives = [3, 3];
  frightenedTimer = 0;
  frightDuration = 300; // frames
  animFrame = 0;
  lastTime = performance.now();
  gameState = 'playing';
}

function resetPositions() {
  players[0].row = 10; players[0].col = 5; players[0].dir = 'up'; players[0].nextDir = 'up';
  players[1].row = 10; players[1].col = 11; players[1].dir = 'up'; players[1].nextDir = 'up';
  ghosts[0].row = 6; ghosts[0].col = 8; ghosts[0].dir = 'right';
  ghosts[1].row = 8; ghosts[1].col = 8; ghosts[1].dir = 'left';
}

function getCellSpeed() {
  const s = Math.min(canvas.width / COLS, canvas.height / ROWS);
  return s;
}

// Input
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (gameState === 'start') {
    initAudio();
    gameState = 'playing';
    initGame();
  } else if (gameState === 'over' && e.key === ' ') {
    initGame();
  } else if (gameState === 'win' && e.key === ' ') {
    initGame();
  }
  
  // Player 1: Arrow keys
  if (gameState === 'playing') {
    if (e.key === 'ArrowUp') players[0].nextDir = 'up';
    if (e.key === 'ArrowDown') players[0].nextDir = 'down';
    if (e.key === 'ArrowLeft') players[0].nextDir = 'left';
    if (e.key === 'ArrowRight') players[1] ? null : 0, players[0].nextDir = 'right';
    
    // Player 2: WASD
    if (e.key === 'w' || e.key === 'W') players[1].nextDir = 'up';
    if (e.key === 's' || e.key === 'S') players[1].nextDir = 'down';
    if (e.key === 'a' || e.key === 'A') players[1].nextDir = 'left';
    if (e.key === 'd' || e.key === 'D') players[1].nextDir = 'right';
  }
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// Fix: ArrowRight for player 1
window.addEventListener('keydown', (e) => {
  if (gameState === 'playing') {
    if (e.key === 'ArrowUp') players[0].nextDir = 'up';
    if (e.key === 'ArrowDown') players[0].nextDir = 'down';
    if (e.key === 'ArrowLeft') players[0].nextDir = 'left';
    if (e.key === 'ArrowRight') players[0].nextDir = 'right';
  }
});

const DIRS = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

function canMove(row, col) {
  if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
  return maze[row][col] !== 1;
}

function moveEntity(ent, speedMult) {
  const nextRow = ent.row + DIRS[ent.dir][0];
  const nextCol = ent.col + DIRS[ent.dir][1];
  
  if (canMove(nextRow, nextCol)) {
    ent.row = nextRow;
    ent.col = nextCol;
    return true;
  }
  return false;
}

function tryTurn(ent) {
  const nr = ent.row + DIRS[ent.nextDir][0];
  const nc = ent.col + DIRS[ent.nextDir][1];
  if (canMove(nr, nc)) {
    ent.dir = ent.nextDir;
    return true;
  }
  return false;
}

function ghostAI(ghost, idx) {
  const frightened = frightenedTimer > 0;
  
  // Try to continue current direction first
  const cr = ghost.row + DIRS[ghost.dir][0];
  const cc = ghost.col + DIRS[ghost.dir][1];
  
  if (canMove(cr, cc) && !frightened) {
    // Prefer continuing straight unless it leads to dead end or we should turn
    if (Math.random() < 0.7) return;
  }
  
  const options = [];
  for (const d of ['up', 'down', 'left', 'right']) {
    if (d === OPPOSITE[ghost.dir]) continue;
    const nr = ghost.row + DIRS[d][0];
    const nc = ghost.col + DIRS[d][1];
    if (canMove(nr, nc)) options.push(d);
  }
  
  if (options.length === 0) {
    // Dead end - reverse
    ghost.dir = OPPOSITE[ghost.dir];
    return;
  }
  
  if (frightened) {
    ghost.dir = options[Math.floor(Math.random() * options.length)];
  } else {
    // Chase nearest player
    let bestDir = options[0];
    let bestDist = Infinity;
    
    for (const p of players) {
      if (lives[players.indexOf(p)] <= 0) continue;
      const dist = Math.abs(ghost.row - p.row) + Math.abs(ghost.col - p.col);
      if (dist < bestDist) {
        bestDist = dist;
        for (const d of options) {
          const nr = ghost.row + DIRS[d][0];
          const nc = ghost.col + DIRS[d][1];
          const d2 = Math.abs(nr - p.row) + Math.abs(nc - p.col);
          if (d2 < bestDist) { bestDir = d; bestDist = d2; }
        }
      }
    }
    
    // 30% chance to go random for unpredictability
    if (Math.random() < 0.3) {
      ghost.dir = options[Math.floor(Math.random() * options.length)];
    } else {
      ghost.dir = bestDir;
    }
  }
}

function update() {
  if (gameState !== 'playing') return;
  
  animFrame++;
  
  if (frightenedTimer > 0) frightenedTimer--;
  
  // Move players (every frame for smoothness, but grid-based)
  const playerSpeed = 1; // one cell per tick effectively
  
  for (let i = 0; i < 2; i++) {
    if (lives[i] <= 0) continue;
    const p = players[i];
    
    if (animFrame % 4 === 0) { // Player moves every 4 frames
      tryTurn(p);
      moveEntity(p, 1);
      
      // Check pellet collection
      const key = p.row + ',' + p.col;
      if (pellets[key]) {
        delete pellets[key];
        scores[i] += 10;
        playSound(440, 0.05, 'sine');
      } else if (powerPellets[key]) {
        delete powerPellets[key];
        scores[i] += 50;
        frightenedTimer = frightDuration;
        playSound(220, 0.2, 'sawtooth');
      }
    }
  }
  
  // Move ghosts
  const ghostSpeed = frightenedTimer > 0 ? 3 : 4; // frames between moves
  
  for (let i = 0; i < ghosts.length; i++) {
    const g = ghosts[i];
    
    if (animFrame % ghostSpeed === 0) {
      ghostAI(g, i);
      const nr = g.row + DIRS[g.dir][0];
      const nc = g.col + DIRS[g.dir][1];
      if (canMove(nr, nc)) {
        g.row = nr;
        g.col = nc;
      } else {
        // Stuck - reverse
        g.dir = OPPOSITE[g.dir];
      }
    }
    
    // Check collision with players
    for (let pi = 0; pi < 2; pi++) {
      if (lives[pi] <= 0) continue;
      const p = players[pi];
      if (g.row === p.row && g.col === p.col) {
        if (frightenedTimer > 0) {
          // Eat ghost
          scores[pi] += 200;
          playSound(880, 0.3, 'square');
          resetPositions();
          break;
        } else {
          lives[pi]--;
          playSound(150, 0.5, 'sawtooth');
          if (lives[pi] <= 0) {
            // Check if both players are dead
            if (lives[0] <= 0 && lives[1] <= 0) {
              gameState = 'over';
            } else {
              resetPositions();
            }
          } else {
            resetPositions();
          }
        }
      }
    }
  }
  
  // Check win condition
  const remaining = Object.keys(pellets).length + Object.keys(powerPellets).length;
  if (remaining === 0) {
    gameState = 'win';
  }
}

function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cellSize = Math.min(canvas.width / COLS, canvas.height / ROWS);
  const offsetX = (canvas.width - COLS * cellSize) / 2;
  const offsetY = (canvas.height - ROWS * cellSize) / 2;
  
  function px(c) { return offsetX + c * cellSize; }
  function py(r) { return offsetY + r * cellSize; }
  
  // Draw maze
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = px(c), y = py(r);
      
      if (maze[r][c] === 1) {
        ctx.fillStyle = '#1565C0';
        ctx.fillRect(x, y, cellSize, cellSize);
        ctx.strokeStyle = '#42A5F5';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
      }
      
      const key = r + ',' + c;
      if (pellets[key]) {
        ctx.fillStyle = '#FFD54F';
        ctx.beginPath();
        ctx.arc(x + cellSize/2, y + cellSize/2, cellSize * 0.12, 0, Math.PI*2);
        ctx.fill();
      }
      if (powerPellets[key]) {
        const pulse = Math.sin(animFrame * 0.1) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(255, 213, 79, ${pulse})`;
        ctx.beginPath();
        ctx.arc(x + cellSize/2, y + cellSize/2, cellSize * 0.25, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
  
  // Draw ghosts
  for (let i = 0; i < ghosts.length; i++) {
    const g = ghosts[i];
    const x = px(g.col) + cellSize/2;
    const y = py(g.row) + cellSize/2;
    const r = cellSize * 0.4;
    
    const ghostColor = frightenedTimer > 0 ? '#2196F3' : (i === 0 ? '#F44336' : '#FF5722');
    
    ctx.fillStyle = ghostColor;
    ctx.beginPath();
    ctx.arc(x, y - r*0.1, r, Math.PI, 0);
    ctx.lineTo(x + r, y + r * 0.6);
    // Wavy bottom
    for (let w = 0; w < 4; w++) {
      const wx = x + r - (w+1) * (r*2/4);
      const wy = y + r * 0.6 + (w % 2 === 0 ? r*0.15 : -r*0.15);
      ctx.lineTo(wx, wy);
    }
    ctx.closePath();
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#FFF';
    ctx.beginPath();
    ctx.arc(x - r*0.25, y - r*0.15, r*0.2, 0, Math.PI*2);
    ctx.arc(x + r*0.25, y - r*0.15, r*0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x - r*0.2, y - r*0.1, r*0.1, 0, Math.PI*2);
    ctx.arc(x + r*0.3, y - r*0.1, r*0.1, 0, Math.PI*2);
    ctx.fill();
  }
  
  // Draw players
  const playerColors = ['#FFEB3B', '#E91E63'];
  for (let i = 0; i < 2; i++) {
    if (lives[i] <= 0) continue;
    const p = players[i];
    const x = px(p.col) + cellSize/2;
    const y = py(p.row) + cellSize/2;
    const r = cellSize * 0.38;
    
    ctx.fillStyle = playerColors[i];
    ctx.beginPath();
    // Pac-man mouth
    const mouthAngle = 0.3 + Math.abs(Math.sin(animFrame * 0.15)) * 0.4;
    let startAngle, endAngle;
    switch(p.dir) {
      case 'right': startAngle = mouthAngle; endAngle = -mouthAngle; break;
      case 'left': startAngle = Math.PI + mouthAngle; endAngle = Math.PI - mouthAngle; break;
      case 'up': startAngle = -Math.PI/2 + mouthAngle; endAngle = -Math.PI/2 - mouthAngle; break;
      case 'down': startAngle = Math.PI/2 + mouthAngle; endAngle = Math.PI/2 - mouthAngle; break;
    }
    ctx.arc(x, y, r, startAngle, endAngle);
    ctx.closePath();
    ctx.fill();
  }
  
  // HUD
  ctx.fillStyle = '#FFEB3B';
  ctx.font = `bold ${Math.max(14, cellSize * 0.5)}px monospace`;
  ctx.textAlign = 'left';
  ctx.fillText(`P1: ${scores[0]}`, 10, 20);
  ctx.fillStyle = '#E91E63';
  ctx.fillText(`P2: ${scores[1]}`, 10, 40);
  
  // Lives
  ctx.font = `${Math.max(12, cellSize * 0.4)}px monospace`;
  ctx.fillStyle = '#FFEB3B';
  ctx.fillText('♥'.repeat(Math.max(0, lives[0])), 10, 60);
  ctx.fillStyle = '#E91E63';
  ctx.fillText('♥'.repeat(Math.max(0, lives[1])), 10, 80);
  
  if (gameState === 'start') {
    drawStartScreen(cellSize, offsetX, offsetY);
  } else if (gameState === 'over') {
    drawOverScreen();
  } else if (gameState === 'win') {
    drawWinScreen();
  }
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const fs = Math.min(canvas.width, canvas.height) * 0.06;
  
  ctx.fillStyle = '#FFEB3B';
  ctx.font = `bold ${fs}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('PAC-MAN 2P', cx, cy - fs * 1.5);
  
  ctx.font = `${fs * 0.5}px monospace`;
  ctx.fillStyle = '#FFF';
  ctx.fillText('Player 1 (Yellow): Arrow Keys', cx, cy - fs * 0.5);
  ctx.fillStyle = '#E91E63';
  ctx.fillText('Player 2 (Pink): W A S D', cx, cy);
  
  ctx.fillStyle = '#FFF';
  ctx.fillText('Collect dots, avoid ghosts!', cx, cy + fs * 0.5);
  ctx.fillText('Power pellets make ghosts vulnerable', cx, cy + fs * 1.0);
  
  ctx.fillStyle = '#4CAF50';
  ctx.font = `bold ${fs * 0.6}px monospace`;
  const blink = Math.sin(performance.now() * 0.005) > 0;
  if (blink) ctx.fillText('PRESS ANY KEY TO START', cx, cy + fs * 2);
}

function drawOverScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const fs = Math.min(canvas.width, canvas.height) * 0.05;
  
  ctx.fillStyle = '#F44336';
  ctx.font = `bold ${fs}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', cx, cy - fs);
  
  ctx.fillStyle = '#FFF';
  ctx.font = `${fs * 0.6}px monospace`;
  ctx.fillText(`P1: ${scores[0]}  |  P2: ${scores[1]}`, cx, cy + fs * 0.5);
  ctx.fillText('Press SPACE to restart', cx, cy + fs * 1.5);
}

function drawWinScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const fs = Math.min(canvas.width, canvas.height) * 0.05;
  
  ctx.fillStyle = '#4CAF50';
  ctx.font = `bold ${fs}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('YOU WIN!', cx, cy - fs);
  
  ctx.fillStyle = '#FFF';
  ctx.font = `${fs * 0.6}px monospace`;
  ctx.fillText(`P1: ${scores[0]}  |  P2: ${scores[1]}`, cx, cy + fs * 0.5);
  ctx.fillText('Press SPACE to play again', cx, cy + fs * 1.5);
}

gameState = 'start';
initGame();

function gameLoop(now) {
  update();
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
