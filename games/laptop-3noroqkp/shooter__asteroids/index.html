<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
}
function playSound(type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
const now = audioCtx.currentTime;
switch (type) {
case 'shoot':
osc.type = 'square';
osc.frequency.setValueAtTime(400, now);
osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
gain.gain.setValueAtTime(0.15, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
osc.start(now); osc.stop(now + 0.1);
break;
case 'explode':
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(150, now);
osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
osc.start(now); osc.stop(now + 0.4);
break;
case 'thrust':
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(80, now);
gain.gain.setValueAtTime(0.05, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
osc.start(now); osc.stop(now + 0.1);
break;
case 'gameover':
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(200, now);
osc.frequency.exponentialRampToValueAtTime(50, now + 1);
gain.gain.setValueAtTime(0.3, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 1);
osc.start(now); osc.stop(now + 1);
break;
case 'enemy':
osc.type = 'square';
osc.frequency.setValueAtTime(600, now);
osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
gain.gain.setValueAtTime(0.12, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
osc.start(now); osc.stop(now + 0.15);
break;
}
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('asteroids_high') || '0'); } catch(e) {}
let lives = 3;
let level = 1;

// Ship
const ship = { x: 0, y: 0, angle: -Math.PI/2, vx: 0, vy: 0 };
const SHIP_SIZE = 16;
const THRUST = 0.35;
const FRICTION = 0.99;
const MAX_SPEED = 7;

// Arrays
let bullets = [];
let asteroids = [];
let enemies = [];
let particles = [];
let stars = [];
let enemyBullets = [];

// Keys
const keys = {};
window.addEventListener('keydown', e => {
keys[e.code] = true;
initAudio();
if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Stars background
function initStars() {
stars = [];
for (let i = 0; i < 150; i++) {
stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, b: Math.random() * 0.7 + 0.3 });
}
}

function startGame() {
gameState = 'playing';
score = 0; lives = 3; level = 1;
ship.x = W / 2; ship.y = H / 2; ship.angle = -Math.PI/2; ship.vx = 0; ship.vy = 0;
bullets = []; asteroids = []; enemies = []; particles = []; enemyBullets = [];
initStars();
spawnAsteroids(5);
}

function spawnAsteroids(n) {
for (let i = 0; i < n; i++) spawnAsteroid('large');
}

function spawnAsteroid(size, x, y) {
let r, pts;
if (size === 'large') { r = 45; } else if (size === 'medium') { r = 28; } else { r = 16; }
pts = [];
const numPts = 8 + Math.floor(Math.random() * 4);
for (let i = 0; i < numPts; i++) {
const a = (i / numPts) * Math.PI * 2;
const rr = r * (0.75 + Math.random() * 0.35);
pts.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr });
}
let px, py;
if (x !== undefined) { px = x; py = y; } else {
const side = Math.floor(Math.random() * 4);
if (side === 0) { px = -r; py = Math.random() * H; }
else if (side === 1) { px = W + r; py = Math.random() * H; }
else if (side === 2) { px = Math.random() * W; py = -r; }
else { px = Math.random() * W; py = H + r; }
}
const angle = Math.atan2(H/2 - py, W/2 - px) + (Math.random()-0.5)*1.2;
const speed = size === 'large' ? 1.2 : size === 'medium' ? 2 : 3;
asteroids.push({ x: px, y: py, r: r, pts: pts, angle: Math.random()*Math.PI*2, va: (Math.random()-0.5)*0.04, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size: size });
}

function spawnEnemy() {
const side = Math.floor(Math.random() * 2);
let x, y, vx, vy;
if (side === 0) { x = -30; y = Math.random() * H; vx = 1.5 + Math.random(); }
else { x = W + 30; y = Math.random() * H; vx = -(1.5 + Math.random()); }
vy = (Math.random()-0.5) * 2;
enemies.push({ x, y, vx, vy, angle: -vx>0 ? 0 : Math.PI, fireTimer: 60 + Math.random()*120 });
}

function explode(x, y, color, count) {
for (let i = 0; i < (count || 8); i++) {
const a = Math.random() * Math.PI * 2;
const s = 1 + Math.random() * 3;
particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30+Math.random()*20, color: color || '#fff' });
}
}

function wrap(obj) {
const margin = 50;
if (obj.x < -margin) obj.x += W + margin*2;
if (obj.x > W+margin) obj.x -= W + margin*2;
if (obj.y < -margin) obj.y += H + margin*2;
if (obj.y > H+margin) obj.y -= H + margin*2;
}

function dist(a, b) { return Math.hypot(a.x-b.x, a.y-b.y); }

let frame = 0;
let thrustSoundTimer = 0;
let enemySpawnTimer = 0;
let invulnTimer = 0;

function update() {
if (gameState !== 'playing') return;
frame++;

// Ship controls
if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= 0.07;
if (keys['ArrowRight'] || keys['KeyD']) ship.angle += 0.07;
if (keys['ArrowUp'] || keys['KeyW']) {
ship.vx += Math.cos(ship.angle) * THRUST;
ship.vy += Math.sin(ship.angle) * THRUST;
const sp = Math.hypot(ship.vx, ship.vy);
if (sp > MAX_SPEED) { ship.vx *= MAX_SPEED/sp; ship.vy *= MAX_SPEED/sp; }
thrustSoundTimer++;
if (thrustSoundTimer % 8 === 0) playSound('thrust');
}
ship.vx *= FRICTION;
ship.vy *= FRICTION;
ship.x += ship.vx;
ship.y += ship.vy;
wrap(ship);

// Shoot
if (keys['Space'] && frame % 12 === 0) {
const bx = ship.x + Math.cos(ship.angle) * SHIP_SIZE;
const by = ship.y + Math.sin(ship.angle) * SHIP_SIZE;
bullets.push({ x: bx, y: by, vx: Math.cos(ship.angle)*8 + ship.vx*0.3, vy: Math.sin(ship.angle)*8 + ship.vy*0.3, life: 60 });
playSound('shoot');
}

// Update bullets
for (let i = bullets.length-1; i >= 0; i--) {
const b = bullets[i];
b.x += b.vx; b.y += b.vy; b.life--;
wrap(b);
if (b.life <= 0) bullets.splice(i, 1);
}

// Enemy bullets
for (let i = enemyBullets.length-1; i >= 0; i--) {
const b = enemyBullets[i];
b.x += b.vx; b.y += b.vy; b.life--;
wrap(b);
if (b.life <= 0) enemyBullets.splice(i, 1);
}

// Asteroids
for (let a of asteroids) {
a.x += a.vx; a.y += a.vy;
a.angle += a.va;
wrap(a);
}

// Enemies
enemySpawnTimer++;
if (enemySpawnTimer > 600 - level*50 && enemies.length < 1 + Math.floor(level/2)) {
spawnEnemy();
enemySpawnTimer = 0;
}

for (let i = enemies.length-1; i >= 0; i--) {
const e = enemies[i];
e.x += e.vx; e.y += e.vy;
wrap(e);
e.angle = Math.atan2(ship.y - e.y, ship.x - e.x);
e.fireTimer--;
if (e.fireTimer <= 0) {
const a = Math.atan2(ship.y - e.y, ship.x - e.x);
enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*5, vy: Math.sin(a)*5, life: 80 });
e.fireTimer = 90 + Math.random()*60;
playSound('enemy');
}
}

// Particles
for (let i = particles.length-1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx; p.y += p.vy; p.life--;
if (p.life <= 0) particles.splice(i, 1);
}

// Collision: bullets vs asteroids
for (let i = bullets.length-1; i >= 0; i--) {
const b = bullets[i];
for (let j = asteroids.length-1; j >= 0; j--) {
const a = asteroids[j];
if (dist(b, a) < a.r * 0.7) {
bullets.splice(i, 1);
asteroids.splice(j, 1);
playSound('explode');
explode(a.x, a.y, '#ff8844', 12);
if (a.size === 'large') { spawnAsteroid('medium'); spawnAsteroid('medium'); score += 20; }
else if (a.size === 'medium') { spawnAsteroid('small'); spawnAsteroid('small'); score += 50; }
else { score += 100; }
break;
}
}
}

// Collision: bullets vs enemies
for (let i = bullets.length-1; i >= 0; i--) {
const b = bullets[i];
for (let j = enemies.length-1; j >= 0; j--) {
const e = enemies[j];
if (dist(b, e) < 20) {
bullets.splice(i, 1);
enemies.splice(j, 1);
playSound('explode');
explode(e.x, e.y, '#ff4444', 15);
score += 500;
break;
}
}
}

// Collision: ship vs asteroids/enemies (with invulnerability)
if (invulnTimer <= 0) {
for (let j = asteroids.length-1; j >= 0; j--) {
const a = asteroids[j];
if (dist(ship, a) < (a.r*0.6 + SHIP_SIZE)) {
shipHit(); break;
}
}
for (let j = enemies.length-1; j >= 0; j--) {
const e = enemies[j];
if (dist(ship, e) < 30) {
enemies.splice(j, 1);
explode(e.x, e.y, '#ff4444', 15);
shipHit(); break;
}
}
for (let j = enemyBullets.length-1; j >= 0; j--) {
const b = enemyBullets[j];
if (dist(ship, b) < SHIP_SIZE) {
enemyBullets.splice(j, 1);
shipHit(); break;
}
}
}

// Level progression
const needed = level * 200;
if (score >= (level+1) * 500) {
level++;
spawnAsteroids(2 + level);
}

// Respawn asteroids if all destroyed
if (asteroids.length === 0 && bullets.length === 0) {
spawnAsteroids(4 + level);
}

if (invulnTimer > 0) invulnTimer--;
}

function shipHit() {
playSound('gameover');
explode(ship.x, ship.y, '#44ff88', 20);
lives--;
if (lives <= 0) {
gameState = 'gameover';
try { if (score > highScore) { highScore = score; localStorage.setItem('asteroids_high', highScore.toString()); } } catch(e){}
} else {
ship.x = W/2; ship.y = H/2; ship.angle = -Math.PI/2; ship.vx = 0; ship.vy = 0;
invulnTimer = 120;
}
}

function draw() {
ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);

// Stars
for (const s of stars) {
ctx.fillStyle = `rgba(255,255,255,${s.b})`;
ctx.fillRect(s.x, s.y, s.s, s.s);
}

if (gameState === 'playing' || gameState === 'gameover') {
// Particles
for (const p of particles) {
const alpha = p.life / 50;
ctx.fillStyle = `rgba(255,136,68,${alpha})`;
ctx.fillRect(p.x-2, p.y-2, 4, 4);
}

// Asteroids
for (const a of asteroids) {
ctx.save();
ctx.translate(a.x, a.y);
ctx.rotate(a.angle);
ctx.beginPath();
for (let i = 0; i < a.pts.length; i++) {
if (i === 0) ctx.moveTo(a.pts[i].x, a.pts[i].y);
else ctx.lineTo(a.pts[i].x, a.pts[i].y);
}
ctx.closePath();
ctx.strokeStyle = '#aaa';
ctx.lineWidth = 2;
ctx.stroke();
ctx.fillStyle = 'rgba(100,80,60,0.4)';
ctx.fill();
ctx.restore();
}

// Enemies
for (const e of enemies) {
ctx.save();
ctx.translate(e.x, e.y);
ctx.rotate(e.angle);
ctx.beginPath();
ctx.moveTo(-15, 0);
ctx.lineTo(5, -12);
ctx.lineTo(18, 0);
ctx.lineTo(5, 12);
ctx.closePath();
ctx.strokeStyle = '#ff4444';
ctx.lineWidth = 2;
ctx.stroke();
ctx.restore();
}

// Enemy bullets
for (const b of enemyBullets) {
ctx.fillStyle = '#ff6666';
ctx.beginPath();
ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
ctx.fill();
}

// Bullets
for (const b of bullets) {
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2);
ctx.fill();
}

// Ship
if (gameState === 'playing') {
const visible = invulnTimer <= 0 || frame % 8 < 4;
if (visible) {
ctx.save();
ctx.translate(ship.x, ship.y);
ctx.rotate(ship.angle);
ctx.beginPath();
ctx.moveTo(SHIP_SIZE, 0);
ctx.lineTo(-SHIP_SIZE*0.7, -SHIP_SIZE*0.6);
ctx.lineTo(-SHIP_SIZE*0.4, 0);
ctx.lineTo(-SHIP_SIZE*0.7, SHIP_SIZE*0.6);
ctx.closePath();
ctx.strokeStyle = '#44ff88';
ctx.lineWidth = 2;
ctx.stroke();
// Thrust
if (keys['ArrowUp'] || keys['KeyW']) {
ctx.beginPath();
ctx.moveTo(-SHIP_SIZE*0.5, -3);
ctx.lineTo(-SHIP_SIZE*0.9 - Math.random()*6, 0);
ctx.lineTo(-SHIP_SIZE*0.5, 3);
ctx.strokeStyle = '#ff8844';
ctx.stroke();
}
ctx.restore();
}
}

// HUD
ctx.fillStyle = '#fff';
ctx.font = '18px monospace';
ctx.textAlign = 'left';
ctx.fillText('SCORE: ' + score, 20, 30);
ctx.fillText(`LEVEL: ${level}`, 20, 55);
ctx.textAlign = 'right';
ctx.fillText('LIVES: ' + '❤'.repeat(Math.max(0,lives)), W-20, 30);
ctx.font = '14px monospace';
ctx.fillStyle = '#888';
ctx.fillText('HI: ' + Math.max(highScore, score), W-20, 55);
}

// Start screen
if (gameState === 'start') {
drawStartScreen();
}

// Game over
if (gameState === 'gameover') {
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#ff4444';
ctx.font = 'bold 48px monospace';
ctx.textAlign = 'center';
ctx.fillText('GAME OVER', W/2, H/2 - 40);
ctx.fillStyle = '#fff';
ctx.font = '24px monospace';
ctx.fillText('Score: ' + score, W/2, H/2 + 10);
const hi = Math.max(highScore, score);
ctx.fillText('High Score: ' + hi, W/2, H/2 + 45);
ctx.font = '18px monospace';
ctx.fillStyle = '#888';
ctx.fillText('Press SPACE or R to restart', W/2, H/2 + 90);
}
}

function drawStartScreen() {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.textAlign = 'center';
ctx.fillStyle = '#44ff88';
ctx.font = 'bold 52px monospace';
ctx.fillText('ASTEROIDS', W/2, H/2 - 80);
ctx.fillStyle = '#fff';
ctx.font = '18px monospace';
ctx.fillText('← → or A/D : Rotate Ship', W/2, H/2 - 20);
ctx.fillText('↑ or W     : Thrust', W/2, H/2 + 10);
ctx.fillText('SPACE      : Shoot', W/2, H/2 + 40);
ctx.fillStyle = '#888';
ctx.font = '16px monospace';
ctx.fillText('Destroy asteroids & enemies. Don\'t get hit!', W/2, H/2 + 80);
ctx.fillStyle = '#ff8844';
ctx.font = '22px monospace';
const blink = Math.floor(Date.now()/500) % 2;
if (blink) ctx.fillText('Press SPACE to Start', W/2, H/2 + 130);
}

function loop() {
update();
draw();
requestAnimationFrame(loop);
}

initStars();
gameState = 'start';
loop();
})();
</script>
</body>
</html>
