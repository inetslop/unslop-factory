<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Invaders 2P</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function shootSound() { playSound(880, 0.1, 'square', 0.08); }
function explodeSound() { playSound(220, 0.3, 'sawtooth', 0.15); }
function hitSound() { playSound(150, 0.2, 'triangle', 0.12); }
function powerupSound() { playSound(660, 0.2, 'sine', 0.1); }

// Game state
let gameState = 'START'; // START, PLAYING, GAME_OVER, WAVE_CLEAR
let score = 0;
let p1Score = 0;
let p2Score = 0;
let wave = 1;
let frameCount = 0;
let waveClearTimer = 0;

// Stars
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, size: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1 });
    }
}
initStars();

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 30 + Math.random() * 20, color });
    }
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'START' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if (gameState === 'GAME_OVER' && (e.code === 'KeyR' || e.code === 'Enter')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Player ships
let players = [];
function createPlayer(x, id) {
    return { x, y: 0, w: 36, h: 28, lives: 3, shootCooldown: 0, invincible: 0, id };
}

// Aliens
let aliens = [];
let alienDir = 1;
let alienSpeed = 1;
let alienShootTimer = 0;
let alienMoveTimer = 0;

// Bullets
let playerBullets = [];
let alienBullets = [];

// Shields
let shields = [];
function createShields() {
    shields = [];
    const shieldCount = 4;
    const shieldW = W * 0.15;
    const gap = (W - shieldCount * shieldW) / (shieldCount + 1);
    for (let i = 0; i < shieldCount; i++) {
        const sx = gap + i * (shieldW + gap);
        const sy = H * 0.75;
        const shH = 40;
        // Shield as grid of cells
        let cells = [];
        const cellSize = 8;
        const cols = Math.floor(shieldW / cellSize);
        const rows = Math.floor(shieldH / cellSize);
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                // Carve top center
                if (r < 3 && c > cols * 0.25 && c < cols * 0.75) continue;
                cells.push({ x: sx + c * cellSize, y: sy + r * cellSize, alive: true });
            }
        }
        shields.push({ cells, x: sx, y: sy, w: shieldW, h: shH });
    }
}

function startGame() {
    gameState = 'PLAYING';
    score = 0;
    p1Score = 0;
    p2Score = 0;
    wave = 1;
    frameCount = 0;
    particles = [];
    initWave();
}

function initWave() {
    alienDir = 1;
    alienSpeed = 1 + (wave - 1) * 0.3;
    alienShootTimer = 60;
    playerBullets = [];
    alienBullets = [];
    players = [createPlayer(W * 0.3, 1), createPlayer(W * 0.7, 2)];
    players[0].y = H - 50;
    players[1].y = H - 50;
    createShields();
    initAliens();
}

function initAliens() {
    aliens = [];
    const rows = Math.min(4 + Math.floor(wave / 2), 6);
    const cols = 8;
    const alienW = 30;
    const alienH = 24;
    const gapX = 50;
    const gapY = 40;
    const startX = (W - cols * gapX) / 2;
    const startY = H * 0.12;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const type = r < 2 ? 0 : (r < 4 ? 1 : 2);
            aliens.push({ x: startX + c * gapX, y: startY + r * gapY, w: alienW, h: alienH, type, alive: true });
        }
    }
}

// Drawing functions
function drawPixelShip(x, y, color) {
    ctx.fillStyle = color;
    const s = 2;
    // Simple ship shape
    ctx.fillRect(x + 5*s, y, 1*s, 3*s);
    ctx.fillRect(x + 4*s, y + 3*s, 3*s, 2*s);
    ctx.fillRect(x + 3*s, y + 5*s, 5*s, 2*s);
    ctx.fillRect(x + 2*s, y + 7*s, 7*s, 1*s);
    // Glow
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = color;
    ctx.fillRect(x + 5*s, y - s, 1*s, s);
    ctx.shadowBlur = 0;
}

function drawAlien(x, y, type, frame) {
    const colors = ['#ff4444', '#44ff44', '#ffff44'];
    const color = colors[type];
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;

    const s = 2;
    if (type === 0) {
        // Top alien - squid shape
        ctx.fillRect(x + 2*s, y + s, 1*s, 2*s);
        ctx.fillRect(x + 5*s, y + s, 1*s, 2*s);
        ctx.fillRect(x + s, y + 3*s, 7*s, 1*s);
        ctx.fillRect(x + 2*s, y + 4*s, 5*s, 1*s);
        ctx.fillRect(x + s, y + 5*s, 7*s, 1*s);
        if (frame % 2 === 0) {
            ctx.fillRect(x + 2*s, y + 6*s, 1*s, 1*s);
            ctx.fillRect(x + 5*s, y + 6*s, 1*s, 1*s);
        } else {
            ctx.fillRect(x + 3*s, y + 6*s, 1*s, 1*s);
            ctx.fillRect(x + 4*s, y + 6*s, 1*s, 1*s);
        }
    } else if (type === 1) {
        // Middle alien - crab shape
        ctx.fillRect(x + s, y + 2*s, 2*s, 1*s);
        ctx.fillRect(x + 5*s, y + 2*s, 2*s, 1*s);
        ctx.fillRect(x + s, y + 3*s, 6*s, 1*s);
        ctx.fillRect(x, y + 4*s, 8*s, 1*s);
        ctx.fillRect(x + s, y + 5*s, 6*s, 1*s);
        ctx.fillRect(x + 2*s, y + 6*s, 1*s, 1*s);
        ctx.fillRect(x + 5*s, y + 6*s, 1*s, 1*s);
    } else {
        // Bottom alien - octopus shape
        ctx.fillRect(x + s, y + s, 2*s, 1*s);
        ctx.fillRect(x + 5*s, y + s, 2*s, 1*s);
        ctx.fillRect(x, y + 2*s, 8*s, 3*s);
        ctx.fillRect(x + s, y + 5*s, 6*s, 1*s);
        ctx.fillRect(x + 2*s, y + 6*s, 4*s, 1*s);
    }
    ctx.shadowBlur = 0;
}

function drawShield(shield) {
    for (let cell of shield.cells) {
        if (cell.alive) {
            ctx.fillStyle = '#2a5';
            ctx.fillRect(cell.x, cell.y, 8, 8);
        }
    }
}

function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    // Stars
    ctx.fillStyle = '#fff';
    for (let star of stars) {
        star.y += star.speed;
        if (star.y > H) { star.y = 0; star.x = Math.random() * W; }
        ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.02 + star.x) * 0.3;
        ctx.fillRect(star.x, star.y, star.size, star.size);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`WAVE ${wave}`, W / 2 - 40, 25);
    ctx.fillText(`SCORE: ${score}`, 15, 25);
    ctx.textAlign = 'right';
    ctx.fillText(`P1: ${p1Score}  P2: ${p2Score}`, W - 15, 25);
    // Lives
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4af';
    for (let i = 0; i < players[0].lives; i++) {
        ctx.fillRect(15 + i * 20, 35, 16, 8);
    }
    ctx.fillStyle = '#f4a';
    for (let i = 0; i < players[1].lives; i++) {
        ctx.fillRect(W - 15 - (i + 1) * 20, 35, 16, 8);
    }
}

function drawStartScreen() {
    drawBackground();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 20;
    ctx.fillText('SPACE INVADERS', W / 2, H * 0.25);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#0ff';
    ctx.fillText('TWO PLAYER CO-OP', W / 2, H * 0.35);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    const lines = [
        '',
        'PLAYER 1 (Left):',
        '  A / D - Move Left/Right',
        '  F - Shoot',
        '',
        'PLAYER 2 (Right):',
        '  \u2190 / \u2192 - Move Left/Right',
        '  L - Shoot',
        '',
        'Work together to destroy all invaders!',
        'Protect your shields. Don\'t let aliens reach the bottom!',
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H * 0.45 + i * 28);
    });

    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(frameCount * 0.05) * 0.5})`;
    ctx.fillText('PRESS SPACE OR ENTER TO START', W / 2, H * 0.88);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 52px monospace';
    ctx.shadowColor = '#f00';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W / 2, H * 0.35);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.48);
    ctx.fillText(`P1: ${p1Score}   P2: ${p2Score}`, W / 2, H * 0.55);
    ctx.fillText(`Wave Reached: ${wave}`, W / 2, H * 0.62);

    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(frameCount * 0.05) * 0.5})`;
    ctx.fillText('PRESS R OR ENTER TO RESTART', W / 2, H * 0.78);
}

function drawWaveClear() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 36px monospace';
    ctx.shadowColor = '#0f0';
    ctx.shadowBlur = 15;
    ctx.fillText(`WAVE ${wave} CLEARED!`, W / 2, H * 0.4);
    ctx.shadowBlur = 0;
    ctx.font = '18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Get ready for the next wave...', W / 2, H * 0.5);
}

// Update logic
function update() {
    if (gameState !== 'PLAYING' && gameState !== 'WAVE_CLEAR') return;

    frameCount++;

    // Particles
    particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        return p.life > 0;
    });

    if (gameState === 'WAVE_CLEAR') {
        waveClearTimer--;
        if (waveClearTimer <= 0) {
            wave++;
            gameState = 'PLAYING';
            initWave();
        }
        return;
    }

    // Player movement
    const speed = 5;
    const p1 = players[0], p2 = players[1];

    if (p1.invincible > 0) p1.invincible--;
    if (p2.invincible > 0) p2.invincible--;

    if (keys['KeyA'] && p1.x > 0) p1.x -= speed;
    if (keys['KeyD'] && p1.x < W * 0.5 - 40) p1.x += speed;
    if (keys['ArrowLeft'] && p2.x > W * 0.5 + 10) p2.x -= speed;
    if (keys['ArrowRight'] && p2.x < W - 40) p2.x += speed;

    // Shooting
    if (p1.shootCooldown > 0) p1.shootCooldown--;
    if (p2.shootCooldown > 0) p2.shootCooldown--;

    if (keys['KeyF'] && p1.shootCooldown <= 0) {
        playerBullets.push({ x: p1.x + 18, y: p1.y - 10, vy: -8, owner: 0 });
        p1.shootCooldown = 20;
        shootSound();
    }
    if (keys['KeyL'] && p2.shootCooldown <= 0) {
        playerBullets.push({ x: p2.x + 18, y: p2.y - 10, vy: -8, owner: 1 });
        p2.shootCooldown = 20;
        shootSound();
    }

    // Update player bullets
    playerBullets = playerBullets.filter(b => { b.y += b.vy; return b.y > -20; });

    // Alien movement
    alienMoveTimer++;
    const moveInterval = Math.max(3, 15 - wave * 2);
    if (alienMoveTimer >= moveInterval) {
        alienMoveTimer = 0;
        let minX = Infinity, maxX = -Infinity;
        for (let a of aliens) {
            if (!a.alive) continue;
            minX = Math.min(minX, a.x);
            maxX = Math.max(maxX, a.x + a.w);
        }
        if (minX === Infinity) return; // no aliens

        const step = 3 * alienDir;
        if ((alienDir > 0 && maxX + step > W - 10) || (alienDir < 0 && minX + step < 10)) {
            alienDir *= -1;
            for (let a of aliens) { if (a.alive) a.y += 20; }
        } else {
            for (let a of aliens) { if (a.alive) a.x += step; }
        }

        // Check if aliens reached bottom
        for (let a of aliens) {
            if (a.alive && a.y + a.h > H - 80) {
                triggerGameOver();
                return;
            }
        }
    }

    // Alien shooting
    alienShootTimer--;
    if (alienShootTimer <= 0) {
        const aliveAliens = aliens.filter(a => a.alive);
        if (aliveAliens.length > 0) {
            const shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
            alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, vy: 4 + wave * 0.3 });
        }
        alienShootTimer = Math.max(20, 60 - wave * 5);
    }

    // Update alien bullets
    alienBullets = alienBullets.filter(b => { b.y += b.vy; return b.y < H + 20; });

    // Collision: player bullets vs aliens
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        for (let j = aliens.length - 1; j >= 0; j--) {
            const a = aliens[j];
            if (!a.alive) continue;
            if (b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
                a.alive = false;
                playerBullets.splice(i, 1);
                const points = (3 - a.type) * 10;
                score += points;
                if (b.owner === 0) p1Score += points; else p2Score += points;
                spawnParticles(a.x + a.w / 2, a.y + a.h / 2, ['#ff4444', '#44ff44', '#ffff44'][a.type], 12);
                explodeSound();
                break;
            }
        }
    }

    // Collision: alien bullets vs players
    for (let i = alienBullets.length - 1; i >= 0; i--) {
        const b = alienBullets[i];
        // Check shields first
        let shieldHit = false;
        for (let shield of shields) {
            for (let cell of shield.cells) {
                if (!cell.alive) continue;
                if (b.x >= cell.x && b.x <= cell.x + 8 && b.y >= cell.y && b.y <= cell.y + 8) {
                    cell.alive = false;
                    alienBullets.splice(i, 1);
                    shieldHit = true;
                    break;
                }
            }
        }
        if (shieldHit) continue;

        // Check players
        let hitPlayer = false;
        for (let p of players) {
            if (p.invincible > 0) continue;
            if (b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) {
                alienBullets.splice(i, 1);
                hitPlayer = true;
                spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#4af', 15);
                hitSound();
                if (p.id === 1) { p1.lives--; } else { p2.lives--; }
                p.invincible = 90;
                if (p.lives <= 0) { triggerGameOver(); return; }
                break;
            }
        }
    }

    // Check wave clear
    const remaining = aliens.filter(a => a.alive).length;
    if (remaining === 0 && gameState === 'PLAYING') {
        gameState = 'WAVE_CLEAR';
        waveClearTimer = 120;
    }
}

function triggerGameOver() {
    gameState = 'GAME_OVER';
    try {
        const highScore = parseInt(localStorage.getItem('si2p_high') || '0');
        if (score > highScore) localStorage.setItem('si2p_high', score);
    } catch(e) {}
}

function render() {
    if (gameState === 'START') {
        drawStartScreen();
        return;
    }

    drawBackground();

    // Shields
    for (let s of shields) drawShield(s);

    // Aliens
    const animFrame = Math.floor(frameCount / 15) % 2;
    for (let a of aliens) {
        if (a.alive) drawAlien(a.x, a.y, a.type, animFrame);
    }

    // Players
    const p1 = players[0], p2 = players[1];
    if (p1.invincible <= 0 || Math.floor(frameCount / 5) % 2 === 0) {
        drawPixelShip(p1.x, p1.y, '#4af');
    }
    if (p2.invincible <= 0 || Math.floor(frameCount / 5) % 2 === 0) {
        drawPixelShip(p2.x, p2.y, '#f4a');
    }

    // Player bullets
    ctx.fillStyle = '#0ff';
    for (let b of playerBullets) {
        ctx.fillRect(b.x - 1, b.y - 8, 3, 8);
    }

    // Alien bullets
    ctx.fillStyle = '#f44';
    for (let b of alienBullets) {
        ctx.fillRect(b.x - 2, b.y, 4, 8);
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;

    drawHUD();

    if (gameState === 'WAVE_CLEAR') drawWaveClear();
    if (gameState === 'GAME_OVER') drawGameOver();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
