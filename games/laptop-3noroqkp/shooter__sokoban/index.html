<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokoban Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, offsetX, offsetY;
let audioCtx = null;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch(type) {
        case 'move':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            break;
        case 'push':
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
        case 'shoot':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
        case 'kill':
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            break;
        case 'win':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
            osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            break;
        case 'levelup':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(330, audioCtx.currentTime);
            osc.frequency.setValueAtTime(440, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
        case 'error':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
    }
}

// Level definitions
const LEVELS = [
    {
        name: "Warm Up",
        grid: [
            "###########",
            "#P...B..T#",
            "#....E...#",
            "#..........",
            "#..B.....E",
            "#....T...#",
            "###########"
        ]
    },
    {
        name: "Corridors",
        grid: [
            "#############",
            "#P...#....B#",
            "#..##.##.T.#",
            "#..E#..#....",
            "#..##.##.B.#",
            "#..........#",
            "#..E#..#..T#",
            "#......#....",
            "#############"
        ]
    },
    {
        name: "The Gauntlet",
        grid: [
            "###############",
            "#P.....E...B.#",
            "#.##.###.##.T#",
            "#.##.E..#....#",
            "#.B#..##.##.E#",
            "#.##.####.B..#",
            "#.T#........#.",
            "#.E#..B...#..#",
            "#......E....#.#",
            "###############"
        ]
    },
    {
        name: "Pressure",
        grid: [
            "#################",
            "#P...##BB##...T#",
            "#..E.##..##..E.#",
            "#..#.##..##..#..",
            "#..#.B....B.#..#",
            "#..#.##..##..#..",
            "#..E.##..##..E.#",
            "#T...##BB##...P#",
            "#################"
        ]
    },
    {
        name: "Final Push",
        grid: [
            "###################",
            "#P....#.....#...B#",
            "#..E..#..E..#.T.#.",
            "#.####.#####.##..#",
            "#.B.E..#.E#..#.B.#",
            "#.##.#####.##..E.#",
            "#.##.E.....#.T...#",
            "#.B.#..E..#.##..#.#",
            "#....###########.T#",
            "###################"
        ]
    }
];

// Game state
let gameState = 'menu'; // menu, playing, levelComplete, gameComplete
let currentLevel = 0;
let totalMoves = 0;
let totalKills = 0;
let grid = [];
let player = { x: 0, y: 0, dx: 1, dy: 0 };
let boxes = [];
let targets = [];
let enemies = [];
let bullets = [];
let shootCooldown = 0;
let animations = [];
let levelTimer = 0;
let particles = [];

function parseLevel(levelIdx) {
    const rows = LEVELS[levelIdx].grid;
    grid = [];
    boxes = [];
    targets = [];
    enemies = [];
    bullets = [];
    particles = [];
    player = { x: 0, y: 0, dx: 1, dy: 0 };
    
    for (let r = 0; r < rows.length; r++) {
        grid[r] = [];
        for (let c = 0; c < rows[r].length; c++) {
            const ch = rows[r][c];
            if (ch === '#') grid[r][c] = '#';
            else if (ch === 'P') { grid[r][c] = '.'; player.x = c; player.y = r; }
            else if (ch === 'B') { grid[r][c] = '.'; boxes.push({ x: c, y: r }); }
            else if (ch === 'T') { grid[r][c] = '.'; targets.push({ x: c, y: r }); }
            else if (ch === 'E') { grid[r][c] = '.'; enemies.push({ x: c, y: r, alive: true, deathTimer: 0 }); }
            else if (ch === '.') grid[r][c] = '.';
            else grid[r][c] = '.';
        }
    }
}

function isWall(x, y) {
    if (y < 0 || y >= grid.length || x < 0 || x >= grid[0].length) return true;
    return grid[y][x] === '#';
}

function hasBox(x, y) {
    return boxes.some(b => b.x === x && b.y === y);
}

function hasEnemy(x, y) {
    return enemies.some(e => e.alive && e.x === x && e.y === y);
}

function isOnTarget(x, y) {
    return targets.some(t => t.x === x && t.y === y);
}

function checkWin() {
    const boxesOnTargets = boxes.every(b => isOnTarget(b.x, b.y));
    const allEnemiesDead = enemies.every(e => !e.alive);
    return boxesOnTargets && allEnemiesDead;
}

function movePlayer(dx, dy) {
    player.dx = dx;
    player.dy = dy;
    
    const nx = player.x + dx;
    const ny = player.y + dy;
    
    if (isWall(nx, ny)) {
        playSound('error');
        return;
    }
    
    if (hasEnemy(nx, ny)) {
        playSound('error');
        addParticles(nx * cellSize + offsetX + cellSize/2, ny * cellSize + offsetY + cellSize/2, '#ff4444', 5);
        return;
    }
    
    if (hasBox(nx, ny)) {
        const box = boxes.find(b => b.x === nx && b.y === ny);
        const bx = nx + dx;
        const by = ny + dy;
        
        if (isWall(bx, by) || hasBox(bx, by) || hasEnemy(bx, by)) {
            playSound('error');
            return;
        }
        
        box.x = bx;
        box.y = by;
        player.x = nx;
        player.y = ny;
        totalMoves++;
        playSound('push');
        
        if (isOnTarget(bx, by)) {
            addParticles(bx * cellSize + offsetX + cellSize/2, by * cellSize + offsetY + cellSize/2, '#ffdd44', 8);
        }
    } else {
        player.x = nx;
        player.y = ny;
        totalMoves++;
        playSound('move');
    }
}

function shoot() {
    if (shootCooldown > 0) return;
    
    const dx = player.dx;
    const dy = player.dy;
    let bx = player.x + dx;
    let by = player.y + dy;
    
    playSound('shoot');
    bullets.push({ x: player.x, y: player.y, dx, dy, life: 0 });
    
    while (!isWall(bx, by)) {
        if (hasEnemy(bx, by)) {
            const enemy = enemies.find(e => e.alive && e.x === bx && e.y === by);
            if (enemy) {
                enemy.alive = false;
                enemy.deathTimer = 0;
                totalKills++;
                playSound('kill');
                addParticles(bx * cellSize + offsetX + cellSize/2, by * cellSize + offsetY + cellSize/2, '#ff4444', 12);
            }
            break;
        }
        if (hasBox(bx, by)) break;
        bx += dx;
        by += dy;
    }
    
    shootCooldown = 8;
}

function addParticles(px, py, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x: px, y: py,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function update() {
    if (shootCooldown > 0) shootCooldown--;
    
    // Update enemy death animations
    enemies.forEach(e => {
        if (!e.alive && e.deathTimer < 20) e.deathTimer++;
    });
    
    updateParticles();
}

function calcLayout() {
    const cols = grid[0].length;
    const rows = grid.length;
    
    const maxCellW = (W * 0.85) / cols;
    const maxCellH = (H * 0.75) / rows;
    cellSize = Math.floor(Math.min(maxCellW, maxCellH));
    cellSize = Math.max(cellSize, 20);
    
    offsetX = Math.floor((W - cols * cellSize) / 2);
    offsetY = Math.floor((H - rows * cellSize) / 2) - 10;
}

function drawGame() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    calcLayout();
    
    // Draw grid
    for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[r].length; c++) {
            const px = c * cellSize + offsetX;
            const py = r * cellSize + offsetY;
            
            if (grid[r][c] === '#') {
                ctx.fillStyle = '#3d3d56';
                ctx.fillRect(px, py, cellSize, cellSize);
                ctx.strokeStyle = '#2a2a3e';
                ctx.strokeRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
                // Brick pattern
                ctx.fillStyle = '#4a4a6a';
                ctx.fillRect(px + 2, py + 2, cellSize - 4, cellSize / 2 - 3);
            } else {
                ctx.fillStyle = (r + c) % 2 === 0 ? '#2d2d44' : '#25253a';
                ctx.fillRect(px, py, cellSize, cellSize);
            }
        }
    }
    
    // Draw targets
    targets.forEach(t => {
        const px = t.x * cellSize + offsetX;
        const py = t.y * cellSize + offsetY;
        const cx = px + cellSize / 2;
        const cy = py + cellSize / 2;
        
        ctx.fillStyle = isOnTarget(t.x, t.y) ? 'rgba(255,220,50,0.3)' : 'rgba(255,220,50,0.15)';
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize * 0.35, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#ffdd44';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy - cellSize * 0.25);
        ctx.lineTo(cx + cellSize * 0.25, cy);
        ctx.lineTo(cx, cy + cellSize * 0.25);
        ctx.lineTo(cx - cellSize * 0.25, cy);
        ctx.closePath();
        ctx.stroke();
    });
    
    // Draw boxes
    boxes.forEach(b => {
        const px = b.x * cellSize + offsetX;
        const py = b.y * cellSize + offsetY;
        const onT = isOnTarget(b.x, b.y);
        
        ctx.fillStyle = onT ? '#44cc44' : '#c8823a';
        ctx.fillRect(px + 3, py + 3, cellSize - 6, cellSize - 6);
        ctx.strokeStyle = onT ? '#22aa22' : '#996520';
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 3, py + 3, cellSize - 6, cellSize - 6);
        
        // Cross pattern
        ctx.strokeStyle = onT ? '#22aa22' : '#996520';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(px + 6, py + 6);
        ctx.lineTo(px + cellSize - 6, py + cellSize - 6);
        ctx.moveTo(px + cellSize - 6, py + 6);
        ctx.lineTo(px + 6, py + cellSize - 6);
        ctx.stroke();
    });
    
    // Draw enemies
    enemies.forEach(e => {
        if (e.alive) {
            const px = e.x * cellSize + offsetX;
            const py = e.y * cellSize + offsetY;
            const cx = px + cellSize / 2;
            const cy = py + cellSize / 2;
            
            // Body
            ctx.fillStyle = '#cc3333';
            ctx.beginPath();
            ctx.arc(cx, cy, cellSize * 0.38, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#991111';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            // Eyes
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(cx - cellSize * 0.12, cy - cellSize * 0.08, cellSize * 0.08, 0, Math.PI * 2);
            ctx.arc(cx + cellSize * 0.12, cy - cellSize * 0.08, cellSize * 0.08, 0, Math.PI * 2);
            ctx.fill();
            
            // Angry brows
            ctx.strokeStyle = '#660000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - cellSize * 0.2, cy - cellSize * 0.2);
            ctx.lineTo(cx - cellSize * 0.05, cy - cellSize * 0.13);
            ctx.moveTo(cx + cellSize * 0.2, cy - cellSize * 0.2);
            ctx.lineTo(cx + cellSize * 0.05, cy - cellSize * 0.13);
            ctx.stroke();
        } else if (e.deathTimer < 20) {
            const px = e.x * cellSize + offsetX;
            const py = e.y * cellSize + offsetY;
            const cx = px + cellSize / 2;
            const cy = py + cellSize / 2;
            const scale = 1 - e.deathTimer / 20;
            
            ctx.globalAlpha = scale;
            ctx.fillStyle = '#ff6644';
            ctx.beginPath();
            ctx.arc(cx, cy, cellSize * 0.38 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    });
    
    // Draw player
    const ppx = player.x * cellSize + offsetX;
    const ppy = player.y * cellSize + offsetY;
    const pcx = ppx + cellSize / 2;
    const pcy = ppy + cellSize / 2;
    
    // Body
    ctx.fillStyle = '#4488ff';
    ctx.beginPath();
    ctx.arc(pcx, pcy, cellSize * 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2266cc';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Eyes (facing direction)
    const eyeOffX = player.dx * cellSize * 0.12;
    const eyeOffY = player.dy * cellSize * 0.12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(pcx - cellSize * 0.1 + eyeOffX, pcy - cellSize * 0.05 + eyeOffY, cellSize * 0.08, 0, Math.PI * 2);
    ctx.arc(pcx + cellSize * 0.1 + eyeOffX, pcy - cellSize * 0.05 + eyeOffY, cellSize * 0.08, 0, Math.PI * 2);
    ctx.fill();
    
    // Gun direction indicator
    const gunLen = cellSize * 0.3;
    const gx = pcx + player.dx * (cellSize * 0.35);
    const gy = pcy + player.dy * (cellSize * 0.35);
    ctx.strokeStyle = '#ffaa00';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(pcx + player.dx * cellSize * 0.2, pcy + player.dy * cellSize * 0.2);
    ctx.lineTo(gx, gy);
    ctx.stroke();
    
    // Draw particles
    particles.forEach(p => {
        ctx.globalAlpha = Math.min(1, p.life / 20);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
    
    // HUD
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.max(14, cellSize * 0.35)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${currentLevel + 1}: ${LEVELS[currentLevel].name}`, 15, 25);
    
    const boxesOnT = boxes.filter(b => isOnTarget(b.x, b.y)).length;
    const enemiesDead = enemies.filter(e => !e.alive).length;
    ctx.font = `${Math.max(12, cellSize * 0.3)}px monospace`;
    ctx.fillStyle = '#ffdd44';
    ctx.fillText(`Boxes: ${boxesOnT}/${boxes.length}`, 15, 45);
    ctx.fillStyle = '#ff6644';
    ctx.fillText(`Enemies: ${enemiesDead}/${enemies.length}`, 15, 65);
    ctx.fillStyle = '#aaaacc';
    ctx.fillText(`Moves: ${totalMoves}`, 15, 85);
    
    // Controls hint
    ctx.textAlign = 'right';
    ctx.font = `${Math.max(11, cellSize * 0.25)}px monospace`;
    ctx.fillStyle = '#888899';
    ctx.fillText('Arrows/WASD: Move+Push', W - 15, H - 45);
    ctx.fillText('SPACE: Shoot', W - 15, H - 28);
    ctx.fillText('R: Restart Level', W - 15, H - 11);
}

function drawMenu() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    // Title
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(60, W * 0.08)}px monospace`;
    ctx.fillText('SOKOBAN', cx, cy - 80);
    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${Math.min(60, W * 0.08)}px monospace`;
    ctx.fillText('SHOOTER', cx, cy - 30);
    
    // Subtitle
    ctx.fillStyle = '#aaaacc';
    ctx.font = `${Math.min(18, W * 0.03)}px monospace`;
    ctx.fillText('Push boxes to targets. Eliminate all enemies.', cx, cy + 20);
    ctx.fillText('Bullets travel in the direction you face.', cx, cy + 45);
    
    // Controls box
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    const boxW = Math.min(400, W * 0.7);
    const boxH = 120;
    ctx.fillRect(cx - boxW/2, cy + 60, boxW, boxH);
    ctx.strokeStyle = '#444466';
    ctx.strokeRect(cx - boxW/2, cy + 60, boxW, boxH);
    
    ctx.fillStyle = '#ccccdd';
    ctx.font = `${Math.min(16, W * 0.025)}px monospace`;
    ctx.fillText('ARROWS / WASD — Move & Push', cx, cy + 95);
    ctx.fillText('SPACE — Shoot (facing direction)', cx, cy + 120);
    ctx.fillText('R — Restart Level', cx, cy + 145);
    
    // Start prompt
    const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.min(22, W * 0.04)}px monospace`;
    ctx.fillText('PRESS ENTER TO START', cx, cy + 210);
    ctx.globalAlpha = 1;
}

function drawLevelComplete() {
    drawGame();
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#44ff44';
    ctx.font = `bold ${Math.min(48, W * 0.07)}px monospace`;
    ctx.fillText('LEVEL COMPLETE!', cx, cy - 40);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.min(20, W * 0.03)}px monospace`;
    ctx.fillText(`Moves: ${totalMoves}  |  Enemies Killed: ${totalKills}`, cx, cy + 10);
    
    const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(20, W * 0.03)}px monospace`;
    ctx.fillText('PRESS ENTER FOR NEXT LEVEL', cx, cy + 60);
    ctx.globalAlpha = 1;
}

function drawGameComplete() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(50, W * 0.07)}px monospace`;
    ctx.fillText('ALL LEVELS COMPLETE!', cx, cy - 60);
    
    // Trophy
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.arc(cx, cy + 10, 35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold 36px monospace`;
    ctx.fillText('★', cx, cy + 22);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.min(20, W * 0.03)}px monospace`;
    ctx.fillText(`Total Moves: ${totalMoves}`, cx, cy + 70);
    ctx.fillText(`Enemies Eliminated: ${totalKills}`, cx, cy + 95);
    
    const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#44ff44';
    ctx.font = `bold ${Math.min(20, W * 0.03)}px monospace`;
    ctx.fillText('PRESS ENTER TO PLAY AGAIN', cx, cy + 150);
    ctx.globalAlpha = 1;
}

function render() {
    switch (gameState) {
        case 'menu': drawMenu(); break;
        case 'playing': drawGame(); break;
        case 'levelComplete': drawLevelComplete(); break;
        case 'gameComplete': drawGameComplete(); break;
    }
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
}

function startLevel(idx) {
    currentLevel = idx;
    parseLevel(idx);
    gameState = 'playing';
}

function resetGame() {
    totalMoves = 0;
    totalKills = 0;
    startLevel(0);
}

// Input
window.addEventListener('keydown', (e) => {
    initAudio();
    
    if (gameState === 'menu') {
        if (e.key === 'Enter' || e.key === ' ') {
            resetGame();
        }
        return;
    }
    
    if (gameState === 'levelComplete') {
        if (e.key === 'Enter' || e.key === ' ') {
            if (currentLevel + 1 < LEVELS.length) {
                startLevel(currentLevel + 1);
            } else {
                gameState = 'gameComplete';
            }
        }
        return;
    }
    
    if (gameState === 'gameComplete') {
        if (e.key === 'Enter' || e.key === ' ') {
            resetGame();
        }
        return;
    }
    
    if (gameState !== 'playing') return;
    
    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': movePlayer(0, -1); e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': movePlayer(0, 1); e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A': movePlayer(-1, 0); e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': movePlayer(1, 0); e.preventDefault(); break;
        case ' ': shoot(); e.preventDefault(); break;
        case 'r': case 'R': startLevel(currentLevel); break;
    }
});

// Prevent scrolling with space/arrows
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
    }
});

// Start
gameLoop();
</script>
</body>
</html>
