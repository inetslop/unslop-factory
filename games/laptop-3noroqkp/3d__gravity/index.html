<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a1a; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, duration, type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('gravity3d_high') || '0'); } catch(e) {}

// Input
const keys = {};
window.addEventListener('keydown', e => { 
    keys[e.code] = true; 
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === 'gameover' && (e.code === 'KeyR' || e.code === 'Enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// 3D Projection
const FOCAL_LENGTH = 400;
const CAM_HEIGHT = 2.5;
const CAM_BACK = 8;

function project(x, y, z) {
    const dz = z - CAM_BACK;
    if (dz < 0.1) return null;
    const scale = FOCAL_LENGTH / dz;
    return {
        x: W / 2 + (x * scale),
        y: H / 2 + ((CAM_HEIGHT - y) * scale),
        scale: scale
    };
}

// Game objects
let player = null;
let platforms = [];
let particles = [];
let gridOffset = 0;

function createPlatform(z, x) {
    const width = 1.5 + Math.random() * 1.5;
    return {
        x: x !== undefined ? x : (Math.random() - 0.5) * 6,
        z: z,
        y: 0,
        width: width,
        color: `hsl(${Math.random() * 60 + 180}, 70%, ${50 + Math.random() * 20}%)`,
        glow: Math.random() * Math.PI * 2
    };
}

function startGame() {
    initAudio();
    gameState = 'playing';
    score = 0;
    platforms = [];
    particles = [];
    
    // Starting platform
    platforms.push({ x: 0, z: 5, y: 0, width: 4, color: 'hsl(200, 70%, 60%)', glow: 0 });
    
    for (let i = 1; i < 20; i++) {
        const prevZ = platforms[platforms.length - 1].z;
        const gap = 4 + Math.random() * 3;
        const xOff = (Math.random() - 0.5) * 4;
        platforms.push(createPlatform(prevZ + gap, undefined));
        platforms[platforms[platforms.length-1]].x = Math.max(-5, Math.min(5, platforms[platforms.length-1].z === prevZ + gap ? (Math.random()-0.5)*6 : 0));
    }
    
    player = {
        x: 0, y: 0.3, z: 5,
        vx: 0, vy: 0, vz: 0,
        onGround: true,
        jumpPower: 8,
        moveSpeed: 4,
        radius: 0.3
    };
    
    playSound(440, 0.2, 'sine');
}

function spawnParticles(x, y, z, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x + (Math.random()-0.5)*0.5,
            y: y + Math.random()*0.3,
            z: z + (Math.random()-0.5)*0.5,
            vx: (Math.random()-0.5)*2,
            vy: Math.random()*3,
            vz: (Math.random()-0.5)*1,
            life: 1,
            color: color
        });
    }
}

function update(dt) {
    if (gameState !== 'playing') return;
    
    const gravity = -12;
    const friction = 0.9;
    
    // Input
    if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= player.moveSpeed * dt;
    if (keys['ArrowRight'] || keys['KeyD']) player.vx += player.moveSpeed * dt;
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
        playSound(600, 0.15, 'sine');
    }
    
    // Physics
    player.vy += gravity * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.z += player.vz * dt;
    player.vx *= friction;
    
    // Platform collision
    player.onGround = false;
    for (let p of platforms) {
        const dx = Math.abs(player.x - p.x);
        const dz = Math.abs(player.z - p.z);
        if (dx < p.width / 2 + player.radius && dz < p.width / 2 + player.radius) {
            if (player.y <= p.y + 0.15 && player.vy <= 0) {
                player.y = p.y;
                player.vy = 0;
                player.onGround = true;
                
                // Score for landing on new platform
                const idx = platforms.indexOf(p);
                if (idx > 2 && score < idx - 1) {
                    score = idx - 1;
                    playSound(800 + score * 20, 0.1, 'triangle');
                    spawnParticles(player.x, player.y, player.z, '#4af', 5);
                }
            }
        }
    }
    
    // Fall death
    if (player.y < -3) {
        gameState = 'gameover';
        playSound(200, 0.5, 'sawtooth');
        try { 
            if (score > highScore) { highScore = score; localStorage.setItem('gravity3d_high', highScore); }
        } catch(e) {}
    }
    
    // Move forward
    player.z += 2 * dt;
    
    // Keep platforms ahead
    const lastZ = platforms[platforms.length - 1].z;
    while (lastZ < player.z + 40) {
        const gap = 3.5 + Math.random() * 3 + score * 0.05;
        const newX = lastZ === 5 ? 0 : (Math.random() - 0.5) * 5;
        platforms.push(createPlatform(lastZ + gap, Math.max(-5, Math.min(5, newX))));
    }
    
    // Remove far behind platforms
    while (platforms.length > 0 && platforms[0].z < player.z - 15) {
        platforms.shift();
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.z += pt.vz * dt;
        pt.vy -= 5 * dt;
        pt.life -= dt * 2;
        if (pt.life <= 0) particles.splice(i, 1);
    }
    
    // Grid animation
    gridOffset = (gridOffset + dt * 2) % 4;
}

function drawGrid() {
    const gridSize = 20;
    ctx.strokeStyle = 'rgba(50, 80, 150, 0.3)';
    ctx.lineWidth = 1;
    
    // Floor grid
    for (let i = -gridSize; i <= gridSize; i += 4) {
        const zStart = player ? player.z - 5 : CAM_BACK + 1;
        const p1 = project(i, -0.5, zStart);
        const p2 = project(i, -0.5, zStart + 30);
        if (p1 && p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
    }
    
    for (let j = 0; j < 30; j += 4) {
        const z = zStart + j;
        const p1 = project(-gridSize, -0.5, z);
        const p2 = project(gridSize, -0.5, z);
        if (p1 && p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
    }
}

function drawPlatform(p, time) {
    const hw = p.width / 2;
    const depth = 0.8;
    
    // Top face
    const corners = [
        project(p.x - hw, p.y + 0.15, p.z - hw),
        project(p.x + hw, p.y + 0.15, p.z - hw),
        project(p.x + hw, p.y + 0.15, p.z + hw),
        project(p.x - hw, p.y + 0.15, p.z + hw)
    ];
    
    if (corners.some(c => c === null)) return;
    
    // Glow effect
    const glowIntensity = 0.3 + Math.sin(time * 2 + p.glow) * 0.2;
    
    // Draw sides
    const sideCorners = [
        project(p.x - hw, p.y - depth, p.z - hw),
        project(p.x + hw, p.y - depth, p.z - hw),
        project(p.x + hw, p.y - depth, p.z + hw),
        project(p.x - hw, p.y - depth, p.z + hw)
    ];
    
    // Front face
    ctx.fillStyle = `rgba(30, 60, 120, ${glowIntensity})`;
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    ctx.lineTo(corners[1].x, corners[1].y);
    ctx.lineTo(sideCorners[1].x, sideCorners[1].y);
    ctx.lineTo(sideCorners[0].x, sideCorners[0].y);
    ctx.closePath();
    ctx.fill();
    
    // Right face
    ctx.fillStyle = `rgba(20, 40, 100, ${glowIntensity})`;
    ctx.beginPath();
    ctx.moveTo(corners[1].x, corners[1].y);
    ctx.lineTo(corners[2].x, corners[2].y);
    ctx.lineTo(sideCorners[2].x, sideCorners[2].y);
    ctx.lineTo(sideCorners[1].x, sideCorners[1].y);
    ctx.closePath();
    ctx.fill();
    
    // Top face
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    ctx.lineTo(corners[1].x, corners[1].y);
    ctx.lineTo(corners[2].x, corners[2].y);
    ctx.lineTo(corners[3].x, corners[3].y);
    ctx.closePath();
    ctx.fill();
    
    // Top edge glow
    ctx.strokeStyle = `rgba(255, 255, 255, ${glowIntensity * 0.8})`;
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawPlayer(time) {
    const p = project(player.x, player.y + player.radius, player.z);
    if (!p) return;
    
    const r = player.radius * p.scale * 0.8;
    
    // Shadow
    const shadow = project(player.x, 0, player.z);
    if (shadow) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(shadow.x, shadow.y, r * 0.8, r * 0.3, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Body - glowing orb
    const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    gradient.addColorStop(0, 'rgba(100, 200, 255, 1)');
    gradient.addColorStop(0.5, 'rgba(50, 150, 255, 0.8)');
    gradient.addColorStop(1, 'rgba(20, 80, 200, 0.3)');
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(p.x, p.y - r * 0.5, r, 0, Math.PI * 2);
    ctx.fill();
    
    // Inner glow
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(p.x - r * 0.2, p.y - r * 0.7, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    // Trail
    if (player.vy > 1) {
        ctx.strokeStyle = `rgba(100, 200, 255, ${Math.min(0.5, player.vy * 0.1)})`;
        ctx.lineWidth = r * 0.4;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x, p.y + r * player.vy * 2);
        ctx.stroke();
    }
}

function drawParticles() {
    for (const pt of particles) {
        const p = project(pt.x, pt.y, pt.z);
        if (!p) continue;
        const r = 3 * p.scale * pt.life;
        ctx.fillStyle = `rgba(100, 200, 255, ${pt.life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawBackground() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(0.5, '#1a1a4e');
    grad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    const starSeed = 12345;
    for (let i = 0; i < 80; i++) {
        const sx = ((starSeed * (i+1) * 7 + i * 13) % W);
        const sy = ((starSeed * (i+1) * 11 + i * 5) % (H * 0.6));
        const twinkle = Math.sin(Date.now() * 0.003 + i) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + twinkle * 0.4})`;
        ctx.beginPath();
        ctx.arc(sx, sy, 1 + twinkle, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawUI() {
    // Score
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 30, 50);
    
    ctx.font = '18px monospace';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.fillText(`BEST: ${highScore}`, 30, 80);
}

function drawStartScreen() {
    drawBackground();
    
    // Title
    ctx.fillStyle = '#4af';
    ctx.font = 'bold 72px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GRAVITY', W/2, H/2 - 80);
    ctx.font = 'bold 90px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('3D', W/2, H/2 - 10);
    
    // Controls
    ctx.font = '20px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('← → or A/D : Move', W/2, H/2 + 60);
    ctx.fillText('SPACE / ↑ / W : Jump', W/2, H/2 + 95);
    ctx.fillText('Navigate the floating platforms!', W/2, H/2 + 140);
    
    // Start prompt
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(100, 200, 255, ${pulse})`;
    ctx.font = 'bold 24px monospace';
    ctx.fillText('PRESS SPACE TO START', W/2, H/2 + 210);
    
    if (highScore > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '16px monospace';
        ctx.fillText(`High Score: ${highScore}`, W/2, H/2 + 260);
    }
}

function drawGameOver() {
    // Darken
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 60px monospace';
    ctx.fillText('GAME OVER', W/2, H/2 - 40);
    
    ctx.fillStyle = '#fff';
    ctx.font = '30px monospace';
    ctx.fillText(`Score: ${score}`, W/2, H/2 + 20);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff0';
        ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 60);
    } else {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '20px monospace';
        ctx.fillText(`Best: ${highScore}`, W/2, H/2 + 60);
    }
    
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(100, 200, 255, ${pulse})`;
    ctx.font = '22px monospace';
    ctx.fillText('PRESS R TO RESTART', W/2, H/2 + 130);
}

let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'playing') {
        update(dt);
        drawBackground();
        
        const zStart = player ? player.z - 3 : CAM_BACK + 1;
        for (let j = 0; j < 40; j += 2) {
            const z = Math.floor(zStart / 2) * 2 + j;
            const p1 = project(-8, -0.5, z);
            const p2 = project(8, -0.5, z);
            if (p1 && p2) {
                ctx.strokeStyle = `rgba(50, 80, 150, ${Math.max(0, 1 - Math.abs(z - player.z) / 30)})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }
        
        for (let i = -8; i <= 8; i += 2) {
            const p1 = project(i, -0.5, zStart);
            const p2 = project(i, -0.5, zStart + 40);
            if (p1 && p2) {
                ctx.strokeStyle = 'rgba(50, 80, 150, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }
        }
        
        // Sort platforms by z (far to near)
        const sortedPlatforms = [...platforms].sort((a, b) => b.z - a.z);
        for (const p of sortedPlatforms) {
            if (p.z > CAM_BACK + 0.5 && p.z < player.z + 40) {
                drawPlatform(p, timestamp * 0.001);
            }
        }
        
        drawParticles();
        drawPlayer(timestamp * 0.001);
        drawUI();
    } else if (gameState === 'gameover') {
        drawBackground();
        const sortedPlatforms = [...platforms].sort((a, b) => b.z - a.z);
        for (const p of sortedPlatforms) {
            if (p.z > CAM_BACK + 0.5 && p.z < player.z + 40) {
                drawPlatform(p, timestamp * 0.001);
            }
        }
        drawParticles();
        drawUI();
        drawGameOver();
    }
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
