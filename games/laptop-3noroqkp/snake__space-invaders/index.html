<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, CELL, COLS, ROWS;
let gameState = 'start'; // start, playing, gameover
let snake = [], dir = {x:1, y:0}, nextDir = {x:1, y:0};
let bullets = [];
let aliens = [];
let foods = [];
let particles = [];
let score = 0, highScore = 0;
let tickTimer = 0, lastTime = 0;
let alienTimer = 0, alienInterval = 1200;
let shootCooldown = 0;
let audioCtx = null;

try { highScore = parseInt(localStorage.getItem('sis_high') || '0'); } catch(e) {}

function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    COLS = Math.floor(W / 40);
    ROWS = Math.floor(H / 40);
    CELL = Math.min(Math.floor(W / COLS), Math.floor(H / ROWS));
}
window.addEventListener('resize', resize);
resize();

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, dur, type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function resetGame() {
    const midY = Math.floor(ROWS * 0.75);
    const midX = Math.floor(COLS * 0.3);
    snake = [{x: midX, y: midY}, {x: midX-1, y: midY}, {x: midX-2, y: midY}];
    dir = {x:1, y:0}; nextDir = {x:1, y:0};
    bullets = []; aliens = []; foods = []; particles = [];
    score = 0; tickTimer = 0; alienTimer = 0; shootCooldown = 0;
    spawnFood();
}

function spawnFood() {
    let fx, fy, attempts = 0;
    do {
        fx = Math.floor(Math.random() * COLS);
        fy = Math.floor(Math.random() * (ROWS - 2)) + 1;
        attempts++;
    } while (attempts < 100 && (snake.some(s => s.x===fx && s.y===fy) || foods.some(f => f.x===fx && f.y===fy)));
    foods.push({x: fx, y: fy});
}

function spawnAliens() {
    const row = 0;
    const count = Math.min(3 + Math.floor(score/100), 6);
    for (let i = 0; i < count; i++) {
        const ax = Math.floor(COLS * 0.2) + i * Math.floor(COLS * 0.6 / count);
        aliens.push({x: ax, y: row, frame: 0});
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: x * CELL + CELL/2, y: y * CELL + CELL/2,
            vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
            life: 1, color
        });
    }
}

function tick() {
    // Move snake
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    
    // Check wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
    }
    // Check self collision
    for (let s of snake) {
        if (s.x === head.x && s.y === head.y) return gameOver();
    }
    
    snake.unshift(head);
    
    // Check food
    let ate = false;
    for (let i = foods.length-1; i >= 0; i--) {
        if (foods[i].x === head.x && foods[i].y === head.y) {
            score += 10;
            spawnParticles(head.x, head.y, '#4f4');
            playSound(600, 0.1);
            foods.splice(i, 1);
            ate = true;
        }
    }
    if (!ate) snake.pop();

    // Move aliens down
    for (let a of aliens) { a.y++; }
    
    // Check if alien reached bottom
    for (let a of aliens) {
        if (a.y >= ROWS - 1) return gameOver();
    }

    // Check if alien hits snake
    for (let i = aliens.length-1; i >= 0; i--) {
        for (let s of snake) {
            if (aliens[i].x === s.x && aliens[i].y === s.y) return gameOver();
        }
    }

    // Move bullets
    for (let i = bullets.length-1; i >= 0; i--) {
        bullets[i].y--;
        if (bullets[i].y < 0) { bullets.splice(i,1); continue; }
        for (let j = aliens.length-1; j >= 0; j--) {
            if (bullets[i].x === aliens[j].x && bullets[i].y === aliens[j].y) {
                score += 25;
                spawnParticles(aliens[j].x, aliens[j].y, '#f44');
                playSound(300, 0.15);
                aliens.splice(j,1);
                bullets.splice(i,1);
                break;
            }
        }
    }

    // Spawn aliens periodically
    alienTimer += 100;
    if (alienTimer >= alienInterval) {
        alienTimer = 0;
        spawnAliens();
    }
}

function gameOver() {
    gameState = 'gameover';
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('sis_high', highScore); } catch(e) {}
    }
    playSound(150, 0.5, 'sawtooth');
}

function update(dt) {
    if (gameState !== 'playing') return;
    
    tickTimer += dt;
    const speed = Math.max(80, 150 - snake.length * 2);
    if (tickTimer >= speed) {
        tickTimer -= speed;
        tick();
    }

    // Particles
    for (let i = particles.length-1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].life -= dt * 0.003;
        if (particles[i].life <= 0) particles.splice(i,1);
    }

    // Shoot cooldown
    if (shootCooldown > 0) shootCooldown -= dt;
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Grid subtle
    ctx.strokeStyle = 'rgba(30,40,80,0.3)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, ROWS*CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(COLS*CELL, y*CELL); ctx.stroke();
    }

    if (gameState === 'playing' || gameState === 'gameover') {
        // Draw foods
        for (let f of foods) {
            ctx.fillStyle = '#4f4';
            ctx.beginPath();
            ctx.arc(f.x*CELL + CELL/2, f.y*CELL + CELL/2, CELL*0.35, 0, Math.PI*2);
            ctx.fill();
        }

        // Draw aliens
        for (let a of aliens) {
            const px = a.x * CELL, py = a.y * CELL;
            ctx.fillStyle = '#f44';
            // Simple alien shape
            ctx.fillRect(px + 2, py + 2, CELL-4, CELL-4);
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(px + 5, py + 5, 5, 5);
            ctx.fillRect(px + CELL - 10, py + 5, 5, 5);
            ctx.fillRect(px + 7, py + CELL - 8, CELL - 14, 3);
        }

        // Draw bullets
        for (let b of bullets) {
            ctx.fillStyle = '#ff0';
            ctx.fillRect(b.x*CELL + CELL/2 - 2, b.y*CELL, 4, CELL);
        }

        // Draw snake
        for (let i = 0; i < snake.length; i++) {
            const s = snake[i];
            if (i === 0) {
                ctx.fillStyle = '#0f8';
            } else {
                const t = 1 - (i / snake.length);
                ctx.fillStyle = `rgb(0, ${Math.floor(200*t)}, ${Math.floor(100*t)})`;
            }
            ctx.fillRect(s.x*CELL + 1, s.y*CELL + 1, CELL-2, CELL-2);
            
            if (i === 0) {
                // Eyes
                ctx.fillStyle = '#fff';
                const ex = s.x*CELL + (dir.x > 0 ? CELL-10 : dir.x < 0 ? 4 : CELL/2 - 5);
                const ey = s.y*CELL + (dir.y > 0 ? CELL-8 : dir.y < 0 ? 4 : CELL/2 - 3);
                ctx.fillRect(ex, ey, 4, 4);
            }
        }

        // Draw particles
        for (let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
            ctx.globalAlpha = 1;
        }

        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(16, CELL*0.5)}px monospace`;
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 10, 20);
        ctx.textAlign = 'right';
        ctx.fillText(`HI: ${highScore}`, W - 10, 20);
    }

    if (gameState === 'start') {
        drawStartScreen();
    }
    if (gameState === 'gameover') {
        drawGameOver();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    const fs = Math.min(W/8, 48);
    ctx.font = `bold ${fs}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0f8';
    ctx.fillText('SPACE INVADERS', W/2, H*0.25);
    ctx.fillStyle = '#f44';
    ctx.fillText('SNAKE', W/2, H*0.25 + fs);

    // Instructions
    const ifs = Math.min(W/20, 16);
    ctx.font = `${ifs}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('Arrow Keys / WASD - Move Snake', W/2, H*0.45);
    ctx.fillText('SPACE - Shoot Bullets', W/2, H*0.45 + ifs*1.5);
    ctx.fillText('Eat green food to grow', W/2, H*0.45 + ifs*3);
    ctx.fillText('Destroy red aliens before they reach you!', W/2, H*0.45 + ifs*4.5);
    ctx.fillText('', W/2, H*0.45 + ifs*6);
    ctx.fillStyle = '#ff0';
    ctx.font = `bold ${ifs}px monospace`;
    ctx.fillText('Press ENTER to Start', W/2, H*0.75);
    
    if (highScore > 0) {
        ctx.fillStyle = '#88f';
        ctx.fillText(`High Score: ${highScore}`, W/2, H*0.85);
    }

    // Decorative aliens
    const t = Date.now() * 0.001;
    for (let i = 0; i < 5; i++) {
        const ax = W*0.2 + i * W*0.15;
        const ay = H*0.1 + Math.sin(t + i) * 10;
        ctx.fillStyle = '#f44';
        ctx.fillRect(ax-8, ay-8, 16, 16);
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(ax-5, ay-5, 3, 3);
        ctx.fillRect(ax+2, ay-5, 3, 3);
    }
}

function drawGameOver() {
    const fs = Math.min(W/6, 40);
    ctx.font = `bold ${fs}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44';
    ctx.fillText('GAME OVER', W/2, H*0.3);
    
    const ifs = Math.min(W/18, 20);
    ctx.font = `${ifs}px monospace`;
    ctx.fillStyle = '#fff';
    ctx.fillText(`Score: ${score}`, W/2, H*0.45);
    ctx.fillText(`High: ${highScore}`, W/2, H*0.45 + ifs*1.5);
    
    ctx.fillStyle = '#ff0';
    ctx.fillText('Press ENTER to Restart', W/2, H*0.7);
}

function shoot() {
    if (shootCooldown > 0) return;
    shootCooldown = 200;
    const head = snake[0];
    bullets.push({x: head.x, y: head.y - 1});
    playSound(800, 0.05);
}

let keysDown = {};
window.addEventListener('keydown', (e) => {
    keysDown[e.key] = true;
    
    if (gameState === 'start' || gameState === 'gameover') {
        if (e.key === 'Enter' || e.key === ' ') {
            initAudio();
            resetGame();
            gameState = 'playing';
        }
        return;
    }

    if (gameState !== 'playing') return;

    // Direction changes
    if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dir.y === 0) {
        nextDir = {x:0, y:-1};
    } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dir.y === 0) {
        nextDir = {x:0, y:1};
    } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dir.x === 0) {
        nextDir = {x:-1, y:0};
    } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dir.x === 0) {
        nextDir = {x:1, y:0};
    }

    // Shoot
    if (e.key === ' ') {
        e.preventDefault();
        shoot();
    }
});

window.addEventListener('keyup', (e) => { keysDown[e.key] = false; });

// Auto-shoot while holding space
function checkAutoShoot() {
    if (gameState !== 'playing') return;
    if (keysDown[' '] && shootCooldown <= 0) shoot();
}

let lastFrame = performance.now();
function gameLoop(now) {
    const dt = Math.min(now - lastFrame, 100);
    lastFrame = now;
    
    if (gameState === 'playing') {
        // Apply direction change once per tick
        dir = {...nextDir};
        update(dt);
        checkAutoShoot();
    }
    
    draw();
    requestAnimationFrame(gameLoop);
}

resetGame();
gameState = 'start';
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
