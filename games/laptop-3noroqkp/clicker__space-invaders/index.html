<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Clicker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'kill') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'combo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'wave') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 1);
    } else if (type === 'boss') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.05);
    }
}

// Game State
const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
let gameState = STATE.MENU;
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('sic_highscore') || '0'); } catch(e) {}
let wave = 0;
let lives = 5;
let combo = 0;
let comboTimer = 0;
let shakeX = 0, shakeY = 0, shakeMag = 0;

// Stars
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 + 0.1 });
    }
}
initStars();

// Aliens
let aliens = [];
let particles = [];
let projectiles = [];
let floatingTexts = [];

const ALIEN_TYPES = [
    { rows: 5, w: 8, h: 7, points: 10, hp: 1, color: '#4f4', speed: 1 },
    { rows: 5, w: 8, h: 7, points: 20, hp: 1, color: '#4ff', speed: 1.2 },
    { rows: 5, w: 8, h: 7, points: 30, hp: 2, color: '#f4f', speed: 0.9 },
];

function drawAlienSprite(x, y, size, type, frame, hp, maxHp) {
    const s = size / 8;
    ctx.save();
    ctx.translate(x, y);
    
    let color = ALIEN_TYPES[type].color;
    if (maxHp > 1 && hp < maxHp) color = '#f66';
    
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    
    // Simple pixel alien shapes
    const patterns = [
        // Type 0 - crab
        [[2,0],[3,0],[4,0],[5,0],
         [1,1],[2,1],[3,1],[4,1],[5,1],[6,1],
         [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],
         [0,3],[7,3],
         [0,4],[1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],
         [0,5],[2,5],[3,5],[4,5],[5,5],[7,5]],
        // Type 1 - invader
        [[2,0],[3,0],[4,0],[5,0],
         [1,1],[2,1],[3,1],[4,1],[5,1],[6,1],
         [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],
         [0,3],[7,3],
         [0,4],[7,4],
         [1,5],[2,5],[7,5],[6,5]],
        // Type 2 - squid
        [[1,0],[2,0],[5,0],[6,0],
         [0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],
         [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],
         [0,3],[2,3],[3,3],[4,3],[5,3],[7,3],
         [0,4],[7,4]],
    ];
    
    const pat = patterns[type];
    if (frame === 1) {
        // Alternate frame - shift slightly
        for (const [px, py] of pat) {
            ctx.fillRect((px + 0.5) * s, (py + 0.3) * s, s, s);
        }
    } else {
        for (const [px, py] of pat) {
            ctx.fillRect(px * s, py * s, s, s);
        }
    }
    
    // HP bar for multi-hp aliens
    if (maxHp > 1) {
        ctx.shadowBlur = 0;
        const bw = size;
        ctx.fillStyle = '#333';
        ctx.fillRect(x - bw/2, y + 4, bw, 3);
        ctx.fillStyle = hp > maxHp/2 ? '#0f0' : '#f00';
        ctx.fillRect(x - bw/2, y + 4, bw * (hp/maxHp), 3);
    }
    
    ctx.restore();
}

function spawnWave() {
    wave++;
    playSound('wave');
    const cols = Math.min(8 + Math.floor(wave / 2), 14);
    const rows = Math.min(4 + Math.floor(wave / 3), 8);
    const speed = 0.3 + wave * 0.05;
    const typeCycle = [0, 0, 1, 0, 1, 2];
    
    const alienW = Math.min(40, W / (cols * 1.8));
    const spacingX = (W - 100) / cols;
    const spacingY = 50 + wave * 2;
    
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const type = typeCycle[(r * cols + c) % typeCycle.length];
            if (wave > 5 && Math.random() < 0.3) {
                // Some aliens get extra HP in later waves
                ALIEN_TYPES[type].hp = 1 + Math.floor(wave / 4);
            } else {
                ALIEN_TYPES[type].hp = 1;
            }
            
            const a = {
                x: 50 + c * spacingX + spacingX/2,
                y: -30 - r * spacingY,
                targetY: 80 + r * (H * 0.6 / rows),
                size: alienW,
                type: type,
                hp: ALIEN_TYPES[type].hp,
                maxHp: ALIEN_TYPES[type].hp,
                speed: speed * (ALIEN_TYPES[type].speed || 1),
                points: Math.floor(ALIEN_TYPES[type].points * (1 + wave * 0.1)),
                wobble: Math.random() * Math.PI * 2,
                alive: true
            };
            aliens.push(a);
        }
    }
    
    // Boss every 5 waves
    if (wave % 5 === 0) {
        const boss = {
            x: W / 2,
            y: -60,
            targetY: H * 0.15,
            size: Math.min(80, W * 0.15),
            type: 2,
            hp: 10 + wave,
            maxHp: 10 + wave,
            speed: 0.2,
            points: 500 + wave * 50,
            wobble: 0,
            alive: true,
            boss: true
        };
        aliens.push(boss);
        playSound('boss');
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: Math.random() * 0.03 + 0.02,
            size: Math.random() * 4 + 2,
            color: color
        });
    }
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
}

function handleClick(mx, my) {
    initAudio();
    
    if (gameState === STATE.MENU || gameState === STATE.GAMEOVER) {
        startGame();
        return;
    }
    
    let hit = false;
    
    // Check aliens (reverse order so top ones are checked first)
    for (let i = aliens.length - 1; i >= 0; i--) {
        const a = aliens[i];
        if (!a.alive) continue;
        const dx = mx - a.x;
        const dy = my - a.y;
        const r = a.size * 0.7;
        if (dx * dx + dy * dy < r * r) {
            hit = true;
            a.hp--;
            playSound('shoot');
            
            if (a.hp <= 0) {
                a.alive = false;
                combo++;
                comboTimer = 60;
                const mult = Math.min(combo, 10);
                const pts = a.points * mult;
                score += pts;
                playSound('kill');
                if (combo > 1 && combo % 5 === 0) playSound('combo');
                addFloatingText(a.x, a.y, `+${pts}`, '#ff0');
                if (combo >= 3) addFloatingText(a.x, a.y - 20, `x${mult} COMBO!`, '#f80');
                spawnParticles(a.x, a.y, ALIEN_TYPES[a.type].color, a.boss ? 40 : 15);
                shakeMag = a.boss ? 8 : 3;
                
                if (score > highScore) {
                    highScore = score;
                    try { localStorage.setItem('sic_highscore', String(highScore)); } catch(e) {}
                }
            } else {
                addFloatingText(a.x, a.y, 'HIT!', '#fff');
                spawnParticles(mx, my, '#fff', 5);
                shakeMag = 2;
            }
            break;
        }
    }
    
    if (!hit) {
        // Miss - reset combo
        if (combo > 2) {
            addFloatingText(mx, my, 'MISS', '#888');
        }
        combo = 0;
        playSound('hit');
    }
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    handleClick(mx, my);
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = touch.clientX - rect.left;
    const my = touch.clientY - rect.top;
    handleClick(mx, my);
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
        if (gameState !== STATE.PLAYING) startGame();
    }
    if (e.code === 'KeyR' && gameState === STATE.GAMEOVER) startGame();
});

function startGame() {
    initAudio();
    gameState = STATE.PLAYING;
    score = 0;
    wave = 0;
    lives = 5;
    combo = 0;
    comboTimer = 0;
    aliens = [];
    particles = [];
    floatingTexts = [];
    spawnWave();
}

function update() {
    if (gameState !== STATE.PLAYING) return;
    
    // Combo timer
    if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer === 0) combo = 0;
    }
    
    // Shake decay
    shakeMag *= 0.85;
    if (shakeMag < 0.1) shakeMag = 0;
    shakeX = (Math.random() - 0.5) * shakeMag;
    shakeY = (Math.random() - 0.5) * shakeMag;
    
    // Update aliens
    const frame = Math.floor(Date.now() / 300) % 2;
    let allDead = true;
    
    for (const a of aliens) {
        if (!a.alive) continue;
        allDead = false;
        
        if (a.y < a.targetY) {
            a.y += a.speed;
        } else {
            // Reached target - start moving down slowly
            a.y += 0.3 + wave * 0.05;
            a.wobble += 0.02;
            a.x += Math.sin(a.wobble) * 0.5;
            
            // If alien reaches bottom
            if (a.y > H - 60) {
                a.alive = false;
                lives--;
                combo = 0;
                spawnParticles(a.x, H - 40, '#f00', 20);
                shakeMag = 6;
                playSound('gameover');
                if (lives <= 0) {
                    gameState = STATE.GAMEOVER;
                    return;
                }
            }
        }
    }
    
    // Remove dead aliens
    aliens = aliens.filter(a => a.alive);
    
    // Check if wave is over
    if (allDead && aliens.length === 0) {
        setTimeout(() => {
            if (gameState === STATE.PLAYING) spawnWave();
        }, 1500);
    }
    
    // Update particles
    for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);
    
    // Update floating texts
    for (const ft of floatingTexts) {
        ft.y += ft.vy;
        ft.life -= 0.02;
    }
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
}

function draw() {
    ctx.save();
    ctx.translate(shakeX, shakeY);
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    
    // Stars
    ctx.fillStyle = '#fff';
    for (const s of stars) {
        s.y += s.sp;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 1000 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
    
    if (gameState === STATE.MENU) {
        drawMenu();
    } else if (gameState === STATE.PLAYING || gameState === STATE.GAMEOVER) {
        drawGame();
        if (gameState === STATE.GAMEOVER) drawGameOver();
    }
    
    ctx.restore();
}

function drawMenu() {
    const frame = Math.floor(Date.now() / 300) % 2;
    
    // Title
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4f4';
    ctx.font = `bold ${Math.min(W*0.08, 60)}px monospace`;
    ctx.shadowColor = '#4f4';
    ctx.shadowBlur = 20;
    ctx.fillText('SPACE INVADERS', W/2, H * 0.25);
    
    ctx.fillStyle = '#4ff';
    ctx.font = `bold ${Math.min(W*0.05, 36)}px monospace`;
    ctx.shadowColor = '#4ff';
    ctx.fillText('CLICKER', W/2, H * 0.33);
    
    // Demo aliens
    const demoTypes = [0, 1, 2];
    for (let i = 0; i < 3; i++) {
        drawAlienSprite(W/2 - 80 + i * 80, H * 0.45, 40, i, frame, 99, 1);
    }
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W*0.025, 18)}px monospace`;
    ctx.fillText('CLICK ALIENS TO DESTROY THEM', W/2, H * 0.6);
    ctx.fillText('DON\'T LET THEM REACH THE BOTTOM!', W/2, H * 0.65);
    ctx.fillText('CHAIN KILLS FOR COMBO MULTIPLIERS', W/2, H * 0.7);
    
    if (highScore > 0) {
        ctx.fillStyle = '#ff0';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H * 0.78);
    }
    
    // Blinking prompt
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.min(W*0.03, 24)}px monospace`;
        ctx.fillText('[ CLICK TO START ]', W/2, H * 0.88);
    }
}

function drawGame() {
    const frame = Math.floor(Date.now() / 300) % 2;
    
    // Draw aliens
    for (const a of aliens) {
        if (!a.alive) continue;
        drawAlienSprite(a.x, a.y, a.size, a.type, frame, a.hp, a.maxHp);
    }
    
    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // Floating texts
    for (const ft of floatingTexts) {
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.font = `bold ${Math.min(W*0.02, 16)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
    
    // Ground / danger zone
    const groundY = H - 50;
    ctx.fillStyle = '#222';
    ctx.fillRect(0, groundY, W, 50);
    ctx.strokeStyle = '#f44';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    
    // City silhouettes
    for (let i = 0; i < Math.floor(W / 40); i++) {
        const bh = 15 + (i * 7) % 25;
        ctx.fillStyle = '#333';
        ctx.fillRect(i * 40 + 5, groundY + 50 - bh, 30, bh);
    }
    
    // HUD
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(W*0.025, 20)}px monospace`;
    ctx.fillText(`SCORE: ${score}`, 15, 30);
    ctx.fillStyle = '#ff0';
    ctx.fillText(`WAVE: ${wave}`, 15, 55);
    
    if (combo > 1) {
        ctx.fillStyle = combo >= 5 ? '#f44' : '#ff0';
        ctx.fillText(`COMBO: x${Math.min(combo, 10)}`, 15, 80);
    }
    
    // Lives
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f44';
    let lifeStr = '';
    for (let i = 0; i < lives; i++) lifeStr += '♥ ';
    ctx.fillText(lifeStr.trim(), W - 15, 30);
    
    // High score
    ctx.fillStyle = '#888';
    ctx.font = `${Math.min(W*0.02, 14)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`BEST: ${highScore}`, W/2, 30);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44';
    ctx.font = `bold ${Math.min(W*0.06, 50)}px monospace`;
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', W/2, H * 0.3);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W*0.03, 24)}px monospace`;
    ctx.fillText(`FINAL SCORE: ${score}`, W/2, H * 0.45);
    ctx.fillText(`WAVES SURVIVED: ${wave}`, W/2, H * 0.52);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff0';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H * 0.6);
    }
    
    ctx.fillStyle = '#8f8';
    ctx.font = `bold ${Math.min(W*0.03, 22)}px monospace`;
    if (Math.floor(Date.now() / 500) % 2 === 0) {
        ctx.fillText('[ CLICK TO RESTART ]', W/2, H * 0.75);
    }
}

// Game Loop
let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min(time - lastTime, 50);
    lastTime = time;
    
    update();
    draw();
    
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
