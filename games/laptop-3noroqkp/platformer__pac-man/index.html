<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Platformer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Audio
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'pellet') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'death') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'win') {
            osc.type = 'sine';
            const notes = [523, 659, 784, 1047];
            notes.forEach((f, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = 'sine';
                o.frequency.value = f;
                g.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.15);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.2);
                o.start(audioCtx.currentTime + i * 0.15);
                o.stop(audioCtx.currentTime + i * 0.15 + 0.2);
            });
        }
    }

    // Game state
    let gameState = 'START'; // START, PLAYING, DEAD, WIN
    let score = 0;
    let pelletsCollected = 0;
    let totalPellets = 0;
    let deathTimer = 0;
    let winTimer = 0;

    // Input
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (gameState === 'START' || gameState === 'DEAD' || gameState === 'WIN') {
            if (e.code === 'Space' || e.code === 'Enter') {
                initAudio();
                startGame();
            }
        }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // Level data
    let platforms = [];
    let pellets = [];
    let ghosts = [];
    let particles = [];

    const GRAVITY = 0.6;
    const JUMP_VEL = -12;
    const MOVE_SPEED = 5;
    const GHOST_SPEED = 2;

    // Player
    let player = { x: 0, y: 0, vx: 0, vy: 0, w: 30, h: 30, onGround: false, mouthAngle: 0, facing: 1 };

    // Camera
    let camX = 0;
    let camY = 0;

    function generateLevel() {
        platforms = [];
        pellets = [];
        ghosts = [];
        particles = [];
        score = 0;
        pelletsCollected = 0;
        totalPellets = 0;

        const levelWidth = 4000;
        const groundY = H - 50;

        // Ground segments with gaps
        let x = 0;
        while (x < levelWidth) {
            const segW = 200 + Math.random() * 300;
            if (Math.random() > 0.3 || x === 0) {
                platforms.push({ x: x, y: groundY, w: Math.min(segW, levelWidth - x), h: 50 });
                // Add pellets on ground
                for (let px = x + 20; px < x + segW - 20; px += 40) {
                    if (Math.random() > 0.3) {
                        pellets.push({ x: px, y: groundY - 15, collected: false });
                        totalPellets++;
                    }
                }
            }
            x += segW + (Math.random() > 0.4 ? 80 : 0);
        }

        // Floating platforms
        const numFloats = 20;
        for (let i = 0; i < numFloats; i++) {
            const px = 150 + Math.random() * (levelWidth - 300);
            const py = groundY - 80 - Math.random() * (H * 0.5);
            const pw = 100 + Math.random() * 150;
            platforms.push({ x: px, y: py, w: pw, h: 20 });
            // Pellets on floating platforms
            for (let fpx = px + 15; fpx < px + pw - 15; fpx += 35) {
                if (Math.random() > 0.4) {
                    pellets.push({ x: fpx, y: py - 15, collected: false });
                    totalPellets++;
                }
            }
        }

        // Ghosts
        const ghostColors = ['#ff0000', '#ff69b4', '#00ffff', '#ffa500'];
        const numGhosts = 5;
        for (let i = 0; i < numGhosts; i++) {
            // Place ghosts on platforms away from start
            const gp = platforms[1 + Math.floor(Math.random() * (platforms.length - 2))] || platforms[0];
            if (!gp) continue;
            ghosts.push({
                x: gp.x + gp.w / 2,
                y: gp.y - 35,
                w: 30, h: 35,
                vx: GHOST_SPEED * (Math.random() > 0.5 ? 1 : -1),
                vy: 0,
                color: ghostColors[i % 4],
                onGround: false,
                platform: gp,
                patrol: true,
                eyeY: 0
            });
        }

        // Player start
        player.x = 60;
        player.y = groundY - player.h - 10;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;
        player.facing = 1;

        camX = 0;
        camY = 0;
    }

    function startGame() {
        generateLevel();
        gameState = 'PLAYING';
    }

    // Collision detection
    function rectCollide(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        // Player input
        if (keys['ArrowLeft'] || keys['KeyA']) {
            player.vx = -MOVE_SPEED;
            player.facing = -1;
        } else if (keys['ArrowRight'] || keys['KeyD']) {
            player.vx = MOVE_SPEED;
            player.facing = 1;
        } else {
            player.vx *= 0.7;
        }

        if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
            player.vy = JUMP_VEL;
            player.onGround = false;
            playSound('jump');
        }

        // Physics
        player.vy += GRAVITY;
        player.x += player.vx;
        player.y += player.vy;

        // Platform collision
        player.onGround = false;
        for (let p of platforms) {
            if (rectCollide(player, p)) {
                // Landing on top
                if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 5) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                }
                // Hitting from below
                else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 5) {
                    player.y = p.y + p.h;
                    player.vy = 0;
                }
                // Side collision
                else if (player.vx > 0) {
                    player.x = p.x - player.w;
                    player.vx = 0;
                } else if (player.vx < 0) {
                    player.x = p.x + p.w;
                    player.vx = 0;
                }
            }
        }

        // Fell off world
        if (player.y > H + 100) {
            die();
            return;
        }

        // Mouth animation
        player.mouthAngle += 0.15 * (Math.abs(player.vx) > 0.5 ? 1 : 0.3);

        // Pellet collection
        for (let pel of pellets) {
            if (!pel.collected) {
                const dx = player.x + player.w / 2 - pel.x;
                const dy = player.y + player.h / 2 - pel.y;
                if (Math.sqrt(dx * dx + dy * dy) < 20) {
                    pel.collected = true;
                    pelletsCollected++;
                    score += 10;
                    playSound('pellet');
                    // Particles
                    for (let i = 0; i < 5; i++) {
                        particles.push({
                            x: pel.x, y: pel.y,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4 - 2,
                            life: 20, maxLife: 20
                        });
                    }
                }
            }
        }

        // Ghost AI
        for (let g of ghosts) {
            // Simple patrol + chase
            const dx = player.x - g.x;
            const dy = player.y - g.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 300 && !g.patrol) {
                g.vx = Math.sign(dx) * GHOST_SPEED * 1.5;
            } else {
                // Patrol on their platform
                if (g.platform) {
                    if (g.x <= g.platform.x || g.x >= g.platform.x + g.platform.w - g.w) {
                        g.vx *= -1;
                    }
                }

                // Sometimes switch to chase
                if (Math.random() < 0.005) g.patrol = !g.patrol;
            }

            // Gravity for ghosts
            g.vy += GRAVITY * 0.5;
            g.x += g.vx;
            g.y += g.vy;

            // Ghost platform collision
            for (let p of platforms) {
                if (rectCollide(g, p)) {
                    if (g.vy > 0 && g.y + g.h - g.vy <= p.y + 5) {
                        g.y = p.y - g.h;
                        g.vy = 0;
                        g.onGround = true;
                    } else if (g.vy < 0) {
                        g.y = p.y + p.h;
                        g.vy = 0;
                    } else {
                        g.vx *= -1;
                    }
                }
            }

            // Ghost-player collision
            if (rectCollide(player, g)) {
                die();
                return;
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].x += particles[i].vx;
            particles[i].y += particles[i].vy;
            particles[i].vy += 0.2;
            particles[i].life--;
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        // Camera
        camX = player.x - W / 3;
        camY = Math.max(0, player.y - H / 2);
        if (camX < 0) camX = 0;
        if (camY < 0) camY = 0;

        // Win condition
        if (pelletsCollected >= totalPellets && totalPellets > 0) {
            gameState = 'WIN';
            winTimer = 0;
            playSound('win');
        }
    }

    function die() {
        gameState = 'DEAD';
        deathTimer = 0;
        playSound('death');
    }

    function render() {
        ctx.fillStyle = '#0a0a2e';
        ctx.fillRect(0, 0, W, H);

        if (gameState === 'START') {
            renderStartScreen();
            return;
        }

        ctx.save();
        ctx.translate(-camX, -camY);

        // Background stars
        for (let i = 0; i < 50; i++) {
            const sx = ((i * 137 + 50) % 4000) + camX * 0.2;
            const sy = (i * 97 + 30) % H;
            ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 3) * 0.2})`;
            ctx.fillRect(sx - camX * 0.2, sy, 2, 2);
        }

        // Platforms
        for (let p of platforms) {
            if (p.x + p.w < camX || p.x > camX + W) continue;
            ctx.fillStyle = '#4a4a8a';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#6a6aaa';
            ctx.fillRect(p.x, p.y, p.w, 4);
            // Brick pattern
            ctx.strokeStyle = '#3a3a7a';
            ctx.lineWidth = 1;
            for (let bx = p.x; bx < p.x + p.w; bx += 20) {
                ctx.strokeRect(bx, p.y, 20, p.h);
            }
        }

        // Pellets
        for (let pel of pellets) {
            if (pel.collected) continue;
            if (pel.x < camX - 20 || pel.x > camX + W + 20) continue;
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(pel.x, pel.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fffacd';
            ctx.beginPath();
            ctx.arc(pel.x - 1, pel.y - 1, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Particles
        for (let p of particles) {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = `rgba(255, 255, 0, ${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 * alpha, 0, Math.PI * 2);
            ctx.fill();
        }

        // Ghosts
        for (let g of ghosts) {
            if (g.x < camX - 50 || g.x > camX + W + 50) continue;
            drawGhost(g);
        }

        // Player
        drawPlayer();

        ctx.restore();

        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 30);
        ctx.fillText(`PELLETS: ${pelletsCollected}/${totalPellets}`, 20, 55);

        if (gameState === 'DEAD') {
            deathTimer++;
            ctx.fillStyle = `rgba(0,0,0,${Math.min(deathTimer / 30, 0.7)})`;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', W / 2, H / 2);
            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 40);
            ctx.fillText('Press SPACE to restart', W / 2, H / 2 + 80);
        }

        if (gameState === 'WIN') {
            winTimer++;
            ctx.fillStyle = `rgba(0,0,50,${Math.min(winTimer / 30, 0.7)})`;
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 48px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('YOU WIN!', W / 2, H / 2);
            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 40);
            ctx.fillText('Press SPACE to play again', W / 2, H / 2 + 80);
        }
    }

    function drawPlayer() {
        const cx = player.x + player.w / 2;
        const cy = player.y + player.h / 2;
        const r = player.w / 2;
        const mouthOpen = Math.abs(Math.sin(player.mouthAngle)) * 0.4 + 0.1;

        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        if (player.facing > 0) {
            ctx.arc(cx, cy, r, mouthOpen * Math.PI, -mouthOpen * Math.PI, false);
        } else {
            ctx.arc(cx, cy, r, Math.PI + mouthOpen * Math.PI, Math.PI - mouthOpen * Math.PI, false);
        }
        ctx.closePath();
        ctx.fill();

        // Eye
        const eyeX = cx + player.facing * 2;
        const eyeY = cy - 5;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(eyeX, eyeY, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawGhost(g) {
        const cx = g.x + g.w / 2;
        const cy = g.y + g.h / 2;
        const r = g.w / 2;

        // Body
        ctx.fillStyle = g.color;
        ctx.beginPath();
        ctx.arc(cx, cy - 5, r, Math.PI, 0);
        ctx.lineTo(cx + r, cy + r - 5);
        // Wavy bottom
        for (let i = 3; i >= 0; i--) {
            const waveX = cx + r - (r * 2 / 4) * (3 - i);
            const waveY = cy + r - 5 + (i % 2 === 0 ? 5 : -5);
            ctx.lineTo(waveX, waveY);
        }
        ctx.closePath();
        ctx.fill();

        // Eyes
        const lookDir = Math.sign(player.x - g.x) || 1;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(cx - 5, cy - 8, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx + 5, cy - 8, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pupils
        ctx.fillStyle = '#00f';
        ctx.beginPath();
        ctx.arc(cx - 5 + lookDir * 2, cy - 7, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 5 + lookDir * 2, cy - 7, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }

    function renderStartScreen() {
        // Background
        ctx.fillStyle = '#0a0a2e';
        ctx.fillRect(0, 0, W, H);

        // Stars
        for (let i = 0; i < 80; i++) {
            const sx = (i * 137 + 50) % W;
            const sy = (i * 97 + 30) % H;
            ctx.fillStyle = `rgba(255,255,255,${0.3 + (i % 3) * 0.3})`;
            ctx.fillRect(sx, sy, 2, 2);
        }

        // Title
        const pulse = Math.sin(Date.now() * 0.003) * 5;
        ctx.fillStyle = '#ffff00';
        ctx.font = `bold ${Math.min(60, W / 8)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('PAC-MAN', W / 2, H / 3 + pulse);
        ctx.fillStyle = '#ff0000';
        ctx.font = `bold ${Math.min(40, W / 12)}px monospace`;
        ctx.fillText('PLATFORMER', W / 2, H / 3 + Math.min(50, W / 12) + pulse);

        // Draw a big Pac-Man
        const pcx = W / 2;
        const pcy = H / 3 + Math.min(80, W / 10) + 40;
        const pr = 30;
        const mOpen = Math.abs(Math.sin(Date.now() * 0.005)) * 0.5 + 0.1;
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(pcx, pcy, pr, mOpen * Math.PI, -mOpen * Math.PI, false);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(pcx + 5, pcy - 8, 4, 0, Math.PI * 2);
        ctx.fill();

        // Ghosts below
        const ghostColors = ['#ff0000', '#ff69b4', '#00ffff', '#ffa500'];
        for (let i = 0; i < 4; i++) {
            const gx = W / 2 + (i - 1.5) * 50;
            const gy = pcy + 50;
            ctx.fillStyle = ghostColors[i];
            ctx.beginPath();
            ctx.arc(gx, gy, 15, Math.PI, 0);
            ctx.lineTo(gx + 15, gy + 15);
            ctx.lineTo(gx + 10, gy + 10);
            ctx.lineTo(gx + 5, gy + 15);
            ctx.lineTo(gx, gy + 10);
            ctx.lineTo(gx - 5, gy + 15);
            ctx.lineTo(gx - 10, gy + 10);
            ctx.lineTo(gx - 15, gy + 15);
            ctx.closePath();
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(gx - 4, gy - 3, 4, 0, Math.PI * 2);
            ctx.arc(gx + 4, gy - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#00f';
            ctx.beginPath();
            ctx.arc(gx - 4, gy - 3, 2, 0, Math.PI * 2);
            ctx.arc(gx + 4, gy - 3, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Instructions
        ctx.fillStyle = '#aaa';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Arrow Keys / WASD to move', W / 2, H - 80);
        ctx.fillText('Space / W / Up to jump', W / 2, H - 55);
        ctx.fillText('Collect all pellets. Avoid the ghosts!', W / 2, H - 30);

        // Start prompt
        const blink = Math.sin(Date.now() * 0.005) > 0;
        if (blink) {
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px monospace';
            ctx.fillText('Press SPACE to Start', W / 2, H - 10);
        }
    }

    // Game loop
    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    generateLevel();
    gameState = 'START';
    gameLoop();
})();
</script>
</body>
</html>
