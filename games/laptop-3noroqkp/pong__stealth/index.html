<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONG STEALTH</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let W, H;
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
    }
    resize();
    window.addEventListener('resize', resize);

    // Audio
    let audioCtx = null;
    let audioInitialized = false;

    function initAudio() {
        if (audioInitialized) return;
        audioCtx = new (window.AudioContext || webkitAudioContext)();
        audioInitialized = true;
    }

    function playWhoosh(speed) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'sine';
        const baseFreq = 80 + speed * 2;
        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, audioCtx.currentTime + 0.1);
        filter.type = 'bandpass';
        filter.frequency.value = baseFreq * 2;
        filter.Q.value = 2;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    function playPing() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 2200;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function playHit() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = 150;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    function playScore(side) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = side === 'player' ? 440 : 220;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    // Game state
    let gameState = 'start'; // start, playing, scored, gameover
    let score = { player: 0, ai: 0 };
    const WIN_SCORE = 7;

    // Paddle
    const PADDLE_W = 12;
    const PADDLE_H_RATIO = 0.15;
    let paddlePlayerY, paddleAIY;
    let paddlePulse = 0;

    // Ball
    let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };
    let ballVisibleTimer = 0;
    const BALL_VISIBLE_TIME = 1.2; // seconds visible after hit
    const BALL_FADE_TIME = 0.4;

    // Trail
    let trail = [];
    const TRAIL_LENGTH = 20;

    // Particles
    let particles = [];

    let lastTime = 0;
    let whooshTimer = 0;
    let scoreMessage = '';
    let scoreTimer = 0;
    let rallyCount = 0;

    function resetBall(direction) {
        ball.x = W / 2;
        ball.y = H / 2;
        const speed = Math.max(W, H) * 0.004;
        const angle = (Math.random() - 0.5) * Math.PI * 0.5;
        ball.vx = Math.cos(angle) * speed * direction;
        ball.vy = Math.sin(angle) * speed;
        ballVisibleTimer = BALL_VISIBLE_TIME;
        trail = [];
    }

    function startGame() {
        initAudio();
        score = { player: 0, ai: 0 };
        rallyCount = 0;
        paddlePlayerY = H / 2;
        paddleAIY = H / 2;
        resetBall(1);
        gameState = 'playing';
    }

    function nextRally() {
        rallyCount++;
        const speedMult = 1 + rallyCount * 0.05;
        ball.r = Math.max(5, 8 - rallyCount * 0.2);
        resetBall(Math.random() > 0.5 ? 1 : -1);
        ball.vx *= speedMult;
        ball.vy *= speedMult;
    }

    // Input
    let keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (gameState === 'start' || gameState === 'gameover') {
            if (e.key === ' ' || e.key === 'Enter') {
                startGame();
            }
        } else if (gameState === 'scored') {
            // wait for score timer
        }
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    // Mouse/touch support
    let mouseY = H / 2;
    canvas.addEventListener('mousemove', (e) => { mouseY = e.clientY; });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        mouseY = e.touches[0].clientY;
    }, { passive: false });
    canvas.addEventListener('touchstart', (e) => {
        if (gameState === 'start' || gameState === 'gameover') startGame();
    });

    function update(dt) {
        if (gameState !== 'playing' && gameState !== 'scored') return;

        // Paddle movement - player
        const paddleH = H * PADDLE_H_RATIO;
        const paddleSpeed = H * 0.8;
        if (keys['w'] || keys['W'] || keys['ArrowUp']) {
            paddlePlayerY -= paddleSpeed * dt;
        }
        if (keys['s'] || keys['S'] || keys['ArrowDown']) {
            paddlePlayerY += paddleSpeed * dt;
        }

        // Mouse control for player paddle
        const targetY = mouseY;
        paddlePlayerY += (targetY - paddlePlayerY) * Math.min(1, 8 * dt);
        paddlePlayerY = Math.max(paddleH / 2, Math.min(H - paddleH / 2, paddlePlayerY));

        // AI paddle
        if (gameState === 'playing') {
            const aiSpeed = H * 0.5 + rallyCount * 10;
            const diff = ball.y - paddleAIY;
            const reactThreshold = 30;
            if (Math.abs(diff) > reactThreshold) {
                paddleAIY += Math.sign(diff) * aiSpeed * dt;
            }
            paddleAIY = Math.max(paddleH / 2, Math.min(H - paddleH / 2, paddleAIY));
        }

        // Paddle pulse
        paddlePulse += dt * 3;

        if (gameState === 'scored') {
            scoreTimer -= dt;
            if (scoreTimer <= 0) {
                if (score.player >= WIN_SCORE || score.ai >= WIN_SCORE) {
                    gameState = 'gameover';
                } else {
                    nextRally();
                    gameState = 'playing';
                }
            }
            return;
        }

        // Ball movement
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Bounce top/bottom
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
        if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }

        // Whoosh sound
        whooshTimer -= dt;
        if (whooshTimer <= 0) {
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            playWhoosh(speed / 100);
            whooshTimer = 0.3;
        }

        // Ball visibility
        ballVisibleTimer -= dt;
        if (ballVisibleTimer <= 0 && ballVisibleTimer > -BALL_FADE_TIME) {
            // Still fading out
        }

        // Trail
        trail.push({ x: ball.x, y: ball.y, life: 1 });
        if (trail.length > TRAIL_LENGTH) trail.shift();
        for (let t of trail) t.life -= dt * 2;

        // Paddle collision - Player (left)
        const ppx = 30;
        const apx = W - 30;
        if (ball.vx < 0 && ball.x - ball.r < ppx + PADDLE_W / 2 && ball.x - ball.r > ppx - PADDLE_W) {
            if (Math.abs(ball.y - paddlePlayerY) < paddleH / 2 + ball.r) {
                ball.vx = Math.abs(ball.vx);
                const hitPos = (ball.y - paddlePlayerY) / (paddleH / 2);
                ball.vy += hitPos * 100;
                rallyCount++;
                ballVisibleTimer = BALL_VISIBLE_TIME;
                playHit();
                spawnParticles(ppx + PADDLE_W, ball.y, 'right');
            }
        }

        // Paddle collision - AI (right)
        if (ball.vx > 0 && ball.x + ball.r > apx - PADDLE_W / 2 && ball.x + ball.r < apx + PADDLE_W) {
            if (Math.abs(ball.y - paddleAIY) < paddleH / 2 + ball.r) {
                ball.vx = -Math.abs(ball.vx);
                const hitPos = (ball.y - paddleAIY) / (paddleH / 2);
                ball.vy += hitPos * 100;
                rallyCount++;
                ballVisibleTimer = BALL_VISIBLE_TIME;
                playHit();
                spawnParticles(apx - PADDLE_W, ball.y, 'left');
            }
        }

        // Score
        if (ball.x < -20) {
            score.ai++;
            playScore('ai');
            gameState = 'scored';
            scoreMessage = 'AI SCORES';
            scoreTimer = 1.5;
        }
        if (ball.x > W + 20) {
            score.player++;
            playScore('player');
            gameState = 'scored';
            scoreMessage = 'YOU SCORE!';
            scoreTimer = 1.5;
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 3;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function spawnParticles(x, y, dir) {
        for (let i = 0; i < 8; i++) {
            const angle = dir === 'right' ? Math.random() * Math.PI * 2 : Math.random() * Math.PI * 2;
            const speed = 50 + Math.random() * 150;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1
            });
        }
    }

    function draw() {
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, W, H);

        // Grid background
        ctx.strokeStyle = 'rgba(40, 60, 80, 0.15)';
        ctx.lineWidth = 1;
        const gridSize = 50;
        for (let x = 0; x < W; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Center line
        ctx.setLineDash([10, 15]);
        ctx.strokeStyle = 'rgba(80, 200, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);

        if (gameState === 'start') {
            drawStartScreen();
            return;
        }

        // Paddles
        const paddleH = H * PADDLE_H_RATIO;
        const glow = 0.5 + Math.sin(paddlePulse) * 0.3;

        // Player paddle (left)
        ctx.shadowColor = '#00ffaa';
        ctx.shadowBlur = 15 * glow;
        ctx.fillStyle = `rgba(0, 255, 170, ${0.6 + glow * 0.4})`;
        ctx.fillRect(30 - PADDLE_W / 2, paddlePlayerY - paddleH / 2, PADDLE_W, paddleH);

        // AI paddle (right)
        ctx.shadowColor = '#ff4488';
        ctx.shadowBlur = 15 * glow;
        ctx.fillStyle = `rgba(255, 68, 136, ${0.6 + glow * 0.4})`;
        ctx.fillRect(W - 30 - PADDLE_W / 2, paddleAIY - paddleH / 2, PADDLE_W, paddleH);

        ctx.shadowBlur = 0;

        // Trail
        if (gameState === 'playing' || gameState === 'scored') {
            const visFactor = Math.max(0, ballVisibleTimer) / BALL_VISIBLE_TIME;
            for (let i = 0; i < trail.length; i++) {
                const t = trail[i];
                if (t.life <= 0) continue;
                const alpha = Math.min(t.life, visFactor) * 0.5;
                if (alpha > 0) {
                    ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, ball.r * 0.5 * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Ball
            if (gameState === 'playing') {
                let ballAlpha = 0;
                if (ballVisibleTimer > 0) {
                    ballAlpha = Math.min(1, ballVisibleTimer / BALL_FADE_TIME);
                } else {
                    // Faint glow hint
                    ballAlpha = 0.05 + Math.sin(Date.now() * 0.01) * 0.03;
                }

                if (ballAlpha > 0.01) {
                    ctx.shadowColor = '#ffffff';
                    ctx.shadowBlur = ballAlpha * 20;
                    ctx.fillStyle = `rgba(255, 255, 255, ${ballAlpha})`;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner glow
                    ctx.fillStyle = `rgba(100, 200, 255, ${ballAlpha * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.r * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Stealth indicator ring
                if (ballVisibleTimer > 0 && ballVisibleTimer < BALL_FADE_TIME) {
                    const ringAlpha = (BALL_FADE_TIME - ballVisibleTimer) / BALL_FADE_TIME * 0.3;
                    ctx.strokeStyle = `rgba(255, 255, 100, ${ringAlpha})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.r * 2, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // Particles
        for (const p of particles) {
            ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.8})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
            ctx.fill();
        }

        // Score
        ctx.font = `bold ${Math.min(W, H) * 0.06}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0, 255, 170, 0.6)';
        ctx.fillText(score.player, W / 2 - W * 0.15, H * 0.1);
        ctx.fillStyle = 'rgba(255, 68, 136, 0.6)';
        ctx.fillText(score.ai, W / 2 + W * 0.15, H * 0.1);

        // Rally counter
        if (rallyCount > 2) {
            ctx.font = `${Math.min(W, H) * 0.03}px monospace`;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fillText(`RALLY: ${rallyCount}`, W / 2, H * 0.15);
        }

        // Score message
        if (gameState === 'scored') {
            ctx.font = `bold ${Math.min(W, H) * 0.08}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillStyle = scoreMessage.includes('YOU') ? 'rgba(0, 255, 170, 0.9)' : 'rgba(255, 68, 136, 0.9)';
            ctx.fillText(scoreMessage, W / 2, H / 2);
        }

        if (gameState === 'gameover') {
            drawGameOver();
        }
    }

    function drawStartScreen() {
        const cx = W / 2;
        const cy = H / 2;

        // Title with glow
        ctx.shadowColor = '#00ffaa';
        ctx.shadowBlur = 30;
        ctx.font = `bold ${Math.min(W, H) * 0.12}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PONG', cx, cy - H * 0.15);
        ctx.shadowColor = '#ff4488';
        ctx.shadowBlur = 30;
        ctx.font = `bold ${Math.min(W, H) * 0.06}px monospace`;
        ctx.fillStyle = '#ff4488';
        ctx.fillText('STEALTH', cx, cy - H * 0.07);
        ctx.shadowBlur = 0;

        // Description
        ctx.font = `${Math.min(W, H) * 0.025}px monospace`;
        ctx.fillStyle = 'rgba(150, 200, 255, 0.8)';
        ctx.fillText('The ball vanishes after each hit.', cx, cy + H * 0.03);
        ctx.fillText('Trust your ears. Track the sound.', cx, cy + H * 0.07);

        // Controls
        ctx.font = `${Math.min(W, H) * 0.02}px monospace`;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fillText('W/S or ↑/↓ to move paddle', cx, cy + H * 0.14);
        ctx.fillText('First to ' + WIN_SCORE + ' wins', cx, cy + H * 0.17);

        // Blinking prompt
        const blink = Math.sin(Date.now() * 0.003) > 0;
        if (blink) {
            ctx.font = `bold ${Math.min(W, H) * 0.03}px monospace`;
            ctx.fillStyle = 'rgba(0, 255, 170, 0.9)';
            ctx.fillText('PRESS SPACE TO BEGIN', cx, cy + H * 0.25);
        }
    }

    function drawGameOver() {
        const cx = W / 2;
        const cy = H / 2;

        ctx.fillStyle = 'rgba(10, 10, 15, 0.7)';
        ctx.fillRect(0, 0, W, H);

        const won = score.player > score.ai;
        ctx.shadowColor = won ? '#00ffaa' : '#ff4488';
        ctx.shadowBlur = 20;
        ctx.font = `bold ${Math.min(W, H) * 0.1}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = won ? '#00ffaa' : '#ff4488';
        ctx.fillText(won ? 'VICTORY' : 'DEFEATED', cx, cy - H * 0.05);
        ctx.shadowBlur = 0;

        ctx.font = `${Math.min(W, H) * 0.04}px monospace`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${score.player} — ${score.ai}`, cx, cy + H * 0.03);

        const blink = Math.sin(Date.now() * 0.003) > 0;
        if (blink) {
            ctx.font = `${Math.min(W, H) * 0.025}px monospace`;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillText('PRESS SPACE TO RESTART', cx, cy + H * 0.1);
        }
    }

    function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    paddlePlayerY = H / 2;
    paddleAIY = H / 2;
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
