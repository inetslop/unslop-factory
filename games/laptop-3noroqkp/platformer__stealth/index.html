<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content=device-width, initial-scale=1.0">
<title>Shadow Step - Stealth Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type, freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.2));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.2));
}

// Game State
const STATE = { MENU: 0, PLAYING: 1, CAUGHT: 2, WIN: 3 };
let gameState = STATE.MENU;
let detectionMeter = 0;
let alertTimer = 0;
let particles = [];
let time = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === STATE.MENU) startGame();
    if (gameState === STATE.CAUGHT || gameState === STATE.WIN) {
        if (e.code === 'KeyR') startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Level Data
const TILE = 40;
const levelData = [
    "..................................................",
    "..................................................",
    "..................................................",
    "..........GG..............................E.....",
    ".........[GgG]..............[GgG]...........X...",
    "........[ G g ]............[ G g ]..........X...",
    "..............................................X..",
    "..p....[  ]...[  ]...[  ].....................X.",
    "..............................[  ][  ].........X.",
    "................................................................"
];

let level = [];
let guards = [];
let player = {};
let exitDoor = { x: 0, y: 0 };

function buildLevel() {
    level = [];
    for (let r = 0; r < levelData.length; r++) {
        level[r] = [];
        for (let c = 0; c < levelData[r].length; c++) {
            level[r][c] = ' ';
        }
    }

    // Parse level string - use a simpler approach with objects
    const rows = levelData.length;
    const cols = levelData[0].length;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let ch = levelData[r][c];
            if (ch === 'X') level[r][c] = '#';
            else if (ch === '[') level[r][c] = '#';
            else if (ch === ']') level[r][c] = '#';
        }
    }

    // Place objects based on original strings
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let ch = levelData[r][c];
            if (ch === 'p') { player.startX = c * TILE; player.startY = r * TILE; }
            if (ch === 'E') { exitDoor.x = c * TILE; exitDoor.y = r * TILE; }
        }
    }

    // Add solid ground
    for (let c = 0; c < cols; c++) {
        level[rows-1][c] = '#';
    }
    // Floor sections
    for (let c = 0; c < 8; c++) level[rows-2][c] = '#';
    for (let c = 14; c < 22; c++) level[rows-2][c] = '#';
    for (let c = 28; c < cols; c++) level[rows-2][c] = '#';

    // Platforms
    for (let c = 9; c < 13; c++) level[4][c] = '#';
    for (let c = 24; c < 28; c++) level[4][c] = '#';
    for (let c = 5; c < 7; c++) level[6][c] = '#';
    for (let c = 10; c < 12; c++) level[6][c] = '#';
    for (let c = 15; c < 17; c++) level[6][c] = '#';

    // Crates (cover objects)
    placeCrate(7, 8);
    placeCrate(7, 12);
    placeCrate(7, 16);
    placeCrate(8, 25);
    placeCrate(8, 27);
    placeCrate(4, 10);
    placeCrate(4, 25);

    // Guards
    guards = [
        { x: 9 * TILE, y: 6 * TILE, patrolL: 8 * TILE, patrolR: 13 * TILE, dir: 1, speed: 1.2, w: TILE, h: TILE, facing: 1, state: 'patrol', alertLevel: 0 },
        { x: 24 * TILE, y: 6 * TILE, patrolL: 23 * TILE, patrolR: 28 * TILE, dir: -1, speed: 1.5, w: TILE, h: TILE, facing: -1, state: 'patrol', alertLevel: 0 },
        { x: 29 * TILE, y: 6 * TILE, patrolL: 27 * TILE, patrolR: cols * TILE, dir: 1, speed: 1.0, w: TILE, h: TILE, facing: 1, state: 'patrol', alertLevel: 0 }
    ];

    exitDoor.x = (cols - 1) * TILE;
    exitDoor.y = (rows - 3) * TILE;
}

function placeCrate(r, c) {
    level[r][c] = '#';
    level[r-1][c] = '#';
}

function startGame() {
    initAudio();
    buildLevel();
    player = {
        x: 2 * TILE, y: 7 * TILE, w: 20, h: 36,
        vx: 0, vy: 0, onGround: false, crouching: false, facing: 1
    };
    detectionMeter = 0;
    alertTimer = 0;
    particles = [];
    gameState = STATE.PLAYING;
}

function isSolid(r, c) {
    if (r < 0 || r >= level.length || c < 0 || c >= level[0].length) return true;
    return level[r][c] === '#';
}

function rectCollide(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function pointInCone(px, py, gx, gy, facing, range, spread) {
    const dx = px - gx;
    const dy = py - gy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > range) return false;

    // Check direction matches facing
    if (facing === 1 && dx < 0) return false;
    if (facing === -1 && dx > 0) return false;

    const angle = Math.atan2(dy, dx * facing);
    const halfSpread = spread / 2;
    if (Math.abs(angle) > halfSpread) return false;

    // Check line of sight against obstacles
    const steps = Math.floor(dist / 5);
    for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const cx = gx + dx * t;
        const cy = gy + dy * t;
        if (isSolid(Math.floor(cy / TILE), Math.floor(cx / TILE))) return false;
    }
    return true;
}

function checkDetection() {
    detectionMeter = 0;
    for (let g of guards) {
        const range = player.crouching ? 180 : 250;
        const spread = Math.PI * 0.6;
        const px = player.x + player.w / 2;
        const py = player.y + player.h / 2;
        const gx = g.x + g.w / 2;
        const gy = g.y + g.h / 2;

        if (pointInCone(px, py, gx, gy, g.facing, range, spread)) {
            // Check if hidden by crate
            let hidden = false;
            const hideX = px - TILE;
            const hideY = py;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (isSolid(Math.floor(hideY / TILE) + dr, Math.floor(hideX / TILE) + dc)) {
                        // Check if crate is between player and guard
                        const midX = (px + gx) / 2;
                        const midY = (py + gy) / 2;
                        if (isSolid(Math.floor(midY / TILE), Math.floor(midX / TILE))) {
                            hidden = true;
                        }
                    }
                }
            }

            if (!hidden) {
                const detectSpeed = player.crouching ? 0.3 : 1.0;
                detectionMeter += detectSpeed * 0.02;
                g.state = 'alert';
                g.facing = px > gx ? 1 : -1;

                if (detectionMeter >= 1) {
                    gameState = STATE.CAUGHT;
                    playSound('sawtooth', 100, 0.5, 0.3);
                } else {
                    if (Math.random() < 0.05) playSound('square', 400 + detectionMeter * 200, 0.1, 0.05);
                }
            }
        } else {
            g.state = 'patrol';
        }
    }

    if (detectionMeter > 0) {
        alertTimer += 1 / 60;
    } else {
        detectionMeter = Math.max(0, detectionMeter - 0.02);
        alertTimer = 0;
    }
}

function updatePlayer() {
    const speed = 3.5;
    const jumpForce = -10;
    const gravity = 0.6;

    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -speed;
        player.facing = -1;
    } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = speed;
        player.facing = 1;
    } else {
        player.vx *= 0.7;
    }

    player.vy += gravity;
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        player.vy = jumpForce;
        player.onGround = false;
        playSound('sine', 200, 0.1, 0.05);
    }

    player.crouching = !!(keys['ArrowDown'] || keys['KeyS']);
    if (player.crouching && player.onGround) {
        player.h = 24;
    } else {
        player.h = 36;
    }

    // Move X
    player.x += player.vx;
    for (let r = Math.floor(player.y / TILE); r <= Math.floor((player.y + player.h) / TILE); r++) {
        for (let c = Math.floor(player.x / TILE); c <= Math.floor((player.x + player.w) / TILE); c++) {
            if (isSolid(r, c)) {
                if (player.vx > 0) player.x = c * TILE - player.w;
                else if (player.vx < 0) player.x = (c + 1) * TILE;
                player.vx = 0;
            }
        }
    }

    // Move Y
    player.y += player.vy;
    player.onGround = false;
    for (let r = Math.floor(player.y / TILE); r <= Math.floor((player.y + player.h) / TILE); r++) {
        for (let c = Math.floor(player.x / TILE); c <= Math.floor((player.x + player.w) / TILE); c++) {
            if (isSolid(r, c)) {
                if (player.vy > 0) {
                    player.y = r * TILE - player.h;
                    player.onGround = true;
                    player.vy = 0;
                } else if (player.vy < 0) {
                    player.y = (r + 1) * TILE;
                    player.vy = 0;
                }
            }
        }
    }

    // Win check
    const doorRect = { x: exitDoor.x, y: exitDoor.y - TILE, w: TILE, h: TILE * 2 };
    if (rectCollide(player, doorRect)) {
        gameState = STATE.WIN;
        playSound('sine', 523, 0.3, 0.2);
        setTimeout(() => playSound('sine', 659, 0.3, 0.2), 150);
        setTimeout(() => playSound('sine', 784, 0.5, 0.2), 300);
    }
}

function updateGuards() {
    for (let g of guards) {
        if (g.state === 'patrol') {
            g.x += g.dir * g.speed;
            g.facing = g.dir;
            if (g.x <= g.patrolL) { g.dir = 1; }
            if (g.x >= g.patrolR - g.w) { g.dir = -1; }
        } else if (g.state === 'alert') {
            // Face player
            const px = player.x + player.w / 2;
            g.facing = px > (g.x + g.w / 2) ? 1 : -1;
        }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Ambient particles
    if (Math.random() < 0.3) {
        particles.push({
            x: Math.random() * W, y: -5,
            vx: (Math.random() - 0.5) * 0.5, vy: 0.3 + Math.random() * 0.5,
            life: 1, color: 'rgba(100,150,255,0.3)'
        });
    }
}

function renderLevel() {
    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#151525');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let i = 0; i < 30; i++) {
        const sx = (i * 137 + 50) % W;
        const sy = (i * 89 + 20) % (H * 0.4);
        ctx.fillStyle = `rgba(255,255,255,${0.2 + Math.sin(time * 0.01 + i) * 0.15})`;
        ctx.fillRect(sx, sy, 2, 2);
    }

    // Tiles
    const offsetX = Math.max(0, (W / 2) - player.x - player.w / 2);
    const camX = Math.max(0, Math.min(player.x - W / 3, level[0].length * TILE - W));

    for (let r = 0; r < level.length; r++) {
        for (let c = 0; c < level[0].length; c++) {
            if (level[r][c] === '#') {
                const tx = c * TILE - camX;
                const ty = r * TILE;
                ctx.fillStyle = '#2a2a3a';
                ctx.fillRect(tx, ty, TILE, TILE);
                ctx.strokeStyle = '#3a3a4a';
                ctx.strokeRect(tx + 1, ty + 1, TILE - 2, TILE - 2);

                // Top highlight
                if (r === 0 || level[r-1][c] !== '#') {
                    ctx.fillStyle = '#4a4a6a';
                    ctx.fillRect(tx, ty, TILE, 3);
                }
            }
        }
    }

    // Exit Door
    const doorX = exitDoor.x - camX;
    const doorY = exitDoor.y - TILE;
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(doorX, doorY, TILE, TILE * 2);
    ctx.strokeStyle = '#4a8aff';
    ctx.lineWidth = 2;
    ctx.strokeRect(doorX + 5, doorY + 5, TILE - 10, TILE * 2 - 10);
    ctx.fillStyle = `rgba(74,138,255,${0.3 + Math.sin(time * 0.05) * 0.2})`;
    ctx.fillRect(doorX + 8, doorY + 8, TILE - 16, TILE * 2 - 16);

    // Glow around door
    const glow = ctx.createRadialGradient(doorX + TILE/2, doorY + TILE, 5, doorX + TILE/2, doorY + TILE, TILE);
    glow.addColorStop(0, 'rgba(74,138,255,0.15)');
    glow.addColorStop(1, 'rgba(74,138,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(doorX - TILE/2, doorY - TILE/2, TILE * 2, TILE * 3);

    return camX;
}

function renderPlayer(camX) {
    const px = player.x - camX;
    const py = player.y;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(px + player.w/2, py + player.h, player.w/2, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const bodyColor = detectionMeter > 0 ? `rgb(${150 + detectionMeter*100}, ${180 - detectionMeter*80}, 220)` : '#4a9eff';
    ctx.fillStyle = bodyColor;
    if (player.crouching) {
        // Crouched - wider, shorter
        ctx.fillRect(px - 3, py + 5, player.w + 6, player.h - 5);
        // Head
        ctx.fillStyle = '#ddd';
        ctx.beginPath();
        ctx.arc(px + player.w/2, py + 8, 8, 0, Math.PI * 2);
        ctx.fill();
    } else {
        // Standing
        ctx.fillRect(px, py + 10, player.w, player.h - 10);
        // Head
        ctx.fillStyle = '#ddd';
        ctx.beginPath();
        ctx.arc(px + player.w/2, py + 8, 9, 0, Math.PI * 2);
        ctx.fill();
    }

    // Eyes
    const eyeX = px + player.w/2 + (player.facing === 1 ? 3 : -3);
    ctx.fillStyle = '#fff';
    ctx.fillRect(eyeX - 2, py + 4, 4, 3);
}

function renderGuards(camX) {
    for (let g of guards) {
        const gx = g.x - camX;
        const gy = g.y;

        // Vision cone
        const range = player.crouching ? 180 : 250;
        const spread = Math.PI * 0.6;
        const coneColor = g.state === 'alert' ? 'rgba(255,50,50,' : 'rgba(255,200,50,';

        ctx.beginPath();
        ctx.moveTo(gx + g.w/2, gy + g.h/2);
        const startAngle = -spread/2;
        const endAngle = spread/2;
        if (g.facing === 1) {
            ctx.arc(gx + g.w/2, gy + g.h/2, range, startAngle, endAngle);
        } else {
            ctx.arc(gx + g.w/2, gy + g.h/2, range, Math.PI - endAngle, Math.PI + endAngle);
        }
        ctx.closePath();

        const coneGrad = ctx.createRadialGradient(gx + g.w/2, gy + g.h/2, 10, gx + g.w/2, gy + g.h/2, range);
        coneGrad.addColorStop(0, (g.state === 'alert' ? 'rgba(255,50,50,0.15)' : 'rgba(255,200,50,0.1)'));
        coneGrad.addColorStop(1, (g.state === 'alert' ? 'rgba(255,50,50,0)' : 'rgba(255,200,50,0)'));
        ctx.fillStyle = coneGrad;
        ctx.fill();

        // Guard body
        ctx.fillStyle = '#8b4513';
        ctx.fillRect(gx + 2, gy + 10, g.w - 4, g.h - 10);

        // Head (helmet)
        ctx.fillStyle = '#666';
        ctx.beginPath();
        ctx.arc(gx + g.w/2, gy + 8, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#444';
        ctx.fillRect(gx - 2, gy + 2, g.w + 4, 6);

        // Eyes (angry when alert)
        ctx.fillStyle = g.state === 'alert' ? '#ff3333' : '#ffcc00';
        const eyeDir = g.facing === 1 ? 3 : -3;
        ctx.fillRect(gx + g.w/2 + eyeDir - 3, gy + 5, 6, 4);

        // Alert indicator
        if (g.state === 'alert') {
            ctx.fillStyle = '#ff3333';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('!', gx + g.w/2 - 2, gy - 5);
        }
    }
}

function renderParticles() {
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    }
}

function renderUI() {
    // Detection meter
    if (gameState === STATE.PLAYING) {
        const barW = 200;
        const barH = 16;
        const bx = W/2 - barW/2;
        const by = 20;

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);

        if (detectionMeter > 0) {
            const meterColor = detectionMeter < 0.5 ? '#ffcc00' : detectionMeter < 0.8 ? '#ff6600' : '#ff2222';
            ctx.fillStyle = meterColor;
            ctx.fillRect(bx, by, barW * detectionMeter, barH);

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, barW, barH);

            ctx.fillStyle = '#fff';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(detectionMeter < 0.5 ? 'DETECTED' : detectionMeter < 0.8 ? 'ALMOST CAUGHT!' : 'CAREFUL!!', W/2, by + barH + 16);
        } else {
            ctx.fillStyle = '#4a9eff';
            ctx.font = '12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('STEALTH', W/2, by + barH - 2);
        }

        // Status indicators
        ctx.textAlign = 'left';
        ctx.font = '11px monospace';
        ctx.fillStyle = player.crouching ? '#8f8' : '#666';
        ctx.fillText(player.crouching ? '[CROUCHING]' : '[STANDING]', 15, H - 15);

        // Mini legend
        ctx.fillStyle = 'rgba(255,200,50,0.6)';
        ctx.fillText('Yellow = Guard vision', 15, 30);
        ctx.fillStyle = 'rgba(255,50,50,0.6)';
        ctx.fillText('Red = Guard alert!', 15, 45);
    }

    // Caught screen
    if (gameState === STATE.CAUGHT) {
        ctx.fillStyle = 'rgba(80,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff3333';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CAUGHT!', W/2, H/2 - 20);
        ctx.font = '20px monospace';
        ctx.fillStyle = '#ffaaaa';
        ctx.fillText('Press R to Retry', W/2, H/2 + 30);
    }

    // Win screen
    if (gameState === STATE.WIN) {
        ctx.fillStyle = 'rgba(0,50,100,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#4a9eff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ESCAPED!', W/2, H/2 - 20);
        ctx.font = '20px monospace';
        ctx.fillStyle = '#aaccff';
        ctx.fillText('Press R to Play Again', W/2, H/2 + 30);

        // Confetti particles
        if (Math.random() < 0.5) {
            particles.push({
                x: Math.random() * W, y: -10,
                vx: (Math.random()-0.5)*3, vy: 2+Math.random()*2,
                life: 1, color: `hsl(${Math.random()*360},80%,60%)`
            });
        }
    }
}

function renderMenu() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#151530');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + 50) % W;
        const sy = (i * 89 + 20) % (H * 0.6);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(time * 0.02 + i) * 0.2})`;
        ctx.fillRect(sx, sy, 2, 2);
    }

    // Title
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4a9eff';
    ctx.font = 'bold 56px monospace';
    ctx.fillText('SHADOW STEP', W/2, H/3);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#8899bb';
    ctx.fillText('A Stealth Platformer', W/2, H/3 + 40);

    // Controls box
    const boxX = W/2 - 180;
    const boxY = H/2 - 20;
    ctx.fillStyle = 'rgba(20,20,40,0.8)';
    ctx.fillRect(boxX, boxY, 360, 160);
    ctx.strokeStyle = '#4a9eff';
    ctx.lineWidth = 1;
    ctx.strokeRect(boxX, boxY, 360, 160);

    ctx.font = '14px monospace';
    ctx.fillStyle = '#aabbcc';
    const lines = [
        '← → / A D  - Move',
        'SPACE / ↑   - Jump',
        '↓ / S      - Crouch (harder to spot)',
        '',
        'Avoid guard vision cones!',
        'Reach the blue door to escape.'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, boxY + 30 + i * 22);
    });

    // Start prompt
    ctx.fillStyle = `rgba(74,158,255,${0.5 + Math.sin(time * 0.05) * 0.4})`;
    ctx.font = '20px monospace';
    ctx.fillText('Press any key to start', W/2, H - 60);
}

function gameLoop() {
    time++;

    if (gameState === STATE.MENU) {
        renderMenu();
    } else if (gameState === STATE.PLAYING || gameState === STATE.CAUGHT || gameState === STATE.WIN) {
        if (gameState === STATE.PLAYING) {
            updatePlayer();
            updateGuards();
            checkDetection();
        }
        updateParticles();

        const camX = renderLevel();
        renderParticles();
        renderPlayer(camX);
        renderGuards(camX);
        renderUI();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
