<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Tetris</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            alignley-align: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function soundClear() { playSound(880, 0.15, 'square', 0.08); setTimeout(() => playSound(1100, 0.1, 'square', 0.06), 50); }
function soundError() { playSound(150, 0.2, 'sawtooth', 0.06); }
function soundSpawn() { playSound(440, 0.08, 'triangle', 0.04); }
function soundGameOver() { playSound(200, 0.5, 'sawtooth', 0.1); setTimeout(() => playSound(150, 0.5, 'sawtooth', 0.1), 200); }

// Game State
const COLS = 10;
const ROWS = 15;
let cellSize, gridOffsetX, gridOffsetY;
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
let combo = 0;
let maxCombo = 0;
let speed = 1;
let words = [];
let typedText = '';
let lastSpawnTime = 0;
let spawnInterval = 3000;
let fallSpeed = 5000;
let lastFrame = 0;
let particles = [];
let shakeTimer = 0;
let flashAlpha = 0;

try {
    highScore = parseInt(localStorage.getItem('typingTetrisHigh') || '0');
} catch(e) { highScore = 0; }

const wordList = [
    "the","be","to","of","and","in","he","for","it","with","his","as","you","at","this",
    "that","from","they","we","say","she","its","or","are","was","have","but","what","can","would",
    "will","just","know","take","people","get","more","make","like","time","year","every","new","come","well",
    "some","than","them","two","there","use","other","how","all","when","their","who","do","if","into","only",
    "way","day","man","out","part","old","much","many","no","even","look","back","now","because","long","word",
    "same","down","see","right","turn","about","just","also","over","such","must","before","these","great","another",
    "never","after","while","world","through","each","always","between","under","should","during","without","little","being",
    "here","change","around","once","place","point","small","large","first","last","both","since","where","high","next",
    "keep","give","very","good","real","take","find","tell","ask","feel","seem","stay","well","become","move","mean",
    "begin","open","close","run","walk","stop","start","end","play","work","read","write","think","speak","listen",
    "build","break","carry","catch","choose","cover","count","create","cross","dance","decide","deliver","develop","drive",
    "drop","enter","fall","feed","fight","fill","finish","follow","forget","gather","glance","grow","hand","happen","help",
    "hold","hope","jump","keep","knock","land","lead","learn","leave","lift","light","look","lower","mark","match",
    "measure","mix","need","nod","note","offer","pass","pick","plan","pull","push","reach","remember","rest","return","rise",
    "roll","save","seek","send","serve","set","shake","shift","shine","show","shout","sit","slide","smile","snap","stand",
    "stretch","strike","sweep","swing","taste","throw","touch","train","travel","try","turn","twist","watch","wave","wonder"
];

function getCellSize() {
    return Math.min(W / (COLS + 2), H / (ROWS + 4));
}

function getGridPos() {
    const cs = getCellSize();
    return { x: (W - COLS * cs) / 2, y: 40 };
}

function spawnWord() {
    if (words.length >= COLS) return;
    const availableCols = [];
    for (let c = 0; c < COLS; c++) {
        if (!words.find(w => w.col === c)) availableCols.push(c);
    }
    if (availableCols.length === 0) return;
    const col = availableCols[Math.floor(Math.random() * availableCols.length)];
    const word = wordList[Math.floor(Math.random() * wordList.length)];
    words.push({ word, col, row: -1, y: 0 });
    soundSpawn();
}

function startGame() {
    initAudio();
    gameState = 'playing';
    score = 0;
    combo = 0;
    maxCombo = 0;
    speed = 1;
    words = [];
    typedText = '';
    lastSpawnTime = performance.now();
    spawnInterval = 2500;
    fallSpeed = 4000;
    particles = [];
    shakeTimer = 0;
    flashAlpha = 0;
}

function gameOver() {
    gameState = 'gameover';
    soundGameOver();
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('typingTetrisHigh', highScore.toString()); } catch(e) {}
    }
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 1,
            color
        });
    }
}

function handleInput(e) {
    if (gameState === 'start') {
        if (e.key === 'Enter' || e.key === ' ') startGame();
        return;
    }
    if (gameState === 'gameover') {
        if (e.key === 'Enter' || e.key === ' ') startGame();
        return;
    }
    if (gameState !== 'playing') return;

    if (e.key === 'Backspace') {
        typedText = typedText.slice(0, -1);
        return;
    }
    if (e.key.length !== 1) return;

    const ch = e.key.toLowerCase();
    if (!/[a-z]/.test(ch)) return;

    typedText += ch;
    soundError(); // tiny tick for typing

    // Check if any word matches
    let matched = null;
    for (let i = words.length - 1; i >= 0; i--) {
        if (words[i].word === typedText) {
            matched = i;
            break;
        }
    }

    if (matched !== null) {
        const w = words[matched];
        const cs = getCellSize();
        const gp = getGridPos();
        const px = gp.x + w.col * cs + cs / 2;
        const py = gp.y + w.row * cs + cs / 2;

        addParticles(px, py, '#4ff', 12);
        words.splice(matched, 1);
        typedText = '';
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        score += w.word.length * 10 * Math.min(combo, 5);
        speed += 0.05;
        spawnInterval = Math.max(800, 2500 - speed * 100);
        fallSpeed = Math.max(1500, 4000 - speed * 100);
        flashAlpha = 0.3;
        soundClear();
    } else {
        // Check if typed word is a prefix of any falling word (for feedback)
        let valid = false;
        for (let w of words) {
            if (w.word.startsWith(typedText)) { valid = true; break; }
        }
        if (!valid) {
            combo = 0;
            shakeTimer = 0.15;
            typedText = '';
        }
    }
}

window.addEventListener('keydown', handleInput);

function update(dt) {
    if (gameState !== 'playing') return;

    const now = performance.now();
    const cs = getCellSize();
    const gp = getGridPos();

    // Spawn words
    if (now - lastSpawnTime > spawnInterval) {
        spawnWord();
        lastSpawnTime = now;
    }

    // Move words down
    const fallRate = dt / fallSpeed;
    for (let w of words) {
        w.y += fallRate * cs;
        w.row = Math.floor(w.y / cs);
    }

    // Check game over - any word reaches bottom
    for (let w of words) {
        if (w.y >= (ROWS - 1) * cs) {
            gameOver();
            return;
        }
    }

    // Update particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= dt * 2;
    }
    particles = particles.filter(p => p.life > 0);

    // Decay effects
    if (shakeTimer > 0) shakeTimer -= dt;
    if (flashAlpha > 0) flashAlpha -= dt * 3;
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    const cs = getCellSize();
    const gp = getGridPos();

    // Apply shake
    let ox = 0, oy = 0;
    if (shakeTimer > 0) {
        ox = (Math.random() - 0.5) * 6;
        oy = (Math.random() - 0.5) * 6;
    }

    ctx.save();
    ctx.translate(ox, oy);

    // Draw grid
    ctx.strokeStyle = 'rgba(100, 100, 200, 0.15)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(gp.x + c * cs, gp.y);
        ctx.lineTo(gp.x + c * cs, gp.y + ROWS * cs);
        ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(gp.x, gp.y + r * cs);
        ctx.lineTo(gp.x + COLS * cs, gp.y + r * cs);
        ctx.stroke();
    }

    // Draw danger zone (bottom)
    const dangerY = gp.y + (ROWS - 1) * cs;
    ctx.fillStyle = 'rgba(255, 50, 50, 0.1)';
    ctx.fillRect(gp.x, dangerY, COLS * cs, cs);
    ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(gp.x, dangerY, COLS * cs, cs);

    if (gameState === 'playing' || gameState === 'gameover') {
        // Draw words
        for (let w of words) {
            const x = gp.x + w.col * cs;
            const y = gp.y + w.y;
            const danger = w.row >= ROWS - 3;

            // Block background
            let bgR = 40, bgG = 120, bgB = 200;
            if (danger) {
                const pulse = Math.sin(performance.now() / 150) * 0.5 + 0.5;
                bgR = 200; bgG = 40; bgB = 40;
            }
            ctx.fillStyle = `rgba(${bgR}, ${bgG}, ${bgB}, 0.3)`;
            ctx.fillRect(x + 1, y + 1, cs - 2, cs - 2);

            // Word text
            const fontSize = Math.min(cs * 0.7, w.word.length * cs * 0.45);
            ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (typedText && w.word.startsWith(typedText)) {
                // Highlight matched portion
                const matchLen = typedText.length;
                const fullW = ctx.measureText(w.word).width;
                const scale = Math.min((cs - 8) / fullW, fontSize / w.word.length * 1.2);
                const drawSize = w.word.length > 6 ? cs * 0.55 : cs * 0.7;
                ctx.font = `bold ${drawSize}px 'Courier New', monospace`;

                // Draw typed part in green
                ctx.fillStyle = '#4fff88';
                const partialText = w.word.substring(0, matchLen);
                const fullTextW = ctx.measureText(w.word).width;
                const startX = x + cs / 2 - fullTextW / 2;

                // Simpler approach: just color the whole word
                if (typedText === w.word) {
                    ctx.fillStyle = '#4fff88';
                } else {
                    ctx.fillStyle = danger ? '#ff6666' : '#aaccff';
                }
                ctx.fillText(w.word, x + cs / 2, y + cs / 2);
            } else {
                const drawSize = w.word.length > 6 ? cs * 0.55 : cs * 0.7;
                ctx.font = `bold ${drawSize}px 'Courier New', monospace`;
                ctx.fillStyle = danger ? '#ff6666' : '#aaccff';
                ctx.fillText(w.word, x + cs / 2, y + cs / 2);
            }

            // Glow for words being typed
            if (typedText && w.word.startsWith(typedText) && typedText !== w.word) {
                ctx.strokeStyle = 'rgba(79, 255, 136, 0.6)';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 2, cs - 4, cs - 4);
            }
        }

        // Draw particles
        for (let p of particles) {
            ctx.fillStyle = `rgba(${parseInt(p.color.slice(1,3),16)}, ${parseInt(p.color.slice(3,5),16)}, ${parseInt(p.color.slice(5,7),16)}, ${p.life})`;
            ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
        }

        // Flash effect
        if (flashAlpha > 0) {
            ctx.fillStyle = `rgba(79, 255, 136, ${flashAlpha * 0.1})`;
            ctx.fillRect(0, 0, W, H);
        }
    }

    // HUD
    if (gameState === 'playing') {
        // Score
        ctx.font = `bold ${Math.min(24, cs * 0.8)}px 'Courier New', monospace`;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fff';
        ctx.fillText(`SCORE: ${score}`, gp.x, gp.y - 15);

        // Combo
        if (combo > 1) {
            ctx.fillStyle = '#4fff88';
            ctx.fillText(`COMBO x${Math.min(combo, 5)}`, gp.x + COLS * cs - 120, gp.y - 15);
        }

        // Typed text display
        if (typedText) {
            ctx.font = `bold ${Math.min(20, cs * 0.6)}px 'Courier New', monospace`;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#4fff88';
            ctx.fillText(typedText, W / 2, gp.y + ROWS * cs + 30);

            // Cursor blink
            if (Math.floor(performance.now() / 500) % 2 === 0) {
                const tw = ctx.measureText(typedText).width;
                ctx.fillRect(W / 2 + tw / 2 + 4, gp.y + ROWS * cs + 18, 3, 20);
            }
        }
    }

    // Start Screen
    if (gameState === 'start') {
        ctx.fillStyle = 'rgba(10, 10, 26, 0.9)';
        ctx.fillRect(0, 0, W, H);

        const titleSize = Math.min(W * 0.08, 60);
        ctx.font = `bold ${titleSize}px 'Courier New', monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#4fff88';
        ctx.fillText('TYPING TETRIS', W / 2, H * 0.3);

        const subSize = Math.min(W * 0.035, 18);
        ctx.font = `${subSize}px 'Courier New', monospace`;
        ctx.fillStyle = '#aaccff';
        const lines = [
            'Words fall from the top of the grid.',
            'Type them before they reach the bottom!',
            '',
            'CONTROLS:',
            '  Type letters to match falling words',
            '  Backspace to correct mistakes',
            '  Correct typing clears the word',
            '  Build combos for bonus points!',
            '',
            `HIGH SCORE: ${highScore}`,
            '',
            '[ PRESS ENTER TO START ]'
        ];
        lines.forEach((line, i) => {
            if (i === lines.length - 1) {
                ctx.fillStyle = Math.floor(performance.now() / 600) % 2 ? '#4fff88' : '#2a9955';
            } else {
                ctx.fillStyle = i >= 2 && i <= 7 ? '#ccc' : '#aaccff';
            }
            ctx.fillText(line, W / 2, H * 0.3 + (i + 1) * subSize * 1.6);
        });

        // Decorative blocks
        const t = performance.now() / 1000;
        for (let i = 0; i < 12; i++) {
            const bx = W * 0.1 + (i % 4) * W * 0.2;
            const by = H * 0.75 + Math.floor(i / 4) * cs * 0.6;
            const s = cs * 0.5;
            ctx.fillStyle = `hsla(${(t * 50 + i * 30) % 360}, 60%, 50%, 0.3)`;
            ctx.fillRect(bx, by, s, s);
        }
    }

    // Game Over Screen
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(10, 10, 26, 0.85)';
        ctx.fillRect(0, 0, W, H);

        const titleSize = Math.min(W * 0.07, 50);
        ctx.font = `bold ${titleSize}px 'Courier New', monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff4444';
        ctx.fillText('GAME OVER', W / 2, H * 0.3);

        const infoSize = Math.min(W * 0.04, 22);
        ctx.font = `${infoSize}px 'Courier New', monospace`;
        ctx.fillStyle = '#fff';
        ctx.fillText(`Score: ${score}`, W / 2, H * 0.42);
        ctx.fillText(`Max Combo: x${maxCombo}`, W / 2, H * 0.48);

        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#ffdd44';
            ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.56);
        } else {
            ctx.fillStyle = '#aaccff';
            ctx.fillText(`High Score: ${highScore}`, W / 2, H * 0.56);
        }

        ctx.font = `bold ${infoSize}px 'Courier New', monospace`;
        ctx.fillStyle = Math.floor(performance.now() / 600) % 2 ? '#4fff88' : '#2a9955';
        ctx.fillText('[ PRESS ENTER TO RESTART ]', W / 2, H * 0.7);
    }

    ctx.restore();
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastFrame) / 1000, 0.1);
    lastFrame = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

lastFrame = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
