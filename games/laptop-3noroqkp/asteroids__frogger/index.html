<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids Frogger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, type, duration, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
let gameState = 'start'; // start, playing, gameover, levelcomplete
let score = 0;
let lives = 3;
let level = 1;
let frameCount = 0;

// Stars
let stars = [];
function genStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 });
    }
}
genStars();

// Frog
let frog = { x: 0, y: 0, vx: 0, vy: 0, size: 20, invincible: 0 };
const FROG_SPEED = 4;

// Bullets
let bullets = [];
const BULLET_SPEED = 8;
const SHOOT_COOLDOWN = 15;
let shootTimer = 0;

// Asteroids
let asteroids = [];
const LANES = 6;

// Particles
let particles = [];

function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    startLevel();
}

function startLevel() {
    frog.x = W / 2;
    frog.y = H - 60;
    frog.vx = 0;
    frog.vy = 0;
    frog.invincible = 60;
    bullets = [];
    asteroids = [];
    particles = [];
    shootTimer = 0;
    for (let i = 0; i < LANES; i++) {
        spawnLaneAsteroids(i);
    }
}

function spawnLaneAsteroids(lane) {
    const laneY = 80 + (H - 200) * (lane / LANES) + Math.random() * 30 - 15;
    const dir = Math.random() > 0.5 ? 1 : -1;
    const speed = (1.5 + level * 0.4) * dir;
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
        const x = dir > 0 ? -60 - Math.random() * W : W + 60 + Math.random() * W;
        asteroids.push({
            x: x,
            y: laneY + Math.random() * 20 - 10,
            vx: speed,
            vy: 0,
            size: 15 + Math.random() * 15,
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.05,
            verts: genAsteroidVerts()
        });
    }
}

function genAsteroidVerts() {
    const n = 7 + Math.floor(Math.random() * 4);
    const verts = [];
    for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2;
        const r = 0.6 + Math.random() * 0.4;
        verts.push({ a: angle, r: r });
    }
    return verts;
}

function spawnExplosion(x, y, color) {
    for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: color || '#ff6600',
            size: 2 + Math.random() * 3
        });
    }
}

function frogHit() {
    if (frog.invincible > 0) return;
    lives--;
    spawnExplosion(frog.x, frog.y, '#44ff44');
    playSound(150, 'sawtooth', 0.5, 0.4);
    if (lives <= 0) {
        gameState = 'gameover';
    } else {
        frog.invincible = 90;
        frog.x = W / 2;
        frog.y = H - 60;
    }
}

function checkCollisions() {
    if (frog.invincible > 0) return;
    const fs = frog.size;
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        const dx = frog.x - a.x;
        const dy = frog.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < fs + a.size * 0.7) {
            frogHit();
            break;
        }
    }
}

function update() {
    frameCount++;
    
    // Stars
    for (let s of stars) {
        s.y += s.sp;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
    
    if (gameState !== 'playing') return;
    
    // Frog movement
    if (keys['ArrowUp'] || keys['w'] || keys['W']) frog.vy = -FROG_SPEED;
    else if (keys['ArrowDown'] || keys['s'] || keys['S']) frog.vy = FROG_SPEED;
    else frog.vy = 0;
    
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) frog.vx = -FROG_SPEED;
    else if (keys['ArrowRight'] || keys['d'] || keys['D']) frog.vx = FROG_SPEED;
    else frog.vx = 0;
    
    frog.x += frog.vx;
    frog.y += frog.vy;
    frog.x = Math.max(frog.size, Math.min(W - frog.size, frog.x));
    frog.y = Math.max(50, Math.min(H - 30, frog.y));
    
    if (frog.invincible > 0) frog.invincible--;
    
    // Shooting
    if (shootTimer > 0) shootTimer--;
    if ((keys[' '] || keys['Space']) && shootTimer <= 0) {
        bullets.push({ x: frog.x, y: frog.y - frog.size, vy: -BULLET_SPEED });
        shootTimer = SHOOT_COOLDOWN;
        playSound(800, 'square', 0.1, 0.2);
    }
    
    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy;
        if (bullets[i].y < -20) bullets.splice(i, 1);
    }
    
    // Update asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.vx;
        a.rot += a.rotSpeed;
        
        // Wrap around
        if (a.vx > 0 && a.x > W + a.size * 2) a.x = -a.size * 2;
        if (a.vx < 0 && a.x < -a.size * 2) a.x = W + a.size * 2;
        
        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            if (Math.sqrt(dx * dx + dy * dy) < a.size * 0.7) {
                spawnExplosion(a.x, a.y);
                playSound(200 + Math.random() * 200, 'sawtooth', 0.3, 0.3);
                score += 10;
                asteroids.splice(i, 1);
                bullets.splice(j, 1);
                break;
            }
        }
    }
    
    // Check collisions
    checkCollisions();
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Check level complete
    if (frog.y < 70) {
        gameState = 'levelcomplete';
        score += 50 * level;
        playSound(600, 'sine', 0.3, 0.4);
        setTimeout(() => {
            if (gameState === 'levelcomplete') {
                level++;
                startLevel();
                gameState = 'playing';
            }
        }, 2000);
    }
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    ctx.fillStyle = '#ffffff';
    for (let s of stars) {
        ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.02 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
    
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }
    
    // Lane indicators
    for (let i = 0; i < LANES; i++) {
        const y = 80 + (H - 200) * (i / LANES);
        ctx.strokeStyle = 'rgba(100, 150, 255, 0.1)';
        ctx.setLineDash([5, 15]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    
    // Goal zone
    ctx.fillStyle = 'rgba(255, 50, 150, 0.15)';
    ctx.fillRect(0, 0, W, 70);
    ctx.strokeStyle = 'rgba(255, 50, 150, 0.5)';
    ctx.strokeRect(0, 0, W, 70);
    ctx.fillStyle = '#ff69b4';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('★ GOAL ★', W / 2, 45);
    
    // Asteroids
    for (let a of asteroids) {
        drawAsteroid(a);
    }
    
    // Bullets
    ctx.fillStyle = '#ffff00';
    for (let b of bullets) {
        ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
        ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
        ctx.fillRect(b.x - 4, b.y - 4, 8, 6);
        ctx.fillStyle = '#ffff00';
    }
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // Frog
    if (gameState === 'playing' || gameState === 'levelcomplete') {
        drawFrog();
    }
    
    // HUD
    ctx.fillStyle = '#44ff44';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE: ' + score, 20, 30);
    ctx.fillText('LEVEL: ' + level, 20, 55);
    
    // Lives
    ctx.fillStyle = '#44ff44';
    for (let i = 0; i < lives; i++) {
        ctx.beginPath();
        ctx.arc(W - 40 - i * 35, 25, 10, 0, Math.PI * 2);
        ctx.fill();
    }
    
    if (gameState === 'gameover') {
        drawGameOver();
    }
    
    if (gameState === 'levelcomplete') {
        ctx.fillStyle = '#ffff00';
        ctx.font = 'bold 32px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL COMPLETE!', W / 2, H / 2);
        ctx.font = '18px monospace';
        ctx.fillText('Next level incoming...', W / 2, H / 2 + 40);
    }
}

function drawFrog() {
    const x = frog.x, y = frog.y;
    if (frog.invincible > 0 && Math.floor(frameCount / 5) % 2 === 0) return;
    
    ctx.save();
    ctx.translate(x, y);
    
    // Body
    ctx.fillStyle = '#33cc33';
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Head
    ctx.fillStyle = '#44ee44';
    ctx.beginPath();
    ctx.arc(0, -8, 10, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-5, -12, 4, 0, Math.PI * 2);
    ctx.arc(5, -12, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(-5, -12, 2, 0, Math.PI * 2);
    ctx.arc(5, -12, 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Legs
    ctx.strokeStyle = '#33cc33';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-10, 8);
    ctx.lineTo(-16, 14);
    ctx.moveTo(10, 8);
    ctx.lineTo(16, 14);
    ctx.stroke();
    
    // Jet flame (space frog!)
    const flameH = 8 + Math.sin(frameCount * 0.3) * 4;
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(-6, 12);
    ctx.lineTo(0, 12 + flameH);
    ctx.lineTo(6, 12);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
}

function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    
    ctx.fillStyle = '#8B7355';
    ctx.strokeStyle = '#a0826d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < a.verts.length; i++) {
        const v = a.verts[i];
        const x = Math.cos(v.a) * a.size * v.r;
        const y = Math.sin(v.a) * a.size * v.r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    // Craters
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.arc(a.size * 0.2, -a.size * 0.1, a.size * 0.2, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
}

function drawStartScreen() {
    ctx.fillStyle = '#44ff44';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ASTEROIDS', W / 2, H / 3);
    ctx.fillStyle = '#ff69b4';
    ctx.fillText('FROGGER', W / 2, H / 3 + 50);
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaaaaa';
    ctx.fillText('A frog in space must cross lanes of asteroids!', W / 2, H / 2);
    ctx.fillText('Shoot them before they hit you.', W / 2, H / 2 + 30);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px monospace';
    ctx.fillText('ARROW KEYS / WASD - Move', W / 2, H / 2 + 80);
    ctx.fillText('SPACE - Shoot', W / 2, H / 2 + 105);
    
    const blink = Math.sin(frameCount * 0.05) > 0;
    if (blink) {
        ctx.fillStyle = '#ffff00';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('PRESS ENTER TO START', W / 2, H * 0.8);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 3);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = '24px monospace';
    ctx.fillText('Final Score: ' + score, W / 2, H / 2);
    ctx.fillText('Level Reached: ' + level, W / 2, H / 2 + 35);
    
    const blink = Math.sin(frameCount * 0.05) > 0;
    if (blink) {
        ctx.fillStyle = '#ffff00';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('PRESS ENTER TO RESTART', W / 2, H * 0.75);
    }
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    initAudio();
    
    if (gameState === 'start' && e.key === 'Enter') {
        resetGame();
        gameState = 'playing';
    }
    if (gameState === 'gameover' && e.key === 'Enter') {
        resetGame();
        gameState = 'playing';
    }
    
    if (e.key === ' ') e.preventDefault();
    if (e.key.startsWith('Arrow')) e.preventDefault();
});

window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

// Game loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
