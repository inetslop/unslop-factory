<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeStorm - Puzzle Typing Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'type') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
    } else if (type === 'destroy') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === 'life') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(60, now + 0.8);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        osc.start(now);
        osc.stop(now + 0.9);
    } else if (type === 'combo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    }
}

// Word lists
const normalWords = [
    "storm","flame","rapid","quantum","vector","cipher","matrix","signal",
    "puzzle","logic","brain","circuit","nexus","orbit","photon","quark",
    "helix","neuron","synapse","plasma","fusion","glacier","thunder","crystal",
    "shadow","mirror","prism","laser","atom","byte","pixel","token",
    "cipher","enigma","riddle","clue","code","decode","encrypt","decrypt"
];

const anagramWords = [
    { display: "morf", target: "form" },
    { display: "tnie", target: "nine" },
    { display: "wore", target: "rowe" },
    { display: "tcel", target: "cell" },
    { display: "nret", target: "rent" },
    { display: "wold", target: "lowd" },
    { display: "taem", target: "team" },
    { display: "elap", target: "apel" },
    { display: "trep", target: "pert" },
    { display: "nail", target: "lain" },
    { display: "warp", target: "pawr" },
    { display: "sile", target: "lise" },
    { display: "trop", target: "prot" },
    { display: "melt", target: "tlem" },
    { display: "nave", target: "vean" },
    { display: "grip", target: "prig" },
    { display: "sown", target: "wons" },
    { display: "tale", target: "elta" },
    { display: "flew", target: "wfel" },
    { display: "drew", target: "rude" },
];

// Game state
let gameState = 'start'; // start, playing, gameover
let words = [];
let typed = '';
let score = 0;
let combo = 0;
let maxCombo = 0;
let lives = 3;
let level = 1;
let spawnTimer = 0;
let spawnInterval = 2500;
let gameTime = 0;
let particles = [];
let shakeTime = 0;
let shakeIntensity = 0;
let lastTime = 0;
let highScore = 0;

try {
    highScore = parseInt(localStorage.getItem('typeStormHigh') || '0');
} catch(e) { highScore = 0; }

function shuffleStr(s) {
    let arr = s.split('');
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr.join('');
}

function spawnWord() {
    const isAnagram = level >= 2 && Math.random() < Math.min(0.3 + level * 0.05, 0.6);
    let word;
    if (isAnagram) {
        const base = anagramWords[Math.floor(Math.random() * anagramWords.length)];
        const display = shuffleStr(base.target);
        const target = base.target;
        word = { display, target, isAnagram: true };
    } else {
        const w = normalWords[Math.floor(Math.random() * normalWords.length)];
        word = { display: w, target: w, isAnagram: false };
    }
    const fontSize = Math.max(18, Math.min(32, W / (word.display.length * 0.6 + 2)));
    const x = Math.random() * (W - word.display.length * fontSize * 0.55);
    words.push({
        display: word.display,
        target: word.target,
        isAnagram: word.isAnagram,
        x: Math.max(10, x),
        y: -40,
        speed: (40 + level * 12) * (1 + Math.random() * 0.3),
        fontSize: fontSize,
        alive: true,
        fadeOut: 0,
        matched: false
    });
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 100 + Math.random() * 200;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: color,
            size: 2 + Math.random() * 4
        });
    }
}

function resetGame() {
    words = [];
    typed = '';
    score = 0;
    combo = 0;
    maxCombo = 0;
    lives = 3;
    level = 1;
    spawnTimer = 0;
    gameTime = 0;
    particles = [];
    shakeTime = 0;
    gameState = 'playing';
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#1a1a3a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = 'rgba(50, 50, 100, 0.15)';
    ctx.lineWidth = 1;
    const gridSize = 60;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    // Danger zone at bottom
    const dangerGrad = ctx.createLinearGradient(0, H - 80, 0, H);
    dangerGrad.addColorStop(0, 'rgba(255, 50, 50, 0)');
    dangerGrad.addColorStop(1, 'rgba(255, 50, 50, 0.15)');
    ctx.fillStyle = dangerGrad;
    ctx.fillRect(0, H - 80, W, 80);

    // Danger line
    ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 5]);
    ctx.beginPath();
    ctx.moveTo(0, H - 60);
    ctx.lineTo(W, H - 60);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawWord(w) {
    if (!w.alive) return;
    const alpha = w.fadeOut > 0 ? 1 - w.fadeOut : 1;
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${w.fontSize}px 'Courier New', monospace`;
    
    // Glow
    if (w.isAnagram) {
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ff9944';
    } else {
        ctx.shadowColor = '#44aaff';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#88ccff';
    }
    
    // Draw the display text
    for (let i = 0; i < w.display.length; i++) {
        if (w.isAnagram) {
            // Anagram shows target letters highlighted differently
            const letterColor = w.target[i] === w.display[i] ? '#ff6644' : '#ffcc88';
            ctx.fillStyle = letterColor;
            ctx.fillText(w.display[i], w.x + i * w.fontSize * 0.58, w.y);
        } else {
            ctx.fillStyle = '#88ccff';
            ctx.fillText(w.display[i], w.x + i * w.fontSize * 0.58, w.y);
        }
    }
    
    // Underline for anagram indicator
    if (w.isAnagram) {
        ctx.strokeStyle = 'rgba(255, 150, 50, 0.5)';
        ctx.lineWidth = 2;
        const textW = w.display.length * w.fontSize * 0.58;
        ctx.beginPath();
        ctx.moveTo(w.x - 4, w.y + 6);
        ctx.lineTo(w.x + textW + 4, w.y + 6);
        ctx.stroke();
    }
    
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size * p.life, p.size * p.life);
    });
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Score
    ctx.font = 'bold 20px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    
    // Combo
    if (combo > 1) {
        ctx.fillStyle = '#ffcc00';
        ctx.fillText(`COMBO x${combo}`, 20, 60);
    }
    
    // Level
    ctx.textAlign = 'center';
    ctx.fillStyle = '#aaaaff';
    ctx.fillText(`LEVEL ${level}`, W / 2, 35);
    
    // Lives
    ctx.textAlign = 'right';
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#ff4444';
        ctx.fillText('♥', W - 20 - i * 30, 35);
    }
    
    // High score
    ctx.textAlign = 'right';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = '#888888';
    ctx.fillText(`BEST: ${Math.max(highScore, score)}`, W - 20, 60);
    
    // Typed text at bottom
    if (typed.length > 0) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#44aaff';
        ctx.shadowBlur = 10;
        ctx.fillText(typed, W / 2, H - 25);
        ctx.shadowBlur = 0;
        
        // Cursor blink
        if (Math.floor(gameTime * 3) % 2 === 0) {
            const cursorX = W / 2 + typed.length * 8.4;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cursorX, H - 45, 3, 28);
        }
    } else {
        // Prompt
        ctx.textAlign = 'center';
        ctx.font = '16px "Courier New", monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillText('[ type words to destroy them ]', W / 2, H - 25);
    }
}

function drawStartScreen() {
    drawBackground();
    
    ctx.textAlign = 'center';
    
    // Title
    ctx.font = `bold ${Math.min(72, W/8)}px "Courier New", monospace`;
    ctx.fillStyle = '#44aaff';
    ctx.shadowColor = '#44aaff';
    ctx.shadowBlur = 20;
    ctx.fillText('TYPESTORM', W/2, H/3);
    ctx.shadowBlur = 0;
    
    // Subtitle
    ctx.font = `${Math.min(18, W/30)}px "Courier New", monospace`;
    ctx.fillStyle = '#ff9944';
    ctx.fillText('PUZZLE TYPING GAME', W/2, H/3 + 40);
    
    // Instructions
    ctx.font = `${Math.min(16, W/40)}px "Courier New", monospace`;
    ctx.fillStyle = '#aaaaaa';
    const instructions = [
        'Words fall from the top. Type them to destroy them!',
        '',
        'BLUE words → type as shown',
        'ORANGE words → PUZZLES! Type the correct word (letters are scrambled)',
        '',
        'Don\'t let words reach the red line!',
        `3 lives. Build combos for bonus points.`,
        '',
    ];
    instructions.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 + 20 + i * 28);
    });
    
    // Start prompt
    if (Math.floor(gameTime * 2) % 2 === 0) {
        ctx.font = `bold ${Math.min(24, W/25)}px "Courier New", monospace`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PRESS [ENTER] TO START', W/2, H - 80);
    }
    
    // Controls
    ctx.font = `${Math.min(13, W/50)}px "Courier New", monospace`;
    ctx.fillStyle = '#666666';
    ctx.fillText('Controls: Type letters | BACKSPACE to delete | ENTER to start/restart', W/2, H - 40);
    
    if (highScore > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H - 15);
    }
}

function drawGameOver() {
    drawBackground();
    
    // Draw remaining words faded
    words.forEach(w => {
        if (w.alive) {
            ctx.globalAlpha = 0.3;
            drawWord(w);
            ctx.globalAlpha = 1;
        }
    });
    
    ctx.textAlign = 'center';
    
    ctx.font = `bold ${Math.min(64, W/8)}px "Courier New", monospace`;
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', W/2, H/3);
    ctx.shadowBlur = 0;
    
    ctx.font = `${Math.min(22, W/25)}px "Courier New", monospace`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/3 + 50);
    ctx.fillText(`MAX COMBO: x${maxCombo}`, W/2, H/3 + 80);
    ctx.fillText(`LEVEL REACHED: ${level}`, W/2, H/3 + 110);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H/3 + 150);
    }
    
    if (Math.floor(gameTime * 2) % 2 === 0) {
        ctx.font = `bold ${Math.min(22, W/28)}px "Courier New", monospace`;
        ctx.fillStyle = '#ffffff';
        ctx.fillText('PRESS [ENTER] TO RESTART', W/2, H - 60);
    }
}

function update(dt) {
    gameTime += dt;
    
    if (gameState !== 'playing') return;
    
    // Level progression
    const newLevel = Math.floor(gameTime / 30) + 1;
    if (newLevel > level) {
        level = newLevel;
        spawnInterval = Math.max(800, 2500 - level * 200);
    }
    
    // Spawn words
    spawnTimer += dt * 1000;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnWord();
        // At higher levels, sometimes spawn extra
        if (level >= 3 && Math.random() < 0.3) {
            spawnWord();
        }
    }
    
    // Update words
    for (let i = words.length - 1; i >= 0; i--) {
        const w = words[i];
        if (!w.alive) {
            w.fadeOut += dt * 3;
            if (w.fadeOut >= 1) words.splice(i, 1);
            continue;
        }
        
        w.y += w.speed * dt;
        
        // Check if word reached danger zone
        if (w.y > H - 60) {
            w.alive = false;
            w.fadeOut = 0;
            lives--;
            shakeTime = 0.3;
            shakeIntensity = 8;
            playSound('life');
            
            // Clear typed input on miss
            typed = '';
            combo = 0;
            
            if (lives <= 0) {
                gameState = 'gameover';
                playSound('gameover');
                if (score > highScore) {
                    highScore = score;
                    try { localStorage.setItem('typeStormHigh', highScore); } catch(e) {}
                }
            }
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 300 * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Shake decay
    if (shakeTime > 0) {
        shakeTime -= dt;
    }
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const s = shakeIntensity * (shakeTime / 0.3);
        ctx.translate(
            (Math.random() - 0.5) * s,
            (Math.random() - 0.5) * s
        );
    }
    
    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'playing') {
        drawBackground();
        
        // Draw words sorted by y
        words.sort((a, b) => a.y - b.y);
        words.forEach(w => drawWord(w));
        
        drawParticles();
        drawHUD();
    } else if (gameState === 'gameover') {
        drawGameOver();
    }
    
    ctx.restore();
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

// Input handling
window.addEventListener('keydown', function(e) {
    if (gameState === 'start') {
        if (e.key === 'Enter' || e.key === ' ') {
            initAudio();
            playSound('start');
            resetGame();
        }
        return;
    }
    
    if (gameState === 'gameover') {
        if (e.key === 'Enter' || e.key === ' ') {
            playSound('start');
            resetGame();
        }
        return;
    }
    
    if (gameState !== 'playing') return;
    
    initAudio();
    
    if (e.key === 'Backspace') {
        e.preventDefault();
        if (typed.length > 0) {
            typed = typed.slice(0, -1);
        }
        return;
    }
    
    if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
        e.preventDefault();
        const ch = e.key.toLowerCase();
        typed += ch;
        playSound('type');
        
        // Check matches
        for (let i = words.length - 1; i >= 0; i--) {
            const w = words[i];
            if (!w.alive) continue;
            
            if (typed === w.target) {
                // Match!
                w.alive = false;
                w.fadeOut = 0;
                
                // Score
                combo++;
                maxCombo = Math.max(maxCombo, combo);
                const baseScore = w.target.length * 10;
                const comboBonus = combo > 1 ? combo * 5 : 0;
                score += baseScore + comboBonus;
                
                if (combo > 2) playSound('combo');
                else playSound('destroy');
                
                // Particles
                const px = w.x + w.display.length * w.fontSize * 0.29;
                const py = w.y - 10;
                addParticles(px, py, w.isAnagram ? '#ff9944' : '#44aaff', 15);
                
                typed = '';
                break;
            }
        }
        
        // Check if typed is a prefix of any word (for visual feedback)
        // If typed doesn't match any prefix, it's just building up
    }
});

// Prevent default for game keys
window.addEventListener('keydown', function(e) {
    if (gameState === 'playing' && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
        e.preventDefault();
    }
    if (e.key === 'Backspace' && gameState === 'playing') {
        e.preventDefault();
    }
});

// Start the game loop
lastTime = performance.now();
requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
