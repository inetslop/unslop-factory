<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: #0a0a1a; 
  overflow: hidden; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  height: 100vh; 
  width: 100vw;
}
canvas { 
  display: block; 
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type='square', vol=0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function sfxShoot() { playSound(880, 0.1, 'square', 0.1); }
function sfxHit() { playSound(220, 0.15, 'sawtooth', 0.12); }
function sfxDestroy() { playSound(440, 0.2, 'triangle', 0.15); playSound(660, 0.15, 'square', 0.1); }
function sfxPowerup() { playSound(1200, 0.1, 'sine', 0.12); playSound(1500, 0.1, 'sine', 0.1); }
function sfxLose() { playSound(150, 0.4, 'sawtooth', 0.2); }

// Game State
const STATE = { MENU: 0, PLAYING: 1, LEVEL_CLEAR: 2, GAME_OVER: 3, WIN: 4 };
let state = STATE.MENU;
let score = 0;
let lives = 3;
let level = 1;
let shotsLeft = 0;
let totalShots = 0;

// Grid
const COLS = 8;
const ROWS = 6;
let grid = []; // grid[row][col] = alien or null
let cellW, cellH, gridX, gridY, gridW, gridH;

// Cannon
let cannonX = 0;
let cannonSpeed = 5;
let bulletActive = false;
let bulletX = 0, bulletY = 0, bulletTargetRow = -1;
let bulletPower = 1; // for multi-shot
let extraBullets = [];

// Particles
let particles = [];

// Power-ups
let powerups = [];
let activePowerup = null;
let powerupTimer = 0;

// Alien types
const ALIEN_TYPES = {
  SMALL: { hp: 1, points: 10, color: '#4dff4d', size: 0.7 },
  MEDIUM: { hp: 2, points: 25, color: '#4d9dff', size: 0.85 },
  LARGE: { hp: 3, points: 50, color: '#ff4d4d', size: 1.0 },
  SHIELD: { hp: 2, points: 15, color: '#ffd74d', size: 0.6 }
};

// Level definitions
const LEVELS = [
  { name: "WARM UP", shots: 15, objective: "Clear all aliens!", 
    layout: [
      [S,S,S,S,S,S,S,S],
      [S,M,M,M,M,M,M,S],
      [M,L,L,L,L,L,M,M],
      [null,null,null,null,null,null,null,null]
    ]},
  { name: "SHIELDED", shots: 18, objective: "Destroy shields first!", 
    layout: [
      [S,S,SH,SH,SH,SH,S,S],
      [M,M,M,M,M,M,M,M],
      [L,L,L,L,L,L,L,L],
      [null,null,null,null,null,null,null,null]
    ]},
  { name: "DEEP SPACE", shots: 20, objective: "Clear in limited shots!", 
    layout: [
      [M,M,M,M,M,M,M,M],
      [S,S,L,L,L,L,S,S],
      [SH,SH,SH,SH,SH,SH,SH,SH],
      [M,M,M,M,M,M,M,M]
    ]},
  { name: "GAUNTLET", shots: 22, objective: "Full grid - good luck!", 
    layout: [
      [S,M,L,SH,SH,L,M,S],
      [M,L,SH,S,S,SH,L,M],
      [L,SH,S,M,M,S,SH,L],
      [M,M,SH,L,L,SH,M,M]
    ]},
  { name: "FINAL WAVE", shots: 25, objective: "Survive the gauntlet!", 
    layout: [
      [S,S,M,M,M,M,S,S],
      [M,L,L,SH,SH,L,L,M],
      [L,SH,M,M,M,M,SH,L],
      [SH,M,L,L,L,L,M,SH]
    ]}
];

const S = 'SMALL', M = 'MEDIUM', L = 'LARGE', SH = 'SHIELD';

function createAlien(type) {
  const t = ALIEN_TYPES[type];
  return { type, hp: t.hp, maxHp: t.hp, points: t.points, color: t.color, size: t.size, flash: 0 };
}

function initLevel(lvl) {
  const def = LEVELS[lvl - 1];
  shotsLeft = def.shots;
  totalShots = def.shots;
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      const t = def.layout[r] && def.layout[r][c];
      grid[r][c] = t ? createAlien(t) : null;
    }
  }
  cannonX = W / 2;
  bulletActive = false;
  extraBullets = [];
  powerups = [];
  activePowerup = null;
  particles = [];
  calcGrid();
}

function calcGrid() {
  const maxCellW = Math.min(60, (W - 80) / COLS);
  const maxCellH = Math.min(55, (H * 0.45) / ROWS);
  cellW = maxCellW;
  cellH = maxCellH;
  gridW = cellW * COLS;
  gridH = cellH * ROWS;
  gridX = (W - gridW) / 2;
  gridY = H * 0.12;
}

function getCellCenter(r, c) {
  return { x: gridX + c * cellW + cellW/2, y: gridY + r * cellH + cellH/2 };
}

function fire() {
  if (state !== STATE.PLAYING || bulletActive || shotsLeft <= 0) return;
  initAudio();
  sfxShoot();
  shotsLeft--;
  
  let cols = [];
  if (activePowerup === 'double') {
    // Double shot: fire at cannonX and cannonX + cellW
    const baseCol = Math.floor((cannonX - gridX) / cellW);
    cols = [baseCol, baseCol + 1];
    if (cols[1] >= COLS) cols[1] = baseCol - 1;
    if (cols[1] < 0) cols[1] = 0;
  } else {
    const col = Math.floor((cannonX - gridX) / cellW);
    cols = [Math.max(0, Math.min(COLS-1, col))];
  }
  
  extraBullets = cols.map(c => ({ x: gridX + c * cellW + cellW/2, y: H * 0.85, targetRow: 0, speed: 12 }));
  bulletActive = true;
}

function updateBullets() {
  if (!bulletActive) return;
  let allDone = true;
  
  for (let b of extraBullets) {
    b.y -= b.speed;
    const col = Math.floor((b.x - gridX) / cellW);
    
    if (col >= 0 && col < COLS) {
      for (let r = 0; r < ROWS; r++) {
        if (grid[r][col] && b.y <= getCellCenter(r, col).y + cellH/2) {
          // Hit!
          hitAlien(r, col);
          allDone = false;
          b.done = true;
          break;
        }
      }
    }
    
    if (b.y < gridY - cellH) {
      b.done = true;
    }
  }
  
  extraBullets = extraBullets.filter(b => !b.done);
  
  if (extraBullets.length === 0 && bulletActive) {
    bulletActive = false;
    checkTurnEnd();
  }
}

function hitAlien(r, c) {
  const alien = grid[r][c];
  if (!alien) return;
  
  sfxHit();
  alien.hp--;
  alien.flash = 8;
  
  // Particles
  const pos = getCellCenter(r, c);
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: pos.x, y: pos.y,
      vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
      life: 20, color: alien.color, size: 3
    });
  }
  
  if (alien.hp <= 0) {
    sfxDestroy();
    score += alien.points;
    // More particles
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: pos.x, y: pos.y,
        vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
        life: 30, color: alien.color, size: 4
      });
    }
    
    // Power-up chance
    if (Math.random() < 0.2) {
      const types = ['double', 'extra'];
      const type = types[Math.floor(Math.random()*types.length)];
      powerups.push({ x: pos.x, y: pos.y, type, vy: 1.5, life: 180 });
    }
    
    grid[r][c] = null;
  }
  
  checkLevelClear();
}

function checkTurnEnd() {
  if (shotsLeft <= 0) {
    // Check if aliens reached bottom
    for (let c = 0; c < COLS; c++) {
      if (grid[ROWS-1][c]) {
        loseLife();
        return;
      }
    }
    // Aliens advance
    advanceAliens();
    checkLevelClear();
    if (state === STATE.PLAYING && shotsLeft <= 0) {
      // Check if all cleared
      if (!checkAllCleared()) {
        loseLife();
      }
    }
  }
}

function advanceAliens() {
  // Aliens shift down and slightly sideways (simplified: just down)
  for (let r = ROWS-1; r > 0; r--) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c] && !grid[r+1]?.[c]) {
        // Can't go further down
      }
    }
  }
  // Simple: shift everything down by checking if bottom row has aliens
  // Actually let's make it: after each shot, the remaining aliens don't move (puzzle element)
  // But they pressure you by reducing shots value
}

function loseLife() {
  sfxLose();
  lives--;
  if (lives <= 0) {
    state = STATE.GAME_OVER;
  } else {
    // Reset current level with remaining aliens
    initLevel(level);
    score = Math.max(0, score - 50);
  }
}

function checkAllCleared() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) return false;
  return true;
}

function checkLevelClear() {
  if (checkAllCleared()) {
    state = STATE.LEVEL_CLEAR;
    score += shotsLeft * 20; // Bonus for remaining shots
    setTimeout(() => {
      if (level >= LEVELS.length) {
        state = STATE.WIN;
      } else {
        level++;
        initLevel(level);
        state = STATE.PLAYING;
      }
    }, 2000);
  }
}

function updateParticles() {
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.size *= 0.95;
  }
  particles = particles.filter(p => p.life > 0);
}

function updatePowerups() {
  for (let pu of powerups) {
    pu.y += pu.vy;
    pu.life--;
    
    // Collect if reaches cannon area
    if (pu.y > H * 0.82 && Math.abs(pu.x - cannonX) < cellW/2) {
      sfxPowerup();
      if (pu.type === 'double') { activePowerup = 'double'; powerupTimer = 5; }
      else if (pu.type === 'extra') { shotsLeft += 2; }
      pu.collected = true;
    }
  }
  powerups = powerups.filter(p => !p.collected && p.life > 0 && p.y < H);
  
  if (activePowerup && --powerupTimer <= 0) activePowerup = null;
}

function updateAlienFlash() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] && grid[r][c].flash > 0) grid[r][c].flash--;
}

// Drawing
function drawBackground() {
  // Stars
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
  
  const starSeed = 42;
  for (let i = 0; i < 80; i++) {
    const sx = ((i * 7919 + starSeed) % W);
    const sy = ((i * 6271 + starSeed) % H);
    const brightness = 0.3 + (Math.sin(Date.now()*0.001 + i)*0.5+0.5)*0.4;
    ctx.fillStyle = `rgba(255,255,255,${brightness})`;
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }
}

function drawAlien(x, y, alien) {
  const s = cellW * 0.35 * alien.size;
  const flash = alien.flash > 0;
  
  ctx.save();
  ctx.translate(x, y);
  
  if (flash) {
    ctx.fillStyle = '#ffffff';
  } else {
    ctx.fillStyle = alien.color;
  }
  
  // Draw based on type
  switch(alien.type) {
    case 'SMALL':
      // Small invader - simple bug shape
      ctx.beginPath();
      ctx.arc(0, 0, s*0.5, 0, Math.PI*2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = flash ? '#0a0a1a' : '#0a0a1a';
      ctx.fillRect(-s*0.2, -s*0.15, s*0.12, s*0.12);
      ctx.fillRect(s*0.1, -s*0.15, s*0.12, s*0.12);
      // Legs
      ctx.strokeStyle = flash ? '#fff' : alien.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-s*0.4, s*0.3); ctx.lineTo(-s*0.55, s*0.5);
      ctx.moveTo(s*0.4, s*0.3); ctx.lineTo(s*0.55, s*0.5);
      ctx.stroke();
      break;
      
    case 'MEDIUM':
      // Medium - wider bug
      ctx.beginPath();
      ctx.roundRect(-s*0.6, -s*0.4, s*1.2, s*0.8, 3);
      ctx.fill();
      // Antennae
      ctx.strokeStyle = flash ? '#fff' : alien.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-s*0.3, -s*0.4); ctx.lineTo(-s*0.45, -s*0.65);
      ctx.moveTo(s*0.3, -s*0.4); ctx.lineTo(s*0.45, -s*0.65);
      // Eyes
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(-s*0.25, -s*0.15, s*0.15, s*0.15);
      ctx.fillRect(s*0.1, -s*0.15, s*0.15, s*0.15);
      // Mandibles
      ctx.strokeStyle = flash ? '#fff' : alien.color;
      ctx.beginPath();
      ctx.moveTo(-s*0.4, s*0.3); ctx.lineTo(-s*0.6, s*0.5);
      ctx.moveTo(s*0.4, s*0.3); ctx.lineTo(s*0.6, s*0.5);
      ctx.stroke();
      break;
      
    case 'LARGE':
      // Large - tanky invader
      ctx.beginPath();
      ctx.roundRect(-s*0.7, -s*0.5, s*1.4, s*1.0, 4);
      ctx.fill();
      // Top dome
      ctx.beginPath();
      ctx.arc(0, -s*0.3, s*0.4, Math.PI, 0);
      ctx.fill();
      // Eyes (angry)
      ctx.fillStyle = '#0a0a1a';
      ctx.fillRect(-s*0.3, -s*0.2, s*0.2, s*0.15);
      ctx.fillRect(s*0.1, -s*0.2, s*0.2, s*0.15);
      // Jaw
      ctx.fillStyle = flash ? '#ccc' : '#333';
      ctx.fillRect(-s*0.25, s*0.15, s*0.5, s*0.15);
      // Arms
      ctx.strokeStyle = flash ? '#fff' : alien.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-s*0.7, 0); ctx.lineTo(-s*0.9, s*0.3);
      ctx.moveTo(s*0.7, 0); ctx.lineTo(s*0.9, s*0.3);
      ctx.stroke();
      break;
      
    case 'SHIELD':
      // Shield - hexagonal barrier
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI)/3 - Math.PI/2;
        const px = Math.cos(a) * s*0.6;
        const py = Math.sin(a) * s*0.6;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      // Inner glow
      ctx.strokeStyle = flash ? '#fff' : 'rgba(255,215,77,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI)/3 - Math.PI/2;
        const px = Math.cos(a) * s*0.35;
        const py = Math.sin(a) * s*0.35;
        if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.stroke();
      break;
  }
  
  // HP indicator
  if (alien.maxHp > 1 && alien.hp < alien.maxHp) {
    const barW = cellW * 0.5;
    const barH = 4;
    const bx = x - barW/2;
    const by = y + s*0.7;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = alien.color;
    ctx.fillRect(bx, by, barW * (alien.hp/alien.maxHp), barH);
  }
  
  ctx.restore();
}

function drawCannon() {
  const cy = H * 0.85;
  
  ctx.save();
  ctx.translate(cannonX, cy);
  
  // Base
  ctx.fillStyle = '#2a2a4a';
  ctx.beginPath();
  ctx.moveTo(-15, 10);
  ctx.lineTo(15, 10);
  ctx.lineTo(8, -5);
  ctx.lineTo(-8, -5);
  ctx.closePath();
  ctx.fill();
  
  // Barrel
  ctx.fillStyle = '#4a4a7a';
  ctx.fillRect(-3, -25, 6, 20);
  
  // Glow
  if (activePowerup === 'double') {
    ctx.fillStyle = 'rgba(77,157,255,0.4)';
    ctx.beginPath();
    ctx.arc(0, -25, 8, 0, Math.PI*2);
    ctx.fill();
  }
  
  ctx.restore();
}

function drawBullets() {
  for (let b of extraBullets) {
    ctx.fillStyle = '#ff4';
    ctx.fillRect(b.x - 2, b.y - 8, 4, 10);
    // Trail
    ctx.fillStyle = 'rgba(255,255,68,0.3)';
    ctx.fillRect(b.x - 1, b.y + 2, 2, 15);
  }
}

function drawPowerups() {
  for (let pu of powerups) {
    const s = 12;
    ctx.fillStyle = pu.type === 'double' ? '#4d9dff' : '#ffd74d';
    ctx.beginPath();
    ctx.arc(pu.x, pu.y, s, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pu.type === 'double' ? '×2' : '+', pu.x, pu.y);
  }
}

function drawParticles() {
  for (let p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const def = LEVELS[level-1];
  
  // Top bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 45);
  
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText(`LEVEL ${level}: ${def.name}`, 15, 28);
  
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd74d';
  ctx.fillText(def.objective, W/2, 28);
  
  ctx.textAlign = 'right';
  ctx.fillStyle = '#4dff4d';
  ctx.fillText(`SHOTS: ${shotsLeft}/${totalShots}`, W-150, 28);
  ctx.fillStyle = '#ff4d4d';
  ctx.fillText(`LIVES: ${'♥'.repeat(Math.max(0,lives))}`, W-15, 28);
  
  // Score
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.fillText(`SCORE: ${score}`, 15, H - 10);
  
  // Active powerup indicator
  if (activePowerup) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#4d9dff';
    ctx.fillText(`[DOUBLE] (${powerupTimer})`, W-15, H-10);
  }
  
  // Shot indicator bar
  const barW2 = W * 0.3;
  const barX2 = (W - barW2)/2;
  const y2 = H - 25;
  ctx.fillStyle = '#222';
  ctx.fillRect(barX2, y2, barW2, 8);
  ctx.fillStyle = shotsLeft <= 3 ? '#ff4d4d' : '#4dff4d';
  ctx.fillRect(barX2, y2, barW2 * (shotsLeft/totalShots), 8);
}

function drawGrid() {
  // Subtle grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(gridX, gridY + r*cellH);
    ctx.lineTo(gridX + gridW, gridY + r*cellH);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(gridX + c*cellW, gridY);
    ctx.lineTo(gridX + c*cellW, gridY + gridH);
    ctx.stroke();
  }
}

function drawAliens() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c]) {
        const pos = getCellCenter(r, c);
        drawAlien(pos.x, pos.y, grid[r][c]);
      }
    }
  }
}

function drawMenu() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 7919) % W);
    const sy = ((i * 6271) % H);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(Date.now()*0.002+i)*0.3})`;
    ctx.fillRect(sx, sy, 2, 2);
  }
  
  // Title
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.min(48, W*0.06)}px monospace`;
  ctx.fillStyle = '#4dff4d';
  ctx.fillText('SPACE INVADERS', W/2, H*0.2);
  ctx.font = `bold ${Math.min(36, W*0.045)}px monospace`;
  ctx.fillStyle = '#ffd74d';
  ctx.fillText('PUZZLE', W/2, H*0.28);
  
  // Instructions
  ctx.font = `${Math.min(16, W*0.02)}px monospace`;
  ctx.fillStyle = '#ccc';
  const lines = [
    '← → or A/D : Move Cannon',
    'SPACE : Fire Bullet',
    '',
    'Clear all aliens before shots run out!',
    'Each shot uses limited ammo.',
    'Collect power-ups from destroyed aliens.',
    '',
    'ALIEN TYPES:',
    '  Green (1HP) | Blue (2HP) | Red (3HP) | Gold Shield (2HP)'
  ];
  lines.forEach((l, i) => {
    ctx.fillText(l, W/2, H*0.4 + i * 24);
  });
  
  // Start prompt
  const pulse = Math.sin(Date.now()*0.005)*0.3+0.7;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = `bold ${Math.min(20, W*0.03)}px monospace`;
  ctx.fillText('PRESS ENTER TO START', W/2, H*0.82);
}

function drawLevelClear() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.min(40, W*0.05)}px monospace`;
  ctx.fillStyle = '#4dff4d';
  ctx.fillText('LEVEL COMPLETE!', W/2, H*0.35);
  
  ctx.font = `${Math.min(18, W*0.025)}px monospace`;
  ctx.fillStyle = '#ffd74d';
  ctx.fillText(`Bonus: +${shotsLeft * 20} pts`, W/2, H*0.45);
  ctx.fillStyle = '#fff';
  ctx.fillText(`Score: ${score}`, W/2, H*0.52);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, W, H);
  
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.min(40, W*0.05)}px monospace`;
  ctx.fillStyle = '#ff4d4d';
  ctx.fillText('GAME OVER', W/2, H*0.35);
  
  ctx.font = `${Math.min(18, W*0.025)}px monospace`;
  ctx.fillStyle = '#fff';
  ctx.fillText(`Final Score: ${score}`, W/2, H*0.45);
  
  const pulse = Math.sin(Date.now()*0.005)*0.3+0.7;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.fillText('PRESS ENTER TO RESTART', W/2, H*0.6);
}

function drawWin() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, W, H);
  
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.min(36, W*0.045)}px monospace`;
  ctx.fillStyle = '#ffd74d';
  ctx.fillText('★ VICTORY! ★', W/2, H*0.3);
  
  ctx.font = `${Math.min(18, W*0.025)}px monospace`;
  ctx.fillStyle = '#fff';
  ctx.fillText(`All levels cleared!`, W/2, H*0.4);
  ctx.fillText(`Final Score: ${score}`, W/2, H*0.48);
  
  const pulse = Math.sin(Date.now()*0.005)*0.3+0.7;
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.fillText('PRESS ENTER TO PLAY AGAIN', W/2, H*0.6);
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  
  if (state === STATE.MENU || state === STATE.GAME_OVER || state === STATE.WIN) {
    if (e.code === 'Enter' || e.code === 'Space') {
      initAudio();
      score = 0;
      lives = 3;
      level = 1;
      initLevel(level);
      state = STATE.PLAYING;
    }
  }
  
  if (state === STATE.PLAYING) {
    if (e.code === 'Space') {
      e.preventDefault();
      fire();
    }
  }
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Game Loop
function update() {
  if (state !== STATE.PLAYING) return;
  
  // Cannon movement
  if (keys['ArrowLeft'] || keys['KeyA']) cannonX -= cannonSpeed;
  if (keys['ArrowRight'] || keys['KeyD']) cannonX += cannonSpeed;
  cannonX = Math.max(gridX + cellW/2, Math.min(gridX + gridW - cellW/2, cannonX));
  
  updateBullets();
  updateParticles();
  updatePowerups();
  updateAlienFlash();
}

function draw() {
  if (state === STATE.MENU) { drawMenu(); return; }
  
  drawBackground();
  drawGrid();
  drawAliens();
  drawBullets();
  drawPowerups();
  drawCannon();
  drawParticles();
  drawHUD();
  
  if (state === STATE.LEVEL_CLEAR) drawLevelClear();
  if (state === STATE.GAME_OVER) drawGameOver();
  if (state === STATE.WIN) drawWin();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Init
initLevel(1);
loop();
</script>
</body>
</html>
