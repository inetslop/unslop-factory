<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLAST CLICKER</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type, freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxExplosion() { playSound('sawtooth', 80, 0.3, 0.3); }
function sfxHit() { playSound('square', 200, 0.1, 0.2); }
function sfxCombo(n) { playSound('sine', 300 + n * 50, 0.15, 0.2); }
function sfxLifeLost() { playSound('sawtooth', 60, 0.5, 0.4); }
function sfxPowerup() { playSound('sine', 600, 0.2, 0.3); }

// Game State
const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.MENU;
let score = 0;
let highScore = 0;
let lives = 5;
let wave = 1;
let combo = 0;
let comboTimer = 0;
let maxCombo = 0;
let shake = 0;
let shakeX = 0, shakeY = 0;

try { highScore = parseInt(localStorage.getItem('blastClickerHigh') || '0'); } catch(e) {}

// Entities
let enemies = [];
let particles = [];
let explosions = [];
let powerups = [];
let floatTexts = [];

// Power-up effects
let blastRadius = 70;
let powerupTimers = { rapid: 0, bigBlast: 0, damage: 0 };
let clickCooldown = 0;

// Wave system
let waveTimer = 0;
let enemiesToSpawn = 0;
let spawnInterval = 1.5;
let waveEnemiesSpawned = 0;

function resetGame() {
    score = 0;
    lives = 5;
    wave = 1;
    combo = 0;
    comboTimer = 0;
    maxCombo = 0;
    shake = 0;
    enemies = [];
    particles = [];
    explosions = [];
    powerups = [];
    floatTexts = [];
    blastRadius = 70;
    powerupTimers = { rapid: 0, bigBlast: 0, damage: 0 };
    clickCooldown = 0;
    waveTimer = 0;
    enemiesToSpawn = 10;
    spawnInterval = 1.5;
    waveEnemiesSpawned = 0;
}

function startWave() {
    enemiesToSpawn = 8 + wave * 3;
    spawnInterval = Math.max(0.3, 1.5 - wave * 0.1);
    waveTimer = 0;
    waveEnemiesSpawned = 0;
}

function spawnEnemy() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const speed = 30 + wave * 2;
    
    if (side === 0) { x = -20; y = Math.random() * H; }
    else if (side === 1) { x = W + 20; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = -20; }
    else { x = Math.random() * W; y = H + 20; }

    const types = ['basic', 'fast', 'tank'];
    let type = 'basic';
    const r = Math.random();
    if (wave >= 2 && r > 0.7) type = 'fast';
    if (wave >= 3 && r > 0.85) type = 'tank';

    let enemy;
    if (type === 'basic') {
        enemy = { x, y, radius: 18, hp: 1, maxHp: 1, speed: speed, color: '#ff4444', type: 'basic', score: 10 };
    } else if (type === 'fast') {
        enemy = { x, y, radius: 12, hp: 1, maxHp: 1, speed: speed * 1.8, color: '#ffcc00', type: 'fast', score: 25 };
    } else {
        enemy = { x, y, radius: 30, hp: 5 + Math.floor(wave / 2), maxHp: 5 + Math.floor(wave / 2), speed: speed * 0.6, color: '#4488ff', type: 'tank', score: 50 };
    }

    // Boss every 5 waves
    if (wave % 5 === 0 && waveEnemiesSpawned === 0) {
        enemy = { x, y, radius: 50, hp: 20 + wave * 3, maxHp: 20 + wave * 3, speed: speed * 0.4, color: '#cc44ff', type: 'boss', score: 200 };
    }

    const cx = W / 2, cy = H / 2;
    const angle = Math.atan2(cy - y, cx - x);
    enemy.vx = Math.cos(angle) * enemy.speed;
    enemy.vy = Math.sin(angle) * enemy.speed;
    enemies.push(enemy);
}

function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = speed * (0.5 + Math.random() * 0.5);
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            radius: 2 + Math.random() * 4,
            color
        });
    }
}

function addExplosion(x, y, radius) {
    explosions.push({ x, y, radius, maxRadius: radius, life: 1 });
    for (let i = 0; i < 20; i++) {
        spawnParticles(x, y, `hsl(${Math.random() * 60}, 100%, 60%)`, 3, 5);
    }
}

function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 1 });
}

function handleClick(mx, my) {
    if (state === STATE.MENU || state === STATE.GAMEOVER) return;
    initAudio();
    
    if (clickCooldown > 0) return;
    clickCooldown = powerupTimers.rapid > 0 ? 0.1 : 0.25;

    const radius = powerupTimers.bigBlast > 0 ? blastRadius * 1.8 : blastRadius;
    const damage = powerupTimers.damage > 0 ? 3 : 1;

    addExplosion(mx, my, radius);
    sfxExplosion();
    shake = Math.min(shake + 5, 15);

    let kills = 0;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = mx - e.x;
        const dy = my - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < radius + e.radius) {
            e.hp -= damage;
            sfxHit();
            spawnParticles(e.x, e.y, e.color, 5, 3);
            if (e.hp <= 0) {
                kills++;
                spawnParticles(e.x, e.y, e.color, 15, 5);
                const pts = e.score * (1 + Math.floor(combo / 5));
                score += pts;
                addFloatText(e.x, e.y, '+' + pts, '#fff');
                
                if (Math.random() < 0.12) {
                    const types = ['rapid', 'bigBlast', 'damage'];
                    const t = types[Math.floor(Math.random() * types.length)];
                    powerups.push({ x: e.x, y: e.y, type: t, life: 8 });
                }
                
                enemies.splice(i, 1);
            }
        }
    }

    if (kills > 0) {
        combo++;
        comboTimer = 2;
        maxCombo = Math.max(maxCombo, combo);
        sfxCombo(combo);
        if (combo > 0 && combo % 5 === 0) {
            addFloatText(W / 2, H / 2 - 80, 'COMBO x' + combo, '#ffcc00');
        }
    } else {
        combo = 0;
    }
}

let lastTime = 0;
function update(dt) {
    if (state !== STATE.PLAYING) return;

    // Combo timer
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;

    // Click cooldown
    clickCooldown = Math.max(0, clickCooldown - dt);

    // Powerup timers
    for (let key in powerupTimers) {
        powerupTimers[key] = Math.max(0, powerupTimers[key] - dt);
    }

    // Wave spawning
    waveTimer += dt;
    if (waveEnemiesSpawned < enemiesToSpawn && waveTimer >= spawnInterval) {
        waveTimer = 0;
        spawnEnemy();
        waveEnemiesSpawned++;
    }

    // Check wave complete
    if (waveEnemiesSpawned >= enemiesToSpawn && enemies.length === 0) {
        wave++;
        startWave();
        addFloatText(W / 2, H / 2 - 40, 'WAVE ' + wave, '#00ffcc');
    }

    // Update enemies
    const cx = W / 2, cy = H / 2;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx * dt;
        e.y += e.vy * dt;

        // Check if reached center
        const dx = cx - e.x;
        const dy = cy - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 30) {
            enemies.splice(i, 1);
            lives--;
            sfxLifeLost();
            shake = 20;
            spawnParticles(cx, cy, '#ff0000', 20, 5);
            addFloatText(cx, cy - 40, '-1 LIFE', '#ff4444');
            if (lives <= 0) {
                gameOver();
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update explosions
    for (let i = explosions.length - 1; i >= 0; i--) {
        const e = explosions[i];
        e.life -= 0.05;
        if (e.life <= 0) explosions.splice(i, 1);
    }

    // Update powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.life -= dt;
        if (p.life <= 0) {
            powerups.splice(i, 1);
            continue;
        }
    }

    // Update float texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const f = floatTexts[i];
        f.y -= 40 * dt;
        f.life -= dt * 0.8;
        if (f.life <= 0) floatTexts.splice(i, 1);
    }

    // Shake decay
    shake *= 0.9;
    if (shake < 0.5) shake = 0;
    shakeX = (Math.random() - 0.5) * shake;
    shakeY = (Math.random() - 0.5) * shake;
}

function gameOver() {
    state = STATE.GAMEOVER;
    try {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('blastClickerHigh', highScore.toString());
        }
    } catch(e) {}
}

// Rendering
function drawGlow(x, y, radius, color, alpha) {
    const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
    grad.addColorStop(0, color + 'ff');
    grad.addColorStop(0.5, color + '88');
    grad.addColorStop(1, color + '00');
    ctx.globalAlpha = alpha;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
}

function draw() {
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Grid
    ctx.strokeStyle = 'rgba(40, 60, 100, 0.3)';
    ctx.lineWidth = 1;
    const gridSize = 60;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Center target
    drawGlow(W/2, H/2, 40, 'rgba(100,200,255,', 0.3 + Math.sin(Date.now()*0.003)*0.1));
    ctx.strokeStyle = 'rgba(100,200,255,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W/2, H/2, 30, 0, Math.PI * 2);
    ctx.stroke();

    // Explosions
    for (const e of explosions) {
        const r = e.maxRadius * (1 - e.life * 0.5);
        ctx.globalAlpha = e.life;
        drawGlow(e.x, e.y, r, 'rgba(255,200,50,', 0.6);
        ctx.strokeStyle = `rgba(255,255,200,${e.life})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    // Enemies
    for (const e of enemies) {
        drawGlow(e.x, e.y, e.radius * 1.5, 'rgba(' + hexToRgb(e.color) + ',', 0.3));
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();

        // HP bar for tanks/bosses
        if (e.maxHp > 1) {
            const bw = e.radius * 2;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(e.x - bw/2, e.y - e.radius - 12, bw, 6);
            ctx.fillStyle = e.color;
            ctx.fillRect(e.x - bw/2, e.y - e.radius - 12, bw * (e.hp / e.maxHp), 6);
        }

        // Boss special
        if (e.type === 'boss') {
            ctx.strokeStyle = 'rgba(204,68,255,0.5)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius + 8 + Math.sin(Date.now()*0.01)*5, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Powerups
    for (const p of powerups) {
        const pulse = 1 + Math.sin(Date.now() * 0.005) * 0.2;
        let color, label;
        if (p.type === 'rapid') { color = '#ffcc00'; label = 'R'; }
        else if (p.type === 'bigBlast') { color = '#00ffcc'; label = 'B'; }
        else { color = '#ff4488'; label = 'D'; }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 15 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(label, p.x, p.y + 5);

        // Blink when about to expire
        if (p.life < 2 && Math.floor(p.life * 5) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
    }

    // Float texts
    for (const f of floatTexts) {
        ctx.globalAlpha = f.life;
        ctx.fillStyle = f.color;
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y);
        ctx.globalAlpha = 1;
    }

    // HUD
    if (state === STATE.PLAYING || state === STATE.GAMEOVER) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('SCORE: ' + score, 20, 35);
        ctx.font = '16px monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('WAVE: ' + wave, 20, 58);

        // Lives
        for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(W - 30 - i * 30, 30, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        // Combo
        if (combo > 1) {
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('COMBO x' + combo, W / 2, 35);
        }

        // Powerup indicators
        let py = 80;
        if (powerupTimers.rapid > 0) { ctx.fillStyle = '#ffcc00'; ctx.font = '14px monospace'; ctx.textAlign = 'left'; ctx.fillText('RAPID: ' + powerupTimers.rapid.toFixed(1), 20, py); py += 20; }
        if (powerupTimers.bigBlast > 0) { ctx.fillStyle = '#00ffcc'; ctx.font = '14px monospace'; ctx.textAlign = 'left'; ctx.fillText('BIG BLAST: ' + powerupTimers.bigBlast.toFixed(1), 20, py); py += 20; }
        if (powerupTimers.damage > 0) { ctx.fillStyle = '#ff4488'; ctx.font = '14px monospace'; ctx.textAlign = 'left'; ctx.fillText('MEGA DMG: ' + powerupTimers.damage.toFixed(1), 20, py); }
    }

    // Menu / Game Over overlay
    if (state === STATE.MENU) {
        drawMenu();
    } else if (state === STATE.GAMEOVER) {
        drawGameOver();
    }

    ctx.restore();
}

function hexToRgb(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return r + ',' + g + ',' + b;
}

function drawMenu() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('BLAST CLICKER', W/2, H/3 - 40);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Click to explode and destroy enemies!', W/2, H/3 + 20);
    ctx.fillText('Don\'t let them reach the center!', W/2, H/3 + 50);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('CLICK - Explode at cursor', W/2, H/3 + 95);
    ctx.fillText('Enemies: Red=Normal  Yellow=Fast  Blue=Tank  Purple=BOSS', W/2, H/3 + 120);
    ctx.fillText('Grab power-ups: R=Rapid Fire  B=Big Blast  D=Mega Damage', W/2, H/3 + 145);

    if (highScore > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = '18px monospace';
        ctx.fillText('HIGH SCORE: ' + highScore, W/2, H/3 + 185);
    }

    const pulse = 0.7 + Math.sin(Date.now() * 0.004) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('[ CLICK TO START ]', W/2, H - 80);
    ctx.globalAlpha = 1;
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GAME OVER', W/2, H/3 - 20);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText('SCORE: ' + score, W/2, H/3 + 30);
    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    ctx.fillText('Waves survived: ' + wave, W/2, H/3 + 60);
    ctx.fillText('Max Combo: x' + maxCombo, W/2, H/3 + 85);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('NEW HIGH SCORE!', W/2, H/3 + 120);
    }

    const pulse = 0.7 + Math.sin(Date.now() * 0.004) * 0.3;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('[ CLICK TO RESTART ]', W/2, H - 80);
    ctx.globalAlpha = 1;
}

// Input
window.addEventListener('click', (e) => {
    initAudio();
    const mx = e.clientX;
    const my = e.clientY;

    if (state === STATE.MENU) {
        resetGame();
        state = STATE.PLAYING;
        startWave();
        return;
    }
    if (state === STATE.GAMEOVER) {
        resetGame();
        state = STATE.PLAYING;
        startWave();
        return;
    }

    // Check powerup pickup
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        const dx = mx - p.x, dy = my - p.y;
        if (Math.sqrt(dx*dx + dy*dy) < 30) {
            sfxPowerup();
            if (p.type === 'rapid') powerupTimers.rapid = 5;
            else if (p.type === 'bigBlast') powerupTimers.bigBlast = 5;
            else if (p.type === 'damage') powerupTimers.damage = 5;
            addFloatText(p.x, p.y, p.type.toUpperCase() + '!', '#0f0');
            powerups.splice(i, 1);
            return;
        }
    }

    handleClick(mx, my);
});

window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
        if (state === STATE.GAMEOVER) {
            resetGame();
            state = STATE.PLAYING;
            startWave();
        }
    }
    if (e.key === 'Escape') {
        if (state === STATE.PLAYING) {
            state = STATE.MENU;
        }
    }
});

// Game Loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

startWave();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
