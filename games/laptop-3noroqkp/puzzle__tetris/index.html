<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Tetris</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: monospace; }
canvas { display: block; }
#gameContainer {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="canvas"></canvas>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, cellSize, boardX, boardY;
const COLS = 10, ROWS = 20;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  cellSize = Math.min(Math.floor((H - 40) / ROWS), Math.floor((W * 0.6) / COLS));
  boardX = Math.floor((W - COLS * cellSize) / 2);
  boardY = Math.floor((H - ROWS * cellSize) / 2);
}
resize();
window.addEventListener('resize', () => { resize(); });

// Game state
let board = [];
let targetPattern = null;
let currentPiece = null;
let nextPiece = null;
let score = 0;
let level = 1;
let gameState = 'start'; // start, playing, levelComplete, gameOver, win
let dropInterval = 800;
let lastDrop = 0;
let lockedPieces = [];
let comboCount = 0;
let particles = [];
let audioCtx = null;

const PIECES = {
  I: { shape: [[1,1,1,1]], color: '#00e5ff' },
  O: { shape: [[1,1],[1,1]], color: '#ffee00' },
  T: { shape: [[0,1,0],[1,1,1]], color: '#aa00ff' },
  S: { shape: [[0,1,1],[1,1,0]], color: '#00ff88' },
  Z: { shape: [[1,1,0],[0,1,1]], color: '#ff3366' },
  J: { shape: [[1,0,0],[1,1,1]], color: '#4488ff' },
  L: { shape: [[0,0,1],[1,1,1]], color: '#ff9900' }
};

function initBoard() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

function generateTargetPattern(lvl) {
  const pattern = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  let numTargets;
  if (lvl <= 2) numTargets = 4 + lvl * 2;
  else if (lvl <= 5) numTargets = 8 + lvl * 2;
  else numTargets = Math.min(10 + lvl * 2, 30);

  const placed = [];
  let attempts = 0;
  while (placed.length < numTargets && attempts < 500) {
    attempts++;
    const r = ROWS - 4 - Math.floor(Math.random() * 8);
    const c = Math.floor(Math.random() * COLS);
    if (!pattern[r][c]) {
      pattern[r][c] = true;
      placed.push({r, c});
      // Sometimes add adjacent cells for interesting shapes
      if (placed.length % 3 === 0 && Math.random() < 0.6) {
        const dir = Math.floor(Math.random() * 4);
        const dr = [0, 1, -1, 0][dir];
        const dc = [1, 0, 0, -1][dir];
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !pattern[nr][nc]) {
          pattern[nr][nc] = true;
          placed.push({r: nr, c: nc});
        }
      }
    }
  }
  return pattern;
}

function getPiece(type) {
  const p = PIECES[type];
  return { type, shape: p.shape.map(row => [...row]), color: p.color, x: 3, y: 0 };
}

function randomPiece() {
  const types = Object.keys(PIECES);
  return getPiece(types[Math.floor(Math.random() * types.length)]);
}

function rotate(piece) {
  const s = piece.shape;
  const rows = s.length, cols = s[0].length;
  const newShape = Array.from({length: cols}, (_, i) => Array(rows).fill(0));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      newShape[c][rows - 1 - r] = s[r][c];
  return newShape;
}

function validPosition(piece, px, py) {
  const s = piece.shape;
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c]) {
        const nx = px + c, ny = py + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
        if (ny >= 0 && board[ny][nx]) return false;
      }
  return true;
}

function lockPiece() {
  const s = currentPiece.shape;
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c] && currentPiece.y + r >= 0)
        board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;

  // Check line clears
  let linesCleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(cell => cell !== null)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
      linesCleared++;
      r++;
    }
  }
  if (linesCleared > 0) {
    score += linesCleared * 100;
    spawnParticles();
    playSound('clear');
  }

  // Check target completion
  let allFilled = true;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (targetPattern[r][c] && !board[r][c]) allFilled = false;

  if (allFilled) {
    score += 500 * level;
    gameState = 'levelComplete';
    playSound('win');
    return;
  }

  // Check game over
  if (!validPosition(currentPiece, currentPiece.x, -1)) {
    // Actually check if piece can be placed at all
  }
  currentPiece = nextPiece;
  nextPiece = randomPiece();
  currentPiece.x = Math.floor((COLS - currentPiece.shape[0].length) / 2);
  currentPiece.y = 0;

  if (!validPosition(currentPiece, currentPiece.x, currentPiece.y)) {
    gameState = 'gameOver';
    playSound('lose');
  }
}

function drop() {
  if (currentPiece && validPosition(currentPiece, currentPiece.x, currentPiece.y + 1)) {
    currentPiece.y++;
  } else {
    lockPiece();
  }
}

function hardDrop() {
  while (validPosition(currentPiece, currentPiece.x, currentPiece.y + 1)) {
    currentPiece.y++;
  }
  lockPiece();
}

function moveLeft() {
  if (currentPiece && validPosition(currentPiece, currentPiece.x - 1, currentPiece.y))
    currentPiece.x--;
}
function moveRight() {
  if (currentPiece && validPosition(currentPiece, currentPiece.x + 1, currentPiece.y))
    currentPiece.x++;
}

function rotatePiece() {
  if (!currentPiece) return;
  const newShape = rotate(currentPiece);
  const testPiece = {...currentPiece, shape: newShape};
  
  // Try offsets for wall kicks
  const kicks = [0, -1, 1, -2, 2];
  for (const kick of kicks) {
    if (validPosition(testPiece, currentPiece.x + kick, currentPiece.y)) {
      currentPiece.shape = newShape;
      currentPiece.x += kick;
      return;
    }
  }
}

function ghostY() {
  if (!currentPiece) return 0;
  let y = currentPiece.y;
  while (validPosition(currentPiece, currentPiece.x, y + 1)) y++;
  return y;
}

function spawnParticles() {
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: boardX + Math.random() * COLS * cellSize,
      y: boardY + (ROWS - 3) * cellSize,
      vx: (Math.random() - 0.5) * 8,
      vy: -Math.random() * 6 - 2,
      life: 1,
      color: `hsl(${Math.random() * 360}, 100%, 60%)`
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].x += particles[i].vx;
    particles[i].y += particles[i].vy;
    particles[i].vy += 0.3;
    particles[i].life -= dt * 0.8;
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  if (type === 'clear') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'win') {
    osc.type = 'sine';
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
    });
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  } else if (type === 'lose') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  } else if (type === 'move') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  } else if (type === 'lock') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  }
}

function startLevel() {
  initBoard();
  targetPattern = generateTargetPattern(level);
  currentPiece = randomPiece();
  nextPiece = randomPiece();
  lastDrop = performance.now();
  gameState = 'playing';
}

function drawCell(x, y, color, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  const px = boardX + x * cellSize;
  const py = boardY + y * cellSize;
  const pad = 2;
  ctx.fillRect(px + pad, py + pad, cellSize - pad * 2, cellSize - pad * 2);
  
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillRect(px + pad, py + pad, cellSize - pad * 2, 3);
  ctx.globalAlpha = 1;
}

function drawTargetCell(x, y, time) {
  const px = boardX + x * cellSize;
  const py = boardY + y * cellSize;
  const pulse = 0.4 + 0.3 * Math.sin(time * 0.003 + x * 0.5 + y * 0.3);
  
  ctx.strokeStyle = `rgba(255, 255, 100, ${pulse})`;
  ctx.lineWidth = 2;
  ctx.strokeRect(px + 3, py + 3, cellSize - 6, cellSize - 6);
  
  ctx.fillStyle = `rgba(255, 255, 100, ${pulse * 0.15})`;
  ctx.fillRect(px + 3, py + 3, cellSize - 6, cellSize - 6);
  
  // Diamond marker
  const cx = px + cellSize / 2;
  const cy = py + cellSize / 2;
  const s = cellSize * 0.15;
  ctx.fillStyle = `rgba(255, 255, 100, ${pulse})`;
  ctx.beginPath();
  ctx.moveTo(cx, cy - s);
  ctx.lineTo(cx + s, cy);
  ctx.lineTo(cx, cy + s);
  ctx.lineTo(cx - s, cy);
  ctx.closePath();
  ctx.fill();
}

function drawBoard(time) {
  // Background
  ctx.fillStyle = '#0d0d2b';
  ctx.fillRect(boardX, boardY, COLS * cellSize, ROWS * cellSize);
  
  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(boardX, boardY + r * cellSize);
    ctx.lineTo(boardX + COLS * cellSize, boardY + r * cellSize);
    ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(boardX + c * cellSize, boardY);
    ctx.lineTo(boardX + c * cellSize, boardY + ROWS * cellSize);
    ctx.stroke();
  }

  // Target pattern
  if (targetPattern) {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (targetPattern[r][c] && !board[r][c])
          drawTargetCell(c, r, time);
  }

  // Board cells
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c])
        drawCell(c, r, board[r][c]);
}

function drawPiece() {
  if (!currentPiece) return;
  
  // Ghost piece
  const gy = ghostY();
  ctx.globalAlpha = 0.3;
  const s = currentPiece.shape;
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c] && gy + r >= 0)
        drawCell(currentPiece.x + c, gy + r, currentPiece.color, 0.3);
  ctx.globalAlpha = 1;

  // Current piece
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c] && currentPiece.y + r >= 0)
        drawCell(currentPiece.x + c, currentPiece.y + r, currentPiece.color);
}

function drawNextPiece() {
  if (!nextPiece) return;
  const nx = boardX + COLS * cellSize + 30;
  const ny = boardY + 20;
  
  ctx.fillStyle = '#1a1a3a';
  ctx.fillRect(nx, ny, cellSize * 4, cellSize * 4);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.strokeRect(nx, ny, cellSize * 4, cellSize * 4);
  
  const s = nextPiece.shape;
  const offX = (4 - s[0].length) / 2;
  const offY = (4 - s.length) / 2;
  for (let r = 0; r < s.length; r++)
    for (let c = 0; c < s[r].length; c++)
      if (s[r][c])
        drawCell(nx + (offX + c) * cellSize, ny + (offY + r) * cellSize, nextPiece.color);
  
  ctx.fillStyle = '#888';
  ctx.font = `${Math.max(10, cellSize * 0.4)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('NEXT', nx + cellSize * 2, ny - 8);
}

function drawHUD() {
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.max(14, cellSize * 0.6)}px monospace`;
  ctx.textAlign = 'left';
  
  const hx = boardX;
  ctx.fillText(`SCORE: ${score}`, hx, boardY - 30);
  ctx.fillText(`LEVEL: ${level}`, hx, boardY - 10);
  
  // Target progress
  let total = 0, filled = 0;
  if (targetPattern) {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (targetPattern[r][c]) {
          total++;
          if (board[r] && board[r][c]) filled++;
        }
  }
  
  const barX = boardX + COLS * cellSize - 150;
  ctx.fillStyle = '#333';
  ctx.fillRect(barX, boardY - 35, 140, 20);
  ctx.fillStyle = '#ffdd44';
  ctx.fillRect(barX, boardY - 35, 140 * (filled / Math.max(1, total)), 20);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(barX, boardY - 35, 140, 20);
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.max(10, cellSize * 0.4)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(`${filled}/${total}`, barX + 70, boardY - 20);
}

function drawStartScreen() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
  
  const cx = W / 2;
  const cy = H / 2;
  
  // Title
  ctx.fillStyle = '#ffdd44';
  ctx.font = `bold ${Math.min(W * 0.08, 60)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('PUZZLE TETRIS', cx, cy - 120);
  
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(W * 0.03, 20)}px monospace`;
  const instructions = [
    'Fill all glowing target cells to clear the level!',
    '',
    '← → : Move piece',
    '↑ or X : Rotate',
    '↓ : Soft drop',
    'SPACE : Hard drop',
    'R : Restart level',
    '',
    'Complete targets without filling the board!',
    'Each level has more targets to fill.'
  ];
  instructions.forEach((line, i) => {
    ctx.fillText(line, cx, cy - 50 + i * 28);
  });
  
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.004);
  ctx.fillStyle = `rgba(255,255,255,${pulse})`;
  ctx.font = `bold ${Math.min(W * 0.035, 28)}px monospace`;
  ctx.fillText('PRESS ENTER TO START', cx, cy + 220);
}

function drawLevelComplete() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  
  const cx = W / 2;
  const cy = H / 2;
  
  ctx.fillStyle = '#44ff88';
  ctx.font = `bold ${Math.min(W * 0.06, 50)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL ${level} COMPLETE!`, cx, cy - 40);
  
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(W * 0.03, 24)}px monospace`;
  ctx.fillText(`Score: ${score}`, cx, cy + 10);
  ctx.fillText('Press ENTER for next level', cx, cy + 60);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, W, H);
  
  const cx = W / 2;
  const cy = H / 2;
  
  ctx.fillStyle = '#ff3366';
  ctx.font = `bold ${Math.min(W * 0.06, 50)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', cx, cy - 40);
  
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(W * 0.03, 24)}px monospace`;
  ctx.fillText(`Final Score: ${score}`, cx, cy + 10);
  ctx.fillText(`Reached Level: ${level}`, cx, cy + 50);
  ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.5 * Math.sin(performance.now() * 0.004)})`;
  ctx.fillText('Press ENTER to play again', cx, cy + 110);
}

function drawWin() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  
  const cx = W / 2;
  const cy = H / 2;
  
  ctx.fillStyle = '#ffdd44';
  ctx.font = `bold ${Math.min(W * 0.06, 50)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('YOU WIN!', cx, cy - 40);
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(W * 0.03, 24)}px monospace`;
  ctx.fillText(`Final Score: ${score}`, cx, cy + 10);
  ctx.fillText('Press ENTER to play again', cx, cy + 60);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
  });
  ctx.globalAlpha = 1;
}

let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;
  
  if (gameState === 'playing') {
    if (time - lastDrop > dropInterval) {
      drop();
      lastDrop = time;
    }
    updateParticles(dt);
  }
  
  // Clear
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);
  
  if (gameState === 'start') {
    drawStartScreen();
  } else {
    drawBoard(time);
    drawPiece();
    drawNextPiece();
    drawHUD();
    drawParticles();
    
    if (gameState === 'levelComplete') drawLevelComplete();
    if (gameState === 'gameOver') drawGameOver();
    if (gameState === 'win') drawWin();
  }
  
  requestAnimationFrame(gameLoop);
}

function handleKey(e) {
  // Init audio on first input
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || webkitAudioContext)(); } catch(err) {}
  }
  
  if (gameState === 'start' && e.key === 'Enter') {
    level = 1;
    score = 0;
    startLevel();
    return;
  }
  
  if (gameState === 'levelComplete' && e.key === 'Enter') {
    level++;
    if (level > 10) { gameState = 'win'; return; }
    startLevel();
    return;
  }
  
  if ((gameState === 'gameOver' || gameState === 'win') && e.key === 'Enter') {
    level = 1;
    score = 0;
    startLevel();
    return;
  }
  
  if (gameState !== 'playing') return;
  
  switch (e.key) {
    case 'ArrowLeft':
      moveLeft();
      playSound('move');
      e.preventDefault();
      break;
    case 'ArrowRight':
      moveRight();
      playSound('move');
      e.preventDefault();
      break;
    case 'ArrowDown':
      drop();
      lastDrop = performance.now();
      score += 1;
      e.preventDefault();
      break;
    case 'ArrowUp':
    case 'x':
    case 'X':
      rotatePiece();
      playSound('move');
      e.preventDefault();
      break;
    case ' ':
      hardDrop();
      score += 2;
      lastDrop = performance.now();
      e.preventDefault();
      break;
    case 'r':
    case 'R':
      startLevel();
      break;
  }
}

window.addEventListener('keydown', handleKey);

// High score persistence
try {
  const saved = localStorage.getItem('puzzleTetrisHigh');
  if (saved) window.highScore = parseInt(saved);
} catch(e) {}

function saveHighScore() {
  try {
    if (!window.highScore || score > window.highScore) {
      window.highScore = score;
      localStorage.setItem('puzzleTetrisHigh', score);
    }
  } catch(e) {}
}

// Override game over to save score
const origLockPiece = lockPiece;
lockPiece = function() {
  origLockPiece();
  if (gameState === 'gameOver') saveHighScore();
};

initBoard();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
