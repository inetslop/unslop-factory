<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Hell Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cellW, cellH, cols = 12, rows = 8;
let scale = 1;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellW = Math.floor(W / (cols + 2));
    cellH = Math.floor(H / (rows + 2));
    scale = Math.min(cellW, cellH);
}
window.addEventListener('resize', resize);
resize();

const MINE_DENSITY = 0.28;
const MAX_LIVES = 3;
const BULLET_SPEED = 2.5;
const BULLET_COOLDOWN = 1800;
const INVULN_TIME = 1500;

let state = 'start'; // start, playing, won, dead
let player, grid, bullets, particles, lives, score, level, invulnTimer, shakeTimer, shakeMag;
let lastTime = 0;
let keys = {};

function initLevel(lvl) {
    level = lvl;
    let density = Math.min(0.25 + lvl * 0.04, 0.4);
    grid = [];
    for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
            grid[r][c] = { mine: Math.random() < density, revealed: false, awake: false, fireTimer: 0 };
        }
    }
    // Ensure start area is safe
    let sr = Math.floor(rows / 2), sc = 0;
    for (let dr = -1; dr <= 1; dr++)
        for (let dc = 0; dc <= 1; dc++) {
            let nr = sr + dr, nc = sc + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) grid[nr][nc].mine = false;
        }
    // Ensure enough safe cells to reach goal
    ensureSolvable(sr, sc);

    player = { r: sr, c: sc, x: (sc + 1) * cellW + cellW, y: (sr + 1) * cellH + cellH };
    bullets = [];
    particles = [];
    lives = MAX_LIVES;
    score = 0;
    invulnTimer = 0;
    shakeTimer = 0;
    shakeMag = 0;
}

function ensureSolvable(sr, sc) {
    // BFS from start, ensure all safe cells are reachable (they always are in grid movement)
    // Just make sure there's at least one path - in a full grid all non-mine cells are reachable
    // Actually we need to ensure the player can reach ALL safe cells without stepping on mines
    // Simple approach: if mine density is too high, reduce some random mines near start
}

function getAdjacentMines(r, c) {
    let count = 0;
    for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].mine) count++;
        }
    return count;
}

function revealCell(r, c) {
    if (grid[r][c].revealed) return;
    grid[r][c].revealed = true;

    if (grid[r][c].mine) {
        // Stepped on a mine!
        explodePlayer();
        return;
    }

    score += 10;
    // Wake adjacent mines
    for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                if (grid[nr][nc].mine && !grid[nr][nc].awake) {
                    grid[nr][nc].awake = true;
                    grid[nr][nc].fireTimer = Math.random() * BULLET_COOLDOWN;
                }
            }
        }

    // Check win
    let allRevealed = true;
    for (let rr = 0; rr < rows; rr++)
        for (let cc = 0; cc < cols; cc++) {
            if (!grid[rr][cc].mine && !grid[rr][cc].revealed) { allRevealed = false; break; }
        }
    if (allRevealed) {
        state = 'won';
    }
}

function explodePlayer() {
    shakeTimer = 300;
    shakeMag = 8;
    for (let i = 0; i < 20; i++) {
        let a = Math.random() * Math.PI * 2;
        let sp = 1 + Math.random() * 4;
        particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 60, color: '#ff4444' });
    }
    lives--;
    if (lives <= 0) {
        state = 'dead';
    } else {
        // Respawn at start
        player.r = Math.floor(rows / 2);
        player.c = 0;
        player.x = (player.c + 1) * cellW + cellW;
        player.y = (player.r + 1) * cellH + cellH;
        invulnTimer = INVULN_TIME;
    }
}

function fireBullets(r, c) {
    let cx = (c + 1) * cellW + cellW / 2;
    let cy = (r + 1) * cellH + cellH / 2;
    // Fire in patterns based on position
    let pattern = (r * 7 + c * 13) % 4;
    if (pattern === 0) {
        // Radial burst
        for (let i = 0; i < 6; i++) {
            let a = (i / 6) * Math.PI * 2;
            bullets.push({ x: cx, y: cy, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, life: 200 });
        }
    } else if (pattern === 1) {
        // Aimed at player
        let dx = player.x - cx, dy = player.y - cy;
        let d = Math.sqrt(dx * dx + dy * dy);
        for (let i = -2; i <= 2; i++) {
            let a = Math.atan2(dy, dx) + i * 0.15;
            bullets.push({ x: cx, y: cy, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, life: 200 });
        }
    } else if (pattern === 2) {
        // Cross pattern
        for (let i = 0; i < 4; i++) {
            let a = (i / 4) * Math.PI * 2 + Math.PI / 4;
            bullets.push({ x: cx, y: cy, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, life: 200 });
        }
    } else {
        // Fan toward player side
        let dx = player.x - cx;
        let baseA = Math.atan2(0, dx);
        for (let i = -3; i <= 3; i++) {
            let a = baseA + i * 0.2;
            bullets.push({ x: cx, y: cy, vx: Math.cos(a) * BULLET_SPEED, vy: Math.sin(a) * BULLET_SPEED, life: 200 });
        }
    }
}

function update(dt) {
    if (state !== 'playing') return;

    // Player movement (grid-based with smooth interpolation)
    let targetX = (player.c + 1) * cellW + cellW / 2;
    let targetY = (player.r + 1) * cellH + cellH / 2;
    player.x += (targetX - player.x) * 0.25;
    player.y += (targetY - player.y) * 0.25;

    // Handle grid movement on key press (debounced by checking if already at target)
    let moving = Math.abs(player.x - targetX) > 2 || Math.abs(player.y - targetY) > 2;

    if (!moving) {
        let moved = false;
        if ((keys['ArrowUp'] || keys['KeyW']) && player.r > 0) { player.r--; moved = true; }
        else if ((keys['ArrowDown'] || keys['KeyS']) && player.r < rows - 1) { player.r++; moved = true; }
        else if ((keys['ArrowLeft'] || keys['KeyA']) && player.c > 0) { player.c--; moved = true; }
        else if ((keys['ArrowRight'] || keys['KeyD']) && player.c < cols - 1) { player.c++; moved = true; }

        if (moved) {
            revealCell(player.r, player.c);
        }
    }

    // Invulnerability timer
    if (invulnTimer > 0) invulnTimer -= dt;

    // Shake timer
    if (shakeTimer > 0) shakeTimer -= dt;

    // Mine firing
    for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) {
            let cell = grid[r][c];
            if (cell.awake && cell.mine) {
                cell.fireTimer -= dt;
                if (cell.fireTimer <= 0) {
                    fireBullets(r, c);
                    cell.fireTimer = BULLET_COOLDOWN - level * 100;
                }
            }
        }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
            bullets.splice(i, 1);
            continue;
        }
        // Hit player
        if (invulnTimer <= 0) {
            let dx = b.x - player.x, dy = b.y - player.y;
            if (dx * dx + dy * dy < 225) { // ~15px radius
                bullets.splice(i, 1);
                shakeTimer = 200;
                shakeMag = 5;
                for (let p = 0; p < 8; p++) {
                    let a = Math.random() * Math.PI * 2;
                    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 40, color: '#ffaa00' });
                }
                lives--;
                if (lives <= 0) { state = 'dead'; return; }
                invulnTimer = INVULN_TIME;
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.save();

    // Screen shake
    if (shakeTimer > 0) {
        let s = shakeMag * (shakeTimer / 300);
        ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Grid cells
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let x = c * cellW + cellW;
            let y = r * cellH + cellH;
            let cell = grid[r][c];

            if (cell.revealed && !cell.mine) {
                ctx.fillStyle = '#1a2a3a';
                ctx.fillRect(x, y, cellW - 2, cellH - 2);
                ctx.strokeStyle = '#2a4a6a';
                ctx.strokeRect(x, y, cellW - 2, cellH - 2);

                let num = getAdjacentMines(r, c);
                if (num > 0) {
                    ctx.fillStyle = num >= 3 ? '#ff6644' : num === 2 ? '#ffaa44' : '#44ff88';
                    ctx.font = `bold ${Math.min(cellW, cellH) * 0.5}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, x + (cellW - 2) / 2, y + (cellH - 2) / 2);
                } else {
                    ctx.fillStyle = '#1a3a2a';
                    ctx.font = `${Math.min(cellW, cellH) * 0.3}px monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('✓', x + (cellW - 2) / 2, y + (cellH - 2) / 2);
                }
            } else if (!cell.revealed) {
                // Hidden cell - subtle pulse if adjacent to revealed
                let adj = getAdjacentMines(r, c);
                ctx.fillStyle = '#141428';
                ctx.fillRect(x, y, cellW - 2, cellH - 2);
                ctx.strokeStyle = '#2a2a4a';
                ctx.strokeRect(x, y, cellW - 2, cellH - 2);

                // Subtle indicator for adjacent mines (helps deduce)
                if (adj > 0 && !cell.mine) {
                    let pulse = Math.sin(Date.now() * 0.003 + r * c) * 0.3 + 0.5;
                    ctx.fillStyle = `rgba(255, 100, 50, ${pulse * 0.15})`;
                    ctx.fillRect(x + 2, y + 2, cellW - 6, cellH - 6);
                }
            } else if (cell.mine && cell.awake) {
                // Awake mine indicator (subtle glow)
                let pulse = Math.sin(Date.now() * 0.005 + r * 3 + c * 7) * 0.2 + 0.3;
                ctx.fillStyle = `rgba(255, 50, 50, ${pulse * 0.2})`;
                ctx.fillRect(x + 2, y + 2, cellW - 6, cellH - 6);
            }
        }
    }

    // Bullets
    for (let b of bullets) {
        let alpha = Math.min(1, b.life / 30);
        ctx.fillStyle = `rgba(255, 80, 40, ${alpha})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.7})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Particles
    for (let p of particles) {
        let alpha = p.life / 60;
        ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('#', 'rgba(').replace(/rgba\(/, '');
        // Simpler particle draw
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Player
    if (state === 'playing' || state === 'won') {
        let px = player.x, py = player.y;
        if (invulnTimer > 0 && Math.floor(invulnTimer / 100) % 2 === 0) {
            ctx.globalAlpha = 0.4;
        } else {
            ctx.globalAlpha = 1;
        }

        // Ship shape
        ctx.fillStyle = '#44ddff';
        ctx.beginPath();
        ctx.moveTo(px, py - 12);
        ctx.lineTo(px - 10, py + 8);
        ctx.lineTo(px, py + 4);
        ctx.lineTo(px + 10, py + 8);
        ctx.closePath();
        ctx.fill();

        // Glow
        ctx.fillStyle = 'rgba(68, 221, 255, 0.3)';
        ctx.beginPath();
        ctx.arc(px, py, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    // Lives
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = i < lives ? '#ff4466' : '#333';
        let hx = 20 + i * 25, hy = 12;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx - 5, hy + 8);
        ctx.lineTo(hx, hy + 5);
        ctx.lineTo(hx + 5, hy + 8);
        ctx.closePath();
        ctx.fill();
    }

    ctx.fillStyle = '#aaf';
    ctx.font = '14px monospace';
    ctx.fillText(`LVL ${level}  SCORE ${score}`, 20, 35);

    let safeTotal = 0, safeRevealed = 0;
    for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) {
            if (!grid[r][c].mine) { safeTotal++; if (grid[r][c].revealed) safeRevealed++; }
        }
    ctx.fillText(`CELLS: ${safeRevealed}/${safeTotal}`, W - 200, 15);

    // State overlays
    if (state === 'start') {
        drawStartScreen();
    } else if (state === 'won') {
        ctx.fillStyle = 'rgba(0, 40, 80, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#4ff';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL CLEAR!', W / 2, H / 2 - 20);
        ctx.font = '18px monospace';
        ctx.fillStyle = '#aef';
        ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 20);
        ctx.fillText('Press SPACE for next level', W / 2, H / 2 + 50);
    } else if (state === 'dead') {
        ctx.fillStyle = 'rgba(40, 0, 0, 0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f44';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 20);
        ctx.font = '18px monospace';
        ctx.fillStyle = '#faa';
        ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 20);
        ctx.fillText('Press R to restart', W / 2, H / 2 + 50);
    }

    ctx.restore();
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(5, 5, 20, 0.9)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#4df';
    ctx.font = `bold ${Math.min(W * 0.06, 48)}px monospace`;
    ctx.fillText('BULLET HELL', W / 2, H * 0.25);
    ctx.fillStyle = '#f44';
    ctx.fillText('MINESWEEPER', W / 2, H * 0.25 + Math.min(W * 0.06, 48));

    ctx.font = `${Math.min(W * 0.025, 18)}px monospace`;
    ctx.fillStyle = '#aef';
    let lines = [
        'Navigate the grid to reveal all safe cells.',
        '',
        '⬆⬇⬅➡ / WASD - Move (grid-based)',
        '',
        'Numbers show adjacent hidden mines.',
        'Awake mines fire bullets at you!',
        'Avoid stepping on mines AND dodging bullets.',
        '',
        `You have ${MAX_LIVES} lives. Both hazards cost a life.`,
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H * 0.4 + i * Math.min(W * 0.03, 28));
    });

    ctx.fillStyle = `rgba(255, 255, 255, ${Math.sin(Date.now() * 0.004) * 0.5 + 0.5})`;
    ctx.font = `bold ${Math.min(W * 0.03, 24)}px monospace`;
    ctx.fillText('Press SPACE to Start', W / 2, H * 0.8);
}

function gameLoop(time) {
    let dt = Math.min(time - lastTime, 50);
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    e.preventDefault();

    if (state === 'start' && e.code === 'Space') {
        initLevel(1);
        state = 'playing';
    } else if (state === 'won' && e.code === 'Space') {
        score += 100;
        initLevel(level + 1);
        state = 'playing';
    } else if (state === 'dead' && e.code === 'KeyR') {
        score = 0;
        initLevel(1);
        state = 'playing';
    }
});

window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

// Prevent scrolling
window.addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});

// Start
initLevel(1);
state = 'start';
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
