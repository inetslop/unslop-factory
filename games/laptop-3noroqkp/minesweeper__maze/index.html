<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Minesweeper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0a0a1a;
overflow: hidden;
font-family: 'Courier New', monospace;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
width: 100vw;
}
canvas {
display: block;
image-rendering: pixelated;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, CELL, GRID_SIZE = 15;
let grid = [];
let player = { x: 0, y: 0 };
let goal = { x: GRID_SIZE - 1, y: GRID_SIZE - 1 };
let gameState = 'start'; // start, playing, won, lost
let steps = 0;
let startTime = 0;
let elapsed = 0;
let particles = [];
let shakeTime = 0;
let shakeMag = 0;
let audioCtx = null;

const COLORS = {
bg: '#0a0a1a',
wall: '#1a1a2e',
floor: '#16213e',
floorHover: '#1a2a4a',
mine: '#ff4444',
number: ['#00ff88', '#44aaff', '#ffaa00', '#ff44ff', '#ff6644', '#ffee44', '#44ffff', '#ff88cc', '#ffffff'],
player: '#00ffcc',
goal: '#ffdd00',
text: '#eeeeee',
accent: '#00ffcc'
};

function resize() {
const maxDim = Math.min(window.innerWidth, window.innerHeight) * 0.9;
W = H = Math.floor(maxDim);
canvas.width = W;
canvas.height = H;
CELL = Math.floor(W / (GRID_SIZE + 2));
}

window.addEventListener('resize', resize);
resize();

function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
}

function playSound(type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);

if (type === 'move') {
osc.type = 'sine';
osc.frequency.value = 220;
gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
osc.start();
osc.stop(audioCtx.currentTime + 0.08);
} else if (type === 'mine') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
osc.start();
osc.stop(audioCtx.currentTime + 0.5);
} else if (type === 'win') {
const notes = [262, 330, 392, 523];
notes.forEach((freq, i) => {
const o = audioCtx.createOscillator();
const g = audioCtx.createGain();
o.connect(g);
g.connect(audioCtx.destination);
o.type = 'sine';
o.frequency.value = freq;
g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.3);
o.start(audioCtx.currentTime + i * 0.12);
o.stop(audioCtx.currentTime + i * 0.12 + 0.3);
});
}
}

function generateMaze() {
// Initialize all as walls
grid = Array.from({ length: GRID_SIZE }, () =>
Array.from({ length: GRID_SIZE }, () => ({ type: 'wall', mine: false, num: 0, revealed: false }))
);

// Recursive backtracker maze generation (odd cells are passages)
const stack = [];
let cx = 0, cy = 0;
grid[cy][cx].type = 'floor';
stack.push([cx, cy]);

const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
while (stack.length > 0) {
const [px, py] = stack[stack.length - 1];
const neighbors = [];
for (const [dx, dy] of dirs) {
const nx = px + dx, ny = py + dy;
if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && grid[ny][nx].type === 'wall') {
neighbors.push([nx, ny, dx, dy]);
}
}
if (neighbors.length > 0) {
const [nx, ny, dx, dy] = neighbors[Math.floor(Math.random() * neighbors.length)];
grid[py + dy/2][px + dx/2].type = 'floor';
grid[ny][nx].type = 'floor';
stack.push([nx, ny]);
} else {
stack.pop();
}
}

// Braid the maze - remove some walls to create loops
for (let y = 0; y < GRID_SIZE; y++) {
for (let x = 0; x < GRID_SIZE; x++) {
if (grid[y][x].type === 'wall') {
const floorNeighbors = [];
for (const [dx, dy] of [[0,-1],[0,1],[-1,0],[1,0]]) {
const nx = x+dx, ny = y+dy;
if (nx>=0 && nx<GRID_SIZE && ny>=0 && ny<GRID_SIZE && grid[ny][nx].type === 'floor') {
floorNeighbors.push([nx, ny]);
}
}
if (floorNeighbors.length >= 2 && Math.random() < 0.3) {
grid[y][x].type = 'floor';
}
}
}
}

// Ensure goal is floor
grid[goal.y][goal.x].type = 'floor';
grid[0][0].type = 'floor';

// Place mines on floor cells (not start, not goal)
const floorCells = [];
for (let y = 0; y < GRID_SIZE; y++) {
for (let x = 0; x < GRID_SIZE; x++) {
if (grid[y][x].type === 'floor' && !(x===0&&y===0) && !(x===goal.x&&y===goal.y)) {
floorCells.push([x, y]);
}
}
}

const mineCount = Math.floor(floorCells.length * 0.3);
for (let i = floorCells.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[floorCells[i], floorCells[j]] = [floorCells[j], floorCells[i]];
}
for (let i = 0; i < mineCount; i++) {
grid[floorCells[i][1]][floorCells[i][0]].mine = true;
}

// Calculate numbers
for (let y = 0; y < GRID_SIZE; y++) {
for (let x = 0; x < GRID_SIZE; x++) {
if (grid[y][x].type === 'wall') continue;
let count = 0;
for (let dy = -1; dy <= 1; dy++) {
for (let dx = -1; dx <= 1; dx++) {
const nx = x+dx, ny = y+dy;
if (nx>=0 && nx<GRID_SIZE && ny>=0 && ny<GRID_SIZE) {
if (grid[ny][nx].type === 'floor' && grid[ny][nx].mine) count++;
}
}
}
grid[y][x].num = count;
}
}

player = { x: 0, y: 0 };
steps = 0;
startTime = Date.now();
particles = [];
shakeTime = 0;
}

function startGame() {
generateMaze();
gameState = 'playing';
}

function movePlayer(dx, dy) {
if (gameState !== 'playing') return;
const nx = player.x + dx;
const ny = player.y + dy;
if (nx < 0 || nx >= GRID_SIZE || ny < 0 || ny >= GRID_SIZE) return;
if (grid[ny][nx].type === 'wall') {
shakeTime = 0.1;
shakeMag = 2;
return;
}

player.x = nx;
player.y = ny;
steps++;
playSound('move');

if (grid[ny][nx].mine) {
gameState = 'lost';
shakeTime = 0.5;
shakeMag = 8;
playSound('mine');
for (let i = 0; i < 30; i++) {
particles.push({
x: nx * CELL + CELL/2,
y: ny * CELL + CELL/2,
vx: (Math.random()-0.5)*200,
vy: (Math.random()-0.5)*200,
life: 1,
color: Math.random() > 0.5 ? '#ff4444' : '#ffaa00',
size: Math.random()*6+3
});
}
return;
}

if (nx === goal.x && ny === goal.y) {
gameState = 'won';
playSound('win');
for (let i = 0; i < 40; i++) {
particles.push({
x: nx * CELL + CELL/2,
y: ny * CELL + CELL/2,
vx: (Math.random()-0.5)*300,
vy: (Math.random()-0.5)*300 - 100,
life: 1,
color: ['#ffdd00','#00ffcc','#ff44ff','#44aaff'][i%4],
size: Math.random()*8+2
});
}
}
}

function updateParticles(dt) {
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx * dt;
p.y += p.vy * dt;
p.vy += 300 * dt;
p.life -= dt * 2;
if (p.life <= 0) particles.splice(i, 1);
}
if (shakeTime > 0) shakeTime -= dt;
}

function draw() {
ctx.save();

// Screen shake
if (shakeTime > 0) {
const sx = (Math.random()-0.5) * shakeMag;
const sy = (Math.random()-0.5) * shakeMag;
ctx.translate(sx, sy);
}

// Background
ctx.fillStyle = COLORS.bg;
ctx.fillRect(-10, -10, W+20, H+20);

const offsetX = Math.floor((W - GRID_SIZE * CELL) / 2);
const offsetY = Math.floor((H - GRID_SIZE * CELL) / 2);

if (gameState === 'start') {
drawStartScreen();
} else {
drawGame(offsetX, offsetY);
if (gameState === 'won' || gameState === 'lost') {
drawEndScreen();
}
}

ctx.restore();
}

function drawStartScreen() {
const cx = W / 2;
const cy = H / 2;

// Title
ctx.fillStyle = COLORS.accent;
ctx.font = `bold ${Math.floor(W*0.06)}px 'Courier New', monospace`;
ctx.textAlign = 'center';
ctx.fillText('MAZE MINESWEEPER', cx, cy - W*0.15);

// Decorative mines
for (let i = 0; i < 8; i++) {
const angle = (i / 8) * Math.PI * 2 + Date.now() * 0.001;
const r = W * 0.22;
const mx = cx + Math.cos(angle) * r;
const my = cy + Math.sin(angle) * r;
drawMine(mx, my, CELL * 0.3);
}

// Instructions
ctx.fillStyle = COLORS.text;
ctx.font = `${Math.floor(W*0.025)}px 'Courier New', monospace`;
ctx.fillText('Navigate the maze from start to goal', cx, cy + W*0.05);
ctx.fillText('Avoid hidden mines!', cx, cy + W*0.08);
ctx.fillText('', cx, cy + W*0.12);
ctx.fillText('Numbers show adjacent mine count', cx, cy + W*0.14);

ctx.fillStyle = COLORS.accent;
ctx.font = `bold ${Math.floor(W*0.03)}px 'Courier New', monospace`;
const blink = Math.sin(Date.now() * 0.005) > 0;
if (blink) {
ctx.fillText('[ PRESS SPACE OR ENTER TO START ]', cx, cy + W*0.2);
}

// Controls
ctx.fillStyle = '#888';
ctx.font = `${Math.floor(W*0.02)}px 'Courier New', monospace`;
ctx.fillText('Controls: Arrow Keys / WASD', cx, cy + W*0.25);
ctx.fillText('R to Restart', cx, cy + W*0.27);
}

function drawGame(ox, oy) {
// Draw grid
for (let y = 0; y < GRID_SIZE; y++) {
for (let x = 0; x < GRID_SIZE; x++) {
const px = ox + x * CELL;
const py = oy + y * CELL;

if (grid[y][x].type === 'wall') {
ctx.fillStyle = COLORS.wall;
ctx.fillRect(px, py, CELL, CELL);
// Wall detail
ctx.fillStyle = '#252540';
ctx.fillRect(px+2, py+2, CELL-4, CELL-4);
} else {
// Floor
const isPlayerHere = (x === player.x && y === player.y);
ctx.fillStyle = isPlayerHere ? '#1e3a5f' : COLORS.floor;
ctx.fillRect(px, py, CELL, CELL);

// Grid lines
ctx.strokeStyle = '#1a2a4a';
ctx.lineWidth = 1;
ctx.strokeRect(px+0.5, py+0.5, CELL-1, CELL-1);

// Number
if (grid[y][x].num > 0 && !isPlayerHere) {
const color = COLORS.number[grid[y][x].num - 1] || COLORS.text;
ctx.fillStyle = color;
ctx.font = `bold ${Math.floor(CELL*0.5)}px 'Courier New', monospace`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(grid[y][x].num, px + CELL/2, py + CELL/2);
}

// Show mine if game is lost
if (gameState === 'lost' && grid[y][x].mine) {
drawMine(px + CELL/2, py + CELL/2, CELL * 0.35);
}
}
}
}

// Draw goal
const gx = ox + goal.x * CELL;
const gy = oy + goal.y * CELL;
const pulse = Math.sin(Date.now() * 0.004) * 0.2 + 0.8;
ctx.fillStyle = `rgba(255, 221, 0, ${pulse * 0.3})`;
ctx.beginPath();
ctx.arc(gx + CELL/2, gy + CELL/2, CELL*0.4, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = COLORS.goal;
ctx.font = `bold ${Math.floor(CELL*0.5)}px 'Courier New', monospace`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('\u2605', gx + CELL/2, gy + CELL/2);

// Draw start marker
const sx2 = ox;
const sy2 = oy;
ctx.fillStyle = `rgba(0, 255, 204, 0.2)`;
ctx.beginPath();
ctx.arc(sx2 + CELL/2, sy2 + CELL/2, CELL*0.3, 0, Math.PI*2);
ctx.fill();

// Draw player
const ppx = ox + player.x * CELL;
const ppy = oy + player.y * CELL;
if (gameState !== 'lost') {
// Glow
const glowPulse = Math.sin(Date.now() * 0.006) * 0.3 + 0.7;
ctx.fillStyle = `rgba(0, 255, 204, ${glowPulse * 0.3})`;
ctx.beginPath();
ctx.arc(ppx + CELL/2, ppy + CELL/2, CELL*0.45, 0, Math.PI*2);
ctx.fill();

// Player dot
ctx.fillStyle = COLORS.player;
ctx.beginPath();
ctx.arc(ppx + CELL/2, ppy + CELL/2, CELL*0.25, 0, Math.PI*2);
ctx.fill();

ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(ppx + CELL/2, ppy + CELL/2, CELL*0.1, 0, Math.PI*2);
ctx.fill();
}

// Particles
for (const p of particles) {
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
}
ctx.globalAlpha = 1;

// HUD
ctx.fillStyle = COLORS.text;
ctx.font = `${Math.floor(W*0.02)}px 'Courier New', monospace`;
ctx.textAlign = 'left';
ctx.fillText(`STEPS: ${steps}`, ox, oy - CELL*0.3);
if (gameState === 'playing') {
elapsed = Math.floor((Date.now() - startTime) / 1000);
}
ctx.textAlign = 'right';
ctx.fillText(`TIME: ${elapsed}s`, ox + GRID_SIZE * CELL, oy - CELL*0.3);
}

function drawMine(x, y, r) {
ctx.fillStyle = '#ff4444';
ctx.beginPath();
ctx.arc(x, y, r, 0, Math.PI*2);
ctx.fill();
// Spikes
for (let i = 0; i < 8; i++) {
const angle = (i / 8) * Math.PI * 2;
const sx2 = x + Math.cos(angle) * r * 0.7;
const sy2 = y + Math.sin(angle) * r * 0.7;
const ex = x + Math.cos(angle) * r * 1.3;
const ey = y + Math.sin(angle) * r * 1.3;
ctx.strokeStyle = '#ff4444';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(sx2, sy2);
ctx.lineTo(ex, ey);
ctx.stroke();
}
// Center
ctx.fillStyle = '#ffaa00';
ctx.beginPath();
ctx.arc(x, y, r*0.3, 0, Math.PI*2);
ctx.fill();
}

function drawEndScreen() {
// Overlay
ctx.fillStyle = 'rgba(10, 10, 26, 0.8)';
ctx.fillRect(0, 0, W, H);

const cx = W / 2;
const cy = H / 2;

if (gameState === 'won') {
ctx.fillStyle = COLORS.goal;
ctx.font = `bold ${Math.floor(W*0.06)}px 'Courier New', monospace`;
ctx.textAlign = 'center';
ctx.fillText('YOU WIN!', cx, cy - W*0.05);

ctx.fillStyle = COLORS.text;
ctx.font = `${Math.floor(W*0.03)}px 'Courier New', monospace`;
ctx.fillText(`Steps: ${steps}`, cx, cy + W*0.02);
ctx.fillText(`Time: ${elapsed}s`, cx, cy + W*0.05);
} else {
ctx.fillStyle = '#ff4444';
ctx.font = `bold ${Math.floor(W*0.06)}px 'Courier New', monospace`;
ctx.textAlign = 'center';
ctx.fillText('BOOM!', cx, cy - W*0.05);

ctx.fillStyle = COLORS.text;
ctx.font = `${Math.floor(W*0.03)}px 'Courier New', monospace`;
ctx.fillText(`You hit a mine!`, cx, cy + W*0.02);
ctx.fillText(`Steps: ${steps}`, cx, cy + W*0.05);
}

ctx.fillStyle = COLORS.accent;
ctx.font = `bold ${Math.floor(W*0.025)}px 'Courier New', monospace`;
const blink = Math.sin(Date.now() * 0.005) > 0;
if (blink) {
ctx.fillText('[ PRESS R TO RESTART ]', cx, cy + W*0.12);
}
}

let lastTime = 0;
function gameLoop(timestamp) {
const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
lastTime = timestamp;

updateParticles(dt);
draw();
requestAnimationFrame(gameLoop);
}

window.addEventListener('keydown', (e) => {
initAudio();

if (gameState === 'start') {
if (e.code === 'Space' || e.code === 'Enter') {
startGame();
}
return;
}

if (e.code === 'KeyR') {
startGame();
return;
}

if (gameState !== 'playing') return;

switch (e.code) {
case 'ArrowUp': case 'KeyW': movePlayer(0, -1); e.preventDefault(); break;
case 'ArrowDown': case 'KeyS': movePlayer(0, 1); e.preventDefault(); break;
case 'ArrowLeft': case 'KeyA': movePlayer(-1, 0); e.preventDefault(); break;
case 'ArrowRight': case 'KeyD': movePlayer(1, 0); e.preventDefault(); break;
}
});

// Touch controls for mobile
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
initAudio();
if (gameState === 'start') { startGame(); return; }
if (gameState !== 'playing') { if(gameState==='won'||gameState==='lost'){startGame();} return; }
touchStartX = e.touches[0].clientX;
touchStartY = e.touches[0].clientY;
});

canvas.addEventListener('touchend', (e) => {
if (gameState !== 'playing') return;
const dx = e.changedTouches[0].clientX - touchStartX;
const dy = e.changedTouches[0].clientY - touchStartY;
if (Math.abs(dx) > Math.abs(dy)) {
if (Math.abs(dx) > 20) movePlayer(Math.sign(dx), 0);
} else {
if (Math.abs(dy) > 20) movePlayer(0, Math.sign(dy));
}
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
