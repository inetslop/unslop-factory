<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, GRID, COLS, ROWS;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  GRID = Math.min(W, H) / 24;
  COLS = Math.floor(W / GRID);
  ROWS = Math.floor(H / GRID);
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let bestScore = 0;
try { bestScore = parseInt(localStorage.getItem('snakeShooterBest')) || 0; } catch(e) {}

let snake = [];
let dir = {x:1, y:0};
let nextDir = {x:1, y:0};
let bullets = [];
let enemies = [];
let particles = [];
let food = null;
let lastTime = 0;
let moveTimer = 0;
let shootCooldown = 0;
let enemySpawnTimer = 0;
let gameSpeed = 150;
let shakeTime = 0;
let shakeIntensity = 0;

function resetGame() {
  const cx = Math.floor(COLS / 2);
  const cy = Math.floor(ROWS / 2);
  snake = [{x:cx, y:cy}, {x:cx-1, y:cy}, {x:cx-2, y:cy}];
  dir = {x:1, y:0};
  nextDir = {x:1, y:0};
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  lives = 3;
  gameSpeed = 150;
  moveTimer = 0;
  shootCooldown = 0;
  enemySpawnTimer = 0;
  food = null;
  spawnFood();
  state = 'playing';
}

function spawnFood() {
  let fx, fy;
  do {
    fx = Math.floor(Math.random() * COLS);
    fy = Math.floor(Math.random() * ROWS);
  } while (snake.some(s => s.x === fx && s.y === fy));
  food = {x: fx, y: fy};
}

function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let ex, ey;
  if (side === 0) { ex = -1; ey = Math.floor(Math.random() * ROWS); }
  else if (side === 1) { ex = COLS; ey = Math.floor(Math.random() * ROWS); }
  else if (side === 2) { ex = Math.floor(Math.random() * COLS); ey = -1; }
  else { ex = Math.floor(Math.random() * COLS); ey = ROWS; }
  
  const type = Math.random() < 0.7 ? 'chaser' : (Math.random() < 0.5 ? 'wanderer' : 'dasher');
  enemies.push({x: ex, y: ey, type, hp: type === 'dasher' ? 1 : 2, speed: type === 'dasher' ? 80 : 50});
}

function shoot() {
  if (shootCooldown > 0) return;
  shootCooldown = 300;
  const head = snake[0];
  bullets.push({x: head.x, y: head.y, dx: dir.x, dy: dir.y, life: 12});
  playSound(880, 0.08, 'square', 0.1);
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x: x * GRID + GRID/2, y: y * GRID + GRID/2,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 1, color
    });
  }
}

function moveSnake() {
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  
  // Check wall collision (wrap)
  if (head.x < 0) head.x = COLS - 1;
  if (head.x >= COLS) head.x = 0;
  if (head.y < 0) head.y = ROWS - 1;
  if (head.y >= ROWS) head.y = 0;
  
  // Check self collision
  for (let s of snake) {
    if (s.x === head.x && s.y === head.y) {
      hitSnake();
      return;
    }
  }
  
  snake.unshift(head);
  
  // Check food
  if (food && head.x === food.x && head.y === food.y) {
    score += 10;
    spawnParticles(head.x, head.y, '#ffcc00', 8);
    playSound(660, 0.15, 'sine', 0.2);
    food = null;
    spawnFood();
    return; // Don't remove tail (grow)
  }
  
  snake.pop();
}

function hitSnake() {
  lives--;
  shakeTime = 300;
  shakeIntensity = 8;
  playSound(150, 0.4, 'sawtooth', 0.3);
  spawnParticles(snake[0].x, snake[0].y, '#ff4444', 15);
  
  if (lives <= 0) {
    state = 'gameover';
    if (score > bestScore) {
      bestScore = score;
      try { localStorage.setItem('snakeShooterBest', bestScore); } catch(e) {}
    }
  } else {
    // Reset snake position but keep score
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [{x:cx, y:cy}, {x:cx-1, y:cy}, {x:cx-2, y:cy}];
    dir = {x:1, y:0};
    nextDir = {x:1, y:0};
  }
}

function moveEnemies(dt) {
  for (let e of enemies) {
    if (e.type === 'chaser') {
      const head = snake[0];
      const dx = head.x - e.x;
      const dy = head.y - e.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 0) {
        e.x += (dx/dist) * (e.speed * dt / 1000);
        e.y += (dy/dist) * (e.speed * dt / 1000);
      }
    } else if (e.type === 'wanderer') {
      e.wanderTimer = (e.wanderTimer || 0) + dt;
      if (e.wanderTimer > 800) {
        e.wanderTimer = 0;
        e.wx = Math.random() * 2 - 1;
        e.wy = Math.random() * 2 - 1;
        const len = Math.sqrt(e.wx*e.wx + e.wy*e.wy) || 1;
        e.wx /= len; e.wy /= len;
      }
      e.x += (e.wx || 0) * (e.speed * dt / 1000);
      e.y += (e.wy || 0) * (e.speed * dt / 1000);
    } else if (e.type === 'dasher') {
      const head = snake[0];
      const dx = head.x - e.x;
      const dy = head.y - e.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      e.x += (dx/dist) * (e.speed * dt / 1000);
      e.y += (dy/dist) * (e.speed * dt / 1000);
    }
    
    // Remove if way off screen
    if (e.x < -3 || e.x > COLS+3 || e.y < -3 || e.y > ROWS+3) {
      enemies.splice(enemies.indexOf(e), 1);
    }
  }
}

function checkCollisions() {
  // Bullets vs enemies
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.abs(b.x - e.x) < 1 && Math.abs(b.y - e.y) < 1) {
        e.hp--;
        hit = true;
        spawnParticles(e.x, e.y, '#ff6600', 5);
        playSound(440, 0.1, 'square', 0.12);
        if (e.hp <= 0) {
          score += e.type === 'dasher' ? 5 : 15;
          spawnParticles(e.x, e.y, '#ff3333', 10);
          playSound(220, 0.2, 'sawtooth', 0.15);
          enemies.splice(j, 1);
        }
        break;
      }
    }
    if (hit) { bullets.splice(i, 1); continue; }
    
    b.x += b.dx;
    b.y += b.dy;
    b.life--;
    if (b.life <= 0 || b.x < 0 || b.x >= COLS || b.y < 0 || b.y >= ROWS) {
      bullets.splice(i, 1);
    }
  }
  
  // Enemies vs snake
  const head = snake[0];
  for (let e of enemies) {
    if (Math.abs(e.x - head.x) < 1 && Math.abs(e.y - head.y) < 1) {
      hitSnake();
      return;
    }
  }
}

function update(dt) {
  if (state !== 'playing') return;
  
  moveTimer += dt;
  shootCooldown -= dt;
  enemySpawnTimer += dt;
  shakeTime -= dt;
  
  if (moveTimer >= gameSpeed) {
    moveTimer = 0;
    moveSnake();
  }
  
  // Auto-shoot
  shoot();
  
  // Spawn enemies
  const spawnInterval = Math.max(2000 - score * 10, 600);
  if (enemySpawnTimer >= spawnInterval) {
    enemySpawnTimer = 0;
    spawnEnemy();
  }
  
  moveEnemies(dt);
  checkCollisions();
  
  // Speed up over time
  gameSpeed = Math.max(80, 150 - score * 0.3);
}

function draw() {
  ctx.save();
  
  // Screen shake
  if (shakeTime > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    ctx.translate(sx, sy);
  }
  
  // Background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(-10, -10, W + 20, H + 20);
  
  // Grid (subtle)
  ctx.strokeStyle = 'rgba(30, 40, 60, 0.5)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * GRID, 0); ctx.lineTo(x * GRID, ROWS * GRID); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * GRID); ctx.lineTo(COLS * GRID, y * GRID); ctx.stroke();
  }
  
  if (state === 'start') {
    drawStartScreen();
    ctx.restore();
    return;
  }
  
  // Food
  if (food) {
    ctx.fillStyle = '#ffcc00';
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID * 0.35, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // Bullets
  for (let b of bullets) {
    ctx.fillStyle = '#ffff44';
    ctx.shadowColor = '#ffff44';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x * GRID + GRID*0.3, b.y * GRID + GRID*0.3, GRID*0.4, GRID*0.4);
    ctx.shadowBlur = 0;
  }
  
  // Enemies
  for (let e of enemies) {
    let color, shape;
    if (e.type === 'chaser') { color = '#ff4444'; shape = 'diamond'; }
    else if (e.type === 'wanderer') { color = '#ff8800'; shape = 'circle'; }
    else { color = '#ff2200'; shape = 'triangle'; }
    
    const ex = e.x * GRID + GRID/2;
    const ey = e.y * GRID + GRID/2;
    const r = GRID * 0.4;
    
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    
    if (shape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(ex, ey - r); ctx.lineTo(ex + r, ey); ctx.lineTo(ex, ey + r); ctx.lineTo(ex - r, ey);
      ctx.closePath(); ctx.fill();
    } else if (shape === 'circle') {
      ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(ex, ey - r); ctx.lineTo(ex + r, ey + r); ctx.lineTo(ex - r, ey + r);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur = 0;
  }
  
  // Snake
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i];
    const t = i / Math.max(snake.length, 1);
    const g = Math.floor(200 - t * 100);
    ctx.fillStyle = `rgb(50, ${g}, 50)`;
    ctx.shadowColor = '#44ff44';
    ctx.shadowBlur = i === 0 ? 12 : 4;
    
    const pad = GRID * 0.08;
    ctx.fillRect(s.x * GRID + pad, s.y * GRID + pad, GRID - pad*2, GRID - pad*2);
  }
  ctx.shadowBlur = 0;
  
  // Snake head glow
  if (snake.length > 0) {
    const h = snake[0];
    ctx.fillStyle = '#aaffaa';
    ctx.fillRect(h.x * GRID + GRID*0.15, h.y * GRID + GRID*0.15, GRID*0.3, GRID*0.3);
    // Direction indicator
    ctx.fillStyle = '#ffffff';
    const hx = h.x * GRID + GRID/2;
    const hy = h.y * GRID + GRID/2;
    ctx.beginPath();
    ctx.arc(hx + dir.x * GRID*0.2, hy + dir.y * GRID*0.2, 3, 0, Math.PI*2);
    ctx.fill();
  }
  
  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    ctx.globalAlpha = 1;
  }
  
  // HUD
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score}`, 20, 30);
  ctx.fillText(`BEST: ${bestScore}`, 20, 55);
  
  // Lives as hearts
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = '#ff4444';
    ctx.font = '20px monospace';
    ctx.fillText('♥', W - 80 + i * 30, 30);
  }
  
  // Enemy count
  ctx.fillStyle = '#ff6666';
  ctx.font = '14px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`ENEMIES: ${enemies.length}`, W - 20, 55);
  
  if (state === 'gameover') {
    drawGameOver();
  }
  
  ctx.restore();
}

function drawStartScreen() {
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.min(W/8, 60)}px monospace`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#44ff44';
  ctx.shadowBlur = 20;
  ctx.fillText('SNAKE SHOOTER', W/2, H/3);
  ctx.shadowBlur = 0;
  
  ctx.font = `${Math.min(W/25, 18)}px monospace`;
  ctx.fillStyle = '#aaffaa';
  const lines = [
    'ARROWS / WASD - Move Snake',
    'AUTO-SHOOT - Bullets fire in facing direction',
    '',
    'Eat gold orbs to grow (+10 pts)',
    'Destroy enemies: Chaser(15) Wanderer(15) Dasher(5)',
    'Avoid enemies touching your snake!',
    '',
    'Best: ' + bestScore,
  ];
  lines.forEach((line, i) => {
    ctx.fillText(line, W/2, H/2 + i * 28);
  });
  
  ctx.fillStyle = '#ffff44';
  ctx.font = `bold ${Math.min(W/20, 24)}px monospace`;
  const pulse = Math.sin(Date.now() / 500) * 0.5 + 0.5;
  ctx.globalAlpha = pulse;
  ctx.fillText('PRESS ENTER TO START', W/2, H - 60);
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  
  ctx.fillStyle = '#ff4444';
  ctx.font = `bold ${Math.min(W/10, 50)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/3);
  
  ctx.fillStyle = '#ffffff';
  ctx.font = `${Math.min(W/25, 22)}px monospace`;
  ctx.fillText(`Final Score: ${score}`, W/2, H/2 - 20);
  ctx.fillText(`Best: ${bestScore}`, W/2, H/2 + 20);
  
  ctx.fillStyle = '#ffff44';
  ctx.font = `bold ${Math.min(W/25, 20)}px monospace`;
  const pulse = Math.sin(Date.now() / 500) * 0.5 + 0.5;
  ctx.globalAlpha = pulse;
  ctx.fillText('PRESS R TO RESTART', W/2, H - 80);
  ctx.globalAlpha = 1;
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt / 800;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function gameLoop(timestamp) {
  const dt = timestamp - lastTime;
  lastTime = timestamp;
  
  updateParticles(dt);
  update(dt);
  draw();
  
  requestAnimationFrame(gameLoop);
}

// Input
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  
  if (!audioCtx) initAudio();
  
  if (state === 'start' && (e.key === 'Enter' || e.key === ' ')) {
    resetGame();
    return;
  }
  
  if (state === 'gameover' && (e.key === 'r' || e.key === 'R')) {
    resetGame();
    return;
  }
  
  if (state !== 'playing') return;
  
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
    if (dir.y !== 1) nextDir = {x:0, y:-1};
  } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
    if (dir.y !== -1) nextDir = {x:0, y:1};
  } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    if (dir.x !== 1) nextDir = {x:-1, y:0};
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    if (dir.x !== -1) nextDir = {x:1, y:0};
  }
  
  e.preventDefault();
});

window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// Start loop
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
