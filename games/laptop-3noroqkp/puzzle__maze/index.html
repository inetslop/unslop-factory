<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON MAZE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0f; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Courier New', monospace;
        }
        canvas { 
            display: block; 
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playStep() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 220 + Math.random() * 40;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}
function playWin() {
    if (!audioCtx) return;
    const notes = [261.6, 329.6, 392.0, 523.3];
    notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.3);
        osc.start(audioCtx.currentTime + i * 0.12);
        osc.stop(audioCtx.currentTime + i * 0.12 + 0.3);
    });
}
function playBump() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.value = 80;
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

// Game State
const STATE = { MENU: 0, PLAYING: 1, WON: 2 };
let state = STATE.MENU;
let maze = [];
let cols, rows, cellSize;
let player = { x: 0, y: 0, px: 0, py: 0, moving: false, progress: 0, fromX: 0, fromY: 0, toX: 0, toY: 0 };
let goal = { x: 0, y: 0 };
let startTime = 0;
let elapsed = 0;
let particles = [];
let difficulty = 1; // 0=small, 1=medium, 2=large
const DIFFICULTIES = [
    { cols: 8, rows: 8, label: 'EASY' },
    { cols: 13, rows: 13, label: 'MEDIUM' },
    { cols: 21, rows: 21, label: 'HARD' }
];

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.01 + Math.random() * 0.02,
            color,
            size: 2 + Math.random() * 4
        });
    }
}

// Maze Generation (Recursive Backtracker)
function generateMaze(c, r) {
    const grid = [];
    for (let y = 0; y < r; y++) {
        grid[y] = [];
        for (let x = 0; x < c; x++) {
            grid[y][x] = { top: true, right: true, bottom: true, left: true, visited: false };
        }
    }
    const stack = [];
    let cx = 0, cy = 0;
    grid[cy][cx].visited = true;
    stack.push([cx, cy]);

    while (stack.length > 0) {
        const [x, y] = stack[stack.length - 1];
        const neighbors = [];
        if (y > 0 && !grid[y-1][x].visited) neighbors.push([x, y-1, 'top']);
        if (x < c-1 && !grid[y][x+1].visited) neighbors.push([x+1, y, 'right']);
        if (y < r-1 && !grid[y+1][x].visited) neighbors.push([x, y+1, 'bottom']);
        if (x > 0 && !grid[y][x-1].visited) neighbors.push([x-1, y, 'left']);

        if (neighbors.length === 0) {
            stack.pop();
        } else {
            const [nx, ny, dir] = neighbors[Math.floor(Math.random() * neighbors.length)];
            if (dir === 'top') { grid[y][x].top = false; grid[ny][nx].bottom = false; }
            else if (dir === 'right') { grid[y][x].right = false; grid[ny][nx].left = false; }
            else if (dir === 'bottom') { grid[y][x].bottom = false; grid[ny][nx].top = false; }
            else if (dir === 'left') { grid[y][x].left = false; grid[ny][nx].right = false; }
            grid[ny][nx].visited = true;
            stack.push([nx, ny]);
        }
    }
    return grid;
}

function startGame() {
    const diff = DIFFICULTIES[difficulty];
    cols = diff.cols;
    rows = diff.rows;
    maze = generateMaze(cols, rows);
    player.x = 0; player.y = 0;
    player.px = 0; player.py = 0;
    player.moving = false;
    player.progress = 0;
    goal.x = cols - 1; goal.y = rows - 1;
    startTime = performance.now();
    elapsed = 0;
    particles = [];
    state = STATE.PLAYING;
}

function getMazeMetrics() {
    const margin = 40;
    const availW = W - margin * 2;
    const availH = H - margin * 2 - 50;
    cellSize = Math.floor(Math.min(availW / cols, availH / rows));
    if (cellSize < 10) cellSize = 10;
    const mazeW = cellSize * cols;
    const mazeH = cellSize * rows;
    const offsetX = (W - mazeW) / 2;
    const offsetY = (H - mazeH) / 2 + 25;
    return { offsetX, offsetY };
}

function canMove(x, y, dir) {
    if (y === 0 && x === 0) return true; // start
    if (dir === 'up' && y > 0 && !maze[y][x].top) return true;
    if (dir === 'down' && y < rows - 1 && !maze[y][x].bottom) return true;
    if (dir === 'left' && x > 0 && !maze[y][x].left) return true;
    if (dir === 'right' && x < cols - 1 && !maze[y][x].right) return true;
    return false;
}

function tryMove(dir) {
    if (player.moving) return;
    let nx = player.x, ny = player.y;
    if (dir === 'up') ny--;
    else if (dir === 'down') ny++;
    else if (dir === 'left') nx--;
    else if (dir === 'right') nx++;

    if (canMove(player.x, player.y, dir)) {
        player.moving = true;
        player.progress = 0;
        player.fromX = player.x;
        player.fromY = player.y;
        player.toX = nx;
        player.toY = ny;
        playStep();
    } else {
        playBump();
    }
}

function update(dt) {
    if (state === STATE.PLAYING) {
        elapsed = performance.now() - startTime;
        if (player.moving) {
            player.progress += dt * 8; // speed
            if (player.progress >= 1) {
                player.x = player.toX;
                player.y = player.toY;
                player.moving = false;
                player.progress = 0;
                if (player.x === goal.x && player.y === goal.y) {
                    state = STATE.WON;
                    playWin();
                    const { offsetX, offsetY } = getMazeMetrics();
                    const gx = offsetX + (goal.x + 0.5) * cellSize;
                    const gy = offsetY + (goal.y + 0.5) * cellSize;
                    spawnParticles(gx, gy, '#ffd700', 40);
                    spawnParticles(gx, gy, '#ff6b35', 25);
                }
            } else {
                const t = easeOutQuad(player.progress);
                player.px = (player.fromX + (player.toX - player.fromX) * t);
                player.py = (player.fromY + (player.toY - player.fromY) * t);
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function easeOutQuad(t) { return t * (2 - t); }

function draw() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    if (state === STATE.MENU) {
        drawMenu();
    } else {
        drawGame();
    }

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawMenu() {
    const cx = W / 2;
    const cy = H / 2;

    // Title
    ctx.font = 'bold 64px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 20;
    ctx.fillText('NEON MAZE', cx, cy - 100);
    ctx.shadowBlur = 0;

    // Subtitle
    ctx.font = '20px Courier New';
    ctx.fillStyle = '#888';
    ctx.fillText('Navigate the maze to reach the golden goal', cx, cy - 50);

    // Difficulty
    ctx.font = '18px Courier New';
    const labels = ['EASY (8x8)', 'MEDIUM (13x13)', 'HARD (21x21)'];
    for (let i = 0; i < 3; i++) {
        const sel = i === difficulty;
        ctx.fillStyle = sel ? '#00ffcc' : '#555';
        if (sel) { ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 10; }
        ctx.fillText((sel ? '▶ ' : '  ') + labels[i], cx, cy + i * 35);
        ctx.shadowBlur = 0;
    }

    // Controls
    ctx.font = '16px Courier New';
    ctx.fillStyle = '#666';
    ctx.fillText('↑↓←→ / WASD : Move', cx, cy + 130);
    ctx.fillText('R : Restart   |   1/2/3 : Difficulty', cx, cy + 155);
    ctx.fillText('[ENTER] to Start', cx, cy + 200);

    // Animated border decoration
    const t = performance.now() / 1000;
    ctx.strokeStyle = `rgba(0, 255, 204, ${0.3 + 0.2 * Math.sin(t * 2)})`;
    ctx.lineWidth = 2;
    const s = 250;
    ctx.strokeRect(cx - s/2, cy - 160, s, 320);
}

function drawGame() {
    const { offsetX, offsetY } = getMazeMetrics();

    // Draw maze walls
    ctx.strokeStyle = '#00ccff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 6;

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const px = offsetX + x * cellSize;
            const py = offsetY + y * cellSize;
            const cell = maze[y][x];
            if (cell.top) drawWall(px, py, px + cellSize, py);
            if (cell.bottom) drawWall(px, py + cellSize, px + cellSize, py + cellSize);
            if (cell.left) drawWall(px, py, px, py + cellSize);
            if (cell.right) drawWall(px + cellSize, py, px + cellSize, py + cellSize);
        }
    }
    ctx.shadowBlur = 0;

    // Draw goal
    const gx = offsetX + (goal.x + 0.5) * cellSize;
    const gy = offsetY + (goal.y + 0.5) * cellSize;
    const pulse = 1 + 0.2 * Math.sin(performance.now() / 300);
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(gx, gy, cellSize * 0.25 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw player
    let ppx, ppy;
    if (player.moving) {
        ppx = offsetX + (player.px + 0.5) * cellSize;
        ppy = offsetY + (player.py + 0.5) * cellSize;
    } else {
        ppx = offsetX + (player.x + 0.5) * cellSize;
        ppy = offsetY + (player.y + 0.5) * cellSize;
    }

    ctx.fillStyle = '#00ff88';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ppx, ppy, cellSize * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Timer
    if (state === STATE.PLAYING) {
        const secs = elapsed / 1000;
        const mins = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        const ms = Math.floor((secs % 1) * 10);
        ctx.font = '18px Courier New';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#aaa';
        ctx.fillText(`TIME: ${mins}:${s.toString().padStart(2,'0')}.${ms}`, 20, 30);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#666';
        ctx.fillText('R: Restart', W - 20, 30);
    }

    if (state === STATE.WON) {
        const secs = elapsed / 1000;
        const mins = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        ctx.font = 'bold 48px Courier New';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20;
        ctx.fillText('MAZE COMPLETE!', W/2, H/2 - 40);
        ctx.shadowBlur = 0;
        ctx.font = '24px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Time: ${mins}:${s.toString().padStart(2,'0')}s`, W/2, H/2 + 10);
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#888';
        ctx.fillText('Press R to play again', W/2, H/2 + 50);
    }
}

function drawWall(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

// Input
window.addEventListener('keydown', (e) => {
    initAudio();

    if (state === STATE.MENU) {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') difficulty = 0;
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') difficulty = 2;
        if (e.key === '1') difficulty = 0;
        if (e.key === '2') difficulty = 1;
        if (e.key === '3') difficulty = 2;
        if (e.key === 'Enter' || e.key === ' ') startGame();
    }

    if (state === STATE.PLAYING || state === STATE.WON) {
        if (e.key === 'r' || e.key === 'R') { startGame(); return; }
        if (e.key === '1') { difficulty = 0; startGame(); return; }
        if (e.key === '2') { difficulty = 1; startGame(); return; }
        if (e.key === '3') { difficulty = 2; startGame(); return; }
    }

    if (state === STATE.PLAYING) {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') tryMove('up');
        else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') tryMove('down');
        else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') tryMove('left');
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') tryMove('right');
    }

    e.preventDefault();
});

// Game Loop
let lastTime = performance.now();
function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
