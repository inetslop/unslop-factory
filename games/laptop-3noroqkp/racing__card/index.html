<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Racer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type='sine', vol=0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game State
let gameState = 'start'; // start, racing, finished
let gameTime = 0;
let lastTime = 0;
let raceDistance = 5000;
let finishLineX = 0;

const CARD_TYPES = [
    { name: 'NITRO', symbol: '🚀', color: '#ff4444', desc: '+3 spd 2s', effect: 'nitro' },
    { name: 'BOOST', symbol: '💨', color: '#44aaff', desc: '+1 spd perm', effect: 'boost' },
    { name: 'SHIELD', symbol: '🛡️', color: '#ffaa00', desc: 'Block hazard', effect: 'shield' },
    { name: 'DRIFT', symbol: '🌀', color: '#aa44ff', desc: 'Dodge+spd', effect: 'drift' },
    { name: 'DRAW', symbol: '🎴', color: '#44ff88', desc: 'Draw 2 cards', effect: 'draw' },
    { name: 'REPAIR', symbol: '🔧', color: '#ffffff', desc: 'Fix slowdown', effect: 'repair' },
];

let player, aiCars, hazards, deck, hand, discard;
let drawTimer = 0;
let particles = [];
let messages = [];
let raceOver = false;
let winner = null;
let scrollX = 0;

function createDeck() {
    const d = [];
    for (let i = 0; i < 30; i++) {
        d.push(CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)]);
    }
    // Shuffle
    for (let i = d.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [d[i], d[j]] = [d[j], d[i]];
    }
    return d;
}

function initGame() {
    deck = createDeck();
    hand = [];
    discard = [];
    for (let i = 0; i < 5; i++) hand.push(deck.pop());
    
    const lanes = [0, 1, 2]; // lane indices
    player = { x: 0, speed: 80, baseSpeed: 80, bonusSpeed: 0, nitroTimer: 0, shield: false, slowTimer: 0, lane: 1, finished: false };
    
    aiCars = [
        { x: 0, speed: 75, name: 'RED', color: '#ff3333', lane: 0, finished: false, shield: false, slowTimer: 0 },
        { x: 0, speed: 78, name: 'GRN', color: '#33cc33', lane: 2, finished: false, shield: false, slowTimer: 0 },
    ];
    
    hazards = [];
    particles = [];
    messages = [];
    drawTimer = 0;
    gameTime = 0;
    raceOver = false;
    winner = null;
    scrollX = 0;
}

function playCard(index) {
    if (gameState !== 'racing' || index < 0 || index >= hand.length) return;
    const card = hand[index];
    
    switch (card.effect) {
        case 'nitro':
            player.bonusSpeed += 3;
            player.nitroTimer = 2;
            playSound(880, 0.4, 'sawtooth', 0.1);
            addMessage('NITRO! +3 speed');
            break;
        case 'boost':
            player.bonusSpeed += 1;
            playSound(660, 0.3, 'square', 0.1);
            addMessage('BOOST! +1 perm speed');
            break;
        case 'shield':
            player.shield = true;
            playSound(440, 0.3, 'sine', 0.15);
            addMessage('SHIELD up!');
            break;
        case 'drift':
            player.bonusSpeed += 2;
            player.nitroTimer = Math.max(player.nitroTimer, 1);
            playSound(550, 0.3, 'triangle', 0.12);
            addMessage('DRIFT! +2 speed');
            break;
        case 'draw':
            drawCards(2);
            playSound(770, 0.2, 'sine', 0.1);
            addMessage('Drew 2 cards!');
            break;
        case 'repair':
            player.slowTimer = 0;
            playSound(330, 0.3, 'sine', 0.15);
            addMessage('REPAIRED!');
            break;
    }
    
    discard.push(card);
    hand.splice(index, 1);
}

function drawCards(n) {
    for (let i = 0; i < n; i++) {
        if (hand.length >= 7) break;
        if (deck.length === 0) {
            if (discard.length > 0) {
                deck = shuffle(discard);
                discard = [];
            } else return;
        }
        hand.push(deck.pop());
    }
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function addMessage(text) {
    messages.push({ text, timer: 2 });
}

function spawnHazard() {
    const lane = Math.floor(Math.random() * 3);
    const type = Math.random() < 0.5 ? 'oil' : 'wall';
    hazards.push({ x: scrollX + W + 100, lane, type, hit: false });
}

function update(dt) {
    if (gameState !== 'racing') return;
    
    gameTime += dt;
    drawTimer += dt;
    
    // Auto draw every 4 seconds
    if (drawTimer >= 4 && hand.length < 7) {
        drawTimer = 0;
        drawCards(1);
    }
    
    // Update player speed
    if (player.nitroTimer > 0) {
        player.nitroTimer -= dt;
    } else {
        player.bonusSpeed = Math.max(player.bonusSpeed - dt * 0.5, 0);
        if (player.nitroTimer <= 0) player.bonusSpeed *= 0.98; // decay nitro bonus
    }
    
    let pSpeed = player.baseSpeed + player.bonusSpeed;
    if (player.slowTimer > 0) {
        pSpeed *= 0.5;
        player.slowTimer -= dt;
    }
    player.x += pSpeed * dt;
    
    // Update AI
    aiCars.forEach((ai, i) => {
        let aSpeed = ai.speed + Math.sin(gameTime * 2 + i) * 10;
        if (ai.slowTimer > 0) {
            aSpeed *= 0.5;
            ai.slowTimer -= dt;
        }
        ai.x += aSpeed * dt;
    });
    
    // Update scroll
    scrollX = player.x - W * 0.25;
    
    // Spawn hazards
    if (Math.random() < dt * 0.4) spawnHazard();
    
    // Check hazards
    hazards.forEach(h => {
        if (h.hit) return;
        const hx = h.x - scrollX;
        if (hx > 0 && hx < W) {
            // Check player collision
            const pScreenX = player.x - scrollX;
            if (Math.abs(pScreenX - hx) < 30 && h.lane === player.lane) {
                if (player.shield) {
                    player.shield = false;
                    h.hit = true;
                    addMessage('Shield blocked!');
                    playSound(200, 0.3, 'square', 0.15);
                } else {
                    h.hit = true;
                    player.slowTimer = 2;
                    addMessage('CRASHED! Slowed down!');
                    playSound(150, 0.4, 'sawtooth', 0.2);
                }
            }
            // Check AI
            aiCars.forEach(ai => {
                const aScreenX = ai.x - scrollX;
                if (Math.abs(aScreenX - hx) < 30 && h.lane === ai.lane) {
                    if (ai.shield) {
                        ai.shield = false;
                        h.hit = true;
                    } else {
                        h.hit = true;
                        ai.slowTimer = 2;
                    }
                }
            });
        }
    });
    
    // Remove off-screen hazards
    hazards = hazards.filter(h => h.x - scrollX > -100);
    
    // Particles
    particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.size *= 0.95;
    });
    particles = particles.filter(p => p.life > 0);
    
    // Messages
    messages.forEach(m => m.timer -= dt);
    messages = messages.filter(m => m.timer > 0);
    
    // Check finish
    if (!raceOver) {
        if (player.x >= raceDistance) {
            player.finished = true;
            checkWin();
        }
        aiCars.forEach(ai => {
            if (ai.x >= raceDistance) {
                ai.finished = true;
                checkWin();
            }
        });
    }
}

function checkWin() {
    if (player.finished && !raceOver) {
        raceOver = true;
        gameState = 'finished';
        winner = 'YOU WIN! 🏆';
        playSound(523, 0.5); setTimeout(() => playSound(659, 0.5), 150); setTimeout(() => playSound(784, 0.8), 300);
    } else if (aiCars.some(a => a.finished) && !player.finished && !raceOver) {
        raceOver = true;
        gameState = 'finished';
        winner = 'DEFEATED! 💀';
        playSound(200, 0.8, 'sawtooth');
    }
}

function addParticle(x, y, color) {
    particles.push({
        x, y, vx: (Math.random() - 0.5) * 100, vy: (Math.random() - 0.5) * 100 - 50,
        life: 0.8, size: 4 + Math.random() * 4, color
    });
}

// Rendering
function drawTrack() {
    const trackY = H * 0.05;
    const trackH = H * 0.42;
    
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, trackY + trackH);
    skyGrad.addColorStop(0, '#1a1a3e');
    skyGrad.addColorStop(1, '#2a2a5e');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, trackY + trackH);
    
    // Stars
    for (let i = 0; i < 30; i++) {
        const sx = ((i * 137 + 50) % W);
        const sy = (i * 73) % (trackY + trackH * 0.4);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(gameTime * 2 + i) * 0.3})`;
        ctx.fillRect(sx, sy, 2, 2);
    }
    
    // Road
    const roadTop = trackY + 20;
    const laneH = (trackH - 40) / 3;
    
    for (let l = 0; l < 3; l++) {
        ctx.fillStyle = l % 2 === 0 ? '#333344' : '#2a2a3a';
        ctx.fillRect(0, roadTop + l * laneH, W, laneH);
        
        // Lane markings
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        ctx.setLineDash([20, 15]);
        ctx.beginPath();
        const ly = roadTop + (l + 1) * laneH - (l === 2 ? 0 : 0);
        if (l < 2) {
            ctx.moveTo(0, roadTop + (l + 1) * laneH);
            ctx.lineTo(W, roadTop + (l + 1) * laneH);
        }
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    // Road edges
    ctx.fillStyle = '#ff0000';
    for (let i = 0; i < W / 20; i++) {
        const rx = ((i * 20) - (scrollX % 40));
        if (rx > -20 && rx < W) {
            ctx.fillStyle = (Math.floor(rx / 20) + Math.floor(scrollX / 20)) % 2 === 0 ? '#ff0000' : '#ffffff';
            ctx.fillRect(rx, roadTop - 5, 20, 5);
            ctx.fillRect(rx, roadTop + 3 * laneH, 20, 5);
        }
    }
    
    // Finish line
    const finX = raceDistance - scrollX;
    if (finX > -50 && finX < W + 50) {
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 10; i++) {
            for (let j = 0; j < 3; j++) {
                ctx.fillStyle = (i + j) % 2 === 0 ? '#ffffff' : '#000000';
                ctx.fillRect(finX, roadTop + j * laneH, 15, laneH / 2);
            }
        }
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('FINISH', finX - 10, roadTop - 10);
    }
    
    // Hazards
    hazards.forEach(h => {
        const hx = h.x - scrollX;
        if (hx > -50 && hx < W + 50) {
            const hy = roadTop + h.lane * laneH + laneH / 2;
            if (h.type === 'oil') {
                ctx.fillStyle = '#444';
                ctx.beginPath();
                ctx.ellipse(hx, hy, 15, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#666';
                ctx.font = '12px monospace';
                ctx.fillText('🛢', hx - 7, hy + 4);
            } else {
                ctx.fillStyle = h.hit ? '#555' : '#cc3333';
                ctx.fillRect(hx - 8, roadTop + h.lane * laneH + 10, 16, laneH - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '10px monospace';
                ctx.fillText('!', hx - 3, hy + 4);
            }
        }
    });
    
    // Cars
    drawCar(player.x - scrollX, roadTop + player.lane * laneH + laneH / 2, '#4488ff', true);
    aiCars.forEach(ai => {
        drawCar(ai.x - scrollX, roadTop + ai.lane * laneH + laneH / 2, ai.color, false);
    });
    
    // Particles
    particles.forEach(p => {
        ctx.globalAlpha = p.life / 0.8;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - scrollX, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
    
    // Distance indicator
    const progress = Math.min(player.x / raceDistance, 1);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.fillText(`${Math.floor(progress * 100)}%`, 10, roadTop + 15);
    
    // Progress bar
    ctx.fillStyle = '#333';
    ctx.fillRect(W / 2 - 100, trackY + 5, 200, 8);
    ctx.fillStyle = '#4488ff';
    ctx.fillRect(W / 2 - 100, trackY + 5, 200 * progress, 8);
    
    aiCars.forEach(ai => {
        const ap = Math.min(ai.x / raceDistance, 1);
        ctx.fillStyle = ai.color;
        ctx.fillRect(W / 2 - 100 + 200 * ap - 3, trackY + 3, 6, 8);
    });
}

function drawCar(x, y, color, isPlayer) {
    if (x < -50 || x > W + 50) return;
    
    // Car body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x - 20, y - 10, 40, 20, 5);
    ctx.fill();
    
    // Windshield
    ctx.fillStyle = '#aaddff';
    ctx.fillRect(x + 5, y - 7, 12, 8);
    
    // Wheels
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(x - 10, y + 10, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 10, y + 10, 6, 0, Math.PI * 2);
    ctx.fill();
    
    // Shield effect
    if (isPlayer && player.shield) {
        ctx.strokeStyle = 'rgba(255,200,0,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, 28, 0, Math.PI * 2);
        ctx.stroke();
    }
    
    // Speed lines for nitro
    if (isPlayer && player.bonusSpeed > 1) {
        ctx.strokeStyle = 'rgba(255,100,0,0.5)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            const lx = x - 25 - Math.random() * 15;
            ctx.beginPath();
            ctx.moveTo(lx, y - 5 + i * 5);
            ctx.lineTo(lx - 15, y - 5 + i * 5);
            ctx.stroke();
        }
    }
    
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    if (isPlayer) ctx.fillText('YOU', x, y - 15);
}

function drawCards() {
    const cardAreaY = H * 0.52;
    
    // Background
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, cardAreaY, W, H - cardAreaY);
    
    // Grid pattern
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i < W; i += 30) {
        ctx.beginPath();
        ctx.moveTo(i, cardAreaY);
        ctx.lineTo(i, H);
        ctx.stroke();
    }
    
    // Deck info
    ctx.fillStyle = '#aaa';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Deck: ${deck.length}  |  Discard: ${discard.length}`, 15, cardAreaY + 20);
    
    // Hand cards
    const numCards = hand.length;
    const cardW = Math.min(100, (W - 40) / Math.max(numCards, 1));
    const cardH = Math.min(130, H * 0.32);
    const startX = W / 2 - (numCards * (cardW + 15)) / 2;
    const cardY = cardAreaY + 40;
    
    hand.forEach((card, i) => {
        const cx = startX + i * (cardW + 15);
        
        // Card background
        ctx.fillStyle = '#1e1e3a';
        ctx.beginPath();
        ctx.roundRect(cx, cardY, cardW, cardH, 8);
        ctx.fill();
        ctx.strokeStyle = card.color;
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Card symbol
        ctx.font = `${Math.min(30, cardW * 0.3)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.fillText(card.symbol, cx + cardW / 2, cardY + cardH * 0.4);
        
        // Card name
        ctx.font = `bold ${Math.min(11, cardW * 0.12)}px monospace`;
        ctx.fillStyle = card.color;
        ctx.fillText(card.name, cx + cardW / 2, cardY + cardH * 0.6);
        
        // Card description
        ctx.font = `${Math.min(9, cardW * 0.1)}px monospace`;
        ctx.fillStyle = '#aaa';
        ctx.fillText(card.desc, cx + cardW / 2, cardY + cardH * 0.75);
        
        // Number key hint
        ctx.font = '10px monospace';
        ctx.fillStyle = '#666';
        ctx.fillText(`[${i + 1}]`, cx + cardW / 2, cardY + cardH - 8);
    });
    
    // Messages
    messages.forEach((m, i) => {
        ctx.globalAlpha = Math.min(m.timer, 1);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(m.text, W / 2, cardAreaY + 25 - i * 20);
    });
    ctx.globalAlpha = 1;
}

function drawStartScreen() {
    ctx.fillStyle = '#0d0d1a';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.min(48, W * 0.06)}px monospace`;
    ctx.fillStyle = '#ff4444';
    ctx.fillText('CARD', W / 2, H * 0.2);
    ctx.fillStyle = '#44aaff';
    ctx.fillText('RACER', W / 2, H * 0.2 + Math.min(50, W * 0.06));
    
    // Car graphic
    ctx.font = `${Math.min(60, W * 0.08)}px monospace`;
    ctx.fillText('🏎️', W / 2, H * 0.4);
    
    // Instructions
    ctx.font = `${Math.min(14, W * 0.02)}px monospace`;
    ctx.fillStyle = '#ccc';
    const lines = [
        'Race against AI drivers using strategy cards!',
        '',
        'CONTROLS:',
        'Click cards or press 1-7 to play them',
        'Cards give speed boosts, shields & more',
        'Avoid hazards on the track!',
        'First to cross the finish line WINS!',
        '',
        'You auto-draw a card every 4 seconds.',
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H * 0.5 + i * 24);
    });
    
    // Start prompt
    const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = `bold ${Math.min(20, W * 0.03)}px monospace`;
    ctx.fillStyle = '#fff';
    ctx.fillText('CLICK OR PRESS SPACE TO START', W / 2, H * 0.88);
    ctx.globalAlpha = 1;
}

function drawFinishScreen() {
    // Dim overlay
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.min(40, W * 0.05)}px monospace`;
    ctx.fillStyle = winner.includes('WIN') ? '#ffdd00' : '#ff3333';
    ctx.fillText(winner, W / 2, H * 0.3);
    
    // Results
    const results = [`YOU: ${Math.floor(player.x)}m`];
    aiCars.forEach(ai => results.push(`${ai.name}: ${Math.floor(ai.x)}m`));
    results.sort((a, b) => parseInt(b.split(':')[1]) - parseInt(a.split(':')[1]));
    
    ctx.font = `${Math.min(18, W * 0.025)}px monospace`;
    ctx.fillStyle = '#fff';
    results.forEach((r, i) => {
        const prefix = i === 0 ? '🏆 ' : i === 1 ? '🥈 ' : '🥉 ';
        ctx.fillText(prefix + r, W / 2, H * 0.45 + i * 30);
    });
    
    // Restart prompt
    const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = `bold ${Math.min(18, W * 0.025)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('Press SPACE or R to Race Again', W / 2, H * 0.75);
    ctx.globalAlpha = 1;
}

function render() {
    ctx.clearRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'racing') {
        drawTrack();
        drawCards();
    } else if (gameState === 'finished') {
        drawTrack();
        drawCards();
        drawFinishScreen();
    }
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    update(dt);
    render();
    
    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('keydown', (e) => {
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        initGame();
        gameState = 'racing';
        playSound(440, 0.2);
    } else if (gameState === 'racing') {
        const num = parseInt(e.key);
        if (num >= 1 && num <= hand.length) {
            initAudio();
            playCard(num - 1);
        }
    } else if (gameState === 'finished' && (e.code === 'Space' || e.code === 'KeyR')) {
        initGame();
        gameState = 'racing';
        playSound(440, 0.2);
    }
});

canvas.addEventListener('click', (e) => {
    if (gameState === 'start') {
        initAudio();
        initGame();
        gameState = 'racing';
        playSound(440, 0.2);
        return;
    }
    
    if (gameState === 'finished') {
        initGame();
        gameState = 'racing';
        playSound(440, 0.2);
        return;
    }
    
    if (gameState === 'racing') {
        const cardAreaY = H * 0.52;
        if (e.clientY > cardAreaY) {
            const numCards = hand.length;
            const cardW = Math.min(100, (W - 40) / Math.max(numCards, 1));
            const startX = W / 2 - (numCards * (cardW + 15)) / 2;
            
            for (let i = 0; i < numCards; i++) {
                const cx = startX + i * (cardW + 15);
                if (e.clientX >= cx && e.clientX <= cx + cardW) {
                    initAudio();
                    playCard(i);
                    break;
                }
            }
        }
    }
});

// Prevent scrolling
window.addEventListener('keydown', (e) => {
    if ([ 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight' ].includes(e.code)) {
