<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWIN DASH</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playHit() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}
function playTick() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try {
    highScore = parseInt(localStorage.getItem('twinDashHigh') || '0');
} catch(e) {}

let gameTime = 0;
let speed = 3;
let spawnTimer = 0;
let spawnInterval = 60;
let obstacles = [];
let particles = [];
let shakeTime = 0;

// Players
function createPlayer(x, y, color, controls) {
    return { x, y, size: 18, color, vx: 0, vy: 0, controls };
}

let p1, p2;
const P1_CONTROLS = { left: 'a', right: 'd', up: 'w', down: 's' };
const P2_CONTROLS = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown' };

let keys = {};
window.addEventListener('keydown', e => {
    initAudio();
    keys[e.key] = true;
    if (e.key === 'r' || e.key === 'R') {
        if (gameState === 'gameover') resetGame();
    }
    if (gameState === 'start' && (e.key === ' ' || e.key === 'Enter')) startGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function startGame() {
    initAudio();
    resetGame();
}

function resetGame() {
    const halfW = W / 2;
    p1 = createPlayer(halfW * 0.5, H - 80, '#4fc3f7', P1_CONTROLS);
    p2 = createPlayer(halfW * 1.5, H - 80, '#ff7043', P2_CONTROLS);
    obstacles = [];
    particles = [];
    score = 0;
    gameTime = 0;
    speed = 3;
    spawnTimer = 0;
    spawnInterval = 55;
    gameState = 'playing';
}

function spawnObstacle() {
    const halfW = W / 2;
    // Spawn in both lanes or randomly one lane
    const side = Math.random() < 0.3 ? (Math.random() < 0.5 ? 0 : 1) : -1; // -1 = both
    if (side === -1 || side === 0) {
        const w = 20 + Math.random() * 40;
        const x = Math.random() * (halfW - w - 20) + 10;
        obstacles.push({ x, y: -30, w, h: 20 + Math.random() * 15, lane: 0 });
    }
    if (side === -1 || side === 1) {
        const w = 20 + Math.random() * 40;
        const x = halfW + 10 + Math.random() * (halfW - w - 30);
        obstacles.push({ x, y: -30, w, h: 20 + Math.random() * 15, lane: 1 });
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 2 + Math.random() * 4;
        particles.push({
            x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
            life: 30 + Math.random() * 20, maxLife: 50, color, size: 3 + Math.random() * 4
        });
    }
}

function checkCollision(px, py, ps, ox, oy, ow, oh) {
    const pLeft = px - ps / 2, pRight = px + ps / 2;
    const pTop = py - ps / 2, pBottom = py + ps / 2;
    return pRight > ox && pLeft < ox + ow && pBottom > oy && pTop < oy + oh;
}

function update() {
    if (gameState !== 'playing') return;

    gameTime++;
    score = Math.floor(gameTime / 10);
    speed = 3 + gameTime * 0.003;
    spawnInterval = Math.max(20, 55 - gameTime * 0.01);

    // Move players
    const pSpeed = 5;
    if (keys[P1_CONTROLS.left]) p1.vx = -pSpeed; else p1.vx *= 0.8;
    if (keys[P1_CONTROLS.right]) p1.vx = pSpeed; else p1.vx *= 0.8;
    if (keys[P1_CONTROLS.up]) p1.vy = -pSpeed; else p1.vy *= 0.8;
    if (keys[P1_CONTROLS.down]) p1.vy = pSpeed; else p1.vy *= 0.8;

    if (keys[P2_CONTROLS.left]) p2.vx = -pSpeed; else p2.vx *= 0.8;
    if (keys[P2_CONTROLS.right]) p2.vx = pSpeed; else p2.vx *= 0.8;
    if (keys[P2_CONTROLS.up]) p2.vy = -pSpeed; else p2.vy *= 0.8;
    if (keys[P2_CONTROLS.down]) p2.vy = pSpeed; else p2.vy *= 0.8;

    const halfW = W / 2;
    p1.x += p1.vx; p1.y += p1.vy;
    p2.x += p2.vx; p2.y += p2.vy;

    // Clamp P1 to left half
    p1.x = Math.max(p1.size/2 + 5, Math.min(halfW - p1.size/2 - 5, p1.x));
    p1.y = Math.max(p1.size/2 + 5, Math.min(H - p1.size/2 - 5, p1.y));

    // Clamp P2 to right half
    p2.x = Math.max(halfW + p1.size/2 + 5, Math.min(W - p2.size/2 - 5, p2.x));
    p2.y = Math.max(p2.size/2 + 5, Math.min(H - p2.size/2 - 5, p2.y));

    // Spawn obstacles
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnObstacle();
    }

    // Move obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += speed;
        if (obstacles[i].y > H + 50) {
            obstacles.splice(i, 1);
            continue;
        }

        // Collision check
        const o = obstacles[i];
        if (o.lane === 0 && checkCollision(p1.x, p1.y, p1.size, o.x, o.y, o.w, o.h)) {
            gameOver();
            return;
        }
        if (o.lane === 1 && checkCollision(p2.x, p2.y, p2.size, o.x, o.y, o.w, o.h)) {
            gameOver();
            return;
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake decay
    if (shakeTime > 0) shakeTime -= 0.5;
}

function gameOver() {
    gameState = 'gameover';
    shakeTime = 20;
    playHit();
    const c1 = p1.color, c2 = p2.color;
    spawnParticles(p1.x, p1.y, c1, 25);
    spawnParticles(p2.x, p2.y, c2, 25);
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('twinDashHigh', highScore.toString()); } catch(e) {}
    }
}

function draw() {
    ctx.save();

    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeTime;
        const sy = (Math.random() - 0.5) * shakeTime;
        ctx.translate(sx, sy);
    }

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Grid lines for depth
    const gridOffset = (gameTime * speed * 0.5) % 60;
    ctx.strokeStyle = 'rgba(100, 120, 255, 0.08)';
    ctx.lineWidth = 1;
    for (let y = -60 + gridOffset; y < H + 60; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
    }

    const halfW = W / 2;

    // Divider
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(halfW, 0);
    ctx.lineTo(halfW, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // Lane labels
    ctx.font = '12px monospace';
    ctx.fillStyle = 'rgba(79,195,247,0.4)';
    ctx.fillText('P1', 15, 25);
    ctx.fillStyle = 'rgba(255,112,67,0.4)';
    ctx.fillText('P2', halfW + 15, 25);

    // Obstacles
    for (const o of obstacles) {
        const grad = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
        if (o.lane === 0) {
            grad.addColorStop(0, '#ff5252');
            grad.addColorStop(1, '#b71c1c');
        } else {
            grad.addColorStop(0, '#ffd740');
            grad.addColorStop(1, '#f57f17');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        // Glow
        ctx.shadowColor = o.lane === 0 ? '#ff5252' : '#ffd740';
        ctx.shadowBlur = 8;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.shadowBlur = 0;
    }

    // Particles
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    if (gameState === 'playing' || gameState === 'gameover') {
        // Players
        drawPlayer(p1);
        drawPlayer(p2);
    }

    ctx.restore();

    // HUD
    if (gameState === 'playing') {
        ctx.font = 'bold 20px monospace';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(score, W / 2, 35);
        ctx.textAlign = 'left';

        // Speed indicator
        ctx.font = '11px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        const spdPct = Math.min(100, Math.floor((speed - 3) / 5 * 100));
        ctx.fillText(`SPD ${spdPct}%`, W / 2 - 20, 52);
    }

    if (gameState === 'start') drawStartScreen();
    if (gameState === 'gameover') drawGameOver();
}

function drawPlayer(p) {
    const s = p.size;
    // Glow
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, s / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, s / 4, 0, Math.PI * 2);
    ctx.fill();
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(10,10,26,0.85)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('TWIN DASH', W/2, H/4);

    ctx.font = '16px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Cooperative Endless Dodger', W/2, H/4 + 35);

    // Controls
    const boxY = H/2 - 20;
    ctx.fillStyle = 'rgba(79,195,247,0.15)';
    ctx.fillRect(W/2 - 220, boxY - 25, 200, 80);
    ctx.fillStyle = '#4fc3f7';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('PLAYER 1', W/2 - 120, boxY);
    ctx.font = '13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('W A S D', W/2 - 120, boxY + 25);
    ctx.fillText('Move in left lane', W/2 - 120, boxY + 45);

    ctx.fillStyle = 'rgba(255,112,67,0.15)';
    ctx.fillRect(W/2 + 20, boxY - 25, 200, 80);
    ctx.fillStyle = '#ff7043';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('PLAYER 2', W/2 + 120, boxY);
    ctx.font = '13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText('ARROW KEYS', W/2 + 120, boxY + 25);
    ctx.fillText('Move in right lane', W/2 + 120, boxY + 45);

    // Rules
    ctx.font = '13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('Dodge the falling blocks! If EITHER player is hit, game over.', W/2, boxY + 90);
    ctx.fillText('Speed increases over time. Survive as long as you can!', W/2, boxY + 110);

    // High score
    if (highScore > 0) {
        ctx.font = '14px monospace';
        ctx.fillStyle = '#ffd740';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, boxY + 150);
    }

    // Start prompt
    const pulse = 0.5 + Math.sin(Date.now() * 0.004) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('PRESS SPACE TO START', W/2, H - 60);
    ctx.globalAlpha = 1;

    ctx.textAlign = 'left';
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(10,10,26,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 42px monospace';
    ctx.fillStyle = '#ff5252';
    ctx.fillText('GAME OVER', W/2, H/3);

    ctx.font = '24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${score}`, W/2, H/3 + 50);

    if (score >= highScore && score > 0) {
        ctx.font = '16px monospace';
        ctx.fillStyle = '#ffd740';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H/3 + 85);
    } else if (highScore > 0) {
        ctx.font = '16px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText(`Best: ${highScore}`, W/2, H/3 + 85);
    }

    const pulse = 0.5 + Math.sin(Date.now() * 0.004) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = '16px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('PRESS R TO RESTART', W/2, H - 60);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
}

let lastTime = 0;
function loop(time) {
    const dt = time - lastTime;
    lastTime = time;
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
