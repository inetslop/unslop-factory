<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Zombie</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'kill') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'type') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'start') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    }
}

// Words
const WORDS = [
    "brain","rot","zombie","undead","grave","flesh","decay","corpse",
    "spider","scream","haunt","ghost","shadow","darkness","nightmare",
    "apocalypse","infection","outbreak","plague","virus","mutation",
    "survive","escape","run","hide","fight","shoot","attack","defend",
    "protect","destroy","eliminate","terminate","annihilate","exterminate",
    "carnage","mayhem","chaos","horror","dread","terror","panic","fear",
    "skeleton","skull","bone","marrow","tendon","sinew","muscle","nerve"
];

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let zombies = [];
let particles = [];
let typedText = '';
let spawnTimer = 0;
let spawnInterval = 180;
let difficulty = 1;
let screenShake = 0;
let frameCount = 0;
let combo = 0;
let highScore = 0;

try {
    highScore = parseInt(localStorage.getItem('typingZombieHigh') || '0');
} catch(e) { highScore = 0; }

function getWord() {
    if (difficulty < 2) return WORDS[Math.floor(Math.random() * 10)];
    if (difficulty < 4) return WORDS[10 + Math.floor(Math.random() * 15)];
    if (difficulty < 6) return WORDS[25 + Math.floor(Math.random() * 15)];
    return WORDS[Math.floor(Math.random() * WORDS.length)];
}

function spawnZombie() {
    const word = getWord();
    const speed = (0.8 + difficulty * 0.3 + Math.random() * 0.5) * (W / 1200);
    const z = {
        x: W + 50,
        y: H * 0.3 + Math.random() * H * 0.4,
        speed: speed,
        word: word,
        progress: 0,
        wobble: Math.random() * Math.PI * 2,
        size: 30 + Math.random() * 15,
        alive: true,
        deathTimer: 0
    };
    zombies.push(z);
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 3,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color: color,
            size: 3 + Math.random() * 5
        });
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    zombies = [];
    particles = [];
    typedText = '';
    spawnTimer = 0;
    spawnInterval = 180;
    difficulty = 1;
    screenShake = 0;
    combo = 0;
    frameCount = 0;
}

// Input handling
window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    
    if (gameState === 'start') {
        initAudio();
        playSound('start');
        resetGame();
        gameState = 'playing';
        return;
    }
    
    if (gameState === 'gameover') {
        if (e.key === 'Enter' || e.key === ' ') {
            initAudio();
            playSound('start');
            resetGame();
            gameState = 'playing';
        }
        return;
    }
    
    if (gameState !== 'playing') return;
    
    if (e.key === 'Backspace') {
        typedText = typedText.slice(0, -1);
    } else if (e.key.length === 1 && /[a-z]/i.test(e.key)) {
        const ch = e.key.toLowerCase();
        typedText += ch;
        playSound('type');
        
        // Check matches
        for (let z of zombies) {
            if (!z.alive) continue;
            const target = z.word;
            if (typedText.length > target.length) break;
            if (target.startsWith(typedText)) {
                z.progress = typedText.length;
                if (typedText === target) {
                    killZombie(z);
                    break;
                }
            } else {
                z.progress = 0;
            }
        }
        
        // Reset progress on non-matching
        if (typedText.length > 0) {
            let anyMatch = false;
            for (let z of zombies) {
                if (!z.alive) continue;
                if (z.word.startsWith(typedText)) { anyMatch = true; break; }
            }
            if (!anyMatch && typedText.length > 0) {
                // Keep text but no progress - next wrong char will reset
            }
        }
    } else if (e.key === 'Escape') {
        typedText = '';
    }
});

window.addEventListener('keyup', () => {});

function killZombie(z) {
    z.alive = false;
    z.deathTimer = 30;
    spawnParticles(z.x, z.y, '#4a4', 12);
    spawnParticles(z.x, z.y, '#666', 8);
    typedText = '';
    
    combo++;
    const points = Math.floor((10 + z.word.length * 2) * (1 + combo * 0.1));
    score += points;
    
    playSound('kill');
}

function update() {
    if (gameState !== 'playing') return;
    
    frameCount++;
    
    // Increase difficulty
    if (frameCount % 600 === 0) difficulty++;
    spawnInterval = Math.max(80, 180 - difficulty * 15);
    
    // Spawn
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnZombie();
    }
    
    // Update zombies
    for (let z of zombies) {
        if (!z.alive) {
            z.deathTimer--;
            continue;
        }
        z.x -= z.speed;
        z.wobble += 0.1;
        
        if (z.x < 60) {
            // Hit player
            z.alive = false;
            z.deathTimer = 30;
            lives--;
            screenShake = 15;
            combo = 0;
            spawnParticles(60, z.y, '#f00', 10);
            playSound('hit');
            
            if (lives <= 0) {
                gameState = 'gameover';
                playSound('gameover');
                try {
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('typingZombieHigh', highScore);
                    }
                } catch(e) {}
            }
        }
    }
    
    // Remove dead zombies that finished animation
    zombies = zombies.filter(z => z.alive || z.deathTimer > 0);
    
    // Update particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);
    
    // Screen shake decay
    if (screenShake > 0) screenShake--;
}

function drawZombie(z) {
    const s = z.size;
    const bob = Math.sin(z.wobble) * 5;
    const x = z.x;
    const y = z.y + bob;
    
    if (!z.alive) {
        // Death animation
        const t = z.deathTimer / 30;
        ctx.globalAlpha = t;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((1 - t) * 2);
        drawZombieBody(0, 0, s, '#3a5a3a');
        ctx.restore();
        ctx.globalAlpha = 1;
        return;
    }
    
    // Body
    ctx.save();
    ctx.translate(x, y);
    
    const bodyColor = `hsl(${120 + Math.sin(z.wobble * 0.3) * 20}, 40%, ${25 + Math.sin(z.wobble) * 5}%)`;
    drawZombieBody(0, 0, s, bodyColor);
    
    ctx.restore();
    
    // Word above zombie
    const wordY = y - s - 15;
    ctx.font = `bold ${Math.max(14, Math.min(22, W/60))}px monospace`;
    ctx.textAlign = 'center';
    
    // Progress coloring
    const progressLen = z.progress || 0;
    const word = z.word;
    
    // Background for word
    const metrics = ctx.measureText(word);
    const bw = metrics.width + 12;
    const bh = Math.max(24, Math.min(32, W/50));
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x - bw/2, wordY - bh/2 - 4, bw, bh);
    
    // Typed portion (green)
    if (progressLen > 0) {
        const partial = word.substring(0, progressLen);
        const partialW = ctx.measureText(partial).width;
        ctx.fillStyle = '#4f4';
        ctx.textAlign = 'left';
        ctx.fillText(partial, x - metrics.width/2, wordY + 5);
    }
    
    // Remaining (red)
    if (progressLen < word.length) {
        const remaining = word.substring(progressLen);
        ctx.fillStyle = '#f44';
        ctx.textAlign = 'left';
        const offsetW = ctx.measureText(word.substring(0, progressLen)).width;
        ctx.fillText(remaining, x - metrics.width/2 + offsetW, wordY + 5);
    }
    
    // Full word outline if not started
    if (progressLen === 0) {
        ctx.fillStyle = '#ff6';
        ctx.textAlign = 'center';
        ctx.fillText(word, x, wordY + 5);
    }
}

function drawZombieBody(x, y, s, color) {
    // Head
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y - s * 0.6, s * 0.35, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes (glowing)
    ctx.fillStyle = '#ff0';
    ctx.fillRect(x - s * 0.15, y - s * 0.7, s * 0.1, s * 0.08);
    ctx.fillRect(x + s * 0.08, y - s * 0.7, s * 0.1, s * 0.08);
    
    // Body
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, s * 0.35, s * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Arms (reaching forward)
    ctx.strokeStyle = color;
    ctx.lineWidth = s * 0.15;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x - s * 0.3, y - s * 0.2);
    ctx.lineTo(x - s * 0.7, y - s * 0.4 + Math.sin(y.wobble || 0) * 5);
    ctx.stroke();
    
    // Legs
    ctx.beginPath();
    ctx.moveTo(x - s * 0.15, y + s * 0.4);
    ctx.lineTo(x - s * 0.2, y + s * 0.8);
    ctx.moveTo(x + s * 0.15, y + s * 0.4);
    ctx.lineTo(x + s * 0.2, y + s * 0.8);
    ctx.stroke();
}

function drawPlayer() {
    const px = 60;
    const py = H * 0.5;
    
    // Simple shooter figure
    ctx.fillStyle = '#ddd';
    ctx.beginPath();
    ctx.arc(px, py - 30, 12, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    // Body
    ctx.beginPath();
    ctx.moveTo(px, py - 18);
    ctx.lineTo(px, py + 10);
    ctx.stroke();
    // Legs
    ctx.beginPath();
    ctx.moveTo(px, py + 10);
    ctx.lineTo(px - 10, py + 35);
    ctx.moveTo(px, py + 10);
    ctx.lineTo(px + 10, py + 35);
    ctx.stroke();
    // Gun arm
    ctx.beginPath();
    ctx.moveTo(px, py - 5);
    ctx.lineTo(px + 25, py - 10);
    ctx.stroke();
    
    // Muzzle flash when killing
    if (frameCount % 10 < 3 && zombies.some(z => !z.alive && z.deathTimer > 25)) {
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc(px + 28, py - 10, 6, 0, Math.PI * 2);
        ctx.fill();
    }
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
    }
    
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a0a2e');
    grad.addColorStop(0.5, '#0d1117');
    grad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    
    // Ground
    ctx.fillStyle = '#2a2a35';
    ctx.fillRect(-20, H * 0.75, W + 40, H * 0.25 + 20);
    
    // Moon
    ctx.fillStyle = '#ffe4b5';
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.12, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0a2e';
    ctx.beginPath();
    ctx.arc(W * 0.85 - 10, H * 0.12 - 5, 26, 0, Math.PI * 2);
    ctx.fill();
    
    if (gameState === 'start') {
        // Title
        ctx.font = `bold ${Math.min(60, W/12)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#4a4';
        ctx.fillText('TYPING ZOMBIE', W/2, H * 0.3);
        
        ctx.font = `${Math.min(18, W/40)}px monospace`;
        ctx.fillStyle = '#aaa';
        ctx.fillText('Zombies are coming! Type their words to destroy them!', W/2, H * 0.42);
        ctx.fillText('', W/2, H * 0.5);
        ctx.fillStyle = '#ff6';
        ctx.fillText('CONTROLS:', W/2, H * 0.52);
        ctx.fillStyle = '#ccc';
        ctx.fillText('Type the words shown above each zombie to kill it.', W/2, H * 0.58);
        ctx.fillText('Press Escape to clear your input.', W/2, H * 0.63);
        ctx.fillText('If zombies reach you, you lose a life!', W/2, H * 0.68);
        
        if (highScore > 0) {
            ctx.fillStyle = '#ff0';
            ctx.fillText(`High Score: ${highScore}`, W/2, H * 0.75);
        }
        
        ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(Date.now()/500) * 0.5})`;
        ctx.fillText('Press any key to start', W/2, H * 0.85);
        
    } else {
        // Draw player
        drawPlayer();
        
        // Draw zombies (sorted by x for layering)
        const sorted = [...zombies].sort((a,b) => b.x - a.x);
        for (let z of sorted) drawZombie(z);
        
        // Particles
        for (let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size * p.life, p.size * p.life);
        }
        ctx.globalAlpha = 1;
        
        // HUD
        ctx.font = `bold ${Math.min(24, W/30)}px monospace`;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Score: ${score}`, 20, 35);
        ctx.fillText(`Combo: x${combo}`, 20, 65);
        
        // Lives
        for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#f44';
            ctx.font = `${Math.min(24, W/30)}px monospace`;
            ctx.fillText('♥', W - 80 + i * 30, 35);
        }
        
        // Typed text display
        if (typedText.length > 0) {
            ctx.font = `bold ${Math.min(28, W/35)}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#4f4';
            ctx.fillText(typedText, W/2, H - 30);
        } else {
            ctx.font = `${Math.min(16, W/50)}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillStyle = `rgba(150,150,150,${0.4 + Math.sin(Date.now()/800)*0.3})`;
            ctx.fillText('Type the words to kill the zombies...', W/2, H - 30);
        }
        
        // Game over
        if (gameState === 'gameover') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);
            
            ctx.font = `bold ${Math.min(50, W/10)}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#f44';
            ctx.fillText('GAME OVER', W/2, H * 0.35);
            
            ctx.font = `${Math.min(24, W/30)}px monospace`;
            ctx.fillStyle = '#fff';
            ctx.fillText(`Final Score: ${score}`, W/2, H * 0.48);
            
            if (score >= highScore && score > 0) {
                ctx.fillStyle = '#ff0';
                ctx.fillText('NEW HIGH SCORE!', W/2, H * 0.55);
            } else {
                ctx.fillStyle = '#aaa';
                ctx.fillText(`High Score: ${highScore}`, W/2, H * 0.55);
            }
            
            ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(Date.now()/500)*0.5})`;
            ctx.fillText('Press Enter to play again', W/2, H * 0.7);
        }
    }
    
    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
