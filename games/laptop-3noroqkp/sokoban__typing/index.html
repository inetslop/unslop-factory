<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Sokoban</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 10px;
}
h1 {
  font-size: clamp(1.2rem, 3vw, 2rem);
  text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
  letter-spacing: 4px;
  text-align: center;
}
#start-screen, #game-screen, #win-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#start-screen.active, #game-screen.active, #win-screen.active {
  display: flex;
}
.info {
  font-size: clamp(0.8rem, 1.5vw, 1rem);
  text-align: center;
  line-height: 1.6;
  color: #88ffcc;
  max-width: 500px;
}
button {
  background: #0a0a0f;
  border: 2px solid #00ff88;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  font-size: clamp(0.9rem, 1.5vw, 1.1rem);
  padding: 10px 30px;
  cursor: pointer;
  text-shadow: 0 0 5px #00ff88;
  transition: all 0.2s;
}
button:hover {
  background: #00ff88;
  color: #0a0a0f;
  box-shadow: 0 0 20px #00ff88;
}
#grid-container {
  display: grid;
  gap: 2px;
  padding: 4px;
  background: #111;
  border: 2px solid #333;
  border-radius: 4px;
}
.cell {
  width: clamp(28px, 5vw, 48px);
  height: clamp(28px, 5vw, 48px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1rem, 2.5vw, 1.6rem);
  border-radius: 3px;
}
.cell.wall { background: #2a2a3a; box-shadow: inset 0 0 5px #000; }
.cell.floor { background: #14141e; }
.cell.target { background: #1a1a2e; color: #ffaa00; text-shadow: 0 0 8px #ffaa00; }
.cell.box { background: #3a2a1a; color: #ffcc44; text-shadow: 0 0 6px #ffcc44; font-weight: bold; }
.cell.box-target { background: #1a3a1a; color: #00ff88; text-shadow: 0 0 8px #00ff88; font-weight: bold; }
.cell.player { background: #1a2a4a; color: #44aaff; text-shadow: 0 0 8px #44aaff; font-weight: bold; }
#input-area {
  display: flex;
  align-items: center;
  gap: 8px;
}
#input-area label {
  color: #88ffcc;
  font-size: clamp(0.8rem, 1.5vw, 1rem);
}
#cmd-input {
  background: #111;
  border: 2px solid #00ff88;
  color: #00ff88;
  font-family: 'Courier New', monospace;
  font-size: clamp(0.9rem, 1.5vw, 1.1rem);
  padding: 8px 16px;
  width: clamp(140px, 20vw, 200px);
  outline: none;
  text-transform: uppercase;
  border-radius: 3px;
}
#cmd-input:focus { box-shadow: 0 0 10px #00ff88; }
#status-bar {
  display: flex;
  gap: 20px;
  font-size: clamp(0.75rem, 1.3vw, 0.95rem);
  color: #88ffcc;
}
#hint {
  min-height: 1.4em;
  font-size: clamp(0.7rem, 1.2vw, 0.9rem);
  color: #ff6666;
  text-align: center;
}
.level-complete-flash {
  animation: flash 0.5s ease-in-out;
}
@keyframes flash {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
#particles {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
}
</style>
</head>
<body>
<div id="particles"></div>
<div id="game-container">

  <div id="start-screen" class="active">
    <h1>TYPING SOKOBAN</h1>
    <div class="info">
      Push all boxes onto the target stars to clear each level.<br>
      Type commands to move: <b>NORTH</b>, <b>SOUTH</b>, <b>EAST</b>, <b>WEST</b><br>
      Press <b>ENTER</b> after each command. You can also use single letters:<br>
      <b>N</b>, <b>S</b>, <b>E</b>, <b>W</b>
    </div>
    <button id="btn-start">START GAME</button>
  </div>

  <div id="game-screen">
    <h1>TYPING SOKOBAN</h1>
    <div id="status-bar">
      <span id="level-display">LEVEL 1/5</span>
      <span id="moves-display">MOVES: 0</span>
    </div>
    <div id="grid-container"></div>
    <div id="input-area">
      <label>&gt;</label>
      <input type="text" id="cmd-input" autocomplete="off" spellcheck="false">
    </div>
    <div id="hint"></div>
  </div>

  <div id="win-screen">
    <h1>CONGRATULATIONS!</h1>
    <div class="info" id="final-stats"></div>
    <button id="btn-restart">PLAY AGAIN</button>
  </div>

</div>

<script>
(function(){
  const LEVELS = [
    // Level 1: Push right x2
    ["#######",
     "#     #",
     "# @$* #",
     "#     #",
     "#######"],
    // Level 2: Push up x1
    ["#######",
     "# *   #",
     "# $   #",
     "# @   #",
     "#######"],
    // Level 3: Push right (two separate boxes)
    ["########",
     "#     #",
     "# @$* #",
     "#   $ #",
     "# *   #",
     "#     #",
     "########"],
    // Level 4: Two boxes push up
    ["########",
     "# * * #",
     "# $ $ #",
     "# @   #",
     "#     #",
     "########"],
    // Level 5: Mixed pushes
    ["#########",
     "#       #",
     "#  $  * #",
     "#  @    #",
     "#  $  * #",
     "#       #",
     "#########"]
  ];

  let currentLevel = 0;
  let totalMoves = 0;
  let grid = [];
  let playerPos = {r:0,c:0};
  let boxes = [];
  let targets = [];
  let levelSolved = false;
  let audioCtx = null;

  const gridEl = document.getElementById('grid-container');
  const inputEl = document.getElementById('cmd-input');
  const hintEl = document.getElementById('hint');
  const levelDisp = document.getElementById('level-display');
  const movesDisp = document.getElementById('moves-display');

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playTone(freq, dur, type='sine', vol=0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }

  function sfxMove() { playTone(300, 0.08, 'square', 0.1); }
  function sfxPush() { playTone(200, 0.12, 'triangle', 0.15); }
  function sfxWall() { playTone(100, 0.15, 'sawtooth', 0.1); }
  function sfxLevelUp() {
    playTone(440, 0.15, 'sine', 0.2);
    setTimeout(()=>playTone(550, 0.15, 'sine', 0.2), 150);
    setTimeout(()=>playTone(660, 0.2, 'sine', 0.2), 300);
  }
  function sfxWin() {
    [440,550,660,880].forEach((f,i)=>setTimeout(()=>playTone(f,0.3,'sine',0.2), i*200));
  }

  function loadLevel(idx) {
    const raw = LEVELS[idx];
    grid = [];
    boxes = [];
    targets = [];
    for (let r = 0; r < raw.length; r++) {
      grid[r] = [];
      for (let c = 0; c < raw[r].length; c++) {
        const ch = raw[r][c];
        if (ch === '@' || ch === '+') { playerPos = {r, c}; grid[r][c] = '.'; }
        else if (ch === '$' || ch === '%') { boxes.push({r, c}); grid[r][c] = '.'; }
        else if (ch === '*') { targets.push({r, c}); grid[r][c] = '.'; }
        else if (ch === '#') { grid[r][c] = '#'; }
        else { grid[r][c] = '.'; }
      }
    }
    levelSolved = false;
    renderGrid();
  }

  function isBoxAt(r, c) {
    return boxes.some(b => b.r === r && b.c === c);
  }

  function isTargetAt(r, c) {
    return targets.some(t => t.r === r && t.c === c);
  }

  function renderGrid() {
    const rows = grid.length;
    const cols = grid[0].length;
    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.innerHTML = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (grid[r][c] === '#') {
          cell.classList.add('wall');
        } else {
          cell.classList.add('floor');
          if (isTargetAt(r,c) && isBoxAt(r,c)) {
            cell.classList.remove('floor');
            cell.classList.add('box-target');
            cell.textContent = '★';
          } else if (isTargetAt(r,c)) {
            cell.classList.remove('floor');
            cell.classList.add('target');
            cell.textContent = '★';
          } else if (isBoxAt(r,c)) {
            cell.classList.remove('floor');
            cell.classList.add('box');
            cell.textContent = '■';
          }
        }
        if (playerPos.r === r && playerPos.c === c) {
          cell.className = 'cell player';
          cell.textContent = '◆';
        }
        gridEl.appendChild(cell);
      }
    }
  }

  function tryMove(dr, dc) {
    if (levelSolved) return;
    const nr = playerPos.r + dr;
    const nc = playerPos.c + dc;
    if (nr < 0 || nr >= grid.length || nc < 0 || nc >= grid[0].length) return;
    if (grid[nr][nc] === '#') { sfxWall(); showHint('BUMP!'); return; }

    if (isBoxAt(nr, nc)) {
      const br = nr + dr;
      const bc = nc + dc;
      if (br < 0 || br >= grid.length || bc < 0 || bc >= grid[0].length) { sfxWall(); showHint('BLOCKED!'); return; }
      if (grid[br][bc] === '#') { sfxWall(); showHint('BLOCKED!'); return; }
      if (isBoxAt(br, bc)) { sfxWall(); showHint('BOXES CAN\'T STACK!'); return; }
      // Push box
      const box = boxes.find(b => b.r === nr && b.c === nc);
      box.r = br;
      box.c = bc;
      playerPos = {r: nr, c: nc};
      sfxPush();
    } else {
      playerPos = {r: nr, c: nc};
      sfxMove();
    }

    totalMoves++;
    movesDisp.textContent = 'MOVES: ' + totalMoves;
    renderGrid();
    checkWin();
  }

  function checkWin() {
    if (boxes.every(b => isTargetAt(b.r, b.c))) {
      levelSolved = true;
      sfxLevelUp();
      showHint('✓ LEVEL COMPLETE!');
      gridEl.classList.add('level-complete-flash');
      setTimeout(() => {
        gridEl.classList.remove('level-complete-flash');
        currentLevel++;
        if (currentLevel >= LEVELS.length) {
          showWinScreen();
        } else {
          loadLevel(currentLevel);
          levelDisp.textContent = `LEVEL ${currentLevel+1}/${LEVELS.length}`;
          hintEl.textContent = '';
        }
      }, 1200);
    }
  }

  function showHint(msg) {
    hintEl.textContent = msg;
    setTimeout(() => { if (hintEl.textContent === msg) hintEl.textContent = ''; }, 1500);
  }

  function processCommand(cmd) {
    const c = cmd.trim().toUpperCase();
    let dr = 0, dc = 0;
    if (c === 'NORTH' || c === 'N') { dr = -1; }
    else if (c === 'SOUTH' || c === 'S') { dr = 1; }
    else if (c === 'EAST' || c === 'E') { dc = 1; }
    else if (c === 'WEST' || c === 'W') { dc = -1; }
    else { showHint('INVALID COMMAND'); return; }
    tryMove(dr, dc);
  }

  function showWinScreen() {
    document.getElementById('game-screen').classList.remove('active');
    document.getElementById('win-screen').classList.add('active');
    document.getElementById('final-stats').textContent = `All levels cleared in ${totalMoves} moves!`;
    sfxWin();
  }

  function startGame() {
    initAudio();
    currentLevel = 0;
    totalMoves = 0;
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('game-screen').classList.add('active');
    levelDisp.textContent = `LEVEL 1/${LEVELS.length}`;
    movesDisp.textContent = 'MOVES: 0';
    loadLevel(0);
    inputEl.value = '';
    inputEl.focus();
  }

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-restart').addEventListener('click', startGame);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      processCommand(inputEl.value);
      inputEl.value = '';
    }
  });

  // Allow single letter shortcuts without Enter
  window.addEventListener('keydown', (e) => {
    const gameActive = document.getElementById('game-screen').classList.contains('active');
    if (!gameActive || levelSolved) return;
    if (document.activeElement === inputEl && e.key.length === 1) {
      // Let the input handle it normally, but also allow single-key shortcuts
    }
  });

  // Handle resize
  window.addEventListener('resize', () => { renderGrid(); });

})();
</script>
</body>
</html>
