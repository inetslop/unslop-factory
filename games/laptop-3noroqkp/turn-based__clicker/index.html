<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Quest</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
#game-container {
width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
}
.screen {
position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
.screen.hidden { display: none; }
h1 { color: #e94560; font-size: clamp(2rem, 5vw, 3.5rem); text-shadow: 0 0 20px rgba(233,69,96,0.5); margin-bottom: 20px; }
.subtitle { color: #a8d8ea; font-size: clamp(0.9rem, 2vw, 1.2rem); margin-bottom: 30px; text-align: center; max-width: 500px; line-height: 1.6; }
.btn {
background: linear-gradient(135deg, #e94560, #c73650); color: white; border: none; padding: 12px 30px;
font-size: clamp(1rem, 2vw, 1.3rem); border-radius: 8px; cursor: pointer; transition: all 0.2s;
box-shadow: 0 4px 15px rgba(233,69,96,0.4); font-weight: bold;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.6); }
.btn:active { transform: translateY(0); }
#battle-ui { display: none; width: 100%; max-width: 700px; padding: 10px; }
.battle-area {
display: flex; justify-content: space-between; align-items: flex-end; width: 100%; min-height: 200px; padding: 20px;
}
.fighter { text-align: center; flex: 1; }
.fighter-sprite { font-size: clamp(3rem, 8vw, 5rem); animation: idle 2s ease-in-out infinite; display: block; margin-bottom: 10px; }
@keyframes idle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes attack-anim { 0%{transform:translateX(0)} 30%{transform:translateX(20px) scale(1.1)} 60%{transform:translateX(20px) scale(1.1)} 100%{transform:translateX(0)} }
@keyframes hit-anim { 0%{transform:translateX(0);filter:brightness(1)} 30%{transform:translateX(-10px);filter:brightness(2)} 60%{transform:translateX(-10px);filter:brightness(2)} 100%{transform:translateX(0);filter:brightness(1)} }
@keyframes heal-anim { 0%{transform:scale(1)} 50%{transform:scale(1.2);filter:brightness(1.5)} 100%{transform:scale(1)} }
.fighter-name { color: #fff; font-size: clamp(0.8rem, 1.5vw, 1rem); margin-bottom: 5px; }
.hp-bar-container { width: 90%; max-width: 160px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 5px auto; position: relative; }
.hp-bar { height: 100%; transition: width 0.4s ease; border-radius: 10px; }
.player-hp { background: linear-gradient(90deg, #2ecc71, #27ae60); }
.enemy-hp { background: linear-gradient(90deg, #e74c3c, #c0392b); }
.hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.75rem; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.meter-container { width: 90%; max-width: 160px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin: 5px auto; }
.meter-bar { height: 100%; transition: width 0.4s ease; border-radius: 6px; background: linear-gradient(90deg, #f39c12, #e67e22); }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; width: 100%; padding: 15px; margin-top: 10px; }
.action-btn {
background: linear-gradient(135deg, #2c3e50, #34495e); color: #ecf0f1; border: 2px solid #4a6580; padding: 12px 8px;
font-size: clamp(0.75rem, 1.2vw, 0.95rem); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: bold;
}
.action-btn:hover:not(:disabled) { background: linear-gradient(135deg, #34495e, #4a6580); border-color: #6db3f2; transform: translateY(-2px); }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.action-btn .key-hint { display: block; font-size: 0.7em; color: #8899aa; margin-top: 3px; }
#log { width: 100%; max-width: 700px; height: 60px; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px; margin-top: 5px; font-size: clamp(0.7rem, 1.2vw, 0.85rem); color: #a8d8ea; }
#log p { margin: 2px 0; }
#log .dmg { color: #e94560; }
#log .heal-msg { color: #2ecc71; }
#log .info { color: #f39c12; }
.stats-bar { display: flex; justify-content: space-between; width: 100%; max-width: 700px; padding: 5px 15px; color: #a8d8ea; font-size: clamp(0.7rem, 1.2vw, 0.9rem); }
.damage-popup {
position: absolute; font-size: 1.5rem; font-weight: bold; pointer-events: none; animation: float-up 1s ease forwards; z-index: 100;
}
@keyframes float-up { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-40px)} }
.gameover-score { color: #f39c12; font-size: clamp(1.2rem, 3vw, 1.8rem); margin: 15px 0; }
.wave-banner { color: #6db3f2; font-size: clamp(1rem, 2.5vw, 1.5rem); text-align: center; padding: 5px; min-height: 30px; }
.shake { animation: shake 0.3s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
</style>
</head>
<body>
<div id="game-container">
<div id="start-screen" class="screen">
<h1>⚔️ Click Quest</h1>
<p class="subtitle">A turn-based clicker RPG! Battle waves of enemies using your actions. Click buttons or press keys to act.</p>
<button class="btn" id="start-btn">Start Adventure</button>
<p class="subtitle" style="margin-top:20px;font-size:0.8em">Controls: [1] Attack | [2] Special | [3] Defend | [4] Heal</p>
</div>

<div id="gameover-screen" class="screen hidden">
<h1>💀 Game Over</h1>
<p class="gameover-score">Score: <span id="final-score">0</span></p>
<p class="subtitle" id="death-msg"></p>
<button class="btn" id="restart-btn">Restart</button>
</div>

<div id="battle-ui">
<div class="stats-bar">
<span>Wave: <span id="wave-display">1</span></span>
<span>Score: <span id="score-display">0</span></span>
<span>Turn: <span id="turn-display">1</span></span>
</div>
<div class="wave-banner" id="wave-banner"></div>
<div class="battle-area" id="battle-area">
<div class="fighter" id="player-fighter">
<span class="fighter-sprite" id="player-sprite">🧙</span>
<div class="fighter-name">Hero</div>
<div class="hp-bar-container"><div class="hp-bar player-hp" id="player-hp-bar"></div><div class="hp-text" id="player-hp-text"></div></div>
<div class="meter-container" style="margin:5px auto"><div class="meter-bar" id="meter-bar"></div></div>
</div>
<div class="fighter" id="enemy-fighter">
<span class="fighter-sprite" id="enemy-sprite">👹</span>
<div class="fighter-name" id="enemy-name">Slime</div>
<div class="hp-bar-container"><div class="hp-bar enemy-hp" id="enemy-hp-bar"></div><div class="hp-text" id="enemy-hp-text"></div></div>
</div>
</div>
<div class="actions" id="actions">
<button class="action-btn" id="btn-attack">⚔️ Attack<span class="key-hint">[1]</span></button>
<button class="action-btn" id="btn-special">✨ Special<span class="key-hint">[2] (needs 50)</span></button>
<button class="action-btn" id="btn-defend">🛡️ Defend<span class="key-hint">[3]</span></button>
<button class="action-btn" id="btn-heal">💚 Heal<span class="key-hint">[4] (costs 20)</span></button>
</div>
<div id="log"></div>
</div>
</div>

<script>
(function(){
const container = document.getElementById('game-container');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const battleUI = document.getElementById('battle-ui');
const logEl = document.getElementById('log');
const playerHpBar = document.getElementById('player-hp-bar');
const playerHpText = document.getElementById('player-hp-text');
const enemyHpBar = document.getElementById('enemy-hp-bar');
const enemyHpText = document.getElementById('enemy-hp-text');
const meterBar = document.getElementById('meter-bar');
const waveDisplay = document.getElementById('wave-display');
const scoreDisplay = document.getElementById('score-display');
const turnDisplay = document.getElementById('turn-display');
const finalScore = document.getElementById('final-score');
const deathMsg = document.getElementById('death-msg');
const waveBanner = document.getElementById('wave-banner');
const playerSprite = document.getElementById('player-sprite');
const enemySprite = document.getElementById('enemy-sprite');
const enemyNameEl = document.getElementById('enemy-name');
const btnAttack = document.getElementById('btn-attack');
const btnSpecial = document.getElementById('btn-special');
const btnDefend = document.getElementById('btn-defend');
const btnHeal = document.getElementById('btn-heal');

let audioCtx = null;
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }

function playTone(freq, dur, type, vol){
if(!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type||'square';
osc.frequency.value = freq;
gain.gain.setValueAtTime(vol||0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
osc.connect(gain).connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime+dur);
}

function sfxAttack(){ playTone(200,0.1,'sawtooth',0.2); setTimeout(()=>playTone(150,0.1,'sawtooth',0.15),50); }
function sfxSpecial(){ playTone(400,0.2,'square',0.2); setTimeout(()=>playTone(600,0.15,'square',0.15),80); setTimeout(()=>playTone(800,0.1,'square',0.1),160); }
function sfxDefend(){ playTone(300,0.3,'sine',0.2); }
function sfxHeal(){ playTone(500,0.15,'sine',0.15); setTimeout(()=>playTone(700,0.15,'sine',0.1),100); }
function sfxHit(){ playTone(100,0.2,'sawtooth',0.25); }
function sfxEnemyDie(){ playTone(300,0.1,'square',0.15); setTimeout(()=>playTone(200,0.2,'square',0.1),100); }
function sfxGameOver(){ playTone(200,0.4,'sawtooth',0.3); setTimeout(()=>playTone(150,0.5,'sawtooth',0.2),200); }
function sfxWave(){ playTone(400,0.1,'sine',0.15); setTimeout(()=>playTone(500,0.1,'sine',0.15),100); setTimeout(()=>playTone(600,0.15,'sine',0.15),200); }

const enemies = [
{name:'Slime', sprite:'🟢', hp:30, atk:5, def:1},
{name:'Goblin', sprite:'👺', hp:45, atk:8, def:2},
{name:'Skeleton', sprite:'💀', hp:60, atk:10, def:3},
{name:'Orc', sprite:'👹', hp:80, atk:14, def:4},
{name:'Dragon', sprite:'🐉', hp:120, atk:18, def:5},
{name:'Lich', sprite:'☠️', hp:100, atk:22, def:3},
{name:'Golem', sprite:'🗿', hp:150, atk:16, def:7},
{name:'Demon Lord', sprite:'😈', hp:180, atk:25, def:6},
{name:'Void King', sprite:'🌑', hp:250, atk:30, def:8},
];

let state = {};
function resetState(){
state = { playerHp:100, playerMaxHp:100, meter:0, maxMeter:100, score:0, wave:1, turn:1, defending:false, enemy:null, busy:false, gameOver:false };
}

function spawnEnemy(){
const idx = Math.min(state.wave-1, enemies.length-1);
const base = enemies[idx];
const scale = 1 + (state.wave-1)*0.3;
state.enemy = { name:base.name, sprite:base.sprite, hp:Math.floor(base.hp*scale), maxHp:Math.floor(base.hp*scale), atk:Math.floor(base.atk*scale), def:base.def };
enemyNameEl.textContent = base.name;
enemySprite.textContent = base.sprite;
waveBanner.textContent = `— Wave ${state.wave}: ${base.name} —`;
updateUI();
}

function updateUI(){
const phpPct = Math.max(0,(state.playerHp/state.playerMaxHp)*100);
playerHpBar.style.width = phpPct+'%';
playerHpText.textContent = `${Math.max(0,Math.ceil(state.playerHp))}/${state.playerMaxHp}`;
const ehpPct = state.enemy ? Math.max(0,(state.enemy.hp/state.enemy.maxHp)*100) : 0;
enemyHpBar.style.width = ehpPct+'%';
enemyHpText.textContent = state.enemy ? `${Math.max(0,Math.ceil(state.enemy.hp))}/${state.enemy.maxHp}` : '—/—';
meterBar.style.width = (state.meter/state.maxMeter)*100+'%';
waveDisplay.textContent = state.wave;
scoreDisplay.textContent = state.score;
turnDisplay.textContent = state.turn;
btnSpecial.disabled = state.meter < 50 || state.busy || state.gameOver;
btnHeal.disabled = state.meter < 20 || state.busy || state.gameOver;
}

function addLog(msg, cls){
const p = document.createElement('p');
if(cls) p.className = cls;
p.textContent = msg;
logEl.appendChild(p);
logEl.scrollTop = logEl.scrollHeight;
while(logEl.children.length > 30) logEl.removeChild(logEl.firstChild);
}

function showDamage(target, text, color){
const el = document.createElement('div');
el.className = 'damage-popup';
el.textContent = text;
el.style.color = color||'#fff';
const rect = (target==='player'?document.getElementById('player-fighter'):document.getElementById('enemy-fighter')).getBoundingClientRect();
el.style.left = (rect.left+rect.width/2-20)+'px';
el.style.top = (rect.top+10)+'px';
container.appendChild(el);
setTimeout(()=>el.remove(), 1000);
}

function animateSprite(id, anim){
const el = document.getElementById(id);
el.style.animation = 'none';
void el.offsetWidth;
el.style.animation = anim+' 0.4s ease';
setTimeout(()=>{el.style.animation='idle 2s ease-in-out infinite';},450);
}

function playerAction(action){
if(state.busy || state.gameOver) return;
state.busy = true;
updateUI();
let dmg=0, heal=0;

if(action==='attack'){
dmg = Math.max(1, 12 + Math.floor(Math.random()*6) - state.enemy.def);
state.meter = Math.min(state.maxMeter, state.meter+15);
animateSprite('player-sprite','attack-anim');
sfxAttack();
setTimeout(()=>{
state.enemy.hp -= dmg;
showDamage('enemy', '-'+dmg, '#ff6b6b');
animateSprite('enemy-sprite','hit-anim');
addLog(`You hit ${state.enemy.name} for ${dmg} damage!`, 'dmg');
updateUI();
endPlayerTurn();
},300);
} else if(action==='special'){
if(state.meter<50) return;
state.meter -= 50;
dmg = Math.max(1, 25 + Math.floor(Math.random()*10) - state.enemy.def);
animateSprite('player-sprite','attack-anim');
sfxSpecial();
setTimeout(()=>{
state.enemy.hp -= dmg;
showDamage('enemy', '-'+dmg+'!', '#ffd700');
animateSprite('enemy-sprite','hit-anim');
addLog(`✨ Special hits ${state.enemy.name} for ${dmg} damage!`, 'dmg');
updateUI();
endPlayerTurn();
},300);
} else if(action==='defend'){
state.defending = true;
sfxDefend();
addLog('🛡️ You brace for the incoming attack!', 'info');
animateSprite('player-sprite','heal-anim');
endPlayerTurn();
} else if(action==='heal'){
if(state.meter<20) return;
state.meter -= 20;
heal = 15 + Math.floor(Math.random()*8);
state.playerHp = Math.min(state.playerMaxHp, state.playerHp+heal);
sfxHeal();
showDamage('player', '+'+heal, '#2ecc71');
animateSprite('player-sprite','heal-anim');
addLog(`💚 You heal for ${heal} HP!`, 'heal-msg');
updateUI();
endPlayerTurn();
}
}

function endPlayerTurn(){
updateUI();
if(state.enemy.hp <= 0){
sfxEnemyDie();
state.score += state.enemy.maxHp + state.wave*10;
addLog(`💀 ${state.enemy.name} is defeated! +${state.wave*10+state.enemy.maxHp} pts`, 'info');
updateUI();
setTimeout(nextWave, 800);
return;
}
setTimeout(enemyTurn, 600);
}

function enemyTurn(){
const e = state.enemy;
let rawDmg = e.atk + Math.floor(Math.random()*5) - 2;
if(state.defending) rawDmg = Math.floor(rawDmg*0.4);
rawDmg = Math.max(1, rawDmg);
state.playerHp -= rawDmg;
sfxHit();
showDamage('player', '-'+rawDmg, '#ff6b6b');
animateSprite('player-sprite','hit-anim');
document.getElementById('battle-area').classList.add('shake');
setTimeout(()=>document.getElementById('battle-area').classList.remove('shake'),300);
addLog(`${e.name} hits you for ${rawDmg} damage!${state.defending?' (Defended!)':''}`, 'dmg');
state.defending = false;
state.turn++;
updateUI();

if(state.playerHp <= 0){
gameOver();
return;
}
state.busy = false;
updateUI();
}

function nextWave(){
state.wave++;
spawnEnemy();
sfxWave();
addLog(`— Wave ${state.wave}: ${state.enemy.name} appears! —`, 'info');
state.busy = false;
updateUI();
}

function gameOver(){
state.gameOver = true;
state.busy = true;
sfxGameOver();
finalScore.textContent = state.score;
deathMsg.textContent = `You fell to the ${state.enemy.name} on wave ${state.wave} after ${state.turn} turns.`;
battleUI.style.display='none';
gameoverScreen.classList.remove('hidden');
updateUI();
try{ localStorage.setItem('cq_best', Math.max(parseInt(localStorage.getItem('cq_best')||'0'), state.score).toString()); }catch(e){}
}

function startGame(){
initAudio();
resetState();
logEl.innerHTML='';
startScreen.classList.add('hidden');
gameoverScreen.classList.add('hidden');
battleUI.style.display='block';
spawnEnemy();
addLog('Your adventure begins! Defeat the enemy!', 'info');
sfxWave();
state.busy = false;
updateUI();
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
btnAttack.addEventListener('click', ()=>playerAction('attack'));
btnSpecial.addEventListener('click', ()=>playerAction('special'));
btnDefend.addEventListener('click', ()=>playerAction('defend'));
btnHeal.addEventListener('click', ()=>playerAction('heal'));

window.addEventListener('keydown', function(e){
if(state.gameOver || state.busy){ 
if(!state.gameOver && startScreen.classList.contains('hidden')===false) startGame();
return; 
}
if(startScreen.classList.contains('hidden')===false || gameoverScreen.classList.contains('hidden')===false){
startGame(); return;
}
const map = {'1':'attack','2':'special','3':'defend','4':'heal'};
if(map[e.key]) playerAction(map[e.key]);
});

function resize(){
container.style.width='100vw';
container.style.height='100vh';
}
window.addEventListener('resize', resize);
resize();
})();
</script>
</body>
</html>
