<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Hell Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type, freq, dur, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.2));
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + (dur || 0.2));
}
function sfxShoot() { playSound('square', 800, 0.1, 0.08); }
function sfxExplosion() { playSound('sawtooth', 100, 0.4, 0.2); }
function sfxHit() { playSound('sawtooth', 60, 0.5, 0.3); }
function sfxEnemyShoot() { playSound('triangle', 400, 0.1, 0.05); }

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('bha_hi') || '0'); } catch(e) { hiScore = 0; }

let player = null;
let bullets = [];
let enemyBullets = [];
let asteroids = [];
let particles = [];
let stars = [];
let time = 0;
let difficulty = 1;
let spawnTimer = 0;
let shakeTime = 0;
let shakeMag = 0;

// Stars background
function initStars() {
  stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 + 0.1 });
  }
}
initStars();

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  initAudio();
  if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
  else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
  gameState = 'playing';
  score = 0;
  lives = 3;
  difficulty = 1;
  time = 0;
  spawnTimer = 0;
  bullets = [];
  enemyBullets = [];
  asteroids = [];
  particles = [];
  player = { x: W / 2, y: H - 80, vx: 0, vy: 0, angle: -Math.PI / 2, cooldown: 0, invincible: 0 };
}

// Spawn asteroid
function spawnAsteroid() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = -30; y = Math.random() * H; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = -30; }
  else { x = Math.random() * W; y = H + 30; }

  const size = Math.random() < 0.6 ? 1 : 2; // 1=small, 2=large
  const isShooter = Math.random() < 0.35 + difficulty * 0.05;
  const speed = (Math.random() * 1 + 0.5) * (1 + difficulty * 0.1);
  const angle = Math.atan2(H / 2 - y, W / 2 - x) + (Math.random() - 0.5) * 1.5;

  const verts = [];
  const numV = Math.floor(Math.random() * 4) + 6;
  for (let i = 0; i < numV; i++) {
    const a = (i / numV) * Math.PI * 2;
    const r = (size === 1 ? 18 : 32) * (0.7 + Math.random() * 0.5);
    verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }

  asteroids.push({
    x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    size, isShooter, hp: size === 1 ? 2 : 4, maxHp: size === 1 ? 2 : 4,
    rot: 0, rotSpd: (Math.random() - 0.5) * 0.05, verts,
    shootTimer: Math.random() * 120 + 60, pattern: Math.floor(Math.random() * 3),
    color: isShooter ? '#ff4444' : '#888888'
  });
}

// Bullet-hell patterns
function emitPattern(asteroid, type) {
  const ax = asteroid.x, ay = asteroid.y;
  const px = player.x, py = player.y;
  const baseAngle = Math.atan2(py - ay, px - ax);
  const count = 5 + Math.floor(difficulty * 0.8);

  if (type === 0) {
    // Fan spread
    const spread = 0.6;
    for (let i = 0; i < count; i++) {
      const a = baseAngle + (i - (count - 1) / 2) * (spread / count);
      enemyBullets.push({ x: ax, y: ay, vx: Math.cos(a) * 3.5, vy: Math.sin(a) * 3.5, r: 5, life: 0 });
    }
  } else if (type === 1) {
    // Ring
    const ringCount = 8 + Math.floor(difficulty);
    for (let i = 0; i < ringCount; i++) {
      const a = (i / ringCount) * Math.PI * 2;
      enemyBullets.push({ x: ax, y: ay, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5, r: 4, life: 0 });
    }
  } else {
    // Triple aimed + offset
    for (let i = -1; i <= 1; i++) {
      const a = baseAngle + i * 0.3;
      enemyBullets.push({ x: ax, y: ay, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, r: 5, life: 0 });
    }
    // Cross
    const crossA = baseAngle + Math.PI / 2;
    for (let i = -1; i <= 1; i++) {
      const a = crossA + i * 0.2;
      enemyBullets.push({ x: ax, y: ay, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 4, life: 0 });
    }
  }
}

function emitParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 4 + 1;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 30 + Math.random() * 20, maxLife: 50, color, r: Math.random() * 3 + 1 });
  }
}

// Update
function update() {
  if (gameState !== 'playing') return;
  time++;
  difficulty = 1 + Math.floor(time / 600) * 0.5;

  // Player movement
  const speed = 4.5;
  if (keys['KeyW'] || keys['ArrowUp']) player.vy -= speed * 0.3;
  if (keys['KeyS'] || keys['ArrowDown']) player.vy += speed * 0.3;
  if (keys['KeyA'] || keys['ArrowLeft']) player.vx -= speed * 0.3;
  if (keys['KeyD'] || keys['ArrowRight']) player.vx += speed * 0.3;

  player.vx *= 0.85;
  player.vy *= 0.85;
  player.x += player.vx;
  player.y += player.vy;
  player.x = Math.max(15, Math.min(W - 15, player.x));
  player.y = Math.max(15, Math.min(H - 15, player.y));

  if (player.invincible > 0) player.invincible--;

  // Player aim toward nearest asteroid or up
  let targetAngle = -Math.PI / 2;
  let nearest = null;
  let minDist = Infinity;
  for (const a of asteroids) {
    const d = Math.hypot(a.x - player.x, a.y - player.y);
    if (d < minDist && d > 50) { minDist = d; nearest = a; }
  }
  if (nearest) targetAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
  player.angle += (targetAngle - player.angle) * 0.15;

  // Player shoot
  if (player.cooldown > 0) player.cooldown--;
  if ((keys['Space'] || keys['KeyZ']) && player.cooldown <= 0) {
    const bx = player.x + Math.cos(player.angle) * 15;
    const by = player.y + Math.sin(player.angle) * 15;
    bullets.push({ x: bx, y: by, vx: Math.cos(player.angle) * 8, vy: Math.sin(player.angle) * 8, life: 60 });
    player.cooldown = 8;
    sfxShoot();
  }

  // Spawn asteroids
  spawnTimer--;
  if (spawnTimer <= 0 && asteroids.length < 5 + Math.floor(difficulty)) {
    spawnAsteroid();
    spawnTimer = Math.max(30, 90 - difficulty * 8);
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1);
    }
  }

  // Update enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy; b.life++;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30 || b.life > 400) {
      enemyBullets.splice(i, 1);
      continue;
    }
    // Hit player
    if (player.invincible <= 0) {
      const d = Math.hypot(b.x - player.x, b.y - player.y);
      if (d < 12 + b.r) {
        enemyBullets.splice(i, 1);
        hitPlayer();
      }
    }
  }

  // Update asteroids
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.x += a.vx; a.y += a.vy;
    a.rot += a.rotSpd;

    // Remove if way off screen
    if (a.x < -80 || a.x > W + 80 || a.y < -80 || a.y > H + 80) {
      asteroids.splice(i, 1);
      continue;
    }

    // Shooter behavior
    if (a.isShooter && a.hp > 0) {
      a.shootTimer--;
      if (a.shootTimer <= 0) {
        emitPattern(a, a.pattern);
        sfxEnemyShoot();
        a.shootTimer = Math.max(80, 150 - difficulty * 10);
      }
    }

    // Bullet hit asteroid
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      if (d < (a.size === 1 ? 20 : 35)) {
        bullets.splice(j, 1);
        a.hp--;
        emitParticles(a.x, a.y, '#ffaa00', 5);
        if (a.hp <= 0) {
          score += a.size === 1 ? 100 : 200;
          sfxExplosion();
          emitParticles(a.x, a.y, a.color, 15);
          // Split
          if (a.size === 2 && Math.random() < 0.7) {
            for (let k = 0; k < 2; k++) {
              const sa = Math.random() * Math.PI * 2;
              const sv = 1.5 + Math.random();
              const verts = [];
              const numV = Math.floor(Math.random() * 4) + 6;
              for (let v = 0; v < numV; v++) {
                const va = (v / numV) * Math.PI * 2;
                const vr = 18 * (0.7 + Math.random() * 0.5);
                verts.push({ x: Math.cos(va) * vr, y: Math.sin(va) * vr });
              }
              asteroids.push({
                x: a.x, y: a.y, vx: Math.cos(sa) * sv, vy: Math.sin(sa) * sv,
                size: 1, isShooter: Math.random() < 0.25, hp: 2, maxHp: 2,
                rot: 0, rotSpd: (Math.random() - 0.5) * 0.08, verts,
                shootTimer: Math.random() * 100 + 50, pattern: Math.floor(Math.random() * 3),
                color: '#ff4444'
              });
            }
          }
          asteroids.splice(i, 1);
        }
      }
    }

    // Asteroid hit player
    if (player.invincible <= 0) {
      const d = Math.hypot(a.x - player.x, a.y - player.y);
      if (d < (a.size === 1 ? 25 : 40)) {
        hitPlayer();
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Screen shake
  if (shakeTime > 0) {
    shakeTime--;
    shakeMag *= 0.85;
  }

  // Stars
  for (const s of stars) {
    s.y += s.sp;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function hitPlayer() {
  lives--;
  player.invincible = 120;
  shakeTime = 15;
  shakeMag = 8;
  sfxHit();
  emitParticles(player.x, player.y, '#44ff44', 20);
  if (lives <= 0) {
    gameState = 'gameover';
    if (score > hiScore) {
      hiScore = score;
      try { localStorage.setItem('bha_hi', String(hiScore)); } catch(e) {}
    }
  }
}

// Render
function render() {
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
  }

  // Background
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Stars
  ctx.fillStyle = '#ffffff';
  for (const s of stars) {
    ctx.globalAlpha = 0.3 + s.s * 0.2;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  if (gameState === 'playing' || gameState === 'gameover') {
    // Particles
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Bullets (player)
    ctx.fillStyle = '#44ffaa';
    for (const b of bullets) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fill();
      // Trail
      ctx.globalAlpha = 0.3;
      ctx.beginPath();
      ctx.arc(b.x - b.vx * 0.5, b.y - b.vy * 0.5, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Enemy bullets
    for (const b of enemyBullets) {
      ctx.fillStyle = '#ff3355';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffaa44';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Asteroids
    for (const a of asteroids) {
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.strokeStyle = a.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.verts[0].x, a.verts[0].y);
      for (let i = 1; i < a.verts.length; i++) {
        ctx.lineTo(a.verts[i].x, a.verts[i].y);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = a.color + '33';
      ctx.fill();

      // HP bar for shooters
      if (a.isShooter && a.hp < a.maxHp) {
        ctx.rotate(-a.rot);
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(-15, -(a.size === 1 ? 28 : 42), 30, 4);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(-15, -(a.size === 1 ? 28 : 42), 30 * (a.hp / a.maxHp), 4);
      }
      ctx.restore();
    }

    // Player
    if (gameState === 'playing') {
      if (player.invincible <= 0 || Math.floor(player.invincible / 5) % 2 === 0) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle + Math.PI / 2);
        ctx.fillStyle = '#44ffaa';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -15);
        ctx.lineTo(-10, 12);
        ctx.lineTo(0, 7);
        ctx.lineTo(10, 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Engine glow
        if (Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5) {
          ctx.fillStyle = '#ff8800';
          ctx.globalAlpha = 0.6 + Math.random() * 0.4;
          ctx.beginPath();
          ctx.moveTo(-4, 12);
          ctx.lineTo(0, 18 + Math.random() * 5);
          ctx.lineTo(4, 12);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }
    }

    // HUD
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.textAlign = 'right';
    ctx.fillText(`HI: ${hiScore}`, W - 20, 30);

    // Lives
    ctx.textAlign = 'left';
    for (let i = 0; i < lives; i++) {
      ctx.fillStyle = '#44ffaa';
      ctx.save();
      ctx.translate(30 + i * 25, 55);
      ctx.rotate(-Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(-6, 7);
      ctx.lineTo(6, 7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Difficulty indicator
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`WAVE ${Math.floor(difficulty)}`, 20, H - 20);
  }

  ctx.restore();

  // Overlays
  if (gameState === 'start') {
    drawStartScreen();
  } else if (gameState === 'gameover') {
    drawGameOver();
  }
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3355';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('BULLET HELL', W / 2, H / 2 - 100);
  ctx.fillStyle = '#44ffaa';
  ctx.font = 'bold 36px monospace';
  ctx.fillText('ASTEROIDS', W / 2, H / 2 - 55);

  ctx.fillStyle = '#ffffff';
  ctx.font = '16px monospace';
  const lines = [
    'WASD / Arrow Keys - Move',
    'SPACE / Z - Shoot',
    '',
    'Destroy asteroids. Dodge the bullets!',
    'Red asteroids fire bullet patterns.',
    'They split when destroyed.',
    '',
    `HI-SCORE: ${hiScore}`
  ];
  lines.forEach((line, i) => {
    ctx.fillText(line, W / 2, H / 2 + 10 + i * 24);
  });

  const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffaa00';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('PRESS SPACE TO START', W / 2, H / 2 + 210);
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3355';
  ctx.font = 'bold 42px monospace';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 40);

  ctx.fillStyle = '#ffffff';
  ctx.font = '22px monospace';
  ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 10);
  if (score >= hiScore && score > 0) {
    ctx.fillStyle = '#ffaa00';
    ctx.fillText('NEW HI-SCORE!', W / 2, H / 2 + 45);
  }

  const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffaa00';
  ctx.font = '18px monospace';
  ctx.fillText('PRESS SPACE OR R TO RESTART', W / 2, H / 2 + 90);
  ctx.globalAlpha = 1;
}

// Main loop
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
