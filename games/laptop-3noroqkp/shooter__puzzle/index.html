<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Shot - Shooter Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'shoot') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'bounce') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'win') {
        osc.type = 'sine';
        const notes = [523, 659, 784, 1047];
        notes.forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.type = 'sine';
            o.frequency.value = f;
            g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
            o.start(audioCtx.currentTime + i * 0.15);
            o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
        });
    } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Game State
const STATE = { START: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_COMPLETE: 3 };
let gameState = STATE.START;
let currentLevel = 0;
let shotsUsed = 0;
let stars_earned = [0, 0, 0, 0, 0, 0];

// Ball
let ball = null;
let trail = [];
let particles = [];
let aiming = false;
let aimStart = { x: 0, y: 0 };
let aimEnd = { x: 0, y: 0 };
let cannonPos = { x: 0, y: 0 };
let levelWalls = [];
let levelTargets = [];
let hitTargets = new Set();
let ballActive = false;
let levelCompleteTimer = 0;
let showLevelMsg = true;
let levelMsgTimer = 0;

// Particles class
class Particle {
    constructor(x, y, vx, vy, color, life) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.life = life; this.maxLife = life;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 200;
        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color, 0.5 + Math.random() * 0.5));
    }
}

// Level definitions
function getLevels() {
    const cw = W, ch = H;
    const bw = 12; // wall thickness
    return [
        { // Level 1: Simple direct shot
            cannon: { x: 80, y: ch - 80 },
            walls: [],
            targets: [{ x: cw - 150, y: ch / 2, r: 30 }],
            par: 1
        },
        { // Level 2: One wall to bounce around
            cannon: { x: 80, y: ch - 80 },
            walls: [{ x: cw * 0.45, y: ch * 0.3, w: bw, h: ch * 0.4 }],
            targets: [{ x: cw * 0.7, y: ch * 0.15, r: 28 }],
            par: 2
        },
        { // Level 3: Corner bounce
            cannon: { x: 80, y: ch - 80 },
            walls: [
                { x: cw * 0.35, y: ch * 0.5, w: bw, h: ch * 0.35 },
                { x: cw * 0.6, y: ch * 0.2, w: bw, h: ch * 0.3 }
            ],
            targets: [{ x: cw * 0.85, y: ch * 0.75, r: 28 }],
            par: 3
        },
        { // Level 4: Multiple obstacles
            cannon: { x: 80, y: ch - 80 },
            walls: [
                { x: cw * 0.3, y: ch * 0.2, w: bw, h: ch * 0.35 },
                { x: cw * 0.55, y: ch * 0.5, w: bw, h: ch * 0.35 },
                { x: cw * 0.4, y: ch * 0.7, w: cw * 0.2, h: bw }
            ],
            targets: [{ x: cw * 0.8, y: ch * 0.15, r: 26 }, { x: cw * 0.75, y: ch * 0.85, r: 26 }],
            par: 3
        },
        { // Level 5: Maze
            cannon: { x: 80, y: ch - 80 },
            walls: [
                { x: cw * 0.25, y: ch * 0.1, w: bw, h: ch * 0.4 },
                { x: cw * 0.5, y: ch * 0.4, w: bw, h: ch * 0.4 },
                { x: cw * 0.7, y: ch * 0.1, w: bw, h: ch * 0.35 },
                { x: cw * 0.35, y: ch * 0.65, w: cw * 0.15, h: bw }
            ],
            targets: [{ x: cw * 0.88, y: ch * 0.5, r: 24 }, { x: cw * 0.6, y: ch * 0.9, r: 24 }],
            par: 4
        },
        { // Level 6: Complex final
            cannon: { x: 80, y: ch - 80 },
            walls: [
                { x: cw * 0.2, y: ch * 0.3, w: bw, h: ch * 0.3 },
                { x: cw * 0.4, y: ch * 0.15, w: bw, h: ch * 0.5 },
                { x: cw * 0.6, y: ch * 0.5, w: bw, h: ch * 0.35 },
                { x: cw * 0.8, y: ch * 0.25, w: bw, h: ch * 0.4 },
                { x: cw * 0.3, y: ch * 0.75, w: cw * 0.12, h: bw }
            ],
            targets: [{ x: cw * 0.92, y: ch * 0.1, r: 22 }, { x: cw * 0.5, y: ch * 0.92, r: 22 }, { x: cw * 0.75, y: ch * 0.65, r: 22 }],
            par: 5
        }
    ];
}

function loadLevel(idx) {
    const levels = getLevels();
    if (idx >= levels.length) idx = 0;
    currentLevel = idx;
    cannonPos = { ...levels[idx].cannon };
    levelWalls = levels[idx].walls.map(w => ({ ...w }));
    levelTargets = levels[idx].targets.map(t => ({ ...t, hit: false }));
    hitTargets.clear();
    shotsUsed = 0;
    ball = null;
    trail = [];
    particles = [];
    ballActive = false;
    showLevelMsg = true;
    levelMsgTimer = 2;
    gameState = STATE.PLAYING;
}

function startGame() {
    stars_earned = [0, 0, 0, 0, 0, 0];
    loadLevel(0);
}

// Input
let mouseX = 0, mouseY = 0;
let mouseDown = false;

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    mouseX = e.offsetX; mouseY = e.offsetY;
    if (gameState === STATE.START) { startGame(); return; }
    if (gameState === STATE.LEVEL_COMPLETE) { loadLevel(currentLevel + 1); return; }
    if (gameState === STATE.GAME_COMPLETE) { startGame(); return; }
    if (gameState === STATE.PLAYING && !ballActive) {
        aiming = true;
        aimStart = { x: mouseX, y: mouseY };
        mouseDown = true;
    }
});

canvas.addEventListener('mousemove', (e) => {
    mouseX = e.offsetX; mouseY = e.offsetY;
    if (aiming) { aimEnd = { x: mouseX, y: mouseY }; }
});

canvas.addEventListener('mouseup', (e) => {
    if (aiming && gameState === STATE.PLAYING) {
        shoot();
        aiming = false;
    }
    mouseDown = false;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    initAudio();
    mouseX = t.clientX - rect.left; mouseY = t.clientY - rect.top;
    if (gameState === STATE.START) { startGame(); return; }
    if (gameState === STATE.LEVEL_COMPLETE) { loadLevel(currentLevel + 1); return; }
    if (gameState === STATE.GAME_COMPLETE) { startGame(); return; }
    if (gameState === STATE.PLAYING && !ballActive) {
        aiming = true;
        aimStart = { x: mouseX, y: mouseY };
    }
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    mouseX = t.clientX - rect.left; mouseY = t.clientY - rect.top;
    if (aiming) aimEnd = { x: mouseX, y: mouseY };
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (aiming && gameState === STATE.PLAYING) shoot();
    aiming = false;
});

window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
        if (gameState === STATE.PLAYING || gameState === STATE.LEVEL_COMPLETE) loadLevel(currentLevel);
    }
    if (e.key === ' ' && gameState === STATE.START) startGame();
});

function shoot() {
    const dx = cannonPos.x - aimEnd.x;
    const dy = cannonPos.y - aimEnd.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    const power = Math.min(dist / 8, 600);
    const angle = Math.atan2(dy, dx);
    ball = { x: cannonPos.x, y: cannonPos.y, vx: Math.cos(angle) * power, vy: Math.sin(angle) * power, r: 10 };
    trail = [];
    ballActive = true;
    shotsUsed++;
    playSound('shoot');
}

function updateBall(dt) {
    if (!ball) return;
    const friction = 0.998;
    ball.vx *= friction;
    ball.vy *= friction;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 40) trail.shift();

    // Bounce off screen edges
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.9; playSound('bounce'); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.9; playSound('bounce'); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * 0.9; playSound('bounce'); }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy) * 0.9; playSound('bounce'); }

    // Bounce off walls
    for (const w of levelWalls) {
        if (rectCircleCollision(w, ball)) {
            resolveWallBounce(w);
            playSound('bounce');
        }
    }

    // Check targets
    for (let i = 0; i < levelTargets.length; i++) {
        const t = levelTargets[i];
        if (!t.hit) {
            const dx = ball.x - t.x, dy = ball.y - t.y;
            if (Math.sqrt(dx * dx + dy * dy) < ball.r + t.r) {
                t.hit = true;
                hitTargets.add(i);
                playSound('hit');
                spawnParticles(t.x, t.y, '#ffdd44', 20);
                checkLevelComplete();
            }
        }
    }

    // Ball dies when too slow
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (speed < 15) {
        ballActive = false;
        ball = null;
        checkLevelComplete();
    }
}

function rectCircleCollision(rect, circ) {
    const cx = Math.max(rect.x, Math.min(circ.x, rect.x + rect.w));
    const cy = Math.max(rect.y, Math.min(circ.y, rect.y + rect.h));
    const dx = circ.x - cx, dy = circ.y - cy;
    return dx * dx + dy * dy < circ.r * circ.r;
}

function resolveWallBounce(w) {
    const cx = Math.max(w.x, Math.min(ball.x, w.x + w.w));
    const cy = Math.max(w.y, Math.min(ball.y, w.y + w.h));
    const dx = ball.x - cx, dy = ball.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = dx / dist, ny = dy / dist;
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx -= 2 * dot * nx * 0.9;
    ball.vy -= 2 * dot * ny * 0.9;
    // Push out
    const overlap = ball.r - dist;
    if (overlap > 0) {
        ball.x += nx * overlap;
        ball.y += ny * overlap;
    }
}

function checkLevelComplete() {
    if (levelTargets.every(t => t.hit)) {
        gameState = STATE.LEVEL_COMPLETE;
        levelCompleteTimer = 0;
        playSound('win');
        const par = getLevels()[currentLevel].par;
        const stars = shotsUsed <= par ? 3 : shotsUsed <= par + 1 ? 2 : 1;
        stars_earned[currentLevel] = Math.max(stars_earned[currentLevel], stars);
    }
}

function update(dt) {
    if (gameState === STATE.PLAYING && ballActive) {
        const steps = 4;
        for (let i = 0; i < steps; i++) updateBall(dt / steps);
    }
    particles.forEach(p => p.update(dt));
    particles = particles.filter(p => p.life > 0);

    if (showLevelMsg) {
        levelMsgTimer -= dt;
        if (levelMsgTimer <= 0) showLevelMsg = false;
    }
}

// Drawing
function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    // Grid
    ctx.strokeStyle = 'rgba(50, 60, 100, 0.3)';
    ctx.lineWidth = 1;
    const gs = 50;
    for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}

function drawWalls() {
    for (const w of levelWalls) {
        ctx.fillStyle = '#3a4a6a';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#6a8aca';
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
        // Glow
        ctx.shadowColor = '#4a6aaa';
        ctx.shadowBlur = 8;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
        ctx.shadowBlur = 0;
    }
}

function drawTargets() {
    for (const t of levelTargets) {
        if (t.hit) continue;
        const pulse = Math.sin(Date.now() * 0.005) * 3;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r + pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 100, 50, 0.3)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ff6432';
        ctx.fill();
        ctx.strokeStyle = '#ffaa66';
        ctx.lineWidth = 3;
        ctx.stroke();
        // Inner
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.r * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffdd44';
        ctx.fill();
    }
}

function drawCannon() {
    let angle = -Math.PI / 4;
    if (aiming) {
        const dx = cannonPos.x - aimEnd.x;
        const dy = cannonPos.y - aimEnd.y;
        angle = Math.atan2(dy, dx);
    } else if (ball && ballActive) {
        angle = Math.atan2(ball.vy, ball.vx);
    }

    ctx.save();
    ctx.translate(cannonPos.x, cannonPos.y);
    ctx.rotate(angle);
    // Barrel
    ctx.fillStyle = '#5a7aaa';
    ctx.fillRect(0, -8, 35, 16);
    ctx.strokeStyle = '#8ab0ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, -8, 35, 16);
    // Base
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fillStyle = '#3a4a6a';
    ctx.fill();
    ctx.strokeStyle = '#6a8aca';
    ctx.stroke();
    ctx.restore();
}

function drawAimLine() {
    if (!aiming) return;
    const dx = cannonPos.x - aimEnd.x;
    const dy = cannonPos.y - aimEnd.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 10) return;
    const power = Math.min(dist / 8, 600);
    const angle = Math.atan2(dy, dx);

    // Draw trajectory prediction (first few bounces)
    let px = cannonPos.x, py = cannonPos.y;
    let pvx = Math.cos(angle) * power, pvy = Math.sin(angle) * power;
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(255, 255, 100, 0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    for (let i = 0; i < 120; i++) {
        const sdt = 0.016;
        pvx *= 0.998; pvy *= 0.998;
        px += pvx * sdt; py += pvy * sdt;
        if (px < 0 || px > W || py < 0 || py > H) break;
        let hitWall = false;
        for (const w of levelWalls) {
            if (rectCircleCollision(w, { x: px, y: py, r: 10 })) { hitWall = true; break; }
        }
        if (px < 10 || px > W - 10 || py < 10 || py > H - 10) {
            // bounce prediction
            if (px < 10) pvx = Math.abs(pvx) * 0.9;
            if (px > W - 10) pvx = -Math.abs(pvx) * 0.9;
            if (py < 10) pvy = Math.abs(pvy) * 0.9;
            if (py > H - 10) pvy = -Math.abs(pvy) * 0.9;
        }
        ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Power indicator
    const powerPct = power / 600;
    ctx.fillStyle = `hsl(${120 - powerPct * 120}, 80%, 50%)`;
    ctx.font = '14px monospace';
    ctx.fillText(`Power: ${Math.round(powerPct * 100)}%`, cannonPos.x + 30, cannonPos.y - 30);
}

function drawBall() {
    if (!ball) return;
    // Trail
    for (let i = 0; i < trail.length; i++) {
        const alpha = (i / trail.length) * 0.5;
        const r = 4 + (i / trail.length) * 6;
        ctx.beginPath();
        ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
        ctx.fill();
    }
    // Ball
    const grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#64c8ff');
    grad.addColorStop(1, '#2a7aaa');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#aaddff';
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * alpha, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 220, 68, ${alpha})`;
        ctx.fill();
    }
}

function drawHUD() {
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#aaccff';
    ctx.fillText(`Level ${currentLevel + 1}/6`, 20, 30);
    ctx.fillText(`Shots: ${shotsUsed}`, 20, 55);
    const par = getLevels()[currentLevel].par;
    ctx.fillStyle = '#8899aa';
    ctx.font = '13px monospace';
    ctx.fillText(`Par: ${par} | [R] Restart`, 20, 80);

    // Show targets remaining
    const remaining = levelTargets.filter(t => !t.hit).length;
    ctx.fillStyle = '#ffaa66';
    ctx.font = '14px monospace';
    ctx.fillText(`Targets: ${levelTargets.length - remaining}/${levelTargets.length}`, W - 200, 30);
}

function drawStartScreen() {
    drawBackground();
    const cx = W / 2, cy = H / 2;

    // Title
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6432';
    ctx.shadowColor = '#ff6432';
    ctx.shadowBlur = 20;
    ctx.fillText('BOUNCE SHOT', cx, cy - 80);
    ctx.shadowBlur = 0;

    ctx.font = '20px monospace';
    ctx.fillStyle = '#aaccff';
    ctx.fillText('A Shooter Puzzle Game', cx, cy - 40);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#8899aa';
    const lines = [
        'Click and drag from anywhere to aim your cannon.',
        'Release to fire! Balls bounce off walls and edges.',
        'Hit all targets on each level to advance.',
        '',
        'Match the angle so your shot bounces into targets!',
        '',
        '[R] - Restart Level',
        '',
        'Click to Start!'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, cx, cy + 10 + i * 28);
    });
    ctx.textAlign = 'left';

    // Animated ball
    const t = Date.now() * 0.003;
    for (let i = 0; i < 5; i++) {
        const bx = cx + Math.cos(t + i * 1.2) * 100;
        const by = cy + 200 + Math.sin(t * 1.5 + i) * 30;
        ctx.beginPath();
        ctx.arc(bx, by, 8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(100, 200, 255, ${0.5 - i * 0.08})`;
        ctx.fill();
    }
}

function drawLevelComplete() {
    const cx = W / 2, cy = H / 2;
    ctx.fillStyle = 'rgba(10, 10, 26, 0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#44ff88';
    ctx.fillText('LEVEL COMPLETE!', cx, cy - 50);

    // Stars
    const par = getLevels()[currentLevel].par;
    const stars = shotsUsed <= par ? 3 : shotsUsed <= par + 1 ? 2 : 1;
    ctx.font = '48px monospace';
    for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < stars ? '#ffdd44' : '#333355';
        ctx.fillText('★', cx - 60 + i * 60, cy + 10);
    }

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaccff';
    ctx.fillText(`Shots: ${shotsUsed} (Par: ${par})`, cx, cy + 50);
    ctx.fillText('Click to continue', cx, cy + 90);
    ctx.textAlign = 'left';
}

function drawGameComplete() {
    const cx = W / 2, cy = H / 2;
    ctx.fillStyle = 'rgba(10, 10, 26, 0.85)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 42px monospace';
    ctx.fillStyle = '#ffdd44';
    ctx.shadowColor = '#ffdd44';
    ctx.shadowBlur = 15;
    ctx.fillText('ALL LEVELS COMPLETE!', cx, cy - 60);
    ctx.shadowBlur = 0;

    // Total stars
    const totalStars = stars_earned.reduce((a, b) => a + b, 0);
    ctx.font = '24px monospace';
    ctx.fillStyle = '#ffdd44';
    ctx.fillText(`Total Stars: ${totalStars} / 18`, cx, cy - 10);

    // Per level
    ctx.font = '16px monospace';
    for (let i = 0; i < 6; i++) {
        let s = '';
        for (let j = 0; j < stars_earned[i]; j++) s += '★';
        ctx.fillStyle = '#aaccff';
        ctx.fillText(`Level ${i + 1}: ${s}`, cx, cy + 30 + i * 28);
    }

    ctx.font = '18px monospace';
    ctx.fillStyle = '#8899aa';
    ctx.fillText('Click to play again', cx, cy + 210);
    ctx.textAlign = 'left';
}

function drawLevelMsg() {
    if (!showLevelMsg) return;
    const alpha = Math.min(levelMsgTimer, 1);
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Level ${currentLevel + 1}`, W / 2, H / 2 - 20);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaccff';
    ctx.fillText('Hit all targets!', W / 2, H / 2 + 15);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
}

function draw() {
    if (gameState === STATE.START) { drawStartScreen(); return; }
    if (gameState === STATE.GAME_COMPLETE) { drawGameComplete(); return; }

    drawBackground();
    drawWalls();
    drawTargets();
    drawCannon();
    drawAimLine();
    drawBall();
    drawParticles();
    drawHUD();

    if (showLevelMsg) drawLevelMsg();
    if (gameState === STATE.LEVEL_COMPLETE) drawLevelComplete();
}

// Main loop
let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    update(dt);
    draw();
    if (gameState === STATE.LEVEL_COMPLETE && levelCompleteTimer > 2) {
        // Auto-advance handled by click
    }
    requestAnimationFrame(gameLoop);
}

// Level complete -> game complete check
const _origCheck = checkLevelComplete;
checkLevelComplete = function() {
    if (levelTargets.every(t => t.hit)) {
        gameState = STATE.LEVEL_COMPLETE;
        levelCompleteTimer = 0;
        playSound('win');
        const par = getLevels()[currentLevel].par;
        const stars = shotsUsed <= par ? 3 : shotsUsed <= par + 1 ? 2 : 1;
        stars_earned[currentLevel] = Math.max(stars_earned[currentLevel], stars);
    }
};

// Override level complete click to check for game complete
const _origLoadLevel = loadLevel;
loadLevel = function(idx) {
    if (idx >= getLevels().length) {
        gameState = STATE.GAME_COMPLETE;
        return;
    }
    _origLoadLevel(idx);
};

requestAnimationFrame(gameLoop);
</script>
