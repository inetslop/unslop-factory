<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Space Invaders 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, type, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game constants
const FOCAL = 350;
const ALIEN_COLS = 8;
const ALIEN_ROWS = 5;
const COL_SPACING = 1.2;
const ROW_DEPTH = 4;
const START_Z = 22;
const MIN_Z = 2.5;
const ALIEN_Y = 2.2;

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('si3d_high') || '0'); } catch(e) {}

// Player
let player = { x: 0, speed: 2.5, cooldown: 0 };
let bullets = [];
let aliens = [];
let particles = [];
let stars = [];
let time = 0;
let alienSpeed = 0.015;
let alienDir = 1;
let alienOffsetX = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) restartGame();
    if (gameState === 'win' && (e.code === 'Space' || e.code === 'Enter')) restartGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Stars
function initStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push({
            x: Math.random() * W - W/2,
            y: Math.random() * H - H/2,
            z: Math.random() * 40 + 5,
            speed: Math.random() * 0.5 + 0.2
        });
    }
}

function initAliens() {
    aliens = [];
    for (let r = 0; r < ALIEN_ROWS; r++) {
        for (let c = 0; c < ALIEN_COLS; c++) {
            const x = (c - (ALIEN_COLS - 1) / 2) * COL_SPACING;
            const z = START_Z - r * ROW_DEPTH;
            aliens.push({
                x: x, z: z, y: ALIEN_Y,
                row: r, col: c,
                alive: true,
                animPhase: Math.random() * Math.PI * 2,
                hit: false
            });
        }
    }
}

function startGame() {
    initAudio();
    gameState = 'playing';
    score = 0;
    lives = 3;
    player.x = 0;
    bullets = [];
    particles = [];
    alienSpeed = 0.015;
    alienDir = 1;
    alienOffsetX = 0;
    initAliens();
}

function restartGame() {
    startGame();
}

function project(x, y, z) {
    if (z <= 0.5) return null;
    const sx = W / 2 + (x * FOCAL) / z;
    const sy = H * 0.55 - (y * FOCAL) / z;
    return { x: sx, y: sy, scale: FOCAL / z };
}

// Drawing functions
function drawStar(x, y, size, alpha) {
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
}

function drawGrid() {
    const horizonY = H * 0.55;
    // Horizontal lines (depth)
    for (let i = 1; i <= 20; i++) {
        const z = i * 2;
        const y1 = project(0, 0, z);
        if (!y1) continue;
        const leftX = W / 2 - (8 * FOCAL) / z;
        const rightX = W / 2 + (8 * FOCAL) / z;
        const alpha = Math.max(0.05, 0.3 - i * 0.01);
        ctx.strokeStyle = `rgba(0,200,255,${alpha})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(leftX, y1.y);
        ctx.lineTo(rightX, y1.y);
        ctx.stroke();
    }
    // Vertical lines (lateral)
    for (let i = -8; i <= 8; i++) {
        const near = project(i, 0, 2);
        const far = project(i * 0.3, 0, 40);
        if (!near || !far) continue;
        ctx.strokeStyle = 'rgba(0,200,255,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(near.x, near.y);
        ctx.lineTo(far.x, far.y);
        ctx.stroke();
    }
}

function drawAlien(alien) {
    if (!alien.alive) return;
    const p = project(alien.x + alienOffsetX, alien.y, alien.z);
    if (!p) return;
    const s = p.scale * 0.4;
    const phase = Math.sin(time * 3 + alien.animPhase);

    // Color based on row
    const colors = ['#ff3366', '#ff6633', '#ffcc33', '#33ff66', '#33ccff'];
    const col = colors[alien.row % colors.length];

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(s / 20, s / 20);

    // Glow
    ctx.shadowColor = col;
    ctx.shadowBlur = 8;

    // Body - pixel art style invader
    ctx.fillStyle = col;
    const frame = Math.floor(time * 4) % 2;

    if (alien.row < 2) {
        // Type 1 - squid-like
        drawInvaderType1(frame);
    } else if (alien.row < 4) {
        // Type 2 - crab-like
        drawInvaderType2(frame);
    } else {
        // Type 3 - octopus-like
        drawInvaderType3(frame);
    }

    ctx.restore();
}

function drawInvaderType1(frame) {
    ctx.fillStyle = '#ff3366';
    const px = 2;
    // Squid shape
    if (frame === 0) {
        ctx.fillRect(-6, -4, 2, 2); ctx.fillRect(4, -4, 2, 2);
        ctx.fillRect(-5, -2, 10, 2);
        ctx.fillRect(-7, 0, 14, 2);
        ctx.fillRect(-7, 2, 3, 2); ctx.fillRect(4, 2, 3, 2);
    } else {
        ctx.fillRect(-6, -4, 2, 2); ctx.fillRect(4, -4, 2, 2);
        ctx.fillRect(-5, -2, 10, 2);
        ctx.fillRect(-7, 0, 14, 2);
        ctx.fillRect(-8, 2, 3, 2); ctx.fillRect(5, 2, 3, 2);
    }
}

function drawInvaderType2(frame) {
    ctx.fillStyle = '#ffcc33';
    if (frame === 0) {
        ctx.fillRect(-6, -4, 2, 2); ctx.fillRect(4, -4, 2, 2);
        ctx.fillRect(-5, -2, 10, 4);
        ctx.fillRect(-7, 2, 14, 2);
        ctx.fillRect(-7, 4, 3, 2); ctx.fillRect(4, 4, 3, 2);
    } else {
        ctx.fillRect(-6, -4, 2, 2); ctx.fillRect(4, -4, 2, 2);
        ctx.fillRect(-5, -2, 10, 4);
        ctx.fillRect(-7, 2, 14, 2);
        ctx.fillRect(-8, 4, 3, 2); ctx.fillRect(5, 4, 3, 2);
    }
}

function drawInvaderType3(frame) {
    ctx.fillStyle = '#33ccff';
    if (frame === 0) {
        ctx.fillRect(-4, -6, 8, 2);
        ctx.fillRect(-5, -4, 10, 2);
        ctx.fillRect(-7, -2, 14, 2);
        ctx.fillRect(-7, 0, 14, 2);
        ctx.fillRect(-5, 2, 3, 2); ctx.fillRect(2, 2, 3, 2);
    } else {
        ctx.fillRect(-4, -6, 8, 2);
        ctx.fillRect(-5, -4, 10, 2);
        ctx.fillRect(-7, -2, 14, 2);
        ctx.fillRect(-7, 0, 14, 2);
        ctx.fillRect(-7, 2, 3, 2); ctx.fillRect(4, 2, 3, 2);
    }
}

function drawPlayer() {
    const p = project(player.x, 0.5, 1.5);
    if (!p) return;
    const s = p.scale * 0.6;

    ctx.save();
    ctx.translate(p.x, H - 60);
    ctx.scale(s / 20, s / 20);

    // Ship
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#00ffcc';
    // Main body
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(-8, 5);
    ctx.lineTo(-12, 10);
    ctx.lineTo(-6, 8);
    ctx.lineTo(0, 5);
    ctx.lineTo(6, 8);
    ctx.lineTo(12, 10);
    ctx.lineTo(-8, 5);
    ctx.fill();

    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(-4, 0);
    ctx.lineTo(4, 0);
    ctx.closePath();
    ctx.fill();

    // Engine glow
    const engineGlow = Math.sin(time * 20) * 3 + 8;
    ctx.fillStyle = `rgba(0,255,200,${0.5 + Math.sin(time * 15) * 0.3})`;
    ctx.beginPath();
    ctx.arc(0, 12, engineGlow / 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function drawBullet(b) {
    const p = project(b.x, 1.5, b.z);
    if (!p) return;
    const s = p.scale * 0.3;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(2, s * 0.3), 0, Math.PI * 2);
    ctx.fill();
    // Trail
    const trail = project(b.x, 1.5, b.z - 0.5);
    if (trail) {
        ctx.strokeStyle = 'rgba(255,255,0,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(trail.x, trail.y);
        ctx.stroke();
    }
    ctx.restore();
}

function drawParticle(pt) {
    const p = project(pt.x, pt.y, pt.z);
    if (!p) return;
    const alpha = pt.life / pt.maxLife;
    ctx.fillStyle = `rgba(${pt.r},${pt.g},${pt.b},${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1, pt.size * p.scale * 0.2), 0, Math.PI * 2);
    ctx.fill();
}

function spawnExplosion(x, y, z, color) {
    const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
    for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 0.3 + 0.1;
        particles.push({
            x: x, y: y, z: z,
            vx: Math.cos(angle) * speed,
            vy: (Math.random() - 0.5) * 0.2,
            vz: (Math.random() - 0.3) * 0.1,
            life: 1, maxLife: 1,
            r: r, g: g, b: b,
            size: Math.random() * 3 + 1
        });
    }
}

function drawHUD() {
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#0ff';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.textAlign = 'right';
    ctx.fillText(`HI: ${highScore}`, W - 20, 35);

    // Lives
    for (let i = 0; i < lives; i++) {
        const lx = 20 + i * 30;
        const ly = H - 30;
        ctx.fillStyle = '#0ff';
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.moveTo(lx, ly - 8);
        ctx.lineTo(lx - 6, ly + 4);
        ctx.lineTo(lx + 6, ly + 4);
        ctx.closePath();
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Wave progress
    const aliveCount = aliens.filter(a => a.alive).length;
    ctx.font = '14px monospace';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.fillText(`HOSTILES: ${aliveCount}`, W / 2, 30);
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 20;
    ctx.fillText('SPACE INVADERS', W/2, H/3);

    ctx.font = 'bold 60px monospace';
    ctx.fillStyle = '#f36';
    ctx.shadowColor = '#f36';
    ctx.fillText('3D', W/2, H/3 + 70);

    ctx.shadowBlur = 0;
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('← → or A/D : Move', W/2, H/2 + 40);
    ctx.fillText('SPACE : Fire', W/2, H/2 + 70);
    ctx.fillText('', W/2, H/2 + 100);

    const blink = Math.sin(time * 3) > 0;
    if (blink) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('PRESS SPACE TO START', W/2, H * 0.75);
    }

    if (highScore > 0) {
        ctx.font = '16px monospace';
        ctx.fillStyle = '#ff0';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H * 0.85);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#f36';
    ctx.shadowColor = '#f36';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W/2, H/3);

    ctx.shadowBlur = 0;
    ctx.font = '24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff0';
        ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H/2 + 40);
    }

    const blink = Math.sin(time * 3) > 0;
    if (blink) {
        ctx.font = '20px monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('PRESS SPACE TO RESTART', W/2, H * 0.75);
    }
}

function drawWin() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#3f6';
    ctx.shadowColor = '#3f6';
    ctx.shadowBlur = 15;
    ctx.fillText('WAVE CLEARED!', W/2, H/3);

    ctx.shadowBlur = 0;
    ctx.font = '24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${score}`, W/2, H/2);

    const blink = Math.sin(time * 3) > 0;
    if (blink) {
        ctx.font = '20px monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('PRESS SPACE TO CONTINUE', W/2, H * 0.75);
    }
}

// Update
function update(dt) {
    time += dt;

    if (gameState !== 'playing') return;

    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed * dt * 60;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed * dt * 60;
    player.x = Math.max(-5, Math.min(5, player.x));

    // Shooting
    player.cooldown -= dt;
    if ((keys['Space']) && player.cooldown <= 0) {
        bullets.push({ x: player.x, z: 1.5 });
        player.cooldown = 0.25;
        playSound(800, 'square', 0.1, 0.1);
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].z += 8 * dt;
        if (bullets[i].z > START_Z + 5) {
            bullets.splice(i, 1);
        }
    }

    // Alien movement
    alienOffsetX += alienDir * dt * 0.3;
    if (Math.abs(alienOffsetX) > 1.5) {
        alienDir *= -1;
    }

    for (let a of aliens) {
        if (!a.alive) continue;
        a.z -= alienSpeed * dt * 60;
    }

    // Check if aliens reached player
    for (let a of aliens) {
        if (a.alive && a.z <= MIN_Z) {
            triggerGameOver();
            return;
        }
    }

    // Bullet-alien collision
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        let hit = false;
        for (let a of aliens) {
            if (!a.alive) continue;
            const dx = Math.abs(b.x - (a.x + alienOffsetX));
            const dz = Math.abs(b.z - a.z);
            if (dx < 0.8 && dz < 1.5) {
                a.alive = false;
                hit = true;
                const rowScore = [10, 20, 30, 40, 50][a.row];
                score += rowScore;
                if (score > highScore) {
                    highScore = score;
                    try { localStorage.setItem('si3d_high', highScore); } catch(e) {}
                }
                const colors = ['#ff3366','#ffcc33','#33ccff'];
                spawnExplosion(a.x + alienOffsetX, a.y, a.z, colors[a.row % 3]);
                playSound(200 + Math.random() * 200, 'sawtooth', 0.15, 0.15);
                break;
            }
        }
        if (hit) bullets.splice(i, 1);
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt * 3;
        p.y += p.vy * dt * 3;
        p.z += p.vz * dt * 3;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Check win
    if (aliens.every(a => !a.alive)) {
        gameState = 'win';
        playSound(400, 'sine', 0.5, 0.2);
        setTimeout(() => playSound(600, 'sine', 0.5, 0.2), 150);
        setTimeout(() => playSound(800, 'sine', 0.5, 0.2), 300);
    }

    // Speed up as fewer aliens remain
    const aliveCount = aliens.filter(a => a.alive).length;
    alienSpeed = 0.015 + (ALIEN_ROWS * ALIEN_COLS - aliveCount) * 0.0005;
}

function triggerGameOver() {
    gameState = 'gameover';
    playSound(100, 'sawtooth', 0.5, 0.3);
    try { localStorage.setItem('si3d_high', highScore); } catch(e) {}
}

// Render
function render() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of stars) {
        const p = project(s.x, s.y * 0.3 + 5, s.z);
        if (!p) continue;
        drawStar(p.x, p.y, Math.max(0.5, s.speed), 0.6);
    }

    // Grid
    drawGrid();

    // Draw aliens (back to front)
    const sorted = [...aliens].sort((a, b) => b.z - a.z);
    for (let a of sorted) {
        if (a.alive) drawAlien(a);
    }

    // Bullets
    for (let b of bullets) drawBullet(b);

    // Particles
    for (let p of particles) drawParticle(p);

    // Player
    if (gameState === 'playing') drawPlayer();

    // HUD
    if (gameState === 'playing') drawHUD();
}

function renderStart() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    for (let s of stars) {
        const p = project(s.x, s.y * 0.3 + 5, s.z);
        if (!p) continue;
        drawStar(p.x, p.y, Math.max(0.5, s.speed), 0.6);
    }
    drawGrid();
    drawStartScreen();
}

function renderGameOver() {
    render();
    drawGameOver();
}

function renderWin() {
    render();
    drawWin();
}

// Main loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    update(dt);

    if (gameState === 'start') {
        renderStart();
    } else if (gameState === 'playing') {
        render();
    } else if (gameState === 'gameover') {
        renderGameOver();
    } else if (gameState === 'win') {
        renderWin();
    }

    requestAnimationFrame(gameLoop);
}

initStars();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
