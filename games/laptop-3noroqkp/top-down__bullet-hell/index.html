<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Hell: Skyfall</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type, freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.1));
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.1));
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let wave = 0;
let frameCount = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Player
let player = { x: 0, y: 0, w: 20, h: 30, speed: 5, power: 1, invincible: 0 };
let playerBullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let powerups = [];
let stars = [];

// Stars background
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, speed: 0.5 + Math.random() * 2, size: 0.5 + Math.random() * 1.5 });
    }
}

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    wave = 0;
    frameCount = 0;
    player.x = W / 2;
    player.y = H - 60;
    player.power = 1;
    player.invincible = 0;
    playerBullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    powerups = [];
    initStars();
}

// Spawn enemies
function spawnWave() {
    wave++;
    const count = Math.min(2 + Math.floor(wave / 2), 6);
    for (let i = 0; i < count; i++) {
        const type = Math.floor(Math.random() * 3);
        const x = W * 0.15 + (W * 0.7) * (i / Math.max(count - 1, 1));
        enemies.push({
            x: x,
            y: -40 - i * 30,
            w: 30,
            h: 30,
            hp: type === 2 ? 5 : (type === 1 ? 3 : 2),
            maxHp: type === 2 ? 5 : (type === 1 ? 3 : 2),
            type: type, // 0=simple, 1=medium, 2=heavy
            pattern: Math.floor(Math.random() * 4),
            fireTimer: 60 + Math.random() * 60,
            speed: 0.5 + wave * 0.1,
            moveDir: (Math.random() - 0.5) * 2,
            phase: 0
        });
    }
}

// Bullet patterns
function firePattern(e) {
    const cx = e.x;
    const cy = e.y + e.h / 2;
    const pat = e.pattern;

    if (pat === 0) {
        // Fan spread toward player
        const angle = Math.atan2(player.y - cy, player.x - cx);
        for (let i = -2; i <= 2; i++) {
            const a = angle + i * 0.25;
            enemyBullets.push({ x: cx, y: cy, vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, r: 5, color: '#ff4444' });
        }
    } else if (pat === 1) {
        // Radial burst
        const count = 8 + wave;
        for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2 + e.phase;
            enemyBullets.push({ x: cx, y: cy, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 4, color: '#ff8800' });
        }
    } else if (pat === 2) {
        // Aimed + side shots
        const angle = Math.atan2(player.y - cy, player.x - cx);
        enemyBullets.push({ x: cx, y: cy, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5, r: 6, color: '#ff0066' });
        for (let i = 1; i <= 2; i++) {
            enemyBullets.push({ x: cx, y: cy, vx: Math.cos(angle + i * 0.4) * 3.5, vy: Math.sin(angle + i * 0.4) * 3.5, r: 4, color: '#ff6699' });
            enemyBullets.push({ x: cx, y: cy, vx: Math.cos(angle - i * 0.4) * 3.5, vy: Math.sin(angle - i * 0.4) * 3.5, r: 4, color: '#ff6699' });
        }
    } else {
        // Spiral (spawns multiple over time via phase)
        const count = 12;
        for (let i = 0; i < count; i++) {
            const a = (i / count) * Math.PI * 2 + e.phase * 3;
            enemyBullets.push({ x: cx, y: cy, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5, r: 4, color: '#aa44ff' });
        }
    }
    playSound('square', 100 + wave * 10, 0.08, 0.06);
}

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30 + Math.random() * 20, maxLife: 50, color, size: 2 + Math.random() * 3 });
    }
}

function spawnPowerup(x, y) {
    if (Math.random() < 0.15) {
        powerups.push({ x, y, vy: 1.5, type: 'power', w: 16, h: 16 });
    }
}

// Update
function update() {
    frameCount++;

    // Stars
    for (let s of stars) {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    if (gameState !== 'playing') return;

    // Player movement
    let dx = 0, dy = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) dy += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
    player.x += dx * player.speed;
    player.y += dy * player.speed;
    player.x = Math.max(15, Math.min(W - 15, player.x));
    player.y = Math.max(20, Math.min(H - 20, player.y));

    if (player.invincible > 0) player.invincible--;

    // Player shoot
    if (keys['Space'] || keys['KeyZ']) {
        if (frameCount % 8 === 0) {
            const py = player.y - 20;
            if (player.power === 1) {
                playerBullets.push({ x: player.x, y: py, vx: 0, vy: -10, r: 4, dmg: 1 });
            } else if (player.power === 2) {
                playerBullets.push({ x: player.x - 5, y: py, vx: -0.5, vy: -10, r: 3, dmg: 1 });
                playerBullets.push({ x: player.x + 5, y: py, vx: 0.5, vy: -10, r: 3, dmg: 1 });
            } else {
                playerBullets.push({ x: player.x, y: py, vx: 0, vy: -12, r: 4, dmg: 1 });
                playerBullets.push({ x: player.x - 8, y: py, vx: -1.5, vy: -9, r: 3, dmg: 1 });
                playerBullets.push({ x: player.x + 8, y: py, vx: 1.5, vy: -9, r: 3, dmg: 1 });
            }
            playSound('square', 800, 0.04, 0.04);
        }
    }

    // Player bullets
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -20 || b.x < -20 || b.x > W + 20) {
            playerBullets.splice(i, 1);
            continue;
        }
        // Hit enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.abs(b.x - e.x) < e.w / 2 + b.r && Math.abs(b.y - e.y) < e.h / 2 + b.r) {
                e.hp -= b.dmg;
                playerBullets.splice(i, 1);
                spawnParticles(b.x, b.y, '#ffff00', 3);
                playSound('triangle', 200, 0.05, 0.08);
                if (e.hp <= 0) {
                    score += e.type === 2 ? 50 : (e.type === 1 ? 30 : 15);
                    spawnParticles(e.x, e.y, '#ff4400', 15);
                    playSound('sawtooth', 150, 0.2, 0.12);
                    spawnPowerup(e.x, e.y);
                    enemies.splice(j, 1);
                }
                break;
            }
        }
    }

    // Enemies
    let allDead = true;
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        allDead = false;
        e.y += e.speed;
        e.x += e.moveDir * 0.5;
        if (e.x < 30) e.moveDir = Math.abs(e.moveDir);
        if (e.x > W - 30) e.moveDir = -Math.abs(e.moveDir);

        e.fireTimer--;
        if (e.fireTimer <= 0 && e.y > 0 && e.y < H - 100) {
            firePattern(e);
            e.phase += 0.3;
            e.fireTimer = Math.max(40, 80 - wave * 3);
        }

        if (e.y > H + 50) {
            enemies.splice(i, 1);
        }
    }

    // Enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y > H + 30 || b.y < -30 || b.x < -30 || b.x > W + 30) {
            enemyBullets.splice(i, 1);
            continue;
        }
        // Hit player
        if (player.invincible <= 0) {
            const pdx = Math.abs(b.x - player.x);
            const pdy = Math.abs(b.y - player.y);
            if (pdx < 12 + b.r && pdy < 15 + b.r) {
                enemyBullets.splice(i, 1);
                lives--;
                player.invincible = 90;
                shakeTimer = 15;
                shakeIntensity = 8;
                spawnParticles(player.x, player.y, '#ff0000', 20);
                playSound('sawtooth', 60, 0.4, 0.2);
                if (lives <= 0) {
                    gameState = 'gameover';
                    try { localStorage.setItem('bulletHellHighScore', Math.max(score, parseInt(localStorage.getItem('bulletHellHighScore') || '0'))); } catch(e) {}
                }
            }
        }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        if (p.y > H + 20) { powerups.splice(i, 1); continue; }
        if (Math.abs(p.x - player.x) < 20 && Math.abs(p.y - player.y) < 20) {
            player.power = Math.min(player.power + 1, 3);
            spawnParticles(p.x, p.y, '#00ff88', 8);
            playSound('sine', 600, 0.15, 0.1);
            powerups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Spawn waves
    if (allDead && enemies.length === 0) {
        if (frameCount % 120 === 0 || wave === 0) spawnWave();
    } else if (enemies.length === 0 && frameCount % 180 === 0) {
        spawnWave();
    }

    // Shake decay
    if (shakeTimer > 0) shakeTimer--;
}

// Draw
function draw() {
    ctx.save();

    // Screen shake
    if (shakeTimer > 0) {
        const s = shakeIntensity * (shakeTimer / 15);
        ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#1a0a2a');
    ctx.fillStyle = grad;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Stars
    for (let s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size * 0.3})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }

    if (gameState === 'start') {
        drawStartScreen();
        ctx.restore();
        return;
    }

    // Particles
    for (let p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }

    // Powerups
    for (let p of powerups) {
        ctx.fillStyle = '#00ff88';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('P', p.x, p.y + 4);
    }

    // Player bullets
    for (let b of playerBullets) {
        ctx.fillStyle = '#00eeff';
        ctx.shadowColor = '#00eeff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Enemies
    for (let e of enemies) {
        const hpRatio = e.hp / e.maxHp;
        // Body
        ctx.fillStyle = e.type === 2 ? '#ff2244' : (e.type === 1 ? '#ff6622' : '#ffaa00');
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y + e.h / 2);
        ctx.lineTo(e.x - e.w / 2, e.y - e.h / 2);
        ctx.lineTo(e.x + e.w / 2, e.y - e.h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        // HP bar
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x - 15, e.y - e.h / 2 - 8, 30, 4);
        ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : (hpRatio > 0.25 ? '#ff0' : '#f00');
        ctx.fillRect(e.x - 15, e.y - e.h / 2 - 8, 30 * hpRatio, 4);

        // Eye/core
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(e.x, e.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Enemy bullets
    for (let b of enemyBullets) {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Player
    if (gameState === 'playing') {
        const px = player.x, py = player.y;
        if (player.invincible > 0 && Math.floor(frameCount / 4) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        } else {
            ctx.globalAlpha = 1;
        }

        // Ship body
        ctx.fillStyle = '#00eeff';
        ctx.shadowColor = '#00eeff';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(px, py - 18);
        ctx.lineTo(px - 14, py + 14);
        ctx.lineTo(px - 5, py + 8);
        ctx.lineTo(px + 5, py + 8);
        ctx.lineTo(px + 14, py + 14);
        ctx.closePath();
        ctx.fill();

        // Engine glow
        const engineFlicker = Math.random() * 6;
        ctx.fillStyle = `rgba(0,200,255,${0.5 + Math.random() * 0.3})`;
        ctx.beginPath();
        ctx.moveTo(px - 4, py + 10);
        ctx.lineTo(px, py + 18 + engineFlicker);
        ctx.lineTo(px + 4, py + 10);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }

    // HUD
    if (gameState === 'playing' || gameState === 'gameover') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 30);
        ctx.fillText(`WAVE: ${wave}`, 20, 55);

        // Lives
        for (let i = 0; i < lives; i++) {
            ctx.fillStyle = '#00eeff';
            ctx.beginPath();
            ctx.moveTo(W - 40 + i * 30, 20);
            ctx.lineTo(W - 48 + i * 30, 35);
            ctx.lineTo(W - 32 + i * 30, 35);
            ctx.closePath();
            ctx.fill();
        }

        // Power indicator
        ctx.fillStyle = '#00ff88';
        ctx.font = '14px monospace';
        ctx.fillText(`PWR: ${'▮'.repeat(player.power)}`, W - 120, 55);
    }

    if (gameState === 'gameover') {
        drawGameOver();
    }

    ctx.restore();
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00eeff';
    ctx.shadowBlur = 20;
    ctx.fillText('BULLET HELL', W / 2, H / 3);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#00eeff';
    ctx.fillText('~ SKYFALL ~', W / 2, H / 3 + 40);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    const lines = [
        'WASD / Arrows - Move',
        'SPACE / Z - Shoot',
        '',
        'Survive the waves. Collect power-ups.',
        'Don\'t get hit!',
        ''
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H / 2 + i * 28);
    });

    if (Math.floor(frameCount / 30) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('PRESS SPACE TO START', W / 2, H * 0.8);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W / 2, H / 3);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = '28px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 3 + 60);
    ctx.fillText(`WAVES CLEARED: ${wave}`, W / 2, H / 3 + 100);

    let high = 0;
    try { high = parseInt(localStorage.getItem('bulletHellHighScore') || '0'); } catch(e) {}
    if (score >= high && score > 0) {
        ctx.fillStyle = '#ffdd00';
        ctx.fillText('★ NEW HIGH SCORE! ★', W / 2, H / 3 + 145);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '20px monospace';
    ctx.fillText('PRESS SPACE TO RESTART', W / 2, H * 0.75);
}

// Main loop
initStars();
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
