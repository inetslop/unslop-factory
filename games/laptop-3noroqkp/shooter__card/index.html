<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Blaster</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    switch(type) {
        case 'shoot':
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
        case 'hit':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
        case 'explode':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            break;
        case 'die':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
        case 'gameover':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            osc.start(); osc.stop(audioCtx.currentTime + 0.8);
            break;
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let wave = 1;
let frameCount = 0;
let mouseX = W / 2;
let mouseY = H / 4;
let currentCard = 0; // 0=spade, 1=heart, 2=diamond, 3=club

const cardNames = ['Spade', 'Heart', 'Diamond', 'Club'];
const cardColors = ['#222', '#e74c3c', '#f39c12', '#27ae60'];
const cardSymbols = ['♠', '♥', '♦', '♣'];

let player = { x: 0, y: 0, angle: -Math.PI / 2 };
let bullets = [];
let enemies = [];
let particles = [];
let floatingTexts = [];
let spawnTimer = 0;
let spawnInterval = 60;

function resetGame() {
    score = 0;
    lives = 3;
    wave = 1;
    frameCount = 0;
    bullets = [];
    enemies = [];
    particles = [];
    floatingTexts = [];
    spawnTimer = 0;
    spawnInterval = 60;
    player.x = W / 2;
    player.y = H - 60;
    gameState = 'playing';
}

function spawnEnemy() {
    const types = ['basic', 'fast', 'tank', 'splitter'];
    let type = 'basic';
    if (wave >= 3 && Math.random() < 0.3) type = 'fast';
    if (wave >= 5 && Math.random() < 0.25) type = 'tank';
    if (wave >= 7 && Math.random() < 0.2) type = 'splitter';

    const baseHp = { basic: 1, fast: 1, tank: 3, splitter: 2 };
    const speedMult = { basic: 1, fast: 1.8, tank: 0.6, splitter: 1.2 };
    const sizeMult = { basic: 1, fast: 0.8, tank: 1.5, splitter: 1.2 };

    const baseSpeed = (1 + wave * 0.15) * speedMult[type];
    const e = {
        x: Math.random() * (W - 60) + 30,
        y: -40,
        hp: baseHp[type] + Math.floor(wave / 4),
        maxHp: baseHp[type] + Math.floor(wave / 4),
        speed: baseSpeed,
        size: 25 * sizeMult[type],
        type: type,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.03 + Math.random() * 0.02
    };
    enemies.push(e);
}

function fireBullet() {
    const speed = [8, 6, 7, 5][currentCard];
    const damage = [1, 1, 1, 1][currentCard];
    const b = {
        x: player.x,
        y: player.y,
        vx: Math.cos(player.angle) * speed,
        vy: Math.sin(player.angle) * speed,
        type: currentCard,
        damage: damage,
        size: [8, 10, 9, 12][currentCard],
        pierce: currentCard === 2 ? 3 : 1,
        explode: currentCard === 3
    };
    bullets.push(b);
    playSound('shoot');
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: color,
            size: 3 + Math.random() * 4
        });
    }
}

function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, life: 60 });
}

function explode(x, y) {
    playSound('explode');
    createParticles(x, y, '#ff6600', 20);
    for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        const dx = e.x - x;
        const dy = e.y - y;
        if (Math.sqrt(dx * dx + dy * dy) < 80) {
            e.hp -= 2;
            addFloatingText(e.x, e.y - 20, '-2', '#ff6600');
        }
    }
}

function update() {
    if (gameState !== 'playing') return;
    frameCount++;

    // Player follows mouse x
    player.x += (mouseX - player.x) * 0.15;
    player.y = H - 60;
    player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

    // Spawn enemies
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnEnemy();
        spawnTimer = 0;
        if (frameCount % 300 === 0 && wave < 15) {
            wave++;
            spawnInterval = Math.max(20, 60 - wave * 3);
            addFloatingText(W / 2, H / 2, 'Wave ' + wave, '#fff');
        }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
            bullets.splice(i, 1);
            continue;
        }

        // Check collision with enemies
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const dx = b.x - e.x;
            const dy = b.y - e.y;
            if (Math.sqrt(dx * dx + dy * dy) < e.size + b.size) {
                e.hp -= b.damage;
                createParticles(e.x, e.y, cardColors[b.type], 8);
                playSound('hit');

                if (b.explode) {
                    explode(b.x, b.y);
                }

                if (e.hp <= 0) {
                    const points = e.type === 'tank' ? 50 : e.type === 'splitter' ? 30 : e.type === 'fast' ? 20 : 10;
                    score += points;
                    addFloatingText(e.x, e.y, '+' + points, '#fff');
                    createParticles(e.x, e.y, cardColors[b.type], 15);
                    playSound('die');

                    if (e.type === 'splitter' && wave >= 7) {
                        for (let k = 0; k < 2; k++) {
                            enemies.push({
                                x: e.x + (k === 0 ? -15 : 15),
                                y: e.y,
                                hp: 1, maxHp: 1,
                                speed: e.speed * 1.3,
                                size: 18,
                                type: 'basic',
                                wobble: Math.random() * Math.PI * 2,
                                wobbleSpeed: 0.05
                            });
                        }
                    }

                    enemies.splice(j, 1);
                }

                if (b.pierce > 1) {
                    b.pierce--;
                } else {
                    hit = true;
                }
            }
        }
        if (hit) bullets.splice(i, 1);
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.wobble += e.wobbleSpeed;
        e.x += Math.sin(e.wobble) * 0.5;
        e.y += e.speed;

        if (e.y > H + 40) {
            enemies.splice(i, 1);
            lives--;
            playSound('gameover');
            createParticles(player.x, player.y, '#ff0000', 20);
            if (lives <= 0) {
                gameState = 'gameover';
                try { localStorage.setItem('cardblaster_highscore', Math.max(parseInt(localStorage.getItem('cardblaster_highscore') || '0'), score)); } catch(e) {}
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.y -= 1;
        t.life--;
        if (t.life <= 0) floatingTexts.splice(i, 1);
    }
}

function drawCard(x, y, type, size, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation || 0);
    const w = size * 1.2;
    const h = size * 1.6;
    // Card body
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, 4);
    ctx.fill();
    ctx.stroke();
    // Symbol
    ctx.fillStyle = cardColors[type];
    ctx.font = `bold ${size * 0.9}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cardSymbols[type], 0, 2);
    ctx.restore();
}

function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    // Card back style enemy
    const s = e.size;
    ctx.fillStyle = '#4a0e0e';
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-s / 2, -s * 0.65, s, s * 1.3, 5);
    ctx.fill();
    ctx.stroke();

    // Face/skull
    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${s * 0.7}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const face = e.type === 'tank' ? '🛡' : e.type === 'fast' ? '⚡' : e.type === 'splitter' ? '✖' : '💀';
    ctx.fillText(face, 0, 2);

    // HP bar
    if (e.maxHp > 1) {
        const bw = s * 0.9;
        ctx.fillStyle = '#333';
        ctx.fillRect(-bw / 2, -s * 0.85, bw, 4);
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(-bw / 2, -s * 0.85, bw * (e.hp / e.maxHp), 4);
    }

    ctx.restore();
}

function draw() {
    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    if (gameState === 'gameover') {
        drawGameOver();
        return;
    }

    // Draw bullets
    for (const b of bullets) {
        drawCard(b.x, b.y, b.type, b.size * 1.5, Math.atan2(b.vy, b.vx));
    }

    // Draw enemies
    for (const e of enemies) {
        drawEnemy(e);
    }

    // Draw particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw floating texts
    for (const t of floatingTexts) {
        ctx.globalAlpha = t.life / 60;
        ctx.fillStyle = t.color;
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    // Draw player (card dealer)
    ctx.save();
    ctx.translate(player.x, player.y);
    // Body
    ctx.fillStyle = '#2c3e50';
    ctx.strokeStyle = '#3498db';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Face
    ctx.fillStyle = '#ecf0f1';
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🎰', 0, 2);
    // Aim line
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    const aimLen = 80;
    ctx.lineTo(Math.cos(player.angle) * aimLen, Math.sin(player.angle) * aimLen);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Draw current card indicator
    drawCard(W / 2 - 50, H - 30, currentCard, 14, 0);

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 20, 35);
    ctx.fillText('Wave: ' + wave, 20, 60);

    // Lives
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#e74c3c';
        ctx.font = '20px serif';
        ctx.fillText('♥', W - 30 - i * 30, 35);
    }

    // Card selector
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i === currentCard ? '#fff' : '#666';
        ctx.fillText('[' + (i + 1) + ']', W / 2 - 90 + i * 30, H - 15);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Title cards
    const titleY = H / 2 - 80;
    for (let i = 0; i < 4; i++) {
        drawCard(W / 2 - 75 + i * 50, titleY, i, 20, Math.sin(Date.now() / 1000 + i) * 0.1);
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CARD BLASTER', W / 2, titleY + 70);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    const lines = [
        'Move: Mouse',
        'Shoot: Click / Space',
        'Switch Card: Keys 1-4',
        '',
        '♠ Fast bullet   ♥ Balanced',
        '♦ Piercing     ♣ Explosive',
        '',
        'Click to Start!'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, titleY + 120 + i * 28);
    });

    // High score
    let high = 0;
    try { high = parseInt(localStorage.getItem('cardblaster_highscore') || '0'); } catch(e) {}
    if (high > 0) {
        ctx.fillStyle = '#f39c12';
        ctx.font = '16px monospace';
        ctx.fillText('High Score: ' + high, W / 2, H - 40);
    }
}

function drawGameOver() {
    // Draw the game world dimmed
    for (const b of bullets) drawCard(b.x, b.y, b.type, b.size * 1.5, Math.atan2(b.vy, b.vx));
    for (const e of enemies) drawEnemy(e);

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 60);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText('Score: ' + score, W / 2, H / 2 - 10);
    ctx.fillText('Wave: ' + wave, W / 2, H / 2 + 30);

    let high = 0;
    try { high = parseInt(localStorage.getItem('cardblaster_highscore') || '0'); } catch(e) {}
    if (score >= high && score > 0) {
        ctx.fillStyle = '#f39c12';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 70);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    ctx.fillText('Press R or Click to Restart', W / 2, H / 2 + 120);
}

// Input
let mouseDown = false;
window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});
window.addEventListener('mousedown', (e) => {
    initAudio();
    if (gameState === 'start') {
        resetGame();
    } else if (gameState === 'playing') {
        mouseDown = true;
        fireBullet();
    } else if (gameState === 'gameover') {
        resetGame();
    }
});
window.addEventListener('mouseup', () => { mouseDown = false; });

let fireCooldown = 0;
function checkFiring() {
    if (gameState !== 'playing') return;
    const rates = [15, 20, 22, 30]; // frames between shots
    if (mouseDown && frameCount % rates[currentCard] === 0) {
        fireBullet();
    }
}

window.addEventListener('keydown', (e) => {
    initAudio();
    if (gameState === 'start') {
        resetGame();
    } else if (gameState === 'gameover' && (e.key === 'r' || e.key === 'R')) {
        resetGame();
    } else if (gameState === 'playing') {
        if (e.key === '1') currentCard = 0;
        if (e.key === '2') currentCard = 1;
        if (e.key === '3') currentCard = 2;
        if (e.key === '4') currentCard = 3;
        if (e.key === ' ') { e.preventDefault(); fireBullet(); }
    }
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    const touch = e.touches[0];
    mouseX = touch.clientX;
    mouseY = touch.clientY;
    if (gameState === 'start') resetGame();
    else if (gameState === 'playing') { mouseDown = true; fireBullet(); }
    else if (gameState === 'gameover') resetGame();
});
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    mouseX = touch.clientX;
    mouseY = touch.clientY;
});
canvas.addEventListener('touchend', () => { mouseDown = false; });

// Polyfill for roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.arcTo(x + w, y, x + w, y + r, r);
        this.lineTo(x + w, y + h - r);
        this.arcTo(x + w, y + h, x + w - r, y + h, r);
        this.lineTo(x + r, y + h);
        this.arcTo(x, y + h, x, y + h - r, r);
        this.lineTo(x, y + r);
        this.arcTo(x, y, x + r, y, r);
        this.closePath();
    };
}

// Main loop
function gameLoop() {
    update();
    checkFiring();
    draw();
    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>
</body>
</html>
