<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Stealth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Courier New', monospace; }
#container { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
canvas { display: block; image-rendering: pixelated; }
#typing-area {
  width: 100%; max-width: 700px; margin-top: 8px; padding: 12px 20px;
  background: #1a1a2e; border: 1px solid #333; border-radius: 4px;
  display: flex; align-items: center; gap: 10px;
}
#word-display { color: #7fdbff; font-size: 20px; letter-spacing: 2px; white-space: nowrap; }
#typed-display { color: #555; font-size: 20px; letter-spacing: 2px; white-space: nowrap; }
#typed-correct { color: #4ecdc4; }
#typed-wrong { color: #ff6b6b; }
#hud {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 20px; align-items: center; z-index: 10;
}
.hud-item { color: #aaa; font-size: 14px; }
#stealth-bar-container {
  width: 150px; height: 12px; background: #222; border: 1px solid #444; border-radius: 3px; overflow: hidden;
}
#stealth-bar { height: 100%; transition: width 0.1s; background: linear-gradient(90deg, #ff6b6b, #4ecdc4); }
#screen {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(5,5,10,0.95); z-index: 100;
}
#screen h1 { color: #4ecdc4; font-size: 48px; text-shadow: 0 0 20px #4ecdc4; margin-bottom: 20px; }
#screen p { color: #aaa; font-size: 16px; line-height: 1.8; text-align: center; max-width: 500px; }
#screen .key { background: #2a2a3e; padding: 2px 8px; border-radius: 3px; border: 1px solid #444; color: #fff; }
#start-btn, #restart-btn {
  margin-top: 30px; padding: 12px 40px; font-size: 18px; font-family: inherit;
  background: #1a1a2e; color: #4ecdc4; border: 2px solid #4ecdc4; border-radius: 4px;
  cursor: pointer; transition: all 0.2s;
}
#start-btn:hover, #restart-btn:hover { background: #4ecdc4; color: #0a0a0f; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="container">
  <div id="hud" class="hidden">
    <div class="hud-item">STEALTH <div id="stealth-bar-container"><div id="stealth-bar" style="width:100%"></div></div></div>
    <div class="hud-item" id="level-display">LEVEL 1</div>
    <div class="hud-item" id="time-display">0:00</div>
  </div>
  <canvas id="game"></canvas>
  <div id="typing-area">
    <span id="word-display"></span>
    <span id="typed-display"></span>
  </div>
</div>
<div id="screen">
  <h1>TYPE STEALTH</h1>
  <p>
    You are a spy. Type the words shown to maintain your invisibility cloak.<br><br>
    <span class="key">W A S D</span> / <span class="key">↑ ← ↓ →</span> Move<br>
    Type letters to fill your stealth meter.<br>
    If stealth hits zero, guards will see you!<br><br>
    Reach the <span style="color:#4ecdc4">green exit</span> in each level.<br>
    Don't get caught. Survive all levels.
  </p>
  <button id="start-btn" onclick="startGame()">START MISSION</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudEl = document.getElementById('hud');
const screenEl = document.getElementById('screen');
const wordDisplay = document.getElementById('word-display');
const typedDisplay = document.getElementById('typed-display');
const stealthBar = document.getElementById('stealth-bar');
const levelDisplay = document.getElementById('level-display');
const timeDisplay = document.getElementById('time-display');

let W, H;
let gameRunning = false;
let animFrame;
let lastTime = 0;

const TILE = 40;
let cols, rows;

// Words for typing
const WORDS = [
  "shadow","ghost","night","dark","sneak","stealth","cloak","mist",
  "phantom","silence","secret","hidden","conceal","invis","spy",
  "agent","mission","danger","alert","watch","patrol","guard",
  "alarm","silent","quick","swift","smooth","quiet","hush","muffle"
];

// Game state
let player = { x: 0, y: 0, vx: 0, vy: 0 };
let guards = [];
let walls = [];
let exitTile = { x: 0, y: 0 };
let level = 1;
let maxLevel = 5;
let stealth = 100;
let currentWord = "";
let typedStr = "";
let gameTime = 0;
let caught = false;
let caughtTimer = 0;
let particles = [];
let audioCtx = null;

function resize() {
    const maxW = Math.min(window.innerWidth - 20, 800);
    const maxH = window.innerHeight - 100;
    W = maxW;
    H = Math.max(300, maxH);
    canvas.width = W;
    canvas.height = H;
}

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}

function playTone(freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

function playType() { playTone(800 + Math.random()*200, 0.05, 0.1); }
function playError() { playTone(200, 0.1, 0.15); }
function playAlert() { playTone(400, 0.3, 0.2); setTimeout(()=>playTone(400, 0.3, 0.2), 200); }
function playWin() { playTone(523, 0.15, 0.15); setTimeout(()=>playTone(659, 0.15, 0.15), 100); setTimeout(()=>playTone(784, 0.2, 0.15), 200); }
function playCaught() { playTone(150, 0.5, 0.3); }

function generateLevel(lvl) {
    cols = Math.floor(W / TILE);
    rows = Math.floor(H / TILE);
    walls = [];
    guards = [];
    
    // Generate maze-like walls
    const wallDensity = 0.2 + lvl * 0.05;
    for (let r = 1; r < rows - 1; r++) {
        for (let c = 1; c < cols - 1; c++) {
            if (Math.random() < wallDensity) {
                walls.push({ x: c, y: r });
            }
        }
    }
    
    // Ensure start and exit areas are clear
    player.x = TILE * 2 + TILE/2;
    player.y = TILE * 2 + TILE/2;
    clearAround(player.x / TILE, player.y / TILE);
    
    // Exit in far area
    exitTile = { x: cols - 3, y: rows - 3 };
    clearAround(exitTile.x, exitTile.y);
    
    // Guards
    const guardCount = Math.min(2 + lvl, 6);
    for (let i = 0; i < guardCount; i++) {
        let gx, gy, attempts = 0;
        do {
            gx = Math.floor(Math.random() * (cols - 4)) + 2;
            gy = Math.floor(Math.random() * (rows - 4)) + 2;
            attempts++;
        } while ((Math.abs(gx - 2) < 3 && Math.abs(gy - 2) < 3) || isWall(gx, gy));
        
        const dir = Math.floor(Math.random() * 4);
        guards.push({
            x: gx * TILE + TILE/2,
            y: gy * TILE + TILE/2,
            dir: dir,
            speed: (1.5 + lvl * 0.3) * TILE / 60,
            path: [],
            pathTimer: 0,
            alertLevel: 0
        });
    }
    
    // Clear guard start areas
    guards.forEach(g => clearAround(g.x/TILE, g.y/TILE));
}

function isWall(c, r) {
    return walls.some(w => w.x === c && w.y === r);
}

function clearAround(cx, cy) {
    for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
            const nx = Math.floor(cx) + dc;
            const ny = Math.floor(cy) + dr;
            walls = walls.filter(w => !(w.x === nx && w.y === ny));
        }
    }
}

function nextWord() {
    currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
    typedStr = "";
    wordDisplay.textContent = currentWord;
    typedDisplay.innerHTML = "";
}

function updateStealth(dt) {
    if (!gameRunning) return;
    // Stealth decays over time
    stealth -= dt * 8;
    if (stealth < 0) stealth = 0;
    if (stealth > 100) stealth = 100;
    stealthBar.style.width = stealth + '%';
    
    if (stealth <= 0 && !caught) {
        // Visible! Check guards
    }
}

function updateGuards(dt) {
    guards.forEach(g => {
        g.pathTimer -= dt;
        if (g.pathTimer <= 0 || g.path.length === 0) {
            // Pick new direction
            const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
            const validDirs = dirs.filter(d => {
                const nx = g.x + d[0]*TILE;
                const ny = g.y + d[1]*TILE;
                return !isWall(Math.floor(nx/TILE), Math.floor(ny/TILE));
            });
            if (validDirs.length > 0) {
                const dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                g.dir = dirs.indexOf(dir);
                g.path = [{ x: g.x + dir[0]*TILE, y: g.y + dir[1]*TILE }];
            }
            g.pathTimer = 1 + Math.random() * 2;
        }
        
        if (g.path.length > 0) {
            const target = g.path[0];
            const dx = target.x - g.x;
            const dy = target.y - g.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < g.speed * dt) {
                g.x = target.x;
                g.y = target.y;
                g.path.shift();
            } else {
                g.x += (dx/dist) * g.speed * dt;
                g.y += (dy/dist) * g.speed * dt;
            }
        }
        
        // Check if player is visible and in range
        if (stealth <= 0 && !caught) {
            const px = player.x - g.x;
            const py = player.y - g.y;
            const dist = Math.sqrt(px*px + py*py);
            if (dist < TILE * 3.5) {
                // Check line of sight (simplified - no wall check for now, just distance + angle)
                const guardAngle = Math.atan2(py, px);
                const viewAngle = Math.PI / 3;
                let diff = guardAngle - g.dir * Math.PI/2;
                while (diff > Math.PI) diff -= Math.PI*2;
                while (diff < -Math.PI) diff += Math.PI*2;
                if (Math.abs(diff) < viewAngle) {
                    caught = true;
                    playCaught();
                    setTimeout(showGameOver, 1500);
                }
            }
        }
    });
}

function updatePlayer(dt) {
    const speed = 3 * TILE / 60;
    let dx = 0, dy = 0;
    if (keys['w'] || keys['ArrowUp']) dy = -1;
    if (keys['s'] || keys['ArrowDown']) dy = 1;
    if (keys['a'] || keys['ArrowLeft']) dx = -1;
    if (keys['d'] || keys['ArrowRight']) dx = 1;
    
    const nx = player.x + dx * speed * dt * 60;
    const ny = player.y + dy * speed * dt * 60;
    
    // Collision with walls
    const pr = 12;
    let canMoveX = true, canMoveY = true;
    
    if (dx !== 0) {
        const checkX = nx + (dx > 0 ? pr : -pr);
        const cc = Math.floor(checkX / TILE);
        const rc = Math.floor(player.y / TILE);
        for (let dr = -1; dr <= 1; dr++) {
            if (isWall(cc, rc + dr)) canMoveX = false;
        }
    }
    if (dy !== 0) {
        const checkY = ny + (dy > 0 ? pr : -pr);
        const rc = Math.floor(checkY / TILE);
        const cc = Math.floor(player.x / TILE);
        for (let dc = -1; dc <= 1; dc++) {
            if (isWall(cc + dc, rc)) canMoveY = false;
        }
    }
    
    if (canMoveX) player.x = nx;
    if (canMoveY) player.y = ny;
    
    // Clamp
    player.x = Math.max(pr, Math.min(W - pr, player.x));
    player.y = Math.max(pr, Math.min(H - pr, player.y));
    
    // Check exit
    const ec = Math.floor(player.x / TILE);
    const er = Math.floor(player.y / TILE);
    if (ec === exitTile.x && er === exitTile.y) {
        level++;
        playWin();
        if (level > maxLevel) {
            showVictory();
            return;
        }
        generateLevel(level);
        nextWord();
        stealth = 100;
    }
}

function updateParticles(dt) {
    particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
    });
    particles = particles.filter(p => p.life > 0);
}

function render() {
    ctx.fillStyle = '#0d0d15';
    ctx.fillRect(0, 0, W, H);
    
    // Grid (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += TILE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += TILE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    
    // Walls
    walls.forEach(w => {
        const wx = w.x * TILE, wy = w.y * TILE;
        ctx.fillStyle = '#2a2a3e';
        ctx.fillRect(wx, wy, TILE, TILE);
        ctx.strokeStyle = '#3a3a5e';
        ctx.strokeRect(wx+1, wy+1, TILE-2, TILE-2);
    });
    
    // Exit
    const ex = exitTile.x * TILE, ey = exitTile.y * TILE;
    ctx.fillStyle = 'rgba(78, 205, 196, 0.3)';
    ctx.fillRect(ex, ey, TILE, TILE);
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = 2;
    ctx.strokeRect(ex + 4, ey + 4, TILE - 8, TILE - 8);
    ctx.fillStyle = '#4ecdc4';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', ex + TILE/2, ey + TILE/2 + 3);
    
    // Guards
    guards.forEach(g => {
        // Vision cone
        const angle = g.dir * Math.PI / 2;
        const viewDist = TILE * 3.5;
        const viewAngle = Math.PI / 3;
        
        ctx.beginPath();
        ctx.moveTo(g.x, g.y);
        ctx.arc(g.x, g.y, viewDist, angle - viewAngle, angle + viewAngle);
        ctx.closePath();
        
        if (stealth <= 0) {
            ctx.fillStyle = 'rgba(255, 100, 100, 0.15)';
        } else {
            ctx.fillStyle = 'rgba(255, 200, 100, 0.08)';
        }
        ctx.fill();
        
        // Guard body
        ctx.beginPath();
        ctx.arc(g.x, g.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = stealth <= 0 ? '#ff6b6b' : '#e8a838';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Eyes (direction indicator)
        const eyeX = g.x + Math.cos(angle) * 8;
        const eyeY = g.y + Math.sin(angle) * 8;
        ctx.beginPath();
        ctx.arc(eyeX, eyeY, 4, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        
        // "!" when player visible
        if (stealth <= 0) {
            ctx.fillStyle = '#ff0';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('!', g.x, g.y - 20);
        }
    });
    
    // Player
    const playerAlpha = Math.max(0.2, stealth / 100);
    ctx.globalAlpha = playerAlpha;
    ctx.beginPath();
    ctx.arc(player.x, player.y, 14, 0, Math.PI * 2);
    ctx.fillStyle = '#4ecdc4';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Player glow when stealthy
    if (stealth > 50) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, 20, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(78, 205, 196, ${(stealth-50)/100})`;
        ctx.lineWidth = 3;
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
    
    // Particles
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${p.life})`;
        ctx.fill();
    });
    
    // Caught overlay
    if (caught) {
        ctx.fillStyle = `rgba(255, 0, 0, ${Math.min(caughtTimer * 0.5, 0.6)})`;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('DETECTED!', W/2, H/2);
    }
}

function showGameOver() {
    gameRunning = false;
    screenEl.classList.remove('hidden');
    screenEl.innerHTML = `<h1 style="color:#ff6b6b">CAUGHT!</h1>
        <p>You were spotted by a guard at level ${level}.<br>Time: ${formatTime(gameTime)}</p>
        <button id="restart-btn" onclick="startGame()">TRY AGAIN</button>`;
}

function showVictory() {
    gameRunning = false;
    screenEl.classList.remove('hidden');
    screenEl.innerHTML = `<h1 style="color:#4ecdc4">MISSION COMPLETE</h1>
        <p>All ${maxLevel} levels cleared!<br>Total time: ${formatTime(gameTime)}</p>
        <button id="restart-btn" onclick="startGame()">PLAY AGAIN</button>`;
}

function formatTime(t) {
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
}

let keys = {};
window.addEventListener('keydown', e => {
    if (!gameRunning) return;
    keys[e.key] = true;
    
    // Typing logic
    if (e.key.length === 1 && currentWord) {
        const expected = currentWord[typedStr.length];
        const typed = e.key.toLowerCase();
        
        if (typed === expected) {
            playType();
            stealth = Math.min(100, stealth + 8);
            typedStr += typed;
            
            // Add particle
            particles.push({ x: player.x, y: player.y - 20, vx: (Math.random()-0.5)*30, vy: -40, life: 0.5, size: 3, r:78, g:205, b:196 });
            
            if (typedStr.length === currentWord.length) {
                // Word complete bonus
                stealth = 100;
                playWin();
                nextWord();
            } else {
                updateTypedDisplay();
            }
        } else {
            playError();
            stealth = Math.max(0, stealth - 5);
            updateTypedDisplay(e.key);
        }
    }
});

window.addEventListener('keyup', e => { keys[e.key] = false; });

function updateTypedDisplay(wrongKey) {
    let html = '';
    for (let i = 0; i < typedStr.length; i++) {
        html += `<span id="typed-correct">${typedStr[i]}</span>`;
    }
    if (wrongKey) {
        html += `<span id="typed-wrong">${wrongKey}</span>`;
        setTimeout(() => { updateTypedDisplay(); }, 300);
    }
    typedDisplay.innerHTML = html;
}

function startGame() {
    initAudio();
    screenEl.classList.add('hidden');
    hudEl.classList.remove('hidden');
    
    level = 1;
    gameTime = 0;
    stealth = 100;
    caught = false;
    particles = [];
    
    generateLevel(1);
    nextWord();
    
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
    if (!gameRunning) return;
    
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    gameTime += dt;
    timeDisplay.textContent = formatTime(gameTime);
    levelDisplay.textContent = `LEVEL ${level}/${maxLevel}`;
    
    updateStealth(dt);
    updatePlayer(dt);
    if (!caught) {
        updateGuards(dt);
    } else {
        caughtTimer += dt;
    }
    updateParticles(dt);
    
    render();
    
    animFrame = requestAnimationFrame(gameLoop);
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
