<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game state
let gameState = 'start'; // start, playing, gameover
let scoreLeft = 0, scoreRight = 0;
const WIN_SCORE = 5;
let winner = '';
let audioCtx = null;

// Paddle settings
const PADDLE_W = 20;
const PADDLE_H_RATIO = 0.18;
const BALL_R = 10;
const PADDLE_SPEED = 7;
const AI_SPEED = 5.5;

let paddleL, paddleR, ball;
let particles = [];
let trailParticles = [];

function initGame() {
    const ph = Math.max(60, H * PADDLE_H_RATIO);
    paddleL = { x: 40, y: H/2 - ph/2, w: PADDLE_W, h: ph, vy: 0 };
    paddleR = { x: W - 40 - PADDLE_W, y: H/2 - ph/2, w: PADDLE_W, h: ph, vy: 0 };
    resetBall();
    scoreLeft = 0;
    scoreRight = 0;
    particles = [];
    trailParticles = [];
}

function resetBall() {
    const angle = (Math.random() - 0.5) * Math.PI * 0.6;
    ball = { x: W/2, y: H/2, vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5 };
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initGame();
        gameState = 'playing';
        initAudio();
    }
    if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
        initGame();
        gameState = 'playing';
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Audio
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}

function playSound(freq, duration, type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playBounce() { playSound(220, 0.1, 'square'); }
function playScore() { playSound(440, 0.3, 'triangle'); }
function playWin() { 
    playSound(523, 0.2, 'square');
    setTimeout(() => playSound(659, 0.2, 'square'), 150);
    setTimeout(() => playSound(784, 0.4, 'square'), 300);
}

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 60, maxLife: 60, color, size: Math.random()*4+2 });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function spawnTrail(x, y) {
    trailParticles.push({ x, y, life: 20, maxLife: 20 });
}

// Update
let chompFrame = 0;
let ghostBob = 0;

function update() {
    if (gameState !== 'playing') return;

    // Pac-Man movement (W/S)
    if (keys['KeyW'] || keys['ArrowUp']) paddleL.y -= PADDLE_SPEED;
    if (keys['KeyS'] || keys['ArrowDown']) paddleL.y += PADDLE_SPEED;
    paddleL.y = Math.max(0, Math.min(H - paddleL.h, paddleL.y));

    // Blinky AI or player 2 (Up/Down)
    let useAI = true;
    if (keys['KeyI'] || keys['KeyK']) useAI = false;

    if (useAI) {
        const targetY = ball.y - paddleR.h / 2;
        const diff = targetY - paddleR.y;
        if (Math.abs(diff) > 10) {
            paddleR.y += Math.sign(diff) * AI_SPEED;
        } else {
            paddleR.y += Math.sign(diff) * AI_SPEED * 0.5;
        }
    } else {
        if (keys['KeyI']) paddleR.y -= PADDLE_SPEED;
        if (keys['KeyK']) paddleR.y += PADDLE_SPEED;
    }
    paddleR.y = Math.max(0, Math.min(H - paddleR.h, paddleR.y));

    // Ball trail
    spawnTrail(ball.x, ball.y);
    for (let i = trailParticles.length - 1; i >= 0; i--) {
        trailParticles[i].life--;
        if (trailParticles[i].life <= 0) trailParticles.splice(i, 1);
    }

    // Ball movement
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Top/bottom bounce
    if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); playBounce(); }
    if (ball.y + BALL_R >= H) { ball.y = H - BALL_R; ball.vy = -Math.abs(ball.vy); playBounce(); }

    // Paddle collision
    // Left paddle
    if (ball.vx < 0 && ball.x - BALL_R <= paddleL.x + paddleL.w && ball.x - BALL_R > paddleL.x &&
        ball.y >= paddleL.y && ball.y <= paddleL.y + paddleL.h) {
        ball.x = paddleL.x + paddleL.w + BALL_R;
        const hitPos = (ball.y - paddleL.y) / paddleL.h - 0.5;
        ball.vx = Math.abs(ball.vx) * 1.02;
        ball.vy += hitPos * 3;
        playBounce();
        spawnParticles(ball.x, ball.y, '#ffff00', 8);
    }

    // Right paddle
    if (ball.vx > 0 && ball.x + BALL_R >= paddleR.x && ball.x + BALL_R < paddleR.x + paddleR.w &&
        ball.y >= paddleR.y && ball.y <= paddleR.y + paddleR.h) {
        ball.x = paddleR.x - BALL_R;
        const hitPos = (ball.y - paddleR.y) / paddleR.h - 0.5;
        ball.vx = -Math.abs(ball.vx) * 1.02;
        ball.vy += hitPos * 3;
        playBounce();
        spawnParticles(ball.x, ball.y, '#ff0000', 8);
    }

    // Limit vy
    if (Math.abs(ball.vy) > 8) ball.vy = Math.sign(ball.vy) * 8;
    if (Math.abs(ball.vx) > 12) ball.vx = Math.sign(ball.vx) * 12;

    // Score
    if (ball.x < -BALL_R) {
        scoreRight++;
        spawnParticles(0, ball.y, '#ff0000', 20);
        playScore();
        if (scoreRight >= WIN_SCORE) { winner = 'Blinky'; gameState = 'gameover'; playWin(); }
        else resetBall();
    }
    if (ball.x > W + BALL_R) {
        scoreLeft++;
        spawnParticles(W, ball.y, '#ffff00', 20);
        playScore();
        if (scoreLeft >= WIN_SCORE) { winner = 'Pac-Man'; gameState = 'gameover'; playWin(); }
        else resetBall();
    }

    // Chomp animation
    chompFrame += 0.15;
    ghostBob += 0.08;
}

// Draw
function drawMaze() {
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    const cell = 40;
    for (let x = 0; x < W; x += cell) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += cell) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
}

function drawPacMan(x, y, size) {
    const mouthAngle = Math.abs(Math.sin(chompFrame)) * 0.5 + 0.1;
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, size, mouthAngle - Math.PI/2, -mouthAngle + Math.PI/2, false);
    ctx.closePath();
    ctx.fill();

    // Glow
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, size, mouthAngle - Math.PI/2, -mouthAngle + Math.PI/2, false);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawGhost(x, y, size) {
    const bob = Math.sin(ghostBob) * 3;
    const gy = y + bob;
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    // Body
    ctx.moveTo(x - size, gy + size);
    ctx.lineTo(x - size, gy - size * 0.5);
    ctx.arc(x, gy - size * 0.5, size, Math.PI, 0);
    ctx.lineTo(x + size, gy + size);
    // Wavy bottom
    const waves = 4;
    const wSize = (size * 2) / waves;
    for (let i = 0; i < waves; i++) {
        const wx = x + size - wSize * (i + 1);
        const wy = gy + size - (i % 2 === 0 ? 8 : 0);
        ctx.quadraticCurveTo(wx + wSize/2, gy + size + (i%2===0?4:-4), wx, gy + size);
    }
    ctx.closePath();
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(x - size*0.35, gy - size*0.1, size*0.25, size*0.3, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + size*0.35, gy - size*0.1, size*0.25, size*0.3, 0, 0, Math.PI*2);
    ctx.fill();

    // Pupils (look at ball)
    const dx = ball.x - x;
    const dy = ball.y - gy;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    const px = (dx/dist) * size * 0.1;
    const py = (dy/dist) * size * 0.12;
    ctx.fillStyle = '#00f';
    ctx.beginPath();
    ctx.arc(x - size*0.35 + px, gy - size*0.1 + py, size*0.12, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + size*0.35 + px, gy - size*0.1 + py, size*0.12, 0, Math.PI*2);
    ctx.fill();
}

function drawBall() {
    // Trail
    for (const t of trailParticles) {
        const alpha = t.life / t.maxLife;
        ctx.fillStyle = `rgba(255, 255, 100, ${alpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, BALL_R * alpha * 0.7, 0, Math.PI*2);
        ctx.fill();
    }

    // Ball glow
    ctx.shadowColor = '#ffff66';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner glow
    const grad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_R);
    grad.addColorStop(0, 'rgba(255,255,200,1)');
    grad.addColorStop(1, 'rgba(255,255,100,0.3)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
    ctx.fill();
}

function drawWalls() {
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 8;
    ctx.fillRect(0, 0, W, 4);
    ctx.fillRect(0, H-4, W, 4);
    ctx.shadowBlur = 0;
}

function drawScore() {
    // Left score - dots (Pac-Man style)
    for (let i = 0; i < WIN_SCORE; i++) {
        const sx = W/2 - 150 + i * 30;
        ctx.fillStyle = i < scoreLeft ? '#ffff00' : '#333';
        ctx.beginPath();
        ctx.arc(sx, 40, 6, 0, Math.PI*2);
        ctx.fill();
    }
    // Right score
    for (let i = 0; i < WIN_SCORE; i++) {
        const sx = W/2 + 50 - i * 30;
        ctx.fillStyle = i < scoreRight ? '#ff0000' : '#333';
        ctx.beginPath();
        ctx.arc(sx, 40, 6, 0, Math.PI*2);
        ctx.fill();
    }

    // Labels
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffff00';
    ctx.fillText('PAC-MAN', W/2 - 150, 75);
    ctx.fillStyle = '#ff0000';
    ctx.fillText('BLINKY', W/2 + 50, 75);
}

function drawStartScreen() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawMaze();
    drawWalls();

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 60px monospace';
    ctx.fillStyle = '#ffff00';
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur = 20;
    ctx.fillText('PAC-MAN', W/2, H/2 - 80);
    ctx.font = 'bold 40px monospace';
    ctx.fillStyle = '#ff0000';
    ctx.shadowColor = '#ff0000';
    ctx.fillText('P O N G', W/2, H/2 - 30);
    ctx.shadowBlur = 0;

    // Draw demo pac-man and ghost
    drawPacMan(W/2 - 120, H/2 + 40, 25);
    drawGhost(W/2 + 120, H/2 + 40, 25);

    // Ball between them
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ffff66';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(W/2, H/2 + 40, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Controls
    ctx.font = '20px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('W / S  —  Move Pac-Man (Left)', W/2, H/2 + 110);
    ctx.fillText('I / K  —  Move Blinky (Right)  [or AI]', W/2, H/2 + 145);
    ctx.fillText('First to ' + WIN_SCORE + ' wins!', W/2, H/2 + 190);

    // Blinking prompt
    if (Math.floor(Date.now() / 600) % 2 === 0) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px monospace';
        ctx.fillText('Press SPACE to Start', W/2, H/2 + 250);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 50px monospace';
    if (winner === 'Pac-Man') {
        ctx.fillStyle = '#ffff00';
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 20;
        ctx.fillText('PAC-MAN WINS!', W/2, H/2 - 40);
    } else {
        ctx.fillStyle = '#ff0000';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 20;
        ctx.fillText('BLINKY WINS!', W/2, H/2 - 40);
    }
    ctx.shadowBlur = 0;

    // Draw winner
    if (winner === 'Pac-Man') {
        drawPacMan(W/2, H/2 + 30, 35);
    } else {
        drawGhost(W/2, H/2 + 30, 35);
    }

    ctx.font = '24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Final Score: ' + scoreLeft + ' - ' + scoreRight, W/2, H/2 + 100);

    if (Math.floor(Date.now() / 600) % 2 === 0) {
        ctx.font = 'bold 22px monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Press SPACE to Play Again', W/2, H/2 + 150);
    }
}

// Main loop
function draw() {
    ctx.clearRect(0, 0, W, H);

    if (gameState === 'start') {
        drawStartScreen();
    } else {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);
        drawMaze();
        drawWalls();
        drawScore();

        // Draw paddles as characters
        const pacSize = paddleL.h / 3;
        drawPacMan(paddleL.x + paddleL.w/2, paddleL.y + paddleL.h/2, pacSize);

        const ghostSize = paddleR.h / 3.5;
        drawGhost(paddleR.x + paddleR.w/2, paddleR.y + paddleR.h/2, ghostSize);

        drawBall();

        // Particles
        for (const p of particles) {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('#', 'rgb(').replace(/rgb\(([^)]+)\)/, '');
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        if (gameState === 'gameover') {
            drawGameOver();
        }
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
