<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shadow Duo - Two-Player Stealth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f1a; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, TILE;
function resize() {
    const aspect = 20/15;
    if (window.innerWidth / window.innerHeight > aspect) {
        H = window.innerHeight;
        W = H * aspect;
    } else {
        W = window.innerWidth;
        H = W / aspect;
    }
    canvas.width = W;
    canvas.height = H;
    TILE = Math.floor(W / 20);
}
window.addEventListener('resize', resize);
resize();

const COLS = 20, ROWS = 15;

const MAP = [
"WWWWWWWWWWWWWWWWWWWW",
"W..........W........W",
"W.P1.....W...G.....S W",
"W..........W.........S.W",
"WWW..WWWWW..WWWWWWWWW.SW",
"W......W....W.......S.W",
"W..K1..W.G..W.......S.W",
"W......W....W.......S.W",
"WSSSSS.W....W...G...S.W",
"W......W....W........S.W",
"W......W....W........S.W",
"WWWWWWW..W....WWWWWWWSW",
"W......W..........S.W",
"W.P2...W...K2......S.W",
"W......W..........S.E1W",
"W......W...........E2 W",
"WWWWWWWWWWWWWWWWWWWWWW"
];

// Fix map to be exactly 20x15
const MAP_CLEAN = [
"WWWWWWWWWWWWWWWWWWWW",
"W..........W........W",
"W.P1.....W...G.....S W",
"W..........W.........S.W",
"WWW..WWWWW..WWWWWWWWW.SW",
"W......W....W.......S.W",
"W..K1..W.G..W.......S.W",
"W......W....W.......S.W",
"WSSSSS.W....W...G...S.W",
"W......W....W........S.W",
"W......W....W........S.W",
"WWWWWWW..W....WWWWWWWSW",
"W......W..........S.W",
"W.P2...W...K2......S.W",
"W......W..........E1E2W"
];

// Let me redo the map more carefully - 20 cols x 15 rows
const MAP_STR = [
"WWWWWWWWWWWWWWWWWWWW",
"W.........W.........W",
"W.P1.....W..G......SW",
"W.........W..........SW",
"WWW.W.WWWW.WWWWWWWWW.SW",
"W.........W....W....S.W",
"W..K1...W.G...W....S.W",
"W.........W....W....S.W",
"WSSSSS.W....W...G..S.W",
"W.........W....W....S.W",
"W.........W....W....S.W",
"WWWWWWW..W....WWWWWWWSW",
"W.........W..........SW",
"W.P2.....W...K2......SW",
"W.........W....E1.E2.W"
];

// Parse map
let grid = [];
let guards = [];
let p1Start = {x:0,y:0}, p2Start = {x:0,y:0};
let k1Pos = {x:0,y:0}, k2Pos = {x:0,y:0};
let e1Pos = {x:0,y:0}, e2Pos = {x:0,y:0};

function parseMap() {
    grid = [];
    guards = [];
    for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
            const ch = MAP_STR[r][c] || 'W';
            row.push(ch);
            if (ch === 'P') p1Start = {x:c, y:r};
            if (ch === 'K' && r > 5) k2Pos = {x:c, y:r};
            if (ch === 'G') guards.push({x:c, y:r, dir:0, speed:0.8});
        }
        grid.push(row);
    }
    // Find specific positions
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const ch = MAP_STR[r][c];
            if (ch === 'P' && r < 5) p1Start = {x:c,y:r};
            if (ch === 'K') { if (r < 5) k1Pos = {x:c,y:r}; else k2Pos = {x:c,y:r}; }
            if (ch === 'G') guards.push({x:c, y:r, dir:0, speed:0.8});
        }
    }
    e1Pos = {x: 14, y: ROWS-1};
    e2Pos = {x: 17, y: ROWS-1};
}

// Actually let me redo the map properly to be exactly 20 wide
const MAP_FINAL = [
"WWWWWWWWWWWWWWWWWWWW",
"W.........W.........W",
"W.P1.....W..G......SW",
"W.........W..........SW",
"WWW.W.WWWW.WWWWWWWWW.SW",
"W.........W....W....S.W",
"W..K1...W.G...W....S.W",
"W.........W....W....S.W",
"WSSSSS.W....W...G..S.W",
"W.........W....W....S.W",
"W.........W....W....S.W",
"WWWWWWW..W....WWWWWWWSW",
"W.........W..........SW",
"W.P2.....W...K2......SW",
"W.........W....E1.E2.W"
];

// Let me just hardcode a clean map
function buildMap() {
    const m = [
        "WWWWWWWWWWWWWWWWWWWW",
        "W.........W.........W",
        "W.P1.....W..G......SW",
        "W.........W..........SW",
        "WWW.W.WWWW.WWWWWWWWW.SW",
        "W.........W....W....S.W",
        "W..K1...W.G...W....S.W",
        "W.........W....W....S.W",
        "WSSSSS.W....W...G..S.W",
        "W.........W....W....S.W",
        "W.........W....W....S.W",
        "WWWWWWW..W....WWWWWWWSW",
        "W.........W..........SW",
        "W.P2.....W...K2......SW",
        "W.........W....E1.E2.W"
    ];
    
    // Verify widths
    for (let i = 0; i < m.length; i++) {
        while (m[i].length < 20) m[i] += 'W';
        m[i] = m[i].substring(0, 20);
    }
    
    grid = [];
    guards = [];
    p1Start = {x:2,y:2};
    p2Start = {x:2,y:13};
    k1Pos = {x:5,y:6};
    k2Pos = {x:11,y:13};
    e1Pos = {x:14,y:14};
    e2Pos = {x:17,y:14};
    
    for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
            let ch = m[r][c] || 'W';
            if (ch === 'G') guards.push({x:c, y:r, dir:1, speed:1.2});
            row.push(ch === '.' || ch === 'P' ? '.' : ch);
        }
        grid.push(row);
    }
}

let gameState = 'start'; // start, playing, win, lose
let players = [];
let keys = {k1:false, k2:false};
let caught = [false, false];
let guardAnim = 0;
let audioCtx = null;
let particles = [];

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'caught') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'key') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
        gain2.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.2);
        gain2.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
        osc2.start();
        osc2.stop(audioCtx.currentTime + 1);
    }
}

function resetGame() {
    buildMap();
    players = [
        {x: p1Start.x, y: p1Start.y, hasKey: false},
        {x: p2Start.x, y: p2Start.y, hasKey: false}
    ];
    keys = {k1: true, k2: true};
    caught = [false, false];
    particles = [];
    gameState = 'playing';
}

function isWall(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return true;
    return grid[y][x] === 'W';
}

function isShadow(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
    return grid[y][x] === 'S';
}

function canSee(gx, gy, px, py) {
    // Check line of sight - simple: check tiles between
    const dx = Math.abs(px - gx);
    const dy = Math.abs(py - gy);
    
    if (dx > 6 || dy > 6) return false;
    
    // If in shadow, hidden from guards
    if (isShadow(px, py)) return false;
    
    // Check for walls in the line
    if (gx === px) {
        const step = gy < py ? 1 : -1;
        for (let y = gy + step; y !== py; y += step) {
            if (isWall(gx, y)) return false;
        }
        return true;
    }
    if (gy === py) {
        const step = gx < px ? 1 : -1;
        for (let x = gx + step; x !== px; x += step) {
            if (isWall(x, gy)) return false;
        }
        return true;
    }
    // Diagonal - check both axes
    if (isWall(gx, py) || isWall(px, gy)) return false;
    
    const steps = Math.max(dx, dy);
    const sx = px > gx ? 1 : -1;
    const sy = py > gy ? 1 : -1;
    for (let i = 1; i <= steps; i++) {
        const cx = gx + sx * i;
        const cy = gy + sy * i;
        if (isWall(cx, cy)) return false;
        if (cx === px && cy === py) break;
    }
    return true;
}

function checkDetection() {
    for (let g = 0; g < guards.length; g++) {
        const gx = Math.round(guards[g].x);
        const gy = Math.round(guards[g].y);
        
        for (let p = 0; p < 2; p++) {
            if (caught[p]) continue;
            if (canSee(gx, gy, players[p].x, players[p].y)) {
                caught[p] = true;
                gameState = 'lose';
                playSound('caught');
                spawnParticles(players[p].x, players[p].y, p === 0 ? '#ff6b6b' : '#4ecdc4');
            }
        }
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: (x + 0.5) * TILE,
            y: (y + 0.5) * TILE,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1,
            color: color
        });
    }
}

function checkObjectives() {
    // Check keys
    if (keys.k1 && players[0].x === k1Pos.x && players[0].y === k1Pos.y) {
        players[0].hasKey = true;
        keys.k1 = false;
        playSound('key');
    }
    if (keys.k2 && players[1].x === k2Pos.x && players[1].y === k2Pos.y) {
        players[1].hasKey = true;
        keys.k2 = false;
        playSound('key');
    }
    
    // Check exits
    if (players[0].hasKey && players[0].x === e1Pos.x && players[0].y === e1Pos.y) {
        caught[0] = false;
        gameState = 'win';
        playSound('win');
    }
    if (players[1].hasKey && players[1].x === e2Pos.x && players[1].y === e2Pos.y) {
        caught[1] = false;
        gameState = 'win';
        playSound('win');
    }
}

function moveGuard(g, dt) {
    const prevX = g.x;
    const prevY = g.y;
    g.x += g.dir * 0.6 * dt;
    
    // Bounce off walls
    const nx = Math.round(g.x);
    const ny = Math.round(g.y);
    if (isWall(nx, ny)) {
        g.x = prevX;
        g.dir *= -1;
    }
    
    guardAnim += dt;
}

let lastTime = 0;
function update(dt) {
    if (gameState !== 'playing') return;
    
    for (let g of guards) moveGuard(g, dt);
    checkDetection();
    checkObjectives();
    
    // Update particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 0.8;
    }
    particles = particles.filter(p => p.life > 0);
}

function drawTile(x, y) {
    const px = x * TILE;
    const py = y * TILE;
    
    if (isWall(x, y)) {
        ctx.fillStyle = '#2d2d44';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = '#3d3d5c';
        ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
    } else if (isShadow(x, y)) {
        ctx.fillStyle = '#1a3a4a';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = '#0d2833';
        ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
        // Draw shadow effect
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#000';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.globalAlpha = 1;
    } else {
        ctx.fillStyle = '#1e1e32';
        ctx.fillRect(px, py, TILE, TILE);
        // Grid lines
        ctx.strokeStyle = '#2a2a40';
        ctx.strokeRect(px, py, TILE, TILE);
    }
}

function drawGuard(g) {
    const px = g.x * TILE + TILE/2;
    const py = g.y * TILE + TILE/2;
    const r = TILE * 0.35;
    
    // Vision cone
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#ff4444';
    for (let d = 1; d <= 6; d++) {
        const vx = Math.round(g.x) + (g.dir > 0 ? d : -d);
        const vy = Math.round(g.y);
        if (!isWall(vx, vy)) {
            ctx.fillRect(vx * TILE, vy * TILE, TILE, TILE);
        }
    }
    ctx.globalAlpha = 1;
    
    // Guard body
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4757';
    ctx.fill();
    ctx.strokeStyle = '#ff6b81';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Eyes
    const eyeDir = g.dir > 0 ? 1 : -1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(px + eyeDir * r * 0.3 - 3, py - 3, 6, 4);
}

function drawPlayer(p, idx) {
    const px = p.x * TILE + TILE/2;
    const py = p.y * TILE + TILE/2;
    const r = TILE * 0.35;
    
    const color = idx === 0 ? '#ff6b6b' : '#4ecdc4';
    const lightColor = idx === 0 ? '#ffa8a8' : '#8ee8e0';
    
    // Body
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = lightColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Key indicator
    if (p.hasKey) {
        ctx.fillStyle = '#ffd700';
        ctx.font = `bold ${TILE * 0.5}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('K', px, py + TILE * 0.45);
    }
    
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${TILE * 0.4}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(idx === 0 ? '1' : '2', px, py + TILE * 0.15);
}

function drawKey(pos, idx) {
    const px = pos.x * TILE + TILE/2;
    const py = pos.y * TILE + TILE/2;
    ctx.fillStyle = '#ffd700';
    ctx.font = `bold ${TILE * 0.6}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(idx === 0 ? 'K1' : 'K2', px, py);
}

function drawExit(pos, idx) {
    const px = pos.x * TILE;
    const py = pos.y * TILE;
    ctx.fillStyle = '#27ae60';
    ctx.globalAlpha = 0.4 + Math.sin(Date.now() * 0.005) * 0.2;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#2ecc71';
    ctx.lineWidth = 2;
    ctx.strokeRect(px + 3, py + 3, TILE - 6, TILE - 6);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${TILE * 0.4}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(idx === 0 ? 'E1' : 'E2', px + TILE/2, py + TILE/2);
}

function drawHUD() {
    const pad = 8;
    // P1 objective
    ctx.fillStyle = '#ff6b6b';
    ctx.font = `bold ${Math.max(12, TILE * 0.5)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`P1: ${players[0].hasKey ? '→ Reach E1' : '→ Get K1'}`, pad, pad + TILE * 0.5);
    
    // P2 objective
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText(`P2: ${players[1].hasKey ? '→ Reach E2' : '→ Get K2'}`, pad, pad + TILE * 1.2);
}

function drawStartScreen() {
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W/2;
    const cy = H/2;
    
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(W*0.08, 48)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('SHADOW DUO', cx, cy - 100);
    
    ctx.font = `${Math.min(W*0.035, 20)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('A Two-Player Stealth Game', cx, cy - 65);
    
    ctx.fillStyle = '#ff6b6b';
    ctx.font = `${Math.min(W*0.03, 18)}px monospace`;
    ctx.fillText('P1: W A S D to move', cx, cy - 20);
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText('P2: Arrow Keys to move', cx, cy + 10);
    
    ctx.fillStyle = '#ffd700';
    ctx.fillText('Collect your KEY then reach your EXIT', cx, cy + 50);
    ctx.fillStyle = '#ff4757';
    ctx.fillText('Avoid the red GUARDS!', cx, cy + 80);
    ctx.fillStyle = '#1a3a4a';
    ctx.fillText('Blue SHADOW tiles hide you from guards', cx, cy + 110);
    
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(W*0.035, 22)}px monospace`;
    const blink = Math.sin(Date.now() * 0.004) > 0;
    if (blink) ctx.fillText('Press ENTER to Start', cx, cy + 160);
}

function drawEndScreen(won) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W/2;
    const cy = H/2;
    
    ctx.fillStyle = won ? '#2ecc71' : '#ff4757';
    ctx.font = `bold ${Math.min(W*0.08, 48)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(won ? 'ESCAPED!' : 'CAUGHT!', cx, cy - 20);
    
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W*0.035, 22)}px monospace`;
    const blink = Math.sin(Date.now() * 0.004) > 0;
    if (blink) ctx.fillText('Press R to Restart', cx, cy + 30);
}

function render() {
    ctx.clearRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }
    
    // Draw map
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            drawTile(x, y);
        }
    }
    
    // Draw exits
    drawExit(e1Pos, 0);
    drawExit(e2Pos, 1);
    
    // Draw keys
    if (keys.k1) drawKey(k1Pos, 0);
    if (keys.k2) drawKey(k2Pos, 1);
    
    // Draw guards
    for (let g of guards) drawGuard(g);
    
    // Draw players
    for (let i = 0; i < 2; i++) {
        if (!caught[i]) drawPlayer(players[i], i);
    }
    
    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
    
    // HUD
    drawHUD();
    
    if (gameState === 'win') drawEndScreen(true);
    if (gameState === 'lose') drawEndScreen(false);
}

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    
    update(dt);
    render();
    
    requestAnimationFrame(gameLoop);
}

// Input handling
let keyBuffer = [0, 0]; // movement cooldowns

document.addEventListener('keydown', (e) => {
    initAudio();
    
    if (gameState === 'start' && e.key === 'Enter') {
        resetGame();
        return;
    }
    
    if ((gameState === 'win' || gameState === 'lose') && (e.key === 'r' || e.key === 'R')) {
        resetGame();
        return;
    }
    
    if (gameState !== 'playing') return;
    
    const now = performance.now();
    
    // Player 1: WASD
    if (!caught[0]) {
        let dx = 0, dy = 0;
        if (e.key === 'w' || e.key === 'W') dy = -1;
        else if (e.key === 'a' || e.key === 'A') dx = -1;
        else if (e.key === 's' || e.key === 'S') dy = 1;
        else if (e.key === 'd' || e.key === 'D') dx = 1;
        
        if ((dx !== 0 || dy !== 0) && now - keyBuffer[0] > 150) {
            const nx = players[0].x + dx;
            const ny = players[0].y + dy;
            if (!isWall(nx, ny)) {
                players[0].x = nx;
                players[0].y = ny;
                keyBuffer[0] = now;
            }
        }
    }
    
    // Player 2: Arrow keys
    if (!caught[1]) {
        let dx = 0, dy = 0;
        if (e.key === 'ArrowUp') dy = -1;
        else if (e.key === 'ArrowLeft') dx = -1;
        else if (e.key === 'ArrowDown') dy = 1;
        else if (e.key === 'ArrowRight') dx = 1;
        
        if ((dx !== 0 || dy !== 0) && now - keyBuffer[1] > 150) {
            const nx = players[1].x + dx;
            const ny = players[1].y + dy;
            if (!isWall(nx, ny)) {
                players[1].x = nx;
                players[1].y = ny;
                keyBuffer[1] = now;
            }
        }
    }
    
    e.preventDefault();
});

// Start
buildMap();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
