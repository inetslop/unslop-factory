<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zombie Bullet Hell</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, type, duration, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function playShot() { playSound(880, 'square', 0.05, 0.08); }
function playZombieShoot() { playSound(220, 'sawtooth', 0.1, 0.06); }
function playHit() { playSound(150, 'sawtooth', 0.3, 0.2); }
function playKill() { playSound(440, 'square', 0.15, 0.1); }
function playDeath() { playSound(80, 'sawtooth', 0.5, 0.3); }

// Game State
let gameState = 'start'; // start, playing, gameover
let score = 0;
let hiScore = 0;
try { hiScore = parseInt(localStorage.getItem('zombieBhHi') || '0'); } catch(e) {}
let wave = 0;
let waveTimer = 0;
let screenShake = 0;
let particles = [];
let bullets = [];
let enemyBullets = [];
let zombies = [];
let powerUps = [];
let time = 0;

// Player
let player = { x: 0, y: 0, w: 24, h: 32, speed: 5, hp: 5, maxHp: 5, shootCd: 0, invuln: 0, fireRate: 8 };

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (gameState === 'start' && (e.key === 'Enter' || e.key === ' ')) startGame();
    if (gameState === 'gameover' && (e.key === 'Enter' || e.key === ' ')) startGame();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function startGame() {
    initAudio();
    gameState = 'playing';
    score = 0;
    wave = 0;
    waveTimer = 0;
    particles = [];
    bullets = [];
    enemyBullets = [];
    zombies = [];
    powerUps = [];
    player.x = W / 2;
    player.y = H - 80;
    player.hp = 5;
    player.maxHp = 5;
    player.invuln = 60;
    player.fireRate = 8;
}

// Zombie Types
function spawnZombie(type, x, y) {
    const z = { type, x, y, w: 32, h: 40, hp: 1, maxHp: 1, shootCd: 0, phase: 0, vx: 0, vy: 0, timer: 0 };
    switch(type) {
        case 'walker': z.hp = 1; z.maxHp = 1; z.vy = 0.5; break;
        case 'spitter': z.hp = 2; z.maxHp = 2; z.vy = 0.3; break;
        case 'brute': z.hp = 4; z.maxHp = 4; z.vy = 0.2; z.w = 40; z.h = 50; break;
        case 'elite': z.hp = 3; z.maxHp = 3; z.vy = 0.6; break;
    }
    zombies.push(z);
}

function spawnWave() {
    wave++;
    const types = ['walker', 'spitter', 'brute', 'elite'];
    const count = Math.min(3 + wave, 8);
    for (let i = 0; i < count; i++) {
        let type = 'walker';
        if (wave >= 2 && Math.random() < 0.4) type = 'spitter';
        if (wave >= 3 && Math.random() < 0.3) type = 'brute';
        if (wave >= 5 && Math.random() < 0.25) type = 'elite';
        const x = 60 + Math.random() * (W - 120);
        const y = -50 - Math.random() * 100;
        spawnZombie(type, x, y);
    }
}

// Bullet patterns
function fireAimed(x, y, targetX, targetY, speed, count) {
    for (let i = 0; i < count; i++) {
        const spread = (count > 1) ? (i / (count - 1) - 0.5) * 0.6 : 0;
        const dx = targetX - x;
        const dy = targetY - y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const baseAngle = Math.atan2(dy, dx) + spread;
        enemyBullets.push({ x, y, vx: Math.cos(baseAngle)*speed, vy: Math.sin(baseAngle)*speed, r: 5, life: 300 });
    }
}

function fireSpread(x, y, baseAngle, count, speed) {
    for (let i = 0; i < count; i++) {
        const a = baseAngle + (i - (count-1)/2) * 0.25;
        enemyBullets.push({ x, y, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, r: 5, life: 300 });
    }
}

function fireSpiral(x, y, angle, speed) {
    enemyBullets.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, r: 4, life: 250 });
}

function fireRing(x, y, count, speed) {
    for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2;
        enemyBullets.push({ x, y, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, r: 5, life: 300 });
    }
}

function addParticle(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1, life: 20 + Math.random()*20, color, r: 2+Math.random()*3 });
    }
}

// Update
function update() {
    time++;
    
    if (gameState !== 'playing') return;
    
    // Wave spawning
    waveTimer++;
    const spawnInterval = Math.max(180 - wave * 10, 60);
    if (waveTimer >= spawnInterval) {
        waveTimer = 0;
        spawnWave();
    }
    
    // Player movement
    let dx = 0, dy = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += player.speed;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += player.speed;
    player.x += dx;
    player.y += dy;
    player.x = Math.max(12, Math.min(W-12, player.x));
    player.y = Math.max(H*0.4, Math.min(H-20, player.y));
    
    if (player.invuln > 0) player.invuln--;
    if (player.shootCd > 0) player.shootCd--;
    
    // Player shoot
    if ((keys[' '] || keys['z'] || keys['Z']) && player.shootCd <= 0) {
        player.shootCd = player.fireRate;
        bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -10, r: 4 });
        if (player.hp > 3 || score > 500) {
            bullets.push({ x: player.x - 8, y: player.y - 15, vx: -1, vy: -10, r: 3 });
            bullets.push({ x: player.x + 8, y: player.y - 15, vx: 1, vy: -10, r: 3 });
        }
        playShot();
    }
    
    // Update bullets
    for (let i = bullets.length-1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        if (b.y < -20 || b.x < -20 || b.x > W+20) { bullets.splice(i,1); continue; }
        
        // Hit zombies
        for (let j = zombies.length-1; j >= 0; j--) {
            const z = zombies[j];
            if (Math.abs(b.x-z.x) < z.w/2+b.r && Math.abs(b.y-z.y) < z.h/2+b.r) {
                bullets.splice(i,1);
                z.hp--;
                addParticle(z.x, z.y, '#4f4', 3);
                if (z.hp <= 0) {
                    zombies.splice(j,1);
                    score += z.maxHp * 50;
                    playKill();
                    addParticle(z.x, z.y, '#8f8', 10);
                    if (Math.random() < 0.2) {
                        powerUps.push({ x: z.x, y: z.y, type: Math.random()<0.5?'heal':'rapid' });
                    }
                }
                break;
            }
        }
    }
    
    // Update zombies
    for (let i = zombies.length-1; i >= 0; i--) {
        const z = zombies[i];
        z.timer++;
        z.y += z.vy;
        
        if (z.type === 'walker' && Math.abs(z.x - W/2) > 30) z.x += (W/2 - z.x) * 0.01;
        if (z.type === 'elite') z.x += Math.sin(z.timer * 0.05) * 1.5;
        
        // Shooting
        z.shootCd--;
        if (z.shootCd <= 0 && z.y > 0 && z.y < H - 100) {
            switch(z.type) {
                case 'walker':
                    z.shootCd = 90;
                    fireAimed(z.x, z.y+20, player.x, player.y, 3, 1);
                    playZombieShoot();
                    break;
                case 'spitter':
                    z.shootCd = 70;
                    fireSpread(z.x, z.y+20, Math.PI/2, 5, 2.5);
                    playZombieShoot();
                    break;
                case 'brute':
                    z.shootCd = 40;
                    z.phase += 0.3;
                    fireSpiral(z.x, z.y+25, z.phase, 2);
                    fireSpiral(z.x, z.y+25, z.phase + Math.PI, 2);
                    if (z.timer % 20 === 0) playZombieShoot();
                    break;
                case 'elite':
                    z.shootCd = 50;
                    fireRing(z.x, z.y, 8, 2);
                    fireAimed(z.x, z.y, player.x, player.y, 3.5, 3);
                    playZombieShoot();
                    break;
            }
        }
        
        // Remove if off screen
        if (z.y > H + 60) { zombies.splice(i,1); }
    }
    
    // Update enemy bullets
    for (let i = enemyBullets.length-1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx; b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < -30 || b.x > W+30 || b.y < -30 || b.y > H+30) {
            enemyBullets.splice(i,1); continue;
        }
        
        // Hit player
        if (player.invuln <= 0 && Math.abs(b.x-player.x) < 10+b.r && Math.abs(b.y-player.y) < 14+b.r) {
            enemyBullets.splice(i,1);
            player.hp--;
            player.invuln = 60;
            screenShake = 15;
            playHit();
            addParticle(player.x, player.y, '#f44', 8);
            if (player.hp <= 0) {
                gameState = 'gameover';
                playDeath();
                if (score > hiScore) {
                    hiScore = score;
                    try { localStorage.setItem('zombieBhHi', hiScore.toString()); } catch(e) {}
                }
            }
        }
    }
    
    // Power-ups
    for (let i = powerUps.length-1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += 1;
        if (p.y > H+30) { powerUps.splice(i,1); continue; }
        if (Math.abs(p.x-player.x) < 25 && Math.abs(p.y-player.y) < 25) {
            if (p.type === 'heal') player.hp = Math.min(player.maxHp, player.hp+2);
            else player.fireRate = Math.max(3, player.fireRate - 1);
            addParticle(player.x, player.y, '#4ff', 8);
            powerUps.splice(i,1);
        }
    }
    
    // Particles
    for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i,1);
    }
    
    // Screen shake decay
    if (screenShake > 0) screenShake *= 0.85;
}

// Draw
function draw() {
    ctx.save();
    if (screenShake > 0.5) {
        ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    }
    
    // Background
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(-10, -10, W+20, H+20);
    
    // Grid lines for atmosphere
    ctx.strokeStyle = 'rgba(30,50,30,0.3)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    
    if (gameState === 'start') {
        drawStartScreen();
        ctx.restore();
        return;
    }
    
    // Power-ups
    for (const p of powerUps) {
        ctx.fillStyle = p.type === 'heal' ? '#4f8' : '#4af';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'heal' ? '+' : '>>', p.x, p.y);
    }
    
    // Zombies
    for (const z of zombies) {
        drawZombie(z);
    }
    
    // Player bullets
    ctx.fillStyle = '#fef';
    for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Enemy bullets
    for (const b of enemyBullets) {
        const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r+2);
        glow.addColorStop(0, '#f4a');
        glow.addColorStop(1, 'rgba(255,68,170,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r+3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#f8c';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r-1, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (p.life/30), 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Player
    if (player.invuln <= 0 || time % 8 < 4) {
        drawPlayer();
    }
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`HP: ${'█'.repeat(player.hp)}${'░'.repeat(player.maxHp-player.hp)}`, 15, 25);
    ctx.fillText(`SCORE: ${score}`, 15, 45);
    ctx.fillText(`WAVE: ${wave}`, 15, 65);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#888';
    ctx.fillText(`HI: ${hiScore}`, W-15, 25);
    
    if (gameState === 'gameover') {
        drawGameOver();
    }
    
    ctx.restore();
}

function drawPlayer() {
    const px = player.x, py = player.y;
    // Body
    ctx.fillStyle = '#2a6';
    ctx.fillRect(px-8, py-10, 16, 24);
    // Head
    ctx.fillStyle = '#3b8';
    ctx.beginPath();
    ctx.arc(px, py-16, 8, 0, Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#ff0';
    ctx.fillRect(px-4, py-19, 3, 3);
    ctx.fillRect(px+2, py-19, 3, 3);
    // Gun
    ctx.fillStyle = '#888';
    ctx.fillRect(px-2, py-28, 4, 12);
}

function drawZombie(z) {
    const zx = z.x, zy = z.y;
    let bodyColor, headColor;
    switch(z.type) {
        case 'walker': bodyColor='#3a5'; headColor='#4b6'; break;
        case 'spitter': bodyColor='#5a3'; headColor='#6b4'; break;
        case 'brute': bodyColor='#2a4'; headColor='#3b5'; break;
        case 'elite': bodyColor='#636'; headColor='#848'; break;
    }
    // Body
    ctx.fillStyle = bodyColor;
    ctx.fillRect(zx-z.w/4, zy-10, z.w/2, z.h*0.5);
    // Head
    ctx.fillStyle = headColor;
    ctx.beginPath();
    ctx.arc(zx, zy-16, 10, 0, Math.PI*2);
    ctx.fill();
    // Eyes (angry)
    ctx.fillStyle = '#f00';
    ctx.fillRect(zx-5, zy-19, 3, 3);
    ctx.fillRect(zx+3, zy-19, 3, 3);
    // Arms
    ctx.fillStyle = bodyColor;
    const armSwing = Math.sin(time*0.1 + z.timer) * 5;
    ctx.fillRect(zx-z.w/4-6, zy-5+armSwing, 8, 4);
    ctx.fillRect(zx+z.w/4-2, zy-5-armSwing, 8, 4);
    // HP bar for multi-hp zombies
    if (z.maxHp > 1) {
        const bw = z.w;
        ctx.fillStyle = '#300';
        ctx.fillRect(zx-bw/2, zy-35, bw, 4);
        ctx.fillStyle = '#f44';
        ctx.fillRect(zx-bw/2, zy-35, bw*(z.hp/z.maxHp), 4);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0,0,W,H);
    
    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#4f6';
    ctx.fillText('ZOMBIE', W/2, H/3 - 20);
    ctx.fillStyle = '#f4a';
    ctx.fillText('BULLET HELL', W/2, H/3 + 30);
    
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('WASD / Arrows - Move', W/2, H/2 + 10);
    ctx.fillText('Space / Z - Shoot', W/2, H/2 + 35);
    ctx.fillText('Dodge the bullets. Survive the horde.', W/2, H/2 + 70);
    
    ctx.fillStyle = '#8f8';
    ctx.font = '14px monospace';
    ctx.fillText('WALKER: aimed shots | SPITTER: spread | BRUTE: spiral | ELITE: rings', W/2, H/2 + 110);
    
    if (hiScore > 0) {
        ctx.fillStyle = '#ff8';
        ctx.fillText(`HI-SCORE: ${hiScore}`, W/2, H/2 + 145);
    }
    
    ctx.fillStyle = time % 40 < 20 ? '#fff' : '#888';
    ctx.font = '20px monospace';
    ctx.fillText('PRESS ENTER TO START', W/2, H*0.75);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px monospace';
    ctx.fillStyle = '#f44';
    ctx.fillText('YOU DIED', W/2, H/3);
    ctx.font = '20px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${score}`, W/2, H/3 + 50);
    ctx.fillText(`WAVES SURVIVED: ${wave}`, W/2, H/3 + 80);
    if (score >= hiScore && score > 0) {
        ctx.fillStyle = '#ff8';
        ctx.fillText('NEW HI-SCORE!', W/2, H/3 + 115);
    }
    ctx.fillStyle = time % 40 < 20 ? '#fff' : '#888';
    ctx.font = '18px monospace';
    ctx.fillText('PRESS ENTER TO RESTART', W/2, H*0.7);
}

// Main Loop
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
