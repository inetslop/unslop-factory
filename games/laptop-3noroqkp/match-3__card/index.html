<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match 3 Cards</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: 'Segoe UI', Tahoma, sans-serif;
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}

#game-container {
  position: relative; width: 100%; height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

#start-screen {
  position: absolute; inset: 0; z-index: 100;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; transition: opacity 0.5s;
}

#start-screen.hidden { opacity: 0; pointer-events: none; }

.title {
  font-size: clamp(2rem, 5vw, 3.5rem); color: #fff;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
  letter-spacing: 2px; text-align: center;
}

.subtitle { color: #a8b2d8; font-size: clamp(0.9rem, 2vw, 1.1rem); text-align: center; line-height: 1.6; }

.btn {
  padding: 14px 36px; font-size: 1.2rem; border: none; border-radius: 8px;
  background: linear-gradient(135deg, #e94560, #ff6b6b); color: #fff;
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(233,69,96,0.4);
}

.btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(233,69,96,0.6); }
.btn:active { transform: scale(0.97); }

#hud {
  display: flex; gap: 20px; align-items: center; margin-bottom: 10px;
  background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 10px;
}

.hud-item { color: #e0e0ff; font-size: clamp(0.9rem, 1.5vw, 1.1rem); display: flex; align-items: center; gap: 6px; }
.hud-item span { color: #ffd700; font-weight: bold; font-size: 1.2em; }

#restart-btn {
  padding: 6px 14px; font-size: 0.9rem; border: none; border-radius: 6px;
  background: rgba(255,255,255,0.1); color: #a8b2d8; cursor: pointer;
  transition: background 0.2s;
}

#restart-btn:hover { background: rgba(255,255,255,0.2); }

#board-wrapper {
  position: relative;
  padding: 6px;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
}

#board {
  display: grid;
  gap: 4px;
}

.card {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(1.2rem, 3vw, 2rem);
  border-radius: 6px; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  animation: dropIn 0.3s ease-out;
}

@keyframes dropIn {
  from { transform: translateY(-20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.card.selected {
  transform: scale(1.1);
  box-shadow: 0 0 15px rgba(255,255,255,0.8) !important;
  z-index: 5;
}

.card.matching {
  animation: matchPop 0.4s ease-out forwards;
}

@keyframes matchPop {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.8; }
  100% { transform: scale(0); opacity: 0; }
}

.card.swapping { transition: none !important; }

.card.suit-0 { background: linear-gradient(135deg, #ff6b6b, #ee5a24); box-shadow: 0 2px 8px rgba(238,90,36,0.3); }
.card.suit-1 { background: linear-gradient(135deg, #f0932b, #ffbe76); box-shadow: 0 2px 8px rgba(240,147,43,0.3); }
.card.suit-2 { background: linear-gradient(135deg, #6ab04c, #badc58); box-shadow: 0 2px 8px rgba(106,176,76,0.3); }
.card.suit-3 { background: linear-gradient(135deg, #6172f3, #4a69bd); box-shadow: 0 2px 8px rgba(97,114,243,0.3); }
.card.suit-4 { background: linear-gradient(135deg, #e056fd, #be2edd); box-shadow: 0 2px 8px rgba(224,86,253,0.3); }

#combo-popup {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: clamp(1.5rem, 4vw, 2.5rem); color: #ffd700;
  text-shadow: 0 0 10px rgba(255,215,0,0.8);
  pointer-events: none; opacity: 0; z-index: 50;
  transition: opacity 0.3s, transform 0.3s;
}

#combo-popup.show { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }

#message {
  position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
  color: #ff6b6b; font-size: 1rem; opacity: 0; transition: opacity 0.3s;
}

#message.show { opacity: 1; }
</style>
</head>
<body>
<div id="game-container">
  <div id="start-screen">
    <div class="title">♠ Match 3 Cards ♥</div>
    <div class="subtitle">
      Click a card to select it, then click an adjacent card to swap.<br>
      Line up 3 or more matching cards to score points!<br>
      Chain cascades for combo bonuses.
    </div>
    <button class="btn" id="start-btn">Play</button>
  </div>

  <div id="hud" style="display:none;">
    <div class="hud-item">Score: <span id="score">0</span></div>
    <div class="hud-item">Moves: <span id="moves">60</span></div>
    <button id="restart-btn">↻ Restart</button>
  </div>

  <div id="board-wrapper">
    <div id="board"></div>
    <div id="combo-popup"></div>
  </div>

  <div id="message"></div>
</div>

<script>
const COLS = 7, ROWS = 7;
const SUITS = ['♥', '♦', '♣', '♠', '★'];
const SUIT_NAMES = ['Hearts','Diamonds','Clubs','Spades','Stars'];
let grid = [];
let selected = null;
let score = 0;
let moves = 60;
let busy = false;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playTone(freq, dur, type='sine', vol=0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playMatch(combo) {
  const base = 400 + combo * 100;
  for (let i = 0; i < Math.min(combo, 5); i++) {
    setTimeout(() => playTone(base + i * 80, 0.2, 'sine', 0.12), i * 60);
  }
}

function playSwap() { playTone(300, 0.1, 'triangle', 0.1); }
function playSelect() { playTone(500, 0.08, 'sine', 0.08); }
function playInvalid() { playTone(200, 0.15, 'square', 0.06); }

function getCellSize() {
  const wrapper = document.getElementById('board-wrapper');
  const maxH = window.innerHeight * 0.75;
  const maxW = window.innerWidth * 0.85;
  let s = Math.min(maxW, maxH) / COLS;
  return Math.floor(s);
}

function buildBoard() {
  const boardEl = document.getElementById('board');
  const cellSize = getCellSize();
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
  boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;

  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      const suit = Math.floor(Math.random() * SUITS.length);
      grid[r][c] = { suit, el: null };
      const el = document.createElement('div');
      el.className = `card suit-${suit}`;
      el.textContent = SUITS[suit];
      el.dataset.r = r;
      el.dataset.c = c;
      boardEl.appendChild(el);
      grid[r][c].el = el;
    }
  }

  // Remove initial matches
  let hasMatch = true;
  while (hasMatch) {
    hasMatch = false;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (c + 2 < COLS && grid[r][c].suit === grid[r][c+1].suit && grid[r][c].suit === grid[r][c+2].suit) {
          grid[r][c].suit = (grid[r][c].suit + 1) % SUITS.length;
          updateCardVisual(r, c);
          hasMatch = true;
        }
        if (r + 2 < ROWS && grid[r][c].suit === grid[r+1][c].suit && grid[r][c].suit === grid[r+2][c].suit) {
          grid[r][c].suit = (grid[r][c].suit + 1) % SUITS.length;
          updateCardVisual(r, c);
          hasMatch = true;
        }
      }
    }
  }
}

function updateCardVisual(r, c) {
  const el = grid[r][c].el;
  el.className = `card suit-${grid[r][c].suit}`;
  el.textContent = SUITS[grid[r][c].suit];
}

function selectCell(e) {
  if (busy) return;
  const el = e.target.closest('.card');
  if (!el) return;
  const r = parseInt(el.dataset.r);
  const c = parseInt(el.dataset.c);

  if (selected === null) {
    selected = { r, c };
    el.classList.add('selected');
    playSelect();
  } else {
    el.classList.remove('selected');
    const dr = Math.abs(r - selected.r);
    const dc = Math.abs(c - selected.c);
    if (dr + dc === 1) {
      // Swap
      const prevEl = document.querySelector('.card.selected');
      if (prevEl) prevEl.classList.remove('selected');
      doSwap(selected.r, selected.c, r, c);
    } else if (r === selected.r && c === selected.c) {
      el.classList.remove('selected');
      playSelect();
    } else {
      const prevEl = document.querySelector('.card.selected');
      if (prevEl) prevEl.classList.remove('selected');
      selected = { r, c };
      el.classList.add('selected');
      playSelect();
    }
  }
}

async function doSwap(r1, c1, r2, c2) {
  busy = true;
  selected = null;
  playSwap();

  // Animate swap
  const el1 = grid[r1][c1].el;
  const el2 = grid[r2][c2].el;
  const boardEl = document.getElementById('board');
  const rect1 = el1.getBoundingClientRect();
  const rect2 = el2.getBoundingClientRect();
  const dx = rect2.left - rect1.left;
  const dy = rect2.top - rect1.top;

  el1.style.transition = 'transform 0.2s ease';
  el1.style.transform = `translate(${dx}px, ${dy}px)`;
  el2.style.transition = 'transform 0.2s ease';
  el2.style.transform = `translate(${-dx}px, ${-dy}px)`;

  await sleep(200);
  el1.style.transition = '';
  el1.style.transform = '';
  el2.style.transition = '';
  el2.style.transform = '';

  // Actually swap in grid
  const tmp = grid[r1][c1];
  grid[r1][c1] = grid[r2][c2];
  grid[r2][c2] = tmp;
  grid[r1][c1].el.dataset.r = r1;
  grid[r1][c1].el.dataset.c = c1;
  grid[r2][c2].el.dataset.r = r2;
  grid[r2][c2].el.dataset.c = c2;

  // Check for matches
  const matches = findMatches();
  if (matches.length === 0) {
    // Invalid swap - swap back
    playInvalid();
    el1.style.transition = 'transform 0.2s ease';
    el1.style.transform = `translate(${-dx}px, ${-dy}px)`;
    el2.style.transition = 'transform 0.2s ease';
    el2.style.transform = `translate(${dx}px, ${dy}px)`;
    await sleep(200);
    el1.style.transition = '';
    el1.style.transform = '';
    el2.style.transition = '';
    el2.style.transform = '';

    const tmp2 = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = tmp2;
    grid[r1][c1].el.dataset.r = r1;
    grid[r1][c1].el.dataset.c = c1;
    grid[r2][c2].el.dataset.r = r2;
    grid[r2][c2].el.dataset.c = c2;

    busy = false;
    return;
  }

  moves--;
  updateHUD();
  await processMatches(matches);
  busy = false;
}

function findMatches() {
  const matched = new Set();
  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      if (grid[r][c].suit === grid[r][c+1].suit && grid[r][c].suit === grid[r][c+2].suit) {
        let end = c + 2;
        while (end + 1 < COLS && grid[r][end+1].suit === grid[r][c].suit) end++;
        for (let i = c; i <= end; i++) matched.add(r * COLS + i);
      }
    }
  }
  // Vertical
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      if (grid[r][c].suit === grid[r+1][c].suit && grid[r][c].suit === grid[r+2][c].suit) {
        let end = r + 2;
        while (end + 1 < ROWS && grid[end+1][c].suit === grid[r][c].suit) end++;
        for (let i = r; i <= end; i++) matched.add(i * COLS + c);
      }
    }
  }
  return Array.from(matched).map(idx => ({ r: Math.floor(idx / COLS), c: idx % COLS }));
}

async function processMatches(matches) {
  let combo = 0;
  let currentMatches = matches;

  while (currentMatches.length > 0) {
    combo++;
    const pts = currentMatches.length * 10 * combo;
    score += pts;
    updateHUD();

    if (combo > 1) showCombo(combo);
    playMatch(combo);

    // Animate matches
    for (const m of currentMatches) {
      grid[m.r][m.c].el.classList.add('matching');
    }
    await sleep(400);

    // Remove matched elements
    for (const m of currentMatches) {
      const el = grid[m.r][m.c].el;
      if (el && el.parentNode) el.parentNode.removeChild(el);
      grid[m.r][m.c].el = null;
    }

    // Gravity: pull cards down
    applyGravity();
    await sleep(250);

    // Refill from top
    refillBoard();
    await sleep(300);

    // Check for new matches
    currentMatches = findMatches();
  }

  if (moves <= 0) {
    setTimeout(() => showGameOver(), 500);
  }
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c].el !== null) {
        if (r !== writeRow) {
          grid[writeRow][c] = grid[r][c];
          grid[r][c] = { suit: 0, el: null };
          grid[writeRow][c].el.dataset.r = writeRow;
          grid[writeRow][c].el.dataset.c = c;
        }
        writeRow--;
      }
    }
  }
}

function refillBoard() {
  const boardEl = document.getElementById('board');
  const cellSize = getCellSize();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (grid[r][c].el === null) {
        const suit = Math.floor(Math.random() * SUITS.length);
        grid[r][c] = { suit, el: null };
        const el = document.createElement('div');
        el.className = `card suit-${suit}`;
        el.textContent = SUITS[suit];
        el.dataset.r = r;
        el.dataset.c = c;
        boardEl.appendChild(el);
        grid[r][c].el = el;
      }
    }
  }
}

function showCombo(combo) {
  const popup = document.getElementById('combo-popup');
  popup.textContent = `COMBO x${combo}!`;
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 800);
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('moves').textContent = moves;
}

function showGameOver() {
  const msg = document.getElementById('message');
  msg.textContent = `Game Over! Final Score: ${score}`;
  msg.classList.add('show');
  setTimeout(() => {
    msg.textContent = 'Click Restart to play again';
  }, 2000);
}

function startGame() {
  initAudio();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('hud').style.display = 'flex';
  score = 0; moves = 60; selected = null; busy = false;
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  buildBoard();
  updateHUD();
}

function restart() {
  document.getElementById('message').classList.remove('show');
  startGame();
}

let lastKeyTime = 0;
window.addEventListener('keydown', (e) => {
  const now = Date.now();
  if (now - lastKeyTime < 100) return;
  lastKeyTime = now;

  if (e.key === 'Enter' || e.key === ' ') {
    if (!document.getElementById('start-screen').classList.contains('hidden')) {
      startGame();
    } else {
      restart();
    }
  }
});

window.addEventListener('resize', () => {
  const cellSize = getCellSize();
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
  boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', restart);

document.addEventListener('click', (e) => {
  if (e.target.closest('.card')) selectCell(e);
});

// Prevent context menu
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
