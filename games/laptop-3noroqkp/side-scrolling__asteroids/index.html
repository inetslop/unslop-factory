<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids Storm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('asteroidsHigh') || '0'); } catch(e) {}
let gameTime = 0;
let difficulty = 1;

// Stars
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            speed: 0.5 + Math.random() * 3,
            size: 0.5 + Math.random() * 2,
            brightness: 0.3 + Math.random() * 0.7
        });
    }
}

// Player
let player = { x: 100, y: 0, w: 40, h: 24, speed: 5, invincible: 0 };
let bullets = [];
let asteroids = [];
let particles = [];
let powerups = [];
let shootCooldown = 0;
let weaponLevel = 1;
let shieldActive = false;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) {
        initAudio();
        startGame();
    } else if (gameState === 'gameover' && (e.code === 'Enter' || e.code === 'KeyR')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    gameState = 'playing';
    score = 0;
    gameTime = 0;
    difficulty = 1;
    player.x = W * 0.15;
    player.y = H / 2;
    player.invincible = 60;
    bullets = [];
    asteroids = [];
    particles = [];
    powerups = [];
    shootCooldown = 0;
    weaponLevel = 1;
    shieldActive = false;
}

// Spawn asteroid
function spawnAsteroid() {
    const size = 20 + Math.random() * 40;
    const speed = (1.5 + Math.random() * 2) * difficulty;
    const y = Math.random() * H;
    const vertices = [];
    const numVerts = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numVerts; i++) {
        const angle = (i / numVerts) * Math.PI * 2;
        const r = size * (0.7 + Math.random() * 0.3);
        vertices.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    asteroids.push({
        x: W + size,
        y: y,
        size: size,
        speed: speed,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.05,
        vertices: vertices,
        hp: Math.ceil(size / 15),
        maxHp: Math.ceil(size / 15)
    });
}

// Particles
function spawnExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            color: color,
            size: 1 + Math.random() * 3
        });
    }
}

function spawnPowerup(x, y) {
    powerups.push({ x: x, y: y, type: Math.random() < 0.5 ? 'weapon' : 'shield', speed: 2 });
}

// Update
let spawnTimer = 0;
function update() {
    if (gameState !== 'playing') return;
    gameTime++;
    difficulty = 1 + gameTime / 600;

    // Stars
    for (let s of stars) {
        s.x -= s.speed * difficulty;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    }

    // Player movement
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed * 0.7;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed * 0.7;
    player.y = Math.max(20, Math.min(H - 20, player.y));
    player.x = Math.max(30, Math.min(W * 0.6, player.x));
    if (player.invincible > 0) player.invincible--;

    // Shooting
    if (shootCooldown > 0) shootCooldown--;
    if ((keys['Space'] || keys['KeyZ']) && shootCooldown <= 0) {
        initAudio();
        playSound('shoot');
        const bx = player.x + 25;
        const by = player.y;
        bullets.push({ x: bx, y: by, vx: 12, vy: 0 });
        if (weaponLevel >= 2) {
            bullets.push({ x: bx, y: by - 8, vx: 12, vy: -2 });
            bullets.push({ x: bx, y: by + 8, vx: 12, vy: 2 });
        }
        if (weaponLevel >= 3) {
            bullets.push({ x: bx, y: by - 14, vx: 10, vy: -4 });
            bullets.push({ x: bx, y: by + 14, vx: 10, vy: 4 });
        }
        shootCooldown = weaponLevel >= 2 ? 8 : 12;
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].vx;
        bullets[i].y += bullets[i].vy;
        if (bullets[i].x > W + 10) bullets.splice(i, 1);
    }

    // Spawn asteroids
    spawnTimer++;
    const spawnRate = Math.max(30, 80 - difficulty * 5);
    if (spawnTimer >= spawnRate) {
        spawnTimer = 0;
        spawnAsteroid();
    }

    // Asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x -= a.speed;
        a.rotation += a.rotSpeed;
        if (a.x < -a.size * 2) { asteroids.splice(i, 1); continue; }

        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            const dx = a.x - b.x, dy = a.y - b.y;
            if (Math.abs(dx) < a.size && Math.abs(dy) < a.size) {
                bullets.splice(j, 1);
                a.hp--;
                spawnExplosion(b.x, b.y, '#ff8844', 5);
                if (a.hp <= 0) {
                    score += Math.ceil(a.size / 5);
                    playSound('explode');
                    spawnExplosion(a.x, a.y, '#ff6633', 12);
                    spawnExplosion(a.x, a.y, '#ffaa00', 8);
                    if (Math.random() < 0.15) spawnPowerup(a.x, a.y);
                    asteroids.splice(i, 1);
                }
                break;
            }
        }

        // Player collision
        if (player.invincible <= 0 && gameState === 'playing') {
            const dx = a.x - player.x, dy = a.y - player.y;
            if (Math.abs(dx) < a.size * 0.7 + 15 && Math.abs(dy) < a.size * 0.7 + 12) {
                if (shieldActive) {
                    shieldActive = false;
                    playSound('explode');
                    spawnExplosion(player.x, player.y, '#44aaff', 15);
                    player.invincible = 60;
                    asteroids.splice(i, 1);
                } else {
                    gameOver();
                    return;
                }
            }
        }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.x -= p.speed;
        if (p.x < -20) { powerups.splice(i, 1); continue; }
        const dx = p.x - player.x, dy = p.y - player.y;
        if (Math.abs(dx) < 30 && Math.abs(dy) < 30) {
            playSound('powerup');
            if (p.type === 'weapon' && weaponLevel < 3) weaponLevel++;
            else if (p.type === 'shield') shieldActive = true;
            powerups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Score over time
    score += Math.floor(gameTime / 30);
}

function gameOver() {
    gameState = 'gameover';
    playSound('hit');
    spawnExplosion(player.x, player.y, '#ff4444', 25);
    spawnExplosion(player.x, player.y, '#ffff44', 15);
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('asteroidsHigh', highScore.toString()); } catch(e) {}
    }
}

// Draw
function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of stars) {
        const alpha = s.brightness * (0.5 + 0.5 * Math.sin(gameTime * 0.02 + s.x));
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }

    if (gameState === 'playing' || gameState === 'gameover') {
        // Powerups
        for (let p of powerups) {
            ctx.save();
            ctx.translate(p.x, p.y);
            if (p.type === 'weapon') {
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('W', 0, 4);
            } else {
                ctx.strokeStyle = '#44aaff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#44aaff';
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('S', 0, 4);
            }
            ctx.restore();
        }

        // Bullets
        for (let b of bullets) {
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#ff8800';
            ctx.shadowBlur = 6;
            ctx.fillRect(b.x - 4, b.y - 2, 8, 4);
            ctx.shadowBlur = 0;
        }

        // Asteroids
        for (let a of asteroids) {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rotation);
            ctx.beginPath();
            ctx.moveTo(a.vertices[0].x, a.vertices[0].y);
            for (let i = 1; i < a.vertices.length; i++) {
                ctx.lineTo(a.vertices[i].x, a.vertices[i].y);
            }
            ctx.closePath();
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, a.size);
            grad.addColorStop(0, '#8B7355');
            grad.addColorStop(1, '#4a3728');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#6b5240';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        // Particles
        for (let p of particles) {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = p.color + Math.floor(alpha * 99).toString(16).padStart(2, '0');
            ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
        }

        // Player
        if (gameState === 'playing') {
            if (player.invincible <= 0 || Math.floor(gameTime / 4) % 2 === 0) {
                ctx.save();
                ctx.translate(player.x, player.y);
                // Ship body
                ctx.fillStyle = '#ddd';
                ctx.beginPath();
                ctx.moveTo(20, 0);
                ctx.lineTo(-15, -12);
                ctx.lineTo(-8, 0);
                ctx.lineTo(-15, 12);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#88f';
                ctx.lineWidth = 1;
                ctx.stroke();
                // Engine glow
                const flameLen = 10 + Math.random() * 8;
                ctx.fillStyle = `rgba(255,${150 + Math.random() * 100},0,0.8)`;
                ctx.beginPath();
                ctx.moveTo(-15, -4);
                ctx.lineTo(-15 - flameLen, 0);
                ctx.lineTo(-15, 4);
                ctx.closePath();
                ctx.fill();
                // Shield
                if (shieldActive) {
                    ctx.strokeStyle = `rgba(68,170,255,${0.5 + 0.3 * Math.sin(gameTime * 0.1)})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 25, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }
    }

    // HUD
    if (gameState === 'playing' || gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, 36);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 24);
        ctx.textAlign = 'center';
        ctx.fillText(`HIGH: ${highScore}`, W / 2, 24);
        ctx.textAlign = 'right';
        ctx.fillStyle = weaponLevel >= 3 ? '#ff8800' : (weaponLevel >= 2 ? '#ffcc00' : '#888');
        ctx.fillText(`WEAPON LV${weaponLevel}`, W - 120, 24);
        if (shieldActive) {
            ctx.fillStyle = '#4af';
            ctx.fillText('SHIELD', W - 30, 24);
        }
    }

    // Start screen
    if (gameState === 'start') {
        drawStartScreen();
    }

    // Game over overlay
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 10);
        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#ffcc00';
            ctx.fillText('NEW HIGH SCORE!', W / 2, H / 2 + 45);
        }
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Press ENTER or R to restart', W / 2, H / 2 + 90);
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6633';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('ASTEROIDS STORM', W / 2, H / 2 - 80);
    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText('Dodge asteroids. Destroy them for points.', W / 2, H / 2 - 30);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('WASD / Arrows — Move', W / 2, H / 2 + 15);
    ctx.fillText('Space / Z — Shoot', W / 2, H / 2 + 40);
    ctx.fillText('Collect W power-ups for better weapons', W / 2, H / 2 + 65);
    ctx.fillText('S = Shield | W = Weapon upgrade', W / 2, H / 2 + 90);
    ctx.fillStyle = '#ffcc00';
    ctx.font = '20px monospace';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('Press ENTER or SPACE to start', W / 2, H / 2 + 140);
}

// Game loop
initStars();
let lastTime = 0;
function loop(time) {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
