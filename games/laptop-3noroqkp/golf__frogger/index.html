<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger Golf</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game states
const STATE = { MENU: 0, PLAYING: 1, AIMING: 2, FLYING: 3, LEVEL_COMPLETE: 4, GAME_OVER: 5 };
let state = STATE.MENU;
let score = 0;
let strokes = 0;
let level = 0;
let frogX, frogY, frogVX, frogVY;
let aimAngle = -Math.PI / 4;
let aimPower = 0;
let mouseX = 0, mouseY = 0;
let isMouseDown = false;
let particles = [];
let time = 0;
let levelCompleteTimer = 0;
let deathTimer = 0;
let deadFrogX, deadFrogY;
let stars = [];

// Generate stars
for (let i = 0; i < 100; i++) {
    stars.push({ x: Math.random(), y: Math.random() * 0.5, s: Math.random() * 2 + 0.5 });
}

// Level definitions
const levels = [
    {
        teeX: 80, teeY: 0, holeX: 750, holeY: 0,
        groundY: 0.82,
        lanes: [
            { y: 0.65, type: 'water', speed: 1, cars: [] },
            { y: 0.55, type: 'traffic', speed: 1.5, cars: [] },
            { y: 0.45, type: 'water', speed: -1, cars: [] }
        ],
        groundSegments: [
            { start: 0, end: 0.2 },
            { start: 0.35, end: 0.6 },
            { start: 0.7, end: 1 }
        ]
    },
    {
        teeX: 80, teeY: 0, holeX: 780, holeY: 0,
        groundY: 0.82,
        lanes: [
            { y: 0.65, type: 'water', speed: 1.5, cars: [] },
            { y: 0.55, type: 'traffic', speed: -2, cars: [] },
            { y: 0.45, type: 'traffic', speed: 1.8, cars: [] },
            { y: 0.35, type: 'water', speed: -1.2, cars: [] }
        ],
        groundSegments: [
            { start: 0, end: 0.15 },
            { start: 0.3, end: 0.45 },
            { start: 0.6, end: 0.75 },
            { start: 0.85, end: 1 }
        ]
    },
    {
        teeX: 60, teeY: 0, holeX: 820, holeY: 0,
        groundY: 0.82,
        lanes: [
            { y: 0.7, type: 'traffic', speed: 2, cars: [] },
            { y: 0.6, type: 'water', speed: -1.5, cars: [] },
            { y: 0.5, type: 'traffic', speed: -2.5, cars: [] },
            { y: 0.4, type: 'water', speed: 1.8, cars: [] },
            { y: 0.3, type: 'traffic', speed: 1.2, cars: [] }
        ],
        groundSegments: [
            { start: 0, end: 0.12 },
            { start: 0.25, end: 0.38 },
            { start: 0.5, end: 0.62 },
            { start: 0.78, end: 1 }
        ]
    }
];

let cars = [];
let crocs = [];

function initLevel(lvl) {
    const def = levels[lvl];
    // Initialize cars
    for (const lane of def.lanes) {
        if (lane.type === 'traffic') {
            const count = Math.floor(W / 120);
            for (let i = 0; i < count; i++) {
                cars.push({
                    x: (i / count) * W + Math.random() * 60,
                    laneY: lane.y,
                    speed: lane.speed * 2,
                    w: 50 + Math.random() * 20,
                    h: 20,
                    color: `hsl(${Math.random()*360}, 70%, 50%)`
                });
            }
        } else if (lane.type === 'water') {
            const count = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < count; i++) {
                crocs.push({
                    x: (i / count) * W + Math.random() * 80,
                    laneY: lane.y,
                    speed: lane.speed * 1.5,
                    w: 40,
                    h: 15
                });
            }
        }
    }
    // Set frog position
    const groundY = H * def.groundY;
    frogX = W * (def.teeX / 800);
    frogY = groundY - 20;
    strokes = 0;
}

function startGame() {
    level = 0;
    score = 0;
    initLevel(level);
    state = STATE.PLAYING;
}

function nextLevel() {
    level++;
    if (level >= levels.length) {
        state = STATE.GAME_OVER;
    } else {
        initLevel(level);
        state = STATE.PLAYING;
    }
}

// Input
window.addEventListener('keydown', (e) => {
    initAudio();
    if (state === STATE.MENU && (e.key === ' ' || e.key === 'Enter')) {
        startGame();
    } else if (state === STATE.LEVEL_COMPLETE && (e.key === ' ' || e.key === 'Enter')) {
        nextLevel();
    } else if (state === STATE.GAME_OVER && (e.key === ' ' || e.key === 'Enter')) {
        startGame();
    } else if (state === STATE.PLAYING) {
        // Use arrow keys for aiming too
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    if (state === STATE.MENU || state === STATE.LEVEL_COMPLETE || state === STATE.GAME_OVER) {
        // Check restart button
        const bx = W / 2, by = H * 0.65;
        if (mouseX > bx - 80 && mouseX < bx + 80 && mouseY > by - 25 && mouseY < by + 25) {
            if (state === STATE.MENU) startGame();
            else if (state === STATE.LEVEL_COMPLETE) nextLevel();
            else startGame();
        }
    }
    if (state === STATE.PLAYING) {
        isMouseDown = true;
        aimPower = 0;
    }
});

canvas.addEventListener('mouseup', (e) => {
    if (state === STATE.PLAYING && isMouseDown) {
        // Launch!
        const power = Math.min(aimPower, 18);
        frogVX = Math.cos(aimAngle) * power;
        frogVY = Math.sin(aimAngle) * power;
        state = STATE.FLYING;
        strokes++;
        playSound(400, 0.2, 'sine', 0.3);
        isMouseDown = false;
        aimPower = 0;
    }
});

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1,
            color: color || '#4f4'
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Drawing functions
function drawBackground() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f0c29');
    grad.addColorStop(0.5, '#1a1a4e');
    grad.addColorStop(1, '#2d2d5e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#fff';
    for (const s of stars) {
        const twinkle = Math.sin(time * 2 + s.x * 10) * 0.5 + 0.5;
        ctx.globalAlpha = twinkle * 0.8;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.s, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Moon
    ctx.fillStyle = '#f0e6ff';
    ctx.beginPath();
    ctx.arc(W * 0.85, H * 0.12, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0f0c29';
    ctx.beginPath();
    ctx.arc(W * 0.85 - 10, H * 0.12 - 5, 26, 0, Math.PI * 2);
    ctx.fill();
}

function drawGround() {
    const def = levels[level];
    const groundY = H * def.groundY;

    for (const seg of def.groundSegments) {
        const sx = seg.start * W;
        const ex = seg.end * W;
        // Grass
        ctx.fillStyle = '#2d5a1b';
        ctx.fillRect(sx, groundY, ex - sx, H - groundY);
        // Top edge
        ctx.fillStyle = '#4a8c2a';
        ctx.fillRect(sx, groundY, ex - sx, 8);
        // Texture
        ctx.fillStyle = '#3d7a25';
        for (let x = sx; x < ex; x += 15) {
            ctx.fillRect(x, groundY + 4, 8, 3);
        }
    }

    // Water in gaps
    const sortedSegs = [...def.groundSegments].sort((a, b) => a.start - b.start);
    for (let i = 0; i < sortedSegs.length - 1; i++) {
        const gapStart = sortedSegs[i].end * W;
        const gapEnd = sortedSegs[i + 1].start * W;
        ctx.fillStyle = '#1a3a5c';
        ctx.fillRect(gapStart, groundY, gapEnd - gapStart, H - groundY);
        // Water animation
        ctx.strokeStyle = 'rgba(100,180,255,0.3)';
        ctx.lineWidth = 2;
        for (let y = groundY + 10; y < H; y += 15) {
            ctx.beginPath();
            for (let x = gapStart; x < gapEnd; x += 5) {
                const yy = y + Math.sin((x * 0.05) + time * 3) * 3;
                if (x === gapStart) ctx.moveTo(x, yy);
                else ctx.lineTo(x, yy);
            }
            ctx.stroke();
        }
    }
}

function drawLanes() {
    const def = levels[level];
    for (const lane of def.lanes) {
        const ly = H * lane.y;
        if (lane.type === 'water') {
            ctx.fillStyle = 'rgba(30,80,140,0.6)';
            ctx.fillRect(0, ly - 10, W, 25);
            ctx.strokeStyle = 'rgba(100,180,255,0.4)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 20) {
                const yy = ly + Math.sin(x * 0.05 + time * 4) * 3;
                ctx.beginPath();
                ctx.moveTo(x, yy);
                ctx.lineTo(x + 15, yy);
                ctx.stroke();
            }
        } else if (lane.type === 'traffic') {
            ctx.fillStyle = '#333';
            ctx.fillRect(0, ly - 8, W, 24);
            // Road markings
            ctx.fillStyle = '#ff0';
            for (let x = 0; x < W; x += 40) {
                ctx.fillRect(x, ly + 3, 20, 3);
            }
        }
    }
}

function drawCars() {
    for (const car of cars) {
        const cy = H * car.laneY;
        // Car body
        ctx.fillStyle = car.color;
        ctx.fillRect(car.x - car.w / 2, cy - car.h / 2, car.w, car.h);
        // Windows
        ctx.fillStyle = 'rgba(200,230,255,0.7)';
        ctx.fillRect(car.x - car.w / 4, cy - car.h / 2 + 3, car.w / 3, car.h / 2);
        // Wheels
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(car.x - car.w / 3, cy + car.h / 2, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(car.x + car.w / 3, cy + car.h / 2, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawCrocs() {
    for (const c of crocs) {
        const cy = H * c.laneY;
        // Body
        ctx.fillStyle = '#2a6b2a';
        ctx.beginPath();
        ctx.ellipse(c.x, cy, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        // Head
        ctx.fillStyle = '#3a8b3a';
        ctx.beginPath();
        ctx.arc(c.x + (c.speed > 0 ? c.w / 2 : -c.w / 2), cy - 5, 10, 0, Math.PI * 2);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc(c.x + (c.speed > 0 ? c.w / 2 + 4 : -c.w / 2 - 4), cy - 8, 3, 0, Math.PI * 2);
        ctx.fill();
        // Teeth
        ctx.fillStyle = '#fff';
        for (let i = -2; i <= 2; i++) {
            ctx.fillRect(c.x + (c.speed > 0 ? c.w / 2 : -c.w / 2) + i * 3, cy, 2, 4);
        }
    }
}

function drawFrog(x, y, scale) {
    const s = scale || 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    // Body
    ctx.fillStyle = '#3cb043';
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    // Head
    ctx.fillStyle = '#4cc94c';
    ctx.beginPath();
    ctx.arc(0, -10, 10, 0, Math.PI * 2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5, -14, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(5, -14, 4, 0, Math.PI * 2);
    ctx.fill();
    // Pupils
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-5, -14, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(5, -14, 2, 0, Math.PI * 2);
    ctx.fill();
    // Legs
    ctx.fillStyle = '#2d8a32';
    ctx.fillRect(-12, 5, 6, 10);
    ctx.fillRect(6, 5, 6, 10);
    ctx.restore();
}

function drawHole() {
    const def = levels[level];
    const hx = W * (def.holeX / 800);
    const groundY = H * def.groundY;
    const hy = groundY;

    // Flag
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(hx, hy - 50);
    ctx.lineTo(hx, hy);
    ctx.stroke();
    // Flag triangle
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.moveTo(hx, hy - 50);
    ctx.lineTo(hx + 25, hy - 40);
    ctx.lineTo(hx, hy - 30);
    ctx.fill();

    // Hole
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(hx, hy, 18, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // Rim
    ctx.strokeStyle = '#4a8c2a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(hx, hy, 18, 8, 0, 0, Math.PI * 2);
    ctx.stroke();
}

function drawAim() {
    if (state !== STATE.PLAYING) return;
    const dx = mouseX - frogX;
    const dy = mouseY - frogY;
    aimAngle = Math.atan2(dy, dx);
    // Clamp angle
    if (aimAngle > 0) aimAngle = 0;
    if (aimAngle < -Math.PI * 0.95) aimAngle = -Math.PI * 0.95;

    const power = isMouseDown ? Math.min(18, aimPower) : 0;
    const maxLen = 120;
    const len = isMouseDown ? (power / 18) * maxLen : 60;

    // Draw trajectory dots
    ctx.fillStyle = 'rgba(255,255,100,0.7)';
    const steps = 12;
    for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const px = frogX + Math.cos(aimAngle) * len * t;
        const py = frogY + Math.sin(aimAngle) * len * t + (t * t * power * power * 0.5);
        ctx.beginPath();
        ctx.arc(px, py, 3 - t, 0, Math.PI * 2);
        ctx.fill();
    }

    // Power indicator
    if (isMouseDown) {
        const pw = (power / 18) * 100;
        ctx.fillStyle = '#333';
        ctx.fillRect(frogX - 50, frogY + 25, 100, 12);
        ctx.fillStyle = power > 14 ? '#f44' : power > 8 ? '#ff4' : '#4f4';
        ctx.fillRect(frogX - 50, frogY + 25, pw, 12);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(frogX - 50, frogY + 25, 100, 12);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Level
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Hole: ${level + 1}/3`, 20, 30);
    ctx.fillText(`Strokes: ${strokes}`, 20, 55);
    ctx.fillText(`Score: ${score}`, 20, 80);

    // Level name
    const names = ['Meadow', 'Creek Crossing', 'Crocodile Canyon'];
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`"${names[level]}"`, 20, 105);
}

function drawMenu() {
    drawBackground();
    // Title
    ctx.fillStyle = '#4f4';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('FROGGER GOLF', W / 2, H * 0.3);

    // Subtitle
    ctx.fillStyle = '#8f8';
    ctx.font = '16px monospace';
    ctx.fillText('Aim and launch the frog into the hole!', W / 2, H * 0.4);
    ctx.fillText('Avoid cars, crocodiles & water!', W / 2, H * 0.45);

    // Controls
    ctx.fillStyle = '#ccc';
    ctx.font = '14px monospace';
    ctx.fillText('MOUSE: Aim | HOLD: Set Power | RELEASE: Launch', W / 2, H * 0.53);
    ctx.fillText('SPACE/ENTER: Confirm | Get frog in hole to advance!', W / 2, H * 0.57);

    // Button
    const bx = W / 2, by = H * 0.65;
    ctx.fillStyle = '#2d5a1b';
    ctx.fillRect(bx - 80, by - 25, 160, 50);
    ctx.strokeStyle = '#4f4';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx - 80, by - 25, 160, 50);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('START', bx, by + 7);

    // Frog on menu
    drawFrog(W / 2, H * 0.75, 2);
}

function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#4f4';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HOLE COMPLETE!', W / 2, H * 0.35);

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Strokes: ${strokes} | Par: 3`, W / 2, H * 0.45);

    const par = strokes <= 3 ? '+$50' : strokes <= 5 ? '+$25' : '+$10';
    ctx.fillStyle = '#ff0';
    ctx.fillText(`Bonus: ${par}`, W / 2, H * 0.52);

    // Button
    const bx = W / 2, by = H * 0.65;
    ctx.fillStyle = '#2d5a1b';
    ctx.fillRect(bx - 80, by - 25, 160, 50);
    ctx.strokeStyle = '#4f4';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx - 80, by - 25, 160, 50);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('NEXT', bx, by + 7);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff0';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('COURSE COMPLETE!', W / 2, H * 0.3);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.42);

    const rank = score >= 80 ? 'GOLDEN FROG!' : score >= 50 ? 'SILVER FROG!' : score >= 20 ? 'BRONZE FROG!' : 'FROGLET';
    ctx.fillStyle = '#4f4';
    ctx.fillText(rank, W / 2, H * 0.5);

    // Button
    const bx = W / 2, by = H * 0.65;
    ctx.fillStyle = '#2d5a1b';
    ctx.fillRect(bx - 80, by - 25, 160, 50);
    ctx.strokeStyle = '#4f4';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx - 80, by - 25, 160, 50);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('RESTART', bx, by + 7);

    drawFrog(W / 2, H * 0.78, 2.5);
}

function checkCollisions() {
    const def = levels[level];
    const groundY = H * def.groundY;

    // Check if frog is in a lane
    for (const car of cars) {
        const cy = H * car.laneY;
        if (frogX > car.x - car.w / 2 && frogX < car.x + car.w / 2 &&
            frogY > cy - car.h && frogY < cy + car.h + 10) {
            return 'car';
        }
    }
    for (const c of crocs) {
        const cy = H * c.laneY;
        if (frogX > c.x - c.w / 2 && frogX < c.x + c.w / 2 &&
            frogY > cy - 15 && frogY < cy + 15) {
            return 'croc';
        }
    }

    // Check if in water lane (not on ground)
    for (const lane of def.lanes) {
        const ly = H * lane.y;
        if (lane.type === 'water' && frogY > ly - 15 && frogY < ly + 15 && frogVY > 0) {
            // Check if on ground segment
            let onGround = false;
            for (const seg of def.groundSegments) {
                if (frogX > seg.start * W && frogX < seg.end * W) onGround = true;
            }
            if (!onGround) return 'water';
        }
    }

    // Check ground collision
    if (frogY >= groundY - 10 && frogVY > 0) {
        // Check if in a gap
        let onSeg = false;
        for (const seg of def.groundSegments) {
            if (frogX > seg.start * W && frogX < seg.end * W) onSeg = true;
        }
        if (!onSeg) return 'water';

        // Landing
        frogY = groundY - 10;
        // Check hole
        const hx = W * (def.holeX / 800);
        if (Math.abs(frogX - hx) < 25) {
            return 'hole';
        }
        return 'land';
    }

    // Out of bounds
    if (frogX < -50 || frogX > W + 50 || frogY > H + 50) return 'oob';
    return null;
}

function handleCollision(result) {
    if (result === 'hole') {
        state = STATE.LEVEL_COMPLETE;
        levelCompleteTimer = 0;
        const par = strokes <= 3 ? 50 : strokes <= 5 ? 25 : 10;
        score += par;
        spawnParticles(frogX, frogY, '#ff0', 30);
        playSound(800, 0.5, 'sine', 0.4);
        setTimeout(() => playSound(1000, 0.5, 'sine', 0.4), 200);
    } else if (result === 'land') {
        state = STATE.PLAYING;
        frogVY = -Math.abs(frogVY) * 0.5;
        // Bounce a bit then stop
        if (Math.abs(frogVY) < 2) {
            frogVY = 0;
            // Check if near hole
            const def = levels[level];
            const hx = W * (def.holeX / 800);
            if (Math.abs(frogX - hx) < 25) {
                return handleCollision('hole');
            }
        }
    } else {
        // Death
        deadFrogX = frogX;
        deadFrogY = frogY;
        state = STATE.PLAYING;
        deathTimer = 60;
        spawnParticles(frogX, frogY, result === 'water' ? '#4af' : '#f44', 20);
        playSound(150, 0.3, 'sawtooth', 0.3);
    }
}

function update() {
    time += 0.016;

    // Update cars
    for (const car of cars) {
        car.x += car.speed;
        if (car.x > W + 60) car.x = -60;
        if (car.x < -60) car.x = W + 60;
    }
    // Update crocs
    for (const c of crocs) {
        c.x += c.speed + Math.sin(time * 2) * 0.5;
        if (c.x > W + 60) c.x = -60;
        if (c.x < -60) c.x = W + 60;
    }

    updateParticles();

    if (state === STATE.FLYING) {
        frogVY += 0.5; // gravity
        frogX += frogVX;
        frogY += frogVY;

        const result = checkCollisions();
        if (result) handleCollision(result);
    }

    if (state === STATE.PLAYING) {
        if (isMouseDown) {
            aimPower += 0.3;
        }
        if (deathTimer > 0) {
            deathTimer--;
            if (deathTimer === 0) {
                // Reset frog
                const def = levels[level];
                const groundY = H * def.groundY;
                frogX = W * (def.teeX / 800);
                frogY = groundY - 20;
            }
        }
    }

    if (state === STATE.LEVEL_COMPLETE) {
        levelCompleteTimer++;
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    if (state === STATE.MENU) {
        drawMenu();
        return;
    }

    drawBackground();
    drawGround();
    drawLanes();
    drawCars();
    drawCrocs();
    drawHole();

    // Draw frog or death indicator
    if (deathTimer > 0) {
        // X mark
        ctx.strokeStyle = '#f44';
        ctx.lineWidth = 3;
        const dx = deadFrogX, dy = deadFrogY;
        ctx.beginPath();
        ctx.moveTo(dx - 10, dy - 10);
        ctx.lineTo(dx + 10, dy + 10);
        ctx.moveTo(dx + 10, dy - 10);
        ctx.lineTo(dx - 10, dy + 10);
        ctx.stroke();
    } else {
        drawFrog(frogX, frogY, 1);
    }

    drawAim();
    drawParticles();
    drawHUD();

    if (state === STATE.LEVEL_COMPLETE) drawLevelComplete();
    if (state === STATE.GAME_OVER) drawGameOver();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Init
initLevel(0);
gameLoop();
</script>
