<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullet Hell Racer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type, freq, duration, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq || 440;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.1));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (duration || 0.1));
}

// Game state
let gameState = 'start'; // start, playing, gameover, paused
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('bhr_high') || '0'); } catch(e) {}
let lives = 3;
let frameCount = 0;
let speed = 1;
let distance = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === 'playing' && e.code === 'KeyP') gameState = 'paused';
    else if (gameState === 'paused' && e.code === 'KeyP') gameState = 'playing';
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Player
let player = {};
function resetPlayer() {
    player = { x: W/2, y: H - 80, w: 30, h: 40, vx: 0, vy: 0, invincible: 0, firing: false };
}

// Bullets (enemy)
let enemyBullets = [];
// Player bullets
let playerBullets = [];
// Enemies
let enemies = [];
// Particles
let particles = [];
// Stars (background)
let stars = [];
// Powerups
let powerups = [];

function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 3 + 1 });
    }
}

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    speed = 1;
    distance = 0;
    frameCount = 0;
    enemyBullets = [];
    playerBullets = [];
    enemies = [];
    particles = [];
    powerups = [];
    resetPlayer();
    initStars();
}

// Bullet pattern emitters
class Enemy {
    constructor(type, x, y) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.timer = 0;
        this.hp = type === 'boss' ? 50 : (type === 'tank' ? 8 : 3);
        this.maxHp = this.hp;
        this.w = type === 'boss' ? 60 : (type === 'tank' ? 40 : 30);
        this.h = type === 'boss' ? 50 : (type === 'tank' ? 35 : 25);
        this.vx = 0;
        this.vy = 1 + Math.random() * 0.5;
        if (type === 'boss') { this.vy = 0.8; }
    }

    update() {
        this.timer++;
        this.y += this.vy * speed;
        this.x += this.vx;

        if (this.type === 'spreader') {
            if (this.timer % Math.max(20, Math.floor(40 / speed)) === 0) {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                for (let i = -2; i <= 2; i++) {
                    enemyBullets.push({ x: this.x, y: this.y + this.h/2, vx: Math.cos(angle + i * 0.3) * 4, vy: Math.sin(angle + i * 0.3) * 4, r: 5, color: '#ff4444' });
                }
            }
        } else if (this.type === 'spiral') {
            if (this.timer % Math.max(8, Math.floor(15 / speed)) === 0) {
                const a = this.timer * 0.2;
                enemyBullets.push({ x: this.x, y: this.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 4, color: '#ff8800' });
                enemyBullets.push({ x: this.x, y: this.y, vx: Math.cos(a + Math.PI) * 3, vy: Math.sin(a + Math.PI) * 3, r: 4, color: '#ff8800' });
            }
        } else if (this.type === 'tank') {
            if (this.timer % Math.max(15, Math.floor(30 / speed)) === 0) {
                for (let i = 0; i < 6; i++) {
                    const a = (Math.PI * 2 / 6) * i + this.timer * 0.05;
                    enemyBullets.push({ x: this.x, y: this.y, vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5, r: 4, color: '#44ff44' });
                }
            }
        } else if (this.type === 'boss') {
            if (this.timer % Math.max(10, Math.floor(20 / speed)) === 0) {
                const phase = Math.floor(this.timer / 60) % 3;
                if (phase === 0) {
                    // Aimed spread
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    for (let i = -3; i <= 3; i++) {
                        enemyBullets.push({ x: this.x, y: this.y + 20, vx: Math.cos(angle + i * 0.15) * 4, vy: Math.sin(angle + i * 0.15) * 4, r: 5, color: '#ff00ff' });
                    }
                } else if (phase === 1) {
                    // Ring
                    for (let i = 0; i < 12; i++) {
                        const a = (Math.PI * 2 / 12) * i + this.timer * 0.1;
                        enemyBullets.push({ x: this.x, y: this.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 4, color: '#ffff00' });
                    }
                } else {
                    // Wall with gap
                    const gapX = player.x + (Math.random() - 0.5) * 200;
                    for (let bx = 0; bx < W; bx += 30) {
                        if (Math.abs(bx - gapX) > 60) {
                            enemyBullets.push({ x: bx, y: this.y + 30, vx: 0, vy: 3, r: 4, color: '#ff0088' });
                        }
                    }
                }
            }
        }

        if (this.y > H + 60) return false;
        return true;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        const hpRatio = this.hp / this.maxHp;

        // Body
        ctx.fillStyle = this.type === 'boss' ? '#ff00ff' : (this.type === 'tank' ? '#44ff44' : (this.type === 'spiral' ? '#ff8800' : '#ff4444'));
        ctx.beginPath();
        if (this.type === 'boss') {
            ctx.moveTo(0, -25);
            ctx.lineTo(30, 15);
            ctx.lineTo(20, 25);
            ctx.lineTo(-20, 25);
            ctx.lineTo(-30, 15);
            ctx.closePath();
        } else {
            ctx.moveTo(0, -this.h/2);
            ctx.lineTo(this.w/2, this.h/2);
            ctx.lineTo(-this.w/2, this.h/2);
            ctx.closePath();
        }
        ctx.fill();

        // Glow
        ctx.shadowBlur = 10;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fill();
        ctx.shadowBlur = 0;

        // HP bar for tank/boss
        if (this.type === 'tank' || this.type === 'boss') {
            ctx.fillStyle = '#333';
            ctx.fillRect(-20, -this.h/2 - 10, 40, 5);
            ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : '#f00';
            ctx.fillRect(-20, -this.h/2 - 10, 40 * hpRatio, 5);
        }

        ctx.restore();
    }
}

function spawnEnemy() {
    const types = ['spreader', 'spiral', 'tank'];
    if (frameCount % 600 === 0 && speed > 1.5) {
        enemies.push(new Enemy('boss', W/2, -40));
        return;
    }
    const type = types[Math.floor(Math.random() * types.length)];
    const x = Math.random() * (W - 60) + 30;
    enemies.push(new Enemy(type, x, -30));
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = Math.random() * 5 + 1;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 30 + Math.random() * 20, color, r: Math.random() * 3 + 1 });
    }
}

function update() {
    if (gameState !== 'playing') return;
    frameCount++;
    distance += speed;
    score = Math.floor(distance) + Math.floor(score);
    speed = 1 + distance * 0.001;

    // Stars
    for (let s of stars) {
        s.y += s.sp * speed;
        if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
    }

    // Player movement
    const pSpeed = 6;
    if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -pSpeed;
    else if (keys['ArrowRight'] || keys['KeyD']) player.vx = pSpeed;
    else player.vx *= 0.8;
    if (keys['ArrowUp'] || keys['KeyW']) player.vy = -3;
    else if (keys['ArrowDown'] || keys['KeyS']) player.vy = 3;
    else player.vy *= 0.8;

    player.x += player.vx;
    player.y += player.vy;
    player.x = Math.max(15, Math.min(W - 15, player.x));
    player.y = Math.max(player.h/2, Math.min(H - player.h/2, player.y));

    if (player.invincible > 0) player.invincible--;

    // Auto fire
    if (frameCount % 8 === 0) {
        playerBullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -10, r: 3 });
    }

    // Update player bullets
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        playerBullets[i].y += playerBullets[i].vy;
        if (playerBullets[i].y < -10) playerBullets.splice(i, 1);
    }

    // Spawn enemies
    const spawnRate = Math.max(60, Math.floor(120 / speed));
    if (frameCount % spawnRate === 0) spawnEnemy();

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!enemies[i].update()) { enemies.splice(i, 1); continue; }
        // Check collision with player bullets
        for (let j = playerBullets.length - 1; j >= 0; j--) {
            const b = playerBullets[j];
            if (Math.abs(b.x - enemies[i].x) < enemies[i].w/2 + 5 && Math.abs(b.y - enemies[i].y) < enemies[i].h/2 + 5) {
                enemies[i].hp--;
                playerBullets.splice(j, 1);
                spawnParticles(b.x, b.y, '#fff', 3);
                playSound('square', 200, 0.05, 0.05);
                if (enemies[i].hp <= 0) {
                    score += enemies[i].type === 'boss' ? 500 : (enemies[i].type === 'tank' ? 100 : 50);
                    spawnParticles(enemies[i].x, enemies[i].y, enemies[i].type === 'boss' ? '#ff00ff' : '#ff4444', 20);
                    playSound('sawtooth', 100, 0.3, 0.15);
                    enemies.splice(i, 1);
                }
                break;
            }
        }
    }

    // Update enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
            enemyBullets.splice(i, 1);
            continue;
        }
        // Hit player
        if (player.invincible <= 0) {
            const dx = b.x - player.x;
            const dy = b.y - player.y;
            if (Math.abs(dx) < 12 + b.r && Math.abs(dy) < 15 + b.r) {
                enemyBullets.splice(i, 1);
                hitPlayer();
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += 2 * speed;
        if (p.y > H + 20) { powerups.splice(i, 1); continue; }
        if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - player.y) < 25) {
            lives = Math.min(lives + 1, 5);
            spawnParticles(player.x, player.y, '#00ffff', 10);
            playSound('sine', 800, 0.2, 0.1);
            powerups.splice(i, 1);
        }
    }

    // Occasional powerup
    if (frameCount % 900 === 0 && lives < 5) {
        powerups.push({ x: Math.random() * (W - 60) + 30, y: -20 });
    }
}

function hitPlayer() {
    lives--;
    player.invincible = 90;
    spawnParticles(player.x, player.y, '#00ffff', 15);
    playSound('sawtooth', 80, 0.4, 0.2);
    if (lives <= 0) {
        gameState = 'gameover';
        try {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bhr_high', String(highScore));
            }
        } catch(e) {}
    }
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of stars) {
        const alpha = s.s / 2.5;
        ctx.fillStyle = `rgba(200,220,255,${alpha})`;
        ctx.fillRect(s.x, s.y, s.s * 0.5, s.s * 3);
    }

    // Speed lines
    if (speed > 1.5) {
        ctx.strokeStyle = 'rgba(100,150,255,0.1)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) {
            const lx = Math.random() * W;
            const ly = Math.random() * H;
            ctx.beginPath();
            ctx.moveTo(lx, ly);
            ctx.lineTo(lx, ly + speed * 10);
            ctx.stroke();
        }
    }

    if (gameState === 'playing' || gameState === 'paused') {
        // Particles
        for (let p of particles) {
            const alpha = p.life / 50;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.min(1, alpha);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Powerups
        for (let p of powerups) {
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';
            ctx.font = '20px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('+', p.x, p.y + 7);
            ctx.shadowBlur = 0;
        }

        // Enemies
        for (let e of enemies) e.draw();

        // Player bullets
        ctx.fillStyle = '#00ffff';
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#00ffff';
        for (let b of playerBullets) {
            ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
        }
        ctx.shadowBlur = 0;

        // Enemy bullets
        for (let b of enemyBullets) {
            ctx.fillStyle = b.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = b.color;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Player
        if (player.invincible <= 0 || frameCount % 6 < 3) {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(15, 15);
            ctx.lineTo(0, 8);
            ctx.lineTo(-15, 15);
            ctx.closePath();
            ctx.fill();
            // Engine glow
            ctx.fillStyle = `rgba(100,200,255,${0.5 + Math.sin(frameCount * 0.3) * 0.3})`;
            ctx.beginPath();
            ctx.moveTo(-5, 15);
            ctx.lineTo(0, 25 + Math.random() * 5);
            ctx.lineTo(5, 15);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${Math.floor(distance) + Math.floor(score - Math.floor(distance))}`, 15, 30);
        ctx.fillText(`SPEED: x${speed.toFixed(1)}`, 15, 52);
        ctx.fillText(`LIVES: ${'♥'.repeat(Math.max(0, lives))}`, 15, 74);

        // Bullet count warning
        if (enemyBullets.length > 30) {
            ctx.fillStyle = `rgba(255,50,50,${0.5 + Math.sin(frameCount * 0.2) * 0.3})`;
            ctx.font = 'bold 14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('⚠ BULLET STORM ⚠', W/2, 30);
        }
    }

    // Start screen
    if (gameState === 'start') {
        drawStartScreen();
    }

    // Game over
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H/2 - 60);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Score: ${Math.floor(distance)}`, W/2, H/2 - 10);
        ctx.fillText(`High Score: ${highScore}`, W/2, H/2 + 30);
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Press SPACE to restart', W/2, H/2 + 80);
    }

    // Paused
    if (gameState === 'paused') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', W/2, H/2);
        ctx.font = '18px monospace';
        ctx.fillText('Press P to resume', W/2, H/2 + 40);
    }
}

function drawStartScreen() {
    initStars();
    for (let s of stars) {
        s.y += s.sp * 0.5;
        if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
        const alpha = s.s / 2.5;
        ctx.fillStyle = `rgba(200,220,255,${alpha})`;
        ctx.fillRect(s.x, s.y, s.s * 0.5, s.s * 3);
    }

    ctx.fillStyle = '#00ffff';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#00ffff';
    ctx.fillText('BULLET HELL', W/2, H/2 - 80);
    ctx.fillStyle = '#ff4444';
    ctx.shadowColor = '#ff4444';
    ctx.fillText('RACER', W/2, H/2 - 30);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ccc';
    ctx.font = '18px monospace';
    const instructions = [
        '← → or A D : Move',
        '↑ ↓ or W S : Fine adjust',
        'Auto-fire enabled',
        'P : Pause',
        '',
        'Dodge bullets. Destroy enemies.',
        'Race for distance! Speed increases!',
    ];
    instructions.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 + 30 + i * 26);
    });

    ctx.fillStyle = `rgba(255,255,255,${0.6 + Math.sin(Date.now() * 0.005) * 0.4})`;
    ctx.font = 'bold 22px monospace';
    ctx.fillText('Press SPACE to Start', W/2, H - 60);

    if (highScore > 0) {
        ctx.fillStyle = '#ff8800';
        ctx.font = '16px monospace';
        ctx.fillText(`High Score: ${highScore}`, W/2, H - 30);
    }
}

// Main loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initStars();
resetPlayer();
gameLoop();
</script>
</body>
</html>
