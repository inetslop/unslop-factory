<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    switch(type) {
        case 'bounce':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            break;
        case 'brick':
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
        case 'asteroid':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            break;
        case 'life':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
        case 'win':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            break;
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let level = 1;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('breakoutAsteroidsHigh') || '0'); } catch(e) {}

// Stars background
let stars = [];
function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 + 0.1 });
    }
}
initStars();

// Paddle
let paddle = { w: 120, h: 16, x: 0, y: 0, speed: 8 };
function resetPaddle() {
    paddle.x = W / 2 - paddle.w / 2;
    paddle.y = H - 50;
}

// Ball
let ball = { x: 0, y: 0, r: 8, vx: 0, vy: 0, speed: 6, stuck: true };
function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;
    ball.vx = 0;
    ball.vy = 0;
    ball.stuck = true;
}

// Bricks (asteroid-shaped)
let bricks = [];
function createBricks() {
    bricks = [];
    const rows = 5 + Math.min(level, 3);
    const cols = Math.min(10 + level, 14);
    const bw = Math.floor((W - 60) / cols);
    const bh = 28;
    const offsetX = (W - cols * bw) / 2;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (Math.random() < 0.15) continue; // some gaps
            const x = offsetX + c * bw;
            const y = 60 + r * (bh + 4);
            const hp = Math.min(3, Math.floor(r / 2) + 1);
            // Generate irregular polygon for asteroid look
            const points = [];
            const numPts = 7 + Math.floor(Math.random() * 4);
            for (let i = 0; i < numPts; i++) {
                const a = (i / numPts) * Math.PI * 2;
                const rad = bw * 0.45 + Math.random() * (bw * 0.15);
                points.push({ ox: Math.cos(a) * rad, oy: Math.sin(a) * (bh * 0.7) });
            }
            bricks.push({ x, y, w: bw - 2, h: bh, hp, maxHp: hp, points, rot: Math.random() * 0.5 - 0.2, alive: true });
        }
    }
}

// Asteroids (falling)
let asteroids = [];
let asteroidTimer = 0;
function spawnAsteroid() {
    const size = 20 + Math.random() * 20;
    const points = [];
    const numPts = 8 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numPts; i++) {
        const a = (i / numPts) * Math.PI * 2;
        const rad = size + Math.random() * (size * 0.3);
        points.push({ ox: Math.cos(a) * rad, oy: Math.sin(a) * rad });
    }
    asteroids.push({
        x: Math.random() * (W - size * 2) + size,
        y: -size,
        r: size,
        vy: 1.5 + Math.random() * (level * 0.5),
        vx: (Math.random() - 0.5) * 2,
        rot: 0,
        rotSpd: (Math.random() - 0.5) * 0.05,
        points,
        hp: Math.ceil(size / 15)
    });
}

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 30 + Math.random() * 20, color });
    }
}

// Power-ups
let powerups = [];
function spawnPowerup(x, y) {
    const types = ['expand', 'multi', 'slow'];
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ x, y, vy: 2, type, r: 12 });
}

let paddleW = 120;
function applyPowerup(type) {
    if (type === 'expand') { paddleW = Math.min(paddleW + 30, 200); }
    else if (type === 'slow') { ball.speed *= 0.85; }
    else if (type === 'multi') { /* just a score bonus for simplicity */ score += 500; }
}

// Input
let keys = {};
let mouseX = null;
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === 'win' && (e.code === 'Space' || e.code === 'Enter')) nextLevel();
    else if (gameState === 'playing' && ball.stuck && e.code === 'Space') launchBall();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; });
canvas.addEventListener('click', () => {
    initAudio();
    if (gameState === 'start') startGame();
    else if (gameState === 'playing' && ball.stuck) launchBall();
});

function launchBall() {
    if (ball.stuck) {
        ball.stuck = false;
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
        ball.vx = Math.cos(angle) * ball.speed;
        ball.vy = Math.sin(angle) * ball.speed;
    }
}

function startGame() {
    initAudio();
    score = 0;
    lives = 3;
    level = 1;
    paddleW = 120;
    resetPaddle();
    resetBall();
    asteroids = [];
    particles = [];
    powerups = [];
    createBricks();
    gameState = 'playing';
}

function nextLevel() {
    level++;
    paddleW = Math.max(paddleW - 20, 80);
    resetPaddle();
    resetBall();
    asteroids = [];
    powerups = [];
    createBricks();
    gameState = 'playing';
}

// Game loop
function update() {
    if (gameState !== 'playing') return;

    // Paddle movement
    if (mouseX !== null) {
        paddle.x += (mouseX - paddle.w / 2 - paddle.x) * 0.3;
    } else {
        if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed;
        if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed;
    }
    paddle.w = paddleW;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    // Ball
    if (ball.stuck) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 2;
    } else {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); playSound('bounce'); }
        if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); playSound('bounce'); }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playSound('bounce'); }

        // Paddle collision
        if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 5 && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
            ball.y = paddle.y - ball.r;
            const hitPos = (ball.x - paddle.x) / paddle.w;
            const angle = -Math.PI / 2 + (hitPos - 0.5) * Math.PI * 0.7;
            ball.vx = Math.cos(angle) * ball.speed;
            ball.vy = Math.sin(angle) * ball.speed;
            playSound('bounce');
        }

        // Ball lost
        if (ball.y - ball.r > H) {
            lives--;
            playSound('life');
            if (lives <= 0) {
                gameState = 'gameover';
                try { if (score > highScore) { highScore = score; localStorage.setItem('breakoutAsteroidsHigh', highScore); } } catch(e) {}
            } else {
                resetBall();
            }
        }

        // Brick collisions
        for (let b of bricks) {
            if (!b.alive) continue;
            if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
                b.hp--;
                playSound('brick');
                spawnParticles(ball.x, ball.y, getBrickColor(b), 8);
                if (b.hp <= 0) {
                    b.alive = false;
                    score += 100 * level;
                    spawnParticles(b.x + b.w/2, b.y + b.h/2, '#888', 12);
                    if (Math.random() < 0.15) spawnPowerup(b.x + b.w/2, b.y + b.h/2);
                } else {
                    score += 25;
                }
                // Bounce ball
                const overlapL = ball.x + ball.r - b.x;
                const overlapR = b.x + b.w - (ball.x - ball.r);
                const overlapT = ball.y + ball.r - b.y;
                const overlapB = b.y + b.h - (ball.y - ball.r);
                const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
                if (minOverlap === overlapT || minOverlap === overlapB) ball.vy = -ball.vy;
                else ball.vx = -ball.vx;
                break;
            }
        }

        // Asteroid collision with ball
        for (let i = asteroids.length - 1; i >= 0; i--) {
            const a = asteroids[i];
            const dx = ball.x - a.x, dy = ball.y - a.y;
            if (Math.sqrt(dx*dx + dy*dy) < a.r + ball.r) {
                a.hp--;
                playSound('asteroid');
                spawnParticles(a.x, a.y, '#a85', 6);
                if (a.hp <= 0) {
                    score += 200 * level;
                    spawnParticles(a.x, a.y, '#c96', 15);
                    asteroids.splice(i, 1);
                } else {
                    // Bounce ball
                    const len = Math.sqrt(dx*dx+dy*dy) || 1;
                    ball.vx += (dx/len) * 3;
                    ball.vy += (dy/len) * 3;
                    const spd = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
                    if (spd > ball.speed * 1.5) {
                        ball.vx = (ball.vx/spd) * ball.speed;
                        ball.vy = (ball.vy/spd) * ball.speed;
                    }
                }
            }
        }

        // Check level complete
        if (bricks.every(b => !b.alive)) {
            gameState = 'win';
            playSound('win');
            score += 1000;
        }
    }

    // Asteroids falling
    asteroidTimer++;
    const spawnRate = Math.max(60 - level * 8, 20);
    if (asteroidTimer >= spawnRate) {
        asteroidTimer = 0;
        spawnAsteroid();
    }
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.y += a.vy;
        a.x += a.vx;
        a.rot += a.rotSpd;
        if (a.x < a.r || a.x > W - a.r) a.vx *= -1;
        // Asteroid hits paddle area = lose life
        if (a.y + a.r > H - 80) {
            spawnParticles(a.x, a.y, '#f44', 10);
            asteroids.splice(i, 1);
            lives--;
            playSound('life');
            if (lives <= 0) {
                gameState = 'gameover';
                try { if (score > highScore) { highScore = score; localStorage.setItem('breakoutAsteroidsHigh', highScore); } } catch(e) {}
            } else resetBall();
        }
    }

    // Power-ups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        if (p.y > H) { powerups.splice(i, 1); continue; }
        // Paddle catch
        if (p.y + p.r > paddle.y && p.y - p.r < paddle.y + paddle.h && p.x > paddle.x && p.x < paddle.x + paddle.w) {
            applyPowerup(p.type);
            playSound('bounce');
            powerups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function getBrickColor(b) {
    if (b.hp >= b.maxHp) return '#7a5c3e';
    if (b.hp > 0) return '#5a4a32';
    return '#444';
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#fff';
    for (let s of stars) {
        s.y += s.sp;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.001 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    // Bricks
    for (let b of bricks) {
        if (!b.alive) continue;
        ctx.save();
        ctx.translate(b.x + b.w/2, b.y + b.h/2);
        ctx.rotate(b.rot);
        ctx.fillStyle = getBrickColor(b);
        ctx.strokeStyle = '#3a2a1a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < b.points.length; i++) {
            const p = b.points[i];
            if (i === 0) ctx.moveTo(p.ox, p.oy);
            else ctx.lineTo(p.ox, p.oy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Crater details
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for (let i = 0; i < 3; i++) {
            const cx = (Math.sin(b.x * 3 + i * 7) * b.w * 0.3);
            const cy = (Math.cos(b.y * 5 + i * 11) * b.h * 0.2);
            ctx.beginPath();
            ctx.arc(cx, cy, 3 + i, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Asteroids
    for (let a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.fillStyle = '#8b6914';
        ctx.strokeStyle = '#5a4510';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < a.points.length; i++) {
            const p = a.points[i];
            if (i === 0) ctx.moveTo(p.ox, p.oy);
            else ctx.lineTo(p.ox, p.oy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // Craters
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        for (let i = 0; i < 4; i++) {
            const cx = Math.sin(a.x + i * 5) * a.r * 0.4;
            const cy = Math.cos(a.y + i * 3) * a.r * 0.4;
            ctx.beginPath();
            ctx.arc(cx, cy, a.r * 0.15 + i, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Power-ups
    for (let p of powerups) {
        ctx.fillStyle = p.type === 'expand' ? '#4af' : p.type === 'slow' ? '#f4a' : '#4f4';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        const label = p.type === 'expand' ? 'W' : p.type === 'slow' ? 'S' : 'M';
        ctx.fillText(label, p.x, p.y + 4);
    }

    // Paddle
    ctx.fillStyle = '#5af';
    ctx.strokeStyle = '#38a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();
    ctx.stroke();
    // Glow
    ctx.shadowColor = '#5af';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Ball
    if (gameState === 'playing') {
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`LIVES: ${lives}`, 20, 52);
    ctx.textAlign = 'right';
    ctx.fillText(`LEVEL: ${level}`, W - 20, 30);
    ctx.font = '12px monospace';
    ctx.fillText(`HI: ${highScore}`, W - 20, 52);

    if (ball.stuck && gameState === 'playing') {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8f8';
        ctx.font = '14px monospace';
        ctx.fillText('Press SPACE or Click to launch', W/2, H - 90);
    }

    if (gameState === 'gameover') {
        drawGameOver();
    } else if (gameState === 'win') {
        drawWinScreen();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('BREAKOUT', W/2, H/2 - 60);
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#a85';
    ctx.fillText('ASTEROIDS', W/2, H/2 - 20);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Bounce the ball to destroy asteroid bricks', W/2, H/2 + 30);
    ctx.fillText('Deflect falling asteroids before they reach the bottom!', W/2, H/2 + 55);

    ctx.fillStyle = '#8f8';
    ctx.fillText('Controls: Arrow Keys / A,D or Mouse to move paddle', W/2, H/2 + 100);
    ctx.fillText('SPACE / Click to launch ball', W/2, H/2 + 125);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('Press SPACE or Click to Start', W/2, H/2 + 180);

    if (highScore > 0) {
        ctx.font = '14px monospace';
        ctx.fillStyle = '#fa0';
        ctx.fillText(`High Score: ${highScore}`, W/2, H/2 + 220);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Final Score: ${score}`, W/2, H/2 + 20);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('Press SPACE to Play Again', W/2, H/2 + 70);
}

function drawWinScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#4f4';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${level} COMPLETE!`, W/2, H/2 - 30);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Score: ${score}`, W/2, H/2 + 15);
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('Press SPACE for Next Level', W/2, H/2 + 70);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
