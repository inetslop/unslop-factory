<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match-3 Breakout</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GAME_W = 840;
const GAME_H = 640;
let scale = 1;
let offsetX = 0, offsetY = 0;

function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    scale = Math.min(w / GAME_W, h / GAME_H);
    canvas.width = w;
    canvas.height = h;
    offsetX = (w - GAME_W * scale) / 2;
    offsetY = (h - GAME_H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    switch(type) {
        case 'bounce':
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(180, now + 0.05);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now); osc.stop(now + 0.05);
            break;
        case 'paddle':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(330, now);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
            break;
        case 'match':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.linearRampToValueAtTime(660, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
            break;
        case 'bigmatch':
            for (let i = 0; i < 4; i++) {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = 'sine';
                o.frequency.setValueAtTime(440 + i * 110, now + i * 0.06);
                g.gain.setValueAtTime(0.12, now + i * 0.06);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.15);
            }
            break;
        case 'lose':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
            break;
        case 'levelup':
            for (let i = 0; i < 5; i++) {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g); g.connect(audioCtx.destination);
                o.type = 'triangle';
                o.frequency.setValueAtTime(300 + i * 80, now + i * 0.08);
                g.gain.setValueAtTime(0.1, now + i * 0.08);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.2);
                o.start(now + i * 0.08); o.stop(now + i * 0.08 + 0.2);
            }
            break;
    }
}

// Game constants
const COLS = 10;
const ROWS = 8;
const BRICK_W = 72;
const BRICK_H = 26;
const BRICK_GAP_X = 4;
const BRICK_GAP_Y = 4;
const GRID_X = (GAME_W - COLS * (BRICK_W + BRICK_GAP_X) + BRICK_GAP_X) / 2;
const GRID_Y = 50;
const PADDLE_W = 110;
const PADDLE_H = 16;
const BALL_R = 8;
const NUM_COLORS = 4;

const COLORS = [
    { fill: '#ff4466', glow: '#ff6688' },
    { fill: '#44aaff', glow: '#66ccff' },
    { fill: '#44ff88', glow: '#66ffaa' },
    { fill: '#ffcc33', glow: '#ffdd66' }
];

// Game state
let state = 'start'; // start, playing, levelcomplete, gameover
let score = 0;
let lives = 3;
let level = 1;
let combo = 0;
let shakeTime = 0;
let shakeMag = 0;

let paddle = { x: GAME_W / 2, w: PADDLE_W, speed: 8 };
let ball = { x: 0, y: 0, vx: 0, vy: 0, active: false, stuck: true };
let bricks = [];
let particles = [];
let floatTexts = [];
let keys = {};

function createBricks() {
    bricks = [];
    const numColors = Math.min(NUM_COLORS + Math.floor((level - 1) / 3), 6);
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let colorIdx;
            // Create patterns that encourage matching
            if (Math.random() < 0.3) {
                // Place a small cluster
                colorIdx = Math.floor(Math.random() * numColors);
            } else {
                colorIdx = Math.floor(Math.random() * numColors);
            }
            // Bias toward neighbors matching
            const left = c > 0 ? bricks.find(b => b.col === c - 1 && b.row === r) : null;
            if (left && Math.random() < 0.4) {
                colorIdx = left.color;
            }
            bricks.push({
                col: c, row: r,
                x: GRID_X + c * (BRICK_W + BRICK_GAP_X),
                y: GRID_Y + r * (BRICK_H + BRICK_GAP_Y),
                w: BRICK_W, h: BRICK_H,
                color: colorIdx,
                alive: true,
                hitFlash: 0
            });
        }
    }
}

function resetBall() {
    ball.stuck = true;
    ball.active = false;
    ball.x = paddle.x;
    ball.y = GAME_H - PADDLE_H - BALL_R - 4;
    ball.vx = 0;
    ball.vy = 0;
}

function launchBall() {
    if (ball.stuck) {
        ball.stuck = false;
        ball.active = true;
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
        const speed = 7;
        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
    }
}

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    combo = 0;
    particles = [];
    floatTexts = [];
    createBricks();
    paddle.x = GAME_W / 2;
    resetBall();
    state = 'playing';
}

function nextLevel() {
    level++;
    createBricks();
    resetBall();
    playSound('levelup');
    state = 'playing';
}

function floodFill(startBrick) {
    if (!startBrick.alive) return [];
    const color = startBrick.color;
    const visited = new Set();
    const queue = [startBrick];
    const result = [];
    
    while (queue.length > 0) {
        const b = queue.shift();
        const key = b.col + ',' + b.row;
        if (visited.has(key)) continue;
        visited.add(key);
        
        if (!b.alive || b.color !== color) continue;
        result.push(b);
        
        for (const [dc, dr] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nc = b.col + dc;
            const nr = b.row + dr;
            if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
                const nb = bricks.find(br => br.col === nc && br.row === nr);
                if (nb && nb.alive && !visited.has(nc + ',' + nr)) {
                    queue.push(nb);
                }
            }
        }
    }
    return result;
}

function clearBricks(group) {
    const count = group.length;
    let points = count * 10;
    if (count >= 3) {
        points += (count - 3) * 15;
        combo++;
        if (combo > 1) points += combo * 5;
        playSound('bigmatch');
        shakeTime = 8;
        shakeMag = Math.min(count * 0.5, 6);
    } else {
        combo = 0;
        playSound('match');
    }
    
    score += points;
    
    const cx = group.reduce((s, b) => s + b.x + b.w/2, 0) / count;
    const cy = group.reduce((s, b) => s + b.y + b.h/2, 0) / count;
    
    floatTexts.push({
        x: cx, y: cy,
        text: count >= 3 ? `MATCH x${count}! +${points}` : `+${points}`,
        life: 60, maxLife: 60,
        size: count >= 5 ? 24 : (count >= 3 ? 20 : 14),
        color: group[0].color
    });
    
    for (const b of group) {
        b.alive = false;
        b.hitFlash = 15;
        // Particles
        for (let i = 0; i < 6; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 3;
            particles.push({
                x: b.x + b.w/2, y: b.y + b.h/2,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                life: 30 + Math.random() * 20,
                maxLife: 50,
                color: COLORS[b.color].fill,
                size: 3 + Math.random() * 4
            });
        }
    }
    
    // Check level complete
    if (bricks.every(b => !b.alive)) {
        state = 'levelcomplete';
    }
}

function updateBall() {
    if (!ball.active || ball.stuck) return;
    
    ball.x += ball.vx;
    ball.y += ball.vy;
    
    // Wall collisions
    if (ball.x - BALL_R <= 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); playSound('bounce'); }
    if (ball.x + BALL_R >= GAME_W) { ball.x = GAME_W - BALL_R; ball.vx = -Math.abs(ball.vx); playSound('bounce'); }
    if (ball.y - BALL_R <= 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy); playSound('bounce'); }
    
    // Paddle collision
    const paddleY = GAME_H - PADDLE_H;
    if (ball.vy > 0 && ball.y + BALL_R >= paddleY && ball.y + BALL_R <= paddleY + PADDLE_H &&
        ball.x >= paddle.x - paddle.w/2 && ball.x <= paddle.x + paddle.w/2) {
        ball.y = paddleY - BALL_R;
        const hitPos = (ball.x - (paddle.x - paddle.w/2)) / paddle.w;
        const angle = -Math.PI/2 + (hitPos - 0.5) * Math.PI * 0.7;
        const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        playSound('paddle');
    }
    
    // Brick collisions
    for (const b of bricks) {
        if (!b.alive) continue;
        
        if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
            ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
            
            // Determine bounce direction
            const overlapL = (ball.x + BALL_R) - b.x;
            const overlapR = (b.x + b.w) - (ball.x - BALL_R);
            const overlapT = (ball.y + BALL_R) - b.y;
            const overlapB = (b.y + b.h) - (ball.y - BALL_R);
            
            const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
            
            if (minOverlap === overlapL || minOverlap === overlapR) {
                ball.vx = -ball.vx;
            } else if (minOverlap === overlapT || minOverlap === overlapB) {
                ball.vy = -ball.vy;
            }
            
            // Trigger match check
            const group = floodFill(b);
            if (group.length >= 3) {
                clearBricks(group);
            } else {
                b.alive = false;
                b.hitFlash = 15;
                combo = 0;
                playSound('match');
                score += 10;
                floatTexts.push({ x: b.x + b.w/2, y: b.y + b.h/2, text: '+10', life: 40, maxLife: 40, size: 12, color: b.color });
                for (let i = 0; i < 4; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 2;
                    particles.push({
                        x: b.x + b.w/2, y: b.y + b.h/2,
                        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1,
                        life: 25 + Math.random() * 15, maxLife: 40,
                        color: COLORS[b.color].fill, size: 3 + Math.random() * 3
                    });
                }
                if (bricks.every(br => !br.alive)) state = 'levelcomplete';
            }
            
            break; // Only process one brick collision per frame
        }
    }
    
    // Ball lost
    if (ball.y - BALL_R > GAME_H) {
        ball.active = false;
        lives--;
        combo = 0;
        playSound('lose');
        if (lives <= 0) {
            state = 'gameover';
        } else {
            resetBall();
        }
    }
}

function update() {
    if (state !== 'playing') return;
    
    // Paddle movement
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
    paddle.x = Math.max(paddle.w/2, Math.min(GAME_W - paddle.w/2, paddle.x));
    
    // Ball stuck follows paddle
    if (ball.stuck) {
        ball.x = paddle.x;
        ball.y = GAME_H - PADDLE_H - BALL_R - 4;
    }
    
    updateBall();
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Float texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        floatTexts[i].y -= 0.8;
        floatTexts[i].life--;
        if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }
    
    // Shake
    if (shakeTime > 0) shakeTime--;
    
    // Brick flash decay
    for (const b of bricks) {
        if (b.hitFlash > 0) b.hitFlash--;
    }
}

function draw() {
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
    
    // Apply shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeMag;
        const sy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(sx, sy);
    }
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-10, -10, GAME_W + 20, GAME_H + 20);
    
    // Subtle grid background
    ctx.strokeStyle = 'rgba(30, 30, 60, 0.3)';
    ctx.lineWidth = 1;
    for (let x = 0; x < GAME_W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GAME_H); ctx.stroke();
    }
    for (let y = 0; y < GAME_H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GAME_W, y); ctx.stroke();
    }
    
    if (state === 'start') {
        drawStartScreen();
    } else if (state === 'gameover') {
        drawGameScreen();
        drawGameOver();
    } else if (state === 'levelcomplete') {
        drawGameScreen();
        drawLevelComplete();
    } else {
        drawGameScreen();
    }
    
    ctx.restore();
}

function drawStartScreen() {
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('MATCH-3 BREAKOUT', GAME_W/2, 180);
    
    // Subtitle
    ctx.font = '18px monospace';
    ctx.fillStyle = '#8888cc';
    ctx.fillText('Bounce the ball to create color matches!', GAME_W/2, 230);
    
    // Instructions
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    const lines = [
        '← → or A/D : Move paddle',
        'SPACE / CLICK : Launch ball',
        '',
        'Hit bricks to trigger matches!',
        '3+ connected same-color bricks clear together',
        'Bigger matches = more points & combos!',
        '',
        'Clear all bricks to advance levels.'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, GAME_W/2, 290 + i * 26);
    });
    
    // Color demo
    const demoColors = [COLORS[0].fill, COLORS[1].fill, COLORS[2].fill, COLORS[3].fill];
    demoColors.forEach((c, i) => {
        ctx.fillStyle = c;
        ctx.fillRect(GAME_W/2 - 80 + i * 45, 520, 35, 14);
    });
    
    // Start prompt
    const pulse = Math.sin(Date.now() / 400) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 255, 100, ${pulse})`;
    ctx.font = 'bold 22px monospace';
    ctx.fillText('PRESS SPACE TO START', GAME_W/2, 590);
}

function drawGameScreen() {
    // Bricks
    for (const b of bricks) {
        if (!b.alive && b.hitFlash <= 0) continue;
        
        if (!b.alive && b.hitFlash > 0) {
            ctx.globalAlpha = b.hitFlash / 15;
            ctx.fillStyle = '#fff';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.globalAlpha = 1;
            continue;
        }
        
        const c = COLORS[b.color];
        // Brick body
        ctx.fillStyle = c.fill;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        // Highlight top
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(b.x, b.y, b.w, 4);
        // Glow border
        ctx.strokeStyle = c.glow;
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    }
    
    // Paddle
    const paddleY = GAME_H - PADDLE_H;
    ctx.fillStyle = '#ddd';
    ctx.fillRect(paddle.x - paddle.w/2, paddleY, paddle.w, PADDLE_H);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(paddle.x - paddle.w/2, paddleY, paddle.w, 3);
    
    // Ball
    if (ball.active || ball.stuck) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R - 2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
        ctx.fill();
    }
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    
    // Float texts
    for (const ft of floatTexts) {
        const alpha = ft.life / ft.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = COLORS[ft.color].glow;
        ctx.font = `bold ${ft.size}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 25);
    ctx.fillText(`LEVEL: ${level}`, 15, 42);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVES: ${'●'.repeat(lives)}`, GAME_W - 15, 25);
    if (combo > 1) {
        ctx.fillStyle = '#ffcc33';
        ctx.fillText(`COMBO x${combo}`, GAME_W - 15, 42);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    
    ctx.fillStyle = '#ff4466';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', GAME_W/2, GAME_H/2 - 40);
    
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`Final Score: ${score}`, GAME_W/2, GAME_H/2 + 10);
    ctx.fillText(`Level Reached: ${level}`, GAME_W/2, GAME_H/2 + 40);
    
    const pulse = Math.sin(Date.now() / 400) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 255, 100, ${pulse})`;
    ctx.font = '18px monospace';
    ctx.fillText('PRESS SPACE TO RESTART', GAME_W/2, GAME_H/2 + 90);
}

function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    
    ctx.fillStyle = '#44ff88';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${level} COMPLETE!`, GAME_W/2, GAME_H/2 - 20);
    
    const pulse = Math.sin(Date.now() / 400) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 255, 100, ${pulse})`;
    ctx.font = '18px monospace';
    ctx.fillText('PRESS SPACE FOR NEXT LEVEL', GAME_W/2, GAME_H/2 + 40);
}

// Input
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    
    if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        initAudio();
        if (state === 'start') startGame();
        else if (state === 'playing') launchBall();
        else if (state === 'gameover') startGame();
        else if (state === 'levelcomplete') nextLevel();
    }
    
    if (e.key === 'r' || e.key === 'R') {
        if (state === 'gameover' || state === 'playing') startGame();
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

canvas.addEventListener('click', () => {
    initAudio();
    if (state === 'start') startGame();
    else if (state === 'playing') launchBall();
    else if (state === 'gameover') startGame();
    else if (state === 'levelcomplete') nextLevel();
});

// Game loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

createBricks();
resetBall();
gameLoop();
</script>
</body>
</html>
