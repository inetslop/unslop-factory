<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Overrun</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#overlay {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
display: flex; flex-direction: column; align-items: center; justify-content: center;
background: rgba(10, 10, 20, 0.92); color: #fff; z-index: 10;
}
#overlay.hidden { display: none; }
#overlay h1 { font-size: clamp(2rem, 6vw, 4rem); color: #ff3333; text-shadow: 0 0 20px #ff3333, 0 0 40px #cc0000; margin-bottom: 10px; letter-spacing: 4px; }
#overlay h2 { font-size: clamp(1rem, 3vw, 1.5rem); color: #aaa; margin-bottom: 20px; font-weight: normal; }
#overlay .controls { font-size: clamp(0.8rem, 2vw, 1.1rem); color: #ccc; text-align: center; line-height: 1.8; margin-bottom: 30px; }
#overlay .controls kbd { background: #333; padding: 2px 8px; border-radius: 4px; border: 1px solid #555; color: #fff; }
#overlay button {
font-size: clamp(1rem, 2.5vw, 1.4rem); padding: 12px 40px; background: #cc2222; color: #fff;
border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s;
box-shadow: 0 0 20px rgba(204,34,34,0.5);
}
#overlay button:hover { background: #ff4444; }
#hud {
position: absolute; top: 10px; left: 10px; color: #fff; z-index: 5;
font-size: clamp(0.8rem, 2vw, 1.1rem); pointer-events: none;
text-shadow: 0 0 4px #000;
}
#hud .health-bar-bg { width: 200px; height: 18px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 4px; }
#hud .health-bar-fill { height: 100%; background: linear-gradient(90deg, #ff3333, #ff6666); transition: width 0.2s; }
#hud .info { display: flex; gap: 20px; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
<h1>ZOMBIE OVERRUN</h1>
<h2>Survive the endless horde</h2>
<div class="controls">
<p><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> — Move</p>
<p><kbd>Mouse</kbd> — Aim &nbsp;|&nbsp; <kbd>Click / Hold</kbd> — Shoot</p>
<p><kbd>R</kbd> — Reload</p>
</div>
<button id="startBtn">START GAME</button>
</div>
<div id="hud" style="display:none;">
<div>HP</div>
<div class="health-bar-bg"><div class="health-bar-fill" id="hpBar" style="width:100%"></div></div>
<div class="info">
<span id="scoreDisplay">Score: 0</span>
<span id="waveDisplay">Wave: 1</span>
<span id="ammoDisplay">Ammo: 30/30</span>
</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
const hpBar = document.getElementById('hpBar');
const scoreDisplay = document.getElementById('scoreDisplay');
const waveDisplay = document.getElementById('waveDisplay');
const ammoDisplay = document.getElementById('ammoDisplay');
const startBtn = document.getElementById('startBtn');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)(); }
function playSound(type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
if (type === 'shoot') {
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
osc.start(); osc.stop(audioCtx.currentTime + 0.1);
} else if (type === 'hit') {
osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15);
gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
osc.start(); osc.stop(audioCtx.currentTime + 0.15);
} else if (type === 'hurt') {
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
osc.start(); osc.stop(audioCtx.currentTime + 0.2);
} else if (type === 'reload') {
osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
osc.start(); osc.stop(audioCtx.currentTime + 0.15);
} else if (type === 'wave') {
osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}
}

// Game state
let gameRunning = false;
let lastTime = 0;
const keys = {};
let mouseDown = false;
let mouseX = 0, mouseY = 0;

let player, zombies, bullets, particles, pickups;
let score, wave, waveTimer, spawnTimer, ammo, magSize, reloading, reloadTime;

function initGame() {
player = { x: W/2, y: H/2, r: 14, speed: 220, hp: 100, maxHp: 100, angle: 0, shootCooldown: 0, invincible: 0 };
zombies = []; bullets = []; particles = []; pickups = [];
score = 0; wave = 1; waveTimer = 0; spawnTimer = 0;
ammo = 30; magSize = 30; reloading = false; reloadTime = 0;
updateHUD();
}

function startGame() {
initAudio();
initGame();
gameRunning = true;
overlay.classList.add('hidden');
hud.style.display = 'block';
lastTime = performance.now();
requestAnimationFrame(loop);
}

startBtn.addEventListener('click', startGame);
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'r') tryReload(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', () => { mouseDown = true; });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function tryReload() {
if (gameRunning && !reloading && ammo < magSize) { reloading = true; reloadTime = 1.5; playSound('reload'); }
}

function updateHUD() {
hpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
scoreDisplay.textContent = 'Score: ' + score;
waveDisplay.textContent = 'Wave: ' + wave;
ammoDisplay.textContent = 'Ammo: ' + ammo + '/' + magSize + (reloading ? ' (RELOADING)' : '');
}

function spawnZombie() {
const side = Math.floor(Math.random() * 4);
let x, y;
if (side === 0) { x = -20; y = Math.random() * H; }
else if (side === 1) { x = W + 20; y = Math.random() * H; }
else if (side === 2) { x = Math.random() * W; y = -20; }
else { x = Math.random() * W; y = H + 20; }
const speedMul = 1 + wave * 0.05;
zombies.push({ x, y, r: 14, speed: (60 + Math.random() * 40) * speedMul, hp: 1 + Math.floor(wave / 3), wobble: Math.random() * Math.PI * 2 });
}

function spawnParticle(x, y, color, count) {
for (let i = 0; i < count; i++) {
const a = Math.random() * Math.PI * 2;
const sp = 50 + Math.random() * 100;
particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.4, maxLife: 0.4 + Math.random() * 0.4, r: 2 + Math.random() * 3, color });
}
}

function loop(now) {
if (!gameRunning) return;
const dt = Math.min((now - lastTime) / 1000, 0.05);
lastTime = now;
update(dt);
render();
requestAnimationFrame(loop);
}

function update(dt) {
// Player movement
let dx = 0, dy = 0;
if (keys['w'] || keys['arrowup']) dy -= 1;
if (keys['s'] || keys['arrowdown']) dy += 1;
if (keys['a'] || keys['arrowleft']) dx -= 1;
if (keys['d'] || keys['arrowright']) dx += 1;
if (dx !== 0 || dy !== 0) {
const len = Math.sqrt(dx*dx + dy*dy);
player.x += (dx/len) * player.speed * dt;
player.y += (dy/len) * player.speed * dt;
}
player.x = Math.max(player.r, Math.min(W - player.r, player.x));
player.y = Math.max(player.r, Math.min(H - player.r, player.y));
player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
if (player.invincible > 0) player.invincible -= dt;

// Shooting
player.shootCooldown -= dt;
if (mouseDown && player.shootCooldown <= 0 && !reloading) {
if (ammo > 0) {
ammo--;
player.shootCooldown = 0.18;
const a = player.angle;
bullets.push({ x: player.x + Math.cos(a)*20, y: player.y + Math.sin(a)*20, vx: Math.cos(a)*500, vy: Math.sin(a)*500, r: 3, life: 1.5 });
playSound('shoot');
// Muzzle flash particles
for (let i = 0; i < 3; i++) {
const sa = a + (Math.random()-0.5)*0.5;
particles.push({ x: player.x + Math.cos(a)*22, y: player.y + Math.sin(a)*22, vx: Math.cos(sa)*150, vy: Math.sin(sa)*150, life: 0.1, maxLife: 0.1, r: 3, color: '#ffff88' });
}
updateHUD();
} else if (ammo === 0 && !reloading) { tryReload(); }
}

// Reload
if (reloading) {
reloadTime -= dt;
if (reloadTime <= 0) { reloading = false; ammo = magSize; updateHUD(); }
}

// Bullets
for (let i = bullets.length - 1; i >= 0; i--) {
const b = bullets[i];
b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
if (b.life <= 0 || b.x < -50 || b.x > W+50 || b.y < -50 || b.y > H+50) { bullets.splice(i, 1); continue; }
for (let j = zombies.length - 1; j >= 0; j--) {
const z = zombies[j];
const ddx = b.x - z.x, ddy = b.y - z.y;
if (ddx*ddx + ddy*ddy < (b.r+z.r)*(b.r+z.r)) {
z.hp--;
playSound('hit');
spawnParticle(z.x, z.y, '#44ff44', 5);
if (z.hp <= 0) {
score += 10;
spawnParticle(z.x, z.y, '#22aa22', 10);
// Pickup chance
if (Math.random() < 0.15) pickups.push({ x: z.x, y: z.y, r: 8, type: Math.random() < 0.5 ? 'health' : 'ammo' });
zombies.splice(j, 1);
}
bullets.splice(i, 1);
break;
}
}
}

// Wave spawning
waveTimer += dt;
const spawnInterval = Math.max(0.3, 2.0 - wave * 0.15);
spawnTimer -= dt;
if (spawnTimer <= 0) {
spawnZombie();
spawnTimer = spawnInterval;
}
if (waveTimer > 25) {
wave++;
waveTimer = 0;
playSound('wave');
// Bonus zombies on new wave
for (let i = 0; i < wave; i++) spawnZombie();
updateHUD();
}

// Zombies
for (const z of zombies) {
z.wobble += dt * 5;
const a = Math.atan2(player.y - z.y, player.x - z.x);
const wobbleX = Math.sin(z.wobble) * 15;
z.x += (Math.cos(a) * z.speed + Math.cos(a + Math.PI/2) * wobbleX) * dt;
z.y += (Math.sin(a) * z.speed + Math.sin(a + Math.PI/2) * wobbleX) * dt;
// Damage player
if (player.invincible <= 0) {
const ddx = player.x - z.x, ddy = player.y - z.y;
if (ddx*ddx + ddy*ddy < (player.r+z.r)*(player.r+z.r)) {
player.hp -= 20 * dt;
player.invincible = 0.3;
playSound('hurt');
spawnParticle(player.x, player.y, '#ff3333', 5);
if (player.hp <= 0) { gameOver(); return; }
updateHUD();
}
}
}

// Pickups
for (let i = pickups.length - 1; i >= 0; i--) {
const p = pickups[i];
const ddx = player.x - p.x, ddy = player.y - p.y;
if (ddx*ddx + ddy*ddy < (player.r+p.r+5)*(player.r+p.r+5)) {
if (p.type === 'health') { player.hp = Math.min(player.maxHp, player.hp + 25); spawnParticle(p.x, p.y, '#ff6688', 8); }
else { ammo = magSize; reloading = false; spawnParticle(p.x, p.y, '#ffff44', 8); }
pickups.splice(i, 1);
updateHUD();
}
}

// Particles
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
if (p.life <= 0) particles.splice(i, 1);
}
}

function gameOver() {
gameRunning = false;
overlay.classList.remove('hidden');
startBtn.textContent = 'RESTART';
document.querySelector('#overlay h1').textContent = 'YOU DIED';
document.querySelector('#overlay h2').textContent = 'Final Score: ' + score + '  |  Wave ' + wave;
}

function render() {
// Background
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, W, H);
// Grid
ctx.strokeStyle = 'rgba(255,255,255,0.04)';
ctx.lineWidth = 1;
const gs = 60;
for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

// Pickups
for (const p of pickups) {
ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
ctx.fillStyle = p.type === 'health' ? '#ff6688' : '#ffff44';
ctx.fill();
ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
ctx.fillText(p.type === 'health' ? '+' : 'A', p.x, p.y + 3);
}

// Particles
for (const p of particles) {
ctx.globalAlpha = p.life / p.maxLife;
ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.life/p.maxLife), 0, Math.PI*2);
ctx.fillStyle = p.color; ctx.fill();
}
ctx.globalAlpha = 1;

// Bullets
ctx.fillStyle = '#ffff88';
for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); }

// Zombies
for (const z of zombies) {
ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2);
ctx.fillStyle = '#3d8b3d'; ctx.fill();
ctx.strokeStyle = '#2a6e2a'; ctx.lineWidth = 2; ctx.stroke();
// Eyes
const a = Math.atan2(player.y - z.y, player.x - z.x);
const ex1 = z.x + Math.cos(a - 0.4) * 5, ey1 = z.y + Math.sin(a - 0.4) * 5;
const ex2 = z.x + Math.cos(a + 0.4) * 5, ey2 = z.y + Math.sin(a + 0.4) * 5;
ctx.fillStyle = '#ff3333';
ctx.beginPath(); ctx.arc(ex1, ey1, 3, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(ex2, ey2, 3, 0, Math.PI*2); ctx.fill();
}

// Player
ctx.save();
ctx.translate(player.x, player.y);
ctx.rotate(player.angle);
// Body
ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI*2);
ctx.fillStyle = player.invincible > 0 ? '#ff6666' : '#4a90d9'; ctx.fill();
ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
// Gun
ctx.fillStyle = '#333';
ctx.fillRect(10, -3, 18, 6);
ctx.restore();

// Crosshair
ctx.strokeStyle = 'rgba(255,255,255,0.7)';
ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.arc(mouseX, mouseY, 12, 0, Math.PI*2); ctx.stroke();
ctx.beginPath(); ctx.moveTo(mouseX-18, mouseY); ctx.lineTo(mouseX+18, mouseY); ctx.stroke();
ctx.beginPath(); ctx.moveTo(mouseX, mouseY-18); ctx.lineTo(mouseX, mouseY+18); ctx.stroke();
}

// Initial render
initGame();
render();
</script>
</body>
</html>
