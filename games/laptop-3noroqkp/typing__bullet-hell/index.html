<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullet Type - Bullet Hell Typing Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'destroy') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'error') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'wave') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Game state
let state = 'START'; // START, PLAYING, GAME_OVER
let score = 0;
let combo = 0;
let maxCombo = 0;
let health = 100;
let wave = 1;
let waveTimer = 0;
let waveDuration = 30;
let typedChars = [];
let targetEnemy = null;
let shakeTime = 0;
let shakeIntensity = 0;
let particles = [];
let enemies = [];
let bullets = [];
let stars = [];
let time = 0;
let lastTime = 0;
let keysDown = {};

// Player
const player = { x: 0, y: 0, radius: 15, speed: 300 };

// Word lists by difficulty
const words = [
    ['fire','ice','wind','star','moon','rain','dust','wave','edge','core'],
    ['blade','shadow','frost','ember','spark','thorn','veil','dawn','dusk','pulse'],
    ['crystal','phantom','venom','titan','pyre','gloom','razor','flux','void','surge'],
    ['nebula','cipher','vortex','aurora','sentry','quartz','magma','thunder','specter','cascade'],
    ['tempest','obsidian','luminance','sentinel','cataclysm','phoenix','valkyrie','chronos','nirvana','apexion']
];

function getWord() {
    const tier = Math.min(4, Math.floor((wave - 1) / 2));
    const list = words[tier];
    return list[Math.floor(Math.random() * list.length)];
}

// Stars background
function initStars() {
    stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 50 + 20 });
    }
}

function initGame() {
    score = 0; combo = 0; maxCombo = 0; health = 100; wave = 1;
    waveTimer = 0; typedChars = []; targetEnemy = null;
    enemies = []; bullets = []; particles = [];
    player.x = W / 2; player.y = H - 60;
    shakeTime = 0;
    state = 'PLAYING';
}

// Spawn patterns
function spawnStraight() {
    const word = getWord();
    const x = 50 + Math.random() * (W - 100);
    enemies.push({
        x, y: -30, word, typedIndex: 0,
        vx: 0, vy: 60 + wave * 8, radius: 20,
        hp: word.length, maxHp: word.length,
        color: `hsl(${Math.random()*360}, 100%, 60%)`,
        pattern: 'straight', life: 0
    });
}

function spawnSpread() {
    const count = 3 + Math.floor(wave / 2);
    const cx = W / 2;
    for (let i = 0; i < count; i++) {
        const angle = -Math.PI/4 + (Math.PI/2) * (i / (count-1));
        const word = getWord();
        enemies.push({
            x: cx, y: -30, word, typedIndex: 0,
            vx: Math.cos(angle) * (80 + wave * 5), vy: 70 + wave * 6, radius: 18,
            hp: word.length, maxHp: word.length,
            color: `hsl(${Math.random()*360}, 100%, 60%)`,
            pattern: 'spread', life: 0
        });
    }
}

function spawnSpiral() {
    const count = 4 + Math.floor(wave / 2);
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + time * 0.5;
        const word = getWord();
        enemies.push({
            x: W/2 + Math.cos(angle) * 100, y: -30, word, typedIndex: 0,
            vx: Math.cos(angle) * (60 + wave * 4), vy: 80 + wave * 5, radius: 18,
            hp: word.length, maxHp: word.length,
            color: `hsl(${(i*360/count)+Math.random()*60}, 100%, 60%)`,
            pattern: 'spiral', life: 0
        });
    }
}

function spawnAimed() {
    const word = getWord();
    const x = 50 + Math.random() * (W - 100);
    const dx = player.x - x;
    const dy = player.y - (-30);
    const dist = Math.sqrt(dx*dx+dy*dy);
    enemies.push({
        x, y: -30, word, typedIndex: 0,
        vx: (dx/dist) * (100 + wave*5), vy: (dy/dist) * (80 + wave*4), radius: 22,
        hp: word.length, maxHp: word.length,
        color: `hsl(${Math.random()*360}, 100%, 55%)`,
        pattern: 'aimed', life: 0
    });
}

function spawnWave() {
    const pattern = Math.random();
    if (pattern < 0.4) spawnStraight();
    else if (pattern < 0.65) spawnSpread();
    else if (pattern < 0.85) spawnSpiral();
    else spawnAimed();
}

function emitParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 200 + 50;
        particles.push({
            x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
            life: 1, maxLife: 1, color, size: Math.random()*4+2
        });
    }
}

function update(dt) {
    if (state !== 'PLAYING') return;
    time += dt;
    waveTimer += dt;

    // Wave progression
    const spawnInterval = Math.max(0.5, 2.5 - wave * 0.15);
    if (waveTimer >= spawnInterval) {
        waveTimer = 0;
        spawnWave();
    }
    if (waveTimer > waveDuration) {
        wave++;
        waveTimer = 0;
        playSound('wave');
    }

    // Player movement
    if (keysDown['ArrowLeft'] || keysDown['a'] || keysDown['A']) player.x -= player.speed * dt;
    if (keysDown['ArrowRight'] || keysDown['d'] || keysDown['D']) player.x += player.speed * dt;
    player.x = Math.max(20, Math.min(W - 20, player.x));

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.life += dt;

        // Bounce off walls
        if (e.x < e.radius) { e.x = e.radius; e.vx *= -1; }
        if (e.x > W - e.radius) { e.x = W - e.radius; e.vx *= -1; }

        // Check if reached player zone
        if (e.y > H - 40) {
            // Hit player or pass through
            const dx = e.x - player.x;
            const dy = e.y - player.y;
            if (Math.sqrt(dx*dx+dy*dy) < player.radius + e.radius) {
                health -= 15;
                combo = 0;
                shakeTime = 0.3; shakeIntensity = 8;
                playSound('hit');
                emitParticles(e.x, e.y, '#ff3333', 15);
            } else {
                // Missed - small penalty
                health -= 5;
                combo = 0;
                shakeTime = 0.15; shakeIntensity = 4;
                playSound('hit');
            }
            enemies.splice(i, 1);
            if (enemies.length > 0) {
                targetEnemy = findTarget();
            }
            continue;
        }

        // Remove if way off screen
        if (e.y > H + 50 || e.x < -100 || e.x > W + 100) {
            enemies.splice(i, 1);
            if (enemies.length > 0) targetEnemy = findTarget();
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 200 * dt; // gravity
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update stars
    for (const s of stars) {
        s.y += s.sp * dt;
        if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
    }

    // Find target
    if (!targetEnemy || !enemies.includes(targetEnemy)) {
        targetEnemy = findTarget();
    }

    // Shake decay
    if (shakeTime > 0) shakeTime -= dt;

    // Game over check
    if (health <= 0) {
        health = 0;
        state = 'GAME_OVER';
    }
}

function findTarget() {
    // Target the enemy with least progress that's closest to player zone
    let best = null;
    let bestScore = Infinity;
    for (const e of enemies) {
        const s = (e.y / H) * 2 - (e.word.length - e.typedIndex);
        if (s < bestScore) { bestScore = s; best = e; }
    }
    return best;
}

function handleChar(ch) {
    if (state !== 'PLAYING') return;
    initAudio();
    if (!targetEnemy) return;
    const expected = targetEnemy.word[targetEnemy.typedIndex];
    if (ch.toLowerCase() === expected.toLowerCase()) {
        targetEnemy.typedIndex++;
        playSound('destroy');
        emitParticles(targetEnemy.x, targetEnemy.y - 10, targetEnemy.color, 3);
        if (targetEnemy.typedIndex >= targetEnemy.word.length) {
            // Destroyed!
            const pts = targetEnemy.word.length * 10 * (1 + combo * 0.5);
            score += Math.floor(pts);
            combo++;
            maxCombo = Math.max(maxCombo, combo);
            emitParticles(targetEnemy.x, targetEnemy.y, targetEnemy.color, 20);
            enemies.splice(enemies.indexOf(targetEnemy), 1);
            targetEnemy = findTarget();
        }
    } else {
        // Error
        playSound('error');
        combo = 0;
        shakeTime = 0.1; shakeIntensity = 3;
    }
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random()-0.5) * shakeIntensity * (shakeTime / 0.3);
        const sy = (Math.random()-0.5) * shakeIntensity * (shakeTime / 0.3);
        ctx.translate(sx, sy);
    }

    // Background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0a0a2e');
    bgGrad.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-10, -10, W+20, H+20);

    // Stars
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    for (const s of stars) {
        ctx.fillRect(s.x, s.y, s.s * 0.5, s.s * 0.5);
    }

    if (state === 'START') {
        drawStartScreen();
    } else if (state === 'PLAYING') {
        drawGame();
    } else if (state === 'GAME_OVER') {
        drawGame();
        drawGameOver();
    }

    ctx.restore();
}

function drawStartScreen() {
    // Title
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.min(64, W*0.08)}px monospace`;
    const titleGrad = ctx.createLinearGradient(W/2-150, 0, W/2+150, 0);
    titleGrad.addColorStop(0, '#ff3366');
    titleGrad.addColorStop(0.5, '#ffcc00');
    titleGrad.addColorStop(1, '#3366ff');
    ctx.fillStyle = titleGrad;
    ctx.fillText('BULLET TYPE', W/2, H*0.3);

    ctx.font = `${Math.min(18, W*0.03)}px monospace`;
    ctx.fillStyle = '#aaccff';
    ctx.fillText('A Bullet-Hell Typing Game', W/2, H*0.3 + 40);

    // Instructions
    ctx.font = `${Math.min(16, W*0.025)}px monospace`;
    ctx.fillStyle = '#8899bb';
    const lines = [
        'Type words that appear on incoming bullets to destroy them.',
        'If bullets reach the bottom, you take damage.',
        '',
        '← → or A D  —  Move your ship',
        'Type letters  —  Destroy targeted bullet',
        '',
        'Build combos for higher scores!',
        '',
    ];
    lines.forEach((l, i) => ctx.fillText(l, W/2, H*0.45 + i * 28));

    // Blink
    if (Math.floor(time * 2) % 2 === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.min(22, W*0.035)}px monospace`;
        ctx.fillText('PRESS SPACE TO START', W/2, H*0.85);
    }

    // Decorative bullets
    for (let i = 0; i < 12; i++) {
        const angle = time * 0.5 + i * Math.PI / 6;
        const r = Math.min(W, H) * 0.35;
        const bx = W/2 + Math.cos(angle) * r;
        const by = H*0.55 + Math.sin(angle) * r * 0.5;
        ctx.beginPath();
        ctx.arc(bx, by, 4, 0, Math.PI*2);
        ctx.fillStyle = `hsl(${(i*30+time*100)%360}, 100%, 60%)`;
        ctx.fill();
    }
}

function drawGame() {
    // Enemies (bullets)
    for (const e of enemies) {
        const isTarget = (e === targetEnemy);
        const glow = isTarget ? 20 : 8;
        
        // Glow
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius + glow, 0, Math.PI*2);
        const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius + glow);
        g.addColorStop(0, e.color.replace(')', ', 0.3)').replace('hsl', 'hsla'));
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = isTarget ? e.color : `rgba(255,255,255,0.05)`;
        ctx.globalAlpha = 0.3;
        ctx.fill();
        ctx.globalAlpha = 1;

        // Core
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
        ctx.fillStyle = isTarget ? '#ffffff' : 'rgba(255,255,255,0.3)';
        ctx.fill();
        ctx.strokeStyle = e.color;
        ctx.lineWidth = isTarget ? 3 : 1;
        ctx.stroke();

        // Word
        const typedPart = e.word.substring(0, e.typedIndex);
        const remaining = e.word.substring(e.typedIndex);
        ctx.font = `bold ${Math.min(14, W*0.02)}px monospace`;
        ctx.textAlign = 'center';
        
        if (typedPart) {
            ctx.fillStyle = '#44ff88';
            ctx.fillText(typedPart, e.x - remaining.length * 3.5, e.y + 5);
        }
        if (remaining) {
            ctx.fillStyle = isTarget ? '#ffffff' : 'rgba(255,255,255,0.6)';
            ctx.fillText(remaining, e.x + typedPart.length * 3.5 - remaining.length * 3.5, e.y + 5);
        }

        // Target indicator
        if (isTarget) {
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 2;
            const pulse = Math.sin(time * 8) * 3;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius + 8 + pulse, 0, Math.PI*2);
            ctx.stroke();
        }

        // Trail
        if (e.life > 0.1) {
            ctx.beginPath();
            ctx.moveTo(e.x - e.vx * 0.1, e.y - e.vy * 0.1);
            ctx.lineTo(e.x, e.y);
            ctx.strokeStyle = e.color;
            ctx.globalAlpha = 0.4;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
    }

    // Particles
    for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Player ship
    drawPlayer();

    // HUD
    drawHUD();
}

function drawPlayer() {
    const px = player.x, py = player.y;
    ctx.save();
    ctx.translate(px, py);
    
    // Ship glow
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI*2);
    const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
    pg.addColorStop(0, 'rgba(50,150,255,0.3)');
    pg.addColorStop(1, 'transparent');
    ctx.fillStyle = pg;
    ctx.fill();

    // Ship body
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-14, 14);
    ctx.lineTo(-6, 8);
    ctx.lineTo(0, 12);
    ctx.lineTo(6, 8);
    ctx.lineTo(14, 14);
    ctx.closePath();
    ctx.fillStyle = '#3399ff';
    ctx.fill();
    ctx.strokeStyle = '#aaddff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Engine flame
    const flameSize = 5 + Math.sin(time * 20) * 3;
    ctx.beginPath();
    ctx.moveTo(-4, 12);
    ctx.lineTo(0, 12 + flameSize);
    ctx.lineTo(4, 12);
    ctx.fillStyle = `hsl(${30 + Math.random()*20}, 100%, 60%)`;
    ctx.fill();

    ctx.restore();
}

function drawHUD() {
    // Health bar
    const bw = Math.min(200, W * 0.3);
    const bx = 20, by = 20;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, 24);
    const hColor = health > 50 ? '#44ff88' : health > 25 ? '#ffcc00' : '#ff3344';
    ctx.fillStyle = hColor;
    ctx.fillRect(bx, by, bw * (health / 100), 20);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.strokeRect(bx, by, bw, 20);

    // Score
    ctx.font = `bold ${Math.min(20, W*0.03)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`SCORE: ${score}`, bx, by + 48);
    
    // Combo
    if (combo > 1) {
        ctx.fillStyle = combo > 5 ? '#ffcc00' : '#ff6699';
        ctx.fillText(`COMBO x${combo}`, bx, by + 72);
    }

    // Wave
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8899bb';
    ctx.font = `${Math.min(16, W*0.025)}px monospace`;
    ctx.fillText(`WAVE ${wave}`, W - 20, 35);

    // Target word display
    if (targetEnemy) {
        const fullWord = targetEnemy.word;
        const typed = fullWord.substring(0, targetEnemy.typedIndex);
        const remaining = fullWord.substring(targetEnemy.typedIndex);
        
        ctx.textAlign = 'center';
        ctx.font = `bold ${Math.min(28, W*0.04)}px monospace`;
        ctx.fillStyle = '#44ff88';
        if (typed) ctx.fillText(typed, W/2 - remaining.length * 7, H - 30);
        ctx.fillStyle = '#ffffff';
        if (remaining) {
            const cursor = Math.floor(time * 4) % 2 === 0 ? '_' : ' ';
            ctx.fillText(remaining + cursor, W/2 + typed.length * 7 - remaining.length * 7, H - 30);
        }
    }

    // Health text
    ctx.textAlign = 'left';
    ctx.font = `${Math.min(12, W*0.02)}px monospace`;
    ctx.fillStyle = '#8899bb';
    ctx.fillText(`HP ${Math.ceil(health)}`, bx + bw + 10, by + 14);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.min(48, W*0.06)}px monospace`;
    ctx.fillStyle = '#ff3344';
    ctx.fillText('GAME OVER', W/2, H*0.35);

    ctx.font = `${Math.min(20, W*0.03)}px monospace`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Final Score: ${score}`, W/2, H*0.45);
    ctx.fillText(`Max Combo: x${maxCombo}`, W/2, H*0.5);
    ctx.fillText(`Wave Reached: ${wave}`, W/2, H*0.55);

    if (Math.floor(time * 2) % 2 === 0) {
        ctx.fillStyle = '#aaccff';
        ctx.font = `bold ${Math.min(18, W*0.028)}px monospace`;
        ctx.fillText('PRESS SPACE TO RESTART', W/2, H*0.7);
    }
}

// Input
window.addEventListener('keydown', (e) => {
    keysDown[e.key] = true;
    
    if (state === 'START' && e.key === ' ') {
        initAudio();
        initGame();
        return;
    }
    if (state === 'GAME_OVER' && e.key === ' ') {
        initAudio();
        initGame();
        return;
    }
    if (state === 'PLAYING') {
        if (e.key.length === 1) {
            handleChar(e.key);
        }
    }
});

window.addEventListener('keyup', (e) => {
    keysDown[e.key] = false;
});

// Prevent scrolling with arrows/space
window.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
        e.preventDefault();
    }
});

// Game loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    if (state === 'PLAYING' || state === 'GAME_OVER') {
        time += dt;
    }
    if (state === 'START') {
        time += dt;
        for (const s of stars) {
            s.y += s.sp * dt;
            if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
        }
    }

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

initStars();
player.x = W / 2;
player.y = H - 60;
requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
