<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Endless</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #2d5a27; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
const STATE = { START: 0, PLAYING: 1, HOLED: 2 };
let state = STATE.START;
let level = 1;
let strokes = 0;
let totalStrokes = 0;
let par = 3;
let score = 0;

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10 };
let hole = { x: 0, y: 0, r: 14 };
let walls = [];
let aimAngle = -Math.PI / 2;
let power = 0;
let charging = false;
let chargeStart = 0;
let ballMoving = false;
let holedAnim = 0;

// Course generation
function generateCourse() {
    par = Math.min(3 + Math.floor((level - 1) / 2), 8);
    strokes = 0;
    
    const margin = 40;
    const courseW = W - margin * 2;
    const courseH = H - margin * 2;
    
    // Ball start position (bottom area)
    ball.x = margin + Math.random() * (courseW * 0.3);
    ball.y = H - margin - 30;
    ball.vx = 0;
    ball.vy = 0;
    
    // Hole position (top area, gets farther as levels increase)
    const distFactor = Math.min(0.4 + level * 0.05, 0.8);
    hole.x = margin + courseW * (0.3 + Math.random() * 0.4);
    hole.y = margin + courseH * (1 - distFactor);
    
    // Generate walls
    walls = [];
    const numWalls = Math.min(2 + level, 15);
    const wallMinLen = 40;
    const wallMaxLen = 80 + level * 5;
    
    for (let i = 0; i < numWalls; i++) {
        let wx, wy, ww, wh;
        const horizontal = Math.random() > 0.5;
        
        if (horizontal) {
            ww = wallMinLen + Math.random() * (wallMaxLen - wallMinLen);
            wh = 12 + Math.random() * 8;
            wx = margin + Math.random() * (courseW - ww);
            wy = margin + 30 + Math.random() * (courseH - 60);
        } else {
            wh = wallMinLen + Math.random() * (wallMaxLen - wallMinLen);
            ww = 12 + Math.random() * 8;
            wx = margin + Math.random() * (courseW - ww);
            wy = margin + 30 + Math.random() * (courseH - wh);
        }
        
        // Don't block start or end
        if (Math.hypot(wx - ball.x, wy - ball.y) < 60) continue;
        if (Math.hypot(wx - hole.x, wy - hole.y) < 60) continue;
        
        walls.push({ x: wx, y: wy, w: ww, h: wh });
    }
    
    // Ensure path exists (simple check - clear walls too close to direct line)
    for (let w of walls) {
        const cx = w.x + w.w / 2;
        const cy = w.y + w.h / 2;
        const t = ((hole.x - ball.x) * (cy - ball.y) - (hole.y - ball.y) * (cx - ball.x)) / 
                  ((hole.x - ball.x) ** 2 + (hole.y - ball.y) ** 2);
        if (t > 0 && t < 1) {
            const px = ball.x + t * (hole.x - ball.x);
            const py = ball.y + t * (hole.y - ball.y);
            if (Math.hypot(px - cx, py - cy) < 25) {
                // Remove this wall to ensure path
                walls.splice(walls.indexOf(w), 1);
                break;
            }
        }
    }
}

// Physics
function updateBall(dt) {
    if (!ballMoving) return;
    
    const friction = 0.985;
    ball.vx *= friction;
    ball.vy *= friction;
    
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    
    // Wall collisions
    for (let w of walls) {
        collideWall(w);
    }
    
    // Border collisions
    const r = ball.r;
    if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx) * 0.8; playSound(200, 0.1, 'square', 0.2); }
    if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * 0.8; playSound(200, 0.1, 'square', 0.2); }
    if (ball.y < r) { ball.y = r; ball.vy = Math.abs(ball.vy) * 0.8; playSound(200, 0.1, 'square', 0.2); }
    if (ball.y > H - r) { ball.y = H - r; ball.vy = -Math.abs(ball.vy) * 0.8; playSound(200, 0.1, 'square', 0.2); }
    
    // Check hole
    const dx = ball.x - hole.x;
    const dy = ball.y - hole.y;
    const dist = Math.hypot(dx, dy);
    const speed = Math.hypot(ball.vx, ball.vy);
    
    if (dist < hole.r && speed < 8) {
        // Gravity into hole
        ball.x += (hole.x - ball.x) * 0.3;
        ball.y += (hole.y - ball.y) * 0.3;
        ball.vx *= 0.5;
        ball.vy *= 0.5;
        
        if (dist < hole.r * 0.4) {
            holed();
        }
    }
    
    // Stop check
    if (Math.abs(ball.vx) < 0.1 && Math.abs(ball.vy) < 0.1) {
        ball.vx = 0;
        ball.vy = 0;
        ballMoving = false;
    }
}

function collideWall(w) {
    const r = ball.r;
    const cx = w.x + w.w / 2;
    const cy = w.y + w.h / 2;
    
    const dx = ball.x - cx;
    const dy = ball.y - cy;
    const hw = w.w / 2 + r;
    const hh = w.h / 2 + r;
    
    if (Math.abs(dx) < hw && Math.abs(dy) < hh) {
        const ox = hw - Math.abs(dx);
        const oy = hh - Math.abs(dy);
        
        if (ox < oy) {
            ball.vx = Math.abs(ball.vx) * 0.8 * Math.sign(dx || 1);
            ball.x = cx + (hw + r) * Math.sign(dx || 1);
        } else {
            ball.vy = Math.abs(ball.vy) * 0.8 * Math.sign(dy || 1);
            ball.y = cy + (hh + r) * Math.sign(dy || 1);
        }
        playSound(300, 0.08, 'square', 0.15);
    }
}

function holed() {
    ballMoving = false;
    state = STATE.HOLED;
    holedAnim = 0;
    
    let points = 0;
    const diff = strokes - par;
    if (diff <= -2) points = 500; // Eagle+
    else if (diff === -1) points = 300; // Birdie
    else if (diff === 0) points = 200; // Par
    else if (diff === 1) points = 100; // Bogey
    else if (diff <= 4) points = Math.max(50, 100 - diff * 10);
    
    score += points;
    totalStrokes += strokes;
    
    playSound(880, 0.2, 'sine', 0.3);
    setTimeout(() => playSound(1100, 0.2, 'sine', 0.3), 100);
    setTimeout(() => playSound(1320, 0.3, 'sine', 0.3), 200);
}

function nextLevel() {
    level++;
    state = STATE.PLAYING;
    generateCourse();
}

// Input
let mouseX = W / 2, mouseY = H / 2;
let mouseDown = false;

window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

window.addEventListener('mousedown', (e) => {
    initAudio();
    if (state === STATE.START) {
        state = STATE.PLAYING;
        generateCourse();
        return;
    }
    if (state === STATE.HOLED && holedAnim > 1.5) {
        nextLevel();
        return;
    }
    if (state === STATE.PLAYING && !ballMoving) {
        charging = true;
        mouseDown = true;
        chargeStart = performance.now();
    }
});

window.addEventListener('mouseup', () => {
    if (charging) {
        hitBall();
    }
    mouseDown = false;
    charging = false;
});

window.addEventListener('keydown', (e) => {
    initAudio();
    if (state === STATE.START && (e.key === ' ' || e.key === 'Enter')) {
        state = STATE.PLAYING;
        generateCourse();
        return;
    }
    if (state === STATE.HOLED && holedAnim > 1.5 && (e.key === ' ' || e.key === 'Enter')) {
        nextLevel();
        return;
    }
    if (state === STATE.PLAYING && !ballMoving) {
        if (e.key === ' ') {
            charging = true;
            chargeStart = performance.now();
        }
        if (e.key === 'ArrowLeft') aimAngle -= 0.1;
        if (e.key === 'ArrowRight') aimAngle += 0.1;
        if (e.key === 'ArrowUp') {
            hitBall(6);
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (charging && e.key === ' ') {
        hitBall();
    }
});

function hitBall(fixedPower) {
    charging = false;
    let p = fixedPower || Math.min(power, 12);
    if (p > 0.5) {
        ball.vx = Math.cos(aimAngle) * p;
        ball.vy = Math.sin(aimAngle) * p;
        ballMoving = true;
        strokes++;
        playSound(440, 0.15, 'triangle', 0.3);
    }
}

// Rendering
function drawCourse() {
    // Background
    ctx.fillStyle = '#3a7d2c';
    ctx.fillRect(0, 0, W, H);
    
    // Grass pattern
    ctx.fillStyle = 'rgba(58, 125, 44, 0.3)';
    for (let i = 0; i < W * H / 2000; i++) {
        const gx = Math.sin(i * 7.3) * W;
        const gy = Math.cos(i * 3.1) * H;
        ctx.beginPath();
        ctx.arc((gx + W) % W, (gy + H) % H, 2, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Fairway path (lighter green from ball to hole)
    const grad = ctx.createLinearGradient(ball.x, ball.y, hole.x, hole.y);
    grad.addColorStop(0, 'rgba(144, 197, 90, 0.2)');
    grad.addColorStop(1, 'rgba(144, 197, 90, 0.2)');
    ctx.strokeStyle = 'rgba(144, 197, 90, 0.15)';
    ctx.lineWidth = 60;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(hole.x, hole.y);
    ctx.stroke();
    
    // Walls
    for (let w of walls) {
        ctx.fillStyle = '#555';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = '#777';
        ctx.fillRect(w.x + 2, w.y + 2, w.w - 4, w.h - 4);
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(w.x + 2, w.y + 2, w.w - 4, 3);
    }
    
    // Hole
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a1a';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r - 3, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    
    // Flag
    const flagWave = Math.sin(performance.now() / 300) * 3;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hole.x, hole.y);
    ctx.lineTo(hole.x, hole.y - 40);
    ctx.stroke();
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.moveTo(hole.x, hole.y - 40);
    ctx.lineTo(hole.x + 20 + flagWave, hole.y - 35);
    ctx.lineTo(hole.x, hole.y - 30);
    ctx.closePath();
    ctx.fill();
}

function drawBall() {
    // Shadow
    ctx.beginPath();
    ctx.ellipse(ball.x + 3, ball.y + 5, ball.r, ball.r * 0.6, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();
    
    // Ball
    const grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#ccc');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawAim() {
    if (ballMoving || state !== STATE.PLAYING) return;
    
    const len = 50 + power * 8;
    const ex = ball.x + Math.cos(aimAngle) * len;
    const ey = ball.y + Math.sin(aimAngle) * len;
    
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Arrow head
    const aSize = 10;
    const aAngle = aimAngle;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(ex + Math.cos(aAngle) * aSize, ey + Math.sin(aAngle) * aSize);
    ctx.lineTo(ex + Math.cos(aAngle + 2.5) * aSize, ey + Math.sin(aAngle + 2.5) * aSize);
    ctx.lineTo(ex + Math.cos(aAngle - 2.5) * aSize, ey + Math.sin(aAngle - 2.5) * aSize);
    ctx.closePath();
    ctx.fill();
    
    // Power bar
    if (charging) {
        const barW = 100;
        const barH = 12;
        const bx = ball.x - barW / 2;
        const by = ball.y + 30;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);
        const pColor = power < 4 ? '#4caf50' : power < 8 ? '#ff9800' : '#f44336';
        ctx.fillStyle = pColor;
        ctx.fillRect(bx, by, (power / 12) * barW, barH);
    }
}

function drawHUD() {
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, 50);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`HOLE: ${level}`, 15, 32);
    ctx.fillText(`STROKES: ${strokes}/${par}`, 160, 32);
    ctx.fillText(`SCORE: ${score}`, 340, 32);
    
    // Par indicator
    const parStr = strokes <= par ? '✓' : (strokes - par === 1 ? '+1' : `+${strokes - par}`);
    ctx.fillStyle = strokes <= par ? '#4caf50' : '#ff9800';
    ctx.fillText(`PAR ${par} (${parStr})`, 480, 32);
    
    // Level progress dots
    const dotR = 5;
    const dotSpacing = 16;
    const startX = W / 2 - (Math.min(level, 10) * dotSpacing) / 2;
    for (let i = 0; i < Math.min(level, 10); i++) {
        ctx.beginPath();
        ctx.arc(startX + i * dotSpacing, H - 25, dotR, 0, Math.PI * 2);
        ctx.fillStyle = i === level - 1 ? '#ffeb3b' : '#4caf50';
        ctx.fill();
    }
}

function drawHoledOverlay() {
    holedAnim += 0.016;
    
    const alpha = Math.min(holedAnim * 2, 1);
    ctx.fillStyle = `rgba(0,0,0,${alpha * 0.5})`;
    ctx.fillRect(0, 0, W, H);
    
    if (holedAnim > 0.3) {
        const scale = Math.min((holedAnim - 0.3) * 3, 1);
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.scale(scale, scale);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('HOLED!', 0, -30);
        
        const diff = strokes - par;
        let label = '';
        if (diff <= -2) label = 'EAGLE! +500';
        else if (diff === -1) label = 'BIRDIE! +300';
        else if (diff === 0) label = 'PAR! +200';
        else if (diff === 1) label = 'BOGEY +100';
        else if (diff <= 4) label = `+${Math.max(50, 100 - diff * 10)}`;
        else label = 'OUT OF BOUNDS';
        
        ctx.font = 'bold 28px monospace';
        ctx.fillStyle = diff <= 0 ? '#4caf50' : '#ff9800';
        ctx.fillText(label, 0, 20);
        
        ctx.font = '20px monospace';
        ctx.fillStyle = '#ccc';
        ctx.fillText(`Strokes: ${strokes} / Par: ${par}`, 0, 60);
        ctx.fillText(`Total Score: ${score}`, 0, 90);
        
        if (holedAnim > 1.5) {
            const blink = Math.sin(performance.now() / 400) > 0;
            if (blink) {
                ctx.font = '22px monospace';
                ctx.fillStyle = '#ffeb3b';
                ctx.fillText('Click or press SPACE for next hole', 0, 150);
            }
        }
        
        ctx.restore();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#2d5a27';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 64px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GOLF ENDLESS', W / 2, H / 3);
    
    // Subtitle
    ctx.font = '24px monospace';
    ctx.fillStyle = '#a5d6a7';
    ctx.fillText('How far can you get?', W / 2, H / 3 + 50);
    
    // Instructions
    ctx.font = '18px monospace';
    ctx.fillStyle = '#ccc';
    const lines = [
        'AIM: Move mouse to set direction',
        'POWER: Hold click/space, release to hit',
        '',
        'Get the ball in the hole in as few strokes as possible',
        'Each hole gets harder. How long can you last?',
        '',
        'Score: Eagle=500 | Birdie=300 | Par=200 | Bogey=100'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H / 2 + 20 + i * 28);
    });
    
    // Start prompt
    const pulse = Math.sin(performance.now() / 500) * 0.3 + 0.7;
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = `rgba(255, 235, 59, ${pulse})`;
    ctx.fillText('Click or press SPACE to start', W / 2, H * 0.85);
    
    // Decorative ball
    const grad = ctx.createRadialGradient(W/2 - 10, H*0.45 - 10, 2, W/2, H*0.45, 25);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#bbb');
    ctx.beginPath();
    ctx.arc(W / 2, H * 0.45, 25, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
}

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1,
            color
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// Main loop
let lastTime = performance.now();
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;
    
    if (state === STATE.PLAYING || state === STATE.HOLED) {
        // Update aim
        if (!ballMoving && state === STATE.PLAYING) {
            aimAngle = Math.atan2(mouseY - ball.y, mouseX - ball.x);
            
            if (charging) {
                const elapsed = (performance.now() - chargeStart) / 1000;
                power = Math.min(elapsed * 8, 12);
            }
        }
        
        updateBall(dt);
        updateParticles(dt);
    }
    
    // Draw
    if (state === STATE.START) {
        drawStartScreen();
    } else {
        drawCourse();
        drawBall();
        drawAim();
        drawParticles();
        drawHUD();
        
        if (state === STATE.HOLED) {
            drawHoledOverlay();
        }
        
        // Particles on hole-in
        if (state === STATE.HOLED && holedAnim < 0.5) {
            if (Math.random() > 0.7) {
                spawnParticles(hole.x, hole.y - 30, '#ffeb3b', 2);
                spawnParticles(hole.x, hole.y - 30, '#4caf50', 2);
            }
        }
    }
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
