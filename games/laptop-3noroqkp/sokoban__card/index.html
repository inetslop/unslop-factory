<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokoban Card Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  width: 100vw; height: 100vh; overflow: hidden; 
  background: #1a3d1a; font-family: 'Georgia', serif;
}
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, scale;
let gameState = 'start'; // start, playing, win, allWin
let animFrame = 0;
let audioCtx = null;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  scale = Math.min(W / 800, H / 600);
}
window.addEventListener('resize', resize);
resize();

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  if (type === 'move') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'push') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(330, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(280, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'place') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(660, audioCtx.currentTime + 0.1);
    gain2.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc2.start(audioCtx.currentTime + 0.1); osc2.stop(audioCtx.currentTime + 0.4);
  } else if (type === 'win') {
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.12);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.12 + 0.3);
      o.start(audioCtx.currentTime + i * 0.12);
      o.stop(audioCtx.currentTime + i * 0.12 + 0.3);
    });
  } else if (type === 'click') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  }
}

// Card designs
const CARDS = [
  { suit: '♥', color: '#e74c3c', label: 'A' },
  { suit: '♦', color: '#e74c3c', label: 'K' },
  { suit: '♣', color: '#2c3e50', label: 'Q' },
  { suit: '♠', color: '#2c3e50', label: 'J' },
  { suit: '♥', color: '#e74c3c', label: '10' },
  { suit: '♦', color: '#e74c3c', label: '9' },
  { suit: '♣', color: '#2c3e50', label: '8' },
  { suit: '♠', color: '#2c3e50', label: '7' }
];

// Level definitions
const LEVELS = [
  {
    name: "Ace High",
    grid: [
      "#######",
      "#     #",
      "# @$ .#",
      "#     #",
      "#######"
    ]
  },
  {
    name: "The Pair",
    grid: [
      "########",
      "# .  . #",
      "# $ $  #",
      "# @    #",
      "#      #",
      "########"
    ]
  },
  {
    name: "Three of a Kind",
    grid: [
      "#########",
      "#   .   #",
      "#   $   #",
      "#  $@$  #",
      "#   $   #",
      "#   .   #",
      "#########"
    ]
  },
  {
    name: "Full House",
    grid: [
      "##########",
      "#  ##  . #",
      "# $@$ $ .#",
      "#  ##  . #",
      "#   @    #",
      "##########"
    ]
  },
  {
    name: "Royal Flush",
    grid: [
      "############",
      "#         #",
      "# $..$    #",
      "# $@$$ .# #",
      "# $..$    #",
      "#         #",
      "############"
    ]
  }
];

let level = 0;
let playerX, playerY;
let cards = []; // {x, y, cardIdx, onGoal}
let goals = [];
let walls = [];
let moves = 0;
let pushes = 0;
let winTimer = 0;

function parseLevel(idx) {
  const grid = LEVELS[idx].grid;
  playerX = -1; playerY = -1;
  cards = []; goals = []; walls = [];
  moves = 0; pushes = 0;
  
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const ch = grid[r][c];
      if (ch === '#') walls.push({x: c, y: r});
      if (ch === '@' || ch === '+') { playerX = c; playerY = r; }
      if (ch === '$') cards.push({x: c, y: r, cardIdx: cards.length, onGoal: false});
      if (ch === '.') goals.push({x: c, y: r});
    }
  }
  
  // Assign cards cyclically
  for (let i = 0; i < cards.length; i++) {
    cards[i].cardIdx = i % CARDS.length;
  }
}

function isWall(x, y) {
  return walls.some(w => w.x === x && w.y === y);
}

function getGridBounds() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const all = [...walls, ...goals];
  all.forEach(p => {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
  });
  return {minX, minY, maxX, maxY};
}

function checkWin() {
  return cards.every(c => c.onGoal);
}

function movePlayer(dx, dy) {
  const nx = playerX + dx;
  const ny = playerY + dy;
  
  if (isWall(nx, ny)) return;
  
  const cardIdx = cards.findIndex(c => c.x === nx && c.y === ny);
  
  if (cardIdx !== -1) {
    const card = cards[cardIdx];
    const bx = nx + dx;
    const by = ny + dy;
    
    if (isWall(bx, by)) return;
    if (cards.some(c => c.x === bx && c.y === by)) return;
    
    card.x = bx;
    card.y = by;
    card.onGoal = goals.some(g => g.x === bx && g.y === by);
    playerX = nx;
    playerY = ny;
    moves++;
    pushes++;
    playSound('push');
    
    if (card.onGoal) setTimeout(() => playSound('place'), 100);
  } else {
    playerX = nx;
    playerY = ny;
    moves++;
    playSound('move');
  }
  
  if (checkWin()) {
    winTimer = 60;
    playSound('win');
  }
}

function undo() {
  // Simple: just restart level
  parseLevel(level);
}

// Drawing functions
function drawFeltBackground() {
  ctx.fillStyle = '#1a3d1a';
  ctx.fillRect(0, 0, W, H);
  
  // Subtle felt texture
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    ctx.fillStyle = `rgba(30, 80, 30, ${Math.random() * 0.1})`;
    ctx.fillRect(x, y, 2, 2);
  }
}

function drawCard(x, y, size, cardData, onGoal, glow) {
  const pad = size * 0.08;
  const cx = x + size/2;
  const cy = y + size/2;
  
  ctx.save();
  
  // Card shadow
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetX = 2;
  ctx.shadowOffsetY = 3;
  
  // Card body
  ctx.fillStyle = onGoal ? '#fffef0' : '#ffffff';
  roundRect(x + pad, y + pad, size - pad*2, size - pad*2, size * 0.1);
  ctx.fill();
  
  // Card border
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = onGoal ? cardData.color : '#ccc';
  ctx.lineWidth = Math.max(1, size * 0.03);
  roundRect(x + pad, y + pad, size - pad*2, size - pad*2, size * 0.1);
  ctx.stroke();
  
  // Glow if on goal
  if (glow) {
    ctx.shadowColor = cardData.color;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = cardData.color;
    ctx.lineWidth = 2;
    roundRect(x + pad, y + pad, size - pad*2, size - pad*2, size * 0.1);
    ctx.stroke();
    ctx.shadowColor = 'transparent';
  }
  
  // Suit symbol
  const fontSize = size * 0.35;
  ctx.font = `bold ${fontSize}px Georgia`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = cardData.color;
  ctx.fillText(cardData.suit, cx, cy - fontSize * 0.1);
  
  // Label
  const labelSize = size * 0.25;
  ctx.font = `bold ${labelSize}px Georgia`;
  ctx.fillStyle = cardData.color;
  ctx.fillText(cardData.label, x + pad + labelSize * 0.6, y + pad + labelSize * 0.7);
  
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawGoal(x, y, size) {
  const pad = size * 0.12;
  ctx.save();
  
  // Card slot outline (dashed)
  const pulse = 0.5 + 0.5 * Math.sin(animFrame * 0.05);
  ctx.strokeStyle = `rgba(255, 215, 0, ${0.4 + pulse * 0.3})`;
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 4]);
  roundRect(x + pad, y + pad, size - pad*2, size - pad*2, size * 0.1);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Small star/suit hint
  ctx.fillStyle = `rgba(255, 215, 0, ${0.3 + pulse * 0.2})`;
  ctx.font = `${size * 0.2}px Georgia`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', x + size/2, y + size/2);
  
  ctx.restore();
}

function drawPlayer(x, y, size) {
  const cx = x + size/2;
  const cy = y + size/2;
  
  ctx.save();
  
  // Player - a little joker character
  const r = size * 0.35;
  
  // Body
  ctx.fillStyle = '#f39c12';
  ctx.beginPath();
  ctx.arc(cx, cy + size*0.1, r, 0, Math.PI * 2);
  ctx.fill();
  
  // Face
  ctx.fillStyle = '#ffeaa7';
  ctx.beginPath();
  ctx.arc(cx, cy - size*0.05, r * 0.8, 0, Math.PI * 2);
  ctx.fill();
  
  // Eyes
  ctx.fillStyle = '#2c3e50';
  ctx.beginPath();
  ctx.arc(cx - r*0.3, cy - size*0.1, r*0.15, 0, Math.PI*2);
  ctx.arc(cx + r*0.3, cy - size*0.1, r*0.15, 0, Math.PI*2);
  ctx.fill();
  
  // Smile
  ctx.strokeStyle = '#2c3e50';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy + size*0.02, r*0.4, 0.1, Math.PI - 0.1);
  ctx.stroke();
  
  // Hat (joker)
  ctx.fillStyle = '#8e44ad';
  ctx.beginPath();
  ctx.moveTo(cx - r*0.7, cy - size*0.2);
  ctx.lineTo(cx + r*0.7, cy - size*0.2);
  ctx.lineTo(cx + r*0.5, cy - size*0.45);
  ctx.lineTo(cx - r*0.5, cy - size*0.45);
  ctx.closePath();
  ctx.fill();
  
  // Hat band
  ctx.fillStyle = '#f1c40f';
  ctx.fillRect(cx - r*0.7, cy - size*0.28, r*1.4, size*0.08);
  
  ctx.restore();
}

function drawWall(x, y, size) {
  const pad = size * 0.05;
  ctx.fillStyle = '#4a3728';
  roundRect(x + pad, y + pad, size - pad*2, size - pad*2, 3);
  ctx.fill();
  
  // Wood grain lines
  ctx.strokeStyle = 'rgba(80, 55, 35, 0.6)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const ly = y + pad + (size - pad*2) * (0.25 + i * 0.25);
    ctx.beginPath();
    ctx.moveTo(x + pad + 4, ly);
    ctx.lineTo(x + size - pad - 4, ly);
    ctx.stroke();
  }
}

function drawFloor(x, y, size) {
  ctx.fillStyle = '#2d5a27';
  ctx.fillRect(x, y, size, size);
  
  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, size, size);
}

function drawGame() {
  const bounds = getGridBounds();
  const gridW = bounds.maxX - bounds.minX + 2;
  const gridH = bounds.maxY - bounds.minY + 2;
  
  const cellSize = Math.min((W * 0.8) / gridW, (H * 0.75) / gridH);
  const offsetX = (W - gridW * cellSize) / 2;
  const offsetY = (H - gridH * cellSize) / 2 + 20;
  
  // Draw floor
  for (let r = bounds.minY; r <= bounds.maxY; r++) {
    for (let c = bounds.minX; c <= bounds.maxX; c++) {
      if (!isWall(c, r)) {
        drawFloor(offsetX + (c - bounds.minX) * cellSize, offsetY + (r - bounds.minY) * cellSize, cellSize);
      }
    }
  }
  
  // Draw goals
  goals.forEach(g => {
    drawGoal(
      offsetX + (g.x - bounds.minX) * cellSize,
      offsetY + (g.y - bounds.minY) * cellSize,
      cellSize
    );
  });
  
  // Draw walls
  walls.forEach(w => {
    drawWall(
      offsetX + (w.x - bounds.minX) * cellSize,
      offsetY + (w.y - bounds.minY) * cellSize,
      cellSize
    );
  });
  
  // Draw cards
  cards.forEach(c => {
    const cardData = CARDS[c.cardIdx];
    drawCard(
      offsetX + (c.x - bounds.minX) * cellSize,
      offsetY + (c.y - bounds.minY) * cellSize,
      cellSize,
      cardData,
      c.onGoal,
      c.onGoal && animFrame % 60 < 30
    );
  });
  
  // Draw player
  drawPlayer(
    offsetX + (playerX - bounds.minX) * cellSize,
    offsetY + (playerY - bounds.minY) * cellSize,
    cellSize
  );
  
  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 50);
  
  ctx.fillStyle = '#f1c40f';
  ctx.font = `bold ${Math.min(24, W*0.03)}px Georgia`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`♥ ${LEVELS[level].name} ♥`, 20, 25);
  
  ctx.fillStyle = '#ecf0f1';
  ctx.font = `${Math.min(16, W*0.02)}px Georgia`;
  ctx.textAlign = 'right';
  const onGoalCount = cards.filter(c => c.onGoal).length;
  ctx.fillText(`Cards: ${onGoalCount}/${cards.length}  Moves: ${moves}`, W - 20, 25);
  
  // Win overlay
  if (winTimer > 0) {
    winTimer--;
    const alpha = Math.min(1, (60 - winTimer) / 20);
    ctx.fillStyle = `rgba(0,0,0,${alpha * 0.7})`;
    ctx.fillRect(0, 0, W, H);
    
    if (winTimer < 40) {
      ctx.fillStyle = '#f1c40f';
      ctx.font = `bold ${Math.min(48, W*0.06)}px Georgia`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★ Perfect Hand! ★', W/2, H/2 - 30);
      
      ctx.fillStyle = '#ecf0f1';
      ctx.font = `${Math.min(24, W*0.03)}px Georgia`;
      ctx.fillText(`Solved in ${moves} moves, ${pushes} pushes`, W/2, H/2 + 20);
      
      if (level < LEVELS.length - 1) {
        ctx.fillStyle = '#f39c12';
        ctx.font = `${Math.min(20, W*0.025)}px Georgia`;
        ctx.fillText('Press SPACE for next hand', W/2, H/2 + 70);
      } else {
        ctx.fillStyle = '#f39c12';
        ctx.font = `${Math.min(20, W*0.025)}px Georgia`;
        ctx.fillText('You\'ve collected the Royal Flush!', W/2, H/2 + 60);
        ctx.fillText('Press SPACE to play again', W/2, H/2 + 100);
      }
    }
    
    if (winTimer <= 0) {
      gameState = 'levelComplete';
    }
  }
}

function drawStartScreen() {
  drawFeltBackground();
  
  // Decorative cards in background
  const t = animFrame * 0.02;
  for (let i = 0; i < 8; i++) {
    const x = W * 0.1 + (i / 8) * W * 0.8 + Math.sin(t + i) * 20;
    const y = H * 0.7 + Math.cos(t + i * 0.5) * 30;
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t + i) * 0.3);
    drawCard(0, 0, 60, CARDS[i % CARDS.length], false, false);
    ctx.restore();
  }
  
  // Title card
  const titleSize = Math.min(W * 0.7, 500);
  const tx = (W - titleSize) / 2;
  const ty = H * 0.15;
  
  ctx.fillStyle = '#fffef0';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 20;
  roundRect(tx, ty, titleSize, H * 0.6, 15);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  
  ctx.strokeStyle = '#f1c40f';
  ctx.lineWidth = 3;
  roundRect(tx + 8, ty + 8, titleSize - 16, H * 0.6 - 16, 12);
  ctx.stroke();
  
  // Title
  ctx.fillStyle = '#2c3e50';
  ctx.font = `bold ${Math.min(42, W*0.05)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SOKOBAN', W/2, ty + H*0.12);
  ctx.fillStyle = '#e74c3c';
  ctx.font = `bold ${Math.min(52, W*0.06)}px Georgia`;
  ctx.fillText('CARD GAME', W/2, ty + H*0.22);
  
  // Suits decoration
  const suitY = ty + H * 0.35;
  const suitSize = Math.min(30, W * 0.04);
  ctx.font = `${suitSize}px Georgia`;
  ctx.fillStyle = '#e74c3c';
  ctx.fillText('♥', W/2 - suitSize*1.5, suitY);
  ctx.fillText('♦', W/2 + suitSize*0.5, suitY);
  ctx.fillStyle = '#2c3e50';
  ctx.fillText('♣', W/2 - suitSize*0.5, suitY);
  ctx.fillText('♠', W/2 + suitSize*1.5, suitY);
  
  // Instructions
  ctx.fillStyle = '#555';
  ctx.font = `${Math.min(16, W*0.02)}px Georgia`;
  const lines = [
    'Push all cards onto the golden slots to win!',
    '',
    '↑↓←→ / WASD — Move',
    'U — Restart level',
    'SPACE — Confirm / Next Level',
    '',
    'You are the Joker. Guide the cards home!'
  ];
  lines.forEach((line, i) => {
    ctx.fillText(line, W/2, ty + H*0.45 + i * suitSize * 0.7);
  });
  
  // Start prompt
  const pulse = 0.6 + 0.4 * Math.sin(animFrame * 0.08);
  ctx.fillStyle = `rgba(241, 196, 15, ${pulse})`;
  ctx.font = `bold ${Math.min(24, W*0.03)}px Georgia`;
  ctx.fillText('Press SPACE to Deal In', W/2, ty + H * 0.85);
}

function drawAllWin() {
  drawFeltBackground();
  
  // Confetti
  for (let i = 0; i < 30; i++) {
    const x = ((i * 137 + animFrame * 2) % W);
    const y = ((i * 89 + animFrame * 3) % H);
    ctx.fillStyle = CARDS[i % 4].color;
    ctx.globalAlpha = 0.6;
    ctx.font = '16px Georgia';
    ctx.fillText(CARDS[i%4].suit, x, y);
    ctx.globalAlpha = 1;
  }
  
  ctx.fillStyle = '#f1c40f';
  ctx.font = `bold ${Math.min(48, W*0.06)}px Georgia`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★ ROYAL FLUSH COMPLETE! ★', W/2, H * 0.3);
  
  ctx.fillStyle = '#ecf0f1';
  ctx.font = `${Math.min(24, W*0.03)}px Georgia`;
  ctx.fillText('You mastered all hands!', W/2, H * 0.45);
  ctx.fillText('Press SPACE for a new game', W/2, H * 0.6);
}

function render() {
  animFrame++;
  
  if (gameState === 'start') {
    drawStartScreen();
  } else if (gameState === 'playing' || gameState === 'levelComplete') {
    drawFeltBackground();
    drawGame();
  } else if (gameState === 'allWin') {
    drawAllWin();
  }
  
  requestAnimationFrame(render);
}

// Input handling
window.addEventListener('keydown', (e) => {
  initAudio();
  
  if (gameState === 'start') {
    if (e.key === ' ' || e.key === 'Enter') {
      playSound('click');
      level = 0;
      parseLevel(level);
      gameState = 'playing';
    }
  } else if (gameState === 'playing') {
    let dx = 0, dy = 0;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dy = -1;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dy = 1;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dx = -1;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dx = 1;
    
    if (dx !== 0 || dy !== 0) {
      e.preventDefault();
      movePlayer(dx, dy);
    }
    
    if (e.key === 'u' || e.key === 'U') {
      parseLevel(level);
      playSound('click');
    }
  } else if (gameState === 'levelComplete') {
    if (e.key === ' ' || e.key === 'Enter') {
      playSound('click');
      level++;
      if (level >= LEVELS.length) {
        gameState = 'allWin';
      } else {
        parseLevel(level);
        gameState = 'playing';
      }
    }
  } else if (gameState === 'allWin') {
    if (e.key === ' ' || e.key === 'Enter') {
      playSound('click');
      level = 0;
      parseLevel(level);
      gameState = 'playing';
    }
  }
});

// Prevent scrolling with arrow keys
window.addEventListener('keydown', (e) => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
    e.preventDefault();
  }
});

// Initialize
parseLevel(0);
render();
</script>
</body>
</html>
