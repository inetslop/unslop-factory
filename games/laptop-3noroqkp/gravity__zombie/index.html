<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Zombie</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'kill') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'hurt') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('gz_high') || '0'); } catch(e) {}
let wave = 1;
let waveTimer = 0;
let zombiesPerWave = 5;

const GRAVITY = 0.6;
const PLAYER_SPEED = 4;
const JUMP_FORCE = -12;
const SHOOT_COOLDOWN = 15;
const ZOMBIE_SPEED = 1.2;

let player = { x: 0, y: 0, w: 30, h: 40, vx: 0, vy: 0, onGround: false, facing: 1, hp: 5, maxHp: 5, shootTimer: 0, invincible: 0 };
let zombies = [];
let bullets = [];
let particles = [];
let platforms = [];
let keys = {};
let lastTime = 0;

function setupPlatforms() {
    platforms = [
        { x: 0, y: H - 40, w: W, h: 40 }, // ground
        { x: W * 0.15, y: H - 140, w: W * 0.2, h: 16 },
        { x: W * 0.6, y: H - 180, w: W * 0.25, h: 16 },
        { x: W * 0.35, y: H - 260, w: W * 0.2, h: 16 },
        { x: W * 0.75, y: H - 320, w: W * 0.18, h: 16 },
        { x: W * 0.05, y: H - 350, w: W * 0.15, h: 16 },
    ];
}

function resetGame() {
    score = 0;
    wave = 1;
    waveTimer = 0;
    zombiesPerWave = 5;
    zombies = [];
    bullets = [];
    particles = [];
    setupPlatforms();
    player.x = W / 2 - player.w / 2;
    player.y = H - 40 - player.h;
    player.vx = 0;
    player.vy = 0;
    player.onGround = true;
    player.facing = 1;
    player.hp = player.maxHp;
    player.shootTimer = 0;
    player.invincible = 0;
}

function spawnZombie() {
    const x = Math.random() * (W - 40) + 20;
    const z = {
        x: x, y: -50, w: 30, h: 40, vx: 0, vy: 0,
        hp: 1 + Math.floor(wave / 3), maxHp: 1 + Math.floor(wave / 3),
        speed: ZOMBIE_SPEED + Math.random() * 0.5 + wave * 0.1,
        onGround: false, wobble: Math.random() * Math.PI * 2,
        type: Math.random() < 0.2 && wave >= 3 ? 'brute' : 'normal'
    };
    if (z.type === 'brute') { z.w = 40; z.h = 50; z.hp = z.maxHp = 3 + Math.floor(wave / 2); z.speed *= 0.7; }
    zombies.push(z);
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, life: 30 + Math.random() * 20, color, size: Math.random() * 5 + 2 });
    }
}

function shootBullet() {
    if (player.shootTimer > 0) return;
    player.shootTimer = SHOOT_COOLDOWN;
    const bx = player.facing > 0 ? player.x + player.w : player.x - 8;
    bullets.push({ x: bx, y: player.y + player.h / 2 - 4, w: 12, h: 6, vx: player.facing * 10 });
    playSound('shoot');
}

function update(dt) {
    if (gameState !== 'playing') return;

    // Wave spawning
    waveTimer++;
    const spawnInterval = Math.max(30, 90 - wave * 5);
    if (zombies.length < zombiesPerWave + wave && waveTimer % spawnInterval === 0) {
        spawnZombie();
    }
    if (zombies.length === 0 && waveTimer > 120) {
        wave++;
        zombiesPerWave += 2;
        waveTimer = 0;
    }

    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -PLAYER_SPEED; player.facing = -1; }
    else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = PLAYER_SPEED; player.facing = 1; }
    else player.vx = 0;

    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        playSound('jump');
    }

    if (keys['KeyF'] || keys['KeyJ'] || keys['Space'] === true && keys['KeyF']) {
        shootBullet();
    }

    // Physics
    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;
    player.shootTimer--;
    if (player.invincible > 0) player.invincible--;

    // Platform collision for player
    player.onGround = false;
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            if (player.vy >= 0 && player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + player.vy + 2) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    }

    // Clamp player
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;
    if (player.y + player.h > H) { player.hp = 0; }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].vx;
        if (bullets[i].x < -20 || bullets[i].x > W + 20) bullets.splice(i, 1);
    }

    // Zombies
    for (let z of zombies) {
        z.vy += GRAVITY;
        z.y += z.vy;
        z.wobble += 0.05;

        // Platform collision for zombies
        z.onGround = false;
        for (let p of platforms) {
            if (z.x + z.w > p.x && z.x < p.x + p.w) {
                if (z.vy >= 0 && z.y + z.h >= p.y && z.y + z.h <= p.y + p.h + z.vy + 2) {
                    z.y = p.y - z.h;
                    z.vy = 0;
                    z.onGround = true;
                }
            }
        }

        // Walk toward player when on ground
        if (z.onGround) {
            const dir = player.x > z.x ? 1 : -1;
            z.vx = dir * z.speed;
        } else {
            z.vx *= 0.95;
        }
        z.x += z.vx;

        // Clamp zombie
        if (z.x < 0) z.x = 0;
        if (z.x + z.w > W) z.x = W - z.w;

        // Zombie hits player
        if (player.invincible <= 0 && checkCollision(player, z)) {
            player.hp--;
            player.invincible = 60;
            playSound('hurt');
            spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 10);
        }

        // Bullet hits zombie
        for (let i = bullets.length - 1; i >= 0; i--) {
            if (checkCollision(bullets[i], z)) {
                bullets.splice(i, 1);
                z.hp--;
                playSound('hit');
                spawnParticles(z.x + z.w/2, z.y + z.h/2, '#44ff44', 5);
                if (z.hp <= 0) {
                    score += z.type === 'brute' ? 50 : 10;
                    playSound('kill');
                    spawnParticles(z.x + z.w/2, z.y + z.h/2, '#88ff44', 15);
                    zombies.splice(zombies.indexOf(z), 1);
                }
            }
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].vy += 0.3;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // Game over
    if (player.hp <= 0) {
        gameState = 'gameover';
        if (score > highScore) {
            highScore = score;
            try { localStorage.setItem('gz_high', highScore); } catch(e) {}
        }
    }
}

function checkCollision(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function draw() {
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0d0d1a');
    grad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars / atmosphere
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + 50) % W;
        const sy = (i * 97 + 20) % (H * 0.6);
        ctx.fillRect(sx, sy, 2, 2);
    }

    // Moon
    ctx.beginPath();
    ctx.arc(W - 80, 80, 35, 0, Math.PI * 2);
    ctx.fillStyle = '#e8e4c9';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(W - 65, 70, 30, 0, Math.PI * 2);
    ctx.fillStyle = '#0d0d1a';
    ctx.fill();

    // Platforms
    for (let p of platforms) {
        ctx.fillStyle = '#2a4a2a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#3a6a3a';
        ctx.fillRect(p.x, p.y, p.w, 4);
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Bullets
    for (let b of bullets) {
        ctx.fillStyle = '#ffdd44';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(b.x + 2, b.y + 1, b.w - 4, b.h - 2);
    }

    // Zombies
    for (let z of zombies) {
        const wobbleX = Math.sin(z.wobble) * 3;
        const bodyColor = z.type === 'brute' ? '#8b0000' : '#3a7a3a';
        const headColor = z.type === 'brute' ? '#cc2200' : '#5a9a5a';

        // Body
        ctx.fillStyle = bodyColor;
        ctx.fillRect(z.x + wobbleX, z.y + 10, z.w, z.h - 10);
        // Head
        ctx.fillStyle = headColor;
        ctx.fillRect(z.x + 3 + wobbleX, z.y, z.w - 6, 14);
        // Eyes
        ctx.fillStyle = '#ff0';
        ctx.fillRect(z.x + 5 + wobbleX, z.y + 4, 4, 4);
        ctx.fillRect(z.x + z.w - 9 + wobbleX, z.y + 4, 4, 4);
        // Arms
        const armSwing = Math.sin(z.wobble * 2) * 5;
        ctx.fillStyle = bodyColor;
        ctx.fillRect(z.x - 6 + wobbleX, z.y + 18 + armSwing, 8, 4);
        ctx.fillRect(z.x + z.w - 2 + wobbleX, z.y + 18 - armSwing, 8, 4);

        // HP bar
        if (z.hp < z.maxHp) {
            ctx.fillStyle = '#333';
            ctx.fillRect(z.x, z.y - 10, z.w, 5);
            ctx.fillStyle = '#ff3333';
            ctx.fillRect(z.x, z.y - 10, z.w * (z.hp / z.maxHp), 5);
        }
    }

    // Player
    if (player.invincible <= 0 || Math.floor(player.invincible / 5) % 2 === 0) {
        const px = player.x, py = player.y;
        // Body
        ctx.fillStyle = '#4488ff';
        ctx.fillRect(px, py + 12, player.w, player.h - 12);
        // Head
        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(px + 5, py, player.w - 10, 14);
        // Eyes
        ctx.fillStyle = '#fff';
        if (player.facing > 0) {
            ctx.fillRect(px + player.w - 12, py + 4, 4, 4);
            ctx.fillRect(px + player.w - 6, py + 4, 4, 4);
        } else {
            ctx.fillRect(px + 8, py + 4, 4, 4);
            ctx.fillRect(px + 14, py + 4, 4, 4);
        }
        // Gun arm
        ctx.fillStyle = '#666';
        if (player.facing > 0) {
            ctx.fillRect(px + player.w - 2, py + 20, 12, 5);
        } else {
            ctx.fillRect(px - 8, py + 20, 12, 5);
        }
    }

    // UI
    if (gameState === 'playing') {
        // HP
        for (let i = 0; i < player.maxHp; i++) {
            ctx.fillStyle = i < player.hp ? '#ff3333' : '#333';
            ctx.fillRect(20 + i * 25, 20, 20, 20);
        }

        // Score
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'right';
        ctx.fillText('SCORE: ' + score, W - 20, 35);
        ctx.font = '14px monospace';
        ctx.fillText('WAVE: ' + wave, W - 20, 55);

        // High score
        ctx.textAlign = 'left';
        ctx.font = '12px monospace';
        ctx.fillStyle = '#888';
        ctx.fillText('HI: ' + highScore, 20, H - 60);
    }

    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'gameover') {
        drawGameOver();
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#4a4';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GRAVITY ZOMBIE', W/2, H/2 - 100);

    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText('Zombies fall from the sky with gravity!', W/2, H/2 - 50);
    ctx.fillText('Shoot them before they reach you.', W/2, H/2 - 25);

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('A / D or ← → : Move', W/2, H/2 + 30);
    ctx.fillText('W / ↑ / Space : Jump', W/2, H/2 + 55);
    ctx.fillText('F or J : Shoot', W/2, H/2 + 80);

    ctx.fillStyle = '#ff4';
    ctx.font = 'bold 22px monospace';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('PRESS ENTER TO START', W/2, H/2 + 150);

    ctx.fillStyle = '#666';
    ctx.font = '14px monospace';
    ctx.fillText('High Score: ' + highScore, W/2, H/2 + 190);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('YOU DIED', W/2, H/2 - 60);

    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText('Score: ' + score, W/2, H/2 - 10);
    ctx.fillText('Wave Reached: ' + wave, W/2, H/2 + 25);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = '18px monospace';
        ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 65);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) ctx.fillText('PRESS ENTER TO RESTART', W/2, H/2 + 120);
}

function loop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

// Input
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (gameState === 'start' && e.code === 'Enter') {
        initAudio();
        resetGame();
        gameState = 'playing';
    } else if (gameState === 'gameover' && e.code === 'Enter') {
        resetGame();
        gameState = 'playing';
    }
    // Prevent scrolling
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});

window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Click to shoot too
canvas.addEventListener('click', () => {
    if (gameState === 'playing') shootBullet();
});

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
