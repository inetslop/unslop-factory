<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; }
canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, type, duration, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('pinballPlatformerHigh') || '0'); } catch(e) {}

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 12 };
let paddle = { x: 0, w: 100, h: 16, y: 0 };
let mouseX = 0;

// Bumpers
let bumpers = [];
// Platforms
let platforms = [];
// Particles
let particles = [];
// Slingshots
let slingshots = [];

function initLevel() {
    const scale = Math.min(W, H) / 800;
    ball.r = Math.max(10, 12 * scale);
    
    bumpers = [
        { x: W * 0.3, y: H * 0.45, r: 25 * scale, hit: 0 },
        { x: W * 0.7, y: H * 0.45, r: 25 * scale, hit: 0 },
        { x: W * 0.5, y: H * 0.3, r: 20 * scale, hit: 0 },
        { x: W * 0.15, y: H * 0.6, r: 18 * scale, hit: 0 },
        { x: W * 0.85, y: H * 0.6, r: 18 * scale, hit: 0 },
    ];

    platforms = [
        { x: W * 0.1, y: H * 0.25, w: W * 0.2, h: 12 },
        { x: W * 0.7, y: H * 0.25, w: W * 0.2, h: 12 },
        { x: W * 0.35, y: H * 0.6, w: W * 0.3, h: 12 },
        { x: W * 0.05, y: H * 0.75, w: W * 0.15, h: 12 },
        { x: W * 0.8, y: H * 0.75, w: W * 0.15, h: 12 },
        { x: W * 0.45, y: H * 0.15, w: W * 0.1, h: 12 },
    ];

    slingshots = [
        { x1: W * 0.05, y1: H * 0.35, x2: W * 0.15, y2: H * 0.55 },
        { x1: W * 0.95, y1: H * 0.35, x2: W * 0.85, y2: H * 0.55 }
    ];

    paddle.w = Math.max(80, 120 * scale);
    paddle.h = 16;
    paddle.y = H - 40;
    paddle.x = W / 2 - paddle.w / 2;

    resetBall();
}

function resetBall() {
    ball.x = W / 2;
    ball.y = H * 0.1;
    ball.vx = (Math.random() - 0.5) * 3;
    ball.vy = 0;
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1,
            color: color || '#fff',
            size: Math.random() * 4 + 2
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.025;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function update() {
    if (gameState !== 'playing') return;

    const gravity = 0.4;
    const restitution = 0.85;

    ball.vy += gravity;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Walls
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * restitution; }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * restitution; }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * restitution; }

    // Paddle
    if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 10 &&
        ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
        ball.y = paddle.y - ball.r;
        ball.vy = -Math.abs(ball.vy) * restitution - 2;
        // Add some angle based on where it hits the paddle
        const hitPos = (ball.x - paddle.x) / paddle.w - 0.5;
        ball.vx += hitPos * 4;
        playSound(300, 'square', 0.1, 0.2);
        spawnParticles(ball.x, ball.y + ball.r, '#0ff', 8);
    }

    // Platforms
    for (const p of platforms) {
        if (ball.y + ball.r >= p.y && ball.y + ball.r <= p.y + p.h + 8 &&
            ball.x >= p.x && ball.x <= p.x + p.w && ball.vy > 0) {
            ball.y = p.y - ball.r;
            ball.vy = -Math.abs(ball.vy) * restitution;
            playSound(400, 'triangle', 0.1, 0.15);
            spawnParticles(ball.x, ball.y + ball.r, '#ff0', 5);
        }
    }

    // Bumpers
    for (const b of bumpers) {
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < ball.r + b.r) {
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x = b.x + nx * (ball.r + b.r + 1);
            ball.y = b.y + ny * (ball.r + b.r + 1);
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            // Add extra force from bumper
            ball.vx += nx * 5;
            ball.vy += ny * 5;
            b.hit = 10;
            score += 100;
            playSound(600, 'sine', 0.15, 0.4);
            spawnParticles(ball.x, ball.y, '#f0f', 12);
        }
    }

    // Slingshots (simple angled walls)
    for (const s of slingshots) {
        const dx = s.x2 - s.x1;
        const dy = s.y2 - s.y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        const nx = -dy / len;
        const ny = dx / len;

        const px = ball.x - s.x1;
        const py = ball.y - s.y1;
        const dotLine = px * (dx / len) + py * (dy / len);
        const dist = Math.abs(px * nx + py * ny);

        if (dotLine > 0 && dotLine < len && dist < ball.r + 5) {
            const side = (px * nx + py * ny) > 0 ? 1 : -1;
            ball.vx += nx * side * 3;
            ball.vy += ny * side * 3;
        }
    }

    // Ball fell below
    if (ball.y > H + 50) {
        lives--;
        playSound(150, 'sawtooth', 0.4, 0.3);
        spawnParticles(ball.x, H - 20, '#f00', 20);
        if (lives <= 0) {
            gameState = 'gameover';
            try { 
                if (score > highScore) { highScore = score; localStorage.setItem('pinballPlatformerHigh', highScore); }
            } catch(e) {}
        } else {
            resetBall();
        }
    }

    // Update bumper hit timers
    for (const b of bumpers) {
        if (b.hit > 0) b.hit--;
    }

    // Cap velocity
    const maxSpeed = 15;
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (speed > maxSpeed) {
        ball.vx = (ball.vx / speed) * maxSpeed;
        ball.vy = (ball.vy / speed) * maxSpeed;
    }

    updateParticles();
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2e');
    grad.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = 'rgba(50,50,120,0.3)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
}

function draw() {
    drawBackground();

    // Draw slingshots
    for (const s of slingshots) {
        ctx.strokeStyle = '#ff6600';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
    }

    // Draw platforms
    for (const p of platforms) {
        ctx.fillStyle = '#2a2a5a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#6666ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        // Glow
        ctx.shadowColor = '#6666ff';
        ctx.shadowBlur = 8;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        ctx.shadowBlur = 0;
    }

    // Draw bumpers
    for (const b of bumpers) {
        const glow = b.hit > 0 ? 20 : 8;
        ctx.shadowColor = b.hit > 0 ? '#ff00ff' : '#aa00ff';
        ctx.shadowBlur = glow;

        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, b.hit > 0 ? '#ffffff' : '#cc44ff');
        grad.addColorStop(0.7, b.hit > 0 ? '#ff88ff' : '#9933cc');
        grad.addColorStop(1, '#6622aa');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = b.hit > 0 ? '#ffffff' : '#cc66ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    // Draw paddle
    const pGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    pGrad.addColorStop(0, '#00ffff');
    pGrad.addColorStop(1, '#0066ff');
    ctx.fillStyle = pGrad;
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 12;
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#88ffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(paddle.x, paddle.y, paddle.w, paddle.h);

    // Draw ball
    if (gameState === 'playing') {
        const bGrad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.r);
        bGrad.addColorStop(0, '#ffffff');
        bGrad.addColorStop(0.5, '#ffff88');
        bGrad.addColorStop(1, '#ff8800');
        ctx.fillStyle = bGrad;
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    drawParticles();

    // HUD
    if (gameState === 'playing' || gameState === 'gameover') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 30);
        ctx.fillText(`LIVES: ${'♥'.repeat(Math.max(0, lives))}`, 20, 55);
        ctx.textAlign = 'right';
        ctx.font = '14px monospace';
        ctx.fillStyle = '#888';
        ctx.fillText(`HIGH: ${Math.max(highScore, score)}`, W - 20, 30);
    }

    // Start screen
    if (gameState === 'start') {
        ctx.fillStyle = 'rgba(10,10,30,0.85)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 20;
        ctx.fillStyle = '#ff66ff';
        ctx.font = `bold ${Math.min(48, W/12)}px monospace`;
        ctx.fillText('PINBALL', W/2, H * 0.3);
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.fillText('PLATFORMER', W/2, H * 0.3 + Math.min(48, W/12));
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#aaa';
        ctx.font = '16px monospace';
        ctx.fillText('Move mouse to control the paddle', W/2, H * 0.5);
        ctx.fillText('Keep the ball alive! Hit bumpers for points!', W/2, H * 0.5 + 30);
        ctx.fillText('', W/2, H * 0.5 + 60);

        const pulse = Math.sin(Date.now() / 500) * 0.5 + 0.5;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('PRESS SPACE or CLICK to START', W/2, H * 0.7);
        ctx.globalAlpha = 1;

        if (highScore > 0) {
            ctx.fillStyle = '#888';
            ctx.font = '14px monospace';
            ctx.fillText(`High Score: ${highScore}`, W/2, H * 0.8);
        }
    }

    // Game over screen
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(10,10,30,0.7)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 15;
        ctx.fillStyle = '#ff4444';
        ctx.font = `bold ${Math.min(42, W/10)}px monospace`;
        ctx.fillText('GAME OVER', W/2, H * 0.35);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = '22px monospace';
        ctx.fillText(`Final Score: ${score}`, W/2, H * 0.45);
        ctx.fillStyle = '#888';
        ctx.font = '16px monospace';
        ctx.fillText(`High Score: ${Math.max(highScore, score)}`, W/2, H * 0.52);

        const pulse = Math.sin(Date.now() / 500) * 0.5 + 0.5;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('PRESS SPACE or CLICK to RESTART', W/2, H * 0.65);
        ctx.globalAlpha = 1;
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Input
window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    if (gameState === 'playing') {
        paddle.x = Math.max(0, Math.min(W - paddle.w, e.clientX - paddle.w / 2));
    }
});

window.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    mouseX = t.clientX;
    if (gameState === 'playing') {
        paddle.x = Math.max(0, Math.min(W - paddle.w, t.clientX - paddle.w / 2));
    }
}, { passive: false });

window.addEventListener('keydown', (e) => {
    initAudio();
    if (e.code === 'Space' || e.code === 'Enter') {
        if (gameState === 'start' || gameState === 'gameover') {
            startGame();
        }
    }
});

window.addEventListener('click', () => {
    initAudio();
    if (gameState === 'start' || gameState === 'gameover') {
        startGame();
    }
});

function startGame() {
    score = 0;
    lives = 3;
    particles = [];
    initLevel();
    gameState = 'playing';
}

// Init
initLevel();
paddle.x = W / 2 - paddle.w / 2;
gameLoop();
</script>
</body>
</html>
