<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Storm</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'kill') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'error') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'lose') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
    } else if (type === 'combo') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    }
}

// Word lists
const WORDS = {
    easy: ['fire','star','beam','bolt','wave','dash','puff','smoke','spark','drift','pulse','flash','thrust','glide'],
    medium: ['plasma','nebula','quasar','photon','cosmos','galaxy','stellar','void','nova','orbit','zenith','vector','turbine','catalyst'],
    hard: ['supernova','antimatter','quantum','singularity','horizon','paradox','chronon','luminance','spectral','dimensional','graviton','neutrino','tachyon','photonics']
};

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let combo = 0;
let maxCombo = 0;
let level = 1;
let enemies = [];
let particles = [];
let bullets = [];
let stars = [];
let typed = '';
let targetEnemy = null;
let shakeTime = 0;
let shakeMag = 0;
let lastSpawn = 0;
let gameTime = 0;
let bestScore = 0;
try { bestScore = parseInt(localStorage.getItem('typeStormBest') || '0'); } catch(e) {}

// Init stars
function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 + 0.1 });
    }
}
initStars();

// Enemy class
class Enemy {
    constructor() {
        const diff = level <= 2 ? 'easy' : level <= 4 ? 'medium' : 'hard';
        this.word = WORDS[diff][Math.floor(Math.random() * WORDS[diff].length)];
        this.x = Math.random() * (W - 100) + 50;
        this.y = -40;
        this.speed = (0.8 + level * 0.3) * (Math.random() * 0.5 + 0.75);
        this.hp = this.word.length;
        this.maxHp = this.word.length;
        this.color = `hsl(${Math.random()*60+180}, 80%, 60%)`;
        this.size = Math.min(this.word.length * 8 + 20, 90);
    }
    update(dt) {
        this.y += this.speed * dt;
        this.x += Math.sin(gameTime * 0.001 + this.x * 0.01) * 0.3;
    }
    draw() {
        ctx.save();
        // Body
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
        ctx.fill();
        // Inner
        ctx.fillStyle = '#0a0a1a';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size / 2 - 5, 0, Math.PI * 2);
        ctx.fill();
        // Word
        const isTarget = targetEnemy === this;
        ctx.font = `bold ${Math.max(14, 20 - level)}px monospace`;
        ctx.textAlign = 'center';
        if (isTarget) {
            ctx.fillStyle = '#fff';
            for (let i = 0; i < this.word.length; i++) {
                const cx = this.x - (this.word.length * 9) / 2 + i * 9 + 4.5;
                if (i < typed.length) {
                    ctx.fillStyle = '#0f0';
                } else {
                    ctx.fillStyle = i === typed.length ? '#ff0' : '#888';
                }
                ctx.fillText(this.word[i], cx, this.y + 5);
            }
        } else {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText(this.word, this.x, this.y + 5);
        }
        // HP bar
        if (isTarget) {
            const bw = this.size;
            ctx.fillStyle = 'rgba(255,0,0,0.5)';
            ctx.fillRect(this.x - bw/2, this.y - this.size/2 - 10, bw, 4);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(this.x - bw/2, this.y - this.size/2 - 10, bw * (typed.length / this.word.length), 4);
        }
        // Target reticle
        if (isTarget) {
            ctx.strokeStyle = 'rgba(0,255,0,0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size / 2 + 8, gameTime * 0.003, gameTime * 0.003 + Math.PI * 1.5);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        ctx.restore();
    }
}

// Particle
class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        const a = Math.random() * Math.PI * 2;
        const sp = Math.random() * 5 + 2;
        this.vx = Math.cos(a) * sp;
        this.vy = Math.sin(a) * sp;
        this.life = 1;
        this.color = color;
        this.size = Math.random() * 4 + 2;
    }
    update(dt) {
        this.x += this.vx * dt * 0.06;
        this.y += this.vy * dt * 0.06;
        this.life -= dt * 0.003;
    }
    draw() {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

// Bullet
class Bullet {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.vy = -8;
        this.life = 1;
    }
    update(dt) {
        this.y += this.vy * dt * 0.06;
        this.life -= dt * 0.002;
    }
    draw() {
        ctx.fillStyle = '#0ff';
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 8;
        ctx.fillRect(this.x - 2, this.y - 6, 4, 12);
        ctx.shadowBlur = 0;
    }
}

function spawnParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color));
}

function getTarget() {
    if (enemies.length === 0) return null;
    let best = null;
    let bestY = -Infinity;
    for (const e of enemies) {
        if (e.y > bestY) { bestY = e.y; best = e; }
    }
    return best;
}

function handleKey(e) {
    if (state === 'start') {
        initAudio();
        startGame();
        return;
    }
    if (state === 'gameover') {
        if (e.key === ' ' || e.key === 'Enter') startGame();
        return;
    }
    if (state !== 'playing') return;
    
    if (targetEnemy && targetEnemy.word[typed.length] === e.key.toLowerCase()) {
        typed += e.key.toLowerCase();
        playSound('shoot');
        // Spawn bullet visual
        bullets.push(new Bullet(targetEnemy.x, H - 30));
        
        if (typed.length >= targetEnemy.word.length) {
            // Enemy killed!
            killEnemy(targetEnemy);
        }
    } else if (e.key.length === 1) {
        typed = '';
        combo = 0;
        playSound('error');
        shakeTime = 150;
        shakeMag = 3;
    }
}

function killEnemy(enemy) {
    const idx = enemies.indexOf(enemy);
    if (idx >= 0) enemies.splice(idx, 1);
    spawnParticles(enemy.x, enemy.y, 20, enemy.color);
    playSound('kill');
    combo++;
    maxCombo = Math.max(maxCombo, combo);
    if (combo % 5 === 0) playSound('combo');
    const points = enemy.word.length * 10 * (1 + Math.floor(combo / 3));
    score += points;
    typed = '';
    
    // Check level up
    const newLevel = Math.floor(score / 500) + 1;
    if (newLevel > level) {
        level = newLevel;
    }
    
    targetEnemy = getTarget();
}

function startGame() {
    state = 'playing';
    score = 0; lives = 3; combo = 0; maxCombo = 0; level = 1;
    enemies = []; particles = []; bullets = [];
    typed = ''; targetEnemy = null;
    lastSpawn = 0; gameTime = 0;
}

function endGame() {
    state = 'gameover';
    playSound('lose');
    try {
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('typeStormBest', String(bestScore));
        }
    } catch(e) {}
}

// Drawing helpers
function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    // Stars
    for (const s of stars) {
        s.y += s.sp;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.fillStyle = `rgba(255,255,255,${s.s / 3})`;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
}

function drawTurret() {
    const tx = W / 2;
    const ty = H - 20;
    ctx.fillStyle = '#1a1a3a';
    ctx.shadowColor = '#44f';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.moveTo(tx - 30, ty + 10);
    ctx.lineTo(tx - 15, ty - 25);
    ctx.lineTo(tx + 15, ty - 25);
    ctx.lineTo(tx + 30, ty + 10);
    ctx.closePath();
    ctx.fill();
    // Barrel
    ctx.fillStyle = '#4af';
    ctx.fillRect(tx - 3, ty - 45, 6, 25);
    ctx.shadowBlur = 0;
}

function drawHUD() {
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.fillText(`COMBO: x${combo}`, 20, 60);
    ctx.fillText(`LVL: ${level}`, 20, 85);
    
    // Lives as hearts
    ctx.textAlign = 'right';
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#f44';
        ctx.font = '20px monospace';
        ctx.fillText('♥', W - 20 - i * 30, 35);
    }
    
    // Target word display at bottom
    if (targetEnemy) {
        ctx.textAlign = 'center';
        ctx.font = `bold ${Math.max(16, 24 - level)}px monospace`;
        const word = targetEnemy.word;
        for (let i = 0; i < word.length; i++) {
            const cx = W / 2 - (word.length * 16) / 2 + i * 16 + 8;
            if (i < typed.length) {
                ctx.fillStyle = '#0f0';
            } else if (i === typed.length) {
                ctx.fillStyle = '#ff0';
            } else {
                ctx.fillStyle = '#555';
            }
            ctx.fillText(word[i], cx, H - 55);
        }
    }
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(10,10,26,0.9)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 60px monospace';
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 20;
    ctx.fillText('TYPE STORM', W/2, H/3);
    ctx.shadowBlur = 0;
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Type words to destroy incoming enemies!', W/2, H/3 + 50);
    ctx.fillText('', W/2, H/3 + 90);
    ctx.fillStyle = '#fff';
    ctx.fillText('The lowest enemy is auto-targeted.', W/2, H/3 + 110);
    ctx.fillText('Type its word to destroy it before it reaches the bottom!', W/2, H/3 + 140);
    ctx.fillText('Wrong key = reset your progress.', W/2, H/3 + 170);
    
    if (bestScore > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = '16px monospace';
        ctx.fillText(`Best: ${bestScore}`, W/2, H/3 + 210);
    }
    
    const pulse = Math.sin(Date.now() * 0.004) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = 'bold 22px monospace';
    ctx.fillText('[ PRESS ANY KEY TO START ]', W/2, H * 0.75);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(10,10,26,0.85)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px monospace';
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W/2, H/3);
    ctx.shadowBlur = 0;
    
    ctx.font = '22px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`Final Score: ${score}`, W/2, H/3 + 50);
    ctx.fillText(`Max Combo: x${maxCombo}`, W/2, H/3 + 85);
    if (bestScore > 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = '16px monospace';
        ctx.fillText(`Best: ${bestScore}`, W/2, H/3 + 125);
    }
    
    const pulse = Math.sin(Date.now() * 0.004) * 0.5 + 0.5;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = 'bold 20px monospace';
    ctx.fillText('[ PRESS SPACE TO RESTART ]', W/2, H * 0.7);
}

// Main loop
let lastTime = performance.now();
function gameLoop(now) {
    const dt = Math.min(now - lastTime, 50);
    lastTime = now;
    
    // Shake
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
        shakeTime -= dt;
        sx = (Math.random() - 0.5) * shakeMag;
        sy = (Math.random() - 0.5) * shakeMag;
    }
    
    ctx.save();
    ctx.translate(sx, sy);
    
    drawBackground();
    
    if (state === 'playing') {
        gameTime += dt;
        
        // Spawn enemies
        const spawnInterval = Math.max(3000 - level * 200, 1200);
        if (now - lastSpawn > spawnInterval) {
            enemies.push(new Enemy());
            lastSpawn = now;
        }
        
        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].update(dt);
            if (enemies[i].y > H - 60) {
                enemies.splice(i, 1);
                typed = '';
                lives--;
                combo = 0;
                shakeTime = 300;
                shakeMag = 8;
                playSound('lose');
                if (lives <= 0) endGame();
            }
        }
        
        // Update target
        targetEnemy = getTarget();
        
        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update(dt);
            if (bullets[i].life <= 0) bullets.splice(i, 1);
        }
        
        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(dt);
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
    }
    
    // Draw entities
    for (const b of bullets) b.draw();
    for (const e of enemies) e.draw();
    for (const p of particles) p.draw();
    
    if (state === 'playing') {
        drawTurret();
        drawHUD();
    }
    
    ctx.restore();
    
    if (state === 'start') drawStartScreen();
    if (state === 'gameover') drawGameOver();
    
    requestAnimationFrame(gameLoop);
}

window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    handleKey(e);
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
