<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; }
#gameCanvas { display: block; margin: 0 auto; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#startScreen, #gameOverScreen {
position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
text-align: center; color: #fff; pointer-events: all;
}
#startScreen h1 { font-size: 2.5em; color: #4caf50; text-shadow: 0 0 20px #4caf50; margin-bottom: 20px; }
#startScreen p, #gameOverScreen p { font-size: 1em; line-height: 1.8; color: #aaa; }
#gameOverScreen h1 { font-size: 2em; color: #f44336; text-shadow: 0 0 15px #f44336; margin-bottom: 15px; }
.btn { display: inline-block; padding: 12px 30px; margin-top: 15px; background: #4caf50; color: #fff; border: none; font-size: 1.1em; font-family: inherit; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
.btn:hover { background: #66bb6a; }
#hud { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 14px; display: flex; gap: 30px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud" style="display:none;">
<span id="score">SCORE: 0</span>
<span id="lives">LIVES: 3</span>
<span id="level">LEVEL: 1</span>
</div>
<div id="startScreen">
<h1>🐸 FROGGER SNAKE 🐍</h1>
<p>Guide your frog-snake across the road to reach lily pads!</p>
<p>Eat flies (●) to grow your snake and boost score.</p>
<p>Dodge traffic and don't drown in the river!</p>
<br>
<p>⬆⬇⬅➡ or WASD to move</p>
<button class="btn" id="startBtn">START GAME</button>
</div>
<div id="gameOverScreen" style="display:none;">
<h1>GAME OVER</h1>
<p id="finalScore">Final Score: 0</p>
<button class="btn" id="restartBtn">RESTART</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const startScreen = document.getElementById('startScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');

let W, H, cellSize;
const COLS = 13, ROWS = 14;

function resize() {
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;
cellSize = Math.min(W / (COLS + 2), H / (ROWS + 2));
}
window.addEventListener('resize', resize);
resize();

let gameState = 'start'; // start, playing, dead, levelComplete, gameover
let score = 0, lives = 3, level = 1;
let snake = []; // array of {col, row} - head is last element
let moveTimer = 0;
let lastMoveTime = 0;
const MOVE_COOLDOWN = 120;

// Traffic
let traffic = [];
// River logs
let riverLogs = [];
// Flies
let flies = [];
// Lily pads / homes
let lilyPads = [
{col: 1, row: 2}, {col: 3, row: 2}, {col: 5, row: 2}, {col: 7, row: 2}, {col: 9, row: 2}
];
let homeReached = [-1,-1,-1,-1,-1];
let deathTimer = 0;
let levelTimer = 0;
let particles = [];

const TRAFFIC_ROWS = [3, 4, 6, 7, 10, 11];
const RIVER_ROWS = [8, 9];
const MEDIAN_ROW = 5;
const BOTTOM_ROW = 12;
const TOP_ROW = 2;

function initTraffic() {
traffic = [];
const configs = [
{row: 3, speed: 0.4, dir: -1, type: 'car', count: 2},
{row: 4, speed: 0.7, dir: 1, type: 'truck', count: 2},
{row: 6, speed: 0.5, dir: -1, type: 'tractor', count: 1},
{row: 7, speed: 0.9, dir: 1, type: 'car', count: 3},
{row: 10, speed: 0.6, dir: 1, type: 'truck', count: 2},
{row: 11, speed: 1.0, dir: -1, type: 'car', count: 3}
];
for (let c of configs) {
for (let i = 0; i < c.count; i++) {
let x = (i * W / c.count) + Math.random() * cellSize;
traffic.push({row: c.row, x: x, speed: c.speed * (W/COLS), dir: c.dir, type: c.type});
}
}
}

function initRiver() {
riverLogs = [];
for (let r of RIVER_ROWS) {
let count = 2 + Math.floor(Math.random() * 2);
for (let i = 0; i < count; i++) {
let x = (i * W / count) + Math.random() * cellSize;
riverLogs.push({row: r, x: x, speed: 0.3 + Math.random() * 0.4, dir: r === 8 ? -1 : 1});
}
}
}

function initFlies() {
flies = [];
for (let i = 0; i < 5; i++) spawnFly();
}

function spawnFly() {
let col = Math.floor(Math.random() * COLS);
let row = Math.floor(Math.random() * ROWS);
if (row === MEDIAN_ROW || row === BOTTOM_ROW || RIVER_ROWS.includes(row)) {
// allow on median and bottom, not river
} else if (TRAFFIC_ROWS.includes(row) && Math.random() > 0.3) return; // fewer in traffic
flies.push({col: col, row: row});
}

function resetGame() {
score = 0; lives = 3; level = 1;
initLevel();
updateHUD();
}

function initLevel() {
let startCol = Math.floor(COLS / 2);
snake = [{col: startCol, row: BOTTOM_ROW}];
homeReached = [-1,-1,-1,-1,-1];
particles = [];
initTraffic();
initRiver();
initFlies();
moveTimer = 0;
lastMoveTime = performance.now();
}

function updateHUD() {
scoreEl.textContent = 'SCORE: ' + score;
livesEl.textContent = 'LIVES: ' + lives;
levelEl.textContent = 'LEVEL: ' + level;
}

function getPixelX(col) { return (col - COLS/2 + 0.5) * cellSize + W/2; }
function getPixelY(row) { return (row - ROWS/2 + 0.5) * cellSize + H/2; }

function moveSnake(dc, dr) {
let head = snake[snake.length - 1];
let nc = head.col + dc, nr = head.row + dr;
if (nc < 0 || nc >= COLS || nr < 0 || nr > ROWS) return;
snake.push({col: nc, row: nr});
// Check if ate a fly
for (let i = flies.length - 1; i >= 0; i--) {
if (flies[i].col === nc && flies[i].row === nr) {
flies.splice(i, 1);
score += 10 * level;
spawnFly();
// Don't remove tail (grow snake)
} else {
snake.shift(); // normal movement removes tail
break;
}
}
checkCollision();
checkWin();
updateHUD();
}

function checkCollision() {
let head = snake[snake.length - 1];
// Check drowning
if (RIVER_ROWS.includes(head.row)) {
let onLog = riverLogs.some(l => l.row === head.row && Math.abs(getPixelX(head.col) - l.x) < cellSize * 0.6);
if (!onLog) return kill();
}
// Check traffic hit
for (let t of traffic) {
if (t.row === head.row) {
let tx = getPixelX(head.col);
let tw = t.type === 'truck' ? cellSize * 1.4 : t.type === 'tractor' ? cellSize * 1.6 : cellSize * 1.2;
if (Math.abs(tx - t.x) < tw * 0.5 + cellSize * 0.3) return kill();
}
}
// Check body in water (body segments just disappear if in river without log)
for (let i = 0; i < snake.length; i++) {
if (RIVER_ROWS.includes(snake[i].row)) {
let onLog = riverLogs.some(l => l.row === snake[i].row && Math.abs(getPixelX(snake[i].col) - l.x) < cellSize * 0.6);
if (!onLog) { snake.splice(i, 1); break; }
}
// Body hit by traffic
for (let t of traffic) {
if (t.row === snake[i].row) {
let tx = getPixelX(snake[i].col);
let tw = t.type === 'truck' ? cellSize * 1.4 : cellSize * 1.2;
if (Math.abs(tx - t.x) < tw * 0.5 + cellSize * 0.2) return kill();
}
}
}
}

function kill() {
gameState = 'dead';
deathTimer = 60;
for (let s of snake) {
for (let i = 0; i < 4; i++) {
particles.push({x: getPixelX(s.col), y: getPixelY(s.row), vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3 - 2, life: 30, color: '#4caf50'});
}
}
lives--;
updateHUD();
if (lives <= 0) {
setTimeout(() => { gameState = 'gameover'; }, 1500);
}
}

function checkWin() {
let head = snake[snake.length - 1];
for (let i = 0; i < lilyPads.length; i++) {
if (lilyPads[i].col === head.col && lilyPads[i].row === head.row && homeReached[i] === -1) {
homeReached[i] = level;
score += 50 * level;
gameState = 'levelComplete';
levelTimer = 60;
for (let j = 0; j < 20; j++) {
particles.push({x: getPixelX(head.col), y: getPixelY(head.row), vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4 - 3, life: 40, color: '#ffeb3b'});
}
updateHUD();
break;
}
}
}

function update() {
if (gameState !== 'playing' && gameState !== 'dead' && gameState !== 'levelComplete') return;

// Update traffic
for (let t of traffic) {
t.x += t.speed * t.dir;
let tw = t.type === 'truck' ? cellSize * 1.4 : t.type === 'tractor' ? cellSize * 1.6 : cellSize * 1.2;
if (t.dir > 0 && t.x > W + tw) t.x = -tw;
if (t.dir < 0 && t.x < -tw) t.x = W + tw;
}

// Update river
for (let l of riverLogs) {
l.x += l.speed * l.dir;
if (l.dir > 0 && l.x > W + cellSize) l.x = -cellSize;
if (l.dir < 0 && l.x < -cellSize) l.x = W + cellSize;
}

// Update particles
for (let i = particles.length - 1; i >= 0; i--) {
particles[i].x += particles[i].vx;
particles[i].y += particles[i].vy;
particles[i].vy += 0.15;
particles[i].life--;
if (particles[i].life <= 0) particles.splice(i, 1);
}

// Death timer
if (gameState === 'dead') {
deathTimer--;
if (deathTimer <= 0 && lives > 0) {
initLevel();
gameState = 'playing';
lastMoveTime = performance.now();
}
}

// Level complete
if (gameState === 'levelComplete') {
levelTimer--;
if (levelTimer <= 0) {
if (homeReached.every(h => h !== -1)) {
level++;
initLevel();
gameState = 'playing';
lastMoveTime = performance.now();
} else {
// Not all homes reached, just continue
gameState = 'playing';
}
}
}

// Check collision every frame (traffic can hit snake while it's stationary)
if (gameState === 'playing') checkCollision();
}

function draw() {
ctx.fillStyle = '#1a2e1a';
ctx.fillRect(0, 0, W, H);

let ox = W/2 - COLS * cellSize / 2;
let oy = H/2 - ROWS * cellSize / 2;

// Draw rows
for (let r = 0; r < ROWS; r++) {
let y = oy + r * cellSize;
if (r === BOTTOM_ROW) ctx.fillStyle = '#2e5e1e';
else if (r === MEDIAN_ROW) ctx.fillStyle = '#3a6b2a';
else if (RIVER_ROWS.includes(r)) ctx.fillStyle = '#1565a8';
else if (r === TOP_ROW) ctx.fillStyle = '#0d4d0d';
else if (TRAFFIC_ROWS.includes(r)) ctx.fillStyle = '#333';
else ctx.fillStyle = r < TOP_ROW ? '#0d2e0d' : '#1a2e1a';

ctx.fillRect(ox, y, COLS * cellSize, cellSize);

// Grid lines
ctx.strokeStyle = 'rgba(255,255,255,0.05)';
ctx.strokeRect(ox, y, COLS * cellSize, cellSize);
}

// Draw median
let medY = oy + MEDIAN_ROW * cellSize;
for (let c = 0; c < COLS; c++) {
ctx.fillStyle = '#4a8b3a';
ctx.fillRect(ox + c * cellSize, medY, cellSize, cellSize);
ctx.strokeStyle = 'rgba(0,0,0,0.2)';
ctx.strokeRect(ox + c * cellSize, medY, cellSize, cellSize);
}

// Draw river waves
for (let r of RIVER_ROWS) {
let ry = oy + r * cellSize;
ctx.fillStyle = 'rgba(100,180,255,0.3)';
for (let c = 0; c < COLS; c++) {
let wx = ox + c * cellSize;
ctx.beginPath();
ctx.arc(wx + cellSize/2, ry + cellSize/2, cellSize * 0.15, 0, Math.PI*2);
ctx.fill();
}
}

// Draw lily pads / homes
for (let i = 0; i < lilyPads.length; i++) {
let lp = lilyPads[i];
let px = ox + lp.col * cellSize + cellSize/2;
let py = oy + lp.row * cellSize + cellSize/2;
ctx.fillStyle = homeReached[i] !== -1 ? '#ffeb3b' : '#4caf50';
ctx.beginPath();
ctx.arc(px, py, cellSize * 0.35, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = '#2e7d32';
ctx.lineWidth = 2;
ctx.stroke();

// Home number
ctx.fillStyle = homeReached[i] !== -1 ? '#333' : '#fff';
ctx.font = `bold ${cellSize * 0.4}px monospace`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText((i+1).toString(), px, py);
}

// Draw river logs
for (let l of riverLogs) {
let ly = oy + l.row * cellSize;
ctx.fillStyle = '#8b6914';
ctx.fillRect(l.x - cellSize * 0.5, ly + cellSize * 0.2, cellSize, cellSize * 0.6);
ctx.strokeStyle = '#5d4a0e';
ctx.lineWidth = 2;
ctx.strokeRect(l.x - cellSize * 0.5, ly + cellSize * 0.2, cellSize, cellSize * 0.6);
}

// Draw traffic
for (let t of traffic) {
let ty = oy + t.row * cellSize;
let tw = t.type === 'truck' ? cellSize * 1.4 : t.type === 'tractor' ? cellSize * 1.6 : cellSize * 1.2;
let th = cellSize * 0.7;

if (t.type === 'car') {
ctx.fillStyle = Math.random() > 0.5 ? '#e74c3c' : '#3498db';
ctx.fillRect(t.x - tw/2, ty + cellSize*0.15, tw, th);
// Windows
ctx.fillStyle = 'rgba(200,230,255,0.6)';
ctx.fillRect(t.x - tw*0.3, ty + cellSize*0.2, tw*0.2, th*0.4);
ctx.fillRect(t.x + tw*0.1, ty + cellSize*0.2, tw*0.2, th*0.4);
} else if (t.type === 'truck') {
ctx.fillStyle = '#f39c12';
ctx.fillRect(t.x - tw/2, ty + cellSize*0.1, tw, th * 1.1);
ctx.fillStyle = 'rgba(200,230,255,0.6)';
ctx.fillRect(t.x - tw*0.1, ty + cellSize*0.15, tw*0.2, th*0.4);
} else { // tractor
ctx.fillStyle = '#27ae60';
ctx.fillRect(t.x - tw/2, ty + cellSize*0.1, tw * 0.6, th);
// Big wheels
ctx.fillStyle = '#333';
ctx.beginPath();
ctx.arc(t.x - tw*0.2, ty + cellSize*0.75, cellSize*0.25, 0, Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(t.x + tw*0.2, ty + cellSize*0.65, cellSize*0.18, 0, Math.PI*2);
ctx.fill();
}
}

// Draw flies
for (let f of flies) {
let fx = ox + f.col * cellSize + cellSize/2;
let fy = oy + f.row * cellSize + cellSize/2;
ctx.fillStyle = '#ff5722';
ctx.beginPath();
ctx.arc(fx, fy, cellSize * 0.15, 0, Math.PI * 2);
ctx.fill();
// Wings
ctx.strokeStyle = 'rgba(255,255,255,0.5)';
ctx.lineWidth = 1;
let wingFlap = Math.sin(performance.now() / 100) * 0.3;
ctx.beginPath();
ctx.moveTo(fx, fy);
ctx.lineTo(fx - cellSize*0.15, fy - cellSize*0.2 + wingFlap * cellSize);
ctx.moveTo(fx, fy);
ctx.lineTo(fx + cellSize*0.15, fy - cellSize*0.2 - wingFlap * cellSize);
ctx.stroke();
}

// Draw snake
if (gameState === 'playing' || gameState === 'levelComplete') {
for (let i = 0; i < snake.length; i++) {
let s = snake[i];
let sx = ox + s.col * cellSize + cellSize/2;
let sy = oy + s.row * cellSize + cellSize/2;

if (i === snake.length - 1) {
// Head
ctx.fillStyle = '#4caf50';
ctx.beginPath();
ctx.arc(sx, sy, cellSize * 0.35, 0, Math.PI * 2);
ctx.fill();
// Eyes
let headDir = i > 0 ? [snake[i-1].col - s.col, snake[i-1].row - s.row] : [0,-1];
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(sx + headDir[0]*cellSize*0.15 - cellSize*0.1, sy + headDir[1]*cellSize*0.15 - cellSize*0.1, cellSize*0.08, 0, Math.PI*2);
ctx.arc(sx + headDir[0]*cellSize*0.15 + cellSize*0.1, sy + headDir[1]*cellSize*0.15 - cellSize*0.1, cellSize*0.08, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = '#000';
ctx.beginPath();
ctx.arc(sx + headDir[0]*cellSize*0.15 - cellSize*0.1, sy + headDir[1]*cellSize*0.15 - cellSize*0.1, cellSize*0.04, 0, Math.PI*2);
ctx.arc(sx + headDir[0]*cellSize*0.15 + cellSize*0.1, sy + headDir[1]*cellSize*0.15 - cellSize*0.1, cellSize*0.04, 0, Math.PI*2);
ctx.fill();
} else {
// Body - gradient from green to darker
let t = i / snake.length;
let g = Math.floor(100 + t * 80);
ctx.fillStyle = `rgb(${Math.floor(50+t*30)},${g},30)`;
let r = cellSize * 0.28 * (1 - t * 0.4);
ctx.beginPath();
ctx.arc(sx, sy, r, 0, Math.PI * 2);
ctx.fill();
}
}
}

// Draw particles
for (let p of particles) {
ctx.fillStyle = p.color;
ctx.globalAlpha = p.life / 40;
ctx.beginPath();
ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
ctx.fill();
ctx.globalAlpha = 1;
}

// Death flash
if (gameState === 'dead' && deathTimer > 40) {
ctx.fillStyle = `rgba(255,0,0,${(deathTimer-40)/40 * 0.3})`;
ctx.fillRect(0, 0, W, H);
}

// Level complete text
if (gameState === 'levelComplete') {
ctx.fillStyle = '#ffeb3b';
ctx.font = `bold ${cellSize}px monospace`;
ctx.textAlign = 'center';
ctx.fillText('HOP HOME! +50', W/2, H/2 - cellSize);
}
}

let lastTime = 0;
function gameLoop(time) {
if (gameState === 'playing' || gameState === 'dead' || gameState === 'levelComplete') {
update();
draw();
}
requestAnimationFrame(gameLoop);
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
keys[e.key] = true;
if (gameState !== 'playing') return;
let now = performance.now();
if (now - lastMoveTime < MOVE_COOLDOWN) return;
lastMoveTime = now;

switch(e.key) {
case 'ArrowUp': case 'w': case 'W': moveSnake(0, -1); break;
case 'ArrowDown': case 's': case 'S': moveSnake(0, 1); break;
case 'ArrowLeft': case 'a': case 'A': moveSnake(-1, 0); break;
case 'ArrowRight': case 'd': case 'D': moveSnake(1, 0); break;
}
e.preventDefault();
});

window.addEventListener('keyup', e => { keys[e.key] = false; });

document.getElementById('startBtn').addEventListener('click', () => {
startScreen.style.display = 'none';
hud.style.display = 'flex';
gameState = 'playing';
resetGame();
lastMoveTime = performance.now();
requestAnimationFrame(gameLoop);
});

document.getElementById('restartBtn').addEventListener('click', () => {
gameOverScreen.style.display = 'none';
gameState = 'playing';
resetGame();
lastMoveTime = performance.now();
});

// Detect game over
let checkGameOver = setInterval(() => {
if (lives <= 0 && gameState === 'dead') {
gameState = 'gameover';
hud.style.display = 'none';
gameOverScreen.style.display = 'block';
finalScoreEl.textContent = 'Final Score: ' + score;
}
}, 200);

// Initial draw for background
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
