<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pinball Duel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, duration, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
const WIN_SCORE = 50;
let gameState = 'start'; // start, playing, won
let score1 = 0, score2 = 0;
let winner = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code === 'Enter') {
        initAudio();
        if (gameState === 'start' || gameState === 'won') resetGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Paddles
let p1, p2;
const PADDLE_W = 14;
const PADDLE_H_RATIO = 0.2;
const PADDLE_SPEED = 7;

// Balls
let balls = [];
const BALL_RADIUS = 8;
const MAX_BALLS = 5;

// Bumpers
let bumpers = [];
const BUMPER_RADIUS = 22;

// Particles
let particles = [];

function initBumpers() {
    bumpers = [
        { x: W * 0.35, y: H * 0.3, r: BUMPER_RADIUS, hit: 0 },
        { x: W * 0.65, y: H * 0.3, r: BUMPER_RADIUS, hit: 0 },
        { x: W * 0.35, y: H * 0.7, r: BUMPER_RADIUS, hit: 0 },
        { x: W * 0.65, y: H * 0.7, r: BUMPER_RADIUS, hit: 0 },
        { x: W * 0.5, y: H * 0.5, r: BUMPER_RADIUS + 4, hit: 0 }
    ];
}

function spawnBall() {
    const angle = (Math.random() - 0.5) * Math.PI * 0.6;
    const speed = 3 + Math.random() * 2;
    balls.push({
        x: W / 2,
        y: H / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: BALL_RADIUS,
        lastHitter: 0, // 1 for P1, 2 for P2, 0 for none
        trail: []
    });
}

function resetGame() {
    score1 = 0;
    score2 = 0;
    winner = 0;
    gameState = 'playing';
    p1 = { x: 30, y: H / 2 - H * PADDLE_H_RATIO / 2, h: H * PADDLE_H_RATIO };
    p2 = { x: W - 30 - PADDLE_W, y: H / 2 - H * PADDLE_H_RATIO / 2, h: H * PADDLE_H_RATIO };
    initBumpers();
    balls = [];
    particles = [];
    for (let i = 0; i < 3; i++) spawnBall();
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

function updatePaddles() {
    // P1: W/S
    if (keys['KeyW']) p1.y -= PADDLE_SPEED;
    if (keys['KeyS']) p1.y += PADDLE_SPEED;
    p1.y = Math.max(0, Math.min(H - p1.h, p1.y));

    // P2: Up/Down
    if (keys['ArrowUp']) p2.y -= PADDLE_SPEED;
    if (keys['ArrowDown']) p2.y += PADDLE_SPEED;
    p2.y = Math.max(0, Math.min(H - p2.h, p2.y));
}

function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < r * r;
}

function updateBalls() {
    for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.x += b.vx;
        b.y += b.vy;

        // Trail
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 8) b.trail.shift();

        // Wall collisions (top/bottom)
        if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); playSound(300, 0.1, 'square', 0.1); }
        if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy); playSound(300, 0.1, 'square', 0.1); }

        // Paddle collisions
        // P1 paddle (left)
        if (circleRectCollide(b.x, b.y, b.r, p1.x, p1.y, PADDLE_W, p1.h)) {
            b.vx = Math.abs(b.vx) * 1.02;
            b.lastHitter = 1;
            playSound(500, 0.08, 'triangle', 0.2);
            addParticles(b.x, b.y, '#4af', 5);
        }
        // P2 paddle (right)
        if (circleRectCollide(b.x, b.y, b.r, p2.x, p2.y, PADDLE_W, p2.h)) {
            b.vx = -Math.abs(b.vx) * 1.02;
            b.lastHitter = 2;
            playSound(500, 0.08, 'triangle', 0.2);
            addParticles(b.x, b.y, '#f4a', 5);
        }

        // Bumper collisions
        for (const bp of bumpers) {
            const dx = b.x - bp.x;
            const dy = b.y - bp.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < b.r + bp.r) {
                const nx = dx / dist;
                const ny = dy / dist;
                b.x = bp.x + nx * (b.r + bp.r + 1);
                b.y = bp.y + ny * (b.r + bp.r + 1);
                const dot = b.vx * nx + b.vy * ny;
                b.vx -= 2.5 * dot * nx;
                b.vy -= 2.5 * dot * ny;
                // Speed boost
                const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                if (speed < 5) {
                    b.vx *= 1.3;
                    b.vy *= 1.3;
                }
                bp.hit = 10;
                playSound(800, 0.15, 'sine', 0.25);
                addParticles(b.x, b.y, '#ff0', 8);

                // Award points to last hitter
                if (b.lastHitter === 1) { score1 += 5; }
                else if (b.lastHitter === 2) { score2 += 5; }
            }
        }

        // Score: ball exits left → P2 scores, right → P1 scores
        if (b.x + b.r < 0) {
            score2 += 10;
            addParticles(0, b.y, '#f4a', 15);
            playSound(200, 0.3, 'sawtooth', 0.3);
            balls.splice(i, 1);
        } else if (b.x - b.r > W) {
            score1 += 10;
            addParticles(W, b.y, '#4af', 15);
            playSound(200, 0.3, 'sawtooth', 0.3);
            balls.splice(i, 1);
        }

        // Maintain ball count
        if (balls.length < MAX_BALLS && Math.random() < 0.02) {
            spawnBall();
        }

        // Check win
        if (score1 >= WIN_SCORE) { gameState = 'won'; winner = 1; }
        else if (score2 >= WIN_SCORE) { gameState = 'won'; winner = 2; }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Grid lines
    ctx.strokeStyle = 'rgba(40, 40, 80, 0.3)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Center line
    ctx.strokeStyle = 'rgba(100, 100, 200, 0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
    ctx.setLineDash([]);
}

function drawPaddles() {
    // P1
    ctx.fillStyle = '#4af';
    ctx.shadowColor = '#4af';
    ctx.shadowBlur = 15;
    ctx.fillRect(p1.x, p1.y, PADDLE_W, p1.h);
    ctx.shadowBlur = 0;

    // P2
    ctx.fillStyle = '#f4a';
    ctx.shadowColor = '#f4a';
    ctx.shadowBlur = 15;
    ctx.fillRect(p2.x, p2.y, PADDLE_W, p2.h);
    ctx.shadowBlur = 0;
}

function drawBumpers() {
    for (const bp of bumpers) {
        const scale = 1 + (bp.hit > 0 ? Math.sin(bp.hit * 0.5) * 0.2 : 0);
        if (bp.hit > 0) bp.hit--;

        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.r * scale, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(bp.x, bp.y, 0, bp.x, bp.y, bp.r * scale);
        grad.addColorStop(0, '#ff8');
        grad.addColorStop(1, '#f80');
        ctx.fillStyle = grad;
        ctx.shadowColor = '#ff0';
        ctx.shadowBlur = bp.hit > 0 ? 25 : 10;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Inner circle
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.r * scale * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
    }
}

function drawBalls() {
    for (const b of balls) {
        // Trail
        for (let i = 0; i < b.trail.length; i++) {
            const t = b.trail[i];
            const alpha = (i / b.trail.length) * 0.4;
            ctx.beginPath();
            ctx.arc(t.x, t.y, b.r * (i / b.trail.length), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,100,${alpha})`;
            ctx.fill();
        }
        // Ball
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(b.x - 2, b.y - 2, 0, b.x, b.y, b.r);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(1, '#ff0');
        ctx.fillStyle = grad;
        ctx.shadowColor = '#ff0';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawScore() {
    ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#4af';
    ctx.fillText(`P1: ${score1}`, 20, 35);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f4a';
    ctx.fillText(`P2: ${score2}`, W - 20, 35);

    ctx.textAlign = 'center';
    ctx.font = '16px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText(`First to ${WIN_SCORE}`, W / 2, 35);
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(10,10,26,0.95)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 20;
    ctx.fillText('PINBALL DUEL', W / 2, H / 4);
    ctx.shadowBlur = 0;

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    const lines = [
        '',
        'Player 1 (Left):  W / S  to move paddle',
        'Player 2 (Right): Arrow Up / Arrow Down',
        '',
        'Deflect balls away from your side!',
        'Ball exits LEFT → P2 scores 10',
        'Ball exits RIGHT → P1 scores 10',
        'Hit bumpers for +5 bonus points!',
        '',
        `First to ${WIN_SCORE} wins!`,
        '',
        'Press SPACE or ENTER to start'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H / 2 + i * 28);
    });
}

function drawWinScreen() {
    ctx.fillStyle = 'rgba(10,10,26,0.85)';
    ctx.fillRect(0, 0, W, H);

    const winColor = winner === 1 ? '#4af' : '#f4a';
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px monospace';
    ctx.fillStyle = winColor;
    ctx.shadowColor = winColor;
    ctx.shadowBlur = 20;
    ctx.fillText(`PLAYER ${winner} WINS!`, W / 2, H / 3);
    ctx.shadowBlur = 0;

    ctx.font = '24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`${score1} - ${score2}`, W / 2, H / 2);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Press SPACE to play again', W / 2, H * 0.7);
}

function drawGoalZones() {
    // Left goal zone (P2 scores)
    ctx.fillStyle = 'rgba(255,68,170,0.1)';
    ctx.fillRect(0, 0, 8, H);
    ctx.strokeStyle = 'rgba(255,68,170,0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, 8, H);

    // Right goal zone (P1 scores)
    ctx.fillStyle = 'rgba(68,170,255,0.1)';
    ctx.fillRect(W - 8, 0, 8, H);
    ctx.strokeStyle = 'rgba(68,170,255,0.4)';
    ctx.strokeRect(W - 8, 0, 8, H);
}

let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;

    if (gameState === 'start') {
        drawBackground();
        drawStartScreen();
    } else if (gameState === 'playing') {
        updatePaddles();
        updateBalls();
        updateParticles();

        drawBackground();
        drawGoalZones();
        drawBumpers();
        drawPaddles();
        drawBalls();
        drawParticles();
        drawScore();
    } else if (gameState === 'won') {
        // Still render game behind
        drawBackground();
        drawGoalZones();
        drawBumpers();
        drawPaddles();
        drawBalls();
        drawParticles();
        drawScore();
        drawWinScreen();
    }

    requestAnimationFrame(gameLoop);
}

// Init positions
p1 = { x: 30, y: H / 2 - H * PADDLE_H_RATIO / 2, h: H * PADDLE_H_RATIO };
p2 = { x: W - 44, y: H / 2 - H * PADDLE_H_RATIO / 2, h: H * PADDLE_H_RATIO };
initBumpers();

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
