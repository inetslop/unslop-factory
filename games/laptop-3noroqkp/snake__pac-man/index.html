<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Pac-Man</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, gridW, gridH;
let state = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
let snake = [];
let dots = [];
let powerPellets = [];
let ghosts = [];
let nextDir = null;
let pendingDirs = [];
let lastDir = null;
let ghostTimer = 0;
let powerTimer = 0;
let animFrame = 0;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(freq, duration, type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellSize = Math.floor(Math.min(W, H) / 24);
    gridW = 20;
    gridH = 20;
}

window.addEventListener('resize', resize);
resize();

function initGame() {
    score = 0;
    snake = [{ x: 10, y: 10 }];
    nextDir = null;
    pendingDirs = [];
    lastDir = null;
    ghostTimer = 0;
    powerTimer = 0;

    dots = [];
    for (let x = 0; x < gridW; x++) {
        for (let y = 0; y < gridH; y++) {
            if (!(x === 10 && y === 10) && Math.random() < 0.35) {
                dots.push({ x, y });
            }
        }
    }

    powerPellets = [
        { x: 2, y: 2 }, { x: 17, y: 2 }, { x: 2, y: 17 }, { x: 17, y: 17 }
    ];

    ghosts = [
        { x: 5, y: 5, color: '#ff0040', name: 'Blinky' },
        { x: 15, y: 5, color: '#00c8ff', name: 'Pinky' },
        { x: 5, y: 15, color: '#ffb800', name: 'Inky' }
    ];

    state = 'playing';
}

function onKey(e) {
    initAudio();
    if (state === 'start') {
        initGame();
        return;
    }
    if (state === 'gameover') {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
            initGame();
        }
        return;
    }

    let dir = null;
    switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': dir = { x: 0, y: -1 }; break;
        case 'ArrowDown': case 's': case 'S': dir = { x: 0, y: 1 }; break;
        case 'ArrowLeft': case 'a': case 'A': dir = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D': dir = { x: 1, y: 0 }; break;
    }
    if (dir) {
        e.preventDefault();
        pendingDirs.push(dir);
        if (pendingDirs.length > 3) pendingDirs.shift();
    }
}

window.addEventListener('keydown', onKey);

function moveGhosts() {
    for (let g of ghosts) {
        let dx = snake[0].x - g.x;
        let dy = snake[0].y - g.y;
        let dist = Math.abs(dx) + Math.abs(dy);

        // Simple chase AI with some randomness
        if (Math.random() < 0.3) {
            // Random movement
            let moves = [];
            if (g.x > 1) moves.push({ x: -1, y: 0 });
            if (g.x < gridW - 2) moves.push({ x: 1, y: 0 });
            if (g.y > 1) moves.push({ x: 0, y: -1 });
            if (g.y < gridH - 2) moves.push({ x: 0, y: 1 });
            if (moves.length > 0) {
                let m = moves[Math.floor(Math.random() * moves.length)];
                g.x += m.x;
                g.y += m.y;
            }
        } else {
            // Chase player
            if (Math.abs(dx) > Math.abs(dy)) {
                g.x += Math.sign(dx);
            } else {
                g.y += Math.sign(dy);
            }
            // Keep in bounds
            g.x = Math.max(1, Math.min(gridW - 2, g.x));
            g.y = Math.max(1, Math.min(gridH - 2, g.y));
        }

        // Avoid snake body (simple)
        for (let s of snake) {
            if (g.x === s.x && g.y === s.y) {
                g.x += Math.sign(g.x - s.x) || 1;
                g.y += Math.sign(g.y - s.y) || 1;
                g.x = Math.max(1, Math.min(gridW - 2, g.x));
                g.y = Math.max(1, Math.min(gridH - 2, g.y));
            }
        }

        // Check collision with snake head
        if (g.x === snake[0].x && g.y === snake[0].y) {
            if (powerTimer > 0) {
                // Ghost is vulnerable - remove it
                ghosts.splice(ghosts.indexOf(g), 1);
                score += 50;
                playSound(800, 0.2, 'sine');
            } else {
                state = 'gameover';
                if (score > highScore) highScore = score;
                try { localStorage.setItem('snakepacman_high', highScore); } catch(e) {}
                playSound(150, 0.5, 'sawtooth');
            }
        }
    }
}

function update() {
    if (state !== 'playing') return;

    // Process direction queue
    while (pendingDirs.length > 0) {
        let d = pendingDirs.shift();
        if (lastDir && d.x === -lastDir.x && d.y === -lastDir.y) continue;
        nextDir = d;
        break;
    }

    if (!nextDir) nextDir = lastDir || { x: 1, y: 0 };
    lastDir = nextDir;

    let head = snake[0];
    let nx = head.x + lastDir.x;
    let ny = head.y + lastDir.y;

    // Wall collision
    if (nx < 0 || nx >= gridW || ny < 0 || ny >= gridH) {
        state = 'gameover';
        if (score > highScore) highScore = score;
        try { localStorage.setItem('snakepacman_high', highScore); } catch(e) {}
        playSound(150, 0.5, 'sawtooth');
        return;
    }

    // Self collision
    for (let s of snake) {
        if (s.x === nx && s.y === ny) {
            state = 'gameover';
            if (score > highScore) highScore = score;
            try { localStorage.setItem('snakepacman_high', highScore); } catch(e) {}
            playSound(150, 0.5, 'sawtooth');
            return;
        }
    }

    snake.unshift({ x: nx, y: ny });

    // Eat dot
    let ate = false;
    for (let i = dots.length - 1; i >= 0; i--) {
        if (dots[i].x === nx && dots[i].y === ny) {
            dots.splice(i, 1);
            score += 10;
            ate = true;
            playSound(440 + Math.min(score, 500), 0.1, 'square');
        }
    }

    // Eat power pellet
    for (let i = powerPellets.length - 1; i >= 0; i--) {
        if (powerPellets[i].x === nx && powerPellets[i].y === ny) {
            powerPellets.splice(i, 1);
            score += 50;
            powerTimer = 300; // ~10 seconds at 30fps
            playSound(600, 0.3, 'sine');
        }
    }

    if (!ate) snake.pop();

    // Respawn dots
    if (dots.length < 5 && Math.random() < 0.05) {
        let rx = Math.floor(Math.random() * gridW);
        let ry = Math.floor(Math.random() * gridH);
        let valid = true;
        for (let s of snake) if (s.x === rx && s.y === ry) valid = false;
        for (let d of dots) if (d.x === rx && d.y === ry) valid = false;
        if (valid) dots.push({ x: rx, y: ry });
    }

    // Respawn power pellets
    if (powerPellets.length < 2 && Math.random() < 0.01) {
        let px = Math.floor(Math.random() * (gridW - 4)) + 2;
        let py = Math.floor(Math.random() * (gridH - 4)) + 2;
        powerPellets.push({ x: px, y: py });
    }

    // Power pellet timer
    if (powerTimer > 0) powerTimer--;

    // Ghost movement (every 3 frames)
    ghostTimer++;
    if (ghostTimer >= 3) {
        ghostTimer = 0;
        moveGhosts();
    }

    animFrame++;
}

function draw() {
    ctx.fillStyle = '#0a0a2e';
    ctx.fillRect(0, 0, W, H);

    let offsetX = (W - gridW * cellSize) / 2;
    let offsetY = (H - gridH * cellSize) / 2;

    if (state === 'start') {
        drawStartScreen(offsetX, offsetY);
        return;
    }

    // Draw grid border (walls)
    ctx.strokeStyle = '#4a00e0';
    ctx.lineWidth = 4;
    ctx.strokeRect(offsetX - 2, offsetY - 2, gridW * cellSize + 4, gridH * cellSize + 4);

    // Draw dots
    for (let d of dots) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(offsetX + d.x * cellSize + cellSize / 2, offsetY + d.y * cellSize + cellSize / 2, cellSize * 0.15, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw power pellets
    for (let p of powerPellets) {
        let pulse = 1 + Math.sin(animFrame * 0.1) * 0.3;
        ctx.fillStyle = '#ffdd00';
        ctx.shadowColor = '#ffdd00';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(offsetX + p.x * cellSize + cellSize / 2, offsetY + p.y * cellSize + cellSize / 2, cellSize * 0.3 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Draw snake body (Pac-Man style circles)
    for (let i = snake.length - 1; i >= 0; i--) {
        let s = snake[i];
        let t = i / Math.max(snake.length, 1);
        let r = cellSize * 0.4 * (1 - t * 0.3);

        ctx.fillStyle = i === 0 ? '#ffdd00' : `hsl(${50 - t * 20}, 100%, ${60 - t * 15}%)`;
        if (powerTimer > 0 && i === 0) {
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
        }
        ctx.beginPath();
        ctx.arc(offsetX + s.x * cellSize + cellSize / 2, offsetY + s.y * cellSize + cellSize / 2, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Pac-Man mouth on head
        if (i === 0) {
            let angle = lastDir ? Math.atan2(lastDir.y, lastDir.x) : 0;
            ctx.fillStyle = '#0a0a2e';
            ctx.beginPath();
            ctx.moveTo(offsetX + s.x * cellSize + cellSize / 2, offsetY + s.y * cellSize + cellSize / 2);
            ctx.arc(offsetX + s.x * cellSize + cellSize / 2, offsetY + s.y * cellSize + cellSize / 2, r * 0.8, angle - 0.4, angle + 0.4);
            ctx.closePath();
            ctx.fill();
        }
    }

    // Draw ghosts
    for (let g of ghosts) {
        let gx = offsetX + g.x * cellSize + cellSize / 2;
        let gy = offsetY + g.y * cellSize + cellSize / 2;
        let gr = cellSize * 0.4;

        if (powerTimer > 0) {
            // Flash when vulnerable
            if (animFrame % 10 < 5) continue;
            ctx.fillStyle = '#ffffff';
        } else {
            ctx.fillStyle = g.color;
        }

        // Ghost body
        ctx.beginPath();
        ctx.arc(gx, gy - gr * 0.2, gr, Math.PI, 0);
        ctx.lineTo(gx + gr, gy + gr * 0.8);
        // Wavy bottom
        let waves = 3;
        for (let i = 0; i <= waves; i++) {
            let wx = gx + gr - (i * 2 * gr / waves);
            let wy = gy + gr * 0.8 + ((i % 2 === 0) ? -gr * 0.2 : 0);
            ctx.lineTo(wx, wy);
        }
        ctx.closePath();
        ctx.fill();

        // Eyes
        if (powerTimer <= 0 || animFrame % 10 >= 5) {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(gx - gr * 0.3, gy - gr * 0.2, gr * 0.25, 0, Math.PI * 2);
            ctx.arc(gx + gr * 0.3, gy - gr * 0.2, gr * 0.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(gx - gr * 0.3 + 1, gy - gr * 0.2, gr * 0.12, 0, Math.PI * 2);
            ctx.arc(gx + gr * 0.3 + 1, gy - gr * 0.2, gr * 0.12, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Draw score
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(24, cellSize)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, offsetX, offsetY - 12);

    if (powerTimer > 0) {
        ctx.fillStyle = '#00ffff';
        ctx.fillText(`POWER: ${Math.ceil(powerTimer / 30)}s`, offsetX + cellSize * 4, offsetY - 12);
    }

    if (state === 'gameover') {
        drawGameOver(offsetX, offsetY);
    }
}

function drawStartScreen(ox, oy) {
    ctx.fillStyle = '#ffdd00';
    ctx.font = `bold ${Math.min(48, cellSize * 2)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('SNAKE PAC-MAN', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(18, cellSize * 0.7)}px monospace`;
    ctx.fillText('You are the Pac-Man Snake!', W / 2, H / 3 + 40);
    ctx.fillText('Eat dots to grow. Avoid walls and yourself.', W / 2, H / 3 + 70);
    ctx.fillText('Watch out for ghosts! Grab power pellets', W / 2, H / 3 + 100);
    ctx.fillText('to make them vulnerable.', W / 2, H / 3 + 130);

    ctx.fillStyle = '#ffdd00';
    ctx.font = `bold ${Math.min(20, cellSize * 0.8)}px monospace`;
    let blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillText('PRESS ANY KEY TO START', W / 2, H / 2 + 40);
    }

    ctx.fillStyle = '#888';
    ctx.font = `${Math.min(14, cellSize * 0.6)}px monospace`;
    ctx.fillText('Controls: Arrow Keys / WASD', W / 2, H / 2 + 80);

    if (highScore > 0) {
        ctx.fillStyle = '#ffdd00';
        ctx.fillText(`High Score: ${highScore}`, W / 2, H / 2 + 120);
    }

    // Draw decorative Pac-Man
    let pcX = W / 2;
    let pcY = H / 3 - 60;
    let pcR = 25;
    let mouthAngle = Math.sin(Date.now() * 0.004) * 0.3 + 0.3;

    ctx.fillStyle = '#ffdd00';
    ctx.beginPath();
    ctx.moveTo(pcX, pcY);
    ctx.arc(pcX, pcY, pcR, mouthAngle - Math.PI / 2, mouthAngle + Math.PI / 2 + 1.2);
    ctx.closePath();
    ctx.fill();
}

function drawGameOver(ox, oy) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff0040';
    ctx.font = `bold ${Math.min(48, cellSize * 2)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(24, cellSize)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 3 + 50);
    ctx.fillText(`Length: ${snake.length}`, W / 2, H / 3 + 80);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffdd00';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 3 + 120);
    }

    ctx.fillStyle = '#ffdd00';
    ctx.font = `bold ${Math.min(20, cellSize * 0.8)}px monospace`;
    let blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillText('Press SPACE or R to restart', W / 2, H / 2 + 40);
    }
}

// Load high score
try {
    let saved = localStorage.getItem('snakepacman_high');
    if (saved) highScore = parseInt(saved) || 0;
} catch(e) {}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
