<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Match-3 Tower Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0f0f23;font-family:'Segoe UI',sans-serif}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

// Audio
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function playSound(type){
if(!audioCtx)return;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.connect(gain);gain.connect(audioCtx.destination);
const now=audioCtx.currentTime;
switch(type){
case'swap':osc.type='sine';osc.frequency.setValueAtTime(400,now);osc.frequency.linearRampToValueAtTime(600,now+0.1);gain.gain.setValueAtTime(0.15,now);gain.gain.linearRampToValueAtTime(0,now+0.1);osc.start(now);osc.stop(now+0.1);break;
case'match':osc.type='sine';osc.frequency.setValueAtTime(500,now);osc.frequency.linearRampToValueAtTime(800,now+0.15);gain.gain.setValueAtTime(0.2,now);gain.gain.linearRampToValueAtTime(0,now+0.15);osc.start(now);osc.stop(now+0.15);break;
case'hit':osc.type='square';osc.frequency.setValueAtTime(150,now);gain.gain.setValueAtTime(0.1,now);gain.gain.linearRampToValueAtTime(0,now+0.08);osc.start(now);osc.stop(now+0.08);break;
case'death':osc.type='sawtooth';osc.frequency.setValueAtTime(200,now);osc.frequency.linearRampToValueAtTime(50,now+0.3);gain.gain.setValueAtTime(0.15,now);gain.gain.linearRampToValueAtTime(0,now+0.3);osc.start(now);osc.stop(now+0.3);break;
case'base':osc.type='square';osc.frequency.setValueAtTime(80,now);gain.gain.setValueAtTime(0.25,now);gain.gain.linearRampToValueAtTime(0,now+0.4);osc.start(now);osc.stop(now+0.4);break;
case'wave':osc.type='sine';osc.frequency.setValueAtTime(300,now);osc.frequency.linearRampToValueAtTime(600,now+0.2);gain.gain.setValueAtTime(0.15,now);gain.gain.linearRampToValueAtTime(0,now+0.3);osc.start(now);osc.stop(now+0.3);break;
case'gameover':osc.type='sawtooth';osc.frequency.setValueAtTime(400,now);osc.frequency.linearRampToValueAtTime(100,now+1);gain.gain.setValueAtTime(0.2,now);gain.gain.linearRampToValueAtTime(0,now+1);osc.start(now);osc.stop(now+1);break;
}
}

// Game constants
const GEM_TYPES=5;
const GRID_SIZE=7;
const GEM_COLORS=[
{r:239,g:68,b:68,name:'Fire'},
{r:59,g:130,b:246,name:'Ice'},
{r:34,g:197,b:94,name:'Poison'},
{r:250,g:204,b:21,name:'Lightning'},
{r:168,g:85,b:247,name:'Heavy'}
];

// Game state
let gameState='menu'; // menu, playing, gameover
let score=0;
let baseHP=20;
let maxBaseHP=20;
let wave=0;
let enemies=[];
let projectiles=[];
let particles=[];
let grid=[];
let selectedCell=null;
let comboMultiplier=1;
let shakeTimer=0;
let waveTimer=0;
let waveSpawnQueue=[];
let waveSpawnTimer=0;
let betweenWaves=true;
let betweenWaveTimer=0;
let lastTime=0;

// Layout
function getLayout(){
const gridX=Math.floor(W*0.55);
const gridY=Math.floor(H*0.08);
const cellSize=Math.min(Math.floor((W-gridX-20)/GRID_SIZE),Math.floor((H*0.84)/GRID_SIZE));
const trackY=Math.floor(H*0.5);
const trackHeight=Math.floor(H*0.35);
return{gridX,gridY,cellSize,trackY,trackHeight};
}

// Grid functions
function initGrid(){
grid=[];
for(let r=0;r<GRID_SIZE;r++){
grid[r]=[];
for(let c=0;c<GRID_SIZE;c++){
grid[r][c]=Math.floor(Math.random()*GEM_TYPES);
}
}
// Remove initial matches
let safety=0;
while(findMatches().length>0&&safety<100){
const matches=findMatches();
matches.forEach(({r,c})=>{grid[r][c]=Math.floor(Math.random()*GEM_TYPES);});
safety++;
}
}

function findMatches(){
let matches=[];
// Horizontal
for(let r=0;r<GRID_SIZE;r++){
for(let c=0;c<GRID_SIZE-2;c++){
if(grid[r][c]===grid[r][c+1]&&grid[r][c]===grid[r][c+2]){
matches.push({r,c},{r,c:c+1},{r,c:c+2});
}
}
}
// Vertical
for(let c=0;c<GRID_SIZE;c++){
for(let r=0;r<GRID_SIZE-2;r++){
if(grid[r][c]===grid[r+1][c]&&grid[r][c]===grid[r+2][c]){
matches.push({r,c},{r:r+1,c},{r:r+2,c});
}
}
}
// Deduplicate
let unique=[];
let seen=new Set();
matches.forEach(m=>{
const key=m.r*GRID_SIZE+m.c;
if(!seen.has(key)){seen.add(key);unique.push(m);}
});
return unique;
}

function applyGravity(){
for(let c=0;c<GRID_SIZE;c++){
let writeRow=GRID_SIZE-1;
for(let r=GRID_SIZE-1;r>=0;r--){
if(grid[r][c]!==-1){
grid[writeRow][c]=grid[r][c];
if(writeRow!==r)grid[r][c]=-1;
writeRow--;
}
}
for(let r=writeRow;r>=0;r--){
grid[r][c]=Math.floor(Math.random()*GEM_TYPES);
}
}
}

function trySwap(r1,c1,r2,c2){
if(r2<0||r2>=GRID_SIZE||c2<0||c2>=GRID_SIZE)return false;
let temp=grid[r1][c1];
grid[r1][c1]=grid[r2][c2];
grid[r2][c2]=temp;
let matches=findMatches();
if(matches.length===0){
grid[r1][c1]=grid[r2][c2];
grid[r2][c2]=temp;
return false;
}
// Process matches
processMatches(matches);
playSound('match');
return true;
}

function processMatches(matches){
comboMultiplier=Math.min(comboMultiplier+1,5);
let totalDamage=0;
matches.forEach(m=>{
const type=grid[m.r][m.c];
totalDamage+=getGemPower(type);
spawnProjectileFromGrid(m.r,m.c,type);
spawnParticles(getLayout().gridX+m.c*getLayout().cellSize+getLayout().cellSize/2,
getLayout().gridY+m.r*getLayout().cellSize+getLayout().cellSize/2,
GEM_COLORS[type].r,GEM_COLORS[type].g,GEM_COLORS[type].b);
grid[m.r][m.c]=-1;
});
applyGravity();
setTimeout(()=>{
const newMatches=findMatches();
if(newMatches.length>0){processMatches(newMatches);}
else{comboMultiplier=1;}
},200);
}

function getGemPower(type){
switch(type){
case 0:return 15; // Fire
case 1:return 8;  // Ice (slows)
case 2:return 12; // Poison
case 3:return 10; // Lightning (multi)
case 4:return 25; // Heavy
}
}

function getGemEffect(type){
switch(type){
case 0:return'slow:0.5,0.5';
case 1:return'slow:0.5,3';
case 2:return'dot:5,3';
case 3:return'multi:3';
case 4:return'slow:0.8,0.5';
}
}

function spawnProjectileFromGrid(r,c,type){
const layout=getLayout();
const startX=layout.gridX+c*layout.cellSize+layout.cellSize/2;
const startY=layout.gridY+r*layout.cellSize+layout.cellSize/2;
let target=null;
if(enemies.length>0){
// Target nearest enemy to base (rightmost)
target=enemies.reduce((a,b)=>a.x>b.x?a:b);
}
projectiles.push({x:startX,y:startY,type,target,
speed:350+type*30,damage:getGemPower(type)*comboMultiplier,
trail:[]});
}

// Enemy functions
function spawnEnemy(hpMult){
const layout=getLayout();
const types=['normal','fast','tank'];
let type='normal';
if(wave>=3)type=types[Math.floor(Math.random()*3)];
if(wave>=5&&Math.random()<0.1)type='boss';
let hp,speed,radius;
const baseHP=50*hpMult;
switch(type){
case'normal':hp=baseHP;speed=40+wave*2;radius=12;break;
case'fast':hp=baseHP*0.6;speed=70+wave*3;radius=10;break;
case'tank':hp=baseHP*2;speed=25+wave;radius=18;break;
case'boss':hp=baseHP*4;speed=20+wave;radius=25;break;
}
enemies.push({x:-30,y:layout.trackY+Math.random()*layout.trackHeight,
hp,maxHp:hp,speed,radius,type,slowTimer:0,slowFactor:1,dotTimer:0,dotDmg:0});
}

function startWave(){
wave++;
betweenWaves=false;
playSound('wave');
const hpMult=1+wave*0.3;
const count=Math.min(5+wave*2,25);
waveSpawnQueue=[];
for(let i=0;i<count;i++){
waveSpawnQueue.push(hpMult);
}
waveSpawnTimer=0;
}

// Particle system
function spawnParticles(x,y,r,g,b){
for(let i=0;i<8;i++){
const angle=Math.random()*Math.PI*2;
const speed=50+Math.random()*100;
particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
life:0.5,maxLife:0.5,r,g,b,size:3+Math.random()*4});
}
}

// Update
function update(dt){
if(gameState!=='playing')return;

// Shake
if(shakeTimer>0)shakeTimer-=dt;

// Wave management
if(betweenWaves){
betweenWaveTimer-=dt;
if(betweenWaveTimer<=0)startWave();
return;
}

// Spawn enemies
if(waveSpawnQueue.length>0){
waveSpawnTimer+=dt;
if(waveSpawnTimer>=0.8){
waveSpawnTimer=0;
spawnEnemy(waveSpawnQueue.pop());
}
}

// Update enemies
const layout=getLayout();
let baseX=W*0.45;
for(let i=enemies.length-1;i>=0;i--){
let e=enemies[i];
if(e.slowTimer>0)e.slowTimer-=dt;else e.slowFactor=1;
if(e.dotTimer>0){e.dotTimer-=dt;e.hp-=e.dotDmg*dt;if(e.hp<=0){killEnemy(i);continue;}}
e.x+=e.speed*e.slowFactor*dt;
if(e.x>=baseX){
enemies.splice(i,1);
baseHP--;
shakeTimer=0.3;
playSound('base');
if(baseHP<=0)gameOver();
}
}

// Update projectiles
for(let i=projectiles.length-1;i>=0;i--){
let p=projectiles[i];
p.trail.push({x:p.x,y:p.y});
if(p.trail.length>8)p.trail.shift();
if(!p.target||p.target.hp<=0){
// Find new target
if(enemies.length>0){
p.target=enemies[Math.floor(Math.random()*enemies.length)];
}else{
projectiles.splice(i,1);continue;
}
}
const tx=p.target?p.target.x:baseX;
const ty=p.target?p.target.y:layout.trackY+layout.trackHeight/2;
const dx=tx-p.x,dy=ty-p.y;
const dist=Math.sqrt(dx*dx+dy*dy);
if(dist<15){
// Hit!
if(p.target&&p.target.hp>0){
p.target.hp-=p.damage;
playSound('hit');
if(p.type===1)p.target.slowTimer=3,p.target.slowFactor=0.4;
if(p.type===2)p.target.dotTimer=3,p.target.dotDmg=8;
if(p.type===3){
// Multi-hit
for(let j=0;j<3&&j<enemies.length;j++){
let e=enemies[j];
e.hp-=p.damage*0.5;
}
}
if(p.type===4)p.target.slowTimer=1.5,p.target.slowFactor=0.6;
spawnParticles(tx,ty,GEM_COLORS[p.type].r,GEM_COLORS[p.type].g,GEM_COLORS[p.type].b);
score+=p.damage;
}
projectiles.splice(i,1);
continue;
}
const speed=p.speed*dt;
p.x+=dx/dist*speed;
p.y+=dy/dist*speed;
}

// Kill enemies
for(let i=enemies.length-1;i>=0;i--){
if(enemies[i].hp<=0){killEnemy(i);}
}

// Check wave complete
if(waveSpawnQueue.length===0&&enemies.length===0&&!betweenWaves){
betweenWaves=true;
betweenWaveTimer=2;
score+=wave*10;
}

// Update particles
for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.life-=dt;
if(p.life<=0){particles.splice(i,1);continue;}
p.x+=p.vx*dt;p.y+=p.vy*dt;
p.vy+=200*dt;
}
}

function killEnemy(idx){
const e=enemies[idx];
enemies.splice(idx,1);
score+=Math.floor(e.maxHp/5);
spawnParticles(e.x,e.y,255,255,100);
playSound('death');
}

function gameOver(){
gameState='gameover';
playSound('gameover');
try{
const best=parseInt(localStorage.getItem('m3td_best'))||0;
if(score>best)localStorage.setItem('m3td_best',score);
}catch(e){}
}

// Draw
function draw(){
ctx.fillStyle='#0f0f23';
ctx.fillRect(0,0,W,H);

const layout=getLayout();

if(gameState==='menu'){
drawMenu(layout);
return;
}

if(gameState==='gameover'){
drawGameOver(layout);
return;
}

// Shake
let sx=0,sy=0;
if(shakeTimer>0){
sx=(Math.random()-0.5)*8;sy=(Math.random()-0.5)*8;
}
ctx.save();
ctx.translate(sx,sy);

// Draw track area
drawTrack(layout);
// Draw enemies
enemies.forEach(e=>drawEnemy(e,layout));
// Draw projectiles
projectiles.forEach(p=>drawProjectile(p));
// Draw particles
particles.forEach(p=>drawParticle(p));
// Draw grid
drawGrid(layout);
// Draw HUD
drawHUD(layout);

ctx.restore();
}

function drawTrack(layout){
const ty=layout.trackY;
const th=layout.trackHeight;
// Track background
ctx.fillStyle='#1a1a3e';
ctx.fillRect(0,ty,W*0.52,th);
// Track borders
ctx.strokeStyle='#334';
ctx.lineWidth=2;
ctx.strokeRect(0,ty,W*0.52,th);
// Base
const baseX=W*0.45;
ctx.fillStyle='#22c55e';
ctx.fillRect(baseX-5,ty,10,th);
// HP bar at top of track
const hpW=baseX*0.8;
ctx.fillStyle='#333';
ctx.fillRect(20,ty+10,hpW,16);
ctx.fillStyle=baseHP>maxBaseHP*0.3?'#22c55e':'#ef4444';
ctx.fillRect(20,ty+10,hpW*(baseHP/maxBaseHP),16);
ctx.strokeStyle='#555';
ctx.strokeRect(20,ty+10,hpW,16);
ctx.fillStyle='#fff';
ctx.font='12px monospace';
ctx.textAlign='left';
ctx.fillText('BASE HP: '+baseHP+'/'+maxBaseHP,25,ty+22);
}

function drawEnemy(e){
const colors={normal:'#f97316',fast:'#fbbf24',tank:'#8b5cf6',boss:'#ef4444'};
ctx.fillStyle=colors[e.type];
ctx.beginPath();
ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);
ctx.fill();
// HP bar
const bw=e.radius*2;
ctx.fillStyle='#333';
ctx.fillRect(e.x-bw/2,e.y-e.radius-10,bw,5);
ctx.fillStyle='#22c55e';
ctx.fillRect(e.x-bw/2,e.y-e.radius-10,bw*(e.hp/e.maxHp),5);
// Slow indicator
if(e.slowTimer>0){
ctx.strokeStyle='#60a5fa';
ctx.lineWidth=2;
ctx.beginPath();
ctx.arc(e.x,e.y,e.radius+3,0,Math.PI*2);
ctx.stroke();
}
}

function drawProjectile(p){
// Trail
for(let i=0;i<p.trail.length;i++){
const t=p.trail[i];
const alpha=i/p.trail.length*0.5;
ctx.fillStyle=`rgba(${GEM_COLORS[p.type].r},${GEM_COLORS[p.type].g},${GEM_COLORS[p.type].b},${alpha})`;
ctx.beginPath();
ctx.arc(t.x,t.y,4,0,Math.PI*2);
ctx.fill();
}
// Head
ctx.fillStyle=`rgb(${GEM_COLORS[p.type].r},${GEM_COLORS[p.type].g},${GEM_COLORS[p.type].b})`;
ctx.beginPath();
ctx.arc(p.x,p.y,6,0,Math.PI*2);
ctx.fill();
ctx.fillStyle='#fff';
ctx.beginPath();
ctx.arc(p.x,p.y,3,0,Math.PI*2);
ctx.fill();
}

function drawParticle(p){
const alpha=p.life/p.maxLife;
ctx.fillStyle=`rgba(${p.r},${p.g},${p.b},${alpha})`;
ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
}

function drawGrid(layout){
const{gridX,gridY,cellSize}=layout;
// Grid background
ctx.fillStyle='#1e1e3f';
ctx.fillRect(gridX-5,gridY-5,GRID_SIZE*cellSize+10,GRID_SIZE*cellSize+10);

for(let r=0;r<GRID_SIZE;r++){
for(let c=0;c<GRID_SIZE;c++){
const x=gridX+c*cellSize;
const y=gridY+r*cellSize;
if(grid[r][c]===-1)continue;
const col=GEM_COLORS[grid[r][c]];
// Gem body
ctx.fillStyle=`rgb(${col.r},${col.g},${col.b})`;
ctx.beginPath();
ctx.roundRect(x+3,y+3,cellSize-6,cellSize-6,8);
ctx.fill();
// Highlight
ctx.fillStyle='rgba(255,255,255,0.3)';
ctx.beginPath();
ctx.arc(x+cellSize*0.35,y+cellSize*0.35,(cellSize-6)*0.2,0,Math.PI*2);
ctx.fill();
// Selection highlight
if(selectedCell&&selectedCell.r===r&&selectedCell.c===c){
ctx.strokeStyle='#fff';
ctx.lineWidth=3;
ctx.beginPath();
ctx.roundRect(x+2,y+2,cellSize-4,cellSize-4,8);
ctx.stroke();
}
}
}

// Grid border
ctx.strokeStyle='#446';
ctx.lineWidth=2;
ctx.strokeRect(gridX-5,gridY-5,GRID_SIZE*cellSize+10,GRID_SIZE*cellSize+10);
}

function drawHUD(layout){
ctx.fillStyle='#fff';
ctx.font='bold 18px monospace';
ctx.textAlign='left';
ctx.fillText('SCORE: '+score,layout.gridX,layout.gridY-15);
ctx.fillText('WAVE: '+wave,W*0.6,layout.gridY-15);
if(comboMultiplier>1){
ctx.fillStyle='#fbbf24';
ctx.fillText('COMBO x'+comboMultiplier,W*0.75,layout.gridY-15);
}
}

function drawMenu(layout){
ctx.fillStyle='#fff';
ctx.textAlign='center';
ctx.font='bold 48px monospace';
ctx.fillText('MATCH-3',W/2,H*0.25);
ctx.fillText('TOWER DEFENSE',W/2,H*0.35);
ctx.font='16px monospace';
ctx.fillStyle='#aaa';
ctx.fillText('Swap adjacent gems to match 3+ and fire at enemies!',W/2,H*0.48);
ctx.fillText('Defend your base from waves of enemies.',W/2,H*0.54);
ctx.fillText('',W/2,H*0.6);
ctx.fillText('Red: Fire (high dmg)  Blue: Ice (slows)',W/2,H*0.62);
ctx.fillText('Green: Poison (DoT)   Yellow: Lightning (multi-hit)',W/2,H*0.65);
ctx.fillText('Purple: Heavy (max dmg)',W/2,H*0.68);
ctx.font='14px monospace';
ctx.fillStyle='#888';
ctx.fillText('Click/tap grid to select & swap gems',W/2,H*0.75);
try{
const best=parseInt(localStorage.getItem('m3td_best'))||0;
if(best>0)ctx.fillText('Best: '+best,W/2,H*0.8);
}catch(e){}
ctx.fillStyle='#22c55e';
ctx.font='bold 24px monospace';
const pulse=0.5+Math.sin(Date.now()*0.005)*0.5;
ctx.globalAlpha=pulse;
ctx.fillText('[ CLICK TO START ]',W/2,H*0.88);
ctx.globalAlpha=1;
}

function drawGameOver(layout){
ctx.fillStyle='#fff';
ctx.textAlign='center';
ctx.font='bold 48px monospace';
ctx.fillText('GAME OVER',W/2,H*0.3);
ctx.font='24px monospace';
ctx.fillText('Score: '+score,W/2,H*0.45);
ctx.fillText('Wave: '+wave,W/2,H*0.52);
try{
const best=parseInt(localStorage.getItem('m3td_best'))||0;
ctx.font='16px monospace';
ctx.fillStyle='#aaa';
ctx.fillText('Best: '+best,W/2,H*0.6);
}catch(e){}
ctx.fillStyle='#22c55e';
ctx.font='bold 24px monospace';
const pulse=0.5+Math.sin(Date.now()*0.005)*0.5;
ctx.globalAlpha=pulse;
ctx.fillText('[ CLICK TO RESTART ]',W/2,H*0.75);
ctx.globalAlpha=1;
}

// Input
function getGridCell(x,y){
const layout=getLayout();
if(x<layout.gridX||y<layout.gridY)return null;
const c=Math.floor((x-layout.gridX)/layout.cellSize);
const r=Math.floor((y-layout.gridY)/layout.cellSize);
if(r>=0&&r<GRID_SIZE&&c>=0&&c<GRID_SIZE)return{r,c};
return null;
}

canvas.addEventListener('click',(e)=>{
initAudio();
const rect=canvas.getBoundingClientRect();
const x=e.clientX-rect.left;
const y=e.clientY-rect.top;

if(gameState==='menu'){
startGame();
return;
}
if(gameState==='gameover'){
startGame();
return;
}
if(gameState!=='playing')return;

const cell=getGridCell(x,y);
if(!cell)return;

if(!selectedCell){
selectedCell=cell;
playSound('swap');
}else{
const dr=Math.abs(cell.r-selectedCell.r);
const dc=Math.abs(cell.c-selectedCell.c);
if(dr+dc===1){
trySwap(selectedCell.r,selectedCell.c,cell.r,cell.c);
}
selectedCell=null;
}
});

// Keyboard restart
window.addEventListener('keydown',(e)=>{
initAudio();
if(e.key==='r'||e.key==='R'){
if(gameState!=='playing')startGame();
}
if(e.key==='Escape'&&gameState==='playing'){
gameState='menu';
}
});

function startGame(){
gameState='playing';
score=0;
baseHP=maxBaseHP;
wave=0;
enemies=[];
projectiles=[];
particles=[];
selectedCell=null;
comboMultiplier=1;
betweenWaves=true;
betweenWaveTimer=1.5;
waveSpawnQueue=[];
initGrid();
}

// Main loop
function gameLoop(timestamp){
const dt=Math.min((timestamp-lastTime)/1000,0.05);
lastTime=timestamp;
update(dt);
draw();
requestAnimationFrame(gameLoop);
}

initGrid();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
