<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Space Invaders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; font-family: 'Courier New', monospace; }
#startScreen, #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: #0f0; pointer-events: auto; }
#startScreen h1 { font-size: 2.5em; text-shadow: 0 0 20px #0f0, 0 0 40px #0f0; margin-bottom: 20px; }
#startScreen p, #gameOver p { font-size: 1.1em; color: #8f8; line-height: 1.6; }
.btn { background: none; border: 2px solid #0f0; color: #0f0; font-family: 'Courier New', monospace; font-size: 1.2em; padding: 10px 30px; cursor: pointer; margin-top: 20px; transition: all 0.3s; }
.btn:hover { background: #0f0; color: #000; box-shadow: 0 0 20px #0f0; }
#gameOver h1 { font-size: 2em; color: #f44; text-shadow: 0 0 20px #f44; margin-bottom: 15px; }
#gameOver .score { font-size: 1.3em; color: #ff8; }
.hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
<div id="startScreen">
<h1>GRAVITY SPACE INVADERS</h1>
<p>Manage your ship's altitude against gravity!<br>
A/D or ←/→ : Move<br>
W or ↑ : Thrust Up (fight gravity)<br>
S or ↓ : Brake / Drop<br>
SPACE : Fire Laser<br><br>
Don't let aliens reach the bottom!<br>
Don't hit the ground!</p>
<button class="btn" id="startBtn">LAUNCH</button>
</div>
<div id="gameOver" class="hidden">
<h1>SIGNAL LOST</h1>
<p class="score" id="finalScore"></p>
<button class="btn" id="restartBtn">RESTART</button>
</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)(); }
function playSound(type) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  if (type === 'laser') {
    o.type = 'square'; o.frequency.setValueAtTime(880, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.15);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'explosion') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(150, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    o.start(); o.stop(audioCtx.currentTime + 0.4);
  } else if (type === 'thrust') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(60, audioCtx.currentTime);
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    o.start(); o.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'hit') {
    o.type = 'square'; o.frequency.setValueAtTime(200, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'alienShoot') {
    o.type = 'sawtooth'; o.frequency.setValueAtTime(400, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    o.start(); o.stop(audioCtx.currentTime + 0.2);
  }
}

// Game state
let game = { state: 'start', score: 0, lives: 3, wave: 1 };
let ship = null;
let bullets = [];
let alienBullets = [];
let aliens = [];
let particles = [];
let stars = [];
let keys = {};
let lastTime = 0;

function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.3 + 0.1 });
  }
}

function spawnAliens(wave) {
  aliens = [];
  const cols = 8;
  const rows = 5;
  const spacingX = Math.min(60, W / (cols + 2));
  const startX = (W - (cols - 1) * spacingX) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      aliens.push({
        x: startX + c * spacingX,
        y: 60 + r * 45,
        w: 28, h: 24,
        hp: 1,
        type: r === 0 ? 2 : (r < 3 ? 1 : 0),
        alive: true,
        vx: 0, vy: 0,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
}

function resetGame() {
  game.score = 0;
  game.lives = 3;
  game.wave = 1;
  bullets = [];
  alienBullets = [];
  particles = [];
  ship = { x: W / 2, y: H - 80, vx: 0, vy: 0, w: 40, h: 30, thrusting: false, invincible: 0 };
  spawnAliens(1);
}

function startGame() {
  initAudio();
  resetGame();
  game.state = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOver').classList.add('hidden');
}

function showGameOver() {
  game.state = 'over';
  document.getElementById('finalScore').textContent = `SCORE: ${game.score}`;
  document.getElementById('gameOver').classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (game.state === 'start' && e.code === 'Enter') startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 4 + 1;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
  }
}

function update(dt) {
  if (game.state !== 'playing') return;
  const GRAVITY = 300;
  const THRUST = 500;
  const MOVE_SPEED = 300;
  const BULLET_SPEED = 600;

  // Ship physics
  if (ship) {
    ship.thrusting = false;
    if (keys['KeyW'] || keys['ArrowUp']) {
      ship.vy -= THRUST * dt;
      ship.thrusting = true;
      if (Math.random() < 0.3) playSound('thrust');
    }
    if (keys['KeyS'] || keys['ArrowDown']) ship.vy += 200 * dt;
    if (keys['KeyA'] || keys['ArrowLeft']) ship.vx -= MOVE_SPEED * dt;
    if (keys['KeyD'] || keys['ArrowRight']) ship.vx += MOVE_SPEED * dt;

    // Gravity
    ship.vy += GRAVITY * dt;
    // Damping
    ship.vx *= 0.92;
    ship.vy *= 0.97;
    // Clamp vy
    ship.vy = Math.max(-400, Math.min(500, ship.vy));

    ship.x += ship.vx;
    ship.y += ship.vy;

    // Bounds
    ship.x = Math.max(20, Math.min(W - 20, ship.x));
    if (ship.y > H - 30) { ship.y = H - 30; ship.vy = 0; }
    if (ship.y < 20) { ship.y = 20; ship.vy = 0; }

    if (ship.invincible > 0) ship.invincible -= dt;

    // Shoot
    if (keys['Space'] && bullets.length < 3) {
      const b = { x: ship.x, y: ship.y - 20, vx: 0, vy: -BULLET_SPEED, life: 1 };
      bullets.push(b);
      playSound('laser');
      keys['Space'] = false;
    }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.vy += GRAVITY * 0.05 * dt; // slight gravity on bullets
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y < -20 || b.y > H + 20) bullets.splice(i, 1);
  }

  // Alien bullets
  for (let i = alienBullets.length - 1; i >= 0; i--) {
    const b = alienBullets[i];
    b.vy += GRAVITY * 0.1 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -20) alienBullets.splice(i, 1);
  }

  // Aliens
  const waveSpeed = 30 + game.wave * 15;
  let aliveAliens = aliens.filter(a => a.alive);
  if (aliveAliens.length === 0 && aliens.length > 0) {
    game.wave++;
    alienBullets = [];
    spawnAliens(game.wave);
  }

  for (const a of aliens) {
    if (!a.alive) continue;
    // Gravity pull down + slight wave motion
    a.vy += GRAVITY * 0.02 * dt;
    a.vy = Math.min(a.vy, waveSpeed);
    a.phase += dt * 3;
    a.x += Math.sin(a.phase) * 15 * dt;
    a.y += a.vy * dt;

    // Keep in bounds
    a.x = Math.max(20, Math.min(W - 20, a.x));

    // Aliens shoot
    if (Math.random() < 0.003 * game.wave && aliveAliens.length > 0) {
      const target = ship;
      const dirX = target ? (target.x - a.x) * 0.5 : 0;
      alienBullets.push({ x: a.x, y: a.y + 12, vx: dirX, vy: 200 });
      playSound('alienShoot');
    }

    // Bullet collision
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (Math.abs(b.x - a.x) < a.w / 2 + 5 && Math.abs(b.y - a.y) < a.h / 2 + 5) {
        a.hp--;
        bullets.splice(i, 1);
        if (a.hp <= 0) {
          a.alive = false;
          game.score += (a.type + 1) * 10;
          addParticles(a.x, a.y, '#0f0', 15);
          playSound('explosion');
        }
      }
    }

    // Alien hits ship
    if (ship && ship.invincible <= 0 && Math.abs(ship.x - a.x) < (ship.w + a.w) / 2 && Math.abs(ship.y - a.y) < (ship.h + a.h) / 2) {
      a.alive = false;
      addParticles(a.x, a.y, '#f80', 15);
      hitShip();
    }

    // Alien reaches bottom
    if (a.y > H - 20) {
      a.alive = false;
      addParticles(a.x, a.y, '#f44', 10);
      hitShip();
    }
  }

  // Alien bullets hit ship
  if (ship && ship.invincible <= 0) {
    for (let i = alienBullets.length - 1; i >= 0; i--) {
      const b = alienBullets[i];
      if (Math.abs(b.x - ship.x) < ship.w / 2 + 5 && Math.abs(b.y - ship.y) < ship.h / 2 + 5) {
        alienBullets.splice(i, 1);
        hitShip();
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Stars drift
  for (const s of stars) {
    s.y += s.sp;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function hitShip() {
  game.lives--;
  playSound('hit');
  addParticles(ship.x, ship.y, '#ff0', 20);
  if (game.lives <= 0) {
    showGameOver();
  } else {
    ship.invincible = 2;
    ship.vy = -100;
  }
}

function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.3 + s.s * 0.3})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  if (game.state !== 'playing') return;

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Bullets
  for (const b of bullets) {
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x - 2, b.y - 8, 4, 16);
  }
  ctx.shadowBlur = 0;

  // Alien bullets
  for (const b of alienBullets) {
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 6;
    ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
  }
  ctx.shadowBlur = 0;

  // Aliens
  for (const a of aliens) {
    if (!a.alive) continue;
    const colors = ['#0f0', '#0ff', '#f0f'];
    const c = colors[a.type];
    ctx.fillStyle = c;
    ctx.shadowColor = c;
    ctx.shadowBlur = 8;
    // Draw alien shape
    const ax = a.x, ay = a.y, aw = a.w, ah = a.h;
    if (a.type === 0) {
      // Small bug
      ctx.fillRect(ax - 10, ay - 6, 20, 12);
      ctx.fillRect(ax - 14, ay - 10, 8, 5);
      ctx.fillRect(ax + 6, ay - 10, 8, 5);
    } else if (a.type === 1) {
      // Medium
      ctx.fillRect(ax - 12, ay - 8, 24, 16);
      ctx.fillRect(ax - 14, ay - 12, 6, 6);
      ctx.fillRect(ax + 8, ay - 12, 6, 6);
    } else {
      // Boss
      ctx.fillRect(ax - 14, ay - 10, 28, 20);
      ctx.fillRect(ax - 16, ay - 14, 8, 6);
      ctx.fillRect(ax + 8, ay - 14, 8, 6);
      ctx.fillRect(ax - 3, ay - 12, 6, 6);
    }
  }
  ctx.shadowBlur = 0;

  // Ship
  if (ship) {
    if (ship.invincible > 0 && Math.floor(ship.invincible * 10) % 2 === 0) return;
    const sx = ship.x, sy = ship.y;
    ctx.fillStyle = '#0f0';
    ctx.shadowColor = '#0f0';
    ctx.shadowBlur = 10;
    // Ship body
    ctx.beginPath();
    ctx.moveTo(sx, sy - 15);
    ctx.lineTo(sx - 18, sy + 12);
    ctx.lineTo(sx - 6, sy + 8);
    ctx.lineTo(sx, sy + 14);
    ctx.lineTo(sx + 6, sy + 8);
    ctx.lineTo(sx + 18, sy + 12);
    ctx.closePath();
    ctx.fill();
    // Cockpit
    ctx.fillStyle = '#ff0';
    ctx.fillRect(sx - 3, sy - 8, 6, 8);
    // Thrust flame
    if (ship.thrusting) {
      ctx.fillStyle = `hsl(${Math.random() * 60}, 100%, 60%)`;
      const fh = Math.random() * 15 + 10;
      ctx.beginPath();
      ctx.moveTo(sx - 8, sy + 14);
      ctx.lineTo(sx, sy + 14 + fh);
      ctx.lineTo(sx + 8, sy + 14);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  // HUD
  ctx.fillStyle = '#0f0';
  ctx.font = '16px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${game.score}`, 20, 30);
  ctx.fillText(`WAVE: ${game.wave}`, 20, 55);
  // Lives
  for (let i = 0; i < game.lives; i++) {
    ctx.fillStyle = '#0f0';
    ctx.fillRect(W - 40 - i * 30, 20, 20, 15);
  }

  // Gravity indicator
  ctx.fillStyle = 'rgba(255,100,0,0.6)';
  ctx.font = '12px Courier New';
  ctx.textAlign = 'right';
  if (ship) {
    const gForce = ship.vy > 0 ? 'FALLING' : (ship.thrusting ? 'THRUSTING' : 'DRIFTING');
    ctx.fillText(`GRAV: ${gForce}`, W - 20, H - 20);
  }

  // Ground line
  ctx.strokeStyle = 'rgba(255,50,50,0.4)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 5]);
  ctx.beginPath();
  ctx.moveTo(0, H - 10);
  ctx.lineTo(W, H - 10);
  ctx.stroke();
  ctx.setLineDash([]);
}

function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

initStars();
requestAnimationFrame(loop);
</script>
</body>
</html>
