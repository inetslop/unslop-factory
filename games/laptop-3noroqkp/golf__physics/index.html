<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Physics</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    switch(type) {
        case 'hit':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
            break;
        case 'bounce':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
            break;
        case 'hole':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
            break;
        case 'water':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
            break;
        case 'sand':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
            break;
        case 'flag':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
            break;
    }
}

// Game State
const STATE = { MENU: 0, PLAYING: 1, HOLE_COMPLETE: 2, GAME_OVER: 3 };
let gameState = STATE.MENU;
let currentHole = 0;
let totalStrokes = 0;
let holeStrokes = 0;
let scores = [];

// Ball
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10, inSand: false, inWater: false };
let dragging = false;
let dragStart = { x: 0, y: 0 };
let dragEnd = { x: 0, y: 0 };
let canHit = true;
let ballResting = false;
let restTimer = 0;

// Particles
let particles = [];

// Flag animation
let flagWave = 0;
let flagIn = false;

// Levels
const levels = [
    {
        par: 2,
        start: { x: 80, y: 0 },
        ground: (x) => {
            const t = x / W;
            return H * 0.75 + Math.sin(t * 3) * 20;
        },
        sand: [{ start: 0.4, end: 0.5 }],
        water: [],
        flagX: 0.85,
        walls: []
    },
    {
        par: 3,
        start: { x: 60, y: 0 },
        ground: (x) => {
            const t = x / W;
            return H * 0.7 + Math.sin(t * 4) * 30 + Math.cos(t * 2) * 15;
        },
        sand: [{ start: 0.5, end: 0.6 }],
        water: [{ start: 0.7, end: 0.8, depth: 30 }],
        flagX: 0.9,
        walls: []
    },
    {
        par: 3,
        start: { x: 60, y: 0 },
        ground: (x) => {
            const t = x / W;
            return H * 0.75 - Math.sin(t * 5) * 40 + Math.sin(t * 2) * 20;
        },
        sand: [{ start: 0.3, end: 0.38 }, { start: 0.65, end: 0.72 }],
        water: [{ start: 0.45, end: 0.55, depth: 25 }],
        flagX: 0.92,
        walls: []
    },
    {
        par: 4,
        start: { x: 50, y: 0 },
        ground: (x) => {
            const t = x / W;
            return H * 0.8 - Math.sin(t * 6) * 35 + Math.cos(t * 3) * 25;
        },
        sand: [{ start: 0.25, end: 0.35 }, { start: 0.6, end: 0.7 }],
        water: [{ start: 0.4, end: 0.5, depth: 35 }],
        flagX: 0.93,
        walls: [{ x: 0.75, h: 60 }]
    },
    {
        par: 4,
        start: { x: 50, y: 0 },
        ground: (x) => {
            const t = x / W;
            return H * 0.82 - Math.sin(t * 7) * 30 + Math.cos(t * 4) * 20;
        },
        sand: [{ start: 0.2, end: 0.28 }, { start: 0.5, end: 0.58 }, { start: 0.78, end: 0.85 }],
        water: [{ start: 0.35, end: 0.42, depth: 30 }],
        flagX: 0.95,
        walls: [{ x: 0.65, h: 70 }, { x: 0.88, h: 50 }]
    },
    {
        par: 5,
        start: { x: 40, y: 0 },
        ground: (x) => {
            const t = x / W;
            return H * 0.8 - Math.sin(t * 8) * 35 + Math.cos(t * 5) * 20 + Math.sin(t * 11) * 10;
        },
        sand: [{ start: 0.15, end: 0.22 }, { start: 0.45, end: 0.52 }, { start: 0.7, end: 0.78 }],
        water: [{ start: 0.3, end: 0.38, depth: 40 }, { start: 0.6, end: 0.65, depth: 30 }],
        flagX: 0.95,
        walls: [{ x: 0.55, h: 55 }, { x: 0.82, h: 65 }]
    }
];

function getGroundY(x) {
    const level = levels[currentHole];
    return level.ground(x);
}

function isSandAt(x) {
    const level = levels[currentHole];
    const t = x / W;
    for (let s of level.sand) {
        if (t >= s.start && t <= s.end) return true;
    }
    return false;
}

function isWaterAt(x) {
    const level = levels[currentHole];
    const t = x / W;
    for (let w of level.water) {
        if (t >= w.start && t <= w.end) return true;
    }
    return false;
}

function isInWater(x, y) {
    const level = levels[currentHole];
    const t = x / W;
    for (let w of level.water) {
        if (t >= w.start && t <= w.end) {
            const waterY = getGroundY(x);
            return y > waterY - w.depth;
        }
    }
    return false;
}

function checkWalls(x, y, r) {
    const level = levels[currentHole];
    for (let wall of level.walls) {
        const wx = wall.x * W;
        if (Math.abs(x - wx) < r + 5 && y > getGroundY(wx) - wall.h) {
            return true;
        }
    }
    return false;
}

function resetBall() {
    const level = levels[currentHole];
    ball.x = level.start.x;
    ball.y = getGroundY(ball.x) - ball.r;
    ball.vx = 0;
    ball.vy = 0;
    canHit = true;
    ballResting = false;
}

function startHole(idx) {
    currentHole = idx;
    holeStrokes = 0;
    resetBall();
    flagIn = false;
    gameState = STATE.PLAYING;
}

function startGame() {
    totalStrokes = 0;
    scores = [];
    startHole(0);
}

// Physics
const GRAVITY = 0.4;
const BOUNCE = 0.6;
const FRICTION = 0.98;
const SAND_FRICTION = 0.92;
const MAX_POWER = 18;

function updateBall() {
    if (!canHit || flagIn) return;
    
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    
    if (speed < 0.3 && ball.y > getGroundY(ball.x) - ball.r - 2) {
        restTimer++;
        if (restTimer > 30) {
            ballResting = true;
            canHit = true;
        }
    } else {
        restTimer = 0;
        ballResting = false;
    }
    
    // Sub-stepping for accuracy
    const steps = 4;
    for (let s = 0; s < steps; s++) {
        ball.vy += GRAVITY / steps;
        ball.x += ball.vx / steps;
        ball.y += ball.vy / steps;
        
        // Boundaries
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -BOUNCE; }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -BOUNCE; }
        
        // Ground collision
        const gy = getGroundY(ball.x);
        if (ball.y + ball.r > gy) {
            // Calculate surface normal
            const dx = 4;
            const gy2 = getGroundY(ball.x + dx);
            const slope = (gy2 - gy) / dx;
            const len = Math.sqrt(1 + slope * slope);
            const nx = -slope / len;
            const ny = -1 / len;
            
            // Push ball out
            ball.y = gy - ball.r;
            
            // Reflect velocity
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot > 0) {
                ball.vx -= 2 * BOUNCE * dot * nx;
                ball.vy -= 2 * BOUNCE * dot * ny;
                
                if (Math.abs(ball.vy) > 1) {
                    playSound('bounce');
                }
            }
            
            // Friction
            const fr = isSandAt(ball.x) ? SAND_FRICTION : FRICTION;
            ball.vx *= fr;
            ball.vy *= 0.8;
            
            if (isSandAt(ball.x)) {
                ball.inSand = true;
                ball.vx *= 0.95;
            } else {
                ball.inSand = false;
            }
        }
        
        // Wall collisions
        const level = levels[currentHole];
        for (let wall of level.walls) {
            const wx = wall.x * W;
            if (Math.abs(ball.x - wx) < ball.r + 4 && ball.y > gy - wall.h) {
                if (ball.vx > 0 && ball.x < wx) { ball.x = wx - ball.r - 4; ball.vx *= -BOUNCE; }
                else if (ball.vx < 0 && ball.x > wx) { ball.x = wx + ball.r + 4; ball.vx *= -BOUNCE; }
            }
        }
        
        // Water check
        if (isInWater(ball.x, ball.y)) {
            playSound('water');
            spawnParticles(ball.x, ball.y, '#4fc3f7', 15);
            ballStrokes++;
            resetBall();
            return;
        }
        
        // Check hole/flag
        const flagX = level.flagX * W;
        const flagY = getGroundY(flagX) - 20;
        const fdx = ball.x - flagX;
        const fdy = ball.y - (getGroundY(flagX) - ball.r);
        const fdist = Math.sqrt(fdx * fdx + fdy * fdy);
        
        if (fdist < 15 && speed < 8 && !flagIn) {
            // Ball drops in hole!
            flagIn = true;
            canHit = false;
            ball.vx = 0;
            ball.vy = 0;
            ball.y = getGroundY(flagX) - 2;
            ball.x = flagX;
            playSound('hole');
            playSound('flag');
            spawnParticles(ball.x, ball.y, '#ffd700', 25);
            setTimeout(() => {
                gameState = STATE.HOLE_COMPLETE;
            }, 1500);
        }
    }
    
    // Sand sound
    if (ball.inSand && speed > 1 && Math.random() < 0.1) {
        playSound('sand');
    }
}

function ballStrokes() { holeStrokes++; totalStrokes++; }

// Particles
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 60 + Math.random() * 30,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Input
let mouseX = 0, mouseY = 0;
let mouseDown = false;

function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0] : e).clientX - rect.left;
    const y = (e.touches ? e.touches[0] : e).clientY - rect.top;
    return { x, y };
}

function onDown(e) {
    initAudio();
    const pos = getPos(e);
    mouseX = pos.x; mouseY = pos.y;
    
    if (gameState === STATE.MENU) {
        startGame();
        return;
    }
    if (gameState === STATE.HOLE_COMPLETE) {
        if (currentHole + 1 < levels.length) {
            startHole(currentHole + 1);
        } else {
            gameState = STATE.GAME_OVER;
        }
        return;
    }
    if (gameState === STATE.GAME_OVER) {
        gameState = STATE.MENU;
        return;
    }
    
    if (gameState === STATE.PLAYING && canHit && ballResting) {
        const dist = Math.sqrt((pos.x - ball.x) ** 2 + (pos.y - ball.y) ** 2);
        if (dist < 60) {
            dragging = true;
            dragStart.x = pos.x;
            dragStart.y = pos.y;
            mouseDown = true;
        }
    }
}

function onMove(e) {
    const pos = getPos(e);
    mouseX = pos.x; mouseY = pos.y;
    if (dragging) {
        dragEnd.x = pos.x;
        dragEnd.y = pos.y;
    }
}

function onUp() {
    if (dragging) {
        dragging = false;
        const dx = ball.x - dragEnd.x;
        const dy = ball.y - dragEnd.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 15) {
            const power = Math.min(dist / 8, MAX_POWER);
            const angle = Math.atan2(dy, dx);
            ball.vx = Math.cos(angle) * power;
            ball.vy = Math.sin(angle) * power;
            canHit = false;
            ballStrokes();
            playSound('hit');
            spawnParticles(ball.x, ball.y, '#fff', 8);
        } else {
            canHit = true;
        }
    }
    mouseDown = false;
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(e); });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(e); });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });

window.addEventListener('keydown', (e) => {
    if (gameState === STATE.MENU && (e.key === ' ' || e.key === 'Enter')) startGame();
    if (gameState === STATE.HOLE_COMPLETE && (e.key === ' ' || e.key === 'Enter')) {
        if (currentHole + 1 < levels.length) startHole(currentHole + 1);
        else gameState = STATE.GAME_OVER;
    }
    if (gameState === STATE.GAME_OVER && (e.key === ' ' || e.key === 'Enter')) gameState = STATE.MENU;
});

// Rendering
function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#87CEEB');
    grad.addColorStop(0.6, '#b0e0ff');
    grad.addColorStop(1, '#e0f0ff');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
    const t = Date.now() * 0.0001;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 5; i++) {
        const cx = ((i * 200 + t * 50) % (W + 100)) - 50;
        const cy = 40 + Math.sin(i * 2) * 20;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 40, 15, 0, 0, Math.PI * 2);
        ctx.ellipse(cx + 25, cy - 5, 30, 12, 0, 0, Math.PI * 2);
        ctx.ellipse(cx - 20, cy + 3, 25, 10, 0, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawGround() {
    const level = levels[currentHole];
    
    // Main ground
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 2) {
        ctx.lineTo(x, getGroundY(x));
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    
    const grad = ctx.createLinearGradient(0, H * 0.5, 0, H);
    grad.addColorStop(0, '#4a8c3f');
    grad.addColorStop(1, '#2d6b27');
    ctx.fillStyle = grad;
    ctx.fill();
    
    // Sand patches
    for (let s of level.sand) {
        const sx = s.start * W;
        const ex = s.end * W;
        ctx.beginPath();
        ctx.moveTo(sx, getGroundY(sx));
        for (let x = sx; x <= ex; x += 2) {
            ctx.lineTo(x, getGroundY(x));
        }
        ctx.lineTo(ex, getGroundY(ex));
        // Close at bottom of sand area
        const sy = getGroundY((sx + ex) / 2);
        ctx.lineTo(ex, sy + 15);
        ctx.lineTo(sx, sy + 15);
        ctx.closePath();
        ctx.fillStyle = '#e8d68b';
        ctx.fill();
    }
    
    // Water hazards
    for (let w of level.water) {
        const wx = w.start * W;
        const ex = w.end * W;
        const waterTopY = Math.min(getGroundY(wx), getGroundY(ex));
        
        ctx.beginPath();
        ctx.moveTo(wx, getGroundY(wx) - 5);
        for (let x = wx; x <= ex; x += 2) {
            const wy = getGroundY(x);
            ctx.lineTo(x, wy - w.depth * 0.3);
        }
        for (let x = ex; x >= wx; x -= 2) {
            ctx.lineTo(x, getGroundY(x));
        }
        ctx.closePath();
        
        const wGrad = ctx.createLinearGradient(0, waterTopY - 20, 0, waterTopY + 30);
        wGrad.addColorStop(0, '#4fc3f7');
        wGrad.addColorStop(1, '#0288d1');
        ctx.fillStyle = wGrad;
        ctx.fill();
        
        // Water shimmer
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 1;
        const t = Date.now() * 0.003;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            const wy = getGroundY((wx + ex) / 2) - w.depth * 0.3 - 5 + i * 8;
            ctx.moveTo(wx + 10, wy);
            ctx.quadraticCurveTo((wx + ex) / 2, wy + Math.sin(t + i) * 3, ex - 10, wy);
            ctx.stroke();
        }
    }
    
    // Walls/bunkers
    for (let wall of level.walls) {
        const wx = wall.x * W;
        const wy = getGroundY(wx);
        ctx.fillStyle = '#8b7355';
        ctx.fillRect(wx - 5, wy - wall.h, 10, wall.h);
        ctx.fillStyle = '#6d5a3a';
        ctx.fillRect(wx - 5, wy - wall.h, 10, 5);
    }
    
    // Ground top line
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) {
        if (x === 0) ctx.moveTo(x, getGroundY(x));
        else ctx.lineTo(x, getGroundY(x));
    }
    ctx.strokeStyle = '#3d7a34';
    ctx.lineWidth = 3;
    ctx.stroke();
}

function drawFlag() {
    const level = levels[currentHole];
    const fx = level.flagX * W;
    const fy = getGroundY(fx);
    
    // Hole
    ctx.beginPath();
    ctx.ellipse(fx, fy, 12, 5, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a1a';
    ctx.fill();
    
    // Flag pole
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx, fy - 50);
    ctx.stroke();
    
    // Flag cloth
    flagWave += 0.08;
    const wave = Math.sin(flagWave) * 3;
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.moveTo(fx, fy - 50);
    ctx.lineTo(fx + 25 + wave, fy - 45);
    ctx.lineTo(fx + 20 + wave * 0.5, fy - 40);
    ctx.lineTo(fx, fy - 38);
    ctx.closePath();
    ctx.fill();
}

function drawBall() {
    if (flagIn) return;
    
    // Shadow
    const shadowY = getGroundY(ball.x);
    ctx.beginPath();
    ctx.ellipse(ball.x, shadowY - 2, ball.r * 0.8, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();
    
    // Ball
    const grad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, ball.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#ddd');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Dimpple pattern (simplified)
    ctx.fillStyle = 'rgba(200,200,200,0.3)';
    for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + ball.x * 0.1;
        ctx.beginPath();
        ctx.arc(ball.x + Math.cos(a) * 4, ball.y + Math.sin(a) * 4, 1.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawAim() {
    if (!dragging) return;
    
    const dx = ball.x - dragEnd.x;
    const dy = ball.y - dragEnd.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const power = Math.min(dist / 8, MAX_POWER);
    const angle = Math.atan2(dy, dx);
    
    // Aim line
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ball.x, ball.y);
    
    // Projected path (simple arc)
    const steps = 20;
    for (let i = 1; i <= steps; i++) {
        const t = i / steps * 0.5;
        const px = ball.x + Math.cos(angle) * power * t * 40;
        const py = ball.y + Math.sin(angle) * power * t * 40 + 10 * t * t;
        ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Power indicator
    const pRatio = power / MAX_POWER;
    ctx.fillStyle = `hsl(${(1 - pRatio) * 120}, 100%, 50%)`;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y - 25, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // Power bar
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(ball.x - 30, ball.y - 45, 60, 10);
    ctx.fillStyle = `hsl(${(1 - pRatio) * 120}, 100%, 50%)`;
    ctx.fillRect(ball.x - 28, ball.y - 43, 56 * pRatio, 6);
}

function drawParticles() {
    for (let p of particles) {
        ctx.globalAlpha = p.life / 90;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / 90), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    const level = levels[currentHole];
    
    // Top bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, 50);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`Hole ${currentHole + 1}/${levels.length}`, 15, 32);
    ctx.fillText(`Par: ${level.par}`, 150, 32);
    ctx.fillText(`Strokes: ${holeStrokes}`, 260, 32);
    ctx.fillText(`Total: ${totalStrokes}`, 380, 32);
    
    // Score indicator
    let scoreText = '';
    if (holeStrokes > 0) {
        const diff = holeStrokes - level.par;
        if (diff <= -2) scoreText = 'EAGLE!';
        else if (diff === -1) scoreText = 'BIRDIE!';
        else if (diff === 0) scoreText = 'PAR';
        else if (diff === 1) scoreText = 'BOGEY';
    }
    
    if (ballResting && canHit) {
        ctx.fillStyle = '#4fc3f7';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Drag from ball to aim & shoot', W / 2, H - 30);
    }
}

function drawMenu() {
    drawSky();
    drawClouds();
    
    // Title
    ctx.fillStyle = '#2d6b27';
    ctx.font = 'bold 60px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GOLF PHYSICS', W / 2, H * 0.3);
    
    ctx.fillStyle = '#fff';
    ctx.font = '24px Arial';
    ctx.fillText('A Slingshot Golf Game', W / 2, H * 0.4);
    
    ctx.font = '18px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    const instructions = [
        'Click & drag from the ball to aim',
        'Release to hit - further drag = more power',
        'Avoid water (+1 stroke) and sand (slows you)',
        'Reach the flag to complete each hole'
    ];
    instructions.forEach((txt, i) => {
        ctx.fillText(txt, W / 2, H * 0.5 + i * 30);
    });
    
    // Start button
    const btnW = 200, btnH = 50;
    const btnX = W / 2 - btnW / 2, btnY = H * 0.72;
    ctx.fillStyle = '#4a8c3f';
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial';
    ctx.fillText('START GAME', W / 2, btnY + 33);
    
    // Animated ball
    const t = Date.now() * 0.002;
    const bx = W / 2 + Math.sin(t) * 50;
    const by = H * 0.85 - Math.abs(Math.sin(t * 2)) * 30;
    ctx.beginPath();
    ctx.arc(bx, by, 12, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
}

function drawHoleComplete() {
    const level = levels[currentHole];
    const diff = holeStrokes - level.par;
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('HOLE COMPLETE!', W / 2, H * 0.3);
    
    let scoreName = '';
    if (diff <= -2) scoreName = 'EAGLE! 🦅';
    else if (diff === -1) scoreName = 'BIRDIE! 🐦';
    else if (diff === 0) scoreName = 'PAR';
    else if (diff === 1) scoreName = 'BOGEY';
    else scoreName = '+' + diff;
    
    ctx.fillStyle = '#fff';
    ctx.font = '32px Arial';
    ctx.fillText(`${scoreName} (${holeStrokes} strokes, Par ${level.par})`, W / 2, H * 0.45);
    
    ctx.font = '24px Arial';
    ctx.fillStyle = '#4fc3f7';
    const nextText = currentHole + 1 < levels.length ? 'Click to continue' : 'Click to see results';
    ctx.fillText(nextText, W / 2, H * 0.6);
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GAME COMPLETE!', W / 2, H * 0.2);
    
    // Scorecard
    let totalPar = 0;
    for (let i = 0; i < levels.length; i++) {
        totalPar += levels[i].par;
    }
    
    ctx.font = '24px Arial';
    ctx.fillStyle = '#fff';
    const diff = totalStrokes - totalPar;
    let finalText = '';
    if (diff <= -3) finalText = 'Tiger Tier! 🐯';
    else if (diff <= -1) finalText = 'Outstanding! 🌟';
    else if (diff === 0) finalText = 'Great Game! 👏';
    else if (diff <= 3) finalText = 'Not Bad! 📊';
    else finalText = 'Keep Practicing! 💪';
    
    ctx.fillText(`Total Strokes: ${totalStrokes} (Par: ${totalPar})`, W / 2, H * 0.35);
    ctx.fillStyle = '#ffd700';
    ctx.font = '28px Arial';
    ctx.fillText(finalText, W / 2, H * 0.45);
    
    // Per hole scores
    ctx.font = '18px Arial';
    ctx.fillStyle = '#ccc';
    for (let i = 0; i < levels.length; i++) {
        const s = scores[i] || '-';
        ctx.fillText(`Hole ${i + 1}: ${s} strokes (Par ${levels[i].par})`, W / 2, H * 0.55 + i * 28);
    }
    
    ctx.fillStyle = '#4fc3f7';
    ctx.font = '22px Arial';
    ctx.fillText('Click to play again', W / 2, H * 0.85);
}

// Main loop
function render() {
    ctx.clearRect(0, 0, W, H);
    
    if (gameState === STATE.MENU) {
        drawMenu();
    } else if (gameState === STATE.PLAYING) {
        drawSky();
        drawClouds();
        drawGround();
        drawFlag();
        drawBall();
        drawAim();
        drawParticles();
        drawHUD();
    } else if (gameState === STATE.HOLE_COMPLETE) {
        drawSky();
        drawGround();
        drawFlag();
        drawParticles();
        drawHoleComplete();
    } else if (gameState === STATE.GAME_OVER) {
        drawGameOver();
    }
}

function gameLoop() {
    if (gameState === STATE.PLAYING) {
        updateBall();
    }
    updateParticles();
    render();
    requestAnimationFrame(gameLoop);
}

// Track scores per hole
const origStartHole = startHole;
startHole = function(idx) {
    if (gameState === STATE.HOLE_COMPLETE && idx > currentHole) {
        scores[currentHole] = holeStrokes;
    }
    origStartHole(idx);
};

// Override hole complete to save score
const origRender = render;
let lastGameState = STATE.MENU;
function trackScore() {
    if (lastGameState === STATE.PLAYING && gameState === STATE.HOLE_COMPLETE) {
        scores[currentHole] = holeStrokes;
    }
    lastGameState = gameState;
}

// Patch the game loop
const origGameLoop = gameLoop;
function patchedLoop() {
    trackScore();
    if (gameState === STATE.PLAYING) updateBall();
    updateParticles();
    render();
    requestAnimationFrame(patchedLoop);
}

patchedLoop();
</script>
</body>
</html>
