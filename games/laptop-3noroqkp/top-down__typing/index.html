<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeBlade - Top-Down Typing Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        #hud {
            margin-top: 10px; color: #fff; font-size: 16px; text-align: center;
            text-shadow: 0 0 4px rgba(0,255,255,0.5);
        }
        #hud span { margin: 0 15px; }
        #word-display {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 28px; text-align: center;
            text-shadow: 0 0 8px rgba(0,255,255,0.8);
        }
        #word-display .typed { color: #4ff; }
        #word-display .remaining { color: #fff; opacity: 0.6; }
        #start-screen, #gameover-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(10, 10, 30, 0.95); color: #fff; z-index: 10;
        }
        #start-screen h1 { font-size: 48px; margin-bottom: 20px; text-shadow: 0 0 20px rgba(0,255,255,0.8); color: #4ff; }
        #gameover-screen h1 { font-size: 42px; color: #f44; text-shadow: 0 0 20px rgba(255,50,50,0.8); margin-bottom: 15px; }
        .instructions { font-size: 16px; line-height: 1.8; text-align: center; color: #aab; max-width: 400px; }
        .instructions kbd { background: #333; padding: 2px 8px; border-radius: 4px; border: 1px solid #555; color: #4ff; }
        .btn {
            margin-top: 25px; padding: 12px 40px; font-size: 20px; font-family: monospace;
            background: transparent; color: #4ff; border: 2px solid #4ff; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; pointer-events: auto;
        }
        .btn:hover { background: rgba(68,255,255,0.15); box-shadow: 0 0 20px rgba(68,255,255,0.3); }
        #final-score { font-size: 24px; color: #4ff; margin-bottom: 10px; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui-overlay">
    <div id="hud" style="display:none;">
        <span>HP: <b id="hp-val">100</b></span>
        <span>SCORE: <b id="score-val">0</b></span>
        <span>WAVE: <b id="wave-val">1</b></span>
    </div>
    <div id="word-display" style="display:none;"></div>
</div>

<div id="start-screen">
    <h1>⚔️ TYPE BLADE ⚔️</h1>
    <div class="instructions">
        <p><kbd>W A S D</kbd> / <kbd>↑↓←→</kbd> — Move your character</p>
        <p><kbd>Type words</kbd> — Attack enemies with the correct word</p>
        <p style="margin-top:15px;">Enemies close to you deal damage!</p>
        <p>Match the word shown on screen to slash foes.</p>
        <p>Survive waves. Get stronger. Don't stop typing!</p>
    </div>
    <button class="btn" id="start-btn">START GAME</button>
</div>

<div id="gameover-screen" style="display:none;">
    <h1>💀 SLAIN 💀</h1>
    <div id="final-score"></div>
    <div class="instructions"><p>You made it to wave <b id="final-wave">1</b></p></div>
    <button class="btn" id="restart-btn">RESTART</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function sfxSlash() { playSound(800, 0.1, 'sawtooth', 0.15); }
function sfxHit() { playSound(200, 0.2, 'square', 0.2); }
function sfxDeath() { playSound(300, 0.3, 'triangle', 0.15); }
function sfxWave() { playSound(600, 0.4, 'sine', 0.1); }

// Words
const WORDS = [
    'SLASH','CUT','STRIKE','CLASH','BRAWL','FIGHT','SMITE','BRUTE','MACE','GAPES',
    'THUD','CRACK','SNAP','BLAST','FLARE','EMBER','SPARK','QUICK','NIMBLE','SWIFT',
    'SHARP','STEEL','IRON','FORGE','HAMMER','ANVIL','RIDGE','PEAK','SUMMIT','VAULT',
    'GRAND','MAJESTIC','TITAN','COLOSSAL','MONARCH','SOVEREIGN','EMPIRE','LEGION','PHALANX','BATTALION',
    'CRUSHER','DEVOURER','OBLITERATE','ANNIHILATE','DEMOLISH','DETONATE','SHATTER','FRAGMENT','SCATTER','WRECK'
];

// Game state
let game = { running: false, score: 0, wave: 1, hp: 100, maxHp: 100 };
let player = { x: 0, y: 0, angle: 0, speed: 4, radius: 18 };
let enemies = [];
let particles = [];
let projectiles = [];
let typedWord = '';
let targetEnemy = null;
let keys = {};
let lastTime = 0;
let waveTimer = 0;
let spawnInterval = 3000;

function startGame() {
    initAudio();
    game.running = true;
    game.score = 0;
    game.wave = 1;
    game.hp = 100;
    player.x = W / 2;
    player.y = H / 2;
    player.angle = -Math.PI / 2;
    enemies = [];
    particles = [];
    projectiles = [];
    typedWord = '';
    targetEnemy = null;
    waveTimer = 0;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('word-display').style.display = 'block';
    updateHUD();
    spawnEnemy();
    requestAnimationFrame(loop);
}

function endGame() {
    game.running = false;
    document.getElementById('gameover-screen').style.display = 'flex';
    document.getElementById('final-score').textContent = `Score: ${game.score}`;
    document.getElementById('final-wave').textContent = game.wave;
    document.getElementById('hud').style.display = 'none';
    document.getElementById('word-display').style.display = 'none';
}

function spawnEnemy() {
    const word = WORDS[Math.floor(Math.random() * WORDS.length)];
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0) { x = Math.random() * W; y = -30; }
    else if (side === 1) { x = W + 30; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = H + 30; }
    else { x = -30; y = Math.random() * H; }

    const speedMult = 1 + (game.wave - 1) * 0.15;
    const enemy = {
        x, y, word,
        speed: (1.2 + Math.random() * 0.8) * speedMult,
        radius: 22,
        hp: 1,
        angle: 0,
        wobble: Math.random() * Math.PI * 2,
        color: `hsl(${Math.floor(Math.random()*360)},70%,55%)`
    };
    enemies.push(enemy);
}

function getNearestEnemy() {
    let best = null, bestDist = Infinity;
    for (let e of enemies) {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < bestDist) { bestDist = d; best = e; }
    }
    return best;
}

function updateHUD() {
    document.getElementById('hp-val').textContent = Math.max(0, Math.round(game.hp));
    document.getElementById('score-val').textContent = game.score;
    document.getElementById('wave-val').textContent = game.wave;
}

function showWordDisplay() {
    const el = document.getElementById('word-display');
    if (!targetEnemy) { el.innerHTML = '<span style="opacity:0.4">[ no target ]</span>'; return; }
    const w = targetEnemy.word;
    const t = typedWord;
    let html = '';
    for (let i = 0; i < w.length; i++) {
        if (i < t.length) html += `<span class="typed">${w[i]}</span>`;
        else html += `<span class="remaining">${w[i]}</span>`;
    }
    el.innerHTML = html;
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color });
    }
}

function loop(timestamp) {
    if (!game.running) return;
    const dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;

    // Input movement
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (dx || dy) {
        const len = Math.hypot(dx, dy);
        player.x += (dx/len) * player.speed * dt;
        player.y += (dy/len) * player.speed * dt;
        player.angle = Math.atan2(dy, dx);
    }
    player.x = Math.max(0, Math.min(W, player.x));
    player.y = Math.max(0, Math.min(H, player.y));

    // Target selection (nearest enemy)
    targetEnemy = getNearestEnemy();

    // Wave logic
    waveTimer += dt;
    if (enemies.length === 0) {
        if (waveTimer > 60) {
            game.wave++;
            waveTimer = 0;
            spawnInterval = Math.max(800, 3000 - game.wave * 250);
            sfxWave();
            const count = Math.min(2 + game.wave, 6);
            for (let i = 0; i < count; i++) setTimeout(() => { if(game.running) spawnEnemy(); }, i * 300);
        }
    } else if (waveTimer > spawnInterval / (16.67)) {
        // Auto-spawn occasionally
        if (Math.random() < 0.02 * dt && enemies.length < 5 + game.wave) {
            spawnEnemy();
        }
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.wobble += 0.1 * dt;
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.angle = a;
        e.x += Math.cos(a) * e.speed * dt;
        e.y += Math.sin(a) * e.speed * dt;

        // Collision with player
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < e.radius + player.radius) {
            game.hp -= 15;
            sfxHit();
            addParticles(player.x, player.y, '#f44', 8);
            enemies.splice(i, 1);
            typedWord = '';
            if (game.hp <= 0) { endGame(); return; }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= 0.03 * dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.life -= 0.05 * dt;
        if (p.life <= 0) projectiles.splice(i, 1);
    }

    updateHUD();
    showWordDisplay();
    draw();
    requestAnimationFrame(loop);
}

function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = 'rgba(68,255,255,0.05)';
    ctx.lineWidth = 1;
    const gs = 50;
    for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Projectiles
    for (const p of projectiles) {
        ctx.strokeStyle = `rgba(68,255,255,${p.life})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.x - p.vx*5, p.y - p.vy*5);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }

    // Enemies
    for (const e of enemies) {
        const wobble = Math.sin(e.wobble) * 2;
        ctx.save();
        ctx.translate(e.x, e.y + wobble);

        // Body
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(0, 0, e.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Eyes
        const ea = e.angle;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(Math.cos(ea)*8 - 6, Math.sin(ea)*8 - 4, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(Math.cos(ea)*8 + 6, Math.sin(ea)*8 - 4, 5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(Math.cos(ea)*9 - 6, Math.sin(ea)*9 - 4, 2.5, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(Math.cos(ea)*9 + 6, Math.sin(ea)*9 - 4, 2.5, 0, Math.PI*2);
        ctx.fill();

        // Word label
        ctx.rotate(-ea);
        ctx.fillStyle = targetEnemy === e ? '#fff' : 'rgba(255,255,255,0.7)';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(e.word, 0, -e.radius - 8);
        ctx.restore();

        // Target ring
        if (targetEnemy === e) {
            ctx.strokeStyle = `rgba(68,255,255,${0.4 + Math.sin(Date.now()*0.01)*0.3})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius + 6, 0, Math.PI*2);
            ctx.stroke();
        }
    }

    // Player
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    // Blade
    ctx.strokeStyle = '#4ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(10, 0);
    ctx.lineTo(28, -8);
    ctx.stroke();

    // Body
    ctx.fillStyle = '#4ff';
    ctx.beginPath();
    ctx.arc(0, 0, player.radius * 0.6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Direction indicator
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(12, 0, 4, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    // HP bar
    const hpbw = 200;
    const hpbx = W/2 - hpbw/2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(hpbx, H - 25, hpbw, 16);
    const hpRatio = Math.max(0, game.hp / game.maxHp);
    ctx.fillStyle = hpRatio > 0.3 ? '#4f8' : '#f44';
    ctx.fillRect(hpbx, H - 25, hpbw * hpRatio, 16);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.strokeRect(hpbx, H - 25, hpbw, 16);
}

// Typing input
function handleType(char) {
    if (!game.running) return;
    if (targetEnemy) {
        typedWord += char.toUpperCase();
        const w = targetEnemy.word;
        const t = typedWord;

        // Check for miss
        if (t > w || !w.startsWith(t)) {
            // Wrong character - penalty
            game.hp -= 5;
            sfxHit();
            addParticles(player.x, player.y, '#f84', 4);
            typedWord = '';
            if (game.hp <= 0) endGame();
            return;
        }

        // Check complete
        if (t === w) {
            // Kill enemy!
            sfxSlash();
            addParticles(targetEnemy.x, targetEnemy.y, targetEnemy.color, 15);
            projectiles.push({ x: player.x, y: player.y, vx: (targetEnemy.x - player.x)*0.2, vy: (targetEnemy.y - player.y)*0.2, life: 1 });

            const idx = enemies.indexOf(targetEnemy);
            if (idx >= 0) enemies.splice(idx, 1);

            game.score += w.length * 10 + game.wave * 5;
            typedWord = '';
            targetEnemy = getNearestEnemy();

            // Heal slightly
            game.hp = Math.min(game.maxHp, game.hp + 3);
        }
    } else {
        // No target - small penalty
        typedWord = '';
    }
}

// Key handling
window.addEventListener('keydown', (e) => {
    if (!game.running) return;
    const key = e.key.toLowerCase();
    keys[key] = true;

    if (key === 'backspace' || key === 'delete') {
        typedWord = typedWord.slice(0, -1);
        showWordDisplay();
    } else if (key.length === 1 && /[a-z]/.test(key)) {
        e.preventDefault();
        handleType(key);
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
});

// Buttons
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Initial draw
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
