<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'kill') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'score') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let lives = 3;
let highScore = 0;
try {
    highScore = parseInt(localStorage.getItem('zombiePongHigh') || '0');
} catch(e) {}

let shakeTime = 0;
let shakeIntensity = 0;

// Paddle
const PADDLE_W = 120;
const PADDLE_H = 18;
let playerX, aiX, aiTargetX;
let mouseX = 0;

// Zombies (balls)
let zombies = [];
let particles = [];
let bloodDrops = [];
let floatTexts = [];
let spawnTimer = 0;
let difficulty = 1;
let gameTime = 0;

function resetGame() {
    score = 0;
    lives = 3;
    difficulty = 1;
    gameTime = 0;
    zombies = [];
    particles = [];
    bloodDrops = [];
    floatTexts = [];
    spawnTimer = 0;
    playerX = W / 2 - PADDLE_W / 2;
    aiX = W / 2 - PADDLE_W / 2;
    aiTargetX = W / 2 - PADDLE_W / 2;
    shakeTime = 0;
}

function spawnZombie() {
    const size = 14 + Math.random() * 8;
    const x = size + Math.random() * (W - size * 2);
    zombies.push({
        x: x,
        y: size,
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 2 + difficulty * 0.3,
        size: size,
        wobble: Math.random() * Math.PI * 2,
        speed: 1 + Math.random() * 0.5 + difficulty * 0.1
    });
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 4;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            life: 1,
            color: color,
            size: 3 + Math.random() * 4
        });
    }
}

function spawnBlood(x, y) {
    for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;
        bloodDrops.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            life: 1,
            size: 2 + Math.random() * 3
        });
    }
}

function addFloatText(x, y, text, color) {
    floatTexts.push({ x, y, text, color, life: 1 });
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (gameState === 'start' && (e.key === ' ' || e.key === 'Enter')) {
        initAudio();
        resetGame();
        gameState = 'playing';
    } else if (gameState === 'gameover' && (e.key === ' ' || e.key === 'Enter')) {
        resetGame();
        gameState = 'playing';
    }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('mousemove', e => { mouseX = e.clientX; });
window.addEventListener('click', () => {
    if (gameState === 'start' || gameState === 'gameover') {
        initAudio();
        resetGame();
        gameState = 'playing';
    }
});

// AI
function updateAI() {
    let closestZombie = null;
    let closestDist = Infinity;
    for (let z of zombies) {
        if (z.y < H / 2) {
            const d = Math.abs(z.x - aiX);
            if (d < closestDist) { closestDist = d; closestZombie = z; }
        }
    }
    let targetX = W / 2 - PADDLE_W / 2;
    if (closestZombie) targetX = closestZombie.x - PADDLE_W / 2;
    
    const aiSpeed = 3 + difficulty * 0.5;
    const diff = targetX - aiX;
    if (Math.abs(diff) > 5) {
        aiX += Math.sign(diff) * Math.min(aiSpeed, Math.abs(diff));
    }
    aiX = Math.max(0, Math.min(W - PADDLE_W, aiX));
}

function update() {
    if (gameState !== 'playing') return;
    
    gameTime++;
    difficulty = 1 + Math.floor(gameTime / 300) * 0.5;
    
    // Player paddle
    let playerSpeed = 8;
    if (keys['ArrowLeft'] || keys['a']) playerX -= playerSpeed;
    if (keys['ArrowRight'] || keys['d']) playerX += playerSpeed;
    // Mouse control
    const mouseTargetX = mouseX - PADDLE_W / 2;
    playerX += (mouseTargetX - playerX) * 0.15;
    playerX = Math.max(0, Math.min(W - PADDLE_W, playerX));
    
    // Spawn zombies
    spawnTimer++;
    const spawnRate = Math.max(60 - difficulty * 5, 20);
    if (spawnTimer >= spawnRate && zombies.length < 8 + Math.floor(difficulty)) {
        spawnZombie();
        spawnTimer = 0;
    }
    
    // Update AI
    updateAI();
    
    // Update zombies
    for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        z.wobble += 0.15;
        z.x += z.vx * z.speed;
        z.y += z.vy * z.speed;
        
        // Bounce off walls
        if (z.x - z.size < 0) { z.x = z.size; z.vx = Math.abs(z.vx); }
        if (z.x + z.size > W) { z.x = W - z.size; z.vx = -Math.abs(z.vx); }
        
        // Hit AI paddle (top)
        const aiPaddleY = 20;
        if (z.y - z.size < aiPaddleY + PADDLE_H && z.y > aiPaddleY &&
            z.x > aiX - z.size && z.x < aiX + PADDLE_W + z.size) {
            z.vy = -Math.abs(z.vy);
            z.vx = (z.x - (aiX + PADDLE_W / 2)) * 0.1;
            playSound('hit');
        }
        
        // Hit player paddle (bottom)
        const playerPaddleY = H - 40;
        if (z.y + z.size > playerPaddleY && z.y < playerPaddleY + PADDLE_H + z.size &&
            z.x > playerX - z.size && z.x < playerX + PADDLE_W + z.size) {
            // Kill zombie!
            spawnParticles(z.x, z.y, '#4a2', 12);
            spawnBlood(z.x, z.y);
            addFloatText(z.x, z.y - 20, '+1', '#8f8');
            playSound('kill');
            score++;
            zombies.splice(i, 1);
            continue;
        }
        
        // Zombie passes bottom (player missed)
        if (z.y - z.size > H + 20) {
            zombies.splice(i, 1);
            lives--;
            shakeTime = 15;
            shakeIntensity = 8;
            playSound('lose');
            addFloatText(z.x, H - 60, 'BITE! -1', '#f44');
            if (lives <= 0) {
                gameState = 'gameover';
                try {
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('zombiePongHigh', String(highScore));
                    }
                } catch(e) {}
            }
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Update blood
    for (let i = bloodDrops.length - 1; i >= 0; i--) {
        const b = bloodDrops[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.15;
        b.life -= 0.02;
        if (b.life <= 0) bloodDrops.splice(i, 1);
    }
    
    // Float texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const f = floatTexts[i];
        f.y -= 1.5;
        f.life -= 0.02;
        if (f.life <= 0) floatTexts.splice(i, 1);
    }
    
    // Shake
    if (shakeTime > 0) shakeTime--;
}

function drawZombieFace(x, y, size, wobble) {
    const s = size;
    // Head
    ctx.fillStyle = '#5a8c3c';
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes
    const eyeOffset = s * 0.35;
    const blink = Math.sin(wobble * 2) > 0.9 ? 0.3 : 1;
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(x - eyeOffset, y - s * 0.2, s * 0.25 * blink, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeOffset, y - s * 0.2, s * 0.25 * blink, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupils
    ctx.fillStyle = '#800';
    ctx.beginPath();
    ctx.arc(x - eyeOffset, y - s * 0.15, s * 0.1 * blink, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeOffset, y - s * 0.15, s * 0.1 * blink, 0, Math.PI * 2);
    ctx.fill();
    
    // Mouth (jagged)
    ctx.strokeStyle = '#2a4a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const my = y + s * 0.35;
    ctx.moveTo(x - s * 0.3, my);
    for (let j = 0; j < 4; j++) {
        const mx = x - s * 0.3 + (j + 1) * (s * 0.6 / 4);
        ctx.lineTo(mx, my + (j % 2 === 0 ? s * 0.15 : -s * 0.05));
    }
    ctx.stroke();
    
    // Arms (wobbly)
    const armWob = Math.sin(wobble * 3) * s * 0.2;
    ctx.strokeStyle = '#4a7a2c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.lineTo(x - s - s * 0.5, y + armWob);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + s, y);
    ctx.lineTo(x + s + s * 0.5, y - armWob);
    ctx.stroke();
}

function drawPaddle(x, y, w, h) {
    // Wooden paddle (shotgun barrel style)
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, '#8B7355');
    grad.addColorStop(0.5, '#6B5235');
    grad.addColorStop(1, '#4a3520');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 5);
    ctx.fill();
    ctx.strokeStyle = '#3a2510';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Wood grain
    ctx.strokeStyle = 'rgba(60,40,20,0.4)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
        const ly = y + h * (0.25 + i * 0.25);
        ctx.beginPath();
        ctx.moveTo(x + 5, ly);
        ctx.lineTo(x + w - 5, ly);
        ctx.stroke();
    }
}

function draw() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }
    
    // Background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#1a1a2e');
    bgGrad.addColorStop(0.5, '#16213e');
    bgGrad.addColorStop(1, '#0f0f1a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-10, -10, W + 20, H + 20);
    
    // Fog effect
    const fogTime = Date.now() * 0.001;
    for (let i = 0; i < 3; i++) {
        const fx = (Math.sin(fogTime + i * 2) * 0.5 + 0.5) * W;
        const fy = H * 0.3 + Math.sin(fogTime * 0.7 + i) * 100;
        const fogGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 150);
        fogGrad.addColorStop(0, 'rgba(100,100,120,0.03)');
        fogGrad.addColorStop(1, 'rgba(100,100,120,0)');
        ctx.fillStyle = fogGrad;
        ctx.fillRect(0, 0, W, H);
    }
    
    // Center line
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 15]);
    ctx.beginPath();
    ctx.moveTo(0, H / 2);
    ctx.lineTo(W, H / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    
    if (gameState === 'playing') {
        // Blood drops
        for (let b of bloodDrops) {
            ctx.fillStyle = `rgba(180,30,30,${b.life})`;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Paddles
        drawPaddle(aiX, 15, PADDLE_W, PADDLE_H);
        drawPaddle(playerX, H - 40, PADDLE_W, PADDLE_H);
        
        // Zombies
        for (let z of zombies) {
            drawZombieFace(z.x, z.y, z.size, z.wobble);
        }
        
        // Particles
        for (let p of particles) {
            ctx.fillStyle = `rgba(74,160,34,${p.life})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Float texts
        for (let f of floatTexts) {
            ctx.fillStyle = f.color;
            ctx.globalAlpha = f.life;
            ctx.font = 'bold 18px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(f.text, f.x, f.y);
            ctx.globalAlpha = 1;
        }
        
        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 60);
        ctx.textAlign = 'right';
        ctx.fillText(`LIVES:`, W - 20, 60);
        
        // Lives as hearts/skulls
        for (let i = 0; i < lives; i++) {
            const hx = W - 70 - i * 35;
            ctx.fillStyle = '#f44';
            ctx.font = '20px monospace';
            ctx.fillText('💀', hx, 60);
        }
        
        // High score
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`HI: ${highScore}`, W / 2, 30);
        
    } else if (gameState === 'start') {
        // Title
        ctx.fillStyle = '#5a8c3c';
        ctx.font = 'bold 64px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('ZOMBIE', W / 2, H * 0.3);
        ctx.fillStyle = '#f44';
        ctx.fillText('PONG', W / 2, H * 0.3 + 70);
        
        // Decorative zombie
        drawZombieFace(W / 2, H * 0.5, 40, Date.now() * 0.003);
        
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Move: Mouse / A / D / ← →', W / 2, H * 0.65);
        ctx.fillText('Block zombies with your paddle!', W / 2, H * 0.65 + 30);
        ctx.fillText('Don\'t let them bite you!', W / 2, H * 0.65 + 60);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px monospace';
        const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
        ctx.globalAlpha = pulse;
        ctx.fillText('CLICK OR PRESS SPACE TO START', W / 2, H * 0.82);
        ctx.globalAlpha = 1;
        
    } else if (gameState === 'gameover') {
        // Game over overlay
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#f44';
        ctx.font = 'bold 56px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('YOU GOT BITTEN', W / 2, H * 0.3);
        
        ctx.fillStyle = '#fff';
        ctx.font = '28px monospace';
        ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.45);
        
        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#ffcc00';
            ctx.fillText('NEW HIGH SCORE!', W / 2, H * 0.52);
        }
        
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText(`High Score: ${highScore}`, W / 2, H * 0.6);
        
        const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = pulse;
        ctx.font = 'bold 20px monospace';
        ctx.fillText('CLICK OR PRESS SPACE TO RESTART', W / 2, H * 0.75);
        ctx.globalAlpha = 1;
    }
    
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resetGame();
gameState = 'start';
loop();
</script>
</body>
</html>
