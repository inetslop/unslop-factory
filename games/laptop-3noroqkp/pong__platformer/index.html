<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = { player: 0, ai: 0 };
const WIN_SCORE = 5;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    }
    if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Platforms
let platforms = [];
function generatePlatforms() {
    platforms = [
        { x: 0, y: H - 40, w: W, h: 40 }, // ground
        { x: W * 0.15, y: H * 0.65, w: W * 0.2, h: 18 },
        { x: W * 0.6, y: H * 0.65, w: W * 0.2, h: 18 },
        { x: W * 0.35, y: H * 0.4, w: W * 0.2, h: 18 },
        { x: W * 0.05, y: H * 0.45, w: W * 0.12, h: 18 },
        { x: W * 0.8, y: H * 0.45, w: W * 0.12, h: 18 },
        { x: W * 0.42, y: H * 0.75, w: W * 0.16, h: 18 },
    ];
}

// Player
let player = {};
function resetPlayer() {
    player = {
        x: W * 0.1, y: H - 80, w: 32, h: 40,
        vx: 0, vy: 0, onGround: false, facing: 1
    };
}

// AI
let ai = {};
function resetAI() {
    ai = {
        x: W * 0.85, y: H - 80, w: 32, h: 40,
        vx: 0, vy: 0, onGround: false, targetY: H - 80
    };
}

// Ball
let ball = {};
function resetBall(toPlayer) {
    const speed = Math.max(5, W * 0.006);
    if (toPlayer === undefined) {
        ball = { x: W / 2, y: H * 0.3, vx: speed * (Math.random() > 0.5 ? 1 : -1), vy: 0, r: 12 };
    } else {
        const dir = toPlayer ? -1 : 1;
        ball = { x: W / 2, y: H * 0.3, vx: speed * dir, vy: -2, r: 12 };
    }
}

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < (count || 8); i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, life: 30, color: color || '#fff', r: Math.random() * 4 + 2 });
    }
}

// Trail
let trail = [];

function startGame() {
    generatePlatforms();
    resetPlayer();
    resetAI();
    score = { player: 0, ai: 0 };
    gameState = 'playing';
    resetBall(Math.random() > 0.5);
    particles = [];
    trail = [];
}

const GRAVITY = 0.6;
const PLAYER_SPEED = 5;
const JUMP_FORCE = -12;
const AI_SPEED = 3.5;

function update() {
    if (gameState !== 'playing') return;

    // Player movement
    player.vx = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) { player.vx = -PLAYER_SPEED; player.facing = -1; }
    if (keys['ArrowRight'] || keys['KeyD']) { player.vx = PLAYER_SPEED; player.facing = 1; }
    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        playSound(300, 0.1, 'sine', 0.1);
    }

    // Player physics
    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    // Platform collision for player
    player.onGround = false;
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            if (player.vy >= 0 && player.y + player.h >= p.y && player.y + player.h - player.vy <= p.y + 5) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
            }
        }
    }
    // Side walls for player
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > W) player.x = W - player.w;

    // AI movement
    ai.vy += GRAVITY;
    // AI tracks ball
    let targetX = W * 0.85;
    let targetY = H - 80;
    if (ball.x > W * 0.5) {
        targetX = Math.min(ball.x + ai.w / 2, W - ai.w);
        targetY = ball.y - ai.h / 2;
    }

    // AI move toward target
    const dx = targetX - ai.x;
    if (Math.abs(dx) > 5) {
        ai.vx = Math.sign(dx) * AI_SPEED;
    } else {
        ai.vx = 0;
    }

    // AI jump if ball is above and nearby
    if (ball.y < ai.y && Math.abs(ball.x - ai.x) < 100 && ai.onGround && ball.vy > 0) {
        ai.vy = JUMP_FORCE * 0.9;
        ai.onGround = false;
    }

    ai.x += ai.vx;
    ai.y += ai.vy;

    // AI platform collision
    ai.onGround = false;
    for (let p of platforms) {
        if (ai.x + ai.w > p.x && ai.x < p.x + p.w) {
            if (ai.vy >= 0 && ai.y + ai.h >= p.y && ai.y + ai.h - ai.vy <= p.y + 5) {
                ai.y = p.y - ai.h;
                ai.vy = 0;
                ai.onGround = true;
            }
        }
    }
    if (ai.x < W * 0.6) ai.x = W * 0.6;
    if (ai.x + ai.w > W) ai.x = W - ai.w;

    // Ball physics
    ball.vy += GRAVITY * 0.5;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Ball trail
    trail.push({ x: ball.x, y: ball.y, life: 15 });
    if (trail.length > 20) trail.shift();
    for (let t of trail) t.life--;

    // Ball wall bounce
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

    // Ball platform bounce
    for (let p of platforms) {
        if (ball.x + ball.r > p.x && ball.x - ball.r < p.x + p.w &&
            ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h) {
            // Determine side
            const overlapL = ball.x + ball.r - p.x;
            const overlapR = p.x + p.w - (ball.x - ball.r);
            const overlapT = ball.y + ball.r - p.y;
            const overlapB = p.y + p.h - (ball.y - ball.r);
            const minOverlap = Math.min(overlapL, overlapR, overlapT, overlapB);
            if (minOverlap === overlapT) { ball.y = p.y - ball.r; ball.vy = -Math.abs(ball.vy); }
            else if (minOverlap === overlapB) { ball.y = p.y + p.h + ball.r; ball.vy = Math.abs(ball.vy); }
            else if (minOverlap === overlapL) { ball.x = p.x - ball.r; ball.vx = -Math.abs(ball.vx); }
            else { ball.x = p.x + p.w + ball.r; ball.vx = Math.abs(ball.vx); }
            playSound(200, 0.05, 'triangle', 0.08);
        }
    }

    // Ball hit player (smash)
    if (ball.x + ball.r > player.x && ball.x - ball.r < player.x + player.w &&
        ball.y + ball.r > player.y && ball.y - ball.r < player.y + player.h) {
        const power = 10 + Math.random() * 4;
        ball.vx = power;
        ball.vy = -6 - Math.random() * 4;
        spawnParticles(ball.x, ball.y, '#00ffcc', 12);
        playSound(500, 0.15, 'square', 0.2);
    }

    // Ball hit AI (smash)
    if (ball.x + ball.r > ai.x && ball.x - ball.r < ai.x + ai.w &&
        ball.y + ball.r > ai.y && ball.y - ball.r < ai.y + ai.h) {
        const power = 8 + Math.random() * 3;
        ball.vx = -power;
        ball.vy = -5 - Math.random() * 4;
        spawnParticles(ball.x, ball.y, '#ff6644', 12);
        playSound(400, 0.15, 'square', 0.2);
    }

    // Scoring
    if (ball.y > H + 50) {
        // Ball fell off - point to whoever hit it last toward the other side
        if (ball.vx > 0) score.ai++;
        else score.player++;
        spawnParticles(ball.x, H, '#ffff00', 20);
        playSound(150, 0.3, 'sawtooth', 0.2);
        if (score.player >= WIN_SCORE || score.ai >= WIN_SCORE) {
            gameState = 'gameover';
        } else {
            resetBall(score.player > score.ai ? true : false);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Grid background
    ctx.strokeStyle = 'rgba(30, 40, 80, 0.3)';
    ctx.lineWidth = 1;
    const gridSize = 50;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Center line
    ctx.setLineDash([10, 10]);
    ctx.strokeStyle = 'rgba(100, 100, 200, 0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    if (gameState === 'start') {
        // Title
        ctx.fillStyle = '#00ffcc';
        ctx.font = `bold ${Math.min(72, W * 0.08)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('PLATFORM PONG', W / 2, H * 0.3);

        ctx.fillStyle = '#aaccff';
        ctx.font = `${Math.min(18, W * 0.025)}px monospace`;
        ctx.fillText('A hybrid of platforming and pong!', W / 2, H * 0.4);
        ctx.fillText('Hit the ball back toward the AI to score.', W / 2, H * 0.47);
        ctx.fillText('', W / 2, H * 0.52);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(16, W * 0.02)}px monospace`;
        ctx.fillText('A/D or ←/→ : Move', W / 2, H * 0.58);
        ctx.fillText('W/↑/Space : Jump', W / 2, H * 0.63);
        ctx.fillText('Touch the ball to smash it!', W / 2, H * 0.68);
        ctx.fillText('', W / 2, H * 0.73);
        ctx.fillStyle = '#00ffcc';
        ctx.font = `bold ${Math.min(24, W * 0.03)}px monospace`;
        ctx.fillText('Press SPACE to Start', W / 2, H * 0.82);

        // Animated ball preview
        const t = Date.now() * 0.003;
        ctx.beginPath();
        ctx.arc(W / 2 + Math.sin(t) * 50, H * 0.15, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#ffcc00';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        return;
    }

    if (gameState === 'gameover') {
        const winner = score.player >= WIN_SCORE ? 'YOU WIN!' : 'AI WINS!';
        const color = score.player >= WIN_SCORE ? '#00ffcc' : '#ff4444';
        ctx.fillStyle = color;
        ctx.font = `bold ${Math.min(64, W * 0.07)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(winner, W / 2, H * 0.35);

        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(28, W * 0.035)}px monospace`;
        ctx.fillText(`${score.player} - ${score.ai}`, W / 2, H * 0.45);

        ctx.fillStyle = '#aaccff';
        ctx.font = `${Math.min(20, W * 0.025)}px monospace`;
        ctx.fillText('Press SPACE to play again', W / 2, H * 0.6);
        return;
    }

    // Platforms
    for (let p of platforms) {
        ctx.fillStyle = '#1a2a4a';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#3388ff';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        // Glow top
        const grad = ctx.createLinearGradient(0, p.y, 0, p.y + 6);
        grad.addColorStop(0, 'rgba(51, 136, 255, 0.4)');
        grad.addColorStop(1, 'rgba(51, 136, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(p.x, p.y, p.w, 6);
    }

    // Ball trail
    for (let i = 0; i < trail.length; i++) {
        const t = trail[i];
        if (t.life > 0) {
            const alpha = t.life / 20 * 0.5;
            ctx.beginPath();
            ctx.arc(t.x, t.y, ball.r * (t.life / 15), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 204, 0, ${alpha})`;
            ctx.fill();
        }
    }

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    const ballGrad = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.r);
    ballGrad.addColorStop(0, '#fff');
    ballGrad.addColorStop(0.5, '#ffcc00');
    ballGrad.addColorStop(1, '#ff8800');
    ctx.fillStyle = ballGrad;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Player
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 2;
    ctx.strokeRect(player.x - 2, player.y - 2, player.w + 4, player.h + 4);
    // Eyes
    const eyeX = player.facing > 0 ? player.x + player.w - 12 : player.x + 6;
    ctx.fillStyle = '#fff';
    ctx.fillRect(eyeX, player.y + 8, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(eyeX + (player.facing > 0 ? 3 : 1), player.y + 10, 3, 3);

    // AI
    ctx.fillStyle = '#ff6644';
    ctx.fillRect(ai.x, ai.y, ai.w, ai.h);
    ctx.strokeStyle = '#ff6644';
    ctx.lineWidth = 2;
    ctx.strokeRect(ai.x - 2, ai.y - 2, ai.w + 4, ai.h + 4);
    const aiEyeX = ai.x + 6;
    ctx.fillStyle = '#fff';
    ctx.fillRect(aiEyeX, ai.y + 8, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(aiEyeX + 1, ai.y + 10, 3, 3);

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 30;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (p.life / 30), 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Score
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.min(48, W * 0.05)}px monospace`;
    ctx.fillStyle = '#00ffcc';
    ctx.fillText(score.player, W * 0.25, H * 0.1);
    ctx.fillStyle = '#ff6644';
    ctx.fillText(score.ai, W * 0.75, H * 0.1);

    // Labels
    ctx.font = `${Math.min(14, W * 0.015)}px monospace`;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('YOU', W * 0.25, H * 0.1 + 20);
    ctx.fillText('AI', W * 0.75, H * 0.1 + 20);

    // Win indicator
    ctx.font = `${Math.min(12, W * 0.013)}px monospace`;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText(`First to ${WIN_SCORE}`, W / 2, H * 0.1 + 20);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

generatePlatforms();
resetPlayer();
resetAI();
loop();
</script>
</body>
</html>
