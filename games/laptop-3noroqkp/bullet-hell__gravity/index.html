<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Danmaku</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, type, duration, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function playHit() { playSound(150, 'sawtooth', 0.2, 0.3); }
function playShoot() { playSound(800, 'square', 0.05, 0.08); }
function playEnemyDie() { playSound(400, 'triangle', 0.15, 0.2); }
function playGameOver() { playSound(80, 'sawtooth', 0.8, 0.4); }

// Game state
let gameState = 'menu'; // menu, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('gd_highscore') || '0'); } catch(e) {}
let frameCount = 0;
let difficulty = 1;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (gameState === 'menu' && (e.code === 'Space' || e.code === 'Enter')) startGame();
    else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Particles
let particles = [];
function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * (speed || 3);
        particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 30 + Math.random()*20, color, size: 2+Math.random()*2 });
    }
}

// Player
let player = null;
function createPlayer() {
    return {
        x: canvas.width / 2,
        y: canvas.height * 0.7,
        vx: 0,
        vy: 0,
        radius: 5, // small hitbox
        health: 3,
        maxHealth: 3,
        invincible: 0,
        thrust: false
    };
}

// Bullets (enemy)
let bullets = [];
function spawnBullet(x, y, vx, vy, size, color) {
    bullets.push({ x, y, vx, vy, size: size || 4, color: color || '#ff4444', life: 600 });
}

// Enemies
let enemies = [];
function spawnEnemy() {
    const type = Math.random();
    let e = {
        x: Math.random() < 0.5 ? -30 : canvas.width + 30,
        y: Math.random() * canvas.height * 0.4 + 20,
        vx: (Math.random() < 0.5 ? 1 : -1) * (1 + Math.random()),
        vy: 0.5 + Math.random(),
        health: 3 + Math.floor(difficulty / 2),
        radius: 18,
        shootTimer: 0,
        pattern: Math.floor(Math.random() * 4),
        patternAngle: 0,
        age: 0
    };
    if (type < 0.3) { e.y = -30; e.vy = 1 + Math.random(); }
    enemies.push(e);
}

// Enemy bullets from patterns
function enemyShoot(e) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    const baseAngle = Math.atan2(dy, dx);
    
    switch(e.pattern) {
        case 0: // Spread
            for (let i = -3; i <= 3; i++) {
                const a = baseAngle + i * 0.2;
                spawnBullet(e.x, e.y, Math.cos(a)*4, Math.sin(a)*4, 5, '#ff6644');
            }
            break;
        case 1: // Spiral burst
            for (let i = 0; i < 8; i++) {
                const a = e.patternAngle + i * (Math.PI*2/8);
                spawnBullet(e.x, e.y, Math.cos(a)*3.5, Math.sin(a)*3.5, 4, '#ffaa22');
            }
            e.patternAngle += 0.3;
            break;
        case 2: // Aimed triple
            for (let i = -1; i <= 1; i++) {
                const a = baseAngle + i * 0.4;
                spawnBullet(e.x, e.y, Math.cos(a)*5, Math.sin(a)*5, 6, '#ff2266');
            }
            break;
        case 3: // Ring
            for (let i = 0; i < 12; i++) {
                const a = i * (Math.PI*2/12) + e.patternAngle;
                spawnBullet(e.x, e.y, Math.cos(a)*3, Math.sin(a)*3, 4, '#aa66ff');
            }
            e.patternAngle += 0.5;
            break;
    }
}

// Player bullets (shooting enemies)
let playerBullets = [];

function startGame() {
    gameState = 'playing';
    score = 0;
    difficulty = 1;
    frameCount = 0;
    player = createPlayer();
    bullets = [];
    enemies = [];
    playerBullets = [];
    particles = [];
}

// Gravity constant
const GRAVITY = 0.35;
const BULLET_GRAVITY = 0.08;

function update() {
    if (gameState !== 'playing') return;
    
    frameCount++;
    difficulty = 1 + Math.floor(frameCount / 300);
    
    // Player physics
    player.vy += GRAVITY;
    if (keys['KeyW'] || keys['ArrowUp']) { player.vy -= 0.8; player.thrust = true; }
    else player.thrust = false;
    if (keys['KeyA'] || keys['ArrowLeft']) player.vx -= 0.5;
    if (keys['KeyD'] || keys['ArrowRight']) player.vx += 0.5;
    
    player.vx *= 0.92;
    player.vy = Math.min(player.vy, 8);
    player.x += player.vx;
    player.y += player.vy;
    
    // Bounds
    if (player.x < player.radius) { player.x = player.radius; player.vx = 0; }
    if (player.x > canvas.width - player.radius) { player.x = canvas.width - player.radius; player.vx = 0; }
    if (player.y < player.radius) { player.y = player.radius; player.vy = 0; }
    if (player.y > canvas.height - player.radius) { player.y = canvas.height - player.radius; player.vy = 0; }
    
    // Player shooting
    if ((keys['KeyJ'] || keys['Space']) && frameCount % 8 === 0) {
        let tx, ty;
        if (enemies.length > 0) {
            const target = enemies[0];
            tx = target.x - player.x; ty = target.y - player.y;
        } else { tx = 0; ty = -1; }
        const d = Math.sqrt(tx*tx+ty*ty)||1;
        playerBullets.push({ x: player.x, y: player.y, vx: (tx/d)*8, vy: (ty/d)*8, radius: 3 });
        playShoot();
    }
    
    if (player.invincible > 0) player.invincible--;
    
    // Spawn enemies
    const spawnRate = Math.max(60 - difficulty * 5, 20);
    if (frameCount % spawnRate === 0 && enemies.length < 3 + difficulty) {
        spawnEnemy();
    }
    
    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.age++;
        e.x += e.vx;
        e.y += e.vy;
        e.vy += GRAVITY * 0.3;
        
        // Bounce off walls slightly
        if (e.x < -20 || e.x > canvas.width + 20) e.vx *= -1;
        if (e.y < -20) { e.y = -20; e.vy = Math.abs(e.vy); }
        if (e.y > canvas.height + 50) { enemies.splice(i, 1); continue; }
        
        // Shoot
        e.shootTimer++;
        const shootInterval = Math.max(40 - difficulty * 3, 15);
        if (e.shootTimer >= shootInterval) {
            e.shootTimer = 0;
            enemyShoot(e);
        }
        
        // Player bullets hit enemies
        for (let j = playerBullets.length - 1; j >= 0; j--) {
            const pb = playerBullets[j];
            const ex = e.x - pb.x, ey = e.y - pb.y;
            if (Math.sqrt(ex*ex+ey*ey) < e.radius + pb.radius) {
                playerBullets.splice(j, 1);
                e.health--;
                spawnParticles(pb.x, pb.y, '#44ff88', 5, 2);
                if (e.health <= 0) {
                    score += 10 * difficulty;
                    playEnemyDie();
                    spawnParticles(e.x, e.y, '#ffaa00', 15, 4);
                    enemies.splice(i, 1);
                    break;
                }
            }
        }
    }
    
    // Update player bullets
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -20 || b.x > canvas.width+20 || b.y < -20 || b.y > canvas.height+20) {
            playerBullets.splice(i, 1);
        }
    }
    
    // Update enemy bullets (with gravity!)
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.vy += BULLET_GRAVITY;
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        
        if (b.life <= 0 || b.x < -50 || b.x > canvas.width+50 || b.y > canvas.height+50) {
            bullets.splice(i, 1);
            continue;
        }
        
        // Hit player
        if (player.invincible <= 0) {
            const dx = player.x - b.x, dy = player.y - b.y;
            if (Math.sqrt(dx*dx+dy*dy) < player.radius + b.size) {
                bullets.splice(i, 1);
                player.health--;
                player.invincible = 60;
                playHit();
                spawnParticles(player.x, player.y, '#ff4444', 10, 3);
                if (player.health <= 0) {
                    gameState = 'gameover';
                    playGameOver();
                    try { 
                        if (score > highScore) { highScore = score; localStorage.setItem('gd_highscore', highScore); } 
                    } catch(e) {}
                }
            }
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += GRAVITY * 0.3;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Score for survival
    if (frameCount % 60 === 0) score++;
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if (gameState === 'menu') {
        drawMenu();
        return;
    }
    
    // Background stars
    ctx.fillStyle = '#222';
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + frameCount * 0.2) % canvas.width;
        const sy = (i * 97) % canvas.height;
        ctx.fillRect(sx, sy, 1, 1);
    }
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life/40), 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Player bullets
    for (const b of playerBullets) {
        ctx.fillStyle = '#44ff88';
        ctx.shadowColor = '#44ff88';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
    
    // Enemy bullets
    for (const b of bullets) {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
    
    // Enemies
    for (const e of enemies) {
        ctx.fillStyle = '#ff4444';
        ctx.strokeStyle = '#ff8888';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ff4444';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.stroke();
        
        // Health bar
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x - 15, e.y - e.radius - 10, 30, 4);
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(e.x - 15, e.y - e.radius - 10, 30 * (e.health / (3 + Math.floor(difficulty/2))), 4);
    }
    
    // Player
    if (player) {
        const blink = player.invincible > 0 && Math.floor(frameCount/4)%2===0;
        if (!blink) {
            ctx.fillStyle = '#44ddff';
            ctx.shadowColor = '#44ddff';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 10);
            ctx.lineTo(player.x - 8, player.y + 6);
            ctx.lineTo(player.x + 8, player.y + 6);
            ctx.closePath();
            ctx.fill();
            
            // Thrust flame
            if (player.thrust) {
                ctx.fillStyle = '#ffaa00';
                ctx.shadowColor = '#ffaa00';
                ctx.beginPath();
                ctx.moveTo(player.x, player.y + 6);
                ctx.lineTo(player.x - 4, player.y + 14);
                ctx.lineTo(player.x + 4, player.y + 14);
                ctx.closePath();
                ctx.fill();
            }
        }
        ctx.shadowBlur = 0;
    }
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`HI: ${highScore}`, 20, 50);
    ctx.fillText(`WAVE: ${difficulty}`, 20, 70);
    
    // Health
    for (let i = 0; i < player.maxHealth; i++) {
        ctx.fillStyle = i < player.health ? '#44ddff' : '#333';
        ctx.fillRect(20 + i * 25, canvas.height - 30, 20, 8);
    }
    
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff4444';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText(`Score: ${score}`, canvas.width/2, canvas.height/2 + 10);
        ctx.fillText('Press SPACE or R to restart', canvas.width/2, canvas.height/2 + 50);
    }
}

function drawMenu() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Animated background bullets
    for (let i = 0; i < 30; i++) {
        const t = frameCount * 0.02 + i * 2;
        const bx = (i * 73 + Math.sin(t) * 50) % canvas.width;
        const by = (i * 47 + frameCount * 0.5) % canvas.height;
        ctx.fillStyle = `hsl(${(i*20+frameCount)%360}, 80%, 60%)`;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(bx, by, 3, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#44ddff';
    ctx.font = 'bold 52px monospace';
    ctx.shadowColor = '#44ddff';
    ctx.shadowBlur = 20;
    ctx.fillText('GRAVITY DANMAKU', canvas.width/2, canvas.height/2 - 80);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#aaa';
    ctx.font = '18px monospace';
    ctx.fillText('Bullets arc with gravity. Dodge and survive!', canvas.width/2, canvas.height/2 - 30);
    
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.fillText('W / ↑ : Thrust up (gravity pulls you down)', canvas.width/2, canvas.height/2 + 20);
    ctx.fillText('A / ← & D / → : Move left / right', canvas.width/2, canvas.height/2 + 45);
    ctx.fillText('SPACE / J : Shoot enemies', canvas.width/2, canvas.height/2 + 70);
    ctx.fillText('Survive the bullet hell!', canvas.width/2, canvas.height/2 + 110);
    
    ctx.fillStyle = '#ffaa00';
    ctx.font = '22px monospace';
    const pulse = Math.sin(frameCount * 0.05) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.fillText('Press SPACE to Start', canvas.width/2, canvas.height/2 + 160);
    ctx.globalAlpha = 1;
    
    if (highScore > 0) {
        ctx.fillStyle = '#888';
        ctx.font = '14px monospace';
        ctx.fillText(`High Score: ${highScore}`, canvas.width/2, canvas.height/2 + 200);
    }
}

let lastTime = 0;
function gameLoop(time) {
    const dt = time - lastTime;
    lastTime = time;
    
    if (gameState === 'playing') update();
    else frameCount++;
    
    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
