<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golf Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Input
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; e.preventDefault(); });

// Game State
let gameState = 'menu'; // menu, playing, levelComplete, gameOver
let score = 0;
let totalStrokes = 0;
let currentLevel = 0;
let swingTimer = 0;
let isSwinging = false;
let swingCooldown = 0;
let particles = [];
let messages = [];
let time = 0;

// Player
const player = {
    x: 0, y: 0, vx: 0, vy: 0, w: 28, h: 40,
    grounded: false, facing: 1, animFrame: 0
};

// Ball
const ball = {
    x: 0, y: 0, vx: 0, vy: 0, r: 10,
    inHole: false, trail: []
};

// Levels
const levels = [
    {
        name: "Meadow Course",
        par: 3,
        platforms: [
            { x: 0, y: 500, w: 800, h: 40 },
            { x: 100, y: 400, w: 200, h: 20 },
            { x: 400, y: 350, w: 200, h: 20 }
        ],
        startPlayer: { x: 150, y: 460 },
        startBall: { x: 450, y: 320 },
        hole: { x: 650, y: 480, r: 22 }
    },
    {
        name: "Canyon Course",
        par: 4,
        platforms: [
            { x: 0, y: 500, w: 300, h: 40 },
            { x: 400, y: 500, w: 200, h: 40 },
            { x: 600, y: 500, w: 250, h: 40 },
            { x: 100, y: 380, w: 150, h: 20 },
            { x: 350, y: 300, w: 150, h: 20 },
            { x: 600, y: 350, w: 150, h: 20 }
        ],
        startPlayer: { x: 80, y: 460 },
        startBall: { x: 700, y: 460 },
        hole: { x: 420, y: 280, r: 22 }
    },
    {
        name: "Sky Course",
        par: 5,
        platforms: [
            { x: 0, y: 500, w: 150, h: 40 },
            { x: 250, y: 500, w: 150, h: 40 },
            { x: 450, y: 500, w: 150, h: 40 },
            { x: 650, y: 500, w: 200, h: 40 },
            { x: 50, y: 380, w: 120, h: 20 },
            { x: 250, y: 320, w: 120, h: 20 },
            { x: 450, y: 260, w: 120, h: 20 },
            { x: 650, y: 380, w: 120, h: 20 }
        ],
        startPlayer: { x: 70, y: 460 },
        startBall: { x: 700, y: 460 },
        hole: { x: 500, y: 230, r: 22 }
    },
    {
        name: "Grand Finale",
        par: 6,
        platforms: [
            { x: 0, y: 500, w: 120, h: 40 },
            { x: 200, y: 500, w: 120, h: 40 },
            { x: 380, y: 500, w: 120, h: 40 },
            { x: 560, y: 500, w: 120, h: 40 },
            { x: 740, y: 500, w: 150, h: 40 },
            { x: 0, y: 380, w: 100, h: 20 },
            { x: 180, y: 300, w: 100, h: 20 },
            { x: 360, y: 220, w: 100, h: 20 },
            { x: 540, y: 300, w: 100, h: 20 },
            { x: 720, y: 380, w: 130, h: 20 }
        ],
        startPlayer: { x: 50, y: 460 },
        startBall: { x: 800, y: 460 },
        hole: { x: 400, y: 190, r: 22 }
    }
];

function loadLevel(idx) {
    const lvl = levels[idx];
    player.x = lvl.startPlayer.x;
    player.y = lvl.startPlayer.y;
    player.vx = 0;
    player.vy = 0;
    ball.x = lvl.startBall.x;
    ball.y = lvl.startBall.y;
    ball.vx = 0;
    ball.vy = 0;
    ball.inHole = false;
    ball.trail = [];
    particles = [];
    messages = [];
}

function startGame() {
    initAudio();
    currentLevel = 0;
    totalStrokes = 0;
    loadLevel(0);
    gameState = 'playing';
}

function nextLevel() {
    currentLevel++;
    if (currentLevel >= levels.length) {
        gameState = 'gameOver';
    } else {
        loadLevel(currentLevel);
        gameState = 'levelComplete';
    }
}

// Particles
function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 0.5 + 0.5) * (speed || 3);
        particles.push({
            x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - 2,
            life: 1, color, size: Math.random() * 4 + 2
        });
    }
}

function addMessage(text, x, y, color) {
    messages.push({ text, x, y, life: 1, color: color || '#fff' });
}

// Update
function update(dt) {
    if (gameState !== 'playing') return;
    
    const lvl = levels[currentLevel];
    const grav = 0.5;
    const friction = 0.85;
    const bounce = 0.6;

    // Player movement
    const moveSpeed = 4;
    const jumpPower = -11;
    
    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -moveSpeed;
        player.facing = -1;
    } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = moveSpeed;
        player.facing = 1;
    } else {
        player.vx *= 0.7;
    }
    
    if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && player.grounded) {
        player.vy = jumpPower;
        player.grounded = false;
        playSound(300, 0.1, 'square', 0.2);
    }
    
    player.vy += grav;
    player.x += player.vx;
    player.y += player.vy;
    
    // Player platform collision
    player.grounded = false;
    for (const p of lvl.platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y + player.h > p.y && player.y + player.h < p.y + 20 &&
            player.vy >= 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }
    }
    
    // Player bounds
    if (player.x < 0) player.x = 0;
    if (player.x > W - player.w) player.x = W - player.w;
    if (player.y > H + 50) {
        loadLevel(currentLevel);
        playSound(150, 0.3, 'sawtooth', 0.2);
    }

    // Ball physics
    if (!ball.inHole) {
        ball.vy += grav;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vx *= 0.995;
        
        // Ball trail
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 15) ball.trail.shift();
        
        // Ball platform collision
        for (const p of lvl.platforms) {
            // Top
            if (ball.x + ball.r > p.x && ball.x - ball.r < p.x + p.w &&
                ball.y + ball.r > p.y && ball.y + ball.r < p.y + 15 && ball.vy > 0) {
                ball.y = p.y - ball.r;
                ball.vy *= -bounce;
                if (Math.abs(ball.vy) < 1) ball.vy = 0;
            }
            // Bottom
            if (ball.x + ball.r > p.x && ball.x - ball.r < p.x + p.w &&
                ball.y - ball.r < p.y + p.h && ball.y - ball.r > p.y + p.h - 15 && ball.vy < 0) {
                ball.y = p.y + p.h + ball.r;
                ball.vy *= -bounce;
            }
            // Left
            if (ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h &&
                ball.x + ball.r > p.x && ball.x + ball.r < p.x + 15 && ball.vx > 0) {
                ball.x = p.x - ball.r;
                ball.vx *= -bounce;
            }
            // Right
            if (ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h &&
                ball.x - ball.r < p.x + p.w && ball.x - ball.r > p.x + p.w - 15 && ball.vx < 0) {
                ball.x = p.x + p.w + ball.r;
                ball.vx *= -bounce;
            }
        }
        
        // Ball bounds
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -bounce; }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -bounce; }
        if (ball.y > H + 50) {
            // Ball fell off - respawn
            const startB = levels[currentLevel].startBall;
            ball.x = startB.x;
            ball.y = startB.y;
            ball.vx = 0;
            ball.vy = 0;
            playSound(200, 0.2, 'sawtooth', 0.15);
        }
        
        // Hole check
        const h = lvl.hole;
        const dx = ball.x - h.x;
        const dy = ball.y - (h.y - 5);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < h.r && Math.abs(ball.vy) < 3 && Math.abs(ball.vx) < 2.5) {
            ball.inHole = true;
            ball.vx = 0;
            ball.vy = 0;
            spawnParticles(h.x, h.y - 10, '#FFD700', 20, 4);
            addMessage("HOLE IN ONE! " + (totalStrokes + 1) + " stroke(s)", h.x, h.y - 60, '#FFD700');
            playSound(800, 0.5, 'sine', 0.3);
            setTimeout(() => playSound(1000, 0.5, 'sine', 0.3), 100);
            setTimeout(() => playSound(1200, 0.7, 'sine', 0.3), 200);
            gameState = 'levelComplete';
        }
    }

    // Swing
    if (swingCooldown > 0) swingCooldown -= dt;
    
    const distToBall = Math.sqrt((player.x + player.w/2 - ball.x) ** 2 + (player.y + player.h/2 - ball.y) ** 2);
    const canSwing = distToBall < 60 && !ball.inHole && swingCooldown <= 0;
    
    if ((keys['KeyX'] || keys['KeyE']) && canSwing) {
        if (!isSwinging) {
            isSwinging = true;
            swingTimer = 0;
        }
        swingTimer += dt;
    } else {
        if (isSwinging) {
            isSwinging = false;
            // Execute swing
            const power = Math.min(swingTimer * 8, 12);
            const dx = ball.x - (player.x + player.w/2);
            const dy = ball.y - (player.y + player.h/2);
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            ball.vx += (dx/len) * power;
            ball.vy += (dy/len) * power - 2;
            swingCooldown = 0.3;
            totalStrokes++;
            playSound(500, 0.1, 'square', 0.3);
            spawnParticles(ball.x, ball.y, '#fff', 5, 2);
        }
        swingTimer = 0;
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= dt * 1.5;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Messages
    for (let i = messages.length - 1; i >= 0; i--) {
        messages[i].y -= 1;
        messages[i].life -= dt * 0.5;
        if (messages[i].life <= 0) messages.splice(i, 1);
    }

    player.animFrame += Math.abs(player.vx) * dt * 10;
}

// Draw
function draw() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#87CEEB');
    grad.addColorStop(1, '#90EE90');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'menu') {
        drawMenu();
        return;
    }
    
    const lvl = levels[currentLevel];
    
    // Clouds
    for (let i = 0; i < 5; i++) {
        const cx = ((i * 180 + time * 20) % (W + 100)) - 50;
        const cy = 40 + (i * 37) % 80;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(cx, cy, 20, 0, Math.PI*2);
        ctx.arc(cx+15, cy-5, 15, 0, Math.PI*2);
        ctx.arc(cx+30, cy, 18, 0, Math.PI*2);
        ctx.fill();
    }

    // Platforms
    for (const p of lvl.platforms) {
        // Grass top
        ctx.fillStyle = '#4a7c3f';
        ctx.fillRect(p.x, p.y, p.w, 6);
        // Dirt body
        ctx.fillStyle = '#8B5E3C';
        ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
        // Grass blades
        ctx.strokeStyle = '#2d5a1b';
        ctx.lineWidth = 1;
        for (let gx = p.x; gx < p.x + p.w; gx += 8) {
            ctx.beginPath();
            ctx.moveTo(gx, p.y);
            ctx.lineTo(gx - 2, p.y - 5);
            ctx.stroke();
        }
    }

    // Hole/Cup
    const h = lvl.hole;
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(h.x, h.y, h.r, h.r * 0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Flag
    ctx.fillStyle = '#fff';
    ctx.fillRect(h.x - 1, h.y - 50, 3, 50);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(h.x + 2, h.y - 50);
    ctx.lineTo(h.x + 25, h.y - 40);
    ctx.lineTo(h.x + 2, h.y - 30);
    ctx.fill();

    // Ball trail
    for (let i = 0; i < ball.trail.length; i++) {
        const t = ball.trail[i];
        const alpha = i / ball.trail.length * 0.4;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.r * (i / ball.trail.length) * 0.7, 0, Math.PI*2);
        ctx.fill();
    }

    // Ball
    if (!ball.inHole) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.stroke();
        // Dimple pattern
        ctx.fillStyle = '#ddd';
        for (let a = 0; a < 6; a++) {
            const angle = a * Math.PI / 3 + time;
            ctx.beginPath();
            ctx.arc(ball.x + Math.cos(angle) * 5, ball.y + Math.sin(angle) * 5, 2, 0, Math.PI*2);
            ctx.fill();
        }
    } else {
        // Ball in hole (peeking out)
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(h.x, h.y - 3, ball.r * 0.6, 0, Math.PI*2);
        ctx.fill();
    }

    // Player
    const px = player.x, py = player.y;
    // Body
    ctx.fillStyle = '#3498db';
    ctx.fillRect(px + 4, py + 15, 20, 20);
    // Head
    ctx.fillStyle = '#f5d6a8';
    ctx.beginPath();
    ctx.arc(px + player.w/2, py + 10, 10, 0, Math.PI*2);
    ctx.fill();
    // Hat
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(px + 2, py - 2, 24, 6);
    ctx.fillRect(px + player.w/2 - 8, py - 6, 16, 4);
    // Eyes
    ctx.fillStyle = '#000';
    const eyeX = px + player.w/2 + (player.facing * 3);
    ctx.beginPath();
    ctx.arc(eyeX, py + 8, 2, 0, Math.PI*2);
    ctx.fill();
    // Legs
    const legOffset = Math.sin(player.animFrame) * 5;
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(px + 6, py + 35, 7, 8 + (player.grounded ? legOffset : 0));
    ctx.fillRect(px + 15, py + 35, 7, 8 - (player.grounded ? legOffset : 0));
    
    // Club
    const clubAngle = isSwinging ? -Math.PI/2 + swingTimer * 5 : Math.PI/4;
    ctx.save();
    ctx.translate(px + player.w/2 + player.facing * 15, py + 25);
    ctx.rotate(clubAngle * player.facing);
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, -2, 20, 4);
    ctx.fillStyle = '#C0C0C0';
    ctx.fillRect(18, -5, 6, 10);
    ctx.restore();

    // Swing indicator
    if (isSwinging) {
        const power = Math.min(swingTimer * 8, 12);
        ctx.fillStyle = `rgba(255, ${255 - power*20}, 0, 0.8)`;
        ctx.fillRect(px + player.w/2 - 25, py - 15, 50, 6);
        ctx.fillStyle = '#333';
        ctx.fillRect(px + player.w/2 - 25 + (power/12)*48, py - 15, 2, 6);
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Messages
    for (const m of messages) {
        ctx.globalAlpha = m.life;
        ctx.fillStyle = m.color;
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(m.text, m.x, m.y);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 10, 250, 80);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${currentLevel + 1}: ${lvl.name}`, 20, 30);
    ctx.fillText(`Strokes: ${totalStrokes}  |  Par: ${lvl.par}`, 20, 50);
    const parDiff = totalStrokes - lvl.par;
    let rating = '';
    if (parDiff <= -2) rating = '🏆';
    else if (parDiff === -1) rating = '⭐';
    else if (parDiff === 0) rating = '✅';
    else if (parDiff === 1) rating = '⚠️';
    else rating = '💀';
    ctx.fillText(`Par diff: ${parDiff >= 0 ? '+' : ''}${parDiff} ${rating}`, 20, 70);

    // Level Complete Screen
    if (gameState === 'levelComplete') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⛳ HOLE IN! ⛳', W/2, H/2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.fillText(`${totalStrokes} stroke(s) | Par ${lvl.par}`, W/2, H/2 + 10);
        const diff = totalStrokes - lvl.par;
        let comment = '';
        if (diff <= -3) comment = 'Incredible! Tour level!';
        else if (diff === -2) comment = 'Eagle! Amazing!';
        else if (diff === -1) comment = 'Birdie! Great shot!';
        else if (diff === 0) comment = 'Par. Solid work!';
        else if (diff === 1) comment = 'Bogey. Keep it up!';
        else comment = 'Tough one! Try again next time.';
        ctx.fillText(comment, W/2, H/2 + 50);
        ctx.font = '18px Arial';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Press ENTER for next level', W/2, H/2 + 100);

        if (keys['Enter'] || keys['Space']) {
            setTimeout(nextLevel, 500);
            gameState = 'transitioning';
        }
    }

    // Game Over
    if (gameState === 'gameOver') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🏌️ Course Complete! 🏌️', W/2, H/2 - 60);
        ctx.fillStyle = '#fff';
        ctx.font = '28px Arial';
        ctx.fillText(`Total Strokes: ${totalStrokes}`, W/2, H/2);
        const totalPar = levels.reduce((s, l) => s + l.par, 0);
        const finalDiff = totalStrokes - totalPar;
        let finalMsg = finalDiff <= -3 ? '🏆 LEGENDARY GOLFER!' : 
                       finalDiff <= 0 ? '⭐ PROFESSIONAL!' :
                       finalDiff <= 2 ? '✅ AMATEUR' : '📖 LEARNER';
        ctx.fillText(finalMsg, W/2, H/2 + 45);
        ctx.font = '18px Arial';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Press R to restart', W/2, H/2 + 100);

        if (keys['KeyR']) {
            gameState = 'menu';
        }
    }
}

function drawMenu() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#87CEEB');
    grad.addColorStop(1, '#90EE90');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Decorative ground
    ctx.fillStyle = '#4a7c3f';
    ctx.fillRect(0, H - 80, W, 80);
    
    // Title
    ctx.fillStyle = '#2d5a1b';
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('⛳ GOLF PLATFORMER', W/2, H/3);
    
    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    const instructions = [
        '← → / A D  - Move',
        'SPACE / ↑ / W  - Jump',
        'HOLD X or E (near ball)  - Swing Club',
        '',
        'Get the ball in the hole! Each level has a par.',
        'Fewer strokes = better score!'
    ];
    instructions.forEach((line, i) => {
        ctx.fillText(line, W/2, H/3 + 60 + i * 30);
    });

    // Bouncing ball animation
    const bounceY = Math.abs(Math.sin(time * 3)) * -30;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(W/2, H*0.75 + bounceY, 12, 0, Math.PI*2);
    ctx.fill();
    
    // Flag
    const flagX = W/2 + 60;
    const flagY = H*0.75 - 10;
    ctx.fillStyle = '#fff';
    ctx.fillRect(flagX-1, flagY - 40, 3, 40);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(flagX+2, flagY - 40);
    ctx.lineTo(flagX+25, flagY - 30);
    ctx.lineTo(flagX+2, flagY - 20);
    ctx.fill();

    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 28px Arial';
    const pulse = Math.sin(time * 4) * 5;
    ctx.fillText(`PRESS ENTER TO START`, W/2, H*0.9 + pulse);

    if (keys['Enter'] || keys['Space']) {
        startGame();
    }
}

// Game Loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;
    time += dt * 0.016;
    
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
