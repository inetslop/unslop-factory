<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match-3 Sokoban</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, gridX, gridY;
let scale = 1;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    const GRID_SIZE = 7;
    cellSize = Math.floor(Math.min(W * 0.85, H * 0.7)) / GRID_SIZE);
    gridX = Math.floor((W - cellSize * 7) / 2);
    gridY = Math.floor((H - cellSize * 7) / 2) + 20;
}
window.addEventListener('resize', resize);
resize();

const COLORS = [null, '#ff4466', '#4488ff', '#44dd88', '#ffcc33'];
const COLOR_NAMES = ['', 'Red', 'Blue', 'Green', 'Yellow'];

let state = 'start'; // start, playing, animating, won, lost
let grid = [];
let player = { x: 0, y: 0 };
let movesLeft = 0;
let level = 0;
let score = 0;
let totalGems = 0;
let gemsCleared = 0;
let animQueue = [];
let animTimer = 0;
let particles = [];
let message = '';
let messageTimer = 0;

const LEVELS = [
    {
        moves: 20,
        grid: [
            [0,0,'X',0,0,0,0],
            [0,1,0,0,2,0,0],
            ['X',0,3,0,0,4,0],
            [0,0,0,'X',0,0,0],
            [0,2,0,0,3,0,1],
            [0,0,4,0,0,0,'X'],
            [0,0,0,0,0,2,0]
        ],
        player: { x: 3, y: 3 }
    },
    {
        moves: 25,
        grid: [
            ['X',1,1,0,2,2,'X'],
            [0,0,0,0,0,0,0],
            [0,3,0,'X',0,4,0],
            [0,0,0,0,0,0,0],
            ['X',2,0,4,0,1,'X'],
            [0,0,0,0,0,0,0],
            [3,0,0,0,0,0,4]
        ],
        player: { x: 3, y: 3 }
    },
    {
        moves: 22,
        grid: [
            [1,1,0,'X',0,2,2],
            [0,0,3,0,4,0,0],
            [0,4,0,0,0,3,0],
            ['X',0,0,1,0,0,'X'],
            [0,3,0,0,2,0,0],
            [0,0,0,0,0,0,0],
            [2,2,4,0,1,1,0]
        ],
        player: { x: 3, y: 2 }
    },
    {
        moves: 28,
        grid: [
            [1,0,2,0,3,0,4],
            ['X',0,0,0,0,0,'X'],
            [0,4,0,1,0,2,0],
            [0,0,0,'X',0,0,0],
            [0,2,0,3,0,4,0],
            ['X',0,0,0,0,0,'X'],
            [1,0,2,0,3,0,4]
        ],
        player: { x: 3, y: 3 }
    },
    {
        moves: 30,
        grid: [
            [1,1,2,0,3,4,0],
            [0,0,0,'X',0,0,0],
            [2,0,4,0,1,0,3],
            ['X',0,0,0,0,0,'X'],
            [3,0,1,0,4,0,2],
            [0,0,0,'X',0,0,0],
            [4,3,0,2,1,0,4]
        ],
        player: { x: 3, y: 2 }
    }
];

function loadLevel(idx) {
    level = idx;
    const lv = LEVELS[idx];
    grid = lv.grid.map(row => row.map(c => c === 'X' ? 'X' : c));
    player = { ...lv.player };
    movesLeft = lv.moves;
    totalGems = 0;
    gemsCleared = 0;
    for (let y = 0; y < 7; y++)
        for (let x = 0; x < 7; x++)
            if (typeof grid[y][x] === 'number' && grid[y][x] > 0) totalGems++;
    state = 'playing';
    animQueue = [];
    particles = [];
}

function restart() {
    loadLevel(0);
}

function nextLevel() {
    if (level + 1 < LEVELS.length) {
        loadLevel(level + 1);
    } else {
        state = 'won';
    }
}

function checkMatches() {
    let matched = new Set();
    // Check rows
    for (let y = 0; y < 7; y++) {
        let run = [];
        for (let x = 0; x < 7; x++) {
            if (typeof grid[y][x] === 'number' && grid[y][x] > 0) {
                if (run.length === 0 || run[run.length-1].color !== grid[y][x]) {
                    if (run.length >= 3) run.forEach(c => matched.add(c.x + ',' + c.y));
                    run = [{ x, y, color: grid[y][x] }];
                } else {
                    run.push({ x, y, color: grid[y][x] });
                }
            } else {
                if (run.length >= 3) run.forEach(c => matched.add(c.x + ',' + c.y));
                run = [];
            }
        }
        if (run.length >= 3) run.forEach(c => matched.add(c.x + ',' + c.y));
    }
    // Check columns
    for (let x = 0; x < 7; x++) {
        let run = [];
        for (let y = 0; y < 7; y++) {
            if (typeof grid[y][x] === 'number' && grid[y][x] > 0) {
                if (run.length === 0 || run[run.length-1].color !== grid[y][x]) {
                    if (run.length >= 3) run.forEach(c => matched.add(c.x + ',' + c.y));
                    run = [{ x, y, color: grid[y][x] }];
                } else {
                    run.push({ x, y, color: grid[y][x] });
                }
            } else {
                if (run.length >= 3) run.forEach(c => matched.add(c.x + ',' + c.y));
                run = [];
            }
        }
        if (run.length >= 3) run.forEach(c => matched.add(c.x + ',' + c.y));
    }
    return matched;
}

function applyGravity() {
    let moved = false;
    for (let x = 0; x < 7; x++) {
        // Bottom to top, move gems down
        for (let y = 6; y > 0; y--) {
            if (grid[y][x] === 0 && (typeof grid[y-1][x] === 'number' && grid[y-1][x] > 0)) {
                // Check if cell below is not wall
                grid[y][x] = grid[y-1][x];
                grid[y-1][x] = 0;
                moved = true;
            }
        }
    }
    return moved;
}

function resolveMatches() {
    let matched = checkMatches();
    if (matched.size === 0) return false;
    
    matched.forEach(key => {
        const [x, y] = key.split(',').map(Number);
        const color = grid[y][x];
        gemsCleared++;
        score += 10 * color;
        // Add particles
        for (let i = 0; i < 5; i++) {
            particles.push({
                x: gridX + x * cellSize + cellSize/2,
                y: gridY + y * cellSize + cellSize/2,
                vx: (Math.random()-0.5) * 4,
                vy: (Math.random()-0.5) * 4 - 2,
                life: 30,
                color: COLORS[color]
            });
        }
        grid[y][x] = 0;
    });
    
    // Play sound
    playMatchSound();
    
    return true;
}

function tryMove(dx, dy) {
    if (state !== 'playing') return;
    
    const nx = player.x + dx;
    const ny = player.y + dy;
    
    if (nx < 0 || nx >= 7 || ny < 0 || ny >= 7) return;
    if (grid[ny][nx] === 'X') return;
    
    if (typeof grid[ny][nx] === 'number' && grid[ny][nx] > 0) {
        // Try to push gem
        const px = nx + dx;
        const py = ny + dy;
        if (px < 0 || px >= 7 || py < 0 || py >= 7) return;
        if (grid[py][px] === 'X') return;
        if (typeof grid[py][px] === 'number' && grid[py][px] > 0) return;
        // Push
        grid[ny][nx] = grid[ny+dy][nx+dx];
        grid[ny+dy][nx+dx] = 0;
    }
    
    player.x = nx;
    player.y = ny;
    movesLeft--;
    
    playMoveSound();
    
    // Resolve matches with animation
    state = 'animating';
    animTimer = 0;
    resolveAnimation();
}

function resolveAnimation() {
    if (resolveMatches()) {
        applyGravity();
        setTimeout(resolveAnimation, 300);
    } else {
        // Check win/lose
        let remaining = 0;
        for (let y = 0; y < 7; y++)
            for (let x = 0; x < 7; x++)
                if (typeof grid[y][x] === 'number' && grid[y][x] > 0) remaining++;
        
        if (remaining === 0) {
            score += movesLeft * 5;
            setTimeout(() => { state = 'won'; }, 500);
        } else if (movesLeft <= 0) {
            setTimeout(() => { state = 'lost'; }, 500);
        } else {
            state = 'playing';
        }
    }
}

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playMoveSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 200;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.1);
}

function playMatchSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.value = 500;
    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.3);
}

function playWinSound() {
    if (!audioCtx) return;
    [523, 659, 784].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.3);
        osc.start(audioCtx.currentTime + i * 0.15);
        osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
    });
}

function playLoseSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.value = 200;
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
}

// Input
window.addEventListener('keydown', (e) => {
    if (!audioCtx) initAudio();
    
    if (state === 'start') {
        loadLevel(0);
        return;
    }
    
    if (state === 'won' || state === 'lost') {
        if (e.key === 'Enter' || e.key === ' ') restart();
        return;
    }
    
    if (state !== 'playing') return;
    
    switch(e.key) {
        case 'ArrowUp': tryMove(0, -1); break;
        case 'ArrowDown': tryMove(0, 1); break;
        case 'ArrowLeft': tryMove(-1, 0); break;
        case 'ArrowRight': tryMove(1, 0); break;
        case 'w': tryMove(0, -1); break;
        case 's': tryMove(0, 1); break;
        case 'a': tryMove(-1, 0); break;
        case 'd': tryMove(1, 0); break;
    }
});

// Rendering
function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
}

function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    if (state === 'start') {
        drawStartScreen();
        return;
    }
    
    // Draw grid
    for (let y = 0; y < 7; y++) {
        for (let x = 0; x < 7; x++) {
            const px = gridX + x * cellSize;
            const py = gridY + y * cellSize;
            
            // Cell background
            ctx.fillStyle = (x+y) % 2 === 0 ? '#16213e' : '#1a1a3e';
            ctx.fillRect(px, py, cellSize, cellSize);
            
            // Grid lines
            ctx.strokeStyle = '#2a2a4e';
            ctx.lineWidth = 1;
            ctx.strokeRect(px, py, cellSize, cellSize);
            
            const val = grid[y][x];
            if (val === 'X') {
                // Wall
                ctx.fillStyle = '#3a3a5c';
                drawRoundedRect(px+2, py+2, cellSize-4, cellSize-4, 4);
                ctx.fill();
                ctx.fillStyle = '#2a2a4e';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(px+8, py+8+i*12, cellSize-16, 4);
                }
            } else if (typeof val === 'number' && val > 0) {
                // Gem
                const gemColor = COLORS[val];
                ctx.fillStyle = gemColor;
                drawRoundedRect(px+4, py+4, cellSize-8, cellSize-8, Math.min(6, cellSize*0.15));
                ctx.fill();
                
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                drawRoundedRect(px+6, py+6, cellSize-12, (cellSize-8)/3, 4);
                ctx.fill();
                
                // Glow
                ctx.shadowColor = gemColor;
                ctx.shadowBlur = 8;
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
    }
    
    // Draw player
    const ppx = gridX + player.x * cellSize;
    const ppy = gridY + player.y * cellSize;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ppx + cellSize/2, ppy + cellSize/2, cellSize*0.35, 0, Math.PI*2);
    ctx.fill();
    
    // Player face
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(ppx + cellSize*0.4, ppy + cellSize*0.42, cellSize*0.08, 0, Math.PI*2);
    ctx.arc(ppx + cellSize*0.6, ppy + cellSize*0.42, cellSize*0.08, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ppx + cellSize/2, ppy + cellSize*0.55, cellSize*0.12, 0, Math.PI);
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Particles
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life--;
        if (p.life > 0) {
            ctx.globalAlpha = p.life / 30;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4 * (p.life/30), 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    });
    particles = particles.filter(p => p.life > 0);
    
    // HUD
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.max(16, cellSize*0.4)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${level + 1}`, gridX, gridY - 30);
    
    ctx.textAlign = 'center';
    ctx.fillText(`Moves: ${movesLeft}`, W/2, gridY - 30);
    
    let remaining = 0;
    for (let y = 0; y < 7; y++)
        for (let x = 0; x < 7; x++)
            if (typeof grid[y][x] === 'number' && grid[y][x] > 0) remaining++;
    
    ctx.textAlign = 'right';
    ctx.fillText(`Gems: ${remaining}  Score: ${score}`, W - gridX, gridY - 30);
    
    // Win/Lose overlay
    if (state === 'won') {
        if (level + 1 < LEVELS.length) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#44dd88';
            ctx.font = `bold ${Math.max(24, cellSize*0.8)}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('Level Complete!', W/2, H/2 - 30);
            ctx.fillStyle = '#ffffff';
            ctx.font = `${Math.max(16, cellSize*0.4)}px 'Segoe UI', sans-serif`;
            ctx.fillText(`Score: ${score}`, W/2, H/2 + 20);
            ctx.fillText('Press ENTER for next level', W/2, H/2 + 60);
        } else {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ffcc33';
            ctx.font = `bold ${Math.max(24, cellSize*0.8)}px 'Segoe UI', sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('You Beat All Levels!', W/2, H/2 - 30);
            ctx.fillStyle = '#ffffff';
            ctx.font = `${Math.max(16, cellSize*0.4)}px 'Segoe UI', sans-serif`;
            ctx.fillText(`Final Score: ${score}`, W/2, H/2 + 20);
            ctx.fillText('Press ENTER to play again', W/2, H/2 + 60);
        }
        if (state === 'won') { /* already handled */ }
    }
    
    if (state === 'lost') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff4466';
        ctx.font = `bold ${Math.max(24, cellSize*0.8)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('Out of Moves!', W/2, H/2 - 30);
        ctx.fillStyle = '#ffffff';
        ctx.font = `${Math.max(16, cellSize*0.4)}px 'Segoe UI', sans-serif`;
        ctx.fillText(`Score: ${score}`, W/2, H/2 + 20);
        ctx.fillText('Press ENTER to restart', W/2, H/2 + 60);
    }
    
    // Handle enter key for won/lost
    if (state === 'won') {
        document.addEventListener('keydown', function handler(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                document.removeEventListener('keydown', handler);
                nextLevel();
            }
        });
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.max(32, W*0.05)}px 'Segoe UI', sans-serif`;
    ctx.fillText('MATCH-3 SOKOBAN', W/2, H*0.2);
    
    ctx.font = `${Math.max(14, W*0.02)}px 'Segoe UI', sans-serif`;
    ctx.fillStyle = '#aaaacc';
    const lines = [
        'Push gems to make matches of 3+ in a row or column.',
        'Clear all gems from the board to win each level.',
        '',
        'Arrow Keys / WASD: Move',
        '',
        'Rules:',
        '• You can push gems one tile at a time',
        '• You cannot pull gems back',
        '• You cannot push gems into walls or other gems',
        '• Matches clear automatically after each move',
        '• Gems fall down due to gravity after matches',
        '',
        'Press any arrow key to start!'
    ];
    
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, H*0.35 + i * Math.max(20, H*0.03));
    });
    
    // Draw demo gems
    const demoY = H * 0.8;
    const demoSize = Math.min(W, H) * 0.06;
    [1,2,3,4].forEach((c, i) => {
        ctx.fillStyle = COLORS[c];
        drawRoundedRect(W/2 - (demoSize*5)/2 + i*demoSize, demoY, demoSize, demoSize, 4);
        ctx.fill();
    });
}

// Fix: handle won/lost enter properly
let prevWon = false;
window.addEventListener('keydown', (e) => {
    if ((state === 'won' || state === 'lost') && (e.key === 'Enter' || e.key === ' ')) {
        if (state === 'won') nextLevel();
        else restart();
    }
});

// Game loop
function update() {
    draw();
    requestAnimationFrame(update);
}

loadLevel(0);
state = 'start';
update();
</script>
</body>
</html>
