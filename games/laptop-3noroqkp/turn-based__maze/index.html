<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Crawler</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Courier New', monospace; }
canvas { display: block; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: #7fdbff; font-size: 14px; text-align: center; text-shadow: 0 0 8px #7fdbff; }
#msg { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #aaa; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud"></div>
  <div id="msg"></div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hudEl = document.getElementById('hud');
const msgEl = document.getElementById('msg');

let W, H, cellSize;
let gameState = 'start'; // start, playing, dead, levelComplete, victory
let animFrame = 0;

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.1));
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + (dur || 0.1));
}
function sfxMove() { playSound(200, 0.05, 'square', 0.05); }
function sfxDie() { playSound(100, 0.4, 'sawtooth', 0.15); }
function sfxWin() { playSound(600, 0.2, 'sine', 0.1); setTimeout(() => playSound(800, 0.3, 'sine', 0.1), 150); }
function sfxPickup() { playSound(440, 0.1, 'sine', 0.1); setTimeout(() => playSound(660, 0.1, 'sine', 0.1), 80); }

// Game state
let maze = [];
let player = { x: 0, y: 0 };
let enemies = [];
let exitPos = { x: 0, y: 0 };
let items = [];
let level = 1;
let maxLevel = 5;
let lives = 3;
let mazeW = 11, mazeH = 11;
let visRadius = 4;
let turnCount = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  cellSize = Math.min(Math.floor((W - 60) / mazeW), Math.floor((H - 100) / mazeH));
}
window.addEventListener('resize', resize);

// Maze generation (recursive backtracker)
function generateMaze(w, h) {
  let grid = Array.from({ length: h }, () => Array.from({ length: w }, () => ({ top: 1, right: 1, bottom: 1, left: 1 })));
  const stack = [];
  const visited = Array.from({ length: h }, () => Array(w).fill(false));
  
  function getNeighbors(x, y) {
    const n = [];
    if (y > 0 && !visited[y-1][x]) n.push([x, y-1, 'top']);
    if (x < w-1 && !visited[y][x+1]) n.push([x+1, y, 'right']);
    if (y < h-1 && !visited[y+1][x]) n.push([x, y+1, 'bottom']);
    if (x > 0 && !visited[y][x-1]) n.push([x-1, y, 'left']);
    return n;
  }
  
  let cx = 0, cy = 0;
  visited[cy][cx] = true;
  stack.push([cx, cy]);
  
  while (stack.length > 0) {
    const [px, py] = stack[stack.length - 1];
    const neighbors = getNeighbors(px, py).filter(([nx, ny]) => !visited[ny][nx]);
    
    if (neighbors.length === 0) {
      stack.pop();
      continue;
    }
    
    const [nx, ny, dir] = neighbors[Math.floor(Math.random() * neighbors.length)];
    
    // Remove wall between current and next
    if (dir === 'top') { grid[py][px].top = 0; grid[ny][nx].bottom = 0; }
    else if (dir === 'right') { grid[py][px].right = 0; grid[ny][nx].left = 0; }
    else if (dir === 'bottom') { grid[py][px].bottom = 0; grid[ny][nx].top = 0; }
    else if (dir === 'left') { grid[py][px].left = 0; grid[ny][nx].right = 0; }
    
    visited[ny][nx] = true;
    stack.push([nx, ny]);
  }
  
  // Add some extra openings for loops
  const extraOpenings = Math.floor(w * h * 0.05);
  for (let i = 0; i < extraOpenings; i++) {
    const rx = Math.floor(Math.random() * w);
    const ry = Math.floor(Math.random() * h);
    const dir = Math.floor(Math.random() * 4);
    if (dir === 0 && ry > 0) { grid[ry][rx].top = 0; grid[ry-1][rx].bottom = 0; }
    else if (dir === 1 && rx < w-1) { grid[ry][rx].right = 0; grid[ry][rx+1].left = 0; }
    else if (dir === 2 && ry < h-1) { grid[ry][rx].bottom = 0; grid[ry+1][rx].top = 0; }
    else if (dir === 3 && rx > 0) { grid[ry][rx].left = 0; grid[ry][rx-1].right = 0; }
  }
  
  return grid;
}

function canMove(x, y, dx, dy) {
  const nx = x + dx, ny = y + dy;
  if (nx < 0 || nx >= mazeW || ny < 0 || ny >= mazeH) return false;
  if (dy === -1 && maze[y][x].top) return false;
  if (dy === 1 && maze[y][x].bottom) return false;
  if (dx === -1 && maze[y][x].left) return false;
  if (dx === 1 && maze[y][x].right) return false;
  return true;
}

function findPath(x, y, tx, ty) {
  // Simple BFS to find shortest path direction
  const queue = [[x, y]];
  const visited = {};
  const parent = {};
  visited[x + ',' + y] = true;
  
  while (queue.length > 0) {
    const [cx, cy] = queue.shift();
    if (cx === tx && cy === ty) break;
    
    const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      const key = nx + ',' + ny;
      if (nx < 0 || nx >= mazeW || ny < 0 || ny >= mazeH) continue;
      if (visited[key]) continue;
      if (!canMove(cx, cy, dx, dy)) continue;
      visited[key] = true;
      parent[key] = [cx, cy];
      queue.push([nx, ny]);
    }
  }
  
  const tKey = tx + ',' + ty;
  if (!parent[tKey]) return null;
  
  let path = [];
  let cur = [tx, ty];
  while (cur[0] !== x || cur[1] !== y) {
    path.unshift(cur);
    cur = parent[cur[0] + ',' + cur[1]];
  }
  return path;
}

function startLevel(lvl) {
  level = lvl;
  mazeW = 9 + lvl * 2;
  mazeH = 9 + lvl * 2;
  if (mazeW > 25) mazeW = 25;
  if (mazeH > 25) mazeH = 25;
  
  maze = generateMaze(mazeW, mazeH);
  player = { x: 0, y: 0 };
  exitPos = { x: mazeW - 1, y: mazeH - 1 };
  turnCount = 0;
  
  // Place enemies
  const numEnemies = Math.min(2 + lvl, 8);
  enemies = [];
  for (let i = 0; i < numEnemies; i++) {
    let ex, ey;
    do {
      ex = Math.floor(Math.random() * mazeW);
      ey = Math.floor(Math.random() * mazeH);
    } while (Math.abs(ex - player.x) + Math.abs(ey - player.y) < 4 || enemies.some(e => e.x === ex && e.y === ey));
    enemies.push({ x: ex, y: ey, speed: lvl >= 3 ? 1 : 1 });
  }
  
  // Place items (health orbs)
  items = [];
  const numItems = Math.floor(Math.random() * 2) + 1;
  for (let i = 0; i < numItems; i++) {
    let ix, iy;
    do {
      ix = Math.floor(Math.random() * mazeW);
      iy = Math.floor(Math.random() * mazeH);
    } while (Math.abs(ix - player.x) + Math.abs(iy - player.y) < 3 || items.some(it => it.x === ix && it.y === iy));
    items.push({ x: ix, y: iy });
  }
  
  resize();
}

function movePlayer(dx, dy) {
  if (gameState !== 'playing') return;
  initAudio();
  
  if (!canMove(player.x, player.y, dx, dy)) {
    playSound(100, 0.05, 'square', 0.03);
    return;
  }
  
  player.x += dx;
  player.y += dy;
  turnCount++;
  sfxMove();
  
  // Check items
  for (let i = items.length - 1; i >= 0; i--) {
    if (items[i].x === player.x && items[i].y === player.y) {
      items.splice(i, 1);
      lives = Math.min(lives + 1, 5);
      sfxPickup();
    }
  }
  
  // Check exit
  if (player.x === exitPos.x && player.y === exitPos.y) {
    gameState = 'levelComplete';
    sfxWin();
    return;
  }
  
  moveEnemies();
  checkCollisions();
}

function moveEnemies() {
  for (const e of enemies) {
    const distToPlayer = Math.abs(e.x - player.x) + Math.abs(e.y - player.y);
    
    if (distToPlayer <= visRadius || Math.random() < 0.3) {
      // Chase player
      const path = findPath(e.x, e.y, player.x, player.y);
      if (path && path.length > 0) {
        const next = path[0];
        if (canMove(e.x, e.y, next[0] - e.x, next[1] - e.y)) {
          e.x = next[0];
          e.y = next[1];
        }
      } else {
        // Random move
        randomEnemyMove(e);
      }
    } else {
      randomEnemyMove(e);
    }
  }
}

function randomEnemyMove(e) {
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  const valid = dirs.filter(d => canMove(e.x, e.y, d[0], d[1]));
  if (valid.length > 0) {
    const d = valid[Math.floor(Math.random() * valid.length)];
    e.x += d[0];
    e.y += d[1];
  }
}

function checkCollisions() {
  for (const e of enemies) {
    if (e.x === player.x && e.y === player.y) {
      lives--;
      sfxDie();
      gameState = 'dead';
      return;
    }
  }
}

// Input
window.addEventListener('keydown', (e) => {
  initAudio();
  
  if (gameState === 'start') {
    if (e.key === 'Enter' || e.key === ' ') {
      startLevel(1);
      gameState = 'playing';
    }
    return;
  }
  
  if (gameState === 'levelComplete') {
    if (e.key === 'Enter' || e.key === ' ') {
      if (level >= maxLevel) {
        gameState = 'victory';
      } else {
        startLevel(level + 1);
        gameState = 'playing';
      }
    }
    return;
  }
  
  if (gameState === 'dead') {
    if (lives > 0) {
      // Respawn at start
      player.x = 0;
      player.y = 0;
      gameState = 'playing';
    } else {
      if (e.key === 'Enter' || e.key === ' ') {
        lives = 3;
        startLevel(1);
        gameState = 'playing';
      }
    }
    return;
  }
  
  if (gameState === 'victory') {
    if (e.key === 'Enter' || e.key === ' ') {
      lives = 3;
      startLevel(1);
      gameState = 'playing';
    }
    return;
  }
  
  if (gameState !== 'playing') return;
  
  let dx = 0, dy = 0;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dy = -1;
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dy = 1;
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dx = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dx = 1;
  else return;
  
  e.preventDefault();
  movePlayer(dx, dy);
});

// Rendering
function drawMaze() {
  const offsetX = Math.floor((W - mazeW * cellSize) / 2);
  const offsetY = Math.floor((H - mazeH * cellSize) / 2);
  
  ctx.save();
  ctx.translate(offsetX, offsetY);
  
  // Visibility check
  function isVisible(x, y) {
    const dist = Math.abs(x - player.x) + Math.abs(y - player.y);
    return dist <= visRadius;
  }
  
  // Draw cells
  for (let y = 0; y < mazeH; y++) {
    for (let x = 0; x < mazeW; x++) {
      if (!isVisible(x, y)) continue;
      
      const px = x * cellSize;
      const py = y * cellSize;
      
      // Floor
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(px, py, cellSize, cellSize);
      
      // Walls
      ctx.strokeStyle = '#4a9eff';
      ctx.lineWidth = 2;
      ctx.lineCap = 'square';
      
      if (maze[y][x].top) {
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + cellSize, py);
        ctx.stroke();
      }
      if (maze[y][x].left) {
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px, py + cellSize);
        ctx.stroke();
      }
      if (maze[y][x].bottom && y < mazeH - 1) {
        ctx.beginPath();
        ctx.moveTo(px, py + cellSize);
        ctx.lineTo(px + cellSize, py + cellSize);
        ctx.stroke();
      }
      if (maze[y][x].right && x < mazeW - 1) {
        ctx.beginPath();
        ctx.moveTo(px + cellSize, py);
        ctx.lineTo(px + cellSize, py + cellSize);
        ctx.stroke();
      }
    }
  }
  
  // Exit
  if (isVisible(exitPos.x, exitPos.y)) {
    const ex = exitPos.x * cellSize + cellSize / 2;
    const ey = exitPos.y * cellSize + cellSize / 2;
    const pulse = Math.sin(animFrame * 0.1) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(0, 255, 100, ${pulse})`;
    ctx.beginPath();
    ctx.arc(ex, ey, cellSize * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#00ff64';
    ctx.lineWidth = 2;
    ctx.strokeText('EXIT', ex - 18, ey + 5);
  }
  
  // Items
  for (const item of items) {
    if (!isVisible(item.x, item.y)) continue;
    const ix = item.x * cellSize + cellSize / 2;
    const iy = item.y * cellSize + cellSize / 2;
    const pulse = Math.sin(animFrame * 0.15) * 3;
    ctx.fillStyle = '#ff6b9d';
    ctx.beginPath();
    ctx.arc(ix, iy, cellSize * 0.2 + pulse, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Enemies
  for (const e of enemies) {
    if (!isVisible(e.x, e.y)) continue;
    const ex = e.x * cellSize + cellSize / 2;
    const ey = e.y * cellSize + cellSize / 2;
    const pulse = Math.sin(animFrame * 0.2) * 2;
    
    ctx.fillStyle = '#ff3355';
    ctx.beginPath();
    ctx.arc(ex, ey, cellSize * 0.28 + pulse, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#fff';
    const eyeOff = cellSize * 0.1;
    ctx.beginPath();
    ctx.arc(ex - eyeOff, ey - 2, 3, 0, Math.PI * 2);
    ctx.arc(ex + eyeOff, ey - 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Player
  const px = player.x * cellSize + cellSize / 2;
  const py = player.y * cellSize + cellSize / 2;
  
  ctx.fillStyle = '#7fdbff';
  ctx.shadowColor = '#7fdbff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(px, py, cellSize * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  ctx.restore();
}

function drawStartScreen() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);
  
  const cx = W / 2, cy = H / 2;
  
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7fdbff';
  ctx.font = `bold ${Math.min(48, W * 0.06)}px Courier New`;
  ctx.shadowColor = '#7fdbff';
  ctx.shadowBlur = 20;
  ctx.fillText('MAZE CRAWLER', cx, cy - 60);
  ctx.shadowBlur = 0;
  
  ctx.font = `${Math.min(16, W * 0.02)}px Courier New`;
  ctx.fillStyle = '#aaa';
  ctx.fillText('Navigate the maze. Avoid the red hunters.', cx, cy - 10);
  ctx.fillText('Reach the green exit to advance.', cx, cy + 20);
  ctx.fillText('Collect pink orbs for extra lives.', cx, cy + 50);
  
  ctx.fillStyle = '#7fdbff';
  ctx.font = `${Math.min(14, W * 0.018)}px Courier New`;
  ctx.fillText('WASD / Arrow Keys to move', cx, cy + 100);
  ctx.fillText('One step per keypress = one turn', cx, cy + 125);
  
  const blink = Math.sin(animFrame * 0.08) > 0;
  if (blink) {
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(18, W * 0.025)}px Courier New`;
    ctx.fillText('Press ENTER to start', cx, cy + 180);
  }
}

function drawOverlay(text, subtext) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  
  const cx = W / 2, cy = H / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(36, W * 0.05)}px Courier New`;
  ctx.fillText(text, cx, cy - 20);
  
  ctx.font = `${Math.min(16, W * 0.022)}px Courier New`;
  ctx.fillStyle = '#aaa';
  ctx.fillText(subtext, cx, cy + 30);
}

function updateHUD() {
  if (gameState === 'playing' || gameState === 'dead') {
    hudEl.innerHTML = `Level ${level}/${maxLevel} | Lives: ${'♥'.repeat(lives)}${'♡'.repeat(Math.max(0,5-lives))} | Turn: ${turnCount}`;
  } else {
    hudEl.innerHTML = '';
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  
  if (gameState === 'start') {
    drawStartScreen();
  } else if (gameState === 'victory') {
    drawOverlay('YOU ESCAPED!', `All ${maxLevel} levels cleared! Press ENTER to play again.`);
  } else {
    drawMaze();
    if (gameState === 'levelComplete') {
      drawOverlay(`Level ${level} Complete!`, level >= maxLevel ? '' : 'Press ENTER for next level.');
    } else if (gameState === 'dead') {
      if (lives > 0) {
        drawOverlay('HUNTED!', `Lives remaining: ${lives} — Press any key to respawn.`);
      } else {
        drawOverlay('GAME OVER', 'Press ENTER to try again.');
      }
    }
  }
  
  updateHUD();
  animFrame++;
  requestAnimationFrame(render);
}

resize();
startLevel(1);
gameState = 'start';
render();
</script>
</body>
</html>
