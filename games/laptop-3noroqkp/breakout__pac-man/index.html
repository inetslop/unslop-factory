<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout Pac-Man</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sBounce() { playSound(440, 0.08, 'square', 0.08); }
function sBrick() { playSound(600, 0.1, 'square', 0.12); }
function sDot() { playSound(800, 0.05, 'sine', 0.06); }
function sPellet() { playSound(200, 0.3, 'sawtooth', 0.1); }
function sLose() { playSound(150, 0.5, 'sawtooth', 0.15); }
function sWin() { for(let i=0;i<5;i++) setTimeout(()=>playSound(400+i*100,0.15,'square',0.1), i*100); }

// Game state
let state = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let level = 1;
let frameCount = 0;

// Paddle (Pac-Man)
const paddle = { w: 60, h: 40, x: 0, y: 0, speed: 8 };

// Ball (Ghost)
let balls = [];
function createBall(x, y, dx, dy) {
    return { x, y, r: 10, dx: dx || 3, dy: dy || -3, speed: 4, color: '#ff0000', name: 'Blinky' };
}

// Bricks
let bricks = [];
const brickColors = ['#00bfff', '#1e90ff', '#4169e1', '#6495ed', '#7cb9ff'];

function initBricks() {
    bricks = [];
    const rows = 8;
    const cols = Math.floor((W - 120) / 50);
    const bw = (W - 120) / cols;
    const bh = 30;
    const startX = 60;
    const startY = 80;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            // Skip some bricks for maze-like pattern
            if (r === 3 && (c % 3 === 1)) continue;
            if (r === 5 && (c % 4 === 2)) continue;
            if (r === 0 && c === Math.floor(cols/2)) continue;
            bricks.push({ x: startX + c * bw, y: startY + r * bh, w: bw - 4, h: bh - 2, alive: true, row: r });
        }
    }
}

// Dots
let dots = [];
function initDots() {
    dots = [];
    for (let i = 0; i < 15; i++) {
        dots.push({ x: 80 + Math.random() * (W - 160), y: 200 + Math.random() * (H - 350), r: 4, alive: true });
    }
}

// Power Pellets
let pellets = [];
function initPellets() {
    pellets = [];
    for (let i = 0; i < 3; i++) {
        pellets.push({ x: 100 + Math.random() * (W - 200), y: 150 + Math.random() * (H - 400), r: 8, alive: true });
    }
}

// Winkie mode
let winkieTimer = 0;

// Particles
let particles = [];
function addParticles(x, y, color, count) {
    for (let i = 0; i < (count||5); i++) {
        particles.push({ x, y, dx: (Math.random()-0.5)*6, dy: (Math.random()-0.5)*6, life: 30, color });
    }
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (state === 'start' || state === 'gameover' || state === 'win') {
        initAudio();
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

let mouseX = null;
window.addEventListener('mousemove', e => { mouseX = e.clientX; });
window.addEventListener('click', e => {
    if (state === 'start' || state === 'gameover' || state === 'win') {
        initAudio();
        startGame();
    }
});

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    state = 'playing';
    resetLevel();
}

function resetLevel() {
    paddle.x = W / 2 - paddle.w / 2;
    paddle.y = H - 60;
    initBricks();
    initDots();
    initPellets();
    balls = [createBall(W/2, H - 120, (Math.random()>0.5?1:-1)*3, -4)];
    winkieTimer = 0;
    particles = [];
}

function nextBall() {
    const colors = ['#ff0000', '#ffc8ff', '#00ffff', '#ffff00'];
    const names = ['Blinky', 'Pinky', 'Inky', 'Clyde'];
    const idx = balls.length;
    balls.push(createBall(W/2, H - 120, (Math.random()-0.5)*4, -3 - Math.random()*2));
    if (balls.length <= 3) {
        balls[balls.length-1].color = colors[idx];
        balls[balls.length-1].name = names[idx];
    }
}

function update() {
    if (state !== 'playing') return;
    frameCount++;

    // Paddle movement
    if (keys['ArrowLeft'] || keys['a']) paddle.x -= paddle.speed;
    if (keys['ArrowRight'] || keys['d']) paddle.x += paddle.speed;
    if (mouseX !== null) {
        paddle.x += (mouseX - paddle.w/2 - paddle.x) * 0.3;
    }
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

    // Winkie timer
    if (winkieTimer > 0) winkieTimer--;

    // Update balls
    for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        b.x += b.dx;
        b.y += b.dy;

        // Wall bounce
        if (b.x - b.r < 0) { b.x = b.r; b.dx = Math.abs(b.dx); sBounce(); }
        if (b.x + b.r > W) { b.x = W - b.r; b.dx = -Math.abs(b.dx); sBounce(); }
        if (b.y - b.r < 0) { b.y = b.r; b.dy = Math.abs(b.dy); sBounce(); }

        // Paddle hit
        if (b.dy > 0 && b.y + b.r >= paddle.y && b.y + b.r <= paddle.y + paddle.h &&
            b.x >= paddle.x && b.x <= paddle.x + paddle.w) {
            b.y = paddle.y - b.r;
            const hitPos = (b.x - paddle.x) / paddle.w;
            b.dx = (hitPos - 0.5) * 8;
            b.dy = -Math.abs(b.dy);
            sBounce();
        }

        // Ball lost
        if (b.y + b.r > H) {
            balls.splice(i, 1);
            addParticles(b.x, H, '#ff0000', 8);
            sLose();
            if (balls.length === 0) {
                lives--;
                if (lives <= 0) { state = 'gameover'; }
                else { resetLevel(); }
            }
            continue;
        }

        // Brick collision
        for (let j = bricks.length - 1; j >= 0; j--) {
            const br = bricks[j];
            if (!br.alive) continue;
            if (b.x + b.r > br.x && b.x - b.r < br.x + br.w &&
                b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
                br.alive = false;
                score += 10;
                sBrick();
                addParticles(br.x + br.w/2, br.y + br.h/2, '#00bfff', 5);
                // Determine bounce direction
                const overlapX = Math.min(b.x + b.r - br.x, br.x + br.w - (b.x - b.r));
                const overlapY = Math.min(b.y + b.r - br.y, br.y + br.h - (b.y - b.r));
                if (overlapX < overlapY) { b.dx = -b.dx; } else { b.dy = -b.dy; }
            }
        }

        // Dot collision
        for (let d of dots) {
            if (!d.alive) continue;
            const dx = b.x - d.x, dy = b.y - d.y;
            if (Math.sqrt(dx*dx + dy*dy) < b.r + d.r + 5) {
                d.alive = false;
                score += 5;
                sDot();
                addParticles(d.x, d.y, '#ffff00', 3);
            }
        }

        // Pellet collision
        for (let p of pellets) {
            if (!p.alive) continue;
            const dx = b.x - p.x, dy = b.y - p.y;
            if (Math.sqrt(dx*dx + dy*dy) < b.r + p.r + 5) {
                p.alive = false;
                score += 25;
                winkieTimer = 180; // 3 seconds at 60fps
                sPellet();
                addParticles(p.x, p.y, '#ffff00', 8);
            }
        }

        // Check win
        if (bricks.every(br => !br.alive)) {
            level++;
            sWin();
            if (level > 3) { state = 'win'; }
            else { resetLevel(); nextBall(); }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawPacMan(x, y, w, h, mouthAngle) {
    ctx.save();
    ctx.translate(x + w/2, y + h/2);
    // Body
    ctx.beginPath();
    ctx.arc(0, 0, h/2, mouthAngle, Math.PI * 2 - mouthAngle);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fillStyle = '#ffff00';
    ctx.fill();
    // Eye glow
    ctx.beginPath();
    ctx.arc(-5, -8, 3, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.restore();
}

function drawGhost(b) {
    const x = b.x, y = b.y, r = b.r * 1.5;
    const color = winkieTimer > 0 ? '#2121de' : b.color;
    // Body
    ctx.beginPath();
    ctx.arc(x, y - r*0.3, r, Math.PI, 0);
    ctx.lineTo(x + r, y + r*0.5);
    // Wavy bottom
    for (let i = 2; i >= 0; i--) {
        const wx = x + r*(i - 1)/2 * 0.66 - r*0.33;
        ctx.quadraticCurveTo(wx, y + r*0.8, x + r*(i-1)*0.5 - r*0.25, y + r*0.4);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    // Eyes
    ctx.beginPath();
    ctx.arc(x - r*0.3, y - r*0.3, r*0.25, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + r*0.3, y - r*0.3, r*0.25, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    // Pupils
    ctx.beginPath();
    ctx.arc(x - r*0.25, y - r*0.25, r*0.1, 0, Math.PI*2);
    ctx.fillStyle = '#00f';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + r*0.35, y - r*0.25, r*0.1, 0, Math.PI*2);
    ctx.fillStyle = '#00f';
    ctx.fill();
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (state === 'start') {
        // Title
        ctx.fillStyle = '#ffff00';
        ctx.font = `bold ${Math.min(W/8, 60)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('BREAKOUT', W/2, H/3);
        ctx.fillStyle = '#ff0000';
        ctx.font = `bold ${Math.min(W/10, 45)}px monospace`;
        ctx.fillText('PAC-MAN', W/2, H/3 + 50);

        // Draw Pac-Man icon
        drawPacMan(W/2 - 30, H/2 - 10, 60, 50, 0.4 + Math.sin(frameCount*0.05)*0.3);

        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText('← → or A/D or Mouse to move', W/2, H/2 + 80);
        ctx.fillText('Break all the bricks!', W/2, H/2 + 110);
        ctx.fillStyle = '#00bfff';
        ctx.font = '22px monospace';
        const blink = Math.sin(frameCount * 0.05) > 0 ? 1 : 0.3;
        ctx.globalAlpha = blink;
        ctx.fillText('Press any key or click to start', W/2, H/2 + 160);
        ctx.globalAlpha = 1;
    } else if (state === 'playing') {
        // Bricks
        for (const br of bricks) {
            if (!br.alive) continue;
            const col = brickColors[br.row % brickColors.length];
            ctx.fillStyle = col;
            ctx.fillRect(br.x, br.y, br.w, br.h);
            // Brick border
            ctx.strokeStyle = '#005f8a';
            ctx.lineWidth = 2;
            ctx.strokeRect(br.x, br.y, br.w, br.h);
        }

        // Dots
        for (const d of dots) {
            if (!d.alive) continue;
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
            ctx.fillStyle = '#ffff00';
            ctx.fill();
        }

        // Pellets
        for (const p of pellets) {
            if (!p.alive) continue;
            const pulse = 1 + Math.sin(frameCount * 0.1) * 0.2;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * pulse, 0, Math.PI*2);
            ctx.fillStyle = '#ffff00';
            ctx.fill();
            ctx.strokeStyle = '#ff8800';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // Particles
        for (const p of particles) {
            ctx.globalAlpha = p.life / 30;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
            ctx.globalAlpha = 1;
        }

        // Paddle (Pac-Man)
        const mouthAngle = 0.3 + Math.sin(frameCount * 0.08) * 0.2;
        drawPacMan(paddle.x, paddle.y, paddle.w, paddle.h, mouthAngle);

        // Balls (Ghosts)
        for (const b of balls) {
            drawGhost(b);
        }

        // HUD
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SCORE: ${score}`, 20, 30);
        ctx.fillText(`LIVES: ${'👻'.repeat(lives)}`, 20, 55);
        ctx.textAlign = 'right';
        ctx.fillText(`LEVEL: ${level}`, W - 20, 30);
        if (winkieTimer > 0) {
            ctx.fillStyle = '#2121de';
            ctx.font = 'bold 14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`WINKIE! ${Math.ceil(winkieTimer/60)}s`, W/2, 30);
        }

    } else if (state === 'gameover') {
        ctx.fillStyle = '#ff0000';
        ctx.font = `bold ${Math.min(W/8, 55)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H/3);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W/2, H/3 + 60);
        ctx.fillStyle = '#00bfff';
        const blink = Math.sin(frameCount * 0.05) > 0 ? 1 : 0.3;
        ctx.globalAlpha = blink;
        ctx.fillText('Press any key to restart', W/2, H/3 + 120);
        ctx.globalAlpha = 1;
    } else if (state === 'win') {
        ctx.fillStyle = '#00ff00';
        ctx.font = `bold ${Math.min(W/8, 55)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('YOU WIN!', W/2, H/3);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W/2, H/3 + 60);
        ctx.fillStyle = '#ffff00';
        const blink = Math.sin(frameCount * 0.05) > 0 ? 1 : 0.3;
        ctx.globalAlpha = blink;
        ctx.fillText('Press any key to play again', W/2, H/3 + 120);
        ctx.globalAlpha = 1;
    }
}

function loop() {
    frameCount++;
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
