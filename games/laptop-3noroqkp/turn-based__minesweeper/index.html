<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#1a1a2e;color:#eee}
#app{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
#startScreen,#endScreen{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;z-index:100;transition:opacity .4s}
#startScreen h1{font-size:clamp(2rem,5vw,3.5rem);color:#f39c12;text-shadow:0 0 20px rgba(243,156,18,.4);margin-bottom:20px;letter-spacing:4px}
#startScreen .sub{font-size:clamp(.9rem,2vw,1.1rem);color:#aaa;margin-bottom:30px;text-align:center;max-width:500px;line-height:1.6}
.btn{padding:12px 32px;font-size:1.1rem;background:#f39c12;color:#1a1a2e;border:none;border-radius:8px;cursor:pointer;font-weight:700;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(243,156,18,.4)}
#endScreen{display:none;z-index:200;background:rgba(26,26,46,.95)}
#endScreen h2{font-size:clamp(1.5rem,4vw,2.5rem);margin-bottom:10px}
#endScreen .stats{font-size:1.1rem;color:#ccc;margin-bottom:25px;text-align:center;line-height:1.8}
#topBar{display:flex;gap:20px;align-items:center;margin-bottom:8px;padding:8px 16px;background:#16213e;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.hud{font-size:clamp(.9rem,2vw,1.1rem);font-weight:700;color:#f39c12;min-width:80px;text-align:center}
#resetBtn{background:#e74c3c;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:1rem;transition:transform .15s}
#resetBtn:hover{transform:scale(1.05)}
#boardWrap{position:relative}
#board{display:grid;gap:0;border:4px solid #16213e;border-radius:4px;overflow:hidden;user-select:none}
.cell{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.55);font-weight:700;background:#2a2a4a;cursor:pointer;transition:background .1s;border:1px solid #3a3a5a;position:relative}
.cell:hover{background:#3a3a5e}
.cell.revealed{background:#1e1e36;cursor:default}
.cell.revealed:hover{background:#1e1e36}
.cell.mine-hit{background:#e74c3c!important;animation:pulse .3s ease}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.n1{color:#5dade2}.n2{color:#58d68d}.n3{color:#ec7063}.n4{color:#b03a2e}.n5{color:#9a4499}.n6{color:#48c9b0}.n7{color:#eee}.n8{color:#888}
.cell .flag{font-size:calc(var(--cell)*.5)}
.turn-flash{animation:turnFlash .3s ease}
@keyframes turnFlash{0%{box-shadow:inset 0 0 12px rgba(243,156,18,.6)}100%{box-shadow:none}}
</style>
</head>
<body>
<div id="app">
  <div id="topBar">
    <span class="hud" id="flagCount">🚩 0/10</span>
    <button id="resetBtn">⟳ New</button>
    <span class="hud" id="timer">⏱ 0s</span>
    <span class="hud" id="turnCount">Turn: 0</span>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
</div>
<div id="startScreen">
  <h1>⛏ MINESWEEPER</h1>
  <div class="sub">
    A turn-based grid puzzle. Each turn, you reveal a cell or place a flag.<br><br>
    <b>Left Click</b> – Reveal a cell<br>
    <b>Right Click</b> – Place / Remove flag<br>
    <b>Middle / Shift+Click</b> – Chord (reveal around a number)<br><br>
    Clear all safe cells to win. Hit a mine and it's game over!
  </div>
  <button class="btn" id="startBtn">▶ Start Game</button>
</div>
<div id="endScreen">
  <h2 id="endTitle"></h2>
  <div class="stats" id="endStats"></div>
  <button class="btn" id="restartBtn">↻ Play Again</button>
</div>
<script>
(function(){
const ROWS=9,COLS=9,MINES=10;
let grid=[],revealedCount=0,flagCount=0,turns=0,timerId=null,elapsed=0,gameActive=false,started=false;
const boardEl=document.getElementById('board');
const flagEl=document.getElementById('flagCount');
const timerEl=document.getElementById('timer');
const turnEl=document.getElementById('turnCount');
const startScreen=document.getElementById('startScreen');
const endScreen=document.getElementById('endScreen');
const endTitle=document.getElementById('endTitle');
const endStats=document.getElementById('endStats');

function sizeBoard(){
  const wrap=document.getElementById('boardWrap');
  const maxW=window.innerWidth-40;
  const maxH=window.innerHeight-120;
  const cell=Math.floor(Math.min(maxW/COLS,maxH/ROWS));
  const sz=Math.max(28,Math.min(cell,52));
  document.documentElement.style.setProperty('--cell',sz+'px');
  boardEl.style.gridTemplateColumns=`repeat(${COLS},${sz}px)`;
  boardEl.style.gridTemplateRows=`repeat(${ROWS},${sz}px)`;
}

function initBoard(){
  grid=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++){grid[r][c]={mine:false,revealed:false,flagged:false,adj:0}}}
  revealedCount=0;flagCount=0;turns=0;elapsed=0;gameActive=true;started=false;
  timerEl.textContent='⏱ 0s';flagEl.textContent='🚩 0/'+MINES;turnEl.textContent='Turn: 0';
  stopTimer();
}

function placeMines(safeR,safeC){
  const safeZone=[];
  for(let r=Math.max(0,safeR-1);r<=Math.min(ROWS-1,safeR+1);r++)
    for(let c=Math.max(0,safeC-1);c<=Math.min(COLS-1,safeC+1);c++) safeZone.push(r*COLS+c);
  const cells=[];
  for(let i=0;i<ROWS*COLS;i++){if(!safeZone.includes(i))cells.push(i)}
  let placed=0;
  while(placed<MINES){
    const idx=Math.floor(Math.random()*cells.length);
    const pos=cells[idx];
    if(!grid[Math.floor(pos/COLS)][pos%COLS].mine){
      grid[Math.floor(pos/COLS)][pos%COLS].mine=true;placed++;
      cells.splice(idx,1);
    }
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    let a=0;
    forNeighbors(r,c,(nr,nc)=>{if(grid[nr][nc].mine)a++});
    grid[r][c].adj=a;
  }
}

function forNeighbors(r,c,fn){
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS)fn(nr,nc);
  }
}

function render(){
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');
    cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;
    if(grid[r][c].revealed){
      cell.classList.add('revealed');
      if(grid[r][c].mine)cell.textContent='💣';
      else if(grid[r][c].adj>0){cell.textContent=grid[r][c].adj;cell.classList.add('n'+grid[r][c].adj)}
    }else if(grid[r][c].flagged){
      cell.innerHTML='<span class="flag">🚩</span>';
    }
    boardEl.appendChild(cell);
  }
}

function startTimer(){if(!timerId){elapsed=0;timerId=setInterval(()=>{elapsed++;timerEl.textContent='⏱ '+elapsed+'s'},1000)}}
function stopTimer(){clearInterval(timerId);timerId=null}

function doReveal(r,c){
  if(grid[r][c].revealed||grid[r][c].flagged)return;
  grid[r][c].revealed=true;revealedCount++;
  const cellEl=boardEl.children[r*COLS+c];cellEl.classList.add('turn-flash');
  setTimeout(()=>cellEl.classList.remove('turn-flash'),300);
  if(grid[r][c].mine){
    gameActive=false;stopTimer();
    for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++){if(grid[rr][cc].mine)grid[rr][cc].revealed=true}
    render();
    endTitle.textContent='💥 BOOM!';endTitle.style.color='#e74c3c';
    endStats.innerHTML=`Time: ${elapsed}s<br>Turns: ${turns}<br>Cleared: ${revealedCount}/${ROWS*COLS-MINES}`;
    endScreen.style.display='flex';
    return;
  }
  if(grid[r][c].adj===0){
    forNeighbors(r,c,(nr,nc)=>{if(!grid[nr][nc].revealed&&!grid[nr][nc].flagged)doReveal(nr,nc)});
  }
  render();
  checkWin();
}

function chord(r,c){
  if(grid[r][c].revealed||grid[r][c].adj===0)return;
  let flags=0;const targets=[];
  forNeighbors(r,c,(nr,nc)=>{if(grid[nr][nc].flagged)flags++;else if(!grid[nr][nc].revealed)targets.push([nr,nc])});
  if(flags===grid[r][c].adj&&targets.length>0){
    let hit=false;
    for(const[tr,tc]of targets){if(grid[tr][tc].mine){hit=true;break}}
    if(!hit){for(const[tr,tc]of targets)doReveal(tr,tc)}
  }
}

function handleCell(r,c,btn,e){
  if(!gameActive)return;
  e.preventDefault();
  const action=btn===2?'flag':(e.shiftKey&&grid[r][c].revealed&&grid[r][c].adj>0)?'chord':'reveal';
  if(action==='flag'){
    if(grid[r][c].revealed)return;
    turns++;turnEl.textContent='Turn: '+turns;
    grid[r][c].flagged=!grid[r][c].flagged;
    flagCount+=grid[r][c].flagged?1:-1;
    flagEl.textContent='🚩 '+Math.max(0,flagCount)+'/'+MINES;
    render();
  }else if(action==='chord'){
    turns++;turnEl.textContent='Turn: '+turns;
    chord(r,c);
  }else{
    if(grid[r][c].flagged||grid[r][c].revealed)return;
    if(!started){placeMines(r,c);started=true;startTimer()}
    turns++;turnEl.textContent='Turn: '+turns;
    doReveal(r,c);
  }
}

function checkWin(){
  if(revealedCount===ROWS*COLS-MINES){
    gameActive=false;stopTimer();
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(grid[r][c].mine&&!grid[r][c].flagged)grid[r][c].flagged=true}
    render();
    endTitle.textContent='🏆 YOU WIN!';endTitle.style.color='#58d68d';
    endStats.innerHTML=`Time: ${elapsed}s<br>Turns: ${turns}<br>All safe cells cleared!`;
    endScreen.style.display='flex';
  }
}

function newGame(){
  initBoard();render();endScreen.style.display='none';
}

boardEl.addEventListener('mousedown',e=>{
  const cell=e.target.closest('.cell');if(!cell)return;
  handleCell(+cell.dataset.r,+cell.dataset.c,e.button===2?2:0,e);
});
boardEl.addEventListener('contextmenu',e=>e.preventDefault());

document.getElementById('startBtn').addEventListener('click',()=>{
  startScreen.style.display='none';newGame();
  if(!window.__audioInit){
    try{
      const ctx=new(window.AudioContext||webkitAudioContext)();
      window.__audioCtx=ctx;window.__audioInit=true;
    }catch(e){}
  }
});
document.getElementById('restartBtn').addEventListener('click',()=>{newGame()});
document.getElementById('resetBtn').addEventListener('click',()=>{if(gameActive)newGame()});

function beep(freq,dur,vol){
  if(!window.__audioCtx)return;
  try{
    const ctx=window.__audioCtx;if(ctx.state==='suspended')ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=freq;o.type='sine';
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
    o.start();o.stop(ctx.currentTime+dur);
  }catch(e){}
}

const _origDoReveal=doReveal;
doReveal=function(r,c){
  if(grid[r][c].mine){beep(80,.4,.3)}
  _origDoReveal(r,c);
};

window.addEventListener('resize',sizeBoard);
sizeBoard();initBoard();render();
})();
</script>
</body>
</html>
