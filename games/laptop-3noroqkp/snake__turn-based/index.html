<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Royale - Turn-Based</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            color: #eee;
        }
        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #333;
            border-radius: 4px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 8px 16px;
            background: #16213e;
            border-radius: 4px 4px 0 0;
            font-size: 14px;
        }
        .hud-item { text-align: center; }
        .hud-label { color: #888; font-size: 11px; text-transform: uppercase; }
        .hud-value { color: #fff; font-size: 16px; font-weight: bold; }
        #startScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.95);
            z-index: 10;
        }
        #startScreen h1 {
            font-size: 36px;
            color: #4ecca3;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(78, 204, 163, 0.5);
        }
        #startScreen p {
            color: #aaa;
            font-size: 14px;
            margin: 4px 0;
        }
        .controls-box {
            background: #16213e;
            padding: 16px 24px;
            border-radius: 8px;
            margin: 16px 0;
            text-align: center;
        }
        .key-hint {
            display: inline-block;
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            margin: 0 2px;
        }
        button {
            background: #4ecca3;
            color: #1a1a2e;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 16px;
            transition: all 0.2s;
        }
        button:hover { background: #3db892; transform: scale(1.05); }
        #endScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 46, 0.9);
            z-index: 10;
        }
        #endScreen h2 { font-size: 32px; margin-bottom: 16px; }
        #endScreen .result { color: #4ecca3; }
        #endScreen .lose { color: #e94560; }
        #turnIndicator {
            padding: 4px 12px;
            background: #16213e;
            border-radius: 0 0 4px 4px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
        .alive-badge { color: #4ecca3; }
        .dead-badge { color: #e94560; text-decoration: line-through; }
    </style>
</head>
<body>
<div id="gameContainer">
    <div id="hud">
        <div class="hud-item"><div class="hud-label">YOU</div><div class="hud-value" id="playerLen">1</div></div>
        <div class="hud-item"><div class="hud-label">TURN</div><div class="hud-value" id="turnNum">0</div></div>
        <div class="hud-item"><div class="hud-label">ALIVE</div><div class="hud-value" id="aliveCount">4</div></div>
        <div class="hud-item"><div class="hud-label">RANK</div><div class="hud-value" id="rankNum">#1</div></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="turnIndicator">Use WASD/Arrows to move each turn</div>
    <div id="startScreen">
        <h1>SNAKE ROYALE</h1>
        <p>Turn-based competitive snake survival</p>
        <div class="controls-box">
            <p><span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> or <span class="key-hint">&uarr;</span><span class="key-hint">&larr;</span><span class="key-hint">&darr;</span><span class="key-hint">&rarr;</span></p>
            <p style="margin-top:8px">Move your snake one step per turn</p>
            <p>Eat food to grow. Avoid walls & other snakes!</p>
            <p>Be the last snake standing!</p>
        </div>
        <button id="startBtn">START GAME</button>
    </div>
    <div id="endScreen">
        <h2 id="endTitle"></h2>
        <p id="endStats" style="color:#aaa;margin-bottom:16px;"></p>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>
</div>

<script>
const GRID_W = 20, GRID_H = 18;
let cellSize, canvas, ctx;
let gameRunning = false;
let animFrame = null;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'eat') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.15);
        osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
    } else if (type === 'move') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }
}

let snakes = [];
let food = [];
let turn = 0;
let foodsEaten = 0;

function resize() {
    const maxW = window.innerWidth - 20;
    const maxH = window.innerHeight - 80;
    cellSize = Math.floor(Math.min(maxW / GRID_W, maxH / GRID_H));
    if (cellSize < 10) cellSize = 10;
    canvas.width = GRID_W * cellSize;
    canvas.height = GRID_H * cellSize;
}

function init() {
    resize();
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    snakes = [
        { id: 0, name: 'YOU', color: '#4ecca3', cells: [{x: 3, y: 9}], dir: {x:1,y:0}, alive: true },
        { id: 1, name: 'RED', color: '#e94560', cells: [{x: 16, y: 9}], dir: {x:-1,y:0}, alive: true },
        { id: 2, name: 'BLU', color: '#53a8f5', cells: [{x: 9, y: 3}], dir: {x:0,y:1}, alive: true },
        { id: 3, name: 'GOL', color: '#ffd700', cells: [{x: 9, y: 14}], dir: {x:0,y:-1}, alive: true }
    ];
    
    food = [];
    for (let i = 0; i < 5; i++) spawnFood();
    turn = 0;
    foodsEaten = 0;
    gameRunning = true;
    updateHUD();
    render();
}

function spawnFood() {
    let fx, fy, tries = 0;
    do {
        fx = Math.floor(Math.random() * GRID_W);
        fy = Math.floor(Math.random() * GRID_H);
        tries++;
    } while (tries < 200 && isOccupied(fx, fy));
    
    // Find empty spot
    if (tries >= 200) {
        for (let i = 0; i < 500; i++) {
            const rx = Math.floor(Math.random() * GRID_W);
            const ry = Math.floor(Math.random() * GRID_H);
            if (!isOccupied(rx, ry)) { fx = rx; fy = ry; break; }
        }
    }
    food.push({x: fx, y: fy});
}

function isOccupied(x, y) {
    for (let s of snakes) {
        for (let c of s.cells) {
            if (c.x === x && c.y === y) return true;
        }
    }
    for (let f of food) {
        if (f.x === x && f.y === y) return true;
    }
    return false;
}

function getOccupiedSet() {
    const set = new Set();
    for (let s of snakes) {
        for (let c of s.cells) {
            set.add(c.x + ',' + c.y);
        }
    }
    return set;
}

function aiMove(snake, occupiedSet) {
    const head = snake.cells[0];
    const dirs = [
        {x:1,y:0}, {x:-1,y:0}, {x:0,y:1}, {x:0,y:-1}
    ];
    
    // Prioritize: food > safe move > any
    let bestDir = null;
    let bestScore = -Infinity;
    
    for (let d of dirs) {
        const nx = head.x + d.x;
        const ny = head.y + d.y;
        
        // Wall check
        if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
        // Self collision (check against body excluding tail which will move)
        const key = nx + ',' + ny;
        const isSelf = snake.cells.some((c, i) => i === 0 ? false : c.x === nx && c.y === ny);
        if (isSelf) continue;
        // Other snake collision
        if (occupiedSet.has(key)) {
            // Check if it's this snake's own tail (which will move away)
            const isOwnTail = snake.cells.length > 1 && 
                snake.cells[snake.cells.length-1].x === nx && 
                snake.cells[snake.cells.length-1].y === ny;
            if (!isOwnTail) continue;
        }
        
        let score = Math.random() * 0.5;
        // Prefer food
        for (let f of food) {
            if (f.x === nx && f.y === ny) score += 100;
        }
        // Avoid getting too close to walls
        const wallDist = Math.min(nx, ny, GRID_W-1-nx, GRID_H-1-ny);
        score += wallDist * 2;
        // Slight preference for current direction
        if (d.x === snake.dir.x && d.y === snake.dir.y) score += 3;
        
        if (score > bestScore) {
            bestScore = score;
            bestDir = d;
        }
    }
    
    if (!bestDir) {
        // No safe moves - pick any non-wall direction to die
        for (let d of dirs) {
            const nx = head.x + d.x;
            const ny = head.y + d.y;
            if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
                bestDir = d;
                break;
            }
        }
    }
    
    if (!bestDir) bestDir = {x:0, y:0}; // stuck in corner
    return bestDir;
}

function doTurn() {
    if (!gameRunning) return;
    turn++;
    
    const occupiedSet = getOccupiedSet();
    
    // Determine all moves simultaneously
    let moves = [];
    for (let s of snakes) {
        if (!s.alive) continue;
        let dir;
        if (s.id === 0) {
            // Player direction set by key press
            dir = playerDir;
        } else {
            dir = aiMove(s, occupiedSet);
        }
        moves.push({snake: s, dir});
    }
    
    // Apply all moves simultaneously
    let ateFood = [];
    for (let m of moves) {
        const s = m.snake;
        const head = s.cells[0];
        const nx = head.x + m.dir.x;
        const ny = head.y + m.dir.y;
        
        // Check wall
        if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) {
            killSnake(s);
            continue;
        }
        
        // Move: add new head, remove tail (unless growing)
        s.cells.unshift({x: nx, y: ny});
        
        // Check food
        let ate = false;
        for (let i = food.length - 1; i >= 0; i--) {
            if (food[i].x === nx && food[i].y === ny) {
                food.splice(i, 1);
                ate = true;
                ateFood.push(s.id);
            }
        }
        
        // Check collision with other snakes (new head position)
        let died = false;
        for (let other of moves) {
            if (other.snake === s) continue;
            if (!other.snake.alive) continue;
            const oh = other.snake.cells[0];
            // Check if other's new head is at our old or new position... 
            // Actually check: does our new head hit any part of other snake (excluding its tail)
        }
        
        // Don't remove tail if ate food
        if (!ate) {
            s.cells.pop();
        }
    }
    
    // After all moves, check collisions
    for (let m of moves) {
        const s = m.snake;
        if (!s.alive) continue;
        const head = s.cells[0];
        
        // Check against all other snakes' bodies
        for (let other of snakes) {
            if (other === s || !other.alive) continue;
            for (let i = 0; i < other.cells.length; i++) {
                const c = other.cells[i];
                if (c.x === head.x && c.y === head.y) {
                    // Death!
                    killSnake(s);
                    died = true;
                    break;
                }
            }
            if (died) break;
        }
        
        if (!s.alive) continue;
        
        // Check self collision (head hitting own body, not tail since it moved)
        for (let i = 1; i < s.cells.length; i++) {
            if (s.cells[i].x === head.x && s.cells[i].y === head.y) {
                killSnake(s);
                break;
            }
        }
    }
    
    // Spawn food if needed
    if (food.length < 5) spawnFood();
    
    if (ateFood.length > 0) {
        playSound('eat');
        if (ateFood.includes(0)) foodsEaten++;
    }
    
    updateHUD();
    checkGameEnd();
    render();
}

function killSnake(s) {
    s.alive = false;
    playSound('die');
}

function checkGameEnd() {
    const aliveCount = snakes.filter(s => s.alive).length;
    if (aliveCount <= 1) {
        gameRunning = false;
        showEndScreen();
    }
}

function showEndScreen() {
    const playerAlive = snakes[0].alive;
    const endTitle = document.getElementById('endTitle');
    const endStats = document.getElementById('endStats');
    
    if (playerAlive) {
        endTitle.textContent = '🏆 VICTORY!';
        endTitle.className = 'result';
    } else {
        endTitle.textContent = '💀 ELIMINATED';
        endTitle.className = 'lose';
    }
    
    const rank = snakes.filter(s => s.alive && s.id === 0).length > 0 ? 1 : 
        snakes.filter(s => s.cells.length >= snakes[0].cells.length).length;
    
    endStats.textContent = `Turns: ${turn} | Length: ${snakes[0].cells.length} | Food Eaten: ${foodsEaten}`;
    document.getElementById('endScreen').style.display = 'flex';
    if (playerAlive) playSound('win');
}

function updateHUD() {
    const aliveCount = snakes.filter(s => s.alive).length;
    document.getElementById('turnNum').textContent = turn;
    document.getElementById('aliveCount').textContent = aliveCount;
    
    // Rank
    const sorted = [...snakes].sort((a, b) => b.cells.length - a.cells.length);
    let rank = 0;
    for (let i = 0; i < sorted.length; i++) {
        if (!sorted[i].alive) continue;
        rank++;
        if (sorted[i].id === 0) break;
    }
    document.getElementById('rankNum').textContent = snakes[0].alive ? '#' + rank : '💀';
    
    // Player length
    const pl = document.getElementById('playerLen');
    pl.textContent = snakes[0].cells.length;
    pl.style.color = snakes[0].alive ? '#4ecca3' : '#e94560';
}

function render() {
    if (!ctx) return;
    
    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= GRID_W; x++) {
        ctx.beginPath();
        ctx.moveTo(x * cellSize, 0);
        ctx.lineTo(x * cellSize, canvas.height);
        ctx.stroke();
    }
    for (let y = 0; y <= GRID_H; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * cellSize);
        ctx.lineTo(canvas.width, y * cellSize);
        ctx.stroke();
    }
    
    // Food
    for (let f of food) {
        const fx = f.x * cellSize + cellSize / 2;
        const fy = f.y * cellSize + cellSize / 2;
        ctx.fillStyle = '#ff6b35';
        ctx.beginPath();
        ctx.arc(fx, fy, cellSize * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,107,53,0.3)';
        ctx.beginPath();
        ctx.arc(fx, fy, cellSize * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Snakes
    for (let s of snakes) {
        if (!s.alive) continue;
        
        // Body
        for (let i = s.cells.length - 1; i >= 0; i--) {
            const c = s.cells[i];
            const px = c.x * cellSize;
            const py = c.y * cellSize;
            
            let color = s.color;
            if (i === 0) {
                // Head - brighter
                ctx.fillStyle = color;
            } else {
                // Body with slight fade
                const alpha = Math.max(0.4, 1 - i * 0.05);
                ctx.fillStyle = s.color + '';
                ctx.globalAlpha = alpha;
            }
            
            const pad = 1;
            const r = cellSize >= 16 ? 3 : 2;
            roundRect(ctx, px + pad, py + pad, cellSize - pad * 2, cellSize - pad * 2, r);
            ctx.fill();
            ctx.globalAlpha = 1;
            
            if (i === 0) {
                // Eyes
                const ex = px + cellSize / 2;
                const ey = py + cellSize / 2;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ex - 3, ey - 1, 2, 0, Math.PI * 2);
                ctx.arc(ex + 3, ey - 1, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
    
    // Dead snake markers
    for (let s of snakes) {
        if (s.alive) continue;
        const c = s.cells[0];
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = `${Math.floor(cellSize * 0.6)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✕', c.x * cellSize + cellSize/2, c.y * cellSize + cellSize/2);
    }
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

let playerDir = {x: 1, y: 0};
let queuedDir = null;

window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;
    
    let d = null;
    switch(e.key) {
        case 'w': case 'W': case 'ArrowUp': d = {x:0, y:-1}; break;
        case 's': case 'S': case 'ArrowDown': d = {x:0, y:1}; break;
        case 'a': case 'A': case 'ArrowLeft': d = {x:-1, y:0}; break;
        case 'd': case 'D': case 'ArrowRight': d = {x:1, y:0}; break;
        case ' ': case 'Enter': 
            // Space/Enter to confirm turn
            doTurn();
            return;
    }
    
    if (d) {
        e.preventDefault();
        // Can't reverse direction
        if (d.x === -playerDir.x && d.y === -playerDir.y) return;
        playerDir = d;
        playSound('move');
        doTurn();
    }
});

document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    document.getElementById('startScreen').style.display = 'none';
    init();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('endScreen').style.display = 'none';
    init();
});

window.addEventListener('resize', () => {
    resize();
    render();
});

// Initial setup
canvas = document.getElementById('gameCanvas');
ctx = canvas.getContext('2d');
resize();
render();
</script>
</body>
</html>
