<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
canvas {
  display: block;
}
#hud {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #4ff;
  font-size: 16px;
  text-align: center;
  text-shadow: 0 0 10px #4ff;
}
#progress-bar {
  position: absolute;
  top: 35px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 8px;
  background: #1a1a2e;
  border: 1px solid #4ff;
  border-radius: 4px;
  overflow: hidden;
}
#progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4ff, #8f);
  width: 0%;
  transition: width 0.2s;
}
#start-screen, #win-screen, #lose-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,26,0.95);
  z-index: 10;
}
#start-screen h1 {
  font-size: 48px;
  color: #4ff;
  text-shadow: 0 0 20px #4ff;
  margin-bottom: 20px;
}
.screen-text {
  color: #aef;
  font-size: 16px;
  text-align: center;
  line-height: 1.8;
  max-width: 400px;
}
.btn {
  margin-top: 25px;
  padding: 12px 30px;
  background: transparent;
  border: 2px solid #4ff;
  color: #4ff;
  font-size: 18px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover {
  background: rgba(68,255,255,0.1);
  box-shadow: 0 0 15px #4ff;
}
#win-screen h2, #lose-screen h2 {
  font-size: 36px;
  text-shadow: 0 0 15px currentColor;
  margin-bottom: 15px;
}
#win-screen h2 { color: #4f8; }
#lose-screen h2 { color: #f44; }
.hidden { display: none !important; }
#moves-display {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: #8af;
  font-size: 14px;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="hud">Level: <span id="level-num">1</span></div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <canvas id="canvas"></canvas>
  <div id="moves-display">Moves: <span id="move-count">0</span></div>

  <div id="start-screen">
    <h1>Puzzle Snake</h1>
    <div class="screen-text">
      Guide the snake to fill every cell on the board.<br>
      Use <b>Arrow Keys</b> (or WASD) to move one step at a time.<br>
      The snake cannot reverse direction.<br>
      Fill all cells to win — don't hit walls or yourself!
    </div>
    <button class="btn" id="start-btn">Start Game</button>
  </div>

  <div id="win-screen" class="hidden">
    <h2>Level Complete!</h2>
    <div class="screen-text" id="win-stats"></div>
    <button class="btn" id="next-btn">Next Level</button>
  </div>

  <div id="lose-screen" class="hidden">
    <h2>Game Over</h2>
    <div class="screen-text">The snake hit a wall or itself!</div>
    <button class="btn" id="retry-btn">Retry Level</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cellSize, gridSize, offsetX, offsetY;
let snake = [];
let filled = new Set();
let moves = 0;
let level = 1;
let maxLevel = 5;
let gameActive = false;
let solutionPath = [];
let audioCtx = null;

const levels = [
  { size: 4 },
  { size: 6 },
  { size: 8 },
  { size: 10 },
  { size: 12 }
];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || webkitAudioContext)();
  }
}

function playTone(freq, dur, type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playMove() { playTone(440, 0.08, 'sine'); }
function playWin() { playTone(523, 0.15); setTimeout(()=>playTone(659, 0.15), 100); setTimeout(()=>playTone(784, 0.3), 200); }
function playLose() { playTone(200, 0.3, 'sawtooth'); }

function generatePath(size) {
  const path = [];
  for (let row = 0; row < size; row++) {
    if (row % 2 === 0) {
      for (let col = 0; col < size; col++) path.push([col, row]);
    } else {
      for (let col = size - 1; col >= 0; col--) path.push([col, row]);
    }
  }
  return path;
}

function startLevel(lvl) {
  const cfg = levels[lvl - 1];
  gridSize = cfg.size;
  solutionPath = generatePath(gridSize);
  
  // Calculate sizing
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  
  cellSize = Math.min((W - 40) / gridSize, (H - 120) / gridSize);
  offsetX = Math.floor((W - gridSize * cellSize) / 2);
  offsetY = Math.floor((H - gridSize * cellSize) / 2) + 30;
  
  // Initialize snake at start position
  const startCol = solutionPath[0][0];
  const startRow = solutionPath[0][1];
  snake = [{ col: startCol, row: startRow }];
  filled = new Set();
  filled.add(startCol + ',' + startRow);
  moves = 0;
  gameActive = true;
  
  document.getElementById('level-num').textContent = lvl;
  document.getElementById('move-count').textContent = '0';
  updateProgress();
  draw();
}

function getHead() { return snake[0]; }

function canMove(dc, dr) {
  const head = getHead();
  const nc = head.col + dc;
  const nr = head.row + dr;
  
  // Wall check
  if (nc < 0 || nc >= gridSize || nr < 0 || nr >= gridSize) return false;
  
  // Self-collision check
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].col === nc && snake[i].row === nr) return false;
  }
  
  // No reverse check: can't go back to the cell we just came from
  if (snake.length > 1) {
    const neck = snake[1];
    if (neck.col === nc && neck.row === nr) return false;
  }
  
  return true;
}

function move(dc, dr) {
  if (!gameActive) return;
  
  if (!canMove(dc, dr)) {
    gameLose();
    return;
  }
  
  const head = getHead();
  const nc = head.col + dc;
  const nr = head.row + dr;
  
  snake.unshift({ col: nc, row: nr });
  filled.add(nc + ',' + nr);
  moves++;
  
  document.getElementById('move-count').textContent = moves;
  playMove();
  updateProgress();
  draw();
  
  if (filled.size === gridSize * gridSize) {
    gameWin();
  }
}

function updateProgress() {
  const pct = Math.floor((filled.size / (gridSize * gridSize)) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function gameWin() {
  gameActive = false;
  playWin();
  document.getElementById('win-screen').classList.remove('hidden');
  const optimal = (gridSize * gridSize) - 1;
  document.getElementById('win-stats').textContent = 
    `Filled ${gridSize*gridSize} cells in ${moves} moves!` +
    `\nOptimal: ${optimal} moves.` +
    `\nEfficiency: ${Math.floor((optimal/moves)*100)}%`;
}

function gameLose() {
  gameActive = false;
  playLose();
  document.getElementById('lose-screen').classList.remove('hidden');
  draw();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  
  // Draw grid background
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const x = offsetX + c * cellSize;
      const y = offsetY + r * cellSize;
      
      if (filled.has(c + ',' + r)) {
        // Filled cell
        const gradient = ctx.createLinearGradient(x, y, x + cellSize, y + cellSize);
        gradient.addColorStop(0, '#1a4a3a');
        gradient.addColorStop(1, '#0d2e22');
        ctx.fillStyle = gradient;
      } else {
        ctx.fillStyle = '#0f0f2a';
      }
      
      ctx.fillRect(x + 1, y + 1, cellSize - 2, cellSize - 2);
      
      // Grid lines
      ctx.strokeStyle = 'rgba(68,255,255,0.1)';
      ctx.strokeRect(x, y, cellSize, cellSize);
    }
  }
  
  // Draw solution path hint (subtle dots on unfilled cells that are part of the next few steps)
  for (let i = 0; i < Math.min(5, solutionPath.length); i++) {
    const [pc, pr] = solutionPath[filled.size + i];
    if (!filled.has(pc + ',' + pr)) {
      const px = offsetX + pc * cellSize + cellSize / 2;
      const py = offsetY + pr * cellSize + cellSize / 2;
      ctx.fillStyle = 'rgba(68,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Draw snake body (tail to head)
  for (let i = snake.length - 1; i >= 0; i--) {
    const seg = snake[i];
    const x = offsetX + seg.col * cellSize;
    const y = offsetY + seg.row * cellSize;
    
    const t = 1 - i / Math.max(snake.length, 1);
    const r = Math.floor(40 + t * 20);
    const g = Math.floor(200 + t * 55);
    const b = Math.floor(80 + t * 155);
    
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    const pad = 3;
    const radius = 6;
    roundRect(ctx, x + pad, y + pad, cellSize - pad*2, cellSize - pad*2, radius);
    ctx.fill();
    
    // Glow on head
    if (i === 0) {
      ctx.shadowColor = '#4ff';
      ctx.shadowBlur = 15;
      roundRect(ctx, x + pad, y + pad, cellSize - pad*2, cellSize - pad*2, radius);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Eyes
      const head = getHead();
      let eyeDx = 0, eyeDy = 0;
      if (snake.length > 1) {
        const neck = snake[1];
        eyeDx = (head.col - neck.col) * 3;
        eyeDy = (head.row - neck.row) * 3;
      }
      const ex = x + cellSize/2 + eyeDx;
      const ey = y + cellSize/2 + eyeDy;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ex - 5, ey - 5, 3, 0, Math.PI*2);
      ctx.arc(ex + 5, ey - 5, 3, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function showScreen(id) {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('win-screen').classList.add('hidden');
  document.getElementById('lose-screen').classList.add('hidden');
  if (id) document.getElementById(id).classList.remove('hidden');
}

// Input
window.addEventListener('keydown', (e) => {
  if (!gameActive) return;
  initAudio();
  
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': e.preventDefault(); move(0, -1); break;
    case 'ArrowDown': case 's': case 'S': e.preventDefault(); move(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); move(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); move(1, 0); break;
  }
});

// Buttons
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  showScreen(null);
  startLevel(1);
});

document.getElementById('next-btn').addEventListener('click', () => {
  if (level < maxLevel) {
    level++;
    showScreen(null);
    startLevel(level);
  } else {
    // Game complete
    document.getElementById('win-screen').classList.remove('hidden');
    document.getElementById('win-stats').textContent = 'You completed all levels! Amazing!';
    document.getElementById('next-btn').textContent = 'Play Again';
    document.getElementById('next-btn').onclick = () => {
      level = 1;
      showScreen(null);
      startLevel(1);
      document.getElementById('next-btn').textContent = 'Next Level';
    };
  }
});

document.getElementById('retry-btn').addEventListener('click', () => {
  showScreen(null);
  startLevel(level);
});

// Touch controls (swipe)
let touchStartX, touchStartY;
canvas.addEventListener('touchstart', (e) => {
  initAudio();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
});

canvas.addEventListener('touchend', (e) => {
  if (!gameActive) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 20) move(dx > 0 ? 1 : -1, 0);
  } else {
    if (Math.abs(dy) > 20) move(0, dy > 0 ? 1 : -1);
  }
});

// Resize handler
window.addEventListener('resize', () => {
  if (gameActive || !document.getElementById('start-screen').classList.contains('hidden')) {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellSize = Math.min((W - 40) / gridSize, (H - 120) / gridSize);
    offsetX = Math.floor((W - gridSize * cellSize) / 2);
    offsetY = Math.floor((H - gridSize * cellSize) / 2) + 30;
    draw();
  }
});

// Initial setup
gridSize = 4;
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;
cellSize = Math.min((W - 40) / gridSize, (H - 120) / gridSize);
offsetX = Math.floor((W - gridSize * cellSize) / 2);
offsetY = Math.floor((H - gridSize * cellSize) / 2) + 30;
draw();
</script>
</body>
</html>
