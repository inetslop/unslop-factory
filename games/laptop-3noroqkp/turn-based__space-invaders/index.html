<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Invaders: Turn-Based</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type = 'square', vol = 0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
let state = 'start'; // start, player_turn, bullet_up, enemy_thinking, enemy_bullet, game_over, wave_clear
let score = 0;
let lives = 3;
let wave = 1;
let aliens = [];
let playerBullet = null;
let enemyBullets = [];
let playerX = 0;
let alienDir = 1;
let alienMoveTimer = 0;
let frameCount = 0;
let shakeTimer = 0;
let particles = [];

function initGame() {
    score = 0;
    lives = 3;
    wave = 1;
    initWave();
}

function initWave() {
    aliens = [];
    const cols = Math.min(11, Math.floor(W / 60));
    const rows = Math.min(5 + Math.floor(wave / 2), 8);
    const spacing = Math.min(50, (W - 80) / cols);
    const startX = (W - (cols - 1) * spacing) / 2;
    const startY = 60;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            aliens.push({ x: startX + c * spacing, y: startY + r * 40, alive: true, row: r });
        }
    }
    playerX = W / 2;
    alienDir = 1;
}

function startGame() {
    initAudio();
    state = 'player_turn';
    frameCount = 0;
    playerBullet = null;
    enemyBullets = [];
    particles = [];
    initGame();
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state === 'start' || state === 'game_over') {
        startGame();
    } else if (state === 'wave_clear') {
        wave++;
        initWave();
        state = 'player_turn';
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Drawing helpers
function drawAlien(x, y, row) {
    const colors = ['#0f0', '#0ff', '#f0f', '#f80', '#ff0'];
    const color = colors[row % colors.length];
    ctx.fillStyle = color;
    const s = 12;
    // Simple pixel alien
    ctx.fillRect(x - s, y - s * 0.6, s * 2, s * 0.3); // top
    ctx.fillRect(x - s * 0.7, y - s * 0.9, s * 1.4, s * 0.3); // head
    ctx.fillRect(x - s, y - s * 0.3, s * 2, s * 0.5); // body
    ctx.fillRect(x - s * 1.3, y, s * 0.6, s * 0.4); // left arm
    ctx.fillRect(x + s * 0.7, y, s * 0.6, s * 0.4); // right arm
    ctx.fillRect(x - s * 0.5, y + s * 0.5, s * 0.3, s * 0.4); // left leg
    ctx.fillRect(x + s * 0.2, y + s * 0.5, s * 0.3, s * 0.4); // right leg
}

function drawPlayer(x, y) {
    ctx.fillStyle = '#0f0';
    ctx.fillRect(x - 15, y - 8, 30, 6); // body
    ctx.fillRect(x - 3, y - 16, 6, 10); // cannon
    ctx.fillRect(x - 12, y - 4, 4, 10); // left
    ctx.fillRect(x + 8, y - 4, 4, 10); // right
}

function drawBullet(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - 2, y - 6, 4, 12);
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 30 + Math.random() * 20,
            color
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
}

function getAliveAliens() {
    return aliens.filter(a => a.alive);
}

function firePlayerBullet() {
    if (state !== 'player_turn') return;
    playSound(800, 0.15, 'square');
    playerBullet = { x: playerX, y: H - 60, speed: 12 };
    state = 'bullet_up';
}

function fireEnemyBullets() {
    const alive = getAliveAliens();
    if (alive.length === 0) return;
    const count = Math.min(1 + Math.floor(wave / 2), 3);
    for (let i = 0; i < count; i++) {
        const shooter = alive[Math.floor(Math.random() * alive.length)];
        enemyBullets.push({ x: shooter.x, y: shooter.y + 10, speed: 5 + wave * 0.3 });
    }
    playSound(200, 0.2, 'sawtooth', 0.1);
}

function moveAliens() {
    const alive = getAliveAliens();
    if (alive.length === 0) return;
    
    const dx = alienDir * (8 + wave);
    let minDist = Infinity;
    for (const a of alive) {
        const d = a.x - W / 2;
        minDist = Math.min(minDist, Math.abs(d));
    }
    
    if (alive.length > 0 && (alienDir > 0 && alive[alive.length-1].x + dx > W - 30) ||
        (alienDir < 0 && alive[0].x + dx < 30)) {
        alienDir *= -1;
        dx = alienDir * (8 + wave);
    }
    
    for (const a of alive) {
        a.x += dx;
        if (alienDir > 0 && a.x > W - 20) { a.x = W - 20; alienDir = -1; }
        if (alienDir < 0 && a.x < 20) { a.x = 20; alienDir = 1; }
    }
    
    // Check if aliens reached bottom
    for (const a of alive) {
        if (a.y > H - 80) {
            state = 'game_over';
            playSound(100, 0.5, 'sawtooth');
        }
    }
}

function checkBulletCollision() {
    if (!playerBullet) return;
    
    for (const a of aliens) {
        if (!a.alive) continue;
        if (Math.abs(playerBullet.x - a.x) < 15 && Math.abs(playerBullet.y - a.y) < 15) {
            a.alive = false;
            score += 10 * (5 - a.row);
            spawnParticles(a.x, a.y, '#fff', 12);
            playSound(400, 0.1, 'square');
            playerBullet = null;
            if (getAliveAliens().length === 0) {
                state = 'wave_clear';
                score += 100 * wave;
            } else {
                // Enemy turn after hit
                setTimeout(() => {
                    if (state !== 'game_over') {
                        moveAliens();
                        fireEnemyBullets();
                        state = 'enemy_bullet';
                    }
                }, 300);
            }
            return;
        }
    }
    
    if (playerBullet.y < 0) {
        playerBullet = null;
        // Enemy turn
        moveAliens();
        fireEnemyBullets();
        state = 'enemy_bullet';
    }
}

function checkEnemyBullets() {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        // Check if hits player
        if (Math.abs(b.x - playerX) < 20 && Math.abs(b.y - (H - 50)) < 15) {
            enemyBullets.splice(i, 1);
            lives--;
            shakeTimer = 15;
            spawnParticles(playerX, H - 50, '#f00', 15);
            playSound(150, 0.4, 'sawtooth');
            if (lives <= 0) {
                state = 'game_over';
            }
            continue;
        }
        if (b.y > H + 20) {
            enemyBullets.splice(i, 1);
        }
    }
}

function update() {
    frameCount++;
    updateParticles();
    
    if (state === 'player_turn') {
        if (keys['ArrowLeft'] || keys['KeyA']) playerX = Math.max(20, playerX - 6);
        if (keys['ArrowRight'] || keys['KeyD']) playerX = Math.min(W - 20, playerX + 6);
        if (keys['Space']) {
            firePlayerBullet();
            keys['Space'] = false;
        }
    }
    
    if (state === 'bullet_up' && playerBullet) {
        playerBullet.y -= playerBullet.speed;
        checkBulletCollision();
    }
    
    if (state === 'enemy_bullet') {
        for (const b of enemyBullets) b.y += b.speed;
        checkEnemyBullets();
        if (enemyBullets.length === 0 && state === 'enemy_bullet') {
            state = 'player_turn';
        }
    }
    
    if (shakeTimer > 0) shakeTimer--;
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    
    // Stars background
    ctx.fillStyle = '#333';
    for (let i = 0; i < 50; i++) {
        const sx = ((i * 137 + 43) % W);
        const sy = ((i * 97 + 11) % H);
        ctx.fillRect(sx, sy, 2, 2);
    }
    
    if (state === 'start') {
        ctx.fillStyle = '#0f0';
        ctx.font = `bold ${Math.min(48, W/15)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('SPACE INVADERS', W/2, H * 0.3);
        ctx.font = `${Math.min(20, W/30)}px monospace`;
        ctx.fillStyle = '#fff';
        ctx.fillText('TURN-BASED EDITION', W/2, H * 0.4);
        ctx.fillStyle = '#888';
        ctx.fillText('← → / A D : Move Ship', W/2, H * 0.55);
        ctx.fillText('SPACE : Fire (1 shot per turn)', W/2, H * 0.6);
        ctx.fillText('Aliens advance & shoot after each shot', W/2, H * 0.68);
        ctx.fillStyle = '#ff0';
        ctx.fillText('PRESS ANY KEY TO START', W/2, H * 0.8);
        return;
    }
    
    if (state === 'game_over') {
        // Still draw the scene
        for (const a of aliens) if (a.alive) drawAlien(a.x, a.y, a.row);
        drawPlayer(playerX, H - 50);
        
        ctx.fillStyle = '#f00';
        ctx.font = `bold ${Math.min(48, W/12)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H * 0.35);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(24, W/25)}px monospace`;
        ctx.fillText(`Score: ${score}  Wave: ${wave}`, W/2, H * 0.45);
        ctx.fillStyle = '#ff0';
        ctx.fillText('PRESS ANY KEY TO RESTART', W/2, H * 0.6);
        drawParticles();
        return;
    }
    
    if (state === 'wave_clear') {
        for (const a of aliens) if (a.alive) drawAlien(a.x, a.y, a.row);
        drawPlayer(playerX, H - 50);
        drawParticles();
        ctx.fillStyle = '#0f0';
        ctx.font = `bold ${Math.min(40, W/14)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(`WAVE ${wave} CLEARED!`, W/2, H * 0.35);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.min(20, W/28)}px monospace`;
        ctx.fillText(`Score: ${score}`, W/2, H * 0.45);
        ctx.fillStyle = '#ff0';
        ctx.fillText('PRESS ANY KEY FOR NEXT WAVE', W/2, H * 0.6);
        return;
    }
    
    // Shake effect
    let ox = 0, oy = 0;
    if (shakeTimer > 0) {
        ox = (Math.random() - 0.5) * shakeTimer;
        oy = (Math.random() - 0.5) * shakeTimer;
    }
    
    ctx.save();
    ctx.translate(ox, oy);
    
    // Draw aliens
    for (const a of aliens) {
        if (a.alive) drawAlien(a.x, a.y, a.row);
    }
    
    // Draw player
    drawPlayer(playerX, H - 50);
    
    // Draw bullets
    if (playerBullet) drawBullet(playerBullet.x, playerBullet.y, '#0f0');
    for (const b of enemyBullets) drawBullet(b.x, b.y, '#f44');
    
    // Particles
    drawParticles();
    
    ctx.restore();
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 25);
    ctx.fillText(`WAVE: ${wave}`, 15, 45);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVES: ${'❤'.repeat(Math.max(0, lives))}`, W - 15, 25);
    
    // Turn indicator
    ctx.textAlign = 'center';
    ctx.fillStyle = state === 'player_turn' ? '#0f0' : '#f44';
    ctx.font = 'bold 14px monospace';
    const turnText = state === 'player_turn' ? '▶ YOUR TURN - MOVE & FIRE ◀' : 
                     state === 'bullet_up' || state === 'enemy_bullet' ? '⚔ ENEMY TURN ⚔' : '';
    ctx.fillText(turnText, W/2, H - 15);
    
    // Alien count
    const aliveCount = getAliveAliens().length;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#888';
    ctx.font = '12px monospace';
    ctx.fillText(`ALIENS: ${aliveCount}`, W/2, 25);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
</html>
