<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger Maze</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cellSize, cols, rows;
const COLS = 15, ROWS = 17;

function resize() {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    const aspect = (COLS + 2) / (ROWS + 4);
    if (maxW / maxH > aspect) {
        H = maxH; W = Math.floor(H * aspect);
    } else {
        W = maxW; H = Math.floor(W / aspect);
    }
    canvas.width = W;
    canvas.height = H;
    cellSize = Math.floor(Math.min(W / (COLS + 2), H / (ROWS + 4)));
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.1;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxMove() { playSound(200, 0.05, 'square', 0.05); }
function sfxDie() { playSound(100, 0.5, 'sawtooth', 0.15); }
function sfxWin() { playSound(440, 0.1, 'square', 0.1); setTimeout(() => playSound(660, 0.1, 'square', 0.1), 100); setTimeout(() => playSound(880, 0.2, 'square', 0.1), 200); }
function sfxStart() { playSound(330, 0.1, 'square', 0.1); setTimeout(() => playSound(440, 0.15, 'square', 0.1), 100); }

// Game state
let gameState = 'start'; // start, playing, dead, levelComplete, gameover
let frog = { x: 0, y: 0, animFrame: 0, animTimer: 0 };
let maze = [];
let hazards = []; // static danger cells
let cars = []; // moving hazards
let score = 0;
let level = 1;
let moves = 0;
let timeElapsed = 0;
let lastTime = 0;
let carTimer = 0;
let deathAnim = 0;
let levelCompleteTimer = 0;
let particles = [];

function generateMaze() {
    // DFS maze generation on odd grid
    let grid = Array.from({length: ROWS}, () => Array(COLS).fill(1));
    
    function carve(x, y) {
        grid[y][x] = 0;
        const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
        for (let i = dirs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
        }
        for (const [dx, dy] of dirs) {
            const nx = x + dx, ny = y + dy;
            if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && grid[ny][nx] === 1) {
                grid[y + dy/2][x + dx/2] = 0;
                carve(nx, ny);
            }
        }
    }
    
    // Start from (1,1)
    carve(1, 1);
    
    // Add some extra openings to make it more open (Frogger-like)
    const extraOpenings = Math.floor(COLS * ROWS * 0.08);
    for (let i = 0; i < extraOpenings; i++) {
        const rx = 1 + Math.floor(Math.random() * (COLS - 2));
        const ry = 1 + Math.floor(Math.random() * (ROWS - 2));
        if (grid[ry][rx] === 1) {
            // Check it doesn't create a dead end visually
            grid[ry][rx] = 0;
        }
    }
    
    return grid;
}

function setupLevel() {
    maze = generateMaze();
    frog.x = 1;
    frog.y = 1;
    moves = 0;
    timeElapsed = 0;
    carTimer = 0;
    hazards = [];
    cars = [];
    
    // Add static hazards (water/danger) in open cells
    const hazardCount = Math.min(3 + level, 8);
    let attempts = 0;
    while (hazards.length < hazardCount && attempts < 200) {
        attempts++;
        const hx = 1 + Math.floor(Math.random() * (COLS - 2));
        const hy = 2 + Math.floor(Math.random() * (ROWS - 4));
        if (maze[hy][hx] === 0 && !(hx === 1 && hy === 1) && !(hx === 1 && hy === ROWS-2)) {
            if (!hazards.find(h => h.x === hx && h.y === hy)) {
                hazards.push({x: hx, y: hy});
            }
        }
    }
    
    // Add moving cars (patrol rows)
    const carCount = Math.min(1 + Math.floor(level / 2), 4);
    for (let i = 0; i < carCount; i++) {
        const row = 3 + Math.floor(Math.random() * (ROWS - 6));
        // Find a row that has open cells
        let openInRow = [];
        for (let x = 1; x < COLS - 1; x++) {
            if (maze[row][x] === 0) openInRow.push(x);
        }
        if (openInRow.length >= 3) {
            const startX = openInRow[Math.floor(Math.random() * openInRow.length)];
            const speed = 1 + Math.floor(Math.random() * 2);
            const dir = Math.random() > 0.5 ? 1 : -1;
            cars.push({x: startX, y: row, dir: dir, speed: speed * (0.5 + level * 0.1), minX: openInRow[0], maxX: openInRow[openInRow.length-1]});
        }
    }
    
    // Make sure the start and end areas are clear
    maze[1][1] = 0;
    if (maze[ROWS-2][1] !== 0) {
        // Ensure path to bottom exists - carve a small area
        for (let x = 0; x < COLS; x++) {
            if (maze[ROWS-2][x] === 0 && maze[ROWS-1][x] === 0) break;
        }
    }
}

function startGame() {
    initAudio();
    sfxStart();
    score = 0;
    level = 1;
    setupLevel();
    gameState = 'playing';
}

function nextLevel() {
    level++;
    setupLevel();
    gameState = 'playing';
}

function die() {
    if (gameState !== 'playing') return;
    sfxDie();
    gameState = 'dead';
    deathAnim = 0;
    for (let i = 0; i < 20; i++) {
        particles.push({
            x: frog.x * cellSize + cellSize/2,
            y: frog.y * cellSize + cellSize/2,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() - 0.5) * 3 - 1,
            life: 1,
            color: Math.random() > 0.5 ? '#4f4' : '#8f8'
        });
    }
}

function winLevel() {
    sfxWin();
    gameState = 'levelComplete';
    levelCompleteTimer = 0;
    const timeBonus = Math.max(0, 1000 - Math.floor(timeElapsed * 50));
    const moveBonus = Math.max(0, 500 - moves * 5);
    score += timeBonus + moveBonus + 200;
}

function isHazard(x, y) {
    return hazards.some(h => h.x === x && h.y === y);
}

function isCarAt(x, y) {
    return cars.some(c => c.x === x && c.y === y);
}

function moveFrog(dx, dy) {
    if (gameState !== 'playing') return;
    const nx = frog.x + dx;
    const ny = frog.y + dy;
    
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
    if (maze[ny][nx] === 1) return; // wall
    
    // Check hazards
    if (isHazard(nx, ny)) { die(); return; }
    if (isCarAt(nx, ny)) { die(); return; }
    
    frog.x = nx;
    frog.y = ny;
    moves++;
    sfxMove();
    
    // Check win - reach bottom row
    if (ny >= ROWS - 2) {
        winLevel();
    }
}

// Input
let inputQueued = false;
window.addEventListener('keydown', (e) => {
    if (gameState === 'start' || gameState === 'gameover') {
        if (e.key === ' ' || e.key === 'Enter') startGame();
        return;
    }
    if (gameState === 'levelComplete') {
        if (e.key === ' ' || e.key === 'Enter') nextLevel();
        return;
    }
    if (gameState === 'dead') {
        if (deathAnim > 1) {
            // Check for game over or retry
            if (score < 0) { gameState = 'gameover'; }
            else { setupLevel(); level--; if(level < 1) level = 1; score = Math.max(0, score - 100); gameState = 'playing'; }
        }
        return;
    }
    
    initAudio();
    switch(e.key) {
        case 'ArrowUp': moveFrog(0, -1); e.preventDefault(); break;
        case 'ArrowDown': moveFrog(0, 1); e.preventDefault(); break;
        case 'ArrowLeft': moveFrog(-1, 0); e.preventDefault(); break;
        case 'ArrowRight': moveFrog(1, 0); e.preventDefault(); break;
    }
});

// Update
function update(dt) {
    if (gameState === 'playing') {
        timeElapsed += dt;
        
        // Move cars
        carTimer += dt;
        const carInterval = 0.8 - level * 0.05;
        if (carTimer >= carInterval) {
            carTimer = 0;
            for (let c of cars) {
                let nx = c.x + c.dir;
                if (nx < c.minX || nx > c.maxX || maze[c.y][nx] === 1) {
                    c.dir *= -1;
                    nx = c.x + c.dir;
                }
                if (!maze[c.y][nx] && nx >= c.minX && nx <= c.maxX) {
                    c.x = nx;
                } else {
                    c.dir *= -1;
                }
            }
            // Check if frog is hit by car
            for (let c of cars) {
                if (c.x === frog.x && c.y === frog.y) { die(); break; }
            }
        }
    }
    
    if (gameState === 'dead') {
        deathAnim += dt;
    }
    
    if (gameState === 'levelComplete') {
        levelCompleteTimer += dt;
    }
    
    // Particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= dt * 2;
    }
    particles = particles.filter(p => p.life > 0);
}

// Draw
function drawCell(x, y) {
    const px = x * cellSize;
    const py = (y + 2) * cellSize; // offset for HUD
    
    if (maze[y][x] === 1) {
        ctx.fillStyle = '#1a3a2a';
        ctx.fillRect(px, py, cellSize, cellSize);
        // Brick pattern
        ctx.strokeStyle = '#0d2818';
        ctx.lineWidth = 1;
        ctx.strokeRect(px + 1, py + 1, cellSize - 2, cellSize - 2);
    } else {
        ctx.fillStyle = '#0a1f14';
        ctx.fillRect(px, py, cellSize, cellSize);
    }
}

function drawHazard(x, y) {
    const px = x * cellSize;
    const py = (y + 2) * cellSize;
    // Water/danger - animated
    const t = performance.now() / 500;
    ctx.fillStyle = `rgba(30, 80, 160, ${0.6 + Math.sin(t + x) * 0.2})`;
    ctx.fillRect(px + 2, py + 2, cellSize - 4, cellSize - 4);
    // Waves
    ctx.strokeStyle = `rgba(100, 180, 255, ${0.5 + Math.sin(t * 2) * 0.3})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
        const wy = py + cellSize * 0.3 + i * cellSize * 0.25;
        ctx.beginPath();
        ctx.moveTo(px + 3, wy);
        ctx.quadraticCurveTo(px + cellSize/2, wy + Math.sin(t + i) * 3, px + cellSize - 3, wy);
        ctx.stroke();
    }
}

function drawCar(c) {
    const px = c.x * cellSize;
    const py = (c.y + 2) * cellSize;
    ctx.fillStyle = '#cc3333';
    const carW = cellSize - 6;
    const carH = cellSize - 10;
    const cx = px + 3, cy = py + 5;
    // Body
    ctx.fillRect(cx, cy, carW, carH);
    // Windows
    ctx.fillStyle = '#ffdd44';
    ctx.fillRect(cx + 2, cy + 2, carW - 4, 4);
    // Wheels
    ctx.fillStyle = '#333';
    ctx.fillRect(cx, cy + carH - 2, 5, 3);
    ctx.fillRect(cx + carW - 5, cy + carH - 2, 5, 3);
}

function drawFrog() {
    const px = frog.x * cellSize;
    const py = (frog.y + 2) * cellSize;
    const cx = px + cellSize/2;
    const cy = py + cellSize/2;
    
    if (gameState === 'dead' && deathAnim < 1) {
        ctx.globalAlpha = 1 - deathAnim;
    } else if (gameState === 'dead') {
        ctx.globalAlpha = 0;
    }
    
    // Frog body
    ctx.fillStyle = '#33cc33';
    ctx.beginPath();
    ctx.arc(cx, cy + 2, cellSize * 0.35, 0, Math.PI * 2);
    ctx.fill();
    
    // Head
    ctx.beginPath();
    ctx.arc(cx, cy - cellSize * 0.15, cellSize * 0.28, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - cellSize * 0.15, cy - cellSize * 0.22, cellSize * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + cellSize * 0.15, cy - cellSize * 0.22, cellSize * 0.1, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupils
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(cx - cellSize * 0.15, cy - cellSize * 0.24, cellSize * 0.05, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + cellSize * 0.15, cy - cellSize * 0.24, cellSize * 0.05, 0, Math.PI * 2);
    ctx.fill();
    
    // Legs
    ctx.fillStyle = '#2a992a';
    ctx.fillRect(cx - cellSize * 0.35, cy + cellSize * 0.15, cellSize * 0.12, cellSize * 0.15);
    ctx.fillRect(cx + cellSize * 0.23, cy + cellSize * 0.15, cellSize * 0.12, cellSize * 0.15);
    
    ctx.globalAlpha = 1;
}

function drawHUD() {
    const hudH = 2 * cellSize;
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, hudH);
    
    ctx.fillStyle = '#4f4';
    ctx.font = `bold ${Math.floor(cellSize * 0.7)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`LEVEL ${level}`, cellSize * 0.5, cellSize * 0.8);
    
    ctx.textAlign = 'center';
    ctx.fillText(`SCORE: ${score}`, canvas.width / 2, cellSize * 0.8);
    
    ctx.textAlign = 'right';
    ctx.fillText(`TIME: ${Math.floor(timeElapsed)}s`, canvas.width - cellSize * 0.5, cellSize * 0.8);
    
    // Bottom bar
    const botY = (ROWS + 2) * cellSize;
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, botY, canvas.width, H - botY);
    ctx.fillStyle = '#4f4';
    ctx.font = `${Math.floor(cellSize * 0.5)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('↑↓←→ MOVE | AVOID WATER & CARS | REACH BOTTOM', canvas.width / 2, botY + cellSize * 0.4);
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    // Title
    ctx.fillStyle = '#33cc33';
    ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.1)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('FROGGER MAZE', cx, cy - Math.min(W,H) * 0.2);
    
    // Frog icon
    const fs = Math.min(W, H) * 0.08;
    ctx.fillStyle = '#33cc33';
    ctx.beginPath();
    ctx.arc(cx, cy - Math.min(W,H)*0.05, fs * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - fs*0.15, cy - Math.min(W,H)*0.07, fs * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + fs*0.15, cy - Math.min(W,H)*0.07, fs * 0.12, 0, Math.PI * 2);
    ctx.fill();
    
    // Instructions
    ctx.fillStyle = '#8f8';
    ctx.font = `${Math.floor(Math.min(W, H) * 0.035)}px monospace`;
    const lines = [
        'Navigate the maze to reach the bottom!',
        '',
        '⚠ Avoid blue water tiles - they are deadly',
        '🚗 Dodge red cars that patrol the paths',
        'Walls block your path - find the way through!',
        '',
        '↑ ↓ ← →  Arrow Keys to Move',
        '',
        'Score is based on speed & efficiency'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, cx, cy + Math.min(W,H)*0.05 + i * Math.min(W,H) * 0.04);
    });
    
    // Blinking prompt
    if (Math.floor(performance.now() / 500) % 2 === 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.04)}px monospace`;
        ctx.fillText('PRESS SPACE TO START', cx, cy + Math.min(W,H)*0.35);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    ctx.fillStyle = '#f44';
    ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.08)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', cx, cy - Math.min(W,H)*0.1);
    
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(Math.min(W, H) * 0.04)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, cx, cy);
    ctx.fillText(`Level Reached: ${level}`, cx, cy + Math.min(W,H)*0.05);
    
    if (Math.floor(performance.now() / 500) % 2 === 0) {
        ctx.fillStyle = '#ff0';
        ctx.font = `bold ${Math.floor(Math.min(W, H) * 0.035)}px monospace`;
        ctx.fillText('PRESS SPACE TO RESTART', cx, cy + Math.min(W,H)*0.15);
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }
    
    // Draw maze
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            drawCell(x, y);
        }
    }
    
    // Draw exit zone
    const exitY = (ROWS - 2 + 2) * cellSize;
    ctx.fillStyle = `rgba(50, 255, 100, ${0.3 + Math.sin(performance.now()/400) * 0.2})`;
    for (let x = 0; x < COLS; x++) {
        if (maze[ROWS-2][x] === 0 || maze[ROWS-1][x] === 0) {
            ctx.fillRect(x * cellSize + 2, exitY + 2, cellSize - 4, cellSize * 2 - 4);
        }
    }
    ctx.fillStyle = '#4f4';
    ctx.font = `bold ${Math.floor(cellSize * 0.5)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', (COLS/2) * cellSize, exitY + cellSize);
    
    // Draw hazards
    for (let h of hazards) {
        drawHazard(h.x, h.y);
    }
    
    // Draw cars
    for (let c of cars) {
        drawCar(c);
    }
    
    // Draw frog
    drawFrog();
    
    // Particles
    for (let p of particles) {
        ctx.fillStyle = `rgba(${parseInt(p.color.slice(1,3),16)}, ${parseInt(p.color.slice(3,5),16)}, ${parseInt(p.color.slice(5,7),16)}, ${p.life})`;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    
    // HUD
    drawHUD();
    
    // Overlays
    if (gameState === 'dead') {
        if (deathAnim > 0.5) {
            ctx.fillStyle = `rgba(200, 0, 0, ${Math.min(deathAnim - 0.5, 0.4)})`;
            ctx.fillRect(0, 0, W, H);
            
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.floor(Math.min(W,H) * 0.06)}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText('SPLAT!', W/2, H/2 - 10);
            
            if (deathAnim > 1) {
                ctx.font = `${Math.floor(Math.min(W,H) * 0.03)}px monospace`;
                ctx.fillText(`Score: ${score} | Press SPACE to retry`, W/2, H/2 + 30);
            }
        }
    }
    
    if (gameState === 'levelComplete') {
        ctx.fillStyle = `rgba(0, 100, 50, ${Math.min(levelCompleteTimer * 2, 0.6)})`;
        ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#4f4';
        ctx.font = `bold ${Math.floor(Math.min(W,H) * 0.07)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(`LEVEL ${level} COMPLETE!`, W/2, H/2 - 20);
        
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.floor(Math.min(W,H) * 0.035)}px monospace`;
        ctx.fillText(`Score: ${score}`, W/2, H/2 + 20);
        
        if (levelCompleteTimer > 0.5) {
            if (Math.floor(performance.now() / 500) % 2 === 0) {
                ctx.fillStyle = '#ff0';
                ctx.font = `bold ${Math.floor(Math.min(W,H) * 0.035)}px monospace`;
                ctx.fillText('PRESS SPACE FOR NEXT LEVEL', W/2, H/2 + 60);
            }
        }
    }
    
    if (gameState === 'gameover') {
        drawGameOver();
    }
}

// Game loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
