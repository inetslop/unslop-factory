<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize;
let gameStarted = false;
let gameOver = false;
let levelComplete = false;
let score = 0;
let lives = 3;
let level = 1;
let frameCount = 0;
let audioCtx = null;

const COLS = 13;
const ROWS = 24;

// Row types: 0=holes, 1=water, 2=grass, 3=road
const rowTypes = [];
for (let r = 0; r < ROWS; r++) {
  if (r === 0) rowTypes.push(0); // holes
  else if (r >= 1 && r <= 5) rowTypes.push(1); // water
  else if (r === 6) rowTypes.push(2); // grass
  else if (r >= 7 && r <= 11) rowTypes.push(3); // road
  else if (r === 12) rowTypes.push(2); // grass
  else if (r >= 13 && r <= 17) rowTypes.push(3); // road
  else if (r === 18) rowTypes.push(2); // grass start
  else rowTypes.push(2);
}

let frog = { x: 6, y: 18 };
let obstacles = [];
let safeHoles = [];
let filledHoles = [];
let moveTimer = 0;
let moveInterval = 8;
let animFrame = 0;

function resize() {
  const aspect = (COLS * 32) / (ROWS * 32);
  let w = window.innerWidth;
  let h = window.innerHeight;
  if (w / h > aspect) { w = h * aspect; } else { h = w / aspect; }
  canvas.width = Math.floor(w);
  canvas.height = Math.floor(h);
  cellSize = Math.min(canvas.width / COLS, canvas.height / ROWS);
}
window.addEventListener('resize', resize);
resize();

function initLevel() {
  obstacles = [];
  safeHoles = [];
  filledHoles = [];
  frog.x = 6;
  frog.y = 18;

  // Safe holes at top
  for (let c = 0; c < COLS; c++) {
    if (c % 2 === 0) safeHoles.push({ x: c, filled: false });
  }
  filledHoles = [];

  // Water obstacles (logs/ducks)
  for (let r = 1; r <= 5; r++) {
    const count = 3 + Math.floor(r / 2);
    const speed = (r % 2 === 0 ? 1 : -1) * (0.5 + Math.random() * 0.3);
    for (let i = 0; i < count; i++) {
      obstacles.push({
        type: 'log', row: r, x: (i * COLS / count) + Math.random() * 2,
        width: 1.5 + Math.floor(Math.random() * 2), speed: speed, isObstacle: false
      });
    }
  }

  // Road obstacles (cars/trucks)
  for (let r = 7; r <= 11; r++) {
    const count = 3 + Math.floor(r / 3);
    const speed = (r % 2 === 0 ? 1 : -1) * (1.5 + Math.random() * 0.5);
    for (let i = 0; i < count; i++) {
      obstacles.push({
        type: 'car', row: r, x: (i * COLS / count) + Math.random(),
        width: 1, speed: speed, isObstacle: true
      });
    }
  }

  for (let r = 13; r <= 17; r++) {
    const count = 4 + Math.floor(r / 3);
    const speed = (r % 2 === 0 ? -1 : 1) * (1.5 + Math.random() * 0.5);
    for (let i = 0; i < count; i++) {
      obstacles.push({
        type: 'truck', row: r, x: (i * COLS / count) + Math.random(),
        width: 1.5, speed: speed, isObstacle: true
      });
    }
  }
}

function playSound(freq, dur, type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || webkitAudioContext)(); } catch(e) {}
  }
}

function playJump() { if (audioCtx) playSound(400, 0.1, 'square'); }
function playSplash() { if (audioCtx) playSound(150, 0.3, 'sawtooth'); }
function playHit() { if (audioCtx) playSound(80, 0.4, 'sawtooth'); }
function playGoal() { if (audioCtx) playSound(600, 0.15, 'square'); setTimeout(() => { if(audioCtx) playSound(800, 0.2, 'square'); }, 150); }

function updateObstacles() {
  for (let obs of obstacles) {
    obs.x += obs.speed * 0.05;
    if (obs.x > COLS + obs.width) obs.x = -obs.width;
    if (obs.x < -obs.width) obs.x = COLS + obs.width;
  }
}

function checkCollision() {
  const fx = frog.x, fy = frog.y;

  if (rowTypes[fy] === 1) { // water
    let onLog = false;
    for (let obs of obstacles) {
      if (obs.row === fy && obs.type === 'log') {
        if (fx >= obs.x - 0.5 && fx <= obs.x + obs.width + 0.5) { onLog = true; break; }
      }
    }
    if (!onLog) return 'death';
  }

  if (rowTypes[fy] === 3) { // road
    for (let obs of obstacles) {
      if (obs.row === fy && obs.isObstacle) {
        if (fx >= obs.x - 0.5 && fx <= obs.x + obs.width + 0.5) return 'death';
      }
    }
  }

  if (rowTypes[fy] === 0) { // holes row
    for (let hole of safeHoles) {
      if (hole.x === fx && !hole.filled) {
        hole.filled = true;
        score += 50;
        playGoal();
        filledHoles.push(hole);
        frog.x = 6; frog.y = 18;
        if (filledHoles.length >= safeHoles.length) {
          levelComplete = true;
          score += 200;
        }
        return 'goal';
      }
    }
  }

  return 'safe';
}

function moveFrog(dx, dy) {
  if (gameOver || levelComplete) return;
  initAudio();

  const nx = frog.x + dx;
  const ny = frog.y + dy;

  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

  // Can't move into obstacles on road
  if (rowTypes[ny] === 3) {
    for (let obs of obstacles) {
      if (obs.row === ny && obs.isObstacle) {
        if (nx >= obs.x - 0.5 && nx <= obs.x + obs.width + 0.5) return;
      }
    }
  }

  frog.x = nx;
  frog.y = ny;
  playJump();
}

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
}

function drawFrog(x, y) {
  const px = x * cellSize;
  const py = y * cellSize;
  const s = cellSize;

  // Body
  ctx.fillStyle = '#2d8a00';
  ctx.fillRect(px + s*0.25, py + s*0.3, s*0.5, s*0.45);
  // Head
  ctx.fillStyle = '#3daa00';
  ctx.fillRect(px + s*0.3, py + s*0.15, s*0.4, s*0.2);
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(px + s*0.3, py + s*0.15, s*0.12, s*0.12);
  ctx.fillRect(px + s*0.58, py + s*0.15, s*0.12, s*0.12);
  ctx.fillStyle = '#000';
  ctx.fillRect(px + s*0.34, py + s*0.18, s*0.06, s*0.06);
  ctx.fillRect(px + s*0.62, py + s*0.18, s*0.06, s*0.06);
  // Legs
  ctx.fillStyle = '#2d8a00';
  ctx.fillRect(px + s*0.15, py + s*0.6, s*0.15, s*0.15);
  ctx.fillRect(px + s*0.7, py + s*0.6, s*0.15, s*0.15);
}

function drawCar(x, y, type) {
  const px = x * cellSize;
  const py = y * cellSize;
  const s = cellSize;

  if (type === 'car') {
    ctx.fillStyle = '#cc2200';
    ctx.fillRect(px + s*0.1, py + s*0.35, s*0.8, s*0.4);
    ctx.fillStyle = '#ff4400';
    ctx.fillRect(px + s*0.25, py + s*0.25, s*0.5, s*0.15);
    // Windows
    ctx.fillStyle = '#aaddff';
    ctx.fillRect(px + s*0.3, py + s*0.27, s*0.15, s*0.1);
    ctx.fillRect(px + s*0.55, py + s*0.27, s*0.15, s*0.1);
  } else {
    ctx.fillStyle = '#3366cc';
    ctx.fillRect(px + s*0.05, py + s*0.3, s * 1.4, s*0.45);
    ctx.fillStyle = '#5588ff';
    ctx.fillRect(px + s*0.2, py + s*0.2, s*0.6, s*0.15);
    // Windows
    ctx.fillStyle = '#aaddff';
    ctx.fillRect(px + s*0.25, py + s*0.22, s*0.2, s*0.1);
  }
}

function drawLog(x, y) {
  const px = x * cellSize;
  const py = y * cellSize;
  const s = cellSize;
  ctx.fillStyle = '#8B5E3C';
  ctx.fillRect(px + s*0.1, py + s*0.3, s*0.8, s*0.4);
  ctx.fillStyle = '#A0724B';
  ctx.fillRect(px + s*0.15, py + s*0.35, s*0.7, s*0.3);
}

function draw() {
  const s = cellSize;

  // Background
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (rowTypes[r] === 1) {
        ctx.fillStyle = '#1a3d6b';
        ctx.fillRect(c * s, r * s, s, s);
      } else if (rowTypes[r] === 3) {
        ctx.fillStyle = '#333';
        ctx.fillRect(c * s, r * s, s, s);
        // Road markings
        if (c % 2 === 0) {
          ctx.fillStyle = '#555';
          ctx.fillRect(c * s + s*0.4, r * s + s*0.45, s*0.2, s*0.1);
        }
      } else if (rowTypes[r] === 0) {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(c * s, r * s, s, s);
      } else {
        ctx.fillStyle = '#1a5c1a';
        ctx.fillRect(c * s, r * s, s, s);
        // Grass tufts
        if ((c + r) % 3 === 0) {
          ctx.fillStyle = '#2d7a2d';
          ctx.fillRect(c * s + s*0.3, r * s + s*0.4, s*0.15, s*0.3);
        }
      }
    }
  }

  // Safe holes
  for (let hole of safeHoles) {
    const hx = hole.x * s;
    const hy = 0;
    ctx.fillStyle = hole.filled ? '#ffcc00' : '#111';
    ctx.fillRect(hx + s*0.2, hy + s*0.25, s*0.6, s*0.5);
    if (!hole.filled) {
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      ctx.strokeRect(hx + s*0.2, hy + s*0.25, s*0.6, s*0.5);
    } else {
      // Draw mini frog in hole
      ctx.fillStyle = '#3daa00';
      ctx.fillRect(hx + s*0.35, hy + s*0.4, s*0.3, s*0.25);
    }
  }

  // Obstacles
  for (let obs of obstacles) {
    if (obs.type === 'log') {
      drawLog(obs.x, obs.row);
    } else {
      drawCar(obs.x, obs.row, obs.type);
    }
  }

  // Frog
  if (!gameOver && !levelComplete) {
    drawFrog(frog.x, frog.y);
  }

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, s * 1.2);

  ctx.font = `bold ${Math.floor(s*0.7)}px monospace`;
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score}`, s * 0.5, s * 0.8);
  ctx.fillText(`LEVEL: ${level}`, s * 4, s * 0.8);

  // Lives
  ctx.fillStyle = '#3daa00';
  for (let i = 0; i < lives; i++) {
    ctx.fillRect(canvas.width - (lives - i) * s * 0.8, s * 0.35, s * 0.4, s * 0.4);
  }

  // Overlays
  if (!gameStarted) drawStartScreen();
  if (gameOver) drawGameOver();
  if (levelComplete) drawLevelComplete();
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const s = cellSize;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#3daa00';
  ctx.font = `bold ${Math.floor(s*1.5)}px monospace`;
  ctx.fillText('FROGGER', cx, cy - s * 3);

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.floor(s*0.7)}px monospace`;
  ctx.fillText('Guide the frog to safety!', cx, cy - s * 1.5);
  ctx.fillText('', cx, cy - s);
  ctx.fillText('CONTROLS:', cx, cy - s * 0.5);
  ctx.font = `${Math.floor(s*0.6)}px monospace`;
  ctx.fillText('Arrow Keys / WASD to move', cx, cy);
  ctx.fillText('', cx, cy + s * 0.5);
  ctx.fillText('Cross the road. Ride the logs.', cx, cy + s);
  ctx.fillText('Reach all 6 holes at the top!', cx, cy + s * 1.5);
  ctx.fillText('', cx, cy + s * 2);

  // Pulsing start text
  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillStyle = '#ffcc00';
    ctx.font = `bold ${Math.floor(s*0.8)}px monospace`;
    ctx.fillText('PRESS ANY KEY TO START', cx, cy + s * 3);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const s = cellSize;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3333';
  ctx.font = `bold ${Math.floor(s*1.2)}px monospace`;
  ctx.fillText('GAME OVER', cx, cy - s);

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.floor(s*0.7)}px monospace`;
  ctx.fillText(`Final Score: ${score}`, cx, cy + s * 0.5);
  ctx.fillText('', cx, cy + s);
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('Press R to Restart', cx, cy + s * 1.5);
}

function drawLevelComplete() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const s = cellSize;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#3daa00';
  ctx.font = `bold ${Math.floor(s*1)}px monospace`;
  ctx.fillText('LEVEL COMPLETE!', cx, cy - s);

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.floor(s*0.7)}px monospace`;
  ctx.fillText(`Score: ${score}`, cx, cy + s * 0.3);
  ctx.fillText('', cx, cy + s * 0.8);
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('Press SPACE for Next Level', cx, cy + s * 1.3);
}

function update() {
  if (!gameStarted || gameOver) return;
  if (levelComplete) return;

  frameCount++;
  animFrame = Math.floor(frameCount / 8) % 2;
  updateObstacles();

  // Check collision every few frames
  if (frameCount % 3 === 0) {
    const result = checkCollision();
    if (result === 'death') {
      playSplash();
      lives--;
      if (lives <= 0) {
        gameOver = true;
        playHit();
      } else {
        frog.x = 6; frog.y = 18;
      }
    }
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  score = 0;
  lives = 3;
  level = 1;
  gameOver = false;
  levelComplete = false;
  initLevel();
  gameStarted = true;
}

function nextLevel() {
  level++;
  levelComplete = false;
  initLevel();
}

document.addEventListener('keydown', (e) => {
  if (!gameStarted || gameOver || levelComplete) {
    if (!gameStarted) {
      initAudio();
      startGame();
      return;
    }
    if (gameOver && (e.key === 'r' || e.key === 'R')) {
      startGame();
      return;
    }
    if (levelComplete && e.key === ' ') {
      nextLevel();
      return;
    }
    return;
  }

  initAudio();

  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': moveFrog(0, -1); break;
    case 'ArrowDown': case 's': case 'S': moveFrog(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': moveFrog(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': moveFrog(1, 0); break;
    case 'r': case 'R': startGame(); break;
  }
  e.preventDefault();
});

// Touch controls
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  initAudio();
  if (!gameStarted || gameOver) { startGame(); return; }
  if (levelComplete) { nextLevel(); return; }
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
});
canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (Math.abs(dx) > 20) moveFrog(dx > 0 ? 1 : -1, 0);
  } else {
    if (Math.abs(dy) > 20) moveFrog(0, dy > 0 ? 1 : -1);
  }
});

initLevel();
gameLoop();
</script>
</body>
</html>
