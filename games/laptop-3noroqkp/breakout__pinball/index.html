<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breakout Pinball</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
}
resize();
window.addEventListener('resize', resize);

let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(freq, duration, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playBounce() { playSound(440, 0.1, 'square', 0.08); }
function playBrick() { playSound(880, 0.15, 'square', 0.12); }
function playBumper() { playSound(660, 0.2, 'sawtooth', 0.15); }
function playPaddle() { playSound(330, 0.08, 'triangle', 0.1); }
function playLaunch() { playSound(220, 0.3, 'sawtooth', 0.12); }
function playLose() { playSound(150, 0.5, 'sawtooth', 0.15); }

let W, H;
const GAME_W = 800;
const GAME_H = 600;

let state = 'start'; // start, playing, gameover, levelcomplete
let score = 0;
let lives = 3;
let level = 1;
let highScore = 0;

try {
    highScore = parseInt(localStorage.getItem('breakoutPinballHigh') || '0');
} catch(e) {}

function saveHigh() {
    try { localStorage.setItem('breakoutPinballHigh', highScore); } catch(e) {}
}

let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    }
    if (state === 'gameover' && (e.code === 'KeyR' || e.code === 'Enter')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let paddle, ball, bricks, bumpers, particles, powerUps;
let launchPower = 0;
let launching = false;
let ballAttached = true;

function createBricks(lvl) {
    const b = [];
    const cols = 10;
    const rows = Math.min(3 + lvl, 7);
    const bw = (GAME_W - 40) / cols;
    const bh = 25;
    const offsetX = 20;
    const offsetY = 60;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const hp = Math.min(1 + Math.floor(lvl / 2), 3);
            b.push({
                x: offsetX + c * bw, y: offsetY + r * bh,
                w: bw - 4, h: bh - 4,
                hp: hp, maxHp: hp,
                color: getBrickColor(r, cols)
            });
        }
    }
    return b;
}

function getBrickColor(row, cols) {
    const colors = ['#ff6b6b','#ffa502','#ffd93d','#6bcb77','#4d96ff','#9b5de5','#f15bb5'];
    return colors[row % colors.length];
}

function createBumpers() {
    const b = [];
    const count = 2 + Math.min(level, 3);
    for (let i = 0; i < count; i++) {
        const x = 150 + (GAME_W - 300) / (count - 1 || 1) * (i / (count - 1 || 1));
        const y = GAME_H * 0.4 + Math.random() * 60;
        b.push({ x: x, y: y, r: 25, pulse: 0 });
    }
    return b;
}

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    startLevel();
}

function startLevel() {
    const scale = Math.min(1, Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H));
    W = GAME_W * scale;
    H = GAME_H * scale;

    paddle = { x: GAME_W / 2 - 50, y: GAME_H - 40, w: 100, h: 16, speed: 8 };
    ball = { x: GAME_W / 2, y: GAME_H - 70, r: 8, vx: 0, vy: 0, spin: 0 };
    bricks = createBricks(level);
    bumpers = createBumpers();
    particles = [];
    powerUps = [];
    ballAttached = true;
    launchPower = 0;
    launching = false;
    state = 'playing';
}

function resetBall() {
    ball.x = GAME_W / 2;
    ball.y = GAME_H - 70;
    ball.vx = 0;
    ball.vy = 0;
    ball.spin = 0;
    ballAttached = true;
    launchPower = 0;
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            color: color,
            r: 2 + Math.random() * 3
        });
    }
}

function update() {
    if (state !== 'playing') return;

    // Paddle movement
    if (keys['ArrowLeft'] || keys['KeyA']) paddle.x -= paddle.speed;
    if (keys['ArrowRight'] || keys['KeyD']) paddle.x += paddle.speed;
    paddle.x = Math.max(0, Math.min(GAME_W - paddle.w, paddle.x));

    // Launch
    if (ballAttached) {
        if (keys['Space']) {
            launchPower = Math.min(launchPower + 1.5, 100);
        } else if (launchPower > 0) {
            ballAttached = false;
            const angle = -Math.PI / 2 + (paddle.x / GAME_W - 0.5) * 0.8;
            const power = 6 + launchPower * 0.12;
            ball.vx = Math.cos(angle) * power;
            ball.vy = Math.sin(angle) * power;
            playLaunch();
            launchPower = 0;
        } else {
            launchPower = 0;
        }
    }

    if (!ballAttached) {
        // Ball physics with slight gravity for pinball feel
        ball.vy += 0.15;
        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.spin += (ball.vx * 0.02);

        // Wall collisions
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); playBounce(); }
        if (ball.x + ball.r > GAME_W) { ball.x = GAME_W - ball.r; ball.vx = -Math.abs(ball.vx); playBounce(); }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playBounce(); }

        // Paddle collision
        if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 5 &&
            ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
            const hitPos = (ball.x - paddle.x) / paddle.w;
            const angle = -Math.PI / 2 + (hitPos - 0.5) * 1.8;
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            ball.vx = Math.cos(angle) * speed;
            ball.vy = Math.sin(angle) * speed;
            playPaddle();
        }

        // Bumper collisions
        for (let b of bumpers) {
            const dx = ball.x - b.x;
            const dy = ball.y - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ball.r + b.r) {
                const nx = dx / dist, ny = dy / dist;
                ball.x = b.x + nx * (ball.r + b.r + 1);
                ball.y = b.y + ny * (ball.r + b.r + 1);
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) + 3;
                ball.vx = nx * speed;
                ball.vy = ny * speed;
                b.pulse = 15;
                playBumper();
                score += 50;
            }
        }

        // Brick collisions
        for (let i = bricks.length - 1; i >= 0; i--) {
            const br = bricks[i];
            if (ball.x + ball.r > br.x && ball.x - ball.r < br.x + br.w &&
                ball.y + ball.r > br.y && ball.y - ball.r < br.y + br.h) {
                // Determine side
                const overlapX = Math.min(ball.x + ball.r - br.x, br.x + br.w - (ball.x - ball.r));
                const overlapY = Math.min(ball.y + ball.r - br.y, br.y + br.h - (ball.y - ball.r));
                if (overlapX < overlapY) {
                    ball.vx = -Math.abs(ball.vx) * 0.9;
                } else {
                    ball.vy = -Math.abs(ball.vy) * 0.9;
                }

                br.hp--;
                playBrick();
                score += 10 * (br.maxHp - br.hp + 1);
                spawnParticles(ball.x, ball.y, br.color, 5);

                if (br.hp <= 0) {
                    spawnParticles(br.x + br.w/2, br.y + br.h/2, br.color, 10);
                    bricks.splice(i, 1);
                    score += 25;

                    // Power-up chance
                    if (Math.random() < 0.15) {
                        powerUps.push({ x: br.x + br.w/2, y: br.y + br.h/2, vy: 2, type: Math.random() < 0.5 ? 'wide' : 'multi', life: 300 });
                    }
                }

                if (bricks.length === 0) {
                    state = 'levelcomplete';
                    level++;
                    setTimeout(() => startLevel(), 1500);
                }
                break;
            }
        }

        // Power-up collection
        for (let i = powerUps.length - 1; i >= 0; i--) {
            const p = powerUps[i];
            if (Math.abs(ball.x - p.x) < 20 && Math.abs(ball.y - p.y) < 20) {
                if (p.type === 'wide') paddle.w = Math.min(paddle.w + 15, 140);
                else { /* multi - just bonus */ score += 100; }
                powerUps.splice(i, 1);
            }
        }

        // Ball lost
        if (ball.y - ball.r > GAME_H) {
            lives--;
            playLose();
            paddle.w = Math.max(80, paddle.w - 15);
            if (lives <= 0) {
                state = 'gameover';
                if (score > highScore) { highScore = score; saveHigh(); }
            } else {
                resetBall();
            }
        }
    }

    // Update bumpers
    for (let b of bumpers) {
        if (b.pulse > 0) b.pulse--;
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Update power-ups
    for (let i = powerUps.length - 1; i >= 0; i--) {
        const p = powerUps[i];
        p.y += p.vy;
        p.life--;
        if (p.life <= 0 || p.y > GAME_H) powerUps.splice(i, 1);
    }

    // Speed cap
    const maxSpeed = 14;
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (speed > maxSpeed) {
        ball.vx = (ball.vx / speed) * maxSpeed;
        ball.vy = (ball.vy / speed) * maxSpeed;
    }
}

function draw() {
    const scale = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
    ctx.save();
    ctx.scale(scale, scale);
    ctx.translate((window.innerWidth - GAME_W * scale) / 2 / scale, (window.innerHeight - GAME_H * scale) / 2 / scale);

    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // Grid lines
    ctx.strokeStyle = 'rgba(30, 40, 80, 0.3)';
    ctx.lineWidth = 1;
    for (let x = 0; x < GAME_W; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GAME_H); ctx.stroke();
    }
    for (let y = 0; y < GAME_H; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GAME_W, y); ctx.stroke();
    }

    if (state === 'start') {
        drawStartScreen();
        ctx.restore();
        return;
    }

    // Bricks
    for (let br of bricks) {
        const alpha = 0.5 + 0.5 * (br.hp / br.maxHp);
        ctx.fillStyle = br.color;
        ctx.globalAlpha = alpha;
        ctx.fillRect(br.x, br.y, br.w, br.h);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(br.x, br.y, br.w, br.h);

        // HP indicator
        if (br.maxHp > 1) {
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(br.hp, br.x + br.w/2, br.y + br.h/2 + 3);
        }
    }

    // Bumpers
    for (let b of bumpers) {
        const r = b.r + (b.pulse > 0 ? Math.sin(b.pulse * 0.5) * 4 : 0);
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
        grad.addColorStop(0, '#ff6b6b');
        grad.addColorStop(0.7, '#c0392b');
        grad.addColorStop(1, '#8e44ad');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Star inside
        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('★', b.x, b.y + 5);
    }

    // Power-ups
    for (let p of powerUps) {
        ctx.fillStyle = p.type === 'wide' ? '#4d96ff' : '#ffd93d';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(p.type === 'wide' ? 'W' : 'M', p.x, p.y + 3);
    }

    // Paddle
    const pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    pg.addColorStop(0, '#4d96ff');
    pg.addColorStop(1, '#2563eb');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.stroke();

    // Launch power bar
    if (ballAttached && launchPower > 0) {
        const barW = paddle.w;
        const barH = 6;
        const bx = paddle.x;
        const by = paddle.y - 12;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(bx, by, barW, barH);
        const pw = (launchPower / 100) * barW;
        const pc = launchPower < 40 ? '#6bcb77' : launchPower < 70 ? '#ffd93d' : '#ff6b6b';
        ctx.fillStyle = pc;
        ctx.fillRect(bx, by, pw, barH);
    }

    // Ball
    const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.r);
    bg.addColorStop(0, '#fff');
    bg.addColorStop(0.5, '#e0e0ff');
    bg.addColorStop(1, '#8888cc');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    // Ball trail
    if (!ballAttached) {
        ctx.globalAlpha = 0.3;
        for (let i = 1; i <= 3; i++) {
            ctx.fillStyle = `rgba(136,136,204,${0.3 - i * 0.08})`;
            ctx.beginPath();
            ctx.arc(ball.x - ball.vx * i * 0.5, ball.y - ball.vy * i * 0.5, ball.r - i * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 30);
    ctx.fillText(`LIVES: ${'❤'.repeat(Math.max(0,lives))}`, 15, 52);
    ctx.textAlign = 'right';
    ctx.fillText(`LEVEL: ${level}`, GAME_W - 15, 30);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`HI: ${highScore}`, GAME_W - 15, 52);

    if (state === 'gameover') {
        drawOverlay('GAME OVER', `Final Score: ${score}`);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#aaa';
        ctx.textAlign = 'center';
        ctx.fillText('Press R or Enter to restart', GAME_W/2, GAME_H - 30);
    }

    if (state === 'levelcomplete') {
        drawOverlay(`LEVEL ${level} COMPLETE!`, 'Getting ready...');
    }

    // Instructions during play
    if (ballAttached && launchPower === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = '13px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('HOLD SPACE to charge, RELEASE to launch', GAME_W/2, GAME_H - 70);
    }

    ctx.restore();
}

function drawStartScreen() {
    // Title
    const t = 'BREAKOUT PINBALL';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    const tg = ctx.createLinearGradient(GAME_W/2 - 150, 0, GAME_W/2 + 150, 0);
    tg.addColorStop(0, '#ff6b6b');
    tg.addColorStop(0.5, '#ffd93d');
    tg.addColorStop(1, '#4d96ff');
    ctx.fillStyle = tg;
    ctx.fillText(t, GAME_W/2, 180);

    // Subtitle
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Bricks • Bumpers • Gravity', GAME_W/2, 220);

    // Controls box
    ctx.fillStyle = 'rgba(30,40,80,0.5)';
    ctx.beginPath();
    ctx.roundRect(GAME_W/2 - 160, 270, 320, 160, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(100,140,255,0.4)';
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    const lines = [
        '← → or A/D : Move Paddle',
        'HOLD SPACE  : Charge Launch',
        'RELEASE SPACE: Launch Ball',
        '',
        'Break bricks, hit bumpers!',
        `High Score: ${highScore}`
    ];
    lines.forEach((l, i) => {
        ctx.fillText(l, GAME_W/2, 305 + i * 22);
    });

    // Start prompt
    const blink = Math.sin(Date.now() * 0.005) > 0;
    if (blink) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('PRESS SPACE TO START', GAME_W/2, 490);
    }

    // Decorative bumpers
    const demoBumpers = [
        {x: 200, y: 530, r: 18}, {x: 400, y: 530, r: 18}, {x: 600, y: 530, r: 18}
    ];
    for (let b of demoBumpers) {
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        g.addColorStop(0, '#ff6b6b');
        g.addColorStop(1, '#8e44ad');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawOverlay(title, sub) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(title, GAME_W/2, GAME_H/2 - 20);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(sub, GAME_W/2, GAME_H/2 + 20);
}

let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Polyfill roundRect if needed
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    };
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
