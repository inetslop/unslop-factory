<!DOCTYPE html>

<title>Shadow Step - Stealth Physics Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
canvas { display: block; width: 100vw; height: 100vh; }

<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio System
let audioCtx = null;
let audioStarted = false;

function initAudio() {
    if (!audioStarted) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioStarted = true;
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'alert') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'caught') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(550, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'step') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (!audioStarted) initAudio();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Game State
let gameState = 'menu'; // menu, playing, dead, won, levelComplete
let currentLevel = 0;
let deathTimer = 0;
let winTimer = 0;
let levelTimer = 0;

// Particles
let particles = [];

function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed;
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd - 1,
            life: 1,
            decay: 0.02 + Math.random() * 0.03,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

// Level Data
const levels = [

        platforms: [

            { x: 400, y: 320, w: 150, h: 20 },

            { x: 780, y: 400, w: 100, h: 20 },

        ],
        shadows: [
            { x: 350, y: 460, w: 100, h: 40 },

        ],
        guards: [
            { x: 500, y: 480, patrolMin: 350, patrolMax: 650, speed: 1.2 },
        ]
    },
    {

        platforms: [

            { x: 450, y: 300, w: 120, h: 20 },

// Player
class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.w = 24;
        this.h = 36;
        this.crouching = false;
        this.grounded = false;
        this.facing = 1;
        this.detection = 0; // 0-1 how detected you are
        this.inShadow = false;
        this.onGround = false;
    }

    update(platforms, shadows) {
        // Crouch
        this.crouching = keys['KeyC'] || keys['ShiftLeft'] || keys['ShiftRight'];
        const h = this.crouching ? 20 : 36;
        if (this.crouching && !this.grounded) this.h = h;

        // Movement
        const speed = this.crouching ? 1.5 : 4;
        const accel = this.crouching ? 0.3 : 0.6;

        if (keys['KeyA'] || keys['ArrowLeft']) {
            this.vx -= accel;
            this.facing = -1;
        }
        if (keys['KeyD'] || keys['ArrowRight']) {
            this.vx += accel;
            this.facing = 1;
        }

        // Friction
        if (!keys['KeyA'] && !keys['ArrowLeft'] && !keys['KeyD'] && !keys['ArrowRight']) {
            this.vx *= this.grounded ? 0.85 : 0.98;
            if (Math.abs(this.vx) < 0.1) this.vx = 0;
        }

        // Clamp speed
        const maxSpeed = this.crouching ? 2 : 5;
        this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));

        // Jump
        if ((keys['Space'] || keys['KeyW'] || keys['ArrowUp']) && this.grounded) {
            this.vy = -11;
            this.grounded = false;
            playSound('jump');
        }

        // Gravity
        this.vy += 0.55;
        if (this.vy > 14) this.vy = 14;

        // Move X
        this.x += this.vx;
        this.collideX(platforms);

        // Move Y
        this.y += this.vy;
        this.grounded = false;
        this.collideY(platforms);

        // Keep in bounds
        if (this.x < 0) { this.x = 0; this.vx = 0; }
        if (this.x + this.w > 1000) { this.x = 1000 - this.w; this.vx = 0; }
        if (this.y > H) { this.dead = true; }

        // Shadow check
        this.inShadow = false;
        for (const s of shadows) {
            if (this.x + this.w > s.x && this.x < s.x + s.w &&
                this.y + this.h > s.y && this.y < s.y + s.h) {
                this.inShadow = true;
                break;
            }
        }

        // Footsteps
        if (this.grounded && Math.abs(this.vx) > 2 && Math.random() < 0.15) {
            playSound('step');
        }
    }

    collideX(platforms) {
        for (const p of platforms) {
            if (this.x + this.w > p.x && this.x < p.x + p.w &&
                this.y + this.h > p.y + 5 && this.y < p.y + p.h - 5) {
                if (this.vx > 0) this.x = p.x - this.w;
                else if (this.vx < 0) this.x = p.x + p.w;
                this.vx = 0;
            }
        }
    }

    collideY(platforms) {
        for (const p of platforms) {
            if (this.x + this.w > p.x && this.x < p.x + p.w &&
                this.y + this.h > p.y && this.y < p.y + p.h) {
                if (this.vy > 0) {
                    this.y = p.y - this.h;
                    this.vy = 0;
                    this.grounded = true;
                } else if (this.vy < 0) {
                    this.y = p.y + p.h;
                    this.vy = 0;
                }
            }
        }
    }

    draw() {
        const h = this.crouching ? 20 : 36;
        // Body
        ctx.fillStyle = this.inShadow ? 'rgba(100,180,255,0.7)' : '#4a9eff';
        ctx.fillRect(this.x, this.y + (this.h - h), this.w, h);

        // Head
        ctx.fillStyle = this.inShadow ? 'rgba(130,200,255,0.8)' : '#6ab4ff';
        const headY = this.y + (this.h - h) - 10;
        ctx.beginPath();
        ctx.arc(this.x + this.w/2, headY, 8, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        const eyeX = this.facing > 0 ? this.x + this.w - 10 : this.x + 4;
        ctx.fillRect(eyeX, headY - 2, 4, 3);

        // Detection indicator
        if (this.detection > 0.1) {
            ctx.strokeStyle = `rgba(255,${Math.floor(255*(1-this.detection))},0,${this.detection})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x + this.w/2, this.y + (this.h-h)/2, 25 + this.detection * 10, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Shadow glow when in shadow
        if (this.inShadow) {
            ctx.strokeStyle = 'rgba(100,180,255,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(this.x + this.w/2, this.y + (this.h-h)/2, 20, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
}

// Guard AI
class Guard {
    constructor(x, y, patrolMin, patrolMax, speed) {
        this.x = x;
        this.y = y;
        this.w = 24;
        this.h = 36;
        this.vx = 0;
        this.vy = 0;
        this.speed = speed;
        this.patrolMin = patrolMin;
        this.patrolMax = patrolMax;
        this.facing = 1;
        this.state = 'patrol'; // patrol, alert, chase, search
        this.alertTimer = 0;
        this.searchTimer = 0;
        this.lastKnownX = 0;
        this.visionRange = 220;
        this.visionAngle = 0.4; // radians half-angle
        this.detectionMeter = 0;
    }

    update(player, platforms) {
        // Physics
        this.vy += 0.55;
        if (this.vy > 12) this.vy = 12;

        if (this.state === 'patrol') {
            this.vx = this.facing * this.speed;
            if (this.x <= this.patrolMin) { this.facing = 1; }
            if (this.x + this.w >= this.patrolMax) { this.facing = -1; }
        } else if (this.state === 'chase') {
            const dx = player.x - this.x;
            this.facing = dx > 0 ? 1 : -1;
            this.vx = this.facing * this.speed * 1.6;

            // Jump if needed
            if (player.y < this.y - 30 && this.grounded() && Math.random() < 0.1) {
                this.vy = -10;
            }

            // Lose sight after a while
            if (!this.canSeePlayer(player)) {
                this.alertTimer -= 0.016;
                if (this.alertTimer <= 0) {
                    this.state = 'search';
                    this.searchTimer = 3;
                }
            } else {
                this.alertTimer = 2;
            }
        } else if (this.state === 'search') {
            this.vx = 0;
            this.searchTimer -= 0.016;
            if (this.canSeePlayer(player)) {
                this.state = 'chase';
                this.alertTimer = 2;
            }
            if (this.searchTimer <= 0) {
                this.state = 'patrol';
            }
        } else if (this.state === 'alert') {
            this.vx = 0;
            this.alertTimer -= 0.016;
            if (this.alertTimer <= 0) {
                this.state = 'chase';
            }
        }

        // Move
        this.x += this.vx;
        this.collideX(platforms);
        this.y += this.vy;
        this.collideY(platforms);

        if (this.x < 0) { this.x = 0; this.facing = 1; }
        if (this.x + this.w > 1000) { this.x = 1000 - this.w; this.facing = -1; }
    }

    grounded() {
        return Math.abs(this.vy) < 1 && false; // simplified
    }

    collideX(platforms) {
        for (const p of platforms) {
            if (this.x + this.w > p.x && this.x < p.x + p.w &&
                this.y + this.h > p.y + 5 && this.y < p.y + p.h - 5) {
                if (this.vx > 0) this.x = p.x - this.w;
                else if (this.vx < 0) this.x = p.x + p.w;
                this.vx = 0;
            }
        }
    }

    collideY(platforms) {
        for (const p of platforms) {
            if (this.x + this.w > p.x && this.x < p.x + p.w &&
                this.y + this.h > p.y && this.y < p.y + p.h) {
                if (this.vy > 0) {
                    this.y = p.y - this.h;
                    this.vy = 0;
                } else if (this.vy < 0) {
                    this.y = p.y + p.h;
                    this.vy = 0;
                }
            }
        }
    }

    canSeePlayer(player) {
        const px = player.x + player.w / 2;
        const py = player.y + player.h / 2;
        const gx = this.x + this.w / 2;
        const gy = this.y + 10;

        const dx = px - gx;
        const dy = py - gy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > this.visionRange) return false;

        const angle = Math.atan2(dy, dx);
        const facingAngle = this.facing > 0 ? 0 : Math.PI;
        let diff = Math.abs(angle - facingAngle);
        if (diff > Math.PI) diff = 2 * Math.PI - diff;

        if (diff > this.visionAngle) return false;

        // Check if player is in shadow and crouching
        if (player.inShadow && player.crouching) return false;

        return true;
    }

    getDetectionRate(player) {
        const px = player.x + player.w / 2;
        const py = player.y + player.h / 2;
        const gx = this.x + this.w / 2;
        const gy = this.y + 10;

        const dx = px - gx;
        const dy = py - gy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > this.visionRange) return 0;

        const angle = Math.atan2(dy, dx);
        const facingAngle = this.facing > 0 ? 0 : Math.PI;
        let diff = Math.abs(angle - facingAngle);
        if (diff > Math.PI) diff = 2 * Math.PI - diff;

        if (diff > this.visionAngle) return 0;

        // Detection rate based on distance, crouching, shadow
        let rate = 1 - (dist / this.visionRange);
        if (player.crouching) rate *= 0.4;
        if (player.inShadow) rate *= 0.3;
        if (Math.abs(player.vx) > 3) rate *= 1.5; // running makes noise

        return Math.max(0, rate);
    }

    draw() {
        // Body
        const bodyColor = this.state === 'chase' ? '#ff4444' :
                          this.state === 'alert' ? '#ffaa33' :
                          this.state === 'search' ? '#ffcc00' : '#88cc44';
        ctx.fillStyle = bodyColor;
        ctx.fillRect(this.x, this.y, this.w, this.h);

        // Head
        ctx.fillStyle = this.state === 'chase' ? '#ff6666' : '#aadd66';
        ctx.beginPath();
        ctx.arc(this.x + this.w/2, this.y - 8, 9, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        const eyeOff = this.facing > 0 ? 4 : -4;
        ctx.fillRect(this.x + this.w/2 + eyeOff - 2, this.y - 10, 4, 3);

        // Vision cone
        if (this.state === 'patrol' || this.state === 'search') {
            const coneColor = this.state === 'search' ? 'rgba(255,200,0,' : 'rgba(100,255,100,';
            ctx.fillStyle = coneColor + '0.08)';
            const cx = this.x + this.w/2;
            const cy = this.y + 10;
            const dir = this.facing > 0 ? 0 : Math.PI;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, this.visionRange, dir - this.visionAngle, dir + this.visionAngle);
            ctx.closePath();
            ctx.fill();

            // Cone outline
            ctx.strokeStyle = coneColor + '0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Alert indicator
        if (this.state === 'alert') {
            ctx.fillStyle = '#ffaa33';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('!', this.x + this.w/2 - 3, this.y - 20);
        } else if (this.state === 'chase') {
            ctx.fillStyle = '#ff4444';
            ctx.font = 'bold 16px monospace';
            ctx.fillText('!!', this.x + this.w/2 - 5, this.y - 20);
        }
    }
}

// Game variables
let player, guards, exit;
let levelData;

function loadLevel(idx) {
    currentLevel = idx;
    levelData = levels[idx];
    player = new Player(levelData.playerStart.x, levelData.playerStart.y);
    guards = levelData.guards.map(g => new Guard(g.x, g.y, g.patrolMin, g.patrolMax, g.speed));
    exit = levelData.exit;
    particles = [];
    levelTimer = 0;
}

function drawBackground() {
    // Dark gradient background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + 50) % W;
        const sy = (i * 97 + 20) % (H * 0.6);
        ctx.fillStyle = `rgba(255,255,255,${0.2 + (i % 3) * 0.15})`;
        ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    // Moon
    ctx.fillStyle = 'rgba(200,210,255,0.15)';
    ctx.beginPath();
    ctx.arc(W - 80, 60, 30, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlatforms() {
    for (const p of levelData.platforms) {
        ctx.fillStyle = '#2a2a3e';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#4a4a6e';
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        // Top highlight
        ctx.fillStyle = 'rgba(100,120,180,0.3)';
        ctx.fillRect(p.x, p.y, p.w, 3);
    }
}

function drawShadows() {
    for (const s of levelData.shadows) {
        ctx.fillStyle = 'rgba(30,50,100,0.4)';
        ctx.fillRect(s.x, s.y, s.w, s.h);
        ctx.strokeStyle = 'rgba(80,120,200,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(s.x, s.y, s.w, s.h);

        // Shadow icon
        ctx.fillStyle = 'rgba(100,150,255,0.4)';
        ctx.font = '10px monospace';
        ctx.fillText('SHADOW', s.x + 10, s.y + s.h/2 + 3);
    }
}

function drawExit() {
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(0,255,150,${pulse * 0.3})`;
    ctx.beginPath();
    ctx.arc(exit.x + 20, exit.y + 20, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(0,255,150,${pulse})`;
    ctx.font = 'bold 14px monospace';
    ctx.fillText('EXIT', exit.x + 8, exit.y + 25);

    // Glow
    ctx.strokeStyle = `rgba(0,255,150,${pulse * 0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(exit.x + 20, exit.y + 20, 25, 0, Math.PI * 2);
    ctx.stroke();
}

function drawHUD() {
    // Level name
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '14px monospace';
    ctx.fillText(`Level ${currentLevel + 1}: ${levelData.name}`, 15, 30);

    // Detection meter
    const detW = 150;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W - detW - 20, 15, detW, 16);
    const detColor = player.detection > 0.7 ? '#ff3333' : player.detection > 0.4 ? '#ffaa00' : '#33cc33';
    ctx.fillStyle = detColor;
    ctx.fillRect(W - detW - 20, 15, detW * player.detection, 16);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.strokeRect(W - detW - 20, 15, detW, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '10px monospace';
    ctx.fillText('DETECTION', W - detW - 20, 40);

    // Status
    if (player.inShadow) {
        ctx.fillStyle = 'rgba(100,180,255,0.8)';
        ctx.fillText('[HIDDEN IN SHADOW]', 15, 55);
    }
    if (player.crouching) {
        ctx.fillStyle = 'rgba(200,200,255,0.6)';
        ctx.fillText('[CROUCHING]', 15, player.inShadow ? 72 : 55);
    }
}

function drawMenu() {
    drawBackground();

    // Title
    ctx.fillStyle = '#4a9eff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SHADOW STEP', W/2, H/3);

    // Subtitle
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '16px monospace';
    ctx.fillText('A Stealth Physics Game', W/2, H/3 + 35);

    // Controls
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '14px monospace';
    const controls = [
        'A/D or ←/→ - Move',
        'Space / W / ↑ - Jump',
        'C / Shift - Crouch (stay hidden)',
        '',
        'Reach the EXIT without being caught.',
        'Use SHADOWS to hide from guards.',
        'Crouching makes you harder to detect.',
        'Running creates noise!',
    ];
    controls.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 + 20 + i * 24);
    });

    // Start prompt
    const blink = Math.sin(Date.now() * 0.003) > 0;
    if (blink) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('Press SPACE to Begin', W/2, H - 60);
    }

    ctx.textAlign = 'left';
}

function drawDeath() {
    ctx.fillStyle = 'rgba(255,0,0,0.3)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('DETECTED!', W/2, H/2 - 20);

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '16px monospace';
    ctx.fillText('Press SPACE to retry', W/2, H/2 + 30);
    ctx.textAlign = 'left';
}

function drawWin() {
    ctx.fillStyle = 'rgba(0,255,150,0.1)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#00ff96';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    if (currentLevel >= levels.length - 1) {
        ctx.fillText('MISSION COMPLETE!', W/2, H/2 - 20);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = '16px monospace';
        ctx.fillText('You slipped through the shadows...', W/2, H/2 + 20);
        ctx.fillText('Press SPACE to play again', W/2, H/2 + 55);
    } else {
        ctx.fillText('LEVEL CLEAR!', W/2, H/2 - 20);
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = '16px monospace';
        ctx.fillText('Press SPACE for next level', W/2, H/2 + 30);
    }
    ctx.textAlign = 'left';
}

// Main game loop
let lastTime = 0;

function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;

    ctx.clearRect(0, 0, W, H);

    if (gameState === 'menu') {
        drawMenu();
        if (keys['Space']) {
            loadLevel(0);
            gameState = 'playing';
        }
    } else if (gameState === 'playing') {
        levelTimer += dt;

        // Update player
        player.update(levelData.platforms, levelData.shadows);

        // Update guards
        for (const g of guards) {
            g.update(player, levelData.platforms);

            // Detection
            const rate = g.getDetectionRate(player);
            if (rate > 0) {
                player.detection += rate * 0.02;
                if (player.detection >= 1) {
                    gameState = 'dead';
                    deathTimer = 0;
                    playSound('caught');
                    spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 20, 5);
                } else if (rate > 0.3 && g.state === 'patrol') {
                    g.state = 'alert';
                    g.alertTimer = 1;
                    playSound('alert');
                }
            }

            // Catch player if touching during chase
            if (g.state === 'chase') {
                if (player.x + player.w > g.x && player.x < g.x + g.w &&
                    player.y + player.h > g.y && player.y < g.y + g.h) {
                    gameState = 'dead';
                    deathTimer = 0;
                    playSound('caught');
                    spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 30, 6);
                }
            }
        }

        // Decay detection if no one sees you
        let anySeeing = false;
        for (const g of guards) {
            if (g.getDetectionRate(player) > 0) anySeeing = true;
        }
        if (!anySeeing) {
            player.detection = Math.max(0, player.detection - 0.01);
        }

        // Check exit
        const px = player.x + player.w/2;
        const py = player.y + player.h/2;
        const ex = exit.x + 20;
        const ey = exit.y + 20;
        if (Math.sqrt((px-ex)**2 + (py-ey)**2) < 30) {
            gameState = 'won';
            winTimer = 0;
            playSound('win');
            spawnParticles(ex, ey, '#00ff96', 25, 4);
        }

        // Draw
        drawBackground();
        drawShadows();
        drawPlatforms();
        drawExit();
        for (const g of guards) g.draw();
        player.draw();
        updateParticles();
        drawParticles();
        drawHUD();

    } else if (gameState === 'dead') {
        deathTimer += dt;
        drawBackground();
        drawShadows();
        drawPlatforms();
        for (const g of guards) g.draw();
        player.draw();
        updateParticles();
        drawParticles();
        drawHUD();
        drawDeath();

        if (keys['Space'] && deathTimer > 30) {
            loadLevel(currentLevel);
            gameState = 'playing';
        }
    } else if (gameState === 'won') {
        winTimer += dt;
        drawBackground();
        drawShadows();
        drawPlatforms();
        drawExit();
        for (const g of guards) g.draw();
        player.draw();
        updateParticles();
        drawParticles();
        drawHUD();
        drawWin();

        if (keys['Space'] && winTimer > 30) {
            if (currentLevel < levels.length - 1) {
                loadLevel(currentLevel + 1);
                gameState = 'playing';
            } else {
                loadLevel(0);
                gameState = 'menu';
            }
        }
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
