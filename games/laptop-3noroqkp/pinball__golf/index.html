<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf Pinball</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #1a4d1a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            width: 100vw;
        }
        canvas { 
            display: block; 
            cursor: crosshair;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function playHit() { playSound(200, 0.15, 'triangle', 0.4); }
function playBounce() { playSound(300, 0.1, 'square', 0.2); }
function playHole() { 
    playSound(400, 0.3, 'sine', 0.5); 
    setTimeout(() => playSound(600, 0.3, 'sine', 0.5), 100);
    setTimeout(() => playSound(800, 0.4, 'sine', 0.5), 200);
}
function playSand() { playSound(150, 0.2, 'sawtooth', 0.15); }

// Game State
const STATE = { MENU: 0, PLAYING: 1, AIMING: 2, ROLLING: 3, HOLE_COMPLETE: 4, GAME_OVER: 5 };
let state = STATE.MENU;
let level = 0;
let strokes = 0;
let totalStrokes = 0;
let parTotal = 0;
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 12 };
let hole = { x: 0, y: 0, r: 20 };
let obstacles = [];
let sandTraps = [];
let walls = [];
let aimStart = null;
let aimEnd = null;
let maxPower = 800;
let friction = 0.985;
let holeCompleteTimer = 0;
let particles = [];
let flagWave = 0;
let ballTrail = [];

// Levels
const levels = [
    {
        name: "Hole 1 - The Flat",
        par: 2,
        ballPos: (w) => ({ x: w * 0.25, y: w * 0.5 }),
        holePos: (w) => ({ x: w * 0.75, y: w * 0.5 }),
        obstacles: [],
        sandTraps: []
    },
    {
        name: "Hole 2 - The Trees",
        par: 3,
        ballPos: (w) => ({ x: w * 0.15, y: w * 0.7 }),
        holePos: (w) => ({ x: w * 0.8, y: w * 0.3 }),
        obstacles: [
            { x: 0.4, y: 0.5, r: 25 },
            { x: 0.6, y: 0.7, r: 25 },
            { x: 0.5, y: 0.3, r: 20 }
        ],
        sandTraps: []
    },
    {
        name: "Hole 3 - The Bunker",
        par: 3,
        ballPos: (w) => ({ x: w * 0.15, y: w * 0.5 }),
        holePos: (w) => ({ x: w * 0.85, y: w * 0.5 }),
        obstacles: [
            { x: 0.35, y: 0.2, r: 22 },
            { x: 0.65, y: 0.8, r: 22 }
        ],
        sandTraps: [
            { x: 0.5, y: 0.5, r: 50 },
            { x: 0.7, y: 0.3, r: 40 }
        ]
    },
    {
        name: "Hole 4 - The Maze",
        par: 4,
        ballPos: (w) => ({ x: w * 0.15, y: w * 0.8 }),
        holePos: (w) => ({ x: w * 0.85, y: w * 0.2 }),
        obstacles: [
            { x: 0.35, y: 0.6, r: 28 },
            { x: 0.55, y: 0.4, r: 28 },
            { x: 0.7, y: 0.6, r: 22 },
            { x: 0.4, y: 0.15, r: 18 }
        ],
        sandTraps: [
            { x: 0.25, y: 0.35, r: 35 }
        ]
    },
    {
        name: "Hole 5 - The Gauntlet",
        par: 4,
        ballPos: (w) => ({ x: w * 0.12, y: w * 0.5 }),
        holePos: (w) => ({ x: w * 0.88, y: w * 0.5 }),
        obstacles: [
            { x: 0.3, y: 0.3, r: 24 },
            { x: 0.3, y: 0.7, r: 24 },
            { x: 0.5, y: 0.15, r: 20 },
            { x: 0.5, y: 0.85, r: 20 },
            { x: 0.7, y: 0.3, r: 24 },
            { x: 0.7, y: 0.7, r: 24 }
        ],
        sandTraps: [
            { x: 0.4, y: 0.5, r: 30 },
            { x: 0.6, y: 0.5, r: 30 }
        ]
    }
];

function loadLevel(idx) {
    level = idx;
    strokes = 0;
    const lv = levels[idx];
    const size = Math.min(W, H) * 0.85;
    const ox = (W - size) / 2;
    const oy = (H - size) / 2;

    const bp = lv.ballPos(size);
    ball.x = ox + bp.x;
    ball.y = oy + bp.y;
    ball.vx = 0;
    ball.vy = 0;
    ball.r = Math.max(10, size * 0.025);

    const hp = lv.holePos(size);
    hole.x = ox + hp.x;
    hole.y = oy + hp.y;
    hole.r = Math.max(18, size * 0.04);

    obstacles = lv.obstacles.map(o => ({ x: ox + o.x * size, y: oy + o.y * size, r: o.r * (size / 600) }));
    sandTraps = lv.sandTraps.map(s => ({ x: ox + s.x * size, y: oy + s.y * size, r: s.r * (size / 600) }));

    walls = [
        { x1: ox, y1: oy, x2: ox + size, y2: oy },
        { x1: ox + size, y1: oy, x2: ox + size, y2: oy + size },
        { x1: ox + size, y1: oy + size, x2: ox, y2: oy + size },
        { x1: ox, y1: oy + size, x2: ox, y2: oy }
    ];

    ballTrail = [];
    particles = [];
}

function startGame() {
    totalStrokes = 0;
    parTotal = levels.reduce((s, l) => s + l.par, 0);
    loadLevel(0);
    state = STATE.PLAYING;
}

function drawCourse() {
    const size = Math.min(W, H) * 0.85;
    const ox = (W - size) / 2;
    const oy = (H - size) / 2;

    // Background
    ctx.fillStyle = '#1a4d1a';
    ctx.fillRect(0, 0, W, H);

    // Course area
    ctx.fillStyle = '#2d7d2d';
    ctx.fillRect(ox, oy, size, size);

    // Mowing pattern
    for (let i = 0; i < size / 30; i++) {
        if (i % 2 === 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fillRect(ox + i * 30, oy, 30, size);
        }
    }

    // Border
    ctx.strokeStyle = '#8B4513';
    ctx.lineWidth = 6;
    ctx.strokeRect(ox, oy, size, size);

    // Sand traps
    sandTraps.forEach(st => {
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fillStyle = '#d4a843';
        ctx.fill();
        ctx.strokeStyle = '#c49a3a';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Dots in sand
        for (let i = 0; i < 8; i++) {
            const a = (i / 8) * Math.PI * 2;
            const dx = Math.cos(a) * st.r * 0.5;
            const dy = Math.sin(a) * st.r * 0.5;
            ctx.beginPath();
            ctx.arc(st.x + dx, st.y + dy, 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(180,140,60,0.5)';
            ctx.fill();
        }
    });

    // Hole
    ctx.beginPath();
    ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Flag
    flagWave += 0.05;
    const flagX = hole.x;
    const flagY = hole.y - hole.r;
    ctx.beginPath();
    ctx.moveTo(flagX, flagY);
    ctx.lineTo(flagX, flagY - 40);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
    // Flag cloth
    ctx.beginPath();
    ctx.moveTo(flagX, flagY - 40);
    ctx.lineTo(flagX + 25 + Math.sin(flagWave) * 3, flagY - 35);
    ctx.lineTo(flagX, flagY - 30);
    ctx.closePath();
    ctx.fillStyle = '#ff3333';
    ctx.fill();

    // Obstacles (trees)
    obstacles.forEach(ob => {
        // Shadow
        ctx.beginPath();
        ctx.arc(ob.x + 3, ob.y + 3, ob.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fill();
        // Tree body
        ctx.beginPath();
        ctx.arc(ob.x, ob.y, ob.r, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(ob.x - ob.r * 0.3, ob.y - ob.r * 0.3, 0, ob.x, ob.y, ob.r);
        grad.addColorStop(0, '#4a9e4a');
        grad.addColorStop(1, '#1a5c1a');
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#0d3d0d';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Trunk
        ctx.beginPath();
        ctx.arc(ob.x, ob.y, ob.r * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = '#5a3a1a';
        ctx.fill();
    });

    // Ball trail
    ballTrail.forEach((t, i) => {
        const alpha = (i / ballTrail.length) * 0.4;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.r * 0.6 * (i / ballTrail.length), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
    });

    // Ball
    const bGrad = ctx.createRadialGradient(ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, 0, ball.x, ball.y, ball.r);
    bGrad.addColorStop(0, '#fff');
    bGrad.stop(1, '#ccc');
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = bGrad;
    ctx.fill();
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Dimples on ball
    for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const dx = Math.cos(a) * ball.r * 0.5;
        const dy = Math.sin(a) * ball.r * 0.5;
        ctx.beginPath();
        ctx.arc(ball.x + dx, ball.y + dy, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180,180,180,0.5)';
        ctx.fill();
    }

    // Aim line
    if (state === STATE.AIMING && aimStart && aimEnd) {
        const dx = aimStart.x - aimEnd.x;
        const dy = aimStart.y - aimEnd.y;
        const power = Math.min(Math.sqrt(dx * dx + dy * dy), maxPower);
        const angle = Math.atan2(dy, dx);

        // Dotted line
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + Math.cos(angle) * power * 0.5, ball.y + Math.sin(angle) * power * 0.5);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.setLineDash([]);

        // Power indicator
        const pw = power / maxPower;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r + 8, -Math.PI / 2, -Math.PI / 2 + pw * Math.PI * 2);
        ctx.strokeStyle = pw > 0.7 ? '#ff4444' : pw > 0.4 ? '#ffaa00' : '#44ff44';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Arrow
        const ax = ball.x + Math.cos(angle) * (ball.r + 15);
        const ay = ball.y + Math.sin(angle) * (ball.r + 15);
        ctx.beginPath();
        ctx.arc(ax, ay, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }

    // Particles
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.c},${p.alpha})`;
        ctx.fill();
    });

    // HUD
    if (state !== STATE.MENU) {
        ctx.font = 'bold 16px monospace';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.fillText(`Hole: ${level + 1}/${levels.length}`, 15, 25);
        ctx.fillText(`${levels[level].name}`, 15, 48);
        ctx.fillText(`Strokes: ${strokes} (Par: ${levels[level].par})`, 15, 71);
        ctx.textAlign = 'right';
        ctx.fillText(`Total: ${totalStrokes} | Par: ${parTotal}`, W - 15, 25);

        // Score display
        const diff = totalStrokes - parTotal;
        let scoreLabel = '';
        if (diff === 0) scoreLabel = 'E (Even)';
        else if (diff < 0) scoreLabel = `${Math.abs(diff)}U`;
        else scoreLabel = `${diff}O`;
        ctx.font = 'bold 14px monospace';
        ctx.fillText(`Score: ${scoreLabel}`, W - 15, 48);
    }

    // Hole complete overlay
    if (state === STATE.HOLE_COMPLETE) {
        const diff = strokes - levels[level].par;
        let msg = '';
        if (diff <= -2) msg = 'EAGLE!';
        else if (diff === -1) msg = 'BIRDIE!';
        else if (diff === 0) msg = 'PAR!';
        else if (diff === 1) msg = 'BOGEY';
        else msg = `+${diff}`;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, H / 2 - 80, W, 160);
        ctx.font = 'bold 48px monospace';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText(msg, W / 2, H / 2 - 10);
        ctx.font = '20px monospace';
        ctx.fillText(`${strokes} stroke(s) - Par ${levels[level].par}`, W / 2, H / 2 + 30);
        ctx.font = '16px monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Click to continue', W / 2, H / 2 + 60);
    }

    // Game Over
    if (state === STATE.GAME_OVER) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.font = 'bold 48px monospace';
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.fillText('ROUND COMPLETE', W / 2, H / 2 - 60);

        const diff = totalStrokes - parTotal;
        let finalMsg = '';
        if (diff === 0) finalMsg = 'Even Par! Great Round!';
        else if (diff < 0) finalMsg = `${Math.abs(diff)} Under Par! Excellent!`;
        else finalMsg = `${diff} Over Par. Keep Practicing!`;

        ctx.font = '28px monospace';
        ctx.fillStyle = '#4f4';
        ctx.fillText(finalMsg, W / 2, H / 2);
        ctx.font = '20px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Total: ${totalStrokes} strokes | Par: ${parTotal}`, W / 2, H / 2 + 45);
        ctx.font = '18px monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Click to Play Again', W / 2, H / 2 + 90);
    }

    // Menu
    if (state === STATE.MENU) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';

        // Title
        ctx.font = 'bold 64px monospace';
        ctx.fillStyle = '#4f4';
        ctx.fillText('GOLF PINBALL', W / 2, H / 3);

        // Subtitle
        ctx.font = '20px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Sink the ball in as few strokes as possible!', W / 2, H / 3 + 50);

        // Controls
        ctx.font = '18px monospace';
        ctx.fillStyle = '#ccc';
        const controls = [
            '🎯 Click & drag from the ball to aim',
            '💪 Release to launch (further = more power)',
            '🌳 Bounce off trees, avoid sand traps!',
            '⛳ Get the ball in the hole',
            '📊 5 holes - beat par for a great score!'
        ];
        controls.forEach((c, i) => {
            ctx.fillText(c, W / 2, H / 3 + 100 + i * 30);
        });

        // Start prompt
        const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
        ctx.font = 'bold 24px monospace';
        ctx.fillStyle = `rgba(255,255,100,${pulse})`;
        ctx.fillText('Click to Start', W / 2, H - 80);

        // Decorative ball
        const bx = W / 2;
        const by = H / 3 - 60;
        ctx.beginPath();
        ctx.arc(bx, by, 15, 0, Math.PI * 2);
        const mg = ctx.createRadialGradient(bx - 4, by - 4, 0, bx, by, 15);
        mg.addColorStop(0, '#fff');
        mg.addColorStop(1, '#bbb');
        ctx.fillStyle = mg;
        ctx.fill();
    }
}

function update(dt) {
    if (state !== STATE.ROLLING) return;

    // Check sand traps
    let inSand = false;
    sandTraps.forEach(st => {
        const dx = ball.x - st.x;
        const dy = ball.y - st.y;
        if (Math.sqrt(dx * dx + dy * dy) < st.r) inSand = true;
    });

    const fric = inSand ? 0.94 : friction;

    ball.vx *= fric;
    ball.vy *= fric;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Wall collisions
    const size = Math.min(W, H) * 0.85;
    const ox = (W - size) / 2;
    const oy = (H - size) / 2;

    if (ball.x - ball.r < ox) { ball.x = ox + ball.r; ball.vx = Math.abs(ball.vx) * 0.7; playBounce(); }
    if (ball.x + ball.r > ox + size) { ball.x = ox + size - ball.r; ball.vx = -Math.abs(ball.vx) * 0.7; playBounce(); }
    if (ball.y - ball.r < oy) { ball.y = oy + ball.r; ball.vy = Math.abs(ball.vy) * 0.7; playBounce(); }
    if (ball.y + ball.r > oy + size) { ball.y = oy + size - ball.r; ball.vy = -Math.abs(ball.vy) * 0.7; playBounce(); }

    // Obstacle collisions
    obstacles.forEach(ob => {
        const dx = ball.x - ob.x;
        const dy = ball.y - ob.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = ball.r + ob.r;
        if (dist < minDist) {
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x = ob.x + nx * minDist;
            ball.y = ob.y + ny * minDist;
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx * 0.8;
            ball.vy -= 2 * dot * ny * 0.8;
            playBounce();
        }
    });

    // Trail
    if (Math.abs(ball.vx) > 1 || Math.abs(ball.vy) > 1) {
        ballTrail.push({ x: ball.x, y: ball.y });
        if (ballTrail.length > 20) ballTrail.shift();
    } else {
        ballTrail.shift();
    }

    // Hole detection
    const hdx = ball.x - hole.x;
    const hdy = ball.y - hole.y;
    const hdist = Math.sqrt(hdx * hdx + hdy * hdy);
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);

    if (hdist < hole.r * 0.7 && speed < 8) {
        // Suck into hole
        ball.x += (hole.x - ball.x) * 0.3;
        ball.y += (hole.y - ball.y) * 0.3;
        ball.vx *= 0.5;
        ball.vy *= 0.5;
        if (hdist < hole.r * 0.3) {
            ball.x = hole.x;
            ball.y = hole.y;
            ball.vx = 0;
            ball.vy = 0;
            state = STATE.HOLE_COMPLETE;
            playHole();
            totalStrokes += strokes;
            // Particles
            for (let i = 0; i < 20; i++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: hole.x, y: hole.y,
                    vx: Math.cos(a) * (Math.random() * 3 + 1),
                    vy: Math.sin(a) * (Math.random() * 3 + 1),
                    r: Math.random() * 4 + 2,
                    alpha: 1,
                    c: '255,255,255'
                });
            }
        }
    }

    // Stop if slow enough
    if (Math.abs(ball.vx) < 0.3 && Math.abs(ball.vy) < 0.3 && hdist >= hole.r * 0.7) {
        ball.vx = 0;
        ball.vy = 0;
        state = STATE.PLAYING;
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(i, 1);
    }
}

let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;

    update(dt);
    drawCourse();

    requestAnimationFrame(gameLoop);
}

// Input
function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x, y };
}

function onDown(e) {
    e.preventDefault();
    initAudio();
    const pos = getPos(e);

    if (state === STATE.MENU) {
        startGame();
        return;
    }
    if (state === STATE.HOLE_COMPLETE) {
        if (level + 1 < levels.length) {
            loadLevel(level + 1);
            state = STATE.PLAYING;
        } else {
            state = STATE.GAME_OVER;
        }
        return;
    }
    if (state === STATE.GAME_OVER) {
        startGame();
        return;
    }
    if (state === STATE.PLAYING) {
        const dx = pos.x - ball.x;
        const dy = pos.y - ball.y;
        if (Math.sqrt(dx * dx + dy * dy) < 50) {
            state = STATE.AIMING;
            aimStart = { x: ball.x, y: ball.y };
            aimEnd = pos;
        }
    }
}

function onMove(e) {
    e.preventDefault();
    if (state === STATE.AIMING) {
        const pos = getPos(e);
        aimEnd = pos;
    }
}

function onUp(e) {
    e.preventDefault();
    if (state === STATE.AIMING && aimStart && aimEnd) {
        const dx = aimStart.x - aimEnd.x;
        const dy = aimStart.y - aimEnd.y;
        const power = Math.min(Math.sqrt(dx * dx + dy * dy), maxPower);
        if (power > 10) {
            const angle = Math.atan2(dy, dx);
            ball.vx = Math.cos(angle) * power * 0.05;
            ball.vy = Math.sin(angle) * power * 0.05;
            strokes++;
            state = STATE.ROLLING;
            playHit();
        } else {
            state = STATE.PLAYING;
        }
        aimStart = null;
        aimEnd = null;
    }
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', (e) => { const pos = getPos(e); e.preventDefault(); initAudio(); 
    if (state === STATE.MENU) { startGame(); return; }
    if (state === STATE.HOLE_COMPLETE) { if (level + 1 < levels.length) { loadLevel(level+1); state = STATE.PLAYING; } else { state = STATE.GAME_OVER; } return; }
    if (state === STATE.GAME_OVER) { startGame(); return; }
    if (state === STATE.PLAYING) {
        const dx = pos.x - ball.x, dy = pos.y - ball.y;
        if (Math.sqrt(dx*dx+dy*dy) < 50) { state = STATE.AIMING; aimStart = {x:ball.x,y:ball.y}; aimEnd = pos; }
    }
}, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});

// Keyboard restart
window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
        initAudio();
        startGame();
    }
    if (e.key === 'Escape') {
        state = STATE.MENU;
    }
});

// Start
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
