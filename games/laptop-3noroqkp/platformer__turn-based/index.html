<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tile Hopper - Turn-Based Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, TILE;
function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    TILE = Math.floor(Math.min(W / 26, H / 15));
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)(); }
function playSound(freq, dur, type='square', vol=0.15) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// Game state
let gameState = 'start'; // start, playing, dead, won
let animT = 0;
let animating = false;
let score = 0;
let turn = 0;

const MAP_W = 25, MAP_H = 14;
let map = [];
let player = { x: 1, y: 12, vy: 0 };
let enemies = [];
let coins = [];
let goalPos = { x: 23, y: 12 };

function generateMap() {
    map = Array.from({length: MAP_H}, () => Array(MAP_W).fill(0));
    // Floor
    for (let x = 0; x < MAP_W; x++) map[MAP_H-1][x] = 1;
    // Walls
    for (let y = 0; y < MAP_H; y++) { map[y][0] = 1; map[y][MAP_W-1] = 1; }

    // Platforms and obstacles
    const platforms = [
        [4,10,3],[8,9,2],[12,8,3],[7,7,2],
        [15,10,2],[18,9,3],[14,6,2],[20,7,2],
        [10,5,3],[22,10,1],[17,5,2]
    ];
    platforms.forEach(([x,y,w]) => {
        for (let i=0;i<w;i++) if (map[y][x+i]===0) map[y][x+i]=2;
    });

    // Goal
    goalPos = {x: 23, y: MAP_H-2};
    map[goalPos.y][goalPos.x] = 3;

    // Coins
    coins = [
        {x:5,y:9},{x:6,y:9},{x:8,y:8},{x:13,y:7},
        {x:14,y:7},{x:10,y:4},{x:11,y:4},{x:21,y:6},{x:17,y:4}
    ];

    // Enemies
    enemies = [
        {x: 6, y: MAP_H-2, dir: 1, range: [4,9]},
        {x: 13, y: 9, dir: 1, range: [12,14]},
        {x: 19, y: MAP_H-2, dir: -1, range: [17,22]},
        {x: 15, y: 5, dir: 1, range: [14,16]}
    ];

    player = {x: 1, y: MAP_H-2};
    score = 0; turn = 0;
}

function isSolid(x, y) {
    if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return true;
    return map[y][x] === 1;
}
function isPlatform(x, y) {
    if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return false;
    return map[y][x] === 2;
}
function canStand(x, y) {
    // Can stand on solid or platform
    if (y < 0 || y >= MAP_H) return false;
    return isSolid(x, y) || isPlatform(x, y);
}

function resolveGravity() {
    let moved = false;
    while (!animating && player.y < MAP_H - 1) {
        if (canStand(player.x, player.y + 1)) {
            player.y++; moved = true;
        } else break;
    }
    return moved;
}

function doAction(action) {
    if (animating || gameState !== 'playing') return;
    initAudio();
    turn++;

    let moved = false;
    if (action === 'left' && !isSolid(player.x - 1, player.y)) {
        player.x--; moved = true;
        playSound(200, 0.08);
    } else if (action === 'right' && !isSolid(player.x + 1, player.y)) {
        player.x++; moved = true;
        playSound(200, 0.08);
    } else if (action === 'up') {
        // Jump: move up one tile
        if (player.y > 0 && !isSolid(player.x, player.y - 1)) {
            player.y--; moved = true;
            playSound(400, 0.1, 'sine');
        } else {
            playSound(100, 0.1, 'sawtooth', 0.05);
        }
    }

    // Gravity
    let grav = resolveGravity();
    if (grav) playSound(150, 0.06, 'sine', 0.08);

    // Check coins
    for (let i = coins.length - 1; i >= 0; i--) {
        if (player.x === coins[i].x && player.y === coins[i].y) {
            coins.splice(i, 1); score += 10;
            playSound(600, 0.15, 'sine', 0.2);
        }
    }

    // Check goal
    if (player.x === goalPos.x && player.y === goalPos.y) {
        gameState = 'won';
        playSound(800, 0.3, 'sine', 0.2);
        setTimeout(() => playSound(1000, 0.3, 'sine', 0.2), 150);
        return;
    }

    // Check enemy collision
    for (let e of enemies) {
        if (e.x === player.x && e.y === player.y) {
            gameState = 'dead';
            playSound(80, 0.4, 'sawtooth', 0.2);
            return;
        }
    }

    // Enemies turn
    setTimeout(() => enemyTurn(), moved || grav ? 150 : 50);
}

function enemyTurn() {
    for (let e of enemies) {
        let nx = e.x + e.dir;
        if (!isSolid(nx, e.y) && canStand(nx, e.y)) {
            e.x = nx;
        } else {
            e.dir *= -1;
        }
        // Check collision after enemy moves
        if (e.x === player.x && e.y === player.y) {
            gameState = 'dead';
            playSound(80, 0.4, 'sawtooth', 0.2);
            return;
        }
    }
}

// Rendering
function drawTile(x, y, type) {
    const px = x * TILE, py = y * TILE;
    if (type === 1) {
        ctx.fillStyle = '#4a3728';
        ctx.fillRect(px, py, TILE, TILE);
        ctx.fillStyle = '#5c4433';
        ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
        // texture
        ctx.fillStyle = '#3d2e1f';
        for (let i=0;i<3;i++) {
            let rx = px + 3 + Math.random()*(TILE-8);
            let ry = py + 3 + Math.random()*(TILE-8);
            ctx.fillRect(rx, ry, 3, 3);
        }
    } else if (type === 2) {
        ctx.fillStyle = '#6b7c5e';
        ctx.fillRect(px, py, TILE, 6);
        ctx.fillStyle = '#4a5a40';
        ctx.fillRect(px+2, py+2, TILE-4, 3);
    } else if (type === 3) {
        // Goal flag
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(px + TILE/2 - 2, py, 4, TILE);
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.moveTo(px + TILE/2 + 2, py+4);
        ctx.lineTo(px + TILE/2 + 2 + TILE*0.6, py + TILE*0.3);
        ctx.lineTo(px + TILE/2 + 2, py + TILE*0.5);
        ctx.fill();
    }
}

function drawPlayer() {
    const px = player.x * TILE, py = player.y * TILE;
    // Body
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(px+2, py+TILE*0.3, TILE-4, TILE*0.7);
    // Head
    ctx.fillStyle = '#fff176';
    ctx.fillRect(px+3, py+2, TILE-6, TILE*0.35);
    // Eyes
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(px+5, py+4, 3, 3);
    ctx.fillRect(px+TILE-8, py+4, 3, 3);
    // Feet
    ctx.fillStyle = '#37474f';
    ctx.fillRect(px+3, py+TILE-4, 5, 3);
    ctx.fillRect(px+TILE-8, py+TILE-4, 5, 3);
}

function drawEnemy(e) {
    const px = e.x * TILE, py = e.y * TILE;
    ctx.fillStyle = '#ef5350';
    ctx.fillRect(px+1, py+2, TILE-2, TILE-2);
    // Angry eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(px+4, py+4, 4, 4);
    ctx.fillRect(px+TILE-8, py+4, 4, 4);
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(px+5, py+5, 2, 2);
    ctx.fillRect(px+TILE-7, py+5, 2, 2);
    // Mouth
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(px+4, py+TILE-6, TILE-8, 3);
}

function drawCoin(c) {
    const px = c.x * TILE + TILE/2, py = c.y * TILE + TILE/2;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(px, py, TILE*0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff8e1';
    ctx.beginPath();
    ctx.arc(px, py, TILE*0.15, 0, Math.PI*2);
    ctx.fill();
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#16213e');
    grad.addColorStop(1, '#0f3460');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i=0;i<30;i++) {
        let sx = (i * 137 + 50) % W;
        let sy = (i * 97 + 20) % (H*0.4);
        ctx.fillRect(sx, sy, 2, 2);
    }
}

function drawUI() {
    const ox = TILE * 2, oy = TILE * MAP_H + 10;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(ox - 5, oy - 5, 300, 28);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(12, TILE*0.5)}px monospace`;
    ctx.fillText(`Turn: ${turn}  Coins: ${score}`, ox + 5, oy + 12);

    // Controls hint
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = `${Math.max(10, TILE*0.4)}px monospace`;
    ctx.fillText('← → Move | ↑ Jump | R Restart', ox + 5, oy + 35);
}

function drawStartScreen() {
    drawBackground();
    const cx = W/2, cy = H/2;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(24, TILE*1.5)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('TILE HOPPER', cx, cy - 60);

    ctx.font = `${Math.max(14, TILE*0.6)}px monospace`;
    ctx.fillStyle = '#a0d2ff';
    ctx.fillText('A Turn-Based Platformer', cx, cy - 30);

    ctx.fillStyle = '#ccc';
    ctx.font = `${Math.max(12, TILE*0.5)}px monospace`;
    const lines = [
        '← → : Move left/right (one tile per turn)',
        '↑   : Jump up one tile',
        'Gravity pulls you down after each action',
        '',
        'Collect coins! Avoid red enemies!',
        'Reach the golden flag to win.',
        '',
        'R : Restart level'
    ];
    lines.forEach((l, i) => ctx.fillText(l, cx, cy + 10 + i * 22));

    ctx.fillStyle = '#ffd700';
    ctx.font = `bold ${Math.max(16, TILE*0.7)}px monospace`;
    const pulse = Math.sin(Date.now()*0.003)*0.5+0.5;
    ctx.globalAlpha = 0.5 + pulse * 0.5;
    ctx.fillText('Press any arrow key to start', cx, cy + 200);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
}

function drawEndScreen(won) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    const cx = W/2, cy = H/2;
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.max(28, TILE*1.5)}px monospace`;
    ctx.fillStyle = won ? '#ffd700' : '#ef5350';
    ctx.fillText(won ? 'YOU WIN!' : 'GAME OVER', cx, cy - 20);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(14, TILE*0.6)}px monospace`;
    ctx.fillText(`Turns: ${turn}  Coins: ${score}`, cx, cy + 20);
    ctx.fillText('Press R to restart', cx, cy + 55);
    ctx.textAlign = 'left';
}

function render() {
    if (gameState === 'start') {
        drawStartScreen();
    } else {
        drawBackground();
        const ox = Math.floor((W - MAP_W * TILE) / 2);
        const oy = Math.floor((H - MAP_H * TILE) / 2);

        ctx.save();
        ctx.translate(ox, oy);

        for (let y = 0; y < MAP_H; y++) {
            for (let x = 0; x < MAP_W; x++) {
                if (map[y][x] !== 0) drawTile(x, y, map[y][x]);
            }
        }

        coins.forEach(drawCoin);
        enemies.forEach(drawEnemy);
        drawPlayer();

        ctx.restore();
        drawUI();

        if (gameState === 'won') drawEndScreen(true);
        if (gameState === 'dead') drawEndScreen(false);
    }
}

function gameLoop() {
    render();
    requestAnimationFrame(gameLoop);
}

function restart() {
    generateMap();
    gameState = 'playing';
}

// Input
window.addEventListener('keydown', (e) => {
    if (gameState === 'start') {
        initAudio();
        gameState = 'playing';
        generateMap();
        return;
    }
    if (gameState === 'won' || gameState === 'dead') {
        if (e.key === 'r' || e.key === 'R') restart();
        return;
    }
    if (gameState !== 'playing') return;

    switch(e.key) {
        case 'ArrowLeft': e.preventDefault(); doAction('left'); break;
        case 'ArrowRight': e.preventDefault(); doAction('right'); break;
        case 'ArrowUp': e.preventDefault(); doAction('up'); break;
        case 'r': case 'R': restart(); break;
    }
});

// Touch / click support for mobile
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'start') { initAudio(); gameState = 'playing'; generateMap(); return; }
    if (gameState === 'won' || gameState === 'dead') { restart(); return; }
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
});
canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (gameState !== 'playing') return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
        if (dy < -20 && Math.abs(dy) > Math.abs(dx)) doAction('up');
        else if (dx < -20) doAction('left');
        else if (dx > 20) doAction('right');
    }
});

// Init
generateMap();
gameLoop();
</script>
</body>
</html>
