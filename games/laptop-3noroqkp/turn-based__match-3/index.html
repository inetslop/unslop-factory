<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Cascade - Match 3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
#gameCanvas { display: block; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let W, H, cellSize, boardX, boardY;
    const ROWS = 8, COLS = 8, NUM_COLORS = 6;
    
    let state = 'start'; // start, playing, animating
    let grid = [];
    let score = 0;
    let bestScore = 0;
    let combo = 0;
    let selected = null;
    let hoverCell = null;
    let particles = [];
    let animations = [];
    let cascadeDelay = 0;
    let message = '';
    let messageTimer = 0;
    
    try { bestScore = parseInt(localStorage.getItem('gemCascadeBest') || '0'); } catch(e) { bestScore = 0; }
    
    const gemColors = [
        { fill: '#ff4757', glow: '#ff6b81' }, // red
        { fill: '#2ed573', glow: '#51e98a' }, // green
        { fill: '#1e90ff', glow: '#54aeff' }, // blue
        { fill: '#ffa502', glow: '#ffbe3e' }, // orange
        { fill: '#a855f7', glow: '#c084fc' }, // purple
        { fill: '#ffd700', glow: '#ffe44d' }  // gold
    ];
    
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        cellSize = Math.min((W - 40) / COLS, (H - 120) / ROWS);
        boardX = (W - cellSize * COLS) / 2;
        boardY = (H - cellSize * ROWS) / 2 + 30;
    }
    
    function initGrid() {
        grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = randomColor();
            }
        }
        // Remove initial matches
        while (findMatches().length > 0) {
            for (let r = 0; r < ROWS; r++)
                for (let c = 0; c < COLS; c++)
                    grid[r][c] = randomColor();
        }
    }
    
    function randomColor() { return Math.floor(Math.random() * NUM_COLORS) + 1; }
    
    function findMatches() {
        let matches = [];
        // Horizontal
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                if (grid[r][c] !== 0 && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                    let set = new Set();
                    for (let cc = c; cc < COLS; cc++) {
                        if (grid[r][cc] === grid[r][c]) set.add(r + ',' + cc);
                        else break;
                    }
                    matches.push(...set);
                }
            }
        }
        // Vertical
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                if (grid[r][c] !== 0 && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                    let set = new Set();
                    for (let rr = r; rr < ROWS; rr++) {
                        if (grid[rr][c] === grid[r][c]) set.add(rr + ',' + c);
                        else break;
                    }
                    matches.push(...set);
                }
            }
        }
        // Deduplicate
        let unique = [...new Set(matches)];
        return unique.map(s => { let [r,c] = s.split(',').map(Number); return {r, c}; });
    }
    
    function hasValidMove() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (c < COLS - 1) {
                    let t = grid[r][c]; grid[r][c] = grid[r][c+1]; grid[r][c+1] = t;
                    if (findMatches().length > 0) { grid[r][c] = grid[r][c+1]; grid[r][c+1] = t; return true; }
                    grid[r][c] = grid[r][c+1]; grid[r][c+1] = t;
                }
                if (r < ROWS - 1) {
                    let t = grid[r][c]; grid[r][c] = grid[r+1][c]; grid[r+1][c] = t;
                    if (findMatches().length > 0) { grid[r][c] = grid[r+1][c]; grid[r+1][c] = t; return true; }
                    grid[r][c] = grid[r+1][c]; grid[r+1][c] = t;
                }
            }
        }
        return false;
    }
    
    function shuffleBoard() {
        let allGems = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) allGems.push(grid[r][c]);
        for (let i = allGems.length - 1; i > 0; i--) { let j = Math.floor(Math.random()*(i+1)); [allGems[i],allGems[j]]=[allGems[j],allGems[i]]; }
        let idx = 0;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = allGems[idx++];
        while (findMatches().length > 0) {
            for (let i = allGems.length - 1; i > 0; i--) { let j = Math.floor(Math.random()*(i+1)); [allGems[i],allGems[j]]=[allGems[j],allGems[i]]; }
            idx = 0;
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = allGems[idx++];
        }
    }
    
    function startGame() {
        score = 0;
        combo = 0;
        selected = null;
        particles = [];
        animations = [];
        initGrid();
        if (!hasValidMove()) shuffleBoard();
        state = 'playing';
    }
    
    function trySwap(r1, c1, r2, c2) {
        let t = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t;
        if (findMatches().length === 0) {
            grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t;
            // Swap back animation
            addSwapAnim(r1, c1, r2, c2);
            addSwapAnim(r2, c2, r1, c1);
        } else {
            addSwapAnim(r1, c1, r2, c2);
            addSwapAnim(r2, c2, r1, c1);
            state = 'animating';
            setTimeout(() => resolveBoard(), 300);
        }
    }
    
    function addSwapAnim(r, c, tr, tc) {
        animations.push({ type: 'swap', r, c, tr, tc, progress: 0, color: grid[r][c] });
    }
    
    function resolveBoard() {
        let matches = findMatches();
        if (matches.length === 0) {
            state = 'playing';
            combo = 0;
            if (!hasValidMove()) {
                message = 'No moves! Shuffling...';
                messageTimer = 2;
                setTimeout(shuffleBoard, 1500);
            }
            return;
        }
        
        combo++;
        let points = matches.length * 10 * combo;
        score += points;
        if (score > bestScore) {
            bestScore = score;
            try { localStorage.setItem('gemCascadeBest', bestScore.toString()); } catch(e) {}
        }
        
        if (combo > 1) {
            message = 'COMBO x' + combo + '! +' + points;
            messageTimer = 1.5;
        } else {
            message = '+' + points;
            messageTimer = 1;
        }
        
        // Spawn particles
        for (let m of matches) {
            let px = boardX + m.c * cellSize + cellSize/2;
            let py = boardY + m.r * cellSize + cellSize/2;
            let col = gemColors[grid[m.r][m.c] - 1];
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: px, y: py,
                    vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4 - 2,
                    life: 1, color: col.fill, size: Math.random()*6+3
                });
            }
            grid[m.r][m.c] = 0;
        }
        
        // Apply gravity
        setTimeout(() => { applyGravity(); }, 200);
    }
    
    function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let write = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (grid[r][c] !== 0) {
                    grid[write][c] = grid[r][c];
                    if (write !== r) grid[r][c] = 0;
                    write--;
                }
            }
            for (let r = write; r >= 0; r--) grid[r][c] = 0;
        }
        
        // Fill from top
        for (let c = 0; c < COLS; c++) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (grid[r][c] === 0) grid[r][c] = randomColor();
            }
        }
        
        setTimeout(() => resolveBoard(), 250);
    }
    
    function update(dt) {
        for (let p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life -= dt * 2;
        }
        particles = particles.filter(p => p.life > 0);
        
        if (messageTimer > 0) messageTimer -= dt;
    }
    
    function drawGem(x, y, colorIdx, size, alpha) {
        if (colorIdx <= 0 || colorIdx > NUM_COLORS) return;
        let col = gemColors[colorIdx - 1];
        let r = size * 0.38;
        
        ctx.save();
        ctx.globalAlpha = alpha || 1;
        
        // Glow
        ctx.shadowColor = col.glow;
        ctx.shadowBlur = size * 0.25;
        
        // Gem shape (diamond)
        let cx = x + size/2, cy = y + size/2;
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.lineTo(cx + r, cy);
        ctx.lineTo(cx, cy + r);
        ctx.lineTo(cx - r, cy);
        ctx.closePath();
        
        let grad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
        grad.addColorStop(0, col.glow);
        grad.addColorStop(1, col.fill);
        ctx.fillStyle = grad;
        ctx.fill();
        
        // Highlight
        ctx.beginPath();
        ctx.moveTo(cx, cy - r * 0.6);
        ctx.lineTo(cx + r * 0.4, cy - r * 0.2);
        ctx.lineTo(cx, cy + r * 0.1);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fill();
        
        ctx.restore();
    }
    
    function drawBoard() {
        // Background
        ctx.fillStyle = '#16213e';
        ctx.fillRect(boardX - 10, boardY - 10, cellSize * COLS + 20, cellSize * ROWS + 20);
        
        // Grid cells
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let x = boardX + c * cellSize;
                let y = boardY + r * cellSize;
                
                // Cell background
                ctx.fillStyle = (r + c) % 2 === 0 ? '#1a1a3e' : '#1f1f45';
                ctx.fillRect(x, y, cellSize, cellSize);
                
                // Border
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.strokeRect(x, y, cellSize, cellSize);
            }
        }
        
        // Gems
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let x = boardX + c * cellSize;
                let y = boardY + r * cellSize;
                drawGem(x, y, grid[r][c], cellSize, 1);
            }
        }
        
        // Selection highlight
        if (selected) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.strokeRect(boardX + selected.c * cellSize + 2, boardY + selected.r * cellSize + 2, cellSize - 4, cellSize - 4);
            ctx.lineWidth = 1;
        }
        
        // Hover highlight
        if (hoverCell && state === 'playing' && (!selected || hoverCell.r !== selected.r || hoverCell.c !== selected.c)) {
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(boardX + hoverCell.c * cellSize + 4, boardY + hoverCell.r * cellSize + 4, cellSize - 8, cellSize - 8);
            ctx.lineWidth = 1;
        }
    }
    
    function drawHUD() {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px Segoe UI, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('Score: ' + score, boardX, boardY - 20);
        
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffd700';
        ctx.fillText('Best: ' + bestScore, boardX + cellSize * COLS, boardY - 20);
        
        if (combo > 1) {
            ctx.textAlign = 'center';
            ctx.font = 'bold 28px Segoe UI, sans-serif';
            ctx.fillStyle = gemColors[(combo % NUM_COLORS)] ? gemColors[(combo % NUM_COLORS)].fill : '#fff';
            ctx.fillText('COMBO x' + combo, W/2, boardY - 50);
        }
    }
    
    function drawParticles() {
        for (let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
    
    function drawMessage() {
        if (messageTimer > 0 && message) {
            let alpha = Math.min(1, messageTimer);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(message, W/2, boardY + cellSize * ROWS / 2);
            ctx.globalAlpha = 1;
        }
    }
    
    function drawStartScreen() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);
        
        // Title
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px Segoe UI, sans-serif';
        let titleGrad = ctx.createLinearGradient(W/2 - 150, 0, W/2 + 150, 0);
        titleGrad.addColorStop(0, '#ff4757');
        titleGrad.addColorStop(0.25, '#ffa502');
        titleGrad.addColorStop(0.5, '#ffd700');
        titleGrad.addColorStop(0.75, '#2ed573');
        titleGrad.addColorStop(1, '#a855f7');
        ctx.fillStyle = titleGrad;
        ctx.fillText('GEM CASCADE', W/2, H * 0.3);
        
        // Subtitle
        ctx.font = '20px Segoe UI, sans-serif';
        ctx.fillStyle = '#aaa';
        ctx.fillText('A Turn-Based Match-3 Game', W/2, H * 0.38);
        
        // Instructions
        ctx.font = '16px Segoe UI, sans-serif';
        ctx.fillStyle = '#ccc';
        let lines = [
            'Click a gem, then click an adjacent gem to swap.',
            'Match 3 or more in a row or column to clear them.',
            'Chain reactions for combo multipliers!',
            '',
            'Controls: Mouse Click / Touch'
        ];
        lines.forEach((line, i) => {
            ctx.fillText(line, W/2, H * 0.48 + i * 28);
        });
        
        // Start button
        let bw = 200, bh = 50;
        let bx = W/2 - bw/2, by = H * 0.72;
        ctx.fillStyle = '#a855f7';
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Segoe UI, sans-serif';
        ctx.fillText('START GAME', W/2, by + 32);
        
        // Best score
        if (bestScore > 0) {
            ctx.font = '14px Segoe UI, sans-serif';
            ctx.fillStyle = '#ffd700';
            ctx.fillText('Best Score: ' + bestScore, W/2, H * 0.85);
        }
        
        // Decorative gems
        let t = Date.now() / 1000;
        for (let i = 0; i < 6; i++) {
            let gx = W/2 + Math.cos(t + i * Math.PI/3) * 180;
            let gy = H * 0.3 + Math.sin(t + i * Math.PI/3) * 40;
            drawGem(gx - 15, gy - 15, i + 1, 30, 0.6);
        }
    }
    
    function drawGame() {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);
        drawBoard();
        drawHUD();
        drawParticles();
        drawMessage();
    }
    
    let lastTime = 0;
    function gameLoop(timestamp) {
        let dt = (timestamp - lastTime) / 1000;
        if (dt > 0.1) dt = 0.016;
        lastTime = timestamp;
        
        update(dt);
        
        if (state === 'start') drawStartScreen();
        else { drawGame(); }
        
        requestAnimationFrame(gameLoop);
    }
    
    function getCellFromPos(px, py) {
        let c = Math.floor((px - boardX) / cellSize);
        let r = Math.floor((py - boardY) / cellSize);
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return { r, c };
        return null;
    }
    
    function handleInput(px, py) {
        if (state === 'start') {
            let bw = 200, bh = 50;
            let bx = W/2 - bw/2, by = H * 0.72;
            if (px >= bx && px <= bx + bw && py >= by && py <= by + bh) {
                startGame();
            }
            return;
        }
        
        if (state !== 'playing') return;
        
        let cell = getCellFromPos(px, py);
        if (!cell) { selected = null; return; }
        
        if (!selected) {
            selected = cell;
        } else {
            let dr = Math.abs(selected.r - cell.r);
            let dc = Math.abs(selected.c - cell.c);
            
            if (dr + dc === 1) {
                // Adjacent - swap!
                trySwap(selected.r, selected.c, cell.r, cell.c);
                selected = null;
            } else if (selected.r === cell.r && selected.c === cell.c) {
                selected = null; // Deselect
            } else {
                selected = cell; // New selection
            }
        }
    }
    
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        let px = e.clientX - rect.left;
        let py = e.clientY - rect.top;
        handleInput(px, py);
    });
    
    canvas.addEventListener('mousemove', (e) => {
        let rect = canvas.getBoundingClientRect();
        let px = e.clientX - rect.left;
        let py = e.clientY - rect.top;
        hoverCell = getCellFromPos(px, py);
    });
    
    // Touch support
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        let touch = e.touches[0];
        let rect = canvas.getBoundingClientRect();
        handleInput(touch.clientX - rect.left, touch.clientY - rect.top);
    }, { passive: false });
    
    // Keyboard restart
    window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
            startGame();
        }
        if (e.key === 'Escape' && state === 'playing') {
            selected = null;
        }
    });
    
    resize();
    initGrid();
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
