<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger Match-3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2a1a; font-family: 'Courier New', monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxSwap() { playTone(400, 0.1, 'sine', 0.1); }
function sfxMatch() { playTone(600, 0.15, 'triangle', 0.2); playTone(800, 0.2, 'triangle', 0.15); }
function sfxCascade() { playTone(700, 0.1, 'sine', 0.2); playTone(900, 0.15, 'sine', 0.15); }
function sfxCar() { playTone(150, 0.3, 'sawtooth', 0.08); }
function sfxLose() { playTone(200, 0.4, 'square', 0.2); playTone(150, 0.6, 'square', 0.15); }
function sfxWin() { for(let i=0;i<5;i++) setTimeout(()=>playTone(400+i*100,0.2,'triangle',0.15),i*100); }

// Game constants
const COLS = 6, ROWS = 7;
const COLORS = ['#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#f4433d'];
const COLOR_NAMES = ['green','blue','orange','purple','red'];

// Game state
let state = 'start'; // start, playing, gameover
let grid = [];
let score = 0;
let lives = 3;
let cars = [];
let carTimer = 0;
let carInterval = 180; // frames between car spawns
let selected = null;
let animating = false;
let particles = [];
let frame = 0;
let highScore = 0;

try {
    highScore = parseInt(localStorage.getItem('froggerMatch3High') || '0');
} catch(e) {}

function getCellSize() {
    return Math.min(W / (COLS + 2), H / (ROWS + 4));
}
function getGridOffset() {
    const cs = getCellSize();
    const gw = COLS * cs;
    const gh = ROWS * cs;
    return { x: (W - gw) / 2, y: (H - gh) / 2 + 20 };
}

function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
            let color;
            do { color = Math.floor(Math.random() * COLORS.length); }
            while (wouldMatch(r, c, color));
            grid[r][c] = color;
        }
    }
}

function wouldMatch(r, c, color) {
    if (c >= 2 && grid[r] && grid[r][c-1] === color && grid[r] && grid[r][c-2] === color) return true;
    if (r >= 2 && grid[r-1] && grid[r-1][c] === color && grid[r-2] && grid[r-2][c] === color) return true;
    return false;
}

function startGame() {
    initAudio();
    state = 'playing';
    score = 0;
    lives = 3;
    cars = [];
    carTimer = 0;
    selected = null;
    animating = false;
    particles = [];
    frame = 0;
    initGrid();
}

function getPos() {
    const cs = getCellSize();
    const off = getGridOffset();
    return { cs, off };
}

function drawTile(x, y, colorIdx, size) {
    const s = size * 0.8;
    const px = x + size/2 - s/2;
    const py = y + size/2 - s/2;
    
    ctx.fillStyle = COLORS[colorIdx];
    ctx.beginPath();
    const r = s * 0.15;
    ctx.roundRect(px, py, s, s, r);
    ctx.fill();
    
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.roundRect(px + 3, py + 3, s - 6, s * 0.4, r);
    ctx.fill();
    
    // Icon
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.font = `bold ${s*0.4}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const icons = ['🐸','💧','🍄','⭐','🌿'];
    ctx.fillText(icons[colorIdx], x + size/2, y + size/2 + 2);
}

function drawCar(x, y, size) {
    const s = size * 0.85;
    const px = x + size/2 - s/2;
    const py = y + size/2 - s*0.35;
    
    ctx.fillStyle = '#d32f2f';
    ctx.beginPath();
    ctx.roundRect(px, py, s, s*0.7, 4);
    ctx.fill();
    
    ctx.fillStyle = '#ff5252';
    ctx.beginPath();
    ctx.roundRect(px + s*0.15, py - s*0.15, s*0.7, s*0.35, 3);
    ctx.fill();
    
    // Wheels
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(px + s*0.2, py + s*0.7, s*0.12, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + s*0.8, py + s*0.7, s*0.12, 0, Math.PI*2);
    ctx.fill();
}

function drawFrog(x, y, size) {
    const s = size * 0.6;
    ctx.font = `${s}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐸', x + size/2, y + size/2);
}

function drawBackground() {
    // Dark green gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a3a1a');
    grad.addColorStop(1, '#0d1f0d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Subtle grid pattern
    const { cs, off } = getPos();
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x = off.x + c * cs;
            const y = off.y + r * cs;
            ctx.fillStyle = (r+c) % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(255,255,255,0.06)';
            ctx.fillRect(x, y, cs, cs);
        }
    }
}

function drawHUD() {
    const { cs, off } = getPos();
    
    // Score
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(24, W*0.03)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 20, 30);
    
    // High score
    ctx.font = `${Math.min(18, W*0.025)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'right';
    ctx.fillText(`Best: ${highScore}`, W - 20, 30);
    
    // Lives
    for (let i = 0; i < lives; i++) {
        drawFrog(W - 80 + i * 35, 10, 30);
    }
    
    // Danger indicator
    const dangerY = off.y - cs * 0.3;
    if (cars.length > 0) {
        ctx.fillStyle = 'rgba(255,50,50,0.3)';
        ctx.fillRect(off.x, off.y - 5, COLS * cs, 5);
    }
}

function drawStartScreen() {
    drawBackground();
    
    const cx = W/2;
    const cy = H/2;
    
    // Title
    ctx.fillStyle = '#4CAF50';
    ctx.font = `bold ${Math.min(60, W*0.08)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐸 FROGGER', cx, cy - 120);
    ctx.fillStyle = '#FF9800';
    ctx.font = `bold ${Math.min(48, W*0.06)}px monospace`;
    ctx.fillText('MATCH-3', cx, cy - 70);
    
    // Instructions
    ctx.fillStyle = '#ccc';
    ctx.font = `${Math.min(18, W*0.025)}px monospace`;
    const lines = [
        'Swap adjacent tiles to match 3 or more!',
        '',
        '⬆️ Click/tap two tiles to swap',
        '⌨ Keys: Arrow keys + Enter/Space to select',
        '',
        '🚗 Cars drive up from below!',
        'If a car reaches the top, you lose a life.',
        '',
        'Match in the BOTTOM ROW to push cars back!',
        'Survive and score as high as you can!',
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, cx, cy - 10 + i * 28);
    });
    
    // Start prompt
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = `bold ${Math.min(28, W*0.04)}px monospace`;
    ctx.fillText('Press SPACE or Click to Start', cx, cy + 200);
    
    if (highScore > 0) {
        ctx.fillStyle = '#FF9800';
        ctx.font = `${Math.min(20, W*0.03)}px monospace`;
        ctx.fillText(`High Score: ${highScore}`, cx, cy + 250);
    }
}

function drawGameOver() {
    drawBackground();
    
    const cx = W/2;
    const cy = H/2;
    
    ctx.fillStyle = '#f4433d';
    ctx.font = `bold ${Math.min(50, W*0.07)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GAME OVER', cx, cy - 80);
    
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(24, W*0.035)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, cx, cy - 20);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.fillText('★ NEW HIGH SCORE! ★', cx, cy + 20);
    }
    
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = `bold ${Math.min(24, W*0.035)}px monospace`;
    ctx.fillText('Press SPACE or Click to Restart', cx, cy + 80);
}

function drawGame() {
    drawBackground();
    
    const { cs, off } = getPos();
    
    // Draw frog at top
    ctx.fillStyle = 'rgba(76,175,80,0.2)';
    ctx.fillRect(off.x, off.y - cs*0.4, COLS * cs, cs*0.3);
    for (let c = 0; c < COLS; c++) {
        drawFrog(off.x + c * cs, off.y - cs*0.35, cs);
    }
    
    // Draw grid tiles
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const x = off.x + c * cs;
            const y = off.y + r * cs;
            if (grid[r][c] >= 0) {
                drawTile(x, y, grid[r][c], cs);
            }
        }
    }
    
    // Draw selection highlight
    if (selected) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        const sx = off.x + selected.c * cs;
        const sy = off.y + selected.r * cs;
        ctx.strokeRect(sx + 2, sy + 2, cs - 4, cs - 4);
    }
    
    // Draw cars
    cars.forEach(car => {
        const x = off.x + car.col * cs;
        const y = off.y + (ROWS - 1) * cs - car.progress * cs;
        drawCar(x, y, cs);
    });
    
    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });
    
    drawHUD();
}

function spawnCar() {
    const col = Math.floor(Math.random() * COLS);
    cars.push({ col, progress: 0 });
    sfxCar();
}

function updateCars() {
    carTimer++;
    
    // Speed increases with score
    const speed = Math.max(60, carInterval - Math.floor(score / 50) * 5);
    if (carTimer >= speed) {
        carTimer = 0;
        spawnCar();
    }
    
    // Move cars
    const moveSpeed = 0.008 + score * 0.00001;
    let hitFrog = false;
    
    cars.forEach(car => {
        car.progress += moveSpeed;
        if (car.progress >= ROWS) {
            hitFrog = true;
        }
    });
    
    if (hitFrog) {
        lives--;
        sfxLose();
        cars = [];
        // Screen flash
        particles.push({ x: W/2, y: H/4, size: 50, color: 'rgba(255,0,0,0.5)', life: 30, maxLife: 30 });
        
        if (lives <= 0) {
            state = 'gameover';
            try { localStorage.setItem('froggerMatch3High', Math.max(highScore, score).toString()); } catch(e) {}
            highScore = Math.max(highScore, score);
        }
    }
}

function findMatches() {
    const matches = [];
    
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
            if (grid[r][c] >= 0 && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                matches.push({r, c});
                let end = c + 2;
                while (end + 1 < COLS && grid[r][end+1] === grid[r][c]) end++;
                for (let i = c; i <= end; i++) matches.push({r, c: i});
            }
        }
    }
    
    // Vertical
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
            if (grid[r][c] >= 0 && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                let end = r + 2;
                while (end + 1 < ROWS && grid[end+1][c] === grid[r][c]) end++;
                for (let i = r; i <= end; i++) matches.push({r: i, c});
            }
        }
    }
    
    // Deduplicate
    const unique = {};
    matches.forEach(m => { unique[m.r + ',' + m.c] = true; });
    return Object.keys(unique).map(k => {
        const [r, c] = k.split(',').map(Number);
        return {r, c};
    });
}

function clearMatches(matches) {
    let bottomRowMatched = false;
    
    matches.forEach(m => {
        if (m.r === ROWS - 1) bottomRowMatched = true;
        const { cs, off } = getPos();
        const px = off.x + m.c * cs + cs/2;
        const py = off.y + m.r * cs + cs/2;
        for (let i = 0; i < 4; i++) {
            particles.push({
                x: px, y: py,
                vx: (Math.random()-0.5)*4,
                vy: (Math.random()-0.5)*4 - 2,
                size: Math.random()*6+3,
                color: COLORS[grid[m.r][m.c]],
                life: 30, maxLife: 30
            });
        }
        grid[m.r][m.c] = -1;
    });
    
    score += matches.length * 10;
    
    // Push cars back if bottom row was matched
    if (bottomRowMatched) {
        cars.forEach(car => { car.progress = Math.max(0, car.progress - 1.5); });
        score += 25; // Bonus
    }
    
    sfxMatch();
}

function dropTiles() {
    for (let c = 0; c < COLS; c++) {
        let write = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (grid[r][c] >= 0) {
                grid[write][c] = grid[r][c];
                if (write !== r) grid[r][c] = -1;
                write--;
            }
        }
        // Fill top
        for (let r = write; r >= 0; r--) {
            let color;
            do { color = Math.floor(Math.random() * COLORS.length); } while(false);
            grid[r][c] = color;
        }
    }
}

function processMatches() {
    const matches = findMatches();
    if (matches.length > 0) {
        clearMatches(matches);
        dropTiles();
        // Check for cascades
        setTimeout(() => {
            const cascade = findMatches();
            if (cascade.length > 0) {
                sfxCascade();
                score += cascade.length * 5;
                clearMatches(cascade);
                dropTiles();
            }
        }, 200);
    }
}

function trySwap(r1, c1, r2, c2) {
    if (r1 < 0 || r1 >= ROWS || c1 < 0 || c1 >= COLS) return;
    if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) return;
    
    const temp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = temp;
    
    const matches = findMatches();
    if (matches.length === 0) {
        // Swap back
        grid[r2][c2] = grid[r1][c1];
        grid[r1][c1] = temp;
    } else {
        sfxSwap();
        processMatches();
    }
}

function updateParticles() {
    particles = particles.filter(p => {
        p.x += p.vx || 0;
        p.y += p.vy || 0;
        if (p.vy) p.vy += 0.3;
        p.life--;
        return p.life > 0;
    });
}

function render() {
    ctx.clearRect(0, 0, W, H);
    
    if (state === 'start') drawStartScreen();
    else if (state === 'playing') {
        updateCars();
        updateParticles();
        drawGame();
    } else if (state === 'gameover') {
        updateParticles();
        drawGameOver();
    }
    
    requestAnimationFrame(render);
}

// Input handling
let keySelected = null;

function getGridPos(px, py) {
    const { cs, off } = getPos();
    const c = Math.floor((px - off.x) / cs);
    const r = Math.floor((py - off.y) / cs);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) return {r, c};
    return null;
}

canvas.addEventListener('click', (e) => {
    initAudio();
    
    if (state === 'start' || state === 'gameover') {
        startGame();
        return;
    }
    
    if (state !== 'playing' || animating) return;
    
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    
    const pos = getGridPos(px, py);
    if (!pos) return;
    
    if (selected === null) {
        selected = pos;
    } else {
        // Check adjacency
        const dr = Math.abs(pos.r - selected.r);
        const dc = Math.abs(pos.c - selected.c);
        if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
            trySwap(selected.r, selected.c, pos.r, pos.c);
        }
        selected = null;
    }
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const clickEvent = new MouseEvent('click', {
        clientX: touch.clientX,
        clientY: touch.clientY
    });
    canvas.dispatchEvent(clickEvent);
});

// Keyboard support
let keySelectedCell = null;

window.addEventListener('keydown', (e) => {
    initAudio();
    
    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (state === 'start' || state === 'gameover') startGame();
        else if (keySelectedCell !== null && keySelectedCell.r >= 0) {
            // Confirm selection / make first selection
            if (selected === null) {
                selected = keySelectedCell;
            }
        }
    }
    
    if (state !== 'playing') return;
    
    if (keySelectedCell === null) keySelectedCell = {r: 3, c: 2};
    
    if (e.code === 'ArrowUp' && keySelectedCell.r > 0) keySelectedCell.r--;
    if (e.code === 'ArrowDown' && keySelectedCell.r < ROWS-1) keySelectedCell.r++;
    if (e.code === 'ArrowLeft' && keySelectedCell.c > 0) keySelectedCell.c--;
    if (e.code === 'ArrowRight' && keySelectedCell.c < COLS-1) keySelectedCell.c++;
    
    if (e.code === 'Space' || e.code === 'Enter') {
        if (selected === null) {
            selected = {...keySelectedCell};
        } else {
            // Look for adjacent in the direction of last arrow
            const dr = keySelectedCell.r - selected.r;
            const dc = keySelectedCell.c - selected.c;
            if (Math.abs(dr) + Math.abs(dc) === 1) {
                trySwap(selected.r, selected.c, keySelectedCell.r, keySelectedCell.c);
                selected = null;
            } else {
                selected = {...keySelectedCell};
            }
        }
    }
    
    if (e.code === 'KeyR' && state === 'gameover') startGame();
});

// Prevent scrolling
window.addEventListener('keydown', (e) => {
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});

// Start rendering loop
render();
</script>
</body>
</html>
