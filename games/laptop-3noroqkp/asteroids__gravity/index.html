<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gravity Asteroids</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, type, duration, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}
function playExplosion() {
    if (!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.3;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.4;
    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
}
function playShoot() {
    playSound(800, 'square', 0.1, 0.15);
}
function playGameOver() {
    playSound(200, 'sawtooth', 1.5, 0.3);
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try {
    highScore = parseInt(localStorage.getItem('gravityAsteroidsHigh') || '0');
} catch(e) {}

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    initAudio();
    if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) startGame();
    if (gameState === 'gameover' && (e.code === 'Enter' || e.code === 'KeyR')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Entities
let ship, bullets, asteroids, particles, stars, planets;

function createStars() {
    const s = [];
    for (let i = 0; i < 150; i++) {
        s.push({ x: Math.random() * W, y: Math.random() * H, speed: 0.2 + Math.random() * 0.8, size: 0.5 + Math.random() * 1.5 });
    }
    return s;
}

function createPlanets(count) {
    const p = [];
    for (let i = 0; i < count; i++) {
        let x, y, r;
        do {
            r = 40 + Math.random() * 80;
            x = r + Math.random() * (W - r * 2);
            y = r + Math.random() * (H - r * 2);
        } while (Math.hypot(x - W/2, y - H/2) < 150);
        p.push({ x, y, r, mass: r * 5, color: `hsl(${Math.random()*60+10}, 40%, ${30+Math.random()*20}%)`, ring: Math.random() > 0.7 });
    }
    return p;
}

function createAsteroid(x, y, size) {
    const r = size * 8;
    const points = [];
    for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        const d = r * (0.7 + Math.random() * 0.3);
        points.push({ x: Math.cos(a) * d, y: Math.sin(a) * d });
    }
    return { x, y, r, size, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, rot: 0, rotSpeed: (Math.random()-0.5)*0.03, points, mass: size * 3 };
}

function startGame() {
    gameState = 'playing';
    score = 0;
    ship = { x: W/2, y: H/2, vx: 0, vy: 0, angle: -Math.PI/2, radius: 12, invincible: 60 };
    bullets = [];
    asteroids = [];
    particles = [];
    stars = createStars();
    planets = createPlanets(4);
    
    // Initial asteroids away from ship
    for (let i = 0; i < 8; i++) {
        let ax, ay;
        do {
            ax = 50 + Math.random() * (W - 100);
            ay = 50 + Math.random() * (H - 100);
        } while (Math.hypot(ax - W/2, ay - H/2) < 200);
        asteroids.push(createAsteroid(ax, ay, 3));
    }
}

function spawnParticles(x, y, count, color, speed) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * (speed || 5);
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30 + Math.random()*30, maxLife: 60, color, size: 1 + Math.random()*3 });
    }
}

function update() {
    if (gameState !== 'playing') return;

    // Ship controls
    const thrust = 0.4;
    if (keys['KeyW'] || keys['ArrowUp']) { ship.vx += Math.cos(ship.angle) * thrust; ship.vy += Math.sin(ship.angle) * thrust; }
    if (keys['KeyS'] || keys['ArrowDown']) { ship.vx -= Math.cos(ship.angle) * thrust; ship.vy -= Math.sin(ship.angle) * thrust; }
    if (keys['KeyA'] || keys['ArrowLeft']) ship.angle -= 0.08;
    if (keys['KeyD'] || keys['ArrowRight']) ship.angle += 0.08;

    // Friction
    ship.vx *= 0.995;
    ship.vy *= 0.995;

    // Gravity from planets and large asteroids
    const G = 0.3;
    for (const p of planets) {
        const dx = p.x - ship.x;
        const dy = p.y - ship.y;
        const dist = Math.hypot(dx, dy);
        if (dist > p.r + ship.radius) {
            const force = G * p.mass / (dist * dist);
            ship.vx += (dx / dist) * force;
            ship.vy += (dy / dist) * force;
        }
    }

    // Ship movement
    ship.x += ship.vx;
    ship.y += ship.vy;

    // Wrap around
    if (ship.x < -20) ship.x = W + 20;
    if (ship.x > W + 20) ship.x = -20;
    if (ship.y < -20) ship.y = H + 20;
    if (ship.y > H + 20) ship.y = -20;

    // Ship invincibility timer
    if (ship.invincible > 0) ship.invincible--;

    // Shooting
    if (keys['Space'] && bullets.length < 5) {
        const bx = ship.x + Math.cos(ship.angle) * 15;
        const by = ship.y + Math.sin(ship.angle) * 15;
        bullets.push({ x: bx, y: by, vx: Math.cos(ship.angle)*8, vy: Math.sin(ship.angle)*8, life: 60 });
        playShoot();
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.life <= 0 || b.x < -20 || b.x > W+20 || b.y < -20 || b.y > H+20) bullets.splice(i, 1);
    }

    // Update asteroids
    for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        
        // Gravity on asteroids from planets
        for (const p of planets) {
            const dx = p.x - a.x;
            const dy = p.y - a.y;
            const dist = Math.hypot(dx, dy);
            if (dist > p.r + a.r) {
                const force = G * p.mass / (dist * dist) * 0.3;
                a.vx += (dx / dist) * force;
                a.vy += (dy / dist) * force;
            } else {
                // Destroy asteroid if it hits a planet
                spawnParticles(a.x, a.y, 15, '#8B7355', 4);
                playExplosion();
                asteroids.splice(i, 1);
                continue;
            }
        }

        a.x += a.vx;
        a.y += a.vy;
        a.rot += a.rotSpeed;

        // Wrap
        if (a.x < -50) a.x = W + 50;
        if (a.x > W + 50) a.x = -50;
        if (a.y < -50) a.y = H + 50;
        if (a.y > H + 50) a.y = -50;

        // Bullet collision
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (Math.hypot(b.x - a.x, b.y - a.y) < a.r + 4) {
                bullets.splice(j, 1);
                score += a.size * 10;
                spawnParticles(a.x, a.y, 20, '#8B7355', 5);
                playExplosion();
                
                if (a.size > 1) {
                    for (let k = 0; k < 2; k++) {
                        const na = createAsteroid(a.x + (k?15:-15), a.y, a.size - 1);
                        na.vx = a.vx + (Math.random()-0.5)*3;
                        na.vy = a.vy + (Math.random()-0.5)*3;
                        asteroids.push(na);
                    }
                }
                asteroids.splice(i, 1);
                break;
            }
        }

        // Ship collision
        if (ship.invincible <= 0 && Math.hypot(ship.x - a.x, ship.y - a.y) < ship.radius + a.r) {
            gameOver();
            return;
        }
    }

    // Planet collision with ship
    for (const p of planets) {
        if (ship.invincible <= 0 && Math.hypot(ship.x - p.x, ship.y - p.y) < ship.radius + p.r) {
            gameOver();
            return;
        }
    }

    // Spawn asteroids
    if (Math.random() < 0.02 && asteroids.length < 20) {
        const edge = Math.floor(Math.random() * 4);
        let ax, ay;
        if (edge === 0) { ax = -30; ay = Math.random() * H; }
        else if (edge === 1) { ax = W + 30; ay = Math.random() * H; }
        else if (edge === 2) { ax = Math.random() * W; ay = -30; }
        else { ax = Math.random() * W; ay = H + 30; }
        asteroids.push(createAsteroid(ax, ay, 1 + Math.floor(Math.random()*3)));
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Stars parallax
    for (const s of stars) {
        s.x -= s.speed;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    }

    // Score over time
    score += 0.1;
}

function gameOver() {
    gameState = 'gameover';
    playGameOver();
    spawnParticles(ship.x, ship.y, 40, '#FFD700', 8);
    if (score > highScore) {
        highScore = Math.floor(score);
        try { localStorage.setItem('gravityAsteroidsHigh', highScore); } catch(e) {}
    }
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size * 0.3})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    }

    if (gameState === 'start') {
        drawStartScreen();
        return;
    }

    // Planets
    for (const p of planets) {
        // Glow
        const grad = ctx.createRadialGradient(p.x, p.y, p.r*0.5, p.x, p.y, p.r*1.5);
        grad.addColorStop(0, p.color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 1.5, 0, Math.PI*2);
        ctx.fill();

        // Body
        const pGrad = ctx.createRadialGradient(p.x - p.r*0.3, p.y - p.r*0.3, 0, p.x, p.y, p.r);
        pGrad.addColorStop(0, '#fff');
        pGrad.addColorStop(0.2, p.color);
        pGrad.addColorStop(1, '#1a1a2e');
        ctx.fillStyle = pGrad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();

        // Ring
        if (p.ring) {
            ctx.strokeStyle = 'rgba(255,255,200,0.3)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.r * 1.5, p.r * 0.4, 0.3, 0, Math.PI*2);
            ctx.stroke();
        }

        // Gravity field indicator
        ctx.strokeStyle = 'rgba(100,150,255,0.1)';
        ctx.lineWidth = 1;
        for (let r = p.r + 20; r < p.r + 60; r += 20) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI*2);
            ctx.stroke();
        }
    }

    // Asteroids
    for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.beginPath();
        ctx.moveTo(a.points[0].x, a.points[0].y);
        for (let i = 1; i < a.points.length; i++) {
            ctx.lineTo(a.points[i].x, a.points[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = '#8B7355';
        ctx.fill();
        ctx.strokeStyle = '#5a4a35';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Craters
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        for (let i = 0; i < 3; i++) {
            const cx = (Math.sin(i*7 + a.rot) * a.r * 0.4);
            const cy = (Math.cos(i*11 + a.rot) * a.r * 0.4);
            ctx.beginPath();
            ctx.arc(cx, cy, a.r*0.15, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }

    // Bullets
    for (const b of bullets) {
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,215,0,0.3)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI*2);
        ctx.fill();
    }

    // Ship
    if (gameState === 'playing' || ship.invincible > 0) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        
        if (ship.invincible > 0 && Math.floor(ship.invincible / 5) % 2 === 0) {
            ctx.globalAlpha = 0.4;
        }

        // Engine flame
        if (keys['KeyW'] || keys['ArrowUp']) {
            const flameLen = 10 + Math.random() * 8;
            ctx.fillStyle = '#FF6600';
            ctx.beginPath();
            ctx.moveTo(-12, -4);
            ctx.lineTo(-12 - flameLen, 0);
            ctx.lineTo(-12, 4);
            ctx.fill();
            ctx.fillStyle = '#FFAA00';
            ctx.beginPath();
            ctx.moveTo(-12, -2);
            ctx.lineTo(-12 - flameLen*0.6, 0);
            ctx.lineTo(-12, 2);
            ctx.fill();
        }

        // Ship body
        ctx.fillStyle = '#C0C0C0';
        ctx.beginPath();
        ctx.moveTo(15, 0);
        ctx.lineTo(-10, -8);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-10, 8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#808080';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Cockpit
        ctx.fillStyle = '#4FC3F7';
        ctx.beginPath();
        ctx.arc(5, 0, 3, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    // Particles
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.fillStyle = `rgba(${p.color === '#FFD700' ? '255,215,0' : '139,115,85'},${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2);
        ctx.fill();
    }

    // HUD
    if (gameState === 'playing') {
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`Score: ${Math.floor(score)}`, 20, 30);
        ctx.fillText(`High: ${highScore}`, 20, 55);

        // Speed indicator
        const speed = Math.hypot(ship.vx, ship.vy);
        ctx.fillText(`Speed: ${speed.toFixed(1)}`, 20, 80);

        // Gravity warning
        for (const p of planets) {
            const dist = Math.hypot(p.x - ship.x, p.y - ship.y);
            if (dist < 200) {
                ctx.fillStyle = 'rgba(255,100,100,0.7)';
                ctx.font = '14px monospace';
                ctx.fillText('⚠ GRAVITY PULL', p.x - 60, p.y - p.r - 15);
            }
        }
    }

    // Game over overlay
    if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#FF4444';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H/2 - 40);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Score: ${Math.floor(score)}`, W/2, H/2 + 10);
        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#FFD700';
            ctx.fillText('NEW HIGH SCORE!', W/2, H/2 + 45);
        }
        ctx.fillStyle = '#aaa';
        ctx.font = '18px monospace';
        ctx.fillText('Press R or Enter to restart', W/2, H/2 + 90);
    }

    // Update particles even in gameover
    if (gameState === 'gameover') {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }
}

function drawStartScreen() {
    // Animated background
    if (!stars) stars = createStars();
    for (const s of stars) {
        s.x -= s.speed;
        if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    }
    for (const s of stars) {
        ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size * 0.3})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    }

    ctx.textAlign = 'center';
    
    // Title with glow
    const tGrad = ctx.createLinearGradient(W/2 - 200, 0, W/2 + 200, 0);
    tGrad.addColorStop(0, '#FFD700');
    tGrad.addColorStop(0.5, '#fff');
    tGrad.addColorStop(1, '#FFD700');
    ctx.fillStyle = tGrad;
    ctx.font = 'bold 52px monospace';
    ctx.fillText('GRAVITY', W/2, H/2 - 80);
    ctx.fillText('ASTEROIDS', W/2, H/2 - 30);

    // Decorative planet
    const t = Date.now() * 0.001;
    const px = W/2 + Math.sin(t) * 50;
    const py = H/2 - 130 + Math.cos(t*0.7) * 10;
    const pGrad = ctx.createRadialGradient(px-5, py-5, 0, px, py, 20);
    pGrad.addColorStop(0, '#87CEEB');
    pGrad.addColorStop(1, '#2196F3');
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.arc(px, py, 20, 0, Math.PI*2);
    ctx.fill();

    // Controls
    ctx.fillStyle = '#ccc';
    ctx.font = '18px monospace';
    const controls = [
        'W/S or ↑/↓ — Thrust',
        'A/D or ←/→ — Rotate',
        'SPACE — Shoot',
        '',
        'Navigate through the asteroid field.',
        'Planets pull you with GRAVITY!',
        'Destroy asteroids to score points.'
    ];
    controls.forEach((line, i) => {
        ctx.fillText(line, W/2, H/2 + 40 + i * 28);
    });

    // Prompt
    const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = '22px monospace';
    ctx.fillText('Press ENTER or SPACE to start', W/2, H - 60);

    if (highScore > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = '16px monospace';
        ctx.fillText(`High Score: ${highScore}`, W/2, H - 30);
    }
}

let stars = createStars();

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
