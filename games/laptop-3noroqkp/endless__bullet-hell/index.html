<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Hell</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'explode') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('bulletHellHigh') || '0'); } catch(e) {}
let lives = 3;
let time = 0;
let wave = 1;
let shake = 0;
let powerLevel = 1;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) {
        initAudio();
        startGame();
    }
    if (gameState === 'gameover' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyR')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Player
let player = { x: 0, y: 0, w: 20, h: 24, speed: 5, invincible: 0 };
let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let powerups = [];
let stars = [];

// Stars background
function initStars() {
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 1 + 0.5 });
    }
}

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    time = 0;
    wave = 1;
    powerLevel = 1;
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    powerups = [];
    player.x = W / 2;
    player.y = H - 60;
    player.invincible = 0;
    initStars();
}

// Particle system
function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * speed + 1;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 40 + Math.random() * 20, maxLife: 60, color });
    }
}

function spawnExplosion(x, y, size) {
    spawnParticles(x, y, '#ff6600', 15, 4);
    spawnParticles(x, y, '#ffff00', 10, 3);
    spawnParticles(x, y, '#ffffff', 5, 2);
}

// Enemy spawning
function spawnEnemy() {
    const diff = Math.min(time / 300, 5); // difficulty scales over time
    const type = Math.random();
    let e;
    if (type < 0.4) {
        // Basic - moves down, fires aimed
        e = { x: Math.random() * (W - 60) + 30, y: -30, w: 28, h: 28, hp: 1 + Math.floor(diff / 2), type: 'basic', timer: 0, angle: 0, phase: 0 };
    } else if (type < 0.7) {
        // Spinner - moves in circle, fires radial
        e = { x: W / 2 + (Math.random() - 0.5) * W * 0.6, y: -30, w: 32, h: 32, hp: 2 + Math.floor(diff / 2), type: 'spinner', timer: 0, angle: Math.random() * Math.PI * 2, phase: 0 };
    } else {
        // Heavy - slow, fires spread patterns
        e = { x: Math.random() * (W - 80) + 40, y: -40, w: 40, h: 40, hp: 4 + Math.floor(diff / 2), type: 'heavy', timer: 0, angle: 0, phase: 0 };
    }
    e.maxHp = e.hp;
    enemies.push(e);
}

// Bullet firing patterns
function fireAimed(x, y, count, spread, speed) {
    const baseAngle = Math.atan2(player.y - y, player.x - x);
    for (let i = 0; i < count; i++) {
        const a = baseAngle + (i - (count - 1) / 2) * (spread / Math.max(count - 1, 1));
        enemyBullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5, color: '#ff4444' });
    }
}

function fireRadial(x, y, count, speed, offset) {
    for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + offset;
        enemyBullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5, color: '#ff8800' });
    }
}

function fireSine(x, y, count, speed, freq, amp) {
    for (let i = 0; i < count; i++) {
        const a = -Math.PI / 2 + Math.sin(i * freq) * amp;
        enemyBullets.push({ x, y: y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 4, color: '#ff00ff' });
    }
}

function fireSpread(x, y, count, angle, spread, speed) {
    for (let i = 0; i < count; i++) {
        const a = angle + (i - (count - 1) / 2) * (spread / Math.max(count - 1, 1));
        enemyBullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5, color: '#44ff44' });
    }
}

// Update
function update(dt) {
    if (gameState !== 'playing') return;
    time++;

    // Stars
    for (let s of stars) {
        s.y += s.sp;
        if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }

    // Player movement
    const spd = 5;
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= spd;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += spd;
    if (keys['ArrowUp'] || keys['KeyW']) player.y -= spd;
    if (keys['ArrowDown'] || keys['KeyS']) player.y += spd;
    player.x = Math.max(15, Math.min(W - 15, player.x));
    player.y = Math.max(H * 0.5, Math.min(H - 20, player.y));
    if (player.invincible > 0) player.invincible--;

    // Player auto-fire
    if (time % 8 === 0) {
        playSound('shoot');
        if (powerLevel <= 1) {
            bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -10, r: 3 });
        } else if (powerLevel === 2) {
            bullets.push({ x: player.x - 5, y: player.y - 12, vx: 0, vy: -10, r: 3 });
            bullets.push({ x: player.x + 5, y: player.y - 12, vx: 0, vy: -10, r: 3 });
        } else {
            bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -10, r: 3 });
            bullets.push({ x: player.x - 8, y: player.y - 10, vx: -2, vy: -9, r: 3 });
            bullets.push({ x: player.x + 8, y: player.y - 10, vx: 2, vy: -9, r: 3 });
        }
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
    }

    // Spawn enemies
    const spawnRate = Math.max(60 - Math.floor(time / 100), 15);
    if (time % spawnRate === 0) {
        spawnEnemy();
        if (time > 600 && time % (spawnRate * 2) === 0) spawnEnemy();
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.timer++;
        e.phase += 0.05;

        if (e.type === 'basic') {
            e.y += 1.5 + time / 2000;
            if (e.timer % Math.max(60 - Math.floor(time / 50), 30) === 0) {
                const count = 3 + Math.floor(time / 300);
                fireAimed(e.x, e.y, Math.min(count, 7), 0.3, 4);
            }
        } else if (e.type === 'spinner') {
            e.angle += 0.02;
            e.x += Math.cos(e.angle) * 1.5;
            e.y += 1 + time / 3000;
            if (e.timer % 45 === 0) {
                fireRadial(e.x, e.y, 8 + Math.floor(time / 200), 3, e.phase);
            }
        } else { // heavy
            e.y += 0.8;
            if (e.timer % 90 === 0) {
                fireSpread(e.x, e.y, 5 + Math.floor(time / 400), -Math.PI / 2, 1.2, 3.5);
            }
            if (e.timer % 30 === 0) {
                fireAimed(e.x, e.y, 2, 0.5, 5);
            }
        }

        // Remove if off screen
        if (e.y > H + 50 || e.x < -60 || e.x > W + 60) { enemies.splice(i, 1); continue; }

        // Bullet collision with enemy
        for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            const dx = b.x - e.x, dy = b.y - e.y;
            if (Math.abs(dx) < e.w / 2 + 5 && Math.abs(dy) < e.h / 2 + 5) {
                bullets.splice(j, 1);
                e.hp--;
                spawnParticles(b.x, b.y, '#ffff00', 3, 2);
                if (e.hp <= 0) {
                    score += e.type === 'heavy' ? 50 : e.type === 'spinner' ? 30 : 15;
                    spawnExplosion(e.x, e.y);
                    playSound('explode');
                    // Drop powerup chance
                    if (Math.random() < 0.2) {
                        powerups.push({ x: e.x, y: e.y, vy: 1.5, type: Math.random() < 0.5 ? 'power' : 'life' });
                    }
                    enemies.splice(i, 1);
                }
                break;
            }
        }
    }

    // Update enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx; b.y += b.vy;
        if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) { enemyBullets.splice(i, 1); continue; }

        // Hit player
        if (player.invincible <= 0) {
            const dx = b.x - player.x, dy = b.y - player.y;
            if (Math.abs(dx) < 12 && Math.abs(dy) < 14) {
                enemyBullets.splice(i, 1);
                lives--;
                player.invincible = 90;
                shake = 10;
                playSound('hit');
                spawnParticles(player.x, player.y, '#ffffff', 20, 5);
                if (lives <= 0) {
                    gameState = 'gameover';
                    try {
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('bulletHellHigh', String(highScore));
                        }
                    } catch(e) {}
                }
            }
        }
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.vy;
        if (p.y > H + 20) { powerups.splice(i, 1); continue; }
        const dx = p.x - player.x, dy = p.y - player.y;
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
            playSound('powerup');
            if (p.type === 'power') powerLevel = Math.min(powerLevel + 1, 3);
            else lives = Math.min(lives + 1, 5);
            powerups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.95; p.vy *= 0.95;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake decay
    if (shake > 0) shake -= 0.5;

    // Score over time
    if (time % 30 === 0) score++;
}

// Render
function render() {
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0015');
    grad.addColorStop(1, '#1a0030');
    ctx.fillStyle = grad;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Stars
    ctx.fillStyle = '#ffffff';
    for (let s of stars) {
        ctx.globalAlpha = 0.5 + Math.sin(time * 0.05 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    if (gameState === 'start') {
        renderStartScreen();
        ctx.restore();
        return;
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Powerups
    for (let p of powerups) {
        ctx.save();
        ctx.translate(p.x, p.y);
        if (p.type === 'power') {
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('P', 0, 5);
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;
            ctx.strokeText('P', 0, 5);
        } else {
            ctx.fillStyle = '#ff4488';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('+', 0, 5);
            ctx.shadowColor = '#ff4488';
            ctx.shadowBlur = 10;
            ctx.strokeText('+', 0, 5);
        }
        ctx.restore();
    }

    // Player bullets
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 8;
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Enemies
    for (let e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        const hpRatio = e.hp / e.maxHp;
        if (e.type === 'basic') {
            ctx.fillStyle = '#ff6644';
            ctx.shadowColor = '#ff6644';
            ctx.shadowBlur = 6;
            drawShip(0, 0, 14, 0);
        } else if (e.type === 'spinner') {
            ctx.rotate(e.phase * 2);
            ctx.fillStyle = '#ff44aa';
            ctx.shadowColor = '#ff44aa';
            ctx.shadowBlur = 8;
            drawShip(0, 0, 16, Math.PI / 4);
        } else {
            ctx.fillStyle = '#ff2222';
            ctx.shadowColor = '#ff2222';
            ctx.shadowBlur = 10;
            drawShip(0, 0, 22, 0);
            // HP bar
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#333';
            ctx.fillRect(-20, -e.h / 2 - 8, 40, 4);
            ctx.fillStyle = hpRatio > 0.5 ? '#00ff00' : '#ff4400';
            ctx.fillRect(-20, -e.h / 2 - 8, 40 * hpRatio, 4);
        }
        ctx.restore();
    }

    // Enemy bullets
    for (let b of enemyBullets) {
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Player
    if (player.invincible <= 0 || Math.floor(time / 5) % 2 === 0) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 10;
        drawShip(0, 0, 12, Math.PI);
        ctx.restore();
    }

    // UI
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`BEST: ${Math.max(highScore, score)}`, 20, 55);

    // Lives
    for (let i = 0; i < lives; i++) {
        ctx.fillStyle = '#ff4488';
        ctx.beginPath();
        ctx.moveTo(W - 30 - i * 25, 25);
        ctx.lineTo(W - 22 - i * 25, 15);
        ctx.lineTo(W - 14 - i * 25, 25);
        ctx.lineTo(W - 26 - i * 25, 28);
        ctx.lineTo(W - 18 - i * 25, 35);
        ctx.closePath();
        ctx.fill();
    }

    // Power level
    ctx.fillStyle = '#00ff88';
    ctx.font = '14px monospace';
    ctx.fillText(`PWR: ${'█'.repeat(powerLevel)}${'░'.repeat(3 - powerLevel)}`, 20, H - 20);

    if (gameState === 'gameover') {
        renderGameOver();
    }

    ctx.restore();
}

function drawShip(x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(-size * 0.7, size * 0.6);
    ctx.lineTo(-size * 0.3, size * 0.4);
    ctx.lineTo(0, size * 0.5);
    ctx.lineTo(size * 0.3, size * 0.4);
    ctx.lineTo(size * 0.7, size * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function renderStartScreen() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0066';
    ctx.shadowBlur = 20;
    ctx.fillText('BULLET HELL', W / 2, H / 3);
    ctx.shadowBlur = 0;

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaaacc';
    ctx.fillText('Dodge the bullets. Survive as long as you can.', W / 2, H / 3 + 50);
    ctx.fillText('', W / 2, H / 3 + 70);
    ctx.fillText('MOVE: Arrow Keys / WASD', W / 2, H / 2 - 10);
    ctx.fillText('AUTO-FIRE: Enabled', W / 2, H / 2 + 20);
    ctx.fillText('', W / 2, H / 2 + 50);

    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(Date.now() * 0.005) * 0.5})`;
    ctx.font = 'bold 22px monospace';
    ctx.fillText('PRESS ENTER TO START', W / 2, H * 0.7);

    if (highScore > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = '16px monospace';
        ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, H * 0.8);
    }
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff3333';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 15;
    ctx.fillText('GAME OVER', W / 2, H / 3);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffffff';
    ctx.font = '24px monospace';
    ctx.fillText(`SCORE: ${score}`, W / 2, H / 3 + 50);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 20px monospace';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 3 + 85);
    }

    ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(Date.now() * 0.005) * 0.5})`;
    ctx.font = '18px monospace';
    ctx.fillText('PRESS ENTER OR R TO RESTART', W / 2, H * 0.65);
}

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;

    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}

initStars();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
