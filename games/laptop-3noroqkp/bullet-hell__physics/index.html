<!DOCTYPE html>
<html>
<head>
<title>Bullet Storm - Physics Bullet Hell</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type, freq, dur, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.2));
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + (dur || 0.2));
}
function playShoot() { playSound('square', 880, 0.1, 0.08); }
function playExplosion() { playSound('sawtooth', 120, 0.4, 0.2); }
function playHit() { playSound('sawtooth', 60, 0.3, 0.3); }
function playEnemyDie() { playSound('triangle', 200, 0.3, 0.15); }

// Game State
let state = 'start'; // start, playing, gameover, paused
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('bulletStormHS') || '0'); } catch(e) {}
let gameTime = 0;
let screenShake = 0;

// Input
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    }
    if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    }
    if (state === 'playing' && e.code === 'KeyP') {
        state = 'paused';
    } else if (state === 'paused' && e.code === 'KeyP') {
        state = 'playing';
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Player
let player = {};
function resetPlayer() {
    player = {
        x: W / 2, y: H * 0.8,
        vx: 0, vy: 0,
        radius: 5,
        visualRadius: 16,
        hp: 3, maxHp: 5,
        invincible: 0,
        shootTimer: 0,
        powerLevel: 1,
        trail: []
    };
}

// Bullets (enemy)
let bullets = [];
// Player bullets
let playerBullets = [];
// Enemies
let enemies = [];
// Particles
let particles = [];
// Stars
let stars = [];
for (let i = 0; i < 100; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1 });
}

function startGame() {
    state = 'playing';
    score = 0;
    gameTime = 0;
    bullets = [];
    playerBullets = [];
    enemies = [];
    particles = [];
    resetPlayer();
}

// Enemy patterns
class Enemy {
    constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = 25;
        this.hp = 3 + Math.floor(gameTime / 10);
        this.maxHp = this.hp;
        this.timer = 0;
        this.angle = 0;
        this.phase = 0;
        this.life = 600; // frames alive
        this.fired = false;

        if (type === 'spiral') {
            this.vy = 1.5;
            this.radius = 28;
            this.hp = 4 + Math.floor(gameTime / 8);
        } else if (type === 'spreader') {
            this.vy = 0.8;
            this.radius = 32;
            this.hp = 5 + Math.floor(gameTime / 6);
        } else if (type === 'aimed') {
            this.vy = 1.2;
            this.vx = (Math.random() - 0.5) * 2;
            this.radius = 24;
            this.hp = 3 + Math.floor(gameTime / 8);
        } else if (type === 'gravity') {
            this.vy = 0.5;
            this.radius = 35;
            this.hp = 6 + Math.floor(gameTime / 5);
        }
    }

    update() {
        this.timer++;
        this.x += this.vx;
        this.y += this.vy;
        this.angle += 0.02;

        if (this.type === 'spiral') {
            if (this.timer % 8 === 0) {
                for (let i = 0; i < 3; i++) {
                    let a = this.phase + (i * Math.PI * 2 / 3);
                    bullets.push({
                        x: this.x, y: this.y,
                        vx: Math.cos(a) * 3.5,
                        vy: Math.sin(a) * 3.5 + 0.5,
                        radius: 6, type: 'normal', gravity: 0
                    });
                }
                this.phase += 0.15;
            }
        } else if (this.type === 'spreader') {
            if (this.timer % 25 === 0) {
                let count = 7 + Math.floor(gameTime / 30);
                for (let i = 0; i < count; i++) {
                    let a = -Math.PI / 2 + (i - count / 2) * 0.15;
                    bullets.push({
                        x: this.x, y: this.y,
                        vx: Math.cos(a) * 3,
                        vy: Math.sin(a) * 3 + 1,
                        radius: 7, type: 'normal', gravity: 0.02
                    });
                }
            }
        } else if (this.type === 'aimed') {
            if (this.timer % 40 === 0) {
                let dx = player.x - this.x;
                let dy = player.y - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                for (let i = 0; i < 5; i++) {
                    let a = Math.atan2(dy, dx) + (i - 2) * 0.1;
                    bullets.push({
                        x: this.x, y: this.y,
                        vx: Math.cos(a) * 4,
                        vy: Math.sin(a) * 4,
                        radius: 5, type: 'fast', gravity: 0
                    });
                }
            }
        } else if (this.type === 'gravity') {
            if (this.timer % 15 === 0) {
                let a = this.angle;
                bullets.push({
                    x: this.x, y: this.y,
                    vx: Math.cos(a) * 2.5,
                    vy: Math.sin(a) * 2.5,
                    radius: 8, type: 'heavy', gravity: 0.15
                });
            }
        }

        if (this.timer > this.life || this.y > H + 50) return false;
        return true;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Body
        let color = this.type === 'spiral' ? '#ff4444' : this.type === 'spreader' ? '#ff8800' : this.type === 'aimed' ? '#ffcc00' : '#aa44ff';
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            let a = (i / 6) * Math.PI * 2;
            let r = this.radius * (1 + Math.sin(this.timer * 0.1 + i) * 0.1);
            if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.stroke();

        // HP bar
        ctx.restore();
        let hpPct = this.hp / this.maxHp;
        ctx.fillStyle = '#333';
        ctx.fillRect(this.x - 20, this.y - this.radius - 12, 40, 5);
        ctx.fillStyle = hpPct > 0.5 ? '#4f4' : hpPct > 0.25 ? '#ff4' : '#f44';
        ctx.fillRect(this.x - 20, this.y - this.radius - 12, 40 * hpPct, 5);

        // Glow
        ctx.save();
        ctx.translate(this.x, this.y);
        let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius);
        grad.addColorStop(0, color + '44');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function spawnEnemy() {
    let types = ['spiral', 'spreader', 'aimed', 'gravity'];
    let type = types[Math.floor(Math.random() * types.length)];
    let x = W * 0.2 + Math.random() * W * 0.6;
    enemies.push(new Enemy(type, x, -40));
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        let a = Math.random() * Math.PI * 2;
        let speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            life: 30 + Math.random() * 30,
            maxLife: 60,
            color,
            radius: Math.random() * 3 + 1
        });
    }
}

function updatePlayer(dt) {
    let accel = 0.6;
    let friction = 0.92;

    if (keys['ArrowLeft'] || keys['KeyA']) player.vx -= accel;
    if (keys['ArrowRight'] || keys['KeyD']) player.vx += accel;
    if (keys['ArrowUp'] || keys['KeyW']) player.vy -= accel;
    if (keys['ArrowDown'] || keys['KeyS']) player.vy += accel;

    player.vx *= friction;
    player.vy *= friction;

    // Speed cap
    let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
    if (speed > 8) {
        player.vx = (player.vx / speed) * 8;
        player.vy = (player.vy / speed) * 8;
    }

    player.x += player.vx;
    player.y += player.vy;

    // Bounds
    if (player.x < 20) { player.x = 20; player.vx = 0; }
    if (player.x > W - 20) { player.x = W - 20; player.vx = 0; }
    if (player.y < 20) { player.y = 20; player.vy = 0; }
    if (player.y > H - 20) { player.y = H - 20; player.vy = 0; }

    // Trail
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 15) player.trail.shift();

    // Invincibility
    if (player.invincible > 0) player.invincible -= dt;

    // Shooting
    player.shootTimer -= dt;
    if ((keys['Space'] || keys['KeyZ']) && player.shootTimer <= 0) {
        let spread = player.powerLevel >= 3 ? 3 : player.powerLevel >= 2 ? 2 : 1;
        for (let i = 0; i < spread; i++) {
            let offset = (i - (spread - 1) / 2) * 8;
            playerBullets.push({
                x: player.x + offset, y: player.y - 15,
                vx: (offset * 0.3), vy: -12,
                radius: 4, damage: 1
            });
        }
        player.shootTimer = 8;
        playShoot();
    }

    // Power up from score
    if (score > 500 && player.powerLevel < 2) player.powerLevel = 2;
    if (score > 1500 && player.powerLevel < 3) player.powerLevel = 3;
}

function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.vy += b.gravity; // Physics gravity
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 50) {
            bullets.splice(i, 1);
            continue;
        }

        // Collision with player
        if (player.invincible <= 0) {
            let dx = b.x - player.x;
            let dy = b.y - player.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < b.radius + player.radius) {
                player.hp--;
                player.invincible = 120;
                screenShake = 15;
                playHit();
                spawnParticles(player.x, player.y, '#ff4444', 20);
                if (player.hp <= 0) {
                    state = 'gameover';
                    try { localStorage.setItem('bulletStormHS', Math.max(highScore, score).toString()); } catch(e) {}
                    highScore = Math.max(highScore, score);
                    spawnParticles(player.x, player.y, '#ffffff', 40);
                }
            }
        }
    }
}

function updatePlayerBullets() {
    for (let i = playerBullets.length - 1; i >= 0; i--) {
        let b = playerBullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.y < -20 || b.x < -20 || b.x > W + 20) {
            playerBullets.splice(i, 1);
            continue;
        }

        // Hit enemies
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            let dx = b.x - e.x;
            let dy = b.y - e.y;
            if (Math.sqrt(dx * dx + dy * dy) < b.radius + e.radius) {
                e.hp -= b.damage;
                playerBullets.splice(i, 1);
                spawnParticles(b.x, b.y, '#44ff88', 5);
                if (e.hp <= 0) {
                    enemies.splice(j, 1);
                    score += 100 + Math.floor(gameTime / 10);
                    playEnemyDie();
                    spawnParticles(e.x, e.y, '#ffaa00', 25);
                }
                break;
            }
        }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawBackground() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of stars) {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.fillStyle = `rgba(255,255,255,${s.s * 0.3})`;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(40, 60, 100, 0.15)';
    ctx.lineWidth = 1;
    let gridSize = 80;
    for (let x = 0; x < W; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
}

function drawPlayer() {
    if (player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0) return;

    // Trail
    for (let i = 0; i < player.trail.length; i++) {
        let t = player.trail[i];
        let alpha = (i / player.trail.length) * 0.3;
        ctx.fillStyle = `rgba(0, 200, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y + (player.trail.length - i), 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Ship body
    ctx.save();
    ctx.translate(player.x, player.y);
    let tilt = player.vx * 0.05;
    ctx.rotate(tilt);

    // Engine glow
    let engineGlow = ctx.createRadialGradient(0, 15, 0, 0, 15, 20);
    engineGlow.addColorStop(0, 'rgba(0, 150, 255, 0.8)');
    engineGlow.addColorStop(1, 'transparent');
    ctx.fillStyle = engineGlow;
    ctx.beginPath();
    ctx.arc(0, 18, 12 + Math.random() * 4, 0, Math.PI * 2);
    ctx.fill();

    // Ship shape
    ctx.fillStyle = '#0af';
    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-12, 12);
    ctx.lineTo(-5, 8);
    ctx.lineTo(0, 14);
    ctx.lineTo(5, 8);
    ctx.lineTo(12, 12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Hitbox indicator (small dot)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // HP bar
    let hpW = 40;
    ctx.fillStyle = '#333';
    ctx.fillRect(player.x - hpW / 2, player.y + 25, hpW, 4);
    ctx.fillStyle = player.hp > 2 ? '#4f4' : player.hp > 1 ? '#ff4' : '#f44';
    ctx.fillRect(player.x - hpW / 2, player.y + 25, hpW * (player.hp / player.maxHp), 4);
}

function drawBullets() {
    for (let b of bullets) {
        let color = b.type === 'fast' ? '#ff6644' : b.type === 'heavy' ? '#cc44ff' : '#ff4488';
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();

        // Glow
        let g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 2);
        g.addColorStop(0, color + '66');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * 2, 0, Math.PI * 2);
        ctx.fill();

        // Inner bright core
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawPlayerBullets() {
    for (let b of playerBullets) {
        ctx.fillStyle = '#4ff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawParticles() {
    for (let p of particles) {
        let alpha = p.life / p.maxLife;
        ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`HI: ${highScore}`, 20, 50);
    ctx.fillText(`LVL: ${Math.floor(gameTime / 300) + 1}`, W - 100, 30);

    // Power indicator
    ctx.fillStyle = '#4ff';
    ctx.fillText(`PWR: ${player.powerLevel}`, W - 100, 50);
}

function drawStartScreen() {
    drawBackground();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('BULLET STORM', W / 2, H / 3);

    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText('A Physics Bullet-Hell Game', W / 2, H / 3 + 40);

    ctx.font = '16px monospace';
    ctx.fillStyle = '#888';
    let lines = [
        '← → ↑ ↓ / WASD - Move (momentum-based)',
        'SPACE / Z - Shoot',
        'P - Pause',
        '',
        'Dodge the barrage. Physics matter:',
        '  • Your ship has inertia',
        '  • Some bullets are affected by gravity',
        '  • Use momentum to slide through patterns',
        '',
        `HIGH SCORE: ${highScore}`,
        '',
        'PRESS SPACE TO START'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H / 2 + i * 24);
    });
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f44';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillText('GAME OVER', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 3 + 50);
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ff0';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 3 + 80);
    }

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('PRESS SPACE TO RESTART', W / 2, H / 2 + 40);
}

let lastTime = 0;
let spawnTimer = 0;

function gameLoop(timestamp) {
    let dt = Math.min((timestamp - lastTime) / 16.67, 3);
    lastTime = timestamp;

    if (state === 'start') {
        drawStartScreen();
    } else if (state === 'paused') {
        // Draw frozen state
        drawBackground();
        drawBullets();
        drawPlayerBullets();
        enemies.forEach(e => e.draw());
        drawPlayer();
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = '32px monospace';
        ctx.fillText('PAUSED', W / 2, H / 2);
        ctx.font = '16px monospace';
        ctx.fillText('Press P to resume', W / 2, H / 2 + 40);
    } else if (state === 'playing') {
        gameTime += dt;

        // Spawn enemies
        spawnTimer -= dt;
        let spawnRate = Math.max(60 - gameTime / 50, 20);
        if (spawnTimer <= 0) {
            spawnEnemy();
            spawnTimer = spawnRate;
        }

        updatePlayer(dt);
        updateBullets(dt);
        updatePlayerBullets();
        updateParticles();

        for (let i = enemies.length - 1; i >= 0; i--) {
            if (!enemies[i].update()) {
                // Enemy left screen without dying - small penalty? No, just remove.
                enemies.splice(i, 1);
            } else {
                enemies[i].draw();
            }
        }

        // Score over time
        score += Math.floor(dt * 0.5);

        // Screen shake
        if (screenShake > 0) {
            screenShake -= dt;
            let sx = (Math.random() - 0.5) * screenShake;
            let sy = (Math.random() - 0.5) * screenShake;
            ctx.save();
            ctx.translate(sx, sy);
        }

        drawBackground();
        drawBullets();
        drawPlayerBullets();
        enemies.forEach(e => e.draw());
        drawParticles();
        drawPlayer();

        if (screenShake > 0) ctx.restore();

        drawHUD();
    } else if (state === 'gameover') {
        updateParticles();
        drawBackground();
        drawBullets();
        enemies.forEach(e => e.draw());
        drawParticles();
        drawGameOver();
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
