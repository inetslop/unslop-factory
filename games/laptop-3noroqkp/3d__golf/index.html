<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golf 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; width: 100vw; height: 100vh; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game state
let gameState = 'start'; // start, playing, holeComplete, gameOver
let score = 0;
let currentHole = 0;
let holes = [];
let ball = {};
let aimAngle = 0;
let power = 0;
let charging = false;
let audioCtx = null;

// Holes definitions
function generateHoles() {
    holes = [
        { par: 3, length: 8, width: 2, obstacles: [] },
        { par: 3, length: 12, width: 2.5, obstacles: [{ type: 'water', x: 0, z: 5, w: 3, d: 2 }] },
        { par: 4, length: 16, width: 3, obstacles: [{ type: 'bunkers', x: -1.5, z: 7, r: 1.5 }, { type: 'water', x: 0, z: 12, w: 2, d: 2 }] },
        { par: 5, length: 22, width: 4, obstacles: [{ type: 'bunkers', x: 2, z: 8, r: 2 }, { type: 'water', x: -1, z: 14, w: 3, d: 2.5 }, { type: 'trees', x: 0, z: 5, count: 6 }] },
        { par: 5, length: 28, width: 5, obstacles: [{ type: 'water', x: 0, z: 10, w: 4, d: 3 }, { type: 'bunkers', x: -2, z: 18, r: 2 }, { type: 'trees', x: 0, z: 6, count: 8 }] }
    ];
}

function initHole(idx) {
    const h = holes[idx];
    ball = {
        x: 0, y: 0.15, z: 0,
        vx: 0, vy: 0, vz: 0,
        inHole: false, rolling: true
    };
    aimAngle = Math.atan2(0, h.length); // point toward hole
    power = 0;
    charging = false;
}

function startGame() {
    generateHoles();
    score = 0;
    currentHole = 0;
    initHole(0);
    gameState = 'playing';
}

// Audio
function playSound(freq, dur, type) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

function playHit() { playSound(200, 0.15, 'triangle'); }
function playHoleIn() { playSound(400, 0.3, 'sine'); setTimeout(() => playSound(600, 0.3, 'sine'), 100); setTimeout(() => playSound(800, 0.5, 'sine'), 200); }
function playWater() { playSound(150, 0.4, 'sawtooth'); }

// 3D Projection
const FOCAL = 600;
let camX = 0, camY = 5, camZ = -8, camRotY = 0;

function project(x, y, z) {
    // Camera looks in +z direction primarily
    const dx = x - camX;
    const dy = y - camY;
    const dz = z - camZ;
    
    // Rotate around Y axis for camera angle
    const cosR = Math.cos(-camRotY);
    const sinR = Math.sin(-camRotY);
    const rx = dx * cosR - dz * sinR;
    const rz = dx * sinR + dz * cosR;
    
    if (rz < 0.1) return null;
    
    const sx = W / 2 + (rx * FOCAL) / rz;
    const sy = H / 2 - (dy * FOCAL) / rz;
    return { x: sx, y: sy, z: rz };
}

// Rendering
function drawSky() {
    const grad = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    grad.addColorStop(0, '#1a2a6c');
    grad.addColorStop(0.5, '#4a90d9');
    grad.addColorStop(1, '#87ceeb');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H * 0.5);
}

function drawGround() {
    const h = holes[currentHole];
    const groundW = h.width + 2;
    const groundL = h.length + 4;
    
    // Draw ground grid
    ctx.strokeStyle = 'rgba(0,100,0,0.3)';
    ctx.lineWidth = 1;
    
    for (let z = -2; z < groundL; z += 1) {
        const p1 = project(-groundW, 0, z);
        const p2 = project(groundW, 0, z);
        if (p1 && p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
    }
    
    for (let x = -groundW; x <= groundW; x += 1) {
        const p1 = project(x, 0, -2);
        const p2 = project(x, 0, groundL);
        if (p1 && p2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
    }
    
    // Ground fill - draw as filled quads
    for (let z = -2; z < groundL - 1; z += 1) {
        for (let x = -groundW; x < groundW; x += 1) {
            const p1 = project(x, 0, z);
            const p2 = project(x + 1, 0, z);
            const p3 = project(x + 1, 0, z + 1);
            const p4 = project(x, 0, z + 1);
            if (p1 && p2 && p3 && p4) {
                // Checker pattern for mowing effect
                const check = ((x + groundW) % 2 === 0 && (z + 2) % 2 === 0) ? '#2d8a2d' : '#228b22';
                ctx.fillStyle = check;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.closePath();
                ctx.fill();
            }
        }
    }
}

function drawWater() {
    const h = holes[currentHole];
    for (const obs of h.obstacles) {
        if (obs.type === 'water') {
            const p1 = project(obs.x - obs.w / 2, 0.05, obs.z - obs.d / 2);
            const p2 = project(obs.x + obs.w / 2, 0.05, obs.z - obs.d / 2);
            const p3 = project(obs.x + obs.w / 2, 0.05, obs.z + obs.d / 2);
            const p4 = project(obs.x - obs.w / 2, 0.05, obs.z + obs.d / 2);
            if (p1 && p2 && p3 && p4) {
                ctx.fillStyle = 'rgba(30,100,200,0.8)';
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineTo(p3.x, p3.y);
                ctx.lineTo(p4.x, p4.y);
                ctx.closePath();
                ctx.fill();
                
                // Ripples
                const time = Date.now() * 0.003;
                for (let i = 0; i < 3; i++) {
                    const rx = obs.x - obs.w / 4 + Math.sin(time + i) * 0.2;
                    const rz = obs.z - obs.d / 4 + Math.cos(time + i * 2) * 0.2;
                    const rp = project(rx, 0.06, rz);
                    if (rp) {
                        ctx.fillStyle = 'rgba(150,200,255,0.4)';
                        ctx.beginPath();
                        ctx.arc(rp.x, rp.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }
    }
}

function drawBunkers() {
    const h = holes[currentHole];
    for (const obs of h.obstacles) {
        if (obs.type === 'bunkers') {
            const p = project(obs.x, 0.1, obs.z);
            if (p) {
                const r = Math.max(5, obs.r * FOCAL / p.z * 0.5);
                ctx.fillStyle = '#e8d690';
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#c4a850';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
    }
}

function drawTrees() {
    const h = holes[currentHole];
    for (const obs of h.obstacles) {
        if (obs.type === 'trees') {
            for (let i = 0; i < obs.count; i++) {
                const angle = (i / obs.count) * Math.PI * 2;
                const tx = Math.cos(angle) * 1.5 + obs.x;
                const tz = Math.sin(angle) * 1.5 + obs.z;
                
                // Trunk
                const trunkP = project(tx, 0, tz);
                const topP = project(tx, 3, tz);
                if (trunkP && topP) {
                    ctx.strokeStyle = '#4a2f0a';
                    ctx.lineWidth = Math.max(2, FOCAL / trunkP.z * 0.15);
                    ctx.beginPath();
                    ctx.moveTo(trunkP.x, trunkP.y);
                    ctx.lineTo(topP.x, topP.y);
                    ctx.stroke();
                }
                
                // Canopy
                const leafP = project(tx, 2.2, tz);
                if (leafP) {
                    const lr = Math.max(5, FOCAL / leafP.z * 1.2);
                    ctx.fillStyle = '#1a5c1a';
                    ctx.beginPath();
                    ctx.arc(leafP.x, leafP.y, lr, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#2d8a2d';
                    ctx.beginPath();
                    ctx.arc(leafP.x - lr * 0.3, leafP.y - lr * 0.3, lr * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
    }
}

function drawHole() {
    const h = holes[currentHole];
    const holeX = 0;
    const holeZ = h.length;
    
    // Hole (dark circle)
    const hp = project(holeX, 0.02, holeZ);
    if (hp) {
        const hr = Math.max(4, FOCAL / hp.z * 0.35);
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, hr, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Flag pole
    const flagBase = project(holeX, 0, holeZ);
    const flagTop = project(holeX, 3, holeZ);
    if (flagBase && flagTop) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(2, FOCAL / flagBase.z * 0.1);
        ctx.beginPath();
        ctx.moveTo(flagBase.x, flagBase.y);
        ctx.lineTo(flagTop.x, flagTop.y);
        ctx.stroke();
        
        // Flag
        const wave = Math.sin(Date.now() * 0.005) * 5;
        ctx.fillStyle = '#ff3333';
        ctx.beginPath();
        ctx.moveTo(flagTop.x, flagTop.y);
        ctx.lineTo(flagTop.x + 20 + wave, flagTop.y - 10);
        ctx.lineTo(flagTop.x + 20 + wave, flagTop.y + 5);
        ctx.closePath();
        ctx.fill();
    }
}

function drawBall() {
    // Shadow
    const shadowP = project(ball.x, 0.01, ball.z);
    if (shadowP) {
        const sr = Math.max(2, FOCAL / shadowP.z * 0.15);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(shadowP.x, shadowP.y, sr, sr * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Ball
    const bp = project(ball.x, ball.y, ball.z);
    if (bp) {
        const br = Math.max(3, FOCAL / bp.z * 0.15);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, br, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(bp.x - br * 0.3, bp.y - br * 0.3, br * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawAimArrow() {
    if (ball.inHole || !ball.rolling) return;
    
    const aimLen = 2 + power * 3;
    const endX = ball.x + Math.sin(aimAngle) * aimLen;
    const endZ = ball.z + Math.cos(aimAngle) * aimLen;
    
    const p1 = project(ball.x, 0.2, ball.z);
    const p2 = project(endX, 0.2, endZ);
    if (p1 && p2) {
        ctx.strokeStyle = power > 0 ? '#ff6600' : '#ffff00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        
        // Arrow head
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        ctx.beginPath();
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p2.x - 15 * Math.cos(angle - 0.4), p2.y - 15 * Math.sin(angle - 0.4));
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p2.x - 15 * Math.cos(angle + 0.4), p2.y - 15 * Math.sin(angle + 0.4));
        ctx.stroke();
    }
}

function drawPowerBar() {
    const barX = W / 2 - 100;
    const barY = H - 60;
    const barW = 200;
    const barH = 20;
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
    
    const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    grad.addColorStop(0, '#0f0');
    grad.addColorStop(0.5, '#ff0');
    grad.addColorStop(1, '#f00');
    ctx.fillStyle = grad;
    ctx.fillRect(barX, barY, barW * power, barH);
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(barX, barY, barW, barH);
}

function drawUI() {
    const h = holes[currentHole];
    
    // Score info
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, 10, 250, 90);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`Hole ${currentHole + 1}/${holes.length}`, 20, 35);
    ctx.fillText(`Par: ${h.par}  |  Strokes: ${strokesThisHole}`, 20, 55);
    ctx.fillText(`Total Score: ${score}`, 20, 75);
    
    // Power bar
    if (charging) drawPowerBar();
    
    // Controls hint
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(W / 2 - 180, H - 30, 360, 25);
    ctx.fillStyle = '#aaa';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('← → Aim | Hold SPACE for power | Release to hit', W / 2, H - 14);
    ctx.textAlign = 'left';
}

let strokesThisHole = 0;

// Physics
const GRAVITY = -9.8;
const BALL_RADIUS = 0.15;

function updatePhysics(dt) {
    if (ball.inHole || gameState !== 'playing') return;
    
    // Apply gravity
    ball.vy += GRAVITY * dt;
    
    // Update position
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.z += ball.vz * dt;
    
    // Ground collision
    if (ball.y < BALL_RADIUS) {
        ball.y = BALL_RADIUS;
        ball.vy = 0;
        
        // Friction
        const speed = Math.sqrt(ball.vx * ball.vx + ball.vz * ball.vz);
        if (speed > 0.1) {
            ball.vx *= 0.98;
            ball.vz *= 0.98;
        } else {
            ball.vx = 0;
            ball.vz = 0;
        }
    }
    
    // Check obstacles
    const h = holes[currentHole];
    for (const obs of h.obstacles) {
        if (obs.type === 'water') {
            if (ball.x > obs.x - obs.w / 2 && ball.x < obs.x + obs.w / 2 &&
                ball.z > obs.z - obs.d / 2 && ball.z < obs.z + obs.d / 2 &&
                ball.y < 0.3) {
                // Hit water!
                playWater();
                ball.vx = 0;
                ball.vy = 0;
                ball.vz = 0;
                ball.x = obs.x;
                ball.z = obs.z - obs.d / 2 - 1;
                ball.y = BALL_RADIUS;
                score += 2; // penalty
            }
        }
        if (obs.type === 'bunkers') {
            const dx = ball.x - obs.x;
            const dz = ball.z - obs.z;
            if (Math.sqrt(dx * dx + dz * dz) < obs.r && ball.y < 0.3) {
                // Extra friction in bunker
                ball.vx *= 0.95;
                ball.vz *= 0.95;
            }
        }
    }
    
    // Check hole
    const holeX = 0, holeZ = h.length;
    const hdx = ball.x - holeX;
    const hdz = ball.z - holeZ;
    const distToHole = Math.sqrt(hdx * hdx + hdz * hdz);
    
    if (distToHole < 0.4 && ball.y < 0.5) {
        // Ball drops in!
        const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy + ball.vz * ball.vz);
        if (speed < 8) {
            ball.inHole = true;
            ball.vx = 0;
            ball.vy = 0;
            ball.vz = 0;
            ball.x = holeX;
            ball.z = holeZ;
            ball.y = -0.2;
            playHoleIn();
            
            const strokes = strokesThisHole;
            score += strokes;
            
            setTimeout(() => {
                if (currentHole < holes.length - 1) {
                    currentHole++;
                    initHole(currentHole);
                    strokesThisHole = 0;
                    gameState = 'playing';
                } else {
                    gameState = 'gameOver';
                }
            }, 2000);
        }
    }
    
    // Out of bounds
    if (Math.abs(ball.x) > h.width / 2 + 3 || ball.z < -5 || ball.z > h.length + 5) {
        playWater();
        ball.vx = 0;
        ball.vy = 0;
        ball.vz = 0;
        ball.x = 0;
        ball.z = 0;
        ball.y = BALL_RADIUS;
        score += 1; // penalty
    }
}

// Camera update
function updateCamera() {
    const h = holes[currentHole];
    const targetX = ball.x * 0.3;
    const targetZ = ball.z - 8;
    
    camX += (targetX - camX) * 0.05;
    camZ += (targetZ - camZ) * 0.05;
    camY += (5 - camY) * 0.05;
    
    // Slight rotation to face hole direction
    const targetRot = Math.atan2(0, h.length - ball.z) * 0.3;
    camRotY += (targetRot - camRotY) * 0.02;
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    
    if (gameState === 'start') {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startGame();
    } else if (gameState === 'gameOver') {
        startGame();
    }
    
    if (e.code === 'Space') {
        e.preventDefault();
        if (ball.rolling && !ball.inHole) charging = true;
    }
});

window.addEventListener('keyup', e => {
    keys[e.code] = false;
    
    if (e.code === 'Space' && charging) {
        e.preventDefault();
        // Hit the ball!
        const hitPower = power * 15;
        ball.vx = Math.sin(aimAngle) * hitPower;
        ball.vz = Math.cos(aimAngle) * hitPower;
        ball.vy = 3 + power * 5;
        strokesThisHole++;
        playHit();
        charging = false;
        power = 0;
    }
});

// Render loop
let lastTime = 0;
function render(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    
    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'gameOver') {
        drawGameOver();
    } else {
        // Update
        updatePhysics(dt);
        updateCamera();
        
        if (charging) {
            power = Math.min(1, power + dt * 1.5);
        }
        
        if (keys['ArrowLeft']) aimAngle -= 2 * dt;
        if (keys['ArrowRight']) aimAngle += 2 * dt;
        
        // Draw
        drawSky();
        drawGround();
        drawWater();
        drawBunkers();
        drawTrees();
        drawHole();
        drawAimArrow();
        drawBall();
        drawUI();
    }
    
    requestAnimationFrame(render);
}

function drawStartScreen() {
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a2a6c');
    grad.addColorStop(1, '#2d8a2d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 72px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GOLF 3D', W / 2, H / 3);
    
    // Subtitle
    ctx.font = '24px monospace';
    ctx.fillStyle = '#aaffaa';
    ctx.fillText('~ Swing into the Green ~', W / 2, H / 3 + 50);
    
    // Controls
    ctx.font = '18px monospace';
    ctx.fillStyle = '#fff';
    const lines = [
        '← → : Aim your shot',
        'SPACE (hold): Charge power',
        'SPACE (release): Hit the ball',
        '',
        'Avoid water (+2) and bunkers (slow down)',
        `5 Holes | Par: 3, 3, 4, 5, 5`
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H / 2 + i * 28);
    });
    
    // Start prompt
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = '#ff0';
    ctx.fillText('Press SPACE to Start', W / 2, H - 60);
    ctx.globalAlpha = 1;
    
    ctx.textAlign = 'left';
}

function drawGameOver() {
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#2d8a2d');
    grad.addColorStop(1, '#1a2a6c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ROUND COMPLETE!', W / 2, H / 3);
    
    // Score
    let totalPar = holes.reduce((s, h) => s + h.par, 0);
    const diff = score - totalPar;
    let scoreText = '';
    if (diff <= -5) scoreText = 'EAGLE! 🏆';
    else if (diff < 0) scoreText = 'Under Par! Great game!';
    else if (diff === 0) scoreText = 'Even Par! Solid round!';
    else if (diff <= 3) scoreText = 'Over par, but not bad!';
    else scoreText = 'Tough one! Keep practicing!';
    
    ctx.font = '28px monospace';
    ctx.fillText(`Total Score: ${score}`, W / 2, H / 2 - 20);
    ctx.fillText(`Par: ${totalPar} | Diff: ${diff >= 0 ? '+' : ''}${diff}`, W / 2, H / 2 + 20);
    
    ctx.font = '24px monospace';
    ctx.fillStyle = '#ffdd44';
    ctx.fillText(scoreText, W / 2, H / 2 + 70);
    
    const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Press SPACE to Play Again', W / 2, H - 60);
    ctx.globalAlpha = 1;
    
    ctx.textAlign = 'left';
}

requestAnimationFrame(render);
</script>
</body>
</html>
