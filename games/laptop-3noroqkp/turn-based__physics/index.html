<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Tag</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type = 'sine', vol = 0.3) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function playHit() { playSound(200, 0.15, 'square', 0.4); playSound(80, 0.2, 'sawtooth', 0.3); }
function playFire() { playSound(400, 0.1, 'sine', 0.2); }
function playFall() { playSound(150, 0.5, 'triangle', 0.3); }
function playWin() { for (let i = 0; i < 5; i++) setTimeout(() => playSound(400 + i * 100, 0.3, 'sine', 0.2), i * 100); }

// Game State
const GRAVITY = 0.5;
const FRICTION = 0.98;
const BOUNCE = 0.7;
const MAX_POWER = 25;
const KNOCKBACK_DMG = 5;
const FALL_DMG = 15;

let state = 'start'; // start, playing, gameover
let turn = 0; // 0 or 1
let players = [];
let particles = [];
let aiming = false;
let aimStart = null;
let simTimer = 0;
let simActive = false;
let winner = -1;
let roundNum = 1;

class Player {
    constructor(x, y, r, color, name) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.r = r;
        this.color = color;
        this.name = name;
        this.hp = 100;
        this.maxHp = 100;
        this.alive = true;
    }
}

function initGame() {
    players = [
        new Player(W * 0.25, H * 0.7, 28, '#ff4466', 'RED'),
        new Player(W * 0.75, H * 0.7, 28, '#44aaff', 'BLUE')
    ];
    particles = [];
    turn = 0;
    simActive = false;
    simTimer = 0;
    winner = -1;
    roundNum = 1;
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3,
            life: 1,
            color,
            size: 3 + Math.random() * 4
        });
    }
}

function applyForce(playerIdx, fx, fy) {
    const p = players[playerIdx];
    p.vx += fx;
    p.vy += fy;
    playFire();
    simActive = true;
    simTimer = 0;
}

function physicsStep() {
    for (let i = 0; i < 2; i++) {
        const p = players[i];
        if (!p.alive) continue;
        p.vy += GRAVITY;
        p.vx *= FRICTION;
        p.x += p.vx;
        p.y += p.vy;

        // Floor
        if (p.y + p.r > H - 20) {
            p.y = H - 20 - p.r;
            p.vy *= -BOUNCE;
            if (Math.abs(p.vy) < 1) p.vy = 0;
        }
        // Ceiling
        if (p.y - p.r < 0) {
            p.y = p.r;
            p.vy *= -BOUNCE;
        }
        // Left wall
        if (p.x - p.r < 0) {
            p.x = p.r;
            p.vx *= -BOUNCE;
        }
        // Right wall
        if (p.x + p.r > W) {
            p.x = W - p.r;
            p.vx *= -BOUNCE;
        }
    }

    // Player-player collision
    const a = players[0], b = players[1];
    if (a.alive && b.alive) {
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = a.r + b.r;
        if (dist < minDist) {
            const nx = dx / dist, ny = dy / dist;
            const overlap = minDist - dist;
            a.x -= nx * overlap * 0.5;
            a.y -= ny * overlap * 0.5;
            b.x += nx * overlap * 0.5;
            b.y += ny * overlap * 0.5;

            const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
            const dvDotN = dvx * nx + dvy * ny;
            if (dvDotN > 0) {
                const impulse = dvDotN * 1.2;
                a.vx -= impulse * nx;
                a.vy -= impulse * ny;
                b.vx += impulse * nx;
                b.vy += impulse * ny;

                // Damage on hit
                const dmg = Math.min(KNOCKBACK_DMG, Math.round(Math.abs(impulse) * 2));
                if (dmg > 0) {
                    players[1 - turn].hp -= dmg;
                    spawnParticles((a.x + b.x) / 2, (a.y + b.y) / 2, '#ffff44', 8);
                    playHit();
                }

                if (players[1 - turn].hp <= 0) {
                    players[1 - turn].hp = 0;
                    players[1 - turn].alive = false;
                    winner = turn;
                    playWin();
                    spawnParticles(players[1 - turn].x, players[1 - turn].y, players[1 - turn].color, 30);
                }
            }
        }
    }

    // Check if fallen off (below screen)
    for (let i = 0; i < 2; i++) {
        const p = players[i];
        if (p.alive && p.y > H + 100) {
            p.hp -= FALL_DMG;
            spawnParticles(p.x, H - 30, p.color, 15);
            playFall();
            // Respawn at original position
            p.x = i === 0 ? W * 0.25 : W * 0.75;
            p.y = H * 0.7;
            p.vx = 0; p.vy = 0;
            if (p.hp <= 0) {
                p.hp = 0;
                p.alive = false;
                winner = 1 - i;
                playWin();
            }
        }
    }
}

function isSettled() {
    for (let i = 0; i < 2; i++) {
        const p = players[i];
        if (!p.alive) continue;
        if (Math.abs(p.vx) > 0.5 || Math.abs(p.vy) > 0.5) return false;
    }
    return true;
}

function update() {
    if (state === 'playing' && simActive) {
        physicsStep();
        simTimer++;
        if (isSettled() || simTimer > 120) {
            simActive = false;
            turn = 1 - turn;
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.3;
        pt.life -= 0.02;
        if (pt.life <= 0) particles.splice(i, 1);
    }

    if (winner >= 0 && state === 'playing' && !simActive) {
        setTimeout(() => { state = 'gameover'; }, 500);
    }
}

function drawPlatform() {
    // Floor
    const floorGrad = ctx.createLinearGradient(0, H - 20, 0, H);
    floorGrad.addColorStop(0, '#3a3a5c');
    floorGrad.addColorStop(1, '#2a2a4c');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, H - 20, W, 20);

    // Floor line
    ctx.strokeStyle = '#5a5a8c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H - 20);
    ctx.lineTo(W, H - 20);
    ctx.stroke();

    // Walls glow
    ctx.fillStyle = 'rgba(100, 100, 255, 0.1)';
    ctx.fillRect(0, 0, 4, H);
    ctx.fillRect(W - 4, 0, 4, H);
}

function drawPlayer(p) {
    if (!p.alive) return;
    ctx.save();
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(p.x, H - 15, p.r * 0.7, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const grad = ctx.createRadialGradient(p.x - 5, p.y - 5, 0, p.x, p.y, p.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, p.color);
    grad.addColorStop(1, p.color + '88');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    // Face
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x - 7, p.y - 5, 4, 0, Math.PI * 2);
    ctx.arc(p.x + 7, p.y - 5, 4, 0, Math.PI * 2);
    ctx.fill();

    // Mouth (determined by HP)
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (p.hp > 50) {
        ctx.arc(p.x, p.y + 5, 6, 0, Math.PI * 0.8);
    } else if (p.hp > 20) {
        ctx.moveTo(p.x - 5, p.y + 7);
        ctx.lineTo(p.x + 5, p.y + 7);
    } else {
        ctx.arc(p.x, p.y + 12, 6, Math.PI * 0.2, Math.PI * 0.8);
    }
    ctx.stroke();

    // Active player glow
    if (!simActive && turn === players.indexOf(p) && state === 'playing') {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.005) * 0.3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
    ctx.restore();
}

function drawHP() {
    for (let i = 0; i < 2; i++) {
        const p = players[i];
        const barW = 150, barH = 20;
        const x = i === 0 ? 30 : W - 30 - barW;
        const y = 20;

        ctx.fillStyle = '#333';
        ctx.fillRect(x, y, barW, barH);
        const hpRatio = p.hp / p.maxHp;
        const hpColor = hpRatio > 0.5 ? '#4f4' : hpRatio > 0.25 ? '#ff4' : '#f44';
        ctx.fillStyle = hpColor;
        ctx.fillRect(x, y, barW * hpRatio, barH);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, barW, barH);

        ctx.fillStyle = p.color;
        ctx.font = 'bold 14px Segoe UI';
        ctx.textAlign = i === 0 ? 'left' : 'right';
        ctx.fillText(p.name, i === 0 ? x : x + barW, y - 8);
        ctx.fillStyle = '#fff';
        ctx.font = '12px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(Math.round(p.hp) + '%', x + barW / 2, y + 14);
    }
}

function drawAim() {
    if (!aiming || simActive || state !== 'playing') return;
    const p = players[turn];
    const dx = aimStart.x - mouse.x;
    const dy = aimStart.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const power = Math.min(dist / 10, MAX_POWER);

    // Draw aim line
    ctx.strokeStyle = players[turn].color;
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    const angle = Math.atan2(dy, dx);
    ctx.lineTo(p.x + Math.cos(angle) * 60, p.y + Math.sin(angle) * 60);
    ctx.stroke();
    ctx.setLineDash([]);

    // Power indicator
    ctx.fillStyle = players[turn].color;
    ctx.font = 'bold 16px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(Math.round(power / MAX_POWER * 100) + '%', p.x, p.y - p.r - 20);

    // Arrow
    const ax = p.x + Math.cos(angle) * 60;
    const ay = p.y + Math.sin(angle) * 60;
    ctx.beginPath();
    ctx.arc(ax, ay, 5, 0, Math.PI * 2);
    ctx.fill();
}

function drawParticles() {
    for (const pt of particles) {
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawTurnIndicator() {
    if (state !== 'playing') return;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Segoe UI';
    ctx.textAlign = 'center';
    const text = simActive ? '...' : players[turn].name + '\'s Turn - Drag to Aim & Fire!';
    ctx.fillText(text, W / 2, H - 40);
}

function drawStartScreen() {
    // Background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1a1a2e');
    bg.addColorStop(1, '#16213e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 64px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('⚡ Physics Tag ⚡', W / 2, H * 0.3);

    ctx.font = '20px Segoe UI';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Knock your opponent off the platform!', W / 2, H * 0.42);

    ctx.font = '16px Segoe UI';
    ctx.fillStyle = '#888';
    ctx.fillText('Click and drag from your character to aim', W / 2, H * 0.52);
    ctx.fillText('Release to fire a force push', W / 2, H * 0.56);
    ctx.fillText('Hitting the enemy deals damage', W / 2, H * 0.60);
    ctx.fillText('Falling off the platform costs HP!', W / 2, H * 0.64);

    // Start button
    const btnW = 200, btnH = 50;
    const bx = W / 2 - btnW / 2, by = H * 0.72;
    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    ctx.roundRect(bx, by, btnW, btnH, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Segoe UI';
    ctx.fillText('START GAME', W / 2, by + 32);

    // Decorative circles
    const t = Date.now() * 0.001;
    for (let i = 0; i < 8; i++) {
        const x = W / 2 + Math.cos(t + i * 0.78) * 200;
        const y = H / 2 + Math.sin(t + i * 0.78) * 150;
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = i % 2 === 0 ? '#ff4466' : '#44aaff';
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    const wp = players[winner];
    ctx.fillStyle = wp.color;
    ctx.font = 'bold 56px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(wp.name + ' WINS!', W / 2, H * 0.35);

    ctx.fillStyle = '#fff';
    ctx.font = '24px Segoe UI';
    ctx.fillText('🏆', W / 2, H * 0.45);

    // Restart button
    const btnW = 220, btnH = 50;
    const bx = W / 2 - btnW / 2, by = H * 0.55;
    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    ctx.roundRect(bx, by, btnW, btnH, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Segoe UI';
    ctx.fillText('PLAY AGAIN', W / 2, by + 32);
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    if (state === 'start') {
        drawStartScreen();
        return;
    }

    // Background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1a1a2e');
    bg.addColorStop(1, '#16213e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawPlatform();
    for (const p of players) drawPlayer(p);
    drawParticles();
    drawHP();
    drawAim();
    drawTurnIndicator();

    if (state === 'gameover') {
        drawGameOver();
    }
}

let mouse = { x: 0, y: 0 };

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

    if (state === 'start') {
        // Check start button
        const btnW = 200, btnH = 50;
        const bx = W / 2 - btnW / 2, by = H * 0.72;
        if (mouse.x > bx && mouse.x < bx + btnW && mouse.y > by && mouse.y < by + btnH) {
            state = 'playing';
            initGame();
        }
    } else if (state === 'gameover') {
        const btnW = 220, btnH = 50;
        const bx = W / 2 - btnW / 2, by = H * 0.55;
        if (mouse.x > bx && mouse.x < bx + btnW && mouse.y > by && mouse.y < by + btnH) {
            state = 'playing';
            initGame();
        }
    } else if (state === 'playing' && !simActive) {
        const p = players[turn];
        const dist = Math.sqrt((mouse.x - p.x) ** 2 + (mouse.y - p.y) ** 2);
        if (dist < p.r * 3) {
            aiming = true;
            aimStart = { x: mouse.x, y: mouse.y };
        }
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mouseup', (e) => {
    if (aiming && state === 'playing' && !simActive) {
        const p = players[turn];
        const dx = aimStart.x - mouse.x;
        const dy = aimStart.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 10) {
            const power = Math.min(dist / 10, MAX_POWER);
            const angle = Math.atan2(dy, dx);
            applyForce(turn, Math.cos(angle) * power, Math.sin(angle) * power);
        }
    }
    aiming = false;
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
});
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
});
canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    canvas.dispatchEvent(new MouseEvent('mouseup', { clientX: mouse.x, clientY: mouse.y }));
});

// Keyboard restart
window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') {
        if (state === 'gameover' || state === 'playing') {
            state = 'playing';
            initGame();
        }
    }
    if (e.key === 'Enter' && state === 'start') {
        initAudio();
        state = 'playing';
        initGame();
    }
});

// Main loop
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

initGame();
state = 'start';
gameLoop();
</script>
</body>
</html>
