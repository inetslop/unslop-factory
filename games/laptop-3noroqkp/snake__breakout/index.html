<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, duration, type, volume) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Game state
const STATE = { MENU: 0, PLAYING: 1, BALL_HELD: 2, GAME_OVER: 3, WIN: 4 };
let gameState = STATE.MENU;
let score = 0;
let lives = 3;
let level = 1;

// Snake
const SNAKE_SPEED = 5;
const SEGMENT_SPACING = 18;
let snakeHead = { x: 0, y: 0 };
let snakePath = [];
let snakeSegments = [];
let snakeMaxSegments = 12;

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };
const BALL_SPEED = 6;

// Bricks
let bricks = [];
const BRICK_COLS = 8;
const BRICK_ROWS = 4;
let brickW, brickH, brickOffX, brickOffY;

function initBricks() {
    bricks = [];
    brickW = Math.min(70, (W - 60) / BRICK_COLS);
    brickH = 28;
    brickOffX = (W - BRICK_COLS * (brickW + 4)) / 2;
    brickOffY = 60;
    for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
            bricks.push({ x: brickOffX + c * (brickW + 4), y: brickOffY + r * (brickH + 4), w: brickW, h: brickH, alive: true, hp: level >= 2 ? 2 : 1 });
        }
    }
}

function resetSnake() {
    snakeHead = { x: W / 2, y: H - 50 };
    snakePath = [];
    for (let i = 0; i < snakeMaxSegments; i++) {
        snakePath.push({ x: W / 2 - i * SEGMENT_SPACING, y: H - 50 });
    }
}

function resetBall() {
    ball.x = W / 2;
    ball.y = H - 100;
    ball.vx = 0;
    ball.vy = 0;
}

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    initBricks();
    resetSnake();
    resetBall();
    gameState = STATE.BALL_HELD;
}

function nextLevel() {
    level++;
    initBricks();
    resetBall();
    snakeMaxSegments += 3;
    gameState = STATE.BALL_HELD;
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (gameState === STATE.MENU && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if (gameState === STATE.BALL_HELD && e.code === 'Space') {
        gameState = STATE.PLAYING;
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * BALL_SPEED * 0.6;
        ball.vy = -BALL_SPEED;
        playSound(440, 0.1, 'square', 0.08);
    } else if ((gameState === STATE.GAME_OVER || gameState === STATE.WIN) && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
    } else if (e.code === 'KeyR' && (gameState === STATE.PLAYING || gameState === STATE.BALL_HELD)) {
        startGame();
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Particles
let particles = [];
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 30 + Math.random() * 20, color });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Brick colors
function brickColor(row, hp) {
    const colors = ['#ff4466', '#ff8844', '#ffcc44', '#44ff88'];
    if (hp > 1) return colors[3];
    return colors[row % colors.length];
}

function update() {
    if (gameState !== STATE.PLAYING && gameState !== STATE.BALL_HELD) return;

    // Snake movement
    const dx = (keys['ArrowRight'] || keys['KeyD'] ? SNAKE_SPEED : 0) - (keys['ArrowLeft'] || keys['KeyA'] ? SNAKE_SPEED : 0);
    snakeHead.x += dx;
    snakeHead.x = Math.max(20, Math.min(W - 20, snakeHead.x));

    // Update path
    snakePath.unshift({ x: snakeHead.x, y: H - 50 });
    if (snakePath.length > snakeMaxSegments + 1) {
        snakePath.pop();
    }

    // Build segments from path
    snakeSegments = [];
    for (let i = 0; i < snakeMaxSegments; i++) {
        const idx = Math.min(i, snakePath.length - 1);
        snakeSegments.push(snakePath[idx] || { x: W / 2 - i * SEGMENT_SPACING, y: H - 50 });
    }

    if (gameState === STATE.BALL_HELD) {
        ball.x = snakeHead.x;
        ball.y = H - 70;
        return;
    }

    // Ball physics
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall bounce
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); playSound(200, 0.05, 'square', 0.05); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); playSound(200, 0.05, 'square', 0.05); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); playSound(200, 0.05, 'square', 0.05); }

    // Snake collision (paddle)
    const snakeY = H - 50;
    if (ball.vy > 0 && ball.y + ball.r >= snakeY - 15 && ball.y + ball.r <= snakeY + 15) {
        // Check if ball is within snake body range
        let hit = false;
        for (let i = 0; i < Math.min(4, snakeSegments.length); i++) {
            const seg = snakeSegments[i];
            if (Math.abs(ball.x - seg.x) < 25 && Math.abs(ball.y - seg.y) < 25) {
                hit = true;
                break;
            }
        }
        if (hit) {
            ball.vy = -Math.abs(ball.vy);
            const relX = (ball.x - snakeHead.x) / 30;
            ball.vx = relX * BALL_SPEED;
            // Keep speed constant
            const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            if (speed > BALL_SPEED * 1.5) {
                ball.vx = (ball.vx / speed) * BALL_SPEED * 1.2;
                ball.vy = -Math.abs((ball.vy / speed) * BALL_SPEED * 1.2);
            }
            playSound(330, 0.08, 'square', 0.08);
        }
    }

    // Ball falls off screen
    if (ball.y + ball.r > H) {
        lives--;
        playSound(150, 0.4, 'sawtooth', 0.12);
        if (lives <= 0) {
            gameState = STATE.GAME_OVER;
        } else {
            resetBall();
            gameState = STATE.BALL_HELD;
        }
    }

    // Brick collision
    for (let i = 0; i < bricks.length; i++) {
        const b = bricks[i];
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {

            b.hp--;
            if (b.hp <= 0) {
                b.alive = false;
                score += (BRICK_ROWS - Math.floor((b.y - brickOffY) / (brickH + 4))) * 10;
                spawnParticles(ball.x, ball.y, brickColor(Math.floor((b.y - brickOffY) / (brickH + 4)), b.hp), 8);
                playSound(600 + Math.random() * 200, 0.15, 'square', 0.1);
            } else {
                playSound(300, 0.05, 'square', 0.05);
            }

            // Bounce direction
            const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
            const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
            if (overlapX < overlapY) {
                ball.vx = -ball.vx;
            } else {
                ball.vy = -ball.vy;
            }

            // Grow snake
            if (b.hp <= 0 && snakeMaxSegments < 30) {
                snakeMaxSegments++;
            }

            break;
        }
    }

    // Check win
    if (bricks.every(b => !b.alive)) {
        gameState = STATE.WIN;
        playSound(880, 0.5, 'sine', 0.12);
        setTimeout(() => playSound(660, 0.3, 'sine', 0.1), 200);
    }

    updateParticles();
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    // Stars background
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 50; i++) {
        const sx = (i * 137 + 43) % W;
        const sy = (i * 97 + 13) % H;
        ctx.fillRect(sx, sy, 1.5, 1.5);
    }

    if (gameState === STATE.MENU) {
        drawMenu();
        return;
    }

    // Bricks
    for (const b of bricks) {
        if (!b.alive) continue;
        const row = Math.floor((b.y - brickOffY) / (brickH + 4));
        ctx.fillStyle = brickColor(row, b.hp);
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        if (b.hp > 1) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('2', b.x + b.w / 2, b.y + b.h / 2 + 4);
        }
    }

    // Snake
    for (let i = snakeSegments.length - 1; i >= 0; i--) {
        const seg = snakeSegments[i];
        const t = i / snakeSegments.length;
        const size = Math.max(8, 20 - t * 10);
        const g = Math.floor(180 - t * 80);
        ctx.fillStyle = `rgb(${i === 0 ? 50 : 30}, ${g}, ${i === 0 ? 80 : 50})`;
        ctx.beginPath();
        ctx.arc(seg.x, seg.y, size / 2, 0, Math.PI * 2);
        ctx.fill();
        if (i === 0) {
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(seg.x - 4, seg.y - 3, 3, 0, Math.PI * 2);
            ctx.arc(seg.x + 4, seg.y - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(seg.x - 4, seg.y - 3, 1.5, 0, Math.PI * 2);
            ctx.arc(seg.x + 4, seg.y - 3, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Ball
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#ff6644';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${level}`, W / 2, 35);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVES: ${'❤'.repeat(lives)}`, W - 20, 35);

    if (gameState === STATE.BALL_HELD) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#888';
        ctx.font = '14px monospace';
        ctx.fillText('Press SPACE to launch', W / 2, H - 100);
    }

    if (gameState === STATE.GAME_OVER || gameState === STATE.WIN) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px monospace';
        if (gameState === STATE.WIN) {
            ctx.fillText('LEVEL CLEAR!', W / 2, H / 2 - 30);
            ctx.font = '24px monospace';
            ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 15);
            ctx.font = '16px monospace';
            ctx.fillStyle = '#8f8';
            ctx.fillText('Press SPACE for next level', W / 2, H / 2 + 60);
        } else {
            ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
            ctx.font = '24px monospace';
            ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 15);
            ctx.font = '16px monospace';
            ctx.fillStyle = '#f88';
            ctx.fillText('Press SPACE to restart', W / 2, H / 2 + 60);
        }
    }

    updateParticles();
}

function drawMenu() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4f8';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('BREAKOUT SNAKE', W / 2, H / 2 - 100);

    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    ctx.fillText('A snake is your paddle. Break the bricks!', W / 2, H / 2 - 40);

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('← → or A/D : Move snake', W / 2, H / 2 + 10);
    ctx.fillText('SPACE : Launch ball', W / 2, H / 2 + 40);
    ctx.fillText('R : Restart', W / 2, H / 2 + 70);

    ctx.fillStyle = '#8f8';
    ctx.font = '14px monospace';
    ctx.fillText('The snake grows as you break bricks!', W / 2, H / 2 + 110);

    // Animated snake on menu
    const t = Date.now() / 500;
    for (let i = 0; i < 8; i++) {
        const sx = W / 2 - 60 + Math.sin(t + i * 0.4) * 15;
        const sy = H / 2 + 170 + Math.cos(t + i * 0.3) * 5;
        const size = Math.max(6, 16 - i * 1.5);
        ctx.fillStyle = `rgb(50, ${180 - i * 15}, 80)`;
        ctx.beginPath();
        ctx.arc(sx, sy, size / 2, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    const blink = Math.sin(Date.now() / 400) > 0;
    if (blink) {
        ctx.fillText('Press SPACE to Start', W / 2, H / 2 + 230);
    }
}

// Win handling - space goes to next level
window.addEventListener('keydown', (e) => {
    if (gameState === STATE.WIN && e.code === 'Space') {
        nextLevel();
    }
});

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initBricks();
resetSnake();
resetBall();
loop();
</script>
</body>
</html>
