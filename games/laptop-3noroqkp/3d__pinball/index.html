<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let ballsLeft = 3;
let plungerX = 0;
let plungerPower = 0;
let tiltL = 0;
let tiltR = 0;
let ballLaunched = false;

// Ball
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 12 };

// Table bounds (in table space)
const TABLE = { left: -200, right: 200, top: -350, bottom: 250 };

// Bumpers
let bumpers = [];
function initBumpers() {
    bumpers = [
        { x: -100, y: -250, r: 35, hit: 0 },
        { x: 100, y: -250, r: 35, hit: 0 },
        { x: 0, y: -180, r: 35, hit: 0 }
    ];
}

// Walls (line segments)
let walls = [];
function initWalls() {
    walls = [
        { x1: TABLE.left, y1: TABLE.top, x2: TABLE.right, y2: TABLE.top },
        { x1: TABLE.left, y1: TABLE.top, x2: TABLE.left, y2: TABLE.bottom - 50 },
        { x1: TABLE.right, y1: TABLE.top, x2: TABLE.right, y2: TABLE.bottom - 50 },
        // Bottom left corner
        { x1: TABLE.left, y1: TABLE.bottom - 50, x2: TABLE.left + 30, y2: TABLE.bottom },
        // Bottom right corner
        { x1: TABLE.right, y1: TABLE.bottom - 50, x2: TABLE.right - 30, y2: TABLE.bottom },
        // Slanted walls guiding ball
        { x1: TABLE.left + 30, y1: TABLE.bottom, x2: TABLE.left + 80, y2: TABLE.bottom - 40 },
        { x1: TABLE.right - 30, y1: TABLE.bottom, x2: TABLE.right - 80, y2: TABLE.bottom - 40 },
    ];
}

// Particles
let particles = [];

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: color || '#fff'
        });
    }
}

function resetBall() {
    ball.x = plungerX;
    ball.y = TABLE.bottom - 20;
    ball.vx = 0;
    ball.vy = 0;
    ballLaunched = false;
}

function startGame() {
    score = 0;
    ballsLeft = 3;
    plungerX = 0;
    plungerPower = 0;
    tiltL = 0;
    tiltR = 0;
    initBumpers();
    initWalls();
    resetBall();
    state = 'playing';
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (state === 'start' && e.code === 'Enter') {
        initAudio();
        startGame();
    }
    if (state === 'gameover' && e.code === 'KeyR') {
        startGame();
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Physics
const GRAVITY = 0.15;
const FRICTION = 0.998;
const BOUNCE = 0.75;
const BUMPER_FORCE = 8;

function update() {
    if (state !== 'playing') return;

    // Plunger control
    if (keys['ArrowLeft']) { plungerX -= 3; }
    if (keys['ArrowRight']) { plungerX += 3; }
    plungerX = Math.max(-120, Math.min(120, plungerX));

    if (!ballLaunched) {
        ball.x = plungerX;
        ball.y = TABLE.bottom - 20;
        if (keys['Space']) {
            plungerPower += 0.5;
            if (plungerPower > 15) {
                plungerPower = 0;
            }
        } else {
            plungerPower = Math.max(0, plungerPower - 2);
        }
    }

    // Tilt
    if (keys['ArrowLeft']) tiltL += 0.15;
    else tiltL = Math.max(0, tiltL - 0.05);
    if (keys['ArrowRight']) tiltR += 0.15;
    else tiltR = Math.max(0, tiltR - 0.05);

    // Launch
    if (!ballLaunched && keys['Space'] && plungerPower >= 15) {
        ball.vy = -(12 + Math.random() * 3);
        ball.vx = (Math.random() - 0.5) * 4;
        ballLaunched = true;
        playSound(200, 0.2, 'square', 0.2);
    }

    if (!ballLaunched) return;

    // Gravity
    ball.vy += GRAVITY;
    // Tilt effect
    ball.vx -= tiltL * 0.3;
    ball.vx += tiltR * 0.3;
    // Friction
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Ball radius for physics
    const br = ball.r;

    // Wall collisions
    for (let w of walls) {
        if (collideWall(w, br)) {
            playSound(300 + Math.random() * 200, 0.1, 'triangle', 0.15);
        }
    }

    // Bumper collisions
    for (let b of bumpers) {
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = br + b.r;
        if (dist < minDist) {
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x = b.x + nx * minDist;
            ball.y = b.y + ny * minDist;
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx += (1 + BOUNCE) * -dot * nx * 2;
            ball.vy += (1 + BOUNCE) * -dot * ny * 2;
            // Extra bounce from bumper
            ball.vx += nx * BUMPER_FORCE;
            ball.vy += ny * BUMPER_FORCE;
            b.hit = 1;
            score += 50;
            spawnParticles(ball.x, ball.y, '#ff6600', 8);
            playSound(400 + Math.random() * 300, 0.15, 'square', 0.25);
        }
    }

    // Bumper hit decay
    for (let b of bumpers) {
        if (b.hit > 0) b.hit -= 0.05;
    }

    // Ball lost
    if (ball.y > TABLE.bottom + 30) {
        ballsLeft--;
        ballLaunched = false;
        plungerPower = 0;
        playSound(100, 0.5, 'sawtooth', 0.3);
        if (ballsLeft <= 0) {
            state = 'gameover';
        } else {
            resetBall();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= 0.02;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function collideWall(w, r) {
    const dx = w.x2 - w.x1;
    const dy = w.y2 - w.y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len === 0) return false;
    const nx = -dy / len;
    const ny = dx / len;

    // Point on line closest to ball
    const px = ball.x - w.x1;
    const py = ball.y - w.y1;
    let t = px * (dx / len) + py * (dy / len);
    t = Math.max(0, Math.min(len, t));

    const cx = w.x1 + (dx / len) * t;
    const cy = w.y1 + (dy / len) * t;

    const ex = ball.x - cx;
    const ey = ball.y - cy;
    const dist = Math.sqrt(ex * ex + ey * ey);

    if (dist < r) {
        const nnx = ex / dist;
        const nny = ey / dist;
        ball.x = cx + nnx * r;
        ball.y = cy + nny * r;
        const dot = ball.vx * nnx + ball.vy * nny;
        if (dot < 0) {
            ball.vx -= 2 * dot * nnx * BOUNCE;
            ball.vy -= 2 * dot * nny * BOUNCE;
        }
        return true;
    }
    return false;
}

// Rendering with 3D perspective
function tableToScreen(tx, ty) {
    // Perspective: objects further up (negative y) appear smaller and shifted
    const perspY = ty / TABLE.bottom;
    const scale = 1 - Math.max(0, -ty) * 0.0008;
    const cx = W / 2;
    const cy = H / 2 + 40;
    const sx = cx + tx * scale;
    const sy = cy + ty * (0.9 + perspY * 0.1);
    return { x: sx, y: sy, scale };
}

function render() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);

    if (state === 'start') {
        renderStartScreen();
        return;
    }

    // Draw table surface with 3D effect
    drawTable();
    drawWalls();
    drawBumpers();
    drawBall();
    drawParticles();
    drawHUD();

    if (state === 'gameover') {
        renderGameOver();
    }
}

function drawTable() {
    const tl = tableToScreen(TABLE.left, TABLE.top);
    const tr = tableToScreen(TABLE.right, TABLE.top);
    const bl = tableToScreen(TABLE.left, TABLE.bottom);
    const br = tableToScreen(TABLE.right, TABLE.bottom);

    // Table surface gradient
    const grad = ctx.createLinearGradient(0, tl.y, 0, bl.y);
    grad.addColorStop(0, '#1a1a3a');
    grad.addColorStop(0.5, '#2a2a4a');
    grad.addColorStop(1, '#1a1a2a');

    ctx.beginPath();
    ctx.moveTo(tl.x, tl.y);
    ctx.lineTo(tr.x, tr.y);
    ctx.lineTo(br.x, br.y);
    ctx.lineTo(bl.x, bl.y);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Grid lines for 3D depth
    ctx.strokeStyle = 'rgba(80, 80, 140, 0.15)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 20; i++) {
        const yy = TABLE.top + (TABLE.bottom - TABLE.top) * (i / 20);
        const p1 = tableToScreen(TABLE.left, yy);
        const p2 = tableToScreen(TABLE.right, yy);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
    }
    for (let i = 0; i < 15; i++) {
        const xx = TABLE.left + (TABLE.right - TABLE.left) * (i / 15);
        const p1 = tableToScreen(xx, TABLE.top);
        const p2 = tableToScreen(xx, TABLE.bottom);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
    }

    // Table border glow
    ctx.strokeStyle = 'rgba(0, 200, 255, 0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(tl.x, tl.y);
    ctx.lineTo(tr.x, tr.y);
    ctx.lineTo(br.x, br.y);
    ctx.lineTo(bl.x, bl.y);
    ctx.closePath();
    ctx.stroke();
}

function drawWalls() {
    for (let w of walls) {
        const p1 = tableToScreen(w.x1, w.y1);
        const p2 = tableToScreen(w.x2, w.y2);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = 'rgba(150, 200, 255, 0.6)';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Glow
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = 'rgba(0, 150, 255, 0.2)';
        ctx.lineWidth = 8;
        ctx.stroke();
    }
}

function drawBumpers() {
    for (let b of bumpers) {
        const p = tableToScreen(b.x, b.y);
        const r = b.r * p.scale;

        // Shadow
        ctx.beginPath();
        ctx.ellipse(p.x + 3, p.y + 5, r * 1.1, r * 0.7, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fill();

        // Bumper base (3D dome)
        const baseGrad = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, 0, p.x, p.y, r);
        baseGrad.addColorStop(0, b.hit > 0 ? '#ff8844' : '#cc3333');
        baseGrad.addColorStop(0.7, b.hit > 0 ? '#ff6622' : '#991111');
        baseGrad.addColorStop(1, '#551111');
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = baseGrad;
        ctx.fill();

        // Inner ring
        const innerR = r * 0.6;
        const innerGrad = ctx.createRadialGradient(p.x - innerR * 0.3, p.y - innerR * 0.3, 0, p.x, p.y, innerR);
        innerGrad.addColorStop(0, '#ffcc44');
        innerGrad.addColorStop(1, '#cc6600');
        ctx.beginPath();
        ctx.arc(p.x, p.y, innerR, 0, Math.PI * 2);
        ctx.fillStyle = innerGrad;
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.arc(p.x - r * 0.25, p.y - r * 0.25, r * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fill();

        // Hit flash
        if (b.hit > 0) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, r * (1 + b.hit * 0.2), 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 200, 0, ${b.hit})`;
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    }
}

function drawBall() {
    const p = tableToScreen(ball.x, ball.y);
    const r = ball.r * p.scale;

    // Shadow
    ctx.beginPath();
    ctx.ellipse(p.x + 2, p.y + 4, r * 1.05, r * 0.6, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fill();

    // Ball (metallic sphere)
    const ballGrad = ctx.createRadialGradient(p.x - r * 0.3, p.y - r * 0.3, 0, p.x, p.y, r);
    ballGrad.addColorStop(0, '#ffffff');
    ballGrad.addColorStop(0.2, '#e0e8ff');
    ballGrad.addColorStop(0.5, '#a0b0d0');
    ballGrad.addColorStop(0.8, '#607090');
    ballGrad.addColorStop(1, '#304060');
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = ballGrad;
    ctx.fill();

    // Specular highlight
    const specGrad = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.35, 0, p.x - r * 0.35, p.y - r * 0.35, r * 0.4);
    specGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
    specGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(p.x - r * 0.35, p.y - r * 0.35, r * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = specGrad;
    ctx.fill();

    // Plunger indicator
    if (!ballLaunched) {
        const pp = tableToScreen(plungerX, TABLE.bottom - 20);
        ctx.beginPath();
        ctx.arc(pp.x, pp.y + 15, 8, 0, Math.PI * 2);
        ctx.fillStyle = plungerPower > 10 ? '#ff4444' : '#44ff44';
        ctx.fill();

        // Power bar
        const barW = 60;
        const barH = 8;
        const bx = pp.x - barW / 2;
        const by = pp.y + 30;
        ctx.fillStyle = '#333';
        ctx.fillRect(bx, by, barW, barH);
        ctx.fillStyle = plungerPower > 10 ? '#ff4444' : '#44ff88';
        ctx.fillRect(bx, by, barW * (plungerPower / 15), barH);
    }
}

function drawParticles() {
    for (let p of particles) {
        const sp = tableToScreen(p.x, p.y);
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 150, 0, ${p.life})`;
        ctx.fill();
    }
}

function drawHUD() {
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = '#00e5ff';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 35);
    ctx.fillText(`BALLS: ${ballsLeft}`, 20, 65);

    // Tilt indicators
    if (tiltL > 0 || tiltR > 0) {
        const maxT = Math.max(tiltL, tiltR);
        const warning = maxT > 1 ? '#ff4444' : '#ffaa00';
        ctx.font = '18px monospace';
        if (tiltL > 0.5) {
            ctx.fillStyle = warning;
            ctx.fillText(`⚠ LEFT TILT: ${Math.floor(tiltL)}`, W - 200, 35);
        }
        if (tiltR > 0.5) {
            ctx.fillStyle = warning;
            ctx.textAlign = 'right';
            ctx.fillText(`RIGHT TILT: ${Math.floor(tiltR)} ⚠`, W - 20, 35);
            ctx.textAlign = 'left';
        }
    }

    // Controls hint
    ctx.font = '14px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('← → : Tilt/Move  |  SPACE: Launch', 20, H - 20);
}

function renderStartScreen() {
    // Background effect
    const t = Date.now() * 0.001;
    for (let i = 0; i < 5; i++) {
        const x = W / 2 + Math.sin(t + i) * 100;
        const y = H / 2 + Math.cos(t * 0.7 + i * 2) * 80;
        ctx.beginPath();
        ctx.arc(x, y, 30 + Math.sin(t + i * 3) * 10, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${100 + i * 20}, ${50 + i * 30}, ${200 - i * 20}, 0.1)`;
        ctx.fill();
    }

    // Title with 3D effect
    const titleX = W / 2;
    const titleY = H / 2 - 60;

    ctx.font = 'bold 72px monospace';
    ctx.textAlign = 'center';

    // Shadow layers for 3D text
    for (let i = 5; i >= 1; i--) {
        ctx.fillStyle = `rgba(0, 100, 200, ${0.1 * i})`;
        ctx.fillText('PINBALL 3D', titleX + i * 2, titleY + i * 2);
    }

    const titleGrad = ctx.createLinearGradient(titleX - 200, titleY - 40, titleX + 200, titleY + 10);
    titleGrad.addColorStop(0, '#00e5ff');
    titleGrad.addColorStop(0.5, '#ffffff');
    titleGrad.addColorStop(1, '#ff6600');
    ctx.fillStyle = titleGrad;
    ctx.fillText('PINBALL 3D', titleX, titleY);

    // Subtitle
    ctx.font = '20px monospace';
    ctx.fillStyle = '#aabbcc';
    ctx.fillText('A 3D Pinball Experience', titleX, titleY + 40);

    // Controls
    ctx.font = '18px monospace';
    ctx.fillStyle = '#8899aa';
    const controls = [
        '← → : Move & Tilt Table',
        'SPACE (hold) : Charge Plunger',
        'SPACE (release) : Launch Ball',
        '',
        'Hit the bumpers to score!',
        'Don\'t tilt too far or lose a ball!'
    ];
    controls.forEach((line, i) => {
        ctx.fillText(line, titleX, titleY + 90 + i * 28);
    });

    // Start prompt
    const pulse = 0.5 + Math.sin(t * 3) * 0.5;
    ctx.font = 'bold 24px monospace';
    ctx.fillStyle = `rgba(0, 229, 255, ${pulse})`;
    ctx.fillText('PRESS ENTER TO START', titleX, H / 2 + 180);
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4444';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);

    ctx.font = '28px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 20);

    ctx.font = '20px monospace';
    const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
    ctx.fillStyle = `rgba(0, 229, 255, ${pulse})`;
    ctx.fillText('Press R to Restart', W / 2, H / 2 + 70);
}

// Tilt penalty
function checkTilt() {
    if (state !== 'playing') return;
    if (tiltL > 5 || tiltR > 5) {
        ballsLeft--;
        tiltL = 0;
        tiltR = 0;
        ballLaunched = false;
        plungerPower = 0;
        playSound(80, 0.4, 'sawtooth', 0.3);
        if (ballsLeft <= 0) {
            state = 'gameover';
        } else {
            resetBall();
        }
    }
}

// Game loop
let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;

    update();
    checkTilt();
    render();

    requestAnimationFrame(gameLoop);
}

initBumpers();
initWalls();
resetBall();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
