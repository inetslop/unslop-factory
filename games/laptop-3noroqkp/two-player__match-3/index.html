<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Duel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
let gameState = 'start'; // start, playing, animating, won
let grid = [];
let selected = null;
let dragging = false;
let dragStart = null;
let scores = [0, 0];
let currentPlayer = 0;
let targetScore = 100;
let particles = [];
let animations = [];
let cascadeCount = 0;
let turnTimer = 0;
let wonPlayer = -1;

const ROWS = 7, COLS = 7;
const NUM_COLORS = 5;
const POINTS_PER_TILE = 10;
const CHAIN_BONUS = 5;

const COLORS = [
    { fill: '#ff6b6b', stroke: '#c0392b' },
    { fill: '#48dbfb', stroke: '#0abde3' },
    { fill: '#feca57', stroke: '#f6b93b' },
    { fill: '#1dd1a1', stroke: '#10ac84' },
    { fill: '#c56cf0', stroke: '#a55eea' }
];

const SHAPES = ['circle', 'diamond', 'square', 'triangle', 'hexagon'];

let tileSize, boardX, boardY;
let audioCtx = null;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    const maxBoard = Math.min(W * 0.85, H * 0.7);
    tileSize = Math.floor(maxBoard / COLS);
    boardX = Math.floor((W - COLS * tileSize) / 2);
    boardY = Math.floor(H * 0.18);
}
window.addEventListener('resize', resize);
resize();

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'swap') {
        osc.frequency.value = 400;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'match') {
        osc.frequency.value = 600;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'cascade') {
        osc.frequency.value = 800;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
    } else if (type === 'win') {
        osc.frequency.value = 700;
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'invalid') {
        osc.frequency.value = 200;
        osc.type = 'square';
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
}

function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
            grid[r][c] = randomColorNoMatch(r, c);
        }
    }
    if (!hasValidMoves()) shuffleGrid();
}

function randomColorNoMatch(r, c) {
    let color;
    do {
        color = Math.floor(Math.random() * NUM_COLORS);
    } while (
        (c >= 2 && grid[r][c-1] === color && grid[r][c-2] === color) ||
        (r >= 2 && grid[r-1][c] === color && grid[r-2][c] === color)
    );
    return color;
}

function hasValidMoves() {
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (c < COLS - 1 && wouldMatch(r, c, r, c+1)) return true;
            if (r < ROWS - 1 && wouldMatch(r, c, r+1, c)) return true;
        }
    }
    return false;
}

function wouldMatch(r1, c1, r2, c2) {
    let temp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = temp;
    let hasMatch = findMatches().length > 0;
    grid[r2][c2] = grid[r1][c1];
    grid[r1][c1] = temp;
    return hasMatch;
}

function shuffleGrid() {
    let flat = [];
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
            flat.push(grid[r][c]);
    for (let i = flat.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [flat[i], flat[j]] = [flat[j], flat[i]];
    }
    let idx = 0;
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
            grid[r][c] = flat[idx++];
    if (!hasValidMoves()) shuffleGrid();
}

function findMatches() {
    let matches = [];
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
            if (grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                let set = new Set();
                set.add(r * COLS + c);
                set.add(r * COLS + c + 1);
                set.add(r * COLS + c + 2);
                matches.push(set);
            }
        }
    }
    // Vertical
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
            if (grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                let set = new Set();
                set.add(r * COLS + c);
                set.add((r+1) * COLS + c);
                set.add((r+2) * COLS + c);
                matches.push(set);
            }
        }
    }
    // Merge overlapping matches
    let merged = new Set();
    for (let m of matches) {
        for (let idx of m) merged.add(idx);
    }
    return Array.from(merged).map(i => ({ r: Math.floor(i / COLS), c: i % COLS }));
}

function getTilePos(r, c) {
    return { x: boardX + c * tileSize, y: boardY + r * tileSize };
}

function spawnParticles(r, c, colorIdx) {
    let pos = getTilePos(r, c);
    const col = COLORS[colorIdx];
    for (let i = 0; i < 6; i++) {
        particles.push({
            x: pos.x + tileSize / 2,
            y: pos.y + tileSize / 2,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4 - 2,
            life: 1,
            color: col.fill,
            size: tileSize * 0.15 * Math.random() + 2
        });
    }
}

function processMatches() {
    cascadeCount = 0;
    let matched = findMatches();
    if (matched.length === 0) return false;
    
    cascadeCount++;
    let points = matched.length * POINTS_PER_TILE;
    if (cascadeCount > 1) points += (cascadeCount - 1) * CHAIN_BONUS;
    scores[currentPlayer] += points;
    
    let soundType = cascadeCount === 1 ? 'match' : 'cascade';
    playSound(soundType);
    
    for (let m of matched) {
        spawnParticles(m.r, m.c, grid[m.r][m.c]);
        grid[m.r][m.c] = -1;
    }
    
    return true;
}

function applyGravity() {
    let moved = false;
    for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
            if (grid[r][c] === -1) {
                for (let above = r - 1; above >= 0; above--) {
                    if (grid[above][c] !== -1) {
                        grid[r][c] = grid[above][c];
                        grid[above][c] = -1;
                        moved = true;
                        break;
                    }
                }
            }
        }
        for (let r = 0; r < ROWS; r++) {
            if (grid[r][c] === -1) {
                grid[r][c] = Math.floor(Math.random() * NUM_COLORS);
                moved = true;
            }
        }
    }
    return moved;
}

function doTurn() {
    // Process all cascades
    let processing = true;
    while (processing) {
        if (!processMatches()) {
            applyGravity();
            break;
        } else {
            applyGravity();
            processing = true;
        }
    }
    
    if (scores[currentPlayer] >= targetScore) {
        wonPlayer = currentPlayer;
        gameState = 'won';
        playSound('win');
        return;
    }
    
    if (!hasValidMoves()) shuffleGrid();
    
    currentPlayer = 1 - currentPlayer;
    gameState = 'playing';
}

function trySwap(r1, c1, r2, c2) {
    if (r1 < 0 || r1 >= ROWS || c1 < 0 || c1 >= COLS) return false;
    if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) return false;
    if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return false;
    
    let temp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = temp;
    
    if (findMatches().length === 0) {
        grid[r2][c2] = grid[r1][c1];
        grid[r1][c1] = temp;
        playSound('invalid');
        return false;
    }
    
    playSound('swap');
    doTurn();
    return true;
}

function resetGame() {
    scores = [0, 0];
    currentPlayer = 0;
    cascadeCount = 0;
    selected = null;
    particles = [];
    wonPlayer = -1;
    initGrid();
    gameState = 'playing';
}

// Input handling
let mouseX = 0, mouseY = 0;

function getCellFromPos(x, y) {
    let c = Math.floor((x - boardX) / tileSize);
    let r = Math.floor((y - boardY) / tileSize);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return { r, c };
}

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    
    if (gameState === 'start' || gameState === 'won') {
        resetGame();
        return;
    }
    
    if (gameState !== 'playing') return;
    
    let cell = getCellFromPos(x, y);
    if (!cell) return;
    
    dragStart = cell;
    dragging = true;
});

canvas.addEventListener('mousemove', (e) => {
    let rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

canvas.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    
    let rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    let cell = getCellFromPos(x, y);
    
    if (cell && dragStart) {
        if (cell.r !== dragStart.r || cell.c !== dragStart.c) {
            trySwap(dragStart.r, dragStart.c, cell.r, cell.c);
        }
    } else if (cell && selected && (selected.r !== cell.r || selected.c !== cell.c)) {
        trySwap(selected.r, selected.c, cell.r, cell.c);
        selected = null;
    } else if (cell) {
        selected = cell;
    }
    
    dragStart = null;
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    let touch = e.touches[0];
    let rect = canvas.getBoundingClientRect();
    let x = touch.clientX - rect.left;
    let y = touch.clientY - rect.top;
    
    if (gameState === 'start' || gameState === 'won') {
        resetGame();
        return;
    }
    
    if (gameState !== 'playing') return;
    
    let cell = getCellFromPos(x, y);
    if (!cell) return;
    
    dragStart = cell;
    dragging = true;
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    let touch = e.touches[0];
    let rect = canvas.getBoundingClientRect();
    mouseX = touch.clientX - rect.left;
    mouseY = touch.clientY - rect.top;
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!dragging) return;
    dragging = false;
    
    let changed = false;
    if (dragStart && selected) {
        trySwap(selected.r, selected.c, dragStart.r, dragStart.c);
        selected = null;
        changed = true;
    } else if (dragStart) {
        selected = dragStart;
    }
    
    dragStart = null;
});

// Keyboard support
let keyCell = { r: 3, c: 3 };
window.addEventListener('keydown', (e) => {
    initAudio();
    if (gameState === 'start' || gameState === 'won') {
        resetGame();
        return;
    }
    if (gameState !== 'playing') return;
    
    switch(e.key) {
        case 'ArrowUp': keyCell.r = Math.max(0, keyCell.r - 1); e.preventDefault(); break;
        case 'ArrowDown': keyCell.r = Math.min(ROWS-1, keyCell.r + 1); e.preventDefault(); break;
        case 'ArrowLeft': keyCell.c = Math.max(0, keyCell.c - 1); e.preventDefault(); break;
        case 'ArrowRight': keyCell.c = Math.min(COLS-1, keyCell.c + 1); e.preventDefault(); break;
        case ' ':
        case 'Enter':
            if (selected) {
                let dr = keyCell.r - selected.r;
                let dc = keyCell.c - selected.c;
                if (Math.abs(dr) + Math.abs(dc) === 1) {
                    trySwap(selected.r, selected.c, keyCell.r, keyCell.c);
                    selected = null;
                } else {
                    selected = { ...keyCell };
                }
            } else {
                selected = { ...keyCell };
            }
            e.preventDefault();
            break;
        case 'Escape':
            selected = null;
            break;
    }
});

// Rendering
function drawShape(x, y, size, colorIdx, alpha) {
    ctx.globalAlpha = alpha || 1;
    const col = COLORS[colorIdx];
    const s = size * 0.7;
    const cx = x + size / 2;
    const cy = y + size / 2;
    
    ctx.fillStyle = col.fill;
    ctx.strokeStyle = col.stroke;
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    switch(colorIdx) {
        case 0: // circle
            ctx.arc(cx, cy, s/2, 0, Math.PI*2);
            break;
        case 1: // diamond
            ctx.moveTo(cx, cy - s/2);
            ctx.lineTo(cx + s/2, cy);
            ctx.lineTo(cx, cy + s/2);
            ctx.lineTo(cx - s/2, cy);
            ctx.closePath();
            break;
        case 2: // square
            ctx.rect(cx - s/2.4, cy - s/2.4, s/1.2, s/1.2);
            break;
        case 3: // triangle
            ctx.moveTo(cx, cy - s/2);
            ctx.lineTo(cx + s/2, cy + s/2.5);
            ctx.lineTo(cx - s/2, cy + s/2.5);
            ctx.closePath();
            break;
        case 4: // hexagon
            for (let i = 0; i < 6; i++) {
                let a = Math.PI/3 * i - Math.PI/6;
                let px = cx + s/2 * Math.cos(a);
                let py = cy + s/2 * Math.sin(a);
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            break;
    }
    ctx.fill();
    ctx.stroke();
    ctx.globalAlpha = 1;
}

function drawBoard() {
    // Board background
    ctx.fillStyle = '#16213e';
    ctx.fillRect(boardX - 4, boardY - 4, COLS * tileSize + 8, ROWS * tileSize + 8);
    
    // Grid cells
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let x = boardX + c * tileSize;
            let y = boardY + r * tileSize;
            
            ctx.fillStyle = (r + c) % 2 === 0 ? '#1a1a3e' : '#1f1f4a';
            ctx.fillRect(x, y, tileSize, tileSize);
            
            if (grid[r][c] >= 0) {
                drawShape(x, y, tileSize, grid[r][c], 1);
            }
        }
    }
    
    // Selection highlight
    if (selected) {
        let sx = boardX + selected.c * tileSize;
        let sy = boardY + selected.r * tileSize;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeRect(sx + 2, sy + 2, tileSize - 4, tileSize - 4);
    }
    
    // Keyboard cursor
    if (gameState === 'playing') {
        let kx = boardX + keyCell.c * tileSize;
        let ky = boardY + keyCell.r * tileSize;
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(kx + 1, ky + 1, tileSize - 2, tileSize - 2);
        ctx.setLineDash([]);
    }
}

function drawScores() {
    const panelW = Math.min(W * 0.35, 300);
    const p1x = W/2 - panelW - 10;
    const p2x = W/2 + 10;
    const panelY = 8;
    const panelH = tileSize * 0.9;
    
    // Player 1
    ctx.fillStyle = currentPlayer === 0 ? 'rgba(255,107,107,0.3)' : 'rgba(255,107,107,0.1)';
    ctx.fillRect(p1x, panelY, panelW, panelH);
    ctx.strokeStyle = currentPlayer === 0 ? '#ff6b6b' : 'rgba(255,107,107,0.4)';
    ctx.lineWidth = currentPlayer === 0 ? 3 : 1;
    ctx.strokeRect(p1x, panelY, panelW, panelH);
    
    ctx.fillStyle = '#ff6b6b';
    ctx.font = `bold ${Math.max(14, tileSize * 0.25)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText('PLAYER 1', p1x + 10, panelY + tileSize * 0.3);
    
    ctx.font = `bold ${Math.max(18, tileSize * 0.4)}px 'Segoe UI', sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText(`${scores[0]}`, p1x + 10, panelY + tileSize * 0.7);
    
    // Progress bar P1
    let progW1 = (panelW - 20) * Math.min(1, scores[0] / targetScore);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(p1x + 10, panelY + panelH - 8, progW1, 4);
    
    // Player 2
    ctx.fillStyle = currentPlayer === 1 ? 'rgba(72,219,251,0.3)' : 'rgba(72,219,251,0.1)';
    ctx.fillRect(p2x, panelY, panelW, panelH);
    ctx.strokeStyle = currentPlayer === 1 ? '#48dbfb' : 'rgba(72,219,251,0.4)';
    ctx.lineWidth = currentPlayer === 1 ? 3 : 1;
    ctx.strokeRect(p2x, panelY, panelW, panelH);
    
    ctx.fillStyle = '#48dbfb';
    ctx.font = `bold ${Math.max(14, tileSize * 0.25)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText('PLAYER 2', p2x + panelW - 10, panelY + tileSize * 0.3);
    
    ctx.font = `bold ${Math.max(18, tileSize * 0.4)}px 'Segoe UI', sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText(`${scores[1]}`, p2x + panelW - 10, panelY + tileSize * 0.7);
    
    // Progress bar P2
    let progW2 = (panelW - 20) * Math.min(1, scores[1] / targetScore);
    ctx.fillStyle = '#48dbfb';
    ctx.fillRect(p2x + 10, panelY + panelH - 8, progW2, 4);
    
    // Turn indicator
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.max(12, tileSize * 0.2)}px 'Segoe UI', sans-serif`;
    ctx.fillStyle = currentPlayer === 0 ? '#ff6b6b' : '#48dbfb';
    let turnY = panelY + panelH + 15;
    ctx.fillText(`Player ${currentPlayer + 1}'s Turn`, W/2, turnY);
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.03;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawStartScreen() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(36, W * 0.05)}px 'Segoe UI', sans-serif`;
    ctx.fillText('MATCH DUEL', W/2, H * 0.2);
    
    ctx.font = `${Math.max(14, W * 0.018)}px 'Segoe UI', sans-serif`;
    ctx.fillStyle = '#aab';
    ctx.fillText('A competitive match-3 game for two players!', W/2, H * 0.32);
    
    let startY = H * 0.42;
    let lineH = Math.max(24, H * 0.04);
    ctx.fillStyle = '#ccc';
    ctx.font = `${Math.max(13, W * 0.015)}px 'Segoe UI', sans-serif`;
    
    const lines = [
        '• Players take turns swapping adjacent tiles',
        '• Match 3+ same-colored shapes to score points',
        `• First to reach ${targetScore} points wins!`,
        '',
        'Controls:',
        '  Mouse: Click & drag between two tiles to swap',
        '  Keyboard: Arrow keys to move, Space/Enter to select & swap',
        '',
        'Click or press any key to start!'
    ];
    
    lines.forEach((line, i) => {
        ctx.fillText(line, W/2, startY + i * lineH);
    });
}

function drawWonScreen() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    let winnerColor = wonPlayer === 0 ? '#ff6b6b' : '#48dbfb';
    
    ctx.fillStyle = winnerColor;
    ctx.font = `bold ${Math.max(32, W * 0.04)}px 'Segoe UI', sans-serif`;
    ctx.fillText(`PLAYER ${wonPlayer + 1} WINS!`, W/2, H * 0.35);
    
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(18, W * 0.02)}px 'Segoe UI', sans-serif`;
    ctx.fillText(`Final Score: ${scores[0]} - ${scores[1]}`, W/2, H * 0.45);
    
    ctx.fillStyle = '#aab';
    ctx.font = `${Math.max(16, W * 0.018)}px 'Segoe UI', sans-serif`;
    ctx.fillText('Click or press any key to play again', W/2, H * 0.58);
}

function render() {
    ctx.clearRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'won') {
        drawBoard();
        drawScores();
        drawParticles();
        drawWonScreen();
    } else {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);
        drawBoard();
        drawScores();
        drawParticles();
        
        // Target score indicator
        ctx.textAlign = 'center';
        ctx.fillStyle = '#888';
        ctx.font = `${Math.max(11, tileSize * 0.15)}px 'Segoe UI', sans-serif`;
        ctx.fillText(`First to ${targetScore} wins`, W/2, boardY + ROWS * tileSize + 20);
    }
    
    requestAnimationFrame(render);
}

initGrid();
render();
})();
</script>
</body>
</html>
