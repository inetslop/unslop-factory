<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Duel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; }
canvas { display: block; }
#overlay {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
display: flex; flex-direction: column; align-items: center; justify-content: center;
background: rgba(26, 26, 46, 0.95); z-index: 10; color: #fff; text-align: center;
}
#overlay h1 { font-size: 3em; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 20px; }
#overlay .subtitle { font-size: 1.2em; color: #a0a0c0; margin-bottom: 30px; }
#overlay .controls { font-size: 1em; color: #ccc; line-height: 1.8; margin-bottom: 30px; }
#overlay .p1 { color: #ff6b6b; }
#overlay .p2 { color: #4ecdc4; }
#overlay button {
font-size: 1.5em; padding: 12px 40px; background: #ffd700; color: #1a1a2e;
border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold;
transition: transform 0.1s, background 0.2s;
}
#overlay button:hover { background: #ffe44d; transform: scale(1.05); }
.hidden { display: none !important; }
#gameOver { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(26,26,46,0.9); z-index: 20; color: #fff; text-align: center; }
#gameOver h2 { font-size: 2.5em; margin-bottom: 15px; }
#gameOver .score-final { font-size: 1.3em; color: #a0a0c0; margin-bottom: 25px; }
#gameOver button { font-size: 1.2em; padding: 10px 30px; background: #ffd700; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold; }
#gameOver button:hover { background: #ffe44d; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay">
<h1>MAZE DUEL</h1>
<div class="subtitle">A two-player competitive maze game</div>
<div class="controls">
<span class="p1">Player 1 (Red)</span> — W A S D<br>
<span class="p2">Player 2 (Teal)</span> — Arrow Keys<br><br>
Collect gems to score points!<br>
Most gems when all are collected wins the round.
</div>
<button id="startBtn">START GAME</button>
</div>
<div id="gameOver" class="hidden">
<h2 id="winnerText"></h2>
<div class="score-final" id="finalScore"></div>
<button id="restartBtn">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const gameOverDiv = document.getElementById('gameOver');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const winnerText = document.getElementById('winnerText');
const finalScore = document.getElementById('finalScore');

let W, H, cellSize;
let maze = [];
let gems = [];
let players = [];
let gameRunning = false;
let roundOver = false;
let scores = [0, 0];
let totalRounds = 0;
let animFrame;
let audioCtx = null;

const MAZE_W = 15;
const MAZE_H = 15;
const NUM_GEMS = 8;

function resize() {
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;
cellSize = Math.min(Math.floor((W - 40) / MAZE_W), Math.floor((H - 80) / MAZE_H));
if (cellSize < 10) cellSize = 10;
}

function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
}

function playSound(freq, duration, type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type || 'sine';
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + duration);
}

function generateMaze() {
maze = [];
for (let y = 0; y < MAZE_H; y++) {
maze[y] = [];
for (let x = 0; x < MAZE_W; x++) {
maze[y][x] = 1;
}
}

function carve(x, y) {
if (x >= 0 && x < MAZE_W && y >= 0 && y < MAZE_H && maze[y][x] === 1) {
maze[y][x] = 0;
return true;
}
return false;
}

// Recursive backtracker on odd cells
let stack = [];
let sx = 1, sy = 1;
carve(sx, sy);
stack.push([sx, sy]);

const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
while (stack.length > 0) {
let [cx, cy] = stack[stack.length - 1];
let shuffled = dirs.slice().sort(() => Math.random() - 0.5);
let moved = false;
for (let d of shuffled) {
let nx = cx + d[0], ny = cy + d[1];
if (nx >= 1 && nx < MAZE_W - 1 && ny >= 1 && ny < MAZE_H - 1 && maze[ny][nx] === 1) {
carve(nx, ny);
carve(cx + d[0]/2, cy + d[1]/2);
stack.push([nx, ny]);
moved = true;
break;
}
}
if (!moved) stack.pop();
}

// Remove some extra walls to create loops (more interesting gameplay)
let removed = 0;
for (let i = 0; i < 8 && removed < 6; i++) {
let rx = Math.floor(Math.random() * (MAZE_W - 2)) + 1;
let ry = Math.floor(Math.random() * (MAZE_H - 2)) + 1;
if (maze[ry][rx] === 1) {
// Check if removing creates a loop (both sides are open)
let left = rx > 1 ? maze[ry][rx-2] === 0 : false;
let right = rx < MAZE_W - 2 ? maze[ry][rx+2] === 0 : false;
let up = ry > 1 ? maze[ry-2][rx] === 0 : false;
let down = ry < MAZE_H - 2 ? maze[ry+2][rx] === 0 : false;
if ((left && right) || (up && down)) {
maze[ry][rx] = 0;
removed++;
}
}
}

// Ensure start positions are open
maze[1][1] = 0;
maze[MAZE_H-2][MAZE_W-2] = 0;
}

function placeGems() {
gems = [];
let pathCells = [];
for (let y = 0; y < MAZE_H; y++) {
for (let x = 0; x < MAZE_W; x++) {
if (maze[y][x] === 0 && !(x === 1 && y === 1) && !(x === MAZE_W-2 && y === MAZE_H-2)) {
pathCells.push([x, y]);
}
}
}
for (let i = 0; i < NUM_GEMS && pathCells.length > 0; i++) {
let idx = Math.floor(Math.random() * pathCells.length);
let [gx, gy] = pathCells.splice(idx, 1);
gems.push({ x: gx, y: gy, collected: false });
}
}

function initGame() {
generateMaze();
placeGems();
players = [
{ x: 1, y: 1, score: 0, color: '#ff6b6b', trail: [] },
{ x: MAZE_W - 2, y: MAZE_H - 2, score: 0, color: '#4ecdc4', trail: [] }
];
gameRunning = true;
roundOver = false;
}

function drawMaze() {
let offsetX = (W - MAZE_W * cellSize) / 2;
let offsetY = (H - MAZE_H * cellSize) / 2 + 10;

// Background
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, W, H);

// Maze walls
for (let y = 0; y < MAZE_H; y++) {
for (let x = 0; x < MAZE_W; x++) {
let px = offsetX + x * cellSize;
let py = offsetY + y * cellSize;
if (maze[y][x] === 1) {
ctx.fillStyle = '#4a4a6a';
ctx.fillRect(px, py, cellSize, cellSize);
// Wall highlight
ctx.fillStyle = '#5a5a7a';
ctx.fillRect(px + 2, py + 2, cellSize - 4, cellSize - 4);
} else {
ctx.fillStyle = '#16213e';
ctx.fillRect(px, py, cellSize, cellSize);
}
}
}

// Grid lines (subtle)
ctx.strokeStyle = 'rgba(100,100,150,0.1)';
ctx.lineWidth = 1;
for (let y = 0; y <= MAZE_H; y++) {
ctx.beginPath();
ctx.moveTo(offsetX, offsetY + y * cellSize);
ctx.lineTo(offsetX + MAZE_W * cellSize, offsetY + y * cellSize);
ctx.stroke();
}
for (let x = 0; x <= MAZE_W; x++) {
ctx.beginPath();
ctx.moveTo(offsetX + x * cellSize, offsetY);
ctx.lineTo(offsetX + x * cellSize, offsetY + MAZE_H * cellSize);
ctx.stroke();
}

// Gems
let time = Date.now() / 1000;
for (let g of gems) {
if (!g.collected) {
let gx = offsetX + g.x * cellSize + cellSize / 2;
let gy = offsetY + g.y * cellSize + cellSize / 2;
let pulse = Math.sin(time * 3) * 0.15 + 0.85;
let size = (cellSize * 0.35) * pulse;

ctx.save();
ctx.translate(gx, gy);
ctx.rotate(time * 2);
ctx.fillStyle = '#ffd700';
ctx.shadowColor = '#ffd700';
ctx.shadowBlur = 10;
ctx.beginPath();
ctx.moveTo(0, -size);
ctx.lineTo(size, 0);
ctx.lineTo(0, size);
ctx.lineTo(-size, 0);
ctx.closePath();
ctx.fill();
ctx.restore();
}
}

// Players
for (let i = 0; i < players.length; i++) {
let p = players[i];
let px = offsetX + p.x * cellSize + cellSize / 2;
let py = offsetY + p.y * cellSize + cellSize / 2;
let r = cellSize * 0.35;

ctx.shadowColor = p.color;
ctx.shadowBlur = 12;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(px, py, r, 0, Math.PI * 2);
ctx.fill();
ctx.shadowBlur = 0;

// Player number
ctx.fillStyle = '#fff';
ctx.font = `bold ${Math.floor(cellSize * 0.4)}px monospace`;
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(i === 0 ? '1' : '2', px, py);
}

// Score display
let scoreY = offsetY - 15;
ctx.font = `bold ${Math.floor(cellSize * 0.4)}px monospace`;
ctx.textAlign = 'left';
ctx.fillStyle = '#ff6b6b';
ctx.fillText(`P1: ${players[0].score}`, offsetX, scoreY);
ctx.textAlign = 'right';
ctx.fillStyle = '#4ecdc4';
ctx.fillText(`P2: ${players[1].score}`, offsetX + MAZE_W * cellSize, scoreY);

// Gems remaining
let remaining = gems.filter(g => !g.collected).length;
ctx.textAlign = 'center';
ctx.fillStyle = '#ffd700';
ctx.font = `${Math.floor(cellSize * 0.35)}px monospace`;
ctx.fillText(`Gems: ${remaining}`, offsetX + MAZE_W * cellSize / 2, scoreY);
}

function draw() {
if (!gameRunning) return;
drawMaze();

// Check for round end
let remaining = gems.filter(g => !g.collected).length;
if (remaining === 0 && !roundOver) {
roundOver = true;
gameRunning = false;
totalRounds++;
let p1s = players[0].score, p2s = players[1].score;
let winnerTextStr;
if (p1s > p2s) winnerTextStr = '🏆 PLAYER 1 WINS!';
else if (p2s > p1s) winnerTextStr = '🏆 PLAYER 2 WINS!';
else winnerTextStr = "IT'S A TIE!";

winnerText.textContent = winnerTextStr;
finalScore.textContent = `P1: ${p1s} | P2: ${p2s}`;
gameOverDiv.classList.remove('hidden');

playSound(p1s >= p2s ? 523 : 330, 0.4, 'triangle');
setTimeout(() => playSound(p1s >= p2s ? 659 : 392, 0.4, 'triangle'), 200);
}
}

function gameLoop() {
if (gameRunning) {
draw();
animFrame = requestAnimationFrame(gameLoop);
}
}

function movePlayer(idx, dx, dy) {
if (!gameRunning || roundOver) return;
let p = players[idx];
let nx = p.x + dx, ny = p.y + dy;
if (nx < 0 || nx >= MAZE_W || ny < 0 || ny >= MAZE_H) return;
if (maze[ny][nx] === 1) return;

// Check if other player is in the target cell
let other = players[1 - idx];
if (other.x === nx && other.y === ny) return; // Can't move into same cell

p.x = nx;
p.y = ny;
playSound(idx === 0 ? 220 : 180, 0.05, 'square');

// Check gem collection
for (let g of gems) {
if (!g.collected && g.x === p.x && g.y === p.y) {
g.collected = true;
p.score++;
playSound(600 + idx * 100, 0.2, 'sine');
playSound(800 + idx * 100, 0.3, 'sine');
}
}
}

let keysDown = {};
window.addEventListener('keydown', (e) => {
if (!gameRunning) return;
keysDown[e.key] = true;
handleInput(e.key);
});
window.addEventListener('keyup', (e) => {
keysDown[e.key] = false;
});

function handleInput(key) {
// Player 1: WASD
if (key === 'w' || key === 'W') movePlayer(0, 0, -1);
else if (key === 'a' || key === 'A') movePlayer(0, -1, 0);
else if (key === 's' || key === 'S') movePlayer(0, 0, 1);
else if (key === 'd' || key === 'D') movePlayer(0, 1, 0);
// Player 2: Arrows
else if (key === 'ArrowUp') { e.preventDefault(); movePlayer(1, 0, -1); }
else if (key === 'ArrowLeft') { e.preventDefault(); movePlayer(1, -1, 0); }
else if (key === 'ArrowDown') { e.preventDefault(); movePlayer(1, 0, 1); }
else if (key === 'ArrowRight') { e.preventDefault(); movePlayer(1, 1, 0); }
}

// Also allow Enter/Space to restart
window.addEventListener('keydown', (e) => {
if ((e.key === 'Enter' || e.key === ' ') && !gameRunning && !gameOverDiv.classList.contains('hidden')) {
startGame();
}
});

function startGame() {
initAudio();
overlay.classList.add('hidden');
gameOverDiv.classList.add('hidden');
initGame();
if (animFrame) cancelAnimationFrame(animFrame);
gameLoop();
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

window.addEventListener('resize', () => { resize(); if (gameRunning) draw(); });
resize();

// Initial render
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, W, H);
</script>
</body>
</html>
