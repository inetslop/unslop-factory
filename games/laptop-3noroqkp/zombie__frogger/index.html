<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger Zombie</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; }
canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, CELL, COLS = 13, ROWS = 11;
let gameLoop;
let audioCtx = null;

function resize() {
    const maxW = window.innerWidth;
    const maxH = window.innerHeight;
    W = Math.min(maxW, 800);
    H = Math.min(maxH, 700);
    canvas.width = W;
    canvas.height = H;
    CELL = Math.min(Math.floor(W / COLS), Math.floor(H / ROWS));
}
resize();
window.addEventListener('resize', resize);

// Audio
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'move') { osc.frequency.value = 220; osc.type = 'square'; gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); }
    else if (type === 'die') { osc.frequency.value = 150; osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
    else if (type === 'score') { osc.frequency.value = 440; osc.type = 'sine'; gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }
    else if (type === 'levelup') { osc.frequency.value = 660; osc.type = 'sine'; gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6); osc.start(); osc.stop(audioCtx.currentTime + 0.6); }
}

// Game State
let state = 'start'; // start, playing, dead, levelcomplete, gameover
let player = { x: 6, y: 9, swampTimer: 0 };
let zombies = [];
let shelters = [0, 2, 5, 7, 10, 12];
let swampGrid = [];
let score = 0;
let lives = 3;
let level = 1;
let combo = 0;
let sheltersThisLevel = 0;
let deadTimer = 0;
let animFrame = 0;
let particles = [];

function generateSwamp() {
    swampGrid = [];
    for (let r = 1; r <= 4; r++) {
        let row = [];
        for (let c = 0; c < COLS; c++) {
            row.push(Math.random() < 0.35 ? 1 : 0); // 1 = toxic, 0 = safe rock
        }
        // Ensure some safe paths
        if (row[6] === 1) row[6] = 0;
        swampGrid.push(row);
    }
}

function spawnZombies() {
    zombies = [];
    const lanes = [
        { row: 8, dir: 1, speed: 0.5 + level * 0.1, count: 4 },
        { row: 7, dir: -1, speed: 0.7 + level * 0.12, count: 3 },
        { row: 6, dir: 1, speed: 0.9 + level * 0.15, count: 3 }
    ];
    for (let lane of lanes) {
        const spacing = COLS / lane.count;
        for (let i = 0; i < lane.count; i++) {
            zombies.push({
                x: i * spacing + Math.random() * 2,
                y: lane.row,
                dir: lane.dir,
                speed: lane.speed,
                type: Math.floor(Math.random() * 3) // visual variation
            });
        }
    }
}

function resetPlayer() {
    player.x = 6;
    player.y = 9;
    player.swampTimer = 0;
}

function startGame() {
    state = 'playing';
    score = 0;
    lives = 3;
    level = 1;
    combo = 0;
    sheltersThisLevel = 0;
    resetPlayer();
    generateSwamp();
    spawnZombies();
}

function nextLevel() {
    level++;
    sheltersThisLevel = 0;
    combo = 0;
    resetPlayer();
    generateSwamp();
    spawnZombies();
    state = 'playing';
}

function die() {
    if (state !== 'playing') return;
    state = 'dead';
    deadTimer = 60;
    combo = 0;
    playSound('die');
    for (let i = 0; i < 12; i++) {
        particles.push({
            x: player.x * CELL + CELL/2,
            y: player.y * CELL + CELL/2,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 30,
            color: '#7fff00'
        });
    }
}

function checkDeath() {
    if (state !== 'playing') return;
    // Check zombie collision on highway rows
    for (let z of zombies) {
        if (z.y === player.y && Math.abs(z.x - player.x) < 0.6) {
            die();
            return;
        }
    }
    // Check swamp toxic puddles
    if (player.y >= 1 && player.y <= 4) {
        const swRow = player.y - 1;
        if (swampGrid[swRow][player.x] === 1) {
            player.swampTimer++;
            if (player.swampTimer > 90) die(); // ~1.5 seconds at 60fps
        } else {
            player.swampTimer = 0;
        }
    } else {
        player.swampTimer = 0;
    }
}

function checkScore() {
    if (state !== 'playing') return;
    if (player.y === 0 && shelters.includes(player.x)) {
        combo++;
        const pts = 100 * Math.min(combo, 5);
        score += pts;
        sheltersThisLevel++;
        playSound('score');
        for (let i = 0; i < 8; i++) {
            particles.push({
                x: player.x * CELL + CELL/2,
                y: player.y * CELL + CELL/2,
                vx: (Math.random() - 0.5) * 3,
                vy: -Math.random() * 3,
                life: 40,
                color: '#00ff88'
            });
        }
        if (sheltersThisLevel >= shelters.length) {
            state = 'levelcomplete';
            playSound('levelup');
        } else {
            resetPlayer();
        }
    }
}

function movePlayer(dx, dy) {
    if (state !== 'playing') return;
    let nx = player.x + dx;
    let ny = player.y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny > 9) return;
    // Can't move into shelter row unless it's a shelter spot
    if (ny === 0 && !shelters.includes(nx)) return;
    player.x = nx;
    player.y = ny;
    playSound('move');
    checkScore();
}

// Input
let keysDown = {};
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    initAudio();
    if (state === 'start') { startGame(); return; }
    if (state === 'gameover' && e.key === ' ') { startGame(); return; }
    if (state === 'levelcomplete' && e.key === ' ') { nextLevel(); return; }
    if (state !== 'playing') return;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') movePlayer(0, -1);
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') movePlayer(0, 1);
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') movePlayer(-1, 0);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') movePlayer(1, 0);
});

// Drawing
function drawZombie(x, y, type) {
    const px = x * CELL;
    const py = y * CELL;
    const s = CELL;
    ctx.fillStyle = '#2d5a27';
    ctx.fillRect(px + s*0.1, py + s*0.3, s*0.8, s*0.6);
    // head
    ctx.fillStyle = type === 0 ? '#4a7c3f' : type === 1 ? '#5c8a4e' : '#3d6b35';
    ctx.beginPath();
    ctx.arc(px + s/2, py + s*0.3, s*0.25, 0, Math.PI*2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(px + s*0.3, py + s*0.22, s*0.12, s*0.1);
    ctx.fillRect(px + s*0.58, py + s*0.22, s*0.12, s*0.1);
    // arms (shambling)
    const armOff = Math.sin(animFrame * 0.3 + x) * s * 0.1;
    ctx.strokeStyle = '#4a7c3f';
    ctx.lineWidth = s * 0.12;
    ctx.beginPath();
    ctx.moveTo(px + s*0.15, py + s*0.45);
    ctx.lineTo(px + s*0.05, py + s*0.6 + armOff);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px + s*0.85, py + s*0.45);
    ctx.lineTo(px + s*0.95, py + s*0.6 - armOff);
    ctx.stroke();
}

function drawPlayer(x, y) {
    const px = x * CELL;
    const py = y * CELL;
    const s = CELL;
    // body
    ctx.fillStyle = '#ff8c00';
    ctx.fillRect(px + s*0.25, py + s*0.35, s*0.5, s*0.55);
    // head
    ctx.fillStyle = '#ffcc99';
    ctx.beginPath();
    ctx.arc(px + s/2, py + s*0.28, s*0.2, 0, Math.PI*2);
    ctx.fill();
    // hat
    ctx.fillStyle = '#333';
    ctx.fillRect(px + s*0.25, py + s*0.12, s*0.5, s*0.1);
    // backpack
    ctx.fillStyle = '#555';
    ctx.fillRect(px + s*0.15, py + s*0.4, s*0.15, s*0.35);
}

function drawSwampCell(r, c) {
    const px = c * CELL;
    const py = (r+1) * CELL;
    const s = CELL;
    if (swampGrid[r][c] === 1) {
        // toxic puddle
        ctx.fillStyle = '#2a5e1f';
        ctx.fillRect(px, py, s, s);
        // bubbles
        const b1 = Math.sin(animFrame * 0.1 + c * 3) * s * 0.1;
        const b2 = Math.cos(animFrame * 0.08 + r * 5) * s * 0.08;
        ctx.fillStyle = '#4a9e2f';
        ctx.beginPath();
        ctx.arc(px + s*0.3, py + s*0.5 + b1, s*0.08, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px + s*0.7, py + s*0.4 + b2, s*0.06, 0, Math.PI*2);
        ctx.fill();
    } else {
        // safe rock/ground
        ctx.fillStyle = '#3a3a3a';
        ctx.fillRect(px, py, s, s);
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.arc(px + s*0.4, py + s*0.6, s*0.12, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px + s*0.7, py + s*0.3, s*0.08, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawShelter(c) {
    const px = c * CELL;
    const py = 0 * CELL;
    const s = CELL;
    ctx.fillStyle = '#4a6741';
    ctx.fillRect(px + s*0.1, py + s*0.3, s*0.8, s*0.7);
    // roof
    ctx.fillStyle = '#2f4f2f';
    ctx.beginPath();
    ctx.moveTo(px, py + s*0.35);
    ctx.lineTo(px + s/2, py + s*0.05);
    ctx.lineTo(px + s, py + s*0.35);
    ctx.fill();
    // cross (medical)
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(px + s*0.4, py + s*0.5, s*0.2, s*0.08);
    ctx.fillRect(px + s*0.44, py + s*0.46, s*0.12, s*0.16);
}

function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
    
    const offsetX = (W - COLS * CELL) / 2;
    const offsetY = (H - ROWS * CELL) / 2;
    ctx.save();
    ctx.translate(offsetX, offsetY);

    // Draw rows
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (r === 0) {
                // Shelter row
                ctx.fillStyle = '#1a3a1a';
                ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
                if (shelters.includes(c)) drawShelter(c);
            } else if (r >= 1 && r <= 4) {
                drawSwampCell(r-1, c);
            } else if (r === 5) {
                // Sidewalk
                ctx.fillStyle = '#4a4a5a';
                ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
                ctx.strokeStyle = '#5a5a6a';
                ctx.lineWidth = 1;
                ctx.strokeRect(c*CELL+2, r*CELL+2, CELL-4, CELL-4);
            } else if (r >= 6 && r <= 8) {
                // Highway
                ctx.fillStyle = '#2a2a2a';
                ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
                // road lines
                if (c === 0 || c === COLS-1) continue;
                ctx.fillStyle = '#ffff00';
                if (r < 8) {
                    ctx.fillRect(c*CELL + CELL*0.4, r*CELL + CELL*0.95, CELL*0.2, 3);
                }
            } else if (r === 9) {
                // Start row
                ctx.fillStyle = '#1a3a1a';
                ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
            }
        }
    }

    // Draw zombies
    for (let z of zombies) {
        drawZombie(z.x, z.y, z.type);
    }

    // Draw player
    if (state === 'playing' || state === 'dead') {
        if (state === 'playing' || deadTimer % 8 < 4) {
            drawPlayer(player.x, player.y);
        }
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
        ctx.globalAlpha = 1;
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(CELL*0.4)}px Courier New`;
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, CELL*0.2, CELL*0.7);
    ctx.textAlign = 'right';
    ctx.fillText(`LIVES: ${'❤'.repeat(lives)}`, COLS*CELL - CELL*0.2, CELL*0.7);
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${level}  |  COMBO x${Math.min(combo+1,5)}`, (COLS*CELL)/2, CELL*0.7);

    // Swamp timer warning
    if (state === 'playing' && player.y >= 1 && player.y <= 4 && player.swampTimer > 30) {
        ctx.fillStyle = `rgba(255,50,50,${Math.sin(animFrame*0.2)*0.5+0.5})`;
        ctx.font = `bold ${Math.floor(CELL*0.3)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.fillText('☠ TOXIC! ☠', (COLS*CELL)/2, CELL * 10.5);
    }

    // Overlays
    if (state === 'start') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#7fff00';
        ctx.font = `bold ${Math.floor(CELL*0.8)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.fillText('FROGGER ZOMBIE', W/2, H*0.3);
        ctx.fillStyle = '#ff8c00';
        ctx.font = `${Math.floor(CELL*0.4)}px Courier New`;
        ctx.fillText('Cross the zombie highway!', W/2, H*0.42);
        ctx.fillText('Navigate the toxic swamp!', W/2, H*0.5);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.floor(CELL*0.35)}px Courier New`;
        ctx.fillText('↑ ↓ ← → / WASD to move', W/2, H*0.62);
        ctx.fillText('Reach 6 shelters to clear the level', W/2, H*0.7);
        ctx.fillStyle = '#aaa';
        ctx.font = `${Math.floor(CELL*0.3)}px Courier New`;
        ctx.fillText('Press any key to start', W/2, H*0.85);
    }

    if (state === 'levelcomplete') {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#00ff88';
        ctx.font = `bold ${Math.floor(CELL*0.6)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.fillText('LEVEL COMPLETE!', W/2, H*0.4);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.floor(CELL*0.4)}px Courier New`;
        ctx.fillText(`Score: ${score}`, W/2, H*0.55);
        ctx.fillText('Press SPACE for next level', W/2, H*0.7);
    }

    if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff3333';
        ctx.font = `bold ${Math.floor(CELL*0.7)}px Courier New`;
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H*0.4);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.floor(CELL*0.4)}px Courier New`;
        ctx.fillText(`Final Score: ${score}`, W/2, H*0.55);
        ctx.fillText('Press SPACE to restart', W/2, H*0.7);
    }

    ctx.restore();
}

function update() {
    animFrame++;
    
    if (state === 'playing' || state === 'dead') {
        // Update zombies
        for (let z of zombies) {
            z.x += z.dir * z.speed;
            if (z.x > COLS + 1) z.x = -1;
            if (z.x < -1) z.x = COLS + 1;
        }
        checkDeath();
    }

    if (state === 'dead') {
        deadTimer--;
        if (deadTimer <= 0) {
            lives--;
            if (lives <= 0) {
                state = 'gameover';
            } else {
                resetPlayer();
                state = 'playing';
            }
        }
    }

    // Update particles
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
    }
    particles = particles.filter(p => p.life > 0);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

generateSwamp();
spawnZombies();
gameLoop();
</script>
</body>
</html>
