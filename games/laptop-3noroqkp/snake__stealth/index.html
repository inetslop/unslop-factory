<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stealth Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a12; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize;
const COLS = 20, ROWS = 15;

let state = 'start'; // start, playing, gameover, win
let snake = [];
let dirX = 1, dirY = 0;
let nextDirX = 1, nextDirY = 0;
let food = {x: 0, y: 0};
let guards = [];
let shadows = new Set();
let walls = new Set();
let detection = 0;
let score = 0;
let highScore = 0;
let gameLoop = null;
let animFrame = 0;
let guardTimer = 0;
const GUARD_INTERVAL = 3; // guards move every 3 snake moves
let movesSinceGuard = 0;

try { highScore = parseInt(localStorage.getItem('stealthSnakeHigh') || '0'); } catch(e) {}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellSize = Math.min(Math.floor((W - 40) / COLS), Math.floor((H - 120) / ROWS));
}
window.addEventListener('resize', resize);
resize();

function keyToDir(key) {
    switch(key) {
        case 'ArrowUp': return {x:0, y:-1};
        case 'ArrowDown': return {x:0, y:1};
        case 'ArrowLeft': return {x:-1, y:0};
        case 'ArrowRight': return {x:1, y:0};
    }
}

function isWall(x, y) { return walls.has(x + ',' + y); }
function isShadow(x, y) { return shadows.has(x + ',' + y); }

function lineOfSightBlocked(ax, ay, bx, by) {
    // Check if there's a wall between (ax,ay) and (bx,by) - they must be in same row or col within range
    if (ax === bx) {
        let step = ay < by ? 1 : -1;
        for (let y = ay + step; y !== by; y += step) {
            if (isWall(ax, y)) return true;
        }
    } else if (ay === by) {
        let step = ax < bx ? 1 : -1;
        for (let x = ax + step; x !== bx; x += step) {
            if (isWall(x, ay)) return true;
        }
    }
    return false;
}

function guardCanSee(guard, sx, sy) {
    let dx = sx - guard.x;
    let dy = sy - guard.y;
    let dist = Math.abs(dx) + Math.abs(dy);
    if (dist === 0) return true;
    if (dist > 3) return false;
    // Must be in line (same row or col) for line of sight
    if (dx !== 0 && dy !== 0) return false;
    if (lineOfSightBlocked(guard.x, guard.y, sx, sy)) return false;
    return true;
}

function generateLevel() {
    walls = new Set();
    shadows = new Set();
    
    // Place walls in clusters
    let wallCount = 12 + Math.floor(score / 5);
    for (let i = 0; i < wallCount; i++) {
        let wx = Math.floor(Math.random() * COLS);
        let wy = Math.floor(Math.random() * ROWS);
        if (!walls.has(wx+','+wy)) {
            walls.add(wx + ',' + wy);
            // Sometimes extend
            if (Math.random() < 0.5 && wx + 1 < COLS) walls.add((wx+1)+','+wy);
        }
    }
    
    // Place shadow zones (clusters of dark tiles)
    let shadowClusters = 4 + Math.floor(score / 8);
    for (let i = 0; i < shadowClusters; i++) {
        let sx = Math.floor(Math.random() * COLS);
        let sy = Math.floor(Math.random() * ROWS);
        shadows.add(sx+','+sy);
        if (Math.random() < 0.6 && sx+1 < COLS) shadows.add((sx+1)+','+sy);
        if (Math.random() < 0.4 && sy+1 < ROWS) shadows.add(sx+','+(sy+1));
    }
    
    // Place guards
    let guardCount = Math.min(3 + Math.floor(score / 10), 6);
    guards = [];
    for (let i = 0; i < guardCount; i++) {
        let gx, gy, attempts = 0;
        do {
            gx = Math.floor(Math.random() * COLS);
            gy = Math.floor(Math.random() * ROWS);
            attempts++;
        } while ((isWall(gx,gy) || (gx < 4 && gy === 7)) && attempts < 100);
        
        let patterns = [
            [{x:1,y:0},{x:-1,y:0}],
            [{x:0,y:1},{x:0,y:-1}],
            [{x:1,y:1},{x:-1,y:-1}],
            [{x:1,y:0},{x:0,y:1},{x:-1,y:0},{x:0,y:-1}]
        ];
        guards.push({x: gx, y: gy, pattern: patterns[Math.floor(Math.random()*patterns.length)], pi: 0});
    }
    
    // Place food
    let fx, fy;
    do {
        fx = Math.floor(Math.random() * COLS);
        fy = Math.floor(Math.random() * ROWS);
    } while (isWall(fx,fy) || snake.some(s => s.x===fx && s.y===fy));
    food = {x: fx, y: fy};
}

function initGame() {
    snake = [{x: 2, y: 7}, {x: 1, y: 7}];
    dirX = 1; dirY = 0; nextDirX = 1; nextDirY = 0;
    detection = 0;
    score = 0;
    movesSinceGuard = 0;
    guardTimer = 0;
    generateLevel();
}

function moveSnake() {
    dirX = nextDirX;
    dirY = nextDirY;
    let hx = snake[0].x + dirX;
    let hy = snake[0].y + dirY;
    
    // Check wall collision
    if (isWall(hx, hy)) { triggerGameOver(); return; }
    // Check self collision
    if (snake.some(s => s.x === hx && s.y === hy)) { triggerGameOver(); return; }
    // Check bounds
    if (hx < 0 || hx >= COLS || hy < 0 || hy >= ROWS) { triggerGameOver(); return; }
    
    snake.unshift({x: hx, y: hy});
    if (snake.length > 5 + score) snake.pop();
    
    // Check food
    if (hx === food.x && hy === food.y) {
        score++;
        try { localStorage.setItem('stealthSnakeHigh', String(highScore)); } catch(e) {}
        generateLevel();
    }
    
    movesSinceGuard++;
    if (movesSinceGuard >= GUARD_INTERVAL) {
        moveGuards();
        movesSinceGuard = 0;
    }
    
    updateDetection();
}

function moveGuards() {
    for (let g of guards) {
        let move = g.pattern[g.pi];
        g.pi = (g.pi + 1) % g.pattern.length;
        let nx = g.x + move.x;
        let ny = g.y + move.y;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || isWall(nx, ny)) {
            // Bounce back to previous position
            nx = g.x - move.x;
            ny = g.y - move.y;
        }
        g.x = nx;
        g.y = ny;
    }
}

function updateDetection() {
    let headX = snake[0].x;
    let headY = snake[0].y;
    let inShadow = isShadow(headX, headY);
    let seen = false;
    
    for (let g of guards) {
        if (!inShadow && guardCanSee(g, headX, headY)) {
            seen = true;
            break;
        }
    }
    
    if (seen) {
        detection += 25;
        if (detection >= 100) {
            triggerGameOver();
        }
    } else {
        detection = Math.max(0, detection - 5);
    }
}

function triggerGameOver() {
    state = 'gameover';
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('stealthSnakeHigh', String(highScore)); } catch(e) {}
    }
}

window.addEventListener('keydown', function(e) {
    if (state === 'start') {
        initGame();
        state = 'playing';
        return;
    }
    if (state === 'gameover' || state === 'win') {
        if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
            initGame();
            state = 'playing';
        }
        return;
    }
    if (state !== 'playing') return;
    
    let d = keyToDir(e.key);
    if (!d) return;
    // Prevent 180 degree turns
    if (d.x === -dirX && d.y === -dirY) return;
    nextDirX = d.x;
    nextDirY = d.y;
    moveSnake();
    e.preventDefault();
});

function draw() {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);
    
    if (state === 'start') {
        drawStartScreen();
        return;
    }
    
    let offsetX = Math.floor((W - COLS * cellSize) / 2);
    let offsetY = 60;
    
    // Draw grid cells
    for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
            let px = offsetX + x * cellSize;
            let py = offsetY + y * cellSize;
            
            // Base tile
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(px, py, cellSize - 1, cellSize - 1);
            
            // Shadow tiles
            if (isShadow(x, y)) {
                ctx.fillStyle = 'rgba(30, 60, 90, 0.7)';
                ctx.fillRect(px, py, cellSize - 1, cellSize - 1);
                ctx.fillStyle = 'rgba(50, 80, 120, 0.4)';
                let s = cellSize * 0.3;
                ctx.beginPath();
                ctx.arc(px + cellSize/2, py + cellSize/2, s, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Walls
            if (isWall(x, y)) {
                ctx.fillStyle = '#4a4a5e';
                ctx.fillRect(px, py, cellSize - 1, cellSize - 1);
                ctx.fillStyle = '#5a5a6e';
                ctx.fillRect(px + 2, py + 2, cellSize - 5, cellSize - 5);
            }
        }
    }
    
    // Draw food
    let fx = offsetX + food.x * cellSize;
    let fy = offsetY + food.y * cellSize;
    let pulse = Math.sin(animFrame * 0.1) * 2;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(fx + cellSize/2, fy + cellSize/2, cellSize * 0.3 + pulse, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
    ctx.beginPath();
    ctx.arc(fx + cellSize/2, fy + cellSize/2, cellSize * 0.4 + pulse, 0, Math.PI*2);
    ctx.fill();
    
    // Draw guards with vision
    for (let g of guards) {
        let gx = offsetX + g.x * cellSize;
        let gy = offsetY + g.y * cellSize;
        
        // Vision range (cross pattern, 3 cells)
        for (let dx = -3; dx <= 3; dx++) {
            for (let dy = -3; dy <= 3; dy++) {
                if (Math.abs(dx) + Math.abs(dy) > 3) continue;
                if (dx !== 0 && dy !== 0) continue; // only cross
                let vx = g.x + dx;
                let vy = g.y + dy;
                if (vx < 0 || vx >= COLS || vy < 0 || vy >= ROWS) continue;
                if (isWall(vx, vy)) continue;
                ctx.fillStyle = 'rgba(255, 50, 50, 0.15)';
                ctx.fillRect(offsetX + vx * cellSize, offsetY + vy * cellSize, cellSize - 1, cellSize - 1);
            }
        }
        
        // Guard body
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(gx + cellSize/2, gy + cellSize/2, cellSize * 0.35, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ffaaaa';
        ctx.beginPath();
        ctx.arc(gx + cellSize/2, gy + cellSize/2, cellSize * 0.15, 0, Math.PI*2);
        ctx.fill();
        
        // Guard eyes
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.floor(cellSize*0.3)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('👁', gx + cellSize/2, gy + cellSize/2 + 4);
    }
    
    // Draw snake
    let inShadow = isShadow(snake[0].x, snake[0].y);
    for (let i = 0; i < snake.length; i++) {
        let sx = offsetX + snake[i].x * cellSize;
        let sy = offsetY + snake[i].y * cellSize;
        
        let alpha = inShadow ? 0.4 : 1;
        let green = i === 0 ? '#00ff88' : `rgb(0, ${200 - i*5}, ${100 - i*3})`;
        
        ctx.globalAlpha = alpha;
        ctx.fillStyle = green;
        let pad = 2;
        ctx.beginPath();
        ctx.roundRect(sx + pad, sy + pad, cellSize - 1 - pad*2, cellSize - 1 - pad*2, 4);
        ctx.fill();
        
        if (i === 0) {
            // Snake head details
            ctx.fillStyle = '#fff';
            let ex = sx + cellSize/2;
            let ey = sy + cellSize/2;
            let eyeOff = cellSize * 0.15;
            ctx.beginPath();
            ctx.arc(ex - eyeOff, ey, 3, 0, Math.PI*2);
            ctx.arc(ex + eyeOff, ey, 3, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 30);
    ctx.fillText(`BEST: ${highScore}`, 150, 30);
    
    // Detection meter
    let meterW = 200;
    let meterX = W - meterW - 30;
    ctx.fillStyle = '#333';
    ctx.fillRect(meterX, 15, meterW, 24);
    let detColor = detection < 50 ? '#ff8800' : detection < 75 ? '#ff4400' : '#ff0000';
    ctx.fillStyle = detColor;
    ctx.fillRect(meterX, 15, meterW * (detection/100), 24);
    ctx.strokeStyle = '#666';
    ctx.strokeRect(meterX, 15, meterW, 24);
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`DETECTION ${Math.round(detection)}%`, meterX + meterW/2, 30);
    
    // Warning flash
    if (detection > 50) {
        let flash = Math.sin(animFrame * 0.3) * 0.3 + 0.3;
        ctx.fillStyle = `rgba(255, 0, 0, ${flash})`;
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('⚠ DETECTED ⚠', W/2, H - 30);
    }
    
    if (state === 'gameover') {
        drawGameOver();
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SNEAK SNAKE', W/2, H/2 - 100);
    
    // Subtitle
    ctx.fillStyle = '#888';
    ctx.font = '16px monospace';
    ctx.fillText('A Stealth Snake Game', W/2, H/2 - 70);
    
    // Instructions
    let instructions = [
        '🐍 You are a stealthy snake on a grid.',
        '',
        '⬆⬇⬅➡  Arrow Keys to move',
        '',
        '👁 Guards patrol and watch for you.',
   ️'If seen (red cross range), detection fills up.',
        '',
        '🌑 Hide in SHADOW tiles (dark blue) to become invisible.',
        '🧱 Walls block line of sight.',
        '',
        '✨ Eat golden food to score points & grow.',
        '',
        'If detection reaches 100% — you\'re caught!',
        '',
        'Press any key to start!'
    ];
    
    ctx.fillStyle = '#ccc';
    ctx.font = '14px monospace';
    let startY = H/2 - 30;
    for (let i = 0; i < instructions.length; i++) {
        ctx.fillText(instructions[i], W/2, startY + i * 22);
    }
    
    // Animated snake decoration
    let t = animFrame * 0.05;
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 20; i++) {
        let x = W/2 - 100 + i * 10;
        let y = H - 60 + Math.sin(t + i * 0.5) * 10;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ff4444';
    ctx.font = 'bold 42px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('DETECTED!', W/2, H/2 - 40);
    
    ctx.fillStyle = '#fff';
    ctx.font = '24px monospace';
    ctx.fillText(`Score: ${score}`, W/2, H/2 + 10);
    ctx.fillText(`Best: ${highScore}`, W/2, H/2 + 45);
    
    ctx.fillStyle = '#888';
    ctx.font = '16px monospace';
    ctx.fillText('Press R or Enter to try again', W/2, H/2 + 90);
}

function gameLoop() {
    animFrame++;
    draw();
    requestAnimationFrame(gameLoop);
}

initGame();
state = 'start';
gameLoop();
})();
</script>
</body>
</html>
