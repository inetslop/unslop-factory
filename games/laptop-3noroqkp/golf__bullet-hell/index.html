<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Bullet Hell</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a4d1a; display: flex; align-items: center; justify-content: center; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'cup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'death') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'start') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover, win
let player = { x: 0, y: 0, r: 12, lives: 3, invincible: 0 };
let bullets = [];
let particles = [];
let cup = { x: 0, y: 0, r: 25 };
let hole = 1;
const maxHoles = 5;
let score = 0;
let shakeTime = 0;
let shakeMag = 0;
let time = 0;
let patternTimer = 0;
let patternInterval = 0;
let keys = {};

// Input
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if ((gameState === 'gameover' || gameState === 'win') && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    gameState = 'playing';
    player.x = W / 2;
    player.y = H - 80;
    player.lives = 3;
    player.invincible = 0;
    hole = 1;
    score = 0;
    bullets = [];
    particles = [];
    time = 0;
    patternTimer = 0;
    setupHole();
    playSound('start');
}

function setupHole() {
    cup.x = W * (0.2 + Math.random() * 0.6);
    cup.y = H * (0.15 + Math.random() * 0.3);
    patternTimer = 0;
    patternInterval = Math.max(40, 90 - hole * 12);
}

function spawnPattern(type) {
    const diff = hole;
    if (type === 0) {
        // Radial burst from corner
        const cx = Math.random() < 0.5 ? -20 : W + 20;
        const cy = Math.random() * H;
        const count = 8 + diff * 3;
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i + time * 0.1;
            bullets.push({ x: cx, y: cy, vx: Math.cos(a) * (2 + diff * 0.3), vy: Math.sin(a) * (2 + diff * 0.3), r: 5 + diff, color: `hsl(${(time * 50 + i * 20) % 360},100%,60%)` });
        }
    } else if (type === 1) {
        // Fan from top
        const cx = Math.random() * W;
        const count = 5 + diff * 2;
        for (let i = 0; i < count; i++) {
            const a = -Math.PI / 4 + (Math.PI / 2) * (i / (count - 1));
            bullets.push({ x: cx, y: -20, vx: Math.cos(a) * (3 + diff * 0.5), vy: Math.sin(a) * (3 + diff * 0.5), r: 6, color: `hsl(${(time * 80 + i * 40) % 360},100%,55%)` });
        }
    } else if (type === 2) {
        // Ring burst from center-ish
        const cx = W / 2 + (Math.random() - 0.5) * W * 0.4;
        const cy = H / 2 + (Math.random() - 0.5) * H * 0.4;
        const count = 12 + diff * 4;
        for (let i = 0; i < count; i++) {
            const a = (Math.PI * 2 / count) * i;
            bullets.push({ x: cx, y: cy, vx: Math.cos(a) * (1.5 + diff * 0.4), vy: Math.sin(a) * (1.5 + diff * 0.4), r: 5, color: `hsl(${(time * 60) % 360},90%,50%)` });
        }
    } else if (type === 3) {
        // Aimed shots at player
        const count = 2 + diff;
        for (let i = 0; i < count; i++) {
            const a = Math.atan2(player.y - H / 2, player.x - W / 2) + (Math.random() - 0.5) * 1.2;
            const sx = Math.random() < 0.5 ? -20 : W + 20;
            bullets.push({ x: sx, y: H / 2, vx: Math.cos(a) * (3 + diff * 0.5), vy: Math.sin(a) * (3 + diff * 0.5), r: 7, color: `hsl(0,100%,${50 + Math.random() * 30}%)` });
        }
    } else if (type === 4) {
        // Spiral
        const cx = W / 2;
        const cy = H * 0.3;
        for (let i = 0; i < 4 + diff; i++) {
            const a = time * 3 + (Math.PI * 2 / (4 + diff)) * i;
            bullets.push({ x: cx, y: cy, vx: Math.cos(a) * (2.5 + diff * 0.3), vy: Math.sin(a) * (2.5 + diff * 0.3), r: 5, color: `hsl(${(time * 100 + i * 60) % 360},100%,60%)` });
        }
    } else if (type === 5) {
        // Chaos - multiple sources
        const sources = 2 + Math.floor(diff / 2);
        for (let s = 0; s < sources; s++) {
            const sx = Math.random() * W;
            const sy = -10;
            const count = 3 + diff;
            for (let i = 0; i < count; i++) {
                const a = Math.PI / 2 + (Math.random() - 0.5) * 1.5;
                bullets.push({ x: sx, y: sy, vx: Math.cos(a) * (2 + diff * 0.4), vy: Math.sin(a) * (2 + diff * 0.4), r: 5 + Math.random() * 3, color: `hsl(${Math.random() * 60},100%,${40 + Math.random() * 40}%)` });
            }
        }
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 30 + Math.random() * 20, maxLife: 50, r: 2 + Math.random() * 3, color });
    }
}

function hitPlayer() {
    if (player.invincible > 0) return;
    player.lives--;
    player.invincible = 90;
    shakeTime = 15;
    shakeMag = 8;
    playSound('death');
    spawnParticles(player.x, player.y, '#ffffff', 20);
    if (player.lives <= 0) {
        gameState = 'gameover';
    }
}

function update() {
    if (gameState !== 'playing') return;
    time++;
    
    // Player movement
    const speed = 4;
    let dx = 0, dy = 0;
    if (keys['KeyW'] || keys['ArrowUp']) dy -= speed;
    if (keys['KeyS'] || keys['ArrowDown']) dy += speed;
    if (keys['KeyA'] || keys['ArrowLeft']) dx -= speed;
    if (keys['KeyD'] || keys['ArrowRight']) dx += speed;
    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
    player.x += dx;
    player.y += dy;
    player.x = Math.max(player.r, Math.min(W - player.r, player.x));
    player.y = Math.max(player.r, Math.min(H - player.r, player.y));
    
    if (player.invincible > 0) player.invincible--;
    
    // Cup collision
    const cupDist = Math.hypot(player.x - cup.x, player.y - cup.y);
    if (cupDist < cup.r * 0.7) {
        hole++;
        score += 100 * hole;
        playSound('cup');
        spawnParticles(cup.x, cup.y, '#ffdd00', 30);
        bullets = [];
        if (hole > maxHoles) {
            gameState = 'win';
        } else {
            setupHole();
        }
    }
    
    // Spawn patterns
    patternTimer++;
    if (patternTimer >= patternInterval) {
        patternTimer = 0;
        const type = Math.floor(Math.random() * (2 + hole));
        spawnPattern(type % 6);
    }
    
    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
            bullets.splice(i, 1);
            continue;
        }
        // Collision with player
        const dist = Math.hypot(b.x - player.x, b.y - player.y);
        if (dist < b.r + player.r * 0.7) {
            hitPlayer();
            bullets.splice(i, 1);
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Shake decay
    if (shakeTime > 0) shakeTime--;
}

function drawGolfCourse() {
    // Background - green with mowing stripes
    const stripeW = W / 8;
    for (let i = 0; i < 8; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#2d7a2d' : '#349a34';
        ctx.fillRect(i * stripeW, 0, stripeW + 1, H);
    }
    // Subtle texture dots
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i < 50; i++) {
        const tx = (i * 173 + time * 0.1) % W;
        const ty = (i * 251) % H;
        ctx.beginPath();
        ctx.arc(tx, ty, 1, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawCup() {
    // Cup shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(cup.x, cup.y + 5, cup.r * 1.2, cup.r * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cup
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(cup.x, cup.y, cup.r, cup.r * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    // Cup rim
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(cup.x, cup.y, cup.r, cup.r * 0.7, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Flag
    const flagWave = Math.sin(time * 0.1) * 3;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cup.x, cup.y - 5);
    ctx.lineTo(cup.x, cup.y - 40);
    ctx.stroke();
    ctx.fillStyle = `hsl(${(time * 3) % 360},80%,60%)`;
    ctx.beginPath();
    ctx.moveTo(cup.x, cup.y - 40);
    ctx.lineTo(cup.x + 15 + flagWave, cup.y - 35);
    ctx.lineTo(cup.x, cup.y - 28);
    ctx.closePath();
    ctx.fill();
}

function drawPlayer() {
    if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;
    // Ball shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(player.x + 2, player.y + 4, player.r * 0.9, player.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Ball
    const grad = ctx.createRadialGradient(player.x - 3, player.y - 3, 2, player.x, player.y, player.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#cccccc');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();
    // Dimples
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for (let i = 0; i < 5; i++) {
        const a = (Math.PI * 2 / 5) * i + time * 0.02;
        const dx = Math.cos(a) * player.r * 0.4;
        const dy = Math.sin(a) * player.r * 0.4;
        ctx.beginPath();
        ctx.arc(player.x + dx, player.y + dy, 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawBullets() {
    for (const b of bullets) {
        // Glow
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2);
        ctx.fill();
        // Core
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.beginPath();
        ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    // Lives - golf balls
    for (let i = 0; i < player.lives; i++) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(30 + i * 30, 30, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    // Hole number
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`HOLE ${hole}/${maxHoles}`, 20, 65);
    // Score
    ctx.textAlign = 'right';
    ctx.fillText(`SCORE: ${score}`, W - 20, 30);
    // Warning
    if (patternTimer > patternInterval * 0.7) {
        ctx.fillStyle = `rgba(255,100,0,${(patternTimer / patternInterval) * 0.5})`;
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('⚠ INCOMING ⚠', W / 2, H - 20);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#1a4d1a';
    ctx.fillRect(0, 0, W, H);
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(W/12, 60)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('GOLF BULLET HEL', W / 2, H * 0.3);
    
    // Subtitle
    ctx.font = `${Math.min(W/30, 18)}px monospace`;
    ctx.fillStyle = '#aaffaa';
    ctx.fillText('Dodge the deadly shots. Sink your putt.', W / 2, H * 0.42);
    
    // Controls
    ctx.font = `${Math.min(W/35, 16)}px monospace`;
    ctx.fillStyle = '#ccc';
    const lines = [
        'WASD / Arrow Keys - Move',
        'Reach the cup to advance holes',
        `Survive ${maxHoles} holes to win!`,
        '',
        'Press SPACE or ENTER to start'
    ];
    lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, H * 0.55 + i * 28);
    });
    
    // Decorative bullets
    for (let i = 0; i < 12; i++) {
        const a = time * 0.02 + (Math.PI * 2 / 12) * i;
        const r = Math.min(W, H) * 0.35;
        const bx = W / 2 + Math.cos(a) * r;
        const by = H * 0.3 + Math.sin(a) * r * 0.3;
        ctx.fillStyle = `hsl(${(time * 2 + i * 30) % 360},80%,60%)`;
        ctx.beginPath();
        ctx.arc(bx, by, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${Math.min(W/10, 50)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('PUTT FAILED!', W / 2, H * 0.35);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W/25, 20)}px monospace`;
    ctx.fillText(`Final Score: ${score}`, W / 2, H * 0.48);
    ctx.fillText(`Reached Hole: ${hole}/${maxHoles}`, W / 2, H * 0.55);
    ctx.fillStyle = '#aaffaa';
    ctx.font = `${Math.min(W/30, 16)}px monospace`;
    ctx.fillText('Press SPACE / R to try again', W / 2, H * 0.7);
}

function drawWin() {
    ctx.fillStyle = 'rgba(0,0,50,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffdd44';
    ctx.font = `bold ${Math.min(W/10, 50)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('HOLE IN ONE!', W / 2, H * 0.3);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W/25, 20)}px monospace`;
    ctx.fillText(`Score: ${score}`, W / 2, H * 0.45);
    ctx.fillStyle = '#aaffaa';
    ctx.font = `${Math.min(W/30, 16)}px monospace`;
    ctx.fillText('You conquered the golf bullet hell!', W / 2, H * 0.55);
    ctx.fillText('Press SPACE / R to play again', W / 2, H * 0.7);
}

function render() {
    ctx.save();
    
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeMag;
        const sy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(sx, sy);
    }
    
    if (gameState === 'start') {
        drawStartScreen();
    } else {
        drawGolfCourse();
        drawCup();
        drawBullets();
        drawParticles();
        drawPlayer();
        drawHUD();
        if (gameState === 'gameover') drawGameOver();
        if (gameState === 'win') drawWin();
    }
    
    ctx.restore();
}

let lastTime = 0;
function gameLoop(timestamp) {
    const dt = timestamp - lastTime;
    lastTime = timestamp;
    update();
    render();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
