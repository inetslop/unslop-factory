<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pinball Stealth</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; font-family: monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let lives = 3;
let frameCount = 0;

// Table dimensions
function getTable() {
    const tw = Math.min(W * 0.85, 700);
    const th = Math.min(H * 0.92, 600);
    const tx = (W - tw) / 2;
    const ty = (H - th) / 2;
    return { x: tx, y: ty, w: tw, h: th };
}

let table;

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };

// Flippers
let leftFlipper, rightFlipper;

function createFlippers() {
    const t = getTable();
    const fw = 70;
    const fy = t.y + t.h - 20;
    leftFlipper = {
        pivot: { x: t.x + t.w * 0.35, y: fy },
        angle: Math.PI / 4,
        targetAngle: Math.PI / 4,
        restAngle: Math.PI / 4,
        upAngle: -Math.PI / 6,
        length: fw,
        active: false
    };
    rightFlipper = {
        pivot: { x: t.x + t.w * 0.65, y: fy },
        angle: Math.PI - Math.PI / 4,
        targetAngle: Math.PI - Math.PI / 4,
        restAngle: Math.PI - Math.PI / 4,
        upAngle: Math.PI + Math.PI / 6,
        length: fw,
        active: false
    };
}

// Plunger
let plunger = { pulled: false, power: 0, active: true };

// Guards
let guards = [];
function createGuards() {
    const t = getTable();
    guards = [
        { x: t.x + t.w * 0.25, y: t.y + t.h * 0.3, r: 18, detectR: 60, alert: false, alertTimer: 0, speed: 1.2, path: [{x: t.x+t.w*0.25, y: t.y+t.h*0.3}, {x: t.x+t.w*0.45, y: t.y+t.h*0.2}, {x: t.x+t.w*0.25, y: t.y+t.h*0.15}, {x: t.x+t.w*0.1, y: t.y+t.h*0.3}], pathIdx: 0, angle: 0 },
        { x: t.x + t.w * 0.7, y: t.y + t.h * 0.25, r: 18, detectR: 60, alert: false, alertTimer: 0, speed: 1.0, path: [{x: t.x+t.w*0.7, y: t.y+t.h*0.25}, {x: t.x+t.w*0.85, y: t.y+t.h*0.4}, {x: t.x+t.w*0.65, y: t.y+t.h*0.45}, {x: t.x+t.w*0.5, y: t.y+t.h*0.3}], pathIdx: 0, angle: 0 },
        { x: t.x + t.w * 0.5, y: t.y + t.h * 0.55, r: 18, detectR: 55, alert: false, alertTimer: 0, speed: 1.5, path: [{x: t.x+t.w*0.5, y: t.y+t.h*0.55}, {x: t.x+t.w*0.7, y: t.y+t.h*0.6}, {x: t.x+t.w*0.5, y: t.y+t.h*0.7}, {x: t.x+t.w*0.3, y: t.y+t.h*0.6}], pathIdx: 0, angle: 0 }
    ];
}

// Chips
let chips = [];
function createChips() {
    const t = getTable();
    chips = [
        { x: t.x + t.w * 0.15, y: t.y + t.h * 0.2, collected: false },
        { x: t.x + t.w * 0.5, y: t.y + t.h * 0.15, collected: false },
        { x: t.x + t.w * 0.85, y: t.y + t.h * 0.35, collected: false },
        { x: t.x + t.w * 0.3, y: t.y + t.h * 0.65, collected: false },
        { x: t.x + t.w * 0.75, y: t.y + t.h * 0.75, collected: false }
    ];
}

// Noise rings
let noises = [];

// Particles
let particles = [];

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 3 + 1;
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30 + Math.random()*20, color });
    }
}

// Walls (line segments)
let walls = [];
function createWalls() {
    const t = getTable();
    walls = [
        // Outer walls
        { x1: t.x, y1: t.y, x2: t.x, y2: t.y + t.h },           // left
        { x1: t.x + t.w, y1: t.y, x2: t.x + t.w, y2: t.y + t.h }, // right
        { x1: t.x, y1: t.y, x2: t.x + t.w, y2: t.y },              // top
        // Inner bumpers/obstacles
        { x1: t.x + t.w*0.35, y1: t.y + t.h*0.4, x2: t.x + t.w*0.65, y2: t.y + t.h*0.4 },
        { x1: t.x + t.w*0.2, y1: t.y + t.h*0.8, x2: t.x + t.w*0.3, y2: t.y + t.h*0.75 },
        { x1: t.x + t.w*0.7, y1: t.y + t.h*0.8, x2: t.x + t.w*0.8, y2: t.y + t.h*0.75 },
    ];
}

// Bumpers (circular)
let bumpers = [];
function createBumpers() {
    const t = getTable();
    bumpers = [
        { x: t.x + t.w * 0.2, y: t.y + t.h * 0.5, r: 15 },
        { x: t.x + t.w * 0.8, y: t.y + t.h * 0.55, r: 15 },
        { x: t.x + t.w * 0.5, y: t.y + t.h * 0.35, r: 20 }
    ];
}

function resetBall() {
    const t = getTable();
    ball.x = t.x + t.w / 2;
    ball.y = t.y + t.h - 40;
    ball.vx = 0;
    ball.vy = 0;
    plunger.active = true;
    plunger.pulled = false;
    plunger.power = 0;
}

function startGame() {
    table = getTable();
    score = 0;
    lives = 3;
    frameCount = 0;
    createFlippers();
    createGuards();
    createChips();
    createWalls();
    createBumpers();
    resetBall();
    noises = [];
    particles = [];
    gameState = 'playing';
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if ((gameState === 'gameover' || gameState === 'win') && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Physics
function updateBall() {
    if (!plunger.active) return;
    
    // Gravity
    ball.vy += 0.35;
    
    // Friction
    ball.vx *= 0.998;
    
    // Move
    ball.x += ball.vx;
    ball.y += ball.vy;
    
    // Wall collisions
    const t = getTable();
    // Top
    if (ball.y - ball.r < t.y) { ball.y = t.y + ball.r; ball.vy = -ball.vy * 0.8; }
    // Left
    if (ball.x - ball.r < t.x) { ball.x = t.x + ball.r; ball.vx = -ball.vx * 0.8; }
    // Right
    if (ball.x + ball.r > t.x + t.w) { ball.x = t.x + t.w - ball.r; ball.vx = -ball.vx * 0.8; }
    
    // Bottom (between flippers is the drain)
    const fy = t.y + t.h;
    if (ball.y + ball.r > fy) {
        // Check if between flipper pivots (drain area)
        const lfPivotX = leftFlipper.pivot.x;
        const rfPivotX = rightFlipper.pivot.x;
        if (ball.x > lfPivotX - 10 && ball.x < rfPivotX + 10 && ball.y > fy - 30) {
            // Drain!
            loseLife();
            return;
        }
        ball.y = fy - ball.r;
        ball.vy = -ball.vy * 0.8;
    }
    
    // Wall segment collisions
    for (let w of walls) {
        if (segmentCircleCollision(w.x1, w.y1, w.x2, w.y2, ball.x, ball.y, ball.r)) {
            resolveWallBounce(w);
        }
    }
    
    // Bumper collisions
    for (let b of bumpers) {
        const dx = ball.x - b.x;
        const dy = ball.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < ball.r + b.r) {
            const nx = dx / dist;
            const ny = dy / dist;
            ball.x = b.x + nx * (ball.r + b.r);
            ball.y = b.y + ny * (ball.r + b.r);
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            ball.vx *= 1.3;
            ball.vy *= 1.3;
            playSound(200, 0.15, 'square', 0.08);
        }
    }
    
    // Flipper collisions
    checkFlipperCollision(leftFlipper);
    checkFlipperCollision(rightFlipper);
}

function segmentCircleCollision(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len === 0) return false;
    const t = Math.max(0, Math.min(1, ((cx-x1)*dx + (cy-y1)*dy) / (len*len)));
    const px = x1 + t * dx;
    const py = y1 + t * dy;
    const dist = Math.sqrt((cx-px)*(cx-px) + (cy-py)*(cy-py));
    return dist < r;
}

function resolveWallBounce(w) {
    const dx = w.x2 - w.x1;
    const dy = w.y2 - w.y1;
    const len = Math.sqrt(dx*dx + dy*dy);
    let nx = -dy / len;
    let ny = dx / len;
    // Make sure normal points toward ball
    const mx = (w.x1+w.x2)/2;
    const my = (w.y1+w.y2)/2;
    if ((ball.x - mx) * nx + (ball.y - my) * ny < 0) { nx = -nx; ny = -ny; }
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) {
        ball.vx -= 2 * dot * nx * 0.8;
        ball.vy -= 2 * dot * ny * 0.8;
    }
}

function checkFlipperCollision(flip) {
    const px = flip.pivot.x;
    const py = flip.pivot.y;
    const ex = px + Math.cos(flip.angle) * flip.length;
    const ey = py + Math.sin(flip.angle) * flip.length;
    
    if (segmentCircleCollision(px, py, ex, ey, ball.x, ball.y, ball.r + 4)) {
        const dx = ball.x - px;
        const dy = ball.y - py;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);
        
        // Push out
        ball.x = px + nx * (ball.r + 5);
        ball.y = py + ny * (ball.r + 5);
        
        // Bounce
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * nx * 0.7;
            ball.vy -= 2 * dot * ny * 0.7;
        }
        
        // If flipper is active (moving up), add extra impulse
        if (flip.active) {
            ball.vy -= 8;
            ball.vx += (ball.x < px ? -3 : 3);
        }
    }
}

function updateFlippers() {
    const leftActive = keys['KeyA'] || keys['ArrowLeft'];
    const rightActive = keys['KeyD'] || keys['ArrowRight'];
    
    // Left flipper
    if (leftActive) {
        if (!leftFlipper.active) { playSound(150, 0.1, 'square', 0.05); createNoise(leftFlipper.pivot.x, leftFlipper.pivot.y); }
        leftFlipper.active = true;
        leftFlipper.angle += (leftFlipper.upAngle - leftFlipper.angle) * 0.4;
    } else {
        leftFlipper.active = false;
        leftFlipper.angle += (leftFlipper.restAngle - leftFlipper.angle) * 0.15;
    }
    
    // Right flipper
    if (rightActive) {
        if (!rightFlipper.active) { playSound(150, 0.1, 'square', 0.05); createNoise(rightFlipper.pivot.x, rightFlipper.pivot.y); }
        rightFlipper.active = true;
        rightFlipper.angle += (rightFlipper.upAngle - rightFlipper.angle) * 0.4;
    } else {
        rightFlipper.active = false;
        rightFlipper.angle += (rightFlipper.restAngle - rightFlipper.angle) * 0.15;
    }
}

function createNoise(x, y) {
    noises.push({ x, y, r: 10, maxR: 80, life: 40 });
}

function updatePlunger() {
    if (!plunger.active) return;
    if (keys['Space']) {
        plunger.pulled = true;
        plunger.power = Math.min(plunger.power + 2, 15);
    } else if (plunger.pulled) {
        plunger.pulled = false;
        ball.vy = -plunger.power;
        ball.vx = (Math.random() - 0.5) * 3;
        plunger.power = 0;
        plunger.active = false;
        playSound(400, 0.2, 'sawtooth', 0.1);
    }
}

function updateGuards() {
    for (let g of guards) {
        // Move along path
        const target = g.path[g.pathIdx];
        const dx = target.x - g.x;
        const dy = target.y - g.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < 5) {
            g.pathIdx = (g.pathIdx + 1) % g.path.length;
        } else {
            let speed = g.speed;
            if (g.alert) speed *= 2.5;
            
            // If alert, move toward ball instead
            let tx = target.x;
            let ty = target.y;
            if (g.alert) {
                tx = ball.x;
                ty = ball.y;
                const adx = tx - g.x;
                const ady = ty - g.y;
                const adist = Math.sqrt(adx*adx + ady*ady);
                g.x += (adx/adist) * speed;
                g.y += (ady/adist) * speed;
            } else {
                g.x += (dx/dist) * speed;
                g.y += (dy/dist) * speed;
            }
        }
        
        // Detection
        const bdx = ball.x - g.x;
        const bdy = ball.y - g.y;
        const bdist = Math.sqrt(bdx*bdx + bdy*bdy);
        
        if (g.alert) {
            g.alertTimer--;
            if (g.alertTimer <= 0) {
                g.alert = false;
                g.pathIdx = 0;
            }
        } else if (bdist < g.detectR && plunger.active) {
            g.alert = true;
            g.alertTimer = 180;
            playSound(600, 0.3, 'sawtooth', 0.15);
        }
        
        // Noise attraction
        for (let n of noises) {
            const ndx = n.x - g.x;
            const ndy = n.y - g.y;
            const ndist = Math.sqrt(ndx*ndx + ndy*ndy);
            if (ndist < n.r && !g.alert) {
                g.speed = Math.min(g.speed + 0.3, 3);
            }
        }
        
        // Clamp to table
        const t = getTable();
        g.x = Math.max(t.x + g.r, Math.min(t.x + t.w - g.r, g.x));
        g.y = Math.max(t.y + g.r, Math.min(t.y + t.h - g.r, g.y));
        
        // Catch check
        if (bdist < g.r + ball.r && plunger.active) {
            loseLife();
        }
    }
}

function updateNoises() {
    for (let i = noises.length - 1; i >= 0; i--) {
        noises[i].r += 2;
        noises[i].life--;
        if (noises[i].life <= 0 || noises[i].r > noises[i].maxR) {
            noises.splice(i, 1);
        }
    }
}

function updateChips() {
    for (let c of chips) {
        if (c.collected) continue;
        const dx = ball.x - c.x;
        const dy = ball.y - c.y;
        if (Math.sqrt(dx*dx + dy*dy) < ball.r + 12) {
            c.collected = true;
            score += 100;
            playSound(800, 0.3, 'sine', 0.2);
            spawnParticles(c.x, c.y, '#00ffcc', 15);
            if (chips.every(ch => ch.collected)) {
                gameState = 'win';
                score += lives * 200;
                playSound(600, 0.5, 'sine', 0.3);
                setTimeout(() => playSound(800, 0.5, 'sine', 0.3), 150);
            }
        }
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        particles[i].vx *= 0.95;
        particles[i].vy *= 0.95;
        particles[i].life--;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
}

function loseLife() {
    lives--;
    playSound(200, 0.4, 'sawtooth', 0.2);
    spawnParticles(ball.x, ball.y, '#ff3333', 20);
    if (lives <= 0) {
        gameState = 'gameover';
    } else {
        resetBall();
    }
}

// Rendering
function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    if (gameState === 'start') {
        drawStartScreen();
        return;
    }
    
    const t = getTable();
    
    // Table background
    ctx.fillStyle = '#12122a';
    ctx.fillRect(t.x, t.y, t.w, t.h);
    
    // Walls
    ctx.strokeStyle = '#4466aa';
    ctx.lineWidth = 3;
    for (let w of walls) {
        ctx.beginPath();
        ctx.moveTo(w.x1, w.y1);
        ctx.lineTo(w.x2, w.y2);
        ctx.stroke();
    }
    
    // Outer border glow
    ctx.strokeStyle = '#4466aa';
    ctx.lineWidth = 4;
    ctx.strokeRect(t.x, t.y, t.w, t.h);
    
    // Bumpers
    for (let b of bumpers) {
        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, '#ff6644');
        grad.addColorStop(1, '#aa3322');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Noises
    for (let n of noises) {
        ctx.strokeStyle = `rgba(100, 150, 255, ${n.life / 40 * 0.5})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.stroke();
    }
    
    // Chips
    for (let c of chips) {
        if (c.collected) continue;
        const pulse = Math.sin(frameCount * 0.1) * 3;
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 10 + pulse;
        ctx.beginPath();
        ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Guards
    for (let g of guards) {
        // Detection radius
        ctx.strokeStyle = g.alert ? 'rgba(255,50,50,0.3)' : 'rgba(100,200,255,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.detectR, 0, Math.PI * 2);
        ctx.stroke();
        
        // Body
        const gColor = g.alert ? '#ff3333' : '#44ccff';
        ctx.fillStyle = gColor;
        ctx.shadowColor = gColor;
        ctx.shadowBlur = g.alert ? 15 : 8;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Eye
        const ex = ball.x - g.x;
        const ey = ball.y - g.y;
        const ea = Math.atan2(ey, ex);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(g.x + Math.cos(ea)*8, g.y + Math.sin(ea)*8, 4, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Flippers
    drawFlipper(leftFlipper);
    drawFlipper(rightFlipper);
    
    // Ball
    if (plunger.active || plunger.pulled) {
        const ballGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, ball.r);
        ballGrad.addColorStop(0, '#ffffff');
        ballGrad.addColorStop(1, '#88aaff');
        ctx.fillStyle = ballGrad;
        ctx.shadowColor = '#88aaff';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Particles
    for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 50;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Plunger indicator
    if (plunger.active) {
        ctx.fillStyle = plunger.pulled ? '#ff4444' : '#44ff44';
        ctx.fillRect(t.x + t.w/2 - 5, t.y + t.h - 15 - plunger.power * 3, 10, plunger.power * 3);
    }
    
    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, t.x + 10, t.y - 15);
    ctx.fillText(`Lives: ${'❤'.repeat(lives)}`, t.x + 150, t.y - 15);
    
    const collected = chips.filter(c => c.collected).length;
    ctx.textAlign = 'right';
    ctx.fillText(`Chips: ${collected}/${chips.length}`, t.x + t.w - 10, t.y - 15);
    
    // Game over / Win overlay
    if (gameState === 'gameover' || gameState === 'win') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = gameState === 'win' ? '#00ffcc' : '#ff4444';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(gameState === 'win' ? 'MISSION COMPLETE!' : 'CAUGHT!', W/2, H/2 - 30);
        ctx.fillStyle = '#fff';
        ctx.font = '24px monospace';
        ctx.fillText(`Final Score: ${score}`, W/2, H/2 + 20);
        ctx.font = '18px monospace';
        ctx.fillText('Press SPACE or R to restart', W/2, H/2 + 60);
    }
}

function drawFlipper(f) {
    const ex = f.pivot.x + Math.cos(f.angle) * f.length;
    const ey = f.pivot.y + Math.sin(f.angle) * f.length;
    ctx.strokeStyle = '#ffaa33';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(f.pivot.x, f.pivot.y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    // Pivot dot
    ctx.fillStyle = '#ffcc66';
    ctx.beginPath();
    ctx.arc(f.pivot.x, f.pivot.y, 6, 0, Math.PI*2);
    ctx.fill();
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Title glow
    const pulse = Math.sin(frameCount * 0.05) * 5;
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 20 + pulse;
    ctx.fillStyle = '#00ffcc';
    ctx.font = 'bold 52px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PINBALL STEALTH', W/2, H/2 - 80);
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#aaccff';
    ctx.font = '18px monospace';
    const lines = [
        'Navigate the ball through a guarded table.',
        'Collect all 5 data chips without being caught.',
        '',
        'CONTROLS:',
        '  SPACE  - Pull & release plunger (launch)',
        '  A / ←  - Left flipper',
        '  D / →  - Right flipper',
        '',
        'STEALTH TIPS:',
        '  • Stay out of guard detection zones (blue circles)',
        '  • Guards turn RED and chase when they spot you!',
        '  • Flipper use creates noise that speeds up guards',
        '  • Avoid the drain between flippers - lose a life!'
    ];
    let y = H/2 - 30;
    for (let line of lines) {
        ctx.fillText(line, W/2, y);
        y += 28;
    }
    
    ctx.fillStyle = '#ffffff';
    ctx.font = '20px monospace';
    const blink = Math.sin(frameCount * 0.1) > 0;
    if (blink) ctx.fillText('Press SPACE to start', W/2, H - 40);
}

// Main loop
function update() {
    if (gameState !== 'playing') return;
    
    updatePlunger();
    updateFlippers();
    updateBall();
    updateGuards();
    updateNoises();
    updateChips();
    updateParticles();
}

function loop() {
    frameCount++;
    update();
    draw();
    requestAnimationFrame(loop);
}

// Init
table = getTable();
createFlippers();
createGuards();
createChips();
createWalls();
createBumpers();
resetBall();
loop();
</script>
</body>
</html>
