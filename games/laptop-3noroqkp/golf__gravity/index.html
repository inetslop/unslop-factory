<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Gravity</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#ui-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
pointer-events: none; z-index: 10;
}
#hud {
position: absolute; top: 15px; left: 15px; color: #fff; font-size: 18px;
text-shadow: 0 0 4px rgba(0,0,0,0.5);
}
#hud span { display: inline-block; margin-right: 20px; }
#restart-btn {
position: absolute; top: 15px; right: 15px; padding: 8px 16px;
background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
color: #fff; font-size: 14px; cursor: pointer; border-radius: 6px;
pointer-events: auto; transition: background 0.2s;
}
#restart-btn:hover { background: rgba(255,255,255,0.3); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-overlay">
<div id="hud">
<span id="level-display">Level 1</span>
<span id="stroke-display">Strokes: 0</span>
</div>
<button id="restart-btn">↻ Restart</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
if (type === 'hit') {
osc.type = 'sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
osc.start(); osc.stop(audioCtx.currentTime + 0.2);
} else if (type === 'bounce') {
osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
osc.start(); osc.stop(audioCtx.currentTime + 0.1);
} else if (type === 'score') {
osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
osc.frequency.setValueAtTime(550, audioCtx.currentTime + 0.1);
osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.2);
gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
osc.start(); osc.stop(audioCtx.currentTime + 0.5);
} else if (type === 'fail') {
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.4);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}
}

// Game state
let gameState = 'start'; // start, playing, levelComplete, gameOver
let currentLevel = 0;
let strokes = 0;
let totalStrokes = 0;
let particles = [];
let trail = [];
let messageTimer = 0;
let messageText = '';

const GRAVITY = 0.4;
const BOUNCE_DAMPING = 0.7;
const BALL_RADIUS = 10;
const CUP_RADIUS = 22;
const MAX_POWER = 15;

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, inCup: false, active: false };
let aiming = false;
let aimStart = { x: 0, y: 0 };
let aimCurrent = { x: 0, y: 0 };

// Levels
const levels = [
{
ballPos: { x: 0.15, y: 0.7 },
cupPos: { x: 0.8, y: 0.7 },
walls: [],
obstacles: [
{ type: 'platform', x: 0.45, y: 0.5, w: 0.15, h: 0.03 }
],
par: 2
},
{
ballPos: { x: 0.1, y: 0.8 },
cupPos: { x: 0.85, y: 0.4 },
walls: [],
obstacles: [
{ type: 'platform', x: 0.35, y: 0.65, w: 0.12, h: 0.03 },
{ type: 'platform', x: 0.6, y: 0.45, w: 0.12, h: 0.03 }
],
par: 3
},
{
ballPos: { x: 0.1, y: 0.85 },
cupPos: { x: 0.9, y: 0.85 },
walls: [],
obstacles: [
{ type: 'wall', x: 0.4, y: 0.5, w: 0.03, h: 0.35 },
{ type: 'platform', x: 0.6, y: 0.7, w: 0.1, h: 0.03 },
{ type: 'wall', x: 0.75, y: 0.4, w: 0.03, h: 0.3 }
],
par: 4
},
{
ballPos: { x: 0.1, y: 0.8 },
cupPos: { x: 0.5, y: 0.2 },
walls: [],
obstacles: [
{ type: 'platform', x: 0.3, y: 0.6, w: 0.1, h: 0.03 },
{ type: 'platform', x: 0.55, y: 0.45, w: 0.1, h: 0.03 },
{ type: 'wall', x: 0.7, y: 0.6, w: 0.03, h: 0.25 }
],
par: 4
},
{
ballPos: { x: 0.1, y: 0.85 },
cupPos: { x: 0.9, y: 0.3 },
walls: [],
obstacles: [
{ type: 'platform', x: 0.25, y: 0.7, w: 0.08, h: 0.03 },
{ type: 'wall', x: 0.4, y: 0.5, w: 0.03, h: 0.3 },
{ type: 'platform', x: 0.55, y: 0.6, w: 0.1, h: 0.03 },
{ type: 'wall', x: 0.72, y: 0.4, w: 0.03, h: 0.25 },
{ type: 'platform', x: 0.82, y: 0.45, w: 0.1, h: 0.03 }
],
par: 5
}
];

function loadLevel(idx) {
const lvl = levels[idx];
ball.x = lvl.ballPos.x * W;
ball.y = lvl.ballPos.y * H;
ball.vx = 0; ball.vy = 0;
ball.inCup = false;
ball.active = true;
strokes = 0;
trail = [];
particles = [];
aiming = false;
updateHUD();
}

function updateHUD() {
document.getElementById('level-display').textContent = 'Level ' + (currentLevel + 1);
document.getElementById('stroke-display').textContent = 'Strokes: ' + strokes;
}

function getObstacles() {
const lvl = levels[currentLevel];
return lvl.obstacles.map(o => ({
type: o.type,
x: o.x * W, y: o.y * H, w: o.w * W, h: o.h * H
}));
}

function getCupPos() {
const lvl = levels[currentLevel];
return { x: lvl.cupPos.x * W, y: lvl.cupPos.y * H };
}

function getBallStart() {
const lvl = levels[currentLevel];
return { x: lvl.ballPos.x * W, y: lvl.ballPos.y * H };
}

// Particles
function spawnParticles(x, y, count, color) {
for (let i = 0; i < count; i++) {
const angle = Math.random() * Math.PI * 2;
const speed = Math.random() * 4 + 1;
particles.push({
x: x, y: y,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed - 2,
life: 1,
decay: 0.015 + Math.random() * 0.02,
size: Math.random() * 4 + 2,
color: color || (Math.random() > 0.5 ? '#4fc3f7' : '#fff176')
});
}
}

// Physics
function updatePhysics() {
if (!ball.active) return;
if (ball.inCup) return;

ball.vy += GRAVITY;
ball.x += ball.vx;
ball.y += ball.vy;

trail.push({ x: ball.x, y: ball.y });
if (trail.length > 30) trail.shift();

// Floor bounce
if (ball.y + BALL_RADIUS > H) {
ball.y = H - BALL_RADIUS;
ball.vy *= -BOUNCE_DAMPING;
ball.vx *= 0.95;
if (Math.abs(ball.vy) > 1) playSound('bounce');
}

// Ceiling
if (ball.y - BALL_RADIUS < 0) {
ball.y = BALL_RADIUS;
ball.vy *= -BOUNCE_DAMPING;
}

// Walls
if (ball.x - BALL_RADIUS < 0) {
ball.x = BALL_RADIUS;
ball.vx *= -BOUNCE_DAMPING;
if (Math.abs(ball.vx) > 1) playSound('bounce');
}
if (ball.x + BALL_RADIUS > W) {
ball.x = W - BALL_RADIUS;
ball.vx *= -BOUNCE_DAMPING;
if (Math.abs(ball.vx) > 1) playSound('bounce');
}

// Obstacle collisions
const obstacles = getObstacles();
for (let obs of obstacles) {
if (obs.type === 'platform') {
// Top bounce
if (ball.vy > 0 && ball.y + BALL_RADIUS >= obs.y && ball.y + BALL_RADIUS <= obs.y + obs.h + Math.abs(ball.vy) + 2 && ball.x >= obs.x - BALL_RADIUS && ball.x <= obs.x + obs.w + BALL_RADIUS) {
ball.y = obs.y - BALL_RADIUS;
ball.vy *= -BOUNCE_DAMPING;
ball.vx *= 0.95;
if (Math.abs(ball.vy) > 1) playSound('bounce');
}
// Bottom bounce
if (ball.vy < 0 && ball.y - BALL_RADIUS <= obs.y + obs.h && ball.y - BALL_RADIUS >= obs.y - Math.abs(ball.vy) - 2 && ball.x >= obs.x - BALL_RADIUS && ball.x <= obs.x + obs.w + BALL_RADIUS) {
ball.y = obs.y + obs.h + BALL_RADIUS;
ball.vy *= -BOUNCE_DAMPING;
}
// Sides
if (ball.vx > 0 && ball.x + BALL_RADIUS >= obs.x && ball.x + BALL_RADIUS <= obs.x + obs.w + Math.abs(ball.vx) + 2 && ball.y >= obs.y - BALL_RADIUS && ball.y <= obs.y + obs.h + BALL_RADIUS) {
ball.x = obs.x - BALL_RADIUS;
ball.vx *= -BOUNCE_DAMPING;
}
if (ball.vx < 0 && ball.x - BALL_RADIUS <= obs.x + obs.w && ball.x - BALL_RADIUS >= obs.x - Math.abs(ball.vx) - 2 && ball.y >= obs.y - BALL_RADIUS && ball.y <= obs.y + obs.h + BALL_RADIUS) {
ball.x = obs.x + obs.w + BALL_RADIUS;
ball.vx *= -BOUNCE_DAMPING;
}
} else if (obs.type === 'wall') {
// Top/Bottom of wall
if (ball.vy > 0 && ball.y + BALL_RADIUS >= obs.y && ball.y + BALL_RADIUS <= obs.y + obs.h + Math.abs(ball.vy) + 2 && ball.x >= obs.x - BALL_RADIUS && ball.x <= obs.x + obs.w + BALL_RADIUS) {
ball.y = obs.y - BALL_RADIUS;
ball.vy *= -BOUNCE_DAMPING;
if (Math.abs(ball.vy) > 1) playSound('bounce');
}
if (ball.vy < 0 && ball.y - BALL_RADIUS <= obs.y + obs.h && ball.y - BALL_RADIUS >= obs.y - Math.abs(ball.vy) - 2 && ball.x >= obs.x - BALL_RADIUS && ball.x <= obs.x + obs.w + BALL_RADIUS) {
ball.y = obs.y + obs.h + BALL_RADIUS;
ball.vy *= -BOUNCE_DAMPING;
}
// Sides of wall
if (ball.vx > 0 && ball.x + BALL_RADIUS >= obs.x && ball.x + BALL_RADIUS <= obs.x + obs.w + Math.abs(ball.vx) + 2 && ball.y >= obs.y - BALL_RADIUS && ball.y <= obs.y + obs.h + BALL_RADIUS) {
ball.x = obs.x - BALL_RADIUS;
ball.vx *= -BOUNCE_DAMPING;
playSound('bounce');
}
if (ball.vx < 0 && ball.x - BALL_RADIUS <= obs.x + obs.w && ball.x - BALL_RADIUS >= obs.x - Math.abs(ball.vx) - 2 && ball.y >= obs.y - BALL_RADIUS && ball.y <= obs.y + obs.h + BALL_RADIUS) {
ball.x = obs.x + obs.w + BALL_RADIUS;
ball.vx *= -BOUNCE_DAMPING;
playSound('bounce');
}
}
}

// Cup check
const cup = getCupPos();
const dx = ball.x - cup.x;
const dy = ball.y - cup.y;
const dist = Math.sqrt(dx * dx + dy * dy);
if (dist < CUP_RADIUS && Math.abs(ball.vx) < 8 && Math.abs(ball.vy) < 8) {
ball.inCup = true;
ball.active = false;
ball.x = cup.x;
ball.y = cup.y;
gameState = 'levelComplete';
messageTimer = 120;
totalStrokes += strokes;
playSound('score');
spawnParticles(cup.x, cup.y - 20, 40);
}

// Stop ball if very slow and on ground
if (Math.abs(ball.vx) < 0.3 && Math.abs(ball.vy) < 0.3 && ball.y + BALL_RADIUS >= H - 1) {
ball.vx = 0; ball.vy = 0;
ball.active = false;
}

// Ball fell off or stopped without scoring -> allow retry of shot
if (!ball.active && !ball.inCup) {
// Do nothing, player can re-aim
}
}

function updateParticles() {
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
p.x += p.vx;
p.y += p.vy;
p.vy += 0.2;
p.life -= p.decay;
if (p.life <= 0) particles.splice(i, 1);
}
}

// Rendering
function drawBackground() {
const grad = ctx.createLinearGradient(0, 0, 0, H);
grad.addColorStop(0, '#0f3460');
grad.addColorStop(1, '#1a1a2e');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, W, H);

// Stars
ctx.fillStyle = 'rgba(255,255,255,0.3)';
for (let i = 0; i < 50; i++) {
const sx = (i * 137 + 50) % W;
const sy = (i * 97 + 30) % (H * 0.6);
ctx.beginPath();
ctx.arc(sx, sy, 1, 0, Math.PI * 2);
ctx.fill();
}
}

function drawObstacles() {
const obstacles = getObstacles();
for (let obs of obstacles) {
ctx.fillStyle = '#546e7a';
ctx.strokeStyle = '#90a4ae';
ctx.lineWidth = 2;
if (obs.type === 'platform') {
ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
// Grass top
ctx.fillStyle = '#66bb6a';
ctx.fillRect(obs.x, obs.y, obs.w, 4);
} else if (obs.type === 'wall') {
ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
}
}
}

function drawCup() {
const cup = getCupPos();
ctx.fillStyle = '#37474f';
ctx.beginPath();
ctx.arc(cup.x, cup.y, CUP_RADIUS, 0, Math.PI);
ctx.fill();

ctx.strokeStyle = '#4fc3f7';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(cup.x, cup.y, CUP_RADIUS, 0, Math.PI * 2);
ctx.stroke();

// Flag
ctx.strokeStyle = '#fff';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(cup.x, cup.y - CUP_RADIUS);
ctx.lineTo(cup.x, cup.y - CUP_RADIUS - 30);
ctx.stroke();

ctx.fillStyle = '#ef5350';
ctx.beginPath();
ctx.moveTo(cup.x, cup.y - CUP_RADIUS - 30);
ctx.lineTo(cup.x + 15, cup.y - CUP_RADIUS - 22);
ctx.lineTo(cup.x, cup.y - CUP_RADIUS - 14);
ctx.fill();

// Glow
ctx.fillStyle = 'rgba(79,195,247,0.1)';
ctx.beginPath();
ctx.arc(cup.x, cup.y, CUP_RADIUS + 5, 0, Math.PI * 2);
ctx.fill();
}

function drawBall() {
if (!ball.active && !ball.inCup) return;

// Trail
for (let i = 0; i < trail.length; i++) {
const alpha = (i / trail.length) * 0.3;
ctx.fillStyle = `rgba(255,255,255,${alpha})`;
const size = (i / trail.length) * BALL_RADIUS * 0.6;
ctx.beginPath();
ctx.arc(trail[i].x, trail[i].y, size, 0, Math.PI * 2);
ctx.fill();
}

// Ball
let bx = ball.x, by = ball.y;
if (ball.inCup) { by += 5; }

ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(bx, by, BALL_RADIUS, 0, Math.PI * 2);
ctx.fill();

// Dimples
ctx.fillStyle = 'rgba(0,0,0,0.1)';
for (let i = 0; i < 5; i++) {
const a = (i / 5) * Math.PI * 2;
ctx.beginPath();
ctx.arc(bx + Math.cos(a) * 4, by + Math.sin(a) * 4, 1.5, 0, Math.PI * 2);
ctx.fill();
}

// Shadow
if (!ball.inCup) {
ctx.fillStyle = 'rgba(0,0,0,0.2)';
ctx.beginPath();
ctx.ellipse(bx, H - 3, BALL_RADIUS * 0.7, 4, 0, 0, Math.PI * 2);
ctx.fill();
}
}

function drawAim() {
if (!aiming) return;

const dx = aimStart.x - aimCurrent.x;
const dy = aimStart.y - aimCurrent.y;
const dist = Math.sqrt(dx * dx + dy * dy);
const power = Math.min(dist / 15, MAX_POWER);
const angle = Math.atan2(dy, dx);

// Power indicator
ctx.strokeStyle = 'rgba(79,195,247,0.6)';
ctx.lineWidth = 3;
ctx.setLineDash([5, 5]);
ctx.beginPath();
ctx.moveTo(ball.x, ball.y);
const lineLen = power * 8;
ctx.lineTo(ball.x + Math.cos(angle) * lineLen, ball.y + Math.sin(angle) * lineLen);
ctx.stroke();
ctx.setLineDash([]);

// Arrow head
const ax = ball.x + Math.cos(angle) * lineLen;
const ay = ball.y + Math.sin(angle) * lineLen;
ctx.fillStyle = '#4fc3f7';
ctx.beginPath();
ctx.moveTo(ax, ay);
ctx.lineTo(ax - Math.cos(angle - 0.4) * 12, ay - Math.sin(angle - 0.4) * 12);
ctx.lineTo(ax - Math.cos(angle + 0.4) * 12, ay - Math.sin(angle + 0.4) * 12);
ctx.fill();

// Power bar
const barW = 60;
const barH = 8;
const bx = ball.x - barW / 2;
const by = ball.y - 35;
ctx.fillStyle = 'rgba(0,0,0,0.4)';
ctx.fillRect(bx, by, barW, barH);
const pct = power / MAX_POWER;
const barColor = pct < 0.5 ? '#66bb6a' : pct < 0.8 ? '#fff176' : '#ef5350';
ctx.fillStyle = barColor;
ctx.fillRect(bx, by, barW * pct, barH);
ctx.strokeStyle = 'rgba(255,255,255,0.4)';
ctx.lineWidth = 1;
ctx.strokeRect(bx, by, barW, barH);

// Trajectory preview dots
const vx = Math.cos(angle) * power;
const vy = Math.sin(angle) * power;
let px = ball.x, py = ball.y, pvx = vx, pvy = vy;
ctx.fillStyle = 'rgba(255,255,255,0.3)';
for (let i = 0; i < 20; i++) {
pvy += GRAVITY;
px += pvx;
py += pvy;
if (i % 3 === 0) {
ctx.beginPath();
ctx.arc(px, py, 2, 0, Math.PI * 2);
ctx.fill();
}
if (py > H || px < 0 || px > W) break;
}
}

function drawParticles() {
for (let p of particles) {
ctx.globalAlpha = p.life;
ctx.fillStyle = p.color;
ctx.beginPath();
ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
ctx.fill();
}
ctx.globalAlpha = 1;
}

function drawStartScreen() {
drawBackground();
const cx = W / 2, cy = H / 2;

// Title
ctx.fillStyle = '#fff';
ctx.font = 'bold 52px Segoe UI, Arial';
ctx.textAlign = 'center';
ctx.fillText('⛳ GOLF GRAVITY', cx, cy - 80);

// Subtitle
ctx.font = '20px Segoe UI, Arial';
ctx.fillStyle = '#4fc3f7';
ctx.fillText('Use gravity and physics to sink the ball!', cx, cy - 30);

// Instructions
ctx.font = '16px Segoe UI, Arial';
ctx.fillStyle = 'rgba(255,255,255,0.8)';
ctx.fillText('Click & drag from the ball to aim and set power', cx, cy + 20);
ctx.fillText('Release to hit. Sink the ball in the cup!', cx, cy + 45);
ctx.fillText('Complete all 5 levels with as few strokes as possible.', cx, cy + 70);

// Start button
const btnW = 200, btnH = 50;
const btnX = cx - btnW / 2, btnY = cy + 110;
ctx.fillStyle = 'rgba(79,195,247,0.2)';
ctx.strokeStyle = '#4fc3f7';
ctx.lineWidth = 2;
roundRect(ctx, btnX, btnY, btnW, btnH, 10);
ctx.fill();
ctx.stroke();

ctx.fillStyle = '#fff';
ctx.font = 'bold 22px Segoe UI, Arial';
ctx.fillText('START GAME', cx, cy + 142);

// Decorative ball
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(cx - 150, cy + 130, 12, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = 'rgba(0,0,0,0.1)';
for (let i = 0; i < 5; i++) {
const a = (i / 5) * Math.PI * 2 + 0.5;
ctx.beginPath();
ctx.arc(cx - 150 + Math.cos(a) * 5, cy + 130 + Math.sin(a) * 5, 2, 0, Math.PI * 2);
ctx.fill();
}

// Decorative cup
const cpX = cx + 150, cpY = cy + 142;
ctx.fillStyle = '#37474f';
ctx.beginPath();
ctx.arc(cpX, cpY, 18, 0, Math.PI);
ctx.fill();
ctx.strokeStyle = '#4fc3f7';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(cpX, cpY, 18, 0, Math.PI * 2);
ctx.stroke();
ctx.strokeStyle = '#fff';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(cpX, cpY - 18);
ctx.lineTo(cpX, cpY - 40);
ctx.stroke();
ctx.fillStyle = '#ef5350';
ctx.beginPath();
ctx.moveTo(cpX, cpY - 40);
ctx.lineTo(cpX + 12, cpY - 33);
ctx.lineTo(cpX, cpY - 26);
ctx.fill();
}

function drawLevelComplete() {
const cx = W / 2, cy = H / 2;
ctx.fillStyle = 'rgba(0,0,0,0.5)';
ctx.fillRect(0, 0, W, H);

ctx.fillStyle = '#fff';
ctx.font = 'bold 42px Segoe UI, Arial';
ctx.textAlign = 'center';
ctx.fillText('🏌️ HOLE IN ONE AREA!', cx, cy - 60);

ctx.font = '24px Segoe UI, Arial';
ctx.fillStyle = '#4fc3f7';
ctx.fillText(`Strokes: ${strokes} (Par: ${levels[currentLevel].par})`, cx, cy - 15);

const par = levels[currentLevel].par;
let comment = '';
if (strokes <= 1) comment = 'Eagle! Incredible! 🌟';
else if (strokes === 2) comment = 'Birdie! Beautiful! ✨';
else if (strokes === par) comment = 'Par! Well done! 👏';
else comment = 'Over par, but you made it! 💪';

ctx.font = '18px Segoe UI, Arial';
ctx.fillStyle = '#fff176';
ctx.fillText(comment, cx, cy + 25);

const btnW = 200, btnH = 50;
const btnX = cx - btnW / 2, btnY = cy + 60;
ctx.fillStyle = 'rgba(79,195,247,0.2)';
ctx.strokeStyle = '#4fc3f7';
ctx.lineWidth = 2;
roundRect(ctx, btnX, btnY, btnW, btnH, 10);
ctx.fill();
ctx.stroke();

ctx.fillStyle = '#fff';
ctx.font = 'bold 20px Segoe UI, Arial';
if (currentLevel < levels.length - 1) {
ctx.fillText('NEXT LEVEL →', cx, cy + 92);
} else {
ctx.fillText('FINISH 🏆', cx, cy + 92);
}

// Total score
ctx.font = '16px Segoe UI, Arial';
ctx.fillStyle = 'rgba(255,255,255,0.7)';
ctx.fillText(`Total Strokes: ${totalStrokes}`, cx, cy + 140);
}

function drawGameOver() {
const cx = W / 2, cy = H / 2;
ctx.fillStyle = 'rgba(0,0,0,0.6)';
ctx.fillRect(0, 0, W, H);

ctx.fillStyle = '#fff';
ctx.font = 'bold 48px Segoe UI, Arial';
ctx.textAlign = 'center';
ctx.fillText('🏆 GAME COMPLETE!', cx, cy - 80);

ctx.font = '24px Segoe UI, Arial';
ctx.fillStyle = '#4fc3f7';
ctx.fillText(`Total Strokes: ${totalStrokes}`, cx, cy - 30);

let rating = '';
if (totalStrokes <= 15) rating = '🌟 LEGENDARY! 🌟';
else if (totalStrokes <= 20) rating = '⭐ PRO PLAYER! ⭐';
else if (totalStrokes <= 28) rating = '👍 SOLID GOLF! 👍';
else rating = '⛳ KEPT SWINGING! ⛳';

ctx.font = '20px Segoe UI, Arial';
ctx.fillStyle = '#fff176';
ctx.fillText(rating, cx, cy + 15);

const btnW = 200, btnH = 50;
const btnX = cx - btnW / 2, btnY = cy + 55;
ctx.fillStyle = 'rgba(79,195,247,0.2)';
ctx.strokeStyle = '#4fc3f7';
ctx.lineWidth = 2;
roundRect(ctx, btnX, btnY, btnW, btnH, 10);
ctx.fill();
ctx.stroke();

ctx.fillStyle = '#fff';
ctx.font = 'bold 20px Segoe UI, Arial';
ctx.fillText('PLAY AGAIN', cx, cy + 87);
}

function roundRect(ctx, x, y, w, h, r) {
ctx.beginPath();
ctx.moveTo(x + r, y);
ctx.lineTo(x + w - r, y);
ctx.quadraticCurveTo(x + w, y, x + w, y + r);
ctx.lineTo(x + w, y + h - r);
ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
ctx.lineTo(x + r, y + h);
ctx.quadraticCurveTo(x, y + h, x, y + h - r);
ctx.lineTo(x, y + r);
ctx.quadraticCurveTo(x, y, x + r, y);
ctx.closePath();
}

function drawFloor() {
ctx.fillStyle = '#2e7d32';
ctx.fillRect(0, H - 6, W, 6);
ctx.fillStyle = '#43a047';
ctx.fillRect(0, H - 6, W, 3);
}

// Main loop
function gameLoop() {
if (gameState === 'start') {
drawStartScreen();
} else if (gameState === 'playing' || gameState === 'levelComplete') {
updatePhysics();
updateParticles();
drawBackground();
drawFloor();
drawObstacles();
drawCup();
drawBall();
drawAim();
drawParticles();

if (gameState === 'levelComplete') {
drawLevelComplete();
}
} else if (gameState === 'gameOver') {
updateParticles();
drawBackground();
drawFloor();
drawObstacles();
drawCup();
drawBall();
drawParticles();
drawGameOver();
}

requestAnimationFrame(gameLoop);
}

// Input
function getPos(e) {
const rect = canvas.getBoundingClientRect();
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;
return { x: clientX - rect.left, y: clientY - rect.top };
}

function onDown(e) {
e.preventDefault();
initAudio();
const pos = getPos(e);

if (gameState === 'start') {
// Check start button
const cx = W / 2, cy = H / 2;
const btnW = 200, btnH = 50;
const btnX = cx - btnW / 2, btnY = cy + 110;
if (pos.x >= btnX && pos.x <= btnX + btnW && pos.y >= btnY && pos.y <= btnY + btnH) {
gameState = 'playing';
currentLevel = 0;
totalStrokes = 0;
loadLevel(0);
}
return;
}

if (gameState === 'levelComplete') {
const cx = W / 2, cy = H / 2;
const btnW = 200, btnH = 50;
const btnX = cx - btnW / 2, btnY = cy + 60;
if (pos.x >= btnX && pos.x <= btnX + btnW && pos.y >= btnY && pos.y <= btnY + btnH) {
currentLevel++;
if (currentLevel < levels.length) {
gameState = 'playing';
loadLevel(currentLevel);
} else {
gameState = 'gameOver';
}
}
return;
}

if (gameState === 'gameOver') {
const cx = W / 2, cy = H / 2;
const btnW = 200, btnH = 50;
const btnX = cx - btnW / 2, btnY = cy + 55;
if (pos.x >= btnX && pos.x <= btnX + btnW && pos.y >= btnY && pos.y <= btnY + btnH) {
gameState = 'start';
}
return;
}

if (gameState === 'playing' && ball.active) {
const dx = pos.x - ball.x;
const dy = pos.y - ball.y;
const dist = Math.sqrt(dx * dx + dy * dy);
if (dist < 60) {
aiming = true;
aimStart = { x: ball.x, y: ball.y };
aimCurrent = pos;
}
}
}

function onMove(e) {
e.preventDefault();
if (!aiming) return;
const pos = getPos(e);
aimCurrent = pos;
}

function onUp(e) {
e.preventDefault();
if (!aiming) return;
aiming = false;

const dx = aimStart.x - aimCurrent.x;
const dy = aimStart.y - aimCurrent.y;
const dist = Math.sqrt(dx * dx + dy * dy);
const power = Math.min(dist / 15, MAX_POWER);

if (power < 0.5) return; // Too weak, ignore

ball.vx = (dx / dist) * power;
ball.vy = (dy / dist) * power;
strokes++;
trail = [];
updateHUD();
playSound('hit');
}

window.addEventListener('mousedown', onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
window.addEventListener('touchstart', onDown, { passive: false });
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', (e) => { e.preventDefault(); if (aiming) { const dx = aimStart.x - aimCurrent.x; const dy = aimStart.y - aimCurrent.y; const dist = Math.sqrt(dx*dx+dy*dy); const power = Math.min(dist/15,MAX_POWER); if(power<0.5){aiming=false;return;} ball.vx=(dx/dist)*power; ball.vy=(dy/dist)*power; strokes++; trail=[]; updateHUD(); playSound('hit'); } aiming = false; }, { passive: false });

// Restart button
document.getElementById('restart-btn').addEventListener('click', () => {
if (gameState === 'playing') {
loadLevel(currentLevel);
totalStrokes -= strokes;
} else if (gameState === 'levelComplete' || gameState === 'gameOver') {
gameState = 'start';
}
});

// Keyboard restart
window.addEventListener('keydown', (e) => {
if (e.key === 'r' || e.key === 'R') {
if (gameState === 'playing') loadLevel(currentLevel);
else gameState = 'start';
}
if (e.key === 'Escape') gameState = 'start';
});

// Start
loadLevel(0);
gameLoop();
</script>
</body>
</html>
