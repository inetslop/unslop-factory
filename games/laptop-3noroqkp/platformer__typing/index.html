<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeRunner - Platformer Typing Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

const WORDS = [
    "jump","run","dash","leap","fly","spin","dash","block",
    "sword","fire","ice","bolt","nova","pulse","surge","flare",
    "ghost","phantom","shade","wisp","spark","ember","flame",
    "crystal","prism","shard","facet","gemstone","diamond","ruby",
    "thunder","lightning","storm","gale","tempest","cyclone",
    "magma","basalt","granite","marble","obsidian","quartz",
    "nebula","cosmos","galaxy","stellar","lunar","solar","orbital",
    "plasma","ionize","fission","fusion","quantum","photon","electron"
];

const ENEMY_NAMES = [
    "slime","goblin","imp","sprite","will-o-wisp","demon","wraith",
    "specter","phantom","revenant","ghoul","vampire","lich","necromancer",
    "baron","countess","duke","marquis","squire","knight-errant",
    "pyromancer","cryomancer","geomancer","aetheric","voidwalker",
    "shadow-stalker","dusk-bringer","dawn-breaker","star-forged"
];

let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('typerunner_high') || '0'); } catch(e) {}
let health = 5;
let maxHealth = 5;
let speed = 3;
let elapsed = 0;
let lastTime = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

// Player
let player = { x: 100, y: 0, vy: 0, grounded: true, w: 24, h: 32, animFrame: 0, animTimer: 0 };

// Platforms
let platforms = [];
let enemies = [];
let particles = [];
let projectiles = [];
let clouds = [];
let stars = [];
let bgOffset = 0;

// Typing
let currentWord = null;
let typedChars = '';
let typeProgress = 0;
let enemyQueue = [];
let spawnTimer = 0;
let nextSpawn = 2000;

function initStars() {
    stars = [];
    for (let i = 0; i < 60; i++) {
        stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, size: Math.random() * 2 + 0.5, speed: Math.random() * 0.3 + 0.1 });
    }
}

function initClouds() {
    clouds = [];
    for (let i = 0; i < 8; i++) {
        clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.4 + 50, w: Math.random() * 120 + 60, speed: Math.random() * 0.5 + 0.2 });
    }
}

function generatePlatforms(startX) {
    let lastY = H - 80;
    for (let i = 0; i < 8; i++) {
        let gap = 120 + Math.random() * 60;
        let w = 150 + Math.random() * 100;
        let y = lastY + (Math.random() - 0.5) * 80;
        y = Math.max(100, Math.min(H - 120, y));
        platforms.push({ x: startX + i * gap + w, y: y, w: w, h: 20 });
        lastY = y;
    }
}

function spawnEnemy() {
    const name = ENEMY_NAMES[Math.floor(Math.random() * ENEMY_NAMES.length)];
    const word = WORDS[Math.floor(Math.random() * WORDS.length)];
    const useName = Math.random() > 0.5;
    const text = useName ? name : word;
    const ey = 80 + Math.random() * (H - 250);
    enemies.push({
        x: W + 100,
        y: ey,
        w: text.length * 10 + 30,
        h: 36,
        text: text.toUpperCase(),
        typed: '',
        hp: 1,
        maxHp: 1,
        bobTimer: Math.random() * Math.PI * 2,
        color: `hsl(${Math.random() * 360}, 70%, 50%)`
    });
}

function spawnParticle(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 1,
            color: color,
            size: Math.random() * 4 + 2
        });
    }
}

function resetGame() {
    score = 0;
    health = maxHealth;
    speed = 3;
    elapsed = 0;
    player.x = 100;
    player.y = H - 120;
    player.vy = 0;
    player.grounded = true;
    platforms = [];
    enemies = [];
    particles = [];
    projectiles = [];
    typedChars = '';
    currentWord = null;
    shakeTimer = 0;
    initStars();
    initClouds();
    generatePlatforms(200);
    nextSpawn = 1500;
}

function startGame() {
    resetGame();
    gameState = 'playing';
}

// Input
let keysDown = {};
window.addEventListener('keydown', (e) => {
    if (gameState === 'start') {
        initAudio();
        startGame();
        return;
    }
    if (gameState === 'gameover') {
        if (e.key === 'Enter' || e.key === ' ') {
            initAudio();
            startGame();
        }
        return;
    }
    if (gameState !== 'playing') return;

    keysDown[e.key] = true;

    if (e.key.length === 1 && (e.key === e.key.toLowerCase())) {
        // Type a character
        const lowerKey = e.key.toLowerCase();
        let targetEnemy = null;

        // Find the closest enemy to target
        for (let i = 0; i < enemies.length; i++) {
            if (!targetEnemy || enemies[i].x < targetEnemy.x) {
                targetEnemy = enemies[i];
            }
        }

        if (targetEnemy) {
            const nextChar = targetEnemy.text[targetEnemy.typed.length].toLowerCase();
            if (lowerKey === nextChar) {
                targetEnemy.typed += e.key;
                playSound(400 + Math.random() * 200, 0.05, 'square', 0.05);

                if (targetEnemy.typed.length === targetEnemy.text.length) {
                    // Enemy destroyed!
                    destroyEnemy(targetEnemy);
                }
            } else {
                // Wrong key - reset progress
                targetEnemy.typed = '';
                playSound(150, 0.1, 'sawtooth', 0.08);
                shakeTimer = 0.1;
                shakeIntensity = 3;
            }
        }
    }

    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
        if (player.grounded) {
            player.vy = -12;
            player.grounded = false;
            playSound(300, 0.1, 'square', 0.06);
        }
    }
});

window.addEventListener('keyup', (e) => {
    keysDown[e.key] = false;
});

function destroyEnemy(enemy) {
    const idx = enemies.indexOf(enemy);
    if (idx === -1) return;
    enemies.splice(idx, 1);
    score += enemy.text.length * 10;
    spawnParticle(enemy.x + enemy.w / 2, enemy.y, enemy.color, 15);
    playSound(600, 0.15, 'square', 0.1);
    playSound(800, 0.2, 'square', 0.08);

    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('typerunner_high', highScore.toString()); } catch(e) {}
    }
}

function update(dt) {
    if (gameState !== 'playing') return;

    elapsed += dt;
    speed = 3 + elapsed * 0.02;

    // Scroll world
    const scrollSpeed = speed * 60 * dt;
    bgOffset += scrollSpeed * 0.3;

    // Update stars
    for (let s of stars) {
        s.x -= s.speed * scrollSpeed * 0.5;
        if (s.x < -10) { s.x = W + 10; s.y = Math.random() * H * 0.6; }
    }

    // Update clouds
    for (let c of clouds) {
        c.x -= c.speed * scrollSpeed * 0.2;
        if (c.x + c.w < -50) { c.x = W + 100; c.y = Math.random() * H * 0.4 + 50; }
    }

    // Update platforms
    for (let p of platforms) { p.x -= scrollSpeed; }
    while (platforms.length > 0 && platforms[0].x + platforms[0].w < -50) {
        platforms.shift();
    }
    if (platforms.length < 8) {
        const lastP = platforms[platforms.length - 1];
        generatePlatforms(lastP ? lastP.x : W + 200);
    }

    // Player physics
    player.vy += 30 * dt;
    player.y += player.vy;

    // Platform collision
    player.grounded = false;
    for (let p of platforms) {
        if (player.x + player.w > p.x && player.x < p.x + p.w) {
            if (player.y + player.h >= p.y && player.y + player.h <= p.y + 20 && player.vy >= 0) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.grounded = true;
            }
        }
    }

    // Fall off screen
    if (player.y > H + 50) {
        health--;
        shakeTimer = 0.3;
        shakeIntensity = 8;
        playSound(100, 0.3, 'sawtooth', 0.15);
        player.y = H - 200;
        player.vy = 0;
        // Find nearest platform and place on it
        let bestP = null;
        for (let p of platforms) {
            if (!bestP || Math.abs(p.x - player.x) < Math.abs(bestP.x - player.x)) bestP = p;
        }
        if (bestP) { player.y = bestP.y - player.h; }
    }

    // Player animation
    player.animTimer += dt;
    if (player.animTimer > 0.15) {
        player.animTimer = 0;
        player.animFrame = (player.animFrame + 1) % 4;
    }

    // Spawn enemies
    nextSpawn -= dt * 1000;
    if (nextSpawn <= 0) {
        spawnEnemy();
        nextSpawn = Math.max(800, 2500 - elapsed * 50) + Math.random() * 1000;
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x -= scrollSpeed;
        e.bobTimer += dt * 3;
        e.y += Math.sin(e.bobTimer) * 0.3;

        // Enemy reaches player
        if (e.x + e.w < player.x + player.w && e.x > player.x - e.w) {
            if (Math.abs(e.y - player.y) < 80) {
                health--;
                shakeTimer = 0.2;
                shakeIntensity = 5;
                playSound(120, 0.2, 'sawtooth', 0.12);
                spawnParticle(player.x + player.w / 2, player.y + player.h / 2, '#ff4444', 8);
                enemies.splice(i, 1);
            }
        }

        // Remove off-screen
        if (e.x < -150) {
            enemies.splice(i, 1);
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 5 * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Shake
    if (shakeTimer > 0) shakeTimer -= dt;

    // Game over
    if (health <= 0) {
        gameState = 'gameover';
        playSound(80, 0.5, 'sawtooth', 0.2);
    }
}

function draw() {
    ctx.save();

    // Screen shake
    if (shakeTimer > 0) {
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(sx, sy);
    }

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f0c29');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Stars
    ctx.fillStyle = '#ffffff';
    for (let s of stars) {
        ctx.globalAlpha = 0.5 + Math.sin(elapsed * 2 + s.x) * 0.3;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    // Clouds
    ctx.fillStyle = 'rgba(100, 80, 160, 0.15)';
    for (let c of clouds) {
        ctx.beginPath();
        ctx.ellipse(c.x + c.w / 2, c.y, c.w / 2, 20, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Platforms
    for (let p of platforms) {
        const pg = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        pg.addColorStop(0, '#4a90d9');
        pg.addColorStop(1, '#2c5f8a');
        ctx.fillStyle = pg;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(p.x, p.y, p.w, 3);
    }

    // Enemies (words)
    for (let e of enemies) {
        const progress = e.typed.length / e.text.length;

        // Enemy body
        ctx.fillStyle = 'rgba(20, 20, 40, 0.9)';
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 2;
        roundRect(ctx, e.x, e.y, e.w + (1 - progress) * 20, e.h, 6);
        ctx.fill();
        ctx.stroke();

        // Text
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'left';
        const startX = e.x + 8;
        let tx = startX;
        for (let i = 0; i < e.text.length; i++) {
            if (i < e.typed.length) {
                ctx.fillStyle = '#4eff4e';
            } else if (i === e.typed.length) {
                ctx.fillStyle = '#ffff44';
            } else {
                ctx.fillStyle = e.color;
            }
            ctx.fillText(e.text[i], tx, e.y + 23);
            tx += 10;
        }

        // Progress bar
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x, e.y - 8, e.w + (1-progress)*20, 4);
        ctx.fillStyle = '#4eff4e';
        ctx.fillRect(e.x, e.y - 8, (e.w + (1-progress)*20) * progress, 4);

        // Enemy face (simple)
        const faceX = e.x + 12;
        const faceY = e.y + e.h / 2;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(faceX - 3, faceY, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(faceX + 5, faceY, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Particles
    for (let p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Player
    drawPlayer();

    // HUD
    drawHUD();

    ctx.restore();
}

function drawPlayer() {
    const px = player.x;
    const py = player.y;
    const frame = player.animFrame;

    // Body
    ctx.fillStyle = '#ff6b35';
    ctx.fillRect(px + 4, py + 8, 16, 16);

    // Head
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(px + 6, py, 12, 10);

    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(px + 8, py + 3, 3, 3);
    ctx.fillRect(px + 14, py + 3, 3, 3);

    // Legs (animated)
    ctx.fillStyle = '#ff6b35';
    if (!player.grounded) {
        // Jumping pose
        ctx.fillRect(px + 5, py + 24, 5, 8);
        ctx.fillRect(px + 14, py + 24, 5, 8);
    } else {
        const legOff = Math.sin(frame * Math.PI / 2) * 3;
        ctx.fillRect(px + 5, py + 24, 5, 8 - legOff);
        ctx.fillRect(px + 14, py + 24, 5, 8 + legOff);
    }

    // Sword (glowing)
    ctx.fillStyle = '#87ceeb';
    ctx.save();
    ctx.translate(px + 20, py + 12);
    ctx.rotate(-0.3);
    ctx.fillRect(0, -2, 14, 4);
    ctx.restore();

    // Glow effect
    ctx.fillStyle = 'rgba(135, 206, 235, 0.2)';
    ctx.beginPath();
    ctx.arc(px + 28, py + 10, 8, 0, Math.PI * 2);
    ctx.fill();
}

function drawHUD() {
    // Health bar
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(15, 15, 204, 30);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(15, 15, 204, 30);

    for (let i = 0; i < maxHealth; i++) {
        const hx = 20 + i * 38;
        if (i < health) {
            ctx.fillStyle = i < 2 ? '#ff4444' : (i < 4 ? '#ffaa00' : '#44ff44');
        } else {
            ctx.fillStyle = '#333';
        }
        // Heart shape (simplified)
        ctx.fillRect(hx, 22, 14, 6);
        ctx.fillRect(hx + 2, 28, 10, 6);
        ctx.fillRect(hx, 28, 6, 4);
        ctx.fillRect(hx + 8, 28, 6, 4);
    }

    // Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, H - 25);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`BEST: ${highScore}`, 20, H - 8);

    // Speed indicator
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`SPD: ${speed.toFixed(1)}x`, W - 20, 35);
}

function drawStartScreen() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0f0c29');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Animated background stars for start screen
    const t = performance.now() / 1000;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
        const sx = ((i * 97 + t * 20) % W);
        const sy = (i * 53) % (H * 0.7);
        ctx.globalAlpha = 0.3 + Math.sin(t * 2 + i) * 0.3;
        ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Title
    ctx.fillStyle = '#ff6b35';
    ctx.font = `bold ${Math.min(72, W/10)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('TYPE RUNNER', W / 2, H * 0.25);

    // Subtitle
    ctx.fillStyle = '#87ceeb';
    ctx.font = `${Math.min(18, W/30)}px monospace`;
    ctx.fillText('A Platformer Typing Game', W / 2, H * 0.33);

    // Instructions
    const instructions = [
        'TYPE WORDS TO DEFEAT ENEMIES',
        '',
        'SPACE / W / UP - JUMP',
        'TYPE THE APPEARING WORDS IN ORDER',
        'DON\'T LET ENEMIES REACH YOU!',
        '',
        `HIGH SCORE: ${highScore}`
    ];

    ctx.font = `${Math.min(16, W/40)}px monospace`;
    ctx.fillStyle = '#ccc';
    instructions.forEach((line, i) => {
        ctx.fillText(line, W / 2, H * 0.45 + i * 30);
    });

    // Blinking prompt
    if (Math.sin(t * 3) > 0) {
        ctx.fillStyle = '#4eff4e';
        ctx.font = `bold ${Math.min(20, W/30)}px monospace`;
        ctx.fillText('PRESS ANY KEY TO START', W / 2, H * 0.85);
    }
}

function drawGameOver() {
    // Dim overlay
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ff4444';
    ctx.font = `bold ${Math.min(60, W/12)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H * 0.35);

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(24, W/25)}px monospace`;
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H * 0.5);
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(16, W/30)}px monospace`;
    ctx.fillText(`BEST: ${highScore}`, W / 2, H * 0.57);

    const t = performance.now() / 1000;
    if (Math.sin(t * 3) > 0) {
        ctx.fillStyle = '#4eff4e';
        ctx.font = `${Math.min(18, W/35)}px monospace`;
        ctx.fillText('PRESS ENTER OR SPACE TO RESTART', W / 2, H * 0.7);
    }
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'playing') {
        update(dt);
        draw();
    } else if (gameState === 'gameover') {
        draw();
        drawGameOver();
    }

    requestAnimationFrame(gameLoop);
}

// Initialize
initStars();
initClouds();
lastTime = performance.now();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
