<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', Tahoma, sans-serif;
}
#game-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#start-screen {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}
#start-screen h1 {
  font-size: clamp(2rem, 5vw, 4rem);
  color: #fff;
  text-shadow: 0 0 20px rgba(255,80,80,0.5), 0 0 40px rgba(255,200,50,0.3);
  margin-bottom: 20px;
}
.controls-box {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 20px 30px;
  margin-bottom: 20px;
}
.controls-box h3 { color: #ccc; font-size: 1rem; margin-bottom: 10px; }
.controls-box p { color: #aaa; font-size: 0.9rem; line-height: 1.6; }
.key { 
  display: inline-block; 
  background: rgba(255,255,255,0.1); 
  padding: 2px 8px; 
  border-radius: 4px; 
  font-size: 0.8rem; 
  border: 1px solid rgba(255,255,255,0.2);
}
.btn {
  background: linear-gradient(135deg, #e74c3c, #f39c12);
  color: #fff;
  border: none;
  padding: 14px 40px;
  font-size: 1.2rem;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(231,76,60,0.3);
}
.btn:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(231,76,60,0.5); }
#game-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#status-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 8px 20px;
}
.player-label {
  font-size: clamp(0.9rem, 2vw, 1.3rem);
  font-weight: bold;
  padding: 6px 16px;
  border-radius: 6px;
  transition: all 0.3s;
}
.p1-label { color: #ff4444; }
.p2-label { color: #ffd700; }
.active-p1 { background: rgba(255,68,68,0.2); box-shadow: 0 0 15px rgba(255,68,68,0.4); }
.active-p2 { background: rgba(255,215,0,0.2); box-shadow: 0 0 15px rgba(255,215,0,0.4); }
#score-bar { display: flex; gap: 30px; font-size: clamp(0.8rem, 1.5vw, 1.1rem); color: #aaa; }
.score-p1 { color: #ff6666; }
.score-p2 { color: #ffd700; }
#board-wrapper { position: relative; }
#board {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 4px;
  padding: 12px;
  background: #16213e;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
}
.cell {
  width: clamp(40px, 8vw, 70px);
  height: clamp(40px, 8vw, 70px);
  border-radius: 50%;
  background: #0f3460;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.3s;
}
.cell.p1 {
  background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b);
  box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 2px 4px rgba(255,68,68,0.3);
}
.cell.p2 {
  background: radial-gradient(circle at 35% 35%, #ffe066, #f0a500);
  box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 2px 4px rgba(255,215,0,0.3);
}
.cell.win {
  animation: winPulse 0.6s ease-in-out infinite alternate;
}
@keyframes winPulse {
  from { transform: scale(0.95); filter: brightness(1); }
  to { transform: scale(1.05); filter: brightness(1.4); }
}
.cell.drop-anim { animation: dropIn 0.3s ease-out; }
@keyframes dropIn {
  from { transform: translateY(-20px); opacity: 0.5; }
  to { transform: translateY(0); opacity: 1; }
}
.cursor-p1 { box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 0 12px rgba(255,68,68,0.6) !important; }
.cursor-p2 { box-shadow: inset 0 3px 8px rgba(0,0,0,0.6), 0 0 12px rgba(255,215,0,0.6) !important; }
#restart-btn {
  margin-top: 10px;
  background: rgba(255,255,255,0.1);
  color: #ccc;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 8px 24px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.2s;
}
#restart-btn:hover { background: rgba(255,255,255,0.2); }
#msg { 
  color: #fff; 
  font-size: clamp(1rem, 2.5vw, 1.5rem); 
  font-weight: bold; 
  min-height: 1.8em; 
  text-align: center;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="start-screen">
    <h1>Connect Four</h1>
    <div class="controls-box">
      <h3>Controls</h3>
      <p><span class="key">A</span> / <span class="key">D</span> — Move Player 1 (Red)</p>
      <p><span class="key">Space</span> — Drop for Player 1</p>
      <p><span class="key">←</span> / <span class="key">→</span> — Move Player 2 (Yellow)</p>
      <p><span class="key">Enter</span> — Drop for Player 2</p>
    </div>
    <button class="btn" id="start-btn">Start Game</button>
  </div>
  <div id="game-area" style="display:none;">
    <div id="status-bar">
      <span class="player-label p1-label" id="p1-label">Player 1 (Red)</span>
      <span id="msg"></span>
      <span class="player-label p2-label" id="p2-label">Player 2 (Yellow)</span>
    </div>
    <div id="board-wrapper">
      <div id="board"></div>
    </div>
    <div id="score-bar">
      <span class="score-p1">P1: <span id="s1">0</span></span>
      <span class="score-p2">P2: <span id="s2">0</span></span>
    </div>
    <button id="restart-btn">New Round (R)</button>
  </div>
</div>
<script>
(function(){
const ROWS=6, COLS=7;
let board=[], currentPlayer=1, cursorP1=3, cursorP2=3, gameOver=false, animating=false;
let scores={1:0,2:0};
let audioCtx=null;
let startScreen=document.getElementById('start-screen');
let gameArea=document.getElementById('game-area');
let boardEl=document.getElementById('board');
let msgEl=document.getElementById('msg');
let p1Label=document.getElementById('p1-label');
let p2Label=document.getElementById('p2-label');
let s1El=document.getElementById('s1');
let s2El=document.getElementById('s2');
let cells=[];

function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(freq,dur,type='sine',vol=0.3){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxDrop(){playSound(220,0.15,'triangle',0.4);}
function sfxWin(){for(let i=0;i<4;i++)setTimeout(()=>playSound(440+i*110,0.3,'sine',0.3),i*100);}
function sfxMove(){playSound(330,0.05,'square',0.1);}

function loadScores(){try{const s=localStorage.getItem('c4_scores');if(s)scores=JSON.parse(s);}catch(e){}}
function saveScores(){try{localStorage.setItem('c4_scores',JSON.stringify(scores));}catch(e){}}

function buildBoard(){
  boardEl.innerHTML='';cells=[];
  for(let r=0;r<ROWS;r++){cells[r]=[];for(let c=0;c<COLS;c++){
    const d=document.createElement('div');d.className='cell';
    boardEl.appendChild(d);cells[r][c]=d;
  }}
}

function getRow(col){for(let r=ROWS-1;r>=0;r--){if(board[r][col]===0)return r;}return -1;}

function dropDisc(player,col){
  if(gameOver||animating)return;
  const row=getRow(col);
  if(row<0)return;
  animating=true;
  board[row][col]=player;
  cells[row][col].className='cell '+(player===1?'p1':'p2')+' drop-anim';
  sfxDrop();
  setTimeout(()=>{cells[row][col].classList.remove('drop-anim');animating=false;checkWin(player,row,col);},300);
}

function checkWin(player,dr,dc){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let d=0;d<4;d++){
    const dr2=dirs[d][0],dc2=dirs[d][1];
    let count=1;
    const winCells=[{r:dr,c:dc}];
    for(let i=1;i<4;i++){const nr=dr+dr2*i,nc=dc+dc2*i;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===player){count++;winCells.push({r:nr,c:nc});}}
    for(let i=1;i<4;i++){const nr=dr-dr2*i,nc=dc-dc2*i;if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===player){count++;winCells.push({r:nr,c:nc});}}
    if(count>=4){gameOver=true;winCells.forEach(w=>cells[w.r][w.c].classList.add('win'));sfxWin();
      scores[player]++;saveScores();updateScores();
      msgEl.textContent=player===1?'🔴 Player 1 Wins!':'🟡 Player 2 Wins!';
      return;
    }
  }
  let full=true;for(let c=0;c<COLS;c++){if(board[0][c]===0){full=false;break;}}
  if(full){gameOver=true;msgEl.textContent="Draw!";playSound(200,0.5,'sawtooth',0.2);}
}

function updateScores(){s1El.textContent=scores[1];s2El.textContent=scores[2];}

function newRound(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  currentPlayer=1;gameOver=false;animating=false;cursorP1=3;cursorP2=3;
  buildBoard();updateCursors();updateTurnUI();msgEl.textContent='';
}

function updateTurnUI(){
  p1Label.className='player-label p1-label'+(currentPlayer===1&&!gameOver?' active-p1':'');
  p2Label.className='player-label p2-label'+(currentPlayer===2&&!gameOver?' active-p2':'');
  if(!gameOver)msgEl.textContent=currentPlayer===1?'Your turn, Red':'Your turn, Yellow';
}

function updateCursors(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){cells[r][c].classList.remove('cursor-p1','cursor-p2');}
  const topRow=getRow(cursorP1);
  if(topRow>=0){cells[topRow][cursorP1].classList.add('cursor-p1');}
  const topRow2=getRow(cursorP2);
  if(topRow2>=0){cells[topRow2][cursorP2].classList.add('cursor-p2');}
}

function moveCursor(player,dir){
  if(gameOver)return;
  let c=player===1?cursorP1:cursorP2;
  let nc=c+dir;
  if(nc<0)nc=0;if(nc>=COLS)nc=COLS-1;
  if(nc!==c){sfxMove();}
  if(player===1)cursorP1=nc;else cursorP2=nc;
  updateCursors();
}

function handleDrop(player){
  if(gameOver||animating)return;
  const col=player===1?cursorP1:cursorP2;
  dropDisc(player,col);
  if(!gameOver&&!animating){currentPlayer=currentPlayer===1?2:1;updateTurnUI();}
  else{setTimeout(()=>{if(!gameOver){currentPlayer=currentPlayer===1?2:1;updateTurnUI();}},350);}
}

function startGame(){
  initAudio();
  startScreen.style.display='none';
  gameArea.style.display='flex';
  loadScores();updateScores();newRound();
}

document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('restart-btn').addEventListener('click',()=>{newRound();});

window.addEventListener('keydown',(e)=>{
  if(gameOver||!gameArea.style.display||gameArea.style.display==='none'){return;}
  initAudio();
  switch(e.code){
    case 'KeyA':if(currentPlayer===1)moveCursor(1,-1);break;
    case 'KeyD':if(currentPlayer===1)moveCursor(1,1);break;
    case 'Space':if(currentPlayer===1){e.preventDefault();handleDrop(1);}break;
    case 'ArrowLeft':e.preventDefault();if(currentPlayer===2)moveCursor(2,-1);break;
    case 'ArrowRight':e.preventDefault();if(currentPlayer===2)moveCursor(2,1);break;
    case 'Enter':if(currentPlayer===2){e.preventDefault();handleDrop(2);}break;
    case 'KeyR':newRound();break;
  }
});

window.addEventListener('click',(e)=>{
  if(gameOver||!gameArea.style.display||gameArea.style.display==='none')return;
  initAudio();
  const rect=boardEl.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const cellW=(rect.width-24)/COLS+4;
  const col=Math.floor((x-12)/cellW);
  if(col>=0&&col<COLS){
    if(currentPlayer===1){cursorP1=col;updateCursors();handleDrop(1);}
    else{cursorP2=col;updateCursors();handleDrop(2);}
  }
});

buildBoard();
})();
</script>
</body>
</html>
