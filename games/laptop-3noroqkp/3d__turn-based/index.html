<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cube Clash - 3D Tic-Tac-Toe</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#ui-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#start-screen {
display: flex; flex-direction: column; align-items: center; gap: 20px;
background: radial-gradient(ellipse at center, rgba(10,10,40,0.95), rgba(5,5,20,0.98));
width: 100%; height: 100%; pointer-events: all;
}
#start-screen h1 {
font-size: clamp(2rem, 6vw, 4rem); color: #fff; text-shadow: 0 0 30px rgba(100,150,255,0.8);
letter-spacing: 4px;
}
#start-screen .subtitle {
font-size: clamp(0.9rem, 2vw, 1.2rem); color: rgba(180,200,255,0.8); max-width: 500px; text-align: center; line-height: 1.6;
}
.btn {
padding: 14px 40px; font-size: 1.2rem; border: 2px solid rgba(100,150,255,0.6);
background: rgba(30,50,120,0.4); color: #cde; border-radius: 8px; cursor: pointer;
transition: all 0.3s; letter-spacing: 2px;
}
.btn:hover { background: rgba(60,100,200,0.5); box-shadow: 0 0 20px rgba(100,150,255,0.4); }
#hud {
position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
display: flex; gap: 30px; align-items: center; pointer-events: none;
}
.player-badge {
padding: 8px 20px; border-radius: 6px; font-size: 1.1rem; font-weight: bold;
transition: all 0.3s;
}
.badge-x { background: rgba(255,80,80,0.2); color: #ff6b6b; border: 1px solid rgba(255,80,80,0.4); }
.badge-o { background: rgba(80,150,255,0.2); color: #6bb3ff; border: 1px solid rgba(80,150,255,0.4); }
.badge.active { box-shadow: 0 0 15px currentColor; transform: scale(1.1); }
#status {
position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
color: rgba(200,220,255,0.7); font-size: 0.9rem; pointer-events: none; text-align: center;
}
#win-screen {
display: none; flex-direction: column; align-items: center; gap: 20px;
background: radial-gradient(ellipse at center, rgba(10,10,40,0.9), rgba(5,5,20,0.95));
width: 100%; height: 100%; pointer-events: all;
}
#win-screen h2 { font-size: clamp(2rem, 5vw, 3.5rem); color: #fff; text-shadow: 0 0 30px rgba(100,255,150,0.6); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-overlay">
<div id="start-screen">
<h1>CUBE CLASH</h1>
<p class="subtitle">3D Tic-Tac-Toe on a 3×3×3 grid.<br>Get 3 in a row along any axis, face diagonal, or space diagonal to win.<br><br>
<strong>Controls:</strong> Drag to rotate • Click a cell to place • R to reset view</p>
<button class="btn" id="start-btn">PLAY</button>
</div>
<div id="win-screen">
<h2 id="win-text"></h2>
<button class="btn" id="restart-btn">PLAY AGAIN</button>
</div>
</div>
<div id="hud" style="display:none;">
<div class="player-badge badge-x" id="badge-x">X</div>
<div class="player-badge badge-o" id="badge-o">O</div>
</div>
<div id="status"></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Game state
let board = new Array(27).fill(null); // 0=empty, 1=X, 2=O
let currentPlayer = 1;
let gameOver = false;
let winningLine = null;
let gameStarted = false;
let animFrame = 0;

// View state
let rotX = -0.4, rotY = 0.6, rotZ = 0;
let targetRotX = -0.4, targetRotY = 0.6;
let dragging = false, lastMX = 0, lastMY = 0;

// Audio
let audioCtx = null;
function initAudio() {
if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type || 'sine';
osc.frequency.value = freq;
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// 3D math
const SPACING = 80;
function project(x, y, z) {
let cx = Math.cos(rotY), sx = Math.sin(rotY);
let x1 = x * cx - z * sx;
let z1 = x * sx + z * cx;
let cy = Math.cos(rotX), sy = Math.sin(rotX);
let y1 = y * cy - z1 * sy;
let z2 = y * sy + z1 * cy;
let perspective = 600 / (600 + z2 * 0.5);
return { x: W/2 + x1 * SPACING * perspective, y: H/2 + y1 * SPACING * perspective, z: z2, s: perspective };
}

function getCellPos(i) {
let x = (i % 3) - 1;
let y = Math.floor(i / 9) - 1;
let z = Math.floor(i / 3) % 3 - 1;
return { x, y, z };
}

// Draw the 3D grid
function drawScene() {
ctx.clearRect(0, 0, W, H);
// Background gradient
let bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
bg.addColorStop(0, '#1a1a3a');
bg.addColorStop(1, '#050510');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// Draw grid lines and cells
let cells = [];
for (let i = 0; i < 27; i++) {
let pos = getCellPos(i);
let p = project(pos.x, pos.y, pos.z);
cells.push({ i, x: p.x, y: p.y, z: p.z, s: p.s });
}

// Sort by depth for painter's algorithm
cells.sort((a, b) => a.z - b.z);

// Draw connecting lines
for (let i = 0; i < 27; i++) {
let pos = getCellPos(i);
let x = pos.x, y = pos.y, z = p_z(pos);
if (x < 1) { let p2 = project(x+2, y, z); drawLine3D(project(x,y,z), p2, 'rgba(60,80,140,0.3)', 1); }
if (y < 1) { let p2 = project(x, y+2, z); drawLine3D(project(x,y,z), p2, 'rgba(60,80,140,0.3)', 1); }
if (z < 1) { let p2 = project(x, y, z+2); drawLine3D(project(x,y,z), p2, 'rgba(60,80,140,0.3)', 1); }
}

function p_z(pos) { return pos.z; }

// Draw cells
for (let c of cells) {
let size = 14 * c.s;
let alpha = 0.3 + c.s * 0.3;

if (board[c.i] === null && !gameOver) {
ctx.beginPath();
ctx.arc(c.x, c.y, size, 0, Math.PI*2);
ctx.fillStyle = `rgba(100,140,255,${alpha * 0.15})`;
ctx.fill();
ctx.strokeStyle = `rgba(100,140,255,${alpha * 0.4})`;
ctx.lineWidth = 1;
ctx.stroke();
}

if (board[c.i] === 1) {
drawX(c.x, c.y, size * 1.4);
} else if (board[c.i] === 2) {
drawO(c.x, c.y, size * 1.2);
}

// Highlight winning line
if (winningLine && winningLine.includes(c.i)) {
ctx.beginPath();
ctx.arc(c.x, c.y, size + 4, 0, Math.PI*2);
ctx.strokeStyle = `rgba(100,255,150,${0.5 + Math.sin(animFrame*0.1)*0.3})`;
ctx.lineWidth = 3;
ctx.stroke();
}
}

// Hover highlight
if (hoverCell !== null && !gameOver && board[hoverCell] === null) {
let pos = getCellPos(hoverCell);
let p = project(pos.x, pos.y, pos.z);
let size = 16 * p.s;
ctx.beginPath();
ctx.arc(p.x, p.y, size, 0, Math.PI*2);
ctx.strokeStyle = currentPlayer === 1 ? 'rgba(255,100,100,0.8)' : 'rgba(100,150,255,0.8)';
ctx.lineWidth = 2;
ctx.stroke();
}
}

function drawLine3D(p1, p2, color, width) {
ctx.beginPath();
ctx.moveTo(p1.x, p1.y);
ctx.lineTo(p2.x, p2.y);
ctx.strokeStyle = color;
ctx.lineWidth = width || 1;
ctx.stroke();
}

function drawX(cx, cy, r) {
let glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
glow.addColorStop(0, 'rgba(255,80,80,0.3)');
glow.addColorStop(1, 'rgba(255,80,80,0)');
ctx.fillStyle = glow;
ctx.beginPath(); ctx.arc(cx,cy,r*1.5,0,Math.PI*2); ctx.fill();

ctx.strokeStyle = '#ff4444';
ctx.lineWidth = 3;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(cx - r*0.6, cy - r*0.6); ctx.lineTo(cx + r*0.6, cy + r*0.6);
ctx.moveTo(cx + r*0.6, cy - r*0.6); ctx.lineTo(cx - r*0.6, cy + r*0.6);
ctx.stroke();

ctx.strokeStyle = 'rgba(255,150,150,0.6)';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(cx - r*0.6, cy - r*0.6); ctx.lineTo(cx + r*0.6, cy + r*0.6);
ctx.moveTo(cx + r*0.6, cy - r*0.6); ctx.lineTo(cx - r*0.6, cy + r*0.6);
ctx.stroke();
}

function drawO(cx, cy, r) {
let glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
glow.addColorStop(0, 'rgba(80,150,255,0.3)');
glow.addColorStop(1, 'rgba(80,150,255,0)');
ctx.fillStyle = glow;
ctx.beginPath(); ctx.arc(cx,cy,r*1.5,0,Math.PI*2); ctx.fill();

ctx.strokeStyle = '#4499ff';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.arc(cx, cy, r*0.6, 0, Math.PI*2);
ctx.stroke();

ctx.strokeStyle = 'rgba(150,200,255,0.6)';
ctx.lineWidth = 1;
ctx.beginPath();
ctx.arc(cx, cy, r*0.6, 0, Math.PI*2);
ctx.stroke();
}

// Win detection
const WIN_LINES = [];
function generateWinLines() {
for (let dx of [-1,0,1]) for (let dy of [-1,0,1]) for (let dz of [-1,0,1]) {
if (dx===0 && dy===0 && dz===0) continue;
for (let x=0;x<3;x++) for (let y=0;y<3;y++) for (let z=0;z<3;z++) {
let ex=x+dx*2, ey=y+dy*2, ez=z+dz*2;
if (ex>=0&&ex<3&&ey>=0&&ey<3&&ez>=0&&ez<3) {
let mid_x=x+dx, mid_y=y+dy, mid_z=z+dz;
let line=[x+y*3+z*9, mid_x+mid_y*3+mid_z*9, ex+ey*3+ez*9];
let key = line.join(',');
if (!WIN_LINES.find(l=>l.join(',')===key)) WIN_LINES.push(line);
}
}
}
}
generateWinLines();

function checkWin() {
for (let line of WIN_LINES) {
let a = board[line[0]], b = board[line[1]], c = board[line[2]];
if (a !== null && a === b && b === c) return line;
}
return null;
}

function placeCell(i) {
if (board[i] !== null || gameOver) return;
board[i] = currentPlayer;
initAudio();
playTone(currentPlayer === 1 ? 220 : 330, 0.15, 'sine');
playTone(currentPlayer === 1 ? 440 : 660, 0.1, 'triangle');

let win = checkWin();
if (win) {
gameOver = true;
winningLine = win;
let winner = currentPlayer === 1 ? 'X' : 'O';
playTone(523, 0.3, 'sine'); playTone(659, 0.3, 'sine'); playTone(784, 0.5, 'sine');
setTimeout(() => {
document.getElementById('win-text').textContent = winner + ' WINS!';
document.getElementById('win-screen').style.display = 'flex';
}, 1200);
} else if (board.every(c => c !== null)) {
gameOver = true;
playTone(330, 0.4, 'sine');
setTimeout(() => {
document.getElementById('win-text').textContent = "IT'S A DRAW!";
document.getElementById('win-screen').style.display = 'flex';
}, 1200);
} else {
currentPlayer = currentPlayer === 1 ? 2 : 1;
updateHUD();
}
}

function updateHUD() {
let bx = document.getElementById('badge-x');
let bo = document.getElementById('badge-o');
bx.classList.toggle('active', currentPlayer === 1 && !gameOver);
bo.classList.toggle('active', currentPlayer === 2 && !gameOver);
document.getElementById('status').textContent = gameOver ? '' : (currentPlayer === 1 ? "X's turn" : "O's turn") + " — drag to rotate";
}

// Input
let hoverCell = null;
let mouseX = 0, mouseY = 0;

canvas.addEventListener('mousedown', (e) => {
if (!gameStarted || gameOver) return;
dragging = true;
lastMX = e.clientX; lastMY = e.clientY;
});

window.addEventListener('mousemove', (e) => {
mouseX = e.clientX; mouseY = e.clientY;
if (dragging && gameStarted && !gameOver) {
let dx = e.clientX - lastMX;
let dy = e.clientY - lastMY;
targetRotY += dx * 0.01;
targetRotX += dy * 0.01;
lastMX = e.clientX; lastMY = e.clientY;
}
});

window.addEventListener('mouseup', (e) => {
if (!gameStarted || gameOver) return;
let moved = Math.abs(e.clientX - lastMX) + Math.abs(e.clientY - lastMY);
if (moved < 5 && hoverCell !== null) {
placeCell(hoverCell);
}
dragging = false;
});

window.addEventListener('touchstart', (e) => {
if (!gameStarted || gameOver) return;
let t = e.touches[0];
dragging = true;
lastMX = t.clientX; lastMY = t.clientY;
mouseX = t.clientX; mouseY = t.clientY;
});

window.addEventListener('touchmove', (e) => {
e.preventDefault();
let t = e.touches[0];
if (dragging && gameStarted && !gameOver) {
let dx = t.clientX - lastMX;
let dy = t.clientY - lastMY;
targetRotY += dx * 0.01;
targetRotX += dy * 0.01;
lastMX = t.clientX; lastMY = t.clientY;
mouseX = t.clientX; mouseY = t.clientY;
}
});

window.addEventListener('touchend', (e) => {
if (!gameStarted || gameOver) return;
let moved = Math.abs(mouseX - lastMX) + Math.abs(mouseY - lastMY);
if (moved < 10 && hoverCell !== null) placeCell(hoverCell);
dragging = false;
});

window.addEventListener('keydown', (e) => {
if (e.key === 'r' || e.key === 'R') { targetRotX = -0.4; targetRotY = 0.6; }
});

function findNearestCell(mx, my) {
let best = null, bestDist = 30;
for (let i = 0; i < 27; i++) {
if (board[i] !== null) continue;
let pos = getCellPos(i);
let p = project(pos.x, pos.y, pos.z);
let d = Math.hypot(mx - p.x, my - p.y);
if (d < bestDist) { bestDist = d; best = i; }
}
return best;
}

function gameLoop() {
animFrame++;
rotX += (targetRotX - rotX) * 0.08;
rotY += (targetRotY - rotY) * 0.08;

if (gameStarted && !gameOver && !dragging) {
hoverCell = findNearestCell(mouseX, mouseY);
} else if (!gameStarted) {
// Slow auto-rotate on start screen
targetRotY += 0.003;
}

drawScene();

if (gameStarted && !gameOver && !dragging) {
canvas.style.cursor = hoverCell !== null ? 'pointer' : 'grab';
} else {
canvas.style.cursor = dragging ? 'grabbing' : 'default';
}

requestAnimationFrame(gameLoop);
}

function startGame() {
board = new Array(27).fill(null);
currentPlayer = 1;
gameOver = false;
winningLine = null;
gameStarted = true;
document.getElementById('start-screen').style.display = 'none';
document.getElementById('win-screen').style.display = 'none';
document.getElementById('hud').style.display = 'flex';
updateHUD();
initAudio();
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Initial render for background
let lastTime = 0;
function loop() {
let now = performance.now();
if (now - lastTime > 16) { // cap ~60fps
lastTime = now;
gameLoop();
} else {
requestAnimationFrame(loop);
}
}

// Start the render loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
