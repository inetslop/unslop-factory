<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Shooter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize;
function resize() {
    const aspect = 19/21;
    if (window.innerWidth / window.innerHeight > aspect) {
        H = window.innerHeight;
        W = H * aspect;
    } else {
        W = window.innerWidth;
        H = W / aspect;
    }
    canvas.width = Math.floor(W);
    canvas.height = Math.floor(H);
    cellSize = Math.floor(canvas.width / 19);
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'pellet') {
        osc.type = 'sine'; osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'power') {
        osc.type = 'square'; osc.frequency.value = 400;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'shoot') {
        osc.type = 'sawtooth'; osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'kill') {
        osc.type = 'square'; osc.frequency.value = 200;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'death') {
        osc.type = 'sawtooth'; osc.frequency.value = 150;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'extra') {
        osc.type = 'triangle'; osc.frequency.value = 500;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover, win
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('pacshooter_high') || '0'); } catch(e) {}
let lives = 3;
let ammo = 10;
let maxAmmo = 20;
let level = 1;
let frameCount = 0;
let flashTimer = 0;
let shakeTimer = 0;

// Maze: 19 wide x 21 tall
const MAZE_W = 19;
const MAZE_H = 21;
const mazeTemplate = [
    "###################",
    "#                 #",
    "# ###P   P   ### #",
    "# ###P   P   ### #",
    "#    P       P    #",
    "#   ## ###### ##  #",
    "#           P     #",
    "##### ##### #####",
    "#   P      P     #",
    "### P #########  #",
    "#                 #",
    "# ###P   P   ### #",
    "# ###P   P   ### #",
    "#    P       P    #",
    "#   ## ###### ##  #",
    "#           P     #",
    "##### ##### #####",
    "#                 #",
    "# ###P   P   ### #",
    "# ###P   P   ### #",
    "#                 #"
];

let maze = [];
let pellets = []; // {x, y}
let powerPellets = []; // {x, y}

function initMaze() {
    maze = [];
    pellets = [];
    powerPellets = [];
    for (let r = 0; r < MAZE_H; r++) {
        maze[r] = [];
        for (let c = 0; c < MAZE_W; c++) {
            const ch = mazeTemplate[r][c];
            if (ch === '#') {
                maze[r][c] = 1;
            } else if (ch === 'P') {
                maze[r][c] = 2; // power pellet
                powerPellets.push({x: c, y: r});
            } else {
                maze[r][c] = 0;
                pellets.push({x: c, y: r});
            }
        }
    }
}

// Player
let player = { x: 9, y: 18, px: 0, py: 0, dir: 'up', nextDir: 'up', moving: false, moveProgress: 0 };
function resetPlayer() {
    player.x = 9; player.y = 18;
    player.px = 9 * cellSize + cellSize/2;
    player.py = 18 * cellSize + cellSize/2;
    player.dir = 'up';
    player.nextDir = 'up';
    player.moving = false;
    player.moveProgress = 0;
}

// Ghosts
let ghosts = [];
function spawnGhosts() {
    const count = Math.min(2 + level, 5);
    ghosts = [];
    const spawns = [
        {x: 9, y: 10}, {x: 7, y: 10}, {x: 11, y: 10}, {x: 8, y: 12}, {x: 10, y: 12}
    ];
    const colors = ['#ff0000', '#00ffff', '#ff00ff', '#ffff00', '#00ff00'];
    for (let i = 0; i < count; i++) {
        ghosts.push({
            x: spawns[i].x, y: spawns[i].y,
            px: spawns[i].x * cellSize + cellSize/2,
            py: spawns[i].y * cellSize + cellSize/2,
            dir: 'down', speed: 0.7 + level * 0.1,
            color: colors[i], alive: true, deathTimer: 0, wanderTimer: 0
        });
    }
}

// Bullets
let bullets = [];

function canMove(gx, gy) {
    if (gx < 0 || gx >= MAZE_W || gy < 0 || gy >= MAZE_H) return false;
    return maze[gy] && maze[gy][gx] !== 1;
}

function isWall(gx, gy) {
    if (gx < 0 || gx >= MAZE_W || gy < 0 || gy >= MAZE_H) return true;
    return maze[gy][gx] === 1;
}

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' || gameState === 'gameover') {
        if (e.code === 'Space' || e.code === 'Enter') startGame();
    }
    if (gameState === 'playing' && e.code === 'Space') shoot();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    initAudio();
    score = 0; lives = 3; ammo = 10; level = 1;
    frameCount = 0; flashTimer = 0;
    initMaze();
    resetPlayer();
    spawnGhosts();
    bullets = [];
    gameState = 'playing';
}

function shoot() {
    if (ammo <= 0) return;
    ammo--;
    playSound('shoot');
    let dx = 0, dy = 0;
    switch(player.dir) {
        case 'up': dy = -1; break;
        case 'down': dy = 1; break;
        case 'left': dx = -1; break;
        case 'right': dx = 1; break;
    }
    bullets.push({
        x: player.px, y: player.py,
        vx: dx * cellSize * 0.3, vy: dy * cellSize * 0.3,
        life: 60
    });
}

function updatePlayer() {
    // Determine desired direction from keys
    let desiredDir = null;
    if (keys['ArrowUp'] || keys['KeyW']) desiredDir = 'up';
    else if (keys['ArrowDown'] || keys['KeyS']) desiredDir = 'down';
    else if (keys['ArrowLeft'] || keys['KeyA']) desiredDir = 'left';
    else if (keys['ArrowRight'] || keys['KeyD']) desiredDir = 'right';

    if (desiredDir) {
        player.nextDir = desiredDir;
    }

    // Can we reverse?
    let dx = 0, dy = 0;
    switch(player.dir) {
        case 'up': dy = -1; break;
        case 'down': dy = 1; break;
        case 'left': dx = -1; break;
        case 'right': dx = 1; break;
    }

    // Check if we can move in desired direction from current cell
    let ndx = 0, ndy = 0;
    switch(desiredDir) {
        case 'up': ndy = -1; break;
        case 'down': ndy = 1; break;
        case 'left': ndx = -1; break;
        case 'right': ndx = 1; break;
    }

    const nextGx = player.x + (dx !== 0 ? dx : 0) + (desiredDir ? ndx : 0);
    const nextGy = player.y + (dy !== 0 ? dy : 0) + (desiredDir ? ndy : 0);

    // Simple: try to change direction if possible
    if (desiredDir && desiredDir !== player.dir) {
        let cx = player.x, cy = player.y;
        switch(desiredDir) {
            case 'up': cy--; break;
            case 'down': cy++; break;
            case 'left': cx--; break;
            case 'right': cx++; break;
        }
        if (!isWall(cx, cy)) {
            player.dir = desiredDir;
        }
    }

    // Move
    let mx = 0, my = 0;
    switch(player.dir) {
        case 'up': my = -1; break;
        case 'down': my = 1; break;
        case 'left': mx = -1; break;
        case 'right': mx = 1; break;
    }

    const spd = cellSize * 0.08;
    player.px += mx * spd;
    player.py += my * spd;

    // Snap to grid when crossing center
    const targetPx = (player.x + mx) * cellSize + cellSize/2;
    const targetPy = (player.y + my) * cellSize + cellSize/2;

    if (mx !== 0 && ((mx > 0 && player.px >= targetPx) || (mx < 0 && player.px <= targetPx))) {
        // Check if we can continue in this direction
        const nx = player.x + mx;
        if (!isWall(nx, player.y)) {
            player.x = nx;
            player.px = nx * cellSize + cellSize/2;
        } else {
            player.px = (player.x) * cellSize + cellSize/2;
        }
    }
    if (my !== 0 && ((my > 0 && player.py >= targetPy) || (my < 0 && player.py <= targetPy))) {
        const ny = player.y + my;
        if (!isWall(player.x, ny)) {
            player.y = ny;
            player.py = ny * cellSize + cellSize/2;
        } else {
            player.py = (player.y) * cellSize + cellSize/2;
        }
    }

    // Check pellet pickup
    for (let i = pellets.length - 1; i >= 0; i--) {
        if (pellets[i].x === player.x && pellets[i].y === player.y) {
            pellets.splice(i, 1);
            score += 10;
            ammo = Math.min(ammo + 1, maxAmmo);
            playSound('pellet');
        }
    }
    for (let i = powerPellets.length - 1; i >= 0; i--) {
        if (powerPellets[i].x === player.x && powerPellets[i].y === player.y) {
            powerPellets.splice(i, 1);
            score += 50;
            ammo = Math.min(ammo + 5, maxAmmo);
            playSound('power');
        }
    }
}

function updateGhosts() {
    for (let g of ghosts) {
        if (!g.alive) {
            g.deathTimer--;
            continue;
        }
        // Chase AI: move toward player with some randomness
        let dx = Math.sign(player.px - g.px);
        let dy = Math.sign(player.py - g.py);

        // Wander occasionally
        if (Math.random() < 0.1) {
            const dirs = ['up','down','left','right'];
            g.dir = dirs[Math.floor(Math.random()*4)];
        } else {
            // Prefer dominant axis
            if (Math.abs(player.px - g.px) > Math.abs(player.py - g.py)) {
                g.dir = dx > 0 ? 'right' : dx < 0 ? 'left' : (dy > 0 ? 'down' : 'up');
            } else {
                g.dir = dy > 0 ? 'down' : dy < 0 ? 'up' : (dx > 0 ? 'right' : 'left');
            }
        }

        let mdx = 0, mdy = 0;
        switch(g.dir) {
            case 'up': mdy = -1; break;
            case 'down': mdy = 1; break;
            case 'left': mdx = -1; break;
            case 'right': mdx = 1; break;
        }

        const gx2 = g.x + mdx, gy2 = g.y + mdy;
        if (!isWall(gx2, gy2)) {
            // Move smoothly
            const spd = cellSize * 0.05 * (1 + level * 0.2);
            g.px += mdx * spd;
            g.py += mdy * spd;

            // Snap to grid
            if (mdx !== 0) {
                const tx = gx2 * cellSize + cellSize/2;
                if ((mdx > 0 && g.px >= tx) || (mdx < 0 && g.px <= tx)) {
                    g.x = gx2;
                    g.px = gx2 * cellSize + cellSize/2;
                }
            }
            if (mdy !== 0) {
                const ty = gy2 * cellSize + cellSize/2;
                if ((mdy > 0 && g.py >= ty) || (mdy < 0 && g.py <= ty)) {
                    g.y = gy2;
                    g.py = gy2 * cellSize + cellSize/2;
                }
            }
        } else {
            // Can't go that direction, pick a valid one
            const options = [];
            if (!isWall(g.x, g.y-1)) options.push('up');
            if (!isWall(g.x, g.y+1)) options.push('down');
            if (!isWall(g.x-1, g.y)) options.push('left');
            if (!isWall(g.x+1, g.y)) options.push('right');
            if (options.length > 0) g.dir = options[Math.floor(Math.random()*options.length)];
        }

        // Check collision with player
        const dist = Math.hypot(player.px - g.px, player.py - g.py);
        if (dist < cellSize * 0.4) {
            playerDeath();
            break;
        }
    }
}

function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Check wall collision
        const gx = Math.floor(b.x / cellSize);
        const gy = Math.floor(b.y / cellSize);
        if (isWall(gx, gy)) {
            bullets.splice(i, 1);
            continue;
        }

        // Check ghost hit
        for (let g of ghosts) {
            if (!g.alive) continue;
            const d = Math.hypot(b.x - g.px, b.y - g.py);
            if (d < cellSize * 0.35) {
                g.alive = false;
                g.deathTimer = 30;
                score += 100 + level * 20;
                bullets.splice(i, 1);
                playSound('kill');
                shakeTimer = 8;
                break;
            }
        }

        if (b.life <= 0) {
            bullets.splice(i, 1);
        }
    }
}

function playerDeath() {
    lives--;
    flashTimer = 30;
    playSound('death');
    shakeTimer = 15;
    if (lives <= 0) {
        gameState = 'gameover';
        try { localStorage.setItem('pacshooter_high', String(highScore)); } catch(e) {}
    } else {
        resetPlayer();
        spawnGhosts();
        bullets = [];
    }
}

function checkWin() {
    if (pellets.length === 0 && powerPellets.length === 0) {
        level++;
        score += 500;
        playSound('extra');
        initMaze();
        resetPlayer();
        spawnGhosts();
        bullets = [];
    }
}

function update() {
    if (gameState !== 'playing') return;
    frameCount++;
    if (flashTimer > 0) flashTimer--;
    if (shakeTimer > 0) shakeTimer--;

    updatePlayer();
    updateGhosts();
    updateBullets();
    checkWin();
}

function drawMaze() {
    for (let r = 0; r < MAZE_H; r++) {
        for (let c = 0; c < MAZE_W; c++) {
            if (maze[r][c] === 1) {
                ctx.fillStyle = '#2121ff';
                ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
                ctx.strokeStyle = '#3939ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(c * cellSize + 2, r * cellSize + 2, cellSize - 4, cellSize - 4);
            }
        }
    }
}

function drawPellets() {
    ctx.fillStyle = '#ffb8ae';
    const dotR = cellSize * 0.12;
    for (let p of pellets) {
        ctx.beginPath();
        ctx.arc(p.x * cellSize + cellSize/2, p.y * cellSize + cellSize/2, dotR, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawPowerPellets() {
    const pulse = Math.sin(frameCount * 0.15) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 184, 174, ${pulse})`;
    for (let p of powerPellets) {
        ctx.beginPath();
        ctx.arc(p.x * cellSize + cellSize/2, p.y * cellSize + cellSize/2, cellSize * 0.3, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawPlayer() {
    const mouthAngle = (frameCount % 20) / 20 * Math.PI * 0.6;
    let angle = 0;
    switch(player.dir) {
        case 'up': angle = -Math.PI/2; break;
        case 'down': angle = Math.PI/2; break;
        case 'left': angle = Math.PI; break;
        case 'right': angle = 0; break;
    }

    ctx.fillStyle = '#ffe800';
    ctx.beginPath();
    ctx.arc(player.px, player.py, cellSize * 0.4, angle + mouthAngle, angle - mouthAngle + Math.PI*2);
    ctx.lineTo(player.px, player.py);
    ctx.closePath();
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    const eyeOff = cellSize * 0.15;
    ctx.beginPath();
    ctx.arc(player.px - eyeOff*0.5, player.py - cellSize*0.15, cellSize*0.08, 0, Math.PI*2);
    ctx.arc(player.px + eyeOff*0.5, player.py - cellSize*0.15, cellSize*0.08, 0, Math.PI*2);
    ctx.fill();
}

function drawGhosts() {
    for (let g of ghosts) {
        if (!g.alive) {
            // Death animation
            const scale = g.deathTimer / 30;
            ctx.fillStyle = `rgba(${parseInt(g.color.slice(1,3),16)}, ${parseInt(g.color.slice(3,5),16)}, ${parseInt(g.color.slice(5,7),16)}, ${scale})`;
            drawGhostShape(g.px, g.py, cellSize * 0.4 * scale);
            continue;
        }
        ctx.fillStyle = g.color;
        drawGhostShape(g.px, g.py, cellSize * 0.4);

        // Eyes
        ctx.fillStyle = '#fff';
        const ex = cellSize * 0.12;
        ctx.beginPath();
        ctx.arc(g.px - ex, g.py - cellSize*0.05, cellSize*0.1, 0, Math.PI*2);
        ctx.arc(g.px + ex, g.py - cellSize*0.05, cellSize*0.1, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#00f';
        ctx.beginPath();
        ctx.arc(g.px - ex, g.py - cellSize*0.05, cellSize*0.05, 0, Math.PI*2);
        ctx.arc(g.px + ex, g.py - cellSize*0.05, cellSize*0.05, 0, Math.PI*2);
        ctx.fill();
    }
}

function drawGhostShape(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y - r*0.1, r, Math.PI, 0);
    const wave = Math.sin(frameCount * 0.2) * r * 0.15;
    ctx.lineTo(x + r, y + r*0.6);
    ctx.quadraticCurveTo(x + r*0.5, y + r*0.8 + wave, x, y + r*0.4);
    ctx.quadraticCurveTo(x - r*0.5, y + r*0.8 - wave, x - r, y + r*0.6);
    ctx.closePath();
    ctx.fill();
}

function drawBullets() {
    ctx.fillStyle = '#ff0';
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, cellSize * 0.12, 0, Math.PI*2);
        ctx.fill();
        // Trail
        ctx.fillStyle = 'rgba(255,255,0,0.4)';
        ctx.beginPath();
        ctx.arc(b.x - b.vx*2, b.y - b.vy*2, cellSize * 0.08, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#ff0';
    }
}

function drawHUD() {
    const pad = cellSize * 0.3;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(cellSize*0.5)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, pad, cellSize * 0.7);
    ctx.textAlign = 'right';
    ctx.fillText(`HI: ${Math.max(score, highScore)}`, canvas.width - pad, cellSize * 0.7);

    // Lives
    ctx.fillStyle = '#ffe800';
    for (let i = 0; i < lives; i++) {
        ctx.beginPath();
        ctx.arc(pad + i * cellSize * 0.5 + cellSize*0.2, cellSize*1.3, cellSize*0.15, 0, Math.PI*2);
        ctx.fill();
    }

    // Ammo bar
    ctx.fillStyle = '#333';
    ctx.fillRect(canvas.width - pad - cellSize*2, cellSize*1.1, cellSize*2, cellSize*0.3);
    ctx.fillStyle = ammo > 5 ? '#0f0' : '#f00';
    ctx.fillRect(canvas.width - pad - cellSize*2, cellSize*1.1, cellSize*2 * (ammo/maxAmmo), cellSize*0.3);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(cellSize*0.35)}px monospace`;
    ctx.textAlign = 'right';
    ctx.fillText(`AMMO: ${ammo}`, canvas.width - pad, cellSize * 1.8);

    // Level
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.floor(cellSize*0.4)}px monospace`;
    ctx.fillStyle = '#0ff';
    ctx.fillText(`LEVEL ${level}`, canvas.width/2, cellSize * 0.7);
}

function drawStartScreen() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Title
    const cx = canvas.width/2;
    const cy = canvas.height/2;
    ctx.textAlign = 'center';

    ctx.fillStyle = '#ffe800';
    ctx.font = `bold ${Math.floor(cellSize*1.5)}px monospace`;
    ctx.fillText('PAC-SHOOTER', cx, cy - cellSize*2);

    // Pac-man icon
    const pa = (frameCount % 30) / 30 * Math.PI * 0.6;
    ctx.beginPath();
    ctx.arc(cx, cy, cellSize*0.8, pa, -pa + Math.PI*2);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(cellSize*0.5)}px monospace`;
    ctx.fillText('Move: WASD / Arrow Keys', cx, cy + cellSize*1.5);
    ctx.fillText('Shoot: SPACE', cx, cy + cellSize*2.2);
    ctx.fillText('Eat pellets for ammo!', cx, cy + cellSize*2.9);
    ctx.fillText('Shoot ghosts to kill them!', cx, cy + cellSize*3.6);

    ctx.fillStyle = `rgba(255,255,255,${Math.sin(frameCount*0.1)*0.4+0.6})`;
    ctx.font = `bold ${Math.floor(cellSize*0.6)}px monospace`;
    ctx.fillText('PRESS SPACE TO START', cx, cy + cellSize*5);

    if (highScore > 0) {
        ctx.fillStyle = '#888';
        ctx.font = `${Math.floor(cellSize*0.4)}px monospace`;
        ctx.fillText(`HIGH SCORE: ${highScore}`, cx, cy + cellSize*6);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width/2;
    const cy = canvas.height/2;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f00';
    ctx.font = `bold ${Math.floor(cellSize*1.2)}px monospace`;
    ctx.fillText('GAME OVER', cx, cy - cellSize);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(cellSize*0.6)}px monospace`;
    ctx.fillText(`FINAL SCORE: ${score}`, cx, cy);
    ctx.fillText(`HIGH SCORE: ${Math.max(score, highScore)}`, cx, cy + cellSize*0.8);
    ctx.fillStyle = `rgba(255,255,255,${Math.sin(frameCount*0.1)*0.4+0.6})`;
    ctx.font = `bold ${Math.floor(cellSize*0.5)}px monospace`;
    ctx.fillText('PRESS SPACE TO RESTART', cx, cy + cellSize*2);

    // Update high score
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('pacshooter_high', String(highScore)); } catch(e) {}
    }
}

function draw() {
    ctx.save();

    if (shakeTimer > 0) {
        const sx = (Math.random()-0.5) * shakeTimer;
        const sy = (Math.random()-0.5) * shakeTimer;
        ctx.translate(sx, sy);
    }

    if (gameState === 'start') {
        drawStartScreen();
    } else if (gameState === 'playing' || gameState === 'gameover') {
        // Background
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawMaze();
        drawPellets();
        drawPowerPellets();
        drawBullets();
        drawPlayer();
        drawGhosts();
        drawHUD();

        if (flashTimer > 0 && flashTimer % 4 < 2) {
            ctx.fillStyle = 'rgba(255,0,0,0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (gameState === 'gameover') drawGameOver();
    }

    ctx.restore();
}

function loop() {
    frameCount++;
    update();
    draw();
    requestAnimationFrame(loop);
}

initMaze();
resetPlayer();
spawnGhosts();
loop();
</script>
</body>
</html>
