<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Endless Tower Defense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellW, cellH;
const COLS = 13, ROWS = 9;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellW = W / COLS;
    cellH = (H - 80) / ROWS;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game State
const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
let gameState = STATE.MENU;
let gold = 250;
let lives = 20;
let wave = 0;
let score = 0;
let enemies = [];
let towers = [];
let projectiles = [];
let particles = [];
let spawnQueue = [];
let spawnTimer = 0;
let waveActive = false;
let betweenWaves = true;
let nextWaveTimer = 0;
let selectedTower = -1;
let hoverCell = null;
let gameSpeed = 1;

// Path waypoints (grid coords)
const pathWaypoints = [
    { x: -1, y: 1 }, { x: 12, y: 1 },
    { x: 12, y: 3 }, { x: -1, y: 3 },
    { x: -1, y: 5 }, { x: 12, y: 5 }
];

// Get path cells for collision
function isPathCell(col, row) {
    for (let i = 0; i < pathWaypoints.length - 1; i++) {
        const a = pathWaypoints[i], b = pathWaypoints[i + 1];
        if (a.x === b.x) {
            const minR = Math.min(a.y, b.y), maxR = Math.max(a.y, b.y);
            if (col >= Math.min(a.x, b.x) && col <= Math.max(a.x, b.x) && row >= minR && row <= maxR) return true;
        } else {
            const minC = Math.min(a.x, b.x), maxC = Math.max(a.x, b.x);
            if (row >= Math.min(a.y, b.y) && row <= Math.max(a.y, b.y) && col >= minC && col <= maxC) return true;
        }
    }
    return false;
}

function isTowerAt(col, row) {
    return towers.some(t => t.col === col && t.row === row);
}

// Tower definitions
const TOWER_TYPES = [
    { name: 'Arrow', cost: 50, damage: 12, range: 3, fireRate: 1.0, color: '#4fc3f7', projectileColor: '#81d4fa', splash: 0 },
    { name: 'Cannon', cost: 100, damage: 30, range: 2.5, fireRate: 0.6, color: '#ffb74d', projectileColor: '#ffcc80', splash: 1.2 },
    { name: 'Sniper', cost: 150, damage: 55, range: 5, fireRate: 0.4, color: '#e1bee7', projectileColor: '#f3e5f5', splash: 0 },
    { name: 'Rapid', cost: 120, damage: 6, range: 2.8, fireRate: 3.0, color: '#a5d6a7', projectileColor: '#c8e6c9', splash: 0 }
];

// Enemy definitions
function getEnemyDef(type) {
    const base = { basic: { hp: 50, speed: 1.2, reward: 10, color: '#ef5350', size: 0.3 }, fast: { hp: 30, speed: 2.0, reward: 15, color: '#ffee58', size: 0.25 }, tank: { hp: 150, speed: 0.7, reward: 25, color: '#66bb6a', size: 0.4 } };
    return base[type] || base.basic;
}

function getWaveEnemyTypes(w) {
    const types = ['basic'];
    if (w >= 3) types.push('fast');
    if (w >= 5) types.push('tank');
    return types;
}

function spawnWave() {
    wave++;
    waveActive = true;
    betweenWaves = false;
    const count = 5 + Math.floor(wave * 1.5);
    const hpMult = 1 + wave * 0.35;
    const speedMult = 1 + wave * 0.02;
    const types = getWaveEnemyTypes(wave);
    for (let i = 0; i < count; i++) {
        const type = types[Math.floor(Math.random() * types.length)];
        const def = getEnemyDef(type);
        let hp = def.hp * hpMult;
        let isBoss = false;
        if (wave % 10 === 0 && i === Math.floor(count / 2)) {
            hp *= 5;
            isBoss = true;
        }
        spawnQueue.push({ type, hp, maxHp: hp, speed: def.speed * speedMult * (isBoss ? 0.5 : 1), reward: Math.floor(def.reward * (1 + wave * 0.1)), color: def.color, size: def.size * (isBoss ? 2 : 1), isBoss });
    }
    spawnTimer = 0;
}

function startGame() {
    gold = 250;
    lives = 20;
    wave = 0;
    score = 0;
    enemies = [];
    towers = [];
    projectiles = [];
    particles = [];
    spawnQueue = [];
    waveActive = false;
    betweenWaves = true;
    nextWaveTimer = 3;
    gameSpeed = 1;
    selectedTower = -1;
    gameState = STATE.PLAYING;
}

// Enemy path following
function getWaypointPixels(wpi) {
    return { x: (wpi.x + 0.5) * cellW, y: (wpi.y + 0.5) * cellH + 80 };
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const wpTarget = getWaypointPixels(e.wpIndex);
        const dx = wpTarget.x - e.x;
        const dy = wpTarget.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const moveSpeed = e.speed * cellW * dt;

        if (dist <= moveSpeed) {
            e.x = wpTarget.x;
            e.y = wpTarget.y;
            e.wpIndex++;
            if (e.wpIndex >= pathWaypoints.length) {
                lives--;
                playSound(100, 0.3, 'sawtooth', 0.15);
                enemies.splice(i, 1);
                continue;
            }
        } else {
            e.x += (dx / dist) * moveSpeed;
            e.y += (dy / dist) * moveSpeed;
        }

        if (e.hp <= 0) {
            gold += e.reward;
            score += e.reward;
            playSound(200 + Math.random() * 100, 0.15, 'square', 0.08);
            for (let p = 0; p < 6; p++) {
                particles.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3, life: 0.5, color: e.color });
            }
            enemies.splice(i, 1);
        }
    }
}

function updateTowers(dt) {
    for (const t of towers) {
        t.cooldown -= dt;
        if (t.cooldown <= 0) {
            const range = t.range * cellW;
            let target = null, bestDist = Infinity;
            for (const e of enemies) {
                const dx = e.x - t.px, dy = e.y - t.py;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d <= range && e.wpIndex > (t.lastWp || 0)) {
                    // Target enemy furthest along path
                    const progress = e.wpIndex * 1000 - d / range;
                    if (progress < bestDist) { bestDist = progress; target = e; }
                }
            }
            if (target) {
                t.cooldown = 1 / t.fireRate;
                const type = TOWER_TYPES[t.type];
                projectiles.push({ x: t.px, y: t.py, tx: target.x, ty: target.y, target, damage: type.damage, speed: 8 * cellW, color: type.projectileColor, splash: type.splash });
                playSound(400 + t.type * 100, 0.08, 'square', 0.04);
            }
        }
    }
}

function updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (!p.target || p.target.hp <= 0) {
            // Retarget or remove
            let newTarget = null, bestD = Infinity;
            for (const e of enemies) {
                const dx = e.x - p.x, dy = e.y - p.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < bestD && d < cellW * 2) { bestD = d; newTarget = e; }
            }
            if (newTarget) { p.target = newTarget; }
            else { projectiles.splice(i, 1); continue; }
        }
        const dx = p.target.x - p.x, dy = p.target.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const moveSpeed = p.speed * dt;
        if (dist <= moveSpeed) {
            // Hit
            hitEnemy(p.target, p.damage, p.splash);
            projectiles.splice(i, 1);
        } else {
            p.x += (dx / dist) * moveSpeed;
            p.y += (dy / dist) * moveSpeed;
        }
    }
}

function hitEnemy(target, damage, splash) {
    target.hp -= damage;
    if (splash > 0) {
        const splashRadius = splash * cellW * 0.6;
        for (const e of enemies) {
            if (e === target) continue;
            const dx = e.x - target.x, dy = e.y - target.y;
            if (Math.sqrt(dx * dx + dy * dy) < splashRadius) {
                e.hp -= damage * 0.5;
            }
        }
    }
    for (let p = 0; p < 3; p++) {
        particles.push({ x: target.x, y: target.y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, life: 0.3, color: '#fff' });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * cellW * dt;
        p.y += p.vy * cellH * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function update(dt) {
    if (gameState !== STATE.PLAYING) return;
    dt *= gameSpeed;

    if (!waveActive && betweenWaves) {
        nextWaveTimer -= dt;
        if (nextWaveTimer <= 0) spawnWave();
    }

    // Spawning
    if (waveActive && spawnQueue.length > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            const def = spawnQueue.shift();
            const start = getWaypointPixels(0);
            enemies.push({ x: start.x, y: start.y, wpIndex: 1, hp: def.hp, maxHp: def.maxHp, speed: def.speed, reward: def.reward, color: def.color, size: def.size, isBoss: def.isBoss });
            spawnTimer = Math.max(0.3, 1.2 - wave * 0.05);
        }
    }

    if (waveActive && spawnQueue.length === 0 && enemies.length === 0) {
        waveActive = false;
        betweenWaves = true;
        nextWaveTimer = 4;
        gold += 20 + wave * 2;
    }

    updateEnemies(dt);
    updateTowers(dt);
    updateProjectiles(dt);
    updateParticles(dt);

    if (lives <= 0) {
        gameState = STATE.GAMEOVER;
    }
}

// Rendering
function drawGrid() {
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
            const x = c * cellW, y = r * cellH + 80;
            if (isPathCell(c, r)) {
                ctx.fillStyle = '#3a3a5c';
                ctx.fillRect(x, y, cellW, cellH);
                ctx.strokeStyle = '#4a4a6c';
                ctx.strokeRect(x, y, cellW, cellH);
            } else {
                ctx.fillStyle = '#2a2a4a';
                ctx.fillRect(x, y, cellW, cellH);
                ctx.strokeStyle = '#3a3a5a';
                ctx.strokeRect(x, y, cellW, cellH);
            }
        }
    }

    // Path direction arrows
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    for (let i = 0; i < pathWaypoints.length - 1; i++) {
        const a = getWaypointPixels(pathWaypoints[i]);
        const b = getWaypointPixels(pathWaypoints[i + 1]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = cellW * 0.3;
        ctx.stroke();
    }
}

function drawTowers() {
    for (const t of towers) {
        const type = TOWER_TYPES[t.type];
        const x = t.px, y = t.py;
        // Base
        ctx.fillStyle = '#2a2a4a';
        ctx.beginPath();
        ctx.arc(x, y, cellW * 0.35, 0, Math.PI * 2);
        ctx.fill();
        // Tower body
        ctx.fillStyle = type.color;
        ctx.beginPath();
        ctx.arc(x, y, cellW * 0.25, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Level indicator
        if (t.level > 1) {
            ctx.fillStyle = '#fff';
            ctx.font = `${Math.max(10, cellW * 0.2)}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(t.level, x, y + 4);
        }
    }
}

function drawEnemies() {
    for (const e of enemies) {
        const s = e.size * cellW;
        ctx.fillStyle = e.color;
        ctx.beginPath();
        if (e.isBoss) {
            // Boss: diamond shape
            ctx.moveTo(e.x, e.y - s);
            ctx.lineTo(e.x + s, e.y);
            ctx.lineTo(e.x, e.y + s);
            ctx.lineTo(e.x - s, e.y);
        } else {
            ctx.arc(e.x, e.y, s, 0, Math.PI * 2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = e.isBoss ? 3 : 1;
        ctx.stroke();

        // HP bar
        const bw = s * 2, bh = 4;
        const bx = e.x - bw / 2, by = e.y - s - 8;
        ctx.fillStyle = '#333';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#4caf50' : e.hp / e.maxHp > 0.25 ? '#ff9800' : '#f44336';
        ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
    }
}

function drawProjectiles() {
    for (const p of projectiles) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = p.life / 0.5;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawUI() {
    // Top bar
    ctx.fillStyle = 'rgba(20,20,40,0.9)';
    ctx.fillRect(0, 0, W, 80);
    ctx.strokeStyle = '#4a4a6c';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 80);
    ctx.lineTo(W, 80);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Wave: ${wave}`, 20, 30);
    ctx.fillStyle = '#ffd54f';
    ctx.fillText(`Gold: ${gold}`, 150, 30);
    ctx.fillStyle = lives > 5 ? '#66bb6a' : '#ef5350';
    ctx.fillText(`Lives: ${lives}`, 320, 30);
    ctx.fillStyle = '#90caf9';
    ctx.fillText(`Score: ${score}`, 470, 30);

    if (betweenWaves && gameState === STATE.PLAYING) {
        ctx.fillStyle = '#aaa';
        ctx.font = '14px sans-serif';
        ctx.fillText(`Next wave in ${Math.ceil(nextWaveTimer)}s`, 650, 30);
    }

    // Speed
    ctx.fillStyle = gameSpeed === 2 ? '#ffd54f' : '#aaa';
    ctx.fillText(`Speed: x${gameSpeed} [F]`, 850, 30);

    // Tower shop at bottom
    const shopY = H - 60;
    ctx.fillStyle = 'rgba(20,20,40,0.9)';
    ctx.fillRect(0, shopY, W, 60);
    ctx.strokeStyle = '#4a4a6c';
    ctx.beginPath();
    ctx.moveTo(0, shopY);
    ctx.lineTo(W, shopY);
    ctx.stroke();

    for (let i = 0; i < TOWER_TYPES.length; i++) {
        const t = TOWER_TYPES[i];
        const bx = 20 + i * 160;
        const selected = selectedTower === i;
        ctx.fillStyle = selected ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)';
        ctx.fillRect(bx, shopY + 5, 150, 50);
        if (selected) {
            ctx.strokeStyle = t.color;
            ctx.lineWidth = 2;
            ctx.strokeRect(bx, shopY + 5, 150, 50);
        }
        ctx.fillStyle = t.color;
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`${t.name}`, bx + 10, shopY + 22);
        ctx.fillStyle = gold >= t.cost ? '#ffd54f' : '#ef5350';
        ctx.font = '12px sans-serif';
        ctx.fillText(`$${t.cost}  [${i + 1}]`, bx + 10, shopY + 40);
    }

    // Hover cell indicator
    if (hoverCell && gameState === STATE.PLAYING) {
        const { col, row } = hoverCell;
        if (!isPathCell(col, row)) {
            const hx = col * cellW, hy = row * cellH + 80;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.strokeRect(hx, hy, cellW, cellH);
            if (selectedTower >= 0 && !isTowerAt(col, row)) {
                // Range preview
                const type = TOWER_TYPES[selectedTower];
                const cx = hx + cellW / 2, cy = hy + cellH / 2;
                ctx.beginPath();
                ctx.arc(cx, cy, type.range * cellW, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.stroke();
            }
        }
    }

    // Controls hint
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('Click tower type [1-4] then click grid to place | Right-click to sell | R=restart', W - 20, shopY + 45);
}

function drawMenu() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ENDLESS TOWER DEFENSE', W / 2, H / 3);

    ctx.font = '20px sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('Defend against endless waves of enemies!', W / 2, H / 3 + 50);

    ctx.font = '16px sans-serif';
    ctx.fillStyle = '#888';
    const lines = [
        'Place towers on the grid to stop enemies from reaching the exit.',
        'Enemies follow the S-shaped path. Each wave gets harder!',
        '',
        'CONTROLS:',
        '[1-4] Select tower type',
        '[Click] Place selected tower on grid',
        '[Right-click] Sell tower (50% refund)',
        '[F] Toggle game speed',
        '[R] Restart game',
    ];
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 3 + 100 + i * 28));

    // Tower types info
    ctx.font = 'bold 14px sans-serif';
    const tw = [TOWER_TYPES[0], TOWER_TYPES[1], TOWER_TYPES[2], TOWER_TYPES[3]];
    tw.forEach((t, i) => {
        const tx = W / 2 - 350 + i * 200;
        ctx.fillStyle = t.color;
        ctx.fillText(`${t.name} $${t.cost}`, tx, H / 3 + 280);
    });

    // Start button
    const btnW = 200, btnH = 50;
    const btnX = W / 2 - btnW / 2, btnY = H - 120;
    ctx.fillStyle = '#4fc3f7';
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('START GAME', W / 2, btnY + 32);

    // Pulsing prompt
    const pulse = 0.5 + Math.sin(Date.now() * 0.003) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.font = '14px sans-serif';
    ctx.fillText('Press ENTER or click to start', W / 2, btnY + 70);
    ctx.globalAlpha = 1;
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ef5350';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 3);

    ctx.fillStyle = '#fff';
    ctx.font = '24px sans-serif';
    ctx.fillText(`Waves Survived: ${wave}`, W / 2, H / 3 + 50);
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 3 + 90);

    // Best score
    let best = 0;
    try { best = parseInt(localStorage.getItem('etd_best') || '0'); } catch(e) {}
    if (score > best) {
        best = score;
        try { localStorage.setItem('etd_best', String(best)); } catch(e) {}
        ctx.fillStyle = '#ffd54f';
        ctx.fillText('NEW HIGH SCORE!', W / 2, H / 3 + 130);
    } else {
        ctx.fillStyle = '#aaa';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Best: ${best}`, W / 2, H / 3 + 130);
    }

    const btnW = 200, btnH = 50;
    const btnX = W / 2 - btnW / 2, btnY = H - 120;
    ctx.fillStyle = '#66bb6a';
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('PLAY AGAIN [R]', W / 2, btnY + 32);
}

function render() {
    ctx.clearRect(0, 0, W, H);

    if (gameState === STATE.MENU) {
        drawMenu();
    } else if (gameState === STATE.PLAYING) {
        drawGrid();
        drawTowers();
        drawEnemies();
        drawProjectiles();
        drawParticles();
        drawUI();
    } else if (gameState === STATE.GAMEOVER) {
        drawGrid();
        drawTowers();
        drawEnemies();
        drawUI();
        drawGameOver();
    }
}

// Input
function getCellFromMouse(mx, my) {
    const col = Math.floor(mx / cellW);
    const row = Math.floor((my - 80) / cellH);
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) return { col, row };
    return null;
}

canvas.addEventListener('mousemove', (e) => {
    hoverCell = getCellFromMouse(e.clientX, e.clientY);
});

canvas.addEventListener('click', (e) => {
    initAudio();
    if (gameState === STATE.MENU || gameState === STATE.GAMEOVER) {
        startGame();
        return;
    }
    if (gameState !== STATE.PLAYING) return;

    const cell = getCellFromMouse(e.clientX, e.clientY);
    if (!cell || isPathCell(cell.col, cell.row)) return;
    if (isTowerAt(cell.col, cell.row)) return;
    if (selectedTower < 0) return;

    const type = TOWER_TYPES[selectedTower];
    if (gold < type.cost) { playSound(150, 0.2, 'sawtooth', 0.1); return; }

    gold -= type.cost;
    towers.push({
        col: cell.col, row: cell.row,
        px: (cell.col + 0.5) * cellW,
        py: (cell.row + 0.5) * cellH + 80,
        type: selectedTower,
        range: type.range,
        fireRate: type.fireRate,
        cooldown: 0,
        level: 1
    });
    playSound(300, 0.1, 'sine', 0.1);
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (gameState !== STATE.PLAYING) return;
    const cell = getCellFromMouse(e.clientX, e.clientY);
    if (!cell) return;
    const tIdx = towers.findIndex(t => t.col === cell.col && t.row === cell.row);
    if (tIdx >= 0) {
        // Sell for 50%
        gold += Math.floor(TOWER_TYPES[towers[tIdx].type].cost * 0.5);
        playSound(200, 0.15, 'triangle', 0.1);
        towers.splice(tIdx, 1);
    }
});

window.addEventListener('keydown', (e) => {
    initAudio();
    if (gameState === STATE.MENU || gameState === STATE.GAMEOVER) {
        if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') startGame();
        return;
    }
    if (e.key >= '1' && e.key <= '4') {
        const idx = parseInt(e.key) - 1;
        selectedTower = selectedTower === idx ? -1 : idx;
    }
    if (e.key === 'Escape') selectedTower = -1;
    if (e.key === 'f' || e.key === 'F') gameSpeed = gameSpeed === 1 ? 2 : 1;
    if (e.key === 'r' || e.key === 'R') startGame();
});

// Game Loop
let lastTime = performance.now();
function gameLoop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
