<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bullet Storm Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08081a}
canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const C=document.getElementById('c'),X=C.getContext('2d');
const LW=960,LH=720,COLS=12,ROWS=8,CELL=78,GX=12,GY=48;
const WPTS=[[-30,321],[285,321],[285,555],[519,555],[519,165],[753,165],[753,633],[990,633]];
const TD=[
{name:'Pulse',cost:50,dmg:15,rng:200,rate:.8,bSpd:300,col:'#4af',n:1,desc:'Single shot'},
{name:'Fan',cost:80,dmg:10,rng:200,rate:1,bSpd:300,col:'#f6a',n:3,spread:.35,desc:'3-way spread'},
{name:'Vortex',cost:120,dmg:8,rng:250,rate:.35,bSpd:250,col:'#ff0',n:2,spiral:1,desc:'Spiral barrage'},
{name:'Cannon',cost:100,dmg:40,rng:180,rate:1.5,bSpd:200,col:'#f66',aoe:60,desc:'Heavy AoE'},
{name:'Rapid',cost:70,dmg:8,rng:180,rate:.3,bSpd:400,col:'#6f6',n:1,desc:'Fast fire'}
];
const ED={
grunt:{hp:50,spd:60,rw:10,sz:14,col:'#e44',lc:1},
runner:{hp:30,spd:120,rw:8,sz:10,col:'#ea4',lc:1},
tank:{hp:200,spd:40,rw:25,sz:20,col:'#a4e',lc:2},
boss:{hp:800,spd:30,rw:100,sz:28,col:'#f0f',lc:5}
};
const pCells=new Set();
(function(){
const g=[[0,3],[3,3],[3,6],[6,6],[6,1],[9,1],[9,7]];
for(let i=0;i<g.length-1;i++){
const[a,b]=g[i],[c,d]=g[i+1];
if(a===c){for(let r=Math.min(b,d);r<=Math.max(b,d);r++)pCells.add(a+','+r);}
else{for(let cc=Math.min(a,c);cc<=Math.max(a,c);cc++)pCells.add(cc+','+b);}
}})();

let AC=null;
function iA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
function beep(f,d,t,v){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function sfx(n){if(!AC)return;if(n==='pl'){beep(440,.08,'square',.08);setTimeout(()=>beep(880,.1,'square',.06),50);}else if(n==='die'){beep(200,.06,'sawtooth',.05);}else if(n==='wv'){beep(300,.25,'sine',.07);setTimeout(()=>beep(600,.15,'sine',.05),120);}else if(n==='ov'){beep(200,.8,'sawtooth',.08);}else if(n==='cn'){beep(80,.08,'triangle',.1);}else if(n==='up'){beep(660,.08,'square',.07);setTimeout(()=>beep(880,.1,'square',.07),70);}}

let gs='start',gold=150,lives=20,wave=0,spdM=1;
let tws=[],ens=[],blts=[],pts=[];
let selT=-1,selTw=null,hov=null;
let sQ=[],sT=0,wAct=false,wAnn=0;
let mX=0,mY=0,bestW=0;
try{bestW=parseInt(localStorage.getItem('bsd_b')||'0');}catch(e){}
function svB(){if(wave>bestW){bestW=wave;try{localStorage.setItem('bsd_b',''+bestW);}catch(e){}}}

let sc,ox,oy;
function rsz(){C.width=innerWidth;C.height=innerHeight;sc=Math.min(C.width/LW,C.height/LH);ox=(C.width-LW*sc)/2;oy=(C.height-LH*sc)/2;}
addEventListener('resize',rsz);rsz();
function toL(sx,sy){return[(sx-ox)/sc,(sy-oy)/sc];}

addEventListener('keydown',e=>{
iA();
if(e.code==='Space')e.preventDefault();
if(gs==='start'&&(e.code==='Space'||e.code==='Enter')){stG();return;}
if((gs==='go'||gs==='win')&&e.code==='Space'){stG();return;}
if(gs!=='play')return;
if(e.code==='Space')stW();
if(e.code==='Digit1')selT=0;if(e.code==='Digit2')selT=1;if(e.code==='Digit3')selT=2;if(e.code==='Digit4')selT=3;if(e.code==='Digit5')selT=4;
if(e.code==='Escape'){selT=-1;selTw=null;}
if(e.code==='KeyF')spdM=spdM===1?2:spdM===2?4:1;
});

C.addEventListener('mousemove',e=>{
const[lx,ly]=toL(e.clientX,e.clientY);mX=lx;mY=ly;
const c=Math.floor((lx-GX)/CELL),r=Math.floor((ly-GY)/CELL);
hov=(c>=0&&c<COLS&&r>=0&&r<ROWS)?{c,r}:null;
});

C.addEventListener('click',e=>{
iA();
const[lx,ly]=toL(e.clientX,e.clientY);
if(gs==='start'){stG();return;}
if(gs==='go'||gs==='win'){stG();return;}
if(gs!=='play')return;
const pY=GY+ROWS*CELL;
// HUD click: next wave button
if(!wAct&&ly<44&&lx>=LW-160&&lx<=LW-20){stW();return;}
// Bottom panel
if(ly>=pY){
if(selTw){
const td=TD[selTw.type],midX=GX+COLS*CELL/2;
if(lx<midX){
const uc=Math.floor(td.cost*(selTw.lvl===1?.8:1.2));
if(selTw.lvl<3&&gold>=uc){gold-=uc;selTw.lvl++;sfx('up');}
}else{
const rf=Math.floor(td.cost*.6*selTw.lvl);
gold+=rf;tws.splice(tws.indexOf(selTw),1);selTw=null;
}
return;
}
const bw=COLS*CELL/5;
for(let i=0;i<5;i++){if(lx>=GX+i*bw&&lx<GX+(i+1)*bw){selT=selT===i?-1:i;return;}}
return;
}
// Grid
const c=Math.floor((lx-GX)/CELL),r=Math.floor((ly-GY)/CELL);
if(c<0||c>=COLS||r<0||r>=ROWS)return;
const et=tws.find(t=>t.c===c&&t.r===r);
if(et){selTw=et;selT=-1;return;}
if(selT>=0){
if(pCells.has(c+','+r))return;
const td=TD[selT];
if(gold>=td.cost){gold-=td.cost;tws.push({c,r,cx:GX+c*CELL+CELL/2,cy:GY+r*CELL+CELL/2,type:selT,lvl:1,cd:0,ang:0,sA:Math.random()*6.28});sfx('pl');}
}else{selTw=null;}
});
C.addEventListener('contextmenu',e=>{e.preventDefault();selT=-1;selTw=null;});

function genW(n){
const q=[];
for(let i=0;i<5+n*2;i++)q.push('grunt');
if(n>=3)for(let i=0;i<(n-1)*2;i++)q.push('runner');
if(n>=5)for(let i=0;i<n-3;i++)q.push('tank');
if(n%5===0)q.push('boss');
for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]];}
return q;
}
function stW(){
if(wAct||gs!=='play')return;
wave++;wAct=true;sQ=genW(wave);sT=0;wAnn=2;sfx('wv');
}
function spE(t){
const d=ED[t],hp=Math.floor(d.hp*(1+wave*.15));
ens.push({x:WPTS[0][0],y:WPTS[0][1],hp,mhp:hp,spd:d.spd,wpi:1,type:t,rw:d.rw,sz:d.sz,col:d.col,lc:d.lc,pd:0});
}

function updt(dt){
if(gs!=='play')return;
if(wAct&&sQ.length>0){sT-=dt;if(sT<=0){spE(sQ.shift());sT=.7;}}
for(let i=ens.length-1;i>=0;i--){
const e=ens[i],wp=WPTS[e.wpi];
if(!wp){ens.splice(i,1);continue;}
const dx=wp[0]-e.x,dy=wp[1]-e.y,dist=Math.sqrt(dx*dx+dy*dy),mv=e.spd*dt;
if(dist<=mv){e.pd+=dist;e.wpi++;
if(e.wpi>=WPTS.length){lives-=e.lc;ens.splice(i,1);if(lives<=0){gs='go';svB();sfx('ov');}}
}else{e.x+=dx/dist*mv;e.y+=dy/dist*mv;e.pd+=mv;}
}
for(const t of tws){
t.cd-=dt;if(t.cd>0)continue;
const td=TD[t.type],rng=td.rng*(1+(t.lvl-1)*.1);
let best=null,bd=-1;
for(const e of ens){const dx=e.x-t.cx,dy=e.y-t.cy;if(dx*dx+dy*dy<=rng*rng&&e.pd>bd){best=e;bd=e.pd;}}
if(!best)continue;
t.cd=td.rate*(t.lvl>=2?.85:1);
const dmg=td.dmg*Math.pow(1.35,t.lvl-1);
const ta=Math.atan2(best.y-t.cy,best.x-t.cx);t.ang=ta;
if(td.spiral){
t.sA+=.4;const nn=td.n+(t.lvl-1);
for(let j=0;j<nn;j++){const a=t.sA+j*6.28/nn;blts.push({x:t.cx,y:t.cy,vx:Math.cos(a)*td.bSpd,vy:Math.sin(a)*td.bSpd,dmg,col:td.col,life:3,aoe:0});}
}else if(td.n>1){
for(let j=0;j<td.n;j++){const a=ta+(j-(td.n-1)/2)*td.spread;blts.push({x:t.cx,y:t.cy,vx:Math.cos(a)*td.bSpd,vy:Math.sin(a)*td.bSpd,dmg,col:td.col,life:3,aoe:0});}
}else{
blts.push({x:t.cx,y:t.cy,vx:Math.cos(ta)*td.bSpd,vy:Math.sin(ta)*td.bSpd,dmg,col:td.col,life:3,aoe:td.aoe||0});
if(td.aoe)sfx('cn');
}
}
for(let i=blts.length-1;i>=0;i--){
const b=blts[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
if(b.life<=0||b.x<-30||b.x>LW+30||b.y<-30||b.y>LH+30){blts.splice(i,1);continue;}
let hit=false;
for(let j=ens.length-1;j>=0;j--){
const e=ens[j],dx=b.x-e.x,dy=b.y-e.y,hr=e.sz+4;
if(dx*dx+dy*dy<hr*hr){hit=true;e.hp-=b.dmg;
if(b.aoe>0)for(const e2 of ens){const ax=e2.x-e.x,ay=e2.y-e.y;if(ax*ax+ay*ay<b.aoe*b.aoe&&e2!==e)e2.hp-=b.dmg*.5;}
if(e.hp<=0){gold+=e.rw;sfx('die');for(let p=0;p<8;p++){const a=Math.random()*6.28,sp=50+Math.random()*100;pts.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.5,col:e.col,sz:e.sz*.4});}ens.splice(j,1);}
break;}
}
if(hit)blts.splice(i,1);
}
for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)pts.splice(i,1);}
if(wAct&&sQ.length===0&&ens.length===0){wAct=false;gold+=20+wave*5;if(wave>=15){gs='win';svB();}}
if(wAnn>0)wAnn-=dt;
}

function rG(){
for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
const x=GX+c*CELL,y=GY+r*CELL;
X.fillStyle=pCells.has(c+','+r)?'#1a1a32':'#121225';X.fillRect(x,y,CELL,CELL);
X.strokeStyle='#1e1e40';X.lineWidth=1;X.strokeRect(x+.5,y+.5,CELL-1,CELL-1);}
if(hov&&gs==='play'){const{c,r}=hov,x=GX+c*CELL,y=GY+r*CELL;
if(!pCells.has(c+','+r)){X.fillStyle='rgba(100,150,255,.12)';X.fillRect(x,y,CELL,CELL);X.strokeStyle='rgba(100,150,255,.5)';X.lineWidth=2;X.strokeRect(x+1,y+1,CELL-2,CELL-2);}
else{X.fillStyle='rgba(255,80,80,.1)';X.fillRect(x,y,CELL,CELL);}}
}
function rP(){
X.save();X.lineCap='round';X.lineJoin='round';
X.strokeStyle='#3a3a6a';X.lineWidth=CELL*.7;X.beginPath();X.moveTo(WPTS[0][0],WPTS[0][1]);for(let i=1;i<WPTS.length;i++)X.lineTo(WPTS[i][0],WPTS[i][1]);X.stroke();
X.strokeStyle='#25254a';X.lineWidth=CELL*.45;X.beginPath();X.moveTo(WPTS[0][0],WPTS[0][1]);for(let i=1;i<WPTS.length;i++)X.lineTo(WPTS[i][0],WPTS[i][1]);X.stroke();
X.restore();
}
function rT(){
const now=performance.now()/1000;
for(const t of tws){const td=TD[t.type];
X.save();X.translate(t.cx,t.cy);
X.fillStyle='#2a2a4a';X.beginPath();X.arc(0,0,CELL*.35,0,6.28);X.fill();X.strokeStyle=td.col;X.lineWidth=2;X.stroke();
X.fillStyle=td.col;
if(td.spiral){const rot=now*2;X.save();X.rotate(rot);for(let i=0;i<6;i++){X.save();X.rotate(i*1.047);X.fillRect(-2,-15,4,15);X.restore();}X.restore();}
else if(td.n>1){X.beginPath();X.moveTo(0,-14);X.lineTo(12,10);X.lineTo(-12,10);X.closePath();X.fill();}
else if(td.aoe){X.fillRect(-10,-10,20,20);}
else{X.beginPath();X.arc(0,0,8,0,6.28);X.fill();}
for(let l=0;l<t.lvl;l++){X.fillStyle=l+1===t.lvl?'#fff':'#aaa';X.beginPath();X.arc((l-1)*8,24,3,0,6.28);X.fill();}
if(selTw===t){const rng=td.rng*(1+(t.lvl-1)*.1);X.strokeStyle='rgba(255,255,255,.2)';X.lineWidth=1;X.beginPath();X.arc(0,0,rng,0,6.28);X.stroke();}
X.restore();}
if(selT>=0&&hov&&!pCells.has(hov.c+','+hov.r)){const td=TD[selT],px=GX+hov.c*CELL+CELL/2,py=GY+hov.r*CELL+CELL/2;X.strokeStyle='rgba(255,255,255,.15)';X.lineWidth=1;X.beginPath();X.arc(px,py,td.rng,0,6.28);X.stroke();}
}
function rE(){for(const e of ens){X.save();X.translate(e.x,e.y);X.fillStyle=e.col;X.beginPath();X.arc(0,0,e.sz,0,6.28);X.fill();X.strokeStyle='#fff';X.lineWidth=1.5;X.stroke();const bw=e.sz*2;X.fillStyle='#300';X.fillRect(-bw/2,-e.sz-8,bw,4);X.fillStyle=e.hp/e.mhp>.5?'#0f0':'#f00';X.fillRect(-bw/2,-e.sz-8,bw*(e.hp/e.mhp),4);X.restore();}}
function rB(){for(const b of blts){X.fillStyle=b.col;X.globalAlpha=.9;X.beginPath();X.arc(b.x,b.y,3,0,6.28);X.fill();X.globalAlpha=.3;X.beginPath();X.arc(b.x,b.y,6,0,6.28);X.fill();}X.globalAlpha=1;}
function rPt(){for(const p of pts){X.globalAlpha=Math.max(0,p.life/.5);X.fillStyle=p.col;X.beginPath();X.arc(p.x,p.y,Math.max(1,p.sz*(p.life/.5)),0,6.28);X.fill();}X.globalAlpha=1;}
function rH(){
X.fillStyle='rgba(10,10,30,.9)';X.fillRect(0,0,LW,44);X.strokeStyle='#2a2a5a';X.lineWidth=1;X.strokeRect(0,0,LW,44);
X.font='bold 16px monospace';X.textAlign='left';
X.fillStyle='#ff0';X.fillText('$'+gold,20,28);
X.fillStyle=lives>5?'#4f4':'#f44';X.fillText('\u2764 '+lives,130,28);
X.fillStyle='#aaf';X.fillText('WAVE '+wave+'/15',240,28);
X.fillStyle='#aaa';X.fillText('Speed:'+spdM+'x[F]',350,28);
if(!wAct){const bx=LW-160,by=8,bw=140,bh=28;X.fillStyle='#2a5a2a';X.fillRect(bx,by,bw,bh);X.strokeStyle='#4f4';X.lineWidth=1.5;X.strokeRect(bx,by,bw,bh);X.fillStyle='#4f4';X.textAlign='center';X.font='bold 13px monospace';X.fillText('NEXT WAVE [SPC]',bx+bw/2,by+19);}
X.fillStyle='#555';X.textAlign='right';X.font='11px monospace';X.fillText('Best:'+bestW,LW-170,28);
}
function rBP(){
const pY=GY+ROWS*CELL;
X.fillStyle='rgba(10,10,30,.95)';X.fillRect(GX,pY,COLS*CELL,LH-pY);
if(selTw){
const td=TD[selTw.type];X.font='bold 14px monospace';X.textAlign='center';X.fillStyle='#fff';
X.fillText(td.name+' Lv'+selTw.lvl,GX+COLS*CELL/2,pY+16);
const uc=Math.floor(td.cost*(selTw.lvl===1?.8:1.2));
if(selTw.lvl<3){X.fillStyle=gold>=uc?'#2a4a6a':'#2a2a3a';X.fillRect(GX+10,pY+22,200,24);X.strokeStyle='#4af';X.lineWidth=1;X.strokeRect(GX+10,pY+22,200,24);X.fillStyle=gold>=uc?'#4af':'#666';X.font='13px monospace';X.fillText('UPGRADE $'+uc,GX+110,pY+39);}
else{X.fillStyle='#666';X.font='13px monospace';X.fillText('MAX LEVEL',GX+110,pY+39);}
const rf=Math.floor(td.cost*.6*selTw.lvl);
X.fillStyle='#5a2a2a';X.fillRect(GX+COLS*CELL-210,pY+22,200,24);X.strokeStyle='#f66';X.lineWidth=1;X.strokeRect(GX+COLS*CELL-210,pY+22,200,24);X.fillStyle='#f66';X.font='13px monospace';X.fillText('SELL +$'+rf,GX+COLS*CELL-110,pY+39);
}else{
const bw=COLS*CELL/5;
for(let i=0;i<5;i++){const td=TD[i],bx=GX+i*bw,sel=selT===i;
X.fillStyle=sel?'rgba(80,120,200,.25)':'rgba(20,20,40,.5)';X.fillRect(bx+2,pY+2,bw-4,LH-pY-4);
if(sel){X.strokeStyle='#4af';X.lineWidth=2;X.strokeRect(bx+2,pY+2,bw-4,LH-pY-4);}
X.fillStyle=td.col;X.beginPath();X.arc(bx+bw/2,pY+14,7,0,6.28);X.fill();
X.font='bold 11px monospace';X.textAlign='center';X.fillStyle='#fff';X.fillText(td.name,bx+bw/2,pY+32);
X.fillStyle=gold>=td.cost?'#ff0':'#f66';X.fillText('$'+td.cost+'['+(i+1)+']',bx+bw/2,pY+45);}
}
}
function rS(){
X.fillStyle='#0a0a1a';X.fillRect(0,0,LW,LH);
// Animated background bullets for flair
const t=performance.now()/1000;
for(let i=0;i<30;i++){
const bx=((i*137+t*20)%LW),by=((i*89+t*15)%LH);
X.fillStyle='rgba(100,150,255,.15)';X.beginPath();X.arc(bx,by,2,0,6.28);X.fill();}
X.shadowColor='#f80';X.shadowBlur=20;X.font='bold 42px monospace';X.textAlign='center';X.fillStyle='#ff0';
X.fillText('BULLET STORM',LW/2,160);X.fillText('DEFENSE',LW/2,210);X.shadowBlur=0;
X.font='15px monospace';X.fillStyle='#889';
const L=['Place towers to stop enemies reaching your base.','','[1-5] Select tower  [SPACE] Start wave  [F] Speed','[Click] Place/Select  [ESC] Deselect  [R-click] Cancel','',
'Tower types:'];for(let i=0;i<L.length;i++)X.fillText(L[i],LW/2,280+i*24);
const ds=[['Pulse - Reliable single shot','#4af'],['Fan - 3-way spread','#f6a'],['Vortex - Spiral danmaku barrage!','#ff0'],['Cannon - Heavy + area splash','#f66'],['Rapid - Very fast fire rate','#6f6']];
for(let i=0;i<ds.length;i++){X.fillStyle=ds[i][1];X.fillText(ds[i][0],LW/2,280+5*24+i*22);}
const pu=Math.sin(t*3)*.3+.7;X.globalAlpha=pu;X.font='bold 20px monospace';X.fillStyle='#4f4';X.fillText('Press SPACE or CLICK to start',LW/2,560);X.globalAlpha=1;
if(bestW>0){X.font='14px monospace';X.fillStyle='#666';X.fillText('Best wave reached: '+bestW,LW/2,610);}
}
function rEnd(){
X.fillStyle='rgba(0,0,0,.7)';X.fillRect(0,0,LW,LH);X.textAlign='center';
if(gs==='win'){X.shadowColor='#4f4';X.shadowBlur=20;X.font='bold 48px monospace';X.fillStyle='#4f4';X.fillText('VICTORY!',LW/2,260);X.shadowBlur=0;X.font='18px monospace';X.fillStyle='#fff';X.fillText('You survived all 15 waves!',LW/2,320);}
else{X.shadowColor='#f44';X.shadowBlur=20;X.font='bold 48px monospace';X.fillStyle='#f44';X.fillText('GAME OVER',LW/2,260);X.shadowBlur=0;X.font='18px monospace';X.fillStyle='#fff';X.fillText('Reached wave '+wave,LW/2,320);}
if(bestW>0){X.font='15px monospace';X.fillStyle='#888';X.fillText('Best: wave '+bestW,LW/2,360);}
const pu=Math.sin(performance.now()/400)*.3+.7;X.globalAlpha=pu;X.font='bold 18px monospace';X.fillStyle='#4af';X.fillText('Press SPACE to restart',LW/2,430);X.globalAlpha=1;
}

function stG(){gs='play';gold=150;lives=20;wave=0;spdM=1;tws=[];ens=[];blts=[];pts=[];selT=-1;selTw=null;sQ=[];wAct=false;wAnn=0;}

function render(){
X.save();X.setTransform(sc,0,0,sc,ox,oy);
X.fillStyle='#0a0a1a';X.fillRect(0,0,LW,LH);
if(gs==='start'){rS();X.restore();return;}
rG();rP();rT();rE();rB();rPt();rH();rBP();
if(wAnn>0){X.save();X.globalAlpha=Math.min(1,wAnn);X.fillStyle='#fff';X.font='bold 48px monospace';X.textAlign='center';X.fillText('WAVE '+wave,LW/2,350);if(wave%5===0){X.font='bold 22px monospace';X.fillStyle='#f0f';X.fillText('\u26A0 BOSS INCOMING \u26A0',LW/2,390);}X.restore();}
if(gs==='go'||gs==='win')rEnd();

}

let lt=0;
function loop(ts){

}
requestAnimationFrame(t=>{lt=t;loop(t);});
