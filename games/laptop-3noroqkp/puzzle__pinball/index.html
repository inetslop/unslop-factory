<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pinball Puzzle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f23; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const GAME_W = 400, GAME_H = 700;
let scale = 1, offsetX = 0, offsetY = 0;

function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    scale = Math.min(w / GAME_W, h / GAME_H);
    canvas.width = GAME_W * scale;
    canvas.height = GAME_H * scale;
    offsetX = (w - canvas.width) / 2;
    offsetY = (h - canvas.height) / 2;
    canvas.style.marginLeft = offsetX + 'px';
    canvas.style.marginTop = offsetY + 'px';
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function sBounce() { playSound(220, 0.1, 'sine', 0.2); }
function sBumper() { playSound(440, 0.15, 'square', 0.3); }
function sTarget() { playSound(880, 0.2, 'sine', 0.4); playSound(1100, 0.3, 'sine', 0.2); }
function sLaunch() { playSound(150, 0.1, 'triangle', 0.3); }
function sComplete() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playSound(f,0.3,'sine',0.3),i*100)); }
function sGameOver() { playSound(200, 0.5, 'sawtooth', 0.2); }

// Game State
const STATE = { MENU: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3, WIN: 4 };
let state = STATE.MENU;
let score = 0;
let level = 0;
let ballsLeft = 5;
let ball = null;
let targets = [];
let bumpers = [];
let walls = [];
let particles = [];
let launchPos = { x: GAME_W - 30, y: GAME_H - 40 };
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let dragEnd = { x: 0, y: 0 };
let ballActive = false;
let levelCompleteTimer = 0;
let shakeTimer = 0;

// Level Definitions
const levels = [
    { // Level 1 - Simple
        balls: 5,
        walls: [
            { x1: 80, y1: 200, x2: 200, y2: 250 },
            { x1: 300, y1: 200, x2: 200, y2: 250 },
            { x1: 150, y1: 400, x2: 250, y2: 400 },
        ],
        bumpers: [
            { x: 120, y: 300, r: 20 },
            { x: 280, y: 300, r: 20 },
        ],
        targets: [
            { x: 50, y: 50, w: 60, h: 15 },
            { x: 170, y: 50, w: 60, h: 15 },
            { x: 290, y: 50, w: 60, h: 15 },
        ]
    },
    { // Level 2 - Medium
        balls: 4,
        walls: [
            { x1: 100, y1: 180, x2: 180, y2: 220 },
            { x1: 300, y1: 180, x2: 220, y2: 220 },
            { x1: 50, y1: 350, x2: 150, y2: 320 },
            { x1: 250, y1: 320, x2: 350, y2: 350 },
            { x1: 150, y1: 480, x2: 250, y2: 480 },
        ],
        bumpers: [
            { x: 100, y: 270, r: 18 },
            { x: 300, y: 270, r: 18 },
            { x: 200, y: 400, r: 15 },
        ],
        targets: [
            { x: 30, y: 50, w: 50, h: 15 },
            { x: 120, y: 50, w: 50, h: 15 },
            { x: 230, y: 50, w: 50, h: 15 },
            { x: 320, y: 50, w: 50, h: 15 },
        ]
    },
    { // Level 3 - Hard
        balls: 4,
        walls: [
            { x1: 60, y1: 150, x2: 140, y2: 180 },
            { x1: 260, y1: 150, x2: 340, y2: 180 },
            { x1: 100, y1: 300, x2: 200, y2: 280 },
            { x1: 200, y1: 280, x2: 300, y2: 300 },
            { x1: 50, y1: 430, x2: 120, y2: 460 },
            { x1: 280, y1: 460, x2: 350, y2: 430 },
            { x1: 170, y1: 550, x2: 230, y2: 550 },
        ],
        bumpers: [
            { x: 80, y: 230, r: 16 },
            { x: 320, y: 230, r: 16 },
            { x: 200, y: 370, r: 14 },
            { x: 150, y: 500, r: 14 },
            { x: 250, y: 500, r: 14 },
        ],
        targets: [
            { x: 20, y: 50, w: 45, h: 15 },
            { x: 90, y: 50, w: 45, h: 15 },
            { x: 180, y: 50, w: 45, h: 15 },
            { x: 270, y: 50, w: 45, h: 15 },
            { x: 340, y: 50, w: 45, h: 15 },
        ]
    }
];

function loadLevel(idx) {
    const lv = levels[idx];
    ballsLeft = lv.balls;
    walls = lv.walls.map(w => ({...w}));
    bumpers = lv.bumpers.map(b => ({...b, hit: 0}));
    targets = lv.targets.map(t => ({...t, hit: false, flash: 0}));
    ball = null;
    ballActive = false;
    particles = [];
}

function startGame() {
    score = 0;
    level = 0;
    loadLevel(0);
    state = STATE.PLAYING;
}

function nextLevel() {
    level++;
    if (level >= levels.length) {
        state = STATE.WIN;
    } else {
        loadLevel(level);
        state = STATE.PLAYING;
    }
}

// Physics
const GRAVITY = 0.15;
const RESTITUTION = 0.8;
const BALL_R = 8;

function launchBall(dx, dy) {
    const power = Math.min(Math.sqrt(dx*dx + dy*dy), 15);
    if (power < 2) return;
    const len = Math.sqrt(dx*dx + dy*dy);
    ball = { x: launchPos.x, y: launchPos.y, vx: dx/len * power, vy: dy/len * power };
    ballActive = true;
    sLaunch();
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2, life: 30+Math.random()*20, color });
    }
}

function updatePhysics() {
    if (!ball || !ballActive) return;

    ball.vy += GRAVITY;
    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall bounces (left and right)
    if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx) * RESTITUTION; sBounce(); }
    if (ball.x + BALL_R > GAME_W) { ball.x = GAME_W - BALL_R; ball.vx = -Math.abs(ball.vx) * RESTITUTION; sBounce(); }

    // Top wall
    if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.vy = Math.abs(ball.vy) * RESTITUTION; sBounce(); }

    // Bottom - ball lost
    if (ball.y + BALL_R > GAME_H) {
        ballActive = false;
        ballsLeft--;
        if (ballsLeft <= 0 && !checkLevelComplete()) {
            state = STATE.GAME_OVER;
            sGameOver();
        }
        return;
    }

    // Bumper collisions
    for (let b of bumpers) {
        const dx = ball.x - b.x, dy = ball.y - b.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < BALL_R + b.r) {
            const nx = dx/dist, ny = dy/dist;
            ball.x = b.x + nx * (BALL_R + b.r);
            ball.y = b.y + ny * (BALL_R + b.r);
            const dot = ball.vx*nx + ball.vy*ny;
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            // Bumper boost
            ball.vx += nx * 4;
            ball.vy += ny * 4;
            b.hit = 15;
            score += 50;
            sBumper();
            shakeTimer = 5;
            spawnParticles(ball.x, ball.y, '#ff6b35', 8);
        }
    }

    // Wall segment collisions
    for (let w of walls) {
        if (circleSegmentCollision(ball, BALL_R, w.x1, w.y1, w.x2, w.y2)) {
            sBounce();
        }
    }

    // Target check
    for (let t of targets) {
        if (!t.hit && ball.x > t.x && ball.x < t.x + t.w && ball.y > t.y && ball.y < t.y + t.h) {
            t.hit = true;
            t.flash = 20;
            score += 100;
            sTarget();
            spawnParticles(t.x + t.w/2, t.y + t.h/2, '#4ecdc4', 15);
        }
    }

    // Speed limit
    const spd = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
    if (spd > 12) { ball.vx *= 12/spd; ball.vy *= 12/spd; }

    // Damping
    ball.vx *= 0.999;
}

function circleSegmentCollision(ball, r, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    if (len2 === 0) return false;
    let t = ((ball.x - x1)*dx + (ball.y - y1)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t*dx, cy = y1 + t*dy;
    const ex = ball.x - cx, ey = ball.y - cy;
    const dist = Math.sqrt(ex*ex + ey*ey);
    if (dist < r) {
        const nx = ex/dist, ny = ey/dist;
        ball.x = cx + nx * r;
        ball.y = cy + ny * r;
        const dot = ball.vx*nx + ball.vy*ny;
        if (dot < 0) {
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            ball.vx *= RESTITUTION;
            ball.vy *= RESTITUTION;
        }
        return true;
    }
    return false;
}

function checkLevelComplete() {
    if (targets.every(t => t.hit)) {
        state = STATE.LEVEL_COMPLETE;
        levelCompleteTimer = 120;
        score += ballsLeft * 200;
        sComplete();
        return true;
    }
    return false;
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function updateBumpers() {
    for (let b of bumpers) { if (b.hit > 0) b.hit--; }
    for (let t of targets) { if (t.flash > 0) t.flash--; }
}

// Rendering
function drawBackground() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, GAME_W, GAME_H);

    // Grid
    ctx.strokeStyle = 'rgba(78, 205, 196, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i < GAME_W; i += 40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,GAME_H); ctx.stroke(); }
    for (let i = 0; i < GAME_H; i += 40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(GAME_W,i); ctx.stroke(); }
}

function drawWalls() {
    ctx.strokeStyle = '#e94560';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (let w of walls) {
        ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    }
}

function drawBumpers() {
    for (let b of bumpers) {
        const glow = b.hit > 0 ? b.hit / 15 : 0;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r + glow * 4, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255, 107, 53, ${0.3 + glow * 0.7})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fillStyle = '#ff6b35';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }
}

function drawTargets() {
    for (let t of targets) {
        if (t.hit) {
            ctx.fillStyle = 'rgba(78, 205, 196, 0.3)';
            ctx.fillRect(t.x, t.y, t.w, t.h);
            ctx.strokeStyle = '#4ecdc4';
            ctx.lineWidth = 2;
            ctx.strokeRect(t.x, t.y, t.w, t.h);
            // Checkmark
            ctx.fillStyle = '#4ecdc4';
            ctx.font = '14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('✓', t.x + t.w/2, t.y + t.h/2 + 5);
        } else {
            const pulse = 0.7 + Math.sin(Date.now() * 0.005) * 0.3;
            ctx.fillStyle = `rgba(233, 69, 96, ${pulse})`;
            ctx.fillRect(t.x, t.y, t.w, t.h);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(t.x, t.y, t.w, t.h);
        }
    }
}

function drawBall() {
    if (!ball || !ballActive) return;
    // Trail
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R + 2, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
    const grad = ctx.createRadialGradient(ball.x-2, ball.y-2, 0, ball.x, ball.y, BALL_R);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#ffd700');
    ctx.fillStyle = grad;
    ctx.fill();
}

function drawParticles() {
    for (let p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
}

function drawUI() {
    // Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 10, GAME_H - 15);
    ctx.textAlign = 'right';
    ctx.fillText(`BALLS: ${ballsLeft}`, GAME_W - 10, GAME_H - 15);

    // Level
    ctx.textAlign = 'center';
    ctx.font = '12px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`LEVEL ${level + 1}/${levels.length}`, GAME_W/2, GAME_H - 15);

    // Launch indicator
    if (!ballActive && ballsLeft > 0) {
        ctx.beginPath();
        ctx.arc(launchPos.x, launchPos.y, BALL_R + 4, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,215,0,0.3)';
        ctx.fill();
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.stroke();

        if (isDragging) {
            const dx = dragStart.x - dragEnd.x;
            const dy = dragStart.y - dragEnd.y;
            const len = Math.sqrt(dx*dx+dy*dy);
            if (len > 10) {
                ctx.beginPath();
                ctx.moveTo(launchPos.x, launchPos.y);
                ctx.lineTo(launchPos.x + dx * 0.5, launchPos.y + dy * 0.5);
                ctx.strokeStyle = 'rgba(255,215,0,0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Arrow
                const ax = launchPos.x + dx * 0.5, ay = launchPos.y + dy * 0.5;
                const a = Math.atan2(dy, dx);
                ctx.beginPath();
                ctx.moveTo(ax, ay);
                ctx.lineTo(ax - 10*Math.cos(a-0.4), ay - 10*Math.sin(a-0.4));
                ctx.moveTo(ax, ay);
                ctx.lineTo(ax - 10*Math.cos(a+0.4), ay - 10*Math.sin(a+0.4));
                ctx.stroke();
            }
        }
    }
}

function drawOverlay() {
    ctx.fillStyle = 'rgba(15, 15, 35, 0.85)';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    ctx.textAlign = 'center';

    if (state === STATE.MENU) {
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 32px monospace';
        ctx.fillText('PINBALL', GAME_W/2, 200);
        ctx.fillText('PUZZLE', GAME_W/2, 240);

        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        ctx.fillText('Drag from the launcher to aim & shoot', GAME_W/2, 320);
        ctx.fillText('Hit all targets before running out of balls!', GAME_W/2, 350);
        ctx.fillText('Bumpers give bonus points!', GAME_W/2, 380);

        ctx.fillStyle = '#4ecdc4';
        ctx.font = '16px monospace';
        const blink = Math.sin(Date.now()*0.005) > 0;
        if (blink) ctx.fillText('Click to Start', GAME_W/2, 450);

        ctx.fillStyle = '#aaa';
        ctx.font = '12px monospace';
        ctx.fillText('3 Levels of increasing difficulty', GAME_W/2, 520);
    }

    if (state === STATE.LEVEL_COMPLETE) {
        ctx.fillStyle = '#4ecdc4';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('LEVEL COMPLETE!', GAME_W/2, 280);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText(`Bonus: ${ballsLeft * 200} pts`, GAME_W/2, 330);
        ctx.fillText(`Score: ${score}`, GAME_W/2, 360);
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px monospace';
        ctx.fillText('Click to continue', GAME_W/2, 420);
    }

    if (state === STATE.GAME_OVER) {
        ctx.fillStyle = '#e94560';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('GAME OVER', GAME_W/2, 280);
        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText(`Final Score: ${score}`, GAME_W/2, 340);
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px monospace';
        ctx.fillText('Click to try again', GAME_W/2, 400);
    }

    if (state === STATE.WIN) {
        ctx.fillStyle = '#4ecdc4';
        ctx.font = 'bold 28px monospace';
        ctx.fillText('YOU WIN!', GAME_W/2, 250);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 20px monospace';
        ctx.fillText(`Final Score: ${score}`, GAME_W/2, 310);
        ctx.fillStyle = '#fff';
        ctx.font = '14px monospace';
        ctx.fillText('All levels completed!', GAME_W/2, 360);
        ctx.fillStyle = '#ffd700';
        ctx.font = '14px monospace';
        ctx.fillText('Click to play again', GAME_W/2, 420);
    }
}

// Input
function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / scale;
    const y = (e.clientY - rect.top) / scale;
    return { x, y };
}

canvas.addEventListener('mousedown', (e) => {
    initAudio();
    const pos = getMousePos(e);

    if (state === STATE.MENU) { startGame(); return; }
    if (state === STATE.LEVEL_COMPLETE) { nextLevel(); return; }
    if (state === STATE.GAME_OVER || state === STATE.WIN) { startGame(); return; }

    if (state === STATE.PLAYING && !ballActive && ballsLeft > 0) {
        isDragging = true;
        dragStart = pos;
        dragEnd = pos;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const pos = getMousePos(e);
    dragEnd = pos;
});

canvas.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    const pos = getMousePos(e);
    const dx = launchPos.x - pos.x;
    const dy = launchPos.y - pos.y;
    launchBall(dx, dy);
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    const touch = e.touches[0];
    const pos = getMousePos(touch);
    if (state === STATE.MENU) { startGame(); return; }
    if (state === STATE.LEVEL_COMPLETE) { nextLevel(); return; }
    if (state === STATE.GAME_OVER || state === STATE.WIN) { startGame(); return; }
    if (state === STATE.PLAYING && !ballActive && ballsLeft > 0) {
        isDragging = true;
        dragStart = pos;
        dragEnd = pos;
    }
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!isDragging) return;
    const touch = e.touches[0];
    dragEnd = getMousePos(touch);
});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!isDragging) return;
    isDragging = false;
    const dx = launchPos.x - dragEnd.x;
    const dy = launchPos.y - dragEnd.y;
    launchBall(dx, dy);
});

// Keyboard restart
window.addEventListener('keydown', (e) => {
    initAudio();
    if (e.key === 'r' || e.key === 'R') {
        startGame();
    }
    if (e.key === ' ' || e.key === 'Enter') {
        if (state === STATE.MENU) startGame();
        else if (state === STATE.LEVEL_COMPLETE) nextLevel();
        else if (state === STATE.GAME_OVER || state === STATE.WIN) startGame();
    }
});

// Game Loop
function gameLoop() {
    // Update
    if (state === STATE.PLAYING) {
        updatePhysics();
        updateParticles();
        updateBumpers();
        if (shakeTimer > 0) shakeTimer--;
        if (levelCompleteTimer > 0) {
            levelCompleteTimer--;
            if (levelCompleteTimer <= 0) nextLevel();
        }
    } else {
        updateParticles();
    }

    // Render
    ctx.save();
    if (shakeTimer > 0) {
        const sx = (Math.random()-0.5) * shakeTimer;
        const sy = (Math.random()-0.5) * shakeTimer;
        ctx.translate(sx, sy);
    }

    drawBackground();
    drawWalls();
    drawBumpers();
    drawTargets();
    drawBall();
    drawParticles();
    drawUI();

    if (state !== STATE.PLAYING) {
        drawOverlay();
    }

    ctx.restore();
    requestAnimationFrame(gameLoop);
}

// Init
loadLevel(0);
gameLoop();
</script>
</body>
</html>
