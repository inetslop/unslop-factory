<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON VELOCITY</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'coin') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'jump') {
        osc.type = 'square'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'start') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
}

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem('neonVelocityHigh') || '0'); } catch(e) {}
let speed = 0;
let baseSpeed = 2;
let playerX = 0; // -1, 0, 1 lanes
let targetPlayerX = 0;
let playerY = 0; // jump offset
let playerVY = 0;
let jumping = false;
let lives = 3;
let invincible = 0;
let shakeTime = 0;
let frameCount = 0;
let lastTime = 0;

// Obstacles & collectibles
let obstacles = [];
let coins = [];
let particles = [];
let stars = [];

// 3D projection
const CAM_Z = -8;
const ROAD_W = 6;
const HORIZON_Y = 0.35;

function project(x, y, z) {
    const depth = z + 20;
    if (depth <= 0.1) return null;
    const scale = 1 / depth;
    const sx = W / 2 + x * scale * W * 0.4;
    const sy = H * HORIZON_Y + (y - 3) * scale * H * 0.5;
    const s = scale * W * 0.15;
    return { x: sx, y: sy, s: s };
}

function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H * 0.4,
            speed: 0.5 + Math.random() * 2,
            size: 1 + Math.random() * 2
        });
    }
}

function resetGame() {
    score = 0;
    speed = baseSpeed;
    playerX = 0;
    targetPlayerX = 0;
    playerY = 0;
    playerVY = 0;
    jumping = false;
    lives = 3;
    invincible = 0;
    shakeTime = 0;
    obstacles = [];
    coins = [];
    particles = [];
    frameCount = 0;
}

function spawnObstacle() {
    const type = Math.random();
    if (type < 0.5) {
        // Barrier - must dodge (left or right)
        const lane = Math.floor(Math.random() * 3) - 1;
        obstacles.push({ x: lane, y: 0, z: 80, type: 'barrier', width: 0.8 });
    } else if (type < 0.75) {
        // Low wall - must jump over
        const lane = Math.floor(Math.random() * 3) - 1;
        obstacles.push({ x: lane, y: 0, z: 80, type: 'wall', width: 0.9 });
    } else if (type < 0.9) {
        // Wide barrier - must jump
        obstacles.push({ x: 0, y: 0, z: 80, type: 'wide', width: 1.5 });
    } else {
        // Double barrier - must dodge to specific lane
        const skip = Math.floor(Math.random() * 3) - 1;
        for (let l = -1; l <= 1; l++) {
            if (l !== skip) obstacles.push({ x: l, y: 0, z: 80, type: 'barrier', width: 0.8 });
        }
    }
}

function spawnCoin() {
    const lane = Math.floor(Math.random() * 3) - 1;
    const count = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
        coins.push({ x: lane, y: 0.5, z: 80 + i * 2, collected: false });
    }
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 3,
            life: 1,
            color,
            size: 2 + Math.random() * 4
        });
    }
}

function handleInput(key) {
    if (key === 'ArrowLeft' || key === 'a') {
        if (targetPlayerX > -1) targetPlayerX--;
    } else if (key === 'ArrowRight' || key === 'd') {
        if (targetPlayerX < 1) targetPlayerX++;
    } else if (key === 'ArrowUp' || key === 'w' || key === ' ') {
        if (!jumping && playerY === 0) {
            jumping = true;
            playerVY = 12;
            playSound('jump');
        }
    }
}

window.addEventListener('keydown', (e) => {
    if (gameState === 'start') {
        initAudio();
        resetGame();
        gameState = 'playing';
        playSound('start');
        return;
    }
    if (gameState === 'gameover') {
        resetGame();
        gameState = 'playing';
        playSound('start');
        return;
    }
    initAudio();
    handleInput(e.key);
});

// Touch / click controls
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'start' || gameState === 'gameover') {
        initAudio();
        resetGame();
        gameState = 'playing';
        playSound('start');
        return;
    }
    initAudio();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
});
canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (gameState !== 'playing') return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx < -30) handleInput('ArrowLeft');
        else if (dx > 30) handleInput('ArrowRight');
    } else {
        if (dy < -30) handleInput(' ');
    }
});

canvas.addEventListener('click', () => {
    if (gameState === 'start' || gameState === 'gameover') {
        initAudio();
        resetGame();
        gameState = 'playing';
        playSound('start');
    }
});

// Update
function update(dt) {
    if (gameState !== 'playing') return;
    
    frameCount++;
    speed = baseSpeed + score * 0.02;
    const moveSpeed = speed * dt * 60;
    
    // Move player X smoothly
    playerX += (targetPlayerX - playerX) * 0.15;
    
    // Jump physics
    if (jumping) {
        playerVY -= 0.6;
        playerY += playerVY * dt * 60;
        if (playerY <= 0) {
            playerY = 0;
            jumping = false;
            playerVY = 0;
        }
    }
    
    // Spawn obstacles
    const spawnRate = Math.max(40, 80 - score * 0.5);
    if (frameCount % Math.floor(spawnRate) === 0) spawnObstacle();
    if (frameCount % 90 === 0) spawnCoin();
    
    // Move obstacles & coins
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].z -= moveSpeed;
        if (obstacles[i].z < -5) obstacles.splice(i, 1);
    }
    for (let i = coins.length - 1; i >= 0; i--) {
        coins[i].z -= moveSpeed;
        if (coins[i].z < -5) coins.splice(i, 1);
    }
    
    // Collision detection
    if (invincible > 0) invincible -= dt;
    
    for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        if (obs.z < 2 && obs.z > -2) {
            const playerLane = Math.round(playerX);
            const hitX = Math.abs(obs.x - playerX) < 0.6 || (obs.type === 'wide' && playerY < 1);
            const hitY = obs.type !== 'wall' ? true : playerY < 0.8;
            
            if (hitX && hitY && invincible <= 0) {
                lives--;
                invincible = 2;
                shakeTime = 0.5;
                playSound('hit');
                addParticles(W / 2, H * 0.7, '#ff3366', 20);
                obstacles.splice(i, 1);
                if (lives <= 0) {
                    gameState = 'gameover';
                    try { localStorage.setItem('neonVelocityHigh', highScore.toString()); } catch(e) {}
                }
            }
        }
    }
    
    // Coin collection
    for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        if (!c.collected && c.z < 3 && c.z > -2) {
            if (Math.abs(c.x - playerX) < 0.7 && playerY < 1.5) {
                c.collected = true;
                score += 10;
                playSound('coin');
                const p = project(c.x, c.y, c.z);
                if (p) addParticles(p.x, p.y, '#ffcc00', 8);
            }
        }
    }
    
    // Score
    score += moveSpeed * 0.1;
    if (score > highScore) {
        highScore = Math.floor(score);
        try { localStorage.setItem('neonVelocityHigh', highScore.toString()); } catch(e) {}
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Shake
    if (shakeTime > 0) shakeTime -= dt;
}

// Render
function render() {
    ctx.save();
    
    // Screen shake
    if (shakeTime > 0) {
        const shake = shakeTime * 10;
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    
    // Background
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0a0015');
    bgGrad.addColorStop(0.4, '#1a0030');
    bgGrad.addColorStop(1, '#0d0020');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-10, -10, W + 20, H + 20);
    
    // Stars
    if (gameState === 'playing') {
        for (const s of stars) {
            s.x -= s.speed * (speed / baseSpeed) * 0.5;
            if (s.x < 0) { s.x = W; s.y = Math.random() * H * 0.4; }
            ctx.fillStyle = `rgba(255,255,255,${0.3 + s.size * 0.2})`;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        }
    }
    
    // Draw road/grid
    drawRoad();
    
    // Sort and draw obstacles & coins by z (far to near)
    const allObjects = [...obstacles, ...coins];
    allObjects.sort((a, b) => b.z - a.z);
    
    for (const obj of allObjects) {
        if (obj.z < 0.5) continue;
        if (obj.type === undefined && !obj.collected) drawCoin(obj);
        else if (obj.type) drawObstacle(obj);
    }
    
    // Draw player
    drawPlayer();
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size * p.life, p.size * p.life);
    }
    ctx.globalAlpha = 1;
    
    // HUD
    if (gameState === 'playing') drawHUD();
    
    ctx.restore();
    
    // Overlays
    if (gameState === 'start') drawStartScreen();
    if (gameState === 'gameover') drawGameOver();
}

function drawRoad() {
    // Road surface
    const roadTop = project(0, 0, 80);
    const roadBotLeft = project(-ROAD_W / 2, 0, -3);
    const roadBotRight = project(ROAD_W / 2, 0, -3);
    const roadTopLeft = project(-ROAD_W / 2, 0, 80);
    const roadTopRight = project(ROAD_W / 2, 0, 80);
    
    if (!roadTop || !roadBotLeft || !roadBotRight) return;
    
    // Road fill
    ctx.beginPath();
    ctx.moveTo(roadTopLeft.x, roadTopLeft.y);
    ctx.lineTo(roadTopRight.x, roadTopRight.y);
    ctx.lineTo(roadBotRight.x, roadBotRight.y);
    ctx.lineTo(roadBotLeft.x, roadBotLeft.y);
    ctx.closePath();
    
    const roadGrad = ctx.createLinearGradient(0, roadTopLeft.y, 0, roadBotLeft.y);
    roadGrad.addColorStop(0, '#0a0a1a');
    roadGrad.addColorStop(1, '#15152a');
    ctx.fillStyle = roadGrad;
    ctx.fill();
    
    // Grid lines on road
    const scrollOffset = (frameCount * speed * 0.3) % 8;
    for (let z = -scrollOffset; z < 80; z += 4) {
        if (z < -2) continue;
        const l = project(-ROAD_W / 2, 0, z);
        const r = project(ROAD_W / 2, 0, z);
        if (!l || !r) continue;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(r.x, r.y);
        ctx.strokeStyle = `rgba(0, 255, 200, ${Math.max(0.1, 1 - z / 80)})`;
        ctx.lineWidth = 1;
        ctx.stroke();
    }
    
    // Lane dividers
    for (let lane = -1; lane <= 1; lane += 2) {
        const lx = lane * ROAD_W / 6;
        const top = project(lx, 0, 80);
        const bot = project(lx, 0, -3);
        if (!top || !bot) continue;
        ctx.beginPath();
        ctx.moveTo(top.x, top.y);
        ctx.lineTo(bot.x, bot.y);
        ctx.strokeStyle = 'rgba(0, 255, 200, 0.3)';
        ctx.lineWidth = 1;
        ctx.setLineDash([10, 15]);
        ctx.stroke();
        ctx.setLineDash([]);
    }
    
    // Road edges (neon glow)
    const edgeL1 = project(-ROAD_W / 2 - 0.3, 0, 80);
    const edgeL2 = project(-ROAD_W / 2 - 0.3, 0, -3);
    const edgeR1 = project(ROAD_W / 2 + 0.3, 0, 80);
    const edgeR2 = project(ROAD_W / 2 + 0.3, 0, -3);
    
    if (edgeL1 && edgeL2) {
        ctx.beginPath();
        ctx.moveTo(edgeL1.x, edgeL1.y);
        ctx.lineTo(edgeL2.x, edgeL2.y);
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
    if (edgeR1 && edgeR2) {
        ctx.beginPath();
        ctx.moveTo(edgeR1.x, edgeR1.y);
        ctx.lineTo(edgeR2.x, edgeR2.y);
        ctx.strokeStyle = '#ff00ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

function drawObstacle(obs) {
    const p = project(obs.x, obs.y, obs.z);
    if (!p || p.s < 0.02) return;
    
    const w = obs.width * p.s * 3;
    const h = (obs.type === 'wall' ? 1.5 : 1) * p.s * 2;
    const x = p.x - w / 2;
    const y = p.y - h;
    
    // Glow
    ctx.shadowColor = obs.type === 'wide' ? '#ff3366' : '#ff6600';
    ctx.shadowBlur = 15;
    
    if (obs.type === 'barrier') {
        ctx.fillStyle = '#ff3366';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#ff99aa';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h);
    } else if (obs.type === 'wall') {
        ctx.fillStyle = '#ff6600';
        ctx.fillRect(x, y, w, h * 0.5);
        ctx.strokeStyle = '#ffaa44';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, w, h * 0.5);
    } else {
        // Wide barrier
        const wl = project(obs.x - 1.5, obs.y, obs.z);
        const wr = project(obs.x + 1.5, obs.y, obs.z);
        if (wl && wr) {
            ctx.fillStyle = '#ff3366';
            ctx.fillRect(wl.x, y, wr.x - wl.x, h);
            ctx.strokeStyle = '#ff99aa';
            ctx.lineWidth = 2;
            ctx.strokeRect(wl.x, y, wr.x - wl.x, h);
        }
    }
    ctx.shadowBlur = 0;
}

function drawCoin(c) {
    const p = project(c.x, c.y + 0.5 + Math.sin(frameCount * 0.1) * 0.2, c.z);
    if (!p || p.s < 0.02) return;
    
    const r = p.s * 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffcc00';
    ctx.shadowColor = '#ffcc00';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Inner circle
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 0.5, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawPlayer() {
    const p = project(playerX, playerY, 3);
    if (!p) return;
    
    const size = p.s * 2.5;
    const x = p.x - size / 2;
    const y = p.y - size;
    
    // Invincible flash
    if (invincible > 0 && Math.floor(invincible * 10) % 2 === 0) return;
    
    // Ship body
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 25;
    
    ctx.beginPath();
    ctx.moveTo(p.x, y);
    ctx.lineTo(p.x - size / 2, y + size);
    ctx.lineTo(p.x - size * 0.3, y + size * 0.8);
    ctx.lineTo(p.x + size * 0.3, y + size * 0.8);
    ctx.lineTo(p.x + size / 2, y + size);
    ctx.closePath();
    
    const shipGrad = ctx.createLinearGradient(x, y, x, y + size);
    shipGrad.addColorStop(0, '#00ffff');
    shipGrad.addColorStop(1, '#0066aa');
    ctx.fillStyle = shipGrad;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Engine glow
    ctx.beginPath();
    ctx.arc(p.x, y + size * 0.9, size * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(frameCount * 0.3) * 0.3})`;
    ctx.fill();
    
    // Trail particles
    if (frameCount % 2 === 0) {
        addParticles(p.x, y + size, '#00ffff', 1);
    }
    
    ctx.shadowBlur = 0;
}

function drawHUD() {
    // Score
    ctx.font = `bold ${Math.min(36, W * 0.04)}px monospace`;
    ctx.fillStyle = '#0ff';
    ctx.textAlign = 'left';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 10;
    ctx.fillText(`SCORE: ${Math.floor(score)}`, 20, 40);
    
    // Speed
    const speedPct = Math.min(100, Math.floor((speed / baseSpeed) * 50));
    ctx.font = `${Math.min(20, W * 0.025)}px monospace`;
    ctx.fillStyle = '#f0f';
    ctx.fillText(`SPEED: ${speedPct}%`, 20, 70);
    
    // Lives
    ctx.textAlign = 'right';
    ctx.font = `${Math.min(24, W * 0.03)}px monospace`;
    ctx.fillStyle = '#ff3366';
    let heartsStr = '';
    for (let i = 0; i < lives; i++) heartsStr += '♥ ';
    ctx.fillText(heartsStr, W - 20, 40);
    
    // High score
    ctx.font = `${Math.min(16, W * 0.02)}px monospace`;
    ctx.fillStyle = '#888';
    ctx.fillText(`BEST: ${highScore}`, W - 20, 70);
    
    ctx.shadowBlur = 0;
}

function drawStartScreen() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    // Title
    ctx.font = `bold ${Math.min(64, W * 0.08)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 30;
    ctx.fillText('NEON VELOCITY', cx, cy - 60);
    
    ctx.shadowBlur = 0;
    ctx.font = `${Math.min(24, W * 0.03)}px monospace`;
    ctx.fillStyle = '#fff';
    ctx.fillText('Endless 3D Runner', cx, cy - 10);
    
    ctx.font = `${Math.min(18, W * 0.025)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText('← → / A D : Move between lanes', cx, cy + 40);
    ctx.fillText('↑ / W / SPACE : Jump', cx, cy + 70);
    ctx.fillText('Swipe left/right/up on mobile', cx, cy + 100);
    
    ctx.fillStyle = '#ffcc00';
    ctx.font = `${Math.min(20, W * 0.03)}px monospace`;
    const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.fillText('PRESS ANY KEY TO START', cx, cy + 160);
    ctx.globalAlpha = 1;
    
    if (highScore > 0) {
        ctx.fillStyle = '#888';
        ctx.font = `${Math.min(16, W * 0.02)}px monospace`;
        ctx.fillText(`HIGH SCORE: ${highScore}`, cx, cy + 200);
    }
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    ctx.font = `bold ${Math.min(48, W * 0.06)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff3366';
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', cx, cy - 40);
    
    ctx.shadowBlur = 0;
    ctx.font = `${Math.min(28, W * 0.035)}px monospace`;
    ctx.fillStyle = '#fff';
    ctx.fillText(`SCORE: ${Math.floor(score)}`, cx, cy + 10);
    
    ctx.fillStyle = '#ffcc00';
    ctx.font = `${Math.min(20, W * 0.025)}px monospace`;
    ctx.fillText(`BEST: ${highScore}`, cx, cy + 50);
    
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.min(18, W * 0.025)}px monospace`;
    const pulse = 0.5 + Math.sin(Date.now() * 0.005) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.fillText('PRESS ANY KEY TO RESTART', cx, cy + 110);
    ctx.globalAlpha = 1;
}

// Main loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    update(dt);
    render();
    
    requestAnimationFrame(gameLoop);
}

initStars();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
