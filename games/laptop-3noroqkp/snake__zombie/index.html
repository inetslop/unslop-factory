<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: 'Courier New', monospace; }
canvas { display: block; margin: auto; }
#container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
</style>
</head>
<body>
<div id="container">
<canvas id="game"></canvas>
</div>
<script>
(function() {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, CELL, COLS, ROWS;
let gameSpeed = 120;
let baseSpeed = 120;

function resize() {
const size = Math.min(window.innerWidth, window.innerHeight);
W = H = size;
canvas.width = W;
canvas.height = H;
CELL = Math.floor(W / 22);
COLS = Math.floor(W / CELL);
ROWS = Math.floor(H / CELL);
}
resize();
window.addEventListener('resize', () => { resize(); if (state === 'playing') initGame(); });

let state = 'start';
let snake, food, zombies, score, highScore, lastDir, dirQueue, zombieTimer, tickCount;

try { highScore = parseInt(localStorage.getItem('zombieSnakeHigh')) || 0; } catch(e) { highScore = 0; }

function saveHigh() { try { localStorage.setItem('zombieSnakeHigh', highScore); } catch(e){} }

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type, vol) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type || 'square';
osc.frequency.value = freq;
gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function sfxEat() { playSound(440, 0.15, 'square', 0.2); setTimeout(()=>playSound(660, 0.1, 'square', 0.15), 50); }
function sfxDie() { playSound(150, 0.5, 'sawtooth', 0.3); setTimeout(()=>playSound(100, 0.8, 'sawtooth', 0.25), 100); }
function sfxZombie() { playSound(200, 0.2, 'triangle', 0.1); }

function initGame() {
snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
score = 0; tickCount = 0; zombieTimer = 0;
lastDir = {x:0, y:-1}; dirQueue = [];
gameSpeed = baseSpeed;
zombies = [];
for (let i = 0; i < 3; i++) spawnZombie();
spawnFood();
}

function spawnZombie() {
let zx, zy, tries = 0;
do {
zx = Math.floor(Math.random() * COLS);
zy = Math.floor(Math.random() * ROWS);
tries++;
} while (tries < 100 && (snake.some(s => s.x===zx && s.y===zy) || zombies.some(z=>z.x===zx&&z.y===zy)));
zombies.push({x: zx, y: zy, vx: (Math.random()<0.5?-1:1), vy: (Math.random()<0.5?-1:1), phase: Math.random()*Math.PI*2});
}

function spawnFood() {
let fx, fy;
do {
fx = Math.floor(Math.random() * COLS);
fy = Math.floor(Math.random() * ROWS);
} while (snake.some(s=>s.x===fx&&s.y===fy) || zombies.some(z=>z.x===fx&&z.y===fy));
food = {x: fx, y: fy};
}

function moveZombies() {
tickCount++;
if (tickCount % 3 === 0) {
for (let z of zombies) {
z.phase += 0.5;
if (Math.random() < 0.4) {
const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
const d = dirs[Math.floor(Math.random()*dirs.length)];
z.vx = d.x; z.vy = d.y;
}
let nx = z.x + z.vx, ny = z.y + z.vy;
if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || snake.some(s=>s.x===nx&&s.y===ny)) {
z.vx *= -1; z.vy *= -1;
nx = z.x + z.vx; ny = z.y + z.vy;
if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { nx = z.x; ny = z.y; }
}
z.x = Math.max(0, Math.min(COLS-1, nx));
z.y = Math.max(0, Math.min(ROWS-1, ny));
sfxZombie();
}
// Spawn extra zombie every 5 points
if (score > 0 && score % 5 === 0 && zombies.length < 8) {
spawnZombie();
}
}

function tick() {
const dir = dirQueue.shift() || lastDir;
lastDir = dir;
const hx = snake[0].x + dir.x;
const hy = snake[0].y + dir.y;

// Wall collision
if (hx < 0 || hx >= COLS || hy < 0 || hy >= ROWS) { die(); return; }
// Self collision
for (let i = 1; i < snake.length; i++) { if (snake[i].x === hx && snake[i].y === hy) { die(); return; } }
// Zombie collision
if (zombies.some(z => z.x === hx && z.y === hy)) { die(); return; }

snake.unshift({x: hx, y: hy});

if (hx === food.x && hy === food.y) {
score++; sfxEat();
if (score > highScore) { highScore = score; saveHigh(); }
spawnFood();
} else {
snake.pop();
}
moveZombies();
}

function die() { sfxDie(); state = 'gameover'; }

// Drawing
function drawGrid() {
ctx.fillStyle = '#0d1a0d';
ctx.fillRect(0, 0, W, H);
ctx.strokeStyle = 'rgba(30,60,30,0.3)';
ctx.lineWidth = 1;
for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, H); ctx.stroke(); }
for (let i = 0; i <= ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(W, i*CELL); ctx.stroke(); }
}

function drawSnake() {
for (let i = snake.length - 1; i >= 0; i--) {
const s = snake[i];
const t = i / Math.max(snake.length, 1);
const g = Math.floor(180 - t * 80);
ctx.fillStyle = `rgb(${Math.floor(50+t*30)}, ${g}, 40)`;
const pad = 2;
roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 4);
// Eyes on head
if (i === 0) {
ctx.fillStyle = '#ff3333';
const ex = s.x*CELL + CELL*0.3;
const ey = s.y*CELL + CELL*0.3;
ctx.beginPath(); ctx.arc(ex+CELL*0.1, ey, 3, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(ex+CELL*0.5, ey, 3, 0, Math.PI*2); ctx.fill();
// Glow
ctx.shadowColor = '#ff0'; ctx.shadowBlur = 6;
ctx.fillStyle = '#ffaa00';
ctx.beginPath(); ctx.arc(ex+CELL*0.1, ey, 2, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(ex+CELL*0.5, ey, 2, 0, Math.PI*2); ctx.fill();
ctx.shadowBlur = 0;
}
}
}

function drawZombies() {
for (let z of zombies) {
const wobble = Math.sin(z.phase * 2) * 2;
ctx.fillStyle = '#8b3a6e';
roundRect(z.x*CELL+3, z.y*CELL+3+wobble*0.5, CELL-6, CELL-6, 5);
// Zombie face
ctx.fillStyle = '#ff4444';
const cx = z.x*CELL + CELL*0.3;
const cy = z.y*CELL + CELL*0.35 + wobble*0.5;
ctx.beginPath(); ctx.arc(cx+2, cy, 3, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(cx+8, cy, 3, 0, Math.PI*2); ctx.fill();
// Mouth
ctx.fillStyle = '#4a1535';
ctx.fillRect(cx-2, cy+6, 12, 4);
// Glow
ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 8;
ctx.fillStyle = 'rgba(255,68,68,0.3)';
roundRect(z.x*CELL+3, z.y*CELL+3+wobble*0.5, CELL-6, CELL-6, 5);
ctx.shadowBlur = 0;
}
}

function drawFood() {
const pulse = Math.sin(Date.now()*0.005)*2;
ctx.fillStyle = '#7fff00';
ctx.shadowColor = '#7fff00'; ctx.shadowBlur = 10+pulse;
// Brain shape
const fx = food.x*CELL + CELL/2;
const fy = food.y*CELL + CELL/2;
ctx.beginPath(); ctx.arc(fx-4, fy-2, 6, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(fx+4, fy-2, 6, 0, Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.arc(fx, fy+3, 5, 0, Math.PI*2); ctx.fill();
ctx.shadowBlur = 0;
}

function roundRect(x, y, w, h, r) {
ctx.beginPath();
ctx.moveTo(x+r, y);
ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
ctx.closePath(); ctx.fill();
}

function drawHUD() {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, 28);
ctx.fillStyle = '#7fff00';
ctx.font = 'bold 14px Courier New';
ctx.textAlign = 'left';
ctx.fillText(`SCORE: ${score}`, 10, 19);
ctx.textAlign = 'right';
ctx.fillStyle = '#ffaa00';
ctx.fillText(`BEST: ${highScore}`, W-10, 19);
ctx.textAlign = 'center';
ctx.fillStyle = '#ff4444';
ctx.fillText(`ZOMBIES: ${zombies.length}`, W/2, 19);
}

function drawStart() {
drawGrid();
ctx.fillStyle = 'rgba(0,0,0,0.85)';
ctx.fillRect(0, 0, W, H);
ctx.textAlign = 'center';
ctx.fillStyle = '#7fff00';
ctx.font = `bold ${Math.floor(W*0.06)}px Courier New`;
ctx.fillText('ZOMBIE SNAKE', W/2, H*0.3);
ctx.font = `${Math.floor(W*0.025)}px Courier New`;
ctx.fillStyle = '#aaa';
ctx.fillText('Eat brains. Avoid the living dead.', W/2, H*0.42);
ctx.fillText('', W/2, H*0.5);
ctx.fillStyle = '#7fff00';
ctx.fillText('[\u2190 \u2191 \u2192 \u2193] or [W A S D]', W/2, H*0.52);
ctx.fillText('to move', W/2, H*0.57);
ctx.fillStyle = '#ff4444';
ctx.fillText('Don\'t touch zombies!', W/2, H*0.65);
ctx.fillStyle = '#ffaa00';
ctx.font = `bold ${Math.floor(W*0.03)}px Courier New`;
const blink = Math.sin(Date.now()*0.004) > 0;
if (blink) ctx.fillText('PRESS [SPACE] TO START', W/2, H*0.78);
ctx.fillStyle = '#ffaa00';
ctx.font = `${Math.floor(W*0.02)}px Courier New`;
ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H*0.88);
}

function drawGameOver() {
drawGrid();
drawSnake();
drawZombies();
drawFood();
drawHUD();
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.textAlign = 'center';
ctx.fillStyle = '#ff3333';
ctx.font = `bold ${Math.floor(W*0.06)}px Courier New`;
ctx.fillText('YOU GOT BITED', W/2, H*0.3);
ctx.fillStyle = '#7fff00';
ctx.font = `${Math.floor(W*0.035)}px Courier New`;
ctx.fillText(`Score: ${score}`, W/2, H*0.45);
ctx.fillStyle = '#ffaa00';
ctx.fillText(`High Score: ${highScore}`, W/2, H*0.53);
const blink = Math.sin(Date.now()*0.004) > 0;
if (blink) { ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.floor(W*0.03)}px Courier New`; ctx.fillText('[SPACE] to restart', W/2, H*0.7); }
}

let lastTime = 0;
function loop(time) {
requestAnimationFrame(loop);
if (state === 'start') { drawStart(); return; }
if (state === 'gameover') { drawGameOver(); return; }
const dt = time - lastTime;
lastTime = time;
if (dt >= gameSpeed) { tick(); lastTime = time; }
drawGrid();
drawFood();
drawZombies();
drawSnake();
drawHUD();
}
requestAnimationFrame(loop);

window.addEventListener('keydown', function(e) {
initAudio();
if (state === 'start' && e.code === 'Space') { state = 'playing'; initGame(); lastTime = performance.now(); return; }
if (state === 'gameover' && e.code === 'Space') { state = 'playing'; initGame(); lastTime = performance.now(); return; }
if (state !== 'playing') return;

let d = null;
switch(e.code) {
case 'ArrowUp': case 'KeyW': d = {x:0,y:-1}; break;
case 'ArrowDown': case 'KeyS': d = {x:0,y:1}; break;
case 'ArrowLeft': case 'KeyA': d = {x:-1,y:0}; break;
case 'ArrowRight': case 'KeyD': d = {x:1,y:0}; break;
}
if (d) {
e.preventDefault();
// Prevent 180 turn
const last = dirQueue.length ? dirQueue[dirQueue.length-1] : lastDir;
if (d.x !== -last.x || d.y !== -last.y) {
dirQueue.push(d);
if (dirQueue.length > 3) dirQueue.shift();
}
}
});

})();
</script>
</body>
</html>
