<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bullet Hell Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let state = 'start'; // start, playing, gameover
let scorePlayer = 0, scoreAI = 0;
let livesPlayer = 3, livesAI = 3;
let waveTimer = 0, waveType = 0, waveIntensity = 1;
let particles = [];
let bullets = [];
let spawnQueue = [];
let shakeTime = 0, shakeMag = 0;

const PADDLE_W = 12;
const PADDLE_H = 80;
const BULLET_R = 5;

let playerPaddle = { y: 0, vy: 0, h: PADDLE_H };
let aiPaddle = { y: 0, vy: 0, h: PADDLE_H };

let keys = {};
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (state === 'start' && (e.key === ' ' || e.key === 'Enter')) startGame();
    else if (state === 'gameover' && (e.key === ' ' || e.key === 'Enter')) restart();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function startGame() {
    initAudio();
    state = 'playing';
    scorePlayer = 0; scoreAI = 0;
    livesPlayer = 3; livesAI = 3;
    waveTimer = 0; waveType = 0; waveIntensity = 1;
    bullets = []; particles = []; spawnQueue = [];
    playerPaddle.y = H / 2 - PADDLE_H / 2;
    aiPaddle.y = H / 2 - PADDLE_H / 2;
}

function restart() { startGame(); }

// Bullet patterns
const PATTERNS = ['Sine Storm', 'Spiral Rain', 'Radial Burst', 'Aimed Volley', 'Cross Fire', 'Wave Cascade'];

function spawnBullet(x, y, vx, vy, color, r) {
    bullets.push({ x, y, vx, vy, color: color || '#0ff', r: r || BULLET_R, life: 0, curve: 0 });
}

function triggerPattern() {
    const cx = W / 2, cy = H / 2;
    waveIntensity = 1 + Math.floor((scorePlayer + scoreAI) / 3);
    
    switch (waveType % PATTERNS.length) {
        case 0: // Sine Storm
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const y = H * 0.2 + (H * 0.6 / 7) * i;
                    spawnBullet(cx, y, (Math.random() > 0.5 ? 1 : -1) * (2 + waveIntensity), 0, '#0ff', BULLET_R);
                }, i * 150);
            }
            break;
        case 1: // Spiral Rain
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const angle = i * 0.4 + waveTimer * 0.1;
                    const speed = 1.5 + waveIntensity * 0.3;
                    spawnBullet(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed, '#f0f', BULLET_R);
                }, i * 80);
            }
            break;
        case 2: // Radial Burst
            const count = 12 + waveIntensity * 2;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                setTimeout(() => {
                    spawnBullet(cx, cy, Math.cos(angle) * (2 + waveIntensity), Math.sin(angle) * (2 + waveIntensity), '#ff0', BULLET_R);
                }, i * 40);
            }
            break;
        case 3: // Aimed Volley
            for (let i = 0; i < 6 + waveIntensity; i++) {
                setTimeout(() => {
                    const ty = playerPaddle.y + Math.random() * playerPaddle.h;
                    const tx = 40;
                    const dx = tx - cx, dy = ty - cy;
                    const d = Math.sqrt(dx*dx+dy*dy);
                    const sp = 2.5 + waveIntensity * 0.5;
                    spawnBullet(cx, cy, (dx/d)*sp, (dy/d)*sp, '#f80', BULLET_R);
                }, i * 120);
            }
            // Also some toward AI
            for (let i = 0; i < 4 + waveIntensity; i++) {
                setTimeout(() => {
                    const ty = aiPaddle.y + Math.random() * aiPaddle.h;
                    const tx = W - 40;
                    const dx = tx - cx, dy = ty - cy;
                    const d = Math.sqrt(dx*dx+dy*dy);
                    const sp = 2.5 + waveIntensity * 0.5;
                    spawnBullet(cx, cy, (dx/d)*sp, (dy/d)*sp, '#f80', BULLET_R);
                }, i * 150);
            }
            break;
        case 4: // Cross Fire
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    const y1 = H * 0.2 + i * H * 0.2;
                    spawnBullet(cx, y1, -3 - waveIntensity*0.5, (Math.random()-0.5)*1.5, '#0f0', BULLET_R);
                }, i * 200);
            }
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    const y1 = H * 0.15 + i * H * 0.23;
                    spawnBullet(cx, y1, 3 + waveIntensity*0.5, (Math.random()-0.5)*1.5, '#0f0', BULLET_R);
                }, i * 200);
            }
            break;
        case 5: // Wave Cascade
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 4; col++) {
                    setTimeout(() => {
                        const x = W * 0.2 + col * W * 0.2;
                        const y = H * 0.15 + row * H * 0.175;
                        const dir = Math.random() > 0.5 ? 1 : -1;
                        spawnBullet(x, y, dir * (1.5 + waveIntensity*0.3), (Math.random()-0.5)*2, '#f0f', BULLET_R);
                    }, (row * 4 + col) * 60);
                }
            }
            break;
    }
}

function addParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 30+Math.random()*20, color });
    }
}

function shake(mag) { shakeTime = 8; shakeMag = mag; }

let lastPatternTime = 0;
let patternInterval = 3000;

function update(dt) {
    if (state !== 'playing') return;
    
    waveTimer += dt;
    
    // Pattern spawning
    if (waveTimer - lastPatternTime > patternInterval / (1 + waveIntensity * 0.2)) {
        lastPatternTime = waveTimer;
        waveType++;
        triggerPattern();
    }
    
    // Move player paddle
    const pSpeed = 8;
    if (keys['w'] || keys['W'] || keys['ArrowUp']) playerPaddle.vy = -pSpeed;
    else if (keys['s'] || keys['S'] || keys['ArrowDown']) playerPaddle.vy = pSpeed;
    else playerPaddle.vy = 0;
    playerPaddle.y += playerPaddle.vy;
    playerPaddle.y = Math.max(0, Math.min(H - playerPaddle.h, playerPaddle.y));
    
    // AI paddle (simple tracking)
    let targetY = H / 2;
    let closest = null, closestDist = Infinity;
    for (const b of bullets) {
        if (b.vx > 0) {
            const dist = Math.abs(b.y - aiPaddle.y);
            if (dist < closestDist && b.x > W * 0.5) { closestDist = dist; targetY = b.y; }
        }
    }
    const aiSpeed = 3 + waveIntensity * 0.4;
    const diff = targetY - aiPaddle.y;
    if (Math.abs(diff) > 10) {
        aiPaddle.vy = Math.sign(diff) * Math.min(aiSpeed, Math.abs(diff) * 0.1);
    } else aiPaddle.vy *= 0.8;
    aiPaddle.y += aiPaddle.vy;
    aiPaddle.y = Math.max(0, Math.min(H - aiPaddle.h, aiPaddle.y));
    
    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life++;
        
        // Bounce off top/bottom
        if (b.y < b.r) { b.y = b.r; b.vy *= -1; }
        if (b.y > H - b.r) { b.y = H - b.r; b.vy *= -1; }
        
        // Player paddle collision (left side)
        const px = 30, pw = PADDLE_W, py = playerPaddle.y, ph = playerPaddle.h;
        if (b.x - b.r < px + pw && b.x + b.r > px && b.y > py && b.y < py + ph && b.vx < 0) {
            b.vx *= -1.2;
            b.vy += (Math.random() - 0.5) * 1;
            addParticles(b.x, b.y, '#0ff', 8);
            playSound(440, 0.1, 'square', 0.1);
        }
        
        // AI paddle collision (right side)
        const ax = W - 30 - pw;
        if (b.x + b.r > ax && b.x - b.r < ax + pw && b.y > aiPaddle.y && b.y < aiPaddle.y + aiPaddle.h && b.vx > 0) {
            b.vx *= -1.2;
            b.vy += (Math.random() - 0.5) * 1;
            addParticles(b.x, b.y, '#f0f', 8);
            playSound(660, 0.1, 'square', 0.1);
        }
        
        // Score: bullet passes left edge
        if (b.x < -20) {
            scoreAI++;
            livesPlayer--;
            addParticles(0, b.y, '#f00', 15);
            shake(5);
            playSound(200, 0.3, 'sawtooth', 0.2);
            if (livesPlayer <= 0) { state = 'gameover'; }
        }
        
        // Score: bullet passes right edge
        if (b.x > W + 20) {
            scorePlayer++;
            livesAI--;
            addParticles(W, b.y, '#0f0', 15);
            shake(3);
            playSound(880, 0.2, 'sine', 0.15);
            if (livesAI <= 0) { state = 'gameover'; }
        }
        
        // Remove off-screen
        if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
            bullets.splice(i, 1);
        }
    }
    
    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    // Shake decay
    if (shakeTime > 0) shakeTime--;
}

function draw() {
    ctx.save();
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeMag;
        const sy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(sx, sy);
    }
    
    // Background
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Grid
    ctx.strokeStyle = 'rgba(30, 40, 80, 0.5)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    
    // Center line
    ctx.strokeStyle = 'rgba(100, 100, 255, 0.3)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 10]);
    ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
    ctx.setLineDash([]);
    
    if (state === 'start') {
        drawStartScreen();
    } else if (state === 'playing' || state === 'gameover') {
        drawGame();
    }
    
    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    ctx.restore();
}

function drawStartScreen() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BULLET HELL PONG', W/2, H/3);
    
    ctx.font = '18px monospace';
    ctx.fillStyle = '#8af';
    ctx.fillText('Paddle bullets back to score points!', W/2, H/3 + 60);
    ctx.fillText('Don\'t let them pass your side - you lose a life.', W/2, H/3 + 90);
    ctx.fillText('First to make opponent lose all 3 lives wins.', W/2, H/3 + 120);
    
    ctx.fillStyle = '#ff0';
    ctx.font = '24px monospace';
    const blink = Math.floor(Date.now() / 500) % 2;
    if (blink) ctx.fillText('PRESS SPACE TO START', W/2, H * 0.7);
    
    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('Controls: W/S or ↑/↓ to move paddle', W/2, H * 0.8);
}

function drawGame() {
    // Player paddle (left)
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(30, playerPaddle.y, PADDLE_W, playerPaddle.h);
    
    // AI paddle (right)
    ctx.shadowColor = '#f0f';
    ctx.fillStyle = '#f0f';
    ctx.fillRect(W - 30 - PADDLE_W, aiPaddle.y, PADDLE_W, aiPaddle.h);
    ctx.shadowBlur = 0;
    
    // Bullets
    for (const b of bullets) {
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
    
    // Score
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0ff';
    ctx.fillText(scorePlayer, W/2 - 50, 50);
    ctx.fillStyle = '#f0f';
    ctx.fillText(scoreAI, W/2 + 50, 50);
    
    // Lives
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#0ff';
    ctx.fillText('♥'.repeat(Math.max(0, livesPlayer)), 40, H - 20);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#f0f';
    ctx.fillText('♥'.repeat(Math.max(0, livesAI)), W - 40, H - 20);
    
    // Wave name
    ctx.textAlign = 'center';
    ctx.font = '14px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('Pattern: ' + PATTERNS[waveType % PATTERNS.length], W/2, H - 20);
    
    if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 48px monospace';
        ctx.textAlign = 'center';
        const winner = livesPlayer > 0 ? 'YOU WIN!' : 'AI WINS!';
        ctx.fillText(winner, W/2, H/2 - 20);
        ctx.font = '24px monospace';
        ctx.fillStyle = '#ff0';
        ctx.fillText('Final Score: ' + scorePlayer + ' - ' + scoreAI, W/2, H/2 + 30);
        const blink = Math.floor(Date.now() / 500) % 2;
        if (blink) {
            ctx.font = '20px monospace';
            ctx.fillText('PRESS SPACE TO RESTART', W/2, H * 0.7);
        }
    }
}

let lastTime = 0;
function loop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 3);
    lastTime = time;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
