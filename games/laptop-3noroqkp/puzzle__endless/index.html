<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Slide</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', system-ui, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}
function playTone(freq, dur, type='sine', vol=0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function playSlide() { playTone(300 + Math.random()*100, 0.08, 'triangle', 0.12); }
function playComplete() {
  [523,659,784,1047].forEach((f,i) => setTimeout(() => playTone(f, 0.3, 'sine', 0.2), i*80));
}
function playGameOver() { [400,350,300,250].forEach((f,i) => setTimeout(() => playTone(f, 0.4, 'sawtooth', 0.1), i*150)); }

// Game State
const STATE = { MENU: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3 };
let state = STATE.MENU;
let grid = [];
let gridSize = 3;
let score = 0;
let level = 1;
let timeLeft = 60;
let lastTime = 0;
let tiles = [];
let particles = [];
let animating = false;
let animProgress = 0;
let animTile = null;
let levelCompleteTimer = 0;
let shakeTimer = 0;
let shakeIntensity = 0;

const COLORS = [
  ['#4a90d9','#357abd','#2c6aa0'],
  ['#e74c3c','#c0392b','#a93226'],
  ['#2ecc71','#27ae60','#1e8449'],
  ['#f39c12','#d68910','#b9770e'],
  ['#9b59b6','#8e44ad','#7d3c98'],
  ['#1abc9c','#16a085','#117a65'],
  ['#e67e22','#ca6f1e','#a04000'],
  ['#3498db','#2980b9','#1f6dad'],
  ['#e74c3c','#ec7063','#f1948a']
];

function getTileColor(val, size) {
  const hue = (val * 360 / (size*size - 1)) % 360;
  return `hsl(${hue}, 65%, 50%)`;
}

function initLevel(size) {
  gridSize = size;
  const n = size * size - 1;
  tiles = [];
  for (let i = 0; i < n; i++) {
    tiles.push({ val: i+1, row: i % size, col: Math.floor(i / size), targetRow: i % size, targetCol: Math.floor(i / size) });
  }
  // Shuffle by valid moves
  let emptyR = size - 1, emptyC = size - 1;
  const moves = Math.min(200 + size * 100, 500);
  for (let m = 0; m < moves; m++) {
    const neighbors = [];
    if (emptyR > 0) neighbors.push([emptyR-1, emptyC]);
    if (emptyR < size-1) neighbors.push([emptyR+1, emptyC]);
    if (emptyC > 0) neighbors.push([emptyR, emptyC-1]);
    if (emptyC < size-1) neighbors.push([emptyR, emptyC+1]);
    const [nr, nc] = neighbors[Math.floor(Math.random() * neighbors.length)];
    const tileIdx = tiles.findIndex(t => t.row === nr && t.col === nc);
    if (tileIdx >= 0) {
      tiles[tileIdx].row = emptyR; tiles[tileIdx].col = emptyC;
      emptyR = nr; emptyC = nc;
    }
  }
  timeLeft = Math.max(30, 65 - level * 3);
}

function isSolved() {
  for (let i = 0; i < tiles.length; i++) {
    if (tiles[i].targetRow !== tiles[i].row || tiles[i].targetCol !== tiles[i].col) return false;
  }
  return true;
}

function getTileAt(r, c) { return tiles.find(t => t.row === r && t.col === c); }
function getEmptyPos() { return tiles.find(t => t.row === -1 && t.col === -1) || null; }

function findEmpty() {
  for (let i = 0; i < tiles.length; i++) {
    if (!tiles[i].placed) return { row: -1, col: -1 };
  }
  // Empty is tracked separately
}

// Track empty position
let emptyRow, emptyCol;

function initLevel2(size) {
  gridSize = size;
  const n = size * size - 1;
  tiles = [];
  for (let i = 0; i < n; i++) {
    tiles.push({ val: i+1, row: i % size, col: Math.floor(i / size), targetRow: i % size, targetCol: Math.floor(i / size) });
  }
  emptyRow = size - 1; emptyCol = size - 1;
  const moves = 50 + size * 80;
  for (let m = 0; m < moves; m++) {
    const neighbors = [];
    if (emptyRow > 0) neighbors.push([emptyRow-1, emptyCol]);
    if (emptyRow < size-1) neighbors.push([emptyRow+1, emptyCol]);
    if (emptyCol > 0) neighbors.push([emptyRow, emptyCol-1]);
    if (emptyCol < size-1) neighbors.push([emptyRow, emptyCol+1]);
    const [nr, nc] = neighbors[Math.floor(Math.random() * neighbors.length)];
    const t = tiles.find(t => t.row === nr && t.col === nc);
    if (t) { t.row = emptyRow; t.col = emptyCol; emptyRow = nr; emptyCol = nc; }
  }
  timeLeft = Math.max(25, 60 - level * 2.5);
}

function startGame() {
  score = 0; level = 1;
  initLevel2(3);
  state = STATE.PLAYING;
}

function nextLevel() {
  level++;
  const sizes = [3,4,5];
  const s = sizes[(level-1) % 3] + Math.floor((level-1)/3);
  const clamped = Math.min(s, 6);
  initLevel2(clamped);
  state = STATE.PLAYING;
}

function spawnParticles(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2, life: 1, color: color || '#fff', size: 3+Math.random()*4 });
  }
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= dt * 1.5;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function getBoardPos() {
  const maxSize = Math.min(W, H) * 0.75;
  const tileSize = maxSize / gridSize;
  const boardW = tileSize * gridSize;
  const x = (W - boardW) / 2;
  const y = (H - boardW) / 2;
  return { x, y, tileSize };
}

function drawBoard() {
  const { x, y, tileSize } = getBoardPos();
  
  // Board background
  ctx.fillStyle = '#1a1a2e';
  ctx.strokeStyle = '#333355';
  ctx.lineWidth = 2;
  roundRect(x - 4, y - 4, tileSize*gridSize + 8, tileSize*gridSize + 8, 8);
  ctx.fill(); ctx.stroke();

  // Tiles
  for (const t of tiles) {
    if (t.row < 0 || t.col < 0) continue;
    const tx = x + t.col * tileSize;
    const ty = y + t.row * tileSize;
    const pad = Math.max(2, tileSize * 0.04);
    
    // Tile shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(tx+pad, ty+pad+3, tileSize-pad*2, tileSize-pad*2, 6);
    ctx.fill();
    
    // Tile body
    const solved = (t.row === t.targetRow && t.col === t.targetCol);
    const baseColor = getTileColor(t.val, gridSize);
    ctx.fillStyle = solved ? baseColor : baseColor;
    roundRect(tx+pad, ty+pad, tileSize-pad*2, tileSize-pad*2, 6);
    ctx.fill();
    
    // Tile highlight
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    roundRect(tx+pad, ty+pad, tileSize-pad*2, (tileSize-pad*2)*0.4, 6);
    ctx.fill();
    
    // Number
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.floor(tileSize * 0.35)}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText(t.val, tx + tileSize/2, ty + tileSize/2);
    ctx.shadowBlur = 0;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function drawHUD() {
  const { x, y, tileSize } = getBoardPos();
  const boardTop = y - 50;
  
  // Level
  ctx.fillStyle = '#aaddff';
  ctx.font = `bold ${Math.floor(W*0.03)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(`Level ${level}`, x, boardTop);
  
  // Score
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffdd88';
  ctx.fillText(`Score: ${score}`, x + tileSize*gridSize, boardTop);
  
  // Timer bar
  const barW = tileSize * gridSize;
  const barH = 12;
  const barY = y - 35;
  const pct = Math.max(0, timeLeft / (60 - level*2.5));
  
  ctx.fillStyle = '#1a1a2e';
  roundRect(x, barY, barW, barH, 4);
  ctx.fill();
  
  const timerColor = pct > 0.3 ? '#2ecc71' : pct > 0.15 ? '#f39c12' : '#e74c3c';
  ctx.fillStyle = timerColor;
  roundRect(x, barY, barW * Math.max(0, timeLeft / (60 - level*2.5)), barH, 4);
  ctx.fill();
  
  // Timer text
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.floor(W*0.018)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`${Math.ceil(timeLeft)}s`, x + barW/2, barY - 5);
}

function drawMenu() {
  // Background
  drawBackground();
  
  // Title
  const titleSize = Math.min(W*0.08, H*0.1);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${titleSize}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#4a90d9';
  ctx.shadowBlur = 20;
  ctx.fillText('ENDLESS SLIDE', W/2, H*0.3);
  ctx.shadowBlur = 0;
  
  // Subtitle
  ctx.font = `${Math.min(W*0.025, 18)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#aaa';
  ctx.fillText('A puzzle that never ends', W/2, H*0.3 + titleSize*0.7);
  
  // Instructions
  const lines = [
    '• Slide numbered tiles to solve the puzzle',
    '• Grid grows each level: 3×3 → 4×4 → 5×5 → ...',
    '• Beat the timer to advance',
    '',
    'Controls:',
    'Click/tap a tile next to the gap to slide it',
    'Arrow keys also work',
    '',
    'Press SPACE or click to start'
  ];
  
  ctx.font = `${Math.min(W*0.02, 15)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#ccc';
  lines.forEach((line, i) => {
    ctx.fillText(line, W/2, H*0.45 + i * Math.min(H*0.035, 28));
  });
  
  // Animated tiles in background
  const t = performance.now() / 1000;
  for (let i = 0; i < 12; i++) {
    const px = W/2 + Math.cos(t*0.5 + i*0.5) * W*0.35;
    const py = H/2 + Math.sin(t*0.7 + i*0.8) * H*0.35;
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = getTileColor(i+1, 4);
    roundRect(px-20, py-20, 40, 40, 6);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(1, '#1a1a3e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawLevelComplete() {
  drawBackground();
  drawBoard();
  drawHUD();
  
  const alpha = Math.min(1, levelCompleteTimer / 0.5);
  ctx.fillStyle = `rgba(46, 204, 113, ${alpha * 0.15})`;
  ctx.fillRect(0, 0, W, H);
  
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#2ecc71';
  ctx.font = `bold ${Math.min(W*0.06, 48)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('LEVEL COMPLETE!', W/2, H*0.4);
  
  const bonus = Math.floor(timeLeft * 10);
  ctx.font = `${Math.min(W*0.03, 24)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#ffdd88';
  ctx.fillText(`Time Bonus: +${bonus}`, W/2, H*0.5);
  
  ctx.fillStyle = '#aaa';
  ctx.font = `${Math.min(W*0.02, 16)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Next level incoming...', W/2, H*0.58);
  ctx.globalAlpha = 1;
}

function drawGameOver() {
  drawBackground();
  drawBoard();
  
  // Overlay
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);
  
  ctx.fillStyle = '#e74c3c';
  ctx.font = `bold ${Math.min(W*0.06, 48)}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('TIME\'S UP!', W/2, H*0.35);
  
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(W*0.04, 32)}px 'Segoe UI', sans-serif`;
  ctx.fillText(`Final Score: ${score}`, W/2, H*0.45);
  
  ctx.fillStyle = '#aaa';
  ctx.font = `${Math.min(W*0.025, 18)}px 'Segoe UI', sans-serif`;
  ctx.fillText('You reached Level ' + level, W/2, H*0.52);
  
  // High score
  try {
    const best = parseInt(localStorage.getItem('endlessSlideHigh') || '0');
    if (score > best) {
      localStorage.setItem('endlessSlideHigh', score);
      ctx.fillStyle = '#f39c12';
      ctx.fillText('★ NEW HIGH SCORE! ★', W/2, H*0.6);
    } else {
      ctx.fillStyle = '#888';
      ctx.fillText(`Best: ${best}`, W/2, H*0.6);
    }
  } catch(e) {}
  
  ctx.fillStyle = '#fff';
  ctx.font = `${Math.min(W*0.025, 18)}px 'Segoe UI', sans-serif`;
  ctx.fillText('Press R or click to restart', W/2, H*0.7);
}

let lastFrame = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  
  ctx.clearRect(0, 0, W, H);
  
  if (state === STATE.MENU) {
    drawMenu();
  } else if (state === STATE.PLAYING) {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      state = STATE.GAME_OVER;
      playGameOver();
      shakeTimer = 0.5;
      shakeIntensity = 8;
    }
    
    // Shake
    let sx = 0, sy = 0;
    if (shakeTimer > 0) {
      shakeTimer -= dt;
      sx = (Math.random()-0.5) * shakeIntensity * (shakeTimer/0.5);
      sy = (Math.random()-0.5) * shakeIntensity * (shakeTimer/0.5);
    }
    
    ctx.save();
    ctx.translate(sx, sy);
    drawBackground();
    drawBoard();
    drawHUD();
    updateParticles(dt);
    drawParticles();
    ctx.restore();
  } else if (state === STATE.LEVEL_COMPLETE) {
    levelCompleteTimer += dt;
    if (levelCompleteTimer > 2) { nextLevel(); }
    drawLevelComplete();
    updateParticles(dt);
    drawParticles();
  } else if (state === STATE.GAME_OVER) {
    ctx.save();
    let sx = 0, sy = 0;
    if (shakeTimer > 0) {
      shakeTimer -= dt;
      sx = (Math.random()-0.5) * shakeIntensity * (shakeTimer/0.5);
      sy = (Math.random()-0.5) * shakeIntensity * (shakeTimer/0.5);
    }
    ctx.translate(sx, sy);
    drawGameOver();
    ctx.restore();
  }
  
  requestAnimationFrame(gameLoop);
}

function handleInput(row, col) {
  if (state !== STATE.PLAYING) return;
  // Check if adjacent to empty
  const dr = Math.abs(row - emptyRow);
  const dc = Math.abs(col - emptyCol);
  if ((dr === 1 && dc === 0) || (dc === 1 && dr === 0)) {
    const t = tiles.find(t => t.row === row && t.col === col);
    if (t) {
      t.row = emptyRow; t.col = emptyCol;
      emptyRow = row; emptyCol = col;
      playSlide();
      
      const { x, y, tileSize } = getBoardPos();
      const px = x + emptyRow * tileSize + tileSize/2;
      const py = y + emptyCol * tileSize + tileSize/2;
      spawnParticles(px, py, 3, '#88ccff');
      
      // Check solved
      if (isSolved()) {
        const bonus = Math.floor(timeLeft * 10);
        score += gridSize * 100 + bonus;
        playComplete();
        state = STATE.LEVEL_COMPLETE;
        levelCompleteTimer = 0;
        
        const { x: bx, y: by, tileSize: ts } = getBoardPos();
        for (let i = 0; i < 30; i++) {
          setTimeout(() => {
            spawnParticles(bx + Math.random()*ts*gridSize, by + Math.random()*ts*gridSize, 5, `hsl(${Math.random()*360}, 80%, 60%)`);
          }, i * 30);
        }
      }
    }
  }
}

function handleArrow(dir) {
  if (state !== STATE.PLAYING) return;
  let nr, nc;
  switch(dir) {
    case 'up': nr = emptyRow+1; nc = emptyCol; break;
    case 'down': nr = emptyRow-1; nc = emptyCol; break;
    case 'left': nr = emptyRow; nc = emptyCol+1; break;
    case 'right': nr = emptyRow; nc = emptyCol-1; break;
    default: return;
  }
  if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
    handleInput(nr, nc);
  }
}

// Input
canvas.addEventListener('click', (e) => {
  initAudio();
  if (state === STATE.MENU || state === STATE.GAME_OVER) { startGame(); return; }
  if (state !== STATE.PLAYING) return;
  
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const { x, y, tileSize } = getBoardPos();
  
  const col = Math.floor((mx - x) / tileSize);
  const row = Math.floor((my - y) / tileSize);
  
  if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
    handleInput(row, col);
  }
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  const touch = e.touches[0];
  const event = new MouseEvent('click', { clientX: touch.clientX, clientY: touch.clientY });
  canvas.dispatchEvent(event);
});

window.addEventListener('keydown', (e) => {
  initAudio();
  if (state === STATE.MENU || state === STATE.GAME_OVER) {
    if (e.code === 'Space' || e.code === 'KeyR') startGame();
    return;
  }
  if (state !== STATE.PLAYING) return;
  
  switch(e.code) {
    case 'ArrowUp': handleArrow('up'); break;
    case 'ArrowDown': handleArrow('down'); break;
    case 'ArrowLeft': handleArrow('left'); break;
    case 'ArrowRight': handleArrow('right'); break;
  }
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
