<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Match-3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxBounce() { playSound(220, 0.08, 'square', 0.1); }
function sfxMatch() { playSound(440, 0.15, 'sine', 0.2); playSound(660, 0.15, 'sine', 0.15); }
function sfxPaddle() { playSound(330, 0.06, 'triangle', 0.12); }
function sfxGameOver() { playSound(150, 0.5, 'sawtooth', 0.2); }
function sfxWin() { playSound(523, 0.2, 'sine', 0.2); setTimeout(()=>playSound(659,0.2,'sine',0.2),150); setTimeout(()=>playSound(784,0.3,'sine',0.2),300); }

// Game constants
const COLS = 7, ROWS = 8;
const COLORS = ['#ff4466', '#44aaff', '#44ff88', '#ffdd44', '#cc66ff'];
const COLOR_NAMES = ['red', 'blue', 'green', 'yellow', 'purple'];

// Game state
let state = 'start'; // start, playing, gameover
let score = 0;
let timer = 60;
let lastTime = 0;
let particles = [];
let grid = [];
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 8 };
let paddle = { y: 0, h: 80, speed: 400 };
let comboCounter = 0;
let lastInteractionCell = -1;
let interactionCooldown = 0;
let floatingTexts = [];

// Grid layout
function getGridLayout() {
    const gridW = Math.min(W * 0.55, 420);
    const gridH = Math.min(H * 0.75, 480);
    const cellW = gridW / COLS;
    const cellH = gridH / ROWS;
    const gx = W * 0.32;
    const gy = (H - gridH) / 2;
    return { gx, gy, cellW, cellH, gridW, gridH };
}

function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
            grid[r][c] = Math.floor(Math.random() * COLORS.length);
        }
    }
    // Remove initial matches
    let hasMatch = true;
    while (hasMatch) {
        hasMatch = false;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (c + 2 < COLS && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                    grid[r][c+2] = (grid[r][c] + 1 + Math.floor(Math.random()*4)) % COLORS.length;
                    hasMatch = true;
                }
                if (r + 2 < ROWS && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                    grid[r+2][c] = (grid[r][c] + 1 + Math.floor(Math.random()*4)) % COLORS.length;
                    hasMatch = true;
                }
            }
        }
    }
}

function startGame() {
    state = 'playing';
    score = 0;
    timer = 60;
    comboCounter = 0;
    particles = [];
    floatingTexts = [];
    lastInteractionCell = -1;
    interactionCooldown = 0;
    initGrid();
    
    const layout = getGridLayout();
    paddle.y = H / 2 - paddle.h / 2;
    ball.x = W * 0.15;
    ball.y = H / 2;
    ball.vx = 300 + Math.random() * 100;
    ball.vy = (Math.random() - 0.5) * 200;
}

function resetGame() { startGame(); }

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    initAudio();
    if (state === 'start' && (e.code === 'Space' || e.code === 'Enter')) { startGame(); }
    else if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) { resetGame(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Match logic
function checkMatches() {
    let matched = new Set();
    // Horizontal
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
            if (grid[r][c] !== -1 && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                matched.add(r * COLS + c);
                matched.add(r * COLS + c + 1);
                matched.add(r * COLS + c + 2);
            }
        }
    }
    // Vertical
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
            if (grid[r][c] !== -1 && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                matched.add(r * COLS + c);
                matched.add((r+1) * COLS + c);
                matched.add((r+2) * COLS + c);
            }
        }
    }
    return matched;
}

function clearMatches(matched) {
    if (matched.size === 0) return false;
    comboCounter++;
    const points = matched.size * 10 * comboCounter;
    score += points;
    
    const layout = getGridLayout();
    floatingTexts.push({ x: layout.gx + layout.gridW/2, y: layout.gy + layout.gridH/2, text: '+' + points, life: 1, vy: -60 });
    
    sfxMatch();
    
    for (const idx of matched) {
        const r = Math.floor(idx / COLS);
        const c = idx % COLS;
        grid[r][c] = -1;
        // Spawn particles
        const px = layout.gx + c * layout.cellW + layout.cellW/2;
        const py = layout.gy + r * layout.cellH + layout.cellH/2;
        for (let i = 0; i < 5; i++) {
            particles.push({
                x: px, y: py,
                vx: (Math.random()-0.5) * 200,
                vy: (Math.random()-0.5) * 200,
                life: 0.6,
                color: COLORS[grid[r][c] >= 0 ? grid[r][c] : Math.floor(Math.random()*5)]
            });
        }
    }
    
    // Gravity
    for (let c = 0; c < COLS; c++) {
        let write = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (grid[r][c] !== -1) {
                grid[write][c] = grid[r][c];
                if (write !== r) grid[r][c] = -1;
                write--;
            }
        }
        for (let r = write; r >= 0; r--) {
            grid[r][c] = Math.floor(Math.random() * COLORS.length);
        }
    }
    
    // Check for cascades
    setTimeout(() => {
        const moreMatches = checkMatches();
        if (moreMatches.size > 0) clearMatches(moreMatches);
        else comboCounter = 0;
    }, 200);
    
    return true;
}

function swapGems(r, c) {
    const neighbors = [];
    if (r > 0) neighbors.push([r-1, c]);
    if (r < ROWS-1) neighbors.push([r+1, c]);
    if (c > 0) neighbors.push([r, c-1]);
    if (c < COLS-1) neighbors.push([r, c+1]);
    
    if (neighbors.length === 0) return;
    const [nr, nc] = neighbors[Math.floor(Math.random() * neighbors.length)];
    
    const tmp = grid[r][c];
    grid[r][c] = grid[nr][nc];
    grid[nr][nc] = tmp;
}

function ballHitsGrid() {
    const layout = getGridLayout();
    const r = Math.floor((ball.y - layout.gy) / layout.cellH);
    const c = Math.floor((ball.x - layout.gx) / layout.cellW);
    
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const cellIdx = r * COLS + c;
        if (cellIdx !== lastInteractionCell && interactionCooldown <= 0) {
            lastInteractionCell = cellIdx;
            interactionCooldown = 0.5;
            swapGems(r, c);
            const matches = checkMatches();
            if (matches.size > 0) clearMatches(matches);
        }
    }
}

// Update
function update(dt) {
    if (state !== 'playing') return;
    
    timer -= dt;
    if (timer <= 0) {
        timer = 0;
        state = 'gameover';
        sfxGameOver();
        return;
    }
    
    // Paddle
    if (keys['KeyW'] || keys['ArrowUp']) paddle.y -= paddle.speed * dt;
    if (keys['KeyS'] || keys['ArrowDown']) paddle.y += paddle.speed * dt;
    paddle.y = Math.max(0, Math.min(H - paddle.h, paddle.y));
    
    // Ball physics
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    
    // Top/bottom bounce
    if (ball.y < 15) { ball.y = 15; ball.vy = Math.abs(ball.vy); sfxBounce(); }
    if (ball.y > H - 15) { ball.y = H - 15; ball.vy = -Math.abs(ball.vy); sfxBounce(); }
    
    // Left paddle bounce
    const px = W * 0.08;
    if (ball.x < px + 8 && ball.vx < 0) {
        if (ball.y > paddle.y && ball.y < paddle.y + paddle.h) {
            ball.x = px + 8;
            ball.vx = Math.abs(ball.vx);
            // Deflect based on where it hits the paddle
            const hitPos = (ball.y - paddle.y) / paddle.h;
            ball.vy += (hitPos - 0.5) * 200;
            sfxPaddle();
        } else {
            // Ball missed the paddle - reset from left
            ball.x = W * 0.15;
            ball.y = H / 2;
            ball.vx = 300 + Math.random() * 100;
            ball.vy = (Math.random() - 0.5) * 200;
        }
    }
    
    // Right wall bounce
    if (ball.x > W - 20) {
        ball.x = W - 20;
        ball.vx = -Math.abs(ball.vx);
        sfxBounce();
    }
    
    // Interaction cooldown
    interactionCooldown -= dt;
    
    // Ball-gem interaction
    ballHitsGrid();
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx * dt;
        particles[i].y += particles[i].vy * dt;
        particles[i].life -= dt;
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    
    // Floating texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].y += floatingTexts[i].vy * dt;
        floatingTexts[i].life -= dt;
        if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }
}

// Render
function drawGem(x, y, w, h, colorIdx) {
    if (colorIdx < 0 || colorIdx >= COLORS.length) return;
    const r = Math.min(w, h) * 0.38;
    ctx.fillStyle = COLORS[colorIdx];
    ctx.beginPath();
    ctx.arc(x + w/2, y + h/2, r, 0, Math.PI * 2);
    ctx.fill();
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(x + w/2 - r*0.25, y + h/2 - r*0.25, r * 0.4, 0, Math.PI * 2);
    ctx.fill();
}

function drawGrid() {
    const layout = getGridLayout();
    // Grid background
    ctx.fillStyle = 'rgba(30,30,60,0.5)';
    ctx.fillRect(layout.gx - 4, layout.gy - 4, layout.gridW + 8, layout.gridH + 8);
    ctx.strokeStyle = 'rgba(100,100,200,0.3)';
    ctx.lineWidth = 1;
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(layout.gx, layout.gy + r * layout.cellH);
        ctx.lineTo(layout.gx + layout.gridW, layout.gy + r * layout.cellH);
        ctx.stroke();
    }
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(layout.gx + c * layout.cellW, layout.gy);
        ctx.lineTo(layout.gx + c * layout.cellW, layout.gy + layout.gridH);
        ctx.stroke();
    }
    
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            drawGem(layout.gx + c * layout.cellW, layout.gy + r * layout.cellH, layout.cellW, layout.cellH, grid[r][c]);
        }
    }
}

function drawBall() {
    // Trail
    ctx.fillStyle = 'rgba(255,255,200,0.3)';
    ctx.beginPath();
    ctx.arc(ball.x - ball.vx * 0.02, ball.y - ball.vy * 0.02, ball.r * 0.7, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffff88';
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawPaddle() {
    const px = W * 0.08;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#88ccff';
    ctx.shadowBlur = 15;
    ctx.fillRect(px, paddle.y, 8, paddle.h);
    ctx.shadowBlur = 0;
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 0.6);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4 * (p.life / 0.6), 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
    for (const ft of floatingTexts) {
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.fillStyle = '#ffdd44';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1;
}

function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + score, 20, 35);
    
    // Timer bar
    const barW = W * 0.4;
    const barX = W/2 - barW/2;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(barX, 15, barW, 16);
    ctx.fillStyle = timer > 10 ? '#44ff88' : '#ff4466';
    ctx.fillRect(barX, 15, barW * (timer / 60), 16);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, 15, barW, 16);
    
    ctx.textAlign = 'center';
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(Math.ceil(timer) + 's', W/2, 48);
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('PONG MATCH-3', W/2, H * 0.25);
    
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaccff';
    ctx.fillText('Steer the Pong ball through the gem grid', W/2, H * 0.4);
    ctx.fillText('to trigger swaps and clear matches of 3+!', W/2, H * 0.45);
    
    ctx.font = '14px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('W / S or ↑ / ↓ — Move paddle', W/2, H * 0.58);
    ctx.fillText('The ball bounces automatically through the grid.', W/2, H * 0.63);
    ctx.fillText('Each pass can swap a gem and clear matches.', W/2, H * 0.68);
    ctx.fillText('You have 60 seconds. Score as many points as possible!', W/2, H * 0.73);
    
    // Color legend
    const legendY = H * 0.8;
    for (let i = 0; i < COLORS.length; i++) {
        ctx.fillStyle = COLORS[i];
        ctx.beginPath();
        ctx.arc(W/2 - 100 + i * 50, legendY, 10, 0, Math.PI*2);
        ctx.fill();
    }
    
    // Pulsing prompt
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('Press SPACE to Start', W/2, H * 0.9);
    ctx.globalAlpha = 1;
}

function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 42px monospace';
    ctx.fillStyle = '#ff4466';
    ctx.fillText("TIME'S UP!", W/2, H * 0.35);
    
    ctx.font = 'bold 28px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('Final Score: ' + score, W/2, H * 0.48);
    
    // Rank
    let rank = 'Rookie';
    if (score >= 100) rank = 'Apprentice';
    if (score >= 300) rank = 'Adept';
    if (score >= 600) rank = 'Expert';
    if (score >= 1000) rank = 'Master';
    ctx.font = '20px monospace';
    ctx.fillStyle = '#ffdd44';
    ctx.fillText('Rank: ' + rank, W/2, H * 0.58);
    
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
    ctx.globalAlpha = pulse;
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('Press SPACE to Play Again', W/2, H * 0.72);
    ctx.globalAlpha = 1;
}

// Main loop
function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    update(dt);
    
    if (state === 'start') {
        drawStartScreen();
    } else {
        // Background
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, W, H);
        
        // Subtle grid glow
        const layout = getGridLayout();
        ctx.fillStyle = 'rgba(60,60,120,0.1)';
        ctx.fillRect(layout.gx - 10, layout.gy - 10, layout.gridW + 20, layout.gridH + 20);
        
        drawGrid();
        drawParticles();
        drawFloatingTexts();
        drawBall();
        drawPaddle();
        drawHUD();
        
        if (state === 'gameover') drawGameOver();
    }
    
    requestAnimationFrame(gameLoop);
}

// Initialize grid for start screen background
initGrid();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
