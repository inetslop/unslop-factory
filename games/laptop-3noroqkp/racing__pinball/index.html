<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinball Racer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    const aspect = 3/5;
    if (window.innerWidth / window.innerHeight > aspect) {
        H = window.innerHeight;
        W = H * aspect;
    } else {
        W = window.innerWidth;
        H = W / aspect;
    }
    canvas.width = W;
    canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}

// Game state
let gameState = 'start'; // start, playing, countdown, finished
let time = 0;
let lastTime = 0;
let frameCount = 0;

// Table dimensions (relative)
const TABLE = { x: 0.12, y: 0.05, w: 0.76, h: 0.82 };
const WALL_THICK = 0.03;

// Ball
let ball = { x: 0, y: 0, vx: 0, vy: 0, r: 0.018, active: false };

// Flippers
let flipperL = { x: 0.22, y: 0.82, w: 0.2, angle: 0.7, targetAngle: 0.7, restAngle: 0.7, hitAngle: -0.4, speed: 15 };
let flipperR = { x: 0.58, y: 0.82, w: 0.2, angle: -0.7, targetAngle: -0.7, restAngle: -0.7, hitAngle: 0.4, speed: 15 };

// Bumpers
let bumpers = [
    { x: 0.35, y: 0.35, r: 0.04 },
    { x: 0.52, y: 0.42, r: 0.04 },
    { x: 0.42, y: 0.55, r: 0.035 }
];

// Checkpoints (race track)
let checkpoints = [
    { x: 0.2, y: 0.15, r: 0.03 },
    { x: 0.7, y: 0.15, r: 0.03 },
    { x: 0.82, y: 0.5, r: 0.03 },
    { x: 0.45, y: 0.65, r: 0.03 },
    { x: 0.15, y: 0.5, r: 0.03 }
];
let cpIndex = 0;

// Race
let lap = 0;
const TOTAL_LAPS = 3;
let raceTime = 0;
let bestTime = null;
let lapTimes = [];
let countdown = 0;

// Particles
let particles = [];

// Plunger
let plunger = { y: 0.82, power: 0, pulling: false };

function getTable() {
    return { x: TABLE.x * W, y: TABLE.y * H, w: TABLE.w * W, h: TABLE.h * H };
}

function resetBall() {
    const t = getTable();
    ball.x = 0.85 * W;
    ball.y = 0.78 * H;
    ball.vx = 0;
    ball.vy = 0;
    ball.active = false;
}

function startRace() {
    gameState = 'countdown';
    countdown = 3;
    raceTime = 0;
    lap = 0;
    cpIndex = 0;
    lapTimes = [];
    resetBall();
    plunger.power = 0;
    plunger.pulling = false;
}

function launchBall() {
    if (!ball.active && gameState === 'playing') {
        ball.vx = -2 + Math.random() * 1;
        ball.vy = -(8 + plunger.power * 6);
        ball.active = true;
        playSound(200, 0.2, 'sine', 0.3);
    }
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    initAudio();
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        startRace();
    } else if (gameState === 'countdown') {
        // wait
    } else if (gameState === 'playing') {
        if (e.code === 'Space') launchBall();
        if (e.code === 'KeyR') startRace();
    } else if (gameState === 'finished' && (e.code === 'KeyR' || e.code === 'Enter')) {
        startRace();
    }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// Physics
function updatePhysics(dt) {
    if (!ball.active) return;
    
    const gravity = 0.0004 * H;
    ball.vy += gravity * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    
    const t = getTable();
    const br = ball.r * W;
    
    // Wall collisions
    if (ball.x - br < t.x) { ball.x = t.x + br; ball.vx = Math.abs(ball.vx) * 0.95; playSound(300, 0.1, 'square', 0.2); }
    if (ball.x + br > t.x + t.w) { ball.x = t.x + t.w - br; ball.vx = -Math.abs(ball.vx) * 0.95; playSound(300, 0.1, 'square', 0.2); }
    if (ball.y - br < t.y) { ball.y = t.y + br; ball.vy = Math.abs(ball.vy) * 0.95; playSound(300, 0.1, 'square', 0.2); }
    
    // Bumper collisions
    for (let b of bumpers) {
        const bx = b.x * W, by = b.y * H, br2 = b.r * W;
        let dx = ball.x - bx, dy = ball.y - by;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < br2 + br) {
            let nx = dx / dist, ny = dy / dist;
            let overlap = br2 + br - dist;
            ball.x += nx * overlap;
            ball.y += ny * overlap;
            let dot = ball.vx * nx + ball.vy * ny;
            ball.vx = (ball.vx - 2 * dot * nx) * 1.1 + nx * 3;
            ball.vy = (ball.vy - 2 * dot * ny) * 1.1 + ny * 3;
            playSound(500, 0.15, 'square', 0.4);
            spawnParticles(ball.x, ball.y, '#ff6600');
        }
    }
    
    // Flipper collisions
    updateFlipper(flipperL, dt);
    updateFlipper(flipperR, dt);
    
    // Checkpoint detection
    if (gameState === 'playing') {
        let cp = checkpoints[cpIndex];
        let cx = cp.x * W, cy = cp.y * H;
        let dx = ball.x - cx, dy = ball.y - cy;
        if (Math.sqrt(dx*dx + dy*dy) < cp.r * W * 1.5) {
            cpIndex++;
            playSound(800, 0.2, 'sine', 0.4);
            spawnParticles(cx, cy, '#00ffcc');
            if (cpIndex >= checkpoints.length) {
                cpIndex = 0;
                lap++;
                let lapTime = raceTime - (lapTimes.length > 0 ? lapTimes[lapTimes.length-1] : 0);
                lapTimes.push(lapTime);
                playSound(600, 0.3, 'sine', 0.5);
                if (lap >= TOTAL_LAPS) {
                    gameState = 'finished';
                    try {
                        let times = JSON.parse(localStorage.getItem('pinballRacerBest') || 'null');
                        if (!times || raceTime < times) {
                            localStorage.setItem('pinballRacerBest', JSON.stringify(raceTime));
                        }
                    } catch(e) {}
                }
            }
        }
    }
    
    // Ball fell off bottom
    if (ball.y > H + 50) {
        ball.active = false;
        resetBall();
        playSound(150, 0.3, 'sawtooth', 0.2);
    }
}

function updateFlipper(f, dt) {
    let pressed = (f === flipperL && (keys['KeyA'] || keys['ArrowLeft'])) || 
                  (f === flipperR && (keys['KeyD'] || keys['ArrowRight']));
    
    if (pressed) {
        f.targetAngle = f.hitAngle;
    } else {
        f.targetAngle = f.restAngle;
    }
    
    let diff = f.targetAngle - f.angle;
    if (Math.abs(diff) > 0.01) {
        f.angle += Math.sign(diff) * Math.min(Math.abs(diff), f.speed * dt);
    } else {
        f.angle = f.targetAngle;
    }
    
    // Flipper ball collision
    if (!ball.active) return;
    
    let fx = (f === flipperL ? 0.22 : 0.78) * W;
    let fy = 0.82 * H;
    let fw = 0.18 * W;
    let angle = f.angle;
    
    // Flipper tip
    let tipX = fx + Math.cos(angle) * (f === flipperL ? -fw : fw);
    let tipY = fy + Math.sin(angle) * (f === flipperL ? -fw : fw);
    
    // Simple line segment collision
    let bx = ball.x - fx, by = ball.y - fy;
    let proj = bx * (tipX - fx) / fw + by * (tipY - fy) / fw;
    
    if (proj > -0.2 && proj < 1.2) {
        let px = fx + (tipX - fx) * proj;
        let py = fy + (tipY - fy) * proj;
        let dx = ball.x - px, dy = ball.y - py;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < ball.r * W * 1.5) {
            let nx = dx / dist, ny = dy / dist;
            let speed = 5 + f.speed * 0.3;
            ball.vx = nx * speed + Math.cos(angle) * 2;
            ball.vy = -Math.abs(speed) * 0.8 + ny * 2;
            playSound(400, 0.1, 'square', 0.3);
        }
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1, color });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Rendering
function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    const t = getTable();
    
    // Table background
    ctx.fillStyle = '#12122a';
    ctx.fillRect(t.x, t.y, t.w, t.h);
    
    // Grid lines
    ctx.strokeStyle = 'rgba(30, 30, 80, 0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < t.w; i += 20) {
        ctx.beginPath(); ctx.moveTo(t.x + i, t.y); ctx.lineTo(t.x + i, t.y + t.h); ctx.stroke();
    }
    for (let i = 0; i < t.h; i += 20) {
        ctx.beginPath(); ctx.moveTo(t.x, t.y + i); ctx.lineTo(t.x + t.w, t.y + i); ctx.stroke();
    }
    
    // Walls
    ctx.fillStyle = '#334';
    ctx.strokeStyle = '#00ccff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 10;
    ctx.fillRect(t.x - 5, t.y, 8, t.h);
    ctx.fillRect(t.x + t.w - 3, t.y, 8, t.h);
    ctx.fillRect(t.x, t.y - 5, t.w, 8);
    ctx.shadowBlur = 0;
    
    // Bumpers
    for (let b of bumpers) {
        let bx = b.x * W, by = b.y * H, br = b.r * W;
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fillStyle = '#ff3366';
        ctx.shadowColor = '#ff3366';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(bx, by, br * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffaa00';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    // Checkpoints
    for (let i = 0; i < checkpoints.length; i++) {
        let cp = checkpoints[i];
        let cx = cp.x * W, cy = cp.y * H;
        let isNext = (i === cpIndex && gameState === 'playing');
        
        ctx.beginPath();
        ctx.arc(cx, cy, cp.r * W * 1.5, 0, Math.PI * 2);
        if (isNext) {
            ctx.fillStyle = `rgba(0, 255, 200, ${0.5 + 0.3 * Math.sin(time * 5)})`;
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 15;
        } else {
            ctx.fillStyle = 'rgba(100, 100, 150, 0.4)';
            ctx.shadowBlur = 0;
        }
        ctx.fill();
        
        // Number
        ctx.fillStyle = isNext ? '#fff' : '#667';
        ctx.font = `bold ${cp.r * W}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(i + 1, cx, cy);
    }
    
    // Flippers
    drawFlipper(flipperL);
    drawFlipper(flipperR);
    
    // Ball
    if (ball.active || !ball.active) {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r * W, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Ball trail
        if (ball.active) {
            ctx.beginPath();
            ctx.arc(ball.x - ball.vx * 2, ball.y - ball.vy * 2, ball.r * W * 0.7, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(150, 200, 255, 0.3)';
            ctx.fill();
        }
    }
    
    // Plunger (when ball not active)
    if (!ball.active && gameState === 'playing') {
        let px = 0.85 * W;
        let py = 0.78 * H + plunger.power * -20;
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(px - 4, py, 8, 30);
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SPACE', px, py + 50);
    }
    
    // Particles
    for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
    }
    
    // HUD
    if (gameState === 'playing' || gameState === 'countdown') {
        drawHUD();
    }
}

function drawFlipper(f) {
    let isLeft = f === flipperL;
    let fx = (isLeft ? 0.22 : 0.78) * W;
    let fy = 0.82 * H;
    let fw = 0.16 * W;
    
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(f.angle);
    
    ctx.beginPath();
    if (isLeft) {
        ctx.moveTo(0, 0);
        ctx.lineTo(-fw, -8);
        ctx.lineTo(-fw, 8);
    } else {
        ctx.moveTo(0, 0);
        ctx.lineTo(fw, -8);
        ctx.lineTo(fw, 8);
    }
    ctx.closePath();
    ctx.fillStyle = '#ff6633';
    ctx.shadowColor = '#ff6633';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.strokeStyle = '#ffaa66';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
    ctx.shadowBlur = 0;
}

function drawHUD() {
    // Top bar
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, 35);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`LAP: ${Math.min(lap + 1, TOTAL_LAPS)}/${TOTAL_LAPS}`, 10, 22);
    
    let tStr = raceTime.toFixed(2);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00ffcc';
    ctx.fillText(`TIME: ${tStr}s`, W/2, 22);
    
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffaa00';
    let bestStr = '';
    try {
        let stored = JSON.parse(localStorage.getItem('pinballRacerBest') || 'null');
        if (stored) bestStr = `BEST: ${stored.toFixed(2)}s`;
    } catch(e) {}
    ctx.fillText(bestStr, W - 10, 22);
    
    // Lap times
    if (lapTimes.length > 0) {
        ctx.textAlign = 'left';
        ctx.font = '11px monospace';
        ctx.fillStyle = '#888';
        let str = lapTimes.map((t, i) => `L${i+1}:${t.toFixed(2)}`).join(' | ');
        ctx.fillText(str, 10, H - 10);
    }
}

function drawStartScreen() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, W, H);
    
    // Title
    ctx.shadowColor = '#00ccff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#00ccff';
    ctx.font = `bold ${Math.min(W*0.1, 48)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('PINBALL', W/2, H * 0.2);
    ctx.fillStyle = '#ff6633';
    ctx.shadowColor = '#ff6633';
    ctx.fillText('RACER', W/2, H * 0.3);
    ctx.shadowBlur = 0;
    
    // Instructions
    ctx.fillStyle = '#aaccff';
    ctx.font = `${Math.min(W*0.04, 16)}px monospace`;
    ctx.fillText('Use flippers to bounce the ball', W/2, H * 0.45);
    ctx.fillText('through checkpoints in order!', W/2, H * 0.5);
    ctx.fillText('', W/2, H * 0.55);
    
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.min(W*0.035, 14)}px monospace`;
    ctx.fillText('A / ← : Left Flipper', W/2, H * 0.6);
    ctx.fillText('D / → : Right Flipper', W/2, H * 0.64);
    ctx.fillText('SPACE : Launch Ball', W/2, H * 0.68);
    ctx.fillText('R : Restart Race', W/2, H * 0.72);
    
    // Blinking prompt
    if (Math.sin(time * 3) > 0) {
        ctx.fillStyle = '#00ffcc';
        ctx.font = `bold ${Math.min(W*0.045, 20)}px sans-serif`;
        ctx.fillText('PRESS SPACE TO START', W/2, H * 0.85);
    }
}

function drawCountdown() {
    draw();
    
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    
    let num = Math.ceil(countdown);
    ctx.fillStyle = '#ffaa00';
    ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 30;
    ctx.font = `bold ${W * 0.25}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(num > 0 ? num : 'GO!', W/2, H/2);
    ctx.shadowBlur = 0;
}

function drawFinished() {
    draw();
    
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 20;
    ctx.font = `bold ${W*0.08}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('RACE COMPLETE!', W/2, H * 0.3);
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#fff';
    ctx.font = `${W*0.04}px monospace`;
    ctx.fillText(`Total: ${raceTime.toFixed(2)}s`, W/2, H * 0.45);
    
    for (let i = 0; i < lapTimes.length; i++) {
        ctx.fillStyle = '#aaccff';
        ctx.font = `${W*0.03}px monospace`;
        ctx.fillText(`Lap ${i+1}: ${lapTimes[i].toFixed(2)}s`, W/2, H * 0.52 + i * 25);
    }
    
    // Best time
    try {
        let stored = JSON.parse(localStorage.getItem('pinballRacerBest') || 'null');
        if (stored) {
            ctx.fillStyle = '#ffaa00';
            ctx.font = `${W*0.035}px monospace`;
            ctx.fillText(`Best: ${stored.toFixed(2)}s`, W/2, H * 0.7);
        }
    } catch(e) {}
    
    if (Math.sin(time * 3) > 0) {
        ctx.fillStyle = '#fff';
        ctx.font = `${W*0.04}px sans-serif`;
        ctx.fillText('Press R to Race Again', W/2, H * 0.85);
    }
}

function update(dt) {
    time += dt;
    
    if (gameState === 'countdown') {
        countdown -= dt;
        if (countdown <= 0) {
            gameState = 'playing';
        }
        return;
    }
    
    if (gameState !== 'playing') return;
    
    raceTime += dt;
    
    // Plunger pull
    if (keys['Space'] && !ball.active) {
        plunger.pulling = true;
        plunger.power = Math.min(plunger.power + dt * 2, 1);
    } else if (!keys['Space']) {
        if (plunger.pulling) {
            launchBall();
            plunger.pulling = false;
            plunger.power = 0;
        }
    }
    
    updatePhysics(dt);
    updateParticles(dt);
}

function gameLoop(timestamp) {
    let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    
    update(dt);
    
    if (gameState === 'start') drawStartScreen();
    else if (gameState === 'countdown') drawCountdown();
    else if (gameState === 'playing') draw();
    else if (gameState === 'finished') drawFinished();
    
    requestAnimationFrame(gameLoop);
}

resetBall();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
