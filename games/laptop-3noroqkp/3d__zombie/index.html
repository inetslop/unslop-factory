<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zombie 3D - Survival</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
canvas { display: block; image-rendering: pixelated; }
#ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; font-family: monospace; }
#hud { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 18px; text-shadow: 0 0 4px #f00; display: flex; gap: 30px; }
#crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: rgba(255,50,50,0.8); font-size: 24px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="hud" style="display:none">
<span id="hp">HP: 100</span>
<span id="ammo">AMMO: 30</span>
<span id="score">KILLS: 0</span>
<span id="wave">WAVE: 1</span>
</div>
<div id="crosshair" style="display:none">+</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
W = window.innerWidth; H = window.innerHeight;
canvas.width = W; canvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain); gain.connect(audioCtx.destination);
if (type === 'shoot') {
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
osc.start(); osc.stop(audioCtx.currentTime + 0.2);
} else if (type === 'hit') {
osc.type = 'square'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
osc.start(); osc.stop(audioCtx.currentTime + 0.1);
} else if (type === 'zombie') {
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, audioCtx.currentTime);
osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
osc.start(); osc.stop(audioCtx.currentTime + 0.4);
} else if (type === 'death') {
osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1);
gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
osc.start(); osc.stop(audioCtx.currentTime + 1);
} else if (type === 'reload') {
osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}
}

// Map
const MAP_SIZE = 24;
const map = [];
for (let i = 0; i < MAP_SIZE * MAP_SIZE; i++) map.push(1);
function buildMap() {
for (let i = 0; i < MAP_SIZE; i++) for (let j = 0; j < MAP_SIZE; j++) map[i * MAP_SIZE + j] = 1;
const rooms = [
[2,2,6,6],[10,2,5,4],[17,2,5,5],
[2,10,5,5],[9,9,6,6],[17,9,5,5],
[2,17,5,5],[9,16,6,6],[17,17,5,5]
];
rooms.forEach(r => { for (let x = r[0]; x < r[0]+r[2]; x++) for (let y = r[1]; y < r[1]+r[3]; y++) if (x>0&&x<MAP_SIZE-1&&y>0&&y<MAP_SIZE-1) map[y*MAP_SIZE+x] = 0; });
// Doorways
const doors = [[4,2],[4,10],[4,17],[10,4],[9,11],[15,9],[17,4],[17,11],[17,18],[4,13],[10,18],[16,16],[7,9],[12,15]];
doors.forEach(d => { if (d[0]>0&&d[0]<MAP_SIZE-1&&d[1]>0&&d[1]<MAP_SIZE-1) map[d[1]*MAP_SIZE+d[0]] = 0; });
}
buildMap();

// Game state
let gameState = 'start'; // start, playing, gameover
let player = { x: 4.5, y: 4.5, angle: 0, hp: 100, ammo: 30, kills: 0 };
let zombies = [];
let wave = 1;
let waveTimer = 0;
let zombieSpawnTimer = 0;
let bullets = [];
let particles = [];
let muzzleFlash = 0;
let shakeTime = 0;
let lastTime = 0;
let keys = {};

// Input
window.addEventListener('keydown', e => { keys[e.code] = true; if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) startGame(); if (gameState === 'gameover' && e.code === 'KeyR') startGame(); initAudio(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', () => { initAudio(); if (gameState === 'start') startGame(); if (gameState === 'playing') shoot(); });

function startGame() {
player = { x: 4.5, y: 4.5, angle: 0, hp: 100, ammo: 30, kills: 0 };
zombies = []; bullets = []; particles = [];
wave = 1; waveTimer = 0; zombieSpawnTimer = 0; muzzleFlash = 0; shakeTime = 0;
gameState = 'playing';
document.getElementById('hud').style.display = 'flex';
document.getElementById('crosshair').style.display = 'block';
spawnWave();
}

function spawnWave() {
const count = 2 + wave * 2;
for (let i = 0; i < count; i++) {
let x, y;
do { x = Math.floor(Math.random() * (MAP_SIZE-2)) + 1; y = Math.floor(Math.random() * (MAP_SIZE-2)) + 1; } while (map[y*MAP_SIZE+x] !== 0 || Math.abs(x-player.x)<3 && Math.abs(y-player.y)<3);
zombies.push({ x: x+0.5, y: y+0.5, hp: 3 + wave, speed: 0.8 + wave*0.1, attackCd: 0, size: 0.6 + Math.random()*0.2 });
}
}

function shoot() {
if (player.ammo <= 0 || gameState !== 'playing') return;
player.ammo--;
muzzleFlash = 0.15;
shakeTime = 0.1;
playSound('shoot');
// Hitscan
let bestDist = Infinity, hitZombie = null;
for (let z of zombies) {
const dx = z.x - player.x, dy = z.y - player.y;
const dist = Math.sqrt(dx*dx+dy*dy);
const angleToZ = Math.atan2(dy, dx);
let diff = Math.abs(normalizeAngle(angleToZ - player.angle));
if (diff < 0.15 && dist < bestDist) {
// Check line of sight
let steps = Math.ceil(dist * 4);
let blocked = false;
for (let s = 1; s < steps; s++) {
const sx = player.x + dx/s, sy = player.y + dy/s;
if (map[Math.floor(sy)*MAP_SIZE+Math.floor(sx)] === 1) { blocked = true; break; }
}
if (!blocked) { bestDist = dist; hitZombie = z; }
}
}
// Check walls
let wallDist = castRay(player.x, player.y, player.angle);
if (hitZombie && bestDist < wallDist) {
hitZombie.hp -= 2;
playSound('hit');
for (let i = 0; i < 5; i++) particles.push({ x: hitZombie.x, y: hitZombie.y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: 0.5, color: '#f00' });
if (hitZombie.hp <= 0) {
zombies.splice(zombies.indexOf(hitZombie), 1);
player.kills++;
playSound('death');
}
} else if (!hitZombie && wallDist < 20) {
// Hit wall - spark
let wx = player.x + Math.cos(player.angle)*wallDist;
let wy = player.y + Math.sin(player.angle)*wallDist;
for (let i = 0; i < 3; i++) particles.push({ x: wx, y: wy, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, life: 0.3, color: '#ff0' });
}
if (player.ammo <= 0) setTimeout(() => { if (gameState==='playing') { player.ammo = 30; playSound('reload'); } }, 800);
}

function castRay(px, py, angle) {
let dx = Math.cos(angle), dy = Math.sin(angle);
for (let d = 0.1; d < 20; d += 0.05) {
const cx = Math.floor(px + dx*d), cy = Math.floor(py + dy*d);
if (cx < 0 || cx >= MAP_SIZE || cy < 0 || cy >= MAP_SIZE) return d;
if (map[cy*MAP_SIZE+cx] === 1) return d;
}
return 20;
}

function normalizeAngle(a) { while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; }

function update(dt) {
if (gameState !== 'playing') return;
// Movement
let moveX = 0, moveY = 0;
const speed = 3 * dt;
if (keys['KeyW'] || keys['ArrowUp']) { moveX += Math.cos(player.angle)*speed; moveY += Math.sin(player.angle)*speed; }
if (keys['KeyS'] || keys['ArrowDown']) { moveX -= Math.cos(player.angle)*speed; moveY -= Math.sin(player.angle)*speed; }
if (keys['KeyA'] || keys['KeyQ']) { moveX += Math.cos(player.angle - Math.PI/2)*speed; moveY += Math.sin(player.angle - Math.PI/2)*speed; }
if (keys['KeyD'] || keys['KeyE']) { moveX -= Math.cos(player.angle - Math.PI/2)*speed; moveY -= Math.sin(player.angle - Math.PI/2)*speed; }
let nx = player.x + moveX, ny = player.y + moveY;
if (map[Math.floor(ny)*MAP_SIZE+Math.floor(player.x)] === 0) player.x = nx;
if (map[Math.floor(player.y)*MAP_SIZE+Math.floor(nx)] === 0) player.y = ny;

// Look
if (keys['ArrowLeft'] || keys['KeyF']) player.angle -= 2.5 * dt;
if (keys['ArrowRight'] || keys['KeyG']) player.angle += 2.5 * dt;

// Fire
if (keys['Space'] || keys['KeyJ']) { if (!shootCooldown) { shoot(); shootCooldown = 0.3; } }
if (keys['KeyR'] && player.ammo < 30) { player.ammo = 30; playSound('reload'); }

// Zombies
for (let z of zombies) {
const dx = player.x - z.x, dy = player.y - z.y;
const dist = Math.sqrt(dx*dx+dy*dy);
if (dist > 0.8) {
let mx = (dx/dist)*z.speed*dt, my = (dy/dist)*z.speed*dt;
let nx2 = z.x + mx, ny2 = z.y + my;
if (map[Math.floor(ny2)*MAP_SIZE+Math.floor(z.x)] === 0) z.x = nx2;
if (map[Math.floor(z.y)*MAP_SIZE+Math.floor(nx2)] === 0) z.y = ny2;
} else {
z.attackCd -= dt;
if (z.attackCd <= 0) {
player.hp -= 15;
z.attackCd = 1.5;
shakeTime = 0.3;
playSound('zombie');
if (player.hp <= 0) { gameState = 'gameover'; document.getElementById('hud').style.display='none'; document.getElementById('crosshair').style.display='none'; }
}
}
}

// Particles
for (let p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
particles = particles.filter(p => p.life > 0);

// Muzzle flash
if (muzzleFlash > 0) muzzleFlash -= dt;
if (shakeTime > 0) shakeTime -= dt;
if (shootCooldown > 0) shootCooldown -= dt;

// Wave
waveTimer += dt;
if (zombies.length === 0 && waveTimer > 3) {
wave++;
spawnWave();
waveTimer = 0;
}

// Update HUD
document.getElementById('hp').textContent = 'HP: ' + Math.max(0, Math.floor(player.hp));
document.getElementById('ammo').textContent = 'AMMO: ' + player.ammo;
document.getElementById('score').textContent = 'KILLS: ' + player.kills;
document.getElementById('wave').textContent = 'WAVE: ' + wave;
}

let shootCooldown = 0;

// Render
const WALL_HUE = [20, 35, 50];
function render() {
ctx.fillStyle = '#1a1a2e';
ctx.fillRect(0, 0, W, H);

// Sky gradient
let skyGrad = ctx.createLinearGradient(0, 0, 0, H/2);
skyGrad.addColorStop(0, '#0f0f23');
skyGrad.addColorStop(1, '#2a1a3a');
ctx.fillStyle = skyGrad;
ctx.fillRect(0, 0, W, H/2);

// Floor gradient
let floorGrad = ctx.createLinearGradient(0, H/2, 0, H);
floorGrad.addColorStop(0, '#1a1a1a');
floorGrad.addColorStop(1, '#3a3a3a');
ctx.fillStyle = floorGrad;
ctx.fillRect(0, H/2, W, H/2);

let shakeX = 0, shakeY = 0;
if (shakeTime > 0) { shakeX = (Math.random()-0.5)*8; shakeY = (Math.random()-0.5)*8; }

// Raycast walls
const fov = Math.PI / 2.5;
let zBuffer = new Array(W).fill(Infinity);
let wallHeights = [];

for (let x = 0; x < W; x++) {
let rayAngle = player.angle - fov/2 + (x/W)*fov;
let dx = Math.cos(rayAngle), dy = Math.sin(rayAngle);
let dist = 0.1, hit = false, side = 0;
for (let d = 0.1; d < 20; d += 0.02) {
const cx = Math.floor(player.x + dx*d), cy = Math.floor(player.y + dy*d);
if (cx < 0 || cx >= MAP_SIZE || cy < 0 || cy >= MAP_SIZE) { hit = true; dist = d; break; }
if (map[cy*MAP_SIZE+cx] === 1) { hit = true; dist = d; side = Math.abs(dx) > Math.abs(dy) ? 0 : 1; break; }
}
let correctedDist = dist * Math.cos(rayAngle - player.angle);
let wallH = (H / correctedDist) * 0.8;
wallHeights[x] = { dist: correctedDist, h: wallH };

let brightness = Math.max(0.15, 1 - correctedDist/12);
let r = 100 + side*30, g = 80, b = 60;
r *= brightness; g *= brightness; b *= brightness;
ctx.fillStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
let wy = H/2 - wallH/2 + shakeY;
ctx.fillRect(x + shakeX, wy, 1, wallH);

// Texture lines
if (x % 8 === 0) {
ctx.fillStyle = `rgba(0,0,0,${brightness*0.3})`;
ctx.fillRect(x + shakeX, wy, 1, wallH);
}
zBuffer[x] = correctedDist;
}

// Floor tiles
for (let x = 0; x < W; x += 2) {
let rayAngle = player.angle - fov/2 + (x/W)*fov;
let dx = Math.cos(rayAngle), dy = Math.sin(rayAngle);
for (let d = 1; d < 15; d += 0.5) {
const cx = Math.floor(player.x + dx*d), cy = Math.floor(player.y + dy*d);
if (cx >= 0 && cx < MAP_SIZE && cy >= 0 && cy < MAP_SIZE) {
let screenX = x + shakeX;
let sy = H/2 + (H*0.4 * (d/15)) + shakeY;
let tileH = H*0.4*(1/d - 1/(d+0.5));
if ((cx+cy)%2===0) { ctx.fillStyle = `rgba(60,60,60,${Math.max(0,1-d/12)})`; ctx.fillRect(screenX, sy, 3, Math.max(1,tileH)); }
}
}
}

// Sort and draw zombies (sprites)
let sortedZombies = [...zombies].sort((a,b) => {
let da = (a.x-player.x)**2+(a.y-player.y)**2;
let db = (b.x-player.x)**2+(b.y-player.y)**2;
return db-da;
});

for (let z of sortedZombies) {
let dx = z.x - player.x, dy = z.z ? 0 : z.y - player.y;
let dist = Math.sqrt((z.x-player.x)**2 + (z.y-player.y)**2);
if (dist > 15) continue;

let angleToZ = Math.atan2(z.y - player.y, z.x - player.x);
let screenAngle = normalizeAngle(angleToZ - player.angle);
let screenX = W/2 + (screenAngle / fov) * W + shakeX;
let spriteH = (H / dist) * 0.7 * z.size;
let spriteW = spriteH * 0.5;

// Check if in front of wall
let colX = Math.floor(screenX);
if (colX >= 0 && colX < W && zBuffer[colX] > dist) {
let sy = H/2 - spriteH/2 + shakeY;

// Zombie body
let bobOffset = Math.sin(Date.now()*0.005 + z.x)*5;
ctx.fillStyle = `rgba(80,120,60,${Math.max(0.3, 1-dist/12)})`;
ctx.fillRect(screenX - spriteW/2, sy + bobOffset, spriteW, spriteH);

// Head
let headSize = spriteH * 0.3;
ctx.fillStyle = `rgba(140,180,100,${Math.max(0.3, 1-dist/12)})`;
ctx.fillRect(screenX - headSize/2, sy + bobOffset, headSize, headSize);

// Eyes
let eyeSize = Math.max(2, spriteH * 0.05);
ctx.fillStyle = `rgba(255,0,0,${Math.max(0.5, 1-dist/12)})`;
ctx.fillRect(screenX - headSize*0.3, sy + bobOffset + headSize*0.2, eyeSize, eyeSize);
ctx.fillRect(screenX + headSize*0.1, sy + bobOffset + headSize*0.2, eyeSize, eyeSize);

// Arms
let armW = spriteW * 0.3;
ctx.fillStyle = `rgba(100,140,80,${Math.max(0.3, 1-dist/12)})`;
let armSwing = Math.sin(Date.now()*0.008 + z.y)*spriteH*0.15;
ctx.fillRect(screenX - spriteW/2 - armW, sy + bobOffset + spriteH*0.3, armW, spriteH*0.4);
ctx.fillRect(screenX + spriteW/2, sy + bobOffset + spriteH*0.3 + armSwing, armW, spriteH*0.4);

// HP bar
if (z.hp < 3+wave) {
let bw = spriteW * 0.8;
ctx.fillStyle = 'rgba(0,0,0,0.5)';
ctx.fillRect(screenX - bw/2, sy - 10, bw, 4);
ctx.fillStyle = '#f00';
ctx.fillRect(screenX - bw/2, sy - 10, bw * (z.hp/(3+wave)), 4);
}
}
}

// Particles (projected)
for (let p of particles) {
let dx = p.x - player.x, dy = p.y - player.y;
let dist = Math.sqrt(dx*dx+dy*dy);
if (dist > 15) continue;
let angleToP = Math.atan2(dy, dx);
let screenAngle = normalizeAngle(angleToP - player.angle);
let sx = W/2 + (screenAngle / fov) * W + shakeX;
let sy = H/2 + shakeY;
let size = Math.max(2, 20/dist);
ctx.fillStyle = p.color;
ctx.globalAlpha = p.life * 2;
ctx.fillRect(sx - size/2, sy - size/2, size, size);
ctx.globalAlpha = 1;
}

// Gun
if (gameState === 'playing') {
let gunW = W * 0.15, gunH = H * 0.3;
let gunX = W/2 + shakeX, gunY = H - gunH*0.8 + shakeY;
// Muzzle flash
if (muzzleFlash > 0) {
ctx.fillStyle = `rgba(255,200,50,${muzzleFlash*4})`;
let fgR = 30 + Math.random()*20;
ctx.beginPath(); ctx.arc(gunX, gunY - 20, fgR, 0, Math.PI*2); ctx.fill();
}
// Gun body
ctx.fillStyle = '#333';
ctx.fillRect(gunX - 8, gunY, 16, gunH);
ctx.fillStyle = '#555';
ctx.fillRect(gunX - 12, gunY + 10, 24, 20);
ctx.fillStyle = '#222';
ctx.fillRect(gunX - 5, gunY, 10, 30);
// Hand
ctx.fillStyle = '#c8a060';
ctx.fillRect(gunX - 15, gunY + gunH*0.5, 30, 25);
}

// Damage vignette
if (player.hp < 40) {
let alpha = (40 - player.hp) / 40 * 0.4;
let vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.7);
vg.addColorStop(0, 'rgba(0,0,0,0)');
vg.addColorStop(1, `rgba(150,0,0,${alpha})`);
ctx.fillStyle = vg;
ctx.fillRect(0, 0, W, H);
}

// Game Over screen
if (gameState === 'gameover') {
ctx.fillStyle = 'rgba(0,0,0,0.7)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#f33';
ctx.font = 'bold 48px monospace';
ctx.textAlign = 'center';
ctx.fillText('YOU DIED', W/2, H/2 - 40);
ctx.fillStyle = '#fff';
ctx.font = '24px monospace';
ctx.fillText(`Kills: ${player.kills}  |  Wave: ${wave}`, W/2, H/2 + 10);
ctx.font = '18px monospace';
ctx.fillStyle = '#aaa';
ctx.fillText('Press R to restart', W/2, H/2 + 60);
}

// Start screen
if (gameState === 'start') {
ctx.fillStyle = 'rgba(0,0,0,0.85)';
ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#f33';
ctx.font = 'bold 52px monospace';
ctx.textAlign = 'center';
ctx.fillText('ZOMBIE 3D', W/2, H/2 - 80);
ctx.fillStyle = '#fff';
ctx.font = '16px monospace';
let lines = [
'WASD / Arrows - Move & Look',
'Space / Click - Shoot',
'R - Reload',
'',
'Survive the zombie horde.',
'They get faster each wave.',
'',
'Press SPACE or CLICK to start'
];
lines.forEach((l, i) => ctx.fillText(l, W/2, H/2 - 30 + i*28));
}
}

function gameLoop(time) {
let dt = Math.min((time - lastTime) / 1000, 0.05);
lastTime = time;
update(dt);
render();
requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
