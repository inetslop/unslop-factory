<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper Top-Down</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#game-container {
  position: relative;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#start-screen {
  text-align: center;
  z-index: 10;
}
#start-screen h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  color: #e94560;
  text-shadow: 0 0 20px rgba(233,69,96,0.5), 0 4px 8px rgba(0,0,0,0.5);
  margin-bottom: 10px;
  letter-spacing: 4px;
}
#start-screen h2 {
  font-size: clamp(0.9rem, 2vw, 1.2rem);
  color: #a8b2d8;
  margin-bottom: 30px;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.controls {
  color: #7f8c9b;
  font-size: clamp(0.8rem, 1.5vw, 1rem);
  line-height: 1.8;
  margin-bottom: 30px;
}
.difficulty-select {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 25px;
}
.diff-btn {
  padding: 10px 20px;
  background: #16213e;
  border: 2px solid #0f3460;
  color: #a8b2d8;
  font-family: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
}
.diff-btn:hover, .diff-btn.active {
  background: #e94560;
  border-color: #e94560;
  color: #fff;
  box-shadow: 0 0 15px rgba(233,69,96,0.4);
}
#start-btn {
  padding: 14px 40px;
  background: #e94560;
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: 1.1rem;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.2s;
  box-shadow: 0 4px 15px rgba(233,69,96,0.3);
}
#start-btn:hover {
  background: #ff6b81;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(233,69,96,0.5);
}
#game-area {
  display: none;
  flex-direction: column;
  align-items: center;
}
#hud {
  display: flex;
  justify-content: space-between;
  width: 100%;
  max-width: 600px;
  margin-bottom: 8px;
  padding: 8px 12px;
  background: #16213e;
  border: 1px solid #0f3460;
}
.hud-item {
  color: #a8b2d8;
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  display: flex;
  align-items: center;
  gap: 8px;
}
.hud-value {
  color: #e94560;
  font-weight: bold;
  min-width: 50px;
  text-align: center;
}
#restart-btn {
  background: none;
  border: 1px solid #0f3460;
  color: #a8b2d8;
  font-family: inherit;
  padding: 4px 12px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}
#restart-btn:hover {
  border-color: #e94560;
  color: #e94560;
}
#board-wrap {
  position: relative;
  padding: 6px;
  background: #16213e;
  border: 1px solid #0f3460;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.05);
}
#board {
  display: grid;
  gap: 1px;
}
.cell {
  width: var(--cell-size);
  height: var(--cell-size);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: calc(var(--cell-size) * 0.55);
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  transition: transform 0.1s, box-shadow 0.1s;
}
.cell.hidden {
  background: linear-gradient(180deg, #2a3a5e 0%, #1f2d4a 100%);
  border-top: 2px solid #3d5a8a;
  border-left: 1px solid #2a3a5e;
  border-right: 1px solid #1a2640;
  border-bottom: 2px solid #1a2640;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
}
.cell.hidden:hover {
  background: linear-gradient(180deg, #344972 0%, #2a3a5e 100%);
  transform: scale(1.05);
  z-index: 2;
}
.cell.revealed {
  background: #0d1b2a;
  border: 1px solid #1a2640;
  cursor: default;
}
.cell.flagged {
  color: #e94560;
  font-size: calc(var(--cell-size) * 0.6);
}
.cell.mine-hit {
  background: #e94560 !important;
  color: #fff;
  animation: explode 0.3s ease-out;
}
.cell.mine-revealed {
  background: #2a1a1a;
  border: 1px solid #3a2020;
}
.cell.wrong-flag {
  color: #ff4444;
}
@keyframes explode {
  0% { transform: scale(1.3); }
  50% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
@keyframes reveal-pulse {
  0% { transform: scale(0.8); opacity: 0.5; }
  100% { transform: scale(1); opacity: 1; }
}
.cell.revealed { animation: reveal-pulse 0.2s ease-out; }
#message {
  margin-top: 12px;
  font-size: clamp(1rem, 2vw, 1.3rem);
  color: #e94560;
  letter-spacing: 2px;
  min-height: 1.5em;
  text-align: center;
}
</style>
</head>
<body>
<div id="game-container">
  <div id="start-screen">
    <h1>MINESWEEPER</h1>
    <h2>Top-Down Edition</h2>
    <div class="difficulty-select">
      <button class="diff-btn" data-diff="easy">Easy 9×9</button>
      <button class="diff-btn active" data-diff="medium">Medium 16×16</button>
      <button class="diff-btn" data-diff="hard">Hard 24×24</button>
    </div>
    <div class="controls">
      Left Click — Reveal Cell<br>
      Right Click — Place Flag<br>
      Find all safe cells to win. Avoid the mines!
    </div>
    <button id="start-btn">START GAME</button>
  </div>
  <div id="game-area">
    <div id="hud">
      <div class="hud-item">⚑ <span class="hud-value" id="mine-counter">0</span></div>
      <button id="restart-btn">↻ Restart</button>
      <div class="hud-item">⏱ <span class="hud-value" id="timer">0</span></div>
    </div>
    <div id="board-wrap"><div id="board"></div></div>
    <div id="message"></div>
  </div>
</div>

<script>
(function() {
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  function playTone(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }
  function playReveal() { playTone(440, 0.08, 'sine', 0.1); }
  function playFlag() { playTone(660, 0.1, 'triangle', 0.15); }
  function playBoom() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  }
  function playWin() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((n, i) => setTimeout(() => playTone(n, 0.3, 'sine', 0.2), i * 120));
  }

  const DIFFS = { easy: { rows: 9, cols: 9, mines: 10 }, medium: { rows: 16, cols: 16, mines: 40 }, hard: { rows: 24, cols: 24, mines: 80 } };
  let diff = 'medium';
  let grid = [], revealedCount = 0, flagCount = 0, timerInterval = null, seconds = 0, gameActive = false, firstClick = true;

  const boardEl = document.getElementById('board');
  const mineCounterEl = document.getElementById('mine-counter');
  const timerEl = document.getElementById('timer');
  const messageEl = document.getElementById('message');
  const startScreen = document.getElementById('start-screen');
  const gameArea = document.getElementById('game-area');

  // Difficulty buttons
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      diff = btn.dataset.diff;
    });
  });

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', restartGame);

  function startGame() {
    initAudio();
    startScreen.style.display = 'none';
    gameArea.style.display = 'flex';
    restartGame();
  }

  function restartGame() {
    const d = DIFFS[diff];
    const rows = d.rows, cols = d.cols;
    grid = Array.from({ length: rows * cols }, () => ({ mine: false, revealed: false, flagged: false, count: 0 }));
    revealedCount = 0; flagCount = 0; seconds = 0; firstClick = true; gameActive = true;
    timerEl.textContent = '0';
    mineCounterEl.textContent = d.mines;
    messageEl.textContent = '';
    clearInterval(timerInterval);

    // Calculate cell size
    const maxW = window.innerWidth * 0.9 - 20;
    const maxH = window.innerHeight * 0.85 - 60;
    let cellSize = Math.min(Math.floor(maxW / cols), Math.floor(maxH / rows));
    cellSize = Math.max(cellSize, 20);
    cellSize = Math.min(cellSize, 44);

    boardEl.style.setProperty('--cell-size', cellSize + 'px');
    boardEl.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
    boardEl.innerHTML = '';

    for (let i = 0; i < rows * cols; i++) {
      const el = document.createElement('div');
      el.className = 'cell hidden';
      el.dataset.index = i;
      boardEl.appendChild(el);
    }

    timerInterval = setInterval(() => {
      if (gameActive) { seconds++; timerEl.textContent = seconds; }
    }, 1000);
  }

  function placeMines(safeIdx) {
    const d = DIFFS[diff];
    const total = d.rows * d.cols;
    let placed = 0;
    while (placed < d.mines) {
      const idx = Math.floor(Math.random() * total);
      if (!grid[idx].mine && idx !== safeIdx && !isAdjacent(idx, safeIdx)) {
        grid[idx].mine = true;
        placed++;
      }
    }
    // Calculate counts
    for (let i = 0; i < total; i++) {
      let c = 0;
      getNeighbors(i).forEach(n => { if (grid[n].mine) c++; });
      grid[i].count = c;
    }
  }

  function isAdjacent(a, b) {
    const rows = DIFFS[diff].rows, cols = DIFFS[diff].cols;
    const ar = Math.floor(a / cols), ac = a % cols;
    const br = Math.floor(b / cols), bc = b % cols;
    return Math.abs(ar - br) <= 1 && Math.abs(ac - bc) <= 1;
  }

  function getNeighbors(idx) {
    const rows = DIFFS[diff].rows, cols = DIFFS[diff].cols;
    const r = Math.floor(idx / cols), c = idx % cols;
    const n = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) n.push(nr * cols + nc);
    }
    return n;
  }

  function revealFlood(idx) {
    const rows = DIFFS[diff].rows, cols = DIFFS[diff].cols;
    const stack = [idx];
    while (stack.length) {
      const i = stack.pop();
      if (grid[i].revealed || grid[i].flagged) continue;
      grid[i].revealed = true;
      revealedCount++;
      const el = boardEl.children[i];
      el.classList.remove('hidden');
      el.classList.add('revealed');
      el.textContent = grid[i].count > 0 ? grid[i].count : '';
      colorNumber(i);
      playReveal();
      if (grid[i].count === 0) {
        getNeighbors(i).forEach(n => {
          if (!grid[n].revealed && !grid[n].flagged) stack.push(n);
        });
      }
    }
  }

  function colorNumber(idx) {
    const c = grid[idx].count;
    const colors = ['', '#4fc3f7', '#81c784', '#fff176', '#ff9e80', '#ce93d8', '#ef5350', '#f06292', '#ffffff'];
    boardEl.children[idx].style.color = colors[c] || '#fff';
  }

  function checkWin() {
    const d = DIFFS[diff];
    const safeCells = d.rows * d.cols - d.mines;
    if (revealedCount >= safeCells) {
      gameActive = false;
      clearInterval(timerInterval);
      // Flag all mines
      for (let i = 0; i < grid.length; i++) {
        if (grid[i].mine && !grid[i].flagged) {
          grid[i].flagged = true;
          const el = boardEl.children[i];
          el.classList.remove('hidden');
          el.classList.add('revealed', 'flagged');
          el.textContent = '⚑';
        }
      }
      messageEl.textContent = '★ YOU WIN! ★';
      playWin();
    }
  }

  function lose(idx) {
    gameActive = false;
    clearInterval(timerInterval);
    const el = boardEl.children[idx];
    el.classList.remove('hidden');
    el.classList.add('revealed', 'mine-hit');
    el.textContent = '💣';
    // Show all mines
    for (let i = 0; i < grid.length; i++) {
      if (grid[i].mine && !grid[i].flagged) {
        const e = boardEl.children[i];
        e.classList.remove('hidden');
        e.classList.add('revealed', 'mine-revealed');
        e.textContent = '💣';
      }
      if (!grid[i].mine && grid[i].flagged) {
        const e = boardEl.children[i];
        e.classList.add('wrong-flag');
        e.textContent = '✗';
      }
    }
    messageEl.textContent = '💥 BOOM! GAME OVER';
    playBoom();
  }

  function handleReveal(idx) {
    if (!gameActive || grid[idx].revealed || grid[idx].flagged) return;
    if (firstClick) {
      firstClick = false;
      placeMines(idx);
    }
    if (grid[idx].mine) {
      lose(idx);
      return;
    }
    revealFlood(idx);
    checkWin();
  }

  function handleFlag(idx, e) {
    e.preventDefault();
    if (!gameActive || grid[idx].revealed) return;
    const el = boardEl.children[idx];
    if (grid[idx].flagged) {
      grid[idx].flagged = false;
      flagCount--;
      el.classList.remove('flagged');
      el.textContent = '';
    } else {
      grid[idx].flagged = true;
      flagCount++;
      el.classList.add('flagged');
      el.textContent = '⚑';
      playFlag();
    }
    const d = DIFFS[diff];
    mineCounterEl.textContent = Math.max(0, d.mines - flagCount);
  }

  boardEl.addEventListener('click', e => {
    const idx = parseInt(e.target.dataset.index);
    if (!isNaN(idx)) handleReveal(idx);
  });
  boardEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const idx = parseInt(e.target.dataset.index);
    if (!isNaN(idx)) handleFlag(e, idx);
  });

  window.addEventListener('resize', () => {
    if (gameActive) restartGame();
  });

  // Keyboard restart
  window.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') {
      if (gameArea.style.display === 'flex') restartGame();
    }
  });
})();
</script>
</body>
</html>
