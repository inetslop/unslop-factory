<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PONG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let W, H;
    let gameState = 'start'; // 'start', 'playing', 'gameover'
    let scores = [0, 0];
    let winScore = 11;
    let winner = -1;
    let audioCtx = null;
    let lastTime = 0;

    const ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 8, speed: 350 };
    const paddles = [
        { x: 0, y: 0, w: 12, h: 90, vy: 0 },
        { x: 0, y: 0, w: 12, h: 90, vy: 0 }
    ];
    const paddleSpeed = 450;

    let ballTrail = [];
    let particles = [];

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        if (gameState === 'start') {
            initPositions();
        }
    }

    function initPositions() {
        paddles[0].x = 30;
        paddles[0].y = H / 2 - paddles[0].h / 2;
        paddles[1].x = W - 30 - paddles[1].w;
        paddles[1].y = H / 2 - paddles[1].h / 2;
        resetBall();
    }

    function resetBall(direction) {
        ball.x = W / 2;
        ball.y = H / 2;
        const angle = (Math.random() * 0.8 - 0.4);
        const dir = direction || (Math.random() > 0.5 ? 1 : -1);
        ball.speed = 350;
        ball.vx = Math.cos(angle) * ball.speed * dir;
        ball.vy = Math.sin(angle) * ball.speed;
        ballTrail = [];
    }

    function startGame() {
        scores = [0, 0];
        winner = -1;
        gameState = 'playing';
        initPositions();
    }

    // Audio
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'paddle') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'wall') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'score') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(330, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'win') {
            osc.type = 'square';
            const notes = [262, 330, 392, 523];
            notes.forEach((freq, i) => {
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
            });
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    function spawnParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 150 + 50;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                color: color
            });
        }
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt * 2.5;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // Input
    const keys = {};
    window.addEventListener('keydown', function(e) {
        keys[e.code] = true;
        if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
            initAudio();
            startGame();
        } else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
            startGame();
        } else if (gameState === 'playing') {
            initAudio();
        }
    });
    window.addEventListener('keyup', function(e) {
        keys[e.code] = false;
    });

    window.addEventListener('resize', resize);

    function update(dt) {
        if (gameState !== 'playing') return;

        // Paddle movement
        const p1 = paddles[0];
        const p2 = paddles[1];

        if (keys['KeyW']) p1.y -= paddleSpeed * dt;
        if (keys['KeyS']) p1.y += paddleSpeed * dt;
        if (keys['ArrowUp']) p2.y -= paddleSpeed * dt;
        if (keys['ArrowDown']) p2.y += paddleSpeed * dt;

        // Clamp paddles
        p1.y = Math.max(0, Math.min(H - p1.h, p1.y));
        p2.y = Math.max(0, Math.min(H - p2.h, p2.y));

        // Ball movement
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Ball trail
        ballTrail.push({ x: ball.x, y: ball.y });
        if (ballTrail.length > 10) ballTrail.shift();

        // Wall collision
        if (ball.y - ball.radius <= 0) {
            ball.y = ball.radius;
            ball.vy = Math.abs(ball.vy);
            playSound('wall');
        }
        if (ball.y + ball.radius >= H) {
            ball.y = H - ball.radius;
            ball.vy = -Math.abs(ball.vy);
            playSound('wall');
        }

        // Paddle collision
        // Paddle 1 (left)
        if (ball.vx < 0 &&
            ball.x - ball.radius <= p1.x + p1.w &&
            ball.x + ball.radius >= p1.x &&
            ball.y >= p1.y &&
            ball.y <= p1.y + p1.h) {
            ball.x = p1.x + p1.w + ball.radius;
            const hitPos = (ball.y - p1.y) / p1.h * 2 - 1;
            const newAngle = hitPos * 0.9;
            ball.speed = Math.min(ball.speed * 1.05, 800);
            ball.vx = Math.cos(newAngle) * ball.speed;
            ball.vy = Math.sin(newAngle) * ball.speed;
            playSound('paddle');
            spawnParticles(ball.x, ball.y, '#0ff');
        }

        // Paddle 2 (right)
        if (ball.vx > 0 &&
            ball.x + ball.radius >= p2.x &&
            ball.x - ball.radius <= p2.x + p2.w &&
            ball.y >= p2.y &&
            ball.y <= p2.y + p2.h) {
            ball.x = p2.x - ball.radius;
            const hitPos = (ball.y - p2.y) / p2.h * 2 - 1;
            const newAngle = Math.PI - hitPos * 0.9;
            ball.speed = Math.min(ball.speed * 1.05, 800);
            ball.vx = Math.cos(newAngle) * ball.speed;
            ball.vy = Math.sin(newAngle) * ball.speed;
            playSound('paddle');
            spawnParticles(ball.x, ball.y, '#f44');
        }

        // Scoring
        if (ball.x + ball.radius < -20) {
            scores[1]++;
            playSound('score');
            spawnParticles(0, ball.y, '#f44');
            if (scores[1] >= winScore) {
                gameState = 'gameover';
                winner = 1;
                playSound('win');
            } else {
                resetBall(-1);
            }
        }

        if (ball.x - ball.radius > W + 20) {
            scores[0]++;
            playSound('score');
            spawnParticles(W, ball.y, '#0ff');
            if (scores[0] >= winScore) {
                gameState = 'gameover';
                winner = 0;
                playSound('win');
            } else {
                resetBall(1);
            }
        }

        updateParticles(dt);
    }

    function draw() {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, W, H);

        // Center line
        ctx.setLineDash([10, 15]);
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);

        if (gameState === 'start') {
            drawStartScreen();
        } else if (gameState === 'playing') {
            drawGame();
        } else if (gameState === 'gameover') {
            drawGame();
            drawGameOver();
        }
    }

    function drawStartScreen() {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Title
        ctx.font = `bold ${Math.min(W * 0.15, 120)}px monospace`;
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 30;
        ctx.fillText('PONG', W / 2, H * 0.3);
        ctx.shadowBlur = 0;

        // Subtitle
        ctx.font = `${Math.min(W * 0.03, 24)}px monospace`;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('TWO PLAYER', W / 2, H * 0.4);

        // Controls
        const lineH = Math.min(H * 0.06, 36);
        ctx.font = `${Math.min(W * 0.022, 18)}px monospace`;
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        const startY = H * 0.55;

        ctx.fillText('PLAYER 1 (LEFT)', W / 2 - W * 0.2, startY);
        ctx.fillStyle = '#0ff';
        ctx.font = `bold ${Math.min(W * 0.028, 24)}px monospace`;
        ctx.fillText('[W] / [S]', W / 2 - W * 0.2, startY + lineH);

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.font = `${Math.min(W * 0.022, 18)}px monospace`;
        ctx.fillText('PLAYER 2 (RIGHT)', W / 2 + W * 0.2, startY);
        ctx.fillStyle = '#f44';
        ctx.font = `bold ${Math.min(W * 0.028, 24)}px monospace`;
        ctx.fillText('[↑] / [↓]', W / 2 + W * 0.2, startY + lineH);

        // Start prompt
        const pulse = Math.sin(Date.now() * 0.003) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(255,255,255,${pulse})`;
        ctx.font = `${Math.min(W * 0.025, 22)}px monospace`;
        ctx.fillText('PRESS [SPACE] TO START', W / 2, H * 0.8);

        // Win score info
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = `${Math.min(W * 0.018, 16)}px monospace`;
        ctx.fillText(`FIRST TO ${winScore} WINS`, W / 2, H * 0.9);
    }

    function drawGame() {
        // Ball trail
        for (let i = 0; i < ballTrail.length; i++) {
            const alpha = (i / ballTrail.length) * 0.4;
            const size = ball.radius * (i / ballTrail.length);
            ctx.beginPath();
            ctx.arc(ballTrail[i].x, ballTrail[i].y, size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.fill();
        }

        // Ball
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Paddles
        const p1 = paddles[0];
        const p2 = paddles[1];

        ctx.fillStyle = '#0ff';
        ctx.shadowColor = '#0ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(p1.x, p1.y, p1.w, p1.h);

        ctx.fillStyle = '#f44';
        ctx.shadowColor = '#f44';
        ctx.shadowBlur = 10;
        ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
        ctx.shadowBlur = 0;

        // Particles
        for (const p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
            ctx.fillStyle = p.color + Math.floor(p.life * 255).toString(16).padStart(2, '0');
            ctx.fill();
        }

        // Scores
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = `bold ${Math.min(W * 0.08, 72)}px monospace`;
        ctx.fillStyle = 'rgba(0,255,255,0.4)';
        ctx.fillText(scores[0], W / 2 - W * 0.1, H * 0.05);
        ctx.fillStyle = 'rgba(255,68,68,0.4)';
        ctx.fillText(scores[1], W / 2 + W * 0.1, H * 0.05);
    }

    function drawGameOver() {
        // Overlay
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const color = winner === 0 ? '#0ff' : '#f44';
        const name = winner === 0 ? 'PLAYER 1' : 'PLAYER 2';

        ctx.font = `bold ${Math.min(W * 0.1, 80)}px monospace`;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
        ctx.fillText(name + ' WINS!', W / 2, H * 0.35);
        ctx.shadowBlur = 0;

        ctx.font = `${Math.min(W * 0.04, 36)}px monospace`;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText(`${scores[0]} - ${scores[1]}`, W / 2, H * 0.5);

        const pulse = Math.sin(Date.now() * 0.003) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(255,255,255,${pulse})`;
        ctx.font = `${Math.min(W * 0.025, 22)}px monospace`;
        ctx.fillText('PRESS [SPACE] TO PLAY AGAIN', W / 2, H * 0.7);
    }

    function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
    }

    // Init
    resize();
    initPositions();
    requestAnimationFrame(gameLoop);

    // localStorage (wrapped in try/catch as required)
    try {
        const saved = localStorage.getItem('pong_highscore');
        if (saved) {
            JSON.parse(saved);
        }
    } catch (e) {}
})();
</script>
</body>
</html>
