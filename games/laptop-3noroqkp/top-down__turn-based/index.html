<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dungeon Delver - Top-Down Turn-Based RPG</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: monospace; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, SCALE;
function resize() {
  const aspect = 4/3;
  if (window.innerWidth / window.innerHeight > aspect) {
    H = window.innerHeight;
    W = H * aspect;
  } else {
    W = window.innerWidth;
    H = W / aspect;
  }
  canvas.width = W;
  canvas.height = H;
  SCALE = W / 640;
}
window.addEventListener('resize', resize);
resize();

// Audio
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || webkitAudioContext)(); }
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  if (type === 'hit') { osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); }
  else if (type === 'kill') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); }
  else if (type === 'heal') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); }
  else if (type === 'stairs') { osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); }
  else if (type === 'playerhit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); }
  else if (type === 'start') { osc.type = 'sine'; osc.frequency.setValueAtTime(262, audioCtx.currentTime); osc.frequency.setValueAtTime(330, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(392, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); }
  else if (type === 'gameover') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8); }
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

// Game constants
const TILE = 40;
const MAP_W = 16;
const MAP_H = 12;
const OFFX = 0, OFFY = 40;

let gameState = 'start'; // start, playing, gameover, win
let player = null;
let enemies = [];
let items = [];
let map = [];
let particles = [];
let floatTexts = [];
let screenShake = { x: 0, y: 0, intensity: 0 };
let currentFloor = 1;
let score = 0;
let turnCount = 0;
let animTimer = 0;
let playerAnim = { x: 0, y: 0 };
let enemyAnims = {};
let attackAnim = null;

function genMap(floor) {
  map = [];
  for (let y = 0; y < MAP_H; y++) {
    map[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      if (x === 0 || y === 0 || x === MAP_W-1 || y === MAP_H-1) map[y][x] = 1; // wall
      else if (Math.random() < 0.25) map[y][x] = 1;
      else map[y][x] = 0;
    }
  }
  // Ensure start area is clear
  for (let y = MAP_H-3; y < MAP_H-1; y++) for (let x = 2; x < 5; x++) if (map[y] && map[y][x] !== undefined) map[y][x] = 0;
}

function genFloor(floor) {
  genMap(floor);
  player.x = 3; player.y = MAP_H - 2;
  playerAnim.x = 0; playerAnim.y = 0;
  enemies = [];
  items = [];
  
  const numEnemies = 3 + floor;
  const types = ['slime', 'goblin', 'skeleton'];
  for (let i = 0; i < numEnemies; i++) {
    let ex, ey, tries = 0;
    do {
      ex = 2 + Math.floor(Math.random() * (MAP_W - 4));
      ey = 2 + Math.floor(Math.random() * (MAP_H - 4));
      tries++;
    } while ((map[ey][ex] === 1 || Math.abs(ex - player.x) + Math.abs(ey - player.y) < 5) && tries < 100);
    
    let type = types[Math.floor(Math.random() * Math.min(types.length, 1 + Math.floor(floor / 2)))];
    if (floor > 3) type = types[2];
    
    const eTypes = {
      slime: { hp: 20 + floor * 5, atk: 5 + floor, name: 'Slime', color: '#4a9e4a' },
      goblin: { hp: 35 + floor * 8, atk: 8 + floor * 2, name: 'Goblin', color: '#c07830' },
      skeleton: { hp: 50 + floor * 10, atk: 12 + floor * 2, name: 'Skeleton', color: '#a0a0b0' }
    };
    const t = eTypes[type];
    enemies.push({ x: ex, y: ey, type, hp: t.hp, maxHp: t.hp, atk: t.atk, name: t.name, color: t.color, animX: 0, animY: 0 });
  }
  
  // Items
  const numItems = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < numItems; i++) {
    let ix, iy, tries = 0;
    do {
      ix = 2 + Math.floor(Math.random() * (MAP_W - 4));
      iy = 2 + Math.floor(Math.random() * (MAP_H - 4));
      tries++;
    } while ((map[iy][ix] === 1 || enemies.some(e => e.x === ix && e.y === iy)) && tries < 100);
    items.push({ x: ix, y: iy, type: 'potion', amount: 20 + floor * 5 });
  }
  
  // Stairs (always place)
  let sx, sy, tries = 0;
  do {
    sx = MAP_W - 3;
    sy = 2 + Math.floor(Math.random() * 3);
    while (map[sy][sx] === 1) sx -= 1;
    tries++;
  } while (tries < 50);
  map[sy][sx] = 2; // stairs tile
}

function initGame() {
  currentFloor = 1;
  score = 0;
  turnCount = 0;
  player = { x: 3, y: MAP_H - 2, hp: 100, maxHp: 100, atk: 15 };
  particles = [];
  floatTexts = [];
  attackAnim = null;
  genFloor(1);
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({ x: x * TILE + TILE/2, y: y * TILE + TILE/2, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, color, size: 3 + Math.random() * 3 });
  }
}

function addFloatText(x, y, text, color) {
  floatTexts.push({ x: x * TILE + TILE/2, y: y * TILE, text, color, life: 1 });
}

function canMove(x, y) {
  if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return false;
  return map[y][x] === 0 || map[y][x] === 2;
}

function enemyAt(x, y) { return enemies.find(e => e.x === x && e.y === y); }

function playerMove(dx, dy) {
  const nx = player.x + dx;
  const ny = player.y + dy;
  const e = enemyAt(nx, ny);
  if (e) {
    // Attack
    playSound('hit');
    screenShake.intensity = 4;
    const dmg = player.atk + Math.floor(Math.random() * 5);
    e.hp -= dmg;
    addFloatText(nx, ny, '-' + dmg, '#ff6666');
    spawnParticles(nx, ny, e.color, 8);
    attackAnim = { type: 'player', x: player.x, y: player.y, dx, dy, timer: 0 };
    if (e.hp <= 0) {
      playSound('kill');
      score += e.type === 'slime' ? 10 : e.type === 'goblin' ? 25 : 50;
      addFloatText(nx, ny, e.name + ' slain!', '#ffdd44');
      spawnParticles(nx, ny, e.color, 15);
      enemies = enemies.filter(en => en !== e);
    }
    endTurn();
    return;
  }
  if (canMove(nx, ny)) {
    player.x = nx;
    player.y = ny;
    playerAnim.x = dx * TILE;
    playerAnim.y = dy * TILE;
    
    // Check items
    const item = items.find(it => it.x === nx && it.y === ny);
    if (item) {
      playSound('heal');
      player.hp = Math.min(player.maxHp, player.hp + item.amount);
      addFloatText(nx, ny, '+' + item.amount + ' HP', '#44ff88');
      spawnParticles(nx, ny, '#44ff88', 10);
      items = items.filter(it => it !== item);
    }
    
    // Check stairs
    if (map[ny][nx] === 2) {
      playSound('stairs');
      currentFloor++;
      score += 50;
      addFloatText(nx, ny, 'Floor ' + currentFloor + '!', '#ffcc44');
      genFloor(currentFloor);
      if (currentFloor > 5) { gameState = 'win'; playSound('gameover'); }
    }
    endTurn();
  }
}

function endTurn() {
  turnCount++;
  // Enemy turns
  for (let e of enemies) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.abs(dx) + Math.abs(dy);
    
    if (dist === 1) {
      // Attack player
      playSound('playerhit');
      screenShake.intensity = 6;
      const dmg = e.atk + Math.floor(Math.random() * 3);
      player.hp -= dmg;
      addFloatText(player.x, player.y, '-' + dmg, '#ff4444');
      spawnParticles(player.x, player.y, '#ff4444', 6);
      if (player.hp <= 0) {
        player.hp = 0;
        gameState = 'gameover';
        playSound('gameover');
      }
    } else if (dist > 1) {
      // Move toward player
      let mx = 0, my = 0;
      if (Math.abs(dx) > Math.abs(dy)) { mx = dx > 0 ? 1 : -1; }
      else { my = dy > 0 ? 1 : -1; }
      
      // Try to move
      const nx = e.x + mx, ny = e.y + my;
      if (canMove(nx, ny) && !enemyAt(nx, ny)) {
        e.animX = mx * TILE;
        e.animY = my * TILE;
        e.x = nx; e.y = ny;
      } else {
        // Try alternate direction
        if (mx !== 0) { 
          const ax = e.x + 0, ay = e.y + (dy > 0 ? 1 : -1);
          if (canMove(ax, ay) && !enemyAt(ax, ay)) { e.animX = 0; e.animY = (dy > 0 ? 1 : -1) * TILE; e.x = ax; e.y = ay; }
        } else {
          const ax = e.x + (dx > 0 ? 1 : -1), ay = e.y + 0;
          if (canMove(ax, ay) && !enemyAt(ax, ay)) { e.animX = (dx > 0 ? 1 : -1) * TILE; e.animY = 0; e.x = ax; e.y = ay; }
        }
      }
    }
  }
}

// Input
let keys = {};
window.addEventListener('keydown', (e) => {
  if (gameState === 'start') {
    initAudio();
    gameState = 'playing';
    playSound('start');
    initGame();
    return;
  }
  if (gameState === 'gameover' || gameState === 'win') {
    if (e.key === 'Enter' || e.key === ' ') {
      gameState = 'playing';
      initGame();
      playSound('start');
    }
    return;
  }
  if (gameState !== 'playing') return;
  
  let dx = 0, dy = 0;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dy = -1;
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dy = 1;
  else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dx = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dx = 1;
  
  if (dx !== 0 || dy !== 0) {
    playerMove(dx, dy);
  }
});

// Rendering
function drawTile(x, y, color, alpha) {
  ctx.globalAlpha = alpha || 1;
  ctx.fillStyle = color;
  ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
}

function render() {
  ctx.save();
  ctx.scale(SCALE, SCALE);
  
  // Screen shake
  if (screenShake.intensity > 0) {
    screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.intensity *= 0.85;
    if (screenShake.intensity < 0.3) screenShake.intensity = 0;
  }
  ctx.translate(screenShake.x, screenShake.y);
  
  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(-10, -10, 660, 500);
  
  if (gameState === 'start') {
    drawStartScreen();
  } else if (gameState === 'playing' || gameState === 'gameover' || gameState === 'win') {
    drawGame();
  }
  
  ctx.restore();
}

function drawStartScreen() {
  const t = Date.now() / 1000;
  
  // Title
  ctx.fillStyle = '#ffcc44';
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('DUNGEON DELVER', 320, 100 + Math.sin(t * 2) * 5);
  
  ctx.fillStyle = '#aabbcc';
  ctx.font = '16px monospace';
  ctx.fillText('A Top-Down Turn-Based RPG', 320, 140);
  
  // Controls box
  ctx.strokeStyle = '#445566';
  ctx.lineWidth = 2;
  ctx.strokeRect(120, 170, 400, 200);
  
  ctx.fillStyle = '#ccddee';
  ctx.font = '14px monospace';
  const lines = [
    'WASD / Arrow Keys - Move',
    'Walk into enemies to attack',
    '',
    'Collect potions for healing',
    'Find stairs (blue) to advance',
    'Clear 5 floors to win!',
    '',
    'Enemies: Slimes, Goblins, Skeletons'
  ];
  lines.forEach((l, i) => ctx.fillText(l, 320, 195 + i * 24));
  
  // Start prompt
  ctx.fillStyle = `rgba(255, 204, 68, ${0.5 + Math.sin(t * 3) * 0.5})`;
  ctx.font = 'bold 20px monospace';
  ctx.fillText('Press any key to start', 320, 410);
  
  // Decorative enemies
  drawEnemySprite(80, 440, '#4a9e4a', t);
  drawEnemySprite(560, 440, '#c07830', t + 1);
}

function drawEnemySprite(x, y, color, t) {
  ctx.fillStyle = color;
  const bob = Math.sin(t * 3) * 2;
  ctx.beginPath();
  ctx.arc(x, y + bob, 12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 5, y + bob - 4, 3, 3);
  ctx.fillRect(x + 2, y + bob - 4, 3, 3);
}

function drawGame() {
  // Draw map
  for (let y = 0; y < MAP_H; y++) {
    for (let x = 0; x < MAP_W; x++) {
      if (map[y][x] === 1) {
        ctx.fillStyle = '#3a3a4e';
        ctx.fillRect(x * TILE, OFFY + y * TILE, TILE, TILE);
        ctx.fillStyle = '#2a2a3e';
        ctx.fillRect(x * TILE + 2, OFFY + y * TILE + 2, TILE - 4, TILE - 4);
      } else if (map[y][x] === 2) {
        ctx.fillStyle = '#2a2a3e';
        ctx.fillRect(x * TILE, OFFY + y * TILE, TILE, TILE);
        // Stairs indicator
        const t = Date.now() / 500;
        ctx.fillStyle = `rgba(68, 136, 255, ${0.5 + Math.sin(t) * 0.3})`;
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('▼', x * TILE + TILE/2, OFFY + y * TILE + TILE/2 + 8);
      } else {
        // Floor tile with subtle variation
        const shade = (x + y) % 2 === 0 ? '#2a2a3e' : '#252538';
        ctx.fillStyle = shade;
        ctx.fillRect(x * TILE, OFFY + y * TILE, TILE, TILE);
      }
    }
  }
  
  // Grid lines (subtle)
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= MAP_W; x++) { ctx.beginPath(); ctx.moveTo(x * TILE, OFFY); ctx.lineTo(x * TILE, OFFY + MAP_H * TILE); ctx.stroke(); }
  for (let y = 0; y <= MAP_H; y++) { ctx.beginPath(); ctx.moveTo(0, OFFY + y * TILE); ctx.lineTo(MAP_W * TILE, OFFY + y * TILE); ctx.stroke(); }
  
  // Items
  for (let it of items) {
    const bob = Math.sin(Date.now() / 400 + it.x) * 3;
    ctx.fillStyle = '#ff66aa';
    ctx.beginPath();
    ctx.arc(it.x * TILE + TILE/2, OFFY + it.y * TILE + TILE/2 + bob, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+', it.x * TILE + TILE/2, OFFY + it.y * TILE + TILE/2 + bob + 4);
  }
  
  // Enemies
  for (let e of enemies) {
    const t = Date.now() / 500;
    const bob = Math.sin(t + e.x * 2) * 2;
    const ex = e.x * TILE + TILE/2 + e.animX * 0.1;
    const ey = OFFY + e.y * TILE + TILE/2 + bob + e.animY * 0.1;
    
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(ex, ey + 12, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Body
    ctx.fillStyle = e.color;
    if (e.type === 'skeleton') {
      ctx.fillRect(ex - 8, ey - 10, 16, 20);
      ctx.fillStyle = '#fff';
      ctx.fillRect(ex - 4, ey - 6, 3, 3);
      ctx.fillRect(ex + 1, ey - 6, 3, 3);
      ctx.fillStyle = e.color;
      ctx.fillRect(ex - 6, ey + 2, 12, 3);
    } else if (e.type === 'goblin') {
      ctx.beginPath();
      ctx.arc(ex, ey, 12, 0, Math.PI * 2);
      ctx.fill();
      // Ears
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(ex - 12, ey - 5); ctx.lineTo(ex - 18, ey - 12); ctx.lineTo(ex - 8, ey - 8);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(ex + 12, ey - 5); ctx.lineTo(ex + 18, ey - 12); ctx.lineTo(ex + 8, ey - 8);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#ff0';
      ctx.fillRect(ex - 5, ey - 3, 4, 4);
      ctx.fillRect(ex + 2, ey - 3, 4, 4);
    } else {
      // Slime - squishy
      const squish = 1 + Math.sin(t * 2) * 0.1;
      ctx.beginPath();
      ctx.ellipse(ex, ey, 12 * squish, 10 / squish, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2a6e2a';
      ctx.fillRect(ex - 4, ey - 3, 3, 3);
      ctx.fillRect(ex + 2, ey - 3, 3, 3);
    }
    
    // HP bar
    if (e.hp < e.maxHp) {
      const bw = 24;
      ctx.fillStyle = '#333';
      ctx.fillRect(ex - bw/2, ey - 18, bw, 4);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(ex - bw/2, ey - 18, bw * (e.hp / e.maxHp), 4);
    }
  }
  
  // Player
  const px = player.x * TILE + TILE/2;
  const py = OFFY + player.y * TILE + TILE/2;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py + 14, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Body (knight)
  ctx.fillStyle = '#6688cc';
  ctx.fillRect(px - 10, py - 12, 20, 24);
  // Head
  ctx.fillStyle = '#ffcc99';
  ctx.fillRect(px - 7, py - 20, 14, 12);
  // Helmet
  ctx.fillStyle = '#8899bb';
  ctx.fillRect(px - 8, py - 22, 16, 6);
  // Eyes
  ctx.fillStyle = '#222';
  ctx.fillRect(px - 4, py - 16, 3, 3);
  ctx.fillRect(px + 2, py - 16, 3, 3);
  
  // Attack animation
  if (attackAnim) {
    attackAnim.timer += 0.1;
    const p = Math.min(attackAnim.timer / 0.5, 1);
    if (p >= 1) attackAnim = null;
  }
  
  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.03;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, OFFY + p.y - p.size/2, p.size, p.size);
    ctx.globalAlpha = 1;
  }
  
  // Float texts
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y -= 0.8;
    ft.life -= 0.02;
    if (ft.life <= 0) { floatTexts.splice(i, 1); continue; }
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, OFFY + ft.y);
    ctx.globalAlpha = 1;
  }
  
  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, 640, OFFY);
  
  // HP bar
  ctx.fillStyle = '#333';
  ctx.fillRect(10, 12, 150, 16);
  const hpPct = player.hp / player.maxHp;
  ctx.fillStyle = hpPct > 0.5 ? '#44cc44' : hpPct > 0.25 ? '#cccc44' : '#cc4444';
  ctx.fillRect(10, 12, 150 * hpPct, 16);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.strokeRect(10, 12, 150, 16);
  ctx.fillStyle = '#fff';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`HP: ${player.hp}/${player.maxHp}`, 14, 24);
  
  // Floor & Score
  ctx.fillStyle = '#ffcc44';
  ctx.font = 'bold 14px monospace';
  ctx.fillText(`Floor: ${currentFloor}/5`, 180, 24);
  ctx.fillStyle = '#aaddff';
  ctx.fillText(`Score: ${score}`, 310, 24);
  ctx.fillStyle = '#888';
  ctx.font = '11px monospace';
  ctx.fillText(`Turn: ${turnCount}`, 420, 24);
  
  // Turn indicator
  const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
  ctx.fillStyle = `rgba(100, 255, 100, ${pulse})`;
  ctx.font = '12px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('YOUR TURN', 630, 24);
  
  // Game Over / Win overlay
  if (gameState === 'gameover' || gameState === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, 640, 480);
    
    ctx.textAlign = 'center';
    if (gameState === 'gameover') {
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 36px monospace';
      ctx.fillText('YOU DIED', 320, 180);
    } else {
      ctx.fillStyle = '#ffdd44';
      ctx.font = 'bold 36px monospace';
      ctx.fillText('VICTORY!', 320, 180);
    }
    
    ctx.fillStyle = '#aabbcc';
    ctx.font = '16px monospace';
    ctx.fillText(`Final Score: ${score}`, 320, 230);
    ctx.fillText(`Floors Cleared: ${gameState === 'win' ? 5 : currentFloor - 1}`, 320, 255);
    ctx.fillText(`Turns Taken: ${turnCount}`, 320, 280);
    
    const t = Date.now() / 800;
    ctx.fillStyle = `rgba(255, 204, 68, ${0.5 + Math.sin(t) * 0.5})`;
    ctx.font = '18px monospace';
    ctx.fillText('Press Enter to play again', 320, 350);
  }
}

let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 16.67, 3);
  lastTime = time;
  
  // Decay animations
  playerAnim.x *= 0.85;
  playerAnim.y *= 0.85;
  for (let e of enemies) { e.animX *= 0.85; e.animY *= 0.85; }
  
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
