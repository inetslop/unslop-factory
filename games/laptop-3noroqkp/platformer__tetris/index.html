<!DOCTYPE html>
<html>
<head>
<title>Tetris Platformer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0f0f23; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cellSize, gridX, gridY;
const COLS = 10, ROWS = 20;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    cellSize = Math.min(Math.floor(W * 0.6 / COLS), Math.floor(H * 0.85 / ROWS));
    gridX = Math.floor((W - COLS * cellSize) / 2);
    gridY = Math.floor((H - ROWS * cellSize) / 2);
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, dur, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
}
function sfxJump() { playSound(400, 0.15, 'sine', 0.15); }
function sfxLand() { playSound(200, 0.1, 'triangle', 0.1); }
function sfxClear() { playSound(600, 0.3, 'square', 0.12); setTimeout(() => playSound(800, 0.3, 'square', 0.1), 100); }
function sfxGameOver() { playSound(150, 0.5, 'sawtooth', 0.15); }
function sfxLock() { playSound(300, 0.08, 'triangle', 0.08); }

// Game state
let gameState = 'start'; // start, playing, gameover
let score = 0;
let highScore = 0;
let linesCleared = 0;
let survivalTime = 0;
let difficulty = 0;
let fallSpeed = 800;
let lastPieceTime = 0;

try {
    highScore = parseInt(localStorage.getItem('tetrisPlatformerHigh') || '0');
} catch(e) {}

// Grid
let grid = [];
function resetGrid() {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
}

// Tetrominoes
const SHAPES = [
    [[1,1,1,1]], // I
    [[1,1],[1,1]], // O
    [[0,1,0],[1,1,1]], // T
    [[1,0,1],[0,1,1]], // S
    [[0,1,1],[1,1,0]], // Z
    [[1,1,0],[0,1,1]], // J
    [[1,1,0],[1,1,0]]  // L - wait let me fix
];

const TETROMINOES = [
    { shape: [[1,1,1,1]], color: '#00d4ff' }, // I
    { shape: [[1,1],[1,1]], color: '#ffe000' }, // O
    { shape: [[0,1,0],[1,1,1]], color: '#a855f7' }, // T
    { shape: [[1,1,0],[0,1,1]], color: '#22c55e' }, // S
    { shape: [[0,1,1],[1,1,0]], color: '#ef4444' }, // Z
    { shape: [[1,0,0],[1,1,1]], color: '#3b82f6' }, // J
    { shape: [[0,0,1],[1,1,1]], color: '#f97316' }  // L
];

let currentPiece = null;
let nextPiece = null;
let pieceTimer = 0;

function randomPiece() {
    const t = TETROMINOES[Math.floor(Math.random() * TETROMINOES.length)];
    return {
        shape: t.shape.map(r => [...r]),
        color: t.color,
        x: Math.floor((COLS - t.shape[0].length) / 2),
        y: 0,
        vy: 1 // cells per tick
    };
}

function canPlace(piece, px, py) {
    for (let r = 0; r < piece.shape.length; r++) {
        for (let c = 0; c < piece.shape[r].length; c++) {
            if (piece.shape[r][c]) {
                const nx = px + c;
                const ny = py + r;
                if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
                if (ny >= 0 && grid[ny][nx]) return false;
            }
        }
    }
    return true;
}

function lockPiece() {
    for (let r = 0; r < currentPiece.shape.length; r++) {
        for (let c = 0; c < currentPiece.shape[r].length; c++) {
            if (currentPiece.shape[r][c]) {
                const gy = currentPiece.y + r;
                const gx = currentPiece.x + c;
                if (gy >= 0 && gy < ROWS && gx >= 0 && gx < COLS) {
                    grid[gy][gx] = 1;
                }
            }
        }
    }
    sfxLock();
    checkLines();
    currentPiece = null;
}

function checkLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(cell => cell === 1)) {
            grid.splice(r, 1);
            grid.unshift(Array(COLS).fill(0));
            cleared++;
            // Adjust player position
            if (player.y < r * cellSize) {
                player.y -= cellSize;
            }
        }
    }
    if (cleared > 0) {
        linesCleared += cleared;
        score += cleared * cleared * 100;
        sfxClear();
        spawnClearParticles(cleared);
    }
}

// Particles
let particles = [];
function spawnClearParticles(lines) {
    for (let i = 0; i < lines * 15; i++) {
        const x = gridX + Math.random() * COLS * cellSize;
        const y = gridY + (ROWS - 1) * cellSize + Math.random() * cellSize;
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 200,
            vy: -Math.random() * 300 - 100,
            life: 1,
            color: `hsl(${Math.random()*60+180}, 80%, 60%)`
        });
    }
}

// Player
let player = {
    x: 0, y: 0, vx: 0, vy: 0,
    w: 0, h: 0,
    grounded: false,
    facing: 1,
    runFrame: 0
};

function resetPlayer() {
    player.x = gridX + (COLS * cellSize) / 2 - 8;
    player.y = gridY + ROWS * cellSize - cellSize;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.facing = 1;
    player.w = Math.max(12, cellSize * 0.35);
    player.h = Math.max(14, cellSize * 0.45);
}

const GRAVITY = 800;
const JUMP_VEL = -350;
const MOVE_SPEED = 200;
const FRICTION = 0.85;

// Input
let keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameState === 'start' && (e.code === 'Space' || e.code === 'Enter')) {
        initAudio();
        startGame();
    } else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR')) {
        startGame();
    }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function startGame() {
    resetGrid();
    score = 0;
    linesCleared = 0;
    survivalTime = 0;
    difficulty = 0;
    fallSpeed = 1200;
    lastPieceTime = 0;
    particles = [];
    resetPlayer();
    currentPiece = randomPiece();
    nextPiece = randomPiece();
    gameState = 'playing';
}

// Game loop
let lastTime = 0;
function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    if (gameState === 'playing') {
        update(dt);
    }
    render();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    survivalTime += dt;
    difficulty = Math.floor(survivalTime / 10);
    fallSpeed = Math.max(300, 1200 - difficulty * 80);

    // Player physics
    if (keys['ArrowLeft'] || keys['KeyA']) {
        player.vx = -MOVE_SPEED;
        player.facing = -1;
    } else if (keys['ArrowRight'] || keys['KeyD']) {
        player.vx = MOVE_SPEED;
        player.facing = 1;
    } else {
        player.vx *= FRICTION;
        if (Math.abs(player.vx) < 5) player.vx = 0;
    }

    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
        player.vy = JUMP_VEL;
        player.grounded = false;
        sfxJump();
    }

    player.vy += GRAVITY * dt;
    if (player.vy > 600) player.vy = 600;

    // Move X
    player.x += player.vx * dt;
    // Clamp to grid bounds
    const minX = gridX;
    const maxX = gridX + COLS * cellSize - player.w;
    if (player.x < minX) { player.x = minX; player.vx = 0; }
    if (player.x > maxX) { player.x = maxX; player.vx = 0; }

    // Move Y
    const oldY = player.y;
    player.y += player.vy * dt;

    // Collision with blocks
    player.grounded = false;
    if (player.vy >= 0) {
        const feetY = player.y + player.h;
        const colLeft = Math.floor((player.x - gridX) / cellSize);
        const colRight = Math.floor(((player.x + player.w) - gridX) / cellSize);
        const rowAtFeet = Math.floor(feetY / cellSize);

        for (let c = colLeft; c <= colRight; c++) {
            if (c < 0 || c >= COLS) continue;
            if (rowAtFeet >= 0 && rowAtFeet < ROWS) {
                // Check if block is below feet
                const blockTop = rowAtFeet * cellSize + gridY;
                if (grid[rowAtFeet][c] && player.y + player.h >= blockTop && oldY + player.h <= blockTop + cellSize * 0.5) {
                    player.y = blockTop - player.h;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        }

        // Ground (bottom of grid)
        const groundY = gridY + ROWS * cellSize - player.h;
        if (player.y > groundY) {
            player.y = groundY;
            player.vy = 0;
            player.grounded = true;
        }
    }

    // Check if player fell off
    if (player.y > gridY + ROWS * cellSize + cellSize) {
        gameOver();
        return;
    }

    // Check if player is trapped/crushed by block above
    const pCol = Math.floor((player.x + player.w / 2 - gridX) / cellSize);
    const pRow = Math.floor((player.y + player.h / 2) / cellSize);
    if (pCol >= 0 && pCol < COLS && pRow >= 0 && pRow < ROWS && grid[pRow][pCol]) {
        // Crushed!
        gameOver();
        return;
    }

    // Run animation
    if (Math.abs(player.vx) > 20) {
        player.runFrame += dt * 10;
    } else {
        player.runFrame = 0;
    }

    // Score for survival
    score += Math.floor(dt * 10);

    // Tetromino falling
    lastPieceTime += dt * 1000;
    if (lastPieceTime >= fallSpeed && currentPiece) {
        lastPieceTime = 0;
        const ny = currentPiece.y + 1;
        if (canPlace(currentPiece, currentPiece.x, ny)) {
            currentPiece.y++;
        } else {
            lockPiece();
            currentPiece = nextPiece;
            nextPiece = randomPiece();
            // Check if new piece can't spawn
            if (!canPlace(currentPiece, currentPiece.x, 0)) {
                gameOver();
                return;
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 400 * dt;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function gameOver() {
    gameState = 'gameover';
    sfxGameOver();
    if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('tetrisPlatformerHigh', highScore.toString()); } catch(e) {}
    }
}

// Rendering
function render() {
    ctx.fillStyle = '#0f0f23';
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'start') {
        renderStartScreen();
        return;
    }

    // Grid background
    ctx.fillStyle = '#1a1a3e';
    ctx.fillRect(gridX, gridY, COLS * cellSize, ROWS * cellSize);

    // Grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(gridX + c * cellSize, gridY);
        ctx.lineTo(gridX + c * cellSize, gridY + ROWS * cellSize);
        ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(gridX, gridY + r * cellSize);
        ctx.lineTo(gridX + COLS * cellSize, gridY + r * cellSize);
        ctx.stroke();
    }

    // Blocks in grid
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c]) {
                drawBlock(gridX + c * cellSize, gridY + r * cellSize, cellSize, '#5b6abf');
            }
        }
    }

    // Current piece
    if (currentPiece) {
        for (let r = 0; r < currentPiece.shape.length; r++) {
            for (let c = 0; c < currentPiece.shape[r].length; c++) {
                if (currentPiece.shape[r][c]) {
                    const px = gridX + (currentPiece.x + c) * cellSize;
                    const py = gridY + (currentPiece.y + r) * cellSize;
                    drawBlock(px, py, cellSize, currentPiece.color);
                }
            }
        }
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    // Player
    drawPlayer();

    // HUD
    renderHUD();

    if (gameState === 'gameover') {
        renderGameOver();
    }
}

function drawBlock(x, y, size, color) {
    const inset = Math.max(2, size * 0.05);
    ctx.fillStyle = color;
    ctx.fillRect(x + inset, y + inset, size - inset * 2, size - inset * 2);
    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillRect(x + inset, y + inset, size - inset * 2, (size - inset * 2) * 0.15);
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + inset, y + size - inset * 2, size - inset * 2, (size - inset * 2) * 0.15);
}

function drawPlayer() {
    const px = player.x;
    const py = player.y;
    const pw = player.w;
    const ph = player.h;

    // Body
    ctx.fillStyle = '#ff6b35';
    ctx.fillRect(px, py + ph * 0.3, pw, ph * 0.7);

    // Head
    ctx.fillStyle = '#ffd194';
    const headSize = pw * 0.8;
    const headX = px + (pw - headSize) / 2;
    ctx.fillRect(headX, py, headSize, ph * 0.35);

    // Eyes
    ctx.fillStyle = '#1a1a2e';
    const eyeW = Math.max(2, pw * 0.12);
    const eyeH = Math.max(3, ph * 0.1);
    if (player.facing === 1) {
        ctx.fillRect(px + pw * 0.5, py + ph * 0.1, eyeW, eyeH);
        ctx.fillRect(px + pw * 0.75, py + ph * 0.1, eyeW, eyeH);
    } else {
        ctx.fillRect(px + pw * 0.25, py + ph * 0.1, eyeW, eyeH);
        ctx.fillRect(px + pw * 0.5, py + ph * 0.1, eyeW, eyeH);
    }

    // Legs (animated)
    if (Math.abs(player.vx) > 20 && player.grounded) {
        const legOffset = Math.sin(player.runFrame * 3) * ph * 0.1;
        ctx.fillStyle = '#cc4a1d';
        ctx.fillRect(px + pw * 0.1, py + ph * 0.85, pw * 0.25, ph * 0.15 + legOffset);
        ctx.fillRect(px + pw * 0.65, py + ph * 0.85, pw * 0.25, ph * 0.15 - legOffset);
    } else if (!player.grounded) {
        // Tucked legs when jumping
        ctx.fillStyle = '#cc4a1d';
        ctx.fillRect(px + pw * 0.1, py + ph * 0.8, pw * 0.25, ph * 0.1);
        ctx.fillRect(px + pw * 0.65, py + ph * 0.8, pw * 0.25, ph * 0.1);
    }
}

function renderHUD() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const hudH = 40;
    ctx.fillRect(gridX, gridY - hudH - 10, COLS * cellSize, hudH);

    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.min(16, cellSize * 0.5)}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, gridX + 10, gridY - hudH + 20);
    ctx.textAlign = 'right';
    ctx.fillText(`BEST: ${highScore}`, gridX + COLS * cellSize - 10, gridY - hudH + 20);

    ctx.textAlign = 'center';
    ctx.font = `${Math.min(13, cellSize * 0.4)}px monospace`;
    ctx.fillStyle = '#aaa';
    ctx.fillText(`LINES: ${linesCleared}  |  TIME: ${Math.floor(survivalTime)}s`, gridX + (COLS * cellSize) / 2, gridY - hudH + 20);

    // Next piece preview
    if (nextPiece) {
        const prevX = gridX + COLS * cellSize + 15;
        const prevY = gridY + 10;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(prevX - 5, prevY - 5, cellSize * 2, cellSize * 1.5);
        for (let r = 0; r < nextPiece.shape.length; r++) {
            for (let c = 0; c < nextPiece.shape[r].length; c++) {
                if (nextPiece.shape[r][c]) {
                    const px = prevX + c * cellSize * 0.5;
                    const py = prevY + r * cellSize * 0.5;
                    drawBlock(px, py, cellSize * 0.45, nextPiece.color);
                }
            }
        }
    }
}

function renderStartScreen() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Title
    const titleSize = Math.min(W * 0.08, 60);
    ctx.font = `bold ${titleSize}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b35';
    ctx.fillText('TETRIS', W / 2, H * 0.3);
    ctx.fillStyle = '#00d4ff';
    ctx.fillText('PLATFORMER', W / 2, H * 0.3 + titleSize);

    // Animated blocks in background
    const t = performance.now() / 1000;
    for (let i = 0; i < 8; i++) {
        const bx = (W * (i + 1)) / 9;
        const by = H * 0.5 + Math.sin(t + i) * 20;
        const size = Math.min(W, H) * 0.04;
        drawBlock(bx - size/2, by - size/2, size, TETROMINOES[i % 7].color);
    }

    // Controls
    ctx.font = `${Math.min(16, W * 0.03)}px monospace`;
    ctx.fillStyle = '#ccc';
    const lines = [
        '← → / A D  -  Move',
        '↑ / W / SPACE  -  Jump',
        '',
        'Survive as blocks stack up!',
        'Clear lines. Don\'t get trapped or crushed.',
        '',
        `HIGH SCORE: ${highScore}`,
        '',
        '[ PRESS SPACE TO START ]'
    ];
    const startY = H * 0.55;
    lines.forEach((line, i) => {
        ctx.fillStyle = i === lines.length - 1 ? '#fff' : (i < 3 ? '#aaa' : '#888');
        if (i === lines.length - 1 && Math.sin(t * 4) > 0) ctx.fillStyle = '#fff';
        ctx.fillText(line, W / 2, startY + i * 24);
    });
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);

    const t = performance.now() / 1000;
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.min(W * 0.06, 48)}px monospace`;
    ctx.fillStyle = '#ef4444';
    ctx.fillText('GAME OVER', W / 2, H * 0.35);

    ctx.font = `${Math.min(20, W * 0.035)}px monospace`;
    ctx.fillStyle = '#fff';
    ctx.fillText(`Score: ${score}`, W / 2, H * 0.45);
    ctx.fillText(`Lines Cleared: ${linesCleared}`, W / 2, H * 0.5);
    ctx.fillText(`Survived: ${Math.floor(survivalTime)}s`, W / 2, H * 0.55);

    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#ffe000';
        ctx.fillText('★ NEW HIGH SCORE! ★', W / 2, H * 0.62);
    }

    ctx.fillStyle = Math.sin(t * 4) > 0 ? '#fff' : '#888';
    ctx.font = `${Math.min(16, W * 0.03)}px monospace`;
    ctx.fillText('[ PRESS SPACE TO RESTART ]', W / 2, H * 0.75);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
