<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Endless Space Invaders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;width:100vw;height:100vh}
canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;

function resize(){
W=window.innerWidth;H=window.innerHeight;
canvas.width=W;canvas.height=H;
}
resize();
window.addEventListener('resize',resize);

// Audio
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playLaser(){
if(!audioCtx)return;
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();
o.type='square';
o.frequency.setValueAtTime(880,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(220,audioCtx.currentTime+0.1);
g.gain.setValueAtTime(0.15,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.1);
}
function playExplosion(){
if(!audioCtx)return;
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(200,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(50,audioCtx.currentTime+0.3);
g.gain.setValueAtTime(0.2,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.3);
}
function playPlayerDeath(){
if(!audioCtx)return;
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();
o.type='sawtooth';
o.frequency.setValueAtTime(400,audioCtx.currentTime);
o.frequency.exponentialRampToValueAtTime(30,audioCtx.currentTime+0.8);
g.gain.setValueAtTime(0.3,audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.8);
o.connect(g);g.connect(audioCtx.destination);
o.start();o.stop(audioCtx.currentTime+0.8);
}

// Game state
let state='start'; // start, playing, gameover
let score=0,wave=1,lives=3;
let highScore=0;
try{highScore=parseInt(localStorage.getItem('esi_high')||'0')}catch(e){}

// Stars
let stars=[];
function initStars(){
stars=[];
for(let i=0;i<150;i++){
stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5,sp:Math.random()*0.5+0.1});
}
}
initStars();

// Player
let player={x:0,y:0,w:40,h:20,speed:7};
let bullets=[];
let alienBullets=[];
let aliens=[];
let particles=[];
let shootCooldown=0;
let alienDir=1;
let alienSpeed=1.5;
let alienDescendTimer=0;
let frameCount=0;

// Keys
let keys={};
window.addEventListener('keydown',function(e){
keys[e.code]=true;
if(state==='start'&&(e.code==='Space'||e.code==='Enter')){
initAudio();
startGame();
}
if(state==='gameover'&&(e.code==='KeyR'||e.code==='Space'||e.code==='Enter')){
restartGame();
}
});
window.addEventListener('keyup',function(e){keys[e.code]=false});

function startGame(){
state='playing';
score=0;wave=1;lives=3;
bullets=[];alienBullets=[];particles=[];
initWave();
player.x=W/2-player.w/2;
player.y=H-60;
}

function restartGame(){
startGame();
}

function initWave(){
aliens=[];
const cols=Math.min(8+Math.floor(wave/3),12);
const rows=Math.min(4+Math.floor(wave/2),7);
const alienW=30,alienH=24;
const spacingX=Math.max(45,W/(cols+2));
const spacingY=Math.max(35,H/(rows+4));
const startX=(W-cols*spacingX)/2+spacingX/2;
const startY=80;

for(let r=0;r<rows;r++){
for(let c=0;c<cols;c++){
let type=r%3;
if(wave>5)type=(r+c)%4;
aliens.push({
x:startX+c*spacingX,
y:startY+r*spacingY,
w:alienW,h:alienH,
alive:true,
type:type,
points:(rows-r)*10+wave*2
});
}
}
alienDir=1;
alienSpeed=Math.min(1.5+wave*0.3,6);
}

function spawnParticles(x,y,color,count){
for(let i=0;i<count;i++){
const a=Math.random()*Math.PI*2;
const sp=Math.random()*4+1;
particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:30+Math.random()*20,color:color,size:Math.random()*4+1});
}
}

function update(){
frameCount++;
// Stars
for(let s of stars){
s.y+=s.sp;
if(s.y>H){s.y=0;s.x=Math.random()*W;}
}

if(state!=='playing')return;

// Player movement
if(keys['ArrowLeft']||keys['KeyA'])player.x-=player.speed;
if(keys['ArrowRight']||keys['KeyD'])player.x+=player.speed;
player.x=Math.max(0,Math.min(W-player.w,player.x));

// Shooting
if(shootCooldown>0)shootCooldown--;
if((keys['Space']||keys['KeyZ'])&&shootCooldown<=0){
bullets.push({x:player.x+player.w/2-2,y:player.y,w:4,h:12,vy:-10});
shootCooldown=15;
playLaser();
}

// Bullets
for(let i=bullets.length-1;i>=0;i--){
bullets[i].y+=bullets[i].vy;
if(bullets[i].y<-20)bullets.splice(i,1);
}

// Alien bullets
for(let i=alienBullets.length-1;i>=0;i--){
alienBullets[i].y+=alienBullets[i].vy;
if(alienBullets[i].y>H+20)alienBullets.splice(i,1);
// Hit player
if(collide(alienBullets[i],player)){
lives--;
spawnParticles(player.x+player.w/2,player.y+player.h/2,'#ff4444',20);
playPlayerDeath();
alienBullets.splice(i,1);
if(lives<=0){gameOver();return;}
}
}

// Alien movement
const aliveAliens=aliens.filter(a=>a.alive);
if(aliveAliens.length===0){
wave++;
initWave();
return;
}

let minDist=W;
for(let a of aliveAliens){
if(alienDir>0)minDist=Math.min(minDist,W-a.x-a.w);
else minDist=Math.min(minDist,a.x);
}

const step=alienSpeed*(1+wave*0.05);
if(alienDir>0&&minDist<=0||alienDir<0&&minDist>=0){
// Descend
for(let a of aliveAliens)a.y+=20;
alienDir*=-1;
}

for(let a of aliveAliens){
a.x+=step*alienDir;
}

// Check if aliens reached player level
for(let a of aliveAliens){
if(a.y+a.h>=player.y-10){
gameOver();return;
}
}

// Bullet vs Alien collision
for(let i=bullets.length-1;i>=0;i--){
for(let j=0;j<aliens.length;j++){
const a=aliens[j];
if(!a.alive)continue;
if(bullets[i].x+bullets[i].w>=a.x&&bullets[i].x<=a.x+a.w&&
   bullets[i].y+bullets[i].h>=a.y&&bullets[i].y<=a.y+a.h){
a.alive=false;
score+=a.points;
spawnParticles(a.x+a.w/2,a.y+a.h/2,getAlienColor(a.type),15);
playExplosion();
bullets.splice(i,1);
break;
}
}
}

// Alien shooting (probability increases with wave)
if(frameCount%Math.max(30,60-wave*3)===0&&aliveAliens.length>0){
const shooter=aliveAliens[Math.floor(Math.random()*aliveAliens.length)];
alienBullets.push({x:shooter.x+shooter.w/2-1,y:shooter.y+shooter.h,w:4,h:8,vy:3+wave*0.2});
}

// Particles
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.vy+=0.1;
p.life--;
if(p.life<=0)particles.splice(i,1);
}

// Score check
if(score>highScore){
highScore=score;
try{localStorage.setItem('esi_high',String(highScore))}catch(e){}
}
}

function gameOver(){
state='gameover';
try{localStorage.setItem('esi_high',String(highScore))}catch(e){}
}

function collide(a,b){
return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function getAlienColor(type){
const colors=['#44ff44','#ff4488','#44ccff','#ffff44'];
return colors[type%4];
}

// Drawing
function drawPixelShip(x,y,w,h){
ctx.fillStyle='#44ff88';
// Body
ctx.fillRect(x+w*0.3,y+h*0.5,w*0.4,h*0.5);
// Top
ctx.fillRect(x+w*0.2,y+h*0.3,w*0.6,h*0.2);
// Cannon
ctx.fillRect(x+w*0.45,y,w*0.1,h*0.3);
// Wings
ctx.fillRect(x,y+h*0.7,w*0.15,h*0.3);
ctx.fillRect(x+w*0.85,y+h*0.7,w*0.15,h*0.3);
}

function drawAlien(a){
const c=getAlienColor(a.type);
ctx.fillStyle=c;
const x=a.x,y=a.y,w=a.w,h=a.h;
if(a.type===0){
// Classic invader shape
ctx.fillRect(x+w*0.2,y+h*0.1,w*0.6,h*0.3);
ctx.fillRect(x+w*0.1,y+h*0.4,w*0.8,h*0.4);
ctx.fillRect(x+w*0.3,y+h*0.7,w*0.15,h*0.3);
ctx.fillRect(x+w*0.55,y+h*0.7,w*0.15,h*0.3);
// Eyes
ctx.fillStyle='#000';
ctx.fillRect(x+w*0.25,y+h*0.2,w*0.12,h*0.15);
ctx.fillRect(x+w*0.6,y+h*0.2,w*0.12,h*0.15);
}else if(a.type===1){
// Squat alien
ctx.fillRect(x+w*0.1,y+h*0.3,w*0.8,h*0.4);
ctx.fillRect(x+w*0.3,y+h*0.1,w*0.4,h*0.2);
ctx.fillRect(x+w*0.05,y+h*0.6,w*0.15,h*0.3);
ctx.fillRect(x+w*0.8,y+h*0.6,w*0.15,h*0.3);
ctx.fillStyle='#000';
ctx.fillRect(x+w*0.25,y+h*0.4,w*0.12,h*0.12);
ctx.fillRect(x+w*0.6,y+h*0.4,w*0.12,h*0.12);
}else if(a.type===2){
// Tall alien
ctx.fillRect(x+w*0.3,y,w*0.4,h*0.7);
ctx.fillRect(x+w*0.1,y+h*0.5,w*0.8,h*0.2);
ctx.fillRect(x+w*0.2,y+h*0.7,w*0.15,h*0.3);
ctx.fillRect(x+w*0.65,y+h*0.7,w*0.15,h*0.3);
ctx.fillStyle='#000';
ctx.fillRect(x+w*0.4,y+h*0.1,w*0.2,h*0.15);
}else{
// Wide alien
ctx.fillRect(x+w*0.05,y+h*0.2,w*0.9,h*0.5);
ctx.fillRect(x+w*0.3,y,w*0.4,h*0.2);
ctx.fillRect(x+w*0.1,y+h*0.7,w*0.2,h*0.3);
ctx.fillRect(x+w*0.7,y+h*0.7,w*0.2,h*0.3);
ctx.fillStyle='#000';
ctx.fillRect(x+w*0.2,y+h*0.35,w*0.15,h*0.15);
ctx.fillRect(x+w*0.6,y+h*0.35,w*0.15,h*0.15);
}
}

function draw(){
ctx.fillStyle='#000';
ctx.fillRect(0,0,W,H);

// Stars
ctx.fillStyle='#fff';
for(let s of stars){
ctx.globalAlpha=0.4+s.s*0.3;
ctx.fillRect(s.x,s.y,s.s,s.s);
}
ctx.globalAlpha=1;

if(state==='start'){
drawStartScreen();
return;
}

// Particles
for(let p of particles){
ctx.globalAlpha=p.life/50;
ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,p.size,p.size);
}
ctx.globalAlpha=1;

// Player
if(state==='playing'){
drawPixelShip(player.x,player.y,player.w,player.h);
}

// Aliens
for(let a of aliens){
if(a.alive)drawAlien(a);
}

// Bullets
ctx.fillStyle='#ff0';
for(let b of bullets)ctx.fillRect(b.x,b.y,b.w,b.h);

// Alien bullets
ctx.fillStyle='#f44';
for(let b of alienBullets)ctx.fillRect(b.x,b.y,b.w,b.h);

// HUD
ctx.fillStyle='#fff';
ctx.font='bold 16px monospace';
ctx.textAlign='left';
ctx.fillText('SCORE: '+score,20,30);
ctx.fillText('WAVE: '+wave,W/2-40,30);
ctx.fillText('LIVES: '+lives,W-100,30);
ctx.font='12px monospace';
ctx.fillStyle='#888';
ctx.textAlign='right';
ctx.fillText('HI: '+highScore,W-20,50);

if(state==='gameover'){
drawGameOver();
}
}

function drawStartScreen(){
ctx.fillStyle='#fff';
ctx.font='bold 48px monospace';
ctx.textAlign='center';
ctx.fillText('ENDLESS',W/2,H/3);
ctx.fillText('SPACE INVADERS',W/2,H/3+50);

ctx.font='16px monospace';
ctx.fillStyle='#aaa';
ctx.fillText('ARROW KEYS / A D - MOVE',W/2,H/3+120);
ctx.fillText('SPACE / Z - SHOOT',W/2,H/3+145);
ctx.fillText('PRESS SPACE TO START',W/2,H/3+200);

ctx.font='14px monospace';
ctx.fillStyle='#666';
ctx.fillText('HI-SCORE: '+highScore,W/2,H/3+250);

// Animated aliens on start screen
const t=frameCount*0.02;
for(let i=0;i<5;i++){
let ax=W/2+(i-2)*80;
let ay=H/2+60+Math.sin(t+i)*15;
ctx.save();
ctx.translate(ax,ay);
const fakeAlien={x:-15,y:-12,w:30,h:24,type:i%4,alive:true};
drawAlien(fakeAlien);
ctx.restore();
}
}

function drawGameOver(){
ctx.fillStyle='rgba(0,0,0,0.7)';
ctx.fillRect(0,0,W,H);
ctx.fillStyle='#f44';
ctx.font='bold 42px monospace';
ctx.textAlign='center';
ctx.fillText('GAME OVER',W/2,H/2-30);
ctx.fillStyle='#fff';
ctx.font='20px monospace';
ctx.fillText('FINAL SCORE: '+score,W/2,H/2+20);
ctx.fillText('WAVE REACHED: '+wave,W/2,H/2+50);
ctx.fillStyle='#aaa';
ctx.font='16px monospace';
ctx.fillText('PRESS R OR SPACE TO RESTART',W/2,H/2+100);
}

let lastTime=0;
function loop(time){
const dt=time-lastTime;
lastTime=time;
update();
draw();
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
