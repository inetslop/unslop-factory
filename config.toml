# unslop-factory: every pair of words becomes one HTML game, made in random order.

[server]
# Unsloth Studio's OpenAI-compatible API. Load the model in Studio first.
base_url = "http://127.0.0.1:8888/v1"
# Read from this environment variable, or from a .env file next to factory.py.
api_key_env = "UNSLOTH_API_KEY"
# Model id as Studio lists it at /v1/models. Empty = the one that's loaded.
model = ""

[generation]
# Requests sent at once. Studio's llama-server has 4 slots by default; more
# parallel requests give more games per hour, each one a bit slower.
parallel = 4
# Includes thinking tokens. Each of Studio's 4 slots has about 65k of context.
max_tokens = 40000
temperature = 0.7
# Qwen thinking mode: better-planned games, but several times slower.
thinking = true
# Used when thinking is on: "low", "medium" or "xhigh" (the model's default).
reasoning_effort = "medium"
# Extra attempts when a game comes back truncated or without HTML.
retries = 1
# Seconds to wait for the whole response of one game.
timeout_s = 3600

[git]
# After every game: commit games/<machine-id>/<game>/, pull --rebase and push.
push = true

[permutations]
# The whole creative brief. {words} is the pair, e.g. "Create 3d pong game."
prompt = "Create {words} game."
words_per_game = 2
# false: each pair once (12 words = 66 games); the word order in the prompt is
# picked at random. true: both orders are separate games (132 games).
ordered = false

words = [
  "3d",
  "pong",
  "top-down",
  "shooter",
  "platformer",
  "puzzle",
  "racing",
  "snake",
  "endless",
  "stealth",
  "tetris",
]
